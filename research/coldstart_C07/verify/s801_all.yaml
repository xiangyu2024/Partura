    reason: '度量异常成交量:把当天的 day_quantile_q75(Volume) 和过去 241 天比,连续三次 pow_3 再取窗口占比,把信号锐化成「今天是否压过过去一年里的放量日」;方向 +1、半衰期 20,对应近期放量突破 / 高成交量溢价,机制说得通。外层三次 cross_scale(·,241) 只是对已经归一化的比值再归一化,属于冗余嵌套;但合成数据检验里它几乎不改截面排名(与内层三级版本 ρ 0.96–0.98),不算数字游戏。不重复:最高 |ρ| 是反转 0.31,与 #2 0.21,与流动性 0.20;valid +0.97 不低于 train +0.74。注意:Volume 是未复权的股数,送转后股数会台阶式上升,可能被当成放量。'
  - id: 2
    keep: true
    reason: '度量过去约一年里放量尖峰有多极端:day_quantile_q75(Volume) 先立方,再取它在 241 天窗口里的占比,占比再立方(相当于软最大值),最后用半衰期 241 的 cross_ema 平滑;方向 -1 偏好没有关注度冲击的平静股票,对应关注度 / 彩票规避,机制说得通。不是控制换皮,也不重复:最高 |ρ| 是市值 0.31,波动 0.21,与 #1 0.21,与流动性 0.04,与已知族 0.01。留下但有隐患:cross_scale 的窗口在开头用 NaN 填充、相当于扩张窗口,所以每只股票第一个有效日的占比恰好是 1,约为稳态值的 1e7 倍,半衰期 241 的 EMA 会把它记住好几年。结果是次新股排在顶端(方向 -1 下落到空头一侧);train 前一两年里,老股票之间的排名也部分取决于 60 天预热期的成交量走势。合成数据检验里,与无预热偏差版本的 ρ 在 train 第 120 天只有 0.31,到第 967 天升到 0.98。这个偏差会随时间衰减,不是拟合出来的。'
