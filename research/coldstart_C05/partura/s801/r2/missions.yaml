    why: '这个 head(+1.49)的 y 槽 pow_05(day_signed_ratio(Close, Close)) 是常数(单独 distinct 0.0003、门槛废品;换字段、去 pow_05 都逐位相同),在 cs_last_high20 里只剩序号排名 = 静态列序斜坡;股票层面唯一的活输入是筛选变量 A。10 个变体分三组。(a) A 是什么,单独求值、与 A 本身的 +0.76 比:1 把 day_sum(Vwap) 换成精确 log 名义股价;2 换成 log(day_mean(Vwap))(log 复权价,与 1 只差「复权 vs 名义」);3 换成 day_mean(Vwap)(与 A 只差「当日有成交的分钟数」这条薄 / 封板通道);4 里层分组变量 BoardCode 换成 LogFloatCap(真十分位,判别「板块 × 代码段邻域」是不是关键)。(b) 列序斜坡值多少:5 纯斜坡本身(常数的序号秩);6 y 换成控制字段 LogFloatCap;7 y 换成 A 本身(多头 = A 的 80-90 分位);8 y 换成真实变量 MAX(20 日最大日收益,低 MAX 优先)—— 6/7/8 若比原 head 高 0.1 以上且仍是同一个东西,就用有经济含义的排序替掉这条斜坡。(c) 筛选的形状:9 band 20% 改 10%(真尾部效应应持平或更强);10 外层 cross_min 换成 cross_mean(「从没便宜过」是否只是平滑)。不接受定位工具报的 head +1.69 的 cross_min@60->120 替换(增益 +0.31 在噪声底以下、同样的改动在本 head 上是 -0.15、rho_known -0.4959 贴着 0.5 的红线),所以不列入。'
