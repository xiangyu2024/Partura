R:
  - head: 'signedpower(ts_std(signedpower(signedpower(day_durbin_watson(Close))), 50))'
    why: '本种子最强的新家族,要分清它是什么。奖励先对 EMA 后的信号取 z-秩再投影(steer.py:430),凸变换只在 EMA 那一步起作用(EMA(dw^4) 约等于近一两个月日内方差的峰值),所以问题变成:它是「峰值 / vol-of-vol 相对平均波动的剩余」这条真轴,还是凸 + EMA 从波动控制本身造出来的分。七个变体:1 波动控制自己的四次方 —— 若它也 >= +0.5,凸 + EMA 能从控制本身造分(漏灌读法);若 < +0.5,dw 族的分不来自控制本身。2 day_var(Ret) 的四次方(约等于 dw^4,因为 dw 约等于分钟收益均方;解剖员原稿 day_std 的四次方只等于 dw^2)—— 量 dw 这个误名的算子相对标准日内方差有没有多带东西。3、4 诚实的峰值 cross_max(dw, 20 / 60),一个凸算子都没有;若 >= head + 0.1 且 rho_head >= 0.5,就用它替掉幂堆写法。5 今天 / 60 日常态的尖峰比、6 近 20 日峰值 / 60 日均值:尺度无关,只剩「峰值相对自己的水平」那部分(与 E 位 (a) 一支在标准口径下互证)。7 day_durbin_watson(Ret):分子分母都在分钟收益上,约等于 2(1 - 一阶自相关),这才是真的 DW,把路径粗糙度与波动水平分开。'
    variants:
      - 'signedpower(signedpower(cross_mean(day_std(Ret), 20)))'
      - 'signedpower(signedpower(day_var(Ret)))'
      - 'cross_max(day_durbin_watson(Close), 20)'
      - 'cross_max(day_durbin_watson(Close), 60)'
      - 'div(day_durbin_watson(Close), cross_mean(day_durbin_watson(Close), 60))'
      - 'div(cross_max(day_durbin_watson(Close), 20), cross_mean(day_durbin_watson(Close), 60))'
