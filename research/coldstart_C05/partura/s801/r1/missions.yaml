R:
  - head: 'inv(pow_3(pow_3(pow_3(LogFloatShares))))'
    why: '四层 pow_3 / inv 在截面上是恒等变换(拆解的 5 个秩等价写法 rho_known 四位小数全等),只在半衰期 EMA 里留下一个 0.03 宽的凸性噪声带;x^27 在 1e32-1e38 量级,离 float32 上限只差一次乘法,加性组合里会把任何外围压掉(共性表 8 行均值全落在 0.480-0.484)。这 13 个变体去掉包装或把叶子 / 包装换掉,目的是分开三种解释并补上定位工具没做的敏感性:(a) 低名义股价 —— 变体 2、3、4、11;(b) 没扣干净的非线性规模暴露(Barra 的 Non-linear Size 就是把规模的三次方再对线性规模正交化)—— 变体 4(市值十分位内的股本秩,分档中性化把非线性规模扣掉)、5(LogTotalCap 换同类字段);(c) 半衰期平滑 × 中性化的管道假象 —— 变体 6、7(叶子换成控制本身);外加浮股扩张的 soft-min / soft-max(8、9)、自由流通比例这条新轴的预检(10)、跨板块构成(12)、Birru-Wang 的高波动条件化(13)。替换门(+0.10)只预期在 2 或 4 上有小概率触发。'
    variants:
      - 'LogFloatShares'
      - 'sub(LogFloatCap, LogFloatShares)'
      - 'log(day_last(Close))'
      - 'cs_bucket_rank(LogFloatShares, LogFloatCap)'
      - 'LogTotalCap'
      - 'inv(pow_3(pow_3(pow_3(LogFloatCap))))'
      - 'LogFloatCap'
