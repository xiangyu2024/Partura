    hypothesis: 'alpha 来源:M 第 1 批唯一的 head inv(pow_3(pow_3(pow_3(LogFloatShares)))) 的四层包装在截面上是恒等变换(拆解里 5 个秩等价写法 rho_known 全等 -0.2945,score 0.47-0.50),真正起作用的是字段 LogFloatShares 本身;控制 LogFloatCap 之后它的残差约等于 -log(名义股价),多头 = 同等流通市值下股本最多、股价最低的一档。所以核心取裸字段。族中性化会把这条水平线的书扣掉,只奖励浮股信息里水平之外的部分。快照里含核心的外围全是逐元素幂 / 倒数族(pow_3、pow_05、pow_2_5、inv);这次的外围换成三类以前没见过的处理:(1) 以流通股本作分母的换手率,log 成交量减核心,取 5 / 20 日均值、20 日最大值、20 日波动、成交额口径,依据 Mei-Scheinkman-Xiong:小流通盘的高换手是投机而非流动性;(2) 流通股扩张事件做成连续量:核心减去它 120 日滚动最小值(按扩张占原流通盘的比例,依据刘娥平-唐舜),加一个小的换手率秩项保证过 distinct 门,以及用扩张前的旧流通股(滚动最小值)作分母的换手率;(3) 市值十分位内的股本秩(约等于分档内的低股价,同时扣掉非线性规模)与波动、MAX、换手做截面秩乘积,依据 Birru-Wang:名义价格溢价在难套利、高波动股票里更强。种子全部是减法取对数 / 秩乘积 / 分档秩,不做加性叠加,避免水平项把外围压掉后被秩禁令毙掉。'
