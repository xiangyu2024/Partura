  - type: N
    hypothesis: '慢的日内量价 / 订单流特征。M 第 1 批 90 个已评分候选里,不含股本子树的平均 score 是 -0.96,含它的是 +0.48:扣 15bp 的十分位纯多头书上,快信号基本都被成本吃掉,唯一活下来的是几乎不动的截面特征。所以新想法是:把反映知情交易 / 散户注意力的日内量价结构(分钟价-量相关、收益-量相关、成交量加权的涨跌方向、隔夜相对日内收益、成交时间重心、上涨分钟占比、分钟收益自相关与峰度、成交量集中度)在 20-60 日上取均值,让它们像股本一样慢,同时都是无量纲的,不直接暴露在流动性水平、波动水平或 20 日收益这几个控制上。GP 的另一半初代随机树可以在这些结构附近变异。'
    inspired_by: 'M 第 1 批:唯一的 head 是最慢的日频字段(LogFloatShares),不含它的候选平均 score -0.96(成本主导);以及文献中关于成交量-收益动态、订单不平衡、隔夜 / 日内收益拉锯、信息连续性的结论'
