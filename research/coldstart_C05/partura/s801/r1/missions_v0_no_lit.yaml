R:
  - head: 'inv(pow_3(pow_3(pow_3(LogFloatShares))))'
    why: '拆解显示三层 pow_3 与 inv 都是无用部件(去掉任一层或只留 pow_3(LogFloatShares),score 只差 0.02-0.03),alpha 全在 LogFloatShares 的排序上;而在控制 LogFloatCap 之后它等价于 -log(名义股价)。变体分三类:(a) 换成更直接的名义价格 / 股本度量(-log 名义价 = LogFloatShares - LogFloatCap、20 日名义成交均价、总股本、60 日平滑),看哪个才是真正的来源;(b) 用分桶排序替代线性控制市值或流动性;(c) 在低价多头书里屏蔽可能有害的子群(彩票型 MAX / 高偏度、最不流动、限售解禁压力大、上市最新、近一年股本扩张、高波动、隔夜跳空高、远离 52 周高点),它们是低价股里最可能拖累纯多头书的部分。'
