slots:
  - type: E
    core: 'pow_3(LogFloatShares)'
    hypothesis: '本种子唯一的 head inv(pow_3(pow_3(pow_3(LogFloatShares)))) 及其所有子树得分几乎相同(0.47-0.50),说明 alpha 只来自 LogFloatShares 的截面排序,幂次与 inv 都是无用包装。奖励里已控制 LogFloatCap,而 LogFloatShares - LogFloatCap 恰好等于 -log(名义股价);分钟价格是后复权的,所以股本叶子是 GP 看见名义股价的唯一途径。结论:这是一个名义低价效应(给定市值、流动性、波动、反转后,做多股本多 / 股价低的票)。快照里含核心的 28 个候选外围全是幂次 / inv / sqrt 这类单调包装。本任务把核心固定、把家族中性化掉,试三类以前没出现过的外围:(1) 股本的动态(一年内股本相对低点的增长、60 日增量,对应送转、解禁、增发),用分档排序屏蔽(cs_last_high40)保证连续;(2) 股本结构(流通 / 总股本比、上市年龄,对应限售股解禁压力),同样用分档屏蔽;(3) 以股本十分位为条件的名义价格相关行为特征(MAX、日内偏度、52 周高点锚定、价格离散度 / 最小价位约束),用 cs_bucket_rank 与秩乘积,问的是“在同一价格层内,什么把赢家和输家分开”。这些都是截面分档 / 时间序列差分 / 条件排序,与以前见过的单调幂次包装完全不同。'
