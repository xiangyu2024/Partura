R:
  - head: 'ts_skew(day_durbin_watson(Open), 50)'
    why: >-
      核心 A 的两条未排除混淆和 ts_skew 这个部件的替换件。
      [零收益质量] 1 Vwap 在无成交分钟缺失,DW 的分子只用两端都有效的对 = 只在成交过的分钟上算已实现方差(r1 同一刀让 day_kurt 从 0.97 掉到 0.02);
      [算术核对] 2 day_var(Ret) 应与头几乎同分、rho_head >= 0.9,否则解剖员的「DW(Open) = 日内方差」要重写;
      [要不要原始右尾] 3 不平方(std)、4 取 log 再算偏度:沿幂次阶梯 1 -> 0.5 -> 0 看 alpha 掉多少,掉得越多越说明它要的是孤立爆波动日的极端值;
      [替换 ts_skew 部件] 5 上尾条件均值 / 中位数、6 四分位(Bowley)偏度(Kim-White 2004:不被单点支配)、7 上下行半偏差比(Bollerslev-Li-Zhao 2020 的方向思路);
      [名义价格] 8 sub(LogFloatCap, LogFloatShares) 是给定市值的精确 log 价格,只用允许的日频叶子;它对头的 rho_head 就是价格网格混淆的份量。
      不放 ts_kurt(day_durbin_watson(Open), 50):日方差的方差约 1e-12 < EPS = 1e-9,nankurt 恒为 NaN,会是门槛废品。
      不放 Open->Close(+0.21):同一换法在 head 1 上是 -0.23,valid 不动,判为训练段抖动。
    variants:
      - 'ts_skew(day_durbin_watson(Vwap), 50)'
      - 'ts_skew(day_var(Ret), 50)'
      - 'ts_skew(day_std(Ret), 50)'
      - 'ts_skew(log(day_durbin_watson(Open)), 50)'
      - 'div(cross_tail_mean_q75(day_durbin_watson(Open), 50), cross_med(day_durbin_watson(Open), 50))'
      - 'div(sub(sub(cross_quantile_q75(day_durbin_watson(Open), 50), cross_quantile_q50(day_durbin_watson(Open), 50)), sub(cross_quantile_q50(day_durbin_watson(Open), 50), cross_quantile_q25(day_durbin_watson(Open), 50))), sub(cross_quantile_q75(day_durbin_watson(Open), 50), cross_quantile_q25(day_durbin_watson(Open), 50)))'
      - 'div(cross_semistd_pos(day_durbin_watson(Open), 50), cross_semistd_neg(day_durbin_watson(Open), 50))'
      - 'sub(LogFloatCap, LogFloatShares)'
  - head: 'cross_autocorr_s1(ts_skew(ts_skew(day_durbin_watson(Open), 50), 50), 3)'
    why: >-
      里面那层重复的 ts_skew 必要性 +0.0065(knockout 1.5565 对 1.5630),而且把输入 coverage 从 0.998 压到 0.871,
      cross_autocorr_s1 再用 count.clamp(min=1) 把这约 12.8% 的格子(历史不足 100 天的次新 / 复牌股)填成常数 0 或 ±1 —— 库里最高分的 head 有 1/8 的值是造出来的。
      去掉它,并用窗口扫描里最好的 6(双层版 3 -> 6 值 +0.05)。估计到不了 +0.1 的替换线,但若到了,库里就换成没有假值块的版本。
    variants:
      - 'cross_autocorr_s1(ts_skew(day_durbin_watson(Open), 50), 6)'
  - head: 'cross_corr(day_kurt(Ret), day_gini(Ret), 241)'
    why: >-
      库里结构最弱的 head(0.73,train 卡住,valid 2.30):窗口是刀锋(241 -> 120 变 -0.23,-> 482 变 -1.14 且翻号);
      day_kurt(Ret) 原始值极重尾(只有一分钟有成交的日子约 +236),在 241 日的 Pearson 相关里几个尖峰日就决定了结果;
      搭档 day_gini(Ret) 本身 rho_known -0.63,是已知族的另一种写法。
      9 先压尾 log(kurt + 5) 再求相关;10 搭档换成零收益比例(这个 head 读的是不是「尖峰是不是躺平造出来的」);11 两边先截面秩再求时序相关(去掉全市场共动与尾部)。
      它只有 0.73,+0.1 的线在全库最好过。
    variants:
      - 'cross_corr(log(add(day_kurt(Ret), 5)), day_gini(Ret), 241)'
      - 'cross_corr(day_kurt(Ret), day_zero_ratio(Ret), 241)'
      - 'cross_corr(cs_rank(day_kurt(Ret)), cs_rank(day_gini(Ret)), 241)'
  - head: 'sub(day_centroid(Amt), day_centroid(Ret))'
    why: >-
      核心 B(成交时点减波动时点)两半单独都是废的、差值 0.90;没测过的风险是收盘集合竞价那几根 bar 主宰了 day_centroid(Amt),那它就只是尾盘量占比。
      in_delay(x, d) 把当日最后 d 根分钟推出窗口、开头补 NaN,重心整体平移一个常数,截面次序等于只用前 241 - d 根算的重心,两半同样平移,差值不受影响。
      12 去掉最后 3 根(14:57-15:00 的收盘集合竞价);13 去掉最后 30 根(文献 [S30][S31]:改革后成交从收盘那一刻迁到收盘前几分钟);
      14 波动时点改用平方收益(检验是否被一根大打印主宰)。12 若几乎不掉,第 3 轮可以放心给核心 B 一个 E 位。
    variants:
      - 'sub(day_centroid(in_delay(Amt, 3)), day_centroid(in_delay(Ret, 3)))'
      - 'sub(day_centroid(in_delay(Amt, 30)), day_centroid(in_delay(Ret, 30)))'
      - 'sub(day_centroid(Amt), day_centroid(mul(Ret, Ret)))'
  - head: 'sub(day_centroid(Amt), LogFloatShares)'
    why: >-
      day_centroid(Amt) 在 [0, 1] 里、截面离散约 0.05-0.1,LogFloatShares 的截面离散约 1,所以这个 head 的秩几乎全由 LogFloatShares 决定;
      控制里有 LogFloatCap,LogFloatShares = LogFloatCap - log 价格,残差后它约等于 -log 名义价格。换成精确的 log 名义价格(去掉成交时点那一半):
      rho_head 若 >= 0.7 说明它就是价格因子;score 若 >= 0.63 就按规则换成更干净的写法。与上面第 8 个是同一个表达式,只算一次,rho_head 分别对两个 head 报。
    variants:
      - 'sub(LogFloatCap, LogFloatShares)'
