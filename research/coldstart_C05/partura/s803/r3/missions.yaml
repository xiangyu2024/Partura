      4 核心腿换成只在成交过的分钟上算的 Vwap 版(r2 的 R:1.41,valid 2.98 全族最高)配窗口 100。同一个头的几个变体,规则取最好的那个替换。
      5 伪证:核心腿换成市值(两个控制自己的交互,完全不含日内信息);若 >= 0.5,这个头大半是「控制集合的非线性」,判读要打折;若 ~0.35,核心的形状确实贡献了 +1.0。
      6 条件腿换成 log 换手率(成交额里没被 LogFloatCap 控制掉的那一半):Amt->Volume 让它从 1.41 塌到 -0.08,条件变量到底是规模还是交易活跃度,标准口径下读一次。
