    why: >-
      末轮的 R 结果没有下一轮去用,只能靠「替换」改主指标,所以按替换期望值排。
      1 窗口 100:拆解里已测 1.6493(train / valid 都更好),rho_head 0.792、rho_known -0.049,三条全满足 —— 但 r_candidates 不自动生效,必须在这里再付 1 次才会替换。
