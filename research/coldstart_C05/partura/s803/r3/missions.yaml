  - type: N
    hypothesis: >-
      隔夜 / 日内这条切分,外加「条件 / 交互」这个本种子唯一被证实的机制。r2 的 N 位 15 个「把日频量换成自己 50 日分布的形状」种子只中了 1 个,
      而且中的理由不是「形状」而是「隔夜」:ts_skew(今开 / 昨收, 50) = 1.16(sign +1,做多隔夜偏度高的一端),去掉 ts_delay(变成当日开收比)掉到 -1.02,
      收盘到收盘与日内两种日收益的偏度都 <= 0.12。五个控制(成交额水平、日内波动、20 日反转、已知族、市值)里没有任何隔夜的东西 —— 20 日反转是收盘到收盘的水平。
      方向 +1 与彩票文献相反,更像「隔夜跳空是信息,之后延续」而不是「彩票被高估」。本位问四件没碰过的事:
      (a) 隔夜与日内的拉锯:两者的 50 日相关、昨日日内与今日隔夜的相关、20 日隔夜均值、隔夜减日内的 20 日均值、隔夜偏度减日内偏度(种子 1、2、3、6、7);
      (b) 隔夜在全部波动里的份量,与跳空是否放量(隔夜收益 50 日标准差 / 收盘到收盘标准差;|隔夜| 与 log 成交额的 50 日相关)(种子 4、15);
      (c) 上跳空与下跳空分开:隔夜对数收益的上尾条件均值减中位数、中位数减下尾条件均值(种子 13、14),以及开盘集合竞价之后第一分钟的 20 日漂移(种子 5);
      (d) 把 r2 的 E 里唯一奏效的「居中秩乘积」搬到本种子另外两条没被控制的轴上:隔夜偏度 x 成交额、20 日隔夜均值 x 成交额、成交时点差 x 成交额(种子 8-10),
      以及尾盘那一条(r2 的 R:最后 30 分钟带走核心 B 74% 的 alpha;r^2 版掉 1.00,所以只用 |r|):最后 30 分钟以外的成交额占比减同时段 |r| 占比、
      成交额加权波动 / 钟表波动(种子 11、12)。
      不再做「某个日频量的 50 日偏度」(r2 已测死),不碰日方差本身(核心 A 的地盘,而且会撞 0.7 的库禁令)。
