  - type: N
    hypothesis: >-
      峰度是矩统计量:它把一天 241 根分钟收益当成一个无序的样本,扔掉了两样东西 —— 分钟的先后顺序,以及每分钟成交了多少钱。
      这一批唯一的 head 正是这样一个只看形状的统计量,而且它拿到 0.97;五个控制(成交额水平、日内波动、20 日反转、成交额日内离散、市值)也都不含顺序和成交时点。
      新想法:分钟序列的顺序信息与「成交钟」信息本身就是截面 alpha。三条线:
      (a) 顺序 / 定价效率:分钟收益的一阶自回归系数、Durbin-Watson、R/S Hurst(负自相关 = 买卖价差反弹,正自相关 = 价格延迟);
      (b) 成交钟 vs 钟表钟:成交额加权波动 / 钟表波动、成交最重的 10% 分钟的平均收益、成交额在一天里的重心与是否后置、成交时点减波动时点;
      (c) 量价的同期与领先滞后:分钟收益与成交额的同期相关、收盘价与成交量的相关、上一分钟收益对这一分钟成交额、带方向的成交额占比。
      都是尺度无关的日内统计量,和库里的 day_kurt 骨架不同。
    inspired_by: '第 1 批唯一的 head day_kurt(Ret) 只读分钟收益分布的形状;它丢掉的顺序和成交额权重就是这个任务要读的东西。文献:Roll (1984) 用一阶自协方差读价差,Lo-MacKinlay (1988) 用方差比读定价效率,Clark (1973) 用成交量当时钟,Admati-Pfleiderer (1988) 与 Jain-Joh (1988) 的日内成交时点与量价依赖。'
