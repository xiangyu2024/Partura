  - type: E
    core: 'day_kurt(Ret)'
    hypothesis: >-
      核心 day_kurt(Ret)(方向 -1,hl 20,score 0.97,valid 1.54 > train 0.97)量的是分钟收益分布的形状;它对日内仿射变换不变,所以躲过了日内波动控制。
      但奖励是先对原始值做 EMA 再排序,原始峰度极重尾(只有一分钟有成交的日子约 +236),所以 EMA20 实际是「过去一个月有没有出现过尖峰日」的峰值记忆;
      而尖峰日的来源至少有三种:零收益分钟多(成交稀疏,或低名义价格导致一跳就是 0.2%~0.3%,分钟收益落在价格网格上),封板/跳跃日,以及真的尾部形状。
      本任务把核心本身(sign x EMA20)放进控制,只奖励核心之外的信息,所以单调改写、换平滑窗口在构造上拿不到分。存档里核心周围见过哪些外围,定位输出没有打印;共性表为空意味着 43 个精英里至多 3 个把核心包在别的东西里,最可能是单个 cross_* 或算术包一层,所以种子尽量用 >= 2 个算子或不常抽到的算子。这次试的外围分三类:
      (1) 拿掉疑似混淆:在零收益比例或名义价格(day_sum(Amt)/day_sum(Volume),未复权)的十分位内排序、截面秩回归残差;以及个股时序上对自身日内波动 / 成交额回归的残差(今天的尖不是因为今天冷清或今天活跃)—— 剩下的才是真的形状;
      (2) 改时间轴上的聚合:控制里是原始值 EMA 的峰值记忆,这里换成 60 日中位数 / 40 日下四分位尾均值(平常日子的形状)、日秩的慢 EMA,和稳健异常度 cross_madz(今天比自己平常尖多少);
      (3) 和成交的共动与方向:峰度与当日成交额的 20 日时序相关(尖峰出现在放量日 = 信息,出现在冷清日 = 流动性)、峰度乘偏度(尖在哪一侧;sign 不在搜索词表里,直接乘偏度)、收益峰度减成交额峰度的秩差。
      都不用 BoardCode / LimitWidth 分桶(取值大量并列,十分位会按代码顺序切)。
