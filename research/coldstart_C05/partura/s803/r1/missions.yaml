R:
  - head: 'day_kurt(Ret)'
    why: >-
      两个节点的树,拆解 0 次(根不跳、Ret 没有同类字段、没有窗口),所以没有任何部件被证明是烂的;只能换件,每个换件对准一个具体怀疑,同时当判决用。
      [输入 Ret 带零点质量 + 首根 bar] 1 只在有成交的分钟上算(Vwap 缺失处跳过,且不含首根)、2 日内重建收益(首分钟为 NaN)、3 五分钟收益(价格网格上很少为 0:离散度是不是来源);
      [算子 day_kurt 被单个打印支配、在零质量上饱和] 4 有界的 gini、5/6 单侧尾部条件均值比(死日构造上为 NaN)、7 奇数阶矩;
      [原始值极重尾、EMA 变成峰值记忆] 8 先截面秩再交给奖励的 EMA、9 对 kurt+5 取对数(kurt >= -2,安全)、10 20 日中位数;
      [核心可能只是别的原子] 11 零收益比例的 EMA10(H1 成交稀疏;EMA 外壳只是为过 distinct >= 0.5 门槛,k/241 型比例的 20 日均值取值太少)、12 未复权名义价格的对数(H4 价格网格:价格字段是后复权的,Amt/Volume 才是成交价)、
      13 停在当日最高价的时间占比的 EMA10(H3 封板)、14 尺度无关的 MAX(H3 彩票)、15 换成成交额的峰度(收益形状还是成交形状)、16 最长静止段的 EMA10(连续封板 vs 零散不动)。
      判读看 score 和 rho_head:换件过 +0.1 且 rho_head >= 0.5 就替换;原子类(11-14)rho_head >= 0.5 就说明 head 主要是那个原子。
