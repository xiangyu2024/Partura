- type: E
  core: 'day_signed_ratio(Ret, Amt)'
  hypothesis: >-
    核心 K = day_signed_ratio(Ret, Amt) = sum(|Amt| * sign(Ret)) / sum(|Amt|),即分钟级 tick rule 的净买压(源码 partura/ops_ext.py:122;x = Ret 时不退化,有界 [-1, 1]、尺度无关),
    是第 2 轮 N 位 head abs_(ts_mean(K, 20))(score +0.713,train +0.713 / valid +0.822,sign -1,hl 20)的原样子树,单独可求值(-2.50)。
    为什么它是 alpha 来源:跳掉 ts_mean 的必要性 +2.23(全库最高);Amt -> Volume 几乎不变(+0.717);窗口 10 / 20 / 40 = -0.32 / +0.71 / +1.07 单调上升,是一个慢变的股票特质而不是事件;
    整族 rho_known 只有 -0.06 ~ -0.17(全库离已知流动性族最远);valid / train = 1.15(不像价格族、G 族那样 valid 是 train 的 2-3 倍)。读法:多头 = 多日净买压的幅度小 = 双向成交均衡;
    方向本身(不取绝对值 train -0.34)被 20 日反转控制吃掉。核心是 2 个节点的叶子型(第 2 轮 5 节点核心 C 让生成器拒绝了 3092 次、0 过线;第 1 轮 2 节点核心只拒绝 701 次),生成器的自由度够。
    奖励的控制里加入家族(就这 1 个 head),所以只有「多日净买压幅度」之外的信息拿分。快照里见过的外围:{abs_, ts_mean}(含双 abs_、双 ts_mean)、{cs_bucket_rank, ts_mean}、
    {cs_regres, ts_mean, day_sum}、{ts_regbeta, ts_delay, day_sum}、{ts_corr, ts_delay}、{sub, ts_mean, day_signed_ratio}、{cross_zscore, abs_};种子全部避开,并且不再把 abs_ 当第一层(那是家族占住的一步)。
    这次的外围分四类,都是以前没有出现过的读法:
    (1) 拆开幅度 —— 买、卖两条腿分开(家族把两头对称折叠,不对称是第一个没试过的自由度);减掉同规模十分位平均净买压之后的特质部分(40 日均值里有一块是全市场同向的共同签名,
    Chordia-Roll-Subrahmanyam 2002:不平衡在市场层面高度持续);|多日均值| / 多日的 |单日值| 均值 = 持续占比(把「冷门股单日签名本来就大」这一块除掉)。
    (2) 签名的构成 —— 成交最重 10% 分钟的方向减全天方向(Barclay-Warner 1993:哪些成交推动价格);按分钟位置加权减等权(尾盘压力);早盘时段减全天(Bogousslavsky 2021:按时段切开);
    按 |Ret| 软加权减硬符号(Easley-López de Prado-O'Hara 2016 的 BVC 用价格变化幅度做软分配,不是只看符号)。
    (3) 签名流与价格的关系 —— 昨天的净买压与今天收益的 60 日相关(Llorente-Michaely-Saar-Wang 2002:延续 = 知情交易,反转 = 风险分摊);今天的净买压追不追昨天的相对涨跌(正反馈);
    同日签名流与收益的对齐;Kyle 1985 的 lambda(收益对签名流的 40 日斜率)在已知流动性族的十分位内取秩(把 lambda 带进来的流动性水平剥掉,吸取 G 族「带尺度的斜率 = 流动性的非线性暴露」的教训)。
    (4) 事件与偏离 —— 只在放量日(成交额 60 日 z > 1)上平均的净买压(Campbell-Grossman-Wang 1993:放量日的流动性冲击之后反转);5 日净买压相对自身 60 日的 z 分数;
    20 日净买压的秩减 20 日收益的秩(买压没有反映进价格)。
    所有种子把 K 放在保序位置(时间平均、同量纲加减、相关的一个参数、回归的 x 位但 K 本身无量纲),不放进 sign(·) 或状态参数。预期:(4) 的方向类多半被 20 日反转控制吃掉;
    (1) 的买卖腿与家族秩相关可能接近 0.7、被库禁令拒掉 —— 这两类主要给 GP 当交叉材料。
