- type: E
  core: 'day_centroid(Volume)'
  hypothesis: >-
    核心 Q = day_centroid(Volume)(|Volume| 沿分钟轴的质心 / (T-1),有界 [0, 1]、尺度无关,源码 partura/ops_ext.py:155),是库里最高的 head
    ts_mean(cs_bucket_rank(Q, LogFloatCap), 20)(+1.227,train +1.420 / valid +1.227,sign -1)与 C = sub(Q, day_centroid(Ret))(+0.884)的原样子树,单独可求值(-0.087)。
    为什么它是 alpha 来源:当日的钟是噪声(-0.09),它的 20 日持久分量是本种子最大的单步增量(ts_mean(Q, 20) 单独 +1.244);Volume -> Amt 稳(+1.165);这个轴贡献了库里 4 个 head,
    valid / train 在 0.87 ~ 1.2(库里最不像只吃一段行情的一族)。但同一步平滑把 rho_known 推到 -0.512(越线),规模桶内比较是让它合法的那一步 —— 钟的「位置」约有一半是已知流动性族的另一种写法。
    奖励的控制里加入家族(这 2 个 head:位置的规模桶内读法 + 量波时点错配),所以只有「钟的平均位置」之外的信息拿分。核心与第 1 轮唯一成功的 E 核心同为 2 节点叶子型。
    见过的外围:{ts_mean, cs_bucket_rank}、{cs_bucket_rank, day_centroid}、{sub, day_centroid}、{sub, ts_mean, day_centroid}(第 1 轮相对 20 日均值的偏移)、
    第 2 轮 E 位 104 个候选的 {ts_sum, cs_first_low20, cs_stddev_full, day_quantile, day_kurt, ...} 各种嵌套;种子全部避开。
    这次的外围全部离开「平均位置」:(1) 二阶矩 —— 钟的 40 日离散度(在已知流动性族十分位内取秩,堵住「冷门股的钟本来就乱」这条流动性通道)、钟的变异系数
    (Chordia-Subrahmanyam-Anshuman 2001:成交活跃度的变异程度本身是负向定价的特征;这里把被度量的东西从「量」换成「时点」);
    (2) 相对自身、相对市场 —— 5 日钟相对自身 60 日的 z 分数及其幅度、钟与全市场平均钟的 60 日相关、钟的 1 日自相关
    (Białkowski-Darolles-Le Fol 2008:日内量分布 = 全市场共同的季节性部分 × 个股动态部分,标准做法是两个基准都减;与市场钟同步的票更像被指数 / 被动资金驱动,习惯稳不稳是另一维);
    (3) 钟与其他日度量的共动 —— 与当日收益、与异常放量、与当日净买压、与当日波动的 40 日相关(Admati-Pfleiderer 1988:知情者与相机抉择的流动性交易者都在择时;
    问的是「哪种日子成交偏早」,而不是「平均偏早」);(4) 钟的形状 —— 最重 10% 分钟的平均时点减质心(偏度)、成交额的钟减成交量的钟(价高的分钟是否偏晚 = 日内趋势与成交时点的交互)、
    规模十分位内去均值后的 20 日钟取绝对值(U 形:照搬价格 U 形 head 在价格轴上成立的那一步,Freyberger-Neuhierl-Weber 2020 的非线性函数形状)。
    避开的位置:Q >= 0,不放进 sign / day_signed_ratio 的 x 位(恒为 1)、cs_flip_by_state / cs_state_rank 的状态参数(塌成市场标量)、*_reg* 的 x 位(被尺度整除);
    任何接近 20 日均值的写法都会与 head +1.227 秩相关 >= 0.7 被库禁令拒绝,所以没有纯平滑 / 纯桶内秩。主要风险:未分桶的二阶矩类多半撞 rho_known 闸门。
