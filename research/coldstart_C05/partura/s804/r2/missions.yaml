- type: N
  hypothesis: >-
    分钟级的订单流方向、毒性与价格冲击,是本种子快照里从没被真正碰过的一块。证据:day_signed_ratio 在 378 个候选里出现了 46 次以上,
    但全是 day_signed_ratio(High, Open) / (Close, Low) / (Low, Low) 这类恒等于 1 的退化写法(价格字段的符号恒正,解剖 §1.6-1.7),
    这个算子的本意 —— 按分钟涨跌给成交额签名、得到净买压 day_signed_ratio(Ret, Amt) —— 一次都没出现;
    而 G(自身 +1.44)里必要的一腿 day_topw_mean(Amt, Ret)(波动最大的 10% 分钟里的成交额)本身就是一个冲击 / 订单流量,只是带着金额量纲、经回归的尺度进入。
    idea:把订单流拆开,每一类都给无量纲写法(避开 G 族的尺度嫌疑、也避开线性流动性控制):
    (a) 方向:净买压的 20 日持续(分钟版 tick rule,BVC 思路)、净买压在规模十分位内的排序、「价格没有反映的买压」(净买压对同期日内收益的截面残差;20 日反转在控制里,方向类只看残差);
    (b) 毒性:|净买压| 的 20 日均值(VPIN 的不平衡幅度,Easley-López de Prado-O'Hara)与它相对自身 60 日的偏离;
    (c) 冲击结构:成交与 |收益| 在分钟上的对齐(day_corr)、成交最重的 10% 分钟的 |收益| 相对全天平均(Barclay-Warner:哪些成交推动价格)、
    波动最大的 10% 分钟里的成交额占全天平均的倍数(G 那一腿的无量纲版)、最大成交分钟的涨跌方向;
    (d) 弹性:昨天的净买压对今天日内收益的 40 日回归斜率(Pástor-Stambaugh 的 γ 思路;x 是 [-1, 1] 的签名比例,不带成交量单位)、净买压的 1 日自相关(拆单 / 羊群);
    (e) Amihud 式冲击(|收益| / 成交额)在流动性十分位内的排序 —— 冲击 ≠ 流动性水平(Amihud 2002、Kyle 1985 的 λ)。
    另有按成交额与按成交量加权的净买压之差(上涨分钟是否在更高价位成交 = 追涨)。预期:方向类多半被反转控制吃掉,冲击结构类最可能过线。
  inspired_by: >-
    本批:day_signed_ratio 的 46 次出现全是恒等于 1 的退化写法,本意从未被试(解剖 §1.6-1.7);G 的必要部件 day_topw_mean(Amt, Ret)(解剖 §1.1,跳掉内层 -1.46)。
    文献:文献员题 1 ②⑤(Easley et al. 2012 的成交量时钟与订单流毒性、Barclay-Warner 1993)、题 2 ①②③(Pástor-Stambaugh 2003、Amihud 2002、Kyle 1985)。
