- type: E
  core: 'sub(day_centroid(Volume), day_centroid(Ret))'
  hypothesis: >-
    核心 C = sub(day_centroid(Volume), day_centroid(Ret)),第 1 轮 N 位的 head(score +0.88,train +0.88 / valid +1.05,sign -1,hl 20;整个 head 当核心,PLAN 修订 3)。
    为什么它是 alpha 来源:两条腿单独都没用甚至有害(day_centroid(Volume) -0.09、day_centroid(Ret) -1.38;第 1 轮 R 另量 day_centroid(sqrt(Volume)) +0.06),
    只有两者之差拿分,是快照里唯一一个分数不能由任何部件复现的真交互项;day_centroid 是 |x| 沿分钟轴的质心、有界且尺度无关,
    进不来成交量 / 市值量纲(对照 G 族 beta 与 t 值之分所暴露的尺度嫌疑);valid/train = 1.19,是库里唯一不像只吃 2022-01 ~ 2023-08 一段行情的 head。
    读法:sign -1 => 多头 = 成交偏早、波动(|Ret|)偏晚。我不把它当成已证实的「知情交易时点」(文献员题 1:HKS 2010 提醒日内形状与跨日收益延续是两回事),只当成待解剖的交互项。
    见过的外围:快照里原样含 C 的候选只有它自己(外围为空);两条腿周围见过的写法是 cs_bucket_rank(day_centroid(Volume), day_centroid(Ret))、
    ts_mean(cs_bucket_rank(day_centroid(Volume), LogFloatCap), 10)、day_cov(in_index(Volume), Volume)、原始 / sqrt 质心、相对自身 20 日均值的偏离 —— 种子全部避开。
    这次的外围(和以前都不一样):(1) 测量质量筛 —— 质心在成交稀疏、连板封死、新股上市初期这些情形下是机械失真的,所以把最年轻 20%(ListAge)、
    最不流动 20%(30 日成交额)、分钟冻结最多的 10%(day_zero_ratio(Ret) 的 20 日均值:涨跌停封死 / 无成交;文献员题 4 Wan et al. 2015:涨停集中在开盘、跌停集中在尾盘,会直接搬动质心)
    推到书底,另有一个剔除最高波动 20%;(2) 条件段 —— 成交集中度高(day_gini(Volume):Admati-Pfleiderer 1988 的裁量性集中、Barclay-Warner 1993)、
    当日异常放量(信息到达日)、量与 |收益| 在分钟上本来同步(MDH,Clark 1973)的段排在前面,问「错配在哪里更灵」;
    (3) 错配的时间序列性质 —— 符号的持续率、20 日均值除以 20 日波动(一致性)、相对自身 60 日的偏离、5 日减 60 日(变化);
    (4) 分时段与第二种波动代理 —— 扣掉早盘段内自己的错配(HKS 2010 / Bogousslavsky 2021:按时段切开)、加上用分钟振幅 High-Low 定位的波动时点、加上开盘集合竞价成交占比。
    所有种子都把 C 放在保序的位置(neg / 段筛 / 同量纲加减 / 时间平滑),不放进任何 *_reg* 参数位或 cs_flip_by_state 的第二参 —— 第 1 轮 E 的核心 day_mean(Open) 就是在
    cross_reg_tvalue 里被整除掉的。奖励控制里加 C 自身这一个 head;库禁令拒掉与 C 秩相关 >= 0.7 的候选,所以纯平滑 / 纯桶内排序成不了 head,
    能拿分的只有「C 在哪些股票 / 哪些日子更灵」或「C 加上另一个时点量」的新信息。
    风险(写在前面):家族控制只有 1 个 head,比第 1 轮 E 的 4 个弱;段筛里的段本身若有独立 alpha(低波、流动性尾部)会混进分数 —— 对账时把 head 与它的段单独比较。
