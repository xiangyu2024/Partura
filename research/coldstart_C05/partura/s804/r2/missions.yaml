  why: >-
    三层外壳全是负担:cs_bucket_rank(·, ListAge) 扣 0.26(+1.10 -> +0.84),sqrt 扣 0.25(sqrt 在源码里是 sqrt(|x|),在 cs_bucket_rank 下秩不变,
    只通过 hl 平滑起作用,拆解里 +0.28 的「必要性」是 hl/sign 按 train 选造成的伪影),cs_first_high20(day_autocorr_n1(pow_05(Amt)), ·) 扣 0.09(被排序项单独 -0.36)。
    拆解的充分性行已知 G = ts_regbeta(...) 单独 +1.44、带 cs_first_high20 的 +1.35;机械 R 候选不收充分性行,所以要自己提。
    前 3 个是替换候选(G、作 ρ_head 备份的 cs_first_high20 版、Volume->Amt 版;同一 head 取合格者中分数最高的);
    后 3 个是 G 的尺度判定(同一位置 ts_regbeta +1.44 而 ts_reg_tvalue -0.14,t 值单调于相关系数,所以 alpha 不在共动方向里而在 σ_y/σ_x 里):
    σ_x 单独、把 x 先按自身 50 日 z 分数标准化后的同一回归(去掉 1/σ_x,Gu-Kelly-Xiu 式先标准化再用)、σ_y/σ_x 不带相关系数。它们决定第 3 轮要不要给 G 一个 E 位;分数够也照样可以替换。
