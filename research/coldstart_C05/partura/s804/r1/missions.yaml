  core: day_mean(Open)
  hypothesis: 核心 = 名义股价水平 day_mean(Open)。拆解里它是 4 个 head 共用的唯一必要部件(整段筛选跳掉必要性 +1.81 / +3.43,被筛选的 y 单独为负),Open->Close、pow_3、ts_decay_linear 都无关紧要(去掉 decay 反而 +0.12),所以核心取最小的价格本身,把平滑与变换交还给 GP。它活过 LogFloatCap 线性中性化,是因为 cs_first_low20 给的是尾部指示函数这种非线性暴露;4 个 head 还共同指向「买便宜但避开最便宜的那一头」。快照里见过的外围只有一种写法:cs_first_low20(y, 价格) 加 LogFloatShares / day_wstd / day_corr 当 y,外加 ts_var(day_gini(High)) 这种约 1e-7 的装饰减数。这次的外围完全换掉:(1) 双重排序:在市值 / 总市值 / 流动性 / 上市年龄的十分位桶内比较价格(cs_bucket_rank / cs_bucket_zscore),把价格效应和规模、流动性的尾部分开;(2) 价格对非线性规模(规模的立方)回归取残差,直接检验它是不是非线性规模暴露的代理;(3) 剔除最便宜的 5% / 10%(cs_last_low05 / cs_last_low10),检验「便宜但不是最便宜」;(4) 价格相对自身历史的位置(相对 120 日高点、60 日 z 分数),时间序列读法;(5) 价格档位当分类标签:同价格档内的相对收益、同档内的日内偏度(低价股的偏度被高估);(6) 便宜段内区分「价格跌出来的便宜」与「流通股本扩张(解禁 / 送转)摊出来的便宜」。奖励控制里加入含该核心的 4 个 head,只有价格之外的新信息才拿分。
