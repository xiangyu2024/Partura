- type: N
  hypothesis: 日内成交的时点分布是一条与价格 / 市值轴无关的截面信息:成交集中在早盘(信息到达、知情交易)的股票之后更好,集中在尾盘的更差。快照里唯一不属于价格轴的东西就是 head +0.58 的主项 -2*day_centroid(sqrt(Volume))(共性表 n=9、均值差 +0.64)。这里不只用连续质心,而是按文献把它拆成几种读法:离散的早盘时段成交占比(in_half)、成交最重的 10% 分钟落在一天的什么位置(day_topw_mean(in_index(Volume), Volume))、最重分钟的收益方向(隐蔽交易:大额成交在开收盘的价格冲击最大)、今天的成交时点相对自身 20 日习惯的偏移、成交时点相对 |收益| 时点的先后、质心在市值十分位桶内的相对位置、早盘时段收益的持续性。和 head +0.58 太像(秩相关 >= 0.7)的会被库禁令拒绝,所以种子尽量选不同的写法;原始质心本身放在 R 里直接量。
  inspired_by: M 第 1 批 head +0.58 里的 day_centroid(sqrt(Volume)) 主项与共性表(n=9,均值差 +0.64,p 0.116);Admati & Pfleiderer 1988、Heston-Korajczyk-Sadka 2010、Gao-Han-Li-Zhou 2018、Blau-Van Ness-Van Ness 2009
