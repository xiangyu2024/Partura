R:
  - head: 'pow_2(pow_2_5(day_durbin_watson(High)))'
    why: '没有可去的部件(唯一的敲除必要性 +1.18),但这个凸聚合只有在原始量级上才起作用(先取截面秩再五次方 -0.91),而原始 DW(High) 的量级随全市场一起成倍变化:x^5 的 EMA 会被全市场同时变粗糙的几天支配。(a) 先除以当日截面均值:每天的截面排序完全不变,只去掉全市场的水平摆动、保留每只票自己的离散度 —— 若分数不降反升,信号是个股自身的不稳定度,并替换;(b) 同样归一化之后才能把幂次推到 10 而不在 float32 里下溢(原始 DW(High) 约 1e-7 到 1e-5),检验剂量-反应在 5 之后是否还在升(趋于无穷就是 cross_max,已知 -0.06,所以中间某处有顶);(c) 不除水平的 cross_stddev(., 20):把「水平 x 离散度」写成显式的乘积,和 N 位里的变异系数种子配对,分开「离散度单独」与「水平 x 离散度」两种读法'
    variants:
      - 'pow_2(pow_2_5(div(day_durbin_watson(High), cs_mean(day_durbin_watson(High)))))'
      - 'pow_2(pow_2(pow_2_5(div(day_durbin_watson(High), cs_mean(day_durbin_watson(High))))))'
      - 'cross_stddev(day_durbin_watson(High), 20)'
  - head: 'cross_cov(cross_cov(day_max(Ret), day_cov(Ret, Ret), 3), cross_cov(day_max(Ret), day_cov(Ret, Ret), 3), 3)'
    why: '没有烂部件(两个敲除必要性 +3.31),改善轴是两处:外层窗口 3 -> 2 已知 +1.4126(+0.072,不够 +0.1);第 2 轮 N 的 head 证明 div(., cross_valid_count(day_std(Ret), 60)) 是一个「最近 60 天停过牌的票」筛子(值 +0.27,窗口 30 / 60 / 120 平):对完整历史的票分母恒为 60、排序不变,对有缺口的票把这个恒正的方差放大、推到高端,而 sign -1 做多低端,于是把它们赶出多头书。日内统计量在有缺口的票上估得最差(Ait-Sahalia-Yu),所以这个筛子对 M3 这个同样由分钟统计量构成的 head 有机制上的理由。(a) 筛子单独;(b) 外层窗口 2 加筛子(两处改动机制独立:窗口只动时间尺度,筛子只动几十只有缺口的票);(c) 内外窗口都到 2 —— 明知它违反「不要叠加两个已证实方向」,用来对账这条偏差第四次是否复现。这是本轮筛子移植的全部配额(只在这一个 head 上),失败就说明它只和 day_kurt 配对'
    variants:
      - 'div(cross_cov(cross_cov(day_max(Ret), day_cov(Ret, Ret), 3), cross_cov(day_max(Ret), day_cov(Ret, Ret), 3), 3), cross_valid_count(day_std(Ret), 60))'
      - 'div(cross_cov(cross_cov(day_max(Ret), day_cov(Ret, Ret), 3), cross_cov(day_max(Ret), day_cov(Ret, Ret), 3), 2), cross_valid_count(day_std(Ret), 60))'
      - 'cross_cov(cross_cov(day_max(Ret), day_cov(Ret, Ret), 2), cross_cov(day_max(Ret), day_cov(Ret, Ret), 2), 2)'
  - head: 'div(day_kurt(Ret), cross_valid_count(day_std(Ret), 60))'
    why: '没有可去的部件;分母是筛子,窗口 30 / 60 / 120 平(1.23 / 1.23 / 1.26),再换窗口不值钱。未试的是峰度本身的时间聚合:日内超额峰度逐日极噪、重尾(一根跳跃分钟就上百),hl 20 的 EMA 被尖峰日支配。(a) 先做 20 日箱式均值(核心 A 上这一步值 +1.12,是三轮里唯一两次成功移植的处理);(b) 换成 20 日中位数,只看「典型日」的形状、不看尖峰日 —— 若 (b) 远低于 head,峰度的信息在偶发的尖峰日里(彩票型跳跃),否则在日常形状里'
