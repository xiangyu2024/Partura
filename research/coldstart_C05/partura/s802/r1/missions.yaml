    hypothesis: '核心 S = sigmoid(50 日滚动 OLS 斜率:日内分钟成交量粗糙度 DW(Volume) 对「成交均价被钉在同一档位的最长连续分钟占比」flat_run_max(Vwap))。它是第 1 批 6 个 head 里 5 个的共同来源:单独当因子 +0.80(train 0.80 / valid 1.14,rho_known -0.12,coverage 0.96);共性均值差 +1.34(p<0.001);拆掉 regbeta 层必要性 +3.30、拆掉 sigmoid 必要性 +0.80;Vwap->Close 四棵全变差、Volume->Amt 不变。sigmoid 把 beta 压成近二值(distinct 1.00->0.67),裸 beta 的 valid 为 -0.14,所以信息在 beta 的符号与持续性里、不在幅度里。已见的外围全是一元单调包装(inv / pow_1_5 / sigmoid)加 ts_decay_linear,只改变 EMA 里哪几天占权重;本任务的奖励把这 5 个 head 放进控制,这类包装不会再拿分;而且库禁令按原始日度秩 |rho| >= 0.7 拒绝,任何基本保留 S 截面排序的写法(包括按板块 / 带宽 / 上市年龄分桶后的桶内秩)都会被拒,只留一个按价格水平分桶的探针(被拒本身就说明 S 不是相对最小价位的代理)。本次外围换两条以前没有的轴:(1) 状态动力学——S 近二值,对它取时间序列秩、相对自身 60 日的 z 分数、翻转频率(ts_stddev)、保持不变的天数占比、最近一次极端距今的天数、5 日与 60 日均值之差、与 200 日窗口版本之差,把「刚进入 / 一直处在 / 正在离开负 beta 状态」分开;以及 S 与「没成交的呆滞」(分钟 Close 的最长不变段、零收益分钟占比)的 60 日时间序列相关,把「有成交的钉价」与「没成交的呆滞」两类人群分开(拆解里 Vwap->Close 一致变差正指向这一点);(2) 与当日钉价位置(钉在日内最高 / 最低均价的分钟占比)、量加权分钟方向、成交量重心的交互,区分封涨停式的目的性钉价与钉在低位、早盘钉与尾盘钉。'
