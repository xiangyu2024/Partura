  - type: N
    hypothesis: 'M 第 1 批唯一与 S 无关的 head day_mean(neg(in_delta(Volume, 60)))(+0.54,valid +1.26,从没被拆过)按定义可以伸缩:in_delta 的前 60 分钟为 NaN,day_mean 对第 60..240 分钟求平均,所以它恒等于 (前 60 根分钟成交量之和 - 末 60 根之和)/181,其中前 60 根含 09:30 开盘集合竞价那一列、末 60 根含 15:00 收盘那一分钟。也就是「早盘重、尾盘轻」的成交量时间分布,方向是做多早盘重的一端,但它没有归一化,截面上混着成交量量级。假设:日内成交量的时间分布本身(与量级无关)带残差 alpha,且与 S 正交。种子覆盖这一族的几种写法:用自身当日成交量归一化的首末 30 / 60 / 120 分钟之差(份额差)、成交量重心 day_centroid、开盘集合竞价占比 day_first/day_sum、收盘那一分钟占比 day_last/day_sum、最大量 10% 分钟的平均时刻、成交量与分钟时刻的相关、60 分钟对数变化的日均,以及它们的 20 日均值与相对自身 60 日历史的 z 分数(时间分布的异常变化)。'
    inspired_by: '第 1 批 head day_mean(neg(in_delta(Volume, 60))) 的伸缩恒等式(首 60 分钟成交量 - 末 60 分钟成交量,未归一化);Admati-Pfleiderer (1988) 的日内成交量择时理论;Heston-Korajczyk-Sadka (2010) 的日内周期性与对数变化处理'
