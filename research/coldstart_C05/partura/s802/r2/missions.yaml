    core: 'day_mean(in_logchg(Volume, 60))'
    hypothesis: '核心 A = day_mean(in_logchg(Volume, 60))。按 in_logchg 的 NaN 规则与 day_mean 的定义,它恒等于 [末 60 分钟对数成交量之和 - 首 60 分钟对数成交量之和]/181,即尾段与首段成交量几何均值之比的对数;对当日成交量的任何乘性缩放严格不变,所以在数学上不是换手 / 规模 / 流动性水平的另一种写法。证据(只限 train / valid):单独 +0.547(train 0.547 / valid 0.760,rho_known -0.13,coverage 0.999,distinct 1.0);它的 20 日均值 cross_mean(core, 20) 是全库第一 +1.668(valid 2.260,sign -1 = 做多早盘重 / 尾盘轻),窗口 10 / 20 / 40 = 1.44 / 1.67 / 1.45 是平顶,Volume->Amt 1.64 不变;第 1 轮 R 证明对数是这一族唯一行得通的归一化(同一族的份额口径 -0.067,Amt 水平口径 -1.876)。它不在机械核心卡上(0.547 < 0.6 x 1.668),是 B 相对 B0 本轮最明确的一处不同。家族控制只有这 1 个 head(第 1 轮 E 失败的首要原因是家族 5 个、把 S 的信息全部减掉);核心在存档里出现不到 4 次,已见的外围只有 {cross_mean}。外围受两条硬约束:库禁令按原始日度秩 |rho| >= 0.7 拒绝,核心的任何平滑 / 单调 / 换窗变形都与 head 秩相关过高(所以本任务不再在平滑上花评估);家族控制减掉与 head 同向的全部信息,只有核心之外的新信息拿分。这次的外围走三类以前没有的处理:(1) 核心的时间结构而不是水平:跨日不稳定度、相对自身 60 日的稳健异常、近 5 日对近 60 日的漂移、近 20 日对一年常态的偏离(若 head 的信息是个股固定效应,这一组拿不到分;若是时变成分,这一组拿分 —— 这本身是对核心 A 的一次检验)、上 / 下四分位尾均值减均值(偶发的尾盘重 / 早盘重日,借 MAX 文献与 M 第 2 批 DW(High) 剂量-反应的极值聚合);(2) 按噪声标准化:跨日 t 比(60 日均值 / 60 日标准差)与日内 t 比(日内均值 / 日内标准差),依据是第 1 轮 R 里 100 日 t 值 +1.14 胜过同窗口 sigmoid(beta) +1.04,是本种子唯一一条标准化有效的证据;(3) 带第二个叶子的分解与交互(第 1 轮 E 前三名全是这一类,是唯一有数据支持的外围):成交额曲线减成交量曲线(= 首末小时价格漂移,把尾盘放量拆成拉升与砸盘)、成交量曲线减高低价差曲线(不推价格的尾盘量对推价格的尾盘量)、核心与日收益 / 日总量的 60 日相关、个股核心对全市场核心的 60 日 beta(收盘集中日跟随全市场 = 指数 / 机构持仓的痕迹)、按首末小时价格漂移分组的条件排序、与成交量集中度相乘。'
