    hypothesis: '核心 ts_skew(day_wstd(Volume, Vwap), 50) 是 M3 的 head(train +0.88、valid +1.18,两段一致,sign +1):分钟成交量日内离散度(day_wstd 的权重是分钟价位,日内近乎常数,约等于分钟成交量的标准差)的 50 日时序偏度。偏度对仿射变换不变,股数量纲被整个洗掉,所以它测的不是成交多少,而是「最近 50 天里有没有偶发的极端放量日」。它是快照里唯一一条没被任何定位工具碰过的轴(两次 R 替换占掉了本轮的拆解名额,没有第 4 轮),结构上离 A(成交时点)、B(价格)、C(量价相关)三条轴都最远,家族只有它自己。选它而不选 C 轴核心 cross_mean(day_corr(Ret, Volume), 20) 的理由:C 轴在库里已有 7 个 head、已经深挖过一次,再挖的产出只会是 C×X,在最终的等权融合与去重里边际价值低;「C 轴配新筛选变量」的探索放在本轮 N 位里做(不带家族控制)。本种子三轮的机制解释全错、构造全对,所以这里只押构造:唯一跨轴迁移成功的处理是条件(依序)双重排序的硬性分段(C×A:0.21 与 1.15 合成 2.09;股本 × 市值带:0.48 → 1.46),线性相减和十分位分桶都没有迁移性。外围因此全部是分段,核心轮流当排序变量与筛选变量:(a) 核心排序,在慢变、朴素、本身不是奖励控制量的变量上分段 —— 排除尾盘集中最重的 40% / 只在早盘 40% 里排(一对);只在 MAX 最低 40%(非彩票股)里排;只在 50 日收益偏度最低 40% 里排(把「放量尖峰」和「收益尖峰」分开);只在 C 轴最高 40% 里排;排除日内尾部波动最高 40%;只在上市最久 40% 里排(新股的成交量衰减会机械地制造正偏);排除最小市值 40%(微盘驱动异象、纯多头带小盘偏向);以及非彩票 + 非尾盘的两层筛选。(b) 核心当筛选变量、C 轴排序:排除偏度最低 20% / 只在偏度最高 20% 里排。核心当排序变量时一律用 40% 带:按秩算,20% 排除带与核心本身的原始秩相关约 0.68、10% 约 0.82,会撞 0.7 的库禁令,40% 约 0.52。刻意不放「只在小盘里排」:那是把奖励里线性控制掉的规模以非线性形式拿回来,A 轴已经证明这种改写能骗过 |ρ| < 0.5 的门槛(在已知族十分位里分桶后 1.55 → 0.11)。与以前的区别:快照里含这个核心的候选外围几乎是空的(M3 只评了 30 个),cs_first_* / cs_last_* 从没和它配过;奖励控制里加入核心本身,只有分段带来的新信息拿分。不放纯平滑、换窗口、换字段、保序外层(与核心同一本书,会被库禁令挡,也拿不到分;这些由本轮 R 直接测)。风险:核心零拆解,水平还是形状、Vwap 权重、窗口、是不是已知族的高阶矩这四个疑点由同轮 R 测,来不及喂给本任务。'
