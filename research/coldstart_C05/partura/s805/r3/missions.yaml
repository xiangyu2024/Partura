      - 'cs_bucket_zscore(cross_mean(day_topw_mean(abs_(Ret), Ret), 20), cross_mean(day_std(Ret), 20))'
      - 'cross_mean(div(day_topw_mean(abs_(Ret), Ret), day_mean(abs_(Ret))), 20)'
