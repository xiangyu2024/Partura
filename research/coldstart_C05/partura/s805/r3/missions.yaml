  - head: 'cs_last_high20(cs_last_high20(cross_mean(day_corr(Ret, Volume), 20), cross_mean(cross_mean(day_centroid(Volume), 10), 20)), cross_mean(day_centroid(Volume), 10))'
    why: 'A 轴在已知族十分位里分桶后从 1.55 塌到 0.11(r2 R 第 6 条):A 轴主要是已知族 cross_mean(day_std(Amt), 30) 的非线性改写。这个 head 的排序侧是 C 轴(ρ_known −0.20),A 轴只当排除带。把去掉无用嵌套的合取(拆解里 2.09)放进已知族的十分位里做 z 分数,直接量合成品里有多少是已知族的非线性部分。达到 1.50 且 ρ_head ≥ 0.5 时它替换原 head:同一本书去掉已知族那一块,对库的正交性只有好处;若塌到 0.5 以下,B 组在 C×A 这条线上的全部产出都要按「与已知族重合」打折。这个 head 只放这一个变体,免得别的变体以更高分抢走替换位(一个 head 只换最好的那个)。'
