  - head: 'ts_skew(day_wstd(Volume, Vwap), 50)'
    why: '本轮 E 位的核心,零拆解(第 4 轮不存在,只有 R 能量它的部件),四个疑点各量一次,决定 E 产出的 head 怎么读:(1) 形状还是水平 —— 同一日度序列取 50 日均值;(2) Vwap 权重有没有用 —— 分钟价位日内近乎常数,我判断 day_wstd(Volume, Vwap) ≈ day_std(Volume),去掉它,同分且 ρ_head ≥ 0.5 就以更简单的写法替换;(3) 偏度在重尾正序列上由单个极值决定 —— 窗口减半 / 加倍、换成对极值更敏感的峰度;(4) 是不是已知族的高阶矩 —— 在已知族十分位里做 z 分数(A 轴同一检验塌到 0.11);(5) 是日内离散度的尖峰还是日成交量的尖峰(高成交量溢价的文献口径是日成交量)—— 换成 day_sum(Volume)。达到 0.98 且 ρ_head ≥ 0.5 的最好变体替换原 head。'
