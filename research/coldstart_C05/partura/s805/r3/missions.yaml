    hypothesis: '条件(依序)双重排序的硬性分段 —— 先用一个慢变、朴素的第二变量把一段股票排除(cs_last_*)或选出(cs_first_*),再在剩下的池子里按主信号排序 —— 是本种子三轮里唯一跨轴迁移成功的处理:C 轴 × 尾盘排除 0.21 → 2.09;股本 × 1 日时点排除 0.48 → 0.91;股本 × 20 日时点排除 40% 0.48 → 1.25;股本 × 最小市值带 0.48 → 1.46。线性相减(A 轴三种写法里最差)和十分位分桶(搬到 C 轴 ρ_head 0.996、什么都没做)都没有迁移性;r2 的 R 里四次换筛选变量全部给出极端结果(−2.30、−2.20、+0.11、+1.46):筛选变量是半个因子,而我们对它没有直觉,只能铺开让数据定。前两个 N 位铺的是新的日内统计量(160 次评估 2 个 head);本 N 不铺统计量,铺接法:y(已知 ρ_known 低的量)× x(慢变、朴素、本身不是奖励控制量的变量)× 方向(排除 vs 选择)× 宽度。y:C 轴 cross_mean(day_corr(Ret, Volume), 20 / 40);M3 第二个 head 的内层 cross_mean(day_corr(Volume, Vwap), 20)(放量在当天高位还是低位,从没当信号用过);r2b 那个 head 取负(让「高 = 好」与筛选方向对齐);反彩票 neg(ts_max(day_sum(Ret), 20))。x:尾盘集中 cross_mean(day_centroid(Volume), 10)、C 轴本身、彩票 MAX、上市年龄 ListAge、波动时点 cross_mean(day_centroid(Ret), 20)、最小市值(只做排除)。一组对照:库里已有 C × 尾盘的排除版(20%),这里放同一 (y, x) 的选择版(只在早盘 40% / 20% 里排),直接回答「是在剔除坏名字,还是在挑好名字」。D 轴(ts_skew)整条交给本轮 E 位,这里一个都不放。避开:y 为价格 / 股本(原始秩禁令会拒);x 为流动性 / 冻结报价 / 已知族(r2 实测反向);x 本身是带 band 的合成品(−0.89);band 不宽于多头十分位(r2 R12 0.84 → 0.20);「只在小盘里排」(规模的非线性改写,同 A 轴的教训);与库里 head 骨架相同的写法(例如 cs_last_high20(cross_mean(day_corr(·)), cross_mean(day_argmax(·))));当筛选变量的量若本身是库里的 head,带宽改用 40%,否则与那个 head 的原始秩相关会贴近 0.7。'
