    core: 'day_corr(Ret, Volume)'
    hypothesis: '核心 day_corr(Ret, Volume) = 当天分钟收益与分钟成交量的相关(大成交的分钟是在涨还是在跌)。它是库里和另两条轴(日内成交时点、价格水平)构造上最远的一条:共性 effect +0.75(p 0.08,11 个候选),20 日均值版 +1.03(p 0.038);唯一的 head 是 r1b 的三层平滑 cross_mean(cross_mean(cross_mean(core,20),3),20)(+0.53,sign +1,做多「成交落在上涨分钟」的名字)。我判断它的 alpha 不在平滑本身,而在被两种机械成分盖住的那部分:(1) 当天方向 —— 上涨日的成交自然落在上涨分钟,core 与当日收益在截面上强相关,所以 core 的一大半是当日 / 20 日收益(奖励里只有 20 日反转的线性控制);(2) 量-波动共动(MDH:成交跟着 |收益| 走是最稳的规律,带符号的部分才是方向信息)。本次的外围专门把这两块剥掉或改写,再在外面做 >= 20 日平滑:A 按当天收益 day_sum(Ret) 的十分位**逐日**分桶标准化 / 排序后再平滑(cross_mean / cross_ema),或平滑后按 20 日收益分桶;再叠一层本种子 A 轴证明有效的 day_centroid(Ret) 分桶。B 减掉 / 分桶掉 day_corr(abs_(Ret), Volume)(线性 vs 非线性两版成对放,复现 A 轴上「分桶 > 相减」的对照)。C 「成交是否确认当天方向」:core x sign(当日收益) 的 20 日均值(逆着当天方向放量 = 承接)。D 交互与筛选:按规模的秩交互(Llorente 等:量价关系的预测方向随信息不对称翻转)、排除尾盘成交最重的 20%(A 轴方向结论)、排除冻结报价最多的 20%(相关系数估计质量)、40 日下四分位尾均值(出货日)、按当天成交时点逐日分桶(core 很可能被开收盘集合竞价那几分钟主导)。和以前的区别:快照里含这个核心的候选外围只有平滑类({cross_mean}、{cross_mean, cross_sum}、裸核),这 12 个种子的外围集合两两不同、没有一个只是平滑;本 E 的奖励把 head8 放进控制,单纯换平滑窗口 / 换平滑核拿不到分,也很可能被 0.7 的库禁令拒绝,所以种子里一个纯平滑都不放(纯平滑的测量交给 R)。'
