    why: '外层 cs_last_low20(., ts_argmax(., 1)) 的 band 变量是常量,整层是空操作(必要性 +0.02,Open->Close 逐位相同)。去掉外壳并把价格带 20% 收到 10%(按解剖员 §2.2 (iv),sign -1 让多头书整个落在 band 里,收紧应变好;变差则那条读法错);band 变量从首分钟价格换成 LogFloatCap(决定性的代理检验:同分 = 只是小盘,明显变差 = 价格水平这条未被控制的轴);换成 20 日冻结报价频率(r1 的通道 3)。'
