  - type: N
    hypothesis: '本种子唯一有四重证据的来源(head1,+1.55)不是成交时点本身,而是「成交的日内形状相对波动的日内形状」:裸 day_centroid(Volume) -0.09,按当天波动时点 day_centroid(Ret) 十分位分桶标准化 +0.72,再 20 日平滑 +1.55;同一个混淆用相减只有 +0.83。机制读法(Admati-Pfleiderer):量与波动本应同步聚集,不伴随价格变动的那部分成交是可自由择时的流动性 / 被动交易,它的过度聚集被定价。如果这是对的,它不该只活在「时点」这一维。本 N 把同一个处理(成交形状的 20 日均值,在它的波动对应量的十分位桶里做 z 分数)搬到其它四维:集中度(day_gini(Volume) 对 day_gini(Ret))、持续性 / 拆单(分钟成交的 AR(1) 对 |收益| 的 AR(1))、尖峰(kurt / 右尾 ES 比)、量-波动共动强度(day_corr(abs_(Ret), Volume),MDH)与成交最重 10% 分钟的冲击(day_topw_mean(abs_(Ret), Volume) 对平均 |收益|);再放两个时点的第二编码(时间离散度 day_wstd(in_index(.), .)、相关系数编码 day_corr(in_index(.), .))检验 head1 对编码是否稳健。每维配 1-2 个对照:线性相减版(检验「分桶 > 相减」能否迁移)、无条件平滑版(充分性探针)、用已证实的条件变量 day_centroid(Ret) 代替自家对应量的版本(检验条件变量是否必须同维)。r1b 已经证明这些形状量的裸 20 日均值都过不了线,所以如果这里出 head,增益来自条件化;都不出,说明 head1 的机制只属于时点这一维。负面清单(本种子实测):不用 cross_zscore / cross_madz 自身时序偏离(-4.88)、不用 day_signed_ratio(-3.46)、不把 day_centroid 用在价格字段(-1.58)、不用 cs_mean 与 day_flat_ratio 当信号。'
