  - head: 'cs_bucket_zscore(cross_mean(day_centroid(Volume), 20), day_centroid(Ret))'
    why: '条件变量 day_centroid(Ret) 是 1 日噪声量而信号是 20 日均值:换成同样平滑的条件变量(冲替换)。另三个换条件变量的变体是测量:day_gini(Volume)(条件变量必须是「波动时点」,还是任何日内形状都行 —— 直接决定 N 位结果怎么读);已知族 cross_mean(day_std(Amt), 30)(在已知族的十分位里非线性剥离:若 A 轴塌到 0.7 以下,它的一部分只是已知族的非线性函数,样本外要打折);LogFloatCap(安慰剂:+0.30 的条件化增益是不是任何分桶都给)。'
    variants:
