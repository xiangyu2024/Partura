    core: 'day_centroid(Volume)'
    hypothesis: '核心 day_centroid(Volume) 是当日成交在日内的时点重心(0 = 全在开盘,1 = 全在收盘),有界、无量纲、横截面上很持续。M 第 1 批里含它的 36 个候选平均 score 0.002,不含的 28 个平均 -2.01:它只证明了「不崩塌」,没证明赚钱;已见外围几乎全是 pow_1_5 / pow_2_5 这类在非负输入上保序的包装,经过 z-rank 与裸核是同一本书,等于外围从没被真正试过。我的判断:作为股票属性,它的水平没有被定价(所以约等于 0),如果这一维有 alpha,在它的偏离和条件化里。本次 16 个种子全部打破秩等价,分三类。A 自身历史偏离(cross_zscore 20 / cross_madz 60 / cross_rank 120 / 3 日 EMA 减 60 日均值):把属性变成事件(今天比自己平时异常地晚),同时去掉 2018-08 上交所引入收盘集合竞价造成的水平漂移(train 段内部就跨过这次改制)。B 非线性条件化(按 LogFloatCap、30 日成交额、20 日冻结报价频率的十分位桶内排序 / 标准化 / 去均值):去掉指数成分、被动资金、锁板这些与规模呈阶梯关系、奖励里的线性中性化去不掉的代理通道,同时检验它是不是代理。C 交互(异常晚盘 x 当日净买压、x 时间加权日内收益、x 成交集中度的异常;与净买压或日内收益的 20 日时序相关;按全市场放量状态翻转;成交时点减价格波动时点的 20 日均值):问晚盘成交是机构在买还是在卖 —— 收盘的机构价格压力会在之后回吐。每个种子的外围算子集合互不相同,也都不是 {pow_1_5} / {pow_2_5}。'
