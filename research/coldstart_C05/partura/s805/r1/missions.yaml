    hypothesis: '这一批里唯一不崩塌的结构是有界、无量纲、慢变的日内形状统计量;崩塌到 -2 附近的是无界的水平量与尾部统计量(train 定的方向在 valid 反号)。把「日内形状」这一类铺开,但换掉成交时点这一维(那一维交给 E 位):日内量价关系(分钟 Close 与 Volume 的相关、Ret 与 Volume 的相关、成交最重的 10% 分钟的平均收益)、净买压(涨分钟成交占比减跌分钟)、上涨分钟占比、成交集中度(Gini)、钉在日高 / 日低的时间占比、价格格点粗细、时间加权的日内收益与日内趋势的平滑度、分钟收益偏度。每个取 20 日均值(当属性)或相对自身 20 / 60 日的偏离(当事件)。另放一个裸核 day_centroid(Volume) 作充分性探针(E 位按规则永远测不到裸核)。预期 alpha 主要来自量价相关与带方向成交这一支,因为它们和奖励里的五个控制(都是水平量或收益量)在构造上最远。'
