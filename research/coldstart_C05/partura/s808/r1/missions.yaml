    hypothesis: 'M 第 1 批 91 个已评分候选里约四成落在 0.465–0.486 这条窄带(差一点过线),是同一个静态特征:流通股本在控制 LogFloatCap 之后剩下的那部分(名义股价轴,或规模的非线性残差)。控制里已有 LogFloatCap,所以 LogFloatCap 与 LogFloatShares 的任何线性组合(包括 log 名义股价 = LogFloatCap − LogFloatShares)在秩中性化之后都退化成这同一个残差;再套单调包装只会停在 0.47–0.49。要过线、要带来新信息,只能改核心之外的两件事。(1) 中性化的形状:用市值 / 总市值 / 成交额 / 自由流通比例的十分位内条件秩或条件 z 分(cs_bucket_rank、cs_bucket_zscore)代替全市场线性秩投影,区分「名义股价」和「规模的非线性残差」(Banz;Fama-French 2008;DGTW 1997)。(2) 与第二种信息交互:20 日最大日收益(含按涨跌停幅度缩放的版本)、日内波动、价格栅格粗细(day_distinct_ratio,低价股一跳占比大)、市场成交热度状态(cs_flip_by_state,迎合理论说低价溢价随情绪变)。另外放三条识别用的种子:精确的 log 名义股价 sub(LogFloatCap, inv(inv(LogFloatShares)));自由流通轴 cs_regres(sub(LogTotalCap, LogFloatCap), inv(LogFloatShares)),价格在这里精确抵消;累计复权因子(后复权收盘的 log 减 log 名义股价)。这三条在初代的得分直接回答 alpha 在价格轴还是股本轴上。按解剖员的推断,快照里含核心的候选外围只有单字段单调包装和分钟字段算子,没有横截面条件算子,也没有第二个日频规模字段,所以这些外围都是新的。每个种子的外围算子集合互不相同。方向一律交给 GP 的 sign。'
