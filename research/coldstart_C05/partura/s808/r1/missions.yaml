    hypothesis: 'A 股的日收益被各板块的涨跌停带截断(主板 10%,科创板与 2020-08-24 之后的创业板 20%,北交所 30%)。彩票型需求和涨跌停附近的行为(MAX 效应、冲高回落 / 炸板、触板后的反转或延续)都应该相对于带宽来量:主板 +9.5% 已经接近封板,创业板 2020-08 之后同样的涨幅只有半个带宽。用原始收益排序会把不同板块混在一起。这次把四类量换算成带宽单位(除以 LimitWidth),或者在同带宽组内排序(cs_bucket_rank(·, LimitWidth)):20 日 / 5 日最大和最小日收益及上下尾均值、日内最高价相对昨收的距离(离涨停多近)、从日内高点的回落(上影)、日内最低价相对昨收的距离(离跌停多近)。再加三种连续的触板强度:带宽收益的三次方均值、触板接近度 × 回落、按异常成交额加权的带宽收益。看这些量在控制流动性 / 波动 / 20 日反转 / 已知族 / 市值之后还剩多少。方向交给 sign;按 MAX 文献,预期是做多彩票性弱的一端。'
    inspired_by: '按解剖员的统计,本批 91 个候选没有一个用到 LimitWidth 或 BoardCode,而它们就在 6 个日频字段里;PLAN §1 第 3 条记着 C04 唯一站住的贡献是按涨跌停幅度缩放日收益(方向由 GP 从数据里定);文献员 Q4 的涨跌停文献(Chen 等 2017 涨停日大户买入后反转、窄带宽反转更强;Wan 等 2015、Wu 等 2017 触板前后的动态),以及 Q1 的 MAX 效应(Bali 等)'
