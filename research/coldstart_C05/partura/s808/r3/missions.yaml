    hypothesis: '核心 = day_centroid(Amt):当日分钟成交额沿分钟轴的质心(0 = 全在开盘,1 = 全在收盘)。它是本种子最强的被测量:慢分量 ts_mean(day_centroid(Amt), 20) 单独 +1.27(train 1.27 / valid 1.71),裸日度值 −0.08;两个最强 head(+1.77、+1.64)都是它在某个噪声 / 粒度变量十分位内的 20 日平均,sign −1(做多成交偏早盘、回避成交压尾盘的一端);Amt 换 Volume 几乎不动(1.56 / 1.66),窗口 10 / 20 / 40 都 ≥ 1.28,两段都强。为什么是 alpha:尾盘成交是机构、被动资金与指数调仓的通道(Bogousslavsky 2016:规模与流动性溢价集中在收盘前实现;Qiu-Huang-Jiang 2023:A 股机构集中在开盘与收盘附近交易,价格跟机构走),所以一只股票的成交习惯性压在一天的哪一段,是持续性的投资者结构特征。本位奖励把 head 1、head 2 加进控制,质心「水平」那部分已经拿走,只有水平之外的时点信息拿分 —— 这也是让产出躲过最终去重(ρ ≥ 0.7 就丢)的唯一办法。快照里核心外面只出现过一种写法:放进某个变量的十分位内做 cs_bucket_zscore / cs_bucket_rank,再 ts_mean / ts_max 慢化(外围集合 {cs_bucket_zscore}、{ts_mean, cs_bucket_zscore}、加 day_autocorr_n1、加 ts_max / day_distinct_ratio / cs_bucket_rank)。本位全部换成没见过的四类处理,16 个种子的外围算子集合两两不同:(A) 相对自身历史的时点漂移 —— 质心减自身 241 日中位数、120 日时序 z、慢分量的 20 日变化(种子 1–3;Han 等 2022:2018 年收盘集合竞价改变的正是成交的日内分布,而且对小盘更强,时点「变了」本身可能是信息);(B) 时点的不稳定与尾部 —— 40 日标准差、40 日右尾均值减中位数(偶发的尾盘重日 = 调仓 / 竞价事件,BlackRock 2020)、日间自相关(习惯性还是偶发)(种子 4–6);(C) 时点与收益、成交量、隔夜跳空的共动 —— 尾盘重的日子是涨还是跌、是不是放量日、是不是跳空日,以及金额质心与股数质心之差(高价位的成交是否更晚)(种子 7–10;Qiu-Huang-Jiang 2023、Lou-Polk-Skouras 的隔夜 / 日内拆分);(D) 把核心的慢分量当「同时点同伴组」的分组变量,在组内比另一个量 —— 成交时间的分散度(二阶矩)、成交峰值时刻、手数栅格、分钟成交额自相关、5 日反转,以及与分钟收益自相关的秩交互(种子 11–16;这是第 2 轮 E 位最强 head 的同一种结构:核心当分组变量、组内比新被测量;Freyberger 等的非参数条件化)。不再给水平加 30 日以上的平滑(head 1 的 40 日平均那一支 ρ_known 已到 −0.56,越线)。方向交给 sign。'
