  - type: N
    hypothesis: '本种子三轮里最硬的一条经验事实(解剖员 §1.5):第 2 轮 N 位用同一套「分位内条件标准化 + 时序归约」处理 12 类分钟统计量,活下来的三类 —— 成交时点(day_centroid)、分钟收益 lag-1 自相关(day_autocorr_n1)、取值重复结构(day_distinct_ratio)—— 都依赖分钟的排列顺序或取值的重复;与排列无关的占比 / 集中度 / 尾部形状(零收益占比、基尼、上涨占比、买卖压力、右尾、贴极值时间、大额分钟收益)全部 0 个。解释:已知族 cross_mean(day_std(Amt), 30) 与流动性控制已经占住了日内剖面的「离散度 / 规模」,排列无关的量大多是它的另一种读法;只有读「次序」的量站在它外面。本位只换被测量,全部取次序依赖类里本种子没碰过的:(1) 波动发生的时点 —— |分钟收益| 的质心、分钟振幅的质心、|收益| 与时间的相关(种子 1–3);(2) 长记忆 —— 分钟收益与分钟成交额的 Hurst 指数(种子 4–6);(3) 多滞后的序列相关 —— Ljung-Box Q 序列的离散度、5 分钟滞后相关、5 / 10 分钟对 1 分钟的方差比,即 Roll 式反弹在更长尺度上的读法(种子 7–11);(4) 分钟波动聚集 —— |收益| 的 lag-1 自相关(种子 12);(5) 量价领先滞后 —— 按成交额加权的收益延续、上一分钟成交额对本分钟收益 / |收益| 的相关(种子 13–15);(6) 日内路径的线性度 —— 价格对时间相关的平方(种子 16)。处理手法只用本种子验证过的两套:噪声 / 序列相关类 = 市值或流动性十分位内 z + 两层 40 日上包络(79 日最大值,来源 E 的写法);时点 / 路径类 = 流动性(20 日成交额)、噪声或原始粒度包络的十分位内 z + 20 日平均(来源 D 的写法;不按市值分桶 —— 市值桶在时点轴上比不分桶还差,1.12 < 1.27)。刻意不放:day_durbin_watson、day_ar1_coefficient、day_autocorr_n1(Amt / Volume)(会被库禁令挡掉,R 也在问它们),以及成交量的时点(那是 E 位的事)—— 第 2 轮两个位撞在同一个被测量上的错不再犯。方向交给 sign。'
