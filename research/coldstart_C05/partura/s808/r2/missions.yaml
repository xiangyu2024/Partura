    hypothesis: 'M 第 2 批交出的不只是一个因子,而是一个「处理手法」:日内比例 / 计数类量本身是门槛废品(day_distinct_ratio(Ret) 的 distinct 只有 0.06),先在市值十分位内做条件 z 分(拆开并列、去掉规模水平,distinct 0.43),再取 40 日峰值(distinct 0.96),就从废品做到 +0.58;再按自身峰值所在的十分位二次去水平,做到 +1.45。本种子只在一个被测量上用过它。这个位把同一手法迁移到快照里完全没碰过的日内形状 / 计数量上:价格不变分钟占比、最长停滞段(价格与成交量两种)、成交量的手数栅格、成交基尼、成交重心、贴着日内高点 / 低点的时间、上涨分钟占比、按成交额加权的买卖压力、右尾形状、分钟收益一阶自相关(反弹)、成交额最大 10% 分钟里的收益;另有两条按 head 1 的双重去水平写法(成交基尼、价格不变分钟占比),一条把条件变量从市值换成 20 日成交额(零收益占比,即 LOT 测度在流动性分组内比)。处理手法大多保留 M 验证过的「条件 z 分 + 40 日峰值」,少数换成 ts_mean / ts_decay_linear / cross_tail_mean_q75 / cs_bucket_rank,让 GP 自己定哪种归约好。负号那一侧的教训(价格、日收益、日内极值的水平量在这个奖励里全落在 −0.9 ~ −1.5,涨跌停带宽那条轴没留下任何痕迹)说明只用比例 / 形状 / 计数类的量,不用水平量。被测量与 M 的 head 不同,库禁令(ρ ≥ 0.7)会挡掉 day_distinct_ratio 的近亲,留下的东西不容易在最终去重里被 M 顶掉。方向交给 sign。'
