    core: 'ts_max(cs_bucket_zscore(day_distinct_ratio(Ret), LogFloatCap), 40)'
    hypothesis: '核心 = 分钟收益「栅格粒度」(当日不同分钟收益值的个数 / 分钟数)在市值十分位内的条件 z 分,取 40 日峰值。它是 M 第 2 批 head 1(+1.45)与 head 2(+0.82)共同的构件:单独 +0.58(train 0.58 / valid 0.90),distinct 0.96 自己过闸门;head 1 去掉 cs_bucket_zscore 就从 +1.45 变成 −0.73(必要性 +2.19);窗口 20 / 40 / 80 都稳;ρ_known +0.38。它是本种子唯一既不是静态风格、也不是控制变量变形的轴。为什么是 alpha 的来源:分钟收益只能取「一跳 / 价格」的整数倍,所以这个量同时读到相对一跳的粗细、无成交分钟(收益重复为 0)、当天真正走过的价位(Harris 1991;Onnela 等 2009;LOT 1999);奖励的控制是全市场秩空间的线性投影,市值分位内的相对位置是它挡不住的非线性。快照里核心外面只出现过两种写法:再堆 ts_max(head 2),和对同一个量再做一次 cs_bucket_zscore 双重条件化(head 1)。本位两条都不走,外围全换成没见过的三类处理:(1) 把核心当「同栅格同伴组」的分组变量,在组内比较另一个日内形状 / 计数量 —— 零收益分钟占比(LOT)、上涨分钟占比、成交基尼、成交重心、最长无量段、贴着日内高点的时间、成交量的手数栅格、买卖压力、分钟收益一阶自相关(买卖价差反弹)、左尾形状(种子 1–8、14、16)。依据:O''Hara-Saar-Zhong 2019 说受一跳约束和不受约束的股票,同一个微观结构量含义不同,应当在同栅格组内比;Bali-Engle-Murray 2016 的条件排序。组内形状轮换用 cs_bucket_rank / cs_bucket_demean / cs_bucket_zscore,时序归约用 ts_mean / ts_decay_linear / cross_tail_mean_q75 / cross_quantile_q50,不用 ts_max。(2) 相对自身历史的异常(Gervais-Kaniel-Mingelgrin 2001;Connolly-Stivers 2003):核心的 120 日稳健 z、核心减去自身一年中位数、同栅格组内的异常成交额、异常成交额与核心的秩乘积(种子 9–12)。(3) 同栅格组内的 5 日反转(Asness-Porter-Stevens 2000:组内短期反转主要来自买卖价差偏差)、同栅格组内的流通股本轴(本组第 1 轮那个 0.48 的簇)(种子 13、15)。奖励把 head 1、head 2 加进控制,只有核心之外的新信息拿分;这和最终库「M 在前,ρ ≥ 0.7 或 ≤ −0.5 就丢」的去重是对齐的,所以这里产出的 head 最可能留得下。方向一律交给 sign。'
