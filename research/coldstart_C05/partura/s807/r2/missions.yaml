slots:
  - type: E
    core: 'day_durbin_watson(High)'
    hypothesis: >-
      alpha 来源:day_durbin_watson(High) = sum (dHigh)^2 / sum High^2,分母不去均值,恒非负、尺度无关,
      约等于分钟最高价序列的每分钟已实现方差(dt_day.py:273)。它是快照里证据最硬的测量量:两种完全不同的聚合各自都过线
      (^7.5 + EMA20 → 1.78 / valid 2.66;60 日滚动标准差、hl 0 → 1.10 / valid 2.05),换字段 High→Low 仍有 1.54(valid 2.77),
      幂次阶梯在 train 与 valid 上同时上升。奖励只控制了日内波动的 20 日均值(cross_mean(day_std(Ret), 20)),它的极端与离散度没被控制。
      取裸的测量量而不是 pow_3(...):根上的单调幂在 hl 0 下是空操作、在 hl > 0 下只改 EMA 的跨日权重,而这一层家族控制必然扣光。
      家族控制会放进快照里含核心的两个 head(DW^7.5 + EMA20、cross_stddev(·, 60)),所以本任务只押它们给不出的信息。
      快照里含核心的候选只见过「幂次」与「滚动标准差 / fangzheng」两招;本任务的外围分六族,全部避开这两招,也避开再加幂次:
      (1) 上下行抖动的不对称:DW(High) 对 DW(Low) 的差与比、DW(High) 对 DW(Close) 的比(Rogers–Satchell 里 High、Low 角色不对称;拆解里 High、Low 各自有效);
      (2) 这是哪一种波动:除以收盘收益的日内方差、除以 Parkinson 日内极差的平方(= 分钟已实现方差 / 极差²,价格在窄区间里来回碎动还是一路走完,日内的方差比);
      (3) 相对自身历史的位置:cross_madz、5 日 / 60 日之比、归一化的波动之波动(变异系数,Baltussen 等 2018;快照里只有未归一化版)、抖动的向上跳变(semistd_pos);
      (4) 峰值相对均值(Bali 等 2011 的 MAX 对 IVOL 分解,无量纲版);
      (5) 抖动与活动 / 冻结报价 / 收益方向的跨日共动:与日成交额、day_flat_ratio(Close)、日内收益的 20 日相关(个股层面的杠杆 / 彩票不对称,Patton–Sheppard 的带符号拆分),
          以及抖动水平的一阶自相关(状态是否持续);
      (6) 截面条件化:在 day_std(Ret) 的十分位内做 z 分(给定普通波动之后多出来的最高价序列抖动)。
      量纲注意:cross_corr 的分母加 1e-9,DW 的跨日方差约 1e-12,所以凡是两边都很小的相关一律先取 log 或 sqrt,避免重演 r1a 的 EPS 退化。
      不加 LimitWidth(两次证伪)。方向交给奖励。
