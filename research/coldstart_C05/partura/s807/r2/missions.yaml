  - type: N
    hypothesis: >-
      交易活动的「二阶矩」:奖励控制了活动的水平(流动性 = cross_mean(day_sum(Amt), 30))和已知族(cross_mean(day_std(Amt), 30),也是水平主导),
      但没有控制活动来得有多不均匀 —— 日内是一阵一阵地成交还是平滑地成交(分钟成交额的 DW 锯齿度、Gini、最重 10% 分钟的份额、日内变异系数),
      跨日是忽多忽少还是稳定(日成交额 / 成交量的变异系数、向上跳变、相对自身历史的异常量)。
      Chordia–Subrahmanyam–Anshuman(2001)在控制了成交水平之后发现成交额与换手率的波动性和未来收益显著负相关,Pereira–Zhang(2010)给了理论解释;
      本种子已在三条通道上看到「非负、无量纲的日内量 + 凸聚合」能变成 alpha(DW(High)、topw、W²),所以种子里既给裸量也给凸聚合与 60 日离散度。
      另给两条把价格与活动连起来的:价格抖动 / 成交抖动(日内的价格冲击)、分钟成交额与 |分钟收益| 的日内相关(成交是否推动价格),以及冻结报价占比的跨日波动(Lesmond 型)。
      全部种子无量纲,避开已知族 |rho| ≥ 0.5 的取消资格;方向交给奖励(事先猜 −1:买成交平稳的股票)。
      这条通道与快照里的价格幅度族是不同的被观测量;若它出 head,第 3 轮可以拿它当 E 的核心。
    inspired_by: >-
      M2 的 head:day_durbin_watson(High) 是一个尺度无关的「锯齿度」统计,用在价格上两种聚合都过线 —— 把同一个统计量从价格搬到成交额;
      第 1 轮 N 的唯一 head pow_2(pow_2(pow_2(day_topw_mean(Ret, Amt)))) 说明「最重成交分钟」这条通道上凸聚合有信息;
