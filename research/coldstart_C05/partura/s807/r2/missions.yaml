R:
  - head: 'ts_sum(pow_2_5(ts_sum(pow_3(day_durbin_watson(High)), 1)), 1)'
    why: >-
      两层 ts_sum(·, 1) 是恒等算子(必要性 −0.003),head 的真身是 DW(High)^7.5 + EMA20。
      (a) 定位工具已评过的 ts_sum@1→2(1.9025,+0.127,rho_head 0.999)放进来触发替换;
      (b–c) 两个决定性空对照,同一条 ^7.5 阶梯换成被控制掉的收盘收益日内方差(量纲与 DW 相同,所以用 day_var 而不是 day_std,凸性才可比)
      与 Parkinson 日内极差平方 —— 若接近 1.78,来源就是「已知的波动尾部 / 极差」换了写法;
      (d–e) 换价格序列:Close、Vwap 从没测过(拆解只换了 High↔Low),判「最高价序列」是否必要;
      (f–g) 聚合方式:硬最大值与上四分位均值(Bali 等的前 k 大均值),和「凸幂 + EMA」的软聚合比。
    variants:
      - 'ts_sum(pow_2_5(ts_sum(pow_3(day_durbin_watson(High)), 1)), 2)'
      - 'pow_2_5(pow_3(day_var(Ret)))'
      - 'pow_2_5(pow_3(pow_2(log(div(day_max(High), day_min(Low))))))'
      - 'pow_2_5(pow_3(day_durbin_watson(Close)))'
      - 'pow_2_5(pow_3(day_durbin_watson(Vwap)))'
      - 'cross_max(day_durbin_watson(High), 20)'
      - 'cross_tail_mean_q75(day_durbin_watson(High), 20)'
  - head: 'cross_corr(pow_2(day_wmean(Ret, Ret)), pow_2(pow_2(day_wmean(Ret, Ret))), 241)'
    why: >-
      分母 sqrt(var·var) 约 1e-21,远小于 EPS = 1e-9,这个「相关」实际是 1e9 × 滚动协方差;sign +1 与 60/120 窗口的 −1 相反,482 窗口塌到 0.16。
      换成老实的写法:未归一化的 241 日标准差(量纲)与真正归一化的变异系数(形状),两者一起判「是量纲还是形状」。
    variants:
      - 'cross_stddev(pow_2(day_wmean(Ret, Ret)), 241)'
      - 'div(cross_stddev(pow_2(day_wmean(Ret, Ret)), 241), cross_mean(pow_2(day_wmean(Ret, Ret)), 241))'
  - head: 'cross_corr(pow_2(day_wmean(Ret, Ret)), pow_2(pow_2(day_wmean(Ret, Ret))), 60)'
    why: >-
      与 241 那个是同一构造、方向相反的孪生(最终库按 rho ≤ −0.5 会丢一个);同样的 EPS 退化。用老实的 60 日标准差看方向翻转是否也出现在老实写法里。
    variants:
      - 'cross_stddev(pow_2(day_wmean(Ret, Ret)), 60)'
  - head: 'cross_corr(pow_2(day_wmean(Ret, Ret)), pow_2(day_wmean(Ret, Ret)), 20)'
    why: >-
      自己和自己求相关,解析上 = var/(var+EPS),本量纲下约 1e9 × var_20(W²);老实写法是 20 日标准差,rho 应很高,有机会直接替换成可解释的 head(门槛 1.31)。
    variants:
      - 'cross_stddev(pow_2(day_wmean(Ret, Ret)), 20)'
  - head: 'cross_corr(pow_2(cs_mask_top_replace_mean_neg(pow_2(day_wmean(Ret, Ret)))), day_flat_ratio(Ret), 20)'
    why: >-
      cs_mask_top_replace_mean_neg(把截面最低 10% 抹成行均值)共性 +0.32、p 0.18,没有机制;去掉它保留其余结构,门槛 1.10。
    variants:
      - 'cross_corr(pow_2(pow_2(day_wmean(Ret, Ret))), day_flat_ratio(Ret), 20)'
  - head: 'cross_corr(pow_2(day_wmean(Ret, Low)), pow_2(day_wmean(Ret, Ret)), 20)'
    why: >-
      价格字段当权重约等于等权(日内价格的相对变化只有 1% 量级),day_wmean(Ret, Low) 实为 day_mean(Ret),共性 −0.20;换成显式等权,门槛 0.71。
    variants:
      - 'cross_corr(pow_2(day_mean(Ret)), pow_2(day_wmean(Ret, Ret)), 20)'
  - head: 'pow_2(pow_2(cross_mean(day_wmean(Ret, Ret), 5)))'
    why: >-
      先 5 日平均再折叠比先折叠再平均高 0.35,被读成「方向在多日间的持续性」;第 3 轮是否给核心 pow_2(cross_mean(day_wmean(Ret, Ret), 5)) E 位取决于两个空对照:
      (1) 5 日收盘收益的绝对值四次方(含隔夜,不加权)—— 若接近 1.71,它只是「周度极端收益」;
      (2) 不加权的 5 日日内漂移 —— 判自加权在周度上是否仍必要(日度上 day_mean 版只有 0.26)。
    variants:
      - 'pow_2(pow_2(log(div(day_last(Close), ts_delay(day_last(Close), 5)))))'
      - 'pow_2(pow_2(cross_mean(day_sum(Ret), 5)))'
  - head: 'ts_sum(LogFloatShares, 30)'
    why: >-
      LogFloatShares = LogFloatCap − log(价格),而控制里有 LogFloatCap、没有价格,所以这个 head 投影掉规模后约等于 −log(价格),
      hl 0 下 ts_sum(·, 30) 不改秩。换成显式的价格水平,看是不是同一个东西、能不能更干净(门槛 0.62)。
    variants:
      - 'log(day_last(Close))'
