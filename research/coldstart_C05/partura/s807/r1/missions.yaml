  - type: N
    hypothesis: >-
      把「日内单边」从价格路径换到成交额这条测量通道:只用分钟 K 线,按分钟收益的符号把成交额分成上涨分钟与下跌分钟
      (day_signed_ratio(Ret, Amt),是 BVC 的硬分类版),以及成交最重的 10% 分钟的平均收益(day_topw_mean(Ret, Amt),聪明钱)。
      这不是核心的外围改写,是换了被观测的量:钱实际站在哪一边,而不是价格走了多单边。
      两个方向都给种子、让 GP 定:(a) 幅度(折叠后的失衡、月内峰值),对应核心「幅度有信息、符号没有」的发现;
      (b) 方向(20 日平均净流向、重成交分钟相对平均分钟的收益差、流向相对自身历史的异常),对应文献里月度净买卖强度与 A 股聪明钱指标的负向横截面关系。
      另加两条「流向与价格是否一致」的种子:成交额方向减路径方向(有量没价 = 被吸收),以及 20 日内流向与日内收益的相关(价格对流向的敏感度,类似价格冲击)。
      事先判断方向更可能是带符号的那一族胜出;若折叠版胜出,才算支持「幅度」这条新假设。
    inspired_by: >-
      M 第 1 批唯一的 head pow_2(pow_2(day_wmean(Ret, Ret))):价格路径的单边幅度负向预测收益,且符号单独无用;
