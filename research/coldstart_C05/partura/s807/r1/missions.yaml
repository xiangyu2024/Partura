  - type: E
    core: 'pow_2(day_wmean(Ret, Ret))'
    hypothesis: >-
      alpha 来源:day_wmean(Ret, Ret) = (RS+ - RS-)/sum|r|,即按路径长度加权的日内漂移;折叠成平方后只留「日内单边程度」的幅度。
      证据三条齐全:共性 +2.27(p 0.000,但样本是同一血缘,打折)、自身 score +0.89(head 的 76%,valid +1.66 是快照里最高)、
      内层 pow_2 的必要性 +1.08(带符号版单独 -0.19)。head 外层的 pow_2 不带新截面信息(W^2 与 W^4 平滑前秩相同),
      +0.29 全来自 20 日 EMA 把均值偏向窗口最大值,且 train +0.29 / valid -0.31。
      奖励把 head 当家族控制,所以核心的单调函数一律得 0;本任务只押「核心本身给不出、但只有和核心一起才有意义」的信息,外围分四族,
      全部避开快照里含核心的候选反复出现的外围词汇(pow_2、inv、ts_cov、day_var、day_median、day_std、day_quantile_q75),
      也避开 R 里已直接评估的 cross_max(.,20) 与 cross_quantile_q75(.,20) 原式:
      (1) 单边程度在时间上的形状(主押):最单边那天离今天多远(cross_argmax)、峰值相对 60 日基线(cross_max / cross_mean)、
      今天相对自身历史的异常(cross_madz、5 日减 60 日)、偶发还是持续(变异系数、下 25% 尾均值、一阶自相关)——
      这些都不是 EMA(核心) 的单调函数,是 MAX 文献「换一种窗口聚合,归因整个转移」的直接延伸;
      (2) 给定幅度之后的方向:W|W|、20 日内幅度与带符号 W 的相关、幅度乘成交额方向占比(A 股符号跳跃文献里方向是有信息的);
      (3) 单边日是不是放量日、是不是薄交易日(cross_corr 对 day_sum(Amt) / day_flat_ratio(Close)),区分知情与噪声;
      (4) 日内何时动、是跳还是连续、有没有隔夜缺口、按涨跌停幅度归一化(day_centroid、day_gini、隔夜缺口、LimitWidth)。
