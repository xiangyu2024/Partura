R:
  - head: 'pow_2(pow_2(day_wmean(Ret, Ret)))'
    why: >-
      外层 pow_2 必要但不含新截面信息(W^2 与 W^4 平滑前秩完全相同,+0.29 全来自 20 日 EMA 偏向窗口最大值),而且 train +0.29 / valid -0.31,
      方向、半衰期、幂次都只在 train 上选,是头号嫌疑部件;权重字段 Ret 不在拆解工具的换字段表里、head 没有窗口节点、唯一的跳过算子被去重吃掉,
      所以必要性与敏感性证据本轮是缺失而不是为零。16 个变体分五组:
      (1) 空对照,判是不是旧异象换了写法:波动尾部 pow_2(pow_2(day_std))、薄交易 day_zero_ratio、不加权的日内漂移 day_mean(≈ 日收益四次幂)、经典 MAX(20 日最大日收益);
      (2) 无量纲化:sum r / sum|r|(路径效率)、W^2 / 日内方差;
      (3) 显式时间聚合替换外层 pow_2:cross_max、cross_quantile_q75、先 5 日平均再折叠 / 先折叠再 5 日平均;
      (4) 沿幂次 p 扫描(p = 3、6,加上已知的 2、4);
      (5) 权重字段与形态:成交额加权、r^2 加权、自加权二阶矩 day_wstd,以及按涨跌停幅度归一化的 W(Hung 与 Yang 2018)。
    variants:
