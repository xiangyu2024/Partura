  - type: E
    core: 'pow_2(cross_mean(day_wmean(Ret, Ret), 5))'
    hypothesis: >-
      alpha 来源(本种子唯一一条不是纯量纲的信息):日内自加权漂移 W = day_wmean(Ret, Ret) 先在 5 日上带符号平均、再折叠。
      证据全是付费的:自身 1.05(所在 head pow_2(pow_2(cross_mean(W, 5))) 1.71 / valid 2.50 的 62%),去掉 cross_mean 的必要性 +0.53,
      窗口 2 / 5 / 10 = 1.49 / 1.71 / 1.40,「先平均再折叠」1.71 > 「先折叠再平均」1.36;两个空对照都决定性通过
      (|5 日收盘收益|^4 = −1.20,不是周度极端收益;不加权的 5 日日内漂移 ^4 = −0.02,自加权必要)。
      家族控制只放 M1 那个 head(W 的 5 日均值的四次方),所以「持续量的量级」会被扣掉;本任务押的是**持续性本身**与它的条件化:
      (1) 无量纲的一致性 —— (mean W)^2 / mean(W^2)、(mean W / mean|W|)^2、5 日持续量 / 20 日典型 W^2:同样的量级,是每天一点点同向(连续信息)
      还是一两天大动(离散信息)(Da–Gurun–Warachka 2014);
      (2) 计数版信息离散度 —— 在持续量十分位内,W 同号天数占比的 z 分(不带符号与带符号各一个);
      (3) 方向 —— 带符号的持续量;方向 × 换手率去均值后的秩、持续量 × 换手率秩、换手率十分位内的持续量
      (Medhat–Schmeling 2022:高换手股票的上月收益延续、低换手的反转);持续量 × 「日内漂移与隔夜缺口是否同向」(Lou–Polk–Skouras 2019 的隔夜 / 日内拉锯);
      (4) 相对自身历史 —— 持续量在自身 60 日里的时间序列分位、持续量减去它的 20 日 EMA;
      (5) 条件化 —— 在日内方差十分位、上市年限十分位内的 |mean W| z 分;(6) 信噪比 —— 持续量 / 5 日平均日内方差。
      cs_bucket_zscore 的被解释变量一律先 sqrt(=|mean W|,量纲约 1e-4),避开 (y−μ)/(σ+1e-9) 在 1e-8 量纲上的 EPS 收缩。
      核心周围此前只见过 {pow_2}(head 本身),以上外围都没出现过。
      明确不要的写法:cross_corr / cross_autocorr 两边都是 W^2 量纲(约 1e-8,分母远小于 EPS,退化成 1e9 × 协方差,重演 r1a 的 7 个 head);
      cross_regbeta 的第一参数放 W 系列(NaN 闸门);再加根上的幂次(家族控制必扣光);cs_*_full / cs_sum / cs_mean 当 _lexi 族的第一个参数(列序后门)。
      方向交给奖励;Kudryavtsev 2017(连续同号之后下一天反转)是反方向的证据。
