R:
  - head: 'pow_2(pow_2(pow_2(day_topw_mean(Ret, Amt))))'
    why: >-
      r1b 的唯一 head(0.6845,train 0.68 / valid 1.62;门槛 0.7845)。它的幂次阶梯 ^2 / ^4 / ^8 = −0.30 / 0.14 / 0.68,
      train 与 valid 同时上升(valid 0.57 / 0.86 / 1.62),不是只靠 train 的部件;^8 很可能还没到软幂平均的饱和点(同族的 day_var 在 ^7.5 方差、即 ^15 收益量纲处才到 2.04)。
      把根上的幂推到 ^10 与 ^12(topw 量纲约 1e-3,^12 约 1e-36,仍在 float32 范围内),是同一个东西,替换机会最大的一组。
    variants:
      - 'pow_2_5(pow_2(pow_2(day_topw_mean(Ret, Amt))))'
      - 'pow_3(pow_2(pow_2(day_topw_mean(Ret, Amt))))'
  - head: 'pow_2_5(pow_3(day_var(Ret)))'
    why: >-
      库里最高分的 head(2.0432;门槛 2.1432)。(a) 换载体为按 |r| 加权的日内标准差,幂次与原式对齐(wstd^15 = 方差量纲的 ^7.5):
      第 1 轮在同一幂次上 wstd 比普通 std 高 0.9(0.93 对 0.03),是唯一有机会顶掉它的一条;
      (b) 去掉第 0 列(09:30 集合竞价那一根)再算方差:若竞价那一分钟的收益含隔夜缺口,它在 ^7.5 下会主导极端日,这一条既判来源 ① 有多少是隔夜缺口,也可能更干净;
      (c) 阶梯作用在「相对自身 60 日水平」的无量纲方差上(控制只投掉了 20 日均值):判来源 ① 是「天生高波动」还是「这个月异常高波动」,大概率不替换,买证据。
    variants:
      - 'pow_2_5(pow_3(pow_2(day_wstd(Ret, Ret))))'
      - 'pow_2_5(pow_3(day_var(in_slice(Ret, 1, 240))))'
      - 'pow_2_5(pow_3(div(day_var(Ret), cross_mean(day_var(Ret), 60))))'
  - head: 'ts_sum(cross_stddev(day_durbin_watson(High), 60), 1)'
    why: >-
      1.1007(train 1.10 / valid 2.05;门槛 1.2007)。ts_sum(·, 1) 是恒等算子(必要性 −0.003);载体 DW(High) 在 ^7.5 阶梯上已被 day_var(Ret) 以 +0.27 超过。
      同一种「波动之波动」聚合换到更好的载体上,并去掉恒等算子;60 日与 120 日两个窗口(train 是约束端)。
    variants:
      - 'cross_stddev(day_var(Ret), 60)'
      - 'cross_stddev(day_var(Ret), 120)'
  - head: 'cs_last_high40(cs_stddev_full(day_durbin_watson(High)), cross_corr(day_durbin_watson(High), day_quantile(Volume), 20))'
    why: >-
      r2a 的唯一 head(0.6326,train 0.63 / valid 1.85;门槛 0.7326)是股票列序的产物:cs_stddev_full 在截面上是常数,
      _lexi 的 _pct_rank 是序数秩、并列按列序,第一项退化成「股票列号 / n」,真信号只有第二个参数那个 40% 的筛子(r2a 前五里两个 valid 完全相同 3.263867 是签名)。
      列号约等于交易所 / 板块代码,这个 head 留在库里就是一个无意的板块押注。三种去列序写法:组内改按 DW(High) 排、筛子变量单独当因子、
      组内改按 LogFloatCap 排(规模在控制里,中性化后基本只剩筛子)。三者与原式共享同一个 40/60 切分,交易信号 ρ 估计在 0.6~0.7,有替换机会。
    variants:
      - 'cs_last_high40(day_durbin_watson(High), cross_corr(day_durbin_watson(High), day_quantile(Volume), 20))'
      - 'cross_corr(day_durbin_watson(High), day_quantile(Volume), 20)'
      - 'cs_last_high40(LogFloatCap, cross_corr(day_durbin_watson(High), day_quantile(Volume), 20))'
  - head: 'cross_regbeta(day_std(Volume), cs_mask_top_replace_mean_neg(cs_robust_z(day_distinct_ratio(Volume))), 15)'
    why: >-
      M3 子族 B 的代表(1.1995,train 2.03 / valid 1.20;门槛 1.2995)。cs_robust_z 是全部付费记录里唯一负必要性的部件(去掉后 1.2910,差 0.0085);
      去掉它的版本是 valid 约束,原式窗口 7 / 15 / 30 的 train 单调升,所以 (a) 去掉 cs_robust_z 并把窗口放到 20。
      (b)(c) 买证据:beta = cov/Σ(x−x̄)² 的截面被 1/var_x 主导,解释变量单独 ρ_known 0.57;inv(15 日成交量离散度) 判「这一族是不是成交量离散度的倒数换了外衣」;
      薄交易旗标在非奇异聚合下的第一次测量 —— 旗标的 distinct 只有 0.053 是因为它是「不同取值数 / 分钟数」= k/240,截面上最多约 240 个取值(量化,不是二值),
      60 日均值把取值数放大到够过 distinct 闸门。R 只替换不收录(PLAN 修订 10(2)),(b)(c) 过线也进不了库,只为笔记。
