    core: 'day_var(Ret)'
    hypothesis: >-
      alpha 来源(本种子最硬的一条):日内已实现方差的「软幂平均」。pow_2_5(pow_3(day_var(Ret))) 配 EMA20、方向 −1,
      score 2.04 / valid 3.16,是库里最高分的 head;同一条 ^7.5 阶梯换五种载体(day_var、DW(High)、DW(Close)、DW(Low)、Parkinson 极差²)
      全部 ≥ 1.0、valid 全部 ≥ 2.0;三条硬极值对照(cross_max、上四分位均值)全败,经典日收益 MAX −0.85。奖励只控制了日内波动的 20 日均值。
      家族控制只放这一个 head(快照里原样含 day_var(Ret) 的只有它),所以核心的「水平 + 凸聚合」信息会被全部扣掉;
      本任务押的是**给定方差之后,日内收益分布的形状**:核心只当分母、归一化量或分组变量,外围全部无量纲,因而家族控制几乎扣不到它们。
      六族外围:(1) 带符号拆分 —— 相对带符号跳跃变差 RSJ = mean(r|r|)/var 及其 20 日均值、周度下行半方差占比
      (Bollerslev–Li–Zhao 2020 的 RSJ;Barndorff-Nielsen–Kinnebrock–Shephard 的已实现半方差);
      (2) 尾部形状 —— 已实现偏度 mean(r^3)/var^1.5(日度与周度)、已实现峰度 mean(r^4)/var^2、在 day_var 十分位内的偏度 z 分、
      在上市年限十分位内的已实现偏度(Amaya 等 2015:周度已实现偏度最低十分位减最高十分位每周约 19bp,峰度弱正,波动本身不显著);
      (3) 跳跃与集中度 —— 双幂变差 / 已实现方差(连续部分占比)、当日最大一分钟平方收益 / 方差及其 20 日均值、
      成交额最重 10% 分钟上的平方收益 / 全天方差(Barndorff-Nielsen–Shephard 2004);
      (4) 日内时点 —— 上午盘方差 / 全天方差、尾盘 30 分钟方差 / 全天方差(Andersen–Bollerslev 1997 的日内周期);
      (5) 路径结构 —— 20 日方差比(日内收益平方的 20 日均值 / 分钟方差的 20 日均值,Lo–MacKinlay 1988)、分钟收益一阶自协方差 / 方差。
      核心周围此前只见过根上的幂次({pow_3}、{pow_2_5, pow_3}、{pow_2_5})、ts_cov(day_median(Vwap), ·) 与 div(DW(High), ·),以上外围都没出现过。
      明确不要的写法:再爬幂次阶梯(家族控制必扣光);cross_regbeta(day_var(Ret), ·, d)(10~20 日窗口里 Σ(x−x̄)² 约 1e-11 < 1e-9,整支是 NaN);
      cross_corr 两边都是 day_var 量纲(分母 sqrt(var·var) 远小于 EPS,退化成放大的协方差,重演 r1a);
      cs_stddev_full / cs_sum / cs_mean 当 cs_last_* / cs_first_* 的第一个参数(截面常数经 _pct_rank 序数秩变成股票列序,r2a 的唯一 head 就是这个后门);
      不用 BoardCode / LimitWidth 当 cs_bucket_* 的分组变量(取值很少,序数秩会按列序把同值块切开)。
      方向交给奖励:美股文献里已实现偏度与 RSJ 都是负向,A 股带符号跳跃的文献(Chao 等 2017)是正向。
