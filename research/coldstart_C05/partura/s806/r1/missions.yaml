  - type: N
    hypothesis: >-
      无量纲的日内收益分布 / 价格路径形状。这一批的 day_cov(Vwap, Ret) 把「形状」(行情出现得多晚)和「量级」(价格 × 方差)
      混在一起;文献里同一类信息的标准写法都是尺度不变的:已实现偏度 / 峰度、按收益符号拆开的半方差(相对符号跳跃
      Σr|r| / Σr²)、归一化的成交不平衡 (上涨分钟量 − 下跌分钟量) / 总量、时点与收益的相关、尾盘 30 分钟收益、
      隔夜段与盘中段分开的累计收益、成交量加权均价相对时间加权均价的偏离、量价相关。它们都不含价格水平和波动量级,
      所以在五个控制(流动性、20 日均波动、20 日反转、已知族、市值)之后更可能留下独立信息;多数先做 5–20 日平滑以压换手
      (纯多头 + 15bp)。另放一个 LimitWidth 缩放的周收益(PLAN §1 第 3 条:C04 唯一留下的构造,方向交给数据)和一个
      按市值十分位组内标准化的偏度。方向一律交给 train 定,不写先验符号。16 个种子骨架互不相同。
    inspired_by: >-
      M 第 1 批:day_cov(Vwap, Ret) 血统(22 个候选,共性表均值差 +0.63)是这批里唯一带日内信息的结构,但它的截面主要由
      价格水平 × 已实现方差决定(解剖 §1.4);本位做它的无量纲孪生(day_corr、价格分布偏度、时点相关)和文献里同族的
      尺度不变量(Amaya et al. 2015 的已实现偏度;Barndorff-Nielsen et al. 的半方差;Narayan et al. 2015 的成交不平衡;
      Chu et al. 2019 的 A 股日内动量与 T+1 跨段反转;Lou et al. 2019 的隔夜 / 盘中拔河)。
