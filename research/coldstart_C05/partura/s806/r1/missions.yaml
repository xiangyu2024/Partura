# 位 a = E(核心 day_cov(Vwap, Ret),外围专门去量纲);位 b = N(无量纲的日内分布 / 路径形状,文献里的经典写法)。
slots:
  - type: E
    core: 'day_cov(Vwap, Ret)'
    hypothesis: >-
      共性表的 7 行折算下来只有 1 条血统、2 个信号;真正带日内信息的部件是 day_cov(Vwap, Ret)(22 个候选含它,
      含 / 不含 −0.83 / −1.46;p 值因血统相关而高估,只当描述)。卡 1 的 add(LimitWidth, ·) 在量纲上把它降成板块
      哑变量的破平局项,不选。按解剖员的分解 day_cov(Vwap, Ret) ≈ (P̄/M)(Q/2 − R·δ):一半是「价格水平 × 当日已实现方差」
      (价格水平不在控制里,当日方差只被 20 日均波动部分控制),一半是「当日收益 × 行情出现得多晚」(时点项)。
      我的判断是它相对「亏得少」主要来自前者(代理)加上这条血统换手低,时点项是否带 alpha 未知;这一位就是把两者拆开。
      外围处理(都是快照里没见过的:以前只见过 add LimitWidth、再套 ts_min、重复相加):
      (1) 除以 day_mean(Vwap) 去价格水平;(2) 再除以 day_var(Ret) 只留时点项 −Rδ/Q;(3) 改用 day_std 归一化(等价于相关);
      (4) 多日处理:cross_mean / cross_ema 平滑、cross_zscore 与「减自身 20 日均值」的新息写法、ts_rank、上四分位日均值;
      (5) 组内标准化(按市值十分位 cs_bucket_zscore)而不是把哑变量加到信号上;(6) LimitWidth 只作缩放(除以 LimitWidth 的平方,
      方差量纲),不作加项;(7) 对照:不去量纲只平滑的 cross_mean(day_cov, 20) 与先截面排序再平均;以及除以 20 日平均方差
      (保留当日波动新息)对比除以当日方差。哪个方向赚钱交给 GP 和 train 定,不写先验符号。
      判决:若去量纲的时点版明显差于只平滑的原版,说明来源是价格 × 波动代理,第 2 轮不再在这个核心上花 E 位。
