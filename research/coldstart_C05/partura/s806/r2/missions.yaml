      (3) 单边 / 非单调:压掉最晚 10%、突出最早 20%、离截面中位数的绝对距离 —— 把折叠 / 分段用在一个齐次零次的 alpha 上(不是用在控制变量上),检验关系是否单调;
      (4) 交互:在最早成交的 20% 里按 60 日异常换手、按 15 日累计隔夜收益排序,时点与日收益的 20 日时序相关(晚盘成交是否落在上涨日)—— 投资者结构 × 注意力 / 隔夜—日内拔河。
