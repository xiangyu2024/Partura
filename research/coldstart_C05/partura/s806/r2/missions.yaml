R:
  - head: 'sqrt(cross_quantile_q25(cs_last_low40(LogFloatCap, day_quantile_q75(Amt)), 3))'
    why: >-
      cross_quantile_q25(·, 3)(近 3 日的下四分位)在一个几乎不变的折叠值上只把它往下拖、把换手抬上去:拆解里去掉它 score +2.115
      (train +2.115 / valid +2.392,两段都比原 head 好),增益 +0.33。只提这一个变体(窗口 3→2 的那个增益小且争同一个 head;
      带宽收窄 / 换叶子会让「最好的合格变体」变成更窄、更可能过拟合的版本,不提)。
    variants:
      - 'sqrt(cs_last_low40(LogFloatCap, day_quantile_q75(Amt)))'
  - head: 'sqrt(cross_quantile_q25(cs_last_low40(LogFloatCap, day_quantile(Low)), 3))'
    why: >-
      与头 1 完全相同的部件、相同的结构,只是筛子换成分钟最低价的中位数;头 1 上去掉这个部件两段都变好,这里同样去掉。
    variants:
      - 'sqrt(cs_last_low40(LogFloatCap, day_quantile(Low)))'
  - head: 'sqrt(ts_quantile_q50(day_centroid(Amt), 20))'
    why: >-
      诊断为主(替换门槛 +0.1 大概率到不了,但每个数字都决定第 3 轮怎么用核心 A):滚动中位数换成滚动均值(中位数的稳健性是否必要);
      窗口 20→50(40 已打平,看平台在哪结束);把隐含的「全市场截面排序」换成按 LogFloatCap、按 30 日平均成交额的十分位组内排序
      (组内版若不掉,头 4 就不是规模 / 流动性的非线性残留;若掉很多,它的一部分是代理)。sqrt 是保序装饰,不去(已测打平)。
    variants:
      - 'sqrt(ts_mean(day_centroid(Amt), 20))'
      - 'sqrt(ts_quantile_q50(day_centroid(Amt), 50))'
      - 'sqrt(cs_bucket_rank(ts_quantile_q50(day_centroid(Amt), 20), LogFloatCap))'
      - 'sqrt(cs_bucket_rank(ts_quantile_q50(day_centroid(Amt), 20), cross_mean(day_sum(Amt), 30)))'
  - head: 'day_kurt(Ret)'
    why: >-
      单算子,没有可去的部件;能替换的是隐含的「全市场截面排序」。怀疑:分钟收益的峰度很大一部分由最小报价单位决定(低价股的分钟收益是
      一个跳价的整数倍,零值多、偶有跳动 → 峰度高)以及报价停滞(涨跌停 / 冷门股,Adcock et al. 2019 指出涨跌停截断会扭曲高阶矩),
      做多低峰度可能部分是在做多高价、连续成交的股票。换成按收盘价十分位、按零收益分钟占比十分位的组内排序:不掉 → 峰度本身是来源,
      第 3 轮值得给它 E;掉很多 → 它是价格离散度 / 停滞的代理,不再深挖。
    variants:
      - 'cs_bucket_rank(day_kurt(Ret), day_last(Close))'
      - 'cs_bucket_rank(day_kurt(Ret), day_zero_ratio(Ret))'
  - head: 'cs_mask_top_replace_mean_neg(day_quantile_q75(pow_2_5(Amt)))'
    why: >-
      pow_2_5 保序、逐分钟作用,唯一的作用是决定被错位的最低 10% 落到截面的哪个分位(模拟:92 分位;去掉后约 74 分位)。
      去掉它:若 score 不掉,这个部件是装饰,换成更简单的;若大掉,说明这个 head 的全部内容就是「错位落点」,是纯代理。
    variants:
      - 'cs_mask_top_replace_mean_neg(day_quantile_q75(Amt))'
  - head: 'cs_first_low20(cs_normalize(day_open(Open)), cs_mask_top_replace_mean_neg(day_quantile_q75(pow_2_5(Close))))'
    why: >-
      cs_normalize 在 _lexi 的 y 位只用到秩,逐位恒等(拆解已测必要性 −0.00);pow_2_5 只改错位落点。两个一起去,得到同一个结构的最简写法,
      并看「便宜但不是最便宜」那条带子对落点有多敏感。
    variants:
      - 'cs_first_low20(day_open(Open), cs_mask_top_replace_mean_neg(day_quantile_q75(Close)))'
