  - type: N
    hypothesis: >-
      不预平滑的日内收益分布「方向」,以及「收益是在哪些分钟里赚到的」。本组第 1 轮 N 位的教训:裸 day_kurt(Ret) +0.97,
      任何 cross_mean 平滑都掉到 0.46–0.61 —— 奖励自带半衰期搜索(hl ∈ {0, 2, 5, 10, 20}),预平滑是重复劳动;
      而第 1 轮的偏度、相对符号跳跃、成交不平衡全部是先平滑才放进去的,它们的裸值其实没被检验过。峰度是无方向的尾部厚度,
      这一位问两件它没回答的事:
      (a) 尾部的方向:裸已实现偏度、右尾与左尾 ES 比的秩差、偏度 × 峰度、|Ret| 最大 10% 分钟的平均收益(带符号的跳跃)与其 20 日中位数、
      相对符号跳跃 Σr|r| / Σr² 的裸值,外加「彩票」型的 30 日最大日收益;
      (b) 按成交强度分解收益:成交额最大 10% 分钟的平均收益(裸值、15 日均值、减全天平均分钟收益)、成交额加权减等权的分钟收益(及其 20 日中位数)、
      分钟收益与成交额的相关、|Ret| 与成交额的相关、上涨分钟占比及其与日收益的秩差(收益是许多小步走出来的还是几次跳出来的)。
      依据:高成交时段的价格信息含量更高,所以重成交分钟的收益更像信息(延续)、轻成交分钟的更像噪声(反转);
      20 日反转控制只去掉总收益的线性部分,这个分解它没有。全部齐次零次(不含价格水平、市值、成交额水平),
      不碰 LogFloatCap / 股价 / Amt 水平的折叠或分段(那一簇 M 自己在大量产出,融合时会被去重挤掉)。方向一律交给 train;15 个种子骨架互不相同。
    inspired_by: >-
