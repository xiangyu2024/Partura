      当日值里混着会隔夜反转的收盘价格压力,20 日中位数把它平掉。
      本位奖励把头 4 放进控制,只有核心之外的新信息拿分;快照里含该核心的外围只见过 {sqrt}(在正值上保序,等于没做)。
      这次的外围全部是没见过的四组:
      (1) 水平还是变化:20 日减 60 日中位数(近两月的投资者结构迁移)、50 日时序分位、当日偏离与近一周偏离 —— 直接检验「alpha 只在持久水平」;
