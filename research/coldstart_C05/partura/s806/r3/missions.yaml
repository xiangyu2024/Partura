slots:
  - type: E
    core: 'div(day_last(Amt), day_sum(Amt))'
    hypothesis: >-
      核心是收盘集合竞价那一分钟的成交额占全天成交额之比,在 Amt 上齐次零次。它是第 2 轮 E 位在「头 4(重心)已进控制」的严口径下长出的唯一新部件
      (头 10 +0.63、头 11 +0.59,valid 都在 +2.0 以上),文献上对应「谁在收盘交易」:收盘竞价参与度是机构 / 被动资金的投资者结构特征(BM2019),
      而当日的异常参与度对应会反转的价格压力(MDV2020:改革前大额收盘竞价收益次日反转 −0.2 ~ −0.3)。它有两个疑点,本位的外围就是围绕它们设计的:
      (i) 头 10 / 头 11 的分数可能一大半来自 ÷ day_sum(Amt)(有界的秩差除以跨五个数量级的当日成交额 = 按符号切块、块内按 1/成交额排序,把流动性控制非单调地搬回来)——
      本位的家族正是这两个 head,奖励把它们放进控制,这条通道被压掉,只有收盘参与度本身的新信息拿分;
      (ii) 冷门股成交块状,收盘那一分钟的占比系统性偏高,收盘占比可能只是流动性 / 成交集中度的亲属(头 4 按成交额组内 valid 从 +1.34 掉到 +0.21 就是同一种病)。
      所以外围的主线是「相对化」,而且一律不用带量纲的分母(分母纪律:第 2 轮那条「分母只用不会为 0 的量」的提示正是 ÷ day_sum(Amt) 的来路):
      (1) 水平基线:20 日中位数、60 日均值;(2) 非参数相对化:在 30 日平均成交额、流通市值、成交时间重心、成交 gini 的十分位组内排序,
      收盘 vs 开盘(首分钟)参与度的秩差(机构 vs 散户隔夜单),收盘占比减成交集中度的秩差 —— 问「同样冷热、同样晚成交的票里,收盘参与度高的是否不同」;
      (3) 时间结构:20 减 120 日中位数(被动 / 机构参与度在迁移)、在自身 120 日里的位置、60 日 z 分数(当日异常;预期弱,标签从次日开盘 VWAP 起算,隔夜反转拿不到);
      (4) 方向:收盘参与度 × 末分钟收益的 20 日均值、收盘参与度与日收益的 20 日时序相关 —— 收盘那一段的资金是持续买还是持续卖(以前所有写法都没有方向);
      (5) 截尾:压掉最低 10%、把最高 10%(指数调仓日 / 极冷门)推到底;外加一个与峰度的交叉(在收盘参与度最低的 20% 里按低峰度排)。
      已见外围只有「与重心做秩差、再除以当日成交额」这一种(集合 {sub, cs_rank, ts_quantile_q50, day_centroid, div, day_sum} 及其小变体),
      16 个种子的外围集合都不同于它,只有一个种子含 day_centroid(以 cs_bucket_rank 出现,集合是新的)。
      风险照记:上交所 2018-08-20 起才用 14:57–15:00 收盘集合竞价定收盘价,train 前约 8 个月沪市股票的末分钟是连续竞价,这个核心的含义在 train 里变过一次。
