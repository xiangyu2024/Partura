  - head: 'sqrt(cs_last_low40(LogFloatCap, day_quantile_q75(Amt)))'
    why: >-
      诊断为主(要 ≥ +2.21 才替换,几乎不会):被折叠的量换成流通股本(去掉价格成分)与总市值。M 第 3 批的 LogFloatShares 保序族(单调写法)均值 +0.48、0 个过线;
      这里问「把同一个量折叠起来值多少」—— 若两者都 ≥ +1.3,来源是折叠这个处理而不是被折叠的变量(解剖 §1.2),F1 / F2 是同一个赌注这条判断就有了直接证据。
    variants:
      - 'sqrt(cs_last_low40(LogFloatShares, day_quantile_q75(Amt)))'
      - 'sqrt(cs_last_low40(LogTotalCap, day_quantile_q75(Amt)))'
