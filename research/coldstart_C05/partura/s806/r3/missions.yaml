  - type: N
    hypothesis: >-
      抗微观结构污染的尾部厚度,以及同一个「质地」问题的两条旁支(收益的方差比、成交的块状程度)。
      依据是本种子自己的付费证据:第 2 轮 R 把 day_kurt(Ret) 放到收盘价 / 零收益分钟占比的十分位组内排序,train 从 +0.97 掉到 +0.48 / +0.33,
      valid 却不掉(+1.70 / +1.21)—— 1 分钟收益的峰度在 2018–2021 有约一半是最小报价单位、报价停滞、买卖价差弹跳造出来的
      (HL2011 推出零收益与弹跳会系统性抬高已实现矩、修正后异象消失),另一半在 2022–2023 是独立的、和这些污染无关的尾部信息。
      这件事 E 位做不了:E 把裸峰度放进控制,与裸峰度共有的干净部分被一起扣掉,条件化种子只剩条件变量的台阶;所以用普通奖励的 N 位,换掉的是**测量方式**:
      (a) 把采样放粗 —— 5 / 15 / 30 分钟收益(in_pct 的重叠收益)与分钟 VWAP 路径(10 分钟对数变化)的峰度,粗采样下跳价与弹跳被平均掉,尾部厚度反映真正的大幅变动;
      15 分钟最大波动除以 15 分钟波动、最大一笔 5 分钟波动占全天 5 分钟波动总和的比例(日内的 MAX,尺度不变、有界);粗采样下的偏度(1 分钟偏度被弹跳淹没,两轮都没过);
      (b) 双重清洗 —— 粗采样峰度再在收盘价 / 零收益占比 / 30 日成交额的十分位组内排序,剔掉最停滞的 10% 后按低峰度排;
      (c) 方差比 —— 15 分钟收益方差 / 1 分钟收益方差(弹跳噪声主导时偏低)及其 20 日中位数;
      (d) 成交的块状程度 —— 分钟成交额峰度的 20 日中位数、gini 的 20 日中位数(持久水平,学重心的写法)、价格尾部减成交尾部的秩差(没有成交脉冲配合的跳动 = 薄盘口的噪声)。
      裸的 day_kurt(Amt) 不放:它与头 7 骨架相同(字段被抽象掉),库禁令会直接拒。
      全部齐次零次,不碰市值 / 股价 / 成交额水平的折叠与分段(那一簇 M 自己在大量产出)。方向一律交给 train(1 分钟峰度是做多低峰度)。
      粗采样峰度与头 7 的秩相关若 ≥ 0.7 会被库禁令拒绝,所以窗口从 5 拉到 30 并带上组内版本,总有一部分落在 0.7 以下。
