- id: H6_turnover_instability
  hypothesis: >-
    成交额时冷时热(日成交额相对自身均值的离散度大)的股票随后跑输;成交稳定的跑赢。
  thesis:
    mechanism: >-
      成交额的不稳定是情绪资金进出的痕迹:一只票被一阵关注推高成交、随后冷却,这个来回本身说明它的持有者里
      短线与情绪资金占比高,定价被这类资金的进出推离价值,随后回落。
      关键是变异系数而不是标准差:均值把规模与流动性水平约掉,留下的是「相对自身的忽冷忽热」
      —— 这是它能和控制变量里的流动性水平、已知族的成交额离散度分开的唯一理由,也是本假设的全部风险。
      Chordia–Subrahmanyam–Anshuman 2001 用换手率的波动度量这件事,A 股的换手率波动因子同向(先验)。
    counterparty: >-
      被一阵热度吸引、在成交放大时追入的情绪资金;收钱的是在热度里卖出、等冷却后买回的资金。
    prediction: >-
      方向 sign = −1。机制成立按文件头的统一判据:不同构造的 core 是 {v1, v2, v3}(水平离散:30/60 日的变异系数,
      std(log) 在对数正态下是变异系数的单调变换,算同一构造)与 v4(对数成交额日变化的标准差:交替,而不是水平离散),
      两者都选 sign −1 且 > 0、其一 ≥ 0.5;另加 v7 ≥ 0.3、v6 与 v10 < 核心。中位猜测 score 0.1–0.5
      (按 ±0.3 放宽即 −0.2 到 0.8),换手 0.02–0.04。本卡没有 I 的机械载荷,风险在非线性的规模 / 流动性(v8 量它)。
      C02 在 long 下实测 30 日变异系数 = −0.35(train −0.247 / valid −0.348,半衰期 5,换手 0.057),
      ρ已知 = +0.04 —— ρ 只有 0.04 是这一条值得测的主要依据:变异系数确实没有落回成交额的水平与离散度。
      v3(对数成交额的标准差)与 v2 应同号:std(log) 同样无量纲,而且对单日巨量不那么敏感,可能比比值更稳。
      v4(交替)与 v2 同号才说明「忽冷忽热」本身在做功;v2 过线而 v4 ≈ 0,读到的是成交额的慢趋势(关注度的升降),
      要和 v10 一起看。v7(对 C01 那个「相对自身一年的量」head 取残差)≥ 0.3 才算新。
      v8(非线性流动性)是全卷的校准读数,和 H5/v10 成对:它过线说明线性中性化在规模上漏得多,
      H6 的核心若与它同时过线,先怀疑核心只是「小而冷门」的非线性包装。
      总领:P(v1–v4 任一 ≥ 0.5)≈ 35%,P(按统一判据成立)≈ 20%;过线时 sign −1 的概率 ≈ 75%;
      v8 选 +1(做多两端)且 ≥ 0.5 的概率 ≈ 35%。
    fails_if: >-
      核心在 train 上选出 sign = +1(做多成交不稳定者)—— 那是信息到达被奖励,情绪进出的陈述反了,本假设即否。
      核心被 ρ已知 ≥ 0.5 拒 —— 即便只用比值也落回已知族,这条路关死(C02 的 +0.04 让这个结局不太可能,
      但 60 日、241 日、对数形式、日变化形式都没测过)。
      v8(非线性流动性)≥ 0.5 且与核心同向过线、核心又只比它高不到 0.2 —— 读到的是规模的非线性,不是成交的不稳定。
      v10(5 日对 60 日的成交额水平比值,即异常换手 / 注意力)≥ 核心 —— 读到的是注意力冲击的水平
      而不是不稳定性,机制要改写成 C01 那一族(cross_scale(·, 241) 的「今天的量相对自身一年」)。
      v6(尖峰,最大值比均值)≥ 核心 —— 做功的是单日巨量(上榜、公告),不是持续的忽冷忽热。
      v7 < 0.3 —— 即便过线也与 C01 的 head 高度重合,终局不算新,W2 不为它设计种群。
      v9(15 日)明显最好而 v2(60 日)≈ 0 —— 做功的是短窗换手而不是慢变的股票属性,成本口径下不可靠。
  novelty: >-
      E2 检索:cross_stddev(day_sum(Amt | Volume)) 与 cross_stddev(log(day_sum(·))) 在 4399 条去重存档里
      只有 1 条 —— 就是 C02 直接检验的 30 日变异系数本身(−0.35);97 个先验 head 里 cross_stddev 一条也没有。
      所以 60 日、241 日、对数形式、Volume 形式都是空白。与 97 个 head 的结构差别:
      不含价格水平、不含同步性、不含 I、不含刻度与一价日、不含排名平移,也不含开盘竞价成交额
      —— C02 A 组那 17 条 cross_regbeta(pow_1_5(day_first(Amt)), …, 241) 用的是开盘一分钟的成交额水平
      做年度回归(流动性的时间序列包装),本假设用的是整日成交额的时间离散度除以自身均值。
      预期残差后 |ρ| < 0.7:最近的邻居是 C01 的 head
      cross_scale(mul(signedpower(day_std(Volume)), day_first(Volume)), 241)(今天的量相对自身一年,+2.05),
      v7 的残差专门量这一点;其次是已知族本身,由 ρ已知 的实测把关(C02 读到 +0.04)。
