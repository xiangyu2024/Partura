- id: H5_vol_of_vol_ambiguity
  hypothesis: >-
    日内波动本身不稳定(分钟波动的波动大)的股票随后跑输 —— 信息越模糊,散户越容易过度反应。
  thesis:
    mechanism: >-
      用日内滚动 5 或 15 分钟的波动序列度量「这一天的波动是否稳定」,再取它的变异系数:系数大说明波动忽高忽低,
      当天的信息环境模糊(Brenner–Izhakian 2018 的 ambiguity:不是风险的大小,而是对风险本身的不确定)。
      模糊会放大过度反应 —— 投资者不确定该相信什么的时候更依赖情绪与关注,价格偏离更远,随后回落。
      变异系数把波动水平约掉,所以与奖励控制里的 cross_mean(day_std(Ret), 20) 正交。
      方正证券「云开雾散」在 A 股报的方向是做多低模糊;美股文献对模糊溢价的符号不一致,
      这里按 A 股取 −1,反号的处置写在 fails_if 里(先验)。
    counterparty: >-
      在模糊的信息环境里过度反应的散户;收钱的是能在模糊中定价、愿意承担「不知道风险有多大」这层不确定的资金。
    prediction: >-
      方向 sign = −1。机制成立按文件头的统一判据:不同构造的 core 是 {v1, v3}(5 分钟窗,日窗孪生)与 v2(15 分钟窗),
      两者都选 sign −1 且 > 0、其一 ≥ 0.5;另加 v9 < 核心、v8 ≥ 0.3。中位猜测 score 0.1–0.5
      (按 ±0.3 放宽即 −0.2 到 0.8),换手 0.02–0.03。本卡没有 I 的机械载荷(变异系数不带方向),但有刻度与开盘尖峰两个伪影。
      v1(5 分钟)与 v2(15 分钟)应同号;若只有一个为正,按噪声处理(valid 1.6 年,夏普标准误 0.8)。
      v4 / v5(日频的波动的波动)是同一句话的日频版:若它们明显强于 v1–v3,机制的时间尺度要改写成日频。
      v6(不归一的「波动的波动」)预期 ≈ 0 或被 ρ已知 拒 —— 它就是波动水平的另一种写法,奖励会把它拿掉。
      v10(非线性风格)是给 W2 的警示读数,预期过 0.5 的概率约 30%;它过线说明线性中性化的漏口不小,
      但不算 H5 成立。
      总领:P(v1–v3 任一 ≥ 0.5)≈ 25%,P(按统一判据成立)≈ 12%;方向 −1 的把握只有 ≈ 60%;
      v9(零收益分钟占比)|score| ≥ 0.5 的概率 ≈ 45%,v10 ≥ 0.5 的概率 ≈ 25%。
    fails_if: >-
      核心在 train 上选出 sign = +1 —— A 股的模糊折价方向反了。鉴于美股文献本身符号不一致,
      这时记成「反号发现」,但不记作本假设成立。
      v9(零收益分钟占比)≥ 核心 —— 读到的是粗刻度与无成交分钟的伪影:低价股在一个 tick 的网格上,
      滚动波动里会出现大量 0,变异系数被机械抬高。这是本假设最大的风险,因为 long_neutral 和 long 一样
      不套 untradable 掩码(E1 核实 steer.py:627 的元组里只有 long_tradable / long_bucket / long_marginal),
      刻度与价格水平也不在控制里。核心 ≥ 0.5 而 v9 也 ≥ 0.5 且同号时,一律按刻度伪影处理,不记作发现。
      v8(对日内峰度取残差)< 0.3 —— 它只是尾部,不是模糊性。
      v6 远好于 v1 —— 做功的是波动水平,机制陈述错。
      还要把 E1 的两条算子事实记在读数里:in_stddev_rolling 的前 d−1 个分钟是部分窗口(不是 NaN),
      所以每天开头几分钟的波动被系统性低估;分钟轴是 241 个连续编号的交易事件、午休不留空列,
      跨 11:30 / 13:00 边界的那十几个窗口把午休前后混在一起 —— 两者都让分母略偏,但对截面排名影响有限。
      总领补一条更大的:分钟波动是 U 形,开盘十几分钟的尖峰支配 day_std(in_stddev_rolling(·)),所以变异系数有一大块是
      「开盘波动有多集中」,即隔夜信息在开盘被消化的强度,不是全天的模糊性。核心过线时,W2 先核它与 |隔夜跳空|
      (C02 H2/v11,ρ已知 0.52、被拒)的相关;若高,H5 读到的是隔夜信息,而且后代有被 ρ已知 拒的风险。
  novelty: >-
      E2 检索:in_stddev_rolling(Ret, ·) 与 cross_stddev(day_std(Ret), ·) 在 4399 条去重存档里的匹配数为 0;
      该标签命中的 39 条全部是 day_kurt(Ret)(C01 R3 的「慢彩票形状」,最高 0.54,全部来自同两个运行)。
      97 个先验 head 里 in_stddev_rolling 与 cross_stddev 一条也没有。
      结构上不含价格水平、不含成交额、不含同步性、不含 I、不含刻度筛选(v9 是对照)、不含排名平移;
      唯一与先验族接触的地方是「波动」,而变异系数把水平约掉 —— 这正是它与控制变量、已知族分开的理由。
      预期残差后 |ρ| < 0.7:与它最近的先验 head 是 C01 的
      ts_product(cross_quantile_q25(pow_2(day_kurt(High)), 30), 50)(日内峰度的分位数,+1.23),
      v8 的残差专门读这一点;峰度是四阶的尾部,变异系数是二阶量的二阶矩,两者在构造上不同。
  variants:
  - {id: v1,  role: core,     expr: "cross_mean(div(day_std(in_stddev_rolling(Ret, 5)), day_mean(in_stddev_rolling(Ret, 5))), 30)", predicts: "过线,sign −1,score 0.1–0.5,换手 ≈ 0.03。5 分钟滚动波动的日内变异系数,再取 30 日均值。"}
  - {id: v2,  role: core,     expr: "cross_mean(div(day_std(in_stddev_rolling(Ret, 15)), day_mean(in_stddev_rolling(Ret, 15))), 30)", predicts: "与 v1 同号。15 分钟窗:更平滑、对单分钟的刻度跳动不敏感,所以它比 v1 更能区分「模糊」与「刻度伪影」。两者同号才算机制。"}
  - {id: v3,  role: core,     expr: "cross_mean(div(day_std(in_stddev_rolling(Ret, 5)), day_mean(in_stddev_rolling(Ret, 5))), 60)", predicts: "与 v1 同号,换手更低。若 60 日 ≥ 30 日,模糊是慢变的股票属性而不是当天的状态。"}
  - {id: v4,  role: ablation, expr: "div(cross_stddev(day_std(Ret), 30), cross_mean(day_std(Ret), 30))", predicts: "方向同核心,量级不定。日频版的「波动的波动」:30 天里日内波动的变异系数。若它明显强于 v1–v3,机制的时间尺度是日而不是分钟。"}
  - {id: v5,  role: ablation, expr: "div(cross_stddev(day_std(Ret), 60), cross_mean(day_std(Ret), 60))", predicts: "与 v4 同号,换手更低。v4 / v5 一起给出日频版的窗口曲线。"}
  - {id: v6,  role: ablation, expr: "cross_mean(day_std(in_stddev_rolling(Ret, 5)), 30)", predicts: "预期 ≈ 0 或被 ρ已知 拒。不归一的「波动的波动」:它与波动水平几乎同构,而控制里有 cross_mean(day_std(Ret), 20),残差应该不剩东西。v6 与 v1 的差就是「除以均值」这一步的全部价值。若被 GPU 版判为无信号(残差谱范数 < 1e-4),那是中性化生效。"}
  - {id: v7,  role: ablation, expr: "cross_mean(day_kurt(Ret), 30)", predicts: "弱(C01 在 long 下同族最高 0.54,且方向 −1)。日内收益峰度:尾部的厚度,不是波动的不稳定。作对比用。"}
  - {id: v8,  role: ablation, expr: "cs_regres(cross_mean(div(day_std(in_stddev_rolling(Ret, 5)), day_mean(in_stddev_rolling(Ret, 5))), 30), cross_mean(day_kurt(Ret), 30))", predicts: "≥ 0.3 才算新,< 0.3 = 不新。剔除日内峰度之后还剩多少 —— 回答「模糊性是不是只是厚尾」,也顺带剔了 C01 那条峰度 head 的方向。"}
  - {id: v9,  role: control,  expr: "cross_mean(day_zero_ratio(Ret), 30)", predicts: "不应 ≥ 核心。零收益分钟占比 = 刻度粗 + 无成交:本假设最像的伪影来源,而奖励不剔锁停股、刻度也不在控制里,所以它很可能自己就过线。它 ≥ 核心时,H5 的读数一律记为刻度伪影。"}
  - {id: v10, role: control,  expr: "abs_(cs_demean(cs_rank(cross_mean(day_std(Ret), 30))))", predicts: "过 0.5 的概率约 30%。控制变量的非线性函数(波动排名离截面中位数的距离):用来量线性中性化的漏口有多大(PLAN §4 局限 1)。它过线是给 W2 的警示 —— A 组 GP 很可能挖到这一类 —— 不是 H5 成立。"}

