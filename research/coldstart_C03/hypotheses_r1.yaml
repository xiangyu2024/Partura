    mechanism: >-
      区分流动性需求与信息:若上涨总是发生在放量日,说明价格是买方用成交量换来的 —— 他们需要即时性、支付冲击,
      这部分位移没有信息,随后回吐;若价格变动与成交额无关或反向(缩量时在动),位移更可能来自信息,会延续。
