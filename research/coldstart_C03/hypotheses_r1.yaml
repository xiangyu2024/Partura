# C03 第 1 轮假设(W1,主研写)。6 个假设,64 个变体 = B 组 64 次直接评估。
#
# 预算:B 组每种子的 GP 预算 = 192 − ⌈64/16⌉ = 188。57–64 个变体都只扣 4 次,所以写满 64。
# 本轮全部是 new,没有 improve 卡:新颖性在终局按残差量,同族改进不算新。
#
# 记号(YAML 里已全部展开,此处只为阅读):
#   I = log(div(day_last(Close), day_first(Open)))        盘中段收益(今收 / 今开),也是 C02 的 head 族
#   A = log(div(day_max(High), day_min(Low)))             日内对数振幅(无方向)
#   S = div(abs_(Ret), pow_05(Volume))                    分钟的价格冲击效率(每单位根号成交量推动的价格)
#
# 判据(PLAN §2.2 / §3,与 C01、C02 都不同,写 prediction 时已按它改口径):
#   奖励 long_neutral:原始面板 → 半衰期 0/5/20 平滑 → 截面 z 排名 → 每天对
#   [1, z(流动性 cross_mean(day_sum(Amt),30)), z(波动 cross_mean(day_std(Ret),20)),
#    z(20 日反转 div(day_last(Close), ts_delay(day_last(Close),20))), z(已知族 cross_mean(day_std(Amt),30))]
#   做 OLS 取残差 → 十分位纯多头书 → 扣 15bp。score = min(train, valid);score ≥ 0.5 = 发现;
#   与已知族的 |ρ| ≥ 0.5 直接拒。还原毛收益 = train_ann + 0.756 × 日换手(E1 已核对 0.003 × 252 = 0.756)。
#   残差之后不再平滑、不再排名(E1 核对 steer.py:633→636→639→642 之间没有别的处理)。
#   valid 约 1.6 年,夏普标准误约 0.8(train 约 0.5),所以单个变体过 0.5 只是弱证据:
#   每个机制都写了 3–4 个写法不同的 core,机制成立的证据是「≥ 2 个 core 同号为正」,不是任何单条读数。
#
# 自己定的硬规矩(C01 / C02 假象的来源,逐条避开):
#   不用 cs_first_* / cs_last_* / cs_mask_*(C01 的 60 个低 ρ 通过者里 52 个是它们平移造出来的);
#   不用 day_distinct_ratio / day_flat_ratio,day_zero_ratio 只能当 control(它们读的是锁停股与粗刻度股,
#     而 long_neutral 和 long 一样不套 untradable 掩码 —— E1 核实 steer.py:627 的元组里只有
#     long_tradable / long_bucket / long_marginal,刻度与价格水平也不在控制里,所以这类筛选在 C03 仍会拿分);
#   价格水平不作核心(只在 H1 当对照);Amt / Volume 只出现在相关系数或比值里,量纲必须被约掉
#     (唯一例外是总领加的对照 H6/v8:流动性排名离中位数的距离,是排名的对称函数,只作校准);
#   不用 ts_spearman / nt_*(环境禁用)、不用 ts_pearson(跨股票同步性一族在 C01 + C02 已用尽);
#   cross_* 窗口取 {3,5,10,15,30,60,241},ts_* 取 {1,5,10,20,30,40,50};cross_ema 的 d 是半衰期(E1 用阶跃函数实测)。
#
# 控制变量的选择:线性风格已被奖励拿掉,所以「只由流动性 / 波动 / rev20 / 已知族构成」的对照残差约等于 0、
#   什么也证明不了。全文只留 1 个这样的健全性锚(H1/v10 的振幅水平)。其余 control 都是奖励没拿掉的代理:
#   盘中反转 I(C02 head)、后复权价格水平、零收益分钟占比(刻度 / 一价)、非线性风格 |cs_demean(cs_rank(·))|。
#
# 执行交回(E1 / E2)里改变了写法的两条:
#   E1 实测 day_topw_mean(y, w) 在 |w| 的 0.9 分位为 0 时退化成 day_mean(y)(全天),而 S 在零收益分钟上恰好为 0
#     —— 所以按总领的交回规则,H2 加了一条严格取前 k 个分钟的写法(in_topk_masked_exact,E1 实测平局不会扩大选择),
#     它替换原定的「60 日窗口」消融;day_topw_mean 的平局退化值(等权均价 / VWAP)留作 H2/v11 的对照。
#   E1 实测 cross_corr / ts_corr 是同一个实现(逐位相同),成对剔除 NaN,分母恒 > 0,所以结构上永不返回 NaN:
#     常数窗口与前 d−1 天都被强制为 0.0 —— 覆盖率没有风险,H1 / H4 的 30 日保留为主写法(总领交回条件不成立)。
#   E1 的另一条要记在 H1/v10、H5/v6、H6/v8 上:GPU 版把「残差谱范数 < 1e-4」判为没有信号(参考实现是 1e-6),
#     所以这几条被判「无信号」时要记成「中性化生效」,不是读数失败。
#
# 我的事先预测:6 个假设里过线的中位数是 2(最可能是 H1、H4);P(0 个过线) 约 15–20%。
#   全部概率压在 25–35%:C02 的校准教训是「没测过的机制会过线」这类判断全错了。
#   另外两条校准读数:H1/v10(振幅水平)的 |score| < 0.3;H4/v12(C02 的 I 反转 head 本身)在中性化下 < 0.5(约 65%)。
#
# ── 总领审阅(W1,写在直接检验之前)────────────────────────────────────────────────
# 1. 盘中收益 I 的机械载荷(本机合成仿真,不含任何真实数据):分钟波动与成交量取 U 形、首分钟 Ret = 0、
#    开盘竞价成交量为离群点,价与量之间不放任何机制。在这样一个「没有机制」的世界里,30 日均值与均值 I 的截面秩相关:
#    cross_mean(RSJ) +0.80;in_demean 后的 RSJ(单日)+0.47;最高冲击 20 分钟均价 / VWAP(单日)+0.67;
#    等权均价 / VWAP(单日)+0.84;cross_mean(day_corr(Close, |Ret|)) −0.49;cross_mean(day_corr(Close, Volume)) −0.78;
#    day_corr(Ret, Volume) +0.04。奖励的控制里没有 I。所以:
#    · H2、H3 的 core(以及 H1 的 v1–v3,经「大振幅日的涨跌方向」)在 sign −1 下白拿盘中反转;它们过线只是弱证据,
#      对 cross_ema(I, 30) 的残差版才是机制读数 —— 残差版 < 0.3 记为「机制未被证明」,不只是「不新」。
#    · H1/v4、H4/v4 在 sign −1 下白亏盘中反转(做多的是高 I 的一端),已从 core 降为 ablation,不计入机制判据;
#      H4 的日内构造改由 I 残差版 v10 承担(升为 core)。C02 的 CPV −0.92 与这个机械方向一致。
# 2. 统一的机制判据(替换各卡里「≥ 2 个 core 同号为正」的说法):
#    (a) 至少 2 个「不同构造」的 core 在 train 上选出预期方向且 score > 0,其中至少 1 个 ≥ 0.5;
#        只差窗口的孪生(30/60 日、cross_stddev 与 std(log) 这种单调变换)算 1 个构造;
#    (b) 该卡的关键剔除读数过关(H1–H4:I 残差版 ≥ 0.3 且同向;H5:v9 < 核心且 v8 ≥ 0.3;H6:v7 ≥ 0.3 且 v6、v10 < 核心);
#    (c) 方向否决:不同构造的 core 多数选出相反方向,或任何 ≥ 0.5 的 core 选出相反方向,本假设即否(可记反号发现)。
#    「残差版 < 0.3 = 不新」只在对应 core ≥ 0.5 时才有判读意义;core 本身没过线时,残差读数只报不判。
# 3. 改了的变体:H1/v4 core→ablation;H4/v4 core→ablation、H4/v10 ablation→core;
#    H6/v4 由成交量版 CV(与 v2 几乎同一个量)换成「对数成交额日变化的 60 日标准差」(交替,而不是水平离散);
#    H6/v8 由不归一的成交额标准差(残差必然≈0、多半被 ρ已知 拒,信息量低)换成「非线性流动性」对照,与 H5/v10 成对。
#    变体总数不变(64),预算不变。
# 4. 总领的事先预测见各卡 prediction 末尾的「总领:」一句,汇总:任一 core ≥ 0.5 的假设数中位 2(H3 ≈ H1 > H2 > H6 > H4 > H5);
#    按上面 (a)+(b) 判为机制成立的中位 1,P(0 个) ≈ 35%。

hypotheses:

# ─────────────────────────────────────────────────────────────────────────────
- id: H1_price_conditional_range
  hypothesis: >-
    同一只股票在相对高价的日子振幅更大(价格与振幅在时间上正相关)的,随后跑输;
    低价日振幅更大的(恐慌后有人承接),随后跑赢。
  thesis:
    mechanism: >-
      振幅度量分歧。重要的不是振幅有多大(那是波动,奖励的控制变量里已经有),而是分歧出现在价格的哪个位置。
      分歧集中在高位,说明上涨是靠不断提高报价从追涨者手里换来的,持有者正在用高振幅派发;
      分歧集中在低位,说明下跌中有资金在承接。相关系数把价格与振幅两条腿的量纲和水平都约掉,
      只留下这个「配对关系」,所以它既不是价格水平也不是波动水平。开源证券的「理想振幅」是同一思路的日频实现(先验)。
    counterparty: >-
      在高位追涨的散户与动量资金:他们在高振幅的高价日接走派发盘,支付了全部的冲击成本与随后的回落;
      收钱的是在低位高振幅日承接、并愿意等几周的资金。
    prediction: >-
      方向 sign = −1(做多相关系数低的一端)。机制成立按文件头的统一判据:不同构造的 core 是 {v1, v2}(振幅,窗口孪生)
      与 v3(日内标准差),两者都选 sign −1 且 > 0、其一 ≥ 0.5,并且 v9(I 残差)≥ 0.3 且同向。
      中位猜测 score 0.3–0.9(按 ±0.3 放宽即 0.0–1.2),换手 0.02–0.04。
      v2(60 日)的换手应低于 v1,净分 ≥ v1;窗口单调性 v5(15 日) < v1 ≤ v2。
      v3(把振幅换成分钟收益的日内标准差)与 v1 同号 —— 两种振幅度量同号才算机制,而不是某个度量的特性。
      I 的机械载荷:大振幅日的涨跌决定了它之后的价格高低,所以 corr(价, 振幅) 带着「大日子的方向」,
      sign −1 白拿一部分盘中反转 —— v9 是本卡的关键读数。
      v4(日内版)已降为 ablation:U 形分钟波动让它在无机制时就与均值 I 秩相关 −0.49,sign −1 白亏盘中反转,不计入判据。
      健全性锚 v10(无条件的振幅水平)的 |score| < 0.3。
      v11(后复权价格水平)可能过线,它是 C02 的 head 族,不算本假设成立;核心必须高于它才有增量。
      总领:P(v1–v3 任一 ≥ 0.5)≈ 45%,P(按统一判据成立)≈ 30%;过线时 sign −1 的概率 ≈ 80%;v9 约为 v1 的 50–80%。
    fails_if: >-
      核心在 train 上选出 sign = +1(做多「高价日振幅大」的一端;按统一判据 (c):{v1, v2} 与 v3 多数选 +1,
      或任一 ≥ 0.5 的 core 选 +1)—— 派发的机制陈述反了,本假设即否;反号过线可以记为发现,但不能说成机制成立。
      v4 选 +1 不触发这一条:它的方向由 U 形波动与 I 的机械关系决定。
      v7(把价格条件换成当天涨跌方向 I)≥ 核心 —— 读到的是「涨跌日的波动不对称」,那是 H3 的地盘,不是价格位置。
      v8(把振幅换成成交额)≥ 核心 —— 读到的是「高价日放量」,即流动性的时间序列包装(C02 A 组用开盘竞价成交额
      做年度回归的那一族 1.3–1.7 已经占了这块),不是分歧。
      v10(无条件的振幅水平)与核心同样好 —— 读到的是波动,并且说明线性中性化漏了波动。
      v9(对 C02 的 I 反转 head 取残差)< 0.3 而核心 ≥ 0.5 —— 核心读到的是盘中反转的机械载荷:机制未被证明、也不新,
      W2 不为它设计种群。
      不同构造的 core 只有 1 个为正、另一个 ≈ 0 —— 按 valid 1.6 年、夏普标准误 0.8 的口径当作噪声,不记作机制成立。
  novelty: >-
      E2 在 c01 / c02 两组 4399 条去重存档里按结构检索 cross_corr / ts_corr,只有 26 条,最高 1.24,
      而那一条是「cross_corr(day_pos_ratio(Open), day_ar1_coefficient(Ret), 3) + cross_ema(day_last(Amt), 60)」
      —— 做功的是后面那个流动性加法项;没有任何一条是「价格水平 × 振幅」的结构。97 个先验 head 里
      cross_corr / ts_corr / day_corr 的出现次数为 0。结构上:核心不含价格水平本身(v11 是对照)、
      不含同步性 ts_pearson、不含 I、不含刻度与一价日筛选、不含排名平移、不含开盘竞价成交额
      —— 与 E2 给出的七个族标签(F_mask / F_tick_pricevol / F_sync / F_intraday_rev / F_price_level /
      F_open_amount / F_reg)都不重合。预期取残差后 |ρ| < 0.7 的理由:相关系数的截面排名由配对关系决定,
      而先验 head 的排名由水平决定(流动性水平、价格水平、同步性)。唯一的风险是高价股长期振幅也大,
      使 v1 带上价格水平的成分 —— v9(对 I 的残差)与 v11(价格水平的可比尺子)两条读数专门量这一点。
  variants:
  - {id: v1,  role: core,     expr: "cross_corr(day_last(Close), log(div(day_max(High), day_min(Low))), 30)", predicts: "过线,sign −1,score 0.3–0.9,换手 ≈ 0.03。30 个交易日里收盘价水平与当日对数振幅的相关。E1 核实 cross_corr 永不返回 NaN(常数窗口与前 29 天强制为 0.0),覆盖率无风险,所以 30 日留作主写法。"}
  - {id: v2,  role: core,     expr: "cross_corr(day_last(Close), log(div(day_max(High), day_min(Low))), 60)", predicts: "过线且 ≥ v1,换手更低。60 日让相关系数更稳,也把成本摊薄;若明显弱于 v1,说明这是一个月尺度的状态而不是股票属性。"}
  - {id: v3,  role: core,     expr: "cross_corr(day_last(Close), day_std(Ret), 30)", predicts: "过线,与 v1 同号。把振幅换成分钟收益的日内标准差(E1 核实 day_std 是总体标准差、跳过 NaN)。两种振幅度量同号,才是机制而不是 High / Low 这两个极值点的特性。"}
  - {id: v4,  role: ablation, expr: "cross_mean(day_corr(Close, abs_(Ret)), 30)", predicts: "(总领由 core 降为 ablation)日内版:大的分钟波动是否出现在当天价格的高处。但分钟波动是 U 形(开盘尖峰),上涨日的大波动机械地落在低价处,无机制仿真里它与均值 I 的秩相关 −0.49:sign −1 做多的是高 I 一端、白亏盘中反转。预期 score < 0.3,或 train 选 +1 —— 那是 I,不是派发;不计入机制判据。它与 v1 的差距用来量 U 形伪影有多大。"}
  - {id: v5,  role: ablation, expr: "cross_corr(day_last(Close), log(div(day_max(High), day_min(Low))), 15)", predicts: "弱于 v1:15 个点的相关系数噪声大、换手高。用来画窗口曲线,顺带检查成本。"}
  - {id: v6,  role: ablation, expr: "cross_corr(day_mean(Vwap), log(div(day_max(High), day_min(Low))), 30)", predicts: "与 v1 接近。条件腿换成当日均价,排除「用的是收盘价这个特定时点」的可能;若明显弱于 v1,做功的是收盘价相对全天的位置,机制要改写。"}
  - {id: v7,  role: ablation, expr: "cross_corr(log(div(day_last(Close), day_first(Open))), log(div(day_max(High), day_min(Low))), 30)", predicts: "弱于核心。条件换成当天的涨跌方向而不是价格位置。若它 ≥ 核心,读到的是涨跌日的波动不对称(H3 的地盘),H1 的「价格位置」陈述不成立。"}
  - {id: v8,  role: ablation, expr: "cross_corr(day_last(Close), day_sum(Amt), 30)", predicts: "弱于核心,且可能被 ρ已知 拒。把振幅换成成交额:若它 ≥ 核心,读到的是「高价日放量」,是流动性的时间序列包装,不是分歧。"}
  - {id: v9,  role: ablation, expr: "cs_regres(cross_corr(day_last(Close), log(div(day_max(High), day_min(Low))), 30), cross_ema(log(div(day_last(Close), day_first(Open))), 30))", predicts: "≥ 0.3 才算新,< 0.3 = 不新。对 C02 的 I 反转 head 取截面残差 —— 直接检验不报与先验 head 的 ρ,残差是唯一读法。E1 核实 cs_regres 是带截距的逐日 OLS 残差、不对回归元取排名,所以这是一次偏弱的剔除:它过关不等于终局的 |ρ| 一定 < 0.7。"}
  - {id: v10, role: control,  expr: "cross_mean(log(div(day_max(High), day_min(Low))), 30)", predicts: "全文唯一的健全性锚,预期 |score| < 0.3。它与 C02 H1/v13 逐字相同,那次 ρ已知 = +0.53、被相关度拒绝,所以这次多半也标「被相关度拒绝」;直接检验仍报它的 score,读 score 即可。无条件的振幅水平就是波动,控制变量里有 cross_mean(day_std(Ret), 20),残差应该几乎什么都不剩。它若被 GPU 版判为「无信号」(E1:残差谱范数 < 1e-4),那是中性化生效的证据,不是读数失败。"}
  - {id: v11, role: control,  expr: "log(day_last(Close))", predicts: "可能过线,但不算本假设成立。后复权价格水平是没被中性化掉的风格(C02 的 head div(day_last(Close), day_sum(pow_3(log(Close)))) 2.24、cross_ema(cross_scale(day_last(Close), 15), 241) 1.58 都在这一族)。它的作用是给核心一把可比的尺子:核心若只有它的水平,H1 没有增量。"}

