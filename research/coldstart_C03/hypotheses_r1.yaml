- id: H3_signed_variance_asymmetry
  hypothesis: >-
    日内已实现方差里由上涨分钟贡献的占比越高,随后越跑输;由下跌分钟贡献的占比越高,随后越跑赢。
  thesis:
    mechanism: >-
      把一天的分钟平方收益按收益符号拆开:上行占比高,说明这天的波动是正向跳 —— 公众可见的上冲、彩票型的回报形状,
      偏好这种分布的投资者愿意为它多付钱,溢价随后回落;下行占比高,说明波动来自抛售,价格被压到折价,随后修复。
      它是一个纯形状量:方差的总量在分母里被约掉,值域 [−1, 1],所以与奖励控制里的波动水平正交。
      Bollerslev–Li–Zhao 2020 的 RSJ、A 股的「下行波动占比」是同一个量(先验)。
    counterparty: >-
      为彩票型分布付钱、追最近有过正向跳的散户;收钱的是在抛售中承接、承担了下行波动的资金。
    prediction: >-
      方向 sign = −1。机制成立按文件头的统一判据:不同构造的 core 是 {v1, v2}(窗口孪生)与 v3(去当日漂移),
      两者都选 sign −1 且 > 0、其一 ≥ 0.5,并且 v8(I 残差)≥ 0.3 且同向。中位猜测 score 0.2–0.6
      (按 ±0.3 放宽即 −0.1 到 0.9),换手 0.02–0.03。
      I 的机械载荷:无机制仿真里 cross_mean(RSJ) 与均值 I 的秩相关 +0.80 —— sign −1 白拿盘中反转,core 过线只是弱证据。
      v3(先用 in_demean 去掉当日漂移)与 v1 同号;in_demean 只去掉「高斯漂移」那一部分(仿真里单日秩相关由 +0.80
      降到 +0.47),肥尾大分钟构成当天涨跌的那部分 I 载荷还在,所以 v3 不能代替 v8。
      若 v3 明显更强,说明做功的是形状而不是当天涨跌,机制更干净。
      v5(净路径 / 总路径)是「当天涨跌方向」的粗化版,应被盘中反转吸收、弱于核心。
      v6(日内偏度)按 C01 在 long 下的 +0.2 预期弱;v9(对偏度取残差)≥ 0.3 才说明它不只是偏度。
      v7(10 日)用来看成本:窗口短、换手高,净分应低于 v1。
      总领:P(v1–v3 任一 ≥ 0.5)≈ 45%(高频偏度 / RSJ 是 A 股文献里最稳的高频因子之一,再加上白拿的 I),
      P(按统一判据成立)≈ 30%;过线时 sign −1 的概率 ≈ 85%;v9(偏度残差)< 0.3 的概率 ≈ 55%。
    fails_if: >-
      核心在 train 上选出 sign = +1(做多上行方差占比高者)—— 彩票溢价的方向反了,本假设即否。
      v10(只数上涨分钟个数、不看幅度)与核心同样好 —— 读到的是涨跌分钟占比,它对刻度与一价日敏感
      (C01 的 cs_first_low20(day_open(Amt), day_pos_ratio(Ret)) 2.25 就在这一族),不是方差的不对称。
      v8(对 I 反转 head 取残差)< 0.3 而核心 ≥ 0.5 —— 它只是盘中反转换了一张脸:机制未被证明、也不新。
      v9 < 0.3 —— 它只是日内偏度,不是符号不对称。
      覆盖率异常低 —— E1 实测 day_signed_ratio(Ret, pow_2(Ret)) 在整天 Ret 恒为 0 时分母为 0、输出 NaN,
      锁停与零成交日会掉格子;若覆盖率 < 0.9 被门槛废掉,以 v3 的读数为准(in_demean 之后极少出现整天恒等)。
  novelty: >-
      E2 检索:day_signed_ratio 全库 68 条,其中第一个参数是 Ret 的 23 条、过 0.5 的 3 条;
      但第二个参数是 pow_2(Ret) 的 0 条 —— 那 23 条全是 High / Low / Close / Vwap / Amt / Volume 做权重,
      读的是「成交额或价格在涨跌分钟之间的分配」,没有一条是已实现方差的符号拆分。
      97 个先验 head 里 day_signed_ratio 一条也没有。结构上不含价格水平、不含成交额(v4 是消融)、
      不含同步性、不含刻度筛选、不含排名平移、不含开盘竞价成交额。预期残差后 |ρ| < 0.7 的理由:
