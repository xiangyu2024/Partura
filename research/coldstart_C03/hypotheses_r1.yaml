  - {id: v1,  role: core,     expr: "div(cross_stddev(day_sum(Amt), 30), cross_mean(day_sum(Amt), 30))", predicts: "过线,sign −1,score 0.1–0.5。日成交额的 30 日变异系数。C02 在 long 下读到 −0.35、ρ已知 +0.04:本轮读的是同一条在中性化之后的分数,也是 H6 的基准。"}
