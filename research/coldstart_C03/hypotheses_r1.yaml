  - {id: v3,  role: core,     expr: "cross_stddev(log(day_sum(Amt)), 60)", predicts: "与 v2 同号。对数成交额的标准差:同样无量纲(乘性缩放不变),但不受巨量日的长尾主导。若它明显强于 v2,比值形式只是对数形式的粗近似。"}
  - {id: v4,  role: core,     expr: "cross_stddev(ts_delta(log(day_sum(Amt)), 1), 60)", predicts: "(总领替换原成交量版变异系数:60 日内价格变化很小,它与 v2 几乎是同一个量)与 v2 同号,score 0.0–0.5。对数成交额逐日变化的 60 日标准差:量的是「今天对昨天」的忽冷忽热(交替),而 v1–v3 量的是 60 日里的水平离散,后者把成交额的慢趋势(关注度在升或在降)也算了进去。对数正态 AR(1) 下 std(Δlog) = 水平离散 × √(2(1 − φ)),所以两者在持续性 φ 上分家。零成交日 log 得 −inf,本机核过 cross_stddev 会把含它的窗口给成 NaN(覆盖率略降,不会伪造信号),与 v3 相同。"}
