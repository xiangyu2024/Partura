- id: H2_smart_money_minutes
  hypothesis: >-
    单位成交量推动价格最多的那些分钟代表知情的激进交易;这些分钟的均价低于全天 VWAP(知情者在低位吸筹)的股票,随后跑赢。
  thesis:
    mechanism: >-
      用 |分钟收益| / 根号(分钟成交量) 度量一分钟的价格冲击效率,最高的那些分钟是有信息、愿意付冲击的激进单。
      把这些分钟的均价与全天 VWAP 相比,得到一个围绕 1 的无量纲比值:小于 1 说明激进交易发生在当天的低价区,
      是吸筹;大于 1 说明激进交易在高价区,是派发。随后几周价格向知情的那一侧移动。
      机制要求的只是「选哪些分钟」,成交量只进入选择与根号归一,量纲在比值里被约掉。
      开源证券 2019 的聪明钱因子是同一构造(先验)。
    counterparty: >-
      在当天高价区被动成交的散户与跟风资金 —— 他们成交在知情者的对面;
      因子做多的那一侧,就是知情资金正在低位买入的股票。
    prediction: >-
