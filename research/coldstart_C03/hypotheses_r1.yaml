  - {id: v2,  role: core,     expr: "cross_mean(day_signed_ratio(Ret, pow_2(Ret)), 60)", predicts: "与 v1 同号,换手更低。若 60 日 ≥ 30 日,说明符号不对称是慢变的股票属性而不是短期状态,W2 应优先用长窗。"}
