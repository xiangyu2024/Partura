  - type: N
    hypothesis: >-
      机制:「流动性供给的补偿随市场状态翻转」。分钟收益的一阶自相关 day_autocorr_n1(Ret) 为负时是买卖价差反弹 / 被动做市式的反转,为正时是订单拆分 / 动量式的单边流;
      它的 60 日均值是个股的慢变微观结构属性。供给流动性(反转型)的票,风险补偿在市场压力大(波动高、成交放大)时为正、平静时被竞争压到零甚至为负(Nagel 2012 对短期反转的状态依赖,
      Chordia 等)。本批 head 与共性都围绕这类日内形状:day_autocorr_n1(Ret)(+1.08)与其 20 日波动 ts_stddev(day_autocorr_n1(Ret), 20)(+1.16)是富集子树,
      而 3 个 ar1 head 则是固定符号的价格 ar1 水平,分数全负、换手高。这一位的做法不同:用 Partura 的 cs_flip_by_state(y, g) 把符号交给市场状态
      (g 的全市场均值相对过去 241 日中位数高 / 低,高时取 +rank(y)、低时取 −rank(y)),状态用成交额 day_sum(Amt)、波动 day_std(Ret)、市场收益 day_sum(Ret)
      三种;y 则取 autocorr / gini / es_ratio / 封死跌停频率 / 价格栅格粗细的 20–60 日慢聚合,或对成交额回归的相关。若 y 在某一状态不起作用,翻转版会明显更差,
      这本身就是检验。与库里的不同:库里没有任何 cs_flip_by_state / cs_state_rank 的结构(新算子),所有 head 与 5583 条库表达式都是固定符号;
      两个库全部骨架已被禁止。样本外为什么还在:市场压力与流动性补偿的关系是微观结构上的持续现象,不依赖某段行情;状态只用到 t 日及以前(trailing 241 日中位数,不含未来),
      因子在状态切换日整体翻号,换手略升但 y 本身用 20–60 日均值,日内慢变。数学检查:cs_flip_by_state 的状态无定义日给缺失而不是静默的「低」;day_autocorr_n1 在常数分钟序列
      (一字板)可能缺失或为 0,聚合只覆盖有效日;其余算子无除以近零量,窗口 ≤ 241 日,热身 1 年不主导;无前视。
    inspired_by: '本批 candidates 共性表里 day_autocorr_n1(Ret)(+1.08)与 ts_stddev(day_autocorr_n1(Ret), 20)(+1.16),以及 3 个 ar1 head 全部为负分、固定符号、高换手的现象'
