  - type: E
    core: 'day_at_max_ratio(Vwap)'
    hypothesis: >-
      核心 day_at_max_ratio(Vwap) = 当天分钟 Vwap 等于当天最高 Vwap 的分钟占比。正常日接近 1/240,涨停被封死(价格钉在日高)的日子接近 1,
      所以它读的是「当天被封在顶部的时间」,即涨停板事件。本批 226 个候选里含它的 21 个均值比不含的高 +1.32(p 0.000),含 inv() 的 20 个高 +1.26,
      是本批富集最强且与流动性 / 波动 / 市值控制不是同一个东西的子树(核心与 5 个控制的日度秩相关应不高,由相关表核对)。alpha 的来源:A 股散户的涨停追逐与彩票偏好
      (Bali 等的 MAX 效应),封板频率高的票有被追高后的回吐、或封板后的惯性,两者随市场状态和板块涨幅限制不同而符号不同,所以只做固定符号的 head(例如 Pr1a 的
      cross_regbeta 与 inv 写法)都不稳。以前的候选(Pr1a)只把它放在 cross_regalpha / inv / regbeta 的 241 日回归里,这一轮的外围完全换成:
      (a)事件频率的慢聚合与快慢差(cross_mean、cross_ema、5 日 vs 60 日,读「近期封板突然增多」);(b)对波动做 60 日回归残差,去掉「波动大自然触顶」的机械成分;
      (c)规模内 / 线性去规模(cs_bucket_demean、cs_regres 对 LogFloatCap),因为小盘封板更多;(d)与滞后 1 日收益的 60 日相关(cross_delay,只取过去)与按近 20 日涨跌符号
      翻转(追涨 vs 抄底两种封板);(e)和 day_at_min_ratio(Vwap)(封死跌停)相减,把涨停与跌停分开;(f)封板频率的波动 cross_stddev。
      这些都是库里没有的外围:库里含该核心的候选只出现 regbeta / regalpha / inv 的写法,两个库全部骨架已被禁止,GP 只能往新结构外长。
      样本外为什么还在:涨跌停制度与散户偏好是制度性的、与某一段行情无关;用 20–60 日聚合后名次慢变、换手低(本批 head 亏的主因是换手,这里直接用慢聚合)。
      数学检查:day_at_max_ratio 在有效分钟少于 2 时缺失,停牌日是缺失不是 0;取值在 [1/241, 1],无除以近零量;只用 t 日及以前的数据,cross_delay 取过去值;
      窗口 ≤ 120 日,热身不主导;封板稀少的票大多数日子是 1/240 的常数,聚合后靠少数事件区分,这是预期而非伪影。
