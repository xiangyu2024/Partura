    reasons: '相关度表(corr_1.md)核对:核心 day_at_max_ratio(Vwap) 对快照 9 个 head 的原始 |ρ| 最大 0.42(ts_decay_linear(sigmoid(pow_05(sigmoid(day_ar1_coefficient(Vwap)))),30)),残差 0.22,与 head 不是同一个东西;对 5 个控制的原始 |ρ| 为 liq 0.52、known 0.51、size 0.42、vol 0.09、rev 0.11。E 位的门槛(核心与每个控制 |ρ| < 0.8)通过。liq 与 known 处在表里自己定义的「≥0.5 = 控制变量换个写法」线上,所以创新度给 3 不给 4。12 个外围种子对 head 的原始 |ρ| 最大是 seed 1 的 0.48,远低于 0.7 的自动划掉线;对控制的最大 |ρ| 是 seed 6 的 known 0.41 与 liq 0.35,没有任何种子触发 0.8。核心确实是 loc.md 共性表里含它的 21 个候选、均值差 +1.32 的子树;历轮核心是 r1 的 day_kurt 与 r2 的 day_median(Amt),所以本核心在整个实验中只用一次 E,没有超过 2 次。合理度给 4:机制清楚(A 股涨跌停封板的彩票偏好 / MAX 效应,以及封板后的惯性或回吐)。算子逐个核对:day_at_max_ratio 在有效分钟少于 2 时缺失、取值在 [1/n, 1] 之间、不除以近零量(ops_ext.py:580);cross_zscore 有「标准差相对窗口量级小于 1e-6 时记 0」的守卫(ops_ext.py 约 208 行起),常数窗口不会爆点;cross_regres(x, y, 60) 是 rolling_ols 对 y 回归 x 的残差,这里 y 是核心、x 是 day_std(Ret),即核心对 60 日波动的残差,分母来自波动,与 PI 写的「对波动做 60 日回归残差」一致;cross_corr 的分母是 sqrt(var_x var_y)+EPS,核心在窗口内常数时分子也近零,输出为 0 而非缺失。扣分但不构成数学问题、不挡:(1) 在 Vwap 上,「价格钉在日高」的分钟与「成交停滞、VWAP 不动」的分钟都计入同一个占比,liq 控制 0.52 说明它可能部分是流动性的代理;PI 写的「与 5 个控制的日度秩相关应不高」与相关表不符(liq 0.52、known 0.51)。(2) 核心的日度原始面板 distinct 只有 0.073,大部分日子是 1/n 的常数,表里标为「废品」。这是事件计数型算子的固有结构,不是数值伪影;种子经 20 到 120 日聚合后 distinct 都在 0.998 以上,不是常数面板,所以不适用 §4 的「面板几乎是常数」。(3) seed 9 的 sub(at_max, at_min) 在两侧都是 1/240 的票上差为精确 0(distinct 0.48,表里标「废品」);这些票并列靠股票列序打破,§4 明确说这不是问题,不划。(4) 没有种子与库里的骨架相同的迹象(核心的已见外围都是 regbeta / regalpha / inv 写法,本批的种子都是 mean / ema / regres / bucket 的外层),骨架是否被库禁止由 c06_check 判,不在本次审计内。如果它有 alpha,最可能来自:涨跌停制度下的彩票偏好与封板后的惯性或回吐,在 20 到 60 日的慢聚合里表现为封板频率高的票的名次;其次是流动性或停滞交易的溢价,这一点需要在残差里检验。'
  - slot: b
