    reasons: '相关度表核对:10 个 N 种子对快照 9 个 head 的原始 |ρ| 全部在 0.16 以下(最大 seed 7 与 seed 10 的 0.16),残差同样不高;对 5 个控制的原始 |ρ| 最大是 seed 7 的 liq 0.15 与 known 0.14,没有种子触发自动划掉。快照里没有任何 day_autocorr 结构的 head(3 个 ar1 head 都是 day_ar1_coefficient 价格路径的 AR(1) 系数,不是分钟收益的一阶自相关),所以 y 的来源与 head 不同。创新度给 4:y 用的 day_autocorr_n1(Ret) 是 loc.md 共性表里 +1.08 的子树,库里有 10 个含它的候选,所以 y 本身不算新;但 cs_flip_by_state(ops_ext.py:562,新算子)把符号交给市场状态,这一结构不在库的 5583 条骨架里,与 head 的 |ρ| 低,不是换写法。合理度给 4:机制清楚(流动性供给的风险补偿随市场压力翻转,Nagel 2012 对短期反转的状态依赖),算子核对:cs_flip_by_state 的状态是全市场截面均值在自身过去 241 日(含当天,只用 t 及以前,无前视)的分位,高于 0.5 取 +(rank(y)-0.5),否则取负;状态未定义时给 NaN 而不是静默取低;y 是 20 到 60 日均值,慢变。数学提醒,不挡:(1) day_autocorr 的分母是 sqrt(var_t·var_lag + 1e-8)(dt_day.py:333 起),分母下限是 1e-4,所以低波动票的自相关会向 0 收缩,常数分钟序列(一字板)返回 0 而不是缺失。表里 vol 控制的原始 |ρ| 在 0.001 到 0.048 之间,目前不是主导,但低波动票会被系统地压向中间,值得在残差里看一眼。(2) cs_flip_by_state 的状态在前 241 日是扩张窗口的分位(rolling_windows 前端补 NaN,而 _trailing_rank 只数有限值),所以 2018 年前一年的状态是按不足 241 日算的。这不是前视,也不是缺失,但与 PI 写的「热身 1 年不主导」说法不完全一致,是轻微的定义问题。seed 1 与 seed 10 共用同一个 y、只换状态 g(Amt 与 Ret),不是重复,保留。如果它有 alpha,最可能来自:做市与订单拆分的流动性补偿在市场压力高与平静时符号翻转,即状态依赖的微观结构反转。'
R:
  - head: 'ts_decay_linear(sigmoid(pow_05(sigmoid(day_ar1_coefficient(Vwap)))), 30)'
    soundness: 3
    reasons: '合理度给 3。数学没有问题:day_ar1_coefficient(dt_day.py:367 起)在方差近零时返回 NaN,对价格路径的 AR(1) 系数有定义;外层 sigmoid 与 pow_05 都是单调变换,去掉它们的变体与原 head 的 |ρ| 在 0.8 到 0.95 之间,说明多余部件的替换是合理的,不是换个东西。扣分:机制没写清。VWAP 的 AR(1) 系数在近单位根的价格路径上主要反映趋势与价格栅格,「分钟级持续还是反转」的符号含义没有给出;「换 Close、High 略好」以及 30 到 15 日窗口的选择都是事后拆解得到的,只能当作口径选择,不是机制证据。6 个变体机制相同,只评一次。'
  - head: 'cross_mean(sigmoid(sigmoid(day_ar1_coefficient(Low))), 3)'
    soundness: 3
    reasons: '合理度给 3。数学没有问题,同上一组的 AR(1) 系数定义。扣分:机制与上一组相同、没有新的解释;两层 sigmoid 是冗余的(拆解表敲掉只差 −0.01);Low 换 High、窗口 3 换 6 或 10 都是事后选择,且 3 日均值对 AR(1) 系数偏噪,窗口太短本身就是不稳的理由。变体 cross_mean(day_ar1_coefficient(High),6) 与原 head 的原始 |ρ| 0.73,对 R 规则的 0.5 替换线成立。6 个变体机制一致,只评一次。'
summary: 'a 位创新 3、合理 4,b 位创新 4、合理 4,两位都通过,0 个种子划掉;两个 R 组合理度都是 3,都放行。提醒三点:(1) day_at_max_ratio 在 Vwap 上把涨停封板与成交停滞混在同一个占比里,liq / known 控制 |ρ| 约 0.5,PI 的「不高」说法不成立;(2) day_autocorr 的 1e-8 分母下限会使低波动票的自相关向 0 收缩,一字板返回 0 而非缺失;(3) cs_flip_by_state 前一年的状态是扩张窗口分位,无前视但热身定义与 PI 说法有出入。'
