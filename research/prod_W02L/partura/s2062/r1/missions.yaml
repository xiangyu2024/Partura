    hypothesis: |-
      机制:核心 C 是「当天分钟收益(减去滚动回归的常数部分后)除以当天分钟波动」的峰度,也就是已经按自己当天波动归一化过的日内尾部厚度:少数几个分钟的跳动是否远大于日内常态。归一化之后它不含波动水平,只含形状,所以对波动、流动性、市值三个水平控制先天低相关。依据在本批拆解表里:三个 head 都是这一族,方向都是 −1,分数 −1.74 到 −4.22,其中以 C 为底的峰度 head 最好(−1.74,train −1.35 / valid −1.74),把 20 日均值拉到 10 日或 40 日只在 −2 上下变动(−1.98 / −2.33)。我的推断(没有毛收益数):形状本身两段都稳定地亏、窗口改了分数几乎不动,说明毛超额约为 0 或很小,亏的主要是换手成本,而且这个底每天重新估一次、噪声很大。所以这一位不改核心,只换外围:让核心变慢、变成个股自己的对照、或把它里面混进的水平 / 方向拆出来。
      以前见过的含 C 的外围只有 ts_mean(20 / 10 / 40) 这一种(整体是一个等权滚动均值)。这里的种子外围全是别的算子家族:cross_zscore(自己 120 日 z 分数,个股自己做对照,只读「最近比自己平时更尾部」)、cross_ema(指数衰减,近期权重高)、短均值减长均值(尾部厚度的变化)、cs_bucket_zscore / cs_bucket_demean(在成交额、市值十分位内比较,拿掉尾部厚度与规模的共同部分)、cross_regres(对日内波动取 60 日滚动残差,读「同样的波动下尾部是否更厚」)、cross_corr(尾部厚度与当日收益 / 前一日收益的 60 日滚动相关:厚尾是否伴随下跌,是惊吓型还是追涨型)、乘以过去 20 日收益方向的符号(分开跌时厚尾与涨时厚尾)、cross_stddev(尾部厚度自己的波动,即「尾部是否时有时无」,换手慢)、cs_regres(对同族的偏度取截面残差,只留峰度里与偏度无关的部分)。
      为什么和库里不同:本批库里的 head 全部是 ts_mean(day_kurt / day_skew(Z), 20) 或 day_pdf_tail_sum_m 的写法;两个库 5583 条的骨架已逐个与种子对照(这里的外围含 cross_zscore / cross_ema / cross_corr / cross_regres / cs_bucket_* / cross_stddev 与 day_std(Ret)、day_sum(Ret)、day_sum(Amt) 等,骨架都带这些东西,与 ts_mean(day_kurt(Z)) 的骨架不同)。
      为什么样本外还会在:这类 alpha 的来源是「个股的日内尾部事件」这种行为与微观结构特征(散户脉冲、大单拆单、涨跌停附近的挤兑)的慢变属性,名次在数周里保持;窗口 60 到 120 日、EMA、自身 z 分数都降低换手,15 bp 下才有可能活下来;相关与回归类种子的机制是惊吓型与追涨型分开,不依赖某段行情。风险:纯形状信号两段都为负,这一位大概率仍出不了 head;若所有种子都亏在换手,下一轮不再押 C,转 N。
      数学检查:分母 in_stddev_full + 1e-6 在整天不动(停牌 / 封板)时为 0 + 1e-6,分子也为 0,所以 Z 为 0 而不是爆点;day_kurt 对常数行给 NaN 或 0,不会炸;cross_regres / cross_corr 窗口里有效对太少时可能返回 0(已知缺陷),只影响长期停牌票,奖励的可交易掩码已排除不满 0.9 × 241 的新股与封板票。无前视:全部只用 t 日收盘及以前的数据,t+1 才交易;最长窗口 120 日,热身期不主导。
