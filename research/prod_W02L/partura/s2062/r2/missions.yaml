  hypothesis: 机制:day_median(Amt) 是每只股票当天分钟成交额的中位数,即「典型一分钟」的资金流量,不受尖峰分钟影响(和 day_sum / day_mean 不同)。本批快照里含它的 7 个候选均值比不含的好 1.95 分(p<0.001),上一轮 Pr1a 里「中位成交额对别的量做全样本回归斜率」的写法已经出现样本内外都为正的候选(+0.32,valid +0.54),说明 alpha 来源是稳定的流动性 / 参与度结构,而不是形状统计量。上一轮外围全是 cross_regbeta(·, ·, 241) 的长窗口斜率;这一位换成五类不同的外围:(1) 中位数与均值之比 = 当日成交是否被少数尖峰分钟主导,是均匀的机构式执行还是散户尖峰,日轴取 20 到 60 日均值;(2) 对 day_mean(Amt) / day_std(Ret) 做滚动回归取残差(cross_regres / cross_regalpha),读「同样波动与总量下典型分钟更厚还是更薄」;(3) 与 day_std(Ret)、day_sum(Ret) 的滚动相关,读流动性和价格变动的耦合方向;(4) 短长均值之差 = 流动性趋势,以及滚动标准差 = 流动性稳定性;(5) 用 cs_bucket_demean / cs_regres 对 LogFloatCap 做同规模内去均值(尺子已去掉对市值的线性与非线性暴露,这里是在写法上让信号读的是规模内的相对厚度)。全部用 Amt 与 Ret,字段是当日收盘后即知,只用 t 日及以前,无前视(用 cross_delay 而非 shift)。和库的区别:库里的 Amt 一族头部是汇总型(day_sum / 日均),没有以「中位数 / 均值之比」或「对均值回归的残差」作为主体的写法,两个库全部骨架已被禁,GP 只能长出新骨架。样本外还会在:典型分钟的成交厚度是持股结构(机构 vs 散户)的慢变指纹,换手低,且不依赖某段行情;风险是和 Amt 控制(流动性)相关,新尺子会去掉线性 / U 形 / S 形暴露,剩下的看这些关系型写法。数学检查:除以 day_mean(Amt)+1 不会爆点(Amt 以元计),停牌日为 0 或缺失,窗口 ≤ 241 日热身可忽略。
