    day_sum(Vwap)) 一类写法 train +0.06 / valid +0.80、cs_first_low40(day_sum(Vwap), day_sum(Vwap))
    +0.37 / +0.45,说明 alpha 在『价格水平处于最低 20% 或 40% 的那一段』里,而不是整个截面上线性排。机制:低价位(低累计收益、被长期抛弃)的票里彩票偏好与散户集中,定价偏离大;段内按什么排才是决定因素。库里含
    C 的候选外围只有 cs_first_low20(BoardCode, C) 一类(段内按板块码排,几乎是随机序),这就是它在尺子上卡在 0 附近的原因。本组种子外围全新:段内按
    60 日波动、20 / 120 日反转、60 日成交额(流动性)、上市年龄、收益离散度、收益与成交额的 60 日相关排序;C 相对自己 241 日高点 /
    241 日均值的位置(div / sub 写法,核心原样保留);反向对照(cs_last_high 把高价位段压到最低、cs_first_high 取高价位段),用来测是低价段还是价格水平本身;以及市值十分位内的
    C 标准化。与库的差别:库里所有含 C 的表达式外围只有 BoardCode 排序,这里的外围是价格与流动性、波动、反转的交互,骨架都不在两个库的 5583
    条里。为什么样本外还会在:低价 / 低累计收益段的彩票与情绪溢价是持久的行为金融效应(价格水平效应、MAX 效应、散户偏好低价股),价格水平是慢变量,换手低,15
    bp 成本下能保住;valid 的 +0.8 与 train 的 +0.06 说明这一段近年更强,不依赖某段行情。风险:C 与市值、20 日反转有相关,尺子已去掉控制的
    1~3 次项;若 C 与市值 |ρ| 过高核心仍可能被挡。数学:C 是分钟 Vwap 的分位数,无近零除数;cross_max / cross_mean 分母为价格,非零;cs_first_*
    的并列由 tie 块处理且输出无并列;无前视,窗口含当天及以前,t+1 交易。
