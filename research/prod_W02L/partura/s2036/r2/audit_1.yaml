attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      核心与门槛:核心 C = day_quantile_q75(Vwap) 出现在 loc.md 的共性表中(富集 +0.91, p 0.018),loc.json 的 core_cards 也有同一条(effect 0.908, p 0.018, n_with 12),与计划一致。但富集只基于 12 个候选,证据薄。C 与五个控制的 |ρ| 为 liq 0.47、vol 0.07、rev 0.03、known 0.43、size 0.44,都 < 0.8,过 E 位门槛。16 个种子都原样含 C(逐条核对),E 位外围去重的检查:计划里的种子与 r1 的 missions_final.yaml、audit_record.json 没有字符串级重复。
      相关度表:16 个种子与三个 head 的原始 |ρ| 最大 0.24(种子 8、11),没有 ≥ 0.7 的,自动划线不触发。与控制的 |ρ| 最大是种子 8 的 vol 0.60,没有 ≥ 0.8 的。
      种子逐个看:种子 1 与种子 15 都是「段内按 60 日波动排」(一个是分钟内波动均值,一个是日收益的标准差),构造不同、相关度表里 vol 分别为 0.56 与 0.42,保留,但 GP 可能会把它们收敛到同一处。种子 8(vol 0.60)保留。没有种子用到 ts_rank、cross_rank、in_rank_rolling、nt_*、ts_spearman。
      数学核对(读了 ops_ext.py 的 _lexi、cs_first_low20 等定义):cs_first_* / cs_last_* 的第一个参数是段内排序的键、第二个是分段的键,与计划用法一致;段边界按整块并列切(_rank_block),输出按 y 的秩无并列;y 或 x 缺失时输出 NaN(与 docstring 说的 no NaN 有出入,但对本位不是问题)。cross_mean / cross_stddev / cross_delta / cross_corr / cross_zscore 是时间轴(d 日)滚动窗口,窗口含当天,无前视。cross_zscore 有 EPS 与常数窗保护。分母 cross_max(C, 241) 与 C 都是正价格量,无近零除数。
      创新度 4:与两库 head 的相关度 ≤ 0.24,heads 都是成交量 energy_ratio 一族;价格水平段内的排序外围是新的(计划说库里含 C 的候选外围只有 BoardCode 排序,我未逐条核对这一句)。
      合理度 4:低价位段的彩票偏好与 MAX 溢价机制清楚,段内按 60 日波动或反转决定次序的写法也有对应的故事。扣分的地方很小:C 与市值 |ρ| 0.44,尺子只去掉控制的 1–3 次项,段成员(阶跃式的分段选择)可能携带尺子没扣掉的非线性市值暴露;这是风险,不是数学问题。
      如果它有 alpha,最可能来自:价格水平低的那一段里的彩票偏好或散户集中所致的定价偏离(MAX 效应),段内次序由 60 日波动或短期反转决定。
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: []
    reasons: |-
      创新度 4:D = day_last(Close) / cross_max(day_last(Close), 241) 是相对一年高点的位置,与两库 head 的原始 |ρ| 最大 0.42(种子 8),不是库里任何 head 或控制的换写。段内键的控制相关:种子 8 liq 0.70(键是 60 日成交额均值)、种子 15 vol 0.71(键是 60 日波动均值)、种子 16 rev 0.71(键是 20 日收益,与 20 日反转控制同向)。这三个都逼近但没到 0.8 的自动划线;它们的段内键几乎就是控制本身,D 只改变 20% 段成员的次序。按 §3 的放行原则我不划,但若 PI 想严一点,这三个是第一批候选。其余种子对控制的 |ρ| 都 ≤ 0.49,种子 2、9 的 rev 分别 0.40、0.49,也保留。
      数学核对:D 的分母是正价格,D 在 (0, 1]; cross_min 变体的分母同为正价格;cross_max 与 cross_mean 是时间轴滚动窗口,窗口含当天,无前视。上市不满 241 天的股票,cross_max 只在已有的历史上取最大值,会让新股的 D 系统性偏向 1,这与种子 10 的 ListAge 段有关——是小偏差,不主导结果,不挡。种子 14 对 cs_first_low20 的输出做 20 日 cross_mean,NaN 位置(热身期与停牌日)由 cross_mean 忽略,没有问题。
      合理度 3(扣的是机制方向):计划写「D 小与 52 周高点锚定同向」,但 George-Hwang(2004)的结论是离高点远的票未来收益低,也就是 D 小 → 收益低;cs_first_low20(y, D) 把 D 最低的 20% 放在多头书的最前面,要让它赚钱只能靠段内 y 的符号反过来,计划没有说明选哪一边。段内的「高波动、近期继续跌的更便宜」故事与彩票 / MAX 理论(高波动被高估)方向相反,计划没有解释为什么取前者。这些是说不清的地方,不是数学问题,按 §3 放行;但合理度不给 4。仍然有可讲的机制(锚定 + 处置效应导致的错杀反转),所以不压到 2。计划里 inspired_by 引用的 energy_ratio 一族 E 位的 -1.3 到 -2.8,我在文件中没有核对到,只用于放弃理由,不影响打分。
      如果它有 alpha,最可能来自:回撤段内被错杀的票的反转(锚定与处置效应造成的延迟反应),段内由 60 日波动或 5 日 / 20 日反转决定谁先被买。
R:
  - head: 'cross_stddev(energy_ratio_n(delete_open_close(Volume), 0.9, True), 20)'
    soundness: 4
    reasons: |-
      三个窗口变体 300 / 360 / 480 都是同一个量的窗口扩展,数学上无问题:cross_stddev 是时间轴滚动标准差,energy_ratio 取值在 (0, 1],无除数问题。与原 head 的 ρ 为 0.54–0.66(残差 0.43–0.55),属于计划里「替换」的预期类型,审计只打合理度。机制:窗口拉长后,量的集中度(成团度)的稳定水平差异成为慢变量,换手低,这一点是清楚的;计划的依据是第 1 轮窗口 80 / 120 / 241 的单调改善,我未能在文件中核对那组读数,只能按计划所述接受。扣分的地方:热身期随窗口变长,300–480 个交易日的热身从 2018-01-02 起,占 train 的 1.2–2 年,但仍不主导结果(train 与 valid 都还留有足够的样本),不挡。
      如果它有 alpha,最可能来自:长窗口下日内成交集中度的慢变结构差异(持仓与交易模式的稳定性),换手低、成本敏感性小。
  - head: 'cross_stddev(energy_ratio_n(delete_open_close(Volume), 0.9, False), 120)'
    soundness: 4
    reasons: |-
      四个窗口变体 180 / 300 / 360 / 480 对原 head 的 ρ 为 0.54–0.85(残差 0.44–0.79),变体 180 与原 head 最像(0.85),也是可替换的预期类型,审计只打合理度。数学上无问题:False 分支的 energy_ratio 在 pad_to_pow2 = False 时把每行裁到 236 列(第 1 轮审计已记录的实现细节),对所有变体一致,不改变排序的比较;热身期与第一组同样,变长后占训练段的比例上升,但不主导结果。机制同上,是同一慢变量在另一个 FFT 读法下的版本;窗口 180 的变体与 120 原版本的分差可以检验峰位置,计划的假设成立与否不影响合理度。
      如果它有 alpha,最可能来自:同一成团度慢变结构,在不补零的频谱读法下的版本;窗口越长越稳,换手越低。
