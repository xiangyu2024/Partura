summary: '两个 E 位均通过：a（核心 D）创新 4、合理 4，划掉 seed 2、3、8，余 13 个；b（核心 C2）创新 3、合理 4，无划掉，余 16 个；本轮无 R 组。需 PI 说明而不构成挡的理由：cs_flip_by_state 的状态窗口（假设 20 日，种子用单日）与 cross_regbeta 的回归方向（D 对 20 日收益的斜率）。'
