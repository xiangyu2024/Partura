  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [2, 3, 8]
    reasons: '核心 D = close / 241 日最高收盘价，即价格相对 52 周高点的位置。与快照 6 个 head 的原始 |ρ| 最大 0.128（残差 0.143）：heads 全是成交量能量比的截面标准差，D 与它们不是同一类量；控制中与 20 日反转的 |ρ| 0.407 最高，未到 0.8。分子分母都是正价格，241 为日轴窗口（cross_max 作用于 axis 0），无除零、无爆点。创新度 4：快照里没有任何 head 是价格位置类，且「条件分桶 / 状态翻转 / 段内变量」的写法都不在快照里。合理度 4：52 周高点锚定与处置效应是有文献的机制；cs_bucket_rank / cs_bucket_zscore 用桶内分位或带 EPS 的 z，无 NaN 与除零问题；cs_flip_by_state 的状态是全市场截面均值的 241 日分位，无状态时输出 NaN，与代码一致。一处与假设不一致但不构成数学问题：假设写「全市场 20 日收益 / 波动」，而 seed 5、6、14 实际用的是单日（day_sum / day_std）的截面均值，状态只看当天市场方向，噪声更大，PI 若想要 20 日状态应改窗口。seed 16 cross_regbeta(x, y, d) 的回归元是第一个参数，即 D 对 20 日收益的斜率，假设文字没有说明这个方向，PI 需确认；分母 var(Ret20) 只有 EPS 保护，低波动票的斜率会放大，是截面爆点的潜在来源，但没有证据表明它主导排序，放行。划掉的种子：2（cs_bucket_zscore(60 日波动, D)，与波动控制 |ρ| 0.848，同一个量的分桶版本）；3（cs_bucket_rank(60 日成交额, D)，与流动性控制 0.949、已知族 0.923，就是流动性本身）；8（sub(rank D, rank D 的 20 日前值)，即 D 的 20 日变化，与 20 日反转 0.822，同一个量）。以上 3 个也是确定性规则自动划掉的。放行但注明：seed 1（cs_bucket_rank(20 日收益, D)，与反转 0.71，是条件化的反转，残差 0.127，放行）；seed 9（mul(rank D, rank 60 日波动)，与波动 0.692，交互项，放行）；seed 12（cs_first_low20(60 日成交额 Gini, D)，与流动性 0.552、已知族 0.505，是成交分布集中度，不是成交额水平，放行）；seed 14（cs_last_low20(rank D, 60 日成交额)，与已知族 0.527，只把最不活跃的 20% 压到底，是容量过滤，放行）。如果它有 alpha，最可能来自深度回撤票上的处置效应：在同一回撤档里，被错杀（价格对坏消息反应不足）的那部分票。剩 13 个种子，核心与各控制 |ρ| 均 < 0.8，通过。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '核心 C2 = cs_first_low20(20 日累计收益, 20 日均价 / 241 日高点)：把 20 日均价相对高点最低的 20% 段放到前面，段内按 20 日收益排。与快照 heads 的原始 |ρ| 最大 0.188（残差 0.091），但与 20 日反转控制 |ρ| 为 0.49，接近 0.5，本质上是「深度回撤段里的 20 日反转」，与反转控制有明显重叠，所以创新度给 3 而不是 4；它在 loc.md 中出现 8 次，是现成的子树，E 位允许。核心与各控制的 |ρ| 最大为 0.49（反转），未到 0.8，通过。合理度 4：分子为 20 日均价、分母为正的高点，无除零；cs_first_low20 / cs_first_low40 用整块分位带（_rank_block），并列靠 ordinal 处理，输出无并列；无前视，窗口含当天，t+1 交易。外围的中性化（cs_bucket_zscore(C2, LogFloatCap)、cs_bucket_rank(C2, 波动)、cs_bucket_demean(C2, 成交额)、cs_regres(C2, 波动)）直接去掉对市值、波动、流动性的暴露，机制清楚。放行但注明：seed 11 sub(rank C2, rank 60 日成交额)，流动性 0.636、已知族 0.608，是 C2 减去流动性秩，不是流动性本身，放行；seed 7 cs_last_low20(C2, 60 日成交额)，已知族 0.499，只把最不活跃的 20% 压到底，是容量过滤，放行；seed 13 mul(rank C2, rank 60 日波动)，波动 0.668，交互项，放行；seed 1 与 seed 9 是核心的时间平滑（cross_ema 10、cross_mean 5），与核心是同一个量的平滑，但不与快照 head 或控制重复，放行。没有种子划掉：没有 head 的 |ρ| ≥ 0.7，也没有控制 ≥ 0.8。如果它有 alpha，最可能来自深度回撤段中近期跌得最多的票的短期反转，而且这种反转在低成交、低波动或新上市的子集里更干净（即外围的条件化才是 alpha 的来源）。剩 16 个种子。'
