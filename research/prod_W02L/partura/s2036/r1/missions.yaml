  - type: N
    hypothesis: |-
      机制:一天里不同时段由不同的参与者主导,各时段成交量路径的「成团度」(多少个频点才装下 90% 的功率)读的是这只股票的投资者结构,而一个时段内的成团度与另一个时段内的成团度之差,既去掉了对所有时段一样的水平(流动性、计数噪声),又保留了时段异质性。Admati–Pfleiderer(1988):知情交易者与流动性交易者在日内集中交易,形成时段性的量价模式;Heston–Korajczyk–Sadka(2010)发现同一时刻(半小时)的收益在日间有延续,文献给出的解释之一是日内交易行为按固定时点重复(机构执行、流动性需求)。A 股的具体对应:开盘第一小时 = 隔夜消息 + 散户开盘挂单,成交以脉冲为主;最后一小时 = 机构 / 指数基金的收盘调仓与拆单执行(VWAP / 收盘价算法),成交以连续铺开为主,另有「尾盘偷袭」式的孤立大单。收盘段成团度减开盘段成团度(Δ = ERc − ERo)高的票,是尾盘更像「少数几笔大单」而不是铺开的执行,这是类型而不是水平,慢变。
      批内现象(B106):含 energy_ratio_n(delete_open_close(Volume), ·) 的库表达式全部是整天一个数;cross_mean(·, 20) 的原始秩 IC 为 +0.035 ~ +0.037,cross_stddev(·, 20) 为 −0.040 ~ −0.023,三个 head 的窗口 20 → 40 同时变好(−1.55 → −1.00,−1.56 → −0.77),说明承重的是慢变的个股属性,整天读一个数。但整天一个数只能读到「平均成团度」,它主要是流动性(与已知族 ρ −0.4)。把一天切成时段,用时段之差,正是整天读法够不到的东西。
      算子怎么实现:in_slice(Volume, a, b) 沿分钟轴裁出一段(右端点含在内;V2 网格:0 号是 9:30 竞价 bar,1 ~ 120 是 9:31 ~ 11:30,121 ~ 240 是 13:01 ~ 15:00),所以开盘段 [2, 61] ≈ 9:32 ~ 10:31,上午后段 [62, 120],下午前段 [121, 180] ≈ 13:01 ~ 14:00,收盘段 [181, 237] ≈ 14:01 ~ 14:57(跳过第 1 根开盘分钟和最后 3 根收盘集合竞价,与 delete_open_close 同一口径)。energy_ratio_n 沿分钟轴做 FFT,(种子都用 pad_to_pow2 = False:不补零,按这一段的实际长度做 FFT,k 除以段长),得到每个时段每天的成团度 ER。种子里:cs_rank 先把每天的两个时段的 ER 各自转成截面秩再相减,去掉全市场当天的共同变动;cross_mean(·, 60 ~ 241) 取慢均值;cs_bucket_rank(ERc, ERo) 是在开盘段成团度的十分位内取收盘段成团度的百分位(非参数地「净掉开盘段」);energy_ratio_band_n(high = True) 取的是实信号功率谱里除直流分量外的那一半(镜像对称),读的是去掉水平之后、剩余起伏的能量集中度,energy_ratio_topm_minus_q(·, 4, 1) 读去掉最强频点后第 2 ~ 4 强频点的能量占比,收盘段上它就是「放量冲向收盘」这类斜坡的能量占比,不依赖水平。
      为什么和已有的不同:库里的 energy_ratio_* 表达式全部作用在整天的分钟路径上(delete_open_close(Volume 或 Ret)),外面只有裸值 / cross_mean 20 / cross_stddev 20 三种写法;没有一条用 in_slice 把一天切成时段,更没有一条把两个时段的成团度相减、取秩差或条件取秩(已逐个对照 struct/members.csv 的骨架,两个库全部 5583 条里没有一条与这里 16 个种子的骨架相同;最近的 B106 ~ B109 共 90 条全是整天一个数)。与已知成交额离散度控制:种子都是两个时段的相对量,水平(日成交额)被差分掉;与流动性、波动、20 日反转、市值:时段之差不含价格,与反转无关,与波动无关。
      为什么样本外还会在:来源是持久的投资者类型(谁在什么时段交易),不是某段行情;所有种子聚合窗口 60 ~ 241 日,名次稳定,换手低,15 bp 成本不会把毛超额吃光;差分与秩差对市场整体放量 / 缩量不敏感。最可能的风险:时段之差仍然与流动性存在非线性关系(小盘股成团度的昼夜差异更大),这部分尺子只扣 1 ~ 3 次秩多项式,扣不干净,所以放了 cs_bucket_rank / cs_bucket_zscore 的非参数版本做对照。
      数学检查:60 点短段的 ER 取值在 1/60 ~ 约 0.7,有量化但不是常数:算子在每天每票独立计算,没有除以近零的量;总能量为 0(段内无成交)时是 NaN,不是 0 或无穷。energy_ratio_n 的已知旧版行为:pad_to_pow2=False 分支把整批的列裁到最长有效行的长度,一只在段内停牌的票的功率谱被截;这只影响停牌票,不影响排序主体。ER 的并列(k 是整数)用 cs_rank 的平均秩处理,再做 60 ~ 241 日均值,整数量化被平均掉。无前视:同一天的分钟数据,窗口含当天收盘及以前,t + 1 才交易。热身期:窗口 60 以内的种子被 warmup = 60 覆盖;120 / 241 的前若干日是不满窗口的均值,不主导结果。
