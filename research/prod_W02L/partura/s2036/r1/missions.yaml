  - type: E
    core: 'energy_ratio_n(delete_open_close(Volume), 0.9, False)'
    hypothesis: |-
      核心 C0 = energy_ratio_n(delete_open_close(Volume), 0.9, False) 是每个交易日的一个数:当天分钟成交量路径(去掉 9:30 竞价与第一分钟、尾部 3 根)做 FFT(pad_to_pow2 = False:不补零,取整批最长有效行的 236 列,即 2 ~ 235 号分钟),功率谱从大到小累加到总能量的 90% 需要多少个频点,除以 236。它读的是「当天成交量有多成块 / 成团」:直流分量只占约 0.99 / (1 + CV²)(CV 是分钟成交量变异系数),要补满 90% 就得再取一批低频谐波(平滑的日内 U 形)或一大批频点(白噪声式的孤立尖峰)。我用 AlphaCube 里这个算子本身在合成数据(U 形 × 对数正态噪声,不是真实数据)上跑了 ER:CV 0.45 一带约 0.05,CV 1.3 一带约 0.5,随 CV 单调上升;n = 0.8 时 CV 在 0.5 以下的票几乎全落在 k = 1 ~ 3(基本只取直流分量),大量并列,这是 n = 0.8 的 head(−3.17)比 n = 0.9(−1.55)差 1.6 分的一个可能解释(推断,没有在真实数据上验证)。
      批内事实(B106 拆解):三个 head 都是 cross_stddev(C0, 20),它们的窗口 20 → 40 在 train / valid 上同时变好(−1.55 → −1.00、−1.56 → −0.77),20 → 10 变差;Volume 换成 Amt 几乎不变(−1.46 / −1.62);cross_stddev 对已知成交额族的 |ρ| 0.39 ~ 0.47。库里 24 个成员的原始秩 IC:cross_mean 的 +0.035 ~ +0.037,cross_stddev 的 −0.040 ~ −0.023,也就是「平均成团度高」与「成团度的波动大」方向相反;后者与 Chordia–Subrahmanyam–Anshuman(2001)的发现同向:交易活跃度的波动大,预期收益反而低(这个负关系后续文献有复现也有争议,我只把它当作方向上的线索,不当作已证实的机制)。
      我认为 head 里「烂」的部分有三块,E 位的外围就是逐块去掉,而不是再换窗口:(1)水平:有界的计数型统计量,std 与 mean 同升同降,cross_stddev(C0) 里混着成团度的水平,也就是流动性,这正是它与已知族 ρ −0.4 的原因,新尺子只扣秩的 1 ~ 3 次项,扣不掉「水平 × 离散」这类交互。所以种子 1 ~ 3 用 std ÷ mean、std 对 mean 的截面残差、std 在 mean 十分位内 z 分数。(2)全市场共同波动:放量日 / 节前日全市场的成团度一起升降,这是对所有股票都一样的时间序列成分,先 cs_rank 再取 std 才是每只股票自己的离散度(种子 16、14、15 的基础)。(3)窗口噪声与换手:20 日窗口太快,所以全部种子的聚合窗口在 60 到 241 日。
      另外的外围写法:同伴内相对量(同市值、同成交额、同波动十分位内的成团度)、相对自己历史的位置(快慢 EMA 差、20 日均值对 241 日分布的 z 分数、60 日均值的 120 日变化)、与价格动作的耦合(与 |日收益| 的 120 日相关、对日内波动的回归斜率、与带符号日收益的相关)、两条路径之差(成团度的秩减去成交量变异系数 day_std / day_mean 的秩,即频谱形状净掉离散度;成交量成团度的秩减去 |分钟收益| 成团度的秩,即成交量成团但价格没动,是噪声型成交)。
      为什么和库里不同:库里含这个核心的 24 个成员只有三种写法:裸值、cross_mean(·, 20)、cross_stddev(·, 20)。以上 16 个种子每一个的算子骨架都不在两个库的 5583 条里(已用 struct/members.csv 的骨架列,对两个库全部 5583 条逐个对照过)。除 cross_stddev 窗口外没有一个是 head 的窗口变体,所以与三个 head 的日度秩相关预期低于 0.7(去水平 / 去共同成分以后更低)。与已知成交额族:种子 4 ~ 7 是同伴内相对量,预计低于 0.5。
      为什么样本外还会在:成团度是持久的个股属性(参与者结构:机构拆单平滑、散户脉冲成团),它的「相对同伴的超额部分」与「相对自己的变化」是慢变量,窗口 60 ~ 241 日,名次稳定,15 bp 成本不会把毛超额吃光(本波别的流的经验:最好的分数都来自 120 ~ 241 日的慢量,换手承重)。机制(投资者结构、流动性风险)不依赖某段行情;但我并不确定新尺子扣完 7 个控制以后还剩多少,下面的预测据此偏保守。
      数学检查:C0 取值在 [1/236, 约 0.7],只在当天无成交 / 全 NaN 时缺失(覆盖率 0.9995),没有除以近零:div(std, mean) 的分母是 C0 的均值 ≥ 1/236;cross_zscore 的分母是 241 日 std,C0 在一段时间里恒为 1/236 的名票(极平滑)std 近 0,但这种票 cross_zscore 的分子也近 0,量级受 EPS 控制,不是爆点;cs_regres / cs_bucket_* 每天截面内计算。无前视:所有窗口含当天收盘及以前,t+1 才交易。热身期:窗口 120 ~ 241 的前若干日是不满窗口的均值 / 标准差,只占样本前部,不主导结果。算子行为的已知事实:energy_ratio_n 的 pad_to_pow2=False 分支会把整批的列裁到最长有效行的长度(源码旧版行为),停牌 / 缺分钟的票功率谱被截,这个行为核心自带,三个 head 都有,不在种子里新增。
