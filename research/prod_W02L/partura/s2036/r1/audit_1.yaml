slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: []
    reasons: |-
      核心与门槛：核心 energy_ratio_n(delete_open_close(Volume),0.9,False) 是 H2 的子树，满足 E 位要求。它与五个控制的原始 |ρ| 为 liq 0.644、known 0.620、size 0.338、vol 0.199、rev 0.177，都小于 0.8，过 E 位门槛。表中核心行标「废品」（gate=False，distinct 0.032）反映的是裸 ER 的离散性（每天至多 236 个取值），H2 的裸 ER 对照 gate 也是 False（distinct 0.034）。§3 对 E 位的通过条件里没有这一项，所以不据此挡。
      种子划掉情况：16 个种子都原样含核心。与快照 head 的原始 |ρ| 最大 0.42（种子 7），没有 ≥0.7 的；与控制 |ρ| ≥0.8 的没有（最大是种子 6 的 liq 0.781，未到线）。骨架（抽掉字段、常数、窗口与布尔参数）核对：16 个都不在两个库的 5583 条里；外围（核心之外的算子）也与库里含精确核心的 3 条（裸核心、cross_mean(·,20)、cross_stddev(·,20)）都不同，满足 E 位的外围去重。种子 1、16 与 R1 变体 4、5 骨架相同（只差 pad 标志），种子 2、3 与 R2 变体 4、5 骨架相同（只差窗口 120 对 60）。按 §3，种子只能因数学问题或重复划掉；这四条是同一思想的不同参数，不是库里已有的东西，所以本轮不划。若 R 变体被收录，GP 的骨架禁令会拒绝它们，请 PI 定夺。任务提示里「不符合 idea」不是 §3 的划掉理由，因此没有用。全部种子都没有用到 ts_rank、cross_rank、in_rank_rolling、nt_* 或 ts_spearman；无前视（窗口都含当天收盘及以前）；除法分母恒为正或有保护（cross_mean(ER,120) ≥ 1/236；cs_regres、cs_bucket_*、cross_zscore 有 EPS 或方差保护）。
      实现偏差（新发现，§4 不挡）：delete_open_close 把 241 根网格的第 0、1 根和最后 3 根置为 NaN，有效的是第 2 至 237 根共 236 根。但 energy_ratio_n 在 pad_to_pow2=False 时经 fft_with_nan_handling 把每行裁到 max_len=236 列（x_clean[:, :236]），于是 FFT 实际吃的是 [0, 0, 第 2 至 235 根]：第 236、237 根（14:56、14:57）被丢掉，开头两个零洞。这对每只票每一天都成立，不只是停牌票（笔记里的说法）。我用源码算子在合成 U 形数据上核对：手算与算子输出逐点一致（最大差 0）。对排序的影响：分钟量噪声较大的情形（对数正态 σ 0.3 至 1.2）下，裁剪版与正确窗口版的 Spearman 约 0.996；只有噪声极小、ER 几乎恒为 1/236 时相关才失真，而那时本身已无信息。所以它不属于「结果主要由缺失值填充决定」，不挡。笔记里「236 列即 2 至 235 号分钟」的算术也对不上（2 至 235 只有 234 根）。以上是合成数据检验，真实数据未验证。
      创新度 3：16 个外围都是库里没有的骨架，但有一半是对同一对统计量 std(ER)、mean(ER) 的归一化或截面去水平（种子 1 至 3、7、16，与 H2 的残差 |ρ| 0.35 至 0.49）；种子 4 至 6 是 mean(ER) 在规模、成交额、波动分组内的截面标准化（其中 4、6 与 liq 的 |ρ| 为 0.55、0.78）；种子 8 至 10 是时间尺度与历史位置（EMA 差、z 分数、变化量）；只有 11 至 15 才是与价格动作的耦合和路径差。换写法的成分够多，所以不给 4。
      合理度 3：机制清楚（个股分钟成交量成团的慢变部分，投资者结构），但核心的实际输入偏离了计划所写的窗口，算子组合没有完全实现计划描述的东西；不是数学问题，所以不给 1 或 2。
      如果它有 alpha，最可能来自 120 至 241 日尺度上「成团」的相对部分（相对同伴、相对自身历史、与价格动作的耦合），而不是流动性水平本身；种子 1、4、6 那部分更可能就是流动性。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      新颖性 4：16 个种子都用 in_slice 切出的时段（2–61、62–120、121–180、181–237 等）做 energy_ratio 或其派生（段内秩差、比值、差、band、top-m、桶内秩）。库里 90 条 energy_ratio 全部作用在整天的分钟路径上，没有一条与 in_slice 同现（同一套骨架核对，0 条）；16 个骨架都不在两库里；与三个 head 的原始 |ρ| 最大 0.27（种子 8）。与控制：种子 10、13、15、16 与 liq 的 |ρ| 为 0.56、0.69、0.68、0.74，种子 13 与 size 为 0.50，说明其中一部分是换写的流动性水平，所以不给 5；但「时段之间的成团结构」这个信息库里没有，给 4。
      合理度 4：机制（开盘脉冲与尾盘执行的时段结构差）说得通。切段核对正确：in_slice 右端点含在内（dt_in.py 中为 x[:, start:end+1]），9:32–10:31 是 2–61（60 根），14:01–14:57 是 181–237（57 根），各段都是有效分钟、没有 NaN，所以 pad 与裁剪问题不出现在这一位（与 a 位不同）。energy_ratio_band_n、energy_ratio_topm_minus_q、cs_bucket_rank、cs_bucket_zscore 的实现与笔记一致（读了 dt_spectral.py、ops_ext.py）。两处小问题，都不构成 §4：(1) 笔记说 cs_rank 的并列「用平均秩处理」，与代码不符：cs_rank 用稳定排序，并列按股票列序打破（nd_cs.py 的 cs_rank 调 common.py 的 rank），不是平均秩。段内 ER 只有 57 或 60 个取值，并列块很大，但并列内的偏移最多一个块宽，对秩的方差贡献很小，不改变判断。(2) 种子 11 是两段 ER 的原始差，两段长度不同（57 与 60），k 相同时差值有约 0.0009·k 的水平偏置，只影响这一条；比值（种子 10）与所有截面秩类种子不受影响。
      划掉情况：不划。种子 1 至 7 与 14 骨架相同（只换段、窗口或 Amt），是同一思想的不同时段对或平滑，不算重复；8 至 13 各有不同算子；15 与 16 是互换参数的对称一对。没有禁用算子；无前视（段在 14:57 以前，t+1 才交易）。
      如果它有 alpha，最可能来自开盘第一小时（脉冲式，散户与隔夜消息为主）与尾盘 14:01–14:57（机构或算法的收盘执行，或尾盘集中的大单）的成团结构差，即持久的交易者类型差异，而不是某段行情；种子 10、13、15、16 那部分更可能是流动性水平。
R:
  - head: 'cross_stddev(energy_ratio_n(delete_open_close(Volume), 0.9, True), 20)'
    soundness: 4
    reasons: |-
      数学：pad_to_pow2=True 把有效 236 根补到 256 再做 FFT，分母却用有效点数 236，所以 ER 可能超过 1（k 最大 256）。这是笔记中的 legacy quirk (3)，但它单调，不改变秩。补零与 a 位同样的零洞也在这里；不过在合成数据上 ER(True) 与 ER(False) 的 Spearman 约 0.98，与分钟量 CV 的 Spearman 约 0.98，补零没有主导结果。不构成 §4 问题。
      消融核对（loc.json）：H1 的 20→40 在 train/valid 为 −1.00/−0.97，20→10 为 −1.74，与「窗口太快、20 日 std 在吃分」一致。变体 1 至 3 是窗口，4 是 std/mean 去水平，5 是截面秩后再 std，6 是 n=0.95、窗口 60。资格提示（不影响本项打分）：变体 4 的已知族 |ρ| 为 0.68、变体 6 为 0.56，都 ≥0.5，即使分数过线也不能替换或收录。
      合理度 4。
  - head: 'cross_stddev(energy_ratio_n(delete_open_close(Volume), 0.9, False), 20)'
    soundness: 4
    reasons: |-
      数学：与 a 位共享的裁剪偏差（见 a 位），不是本组独有。cs_regres、cs_bucket_zscore、cross_ema 都是算子已有保护的写法，没有除以近零的量。
      消融核对：H2 的 20→40 为 train −0.77、valid −0.54（loc.json），与笔记的 +0.79 一致；窗口 40 与 head 的 |ρ| 为 0.88，所以 R 取 60、120、241 才有意义。变体 1 至 3 是窗口，4 与 5 是截面去水平（regres 与 bucket），6 是半衰期 60 的 EMA 平滑 20 日 std，7 是 n=0.95。资格提示：变体 7 的已知族 |ρ| 为 0.55，不能替换或收录。
      合理度 4。
  - head: 'cross_stddev(energy_ratio_n(delete_open_close(Volume), 0.8, False), 20)'
    soundness: 3
    reasons: |-
      数学无问题。但机制说明与 head 自己的消融对照不合：笔记说「n=0.8 时 ER 几乎全并列」，而 loc.json 中裸 ER 的 distinct 比例，n=0.8 为 0.031、n=0.9 为 0.034，并列程度几乎一样。窗口 10 与 40、以及 Volume 换 Amt，都不动它（−3.10、−3.03、−3.11），说明问题不在窗口和口径，但并没有证据指向「并列」。
      变体 1（n=0.95、窗口 20）与 H2 的原始 |ρ| 为 0.968，几乎是 H2 的复制；若替换 H3，库里等于多出一份 H2。变体 2 与 3（n=0.85 与 0.97，窗口 60）是有用的 n 方向检验；变体 3 的已知族 |ρ| 为 0.57，不能替换或收录。检验设计本身合理，机制说明是推断。
      合理度 3。
summary: 'a 位 novelty 3、soundness 3，b 位 novelty 4、soundness 4，两位都过门槛且都没有划种子；R 三组合理度 4、4、3 全部保留。a 位新发现核心的裁剪偏差（实际输入为第 0、1 根零加第 2 至 235 根，丢掉第 236、237 根），对排序影响小，不挡；笔记里 cs_rank 并列用平均秩的说法与代码不符，影响小。'
