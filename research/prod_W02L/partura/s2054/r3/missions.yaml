    hypothesis: '核心是共性表里均值差第三大的子树(+1.81,含它 11 个候选均值 -0.88 对 -2.68):日内最高价 High 等于当日最高值的分钟占比,即「一天有多少时间钉在最高点」。在 A 股这主要是涨停封板 / 贴近涨停横盘的程度(涨停锁死读近 1,普通日约 1/240),机制是彩票型 / 情绪型需求与封单:封板时间长说明买盘压倒卖盘,但次日的延续还是回吐取决于参与者构成,是个股的慢变属性。以前含该核心的候选只有一种写法:Pr2b 里 pow_05(cross_regbeta(day_cov(Vwap, ·), day_at_max_ratio(High), 241)),即把它当 241 日滚动回归里的自变量,最好 +0.09;外围全是价位协方差加 pow_05,核心被价位水平带偏。本次外围完全不同,不碰 day_cov / 价位 / pow_05 / 241 日回归:(1)cross_mean / cross_stddev / cross_tail_mean_q75 对封板占比做 20-60 日慢平滑、波动与上尾,读「频繁封板」的持续性,降低换手;(2)cs_bucket_zscore 按 LimitWidth(涨跌停幅度,即板块类型)或 BoardCode 分桶后取 z 分数,让封板占比在同一涨跌停制度内比较,去掉主板 / 创业板制度差异(这是日频字段叶子才能做的外围,以前没用过);(3)cross_corr / cross_regbeta 把「昨日封板占比 cross_delay(core, 1)」对今日收益做 60 日滚动回归,直接读封板后次日是延续还是回吐(只用过去值,无前视);(4)与 day_at_min_ratio(Low) 相减,读「钉在涨停」减「钉在跌停」的不对称,这是核心之外的新信息;(5)对 day_std(Ret) 做截面残差,把波动从封板占比里拿掉。为什么样本外还会在:涨跌停制度与封板行为是交易规则 + 散户参与度的结构属性,不依赖某段行情,且 LimitWidth 分桶把制度变化(注册制板块)的水平差别去掉;失败方式是封板票本身买不进(可交易掩码处理)或被反转 / 流动性控制吃掉。数学检查:day_at_max_ratio 有效分钟少于 2 为缺失,不是爆点;一字板全天等值时读 1,是真实的极端值,不是下溢;全部只用 t 日及以前数据,窗口最长 60 日,无 cross_shift / ts_shift / in_shift,无 nt_*。'
