    reasons: '创新度 4。E 位核心 cs_regres(cs_regres(day_argmax(High), day_es_ratio_lo(High)), day_es_ratio_lo(High)) 在相关度表里对 6 个快照 head 的原始 |ρ| 最大只有 0.02，对 5 个控制的 |ρ| 全部 ≤ 0.07。快照里唯一含 day_argmax(High) 的是 M2 head 1（cross_cov(day_argmax(High), day_ar1_coefficient(Low), 5) 的 ts_pearson 复合，分数 -1.26），它与核心的相关同样很低，所以「高点出现的分钟位置」这个度量在 head 里并不是现成的。外围 13 个种子对 head 的原始 |ρ| 全部 ≤ 0.12，残差 |ρ| ≤ 0.07，对控制的最大值是种子 11 对波动 0.31、种子 6 对流动性 0.29 / 已知族 0.27 / 规模 0.25，均未到 0.8。不给 5，因为外围绝大部分是对同一核心的 cross_mean / cross_ema / cs_bucket_zscore / cross_zscore 平滑与截面残差，是同一核心的不同读法。合理度 4。逐个算子核对：day_argmax 并列取第一个下标、整天相等时返回 0（dt_day.py:172 起，§4 已知行为）；day_es_ratio_lo 是日内最低 5% 分位以下的尾部形态（ops_ext.py:676）；cs_regres(Y, X) 是截面 OLS 残差（nd_cs.py:254）。核心里的两次 cs_regres 用的是同一个回归量 day_es_ratio_lo(High)，OLS 残差与回归量正交，第二次剔除在数值上是恒等变换，所以核心实际等价于一次剔除。这不影响机制，但理由里「两次剔除」的说法不准，PI 的事，审计不替它改。cross_mean / cross_ema / cross_regbeta / cross_corr / cs_bucket_zscore(·, LogFloatCap) 的窗口都在 20 到 60 日，只用 t 日及以前的数据，没有 cross_shift、ts_shift、in_shift、in_slice，没有 nt_*，没有 pow_1_5 / pow_2_5，无前视。需要流水线核对、但不挡的一点：一字板票 High 全天相等，day_argmax 返回 0，即「高点最早」一端；若可交易掩码不排除涨停一字板，这批票经慢平滑后会系统性占据一端。这是 §4 的已知行为，只在支配截面时才算定义坏掉，所以放行，但建议看一字板票在十分位里的占比。我按指示没有读共性表，核心是否属于共性表子树未核对。如果它有 alpha，最可能来自：高点出得晚是尾盘追涨 / 彩票型需求，出得早是开盘冲高后回落，这是参与者构成的慢变属性，与价格水平和波动无关；最可能的失败方式是慢平滑后退化为日度噪声，或被波动 / 规模残差吃掉。划掉种子 2：cross_mean(core, 60) 与种子 1 cross_mean(core, 20) 是同一个统计量、同一核心，只差窗口，属于重复（与上一轮 905 划掉 cross_corr 60 对 120 的先例一致）。种子 3（cross_ema 30）与种子 1 用的是不同平滑算子，保留。其余 12 个种子无数学问题，不与任何 head 或控制重合到 0.7 / 0.8，满足 ≥ 4。自动划掉规则下没有其他种子被划。'
