    hypothesis: >-
      核心是批 2 共性表里均值差最大的子树(+0.99):日内最高价出现的分钟位置 day_argmax(High),在截面上两次剔除 day_es_ratio_lo(High)(最高价附近的极值形态量)之后的残差,
      即「最高点出得早还是晚」中与最高价形态无关的部分。机制:高点出得晚是尾盘资金追涨 / 散户情绪(彩票型需求),高点出得早是开盘冲高后回落(隔夜消息被消化、被动方出货);
      这个时间位置是参与者构成的慢变属性,不是价格水平也不是波动(与波动、反转、流动性控制不是同一个东西,日度值是时间下标)。
      以前含该核心的写法只有两类:Pr1b 里的 cross_corr(day_std(Ret), 核心, 241) 与 cross_reg_tvalue(day_std(Ret), 核心, 241)(核心与日波动在 241 日窗口里的相关 / t 值),
      最好 -0.36,说明配上波动那一半是拖累。本次外围完全不同:(1)不再碰 day_std(Ret),改用 cross_mean / cross_ema 做 20-60 日慢平滑,降低换手(纯多头亏在成本,先前所有含核心的候选都是亏损);
      (2)cs_bucket_zscore 在流通市值分桶内取 z 分数,去掉规模暴露;(3)用 cross_regbeta / cross_corr 把核心对成交额或收益做 60 日滚动回归,读「放量日高点出得晚」的持续性;
      (4)cross_stddev / cross_tail_mean_q75 读时间位置的稳定性与上尾,(5)对 day_std(Ret) / day_mean(Ret) 做截面残差,把波动与当日收益从核心里拿掉。
      为什么样本外还会在:这是参与者构成 / 日内资金节奏的结构属性,不依赖某段行情;失败方式是对核心的平滑后几乎退化为日度噪声而不出 head。
      数学检查:day_argmax 并列取第一个下标、整天等值返回 0(开盘分钟),停牌票聚在 0 但被可交易掩码排除;无前视,只用当日及以前数据,最长窗口 60 日。
