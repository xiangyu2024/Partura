    hypothesis: >-
      机制:分钟级「持续性」读数——日内相邻分钟之间的一阶自回归系数 day_ar1_coefficient。批 2 的 head 里反复出现 day_ar1_coefficient(Low / Ret / Volume)
      与 day_durbin_watson,但都被叠在 cross_cov / cross_regres 的深层结构里(分数 -1.2 到 -1.9,亏在结构噪声而不是读数本身)。这里把它拿出来单独用并做慢平滑。
      三种读数:(a)day_ar1_coefficient(Ret) = 分钟收益的一阶自相关,为负是买卖价差弹跳 / 流动性提供者的回吐,为正是订单拆分(机构分单、趋势性执行),
      20-60 日均值是个股微观结构与参与者类型的慢变属性;(b)day_ar1_coefficient(Volume) 或 Amt = 成交的时间聚集性(成交脉冲还是平稳),
      持续性高说明有拆单算法在持续吃单;(c)day_ar1_coefficient(abs(Ret)) = 波动聚集的日内持续性,减去 (a) 得到「波动持续而方向不持续」的纯噪声交易成分,
      并可对 day_std(Ret) 做截面残差去掉波动水平。算子实现:day_* 先把分钟序列压成日度读数,再用 cross_mean / cross_ema / cross_regbeta / cross_corr 做 30-60 日平滑或两种持续性之间的滚动关系,
      cs_bucket_zscore 在流通市值分桶内去规模。为什么和库、本批 head 不同:head 是 cross_cov / cross_regres / durbin_watson 叠多层的复合结构,
      这里是单层读数加慢平滑,骨架与 5583 条库骨架不同(库禁令在 GP 里再保证一次);第 1 轮的 N 位读的是量加权收益与时段收益,这次读的是分钟序列的时间依赖结构,度量的东西不同。
      为什么样本外还会在:订单拆分和价差弹跳是交易机制属性,不依赖行情;最可能的失败方式是被流动性控制吃掉(价差弹跳与流动性高度相关),此时不出 head,
      种子里对 day_std(Ret) 与流通市值的残差 / 分桶写法就是为了把这部分去掉。数学检查:day_ar1_coefficient 在整天等值(零成交)时分母近零,
