  hypothesis: 机制:日内动量 / 反转的持续性,读的是「开盘一小时与尾盘一小时的收益关系」。短周期里开盘段的价格由隔夜信息和散户情绪决定,尾盘段由机构调仓和收盘集合竞价前的资金决定;同一只股票这两段是同向还是反向,是个股参与者构成的稳定属性(散户主导的票尾盘回吐开盘冲动,机构主导的票尾盘延续趋势)。算子实现:in_slice(Ret,
    a, b) 取分钟段,day_sum 求段收益,cross_corr / cross_regbeta 在 60 到 120 日窗口里估计两段收益的滚动关系,窗口长所以换手低;也用
    cross_mean(mul(开盘段收益, 尾盘段收益)) 这种符号一致性读法。为什么与库和本批 head 不同:head 全部是价位(Close/Vwap/High)的分钟级
