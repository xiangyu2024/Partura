  hypothesis: 机制:大单方向的知情交易痕迹。本批三个 head 的内核都是「价格分钟序列与收益的日内 R² / 相关」再叠价位的 sigmoid(sqrt(Close)),全部为负分(-0.37
    ~ -0.45,train 与 valid 都负),说明价位口径下的日内形态没有毛超额,亏在换手。换一个读法:同一个分钟收益,用成交量加权与等权的差(量大的分钟涨还是跌)。day_wmean(Ret,
    Volume) - day_mean(Ret) = 成交量与分钟收益的协方差 / 平均量,读的是「资金集中涌入的那些分钟价格往哪走」;持续在放量分钟上涨的票有被动方在吃单,机构建仓拆单留下的是这种痕迹,而且是慢变的参与者属性,20
    到 60 日平滑后名次稳定、换手低。同族的读法还有量大分钟的收益与量小分钟收益之差(in_topk_masked(Ret, Volume, k) 取成交量最大的
    k 分钟的收益)、day_corr(Ret, Volume) 的 60 日滚动均值、成交额加权 Vwap 对收盘价的偏离。为什么和库不同:库里最近的是 day_signed_ratio(Ret,
    放量分钟的 Volume) 与 in_topk_masked(Ret, Amt, 20) 这类单日读数;这里全部加 20 到 60 日的 cross 平滑,并用
    cs_bucket_zscore 在流通市值分桶内取 z 分数,去掉规模暴露;种子骨架都与两个库的 5583 个骨架逐个不同(由库禁令在 GP 里再次保证)。为什么样本外还会在:机制是微观结构里「放量方向」的知情度,不依赖某段行情;最可能的失败方式是被流动性
    / 反转控制吃掉,那样这一位不出 head。数学检查:Volume 为 0 的停牌日 day_wmean 分母为 0 得 NaN 而不是爆点;Ret 为分钟收益有界;无前视,全部只用
    t 日及以前数据,最长窗口 60 日。
