    reasons: '创新度 3。核心是成交量加权分钟收益减等权分钟收益(day_wmean(Ret, Volume) - day_mean(Ret)) 的截面平滑，度量的是量与分钟收益的协方差。快照三个 head 全是价位口径(Vwap / Close 与 Ret 的 in_r2 再叠 sigmoid(sqrt(Close)))，相关度表里原始 |ρ| 最大 0.28、残差 |ρ| 最大 0.18，不是同一个度量。但种子 1 与 20 日反转控制原始 |ρ| 0.55，种子 2 与波动控制 0.50，种子 6 与反转控制 0.50，说明有一部分是控制变量的换写法，所以只给 3，不给 4。合理度 4。逐个算子核对：day_wmean 用 |Volume| 加权，分母 clamp 到 1e-30，停牌日 Volume 为 0 时得 NaN 而不是爆点；day_corr 对零方差返回 0，不爆；cross_mean / cross_ema 是正窗口，只用 t 日及以前的分钟，无前视。种子 5 划掉，理由是数学问题：in_topk_masked(x, y, p) 的实现(dt_in.py:684)按第一个参数 x 即 Ret 取最大的约 (有效分钟数+1)//p 个分钟，返回的是 y 即 Volume 在这些分钟的值。于是 sub(day_mean(...), day_mean(Ret)) 是成交量水平减收益率，量纲不同，结果被成交量水平主导。相关度表与此一致：它与流动性控制 |ρ| 0.67、与已知族 0.71，实际是流动性量。笔记里写的「取成交量最大的 20 分钟收益」与算子不符(key 是 Ret，p=20 是约 1/20 比例而非 20 分钟)。若要的是原意，应写 in_topk_masked(Volume, Ret, 20) 再减 day_mean(Ret)，但这是 PI 的事，审计不替它改。其余种子 1、2、3、4、6、7、8、9、10、11、12 无数学问题，保留 11 个，满足 ≥4。如果它有 alpha，最可能来自放量分钟的收益方向反映的资金集中去向(量加权与等权收益的差)，经 20 到 60 日平滑后的慢变参与者属性；最可能的失败方式是被反转与波动控制吃掉，那样出不了 head。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [2]
    reasons: '创新度 4。三个 head 全部由价位口径的分钟 R² / 相关构成，而这一位只用分钟收益的日内段和(in_slice 取 x[:, a:b+1] 后 day_sum)，骨架里没有价位，也没有 R²。相关度表里 12 个种子对 head 的原始 |ρ| 全部 ≤ 0.07，残差 |ρ| ≤ 0.03；对 5 个控制的原始 |ρ| 全部 ≤ 0.09，无一与控制重合。不给 5，因为种子 1 与种子 2 是同一对序列上的同一统计量，只差窗口。合理度 4。算子链核对：cross_corr / cross_regbeta / cross_regres 是正窗口 60 到 120 的 rolling_ols(y ~ alpha + beta*x)，t 日值只用 t 日及以前的数据；cross_delay(·, 1) 把值向后移一天(dt_cross.py:150)，种子 10 用的是前一天的第二段，无前视；cross_mean(mul(...), 30) 是段收益乘积，量纲一致。划掉种子 2，理由是重复：它与种子 1 是同一对序列、同一统计量(cross_corr)，只把窗口从 60 改到 120，两者共享绝大部分样本，视为同一想法的换皮。保留的 11 个不构成数学问题。两点提醒不算问题：(1) 下标段与描述的时段只大致对应，例如 181 到 230 大致是 14:00 前后，并非严格的「尾盘一小时」，分钟下标约定未核对；(2) cross_corr 在窗口内近常数时返回 0 而非爆点，只影响停牌多的票，可交易掩码已排除。如果它有 alpha，最可能来自参与者构成这一慢变属性：散户主导与机构主导的票，开盘段与下午段收益的同向或反向关系不同，且这种关系在 60 到 120 日窗口里相对稳定；最可能的失败方式是它其实只是日内收益的一种持续性，与反转控制重合，那样出不了 head。'
