- type: N
  hypothesis: >-
    机制:股票自己和自己比,按成交量状态拆开收益。B088 这一批(以及整个库)读收益时从不区分「这一天有没有成交量」:同样一个大涨日,放量 3 倍的和缩量的是两件事。
    Gervais–Kaniel–Mingelgrin(2001)的高成交量收益溢价:异常放量日代表信息 / 被关注,之后的收益更高;Llorente–Michaely–Saar–Wang(2002)的动态量价关系:
    在投机性交易主导的股票里,放量的价格变动倾向于延续,在对冲性交易主导的股票里倾向于反转,所以「量与收益的相关」本身是一个股票层面的信息含量读数。
    这条线的好处是它们都是股票内部的状态对比,天然把波动、规模、流动性这类「股票层面的水平」减掉(AV 用股票自己 60 日平均成交额归一,高低量日各自对本股比较),和新尺子的 5 个控制与两个冠军的单调 / 多项式暴露几乎正交。
    算子怎样实现:AV = day_sum(Amt) ÷ cross_mean(day_sum(Amt), 60)(异常放量比,含当天、用的都是当天收盘前已知的数);RC = cs_demean(ts_delta(log(day_last(Close)), 1))(整日含隔夜的相对市场对数收益;B088 的 R 只读盘中)。
    11 个种子:(1)高量日(AV > 1.5)的 120 日平均相对收益;(2)缩量日(AV < 0.7)的平均相对收益;(3)两者之差(同一只股票内部的放量 − 缩量对比);(4)上涨日(RC > 0)的成交额占比,即累积 / 派发;
    (5)AV 与 RC 的 120 日相关(Llorente 式的量价关系);(6)量加权相对收益减等权相对收益(日频的「资金流经历的收益」,与按分钟成交额加权的日内 day_wmean 不同,这里按天、用异常放量比加权);
    (7)近 60 日最大异常放量(事件强度);(8)与(9)异常放量 × 相对收益的 60 日最大 / 最小(带成交量确认的 MAX 与下端);(10)缩量日的最大相对收益(无量上涨,噪音型的 MAX);
    (11)滞后一日的 AV 与当日 RC 的相关:这只股票自己「放量之后次日」的历史反应,是延续还是反转。
    和库里已有的不同:库里与此最近的是手写的 5 日窗口 ts_corr(cs_rank(day_sum(Amt)), cs_rank(日收益))(量价相关,窗口短、换手高、没有自身归一);库里没有一条把 day_sum(Amt) 用自己的 60 日均值归一成异常放量比,也没有一条用成交量状态去切分日度收益求条件均值 / 最大值;批内的 MAX 链只在 R 上叠最大值。
    11 个种子的骨架逐个对照过两个库的骨架集,都不在其中。它们不是 B088 的换写法:读的是量价条件关系而不是极值水平。
    为什么样本外还会在:来源是投资者注意力与知情交易的差别(放量日的价格信息含量不同),与行情阶段无关;A 股散户占比高,量价关系比成熟市场更强也更稳;窗口 60 ~ 120 日,换手低。预期不高:新尺子去掉了流动性、已知成交额族和两个冠军,这批读数里和成交额水平相关的部分会被拿走,剩下的是「状态对比」。
    数学检查:(a) 无前视:AV、RC 都只用当天及以前的数据,滞后项用 ts_delay;窗口含当天;(b) 数值:除数 cross_mean(day_sum(Amt), 60) 在停牌满 60 日的票为缺失,引擎对不可交易日置缺失,不产生爆点;
    比值类种子的分母是「事件数 + 1」或「成交额之和」(大于 0),量级 1e8 ~ 1e11 在 float32 内;is_gt / is_lt 在缺失日返回 0,cross_sum 把缺失日当 0,对事件求和是对的;
    种子 7 ~ 11 取值连续,种子 1 ~ 3 的分子是连续收益之和,不会落到只有约 121 档的离散取值上。
