  core: 'cs_demean(sub(day_mean(Ret), 0.5))'
  hypothesis: >-
    核心 R = cs_demean(sub(day_mean(Ret), 0.5)):每只股票每天「盘中分钟收益均值」相对全市场的位置(Ret 第 0 根恒为 0,所以不含隔夜跳空;sub 一个常数在 cs_demean 下是空操作)。
    B088 的 8 个成员和本快照的 3 个 head 全是同一个原子 R,外面只套「硬滚动最大值 + pow_2 + 嵌套」:库只读了 R 路径的上端极值,从没读过它的其它形状。
    拆解表给出的线索不在信息里、而在持有时间里:R 本身 train / valid −4.33 / −3.69(符号 −1,换手极高,成本吃光),一层 ts_max(40) −1.41,嵌套 ts_max 两层 −0.42,外层窗口再拉到 60 则 −0.12(valid +0.01)。
    分数随窗口 / 层数单调变好、而与已知族的 ρ 一直 −0.3 ~ −0.45 不变,说明这条链上被尺子留下的差别主要是「换手」而不是「读到了更好的东西」;R 的路径里有信息(原样秩 IC 约 −0.045)但还没有被慢而正交地读出来。
    本轮的假设:新尺子已经去掉了股票层面的波动 / 规模 / 流动性 / 反转 / 已知族 / 冠军暴露,剩下的只能来自股票「自己和自己比」的路径形状。
    所以外围不再用「最大值」读 R,而是换成 12 种互不相同的形状统计,窗口都在 60 ~ 120 日,慢到 15 bp 下换手低:
    (1) 漂移:cross_ema(R, 60) —— 盘中相对收益的累积,即 Lou–Polk–Skouras(2019)「隔夜 / 日内拔河」里日内一侧(散户资金流压力,累积后倾向回吐);
    (2) 下端极值:嵌套 ts_min 与上端对称(库 5583 条里 R 上没有这条链),读恐慌日 / 抛压出清;
    (3) 上下极值之和(偏度代理)与「总和扣掉最大与最小」(去掉彩票日的稳健漂移);
    (4) 连续性:跑赢市场日的 EMA 占比,与 Da–Gurun–Warachka(2014)的信息离散度 ID = sign(累计收益) × (跌日占比 − 涨日占比),青蛙效应:渐进式信息引起的动量强于跳跃式;
    (5) 极值时点:最大 / 最小日在窗口中的位置的 EMA,以及两者之差(先跌后涨还是先涨后跌),极端日的新旧;
    (6) 持续性:R 的一阶自相关;(7) 盈亏比:正部分之和 ÷ 负部分之和的绝对值(无量纲,不随波动水平单调);
    (8) 「跳跃 vs 漂移」:cs_rank(120 日最大) − cs_rank(120 日均值),同样的总收益,靠一次大涨还是靠许多小涨;(9) 极值新鲜度:30 日最大 − 120 日最大(最大值是不是最近才创的)。
    它们和 head 的不同:head 是同一个硬最大值反复嵌套,都是「水平 × 波动」类;这里的统计量全部在股票自己的路径内做对比(占比 / 时点 / 差 / 比 / 自相关),和波动、规模、流动性控制的单调关系弱,所以不会被尺子整块去掉。
    库 5583 条里以 R 为底的 49 条全是 ts_max / pow_2 / cs_demean 的嵌套,没有一条在 R 上用 ts_min、cross_min、cross_sum / cross_mean、is_gt / is_lt、cross_argmax、自相关或盈亏比(cross_ema 是新增算子,库里 0 次);12 个种子的骨架我用库的 skeleton_key 逐个对照过两个库的骨架集(没有一个在库里)。
    为什么样本外还会在:来源是 A 股散户主导的日内资金流压力与「连续 vs 跳跃」的信息吸收差异,这两条机制与行情阶段无关,2018 ~ 2025 年结构不变;窗口 60 ~ 120 日、EMA 半衰期 20 ~ 120 日,换手比库里的 head 更低,不依赖某一段行情。
    数学检查:(a) 无前视:所有窗口是含当天的尾随窗口,t 日收盘后算、t+1 才交易;(b) 数值:R 量级约 1e-5 ~ 1e-4(分钟均值),盈亏比的分母是 120 日负部分之和的绝对值(典型 1e-3),eps 取 1e-7 只在整窗无跌日时起作用,不会成为爆点;
    is_gt / is_lt 在缺失日返回 0(停牌日既非涨也非跌),cross_ema 跳过缺失并重新归一,频率类种子外面都套 EMA 以保持取值连续(避免只有约 121 档取值被 distinct 门槛判废);(c) 窗口 ≤ 120,热身期占全历史 < 6%。
