  why: >-
    烂部件 = 外层最大值的窗口太短、且是单个观测的硬最大。依据:拆解表里外层 30 → 60 把分数从 −0.40 拉到 −0.12(增益 +0.28,valid 由 −0.38 到 +0.01),
    外层 30 → 15 则退到 −0.62,单调说明差在换手 / 单点噪声,不在 R 里的信息。变体:外层窗口 90 与 120(换成 cross_max 以免整块 (D, S, 窗口) 进内存);
    把外层硬最大替换成 120 日里内层 40 日最大序列的上四分位均值 / 75% 分位数(对单点不敏感);或替换成 120 日均值(检验「极值」本身是否是烂的)。
