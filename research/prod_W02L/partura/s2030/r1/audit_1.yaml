slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      创新度 4。核心 cs_demean(sub(day_mean(Ret), 0.5)) 是快照里 R1 头 pow_2(ts_max(ts_max(R,40),30)) 与 R2 头 pow_2(ts_max(pow_2(ts_max(ts_max(pow_2(ts_max(R,30)),10),20)),30)) 的原样子树；R3 头内层是 -0.5 版本，cs_demean 消去常数后截面上等价。相关度表 core 行：与头的原始 |ρ| 0.006、残差 0.047，与五个控制的最大 |ρ| 0.17（rev），E 位的核心门槛通过。
      12 个种子与三个头的原始 |ρ| 最大为 0.62（种子 3，最像 R2 头）、0.53（种子 2，R1 头）、0.51（种子 10）、0.49（种子 1），没有到 0.7；与五个控制最大 0.48（种子 1 与 vol），没有到 0.8，不触发自动划掉。残差 |ρ| 多数很低（种子 9 0.02、5 0.03、8 0.19、6 0.20、4 0.21、1 0.25），但种子 3 残差 0.63、种子 11 0.43、种子 7 0.38、种子 12 0.36、种子 2 0.33、种子 10 0.31。种子 3（max90 加 min90）最接近换皮：max 分量与 R2 头同源，只有 min 分量是新的；它没到「同一个东西」的程度，不划。种子 7 与种子 8 同含 argmax 的 EMA 项，两两相关不在相关度表里，不划。
      给 4 不给 5：我在 inputs/libs_train.csv 里核过，库里 R 原子（cs_demean(sub(day_mean(Ret),c)) 形式）的 49 行几乎全是 ts_max 与 pow_2 的嵌套，外层只另有 pow_1_5 与 ts_decay_linear；cross_ema 漂移、is_gt 占比、argmax 时点、自相关、正负比、max 与 min 的组合在 R 上都没有出现，这是真正的新读法。种子 2、3、12 仍属于极值族，所以不给 5。库里另有 ts_min(day_mean(Ret), 20) 一行，是未去截面均值的原始分钟收益，与种子 2 同源但原子不同（截面去均值去掉了每日的市场分量，跨日取 min 的结果不同），不划。相关度表只覆盖快照的 3 个头与 5 个控制，别的流与 W01 的头不在表里；我在别的流的 loc.md 里看到 cross_argmax(day_quantile(Open)) 与 cross_autocorr_s1(day_ar1_coefficient(Volume)) 这类时点与自相关头，原子不同，不划。
      合理度 4。逐个核对（源码在 AlphaCube-steering/src/alphacube/operators）：cross_* 是日轴滚动，rolling_windows 左侧补 NaN，因果（common.py:433）；cross_ema（partura/ops_ext.py:172）因果、跳过缺失；ts_delay 只向后移；种子不含 ts_rank、cross_rank、in_rank_rolling，因此没有 nanrank_last「当天缺失取 0」的停牌陷阱（common.py:529）；种子 11 的 cs_rank 走 common.rank，缺失输出 NaN，不受影响；没有 ts_spearman 与 nt_*。种子 10 的分母 +1e-7：|N| 典型量级约 1e-3，只有窗口里几乎全是正的相对收益（次新、有效日很少）时才会爆，而截面按排名转换，不主导。种子 4 的 sum 减 max 减 min 在有效日不足 3 天时退化（1 天时等于 -x，2 天时等于 0），只影响次新票，份额可忽略。
      定义瑕疵，不挡：common.py:248 的 is_gt、is_lt 对缺失返回 0（x > value 对 NaN 为假），而不是缺失；cross_ema 只跳过 NaN，所以种子 5、6 的停牌日被当成「不涨」「不跌」的观测计入 EMA 权重，占比类被乘以（1 减停牌占比）。PI 数学检查 (b) 说 cross_ema 跳过缺失，对这两条不成立。对绝大多数票这个量很小，只影响长期停牌后复牌的票，不算「主要由缺失值决定」。种子 7、8 的 cross_argmax、cross_argmin 的 pct 除以的是有效日数而不是窗口长（common.py:516 起），有内部停牌的票时间读数被放大，同样是小偏。cross_corr 类在有效对很少时结果不稳（次新票可能取到极端值；上一轮 s2020 审计记过同一算子，本轮未核对 rolling_pair_reduce 的末段）。这三条都不是「主要由」，不挡。
      如果它有 alpha，最可能来自涨跌停锁定、板块宽度（LimitWidth）与次新（ListAge）的暴露，其次才是慢漂移本身的盘中信息。理由：R 是盘中分钟收益的均值，一字板日的分钟收益近似为 0，所以 R 机械地等于负的当日截面均值，这些日子对 max、min、占比的读数有系统影响；而 LimitWidth 与 ListAge 都不在五个控制里。PI 笔记里的「板块 / 次新残差」疑点，本轮无法排除。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      创新度 4。AV = day_sum(Amt) 除以自己 60 日均值，再与 RC（整日含隔夜的相对收益）配合，头里没有这个结构（头只读盘中 R）。相关度表：与三个头的原始 |ρ| 在 0.09 到 0.67 之间；种子 4、5、11 与头的 |ρ| 不超过 0.21，残差不超过 0.15（种子 11 残差 0.01，种子 4 残差 0.04）；与五个控制最大 0.42（种子 8 与 vol），没有到 0.5，种子 1、3、4 与 liq 为 0.25 到 0.27。
      种子 8（AV×RC 的 60 日最大，与 R1 头原始 0.67、残差 0.56）、种子 9（0.53 / 0.37）、种子 6（0.54 / 0.38）与头的 MAX 族相近：RC 与 R 共享截面收益，max 与 min 挑的是同一批日子，相当于把头的 max 族乘上成交量权重。这是部分换皮，但没到 0.7，也不是同一个量，不划。
      需要更正 PI 笔记：笔记说库里没有把 day_sum(Amt) 用自己 60 日均值归一成异常放量比的行，这不对。我在 inputs/libs_train.csv 里核到 div(day_sum(Amt), ts_mean(day_sum(Amt), 20 或 60)) 这类形式（抽查 3 行，都包在 cs_rank 或 ts_delta 里，其中一行是 60 日）。但 AV 进入 is_gt、is_lt 条件的行数为 0，与 RC 的乘积取 max、min 的行数为 0，与 RC 的 corr 的行数也为 0。所以新意在条件切分与 AV×RC 的结构，不在归一本身，因此给 4 不给 5。种子 5 与 11 同为 120 日 cross_corr（同期与滞后一日），两两相关不在相关度表里，不划。
      合理度 4。逐个核对：AV 与 RC 都只用当天及以前的数据（cross_mean 含当天，cross_* 因果），种子 11 的 ts_delay(AV,1) 与当日 RC 配对，没有前视。分母：cross_mean(day_sum(Amt),60) 只有整个 60 日都停牌时才是 NaN，不会为 0；种子 4 的 cross_sum(day_sum(Amt),120) 与种子 6 的 cross_ema(AV,60) 都是正量，没有近零除数。种子 1 到 3 分母的 +1 是事件数收缩（事件很少时均值向 0 收缩），是有意设计，不是错误，但会让值部分依赖事件次数，少事件的票聚在 0 附近。
      定义瑕疵，不挡：(i) 种子 10 的 cross_max(RC·1[AV<0.8], 60)：AV 不小于 0.8 的有效日把 0 计入 max，等于把结果压到不低于 0；窗口里没有任何缩量正收益的票并列在 0，只在缩量日几乎都下跌时出现，占比小。(ii) 种子 4 的分子 mul(day_sum(Amt), is_gt(RC,0))：复牌首日或次新首日 RC 为 NaN，is_gt 返回 0，它的成交额进了分母却没进分子，每次复牌一天，影响小。(iii) 种子 5、11 的 cross_corr 在次新票的有效对很少时结果不稳（同槽 a 的说明）。
      如果它有 alpha，最可能来自涨跌停的状态，其次才是注意力与信息含量。种子 2 与 10（缩量日的平均与最大相对收益）最可能装的是「缩量大涨」，即一字涨停或无量封板；种子 1、3（放量日均值）同理可能是放量涨停与换手板。Gervais–Kaniel–Mingelgrin（2001）的放量溢价与 Llorente 等（2002）的量价延续、反转是文献上的解读，但在 A 股里要先排除涨跌停状态（用 LimitWidth 与一字板频率做对照），否则会把涨停效应误读成量价信息。种子 5、11 的标准误大，本轮不做更多判断。
R:
  - head: 'pow_2(ts_max(ts_max(cs_demean(sub(day_mean(Ret), 0.5)), 40), 30))'
    soundness: 4
    reasons: |-
      五个变体都因果，无 nanrank 与 ts_spearman。cross_max(…, 90 或 120) 与 ts_max 同为日轴滚动最大（只是算子名与轴的标签不同），把外层从 30 拉到 90 或 120 日是换手与记忆长度的改动，数学上没有问题。cross_tail_mean_q75 与 cross_quantile_q75 用上尾均值与 nanquantile，只取有效日。cross_mean(ts_max(R,40),120) 是检验极值本身的对照，不伤合理度。
      与原头的原始 |ρ| 为 0.72 到 0.85，即都是同一个量的慢化版，若分数过线会走替换分支，不是新头。机制清楚，与 PI 拆解表（外层 30 到 60 的增益）一致。
  - head: 'pow_2(ts_max(pow_2(ts_max(ts_max(pow_2(ts_max(cs_demean(sub(day_mean(Ret), 0.5)), 30)), 10), 20)), 30))'
    soundness: 4
    reasons: |-
      变体口径同 R1 组。注意中间的 pow_2(ts_max(R,30))：当 30 日最大值为负（30 天每天都跑输截面）时，平方会把负的小值与正的小值映到同一块 0 附近，即落在底部；这种票极少，且不在多头头部，不影响结论。原头与变体的原始 |ρ| 为 0.73 到 0.81，同一个量的慢化版。
  - head: 'pow_2(ts_max(ts_max(cs_demean(sub(ts_max(cs_demean(sub(day_mean(Ret), -0.5)), 10), -0.5)), 30), 30))'
    soundness: 4
    reasons: |-
      变体 1、2、4 的口径同上（对截面去均值后的嵌套最大取慢化或分位数）。变体 3 pow_2(ts_max(ts_max(ts_max(cs_demean(sub(day_mean(Ret), -0.5)), 10), 30), 30)) 没有数学问题，但它与 R1 头的原始 |ρ| 为 0.994、残差 0.999，与原 R3 头为 0.967，等于把 R1 头换个写法放进来。若被选中，会把 R3 头换成 R1 头的复本；它的分数应接近 R1 头（约 -0.40），比 R3 头（-0.43）只好 0.03，达不到替换线 +0.1，所以不会真替换，但计划里应删掉。这不是数学问题，不扣合理度。
summary: '流 2030 第 1 轮审计：槽 a（E，核心 R）创新 4、合理 4；槽 b（N，成交量状态下的条件收益）创新 4、合理 4；两槽都通过，无种子划掉。R 三组合理度均 4，R3 的变体 3 与 R1 头近乎重复（秩相关 0.99），建议删。无硬性数学问题；定义瑕疵（is_gt 对停牌返回 0 被 cross_ema 计入、argmax 的 pct 除以有效日数、AV 进入 max 时的 0 地板）见理由。'
