  core: div(day_sum(Amt), cross_mean(day_sum(Amt), 30))
  hypothesis: 核心 AV30 = day_sum(Amt) ÷ 自己 30 日均值(异常放量比,股票自己和自己比的成交状态;不含任何价格/收益,水平被分母消掉)。第
    1 轮 N 位里 AV 与整日相对收益 RC 相乘后取 60 日最大(外围 = cross_max,与 AV60 配),是本流唯一接近正的一族(train/valid
    约 +0.05~+0.30 / +0.05~+0.57,最好 +0.09),但那些候选全都是「AV×RC 的极值」;本轮不再读极值,而是把 AV30 的『路径形状』和『与盘中收益的联动』分开读出来(机制
    = 注意力的不稳定性与量价关系的因果方向):(1) cross_stddev(AV30,120) / 自相关 / 75% 分位尾部均值 / 偏度:放量事件是持续的(机构建仓)还是脉冲式的(散户注意力冲击),Barber–Odean
    注意力驱动买入后均值回归;(2) cross_corr(AV30, 盘中相对收益,120) 与 cross_corr(AV30, 昨日 RC,120):今日放量与盘中收益同向(Llorente
    延续型)还是滞后一日(量跟随价格);盘中 day_mean(Ret) 不含隔夜跳空,和第 1 轮用的整日 RC 不同;(3) 放量方向加权:AV30×sign(盘中收益)
    的 120 日和 ÷ AV30 之和,即『净放量方向』;AV30 与 |RC| 的相关(放量是不是只发生在大波动日,波动被控制掉后看剩余);(4) argmax
    的 EMA 与 2 倍以上放量日占比:最近一次放量事件的新旧与频率。与库里已有的不同:第 1 轮 E 外围见过的写法全是 cross_max(mul(AV,·),60)
    家族;这里的外围是自相关 / 标准差 / 相关 / 偏度 / argmax / 方向加权,12 个种子互相也完全不同,骨架逐个不在两库中(库里没有以 AV
    为底的 cross_corr / cross_autocorr / cross_stddev)。为什么样本外还会在:A 股散户占比高、注意力冲击与量价联动的方向是行为性的,与行情阶段无关;窗口
    100~120 日 + EMA 半衰期 5 日换手低;核心是无量纲比值,新尺子去掉的流动性 / 波动 / 已知族 / 冠军线性暴露无法直接解释它。数学检查:无前视(窗口含当天,t
    日收盘后计算);AV30 的分母为停牌满 30 日的票缺失而非 0,不产生爆点;is_gt 在缺失日为 0,cross_corr 在窗口内有效点不足时为缺失;含
    sign 的种子分母 + 1e-7 且分母是 120 日放量比之和(≈120),无近零除数;各种子取值连续,不会因离散档位被 distinct 门槛判废。
