- type: N
  hypothesis: 机制:开盘第一分钟成交额(day_first(Amt))是集合竞价后的第一波主动流,承载散户的隔夜注意力 / 订单积压;它的『不稳定性』而非水平携带信息。本流
    head 里最好的是 abs_(ts_std(day_first(Amt),50))(拆解表窗口 50→100 train/valid +0.39/+0.57,即得分约
    +0.39,但那条用的是 ts_std 的水平,强烈随规模 / 流动性走,与已知族相关,过不了新尺子);另一个 head cross_autocorr_s1(day_ar1_coefficient(Amt)
    − day_first(Volume),60) 得 +0.22。两者都说明『开盘分钟的成交额行为』是批 B089 那种 day_first(F) 家族里真正有读数的部分,而库里读它的方式全是嵌套分位数
    / 水平。本轮用无量纲的方式读同一个现象,把规模去掉后看剩下的:(1) 开盘占比 OS = day_first(Amt) ÷ day_sum(Amt):开盘集中度的
    60 日 EMA、100 日标准差、一阶自相关、20 日与 120 日 EMA 之差(趋势);(2) 开盘相对放量 OR = day_first(Amt)
    ÷ 自己 30 日均值:100 日标准差 / 最大 / 75% 分位尾部均值;(3) 变异系数 cross_stddev(day_first(Amt),100)
    ÷ cross_mean(day_first(Amt),100)(head 水平版的无量纲化)及其对整日成交额波动的比;(4) day_first(Amt)
    与 day_sum(Amt) 的 100 日相关(开盘是否跟随全天)、昨日 OS 与盘中相对收益的相关(开盘拥挤是否预示盘中价格压力)、以成交量代替成交额的
    OS 标准差(检验是不是价格水平的影子)。和库里已有的不同:库里 day_first 只出现在 ts_quantile 嵌套、ts_std 水平和 ar1
    − first 的差里;没有一条把 day_first(Amt) 除以全天成交额或自己均值后读它的二阶矩 / 自相关 / 联动。骨架逐个不在两库里。为什么样本外还会在:开盘集合竞价后的第一分钟由隔夜消息与散户订单驱动,A
    股此机制稳定;无量纲化后与 Amt 水平族区分开,窗口 100 日 + EMA 半衰期 5 日,换手低。数学检查:无前视(day_first 只用当天第 1
    分钟,t 日收盘后才算,t+1 交易);分母 day_sum(Amt) 与 cross_mean(day_first(Amt),·) 对停牌票为缺失而非 0,无近零除数(集合竞价第一分钟成交额恒为正);OS
    取值连续。
