    reasons: '开盘占比 OS = day_first(Amt) ÷ day_sum(Amt) 与开盘相对量 OR = day_first(Amt) ÷ 自身 30 日均值,都是把规模拿掉后读开盘分钟。快照里 abs_(ts_std(day_first(Amt),50)) 与 cross_autocorr_s1(sub(day_ar1_coefficient(Amt), day_first(Volume)),60) 是同一原子(day_first)的水平与自相关版本,本位多数种子对它们的残差 |ρ| 在 0.4–0.65 之间。新颖度给 3 而不是 4,理由是:无量纲化后确实不是同一个量(种子 1、6、7、8、11、12 残差大多在 0.5 以下,6 只有 0.04),但种子 2、3、4、10 对 abs_ts_std head 的残差在 0.41–0.58,仍有一部分是它的换写。划掉两个种子:种子 9(cross_stddev(day_first(Volume)÷day_sum(Volume),100))与种子 2(cross_stddev(OS,100))的相关画像逐位相同(raw 0.28、残差 0.546,各控制 0.16/0.20/0.05/0.09/0.36 相同),是同一个开盘集中度的成交量写法,重复,划掉;种子 5(cross_autocorr_s1(OS,60))与 head cross_autocorr_s1(ar1(Amt)−first(Volume),60) 的 raw |ρ| 为 0.687、残差 0.65,同算子同窗口同一开盘分钟量的自相关,度量同一个东西,划掉。剩余 10 个种子。数学核对:day_first 只用当天第 1 分钟,t 日收盘后才算,t+1 交易,无前视;分母 day_sum(Amt) 与 cross_mean(day_first(Amt),·) 对停牌票为缺失而不是 0,无近零除数(集合竞价首分钟成交额为正);种子 6 的昨日 OS 只滞后一日,无前视;种子 3、8、12 的 30 日均值分母为正量,cross_max / 分位数不会爆点。种子 11(cross_corr(first(Amt), day_sum(Amt),100))是两个成交额水平的共动,与 liq 控制 0.145、与 head 残差 0.47,保留。如果它有 alpha,最可能来自开盘集合竞价后第一分钟的散户订单积压与隔夜消息消化(开盘集中度的动态变化),而不是 Amt 的水平。'
