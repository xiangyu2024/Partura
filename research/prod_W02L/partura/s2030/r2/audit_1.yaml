    reasons: '核心 AV30 = day_sum(Amt) ÷ 自身 30 日均值,在定位共性表里有原样子树(核心合规)。核心与 5 个控制的 |ρ| 最大为 rev 0.48,低于 0.8 门槛。12 个种子与快照 6 个 head 的原始 |ρ| 最大 0.62(种子 3 对 R 系 head pow_2(ts_max(...cs_demean(sub(day_mean(Ret),0.5))...)),残差 0.42),其余原始最大 0.45 以内,残差都在 0.42 以内;种子 1 与 12 的残差只有 0.16 与 0.19。对 vol 控制,种子 3、9、11 的 |ρ| 为 0.40–0.50,是波动相关的一部分,但没到 0.8,不挡。种子 3 是 cross_ema(AV·盘中相对收益,60),与第 1 轮 AV×RC 极值族是同一乘积的均值版本,统计量不同(均值 vs 最大),放行。种子 7 的 cross_max(AV,60) 减 EMA 与第 1 轮的 60 日最大异常放量有亲缘,但窗口与中心化不同,放行。种子 1/2/12 用的是 cross_corr 的量价联动,与 head 的残差都低于 0.35,是新的读法。算子核对:cross_corr、cross_ema、cross_stddev、cross_autocorr_s1、cross_tail_mean_q75、ts_skew 都是日轴滚动、缺失跳过;cross_argmax 用 nanargmax_last 而不是 nanrank_last,本位没有 ts_rank / cross_rank / in_rank,§4 的停牌记 0 陷阱不触发;无前视(窗口含当天,t 日收盘后算,t+1 交易)。两处定义瑕疵,但都达不到「主要由它决定」,不挡,记在这里:(a) 种子 6 的 cross_argmax 把窗口内位置(含缺失槽位)除以有效点数,停牌多或上市不久的票数值会被放大,上界略大于 1;(b) 种子 9 的 is_gt 对缺失日返回 0(不是缺失),停牌日被计为「非放量日」,停牌多的票被轻微压低。如果它有 alpha,最可能来自注意力驱动的放量(Barber–Odean 型买入后均值回归),以及放量与盘中价格同向的延续(Llorente 型量价关系)。'
  - slot: b
