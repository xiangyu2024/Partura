    novelty: 4
    soundness: 4
    struck_seeds: [4]
    reasons: '核心 day_ar1_coefficient(Amt) 是 head 1（cross_autocorr_s1(sub(ar1, day_first(Volume)),60)）的子树，E 规则满足；核心与 5 个控制的 |ρ| 为 liq 0.50 / vol 0.28 / rev 0.25 / known 0.50 / size 0.17，全部 < 0.8，与任何 head 的原始 |ρ| 最大 0.47，门槛内。创新度 4：保留的 11 个种子中，多数与 head 的原始 |ρ| 在 0.05 到 0.44 之间，与控制的 |ρ| 大多 < 0.4；种子 9（cross_tail_mean_q75，原始 |ρ| 0.63 对 abs_(ts_std(day_first(Amt),50))，残差 0.46）与种子 11（is_gt 占比，liq 0.59 / known 0.61）与流动性有一定重合，但都 < 0.8，按规则放行，新度不降到 3 以下。合理度 4：逐个核对算子。day_ar1_coefficient 是逐日分钟成交额的 OLS 一阶系数，对量纲不敏感，只有 var_x 的绝对阈 1e-8 以下才置缺失（AlphaCube operators/dt_day.py:367-395），无前视。cross_ema、cross_stddev、cross_corr、cross_tail_mean_q75、cross_autocorr_s1 都是尾随窗口（rolling_windows 左填 NaN；cross_autocorr 用过去的日子做滞后），cs_demean 只在截面内做。唯一要记的瑕疵在种子 11：is_gt 对缺失返回 0（common.py:248，NaN 比较为 False），停牌日进入 cross_ema 时被当成「不高于自身均值」，会把长期停牌票压低；这是局部偏差而非主导项，不划。另一件要记的事：head 的 +0.22 很可能主要来自 day_first(Volume) 的日间自相关，因为 cross_autocorr_s1(day_first(Volume),60) 与 head 的 |ρ| 为 1.00（R 变体 5），所以 E 位的「接力度」解释没有被 head 本身支持，本轮是对它的检验，不是复述。种子 4（cross_autocorr_s1(day_ar1_coefficient(Amt),60)）与同轮 R 变体 1 的表达式完全相同；按 E 规则「外围不得与已见过的含该核心的候选相同」以及重复，划掉。如果它有 alpha，最可能来自：日内成交额接力的时变性（算法拆单节奏变化、机构分批建仓与散户脉冲交替），以及接力度与价格同步性（种子 2、7、8），而不是接力度的水平。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4：day_kurt、day_skew、day_corr、day_durbin_watson、day_q_stat_std、day_argmax 六个分钟形状统计量在 loc.json 的批候选中 0 次出现；在两个库的文本导出（json / csv / md / yaml）里搜 day_durbin_watson 与 day_q_stat_std 也无命中（只查了这两个算子的文本，5583 条库本身没有逐条核对骨架）。相关度表上 12 个种子与 head 的原始 |ρ| 最大 0.67（种子 7，对 abs_(ts_std(day_first(Amt),50))），都 < 0.7，不自动划；与控制的 |ρ| 最大 0.79（种子 6，DW(Volume) 与 liq）、0.76（种子 7，liq）、0.74（种子 6，known），都 < 0.8，不自动划。扣的那一分不在种子：种子 6、7、8 与流动性偏相关。day_durbin_watson 的分母是未去均值的 x²（dt_day.py:304-320），近似 (1-ρ1)·CV²/(1+CV²)，即分钟成交量的相对离散度，稀疏交易的票它就高，所以这几条的 alpha 很可能落在流动性一侧，是换了写法的程度，但不到「同一个东西」，整个位的新度仍 4。合理度 4：所有算子已读定义。day_kurt、day_skew 用分钟内去均值的矩，有界（峰度上界约为分钟数）；day_argmax 是分钟序号，外面套 EMA 或标准差后连续；in_delay(Ret,1) 取前一分钟（dt_in.py:266），无前视；cross_ema 因果、跳过缺失。唯一的数学问题在 day_corr：AlphaCube operators/dt_day.py:231-245 的实现是 corr = cov/(sqrt(var_x·var_y)+EPS)，只有有效点 < 2 才置 NaN，所以分钟序列为常数（一字板日 Ret 全为 0，abs(Ret) 也全为 0）时返回 0 而不是缺失。PI 笔记里「day_corr 的分钟窗口内常数得缺失而非 0」的说法不对。受影响的是种子 3、4、5、12，一字板日的 corr 被当成 0 进入 EMA 与自相关；一字板日只占少数日子，不主导截面排序，所以按 §4 不挡，但请下一轮在 var 为 0 时显式置缺失。种子 12 的 cross_autocorr 对这种人工 0 的连续段也敏感（连续一字板日会产生正的一阶自相关），同样不挡。如果它有 alpha，最可能来自：分钟成交量形状的集中与尖峰（程序化均匀流 对 少数分钟的事件冲击）、量与价的同步（追涨或知情）、放量高峰的时点，而不是规模。'
R:
  - head: 'cross_autocorr_s1(sub(day_ar1_coefficient(Amt), day_first(Volume)), 60)'
    soundness: 4
    reasons: '8 个变体与 head 的原始 |ρ|：v1 cross_autocorr_s1(ar1,60) 0.44；v2 窗口 100 为 0.71；v3 窗口 120 为 0.63；v4 改为 day_first(Amt) 为 0.99；v5 cross_autocorr_s1(day_first(Volume),60) 为 1.00；v6 ar1(Volume)-day_first(Volume) 为 1.00；v7 除以 30 日均值为 0.82；v8 改为 day_first(Amt)/day_sum(Amt) 为 0.42。数学上，head 是 sub(ar1 大致在 [-1,1]，day_first(Volume) 在千到百万量级) 后取 60 日自相关；自相关对加常数与尺度都不变，所以 head 实际上就是 day_first(Volume) 的 60 日自相关（v5 与 head 的 |ρ| = 1.00），ar1 项几乎没有权重。这正是 R 要去掉的烂部件。去水平项的 v1、以及无量纲的 v8、v7 是对这个假设的干净检验；v8 分子分母都是金额，day_sum(Amt) 停牌日为缺失，无爆点。v2、v3 只改窗口，仍保留水平项；v4、v5、v6 仍保留水平（v4 是金额水平，v5、v6 与 head 的 |ρ| 为 0.99 到 1.00），属于与原 head 同一个东西的换写。这不是数学问题，但会占用评估预算，不挡。v7 的分母 cross_mean(day_first(Volume),30) 只在近一月开盘无成交的票上接近 0，不主导。整组没有数学问题，合理度 4。'
summary: '两个任务位都通过：a 创新 4 / 合理 4，划掉种子 4（与同轮 R 变体 1 完全相同），剩 11 个；b 创新 4 / 合理 4，无划，剩 12 个；R 组合理 4 保留。需记两点：(i) PI 笔记称 day_corr 的常数窗口得缺失，实际返回 0（dt_day.py:231-245），影响 slot b 种子 3、4、5、12，不主导，不挡；(ii) head 的 +0.22 近似 day_first(Volume) 的日间自相关（R 变体 5 与 head |ρ| = 1.00），slot a 的接力度解释未被 head 本身支持，本轮是检验。本审计只用 train 与 valid 的表与代码，未涉及 2026 年。'
