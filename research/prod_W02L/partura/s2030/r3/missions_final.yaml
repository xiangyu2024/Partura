  - cross_corr(day_ar1_coefficient(Amt), day_ar1_coefficient(Ret), 100)
  - cross_ema(mul(day_ar1_coefficient(Amt), cs_demean(ts_delta(log(day_last(Close)),
    1))), 60)
  - cross_tail_mean_q75(day_ar1_coefficient(Amt), 120)
  - cross_corr(day_ar1_coefficient(Amt), div(day_first(Amt), day_sum(Amt)), 100)
  - cross_ema(is_gt(day_ar1_coefficient(Amt), cross_mean(day_ar1_coefficient(Amt),
    60)), 60)
  - cross_stddev(sub(day_ar1_coefficient(Amt), cross_ema(day_ar1_coefficient(Amt),
    20)), 100)
- type: N
  hypothesis: 机制:日内成交量 / 成交额分钟序列的『形状统计量』(峰度、偏度、量价同步度、领先滞后、峰值时点、Ljung-Box 聚集度)刻画当天交易是均匀的程序化流还是少数几分钟的集中冲击;
    Admati-Pfleiderer(1988)的日内成交量模式与 Easley-Lopez de Prado-O'Hara(2012)的成交量同步知情交易概率都指向:知情
    / 机构流与散户情绪流在分钟形状上可分。 做法:用 AlphaCube 的 day_* 分钟聚合算子把每天的形状压成一个日度值,再用 cross_ema(60)
    / cross_stddev(100) / 短长 EMA 之差读它的『稳定特征』(本流 head 已显示 day_ar1_coefficient(Amt)
    的时间自相关有读数, 所以形状统计量的持续性是有信息的),种子:day_kurt(Volume) 的 60 日 EMA(尖峰度)、day_skew(Amt)
    的 60 日 EMA、day_corr(Volume, abs_(Ret))(量与波动同步度)、day_corr(Amt, Ret)(量价同向度)、 day_corr(Volume,
    in_delay(Ret, 1))(上一分钟收益对本分钟成交量的拉动,即追涨强度)、day_durbin_watson(Volume)、day_q_stat_std(Volume)(多滞后聚集度)、day_argmax(Volume)
    的 60 日 EMA(放量高峰一般在开盘还是尾盘)、 day_argmax(Amt) 的 100 日标准差(高峰时点是否稳定)、day_kurt(Volume)
    的 20 日与 120 日 EMA 之差(尖峰度趋势)。 与库里已有的不同:库里与分钟成交量有关的是 in_sustain_stddev(is_gt(in_boxcox(Volume)
    ...)) 一族(批 B090,手写库,用分钟内持续阈值超越;本流此族 score -1.5 以下)和 day_first / ar1 水平差; 没有一条用
    day_kurt / day_skew / day_corr / day_argmax / day_q_stat_std / day_durbin_watson
    把分钟形状压成无量纲日度量再做日间 EMA / 标准差。骨架逐个不在两库中。 样本外还会在的理由:日内成交形状来自市场微结构与参与者结构(程序化 vs 事件驱动),随时间变化慢;全部为无量纲统计量,规模被消掉,与新尺子里去掉的流动性
    / 市值 / 波动控制不是同一个量; 窗口 60~120 日 + 半衰期 5 日,换手低。 数学检查:无前视(分钟聚合只用当天 t 日分钟);day_corr
    的分钟窗口内常数(停牌 / 一字板)得缺失而非 0;day_argmax 取整数分钟序号,60 日 EMA 后连续, 直接取 argmax 的种子都套 cross_ema
    / cross_stddev,不会因离散档位被判废;in_delay 取的是前一分钟的值。
  inspired_by: 批 B090 的 in_sustain_stddev(is_gt(in_boxcox(Volume),...)) 分钟成交量结构一族(得分很差,说明用阈值硬读分钟成交量不可取),以及本流
    head cross_autocorr_s1(day_ar1_coefficient(Amt)...) 显示日内成交额形状有可读信息
  seeds:
  - cross_ema(day_kurt(Volume), 60)
  - cross_ema(day_skew(Amt), 60)
  - cross_ema(day_corr(Volume, abs_(Ret)), 60)
  - cross_ema(day_corr(Amt, Ret), 60)
  - cross_ema(day_corr(Volume, in_delay(Ret, 1)), 60)
  - cross_ema(day_durbin_watson(Volume), 60)
  - cross_ema(day_q_stat_std(Volume), 60)
  - cross_ema(day_argmax(Volume), 60)
  - cross_stddev(day_argmax(Amt), 100)
  - sub(cross_ema(day_kurt(Volume), 20), cross_ema(day_kurt(Volume), 120))
  - cross_stddev(day_kurt(Volume), 100)
  - cross_autocorr_s1(day_corr(Volume, abs_(Ret)), 60)
