- type: E
  core: day_ar1_coefficient(Amt)
  hypothesis: 核心 = 分钟成交额的日内一阶自回归系数 day_ar1_coefficient(Amt)(无量纲,取值约 -1~1,不含价格水平):一只票当天分钟成交额「接力」的程度,
    高 = 成交额一波接一波(算法拆单 / 机构分批执行的指纹,Easley-Lopez de Prado-O'Hara 2012 的成交量时钟思路),低 =
    孤立脉冲(散户事件冲击)。 本流唯一过正的 head(+0.22,train +0.57 / valid +0.22)是 cross_autocorr_s1(sub(day_ar1_coefficient(Amt),
    day_first(Volume)), 60), 即「日内接力度的日间自相关」;其对应的 ts_mean 外围(40 日均值)是 -1.10,单用 ts_mean(ar1)
    是 -3.40,说明水平读法没用,有用的是它随时间的『持续性 / 变化』。 本轮核心固定为 ar1(Amt) 本身,外围换成此前没试过的写法:(1) 二阶矩与变化:cross_stddev(ar1,100)、ar1
    相对自身 120 日均值的偏离再做 10 日 EMA(接力度「突然升高」= 有人开始建仓)、 高于自身均值的天数占比;(2) 联动:与盘中相对收益 cs_demean(day_mean(Ret))
    的 100 日 cross_corr(接力日价格是否同向 = 知情流),与分钟收益自己的 ar1 的 cross_corr(成交额接力与价格反转 / 动量是否同步),
    与开盘集中度 day_first(Amt)/day_sum(Amt) 的 cross_corr;(3) 与成交量版的差:ar1(Amt)-ar1(Volume)
    刚好把价格路径的自相关分离出来,再做 60 日 EMA 或自相关;(4) 与前日收益的乘积(接力度加权的收益漂移)。 与库里已有的不同:库里 ar1(Amt)
    只出现在 (a) sub(ar1, day_first(Volume)) 的 ts_mean / cross_autocorr_s1 里,而 sub 另一项是成交量水平(排序几乎由首分钟成交量决定,即规模暴露混入);
    本轮的种子全部是不带水平项的纯接力度,并读它的离散度、变化、与价格的联动,外围算子(cross_stddev / cross_corr / cross_ema
    偏离 / is_gt 占比 / mul 收益)在已见候选里都没出现过。 样本外还会在的理由:日内成交额的接力来自订单拆分执行这一结构性行为(机构规模与拆单习惯变化缓慢),A
    股机构 / 量化占比持续上升;读它的二阶矩与联动是无量纲的, 新尺子去掉了流动性 / 波动 / 市值 / 已知族 / 冠军的线性与非线性暴露后,剩下的是「谁在交易」而不是「交易多少」;窗口
    60~120 日 + 半衰期 5 日,换手低。 数学检查:无前视(day_ar1 只用当天分钟,t 日收盘后算);ar1 的分母是分钟成交额方差,停牌 /
    一字板日为缺失而非 0;cross_corr 窗口内有效点不足时为缺失;is_gt 对缺失为 0, 取值连续,不会被 distinct 门槛判废;乘 Ret
    的种子无除法。
  seeds:
