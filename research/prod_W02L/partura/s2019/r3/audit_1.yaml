    reasons: '这是 N 位。相关度表里 13 个种子与 12 个 head 的原始 |ρ| 中 11 个 ≤ 0.13, 最高的是 8 (0.59, cross_regbeta(cross_delay(mul(day_centroid(Amt), day_sum(Amt)),1),...)) 与 11 (0.53, mul(day_gini(Volume), day_sum(Amt))); 与控制 |ρ| 最高 0.25 (8 与 liq), 没有 ≥ 0.8, 没有表自动划掉的种子。新意来自算子本身: day_signed_ratio、day_centroid、day_gini、day_topw_mean、day_wmean 不在任何 head 的 x 里, 而且在 loc.json 的 307 个候选池里一次都没出现 (已 grep r1-r3 的 loc.json, 0 次命中); 我没有在 5583 条全库上核对 (未读库), 只按候选池和 head 的相关度给分。合理度给 4: 所有种子都是 cross_delay(·,1) 之后再回归, 没有前视; day_signed_ratio 的分母在全天成交额为 0 时由 den>0 掩码给 NaN, 不是 inf; day_centroid、day_gini、day_wmean 都有 tot>0 或 sw>0 掩码; cross_regbeta 的 var_x > EPS 已核。机制清楚: 净买压 (up-minute 成交额份额减去 down-minute) 与时间重心, 对次日收益的斜率读作 续涨 (知情 / 趋势资金) 或 回吐 (流动性冲击), 与 Campbell-Grossman-Wang 的成交量条件反转一致。注意 3 点但不构成挡的理由: (1) 种子 10 (day_gini(Volume)) 与 11 (gini × Amt) 是 块状度 度量, 与 N 位 idea 里 "而不是成交量的块状度" 的表述不一致, 但 §3 规定种子只能因数学问题或重复划掉, 所以保留, 请 PI 知悉; (2) 种子 8 与 11 的 x 带 Amt / Volume 水平, 可能把 liq 的符号 × 尺度交互带进来 (liq 0.25 / 0.24), 与 slot a 同一风险; (3) 种子 12 的 day_topw_mean(Ret, Volume) 在 90% 分位成交为 0 的票上, thr=0 使全部分钟入选, 退化为 day_mean(Ret), 这类票占比小, 不是截面主导的定义坏掉, 不划。如果它有 alpha, 最可能来自: 日内资金方向 (day_signed_ratio) 与时间位置 (day_centroid) 的慢变参与者结构, 在 241 日窗口内的次日续涨 / 回吐关系, 而不是 High x skew 那一长串。'
