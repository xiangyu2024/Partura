    reasons: '核心 day_last(Volume) 是 3 个 head 共有的子树(prods2019Pr2a_Ea 三个 head 都含; core_cards/0 也是它), 且 core 与控制的 |ρ| 为 liq 0.56、vol 0.19、rev 0.18、known 0.60、size 0.46, 全部 < 0.8, 核心通过。表自动划掉 3、5、7、8、9 (与 head 的原始 |ρ| 为 0.87、0.87、0.93、0.81、0.81, 均 ≥ 0.7; 这五个就是 day_last(Volume) 作为 x 的裸 regbeta 与其换写法)。保留 9 个: 1 mul(day_last(Volume), day_last(Ret)) 与所有 head |ρ| 0.06、与控制 ≤ 0.07, 是收盘竞价的带方向订单流, 真正新; 2 收盘量份额 div(day_last(Volume), day_sum(Volume)) |ρ| 0.29、残差 0.34, 去掉了水平, 分母 day_sum 包含 day_last 且成交量非负, 不会出现 x/0 得 inf 的情形 (div 是裸 torch.divide, 这一点已核); 4 隔夜跳空 (用 t-1 收盘、t 开盘, 与 head 0.11, 换了 y, size 0.51 是最高的控制相关但 < 0.8 且机制不是 size 的换写法); 10 cross_mean(day_last(Volume), 20) |ρ| 0.38; 6 的 EMA 版本 0.65、11 的去水平版本 0.68、12 反向回归 0.62、13 协方差版 0.63、14 偏离 20 日均值 0.69 这几个与 head 较近, 但都是不同的归一化或不同的统计量, 没有低于 0.7 的理由划掉; 11 的分母是 60 日收盘量均值 (裸 div, 无 EPS), 对流动性极差票的近零分母会爆, 但 beta 是逐票时序回归, 爆点只影响该票, 不是截面主导, 保留。12 的 cross_regbeta 有 var_x > EPS 保护 (已核 rolling_ols)。无前视: cross_delay 把 x 推后一天, 4 的 y 用 t-1 收盘也合法。创新度给 4 而不是 5, 因为核心本身不新 (已在三个 head 里), 新意只在外围。如果它有 alpha, 最可能来自收盘集合竞价量 (指数调仓 / 基金净值对齐的成交) 在次日隔夜或盘中的兑现方向与速度; 风险是 slope 的 x 是水平量, 可能把 liq/known 的 1/尺度交互重新带进来 (liq 0.56、known 0.60), 尺子只去掉了控制的 1/2/3 次残差, 这一点要在结果里单独检验。'
