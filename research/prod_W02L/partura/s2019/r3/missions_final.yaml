    \ 其它量, day_sum(Ret), 241):一个\"斜率 = ρ·σ_y/σ_x\"读数,\nx 里带成交量 / 成交额的水平,尺子对控制的 1/2/3\
    \ 次残差去不掉\"符号 × 尺度\"的交互。但 head 里的 x 全部是 High × skew × last-minute 量这条链,\n信息只来自日内的一个点(最后一分钟)和一个形状统计(skew)。我想问:同一个回归外壳,换成**日内全程的资金方向与时间**,是否有同样的\
    \ train / valid 双正。\n【机制】\n1. day_signed_ratio(Ret, Amt) = 上涨分钟的成交额份额 − 下跌分钟的成交额份额,是不需要逐笔数据的净买压代理(算子\
    \ docstring 的定义)。\n   对\"次日收益\"回归:斜率为正 = 这类净买压之后续涨(知情 / 趋势资金),为负 = 回吐(流动性冲击,Campbell-Grossman-Wang\
    \ 1993 的\"成交量条件下的反转\")。符号在个股层面稳定几个月。\n2. day_centroid(Volume) = 成交在一天中的重心(0 开盘\
    \ ~ 1 收盘)。重心靠后的票 = 算法 / 机构执行在收盘附近放量;重心靠前 = 隔夜消息被开盘消化。\n   单独回归、与净买压相乘、与成交额(day_sum(Amt))相乘三种读法,后者给斜率带上资金规模的尺度(与\
    \ head 同一机制,但尺度来自成交额而非 High × skew)。\n3. day_topw_mean(Ret, Volume)(最放量 10% 分钟的平均收益)、day_gini(Volume)\
    \ 作为对照:它们要么是\"放量时刻的方向\",要么是\"块状度的另一种定义\",\n   检验信息在\"方向\"还是在\"分布形状\"。\n4. 一个无尺度对照(cross_corr)和一个\
    \ 60 日斜率 + 60 日 EMA 的慢版本,回答尺度是否承重。\n【为什么和库 / head / 控制不同】两个库只用 8 个原始分钟字段,没有 day_signed_ratio\
    \ / day_centroid / day_gini / day_topw_mean 这些扩展算子\n(struct/members.csv 核对过),所以库的骨架与\
    \ 5583 条表达式都不含它们;head 的 x 是成交量 × 价位 × skew,这里的 x 是净买压 / 时间重心 / 放量时刻收益,\n对 head\
