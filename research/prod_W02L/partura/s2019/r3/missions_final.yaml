  hypothesis: '【核心】day_last(Volume) = 当天最后一根分钟 bar 的成交量。A 股 14:57 起是收盘集合竞价,最后一根 bar
    装的就是收盘集合竞价的成交,

    是指数基金 / 机构调仓 / 基金净值对齐的主要成交场所。本批共性表里它是富集最高的子树(含 13 个候选均分 +0.41,不含 -1.97,p 0.000),

    本流 Pr2a 产出的三个 head(+0.70 ~ +1.05)全部含它,而且拆解里把它敲掉分数由 +1.05 掉到 +0.08(必要性 +0.97),

    把 Volume 换成 Amt 还更好(+1.13):说明起作用的是"收盘集合竞价规模"这一个量,而不是 day_mean(High) × day_skew(Volume)
    那一长串。

    【库里 / head 的写法】head 全是 cross_regbeta(cross_delay(mul(cross_mean(mul(day_mean(High),
    day_skew(Volume)), 5), day_last(Volume)), 1), day_sum(Ret), 241) 一类:

    把"价位 × 块状度 × 5 日均值 × 收盘量"乘成一个很脏的复合预测变量。其中 High 水平、skew、5 日均值、嵌套的 cross_delay 都不是核心,

    这次把它们全部去掉,只留核心本身,把外围换成**更干净、可以解释的收盘集合竞价读法**:

    (a) 收盘量 × 最后一分钟收益(day_last(Ret))= 带方向的收盘竞价订单流,对"次日收益"做 241 日回归(收盘竞价买压 → 次日续涨还是回吐);

    (b) 收盘量占全天成交的份额 div(day_last(Volume), day_sum(Volume)),去掉水平,只剩"多大比例的交易是被动 / 指数性质";

    (c) 收盘量相对自己 60 日均值(异常收盘量,去水平)与 20 日去均值版;

    (d) 换伙伴:隔夜缺口与日内涨跌(收盘竞价的影响是在次日开盘兑现还是盘中兑现);

    (e) 开平方的尺度(sqrt)、协方差版(同时带尺度和关系)、方向反过来的回归、120 日斜率 + 60 日 EMA;

    (f) 保留一个只剩 day_mean(High) 或 day_skew(Volume) 之一的版本,作为"这两个部件是不是烂部件"的诊断(种子 7、8)。

    斜率 = ρ·σ_y/σ_x,x 带成交量水平时,排名里混进"1/尺度 × 符号"的交互项,新尺子对五个控制及冠军的 1/2/3 次残差去不掉这类交互项,

    这是 Pr2a 三个 head 已经在 train 与 valid 同时 +0.7 ~ +1.1 的原因(我的读法);我在这里把它拆成可解释的几块,检验 alpha
    来自"收盘集合竞价"而非 High × skew。

    【为什么和以前不一样】外围里没有 mul(day_mean(High), day_skew(Volume)) 链,也没有 cross_mean(…,5) +
    双层 cross_delay;核心之外的算子集合

    (day_last(Ret)、day_sum(Volume) 份额、cross_ema 与 sqrt、cross_cov、反向回归)在已见的含该核心的候选里都没出现;库里
    5583 条表达式没有一条把

    day_last(Volume) 放进 cross_regbeta。预期与 3 个 head 的日度秩 |ρ| 有 0.3 ~ 0.6(同一个收盘量),份额
    / 去水平版更低;被库禁令 ρ ≥ 0.7 挡掉的会是最接近 head 的几个。

    【为什么样本外还会在】收盘集合竞价是交易所的制度性机制,2018-08 起规则不变,机构对收盘价的需求(指数调仓、基金净值)是慢变的结构性行为;

    窗口 ≥ 120 日,换手低。风险:241 日窗口的 train 前一年是扩张窗口;最后一根 bar 可能在个别票上是 0 或缺失(停牌、涨跌停),

    cross_regbeta 的 EPS 保护下不会变成 inf,但个别票排名可能被缺失处理决定,这类票占比很小。

    【数学自查】全部因果:cross_delay 只向过去,今天的收益用昨天的收盘量解释,不含未来;份额版分母 day_sum(Volume) 在停牌日为 0
    / 缺失,结果为缺失而非 inf;

    不用 ts_rank / cross_rank / in_rank_rolling;不用 ts_spearman / nt_*。

    '
