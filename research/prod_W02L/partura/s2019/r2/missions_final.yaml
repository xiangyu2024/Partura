- type: E
  core: mul(day_mean(High), day_skew(Volume))
  hypothesis: '【核心】X = mul(day_mean(High), day_skew(Volume)):当天 241 根分钟 High 的均值(后复权价位)乘以当天分钟成交量的偏度(块状度)。

    本批证据:含 X 的 25 个已评分候选均分 -1.24、不含的 -2.41(p≈0.000;但这是同一个壳里"含不含 skew 项"的对比,不是独立证据);拆解里把
    X 换成 day_mean(High) 后分数掉 1.1 ~ 2.1,

    所以承重的是 X 里的 skew,而不是壳(价格 3 日变化、q75 / tail_mean 外层)。

    【批里的写法】X 在批里只有一种用法:cross_corr(价格 3 日变化, X, 10),外面套 q75 / tail_mean_q75 / cross_mean,窗口
    120 ~ 482。相关系数对 X 的尺度不变,

    所以 High 在相关里只会把"价位趋势"混进来,从来没有作为价位本身起过作用;也没有任何一条把 X 当预测变量去解释"之后的收益"。

    第 1 轮 E 位(核心 day_skew(Volume))试的是"块状度与同日跳空 / 日内涨跌的 60 日相关或回归",最好 -0.06,其余 train
    略正、valid -0.30:同期关系读不出东西。

    【这次的外围:响应系数】cross_regbeta(cross_delay(X, 1), day_sum(Ret), 120) = 近 120 个交易日里,用昨天的
    X 去回归今天的日收益,取斜率(x 在前、y 在后)。读两件事:

    (1)符号:这只票昨天块状成交之后,今天是续涨还是回吐。这是"谁在块状成交背后"(知情订单流 vs 流动性 / 对冲交易)的持续特征,

    属于 Llorente-Michaely-Saar-Wang(2002)的量价动态,几个月不变,所以 120 ~ 241 日窗口、换手低,不靠 q75 尾部选择去压噪声。

    (2)尺度:斜率 = ρ·σ_y/σ_x,而 σ_x ∝ 价位 High。于是全市场排名里混进"1/价位"与"符号"的交互项 —— 价位低且昨日放量后续涨的票排最前,价位低且放量后回吐的票排最后。

    后复权价位不是五个控制、也不是冠军里的量(它约等于长期累计涨幅 / 名义价位的代理);W02L 别的流里,2028 的 head 用的就是价位带,2013
    的 head 是同形的 cross_regbeta(滞后活跃度, 日收益, 120)

    (那里的尺度是成交额水平)。我只借结构,尺度换成价位 × 偏度,和它们不同源。尺子对控制的 1 / 2 / 3 次残差去得掉水平暴露,去不掉"符号 × 尺度"这种交互项。

    【种子设计:把尺度和关系拆开】种子 2(t 值)、3(相关)是无尺度版;1、4、9、10 是带尺度的斜率(4 = 241 日,9 = 60 日斜率再 EMA
    60,10 = 先把预测变量做 5 日均值);

    5 是同期版;6 / 7 / 14 把伙伴换成隔夜缺口 / 日内涨跌(缺口是知情流进开盘的地方);11 反向(今天的 X 对昨天收益的响应);8、13 是协方差
    / 平均乘积(同时带尺度和幅度);

    12 用 ListAge 把最新上市的一批排到最后;15 在最近 60 日最块状的 10% 前面设门(彩票型尾部不买)。若无尺度版比斜率版差 0.3 以上,说明价位尺度承重;反过来说明是关系本身。

    【为什么和库里 / head / 控制不同】库里 cross_regbeta 有 69 条,但没有一条把"滞后的 X"对"日收益"回归,15 个种子的骨架与
    5583 条库表达式都不同;

    快照里的 head 是 3 日价格变化与 X 的 10 日相关再取 q75 / tail_mean,这里是 120 日以上的一次回归系数,统计对象不同。预计对
    head 的日度秩 |ρ| < 0.4,对五个控制 < 0.5(带尺度的斜率可能与规模 / 反转有 0.3 左右的相关)。

    【为什么样本外还会在】机制是"块状成交背后的参与者构成",结构性、慢变;窗口 ≥ 120 日,换手低;带尺度的版本依赖的是静态价位。风险:120 日斜率的估计噪声大(相关系数的标准误约
    0.09),

    带尺度的版本可能被价位排名主导而退化成一个价位因子;train 前 120 ~ 241 日是扩张窗口,长窗口的 train 会偏弱。

    【数学自查】全部因果:cross_delay 只向过去,窗口含当天不含未来;cross_regbeta 分母 Var(X) 在窗口内 X 近似常数时会很小(停牌
    / 一字板整窗),但 skew 在常数日为缺失、

    有效点不足时算子给缺失,不会变成 ±inf;t 值与相关版本无尺度、对此有保护;开收盘价比值不会除近零;不用 ts_rank / cross_rank /
    in_rank_rolling(没有 nanrank_last 当日缺失返回 0 的问题);不用 ts_spearman / nt_*。'
  seeds:
  - cross_regbeta(cross_delay(mul(day_mean(High), day_skew(Volume)), 1), day_sum(Ret),
