  - cross_reg_tvalue(cross_delay(mul(day_mean(High), day_skew(Volume)), 1), sub(div(day_open(Open),
    cross_delay(day_close(Close), 1)), 1), 120)
  - cs_last_high10(cross_regbeta(cross_delay(mul(day_mean(High), day_skew(Volume)),
    1), day_sum(Ret), 120), cross_ema(day_skew(Volume), 60))
- type: N
  hypothesis: '【想法】块状成交之后的下一个问题:这些放量的分钟是知情的还是噪声的。批里承重的是 day_skew(Volume)(敲掉后掉 1 ~
    2.7;而价格偏度 day_skew(Vwap) / day_skew(High) 反而更差),

    但批里所有成员(以及第 1 轮的 GP 结果)都只在"日"尺度上把块状度与价格变化配对,没有一个成员问过"块状成交那些分钟里价格做了什么、每单位成交量把价格推了多远"。

    这两件事只有分钟尺度才读得到。

    【实现】分钟级冲击 S = div(abs_(Ret), sqrt(Volume))(|收益| / √成交量,Kyle λ 的分钟版;零成交分钟是 0/0
    → 缺失,被算子自动排除)。

    day_topw_mean(y, w) = |w| 最大的 10% 分钟上 y 的均值,所以:

    (a)Q = div(day_topw_mean(Vwap, S), day_wmean(Vwap, Volume)) = 冲击最大的分钟的成交价相对全天
    VWAP 的位置(A 股卖方"聪明钱"因子 2020 年的最小实现:知情订单流在价格的哪一侧成交);

    (b)day_topw_mean(Ret, S) = 冲击最大的分钟的平均收益(知情流的方向,"跳"的方向);

    (c)div(day_topw_mean(abs_(Ret), Volume), day_mean(abs_(Ret))) = 波动在放量分钟里的集中度;div(day_wstd(Ret,
    Volume), day_std(Ret)) = 成交量眼里的波动 / 等权波动(死分钟稀释度);

    (d)放量分钟的平均收益对当日收益的 120 日相关 / 斜率(当天与 cross_delay 的预测版),读"放量分钟是否决定一天的方向、是否被后一天续做或回吐"。

    全部再用 cross_ema(·, 60) / cross_mean(·, 120) / cross_zscore(·, 120) 慢化,让换手压到 15
    bp 吃不掉(第 1 轮 N 位的 20 日 EMA + 分桶换手太高,全部 -0.7 以下)。

    【为什么和库里 / head / 控制不同】两个库的 5583 条一条都没用 day_topw_mean / day_wmean / day_wstd /
    cross_ema / cross_zscore(这些是 Partura 扩展算子),14 个种子的骨架都不在库里;

    Q 是价格比值,无量纲、不含价位和成交额水平,不是成交额离散度一族(已知族),也不是库里手写的日度 skew / kurt 统计;冠军是库的两层合成,库里没有分钟级冲击测度,所以冠军吃不掉它。

    (c)(d)类读的是"分布形状与关系",不是水平。与快照 head 的区别:head 读日度价格变化与块状度的相关;这里读分钟内冲击与价格位置,对象不同。预计对
    head 的日度秩 |ρ| < 0.3,

    对波动控制可能有 0.3 ~ 0.6(|Ret| 在分子里,种子 (b)(c) 最高),对流动性 < 0.5。与 2009 流的"钱加权收益减等权"(day_wmean(Ret,
    Amt) - day_mean(Ret))相邻但不同:那条是放量分钟的方向,这里换成冲击加权并加上价位位置 Q。

    【为什么样本外还会在】冲击大的分钟 = 知情 / 机构拆单订单流的痕迹,与股东结构和交易者构成有关,几个月不变;60 ~ 120 日慢化后换手低;

    Q 与价位、规模无关,所以样本外不依赖某段行情的风格。风险:|Ret| / √Volume 在极薄的票上被个别一手成交主导(S 的尾部全是薄票),Q 预计取值很窄(1
    附近,量级 1e-3 ~ 1e-2),只能按排名读;train 可能被 2018 ~ 2019 的薄盘票支配。

    【数学自查】全部因果,无 cross_shift / ts_shift;div 的分母:sqrt(Volume) 为 0 时分子 |Ret| 同为 0(没有成交就没有价格变动)→
    NaN 被排除,不是 inf;day_wmean(Vwap, Volume) 在权重和为 0 时为缺失;

    day_std(Ret) 在整天不动(停牌 / 封板)时为 0 或缺失,div 给缺失 / inf 被算子的有限性检查排除,不进入均值;不用 ts_rank
    / cross_rank / in_rank_rolling;不用 ts_spearman / nt_*。'
