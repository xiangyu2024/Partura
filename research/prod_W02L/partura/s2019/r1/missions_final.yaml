  - cs_bucket_demean(cross_ema(day_skew(Volume), 30), LogFloatCap)
  - cs_bucket_zscore(cross_zscore(day_skew(Volume), 60), cross_ema(sub(log(day_sum(Volume)),
    LogFloatShares), 20))
  - cs_bucket_zscore(cross_ema(day_skew(Volume), 20), cross_ema(log(day_sum(Amt)),
    20))
  - cs_bucket_zscore(cross_ema(day_skew(Volume), 20), sub(LogTotalCap, LogFloatCap))
  - cs_regres(cs_rank(cross_ema(day_skew(Volume), 20)), cs_rank(cross_ema(sub(log(day_sum(Volume)),
    LogFloatShares), 20)))
  - cs_bucket_zscore(cross_ema(day_kurt(Volume), 20), cross_ema(sub(log(day_sum(Volume)),
    LogFloatShares), 20))
  - cs_bucket_zscore(cross_ema(day_gini(Volume), 20), LogFloatCap)
  - cs_bucket_zscore(cross_ema(day_argmax(Volume), 20), cross_ema(sub(log(day_sum(Volume)),
    LogFloatShares), 20))
  - cs_bucket_zscore(cross_ema(day_es_ratio_hi(Volume), 20), LogFloatCap)
  - cs_last_low20(cs_bucket_zscore(cross_ema(day_gini(Volume), 20), cross_ema(sub(log(day_sum(Volume)),
    LogFloatShares), 20)), ListAge)
