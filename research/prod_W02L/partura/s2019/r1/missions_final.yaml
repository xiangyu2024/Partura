- head: signedpower(cross_quantile_q75(cross_corr(cross_delta(day_quantile(Vwap),
    3), mul(day_mean(High), day_skew(Volume)), 10), 241))
  why: '拆解表里的证据:(1) 窗口长度 train / valid 不一致:q75@120 train -0.02 / valid -0.19,q75@482
    train -0.93 / valid +0.10,

    @241 居中,说明 q75 的尾部选择 + 10 日窗口的噪声是烂的部件,而不是相关这个思路(敲掉 q75 整层 -0.45,敲掉相关窗口里的价格变化项
    -0.83,都更差);

    (2) 10 日窗口相关系数的标准误约 0.3,q75 是在用尾部选择补偿它,换成 20 / 40 日窗口或 cross_tail_mean_q75 / cross_ema
    应当更稳;

    (3) mul(day_mean(High), …) 里的 High 水平没有单独被敲过(loc 敲的是整个 mul 或换成 day_mean(High)),

    去掉它只留 day_skew(Volume) 可以检验它是不是只在往里混价格水平趋势;High -> Low 的互换 valid +0.17(高于原 +0.11)。'
