slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度4。核心 day_argmin(Low) 与三个快照 head 共用（三个 head 都是 log(day_argmin(Low)) 的 ts 包装），但外围不是 head 那个东西：head 是 10 日窗口内该股与全市场其他股票同窗口序列的平均相关（nd_ts.py 的 ts_pearson 定义），即最低点时刻的短期同步性。这一位的 13 个种子是 argmin 的慢水平（pow_05 与 cs_rank 的 60/120/241 日均值与 EMA）、离散度（cross_stddev）、与 argmax 的关系、对市场均值的回归残差离散度、与当日收益的相关、以及 20 日对 241 日的秩变化。相关度表：13 个种子对三个 head 的原始 |ρ| 最大为种子 13 的 0.43（对 ts_quantile_q75 head），其余不超过 0.37；对五个控制最大为种子 13 对 20 日反转的 0.44，其次是种子 6 对 size 的 0.34、种子 10 对 liq 的 0.31，全部低于 0.5，远低于 0.8，所以没有自动划掉。种子 10（120 日与市场均值的相关）是 head 同步性的慢版，原始 |ρ| 0.37、残差 0.52，保留；但若它得分好，残差 0.52 在 R 规则下会被当成替换而非新 head，需要 PI 注意。种子 1 到 5 是同一个水平量的窗口扫描，窗口不同不算重复，保留。种子 13 与反转控制 0.44、与 q75 head 0.43，是这一位里最像已有因子的，但仍低于门槛。如果它有 alpha，最可能来自最低点时刻的慢水平（开盘即低点或尾盘低点的股票的构成与订单流），而不是换手，因为窗口都不少于 60 日。合理度4。数学核对：day_argmin 先把 NaN 掩为 +inf 再取 argmin（dt_day.py）；cs_rank 是 NaN 保留的稳定秩（common.py 的 rank），不受 nanrank_last 缺失返回 0 的问题影响（那个问题只在 ts_rank、cross_rank、in_rank_rolling 中）；cross_regres(x,y,d) 是 y 对 x 回归的残差，种子 11 的回归元是 cs_mean，方向正确；所有窗口都是因果的（rolling_windows 左填 NaN）；唯一的除法是种子 8，分母为 0 时分子也为 0，得 NaN 被丢掉，不是填 0。PI 笔记说 cross_corr 在恒定窗口给 NaN，实际给 0（rolling_pair_reduce 的分母加了 EPS），只有 2 到 3 个有效日的新股会得到接近 ±1 的值，这是小比例的噪声，不构成「主要由热身期决定」，不挡。一字板日的 argmin 按并列取第一个下标（按 PyTorch argmin 文档的约定，本机未装 torch，未运行验证）得到 0，种子 1、2、6、9、12 保留了这些 0 值，其中种子 6 的 std、种子 9 的 argmin 与 argmax 相关、种子 12 的收益相关对 0 最敏感。这是定义上的噪声，不是主要决定因素，不挡，但需要在结果里看。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [12]
    reasons: '创新度4。快照三个 head 都是 argmin 的短期同步性。本位 12 个种子对 head 的原始 |ρ| 全部不超过 0.27（最大为种子 9，对 q75 head；其残差 0.44 也是本位最高），对五个控制的最大 |ρ| 为种子 1 对 liq 的 0.358，其次是种子 2 对 size 的 0.33、种子 1 对 known 的 0.282，全部低于 0.5。这一位读的是极端分钟上的成交额与价格位置：低点与高点处相对日均成交额的开平方、低点后 10 或 30 分钟收回振幅的比例、高点后回落的比例、成交额加权价位在振幅中的位置。它与 head 不是同一个东西。合理度4。算子逐个核对：in_slice(x,2,237) 是 x[:, 2:238]（右端含），argmin 与 day_locate 用同一个切片，下标一致；day_centroid 的 T 为 236，乘 235 与之对应；day_locate 越界给 NaN（种子 4 到 6 的 10 或 30 分钟偏移会在尾部丢掉这些日子，而不是填 0）；除法分母要么是 mean+1，要么是振幅，振幅为 0 时分子也为 0，得 NaN 被丢掉；全部是同日数据，t 日收盘后算、t+1 交易，无前视。风险（不挡）：一字板日的 argmin 并列取第一个连续竞价分钟，种子 1、2、3、12 在这些日读到的是开盘第一分钟的成交额，而种子 4 到 8 与 10 因振幅为 0 被丢掉，两类处理不一致；种子 5 的 241 日均值只在「低点不在尾 30 分钟」的日子上取平均，是选择偏差而非填充；种子 10 覆盖 0.929，成交额为 0 的日子 wmean 无定义，被丢掉。划掉种子 12：它是种子 1 的重复（成交量代替成交额，241 日代替 120 日）。表中两者对 head 的 |ρ| 为 0.093 与 0.092，残差 0.163 与 0.160，对 liq 0.357 与 0.358，对 known 0.280 与 0.282，只在 vol 与 size 上差约 0.04，是同一个信号。保留种子 1。如果本位有 alpha，最可能来自低点处的承接（恐慌卖盘被流动性供给吸收，Campbell–Grossman–Wang 的成交与反转），即 120 日平均后的相对成交强度与反弹比例。'
R:
  - head: 'ts_pearson(mul(log(day_argmin(Low)), 0.5), 10)'
    soundness: 3
    reasons: '合理度3。v1 到 v3（log，30/40/60 日）机制清楚：拉长窗口既降换手，又保留「最低点时刻与市场同步程度」这一原 head 的概念；ts_pearson 是对其他股票的平均相关，窗口不超过 60 日，无除法，NaN 处理与原 head 相同，数学上没有问题。它们对原 head 的残差相关为 0.72 到 0.87，原始 |ρ| 为 0.49 到 0.62，若过尺子会被当作替换而非新 head，与规则一致。v4（去掉 log，40 日）与 v5（pow_05，40 日）把 argmin 等于 0 的日子放回相关计算。0 来自两类日子：一字板（全天 Low 恒定，按并列取第一下标）与开盘即全天最低。前者不是时刻信息，而且 0 离群较远，同日多只一字板票的 0 会互相抬高相关，使 40 日相关被这些日子主导。PI 把 v4、v5 比 v1 到 v3 好 0.1 到 0.2 的部分归因于「零值日回来」，这个增益可能主要来自同日并列，不能读作时刻信息。这不是 §4 的数学问题，所以合理度给 3、放行。如果它有 alpha，最可能来自 v1 到 v3 的慢同步（低换手下的排序稳定），而不是 v4、v5 的 0 值。'
  - head: 'ts_quantile_q75(mul(log(day_argmin(Low)), 5), 10)'
    soundness: 4
    reasons: '合理度4。窗口 20 日，q75 是分位数，对离群的 0 不敏感，无除法，有界。v1（log）与 v2（pow_05）机制清楚：近 20 日最低点时刻的高分位，即偏晚形成的低点的近期形态。v3 写作 day_argmin(High)，即当日 High 最低的那一分钟，不是当日最高点的时刻（那要用 day_argmax(High)），标签容易误导；它对原 head 的残差相关为 0.63，原始 |ρ| 为 0.46，实质是同一个「最低点时刻」的近亲。按规则的原始 |ρ| 0.46 低于 0.5，若得分达到 head 加 0.1 它会落进「收录为新 head」，而残差说明它不是新的，建议收录前按残差判。v1 与 20 日反转的 |ρ| 为 0.34，v2 为 0.37，低于 0.5。数学上没有问题。如果它有 alpha，最可能来自近 20 日低点时刻偏晚或偏早的持续性；v1 的 0 值日是缺失（log 把它们丢掉），v2 保留 0 值，但 q75 对它们不敏感。'
summary: '两个任务位都过：E 位创新 4、合理 4，无划掉；N 位创新 4、合理 4，划掉种子 12（与种子 1 同一个量，只换了成交量与窗口）。R1 合理 3（v4、v5 的 0 值并列会放大相关，放行），R2 合理 4（v3 是 head 的近亲，收录前按残差判）。没有自动划掉：最大原始 |ρ| 与 head 为 0.43，与控制为 0.44，都在门槛之下。25 个种子的骨架（用 members.csv 的骨架规则复现）在 5583 条库表达式中都没有出现。全程只读源码与相关度表，未使用 2026 年数据。'
