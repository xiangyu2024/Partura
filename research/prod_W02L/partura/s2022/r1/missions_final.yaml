- type: N
  hypothesis: '机制:一天的最低价 / 最高价那一分钟,是价格被推到极端、又被对手盘接住的地方。在这个分钟上成交了多少钱、之后价格弹回(或回落)了多少,读的是「谁在这个极端价位上承接」:(a)
    低点放量并快速反弹 = 恐慌性卖盘被价值买盘 / 做市商吸收(Campbell–Grossman–Wang 的流动性供给:放量下跌之后反转;Wyckoff
    的卖出高潮);(b) 低点缩量、反弹弱、收在低位 = 没有承接,下跌延续;(c) 高点放量并快速回落 = 买入高潮 / 派发。一个股票长期的这类习惯(120
    到 241 日平均)是参与者构成和流动性供给结构的慢变属性,不是当日噪声。

    批里的现象:B064 的 9 个成员全是 day_argmin 的时刻值,时刻只读「几点」,没有读「那一分钟发生了什么」。另外两点:(1) day_argmin(Low)
    里 argmin = 0 的日子(开盘集合竞价那一根,也包括一字板)和最后一根(尾盘集合竞价)是集合竞价,成交额是普通分钟的好几倍,会污染「低点放量」。所以本位全部用
    in_slice(·, 2, 237) 只取连续竞价时段(右端点含在内,与库里 tide 一族用同样的切法),在连续竞价里重新找最低点和最高点;(2) 批里最好的
    head 窗口越长越好,所以这里全部是 120 / 241 日的慢平均。

    算子怎样实现(AS = in_slice(Amt, 2, 237),LS / HS / CS 分别是 Low / High / Close 的同样切片):(1)
    低点成交强度 = day_locate(AS, day_argmin(LS)) / (day_mean(AS) + 1),开平方压住尖峰(pow_05),再
    120 日平均;高点同理;两者相减 = 「低点放量 − 高点放量」(恐慌 vs 狂热);(2) 低点后反弹 = (低点后 10 或 30 分钟的 Close
    − 全天最低价) / (全天最高价 − 全天最低价),落在 [0, 1],即「价格在低点之后收回了全天振幅的多少」;高点后回落同理;(3) 低点反弹 − 高点回落(看涨不对称)与两者之和(极值处的均值回复强度);(4)
    低点相对成交量重心的位置:day_argmin(LS) − 235 × day_centroid(AS),低点是在大部分成交之前还是之后形成;(5) 成交额加权的价位在全天振幅里的位置:(day_wmean(CS,
    AS) − 最低价) / (最高价 − 最低价),即钱主要花在振幅的哪一段。

    为什么和已有的不同:库里 5583 条表达式没有一条用 day_locate 在最低点 / 最高点的下标上取成交额或收盘价(库里的 day_locate 只出现在
    F115 tide 一族的变体里(B155 / B156 等),下标是「量峰之后 / 之前的量谷」,取的是 Close 本身并做差,不是在价格极值上取成交额
    / 反弹比例),也没有用 day_wmean 定位钱在振幅里的位置;我逐个把 seed 骨架与 members.csv 对照过,全部不在库里。和五个控制比:量被日均成交额除掉、价被日振幅除掉,是无量纲的比例,波动
    / 流动性 / 市值的水平被除掉了。和 head 比:head 读的是「几点」,这里读的是「那一分钟之后发生了什么」。

    为什么样本外还会在:来源是流动性供给在极端价位上的结构(谁在接),是慢变的个股属性;全部是 120 / 241 日平均,名次慢,15 bp 成本下换手低;不依赖某一段行情,恐慌被吸收
    vs 被放大在牛熊市里都会出现。风险:成交强度类 seed 可能与已知成交额离散度一族相关(成交额的尖峰程度),被尺子剥掉;反弹类更可能保留信息。

    数学检查:day_locate 在下标越界时给 NaN(最低点出现在最后 10 / 30 分钟时「低点后 10 / 30 分钟」不存在,这些日子被丢掉,窗口平均对可用日取平均,不是填
    0);除以(最高价 − 最低价)只在振幅为 0(全天不动 / 一字板)时是 0/0 = NaN,而分子同样为 0,其余情形比值被定义在 [0, 1] 内,没有近零分母的爆点;day_mean(AS)
    + 1 里的 1 元只防全天零成交,不改变量级;pow_05 作用在非负比值上。无前视:最低点、最高点与之后的价格都在当天收盘前,整日读数在收盘后用于 t+1
    交易。'
