- head: ts_quantile_q75(mul(log(day_argmin(Low)), 5), 10)
  why: 同样的两个烂部件:10 日窗口太短(窗口 10 → 20 好 +0.21),以及 log 丢掉 0 值日。q75 在整数 0 到 240 的取值上,窗口再长(≥
    40 日)会因为相邻次序统计量几乎相同而退化成几百个取值(不过「不同值 ≥ 50%」的门槛),所以只把窗口放到 20 日;另外换成带 pow_05 的版本(保留
    0 值日),以及把 Low 换成 High 的 20 日版本(拆解表里 High 的 valid 段反而比 Low 好:−1.51 对 −2.84,train
    更差,是一个信息型实验)。全部有界,无除法。
