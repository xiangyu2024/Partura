- head: ts_pearson(mul(log(day_argmin(Low)), 0.5), 10)
  why: 烂部件有两个。(1) 窗口太短:拆解表里 5 / 10 / 20 日的分数是 −2.72 / −2.49 / −2.18,单调变好,说明得分被换手压着,不是信息不够;所以把窗口再拉到
    30 / 40 / 60 日。(2) log 把 day_argmin(Low) = 0(开盘集合竞价那一根的最低点,含一字板)的日子变成缺失(库里 log
    是 log|x|,|x| ≤ 1e-9 给 NaN),拆解表里去掉 log 增益 +0.14;所以放一个不带 log 的 40 日版本,和一个用 pow_05(平方根,保留
    0)的 40 日版本。ts_pearson 对窗口内常数的股票给 NaN 而不是极值,窗口 ≤ 60 日,不改变定义。
