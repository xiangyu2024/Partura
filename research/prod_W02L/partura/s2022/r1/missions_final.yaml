  hypothesis: '机制与证据:快照里 3 个 head 和拆解表讲的是同一件事:把「当天最低价出现在第几分钟」day_argmin(Low)(0 到 240
    的整数)取 log、乘一个常数,放进 10 日窗口的 ts_pearson(与全市场其他股票同窗口序列的平均相关)或 ts_quantile_q75。读拆解表:(1)
    乘数不承重(knockout 必要性 −0.04);(2) 窗口越长越好:ts_pearson 5 / 10 / 20 日 = −2.72 / −2.49
    / −2.18,q75 10 → 20 日 = −2.84 → −2.63,单调,说明得分主要由换手(15 bp 成本)决定,信息不在「10 日内的排序」,而在更慢的个股属性;(3)
    Low 换成 High 变差(train −2.66 / q75 −3.28),说明是「最低点」这一侧,不是泛泛的极值时刻;(4) 去掉 log 反而变好(+0.14)。(4)
    的我的读法:库里的 log 是 log|x|,|x| ≤ 1e-9 给 NaN,所以 log(day_argmin(Low)) 把「最低价就在开盘集合竞价那一根」的日子当作缺失(拆解表覆盖率
    0.93,约 7% 个股日)。这类日子包括开盘即全天最低、之后不再破位的强势日,以及一字板日(全天 Low 恒定,按 torch 并列取最小下标,多半落在
    0;这一点我没有在本机验证)——它们恰恰是时刻信息里最极端的一部分,却被 log 丢掉。(5) ts_pearson 的符号是 −1:好的是「最低点时刻与全市场其他股票最不同步」的股票,也就是最低点由个股自己的订单流
    / 消息决定、而不是跟着大盘一起下探的股票。

    这个位的做法:核心 day_argmin(Low) 固定,外围整个换掉:全部是慢的日轴统计(窗口 60 到 241 日,或半衰期 60 日的 EMA),每个
    seed 读核心的一个不同侧面。(i) 水平:长期平均的最低点时刻,用 pow_05(平方根,保留 0 的日子)而不是 log;cs_rank 版本先把每天的截面名次取出来,去掉「当天全市场一起尾盘跳水」的日子效应,再做日轴平均
    / EMA。(ii) 离散度:cross_stddev,最低点是否总在同一个时段(规律性)还是忽早忽晚(消息驱动)。(iii) 与最高点的先后:(最高点时刻
    − 最低点时刻)/(两者之和),有界在 [−1, 1],两者都在 0(一字板 / 全天不动)时 0/0 = NaN 自动丢掉这些日子;以及两个截面名次之差。含义是日内形态是「先涨后跌」还是「先跌后涨」占多,是
    Lou–Polk–Skouras 日内 / 隔夜拉锯在分钟尺度上的近亲。(iv) 同步性:与全市场同日最低点时刻的 120 日相关(把 head 的 10
    日 ts_pearson 换成对市场均值的慢相关)、对市场均值回归后残差的标准差(个股特有的「抢跑 / 滞后」)、与最高点时刻的相关、与当日收益的相关(最低点出现在下跌日还是上涨日,即日内形态是否一致)。

    为什么和已有的不同:外围和快照里见过的写法(全是 mul(log(·), c) 外面套 10 日 ts_pearson / ts_quantile_q75)没有一个相同。库里与之最近的是
    High 一侧的 cross_mean(day_argmax(High), 30)(30 日、不压缩、不去日子效应)和 day_argmin(Low) 本身
    / 套 log、sigmoid 的写法(库自带的样本内读数里,日度的 day_argmin(Low) 净夏普 −12.5,30 日平均的 High 一侧 −1.5,同样是「越慢越好」);没有一条对
    day_argmin(Low) 做 60 日以上的 pow_05 / cs_rank 压缩后再平均、cross_stddev、cross_corr、cross_regres
    的慢统计,也没有最高点与最低点时刻的比值。我逐个把 seed 的骨架与 members.csv 的骨架集对照过,全部不在库里。去掉 log 后零值日回来,是和
    head 在输入分布上的第二个差别。

    为什么样本外还会在:来源是「一个股票的最低点通常什么时候形成」这个慢变的个股属性,背后是参与者构成和订单流类型(开盘集合竞价的承接 / 一字板属性、尾盘的被动卖出、机构的拆单节奏),不依赖某一段行情;窗口都
    ≥ 60 日,名次变化慢,15 bp 成本下换手低。我对这个位出 head 的预期很低(见笔记),价值在于把「慢 + 去 log」两个差别单独量出来。

    数学检查:pow_05 对 0 到 240 的整数是 0 到 15.5,无奇点;cs_rank 并列靠股票列序打破,最低点时刻在同一天有大量并列(每个整数约
    20 只股票,0 点约占 7%),列序带来的名次偏移相对 120 日平均的跨股标准差很小;(H − L)/(H + L) 有界;cross_corr / cross_regres
    在窗口内恒定时给 NaN 而不是极值;没有用 sign / is_gt / is_lt(它们对 NaN 返回 0,会把停牌日填成 0)。无前视:最低点时刻在收盘后才知道,t
    日收盘后算,t+1 交易;最长窗口 241 日,热身期不主导。'
