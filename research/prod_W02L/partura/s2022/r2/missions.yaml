- type: N
  hypothesis: >-
    机制:不看「价格极值出现在几点」(第 1 轮 B064 的 day_argmin(Low) 时刻值,换手效应主导、没有信息),而看「成交最集中的那一分钟出现在几点」,
    以及它和价格极值、成交重心的相对位置。一天里成交最重的一分钟是大单 / 事件 / 被动资金(指数、ETF 申赎、基金经理的拆单窗口)集中落地的时刻,
    是比价格极值更稳定的「订单流类型」指纹:机构型、被动型股票的峰值成交常落在固定时段(开盘后半小时、尾盘),事件驱动型的股票忽早忽晚。
    批里的线索:定位表里 day_argmin(sub(day_argmin(Low), Volume)) 富集 +1.06(p 0.045)。这个子树把一个日度标量 day_argmin(Low) 减去分钟成交量,
    于是 day_argmin 实际找的是成交量最大的那一分钟(标量只是平移),也就是「成交量峰值时刻」;含它的候选 -1.12 对 -2.18,
    是第二个批(Volume 一族)里最强的一条线索,但它出现的写法都是 cross_cov 套 pow_1_5(Low) 这类换手很高、含价格水平的结构,没有人干净地读它。
    算子怎样实现:AP = day_argmax(in_slice(Amt, 2, 237))(连续竞价里成交额最大的分钟,去掉两个集合竞价;右端点含在内)。
    (1) 水平:cross_mean(cs_rank(AP), 120 / 241) 与 EMA(cs_rank 先去掉当天全市场一起的尾盘放量的日效应);
    (2) 与价格极值的先后:AP 减最低点 / 最高点时刻(名次差、除以 235 的归一化差、绝对值差)——放量发生在价格触底之前(恐慌卖出)还是触底之后(承接),
    是 Wyckoff「卖出高潮」在分钟尺度上的写法;(3) 与成交重心的差:AP − 235 × day_centroid(Amt),成交是一个尖峰还是均匀铺开;
    (4) Amt 重心与 Volume 重心的差:每分钟成交额 = 价格 × 成交量,所以两个重心之差读的是「日内价格水平随时间的升降」,不依赖收盘价;
    (5) 规律性:峰值时刻的 120 日 cross_stddev 与 cross_corr(与最低点时刻、与全市场峰值时刻均值的相关)。
    为什么和已有的不同:库里 5583 条没有一条是「成交额最大分钟的时刻」做主角(day_argmax 全部用在 High / Low / Ret 上);
    上一轮同一流的 N 位读的是极值分钟处的成交额(day_locate),这里反过来,读成交额极值处的时刻,变量不同。
    为什么样本外还会在:订单流类型是慢变的个股属性,取决于投资者结构,而非某段行情;全部是 60 日以上的慢统计(cs_rank 后取平均),换手低,成本不吃掉。
    数学检查:day_argmax 并列取最小下标,在连续竞价切片内只有停牌 / 无成交日才全零(全零日 argmax 为 0 的并列 = 噪声,但这些日子占比小,且 cs_rank 平均后被稀释);
    cs_rank 保留 NaN;除法只除常数 235;无 sign / is_gt / is_lt;无前视(收盘后算,次日交易)。
    我对这个位出 head 的预期很低,但它换了一个变量,是本流到目前最不同的一条线。
