- type: E
  core: 'day_locate(in_slice(Amt, 2, 237), day_argmax(in_slice(High, 2, 237)))'
  hypothesis: >-
    机制与证据:核心 C = 在连续竞价时段(in_slice 2..237,去掉开盘和收盘集合竞价)里先找到全天最高价出现的那一分钟,再读那一分钟的成交额。
    也就是「价格被推到当天最高点的那一刻,有多少钱在成交」:放量冲高 = 买入高潮 / 派发(追涨盘被对手盘接走),缩量冲高 = 没有承接的虚拉。
    定位表里含 C 的候选有 36 条,均值 -1.45,不含的 -2.44,差 +0.99(p 0.000),是本流富集最强、样本最多的子树;
    含 C 的候选里第 1 轮的 N 位最好做到 -0.36(train / valid 都 -0.36,两段一致,没有 train 好 valid 差),说明 C 这个读数本身比 argmin(Low) 的时刻值干净,
    扣不掉的主要是外围的写法。第 1 轮见过的外围只有一种:pow_05(div(C, day_mean(Amt)+1)) 再套 cross_mean 120,或者与低点处成交额的差;
    它们分子分母都是同一天的量,所以读到的混着「今天整体放不放量」。
    本轮外围全部换成「相对这只股票自己、或相对同流动性档的股票」的写法,让 C 里的水平(流动性、市值)被去掉,剩下的才是「高点处的异常成交」:
    (i) cs_bucket_rank(y, x):在 x(day_mean(Amt) 或 LogFloatCap)的十分位内部给 y 排名,不用回归就把对成交额 / 市值的暴露去掉;
    (ii) cross_regres(A, C, 120):每只股票 120 日内 C 对全天平均成交额回归的残差,即「同样的日成交额下,高点处多出来的钱」;
    (iii) cross_zscore:相对自己 120 日历史的标准化,再做 EMA 压住换手;
    (iv) 与当天收益 / 与全天成交额的 120 日相关 cross_corr:放量冲高是否伴随涨日(动量延续)还是跌日(派发);
    (v) cross_stddev(cs_rank(C),120):高点处成交是否稳定,不稳定 = 消息驱动;(vi) 20 日均值减 241 日均值的变化,和 cs_rank 版本去掉日效应。
    为什么和已有的不同:库里与 C 同骨架的都是 pow_05(div(C, A+1)) 再 cross_mean / cross_ema 的写法,分母同一天;
    cs_bucket_rank / cross_regres / cross_zscore / cross_corr / cross_stddev 包 C 这一族我逐条想过,骨架不同,且它们读的是「相对自身历史 / 相对同档股票」的异常,而不是水平。
    为什么样本外还会在:承接结构(谁在高点接货)是慢变的参与者构成属性,不依赖某段行情;窗口全部 ≥ 60 日(只有一个 20 日对 241 日的变化项),成本压得住。
    数学检查:C 是某一分钟的成交额,≥ 0;in_slice 切掉两个集合竞价,所以不被竞价那根的巨额成交污染;cs_bucket_rank 保留 NaN;
    cross_regres / cross_corr 在窗口内恒定时给 NaN 而不是爆点;分母都 +1 或由回归结构保证;没有 sign / is_gt / is_lt;无前视(收盘后算,次日交易)。
    我对这个位出 head 的预期很低(见笔记),价值是验证「相对化之后高点处成交额还剩不剩信息」。
