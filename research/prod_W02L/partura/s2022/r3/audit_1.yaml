slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '位 a 为 E 深挖,核心 C = day_locate(in_slice(Amt,2,237), day_argmin(in_slice(Low,2,237))),即连续竞价里最低价那一分钟的成交额。核心来源核对:该表达式在 loc.md 与 loc.json 的共性表里各出现 7 次(只核对存在性,未逐条读表)。核心与快照三个 head 的日度秩 |ρ| 最大 0.216(对 ts_pearson(day_argmin(Low),20)),残差 0.039,与 head 不是同一个东西;但 C 与流动性控制 |ρ| 0.755、与已知族 0.759,原始 C 大部分是流动性水平。去水平之后的种子(a1、a3、a5、a6、a7、a11)对 5 个控制的 |ρ| 都在 0.3 以内,对 head 的残差 |ρ| 不超过 0.11,这部分是真的新信息。创新度给 3 而不是 4,理由有两条:(i) a1、a2、a3、a4、a9 的外围与 r2 的 E 位(核心换成 day_locate(in_slice(Amt,2,237), day_argmax(in_slice(High,2,237))))逐条同构,只换核心,而那一位没有产出 head;计划里「骨架全不同」这句话不准确。库禁令按骨架(抽掉字段、常数、窗口)判断,argmin 与 argmax 是两个算子名,所以不会被库禁令拦下,但这是把同一套外围换到另一个极值上重跑。(ii) 核心本身对流动性的 0.76 载荷。合理度 4:逐个算子核对。day_locate 对越界下标给 NaN(切片坐标 0..235,不会越界);day_argmin 用 inf 掩码、取第一个最小值;in_slice 只切列,切片内下标与 in_slice_to_end、in_slice_from_start 的坐标系一致;cross_regres(x,y,d) = rolling_ols(x,y)[resid],即 y=C 对 x=day_mean(Amt) 回归,与计划写法一致;cs_bucket_rank 保留 NaN,十分位内给 y 排名并加 1e-4 的全局排名打破平局;cross_zscore 有 sd 阈值保护;cross_corr 与 cross_stddev 对窗口内常数返回 NaN 或 0 而非爆点;除法只出现在 r3 位的 b 位里,分母带 +1;没有 sign / is_gt / is_lt / nt_* / ts_spearman;无前视(收盘后算、次日交易)。有一处需要写在解释里的边界:argmin 对一字板日(全天 Low 相同)取第 0 根切片分钟,C 变成开盘后第一根分钟的成交额,而不是触底那一刻。计划把「缩量触底 / 一字类」当成一种解释,这一类股票日是真实存在的;它不是数学问题(结果是系统的、不被 NaN 或热身期主导),所以不挡,但解释时不能把它当触底。种子去留:没有任何种子被表格自动划掉(最大 head |ρ| 0.243,远低于 0.7;最大控制 |ρ| 0.537,低于 0.8)。a9 与 a2 都是 cs_bucket_rank(C,LogFloatCap) 只换平滑(241 日均对 EMA60),相关应当很高;按「重复」划掉的标准看属于近重复,但它们是两个不同的表达式,我保留两者,建议 PI 合并一个。a10 用 cs_rank(C) 减去 cs_rank(C_high),与 r2 同名 E 位的种子不同,保留。E 位核心约束:C 在本实验中没有过 E 位(r1 为 N 位、外围是 pow_05 除法,与本轮种子不重复),在整个实验中是第一个 E 位;核心对每个控制的 |ρ| 都低于 0.8(流动性 0.755、已知族 0.759,余量很小)。如果它有 alpha,最可能来自:恐慌点附近谁在承接(流动性提供者在触底处的成交水平相对同流动性档的偏离),以及 a5、a6 所量的 C 与日成交或日收益的同步性(参与者构成的慢变属性)。划完剩 12 个种子。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [11]
    reasons: '位 b 为 N 新想法:PL = sum(in_slice_to_end(Amt, argmin))/(sum(Amt)+1),即全天成交额中落在最低分钟及之后的份额;并配了最高点之后的份额、成交加权分钟收益、Volume 版本的低点之前份额。创新度给 3:in_slice_to_end 在我核对的快照与 r1、r2 种子中没有出现,变量是新的;但与快照时间型 head 的重叠实质存在。原始 |ρ| 最大 0.531(b7,对 ts_quantile_q75(pow_05(day_argmin(Low)),20));b1、b2、b3、b5、b11 在 0.31 到 0.41;对 5 个控制取残差后,b1、b2、b3、b5、b7、b11 对 head 的残差 |ρ| 在 0.40 到 0.47。低点在几点与低点之后占多少成交,确实有大约一半是同一信息,所以不给 4。我没有全库核对「库里没有 in_slice_to_end」这句话,只核对了快照与 r1、r2。合理度给 4,逐个算子核对:in_slice_to_end(x,y) 保留 y 及之后的列、其余 NaN,与 day_argmin(in_slice(Low,2,237)) 同在切片坐标系,无错位;day_sum 用 nansum,全 NaN 时给 NaN,所以 NaN 分钟不会污染分子;分母 day_sum(Amt)+1 的 1 元对正常成交额可忽略,只防全天零成交,份额因此落在 [0,1];day_wmean(x,w) 用 |w| 加权并只取两者都有限的分钟,分母为 0 时给 NaN;cross_corr、cross_stddev、cross_regres 的写法与 a 位一致;没有 sign / is_gt / is_lt / nt_* / ts_spearman;无前视。边界情形:与 a 位相同,一字板日 argmin 取第 0 根,PL 趋近 1,这一类日子在 120 日平均里被稀释,不是主导项,不挡。种子 11 按「重复」划掉:in_slice_from_start(in_slice(Volume,2,237), argmin) 是低点之前(含低点那一根)的成交量份额,与种子 1 的低点之后成交额份额互补,两者之和约为 1 加上低点那一根的份额;二者只差 Volume 与 Amt 的价格权重,cs_rank 与 120 日平均完全相同,这是同一个度量的换写法。这一判断是按构造得出的,相关度表没有算种子之间的 ρ,所以不是数值证据,写明以便 PI 核对。种子 3(cs_rank 后 EMA60)与种子 1(cs_rank 后 mean120)只换平滑,我保留两者,但建议合并。种子 2(241 日均、无 cs_rank)与种子 1 不同,保留。划完剩 11 个种子,≥4。如果它有 alpha,最可能来自:低点之后的成交持续性所反映的买盘承接(流动性提供方在低点附近拿到补偿、之后的承接是否持续),以及种子 9(低点之后的成交加权分钟收益)所反映的低点后价格漂移。'
R:
  - head: 'ts_pearson(day_argmin(Low), 20)'
    soundness: 4
    reasons: 'R 组 5 个变体。合理度给 4。核对:ts_pearson(x,d) 对每只股票的窗口与全体其他股票的窗口做 Pearson 相关再对 j 求平均(nd_ts.py:391),是截面同步性,不是个股自相关。变体 1 与变体 2、3 把 Low 换成 in_slice(Low) 或 High 的极值时刻:in_slice 只是把下标平移 2 格,而 ts_pearson 对平移不变,所以切片不引入偏差,切掉的是集合竞价那几根的极值。变体 4 用 cs_rank 处理 argmin:同一天多只股票的 argmin 相同时,cs_rank 按股票列序打破平局(计划称「去并列」,实际是列序打破),携带板块信息,规则 §4 明确这不算问题;但计划里的写法会让人误以为平局被消除了,建议改写。变体 5 用 argmax(High),无数学问题。所有变体都是 20 日窗口,与快照一致。一字板 argmin 第 0 根的边界同样适用于变体 2 与 3(它们对 High 的一字板给出同样的第 0 根)。未核对:ts_pearson 在窗口内常数时的 NaN 处理。不适用创新度(R 组只评合理度)。'
summary: 'a 位(E,核心 C = 最低分钟的成交额)创新 3、合理 4,12 个种子不划,通过;b 位(N,低点之后的成交份额)创新 3、合理 4,划 1 个(b11,与 b1 互补的重复),剩 11 个,通过;R 组合理 4,无数学问题。主要意见:a 位外围与 r2 的 E 位同构只换核心(argmax 换 argmin),计划「骨架全不同」的说法不准确;一字板 argmin 取第 0 根的平局问题(C 与 PL 都受影响);a2 与 a9、b1 与 b3 是只换平滑的近重复,建议合并。无数学问题挡位。'
