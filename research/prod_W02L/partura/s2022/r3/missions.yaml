  hypothesis: 机制:核心 C = 在连续竞价(in_slice 2..237,去掉两个集合竞价)里先找到全天最低价那一分钟,再读该分钟的成交额,即「价格被砸到当天最低点那一刻有多少钱在成交」。放量触底 = 恐慌抛售被承接(卖出高潮,流动性提供者拿到折价,之后反弹),缩量触底 = 无人接货的阴跌 / 一字类。定位表里含 C 的候选 34 条,均值 -1.57,不含 -2.43,差 +0.86(p 0.000),是本流富集第二强、样本第二多的子树;此前只有第 1 轮 N 位在它外面套过 pow_05(div(C, 全天均额+1)) 再 cross_mean 120(并和高点处成交额相减),最好 -0.36,train / valid 都 -0.36,说明 C 读数本身干净,扣不掉的是外围写法里混着「今天整体放不放量」。本轮外围全部改成「相对自己历史 / 相对同流动性档」,同一天内分子分母不再是同一个量:(i) cs_bucket_rank(y, x) 在 x(全天均额或 LogFloatCap)十分位内部给 C 排名,不回归就去掉水平暴露;(ii) cross_regres(A, C, 120):每只股票 120 日内 C 对全天均额的回归残差 =「同样日成交额下触底处多出来的钱」;(iii) cross_zscore:相对自己 120 日历史的标准化再 EMA;(iv) cross_corr(C, 当日收益 / 全天均额, 120):触底放量是否伴随跌日(抛售被吸收)或与成交额水平同动;(v) cross_stddev(cs_rank(C), 120):触底处成交是否稳定,不稳定 = 事件驱动;(vi) 20 日均值减 241 日均值的变化(去日效应);(vii) 低点处名次减高点处名次:卖出高潮对买入高潮的不对称,再放进流动性十分位里。为什么和已有的不同:此前含 C 的外围只有 pow_05 div + cross_mean 一种,本轮用的是分档排名、回归残差、自身标准化、相关、离散度,骨架全不同;且在 R2 的 E 位对高点处成交额做过类似相对化,本轮对低点处读数,方向相反(承接 vs 追涨),两者相减的写法也在种子里。为什么样本外还会在:触底处谁在接货是慢变的参与者构成属性(机构 / 做市资金与散户的占比),不依赖某段行情;窗口全部 ≥ 60 日(只有一个 20 日对 241 日之差),换手低、成本压得住。数学检查:C 是某一分钟成交额 ≥ 0,in_slice 切掉集合竞价那两根的巨额成交;cs_bucket_rank 保留 NaN;cross_regres / cross_corr 窗口内恒定时给 NaN 而非爆点;除法只在带 +1 或常数的位置;没有 sign / is_gt / is_lt;无前视(收盘后算、次日交易)。我对出 head 预期很低,价值是验证相对化之后触底处成交额是否还剩信息。
