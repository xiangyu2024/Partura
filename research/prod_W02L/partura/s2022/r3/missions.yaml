- type: N
  hypothesis: 机制:不读价格极值在几点(前两轮证明时刻值几乎全是换手),也不只读极值那一分钟的成交额,而读「全天成交额有多大份额发生在最低点之后」PL = sum(in_slice_to_end(Amt, 最低点分钟)) / (全天成交额 + 1)。份额大 = 触底之后资金持续涌入(吸筹 / 承接),份额小 = 钱主要在下跌途中成交完、触底后无人问津。它是 [0,1] 的连续比值,没有整数并列问题,不同值门槛可过;最低点之后的区间被用作条件窗口,实现的算子是 in_slice_to_end(x, y):保留 x 在 y 之后的分钟,其余为 NaN,day_sum 对 NaN 求和只累加有效分钟(分母 +1 避免除零)。并配成:最高点之后的份额 PH(追涨放量 vs 派发)的差;全天价格路径的成交加权收益 day_wmean(最低点之后的 Ret, 最低点之后的 Amt)(即最低点之后钱实际赚到什么);按流动性十分位排名;与当日收益的 120 日相关;120 日离散度(份额是否稳定);Volume 版本的最低点之前份额。为什么和已有的不同:库里 5583 条没有一条使用 in_slice_to_end / in_slice_from_start(以极值时刻为界切分当天),定位表中所有含极值的子树都只读「时刻」或「那一分钟的值」,这里读的是「极值前后两个半天的成交结构」,变量不同;上一轮 N 位读成交额峰值时刻,这里读低点之后的成交份额。为什么样本外还会在:触底后的成交份额反映的是买盘承接的持久度,是微观结构层面的订单流不对称(Karpoff 1987 的价量关系、Grossman-Miller 的流动性供给),不依赖某段行情;全部是 60 日以上的慢统计,换手低。数学检查:in_slice_to_end 的下标与 day_argmin(in_slice(Low,2,237)) 同在同一切片坐标系,无错位;分母 +1;day_sum 保留全 NaN 为缺失;无 sign / is_gt / is_lt;无前视(收盘后算、次日交易);当天停牌 / 一字板日最低点落在 0、份额接近 1,是少数日子且被 120 日平均稀释。预期出 head 概率低(约 3%),但这是本流第一个换变量的 N 位。
