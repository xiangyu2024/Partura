  hypothesis: '机制:核心 K = cs_bucket_zscore(cross_ema(day_first(Volume), 20), cross_mean(day_sum(Volume), 30)),即开盘集合竞价量(20 日半衰期 EMA)在「30 日均总成交量」分桶内的截面 z 分数:同等流动性的票之间,谁的开盘竞价参与相对更重。它是第
    1 轮 E 位里唯一读到正分的核心(score +0.03,train +0.03 / valid +0.42),且因分桶已去掉了流动性水平,与 liq / known 控制的重合预计很低。机制假设:同一流动性档内,开盘竞价集中挂单 = 隔夜消息或散户注意力集中到开盘一次撮合,与连续竞价的分散成交行为不同;这个相对强度是慢变、低换手的股票特性。

    这次要试的外围(第 1 轮的外围只有对 K 再套 cs_bucket_zscore / cross_ema):(1) 时间维度标准化与偏离:cross_zscore(K,60)、K 减自己 120 日均值,把持久的截面水平去掉、只留相对自己历史的变化;(2) 慢平滑与形状:cross_decay_linear、cross_mean
    40、cross_stddev(K,60) 离散度、cross_tail_mean_q75 尾部强度、cross_argmax 峰值位置、均值 / 离散度之比;(3) 与价格配对:K 乘隔夜跳空方向 sign(G)、K 与 G 的 60 日相关、K 对日内收益的回归 t 值、K 乘近期收益状态的 120 日 z 分数(注意力买入发生在上涨之后);(4)
    竞价 vs 收盘参与差:K 减同样分桶的收盘集合竞价量 day_last(Volume) 版本;(5) K 对分桶总量的回归残差。

    与以前不同的原因:这些外围分别用 cross_zscore / cross_decay_linear / cross_corr / cross_reg_tvalue / cross_stddev / cross_tail_mean / cross_argmax / cross_regres 与价格叶子,第 1 轮这个核心的候选里没有一个这样的外围,也不含
    cross_sum;骨架核对见相关度表。样本外为什么还会在:分桶标准化只比较同档股票,去掉了随牛熊变化的整体成交水平;集合竞价制度自 2018 年未变,散户 / 机构在竞价阶段的差异是结构性的;valid 比 train 好说明它不是只吃早年行情。诚实预期:train 偏弱,能否到 0.5 看慢平滑 + 去水平后
    train 能否抬起来。'
