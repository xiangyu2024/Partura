- type: N
  hypothesis: '机制:成交量条件下的个股收益反应函数(Llorente-Michaely-Saar-Wang 2002 的量价信息 vs 流动性交易区分;Gervais-Kaniel-Mingelgrin 高量收益溢价)。对每只股票用自己过去 60-120 日的数据估计:昨天由放量支撑的价格变动(收益 R 乘成交量对自己
    60 日历史的 z 分数 ZV,ZV 先取 log 压重尾)今天是延续还是回吐。放量日收益偏信息交易(延续),缩量日偏流动性交易(回吐);这个「延续 / 回吐倾向」是每只股票自己的慢变特性(取决于散户 / 机构结构、信息不对称度),截面上没有被已知因子度量。

    算子实现:R = day_last(Close) / ts_delay(day_last(Close),1) - 1;ZV = cross_zscore(log(1+day_sum(Volume)), 60);用 cross_reg_tvalue / cross_regbeta / cross_corr(x, y,
    d) 做滚动回归 / 相关,x 为自变量,x 全部用 ts_delay 后移 1 天(昨天的量价事件解释今天的收益,无前视)。变体:(a) 放量加权乘积项对次日收益的 t 值 / β / 相关(种子 1、2、4、13);(b) 仅放量日(ZV>1)的收益、仅下跌日的量(种子 5、10);(c) 当天量与收益 / 振幅的同期回归(种子
    8、9,价格冲击斜率);(d) 成交额加权对等权收益之差(种子 7);(e) 昨天日内段 I 对今天隔夜段 G 的量加权反应(种子 11、12,隔夜 - 日内拉锯加上量条件,第 1 轮没有量条件)。

    为什么与库里不同:B095 的手写库里的日收益写法全部是收益的水平 / 波动 / VWAP 加权累计(head 拆解表显示 VWAP 权重只贡献 +0.09,头部只是 vol 水平);没有一条是「滚动回归系数 / 相关」的二阶特性,也没有用 cross_reg_tvalue 估计个股量价反应函数。输出是回归 t 值或相关系数,无量纲,与
    liq / vol / reversal 控制天然低相关(相关度表会验证),而且都用 120 日长窗口,换手低,能吃下 15 bp 成本。为什么样本外还会在:机制来自参与者结构(流动性交易 vs 信息交易),不依赖某一年的风格;估计窗口长,个股特性稳定。诚实预期:单日回归噪声大,毛超额可能是零;种子彼此相关度高(同一个机制的不同写法),通过的多半是
    t 值 / 相关版本。'
