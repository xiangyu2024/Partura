- type: N
  hypothesis: '机制:隔夜 - 日内拉锯(overnight-intraday tug of war)。把一天的价格变动拆成两段:隔夜段 G = 开盘价
    / 前收 - 1(前一天收盘后到集合竞价撮合之间到达的信息,偏消息 / 机构 / 知情),日内段 I = 收盘 / 开盘价 - 1(连续竞价,偏散户 / 噪声
    / 流动性)。Lou-Polk-Skouras (2019) 发现隔夜收益有持续性、日内收益与之相反,是两类参与者的拉锯;Berkman-Koch-Tuttle-Zhang
    (2012) 发现被注意力推高的开盘价随后在日内回吐。这里不押这两篇的方向,而是做成"个股自己的反应函数":同一只股票的日内段平均是延续还是回吐隔夜段,回吐有多频繁,隔夜段占全部价格变动的份额多大,隔夜跳空的尾部是否不对称,以及今天的隔夜段是否在反转昨天的日内段。

    算子怎么实现:G = sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1),I = sub(div(day_last(Close),
    day_first(Open)), 1);全部无量纲、与成交量水平无关,所以不会被 liq / known / size 吃掉,只与 rev(20 日反转)和
    vol 有轻度重叠。种子分四组:(A) 两段的差与各自的慢 EMA(种子 1-3,cross_ema(G - I, 30)、cross_ema(G, 40)、cross_ema(I,
    40),让 GP 看到是哪一段在带信号);(B) 反应函数:I 对 G 的 60 日回归 t 值、120 日回归 β、60 日相关、回吐频率(cross_ema(G*I<0,
    30))、回吐幅度(cross_ema(-G*I, 30))(种子 4-8);(C) 价格发现的份额与形状:隔夜绝对变动占隔夜 + 日内绝对变动的份额(40
    日)、隔夜跳空上下尾均值之和(60 日 q75 + q25,隔夜彩票型偏度)、开盘价相对开盘后 15 / 30 分钟连续成交均价的偏离的 EMA(开盘冲击
    overshoot)、开盘后 30 分钟与其余时段的收益之差(种子 9-13);(D) 跨日:G 与昨天 I 的 90 日相关、G 乘昨天 I 的 EMA,即"隔夜反转昨天的日内"(种子
    14-15)。

    受启发的现象与为什么新:批 B094 的 8 个成员都在读集合竞价那一列;拆解表里 Volume 版和 Amt 版的最优方向相反、与已知族的 rho 差到
    -0.8 以上,而 day_first(Low) / day_first(Vwap) 版本(竞价价格)只是后复权价格水平。也就是说整批只把竞价当"水平"读,没有人把竞价价格与前收盘(隔夜)、与随后的连续竞价(日内)配对。我查了两个库里含
    day_first(Open) 的 109 条表达式:G 只出现在 cross_mean(G, 20)、cross_stddev(G, 20) 和它们的条件翻转写法(select_where)里,以及一条挖掘库的
    cross_corr(G, 收盘 / 下半场开盘价, 20);WorldQuant 式手写形态里是 ts_corr(开盘价, 全天量, 10) 一类。没有一条把
    G 与整段日内收益 I 配成"同一只股票的反应函数"(回归 t 值 / β、回吐频率与幅度),也没有隔夜份额、隔夜尾部不对称、开盘冲击和"隔夜反转昨天日内";cross_ema
    / cross_zscore / cross_reg_tvalue 在这类表达式上的包法两个库里出现 0 次,15 个种子的骨架都不在库的骨架集里(我用 AlphaCube
    的骨架函数核对过)。种子 2(cross_ema(G, 40))与库里 cross_mean(G, 20) 是近亲,我放它只是为了让 GP 看到单独的隔夜段,不指望它出
    head。

    为什么样本外还会在:T+1、涨跌停、集合竞价撮合、散户占比高,这些制度性原因决定隔夜与日内参与者构成不同,2018 年以来没变;个股层面"跳空是被延续还是被回吐"主要由持有人结构与盘口厚度决定,是慢变量,窗口取
    40-120 日也不会换手太快(种子本身带 EMA / 长窗口,换手低,扣 15 bp 之后才有机会)。诚实预测:G 与 I 的单日值本身很吵,单靠慢平滑未必有毛超额,出
    head 概率低,但这一位的价值在于第一次把 B094 的竞价价格用在"配对"而不是"水平"上。'
