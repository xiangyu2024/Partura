- type: E
  core: day_first(Volume)
  hypothesis: '机制:核心 C = day_first(Volume),即开盘集合竞价那一列(第 0 分钟:9:15-9:25 挂单、9:25 一次撮合,后面
    241 格里的第一格)的成交量。它同时装着两样东西:(1) 这只股票平时的关注度 / 流动性水平,慢变,占截面方差的绝大部分;(2) 前一晚到开盘前的新信息、散户集中挂单的强度,快变,只占很小一块。

    批里的 3 个 head(cross_sum(C, 60 / 5 / 3),score -1.12 / -1.15 / -1.20)读的是 (1):拆解表里窗口
    2 / 6 / 10 / 30 几乎同分(-1.16 ~ -1.38),没有最优窗口;换成 Amt 之后与已知族 rho 在 -0.79 ~ -0.89;窗口
    120 时最优方向翻号(-1 变 +1)。这说明它们是 liq / known 两个控制的水平,新尺子拿掉水平后只剩成本。所以本位不再读水平,只读 C 的"去水平"形态,分四组,每组各自对应一个可以独立成立的机制:

    (a) 注意力冲击(种子 1-3):C 相对本股自己 60 / 120 日历史的 z 分数(cross_zscore,先取 log 压住放量日的重尾),再用
    cross_ema 带上 10-20 日的慢平滑;种子 3 用 cross_tail_mean_q75 只读"最近 60 日里最猛的四分之一天"的强度。机制:散户的注意力买盘集中在开盘集合竞价挂出(Barber-Odean
    2008 的注意力买入;Berkman-Koch-Tuttle-Zhang 2012 的开盘价压力),竞价量相对自己的常态突然放大 = 注意力被抢走,之后回吐;z
    分数去掉了让所有水平因子长得一样的持久截面水平。

    (b) 竞价占全天的比例(种子 4-7、15):div(C, day_sum(Volume))(EMA 30 日)、它的 60 日 z 分数、C 对"开盘后
    30 分钟连续竞价量"之比、C 在"全天总量同一十分位"内的标准化(cs_bucket_zscore,键是 30 日平均总量)、以及 60 日滚动回归 cross_regres(log
    全天量, log 竞价量) 的残差。机制:有多少交易被攒到开盘一次撮合、而不是在盘中分散成交,反映的是隔夜信息 vs 日内流动性的相对分量;比例和残差都是无量纲的,量级被除掉了(与
    head 的 rho 应远低于 0.7,见相关表)。

    (c) 竞价量与隔夜跳空配对(种子 8-12、14):G = 开盘价 / 前收 - 1(后复权,不含分红缺口)。cross_ema(G * 竞价量 z 分数)(带量的跳空累积)、sign(G)
    * z 分数、log 竞价量与 G 的 60 日相关、|G| 对竞价量的 60 日回归 t 值(这只股票的"竞价价格冲击斜率":大跳空是带量还是不带量)、日内收益对竞价量的
    90 日回归 t 值、以及只在竞价量 z > 1.5 的放量日累积跳空(select_where)。机制:带量的跳空(知情 / 机构)与不带量的跳空(散户噪声)后续的路径不同,让股票自己的历史说话,方向交给奖励定,不是我先验押注。

    (d) 开盘 vs 收盘的参与倾向、爆发性(种子 13、16):log(C+1) - log(day_last(Volume)+1) 的 30 日 EMA(开盘重
    = 消息驱动,收盘重 = 被动 / 机构调仓),以及 60 日变异系数(竞价量有多不规则)。

    为什么与以前不一样:快照里已见过的含 C 的外围只有 {cross_sum}、{cross_sum, cross_sum} 和库里一条 {ts_reg_tvalue,
    cs_mask_top_replace_mean, sqrt, cross_sum, day_quantile, cross_quantile_q50};我的
    16 个种子外围没有一个含 cross_sum,全是 cross_ema / cross_zscore / cross_tail_mean / cs_bucket_zscore
    / cross_regres / cross_reg_tvalue / cross_corr / select_where 的组合。我用 AlphaCube
    的骨架函数核对过:16 个种子的骨架没有一个在两个库 5583 条的骨架集里,cross_zscore / cross_ema / cs_bucket_*
    在库里出现 0 次;库里 33 条含 day_first(Volume / Amt) 的表达式全是原始算子包法(ts_* / cross_sum / cross_argmin),没有一条把竞价量与跳空配对,也没有一条拿它除以全天量。

    为什么样本外还会在:集合竞价制度(9:15-9:25、一次撮合、T+1、涨跌停)2018 年以来没变;散户 / 机构在竞价阶段的行为差异是结构性的,不靠某一年的行情。去水平之后的信号与
    liq / known 的重合应当很小,这是它不被两个冠军吃掉的前提;如果相关表显示种子对控制的 rho 仍然很高,说明去水平没去干净,这是我最担心的失败方式。诚实预测:出
    head 的概率很低(见笔记)。'
