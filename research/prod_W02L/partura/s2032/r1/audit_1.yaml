slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [16]
    reasons: |-
      核心与门槛:核心 day_first(Volume) 是快照 3 个 head 的字面子树,每个种子都字面包含它。核心 vs cross_sum(C,3) 原始 |ρ| 0.90(它就是 head 的原料,E 门槛不看这个);核心对 5 个控制的 |ρ| 为 liq 0.56 / vol 0.25 / rev 0.21 / known 0.60 / size 0.41,全部 <0.8,过 E 门槛。
      划掉 16:与 cross_sum(C,60) 原始 |ρ| 0.721(≥0.7 自动划掉),liq 0.71、known 0.72。其余 15 个保留(≥4)。
      创新度 4:快照 3 个 head 都是竞价量的 3/5/60 日合计(水平)。保留的 15 个里 12 个对 head 的残差 |ρ| ≤0.19(a1 0.19、a2 0.10、a3 0.05、a5 0.16、a8 0.06、a9 0.09、a10 0.09、a11 0.03、a12 0.03、a13 0.17、a14 0.06、a15 0.13),是去掉水平后的异常量或与跳空的配对,不是 head 换写法。a4(竞价量/全天量的 EMA30,残差 0.57)、a6(竞价量/前 30 分钟量,残差 0.49)、a7(EMA20 按 30 日均成交额分桶标准化,残差 0.42)与 cross_sum(C,60) 仍有残差联系,但原始 |ρ| 为 0.62 / 0.56 / 0.33,都未到 0.7,是比例或分桶写法,不划。
      注意相关度表只覆盖快照 3 个 head。W01 库(research/prod_W01/library.json)里已有 cross_max(cross_max(cross_zscore(cs_mask_top_replace_mean_neg(day_first(Volume)),30),30),30)(样本内分 1.46)和 cs_last_low20(…ts_mean(竞价量/(全天量+1),60)…)(分 1.39),分别与 a1/a3/a7 和 a4 同类。这两条的 ρ 没有算,GP 库禁令(≥0.7)会在运行时拒绝相近的种子。若把 W01 也算进「库」,本位创新度应降到 3,通过结论不变。
      合理度 4:机制清楚,竞价量偏离自身历史的部分是开盘集合竞价上的注意力冲击(Barber-Odean 2008;Berkman 等 2012)。逐个算子核对:cross_zscore = (x - 近 d 日均值)/(近 d 日标准差 + EPS),含当日(ops_ext.py:208);cross_ema 为半衰期 EMA 且跳过非有限日(ops_ext.py:172);cross_tail_mean_q75 与 cs_bucket_zscore(y,key) 语义与假设一致(ops_ext.py:320,482);cross_regres 与 cross_reg_tvalue 是 rolling_ols 的 y~α+βx 残差与 t 值(common.py:643),a10 的 |G| 对竞价量、a12 的日内收益对竞价量,x/y 顺序与描述一致。无前视:输入都在 t 日收盘前可知,label.py 的标签从 t+1 进场。
      数值:a4、a5 的分母是全天量,只在 0/0 时为 NaN。a6 的分母是 1–30 格连续量:一字板日为 0,div 给出 inf(common.py:175),但 cross_ema 跳过非有限日,所以不会爆。接近零的非零值(几百股)仍会产生数十到数千倍的爆点,这没有证明支配了截面,按 §3 放行,请 PI 在 train 上先看爆点占比。
      小问题:(1) 假设文字说 (a) 组先取 log 压重尾,但 a1、a3、a9、a14 用的是原始竞价量;(2) day_first 取的是第一个非 NaN 格(common.py:467),若竞价格偶发 NaN,C 会静默变成 09:31 的量,请 PI 查 bar 0 的 NaN 率。
      如果它有 alpha,最可能来自:竞价量偏离自身历史的部分在开盘集中成交的散户和注意力买盘,随后回吐;其次来自竞价量与跳空 |G| 的配对(带量跳空与不带量跳空的后续路径不同)。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [6]
    reasons: |-
      门槛:保留种子对 3 个 head 的原始 |ρ| 最大 0.34(b9),对 5 个控制最大 0.45(b3 的 vol 0.45、rev 0.44),都未到自动划线线。
      划掉 6:b6 = cross_corr(G,I,60) 与 b4 = cross_reg_tvalue(G,I,60) 是同一对变量、同一窗口。rolling_ols 的 tvalue = β/se,se = sqrt(rss/(n-2)/Sxx),代入得 t = r·sqrt(n-2)/sqrt(1-r²),对固定 n 是 r 的严格单调函数;rolling_pair_reduce 的 corr 用的是同一有效掩码与同一 n。窗口完整时两者的日截面秩完全相同。相关度表也一致:原始 |ρ| 0.133 对 0.131,残差 0.084 对 0.085,5 个控制的 |ρ| 两位小数全部相同(liq 0.19、vol 0.06、rev 0.01、known 0.17、size 0.14)。留 b4(t 值)。
      创新度 4:快照 3 个 head 全是竞价量的水平合计。b 位全部用价格口径:G = 开盘/前收 - 1,I = 收盘/开盘 - 1。保留的 14 个种子对 head 的残差 |ρ| 全部 ≤0.24(b7 最高)。W01 库(我只核对了其中约 280 条表达式):没有一条把 G 与 I 配对,也没有一条对 G 做 cross_ema;G 与成交量配对的有 18 条(如 cross_regbeta(day_sum(in_slice(Amt,1,30)), G, 60),样本内分 2.29),它们不是这里的 G-I 配对。需注意 b2 = cross_ema(G,40) 与 W01 最优 head(样本内分 2.37)里的 cross_mean(G,20) 组件是近亲,未划,请 PI 补算两者的 ρ。
      合理度 4:算子核对:ts_delay 沿第 0 轴(日)移位(nd_ts.py:113),G、I 用的前日收盘正确。cross_regbeta(G,I,120) 是 I 对 G 的斜率,cross_reg_tvalue(G,I,60) 是 I 对 G 的 t 值,与假设一致。无前视:G 用 t 日开盘(进场前已知),I 用 t 日收盘(标签从 t+1 起算)。分母都是价格或绝对均值,没有近零除数(b9 的分母是两个绝对均值之和)。机制是隔夜与日内的拉锯(Lou-Polk-Skouras 2019)加上注意力推高的开盘价回吐(Berkman 等 2012),制度原因(T+1、涨跌停、竞价撮合)2018 年以来没变。
      小问题:(1) is_lt / is_gt 返回整数,NaN 变成 0(common.py:254),停牌日(G 或 I 为 NaN)在 b7 的 cross_ema 里以 0 计入,停牌多的股票会被拉向 0,影响小,请知悉;(2) b11/b12 假设写的是「连续成交均价」,实际算的是第 1–30 / 1–15 格收盘价的算术均值;(3) b14 与 b15 对 head 和 5 个控制的 |ρ| 曲线几乎一样(差 ≤0.02),但构造不同(90 日相关 vs 乘积 EMA),未证实互为重复,保留,请 PI 补算两者的互相 ρ。
      如果它有 alpha,最可能来自:同一只股票隔夜跳空之后是被日内延续还是回吐的个股反应函数(由持有人结构和盘口厚度决定的慢变量);其次是隔夜与日内绝对变动的份额和尾部不对称。
R:
  - head: 'cross_sum(day_first(Volume), 60)'
    soundness: 4
    reasons: |-
      5 个变体各自实现了一种去水平写法,窗口和算子都能落地:v1 为 60 日份额(分子分母同窗口,缺失日一致);v2 对自身 240 日标准化;v3 为 20 日与 120 日均值的对数差;v4 按 60 日总量十分位内标准化;v5 按流通股本十分位内标准化。
      备注(不影响分数):v1 与原 head 残差 |ρ| 0.61,是唯一能同时规避热身偏差的变体。v5 与已知族 |ρ| 0.54,不满足 R 规则的「已知族 <0.5」条件,且与原 head 原始 |ρ| 0.708。
      另一个需要核实的点:快照 head 的 cross_sum 对窗口里缺失的日子直接少加(common.py:545,nansum 只要有一天有值就不为 NaN),cross_valid_count 的注释确认立股前只是 NaN 格。所以新上市股在前 60 天的合计系统性偏低,而 tradability.py 没有上市天数过滤。若 head 的 -1 方向多头书主要落在新股上,这是 §4 的热身期问题,不是「水平」问题。请 PI 用 cross_valid_count 查多头书里上市不足 60 日的占比。
  - head: 'cross_sum(day_first(Volume), 5)'
    soundness: 4
    reasons: |-
      4 个变体都是合理的去水平或趋势写法:log 竞价量快慢 EMA 之差、按 5 日总量分桶的排名、5 日份额、对 250 日标准化。5 日窗口的热身偏差只影响上市前 5 天,可忽略。
      备注:v3(5 日份额)与原 head 原始 |ρ| 0.702,按 R 规则会替换原 head,这是预期内的。
  - head: 'cross_sum(day_first(Volume), 3)'
    soundness: 3
    reasons: |-
      v2(3 日份额减 60 日份额)分子分母窗口一致,合理。
      v1(按 30 日均 Amt 分桶的 3 日合计标准化)与原 head 残差 |ρ| 0.88,去掉水平后几乎就是原 head 的信号,达不到 +0.1 的门槛。机制没错,但这个变体基本是空跑。
      v3(3 日合计 / 60 日合计)有明显的定义偏差:60 日合计在新股上是部分窗口的和,分母偏小,比值被系统性推高,新股被推向截面顶端。比值有界不等于无偏,属于 §4 热身期问题。建议删掉 v3,或改成 60 日均值之比。
      组内只有 v2 可用,所以给 3 分;通过,但请 PI 处理 v3。
