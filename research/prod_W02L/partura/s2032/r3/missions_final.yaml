  hypothesis: 机制:收盘集合竞价(尾盘最后一格)的成交占比对『市场收盘成交占比状态』的联动。灵感来自本轮第 3 批(day_last(F) 一族,头部是
    ts_std(day_last(Amt), 50)、ts_regbeta(day_last(Amt), day_durbin_watson(Open), 10),全部在读收盘一格成交额的绝对量级与波动,分数
    -0.25 到 -0.52,即只是 liq / known 的水平版本,没人去掉量级)。这里做三件事:(1) 去量级:用 A = day_last(Amt)
    / day_sum(Amt),收盘一格占全天成交额的比例,无量纲;(2) 取市场状态 M = cs_quantile_q50(A),即当天截面中位的收盘占比(被动
    / 基准型资金在收盘集中调仓、月末与指数再平衡日 M 升高);(3) 每只股票对 M 的 60-120 日回归 beta / t 值 / 相关 / 残差。读法:个股收盘占比与市场收盘占比同步性高
    = 被被动与基准型资金持有 / 跟踪;个股收盘占比的特异成分(cross_regres 残差)高 = 个股自己有尾盘的信息交易或操纵性拉尾盘。两者都是无量纲、慢变量;与库里
    B096 一族(只有绝对额的 ts_max / ts_std / ts_regbeta)不同,库里没有 cs_quantile 作市场状态、也没有 day_last(Amt)
    对 day_sum(Amt) 的比例。样本外为什么还会在:基准型 / 被动资金在一天最后时段集中成交是制度性行为(与日终定价基准有关,Chordia-Roll-Subrahmanyam
    2000 的市场共同流动性思路),不依赖某段行情;day_last 取每天最后一个有效分钟,不是前视(当天收盘时已知,信号只用于次日)。注意:不同交易所收盘撮合规则可能不同,所以只预期窗口
    60 以上的慢写法有效。我没有给方向先验,由奖励定方向。诚实预期:最可能的失败是收盘占比与流动性控制的负相关(小盘占比小)没被去干净,这类种子会被相关度表划掉。
