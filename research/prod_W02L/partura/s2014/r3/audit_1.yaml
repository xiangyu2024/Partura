    reasons: '创新度 3。核心 day_gini(Low) 是一天内分钟最低价的基尼系数，库里和两个冠军都没有 day_gini（r2 笔记：ops_ext 新算子在两库中出现次数为 0），不是换写法。但它与 vol 控制的原始 |ρ| 为 0.451，是 5 个控制里最高的；与 liq、known 均约 0.30；与快照 head ts_stddev(ts_cov(day_quantile_q25(Ret), day_close(High), 50), 5) 的原始 |ρ| 为 0.311，残差 0.296。日内价格离散度在很大程度上就是日内振幅，与波动相近，所以给 3 而不是 4。合理度 3。逐算子核对：day_gini（ops_ext.py:136-152）对 |x| 排序后取标准基尼，缺失分钟排到末尾补零，尺度无关，无前视；cross_zscore、cross_madz、cross_ema、cross_corr、cs_regres、cs_bucket_zscore、cs_flip_by_state 的窗口均因果（含当日）。cross_semistd_neg / pos 经 _semistd（ops_ext.py:751-761）对日间 log 比取半离差，要求 x>0 且 prev>0。数值伪影（§4）：我用 numpy 在 float32 下复刻 day_gini 公式，对 20000 个常数价格日（241 分钟同一价）计算，输出约为 ±3e-7，其中约 24% 为正、28% 恰为 0、48% 为负。正的微小值进入 _semistd 时 log 比约为 -13，平方约 170，在 241 日均值里占一大块，于是 cross_semistd_neg(day_gini(Low), 241)（种子 4）在窗口含一字板日时会被这一项支配。这是否成立取决于数据里一字板的分钟最低价是否为全天常数（前向填充则是，无成交留空则不是）；我没有读数据，所以不划种子 4，但 PI 必须先数一字板日的占比，若不可忽略应划掉种子 4。种子 5 的 sub(pos, neg) 中每个微小正值同时进入 neg（当天）与 pos（次日），差里基本相消，保留。核心本身在这一条下也有噪声，但它只让一字板日排在截面底部，不构成定义坏掉。划分：种子 6 = cs_bucket_zscore(day_gini(Low), LogFloatCap)，与核心的快照 head |ρ|（0.306 对 0.311，残差 0.292 对 0.296）以及五控制 |ρ|（liq 0.288 对 0.299，vol 0.446 对 0.451，rev 0.206 对 0.207，known 0.289 对 0.300，size 0.010 对 0.008）逐项相差不超过 0.011；流通市值与 gini 的 |ρ| 仅 0.008，分桶标准化几乎不改变排序，与核心是同一个东西，划掉。种子 2 = cross_ema(day_gini(Low), 20) 的 vol 控制 |ρ| 为 0.688，接近 0.8 的自动线但未过，保留。种子 1 cross_zscore 与种子 9 cross_madz 的控制画像不同（vol 0.072 对 0.174，known 0.004 对 0.072，head 0.098 对 0.124），保留。种子 3、7、8、10、11、12、13 保留。外围查重的局限：loc.json 只列了 heads，共性表里 9 个含 day_gini 的已评候选没有逐条列出，我无法逐条比对；本轮的 cross_semistd_neg 与 sub(pos, neg) 与上轮 pos 版不同，未见重复。另：本轮笔记称上轮 cross_semistd_pos(day_gini(Low), 241) 是最接近线的，它与种子 4、5 走的是同一条路径，若它的分数里有一部分来自上面的伪影，PI 应核对。如果它有 alpha，最可能来自日内价格路径的离散结构（下探与上行的分布形状，即日内不确定性），但这与日内振幅、波动相近，更可能是高波动、低换手风格的残差，而不是独立的微观结构信号。'
