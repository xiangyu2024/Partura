    reasons: '创新度 4。核心 S1 = cross_sum(cross_delta(sub(log(day_close(Close)), LogFloatCap), 1), 241) 读的是日频叶子 LogFloatCap，库里没有读过它（r2 审计员已在 inputs/libs_train.csv 上核对全文无 Log，本轮采信不重复）。相关度表：核心与快照 9 个 head 的原始 |ρ| 最大 0.13（ts_med(ts_reg_tvalue(day_std(pow_3(Open)), day_quantile_q25(Ret), 50), 40)），残差最大 0.07；与 5 个控制的 |ρ| 最大为 vol 0.163、size 0.142、其余低于 0.02，远低于 0.8。13 个种子的 head 最大原始 |ρ| 都在 0.13 以下，与控制的 |ρ| 最大为种子 6 与 8 的 size 0.14 左右。不给 5 是因为 size 与 vol 仍有 0.14 与 0.16 的相关，且 S1 的水平 / 增量族在 r2 已押过一次，只是外围新。合理度 4。逐算子核对：cross_delta 为 x_t 减 x_(t-1)（AlphaCube-steering/src/alphacube/operators/dt_cross.py:174），cross_sum 为滚动 nansum（dt_cross.py:218），合起来恰为 X_t 减 X_(t-241)，即 241 日累计变化而非事件计数。X = log(后复权收盘) 减 LogFloatCap = log(复权因子) 减 log(流通股本)，价格项相消的前提是 circulating_market_value（LogFloatCap 的来源，docs/steering_and_daily_fields.md:166）用未复权收盘价计算；r2 审计已按 docs/design.md:354 核对前提成立，本轮未重新打开数据，若前提不成立则 S1 仍是有效信号，只是机制描述要改。cs_flip_by_state 的状态是全市场截面均值的 241 日 trailing 分位（ops_ext.py:532-543、562-580），用当日截面秩减 0.5 再按符号翻转，无前视。cs_regres、cs_bucket_zscore、cross_zscore、cross_ema 均为因果窗口（含当日）。cs_rank 走 common.rank（common.py:320），不经 nanrank_last（common.py:529），不触发 §4 的陷阱。数学问题未见。质量风险（不挡）：(1) 上市不满 241 日的票 cross_sum 给部分和，S1 变成「自上市以来的变化」，年龄会混进信号，ListAge 类种子会部分吸收这一点；(2) 送转日流通股本更新滞后（r1 审计已记），端点有偏差。划分：种子 8 = cross_ema(cs_bucket_zscore(S1, ListAge), 20)，与种子 6 = cs_bucket_zscore(S1, ListAge) 的六个 |ρ|（head 0.061 对 0.058，残差 0.076 对 0.070，liq 0.085 对 0.086，vol 0.075 对 0.077，known 0.087 对 0.090，size 0.143 对 0.142）逐项相差不超过 0.006；S1 本身是 241 日的慢变量，20 日半衰期的 EMA 只是再平滑一次，与 r2 因同样理由划掉的 cross_ema(X, 60) 是同一类，划掉。种子 11 = cross_ema(cs_flip_by_state(S1, day_std(Ret)), 20) 与种子 2 只差 EMA，但 vol 控制差 0.039、size 差 0.031，超过重复口径，保留。种子 1 与种子 2 的状态变量不同（成交额均值对波动均值），五控制画像都接近零，最大差 0.03，保留；若 PI 认为是重复，可再划 2。其余 11 个保留。如果它有 alpha，最可能来自分红、送转、增发与解禁带来的净派现持续性（派现黏性、净发行异象），而不是 log 价格水平本身；cs_flip_by_state 的作用是让这一项的符号随市场状态翻转，若有效，train 与 valid 应同号。'
