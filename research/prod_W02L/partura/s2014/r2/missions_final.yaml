- type: N
  hypothesis: '机制:已实现收益的不对称(偏度、彩票偏好)。散户对「可能暴涨」的股票愿意多付钱(Kumar 2009;Bali-Cakici-Whitelaw
    2011 的 MAX 效应;Amaya 等 2015 的已实现偏度:已实现偏度高的股票未来收益低),A 股的散户占比让这条更强;对称的另一端是崩盘型(下行半离差占主导)的股票,承担了被偏好者让出来的风险溢价。度量用半方差(Barndorff-Nielsen
    等 2010):日度后复权收盘价的对数收益里,上行半离差与下行半离差之比。


    算子怎样实现:cross_semistd_pos(x, d) 与 cross_semistd_neg(x, d) 是 ops_ext 里的新算子,对正数序列
    x 取日对数变化 g,返回 sqrt(mean(max(g,0)^2)) 与 sqrt(mean(min(g,0)^2)),分母是窗口里所有有值的天(不只是上行或下行的天),所以两者可直接比。不对称指数
    A = (pos − neg) / (pos + neg) 落在 [−1, 1],无量纲,与波动水平无关,所以 5 个控制里的波动控制与流动性控制没有直接暴露;分母只在窗口内价格完全不动(停牌或整段涨跌停锁死)时为
    0,此时分子也是 0,得缺失,不会爆。A 与对数比 log(pos / neg) 是同一个单调变换,所以只写一个。x 取 day_close(Close)(后复权收盘价,日对数变化
    = 含分红的总收益),另试成交量加权日均价 day_wmean(Close, Amt)(去掉收盘集合竞价的噪声)与 day_first(Open)(开盘到开盘,换一个采样点)。窗口
    60 / 120 / 241 三档;按波动、规模、成交额十分位做中性的版本(cs_bucket_rank / cs_bucket_zscore);cross_ema
    平滑;60 日减 241 日(近期偏度相对长期偏度的变化)。另一条日内的腿:day_es_ratio_hi(Ret) − day_es_ratio_lo(Ret)
    = 分钟收益右尾与左尾的形状差(95% 分位以上的均值 / 该分位,减去 5% 分位以下的均值 / 该分位),取 60 / 241 日均值,并与日度 A 的秩相加。


    和库、快照的不同:5583 条库表达式用的是 day_skew、ts_skew 这类三阶矩(对单个极端值敏感、分母是方差的 1.5 次方),没有一条用半离差,也没有一条读后复权收盘价的日度路径不对称;这两个算子(cross_semistd_*、day_es_ratio_*)在库里出现次数是
    0,骨架逐个核对过不在库里。快照里的 head(B040 的 ts_std(q25(Ret), 5)、B041 的 ts_cov / ts_med 一族)都只度量分钟收益的左尾,没有一个有右尾那一端,也没有一个在日度路径上比较涨跌的幅度;这一批里反复出现的是「下尾」,而被定价的是「两尾的差」。


    为什么样本外还会在:(1)彩票偏好是持久的行为偏差,不依赖某段行情;(2)窗口 60 ~ 241 日的半离差变化慢,换手低;(3)指数无量纲,不是波动水平的换写。风险要写明:A
    与 20 日反转、与近期是否有大涨日会有相关(新尺子去掉了 20 日反转的线性、U 形、S 形暴露);牛市与熊市里不对称的符号未必相同,train 与 valid
    符号相反时 score 为负;涨跌停制度把单日涨跌幅封在 ±10%(创业板 / 科创板 ±20%,ST ±5%),上行半离差被上限截断,这是各只票各自一个常数,不影响指数的符号。


    数学检查:(1)无前视:只用到截至 t 日收盘的价格。(2)分母 pos + neg 为 0 只在价格窗口内完全不动,此时得缺失;没有对近零量做除法。(3)半离差用窗口内所有有值的天做分母,至少
    3 天才有值,前几天缺失,占比可忽略。(4)day_es_ratio 在分位数接近 0 时算子本身返回缺失(不是 1e4 一类的爆点),缺失的天不进均值。(5)指数有界,没有溢出。'
