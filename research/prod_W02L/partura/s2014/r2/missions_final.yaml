R:
- head: ts_med(ts_cov(day_quantile_q25(Ret), day_close(Ret), 50), 40)
  why: 烂部件是协方差的尺度和 ts_med 的窗口。拆解表(本轮 loc):ts_med 窗口 20 / 40 / 80 得 -1.35 / -1.48 /
    -1.27(80 日验证段 -0.50,比原 head 的 -0.76 好),只留 ts_cov 本身 -1.76,说明外层的中位数在平滑而不是造信号;ts_cov
    = 相关系数 × 两个标准差,量级正比于波动的平方,是波动控制的近亲,真正想量的是「25% 分位分钟收益与收盘分钟收益的同步程度」,所以换成无量纲的相关系数(cross_corr
    与 cross_med 套),并把窗口拉到 80 ~ 120(120 日用 cross_med 避开 ts_* 的整块内存);另一个变体按波动十分位做 z
    分数去掉水平。数学:cross_corr 的分母是 sqrt(var_x var_y) + 1e-9,日度分位数收益与收盘分钟收益都是 1e-3 ~ 1e-2
    量级,方差 1e-6 ~ 1e-4,分母远大于 1e-9,影响可忽略;窗口 120 的前几十天用较短窗口,不是缺失。
  variants:
