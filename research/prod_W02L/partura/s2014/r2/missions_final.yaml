  why: 烂部件是尺度。拆解表:窗口 2 / 5 / 10 得 -1.89 / -0.88 / -1.10,第 1 轮 3 日版 -1.17,5 日已是窗口最优,再调窗口没有空间;训练
    -0.43 而验证 -0.88,验证段更差。ts_std(q25(Ret), 5) 是下四分位分钟收益的绝对标准差,正比于波动水平,而波动水平正是新尺子要吃掉的控制;想量的是「尾部的不稳定相对总体波动有多大」,所以除以
    60 日平均日波动、按规模十分位和波动十分位做 z 分数各试一次,再试上尾与下尾的不稳定程度之差(右尾减左尾)与 cross_ema 平滑。数学:day_std(Ret)
    的 60 日均值只在整段停牌时为 0,此时分子也是 0,得缺失;分桶 z 分数的分母是桶内标准差加 EPS;q75(Ret) 与 q25(Ret) 同为一天里分钟收益的分位数,没有除以近零的量。
