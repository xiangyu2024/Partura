- type: N
  hypothesis: '机制:公司的资本动作(现金分红、送转股、增发、限售股解禁)在日线上留下一条只有「总收益价」与「流通市值」放在一起才看得见的缝。分钟字段
    Close 是后复权价(AlphaCube docs/design.md §11.5:Close / (Amt / Volume) 跨股票 2.5 ~ 113、每只票内部变异系数
    1% ~ 2%,即每只票一个后复权因子 F),它的日变化是含分红的总收益。LogFloatCap = log(流通市值) = log(未复权收盘价 × 流通股本),存储文档
    §1.1 写明「第 d 天的平面存的是收盘时点可知的东西、没有隐式 shift」,它的日变化是价格收益加流通股本的变化。两者相减:Δlog(后复权 Close)
    − ΔLogFloatCap = Δlog F − Δlog(流通股本)。平日这是同一个价格的涨跌互相抵消,恒为 0;除权除息日:现金分红使 F 上跳 D/P
    而股本不变,得 +D/P(股息率);送转股使 F 与流通股本同比例上升,抵消得 0;增发、限售股解禁使流通股本上升而 F 不变,得负。逐日增量求和 = 过去一年的「净派现
    − 摊薄」,即 net payout yield 减 net issuance(Boudoukh 等 2007 的净派现收益率;Pontiff-Woodgate
    2008 与 Fama-French 2008 把净股本发行列为最稳健的异象之一;限售股解禁的抛压见 Field-Hanka 2001)。第二条独立的腿:LogTotalCap
    − LogFloatCap = log(总股本 / 流通股本),价格项相消、只剩股本结构,水平 = 未流通股比例(国资、新股、定增锁定),它的逐日增量求和
    = 一年内的解禁释放(负)。


    算子怎样实现:S1 = cross_sum(cross_delta(sub(log(day_close(Close)), LogFloatCap), 1),
    241)。cross_delta(·, 1) 取逐日增量;cross_sum 在窗口里对有值的天求和,窗口不满时也给值。不用 cross_delta(·,
    241),原因来自第 1 轮的事实:第 1 轮 E 位里 4 个 cross_delta(·, 241) 种子(以 log F 为内容)在相关度表里覆盖率只有
    0.85,低于 0.9 的门槛被判废品,所以 log F 增量这条路从来没被打过分;覆盖率靠严格滞后会掉 14 个点,逐日增量求和没有这个问题,前 241
    天用较短的窗口。另有按规模 / 波动 / 成交额 / 真实价格(sub(LogFloatCap, LogFloatShares))十分位做中性的版本、半衰期
    60 / 120 日的指数衰减版(cross_ema,连续量)、|增量| 求和(「资本动作频度」,含送转炒作)、解禁腿的增量求和与水平(以及对规模回归后的残差)、两腿的秩相加。


    和库、快照的不同:两个库 5583 条表达式没有一条读过日频叶子(第 1 轮已逐条核对),所以库、也就是两个冠军,看不到流通股本与市值,摸不到分红与摊薄。快照
    6 个 head 全是分钟分位数、滚动协方差、成交额分布一族。第 1 轮 E 位的 log F 增量取的是 q25(High)(分钟最高价的 25% 分位,日内噪声约
    1% ~ 2%,与一年期股息率同量级,事件信号被噪声盖住),本轮换成收盘价,增量干净。第 1 轮 N 位试过的是价格水平 P 与 tick 摩擦(水平量、没有事件),全部不好;这里读的是事件流,不是水平。


    为什么样本外还会在:(1)派现习惯很黏(Lintner 1956),解禁日程由发行时的承诺决定,都与某段行情无关;(2)一年窗口的事件流变化很慢(只在除权日和解禁日跳变),日换手很低,15
    bp 成本吃不掉(第 1 轮已看到最不差的子树全是慢的日频量);(3)弱旁证:2028 流本波的 head 是「低后复权价档里挑总市值大的」,按我的读法是偏价值
    / 偏红利的股票,派现是比它更直接的价值 / 红利度量(PROGRESS 里认为那个 head 更可能是尺子对阶跃带的盲区,所以这只是弱旁证,不当作依据)。风险要写明:分红股集中在大市值、低波动、低换手,这些已被
    5 个控制与两个冠军去掉一部分;2023-08 以后红利风格大涨而 2018 ~ 2023 风格混杂,train 与 valid 的符号若不一致 score(取较差的那个)会是负数,这个风险由尺子自己挡。


    数学检查:(1)无前视:两个叶子都是收盘时点可知,没有 shift 到未来。(2)float32:LogFloatCap 在 21 ~ 30 量级,float32
    精度约 2 ~ 4e-6,一年增量求和的噪声不超过 5e-5,而年度股息率 5e-3 ~ 5e-2,高两三个数量级。(3)无事件的股票(估计约三成)取值落在数值噪声里,排名在中间;十分位多头书取的是两端(大派现或大摊薄),两端由事件决定;门槛里的
    distinct 比例靠这些噪声通过,这不影响两端。解禁腿的增量求和同样事件稀疏(另一条流的相关度表里 log(总股本 / 流通股本) 的 241 日差 distinct
    比例 0.63、60 日差 0.29 被门槛判废品,所以这里只写 241 日求和,不写 60 日以内的求和,也不对它做分桶 z 分数,那会把无事件的票压成十个值;对它只用回归残差,残差是连续量);水平腿(distinct
    0.73)、指数衰减版与分桶 / 回归版是连续量。主种子的 distinct 靠 241 日窗口里约六成以上的票有分红或股本事件(估计,本机未验证)通过;若不够,指数衰减版与分桶版是后备。(4)没有除法,log
    的输入是正的后复权价,|x| ≤ 1e-9 的缺失线远在价格之下。(5)送转后若流通股本更新比价格晚几天,会出现 ±log(1+r) 的几天假象,占样本不到
    1%,逐日求和后窗口一过自动抵消。(6)停牌日增量为空,事件落在停牌期会被漏掉,罕见。(7)前 241 个交易日窗口较短,只占样本约 12%,不是热身期主导。'
