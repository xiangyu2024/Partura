    soundness: 4
    struck_seeds: [8]
    reasons: '创新度 4。核心是日频叶子 LogFloatCap、LogTotalCap、LogFloatShares 的日增量与水平，库里没有：我在仓库里核对了 inputs/libs_train.csv（5583 条库表达式），全文 grep Log 为 0，PI 的说法属实。快照 6 个 head 全是分钟分位数与滚动协方差族。相关度表：种子 1 的原始 |ρ| 与最像的 head ts_std(day_quantile_q25(Ret), 5) 为 0.028、残差 0.055；种子 2、4、5、7、9、10、13、14 的原始 |ρ| 都在 0.06 以下。与控制的最大 |ρ|：种子 11 与 size 为 0.418（它是流通比例的水平，不是市值本身），种子 6 与 liq 为 0.19、known 为 0.18，种子 12 与 liq 为 0.237，都低于 0.8 的自动划掉门槛。种子 12 与 head ts_sum(cross_fangzheng(...)) 的原始 |ρ| 为 0.274，是本位最高，仍在 0.5 以下。  合理度 4。逐算子核对：cross_delta 是逐日一阶差（AlphaCube-steering/src/alphacube/operators/dt_cross.py:174）；cross_sum 是滚动 nansum（dt_cross.py:218），全 NaN 窗口返回 NaN（common.py:545），所以无缺失时 cross_sum(cross_delta(X,1),241) 恰等于 X_t 减 X_(t-241)。这里 X = log(后复权收盘) − LogFloatCap = log F − log 流通股本，价格项相消，因为两者取同一个未复权收盘价。AlphaCube-steering/docs/design.md:354 写明 Close 是后复权价；在后复权下，现金分红使 F 按 1+D/P 上跳，送转使 F 与流通股本同比例上升而抵消，增发与解禁只使流通股本上升，符号与 PI 的 net payout 论证一致。因果性：AlphaCube-steering/docs/steering_and_daily_fields.md:46 写明日平面只存收盘时点可知的数，没有隐式 shift，无前视。§4 的 nanrank_last 只出现在 ts_rank（nd_ts.py:198）、cross_rank（dt_cross.py:263）、in_rank_rolling（dt_in.py:399）里，本位用的 cs_rank、cs_bucket_*、cs_regres 不在其中；cs_bucket_zscore 的 |z| 不超过 sqrt(桶内样本数)（Partura-prod/partura/ops_ext.py:482–495），没有爆点。float32 噪声在日增量上约 1e-6，241 日求和后远小于事件量级（约 5e-3 到 5e-2）。质量注意：cross_sum 在窗口不满时给部分和，新股前 241 个交易日的和偏小，会把解禁腿（负的一端）压向零，这是衰减而非伪影；PI 写的「占样本约 12%」指的是样本起点，不是每只票的新股期。  划分：种子 8 = cross_ema(X, 60)，与种子 1 是同一组日增量换了权重；五控制 |ρ| 的差在 0.003 到 0.022 之间，与 head 的原始 |ρ| 同为 0.028，按 r1 中种子 9 与 10 的重复口径划掉。种子 2（cross_ema 120）与种子 1 的控制画像差 0.035 到 0.045，保留。其余 13 个种子都落在 idea 的某一条腿上（水平、增量、分桶、回归残差、秩相加），没有数学问题，不划。如果它有 alpha，最可能来自一年期的派现减摊薄（派现黏性下的 net payout 与净股本发行），而不是流动性或规模；种子 1 与 liq、size 的 |ρ| 为 0.005 和 0.119。'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: []
    reasons: '创新度 4。核心是日频路径上的上行与下行半离差之比 A（Partura-prod/partura/ops_ext.py 的 cross_semistd_pos / neg，经 _semistd），以及两尾形状差 day_es_ratio_hi − day_es_ratio_lo。快照 6 个 head 全是分钟分位数与滚动协方差，没有一个度量日路径的不对称。相关度表：A 族原始 |ρ| 与 head 的最大值在 0.115（种子 10）到 0.306（种子 3、9）之间，残差最大 0.293（种子 9）；es 族中种子 11 原始为 0.057、种子 12 为 0.085，种子 13 为 0.211。与控制的最大 |ρ|：种子 2 与 rev 为 0.392，种子 3 与 known 为 0.372，都低于 0.8。A 与 20 日反转、与近期涨幅有相关（rev 的 |ρ| 在 0.12 到 0.39 之间），但残差化已去掉这部分的线性、U 形、S 形暴露，所以不是 rev 换写法。  合理度 3。A 族没有数学问题：_semistd 对 x>0 取日对数变化，分母是窗口内所有有值的天，少于 3 天输出缺失；A = (pos−neg)/(pos+neg) 落在 [−1,1]，两者都为 0 时输出缺失，不会爆。种子 5 的 day_first(Open) 用的是后复权 Open（AlphaCube-steering/docs/design.md:354），与 Close 口径一致。es 族的 PI 说法需要修正：Partura-prod/partura/ops_ext.py:647–662 的 _es_ratio 只在 |分位数| ≤ 1e-8 时返回缺失（good = (k>0) & (|v|>1e-8)），挡的是精确为零的分位数，不是「接近零」。在常见的 241 个分钟下，95% 分位落在整数位次上，取的是一个真实分钟收益；非零分钟收益的最小量级约在 1e-4 到 1e-3（价格越高越小）。所以若某天 v 是一个价位档，而尾部 12 个分钟里有一次 1% 的大跳，比值就约为 100，会直接进入 cross_mean(·, 60 / 120 / 241)，一天就能支配整段均值。我没有跑数据，无法确认它在截面上占主导的频率，因此按 §3 放行、合理度降为 3，并要求 PI 跑前核两件事：比值超过 20 的股票日占比，以及种子 11、12、13 顶端十分位的构成。如果它有 alpha，最可能来自 A 族的彩票型偏好与崩盘型风险（Bali-Cakici-Whitelaw 2011，Amaya 等 2015），而非 es 族的两尾形状；es 族要先排除伪影。  划分：不划。种子 5（day_first(Open)）与种子 1 的五控制 |ρ| 差在 0.005 到 0.036 之间（rev 最大，略超 r1 的 0.03 口径），与最像 head 的原始 |ρ| 为 0.287 对 0.293，是同一度量换采样点，但画像差未达到重复口径，保留；种子 4（VWAP 路径）同理。其余种子各有自己的中性化或定义，无数学问题，不划。'
R:
  - head: 'ts_med(ts_cov(day_quantile_q25(Ret), day_close(Ret), 50), 40)'
    soundness: 4
    reasons: '合理度 4。变体 2、3 把 ts_cov 换成 cross_corr：相关系数无量纲，rolling_pair_reduce 的 cov/(sqrt(var_x·var_y)+EPS) 绝对值不超过 1（AlphaCube-steering/src/alphacube/operators/common.py:621–650），没有除以近零的爆点；变体 4 用 cs_bucket_zscore 按 vol 分桶去水平，|z| 有界。变体 1 仍是 ts_cov，只改外层窗口，与 head 的原始 |ρ| 为 0.60，是同一个东西的小改。scale 的 why 成立：ts_cov 正比于波动的平方，这是 head 的 why 中对的部分。机制（25% 分位分钟收益与收盘分钟收益的同步，即尾部流与收盘推动同向）说得通，但 why 没有文献支撑，偏弱。如果它有 alpha，最可能来自尾部卖压向收盘段的延续（变体 2、3），而不是波动水平。'
  - head: 'ts_std(day_quantile_q25(Ret), 5)'
    soundness: 3
    reasons: '合理度 3。变体 1 是 div(ts_std, cross_mean(day_std(Ret),60))，div 在 ops 层是裸 torch.divide，没有 EPS（AlphaCube-steering/src/alphacube/operators/common.py:175）。PI 说分母只在整段停牌时为 0（分子同为 0，得缺失），这漏了复牌的情形：复牌后 60 日窗口里只有 k 个活跃日，分母约为 k·s/60 的小正数，分子仍是 5 日波动，比值放大约 60/k 倍，并持续到窗口走满，不是缺失。这一个变体要去掉，或给分母加保护。变体 2、3 用 cs_bucket_zscore，|z| 有界（Partura-prod/partura/ops_ext.py:482–495），没有问题；变体 4、5 没有除法，没有问题。另有一处 why 的前提与相关度表相冲突：变体 1、2、3 与原 head 的原始 |ρ| 为 0.98、0.96、0.95（残差 0.94、0.97、0.95），除以 60 日波动或按规模分桶几乎不改排序，所以原 head 的截面排序并不靠「正比于波动水平」；机制（下四分位分钟收益的稳定性相对总体波动）仍清楚，why 里对 vol 的解释要改。如果它有 alpha，最可能来自 q25 尾部的稳定性本身。'
summary: '种子 2014 第 2 轮审计：a 通过（N 型，LogFloatCap 事件流，库里没有日频叶子，§4 陷阱未踩；划掉种子 8，与种子 1 重复，剩 13 个）；b 通过（N 型，A 族数学干净；es 族 11–13 的除以近零风险要 PI 跑前核分布，合理度给 3，不划种子）；R1 放行（4）；R2 放行但去掉变体 1（3）。'
