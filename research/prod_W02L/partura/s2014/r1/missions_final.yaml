- type: N
  hypothesis: '机制:未复权价格 P 的水平,以及它通过 0.01 元最小变动价位带来的摩擦。分钟价格字段是后复权价,价格水平在截面上只反映累计收益,真实价格
    P 只能从日频叶子读出来:P = exp(LogFloatCap − LogFloatShares)(流通市值 / 流通股本;股本单位只差一个常数,不改变排序)。两个库能解析的
    5583 条表达式没有一条读过日频叶子(逐条核对过 members.csv),库与两个冠军都看不到 P。

    批里的现象有三条:(1) q25(High) / q25(Vwap) 的几条拷贝在库口径下训练夏普 0.524、日换手 0.0137,新尺子下含 q25(High)
    的 7 条候选均值 −3.38 —— 它们量的是复权后的价格水平,不是真实价格;(2) day_quantile_q25(Ret) 单独过不了门槛(消融表:不同值占比
    0.4955):分钟收益被最小变动价位量化,一半的格子并列在「整数个 tick」上,而「几个 tick」是 P 的函数,不是波动的函数;(3) 项目文档 AlphaCube
    docs/可交易回测.md §21.4 对三个风格的单独打分:未复权低价风格(原样,没有任何中性化)的纯多头夏普,训练段(2018-01 ~ 2023-08)+0.98,2023-08
    ~ 2025-12 为 +0.44,日换手 2.0%;低流动性、低波动是另外两个,而新尺子的控制是流动性、波动、反转、已知成交额族、市值,价格是唯一没被控制的风格。

    三条假设:

    (a) 价格水平本身(低价效应):名义价格低的股票散户占比高、被当作彩票(Kumar 2009),最小变动价位占价格的比例大、买卖价差被离散化(Harris
    1994),低价股的收益特征早有记录(Blume-Husic 1973)。A 股符号由训练段定。不去掉规模 / 流动性 / 波动的版本多半被控制吃掉,所以种子里放「同规模、同成交额、同波动、同总市值、同流通股本十分位内的价格秩」cs_bucket_rank(P,
    X):每个桶里价格都有完整排序,而与桶变量无关。

    (b) tick 计数:log(|q25(Ret)| + 1e-6) 加 log P = log(下四分位分钟涨跌的元数),约等于「一个下跌分钟动几个 tick」。接近
    1 表示价格被钉在最小变动价位上(买卖价差反弹主导),远大于 1 表示波动主导。它把 P 与波动绑在一起,但与单独的波动不同:同样的分钟波动,在 5 元的股票上是
    5 个 tick,在 50 元的股票上是 50 个。

    (c) 同价格分桶的 tick 统计:当天零收益分钟占比、与上一分钟价格相同的分钟占比、当天走过的不同价位占比、q25(Ret) 及其日间标准差,在 P 的十分位内做秩或
    z 分数。同一价格档位的 tick 粗细相同,桶内的差别才是「相对 tick 它有多活跃」,这是活跃度 / 流动性的另一种读法,不再被价格档位污染。

    算子怎样实现:P = sub(LogFloatCap, LogFloatShares) 直接当信号;cs_bucket_rank(P, X) / cs_regres(P,
    X) 做桶内价格;add(log(add(abs_(day_quantile_q25(Ret)), 0.000001)), P) 做 tick 计数,cross_mean
    做 20 日平滑;day_zero_ratio / day_flat_ratio / day_distinct_ratio(都是 ops_ext 的算子,当天比例,有界
    [0, 1])配 cross_mean 与 cs_bucket_rank / cs_bucket_zscore 做桶内 tick 统计。

    为什么和已有的不同:库里没有一条读日频叶子,所以没有任何库表达式能写出 P 或按 P 分桶;W01 的 head 里 P(或 P − LogFloatShares)只作为筛子
    / 分桶键出现,y 是量能类(cs_first_low20(y, P) 一类),没有把 P 当信号,也没有把 tick 统计放进同价格档比较;这里的骨架全部不在两个库里。与
    5 个控制比:价格与市值只是相关(P 与 LogFloatCap 之间有 LogFloatShares),桶内版本把市值 / 成交额 / 波动都分开了;与批里
    3 个 head 比:head 读的是复权价格面板与成交额的 25% 分位,没有真实价格。

    为什么样本外还会在:价格水平与 tick 摩擦是缓慢变化的个股属性(价格面板日换手约 2%,15 bp 成本不构成负担),机制是 0.01 元的最小变动价位与散户的名义价格偏好,只要最小变动价位和投资者结构不变就存在,不依赖某段行情。风险:P
    的低价端含 ST / 退市风险股,方向与分数由 train 和 valid 各自检验,score = min(train, valid)。

    数学检查:log 的输入是 |q25(Ret)| + 1e-6 ≥ 1e-6,远大于算子 log 的 1e-9 缺失线;|q25(Ret)| = 0 的股票(整天不动)取
    −13.8 加 log P,是有界值而不是 −inf;所有比例类算子的分母是当天有限分钟数,当天不足两分钟的股票给缺失;cs_bucket_* 在任一输入缺失时输出缺失,cs_bucket_rank
    的桶内并列用全局秩 × 1e-4 打破;没有除以近零的量;无前视(LogFloatCap / LogFloatShares 是 t 日的日频字段,分钟统计只用
    t 日及以前)。P 在 float32 下的绝对误差约 1e-6,而价格档位之间差 0.1 以上,不被淹没。'
