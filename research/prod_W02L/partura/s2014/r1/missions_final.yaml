R:
- head: ts_std(day_quantile_q25(Ret), 10)
  why: 烂部件有两个。(1) 窗口:拆解表里 ts_std 的窗口 20 / 10 / 5 得分 −1.19 / −1.13 / −0.88,越短越好,5 日版已比原
    head 好 +0.26(loc 的 R 候选),趋势还没到头,所以再试 3 日。(2) 尺度:ts_std 是下四分位分钟收益的绝对标准差,正比于波动水平,而波动水平正是新尺子要吃掉的控制;真正想量的是「波动率的不稳定程度」,即波动的变异系数(Baltussen
    等 2018 的 vol-of-vol 用日已实现波动的标准差除以均值),所以除以同窗口均值的绝对值;另外 q25(Ret) 被 tick 量化(不同值占比
    0.4955),变体按真实价格 P 的十分位做 z 分数去掉格点粗细,或先对自己的 60 日历史做 z 分数再取 5 日标准差。数学:除数 |ts_mean(q25(Ret),
    5)| 只在 5 天的 q25 全为 0(整段不动)时为 0,此时分子也是 0,0 / 0 得缺失而不是无穷;q25 的符号几乎总为负,只有强趋势日才为正,符号混杂的窗口里均值可能接近
    0、变异系数取很大的值,但那只影响截面两端的排名,不会产生无穷;分桶 z 分数的分母是桶内标准差。
