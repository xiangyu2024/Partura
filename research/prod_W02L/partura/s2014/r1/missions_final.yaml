    signedpower 比原 head 好 0.20(−1.02),与 40 日窗口合并试 40 / 60。另外读内核:cs_sum(signedpower(q25(Low)))
    是全市场的当日常数(后复权价的平方和,平方放大,由后复权价最高的少数几只票支配);cross_regbeta(x, y, 10) 是 y 对 x 的 10
    日回归斜率 cov(x, y) / var(x),y = 收盘分钟成交额 day_last(Amt),x 对所有股票是同一条序列,所以不同股票的 beta
    只差 cov(x, y),随收盘分钟成交额的幅度同比例放大;算子 log 取 |beta|,符号被丢掉;于是整个 head 读的主要是「最近一段时间收盘分钟成交额的峰值幅度」,接近流动性水平。一个变体把
    beta 换成相关系数 cross_corr(无量纲,只留与全市场序列的同步性),检验承重的是幅度还是同步。数学:窗口 60 / 120 的 ts_max
    / cross_max 只取已有值;cross_corr 的分母含 1e-9,日成交额量级下影响可忽略;beta 的方差阈值 EPS 与原 head 相同;log
    的缺失线 1e-9 远小于 beta 的量级(0.01 ~ 1)。
  variants:
  - ts_max(log(cross_regbeta(cs_sum(signedpower(day_quantile_q25(Low))), day_last(Amt),
    10)), 60)
  - cross_max(log(cross_regbeta(cs_sum(signedpower(day_quantile_q25(Low))), day_last(Amt),
    10)), 120)
  - ts_max(log(cross_regbeta(cs_sum(day_quantile_q25(Low)), day_last(Amt), 10)), 40)
  - ts_max(log(cross_regbeta(cs_sum(day_quantile_q25(Low)), day_last(Amt), 10)), 60)
  - ts_max(cross_corr(cs_sum(signedpower(day_quantile_q25(Low))), day_last(Amt), 10),
    40)
