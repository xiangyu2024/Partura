  hypothesis: '机制:核心 day_quantile_q25(High) 是一天里分钟最高价的 25% 分位。引擎里 Open / High / Low
    / Close / Vwap 是后复权价(规则 §4;AlphaCube docs/design.md §11.5 实测:Close / (Amt / Volume)
    跨股票 2.5 ~ 113,每只票内部变异系数只有 1% ~ 2%,所以是一只票一个的复权因子)。所以核心 = 后复权价格水平 adjP = 未复权价 P
    × 累计复权因子 F × 每只票的基期常数 c(F 从基期起累乘每一次分红与送转股;t 日的 F 只含 t 日及以前的事件,没有前视;c 是供应商基期带来的个股常数)。

    批里的现象正是这个量:含 q25(High) / q25(Vwap) 的成员(连同 add、signedpower 的包装)训练段 rank IC 约 −0.011、日换手
    0.0137、库口径夏普 0.524,逐条对照 members.csv 几乎逐位相同,是同一张价格水平面板的拷贝;新尺子下含 q25(High) 的 7 条候选均值
    −3.38(不含的 −2.66,p 0.89)。后复权价格水平把「真实价格 P」「分红送转累计 F」「基期常数 c」和「上市以来的累计收益」混在一起,新尺子只去掉对
    5 个控制和两个冠军的暴露,混合体没有分。

    只有日频叶子能把它拆开:LogFloatCap − LogFloatShares = log(流通市值 / 流通股本) = log P(未复权价;股本单位只差一个常数,不改变排序)。两个库
    5583 条表达式没有一条读过六个日频叶子(逐条核对 members.csv 的 expression 与 leaves 列:LogFloatCap、LogTotalCap、LogFloatShares、LimitWidth、BoardCode、ListAge
    的出现次数都是 0),所以库、也就是两个冠军,摸不到 P,也摸不到 adjP / P。

    本轮三条假设,每条的每个种子都原样含核心:

    (a) 水平 log F + log c = log(核心) − log P:慢变的个股属性,主要是上市以来分红与送转的累积强度。两个渠道:现金分红(价值
    / 质量 / 红利,Fama-French 1988)与送转股(小盘成长、题材炒作);Lintner(1956)的分红黏性说明派现习惯长期不变。符号由训练段定,所以两个渠道谁占优不需要事先知道;同规模、同价格十分位内标准化的版本用来分辨它是不是规模
    / 价格的代理。

    (b) 变化:log F 的 120 / 241 日增量(先用 20 日均值压掉单日噪声)≈ 过去半年 / 一年的分红加送转强度,在除权日跳变,是动态量,接近「滚动股息率」,不含常数
    c,也不依赖上市年龄。

    (c) 总收益动量:核心的对数的 120 / 241 日变化(241 日版减去最近 20 日,跳过最近一个月)是后复权价算出来的 6 ~ 12 个月累计收益。新尺子只控制
    20 日反转,更长的动量没有被控制(Jegadeesh-Titman 1993);A 股的方向由训练段定。

    算子怎样实现:sub(log(核心), sub(LogFloatCap, LogFloatShares)) 得 log F + log c;cross_mean
    做平滑、cross_delta 做增量;cs_bucket_zscore / cs_bucket_rank / cs_bucket_demean / cs_regres
    做同规模、同真实价格的分桶中性;cs_bucket_rank(核心, P) 与 cs_bucket_rank(P, 核心) 是不做减法的另一种写法(P 同桶里
    adjP 的排名、adjP 同桶里 P 的排名),用来核对减法实现;sub(·, sub(LogTotalCap, LogFloatCap)) 把非流通股比例加进来做交互。

    为什么和已见的外围不同:快照里含核心的候选(ts_std / ts_stddev / ts_med / cross_autocorr_s1 / cross_quantile_q50
    / signedpower / cs_scale 套 ts_delta 的链 / add(核心, day_close(Ret)))全是只用一个价格叶子的时间序列变换,没有一个读日频叶子,也没有一个把价格拆成两部分;外围算子集合(sub
    两个 log、LogFloatCap、LogFloatShares、cross_delta、cs_bucket_*)与它们完全不交。

    为什么样本外还会在:(a)(b)(c)都是慢变量,价格水平面板的库口径日换手只有 0.0137,15 bp 成本吃不掉;(a)(b)的来源是公司的派现与送转习惯(黏性,Lintner
    1956)和上市以来的送转历史,是持久的个股属性,不依赖某段行情;(c)窗口 ≥ 120 日,换手也低。风险也要写明:(a)的水平里含个股常数 c,样本内可能只是风格(年龄、规模、板块)的代理;train
    与 valid 的符号若不一致,score = min(train, valid) 本来就会给负分,所以这个风险由尺子自己挡。

    数学检查:log 的输入是正的价格,算子 log 对 |x| ≤ 1e-9 返回缺失,价格远大于它;LogFloatCap、LogFloatShares 在
    float32 下的绝对误差约 1e-6,而 F 的动态部分在 1e-2 以上,不被淹没;没有除以近零的量(分桶的 z 分数分母是桶内标准差);没有用到 t
    日收盘之后才知道的数,后复权因子只累积到 t 日。面板:log F 对从未分红 / 次新的股票接近 0,但并列只在噪声量级,不是常数面板;停牌日一切为空;cross_delta
    的 241 日窗口使前 241 个交易日为空,与 head 2 里 cross_fangzheng(·, 241) 的窗口同量级,不是热身期主导。已知限制:流通股本更新若滞后于价格,送转日前后会有几天的
    log P 偏差,所以(b)先做 20 日均值。'
