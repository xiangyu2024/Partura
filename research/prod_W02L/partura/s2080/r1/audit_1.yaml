    reasons: '核心 day_q_stat_std(Volume) 是快照 head 2 ts_quantile_q75(ts_kurt(day_q_stat_std(Volume), 50), 50) 的子树，属设计如此，不作创新度低的理由。核心与 5 个控制的 |ρ| 为 liq 0.47、vol 0.23、rev 0.21、known 0.47、size 0.18，全部低于 0.8 的 E 位门槛；与 head 原始 |ρ| 0.32，残差 0.23。外围的 12 个种子与 3 个 head 的原始 |ρ| 全部 ≤ 0.50（最高 seed 9 对 ts_kurt head 为 0.50），未触发 0.7 的库禁令；外围用 cross_zscore（个股自比）、cross_corr / cross_regbeta（60 或 120 日滚动协动）与读数差，不是 head 的 ts_quantile / ts_kurt 单窗口分布统计，度量的是 head 没有的东西，因此创新度给 4。数学核对：day_q_stat_std 是 Ljung-Box 累积 Q 序列在滞后 1..20 上的标准差（operators/dt_day.py:397），ρ 为归一化量，对成交量水平尺度不变，与假设里“Q 统计量的标准化读数”描述基本一致（严格说是跨滞后的标准差，假设文字略粗）；cross_zscore、cross_corr、cross_regbeta 的窗口 40 到 120 日，热身不主导；全部只用 t 日及以前的数据，无 cross_shift / ts_shift；无 nt_* 与 ts_spearman。种子 1、3、12 与成交量水平类控制的 |ρ| ≤ 0.05，是这一位最干净的部分。种子 4、5、6、9 与 liq / known 族的残差相关在 0.27 到 0.77 之间，被控制吃掉的风险最高；种子 9（sub(cross_mean(core,20), cross_mean(ar1 Volume,20))）的 liq 0.77、known 0.77 最接近 0.8 自动划掉线，但未达线，且它与 seed 对 head 的 0.50 不是重复，不划。种子 12 中 sign(cross_mean(day_sum(Ret),20)) 只是方向门控，不是数学问题。无种子被划掉。如果它有 alpha，最可能来自成交量序列的聚集结构（拆单、分批执行）随个股自身历史的变化，而不是成交量水平或已知成交额族。'
