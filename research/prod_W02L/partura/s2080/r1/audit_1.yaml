    reasons: '机制：两个日度微观结构读数（day_ar1_coefficient(Ret)、day_ar1_coefficient(Volume)）的长窗口滚动协动，灵感来自快照 head 3 的 ar1 结构，但 head 3 的 ar1 作用在 nt_ts_scale(in_topk_masked_p5(Low, Vwap)) 上，且外围是 ts_quantile_q75，与这里的两两滚动协动不同。种子 1 对 head 3 的原始 |ρ| 0.09，残差 0.12，与 liq 0.03、known 0.02，属于新的读数协动，创新度给 4。算子核对：day_ar1_coefficient 是 OLS 的 phi（dt_day.py:367），对常数日返回 NaN（不是 0，假设文字写的是“0 或缺失”，略有出入，但只影响少数票）；cross_corr / cross_regbeta 为日轴滚动（dt_cross.py:193、299）；无前视，无 nt_* 与 ts_spearman，窗口最长 120 日。逐个种子：种子 1、2、3、8 是同一骨架（ar1 Ret 与 ar1 Volume 的滚动协动）的窗口或回归方向变体，互相只差窗口，不算重复，保留，留给 GP 调窗口；种子 4（ar1 Ret 与 q_stat_std Volume）与 slot a 的核心有共同读数，但外围不同，保留；种子 5（day_durbin_watson(Vwap)）需要说明：dt_day.py:304 的 DW 是 Σ(Δx)² 除以 Σx²，对价格水平的结果主要是已实现波动相对价格水平平方的缩放（lab 笔记里“DW on a price level is realized variance”），不是假设里写的序列相关；它不是数学问题（非系统性算不出、结果也不由热身或缺失填充决定），因此放行，但它的机制描述与实际度量不一致，应按已实现波动的价格缩放去理解，size 控制 |ρ| 0.09 与之吻合。种子 9 的 liq 0.63、known 0.67，接近流动性 / 已知族，属于最可能被控制吃掉的一条，未达 0.8 线，不划。种子 10 cross_corr(day_open(Ret), day_ar1_coefficient(Volume), 60) 的 pipeline 结果为 distinct 0.0、gate false、三个 head 的 max_head 与残差都是 NaN 或 0，即输出退化为常数，是数值伪影 / 定义坏掉（day_open 是 day_first，取当天首个非缺失分钟的收益，这里整段输出没有变化），划掉。划掉后剩 9 个种子，≥ 4，通过。如果它有 alpha，最可能来自两个微观结构读数的长窗口协动（订单流持续性与价格反弹的对照），而不是 head 3 那一类 ar1 对价格水平的结构。'
