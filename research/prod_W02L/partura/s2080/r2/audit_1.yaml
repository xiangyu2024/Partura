    novelty: 3
    soundness: 4
    struck_seeds: [1, 12]
    reasons: '核心 C = ts_cov(cs_normalize(day_mean(Volume)), day_close(High), 50) 是快照 head 3（ts_std(ts_cov(ts_std(ts_cov(cs_normalize(day_mean(Volume)), ...)))) 的最内层子树，属设计如此，不作为创新度低的理由。相关度表：核心与 head 3 的原始 |ρ| 为 0.47，残差 0.27；与控制 liq 0.52、vol 0.25、rev 0.09、known 0.54、size 0.26，全部低于 0.8 的 E 位门槛，但 liq 与 known 族都在 0.5 以上，说明 C 有相当一部分是成交量水平的读数，这是这一位要防的风险。逐个种子：种子 1 与核心是同一个表达式，属重复，划掉。种子 12 cross_rank(cross_ema(C,20),60) 的流水线门槛为 False、distinct 0.03（放行的种子都在 0.34 以上），截面几乎只剩约 60 个离散档，属数值伪影；同时 cross_rank 经 nanrank_last，当天值缺失时返回 0 而不是缺失（common.py:529-541），停牌票会被推到最低，按规则 4 划掉。其余 10 个种子：种子 2、5、8 是 C 的截面或时间 z 化；种子 3、4、6 是 C 的平滑与水平差，其中种子 6 与 head 3 的原始 |ρ| 0.61 最高，未达 0.7 自动划线；种子 7 是 cross_regbeta(C, EMA5(C), 60)，即 EMA 对 C 的 60 日 OLS 斜率，分母是 C 的 60 日方差（common.py:661-663 有 EPS 保护），度量的是 C 的日间粗糙度，与 head 只有 0.07；种子 9、10、11 分别是 C 与另一个 ts_cov 的差、与截面化日收益的 60 日相关、按自身 20 日收益符号门控。创新度给 3：外围大多是对同一条 C 序列的平滑或水平度量，与 head 3 的 ts_std 嵌套（它读的是协方差的波动）不同，但核心本身与 liq、known 族的 |ρ| 在 0.5 以上，不能算真正新的东西。合理度给 4：day_close(High) 是后复权价格水平，按规则 4 不算问题；cs_normalize 与 ts_cov 都是日轴，无 cross_shift、ts_shift、in_local_mean，无 nt_* 与 ts_spearman，最长窗口 120 日，机制（放量与价格同向协动）说得通。如果它有 alpha，最可能来自量价同向协动的慢变参与者构成（趋势追随与流动性提供），也可能只是成交量水平加价格水平的代理。'
  - slot: b
