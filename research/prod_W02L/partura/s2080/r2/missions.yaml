  hypothesis: '机制:核心 C = ts_cov(cs_normalize(day_mean(Volume)), day_close(High), 50),即每只票「当日截面标准化的日均分钟成交量」与「收盘时的日内最高价(后复权价格水平)」在 50 日窗口内的协方差,读的是:放量日是否伴随价格抬升(量价同向的趋势确认,Llorente et al. 2002 的量与收益自相关思路:知情驱动的放量带来延续,流动性驱动的放量带来反转)。依据:本批富集表里含 day_mean(Volume) / C 的 5 个候选均值差 +1.18(p 0.002),是本批最显著的子树;C 的整体 head(第三个,深度嵌套的 ts_std/ts_cov 自我重复写法)只有 -0.90(train -0.68,valid -0.90),sufficiency 与 knockout 说明重复嵌套只是把同一个协方差反复取 ts_std,没有增加信息,而且换手高。本轮要试的外围与已见过的写法完全不同:不再反复套 ts_std/ts_cov,而是(a) 把协方差换成无量纲的滚动相关 / 回归斜率(cross_corr、cross_regbeta、cross_zscore),去掉 C 里价格水平的尺度(价格水平大的票协方差更大,是 C 与 LogFloatCap、价格水平类控制相关的来源);(b) 用个股自己的历史做参照(C 减去自己 120 日均值再除以其波动),读相对自己常态的量价协动变化;(c) 先对 C 做 cross_ema 平滑降换手,再做截面标准化。为什么和库里不同:库里含 C 的候选外围算子是 ts_std / ts_cov 的自嵌套,这里的外围是 cross_corr / cross_regbeta / cross_zscore / cross_ema / sub / div,是另一个算子集合,骨架由 c06_check 与库禁令把关。为什么样本外还会在:量价同向协动是参与者构成(趋势追随 vs 流动性提供)的慢变属性,50 日窗口加平滑后换手低,15 bp 下不被成本吃掉;失败方式是被已知成交额族 / 流动性控制吃掉,或价格水平残余使其成为变相的价格因子。数学检查:day_close(High) 是后复权价格水平,在股票间的排序≈累计收益(规则 §4 明确不算问题);cs_normalize 对近常数截面有保护;全部只用 t 日及以前数据,无前视;最长窗口 120+50 日,热身期不主导。'
