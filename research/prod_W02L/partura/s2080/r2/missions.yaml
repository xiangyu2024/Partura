- type: N
  hypothesis: '机制:「日内成交的时间分布」加「净买入压力」的慢变量。day_signed_ratio(Ret, Amt) = 当日成交额中上涨分钟占比减下跌分钟占比,是不需要逐笔数据的净买入压力代理(类似 Chordia-Subrahmanyam 订单不平衡对未来收益的预测);day_centroid(Amt) = 当日成交额在分钟轴上的重心(0 开盘 ~ 1 收盘),读的是「钱什么时候成交」:尾盘集中是机构按 VWAP / 收盘价执行或知情者等到收盘,早盘集中是消息驱动的脉冲(Heston-Korajczyk-Sadka 2010 的日内周期性)。把两者放在 40-120 日的滚动协动里:cross_corr(day_signed_ratio(Ret,Amt), day_centroid(Amt), 60) 读的是「买压是否集中在尾盘」—— 尾盘买压持续的票是被慢速大资金(机构)吸筹,单日读数很吵,所以窗口长、换手低。启发来自本批:head 的写法全是价格水平或单一读数的分布统计(ts_quantile / ts_kurt),本批没有任何一个 head 用到「分钟轴上的位置」或「成交额按涨跌分解」;成交量类子树(day_mean(Volume) +1.18)富集说明成交行为里有信息,而 day_q_stat_std(Volume) 在上一轮外围换过之后仍是负分,问题可能在核心本身只读分布形状、不读时间与方向,这里换成时间与方向两个新维度。算子怎样实现:day_signed_ratio、day_centroid、day_gini 是 ops_ext 里的日度算子,外面套 cross_mean / cross_zscore / cross_corr / cross_regbeta / cross_ema,个股自比写法(近 20 日均值减 120 日均值)去掉水平。为什么和库里不同:库里的 5583 条表达式里没有这两个算子的骨架(c06_check 与 GP 库禁令核对),也不是任何控制(流动性控制是成交额水平,不含方向与时间)。为什么样本外还会在:参与者构成(机构慢速执行)是慢变属性,相对自己历史的变化读数不依赖市场风格;符号由奖励选。最可能的失败:被 20 日反转控制吃掉(signed_ratio 与近期收益同向),所以种子里加入了对收益的残差化写法与对自己历史的差。数学检查:day_signed_ratio 分母是成交额合计,停牌日无定义(缺失);day_centroid 的 tot>0 保护;day_corr 一类在常数日返回 0 的问题这里不用日内相关,而是日度读数之间的滚动相关,有效对不足时返回 0 只影响新股;无前视(无 cross_shift / ts_shift);最长窗口 120 日。'
