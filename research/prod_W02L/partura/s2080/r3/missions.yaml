  hypothesis: 机制:核心 C1 = cross_regbeta(day_q_stat_std(Volume), day_ar1_coefficient(Ret), 40),即 40 日滚动里「分钟收益一阶自相关」对「分钟成交量成团程度(Q 统计量)」的回归斜率:成交成团的日子里价格是延续(知情拆单,正斜率)还是反弹(做市商库存回补 / 买卖价差反弹,负斜率),是订单流持续性的慢变读数(Hasbrouck 式冲击持续性)。依据:本批富集表里含 C1 的 8 个候选均值差 +1.09(p 0.002)、含 / 不含 -1.26 / -2.36,是批内最显著的两变量结构,且是此前没作过核心的(第 1 轮 E 是 day_q_stat_std(Volume) 单量,第 2 轮 E 是 ts_cov 量价核心)。快照里含 C1 的外围只有:直接用、cs_winsor 包一层、cross_delay 滞后 60 日(N 位 Pr1b);没有一个外围读它的变化或离散度。本轮外围换成对 C1 序列本身的二阶读法:(a) ts_std(C1, 25/60),即持续性本身的不稳定度(本库 head 的共同外围正是 ts_std / ts_var 这类对慢变量取波动,但都套在价格或成交额上,从没套在订单流持续性上);(b) C1 减自己 120 日均值 / ts_rank / 减 20 日前的值,即相对自己常态的持续性变化,去掉让水平控制起作用的持久截面差;(c) 极差、偏度、绝对偏离,读持续性的极端程度而非方向。为什么和库里不同:这些外围算子是 ts_std / ts_rank / ts_skew / ts_max-ts_min / ts_delay 与 sub / div,与 Pr1b 的 cs_winsor / cross_delay 外围、与库里 ts_quantile / ts_kurt 外围都不是同一个算子集合,骨架由 c06_check 与库禁令把关;读的东西(持续性的离散度与变化)也不是水平。为什么样本外还会在:订单流持续性由参与者构成(算法执行 vs 零散散户)决定,是慢变属性,40 日窗口外再加 25-120 日的二阶窗口,换手低,15 bp 下不被吃掉;符号由奖励选。最可能的失败:Q 统计量近常数(停牌、零成交日)时回归斜率被噪声主导,或与波动控制相关。数学检查:cross_regbeta 有效对不足时只影响新股与停牌多的票,可交易掩码已排除;ts_std 25 之后热身期约 65 日,不主导;全部只用 t 日及以前数据,无前视(无 cross_shift / ts_shift / in_local_mean);不含 ts_spearman 与 nt_*。
