- type: N
  hypothesis: 机制:名义股价(不复权的流通价格水平)。日频字段 LogFloatCap 减 LogFloatShares = log(流通市值/流通股数) = log 名义价格。控制里有 LogFloatCap(及其平方立方),但同一市值内名义价格差别很大:低价股偏彩票偏好、散户占比高,高价股偏机构;A 股的低价效应(名义价格错觉,Birru-Wang 2016:投资者把低名义价格股看作更有上行空间)独立于市值。算子实现:sub(LogFloatCap, LogFloatShares) 直接得名义价格水平;cs_bucket_rank(·, LogFloatCap) 给同一市值十分位内的名义价格排名,即对市值中性的名义价格,避开控制;再做相互作用:名义价格 x 近 20 日最大日内收益(彩票需求)、名义价格桶内的近期收益 / 成交额排名,读低价股里哪些在被追。启发于本批:共性表里最显著的单项之一是 cs_robust_z(LogFloatShares)(20 个候选,含 / 不含 -1.49 / -2.39,均值差 +0.89,p 0.000),说明股数这个静态量在本批最有信息,而它与市值控制并不重合;本流此前 4 个任务位没有一个用过日频字段叶子。为什么和库里不同:库里 5583 条表达式几乎都是分钟聚合,名义价格(两字段之差)作为核心结构未出现过,骨架由 c06_check 与库禁令核对;不等于任何控制(流动性 = 成交额水平,市值 = LogFloatCap 本身)。为什么样本外还会在:名义价格静态、换手近零,低价偏好是行为偏差、散户占比不变,15 bp 下几乎无成本;最可能的失败:仙股 / ST 股的风险使其被波动或流动性控制吃掉,或市值非线性暴露残余。数学检查:两个字段是日频,停牌日也有值,无热身缺失;差是 log 比,无除近零;cs_robust_z 的 MAD 非零;无前视;不含 ts_spearman 与 nt_*。
