    struck_seeds: [4]
    reasons: '相关度表(corr_1.md / corr_1.json):核心 C1 = cross_regbeta(day_q_stat_std(Volume), day_ar1_coefficient(Ret), 40) 的原始 |ρ| 与快照 head 最大 0.28(最像 ts_std(cross_stddev(ts_std(day_cov(cross_quantile_q75(Low,241),Amt),30),60),10) 那条),残差 0.14;对控制 liq 0.38 / vol 0.24 / rev 0.01 / known 0.38 / size 0.08,全部 < 0.8,E 位核心检查通过;核心在 loc.md 共性表第 4 行(均值差 +1.09,p 0.002),有出处。创新度 4:快照 head 里含 Q 统计量的只有 ts_quantile_q75(ts_kurt(day_q_stat_std(Volume),50),50) 一类单窗口分布统计,没有一条含 day_ar1_coefficient(Ret) 与 Q 的回归斜率;C1 把成交量成团程度与分钟收益一阶自相关放进同一个 40 日回归,度量的是 head 没有的东西,不是控制的换写法(控制 known 的 |ρ| 0.38)。合理度 4:逐个算子核对。day_q_stat_std 是分钟量 Ljung-Box Q 序列的标准差(dt_day.py:397);day_ar1_coefficient 是每日分钟收益 AR(1) 的 OLS 系数(dt_day.py:367),方差低于 1e-8 时返回缺失,只影响近乎冻结的日子;cross_regbeta(x,y,40) = rolling_ols(x,y) 的 beta(dt_cross.py:299),按规则是用 y 对 x 回归,这里是 AR(1) 对 Q 的斜率,与 idea 的写法一致;外围用的 ts_std / ts_mean / ts_max / ts_min / ts_skew / ts_delay / cross_zscore / sign / abs_ 都只用 t 日及以前的窗口或滞后,无 cross_shift、ts_shift、in_local_mean,无前视;热身期最长约 65 日,不主导。已知的小问题:div 是裸除法(common.py:175,无保护),seed 6 的 div(C1, ts_std(C1,60)) 在 ts_std 接近 0 时会在截面尾部制造噪声,但奖励先做截面排名,影响限于尾部,放行。12 个种子中,第 4 号 ts_rank(C1,120) 划掉:这是数学问题,ts_rank 走 nanrank_last,C1 缺失日返回 0 而非缺失(规则 §4),停牌与缺失的票会被系统性地压到窗口最底;corr 表里它的 distinct 只有 0.08(几乎是常数面板),gate 也已把它标为废品。其余 11 个放行。1 号 ts_std(C1,25) 与 7 号 cross_zscore(ts_std(C1,20),120) 近似但窗口不同且后者做了时间序列 z 化,不是同一个信号,不划。3 号与 11 号 abs_ 不是单调变换,不是重复。如果它有 alpha,最可能来自:订单流持续性由参与者构成(算法执行 vs 零散散户)决定,40 日内成团程度变化时持续性同向变动;载体最可能是持续性的离散度与相对自身常态的变化(3、5、10、11 号),而不是水平。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [2]
    reasons: '相关度表:seed 6(vol 0.83)与 seed 9(liq 0.94、known 0.94)已满足自动划掉规则(控制 |ρ| ≥ 0.8),表自动划掉,这里不重复计入。创新度 4:快照 9 个 head 与 5 个控制里没有任何一个用到日频字段叶子 LogFloatCap / LogFloatShares,控制里 size 只有 LogFloatCap 本身。名义价格(log 流通市值 - log 流通股数)是不复权的价格水平,而库里的价格类叶子 Low / High / Close 是后复权价格,按规则 §4 后复权排序约等于累计收益,二者不是同一个东西。seed 1 的原始 |ρ| 与 head 最大 0.38(最像 ts_std(cross_stddev(ts_std(day_cov(cross_quantile_q75(Low,241),Amt),30),60),10)),两者都含价格水平,但这是 Low 的后复权水平与名义水平的部分重叠,不是换写法;seed 1 的 size 控制 |ρ| 0.002,与市值基本正交。合理度 4:逐个核对。sub(LogFloatCap,LogFloatShares) = log(流通市值/流通股数),字段定义见 dailyfields.py,由 scripts/build_daily_fields.py 从厂商的流通市值列与流通股数列建成(股数不从市值/收盘价合成,见构建脚本第 6 步注释),所以它等于名义价格的前提是厂商市值与股数同一口径、同一日期,这一点是要核对的前提,不是数学错误。cs_bucket_rank(y,x) 按 x 的十分位做 y 的组内百分位排名(ops_ext.py:239),cs_robust_z 的 MAD 非零保护(ops_ext.py:500),cross_zscore 有近常数保护(ops_ext.py:208),都按定义。机制(名义价格错觉 / 彩票偏好,Birru-Wang 2016 一类)说得通,与库里没有的价格水平结构对应。seed 2 划掉:cross_zscore(log 名义价格, 60) 与 20 日反转控制的 |ρ| 是 0.75。名义价格只在股数不变时随价格变动,股数在季报与送转时才跳变,所以它的时间序列几乎就是 60 日累计收益,是 20 日反转控制换了窗口的写法,度量的是同一个东西(规则 §3 的"重复")。seed 4 也含时间偏离(log 价格减其 120 日均值),rev |ρ| 0.55,有一部分换皮但低于 0.7,保留,它只保留了价格的长期截面水平。seed 10 的 rev |ρ| 0.74 最接近 0.8,但它是价格十分位内的 20 日反转排名,价格中性化是新信息,保留。seed 1 的 distinct 为 0.691,远低于其他种子(1.0),需要核查是否某些股数或市值缺失日被同值填充;这不是挡的理由,只是 PI 下一轮要核对的一点。其余放行。如果它有 alpha,最可能来自:低名义价格股的彩票偏好与散户占比,这是 size 控制吃不掉的截面水平分量;其次是价格桶内的反转,即在价格高低不同的票之间,同样的日收益对后续收益的反应不同。'
R:
  - head: 'ts_std(neg(neg(cross_sum(ts_sum(day_var(pow_2_5(pow_2_5(Ret))), 10), 241))), 25)'
    soundness: 3
    reasons: '机制说得通:neg(neg()) 确是空操作;pow_2_5 只保留上涨分钟(负数幂返回缺失,dt 规则 §4 已记为事实);PI 想换成保号的 signedpower(Ret,2.5) 实现的是他想要的东西,变体 1 的算子组合也确实如此。但 PI 漏掉了一个数值问题,这是 R 组合理度给 3 而不是 4 的原因:算子链 pow_2_5(pow_2_5(Ret)) 得到的是分钟收益的 6.25 次幂,day_var 内部是 _stddev 的 x 减均值再平方再开方,再平方(common.py:406-408、dt_day.py:117),面板是 float32(store.py)。我用 float32 模拟了这条链(scratch/f32_check.py):分钟收益标准差约 2e-4 时 day_var 进入亚正规数区间,约 1e-4 时精确为 0。也就是说,高价、低波、分钟收益是 tick 级的票,其 head 值会被截断或并列,这是 §4 的浮点下溢。我不能在没有截面数据的情况下断定它主导了排序,所以不给 1 分;PI 下一轮应先量一下 day_var 为 0 或亚正规的截面比例。变体里 1 号 signedpower(Ret,2.5) 与 2 号 pow_2_5(Ret) 去掉了双重幂,数值上没有这个问题;3、4、6、8 号仍保留双重幂,会继承同样的下溢;5 号与 7 号已被表格的 gate 划为废品。原 head 的 score 是 train -0.37 / valid +0.56,符号相反,与此是否有关需要 PI 在 2026 年以外的段内核对,这里不据此下结论。如果它有 alpha,最可能来自:上涨分钟中极端幅度的持续性(高次幂放大最大的几根上涨分钟),而不是下行信息。'
summary: 'a 通过(新颖 4 / 合理 4,划掉 4 号;4 号也被表格 gate 划为废品,余 11 个);b 通过(新颖 4 / 合理 4,划掉 2 号,表格自动划掉 6、9 号,余 7 个);R 合理度 3(双重幂的 float32 下溢未被 PI 说明,变体 1、2 已规避)。'
