- type: N
  hypothesis: '机制:成交在一天里「什么时候来、来得多规律」是参与者构成的指纹,它在日与日之间的稳定性是一个与水平无关的状态变量。批里的现象:ts_hurst(尾盘成交量
    / 价, 20) 出现在 30 个已评分候选的 19 个里,拆掉它比拆掉任何别的部件损失都大(head 1 必要性 +0.64、head 3 +0.28),而
    B 本身(−1.55)比 Hurst 之后(−1.29)差;R/S Hurst 对序列的正倍数与平移不变,所以它把「水平」(正是 5 个控制和两个冠军吃掉的东西)扔掉了,只留路径的形态。新想法:把「路径的稳定
    / 持续程度」这个尺度不变的读法用到库里从没读过它的「成交时点」序列上。机构算法(VWAP / TWAP / 收盘执行)与指数、ETF 申赎让一只股票的日内成交分布在日与日之间很稳定,散户与消息驱动的票则每天重心乱跳;前者是机构持仓厚、关注度稳定的票,后者是被注意力和彩票偏好驱动的票,预期收益差在于「注意力溢价被透支」。库里有
    148 处 ts_hurst,作用对象几乎全是尾盘量比(div(day_last(Volume), ·))及其嵌套,另有开盘价路径等零星几种;day_centroid(成交时点重心)两个库里出现
    0 次,开盘 / 尾盘成交份额、隔夜缺口路径也没有被读过持续性或稳定性(W01 把 day_centroid 的「水平」当过 alpha 来源,别的流已出的
    head 会把水平一族封掉;持续性 / 稳定性是另一个对象)。

    算子怎样实现:一半种子用 Hurst(沿用批里的统计量),另一半是不含 Hurst 的兄弟:同样的输入序列,换成最直接的稳定性读数 ts_std(跨日离散度)与
    ts_autocorr_s1(跨日一阶自相关)。输入序列:(a) 成交时点 day_centroid(Amt) / day_centroid(Volume),以及成交额重心与价格波动重心之差
    sub(day_centroid(Amt), day_centroid(Ret))(day_centroid(Ret) 取 |Ret|,第一分钟含隔夜缺口,所以它是「缺口日
    vs 盘中波动日」的指标);(b) 开盘 / 尾盘成交份额 div(day_first(Volume), day_sum(Volume)) 与 div(day_last(Volume),
    day_sum(Volume)) 的路径,以及开盘与收盘规律性之差;(c) 隔夜缺口 day_open(Ret)(批里共性表有 day_open(Ret),含它的
    5 个候选 +0.16)的 Hurst 与一阶自相关(缺口的方向是否连续);(d) 处理:对自己 60 日历史做 cross_zscore(持续性的变化而不是水平)、在已知成交额族十档内
    / 流通市值十档内 z 分数(检验信号是不是已知族或规模的代理)。含 Hurst 的种子与不含 Hurst 的兄弟种子读同一个假设,分数差就是「R/S 这个统计量(以及它对缺失窗口的行为)」的贡献。

    为什么和已有的不同:骨架已逐个对照两个库(都不在库里);被读的输入序列全是新的,而且有界(重心在 [0,1]、份额在 [0,1]),与水平量不同。Hurst
    对尺度与平移不变,ts_std 读的是重心的跨日离散度、ts_autocorr_s1 是去均值的相关,所以它们与 5 个控制(流动性、波动、反转、已知成交额族、市值)的水平暴露在构造上就小;与三个
    head(尾盘量比的 Hurst × 水平)的关系是「同一个统计量、不同的输入序列」,预计秩相关低。

    为什么样本外还会在:来源是参与者结构(机构执行时点的规律性 vs 散户 / 消息脉冲)的慢变性质,稳定性是 30 到 60 日窗口上的结构,换手慢;不依赖某段行情的方向。风险:R/S
    在 30 日窗口上噪声大(Lo 1991),所以放了 ts_std / 自相关兄弟与 z 分数版;如果每天排名乱跳,EMA 半衰期 20 能压一部分。

    数学检查:day_centroid、份额都有界,没有近零分母;day_first(Volume) / day_sum(Volume) 在整天无量时是 0 /
    0 = NaN,不是无穷。ts_hurst 的已知行为(三个 head 与库里 148 处 ts_hurst 都一样,我用玩具张量核实过):窗口内常数时给
    NaN;窗口内有缺失日时,缺失日在最早一天 → NaN,在第二早一天 → −inf,其余位置只用缺失前的前缀算极差(H 偏低),所以「近 30 ~ 60 日内有过停牌
    / 缺失的票」会被排到最低或当缺失,是一道只作用在这些票上的筛子,不是填充,没有近零分母;这正是放 ts_std / ts_autocorr_s1 兄弟的原因(ts_std
    跳过缺失日)。ts_autocorr_s1(即 ts_corr)窗口内有效对数很少时(新上市、刚复牌的头几天)会给 0 或 ±1,只影响这几天。本位没有用
    ts_rank / cross_rank 这类会把当天缺失记成 0 的算子。day_open(Ret) 含大量 0(平开),常数窗口的 Hurst 给 NaN
    而不是 0。无前视:所有输入只用 t 日收盘前的分钟,t+1 才交易。窗口 ≤ 60,热身期不主导。'
