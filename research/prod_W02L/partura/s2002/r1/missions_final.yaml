  why: 烂部件:(1) 乘数 day_max(Volume) 是股数量级(约 1e3 ~ 1e6)的重尾量,与取值在 (0, 1.x) 的 Hurst 相乘后,排名几乎由
    day_max(Volume) 一个因子决定(拆解表:单独 day_max(Volume) −1.16,单独 Hurst −1.29,乘积 −1.18,没有
    1 + 1 > 1 的迹象),也就是水平把 Hurst 盖住了;换成取对数(压住重尾)或换成无量纲的「峰值 / 平均」比值(尖峰度,不含水平)能让 Hurst
    一半真正起作用。(2) 30 日窗口:15 日 −1.08(增益 +0.12),60 日 −1.30,所以越短越好,试 10 与 15。注意把乘数换成 Amt
    是更差的(−2.65),所以本组不动 Volume 叶子。数学上 log 在 |x| ≤ EPS 时给 NaN(不是 −inf),有成交时 log(day_max(Volume))
    为正有限;day_max(Volume) / day_mean(Volume) 的分母在有成交的天里 > 0,整天无成交时是 0 / 0 = NaN。ts_hurst
    对窗口内缺失日的行为与三个 head 完全相同(见前两组)。
  variants:
  - ts_mean(mul(day_max(Volume), ts_hurst(div(day_last(Volume), day_max(Low)), 20)),
    15)
  - ts_mean(mul(day_max(Volume), ts_hurst(div(day_last(Volume), day_max(Low)), 20)),
    10)
  - ts_mean(mul(log(day_max(Volume)), ts_hurst(div(day_last(Volume), day_max(Low)),
    20)), 15)
  - ts_mean(mul(div(day_max(Volume), day_mean(Volume)), ts_hurst(div(day_last(Volume),
    day_max(Low)), 20)), 15)
