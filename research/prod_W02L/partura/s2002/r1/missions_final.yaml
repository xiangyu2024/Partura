  hypothesis: '机制:三个 head 全带着同一个底 B = div(day_last(Volume), day_max(Low)):当天最后一根分钟线的成交量(股数;深市那一根含收盘集合竞价,沪市是最后一分钟连续竞价,也就是「尾盘成交」)除以当日分钟最低价的最大值(后复权价)。B
    的水平 ≈ log(尾盘成交股数) − log(后复权价):前一项是流动性代理,后一项是累计复权收益 / 上市年限的代理,都是 5 个控制和两个冠军的地盘,所以种子一律不读
    B 的水平。拆解表说信息在 B 的路径形态里:把 ts_hurst 拆成 B 本身,head 1 从 −0.99 掉到 −1.63(必要性 +0.64),head
    3 从 −1.20 掉到 −1.47(+0.28);含 ts_hurst(B, 20) 的 19 个候选均分 −2.07,不含的 −2.52(差 +0.44,p
    0.15);R/S Hurst 对 B 的任何正倍数和平移不变,所以读的是「尾盘成交是一个持续的状态(机构按计划收盘执行、指数 / ETF 申赎),还是随机尖峰(散户零星成交)」。本
    E 位的假设:如果这个底里有 alpha,来源是尾盘成交路径的形态、相对自己常态的变化、以及它和当天价格方向的关系,不是 Hurst 这个具体公式,也不是水平。

    算子怎样实现:每个种子原样带 B,外围换成快照里从没见过的写法(快照里围绕 B 的写法几乎全是 ts_mean(mul(·, ts_hurst(B,20)),
    20~50) 和 log(add(·, day_std(Vwap))) 的嵌套)。(1) 相对自己:cross_zscore(B,60)、ts_rank(B,60),以及短
    5 日对长 60 日的对数均值差 sub(ts_mean(log(add(B,1)),5), ts_mean(log(add(B,1)),60))(尾盘放量
    / 缩量,用对数 + 1 避免近零分母)。(2) 路径形态的别的统计量:ts_std(log(add(B,1)),40)、ts_autocorr_s1(B,40)、ts_skew(B,40)、别的视野的
    Hurst(ts_hurst(B,60)、sub(ts_hurst(B,10), ts_hurst(B,40))、变化量 ts_delta(ts_mean(ts_hurst(B,20),10),20))。(3)
    和价格方向的关系(尾盘成交是顺着当天涨跌还是逆着):ts_corr(B, day_sum(Ret), 40),以及「异常尾盘量 × 方向」ts_mean(mul(cross_zscore(B,60),
    sign(day_last(Ret))), 20) 与 sign(day_sum(Ret)) 版。(4) 诊断:深市有 3 分钟收盘集合竞价、沪市没有,所以
    B 的路径形态可能部分是交易所 / 板块的标记;cs_bucket_zscore(·, BoardCode / LimitWidth) 把它去掉(BoardCode
    只有 4 个值,并列按列序打破,所以十档近似为「板块 × 列序段」,是近似的中性化);也有按已知族十档中性的版本。无中性化的 (1)(2) 版与中性化版的分数差,就是「有多少是板块
    / 已知族标记」。

    为什么和已有的不同:骨架已逐个对照两个库的 5583 条(都不在库里)。库里围绕 B 的全是「Hurst × 水平」;没有 z 分数、时序排名、自相关、偏度、和收益的滚动相关、方向交互、也没有任何板块
    / 十档中性化。(1)(2) 里的写法与三个 head 的日度秩相关预计低(去掉了水平,且不是 Hurst 的平滑),与已知成交额族预计低于 0.5(B 的水平被拿掉了)。

    为什么样本外还会在:这些量描述的是参与者结构(机构按计划执行 vs 散户零星成交)在尾盘留下的指纹,是慢变的个股属性;所有种子都在 20 到 60 日的视野上读,名次变化慢,15
    bp 成本下不会被换手吃掉。风险:尾盘集合竞价规则本身在样本期内变过(深市 2018 年的、创业板 2020 年的),如果规则变动造成的段内断点才是信号,min(train,
    valid) 会把它挡掉。

    数学检查:B 的分子是股数 ≥ 0,分母是价格 > 0,没有近零分母;种子里的除法只有 ts_std / 对数差(对数里加 1)。ts_hurst 的已知行为(三个
    head 与库里 148 处 ts_hurst 都一样,我用玩具张量核实过):窗口内常数时给 NaN(s_d < 1e-9);窗口内有缺失日时,缺失日在最早一天
    → NaN,在第二早一天 → −inf(极差为 0 取对数),其余位置只用缺失前的前缀算极差(H 偏低),再经 ts_mean 一个 −inf 会带出整个窗口
    −inf。后果是「近 20 ~ 70 日内有过停牌 / 缺失的票」被排到最低或当缺失,是一道筛子,只作用在这些票上,其余票的次序仍由 H 的取值决定,不是填充,也没有近零分母。为了能分辨「信号」与「这道筛子」,本位放了
    11 个不含 ts_hurst 的种子(ts_std / ts_autocorr_s1 / ts_skew / z 分数,它们的滚动算子对缺失日是跳过的),含
    Hurst 的种子只有 5 个。ts_corr / ts_autocorr_s1 窗口内有效对数很少时(新上市、刚复牌的头几天)会给 0 或 ±1,只影响这几天。ts_rank
    在当天缺失时返回 0(已知的 nanrank_last 行为),所以只放 1 个 ts_rank 种子,其余用 cross_zscore(缺失给 NaN)。无前视:day_last
    / day_max 只用 t 日收盘前的分钟,t+1 才交易。所有窗口 ≤ 60,热身期不主导。'
