    reasons: '第 7 号 ts_hurst(day_open(Ret),30) 与第 16 号 ts_autocorr_s1(day_open(Ret),40) 划掉,理由是数学问题。代码里 day_open 就是 day_first 的别名(dt_day.py:139),取当天第一个非 NaN 的分钟值,不是隔夜缺口。corr_1.json 在 train/valid 上显示:第 7 号 coverage 0.0(全 NaN),第 16 号 distinct 0.0(几乎全是同一个常数),属于面板常数与算不出。PI 把它读成隔夜缺口,这个读法在面板里没有支撑。其余 14 个种子与 3 个 head 的原始 |ρ| 都在 0.23 以下(最高第 5 号 0.23、第 15 号 0.21、第 11 号 0.20),与 5 个控制的最高 |ρ| 是第 11 号的流动性 0.51 与已知族 0.45,低于 0.8,不自动划。第 9、11、13、15 号与流动性、已知族、规模有 0.3–0.5 的同向关系,是换写程度的弱相关,不是同一个量。创新度 4:输入序列 day_centroid(Amt/Volume)、份额路径、成交额重心与 |Ret| 重心之差是库里从未读过的有界量(day_centroid 在库里出现 0 次),与 head 的 |ρ| 都很低。合理度 4:机制是参与者结构(算法执行、指数与 ETF 申赎)让成交时点的跨日离散度与持续性慢变,这是可检验的论断;day_centroid(ops_ext.py:155)与描述一致(|x| 加权、[0,1]、当日总量为零时 NaN),非 Hurst 兄弟(第 9–15 号)没有 ±inf 与前缀偏置。假设中的 (c) 隔夜缺口子想法不成立,(a)(b)(d) 仍成立。风险:含 ts_hurst 的种子(第 1–6、8 号)有与任务位 a 相同的停牌前缀偏置,只能当对照,不能单独作为发现的依据;第 4、13 号的 |Ret| 重心依赖首分钟 Ret 的定义,需核实。如果它有 alpha,最可能来自成交时点的跨日离散度(第 9、13、15 号)和开盘、尾盘份额的规律性(第 11、12 号),且更可能是交易稀薄程度和成交额波动这类流动性、规模代理,而不是机构执行的时点结构;要用第 9、11 号对控制取残差后的结果来区分。'
R:
  - head: 'ts_mean(mul(log(add(mul(log(add(day_max(Volume), day_std(Vwap))), ts_hurst(div(day_last(Volume), day_max(Volume)), 20)), day_std(Vwap))), ts_hurst(div(day_last(Volume), day_max(Volume)), 20)), 50)'
    soundness: 4
    reasons: 'R1 的 6 个变体与 head 2 的原始 |ρ| 为 0.55–0.80,会进入替换判断。数学上干净:div(day_last(Amt), day_max(Amt)) 无量纲且在 (0,1] 内;log 按 |x| 取值,只有 |x| ≤ EPS 才是 NaN(common.py:211),内层 log(L·H+s) 不会因为负值变 NaN;variant 6 的 day_mean(Amt) 分母在有成交的日子大于零。控制:最高是已知族 0.36 与流动性 0.35,低于 0.5,不算同一个量。它继承了 ts_hurst 的停牌前缀偏置(窗口 20),head 2 符号为 +1,受影响的票主要被挤出多头腿,对头部的影响较小。合理度 4。如果它有 alpha,最可能来自 H 的形态与交易额水平的乘积(H·log L 这一项);水平项仍在(流动性 |ρ| 0.35),所以增益可能部分是流动性暴露换了写法,需要和控制残差一起看。'
  - head: 'ts_mean(mul(log(cs_sum(day_argmax(Vwap))), ts_hurst(div(day_last(Volume), day_max(Low)), 20)), 50)'
    soundness: 3
    reasons: 'R2 的 5 个变体:v1 只把分子换成 Amt,与 head 1 的原始 |ρ| 为 0.98,几乎是同一个东西;v2、v3 只换窗口为 25、35,与 head 1 的 |ρ| 为 0.77、0.88;v4 用 div(day_last(Amt), day_max(Amt)) 无量纲比值,与 head 1 为 0.65,是真正的新路径;v5 去掉 log(cs_sum(day_argmax(Vwap))) 后与 head 1 的原始 |ρ| 为 1.00,排名几乎不变。cs_sum(day_argmax(Vwap)) 是跨股票的同日标量(对所有票相同),只给 50 日均值的各天一个时间权重,不是「烂部件」;PI 的 −0.99 变 −1.22 是把权重波动放大到 ±5% 的反事实,而 PI 自己记的实际日间波动只有 ±0.4%,不能推出 log 项有影响。数学无问题:cs_sum 为正,守卫与 head 相同。扣分在于理由的主体建在一个不起作用的部件上:v5 是空操作,v2–v4 的效果来自窗口和分子换成额度。合理度 3。如果它有 alpha,最可能来自尾盘额或股数的 Hurst 形态(v4 的无量纲版本),而不是 cs_sum 的时间权重。'
  - head: 'ts_mean(mul(day_max(Volume), ts_hurst(div(day_last(Volume), day_max(Low)), 20)), 30)'
    soundness: 3
    reasons: 'R3 的 v1、v2 只把窗口从 30 改成 15、10,与 head 3 的原始 |ρ| 为 0.97、0.95,实质是同一个东西换窗口,没有去掉任何部件;v3 把乘数取对数,与 head 3 为 0.71;v4 把乘数换成 day_max(Volume)/day_mean(Volume)。PI 说 v4 无量纲、不含水平,corr_1.json 不支持这一点:v4 与流动性控制的 |ρ| 为 0.585、与已知族 0.48,峰值占平均的比值在薄的票上更大,它本身是交易稀薄程度的代理。v1、v2 与流动性 0.54–0.56、与已知族 0.60–0.62,v3 与流动性 0.44、与已知族 0.48,水平项仍在。所以「去水平」只在 v4 上做了,而且没做干净。数学上没有问题:day_max/day_mean 落在 [1, 240] 之间有界,守卫正常。这一组真正的风险是符号:head 3 符号为 −1,长腿取最低的一组,ts_hurst 的停牌前缀偏置让近期有缺失日的票 H 偏低,会被拉进长腿。合理度 3(不是数学问题,但部件换写与意图没有对齐,风险集中在符号 −1 上)。如果它有 alpha,最可能来自近期停牌票在 H 上的偏置与小票流动性的组合,而不是「峰值 / 平均」的形态;需要先把停牌偏置去掉再看。'
summary: 'a、b 两位通过(a 创新 4 合理 4、划 12、13;b 创新 4 合理 4、划 7、16),R1/R2/R3 合理度分别为 4/3/3,最大风险是 ts_hurst 的停牌前缀偏置(含 ts_hurst 的种子与 3 个 head 都有),以及沪市收盘集合竞价的断点需要核实。'
