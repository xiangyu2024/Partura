    reasons: '核心 B = div(day_last(Volume), day_max(Low)) 是 head 1 与 head 3 内的子树,满足 E 规定。corr_1.json:核心与 head 3 的原始 |ρ| 为 0.675(低于 0.7),与 5 个控制的 |ρ| 最高 0.257(已知族),低于 0.8;16 个种子都原样含 B。自动划掉第 12、13 号:与 head 1 的原始 |ρ| 为 0.83(≥0.7)。其余种子与 3 个 head 的原始 |ρ| 中,第 4 号 ts_autocorr_s1(B,40) 为 0.57、第 6 号 ts_hurst(B,60) 为 0.46,其余都在 0.29 以下;与控制最高 0.44(第 3 号 ts_std(log(B+1),40) 与流动性),没有种子达到 0.8。创新度 4:第 1、3、5、8–11、14、15 号是 B 的时序标准化、偏度、自相关、与当日收益的同期相关和方向交互,与三个 head 及五个控制都不是同一个量;库里围绕 B 的写法是 Hurst 乘水平。合理度 4:B 的分母是 day_max(Low) 且为正;cross_zscore(ops_ext.py:208)是自身 d 日的时序标准化,带 sd 守卫;cs_bucket_zscore 有 EPS;ts_skew、ts_corr 的数值有界;非 Hurst 种子没有 ±inf。两点风险,不构成挡的理由:(a) ts_hurst(nd_ts.py:571 起)窗口内有一天缺失时,最老一天给 NaN,次老一天给 −inf,其余位置用缺失前的前缀算极差,通常使 H 偏低;第 6、7、16 号(以及 head 的 Hurst 部分)受影响。流水线的 rank_rows 与 long_short_weights 把 ±inf 当缺失(alphacube/metrics.py:41–46 与 296 行),所以 ±inf 不进多空书,真正的影响是前缀偏置。(b) PI 说「沪市是最后一分钟连续竞价」,据我所知上交所主板 2018-08-20 起有 14:57–15:00 收盘集合竞价(深市更早);若属实,样本内有一个跨沪市的断点,BoardCode 中性化去不掉它,需核实。第 2 号 ts_rank(B,60) 的 distinct 比例 0.04 被流水线门槛(distinct ≥ 0.5,ac_plugin.py)判废,但 §4 明文不把并列由列序打破作为挡的理由,且约 200 个水平的截面不是常数,故放行,GP 中可能无效。第 9 号 sign(day_last(Ret)) 若深市收盘集合竞价那根 bar 的 Ret 为 0,则深市大部分票这一项为零,排名由并列和列序决定,是板块信号,同样只作风险。如果它有 alpha,最可能来自尾盘量相对自身历史的异常(第 1、3、11、14、15 号)以及尾盘量与当日涨跌的同向关系(第 8、9、10 号);若只在 6、7、16 号上出现,更可能是停牌后的前缀偏置。'
