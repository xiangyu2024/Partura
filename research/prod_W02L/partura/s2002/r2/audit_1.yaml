    reasons: '核心 H = ts_hurst(div(day_last(Volume), day_max(Volume)), 20) 是 head 1 的子树,满足 E 规定。corr_1.json 第 1 行:核心与 5 个控制的 |ρ| 最高 0.091(波动),与 6 个 head 的原始 |ρ| 最高 0.418(head 1),都在门槛内。15 个种子都原样含核心。自动划掉:无(原始 |ρ| 最高的是第 3 号 0.663,残差 0.691,都低于 0.7;与控制最高的是第 12 号与波动 0.312,低于 0.8)。第 1、3、4、5、6、9、14 号与 head 1 的原始 |ρ| 在 0.30–0.66,是 H 的水平类或尾部类读法(窗口与 head 1 的 ts_mean(H,25) 不同,对象相同)。其余 8 个(第 2、7、8、10、11、12、13、15 号)与所有 head 的原始 |ρ| 都在 0.23 以下、多数在 0.06 以下,读的是 H 的离散、尾部差、与同期收益的相关、滞后自相关、十档内 z 分数或开盘与收盘之差。struct/members.csv 核对:库里含该核心的 10 条都是 ts_mean 外壳,0 条带 cross_ 或 cs_ 外壳。所以外围是新的,创新度 4。合理度 3(不是 1:没有前视;没有除以近零的量,第 14 号分母已加 0.05;窗口尾随;没有禁用算子)。但有四处设计问题,读结果前必须修,否则会误读。(a) 核心前提不成立:笔记说 cs_winsor 把 −inf 夹成当日 1% 分位的有限值,但 ops_ext.py:267 是 torch.where(isfinite(x), clip(x), x),−inf 不是有限值,原样返回,所以 −inf 一个都没去掉。corr_1.json 的 coverage 列印证了这一点:对 −inf 不敏感的尾均值与 z 分数(第 6、7、11 号)覆盖率 0.985–0.987,与核心的 0.985 一致;经 nanmean(common.py:552)、nanstd_last、rolling_pair_reduce 进入整窗的第 1、2、3、4、5、8、10、12–15 号覆盖率只有 0.91–0.97。−inf 在整窗里被 nanmean 变成 −inf,而书与基准的构造(metrics.py:41 rank_rows、metrics.py:296 long_short_weights、books.py:65 long_book)都把非有限值当缺失,所以效果是把这些票排出当日的书与等权基准,不是排到最低;但它仍是「近 120 或 241 日内有过短停牌」的选择。第 9 号两侧恰好同为 −inf,sub 得 NaN 被 cross_mean 跳过,覆盖率不降,这是偶然。(b) 因此计划里「H 与筛子的分离」检验做不出结论。E 的 15 个种子和 R 的第 10 变体(两处 H 都换成 cs_winsor(H))与 head 1 的日度秩 |ρ| 为 1.00(corr_1.json 第 42 行),也就是同一本书。笔记写「若持平,H 本身承重」,这个推断不成立:持平只说明 −inf 还在。要真正分离,需要先把 −inf 变成 NaN 再做 winsor,或者改用显式的停牌计数。(c) 尾端风险(按 IEEE 算术推断,未在 torch 上实跑):若某日 −inf 的股票数达到约 1%,nanquantile 的 1% 分位落在 −inf 区间,lo 为 NaN,torch.maximum 会把当日所有有限值变成 NaN;若某个交易日全市场分钟数据缺失,s+18 日全体 H = −inf,120 日均值整段为空。请核查数据里是否有全市场缺失的交易日。(d) 核心分子是收盘那一根分钟线。round-1 审计员称沪市主板 2018-08-20 起有 14:57–15:00 收盘集合竞价(未核实),若属实则训练段内有规则断点;本轮 slot a 没有 BoardCode 或上市规则中性化(round-1 有)。另外,corr 表是每 5 个 train 日取 1 天计算的(corr_1.md 表头),属于用户允许的 shrink 做法,阈值判定可用;但第 3 号离 0.7 只差 0.04(残差只差 0.009),建议这一对用全部 train 日复算。如果它有 alpha,最可能来自尾盘集合竞价参与度的慢状态(机构或指数收盘执行的持续性);也可能只是 −inf 留下的停牌历史选择,或深沪收盘规则差异。若只在第 1、3、4、5、6、9、14 号(水平类)上出现,更像 head 1 的老问题(水平与停牌窗口),而不是 H 的动态。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: 'LT = sub(log(day_sum(Amt)), LogFloatCap) 对库是新对象:struct/members.csv 中 0 条含 LogFloatCap,0 条含 cs_rank(log(day_sum(Amt))) 形式;含 day_sum(Amt) 的 84 条都是金额与量的比,不是对数换手。corr_1.json:16 个种子与 6 个 head 的原始 |ρ| 最高 0.406(第 6 号,与 head 3),其余多在 0.31 以下;与 5 个控制的 |ρ| 最高 0.482(第 6 号与波动),低于 0.8 的自动线,也没有达到 0.5 的换写法线。自动划掉:无。创新度 4。第 6 号 sub(cross_ema(rank,10), cross_ema(rank,120)) 与流动性 0.40、波动 0.48、已知族 0.44、反转 0.23 最接近控制的换写法,但残差与 head 只有 0.168,不划。合理度 4。核对过的点:无前视(所有窗口尾随;day_last 与 day_sum 只用收盘前分钟;ret 与 cs_rank 同日,交易在 t+1)。停牌日的 LT 由引擎的 tradability 掩码变为 NaN(engine.py 文件头),不会出现 log(0) = −inf;cs_rank 默认以 isfinite 为有效掩码(common.py 的 _common_rank),所以没有 ±inf 进入排名。没有用 ts_rank 或 cross_rank,避开了 nanrank_last 把缺失记为 0 的陷阱。禁用算子没有出现。算子方向已核对:cross_regbeta(x,y,d) 是 y 对 x 的滚动斜率(dt_cross.py:299 指向 common.py:643 的 y ~ α + βx);第 11 号 y = RET、x = 滞后的 z 乘滞后 RET,是 Llorente 型系数的正确方向;第 15 号 y = LT、x = 市场均值,给的是个股对市场换手的 beta,方向正确。cross_autocorr(x,d,shift) 的参数顺序与第 16 号一致。第 1–4 号 Hurst 种子覆盖率 0.93–0.96,来自 60 或 120 日热身的 NaN,与 −inf 无关。三处要注意,都不构成挡的理由。(a) 第 1–4 号的 ts_hurst 继承前缀偏置:停牌后的 60 或 120 日窗口用缺失前的前缀算极差(nd_ts.py:571–593),这是笔记已说明的筛子;用第 5–16 号非 Hurst 兄弟做对照是合理设计,但 1–4 号与其余种子的分数差不能直接归到 H 本身。(b) 第 10 号 sub(cross_mean(rank 乘 1{ret>0},60), cross_mean(rank 乘 1{ret<0},60)) 数学上等于 (1/60) 乘 Σ rank_t 乘 sign(ret_t),不是条件均值之差,会混入上涨日的频率,也就是 20 日动量;它与 20 日反转控制的 |ρ| 为 0.340,是此处最高的控制相关。另外 is_gt 对 NaN 返回 0(common.py:248),复牌首日与上市首日的 ret 为 NaN 时 rank 乘 0 = 0 会进入均值,是一个小的 0 填充。(c) LT 的价格口径未核实。若 LogFloatCap 用收盘价计算,LT 就含 −log(VWAP / Close) 项,它与同日收益方向相关,第 7–11 号的同日收益耦合可能有一部分是这个机械项。另外 day_sum(Amt) 在缺分钟的日子是部分和(_sum 只要有一根有限值就求和),换手会系统性偏低。如果它有 alpha,最可能来自散户注意力驱动的相对换手路径:放量是累积还是脉冲(第 1–5、12–14 号),以及放量与涨跌的耦合(第 7–11 号);若只在第 1–4 号 Hurst 上出现,更像停牌后的前缀偏置。'
R:
  - head: 'ts_mean(mul(log(add(mul(log(add(day_max(Amt), day_std(Vwap))), ts_hurst(div(day_last(Volume), day_max(Volume)), 20)), day_std(Vwap))), ts_hurst(div(day_last(Volume), day_max(Volume)), 20)), 25)'
    soundness: 3
    reasons: 'R 组是 head 1 的 10 个变体:ts_mean 窗口 20 / 32 / 40;cross_ema 半衰期 12 / 24;乘数换成日均或日中位金额;去掉乘数只留 H;内外 H 窗口 10 与 40;两处 H 换成 cs_winsor(H)。第 1–7、9 号的数学成立:叶子相同,分母 day_max / day_mean / day_quantile 在有成交日为正,窗口尾随,无前视。第 8 号 log(add(H, day_std(Vwap))) 额外引入「H + std ≤ 0 时为 NaN」的条件,把 H 显著为负的票排出,这与 why 里写的「与原 head 完全相同」不一致,需要说明。第 10 号与 head 1 的日度秩 |ρ| 为 1.00(corr_1.json 第 42 行),与原 head 是同一本书:cs_winsor 没有去掉 −inf(见 slot a 的 (a)),所以它分离不出筛子与 H。why 里第 (3) 条的推断需要撤回。第 10 号本身数学上没有错,只是没有做它声称要做的事。R 组合理度 3,保留。'
summary: 'a 通过(创新 4、合理 3,无种子划掉),但 cs_winsor 不清 −inf 的前提不成立,「H 与筛子」的检验做不出结论,读结果前须修;b 通过(创新 4、合理 4,无划掉),Hurst 四条的前缀偏置与 LogFloatCap 的价格口径需核实;R 合理 3 保留,第 10 变体与 head 1 同一本书。'
