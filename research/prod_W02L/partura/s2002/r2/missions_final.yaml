  hypothesis: "机制与证据。核心 H = ts_hurst(div(day_last(Volume), day_max(Volume)), 20)(快照\
    \ head 1 的子树;head 1 是第 1 轮 R 替换后的版本,score −0.11,train −0.11 / valid −0.09,是本流目前所有评分里最好的一条)。\n\
    \n快照里的事实:(a) 拆解:把 head 1 最外层再乘的那个 H 拆掉,分数从 −0.11 掉到 −0.82(必要性 +0.71);把 log(日最大成交额)\
    \ 一项拆掉只损失 0.12,所以承重的是 H,不是水平。(b) 第 1 轮 R:把乘数里的 day_max(Volume)(股数,含后复权价位)换成 day_max(Amt)(金额),−1.08\
    \ → −0.11,说明去掉价位暴露后 H 这一块在新尺子下接近 0,而且 train / valid 同号同量级(−0.11 / −0.09),不是「一段赚一段亏」。(c)\
    \ 但窗口很敏感:ts_mean 25 → 12 或 50 都是 −0.50,25 日是个尖峰,−0.11 里有运气,我对 H 本身的信息量的估计就是 0\
    \ 附近。(d) 我读了 ts_hurst 的源码:H = log(R/S) / log(d),R 是窗口内去均值累计和的极差,S 是样本标准差,对正倍数和平移不变;窗口内第二早一天缺失时返回\
    \ −inf,最早一天缺失时返回 NaN。所以 head 里的 ts_mean(·, 25) 会把近 25 ~ 45 个交易日内停牌 / 缺失过的票整体推到最低(−inf\
    \ 在均值里带出整个窗口),这是一道对停牌票的筛子,拆解表分不出 H 与这道筛子各占多少。\n\n本位假设:如果 H 里有 alpha,来源是「尾盘成交的参与度是不是一个持续的状态」。收盘那一根分钟线(深市含\
    \ 3 分钟收盘集合竞价,沪市是最后一分钟连续竞价)的成交量占当天最大分钟成交量的比例,在 20 个交易日里是持续的(指数与 ETF 申赎、以收盘价为基准的机构程序单、持股结构稳定的票),还是随机尖峰(消息与散户零星成交)。单个\
    \ 20 日窗口的 H 是个噪声很大的估计量(R/S 在小样本上偏差大,Lo 1991),而被测的对象是个股的慢属性,所以本位把 H 当成一次「噪声测量」,在日轴上用\
    \ 60 ~ 241 日的慢窗口去读它的水平、离散度、尾部、与自己滞后值的相关、与收益的相关、以及与开盘 / 金额口径之差,而不是再叠一层 20 ~ 50\
    \ 日的 ts_mean。\n\n算子怎样实现(15 个种子,全部原样含核心 H):\n (0) 所有种子把 H 包进 cs_winsor(每天截面按 1%\
    \ / 99% 缩尾):−inf 被夹成当日 1% 分位的有限值,「停牌 → −inf → 整窗 −inf」这条筛子不再把票整体踢到最低;NaN 仍是 NaN,cross_*\
    \ 的 nanmean 跳过它。于是「去掉筛子之后 H 还剩多少」可以直接和 head 1 的分数比。\n (1) 慢水平:cross_mean(cs_winsor(H),\
    \ 120);短 40 日减长 241 日的均值差(持续性在上升还是下降)。\n (2) 估计的噪声与尾部:cross_stddev(·, 120)(参与度持续性自己的不稳定程度);下\
    \ 25% 尾均值,上 25% 尾均值减下 25% 尾均值(最不持续的那些时期有多低、两种状态差多远);60 日均值除以(60 日标准差 + 0.05)(信噪比,0.05\
    \ 防分母为 0)。\n (3) 对已知结构中性:cs_bucket_zscore(·, LogFloatCap)(流通市值十档内的 z 分数)、cs_bucket_zscore(·,\
    \ cross_mean(day_std(Amt), 30))(已知成交额族十档内)、以及十档内的离散度版本。它们对 5 个控制的阶跃与非线性暴露也是中性的,所以拿到的分数是\
    \ H 自己的。\n (4) 与收益的关系:cross_corr(·, ts_delta(log(day_last(Close)), 1), 120)(持续性高的时期价格是涨还是跌:被动资金买入\
    \ vs 卖出);H 乘 sign(20 日对数收益)再做 60 日均值(只与方向交互,不改变水平)。\n (5) 状态的状态:cross_corr(·,\
    \ ts_delay(·, 20), 120)(两个不重叠的 20 日窗口的 H 相关,是这个状态到底有多「慢」);cross_zscore(·, 120)(相对自己历史的异常)。\n\
    \ (6) 口径之差:尾盘 H 减开盘 H(用 day_first(Volume) / day_max(Volume) 的同一统计,开盘一分钟含集合竞价);成交量口径的\
    \ H 减成交额口径的 H(差来自价格在尾盘一分钟里的变动,Amt = 价 × 量)。\n\n和已有的不同:两个库里 153 条表达式含 ts_hurst(共\
    \ 259 处,175 处窗口是 20 日),其中 107 条最外层是 ts_mean;22 条含 cross_*(几乎都是 cross_max / cross_mean\
    \ 的平滑),0 条含 cs_winsor 或 cs_bucket_*,只有 1 条含 cross_corr。也就是库里 H 外面几乎只有 20 ~ 50\
    \ 日的 ts_mean 平滑,没有「读 H 序列本身」的统计(离散度、尾部、与收益的相关、与自己滞后值的相关、十档内 z 分数)。15 个种子的算子骨架都不在两个库的骨架集里(我用\
    \ skeleton_key 逐个与 4077 个骨架核对过,0 个命中)。快照里围绕 H 的外围写法全是「ts_mean + mul + log + add\
    \ + day_max / day_std」,和本位的外围算子集合不同。它们也不是控制的换皮:H 对价位与量级不变,控制是流动性、波动、20 日反转、已知成交额族、市值;预计与\
    \ 5 个控制的 |ρ| 都在 0.3 以下,与 head 1 的 |ρ| 水平类种子(1、3)可能在 0.7 左右被自动划掉,其余应明显低。\n\n为什么样本外还会在:来源是持股结构\
    \ / 执行方式这种慢变性质,不依赖行情方向;60 ~ 241 日的读数名次变化慢,15 bp 成本下换手低。诚实的预期:head 1 在 train /\
    \ valid 都是 −0.1 左右,我不预期它们能越过 0.5,押的只是慢窗口和读法不同能让这个「接近 0」的底再往上走一点。\n\n数学检查:(1) 无前视:day_last\
    \ / day_max 只用 t 日收盘前的分钟,窗口全是尾随窗口,t+1 才交易。(2) 数值:分母 day_max(Volume) 在有成交的日子 >\
    \ 0,整天无成交是 0 / 0 = NaN(不是 inf);ts_hurst 窗口内常数时给 NaN,缺失日给 −inf / NaN(见上),已由 cs_winsor\
    \ 处理;cross_corr 有效点不足 2 个时返回 0,只影响新上市 / 复牌头几天;信噪比种子的分母 ≥ 0.05。(3) 热身:cross_mean\
    \ / cross_stddev 对窗口里已有的有限值直接算(不要求满窗),前 120 ~ 241 个交易日估计用的天数较少,但不是填充也不是常数;ts_hurst\
    \ 前 19 天为 NaN。\n"
