- type: N
  hypothesis: "机制。第 1 轮 R 的一个结果让我认为这个批里真正值得保留的不是「尾盘量」,而是「对水平、尺度不变的路径形状统计」:把乘数里的股数\
    \ day_max(Volume) 换成金额 day_max(Amt),head 1 从 −1.08 回到 −0.11;拆解里把最外层 H 拆掉掉 0.71,而水平(log\
    \ 日最大成交额)只贡献 0.12。水平类被 5 个控制与两个冠军吃光了,形状类还剩一点。新想法是把这个原则用到库里从没读过的对象上:一只股票「相对全市场的成交活跃度」在日轴上的路径(注意力的路径),并且读的是它的动态(持续性、趋势、离散、与收益方向的耦合),不是它的水平。\n\
    \n对象:LT = sub(log(day_sum(Amt)), LogFloatCap) = 当日成交额 / 流通市值的对数,即对数换手率(把流通盘的大小从成交里除掉,库里\
    \ 5583 条没有任何日频字段叶子);A = cs_rank(LT) 是它当日的截面百分位,等于「相对活跃度」,市场整体放量缩量被秩吃掉;cs_demean(LT)\
    \ 是减去当日截面均值的版本。\n为什么相信它有信息(如果有):A 股散户占比高,注意力驱动的买入是有文献的(Barber–Odean 2008;Gervais–Kaniel–Mingelgrin\
    \ 2001 的高成交量溢价;Chordia–Subrahmanyam–Anshuman 2001 的活跃度波动与预期收益负相关;Lo–Wang 2000\
    \ 说成交量有市场共同因子,个股剩下的是特质部分;Llorente–Michaely–Saar–Wang 2002 用「成交量 × 滞后收益」的系数区分投机性与对冲性交易)。每一种读法对应一个可检验的状态:\n\
    \ (a) 持续性:ts_hurst(A, 60)、ts_hurst(cs_demean(LT), 60 / 120)、一个流通市值十档内 z 分数的版本。注意力是逐步累积(信息扩散慢、机构建仓)还是脉冲后回落(彩票式追涨)。R/S\
    \ 对序列的水平与尺度不变,所以不会重新读到流动性或市值水平。\n (b) 趋势与离散:cross_ema(A, 10) − cross_ema(A, 120)(相对活跃度在抬升还是萎缩);cross_stddev(A,\
    \ 60)(排名的抖动);十档内的 cross_stddev(LT, 120);LT 的 75% 尾均值减 25% 尾均值;ts_skew(LT, 120)。\n\
    \ (c) 与收益方向的耦合(RET = ts_delta(log(day_last(Close)), 1)):cross_corr(A, RET, 60\
    \ / 120)(放量时涨还是跌);cross_corr(ts_delta(A, 1), RET, 120)(活跃度变化与收益);上涨日的 A 之和减下跌日的\
    \ A 之和(60 日);Llorente 型系数 cross_regbeta(ts_delay(cross_zscore(LT, 60), 1) × ts_delay(RET,\
    \ 1), RET, 120)(昨日「异常成交 × 昨日收益」对今日收益的斜率,正 = 投机性、动量式交易,负 = 对冲性)。\n (d) 与市场共同活跃度的联动:cross_regbeta(cs_mean(LT),\
    \ LT, 120)(个股换手对全市场换手的 beta,机构 / 指数型 vs 散户特质型);cross_autocorr(cs_demean(LT), 120,\
    \ 5)(去市场后的 5 日滞后自相关)。\n全部种子的读数是日轴上 60 ~ 120 日的慢窗口,名次变化慢,15 bp 成本下换手低。\n\n和已有的不同:(1)\
    \ 与快照 head 的不同:6 个 head 全是 ts_mean(mul(log(...), ts_hurst(尾盘量比))) 的嵌套,读的是一天内最后一分钟\
    \ / 最大一分钟的比值;本位的对象是日频的成交额 / 流通市值,时间尺度、分母、字段都不同,16 个种子里只有 4 个用 Hurst。(2) 与库的不同:16\
    \ 个种子的算子骨架逐个与两个库的 4077 个骨架核对过,0 个命中;库里 0 条用 LogFloatCap 这类日频叶子。库里最近的是 Alpha101\
    \ 式的手写式(17 条在 ts_corr / ts_autocorr / ts_regbeta / ts_hurst 的第一参数里放 cs_rank /\
    \ cs_mean / cs_demean,例如 ts_corr(cs_rank(量的变化), cs_rank(收益), 6 ~ 10)),区别有三:分子是除以流通市值的换手而不是量本身;窗口是\
    \ 60 ~ 120 日的慢读而不是 6 ~ 10 日的快读;16 个种子里 cross_corr 只有 3 个,其余读的是 Hurst、趋势、离散、尾部、beta、滞后自相关。(3)\
    \ 与控制的不同:控制里的流动性是水平,已知成交额族是一天之内分钟成交额的离散度的 30 日均值,本位是日与日之间相对活跃度的动态,水平被秩 / 去均值 /\
    \ 十档内 z 分数拿掉;对 5 个控制的线性、U 形、S 形暴露本来就被尺子去掉。预期 cross_stddev(A, 60) 之类与流动性控制有 0.3\
    \ 左右的相关,相关度表会给出;若某个种子与控制 |ρ| ≥ 0.8 会被自动划掉。\n\n为什么样本外还会在:来源是散户注意力与知情交易的结构(注意力是累积还是脉冲、成交量与收益方向是投机性还是对冲性),A\
    \ 股这个结构在 2018 ~ 2025 年没有制度性变化;读数全是 60 ~ 120 日的慢窗口。诚实的预期:head 率只有 4% 左右,押的是别的流没读过的日频活跃度动态。\n\
    \n数学检查:(1) 无前视:day_sum(Amt) 与 day_last(Close) 只用 t 日收盘前的分钟;RET = 收盘到收盘的对数收益,窗口全是尾随窗口,t+1\
    \ 才交易;ts_delay(·, 1) 只用前一天。(2) 数值:day_sum(Amt) 在停牌日没有成交,引擎把停牌日的读数置空,log 在近零时给\
    \ NaN(不是 −inf);LogFloatCap 在 float64 里取 log 后降 float32,与 log(day_sum(Amt)) 相减后量级\
    \ −6 ~ −2,没有精度问题;没有除以近零的量(没有除法);cs_rank 秩的取值在 (0, 1]。cross_corr / cross_autocorr\
    \ / cross_regbeta 有效点不足 2 个时返回 0,只影响新上市与复牌的头几天;ts_hurst 的窗口内第二早一天缺失会给 −inf、最早一天缺失给\
    \ NaN,这会把近 60 ~ 120 日内停牌过的票推到最低或当缺失,所以 16 个种子里只有 4 个用 ts_hurst,其余 12 个用 NaN 跳过型的\
    \ cross_* 算子,两组的分数差就是这道筛子的贡献。day_sum(Amt) / LogFloatCap 的日频叶子取值都是收盘时点已知的值,没有任何隐式前移。(3)\
    \ 定义:ts_hurst 窗口内常数时给 NaN;cs_rank 当天全体缺失时整行缺失(不会发生)。没有任何读 2026 年的东西。\n"
