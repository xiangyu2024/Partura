    hypothesis: |-
      【核心】C = cross_delta(sub(log(day_last(Amt)), LogTotalCap), 1)。day_last(Amt) 是当天最后一个有效分钟(15:00 那根,含收盘集合竞价)的成交额,不是日成交额;减 LogTotalCap 得到「收盘分钟成交额 ÷ 总市值」的对数 x,C 是它的日增量。cross_sum(C, n) 把日增量连加,恰好望远镜成 x_t − x_{t−n}(收盘竞价参与度的 n 日变化),所以核心外面的每个种子读的都是 x 的某种时间结构。

      【证据:为什么选这个核心(数字全部来自本轮 loc)】第 1 轮我的 N 位(净分红,Close 口径 Zv = sub(log(day_last(Close)), LogTotalCap) 的一年增量和)里,所有 Close 口径种子都没进前 5(< −0.62);GP 自己把求和项从 Close 换成了 Amt,留着 select_where(is_lt(abs_(Close 口径的日增量), 0.15), ·, 0.0) 的外壳,最好的 5 个全是这个骨架:+0.10(train +0.10 / valid +0.54)、−0.14(train −0.14 / valid +0.64)、−0.21(train +0.28 / valid −0.21)、−0.59、−0.62;其余 83 个评分都在它们之下。108 个已评分候选里含核心 C 的 16 个均值 −1.60,不含的 −2.23(p 0.002);含 Close 口径同形子树 cross_delta(sub(log(day_last(Close)), LogTotalCap), 1) 的 23 个只好 +0.12(p 0.32)——所以承重的是「收盘分钟成交额占市值」,不是分红楔子。另一个线索:共性表末行,带「原样净分红门」(is_lt(abs_(cross_delta(sub(log(day_last(Close)), LogTotalCap), 1)), 0.15),它几乎从不触发,等于没有门)的 4 个候选均值 −3.17,池里其余 −2.10(差 −1.07,p 0.62,n 太小),而前 5 名里的门写法都不一样(LogTotalCap 减两次、abs_ 套在里面、log(log(Close))、10 日差分),我读成它们的门实际卡的是「当日涨跌幅是否过大」。这是读法,没有逐个核对。

      【机制假设】(1) 收盘集合竞价是被动 / 机构 / 以收盘价为基准的流量集中的地方(指数与 ETF 申赎、基金净值、算法的收盘基准单),散户在这一分钟占比低;x 的长期上升读的是这类持有者份额上升,机构建仓是分批、持续数月的(Chan–Lakonishok 1995;Gompers–Metrick 2001),所以一年的变化是慢信号,换手低。(2) 不加门的 cross_sum(C, 241) 是 x 两端单日值之差,单日收盘分钟成交额的对数标准差我估计在 1 上下(没有核对),端点噪声会压过一年里真正的变化(上面「原样门」候选均值 −3.17 与此相符;这是推断)。门把「涨跌停 / 新闻 / 空竞价」日从求和里拿走,求和就读到事件之前的水平:一个对端点尖峰稳健的趋势。

      【这一位要回答的三个问题,种子按此分工】(i) 门是什么:1–2 按核心自己的幅度(|C| < 1.5 / 3.0,后者同时清掉 log(0) = −inf 及其反弹 +inf,不依赖价格);3–5 按当日涨跌幅(< 0.15 对应 20% 板的极端日,0.09 刚好卡在 10% 板涨跌停 log(1.1) = 0.095 之下,LimitWidth × 0.7 随板块规则变);6 只在 |涨跌幅| < 2% 的平静日累加(无新闻的参与度变化),7 只在 |涨跌幅| > 5% 的事件日累加:平静日版好于事件日版 = 结构性持有者变化;反之 = 注意力。(ii) 是漂移还是噪声:8 在门之后再平滑(半年和,再 20 日均);9 是不加门只平滑的对照(预期差);10 除以自身增量波动(t 值型,分母加 0.5 防近零);11 近 60 日变化减一年变化(加速);14 在流通市值十档内标准化。(iii) 是方向还是份额:12 是增量与当日收益的 120 日相关(收盘参与度上升发生在涨日还是跌日);13 减去同口径日成交额的变化,剩下「收盘份额」的一年变化(市值抵消);15 / 16 只累加上行 / 下行增量(不对称)。

      【与库的差别】库里 5583 条表达式日频字段叶子(LogTotalCap 等)出现 0 次,没有一条做「收盘分钟成交额 ÷ 市值」,也没有一条按日类型(涨跌幅 / 增量幅度)对增量做门;day_last(Amt) 在库里出现 77 次,全是水平放进 ts_ / cross_ 统计量,没有差分后按市值缩放的。全部种子的算子骨架逐个对照过 struct/members.csv 的 5583 个骨架,没有重复;外围与第 1 轮已见写法的差别:不用 LogTotalCap 的双重扣减,门里没有 sub,且平滑 / 比值 / 相关 / 分桶这些外层第 1 轮没有出现。与 6 个素材 head(成交股数水平、日内收益波动)机制上无关;与 5 个控制:这里没有任何水平(C 是增量),与流动性 / 规模 / 已知成交额族没有共线渠道,新尺子也去掉了它们的非线性暴露。

      【为什么样本外还会在】机制是制度性的(收盘集合竞价由机构 / 被动流量占主导),不依赖某段行情;窗口全是日历单位(20 / 60 / 120 / 241),阈值取自板块规则(涨跌停幅度)与量级(e^3 ≈ 20 倍),没有在样本内调过;一年窗口的信号日换手低,15 bp 吃得下。

      【事先写下的风险】(a) 口袋很薄:最好的 +0.10 是 train 与 valid 中较差的那个,邻居 −0.2 ~ −0.6;一年窗口互相重叠,独立样本很少。(b) 上交所 2018-08-20 才有收盘集合竞价,之前的「最后一分钟」只是连续竞价,x 的含义在 2018 年中有断点(train 头 8 个月)。(c) LogTotalCap 含限售股,总市值与流通市值之间的差在新股与解禁时变化。(d) 若 9(不加门)与 1–5 差不多,说明门不承重、分数来自平滑,这个核心的深挖就到此为止。

      【数学检查】无前视:day_last(Amt) 与 LogTotalCap 都是当日值,cross_* 只回看;t 日收盘后算出,t+1 交易。数值:log(0) = −inf 的日子,种子 2、12 以及 15、16 的幅度条件把它们(及 NaN)置 0.0(NaN、±inf 都使 is_lt / is_gt 为假);其余种子对这类日子不设防,若这类日子很多,它们会得到 ±inf 的排序端点,这是 1–2 与 3–11 的区别之一;唯一的除法在种子 10,分母加了 0.5;cross_sum 用部分窗口,头几行不是 NaN,覆盖率闸门不被窗口前缀吃掉;门里的 0.0 把被排除的日子记 0 而不是缺失,面板不会变成常数。
