  - type: N
    hypothesis: |-
      【一句话】收盘窗口(最后 10 / 15 / 30 分钟)的「上涨分钟成交额占比 − 下跌分钟成交额占比」(day_signed_ratio(Ret, Amt),区间 [−1, 1],无量纲)是不需要逐笔数据的净买入压力代理;它在 60–241 日上的均值读「机构在持续建仓还是持续出货」。

      【B104 批里的现象(数字来自本轮 loc)】批里 12 条里 10 条是冠军族的 div(day_last(in_topk_masked(Volume, Close, p)), day_first(in_topk_masked(Volume, Open, p))):in_topk_masked 的 p 是除数,留下成交量最大的 (241+1)//p 个分钟(p = 12 即 20 个分钟,p = 5 即 48 个),这些分钟几乎总含开盘与收盘两个集合竞价 bar(每天成交量最大的两根),所以比值 ≈ 日内开盘到收盘的价格比(推断:从算子源码读出,没有逐日核对)。拆解支持这个读法:Volume 换 Amt −1.64 → −1.60,Close 换 Vwap → −1.63,选分钟的规则几乎不重要;去掉比值、只留 day_last 项的 20 日波动是 −2.34(比值本身必要);外层 cross_stddev 20 日换 10 / 40 日是 −1.89 / −1.95。本批的 3 个素材 head(−1.64 / −2.14 / −2.19)都是「日内收益的 20 日波动」,是波动控制的邻居。所以这一批告诉我的是:一天的边界分钟(开盘、收盘竞价)才是信息所在,但本批只读了那里的价格离散度。我读的是同样的边界窗口里的成交方向。另有 slot 1 的线索:收盘分钟成交额占市值是本轮 loc 里分数最高、train 与 valid 同为正的口袋(+0.10 / valid +0.54);这里读它的另一半——方向,而不是强度。

      【机制】机构的大单被拆成多天执行(Chan–Lakonishok 1995),并大量以收盘价为基准(基金净值、指数跟踪、算法收盘单),所以一只票收盘窗口的净买入压力天与天之间正相关,窗口越长越像「持续建仓 / 出货」的读数(Chordia–Subrahmanyam 2004:个股的订单不平衡预测收益;Gao–Han–Li–Zhou 2018:当天较早时段的方向可预测最后半小时)。这个量没有任何成交额水平、没有市值、没有价位,所以与流动性 / 规模 / 已知成交额族控制没有水平上的共线渠道;与 slot 1 的区别是 slot 1 读收盘分钟成交额占市值的无符号强度变化,这里读窗口内的方向。

      【算子怎样实现】day_signed_ratio(x, y) = Σ|y|·sign(x) / Σ|y|,按分钟对两个都有限的分钟求和;Ret 取分钟收益,Amt 取分钟成交额。in_slice(F, a, b) 取第 a 到 b 分钟(含),241 格里 240 是 15:00 那根。F10 = in_slice(·, 231, 240),F15 = 226–240,F30 = 211–240;开盘窗口 1–10(避开第 0 分钟,它可能含隔夜缺口);午间主体 31–210。外层:cross_mean(60 / 120 / 241)、cross_ema、减去自身 241 日均值(漂移)、对自身 241 日滚动 z 分数、十档市值内标准化。

      【种子分工】1 / 2 / 3 / 4:最后 10 / 30 / 15 分钟的净压力在 60 / 120 / 241 日上的均值或 EMA;5 / 6:收盘窗口减开盘窗口、减午间主体(聪明钱 − 散户:开盘竞价与全天主体以个人投资者为主,收盘窗口以机构为主,两者之差去掉共同的市场方向);7:20 日均值对自身 241 日的 z 分数(现在比自己平时更偏买);8:按收盘窗口占全天成交额的比例加权(机构在场的日子权重大);9:净买入为正的日子占比(只看方向、不看大小,对尖峰稳健);10:十档市值内标准化;11:30 日均值减 241 日均值(流向加速);12:只在 |涨跌幅| < 3% 的平静日取收盘窗口流向(没有新闻的日子里的机构流);13:最简版,收盘分钟涨跌符号的 120 日均值(不加权,检验「加权」是否承重)。

      【与库的差别】day_signed_ratio 是 Partura 算子,5583 条库表达式里出现 0 次;库里 in_slice(Ret, 211, 240) 有出现,但都在 ts_ / day_ 的波动与自相关统计里,没有一条在收盘窗口里计算带符号的成交额占比。全部种子的算子骨架逐个对照过 struct/members.csv 的 5583 个骨架,没有重复;没有种子用 ts_spearman 与 nt_*。与 6 个素材 head(成交股数水平、日内收益波动)无关:它们是无符号的水平 / 离散度,这里是有符号、有界、无水平的方向量。

      【为什么样本外还会在】机构订单拆分与以收盘价为基准的交易是制度与行为的稳定特征;窗口取日历单位(10 / 15 / 30 分钟,20 / 60 / 120 / 241 日),没有在样本内调过;信号只在 60 日以上的均值里读,换手低。

      【事先写下的风险】(a) 分钟涨跌符号是很粗的方向代理:没有价格变化的分钟(冷门股常见)只进分母,冷门股的比值被压向 0,这会让信号与流动性有一点间接相关(控制的非线性暴露已被尺子去掉)。(b) 与 20 日反转控制可能有 0.2 ~ 0.4 的相关(当日涨跌与上涨分钟占比同向)。(c) 上交所 2018-08-20 才有收盘集合竞价,之前的最后 10 分钟只是连续竞价,含义在 2018 年中有断点。(d) 若 5 / 6 好于 1–4,说明有价值的是「收盘 − 其他窗口」的差,而不是收盘窗口本身。

      【数学检查】无前视:全部是 t 日分钟数据与回看窗口,t 日收盘后算出,t+1 交易。数值:day_signed_ratio 分母是窗口内成交额之和,为 0 的日子给 NaN(停牌),不做近零除法;比值有界 [−1, 1],没有 inf / 爆点;种子 8 的权重 day_sum(in_slice(Amt)) ÷ day_sum(Amt) ∈ [0, 1];cross_mean / cross_ema 自动跳过 NaN;cross_zscore 窗口头部几行的方差是部分窗口,只占约 0.5% 的行。定义:Ret 分钟收益在非交易分钟是 NaN,被忽略。
