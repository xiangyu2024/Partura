slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。核心 C = cross_delta(sub(log(day_last(Amt)), LogTotalCap), 1) 不是任何 head 的子树（6 个 head 都不含 Amt 与 LogTotalCap 的组合），核心在 loc 的核心卡第 7 张与共性表里出现，符合 §2 的来源要求。核心对 6 个 head 的最大原始 |ρ| 为 0.042（残差 0.064），对 5 个控制全部 ≤0.016。库里 LogTotalCap、LogFloatCap 出现 0 次，day_last(Amt) 出现 77 次但全是水平进 ts_ / cross_ 统计量（struct/members.csv 核对）。16 个种子的最大原始 |ρ| 为 0.357（种子 9，对 ts_max(ts_max(inv(inv(day_sum(Volume)),10),10))），都低于 0.7 的自动线；控制列里最接近「同一个东西」的是种子 15、16（流动性 0.505 / 0.519，已知族 0.469 / 0.481）。它们恰好是种子 2 的上行与下行两半（15 + 16 与 2 逐日恒等），残差对 head 只有 0.10 / 0.12；0.5 是 corr 表「控制换写法」的提示，离 0.8 的自动线还远，不构成明显在度量同一个东西，放行。种子 1 与 2 门宽不同（1.5 与 3.0），head 相关 0.025 与 0.147，流动性 0.063 与 0.127，不是重复。合理度 4。逐个算子核对：day_last 取当天最后有效分钟（索引 240 为 15:00）；log 在 |x| ≤ 1e-9 时返回 NaN（AlphaCube operators/common.py:211），不是 PI 计划书写的 −inf；is_lt / is_gt / is_gt0 / less 输出 0 或 1，NaN 记 0，select_where 用 x.bool()，所以门的 NaN 只会落到 0.0，不会被当成真；cross_sum / cross_mean / cross_stddev / cross_corr / cross_zscore 都回看且包含当天，t 日收盘后算、t+1 交易，无前视；种子 10 的分母是 cross_stddev + 0.5，有下界；种子 5 的 LimitWidth 缺失时门为假。风险记录但不挡：(i) cross_sum 的部分窗口，头 241 行是从起点的累计，约占 train 的 18%，不占多数。(ii) PI 计划书的 ±inf 端点担心不成立：零成交分钟是 NaN 并被求和跳过，覆盖率 0.997 到 1.0 也说明这类日子少。(iii) 上交所 2018-08-20 起才有收盘集合竞价（PI 的写法与我的了解一致，日期本身未核对）：沪市股票的 C 在该日有一次性台阶，不以 C 为门的种子 3 到 14 会把它计入之后约一年的窗口和，形成沪深之间的截面偏移。这是定义断点而不是热身期，占 train 约五分之一，不构成挡的理由，但请 PI 在 2018-08 到 2019-08 分段看一下。(iv) 种子 4 与 10 近似换皮：10 等于 4 除以 cross_stddev(C,241)+0.5，五个控制 |ρ| 差 ≤0.007，maxH 为 0.313 与 0.315，残差都是 0.136。r1 划掉种子 6 的标准是控制谱差 ≤0.001 且 distinct 相同，这一对没到，不划，请 PI 知道它们几乎重复。(v) 种子 11 叫「加速」，算子是 S60 − S241，不归一化，实质是近 60 日的修正加上 −(第 61 到 241 日前的累计)，机制可以这样读，「加速」的名字不成立。(vi) 文献：稿中把 Gompers–Metrick（2001）写成「机构持股比例上升预测更高收益」，我记得他们的主结论是高机构持股的股票后续收益偏低（需求曲线解释），方向可能不一致，请 PI 核对原文；Chan–Lakonishok（1995）与 Gervais 等（2001）的用法基本合理。(vii) 种子 1 到 12、14 到 16 读的是收盘分钟成交额占市值的变化，其中含整体换手的趋势；只有种子 13 减去同口径日成交额把它拿掉，这是 PI 已经设计的，记下不扣分。核心机制（收盘分钟成交额相对市值的一年变化，即收盘参与度与持有者份额的变化）说得通。如果它有 alpha，最可能来自收盘集合竞价中被动与机构流量相对市值的持续上升（持有者份额），其次是门去掉涨跌停与新闻日之后，平静日收盘参与度的趋势。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。N 位的核心算子 day_signed_ratio（partura/ops_ext.py:122）是 Σ|Amt|·sign(Ret) ÷ Σ|Amt|，区间 [−1, 1]，库里 0 次（struct/members.csv 核对）。库内最近亲属是 L334、L335：sign((收盘 + 前收)/2 − Amt÷Volume) 乘以日成交额，5 日和再除以 5 日成交额和，是日频的带符号成交占比；这里换成分钟收盘窗口里的收益符号，骨架不同（13 个种子的骨架与 5583 条库表达式逐一对照，无一相同）。与 6 个 head 的最大原始 |ρ| 在 0.026 到 0.206 之间（种子 6 最高，对 inv(ts_max(inv(day_sum(Volume)),10)) 为 0.206）；与控制的最大 |ρ| 为种子 6 的波动 0.206 与市值 0.165，其余 ≤0.14。相对 head 与控制是另一个东西，相对 L335 是同族在新切片上的改进，给 4。合理度 4。逐个算子核对：in_slice(Ret, 231, 240) 取 14:51 到 15:00，in_slice(Amt, …) 同窗口；day_signed_ratio 的分母只在两者都有限的分钟求和，分母为 0（停牌）给 NaN，比值有界，没有爆点；cross_mean、cross_ema、cross_zscore 都是因果的；种子 8 的权重是窗口成交额占全天的比例，在 [0,1]；种子 10 的 cs_bucket_zscore 是按 LogFloatCap 十档内标准化，不是单调变换，控制谱不同（市值 0.015 对 b2 的 0.095）。无前视、无数值伪影，也不触发 nanrank_last（没有 ts_rank、cross_rank、in_rank_rolling）。PI 的 inspired_by 叙述有一处读错，需要改：B104 的 12 条是 4 个 div、4 个 cross_mean、4 个 cross_stddev，每组里取成交量最大分钟（True，L369、L370、L383、L384、L397、L398）与取成交量最小分钟（False，L371、L372、L385、L386、L399、L400）各半。素材 head −2.14（L399）与 −2.19（L400）都是 False，取的是最安静的分钟，不是开盘与收盘竞价 bar，所以「一天的边界分钟才是信息所在」只对 True 的一半成立。种子的机制不依赖这段叙述，合理度不降，但这段因果链要改。划掉：无。近似重复 b4 与 b1：同一输入 DSR(14:51–15:00)，只换平滑核（SMA 60 日对 EMA 半衰期 60 日）；五个控制中四个相差 ≤0.002，vol 差 0.040；若日度 DSR 近似独立，两者的时间序列相关约 0.85（代数估计，未实测）。r1 的标准是控制谱差 ≤0.001，这一对没到，不划。b9 与 b13 在 corr_1.json 里是废品（distinct 0.057 与 0.069，取值被 1/120 的网格压成离散值），由流水线划掉，本审计不另计。风险记录但不挡：(i) 2018-08-20 的收盘集合竞价断点：沪市股票的 14:51 到 15:00 窗口在此前没有集合竞价，之后 DSR 的符号与金额结构都变，120 日与 241 日均值会携带这个台阶约一年，b3、b7、b11 的 241 日窗口最明显，与 a 位是同一问题；(ii) b5、b6 的「聪明钱 − 散户」默认开盘与午间是散户、收盘是机构，这是假设，不是数学问题；(iii) 分钟收益为 0 的分钟只进分母，冷门股的比值向 0 收缩（PI 已记）；(iv) 文献：Chordia–Subrahmanyam（2004）与 Gao 等（2018）的用法基本合理。如果它有 alpha，最可能来自收盘 10 到 30 分钟的带符号成交占比在 60 到 241 日上的持续性（机构分批建仓、以收盘价为基准的流量），其次是 b5、b6 的「收盘减开盘 / 午间」差。'
R:
  - head: 'cross_stddev(div(day_last(in_topk_masked(Volume, Close, 12)), day_first(in_topk_masked(Volume, Open, 12))), 20)'
    soundness: 3
    reasons: '合理度 3（无数学问题；机制叙述需要改写）。变体 1、2 用 cross_semistd_neg / cross_semistd_pos（partura/ops_ext.py:751 的 _semistd）作用在 ratio 上，算的是 ratio 日度对数变化的下行或上行半标准差，不是 ratio 水平的半标准差。原 head 对水平取 cross_stddev，所以变体并不是把它的对称离散度劈成两半，而是换成了另一个对象：相邻两日边界比值对数变化的半波动。PI 写的「下行半标准差」字面成立，机制要按这个对象重写。变体 1、2 与 head 1 的原始 |ρ| 为 0.776 与 0.782，残差 0.58 与 0.59，与波动控制 0.616 与 0.615，实质仍是波动类，但不是同一个东西；两个同时进替换会冲突，只能选其一。变体 3 是 div(semistd_neg, cross_stddev)，两者同量纲、都是 60 日波动，没有 1/x 型爆点；变体 4 是 semistd_pos 减 semistd_neg，有界。没有数学问题。头 1 是 True 版本，取成交量最大的分钟，边界叙述对它成立。如果变体有效，最可能来自边界比值的日间跳动（相邻两日收盘竞价前后价格的变化），其次是上行与下行的不对称。'
  - head: 'cross_stddev(div(day_last(in_topk_masked(Volume, Close, 5, False)), day_first(in_topk_masked(Volume, Open, 5, False))), 20)'
    soundness: 3
    reasons: '合理度 3（无数学问题；机制叙述不对，算子本身没有问题）。in_topk_masked 的 largest=False 取的是成交量最小的 (valid+1)//5 个分钟（AlphaCube operators/dt_in.py:684，NaN 成交量排到末尾），即最安静的约 48 个分钟，不是开盘或收盘竞价。PI 的 R 叙述与 B104 的 inspired_by 都把它当边界分钟，对它不成立：ratio 是最安静分钟里收盘价与开盘价之比。变体只把外层 cross_stddev 从 20 改成 40，内层全部保留，所以它是同一个信号换窗口：与原 head 的残差 |ρ| 为 0.923，原始 0.866，与波动控制 0.616，已知族 0.407。按 R 的定义是「去掉或替换部件」，这里只动了窗口参数，不是替换算子；若 PI 要求严格按定义，这组不合规，我按合理度放行，请注意。另一个风险：若零成交分钟的成交量记为 0（r1 的说明里有零成交分钟，成交量的记法我没有核对），某只票某日零成交分钟 ≥ 48（约 20%）时，最小集合在并列中由 torch.topk 的顺序决定，结果部分由平局顺序决定。这需要统计零成交分钟占比，我没有做，不是能确认的数学问题。如果它有 alpha，最可能来自最安静分钟里价格的日间离散（流动性枯竭时的价格发现），但这不是 PI 写的机制。'
summary: '审计员未划任何种子：a 位（E，核心 C，16 个种子）与 b 位（N，收盘窗口带符号成交占比，13 个种子）均以创新 4、合理 4 通过，b 位的 9 与 13 由流水线判为废品；R1、R2 合理度均为 3 通过；主要发现是 PI 计划书的 log(0) = −inf 与源码不符（实为 NaN）、B104 的 False 版本取的是最安静分钟使 PI 的边界叙述只对一半成立、2018-08-20 沪市收盘集合竞价断点影响两位的 train 头一年、Gompers–Metrick 的方向待 PI 核对，以及 b4 与 b1、a10 与 a4 近似换皮但未划；全部只用 train / valid 的结构与已算好的相关度表，未触及 2026 年数据。'
