    收盘价| < 0.15)时,取「收盘分钟成交额 ÷ 总市值」的对数 x 的日增量,否则记 0。

    【证据】第 2 轮 E 位的 96 个评分里,把 g 套 cross_sum(·,241) 的写法是本流最好的:score +0.35(train +0.35
    / valid +0.58),已落在共性表里(含 g 的 8 个候选均值差 +1.20,p 0.006)。cross_sum(g,n) 望远镜成门控后的 x_t
    − x_{t−n},即收盘集合竞价参与度的 n 日变化。第 2 轮外围只试过 cross_sum 的 241 与 120+20 两种窗口、以及市值分桶标准化;这一次不再变门、不再套市值分桶,只换「怎样读
    g 的时间序列」。

    【机制】收盘集合竞价是指数 / ETF / 基金净值基准流量集中处,散户占比低,参与度的趋势读的是机构化份额的缓慢变化,文献见 Chan–Lakonishok
    1995、Gompers–Metrick 2001(机构持股与后续收益)。门去掉涨跌停 / 事件日,让增量不被一次性尖峰支配。

    【这次换的外围】(1) 窗口:180 / 360 / 480 日的和(第 2 轮只有 241),检验趋势期限;一年变化 +0.35 是否只是窗口运气(valid
    比 train 好说明慢趋势在后期更清楚)。(2) 加权:cross_ema 60 / 120 / 241、线性衰减,让近期增量权重高、老的衰减,而不是等权的望远镜(望远镜只看两个端点的值,衰减加权会用到整段路径,噪声更小)。(3)
    稳健与形状:均值、中位数、q75、下尾均值,读增量分布的位置而不是总和;z 分数读相对自身历史的惊讶度。(4) 时序算子家族 ts_*(整面板)与 cross_*(逐股票核)在这个核心上的写法不同,ts_sum
    / ts_decay_linear 作对照。(5) 惯性:增量对自己 20 日前增量的回归斜率(参与度上升是否延续)、增量对当日收益的 t 值(参与度上升发生在涨日还是跌日,方向信息)。

    【与库的差别】库的 5583 条表达式里 LogTotalCap 等日频字段叶子出现 0 次,没有「收盘分钟成交额 ÷ 市值」的差分,更没有按涨跌幅条件门控后的求和
    / 衰减;6 个 head 全是成交股数水平、成交额水平的波动与日内收益波动,和 g 的外围(时间加权、回归)是不同的构造。种子的算子骨架逐个对照过 members.csv。

    【为什么样本外还会在】机制是制度性的(收盘集合竞价的流量结构,不依赖某段行情),窗口是日历单位,阈值 0.15 取自 20% 涨跌幅板规则,不是样本内拟合;第
    2 轮 valid 比 train 更好,与「机构化是慢趋势、越往后越清楚」一致。

    【我的警告】g 与 head 的 ρ 预期很低(< 0.2),但 +0.35 可能是 96 个评分里的运气;若这一位仍 < 0.2,深挖停止。'
