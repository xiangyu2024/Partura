- type: N
  hypothesis: '【新 idea】收盘与开盘两个集合竞价的参与度之差与方向。x_c = log(day_last(Amt)) − LogTotalCap,x_o
    = log(day_first(Amt)) − LogTotalCap(开盘集合竞价那一分钟,盘前信息的集中释放),方向取 day_last(Ret) /
    day_first(Ret)(竞价分钟的价格偏移)。

    【算子怎样实现】(a) log(day_last(Amt)) − log(day_first(Amt)):收盘对开盘的相对强度,市值与日成交额水平都在差里抵消,不是流动性控制;(b)
    开盘版的同一口袋(x_o 的门控一年增量),检验第 2 轮的收盘口袋是不是「集合竞价参与度」的一般现象;(c) 收盘分钟收益 × x_c 的 z 分数(强量上涨
    = 价格不敏感的买单),在 60 / 120 日上平均,以及与增量的乘积的一年和;开盘版同形;(d) 收益对参与度的回归斜率 / t 值(收盘竞价的 Kyle
    价格冲击系数:同样的参与度能推动多少价格,斜率高 = 竞价深度差 = 非流动性补偿,Kyle 1985);(e) 参与度增量与收盘收益的 120 日相关。

    【灵感与来源】第 2 轮 E 位的唯一口袋是收盘分钟成交额占市值的门控增量(+0.35);第 2 轮 N 位 b 的共性表里 day_first(Amt)
    是富集最强的叶子(19 个候选,均值差 +1.46,p 0.000),但那些候选把它放进回归 / 分桶后 train 与 valid 方向不一致,没有读到「变化」。这里把两个竞价分钟放在一起,读相对强度、方向、价格冲击,而不是水平。

    【与库的差别】库里 day_first(Amt) 与 day_last(Amt) 都是水平放进统计量,没有「竞价分钟成交额的对数之差」,没有竞价分钟收益与参与度的乘积
    / 回归;与已知 head(成交股数水平、日内收益波动)与 5 个控制(流动性 / 波动 / 反转 / 已知族 / 市值)都没有共线渠道(差或回归斜率,水平被抵消)。

    【为什么样本外还会在】竞价机制是制度性的(2018-08 以后沪深两市都有收盘集合竞价;开盘集合竞价一直存在);Kyle 系数是价格冲击的结构量,不依赖某段行情。【风险】分钟收益符号在冷门股上大量为
    0;上交所 2018-08-20 前收盘无集合竞价,头 8 个月有断点。'
