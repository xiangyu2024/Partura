attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [2, 6]
    reasons: '创新度 4。库里 5583 条表达式（members.csv 核对）没有一条用日频字段（LogTotalCap / LogFloatCap / LogFloatShares），也没有 div(Amt,Volume) 或 Vwap÷(Amt÷Volume) 这种复权因子楔子。种子读的是 log AF − log TS，即现金分红与送转抵消后减去股本增长的净分红。与三个 head 的日度秩 |ρ| 最大 0.032（残差 0.017）。与 5 个控制：种子 1 的流动性 0.07、波动 0.196、20 日反转 0.031、已知族 0.083、市值 0.099，全部远低于 0.5，不是控制的换写法。合理度 4。数学检查通过：LogTotalCap 用的是原始价乘总股本（docs/steering_and_daily_fields.md:191 说明 FloatCap/Close 不能反算股数，因为 Close 是后复权的，所以 FloatCap 用原始价）；Close 与 Vwap 是后复权（docs/design.md §11.5）；所以 log Close − LogTotalCap = log AF − log TS，AF 只含过去的除权事件，无前视。cross_sum 是日增量之和，等于 Z_t − Z_{t−241}，无除零，缺失不会被填成非零。风险记录但不挡：(i) 面板 2018 年开头的部分窗口（cross_sum 用 nansum 对不足的前缀求和，rolling_windows 左填 NaN），种子 1 前 241 行、种子 3 前 482 行是从起点累计，分别约占 train 的 17% 与 35%，不占多数；(ii) 送转时股本更新滞后会留下 log(1+k) 的几天假尖峰，只有种子 10 过滤了（它把 NaN 也填成 0）；(iii) 种子 5 只用 AF，送转的 log(1+k) 是分红收益率的十几倍，实际上是送转指标。划掉的两个都是重复：种子 2 用分钟 Vwap÷(Amt÷Volume) 与 FS+(TS−FS) 读同一个 log AF − log TS，distinct 0.716 与种子 1 完全一致，各控制 |ρ| 差 ≤0.001，PI 笔记也说应当几乎同分，是同一变量的换读法，它的作用是数据一致性检查，不该占 GP 种子；种子 6 是种子 1 的 5 日端点平滑，M5_t − M5_{t−241} 只在最近 4 天有事件的票上与种子 1 不同，distinct 0.716 一致，各控制 |ρ| 差 ≤0.001，是换皮。保留 1、3、4、5、7、8、9、10、11（4、7、8、9、10、11 的 distinct 与控制谱都不同，属于不同构造）。如果它有 alpha，最可能来自分红与股东回报政策的持续性（Boudoukh 等的净派息收益，与发行异象的反面），其次是与低波动、大市值共线的红利质量因子（控制已去掉大部分）。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [4, 5, 6]
    reasons: '创新度 4。与 a 位用同一个楔子 log AF − log TS，但读的是时点结构：一年前同一窗口（40 / 60 / 20 日）的净分红预测未来除权。与三个 head 的最大 |ρ| 0.033（残差 0.01），与控制 vol 0.19、size 0.10，低于 0.5。合理度 4。算子核对：S242 − S202 = 第 t−241 到 t−202 日共 40 个日增量之和，只用 t−202 之前的事件，无前视；0.05 × S242 只用来给去年有派息的票做并列拆分。风险记录但不挡：(i) 热身。若面板从 2018-01-02 起算，前 202 行时 S242 与 S202 都是从起点到 t 的累计，差恰为 0，b4 到 b6 整段为 0，b1 到 b3 只剩 0.05 水平项；前 242 行的窗口实际是「起点到 t−202」，不是 40 日。约占 train 的 15%，不占多数。(ii) PI 笔记写「非事件日是 1e-7 浮点噪声」，与表不符：种子 4 没有拆分项，distinct 只有 0.108，若真有噪声则 distinct 应接近 1，所以非事件日的增量是精确 0，并列按列序（稳定排序）打破，每天不变，不会每天重排。0.05 项的实际作用是给去年有派息的票排序，而不是压噪声。(iii) 种子 9 的第一项对约 89% 的票并列为 0，靠列序排名（属列序例外），该位的经济内容由第二项 S242 承担。(iv) 种子 1 到 3 窗口嵌套、控制谱相近，但窗口长度是不同的水平，不算重复，保留。(v) 种子 7 只用 AF，送转的 log(1+k) 远大于分红，top 十分位实际是去年同期有送转的票，机制是抢权与高送转惯性，清楚。划掉 4、5、6：种子 4（纯时点）distinct 0.108，低于流水线门槛 0.5，约 89% 的票并列在同一值（去年同 40 日窗口无除权），整张面板几乎是常数，属 §4 数学问题；列序例外针对偶发并列，不针对整张面板几乎是常数的情况。种子 5（减去近 40 日已发生的除权）distinct 0.242，约四分之三的票并列，同理。种子 6 与种子 4 同构（只换成分钟口径，distinct 0.109，各控制 |ρ| 与种子 4 差 ≤0.001），既是常数面板，又是重复。保留 1、2、3、7、8、9。如果它有 alpha，最可能来自年度派息时点的制度规律与除权前的买入压力（Hartzmark 与 Solomon 的派息月效应，民间说的抢权）；种子 7 更多是高送转的同期惯性。'
R:
  - head: 'inv(day_sum(Volume))'
    soundness: 1
    reasons: '合理度 1，因为有 §4 的数学问题。变体 1（cross_mean(inv(day_sum(Volume)),20)）、变体 2（…,60）和变体 7（cs_bucket_zscore(cross_mean(inv(V),20), …)）先对 1/成交股数 取 20 或 60 日均值。1/V 是凸的：一字板等成交股数只有常态几个百分点的日子，它的 1/V 是常态的几十到几百倍，会把整个均值压成「窗口里有没有这样一天」，截面排序被爆点支配（§4 数值伪影）。它们还是流动性与已知族的换写法：变体 1 与流动性 0.70、已知族 0.72 的 |ρ|，变体 2 为 0.66 / 0.66。单日 inv(V) 的截面秩只是 V 的反序，没有问题；问题只在对 1/V 取时间均值。变体 3 到 6（cs_regres(log V, log Amt) 的截面残差，即名义价位；其 20 / 120 日均值；60 日对数换手率 log(V) − LogFloatShares 的均值）和变体 8（60 日 −log 原始价的均值）数学上正常，但同组一并不通过。建议 PI 删掉 1、2、7，把其余变体重新提交。'
  - head: 'inv(ts_max(inv(day_sum(Volume)), 10))'
    soundness: 4
    reasons: '合理度 4。inv(ts_max(inv(V),10)) 即 10 日最低成交股数：内层 inv 把 V 变成 1/V，ts_max 取最大的 1/V，外层 inv 还原为最小的 V。变体 cross_mean(…,20) 是对 10 日最低成交股数求 20 日均值，均值作用在 V 上而不是 1/V 上，不出现爆点。变体 cross_mean(ts_min(cs_regres(log V, log Amt),10),20) 是对名义价位截面残差求 10 日最小再 20 日均值，机制清楚。没有数学问题，也没有落入热身或缺失值陷阱。'
  - head: 'ts_max(ts_max(inv(inv(day_sum(Volume))), 10), 10)'
    soundness: 4
    reasons: '合理度 4。inv(inv(V)) = V，所以头是 19 日最大成交股数。变体 div(ts_max(V,20), cross_mean(V,120)) 的分子分母都是成交股数，比值无量纲，分母是 120 日均值（停牌日为 NaN，不计入）。只有近乎休眠的票分母才会很小，相关度表里该变体的控制 |ρ| 最大 0.38（波动），没有看到它支配截面的证据，只记作尾部风险。变体 cross_zscore(log(ts_max(V,20)),120) 是对自身 120 日的标准化，常数窗口有保护，正常。没有数学问题。'
summary: 'a 位通过（创新 4、合理 4），划 2、6 为重复，余 9 个保留；b 位通过（创新 4、合理 4），划 4、5、6 为面板几乎常数或重复，余 6 个保留。R1 合理度 1（三个 1/V 均值变体爆点，整组不通过），R2、R3 合理度 4。相关度表沿用流水线已算好的 corr_1.json，本步未重算，故未使用 shrink。'
