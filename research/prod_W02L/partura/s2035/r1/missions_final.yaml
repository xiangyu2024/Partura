  hypothesis: '机制:一年期「净分红」= 现金分红 − 股本扩张,一个公司行为变量。它读的是价格空间里的一个楔子:库里没有任何一条表达式把「后复权价」与「原始价」的差读出来。


    【B103 批里的现象(数字都来自本轮 loc)】批里 18 条全是挖掘库的 day_sum(Volume) / day_sum(Amt) 水平类,三个素材
    head 是 −1.34 / −1.52 / −1.67(train −1.19 / −1.24 / −1.45,valid −1.34 / −1.52 /
    −1.67)。方向与半衰期靠 train 定,两段一样差,形状是「毛超额约为 0、亏的是换手成本」(推断,没有毛收益数)。拆解里唯一有信息的梯度:把 Volume
    换成 Amt,inv(day_sum(Volume)) 从 −1.40(与已知族 ρ 0.67)掉到 −3.47(ρ 0.89),第三个 head 从 −1.73(ρ
    0.70)掉到 −4.10(ρ 0.92);窗口 10 到 5 / 20、去掉 ts_max 各层都只动 0.3 以内。富集表里含 day_sum(Amt)
    的 5 个候选均值 −2.96,不含的 −1.51。读法:5 个控制与已知族都是成交额口径,Amt 版本被吃掉;Volume 是原始股数,比 Amt 多出来的只有价格空间(Amt
    = Volume × 原始价)。所以这一批指出的方向不是再改写量的水平,而是价格空间本身,并且是它里面慢、连续、有文献的那一块。


    【新变量】生产 store 里 Open / High / Low / Close / Vwap 是后复权价,Amt 与 Volume 是原始成交额与股数(AlphaCube
    docs/design.md §11.5、docs/可交易回测.md §3 第 1 条:Vwap ÷ (Amt ÷ Volume) 在同一只票同一天的每个分钟是同一个数,跨股票从
    2.5 到 113)。这个数就是复权因子 AF(后复权价 ÷ 原始价)。除权除息日 AF 跳升:现金分红 D 时 ΔlogAF = −log(1 − D ÷
    前收盘) ≈ 分红收益率;送转 k 倍时 ΔlogAF = log k,但总股本同时升 k 倍。所以 logAF 的增量之和 = 现金分红收益率 + log(送转倍数);再减去总股本的对数增量(送转抵消;定向增发、配股、转债转股为负;回购注销为正),得到「净分红」=
    现金分红收益率 − 总股本增长。这是 Boudoukh 等(2007)的净分红收益率(分红 + 回购 − 增发)在只用价量与日频字段时的可观测版本,也是发行异象(Pontiff-Woodford
    2008、Daniel-Titman 2006)的反面。


    【算子怎样实现它】两种互相独立的读法,两个读法给出的结果不一致就说明数据有问题:

    (1) 价量口径 Zv = sub(log(day_last(Close)), LogTotalCap)。推导:log Close_adj = log AF
    + log P_raw,LogTotalCap = log(P_raw × 总股本 TS),相减得 log AF − log TS。

    (2) 分钟口径 Lm = log(day_median(div(Vwap, div(Amt, Volume)))) = log AF(分钟比值逐分钟恒定,日中位数对
    Vwap 缺失的分钟和零成交分钟稳健);log TS = LogFloatShares + (LogTotalCap − LogFloatCap)(同一天同一价格相减,价格抵消),Za
    = Lm − log TS。这里有意拿 Amt ÷ Volume 去比后复权 Vwap:design.md §11.5 禁止的是把 Amt ÷ Volume
    当价格用,这里正是借它与复权价的差读出 AF。

    最后 cross_sum(cross_delta(Z, 1), 241) = 一年窗口内净分红增量之和(等于 Z_t − Z_{t−241})。写成日增量之和而不是
    cross_delta(Z, 241),是因为 cross_sum 用部分窗口,头 241 行不会变 NaN,覆盖率 ≥ 90% 的闸门不被窗口前缀吃掉。


    【种子分工】1 Zv 一年窗口(基线);2 Za(同一个量的分钟口径,与 1 应当几乎同分);3 Zv 两年窗口(更稳的派息政策);4 用 LogFloatCap(分红
    − 流通股扩张,把限售股解禁的供给也算进去);5 只有 AF(现金分红 + 送转,不扣股本):对照,看送转污染;6 端点做 5 日平均(防价量日期错位的端点噪声);7
    在流通市值十分位内标准化(与同体量的比);8 cross_min 120 日(最近半年里最差的一年期净分红,偏好稳定派息者);9 AF 增量 − 2 × 总股本增量(把稀释罚得更重);10
    把 |日增量| ≥ 0.15 的跳变置 0,只留现金分红量级的跳变(防股本数据更新滞后于 AF 造成的假尖峰);11 当前一年期净分红 − 过去两年平均(派息提高
    / 初次派息)。


    【与库的差别】5583 条库表达式里日频字段叶子(LogFloatCap / LogTotalCap / LogFloatShares / LimitWidth
    / BoardCode / ListAge)出现 0 次,也没有一条做 Vwap ÷ (Amt ÷ Volume);全部种子的算子骨架逐个对照过 members.csv
    的 5583 个骨架,没有重复(骨架里带日频字段或复权楔子,Zv 的骨架是 cross_sum(cross_delta(sub(log(day_last(F)),
    DF)))),也没有一个种子用 ts_spearman 与 nt_*。与 3 个 head(成交量水平)机制上无关;与 5 个控制(流动性、波动、20 日反转、成交额离散度、流通市值)只有间接关系(大市值、低波动股分红多),新尺子已把对它们的线性、U
    形、S 形暴露去掉。


    【为什么样本外还会在】(i) 净分红 / 股本增发的溢价是跨国、跨期都被记录的结果,渠道是融资约束、管理层择时与现金回流;A 股 2018–2025 年监管持续鼓励分红,分红是缓变的公司政策,一年内名次几乎不动。(ii)
    信号只在除权日跳变,日更换手极低,15 bp 吃得下;这正是本批所有 head(成交股数每天一变)的反面。(iii) 没有任何参数在样本内调过(窗口取一年
    / 两年 / 半年)。


    【事先写下的风险】(a) 股本更新滞后于 AF 时,高送转股会出现几周的假尖峰(种子 10 专门防);(b) 分红率与低波动、大市值共线,控制去掉之后剩余的
    alpha 可能不够;(c) A 股红利风格集中在 2022–2024 年,valid 可能比 train 有利,所以 score 取较差的 train;(d)
    非派息股占 35–45%,浮点噪声排在下端,但头部十分位是有量级差的连续值,不受影响;(e) 价量口径若与原始收盘价有一天错位,端点噪声约 ±1%(种子 6
    防)。


    【数学检查】无前视:AF 只含 t 日及以前的除权事件(后复权),并且无论前复权还是后复权,窗口内的差分只含窗口内的事件;市值与股数是当日值;t 日收盘后算出,t+1
    交易。数值:log 的输入都是正数(后复权价、市值、AF);Volume = 0 的分钟比值为 NaN 或 inf,被日中位数忽略;非事件日的增量是 0(上下
    1e-7 的浮点噪声),所以面板不是常数;窗口全是部分窗口,前几行不是 NaN。'
