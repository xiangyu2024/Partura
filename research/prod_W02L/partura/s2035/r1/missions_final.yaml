- type: N
  hypothesis: '机制:分红日历(预期除权窗口)。Hartzmark 与 Solomon(2013,JFE,The dividend month premium)记录:一只股票在「按它往年派息月份预测会派息」的月份里平均超额收益显著为正,原因是追求股息的投资者在派息之前集中买入形成价格压力,而不是对股息本身的补偿。A
    股派息按年度、时点高度规律(年报披露、股东大会、预案公告,除权除息以 6–8 月为主),一年前同一窗口里有没有除权跳变是对未来一两个月会不会除权的强预测;民间说的「抢权」(除权日之前的拉升)是同一机制。


    【与 B103 批的关系】本批 head 的信息只有「Volume 口径好于 Amt 口径」:股数比成交额多出来的是价格空间。这一位读的是价格空间里复权因子楔子的**时点**,同一个楔子
    slot 1 读的是**水平**(一年净分红收益率);两个机制不同(水平 = 派息政策的风险溢价与质量;时点 = 预期除权前的价格压力),放在两个位上可以分开读出哪一个有用。批里的数字:三个素材
    head −1.34 / −1.52 / −1.67,Volume 换 Amt 掉到 −3.47 / −4.10(ρ_known 0.89 / 0.92)。


    【算子怎样实现它】净分红日增量 Iv = cross_delta(sub(log(day_last(Close)), LogTotalCap), 1):log
    Close_adj = log AF + log P_raw,LogTotalCap = log(P_raw × 总股本),相减是 log AF − log
    总股本,所以 Iv 在除权日 = 现金分红收益率(送转的 AF 与股本跳变抵消,增发为负),其余日子 0(± 1e-7 浮点噪声)。AF 是后复权价 ÷ 原始价,Vwap
    ÷ (Amt ÷ Volume) 在同一只票同一天每个分钟恒定(AlphaCube docs/design.md §11.5、docs/可交易回测.md §3)。窗口差
    cross_sum(Iv, 242) − cross_sum(Iv, 202) 恰是 (t−242, t−202],即一年前同一时点往后 40 个交易日里的净分红,预测的是
    (t, t+40] 内的除权。只用 202 日以前的事件;cross_sum 用部分窗口,头 202 行退化为全 0 并列(约 10% 的天数)而不是 NaN,所以覆盖率闸门不被前缀吃掉。

    种子:1 / 2 / 3 预测窗口 40 / 60 / 20 日,加 0.05 × 一年期净分红做并列拆分(没有它,没有预期除权的股票的排序由 1e-7 的浮点噪声决定,每天重排,换手爆炸;0.05
    × 一年期净分红 ≥ 1e-4,压得过噪声);4 不加拆分项(对照:纯时点);5 减去最近 40 日已发生的除权(买即将除权的,避开刚除权的,把除权后的价格压力与填权问题分开);6
    分钟口径的 AF 楔子(Za = log AF − log 总股本,与价量口径应一致);7 只用 AF(含送转,检验「抢权」里高送转惯性:有些公司年年送转);8
    在流通市值十分位内标准化;9 预测窗口的秩与一年期净分红的秩各占一半(不靠噪声拆并列)。


    【与库的差别】5583 条库表达式里日频字段叶子出现 0 次;「同一序列两个窗口长度的差」(sub(cross_sum(x, 242), cross_sum(x,
    202)))这个骨架没有出现,全部种子的算子骨架逐个对照过 members.csv 的 5583 个骨架,没有重复;没有种子用 ts_spearman 与
    nt_*。与 3 个 head(成交股数水平)无关;与 5 个控制(流动性、波动、20 日反转、成交额离散度、流通市值)没有机制关系:除权时点由公司的派息政策与股东大会日程决定,不由流动性或波动决定。


    【为什么样本外还会在】日历规律来自制度而不是行情:年报披露截止日(4 月 30 日)、股东大会、除权在预案通过后两个月内;派息公司把派息时点当政策,惯性强(Hartzmark–Solomon
    同样发现用往年预测有效);价格压力机制是行为性的,不依赖某段行情或风格;没有任何参数在样本内调过(窗口 20 / 40 / 60 日只是预测视野,一年 =
    242 / 202 是日历决定的)。


    【事先写下的风险】(a) 换手:预测窗口天天滑动,即将除权的集合每月更替约 1/6 到 1/3,换手比 slot 1 高得多,15 bp 可能吃掉毛超额,这是最可能的失败方式;(b)
    若抢权发生在预案公告(3–4 月)而不是除权之前,窗口会错位;(c) 派息集中在 6–8 月,其余月份里「预测除权」的名单只有约 10% 的股票,头部十分位里其余部分靠
    0.05 项拆开的是一年期派息股;(d) 同 slot 1 的股本更新滞后;一年按 242 个交易日,年间交易日数差 ±3,对 40 日窗口影响小。


    【数学检查】无前视:只用 t−202 日以前的增量(更早的事件);t 日收盘后算出,t+1 交易。数值:log 的输入都是正数(后复权价、总市值);没有除法;窗口差
    ≥ 20 日;非事件日增量 0,面板不是常数(一年期派息股的面板有量级差)。'
