- type: N
  hypothesis: '机制:A 股 T+1 下的『隔夜反应函数』。隔夜跳空 gap = log(今开 / 昨收) 是昨天一整天信息与被 T+1 锁住的卖压的第一次出清价。个股的
    gap 对昨天发生的事(昨日日内收益、昨日收盘距最低价的回升幅度 log(收 / 最低)、昨日上尖刺、昨日成交额惊奇、昨日成交额重心、昨日最低价出现的时刻)的
    120 日滚动相关 / 斜率,就是个股自己的『隔夜回补系数』:负 = 昨日越强今日越被隔夜回吐(逆向资金充足、散户昨日追涨被隔夜套利者反向),正 = 延续(信息驱动)。这是一个慢变的、无量纲的个股属性,变量是参与者构成(隔夜持有者是机构还是散户),不是价格水平或波动水平。另有
    gap 自己的分布读数:下尾均值 ÷ 标准差(隔夜下跳的尾部相对常态的厚度)、一阶自相关(隔夜跳空是否成串)。

    依据 / 批里的现象:本流 B139 批共性表里富集最高的子树之一就是隔夜跳空的 120 日均值 cross_mean(log(div(day_first(Open),
    cross_delay(day_last(Close), 1))), 120)(差 +1.12,p 0.006,4 个候选),第 2 轮 E 位把 gap
    与『同日』日内收益配对,但没有一个种子把 gap 与『昨日的』事件配对,也没有看 gap 的分布形状;第 1 轮里最好的候选全是对滞后量的回归——这说明滞后一天的配对结构是有东西的,y
    的选择则是还没试过的。

    算子实现:cross_corr(x, y, 120) / cross_regbeta(x, y, 120) 的 x 是 cross_delay(昨日量, 1)、y
    是今日 gap,窗口内缺失日成对剔除;cross_tail_mean_q25 / cross_stddev / cross_autocorr 对 gap 的
    120 日序列做分布读数;种子 12 先把 gap 减去当日截面均值(去掉全市场跳空)再配对,使它成为纯个股特有的隔夜反应。gap 的分母是昨日收盘价(恒正),log(收
    / 最低) 的分母是最低价(恒正),种子里没有除以当日 day_std 或近零量;日内路径量 day_argmin / day_centroid 只作配对一方,对一字板日的偏差(argmin
    为 0)只影响 120 日窗口里很小的一部分。

    为什么和库里已有的不同:库里没有任何以隔夜跳空为 y 的滚动配对统计量;第 1 轮的回归(滞后价位量 × day_sum(Ret))的 y 是日内收益,第
    2 轮的 gap 配对是同日日内收益;这里 x 是昨日的事件、y 是隔夜跳空,经济含义是『前一天的结果在第二天开盘怎样被重新定价』,与之前所有读数不同。

    为什么样本外还会在:隔夜 / 日内由投资者构成决定(Lou-Polk-Skouras 一类的隔夜收益研究,A 股机构隔夜建仓、散户日内交易的分工),T+1
    是制度性的、不会因风格切换消失;读数是慢窗口的配对统计量,换手低;与波动 / 流动性 / 市值控制没有机械关系。风险:估计误差大;gap 对停牌复牌后的多日跳空有污染(复牌首日,窗口里占比小)。'
