    struck_seeds: [14]
    reasons: 'novelty 4。σ̄ 归一化的 log(价 ÷ L) 族(种子 4~7、9、12、16)在库里没有同构,库里 log(div(...)) 只出现 2 次,与它们无关;三个 head 的原始 |ρ| 最高 0.45(种子 12 对 add head),残差最高 0.27(种子 5 对 add head)。CLV 族不是全新:库 L305 含 (2C−L−H)÷(H−L) 乘 day_sum(Volume) 的截面排序,即 2·CLV−1 的成交量加权,库 L330 是 (C−O)÷(H−L+0.001) 的日值,所以种子 1、2、3、15 是把库里已有的日值项做 60/20/120 日时间聚合,PI 笔记里「CLV 精确写法 0 条」的说法不准确。控制:种子 3、14 对 rev 的 |ρ| 为 0.51、0.52,≥0.5(表里注明即控制的换写);种子 12 对 liq 0.46、种子 6 对 liq 0.44,都 <0.5。soundness 3。定义上的缺陷集中在一字板(H=L 或 Ret 全 0)和成交很少的票,都不致命,所以不挡,但不能给 4:(i) σ̄ = cross_mean(day_std(Ret),20) 在窗口内全部一字日时为精确 0,而 cross_mean 对不足 20 天的窗口用扩张窗口,所以不只是「连续 20 天一字」才为 0(新上市前几日也会);分子非零时 log(·)÷0 是 ±inf 而不是 NaN,inf 不会被 NaN 过滤,进入 60 日均值后截面排序会把它推到顶或底。种子 4、5、6、7、9、12、16 都有这个分母。(ii) torch.argmin 在并列时返回第一个索引,平盘日的 day_argmin(Low) 恒为 0,于是种子 8(最低点成交量)与 13(最低点时刻)把一字日读成「开盘即最低、开盘分钟缩量」;限价锁死频繁的票,60 日均值会被这几天明显拉偏。(iii) 种子 2 的分子只在 CLV 有定义的日加总,分母 cross_sum(day_sum(Volume)) 却包含平盘日的成交量,平盘日分子为 0、分母不为 0,结果被系统性压向 0。(iv) 种子 9 的 cross_regbeta 解释变量是 σ̄ 归一化深度,重尾,120 日 OLS 斜率可能由单日决定。机制清楚:下探被承接(逆向流动性提供)与隔夜接回(Lou-Polk-Skouras 型),所以打 4 的新颖度、3 的合理度。如果它有 alpha,最可能来自:下探处的承接强度与隔夜的回吐(种子 4~7、9、12、16),这是尺度无关的日内位置信号,换手低;CLV 族(种子 1、2、3、15)的增量更可能只是日内短期反转,已被 rev 控制部分覆盖。种子 14 划掉:它与种子 3 是同一个构造,都是「CLV 的 20 日均值相对其长期水平的偏离」,种子 3 除以 120 日 sd、种子 14 不除,只差一个按股票的尺度,属于重复;保留 3(尺度中性版本)。这是按构造判断,没有实测两者的秩相关(相关度表只给 head 与控制)。'
R:
  - head: 'pow_3(cross_hurst(neg(day_min(Ret)), 15))'
    soundness: 4
    reasons: 'PI 的诊断与代码一致,已核对 cross_hurst(dt_cross.py):R 用缺失日之前的前缀 cumsum(NaN 之后全 NaN),S 用全部有限点,所以停牌窗口里 H 被系统性压低;窗口第 2 天缺失时 R = 0,log(0) = −inf,pow_3 保留 −inf,排到截面最底。neg 与 pow_3 对秩确为空操作(Hurst 对符号与尺度不变,pow_3 单调)。6 个变体全部用成对剔除缺失的估计量(cross_autocorr、cross_regbeta),或做过尺度归一的比值(day_min ÷ day_std,分母 0 时 NaN,|m| 与 std 之比有界),数学上没有问题。变体 4 的分母是滞后尖刺的窗口方差,远大于 EPS 1e-9。窗口 30 的估计标准误约 0.19(约 29 个配对),名次噪声大,这是估计精度问题,不是定义问题,不挡。变体对 head 的 |ρ| 在 0.16 ~ 0.41 之间,去掉停牌标记后的持续性有没有信息,由它们的表现回答。如果它有 alpha,最可能来自尖刺序列的持续性本身(做市商与被迫卖家的成串出现),而不是停牌的标记。'
  - head: 'cross_cov(day_min(High), day_mean(Amt), 30)'
    soundness: 4
    reasons: 'cross_cov 的量纲(价格水平 × 成交额水平)只用于截面排序,不会爆点,数学上没有问题。变体 1、2、5 改用 cross_corr,有 EPS 保护,去掉了单位,但仍含两条序列共同的趋势(PI 自己指出的问题),所以只能检验单位,不能检验趋势;变体 6、7 用日度对数差分去掉趋势,这是对的测试。变体 3、4 只换 Volume 或 Low 与窗口,与原 head 的算子骨架相同,这里是直接评估,不走 GP 的骨架禁令,作为去单位的对照是合理的。变体 6、7 的 log(day_mean(Volume)) 在日均成交量为 0 时为 −inf,会让该票的 60 日相关变成 NaN,只涉及极少数票。如果它有 alpha,最可能来自价格下探与成交活动的同步(放量下探的承接),也就是流动性提供者在下探时的参与,而不是价格水平或成交额的共同趋势。'
summary: '两个 N 位都通过(位 a 创新 4 / 合理 4、不划种子;位 b 创新 4 / 合理 3、划种子 14 为与种子 3 重复)。两个 R 组合理度都为 4,保留。位 b 的主要风险是一字板相关的定义缺陷:σ̄ 为零分母的 ±inf、平盘日 day_argmin 并列记为开盘、CMF 分母含平盘日成交量;这些影响的是限价锁死频繁的票,不致命,建议 GP 评估时注意而不是挡。PI 笔记中「CLV 精确写法 0 条」的说法与库 L305 不符,已在位 b 的 novelty 理由中注明。'
