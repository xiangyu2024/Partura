    reasons: 'novelty 4。相关度表里 16 个种子对三个 head 的原始 |ρ| 最高只到 0.23(种子 4、16 对 cross_cov head),残差最高 0.29(种子 7 对 head);对五个控制的 |ρ| 最高 0.34(种子 7 对 size,种子 12 对 vol),没有一条 ≥0.5。库里没有任何 cross_autocorr 作用于 day_min(Ret) 的表达式(members.csv 核对,0 条),这是种子 1、2 的新结构。种子 1 与 head 1 同取 day_min(Ret) 的持续性,但表里它对所有 head 的最大 |ρ| 只有 0.21,按秩看两者不是同一个量。soundness 4。已核对算子实现:cross_corr、cross_autocorr 走 rolling_pair_reduce,成对剔除缺失;rolling_ols 同样成对,var_x ≤ 1e-9 时 beta 返回 NaN;cross_delay 天数为正,cs_mean 只用当日截面,全部只用 t 日及以前,无前视。分母都有界:种子 3 的 (M+m)÷(M−m) 因 M≥0≥m 落在 [−1,1];种子 5 的尾部均值 ÷ 均值在全部非正值下落在 [1,120];种子 6、7 的分母 |mean| 与 std 之比有界;种子 8~11、16 的 cross_regbeta 分母是滞后尖刺的窗口方差,为正。轻微项:窗口内零方差时 cross_corr 返回 0 而非 NaN,只影响几乎不动的票。如果它有 alpha,最可能来自两处:(1) 做市商、逆向机构的盘口深度与参与者构成的持续性(种子 1、2、3、5、6、14),窗口 60~120 日、换手低;(2) 尖刺之后的价格冲击回吐(种子 8~11、16),这是 1 日尺度的流动性补偿,20 日反转控制覆盖不到。'
