    的隔夜缺口回吐是 Lou-Polk-Skouras 2019 的「隔夜 vs 日内」拉锯的个股版。60 ~ 120 日的慢聚合使换手低,15 bp 吃得下;无量纲、相对自己的量不依赖某段行情的风格。

