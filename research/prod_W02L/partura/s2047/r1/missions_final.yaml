R:
- head: pow_3(cross_hurst(neg(day_min(Ret)), 15))
  why: 烂的部件是 cross_hurst 的 R/S 在缺失日上的处理,依据有三条。(1) neg 与 pow_3 是空操作:R/S Hurst 对符号与尺度不变,pow_3
    保序,拆解表里拿掉 neg 的读数与原 head 逐位相同(−1.34),所以这条 head 实际是 cross_hurst(day_min(Ret), 15)。(2)
    读 cross_hurst 内核并用 8 日窗口的小张量核对(没有用市场数据):窗口里有缺失日(停牌)时累计偏差在缺失日之后全是缺失,R 只用缺失日之前的前缀、S
    用全部有限点,H 被系统性压低;缺失恰在窗口第 2 天时 R = 0,H = −inf(排到截面最底)。(3) 窗口 7 / 15 / 30 = −2.87
    / −1.34 / −1.75(train −2.87 / −1.34 / −0.92,valid −2.79 / −1.19 / −1.75):窗口越长
    train 越好而 valid 掉,与「窗口越长越容易含停牌日、标记越强」吻合;也与持续性本身有信息的说法吻合,单凭这张表分不开。变体用成对剔除缺失的 cross_autocorr
    / cross_regbeta(滞后)读同一个「尖刺序列的持续性」,窗口 30 / 60,另加扣掉全市场平均(cs_demean)与按自己分钟波动归一化的版本。若变体好过
    head 1,说明 Hurst 的缺失日行为是烂部件,持续性本身有信息;若变体全部差得多,说明 head 1 的名次里主要是停牌 / 复牌标记。全部变体数学上有界:cross_autocorr
    是相关系数,有效对不足时返回 0 或缺失,不会爆点;day_min(Ret) ÷ day_std(Ret) 全天无变动时 0 ÷ 0 = NaN。无前视。
  variants:
  - cross_autocorr(day_min(Ret), 30, 1)
  - cross_autocorr(day_min(Ret), 60, 1)
  - cross_autocorr(cs_rank(day_min(Ret)), 60, 1)
  - cross_regbeta(cross_delay(day_min(Ret), 1), day_min(Ret), 60)
  - cross_autocorr(cs_demean(day_min(Ret)), 60, 1)
  - cross_autocorr(div(day_min(Ret), day_std(Ret)), 60, 1)
- head: cross_cov(day_min(High), day_mean(Amt), 30)
  why: 烂的部件是协方差里带的单位与趋势,依据:(1) cross_cov 的量纲是 价格水平 × 成交额水平;day_mean(Amt) 单独 −3.47
    且与已知成交额族 ρ = 0.89,day_min(High) 单独 −2.37(ρ = 0.42),所以 head 的 ρ_known 里有一块是成交额水平的单位。(2)
    拆解表:Amt → Volume 分数不变(−1.60,但 train 从 −1.47 升到 −0.88),ρ_known −0.48;窗口 15 / 30
    / 60 = −1.71 / −1.60 / −1.19(ρ_known −0.47 / — / −0.64),越长越好;High → Low −1.50(ρ_known
    −0.60)。同族变体的 |ρ_known| 都在 0.47 ~ 0.64,贴着 0.5 的线。(3) 两个后复权价格 / 成交量水平的 30 ~ 60 日协方差主要是「共同趋势」(价格上行期成交放大),与收益无关的那一部分尺度由水平决定。变体逐一去掉单位与趋势:cov
    → corr(无量纲);Amt → Volume;窗口 60 / 120;两个序列都换成日度对数变化(价格变动与成交量增长的相关 / 斜率),去掉共同趋势。若变体好过原
    head 且 ρ_known 降到 0.5 以下,说明烂的是单位 / 趋势,关系本身(价格下探与成交活动的同步)有信息。全部变体数学上有界:相关系数有 1e-9
    保护;cross_cov 的变体量纲大但只取截面名次;log 的输入是正的后复权价与成交量均值;cross_delta 的天数为正。无前视。
  variants:
  - cross_corr(day_min(High), day_mean(Amt), 60)
  - cross_corr(day_min(High), day_mean(Volume), 60)
  - cross_cov(day_min(High), day_mean(Volume), 60)
  - cross_cov(day_min(Low), day_mean(Volume), 60)
  - cross_corr(day_min(High), day_mean(Volume), 120)
  - cross_corr(cross_delta(log(day_min(High)), 1), cross_delta(log(day_mean(Volume)),
    1), 60)
  - cross_regbeta(cross_delta(log(day_mean(Volume)), 1), cross_delta(log(day_min(High)),
    1), 120)
