  hypothesis: '机制:日内最低价 L = day_min(Low) 不再当价格水平用,而是当「位置」用:当天价格下探到哪里(相对昨收 / 开盘 / 当天区间
    / 成交额加权价),收盘时从最低点收回了多少,最低点那一刻成交量多大、出现在一天的什么时候。全部量无量纲(价格之比、区间之比、以自己 20 日平均分钟波动
    σ̄ = cross_mean(day_std(Ret), 20) 为单位的对数比),再用 60 ~ 120 日的 cross_mean / 相关 / 回归做成慢变的个股属性。

    批里的现象(本批成员表 + 拆解表):本批里原始读数最好的几条都是日内低 / 高价的**水平**。cross_cov(day_min(High), day_mean(Amt),
    30) 训练净夏普 1.10;ts_max(day_min(Close), 5) 0.57、inv(day_min(High)) 0.52、cs_normalize(day_min(Low))
    0.51(后三条每日换手 0.01、rank IC 约 ±0.01)。去掉 5 个控制和两个冠军之后,它们的 B 分数都不高于 −2.35(进不了本批最好的
    3 个;只有 cross_cov 那一条以 −1.60 排进 3 个 head)。后复权价格的水平在股票之间的排序 ≈ 上市以来的累计收益加名义价格(规则
    §4:这是长周期动量 / 反转信号),换手低,所以几乎不付成本就拿到这个暴露 —— 恰好是 5 个控制和冠军吃掉的东西。同一个原子(最低价)若写成比值,就去掉水平,留下「下探多深、收在哪里、谁在下探处接货」。

    读数分四组:

    (A) 收盘位置与资金流(种子 1、2、3、14、15):CLV = (C − L) ÷ (H − L)(收盘在当天区间里的位置,[0, 1])的 60 日均值;Chaikin
    资金流(2·CLV − 1 按成交股数加权的 60 日和 ÷ 成交股数 60 日和);近 20 日 CLV 相对自己 120 日的 z 分数,以及 20 日减
    120 日;实体占区间的比 (C − O) ÷ (H − L)。

    (B) 下探深度与成交加权位置(种子 4、5、6、7、12、16):log(昨收 ÷ L) ÷ σ̄、log(开盘 ÷ L) ÷ σ̄、log(收盘 ÷ L)
    ÷ σ̄ 的 60 日均值;以开盘为基准的「上冲减下探」不对称;成交额加权价 day_wmean(Close, Amt) 高出最低价多少(log(加权价 ÷
    L) ÷ σ̄,种子 12:成交的重心离最低点有多远,远 = 下探是短暂的尖,近 = 大量成交发生在低位;只把成交额当权重,不把 Amt ÷ Volume
    当价格,它是未复权价,和后复权的 Low 单位不同);下探对收回的 120 日回归斜率(种子 16:当天的下探有多少在收盘前被收回 = 逆向资金的承接系数)。σ̄
    为单位使读数与波动水平无关,并且读的是「相对随机游走预期的下探」:随机游走下 log(开盘 ÷ L) ÷ σ̄ 约 0.8 · √240 ≈ 12(合成立方体上核对为
    12.8),更大 = 趋势 / 抛压型下探,更小 = 均值回复型。

    (C) 接货处的成交与时点(种子 8、13):最低价那一分钟的成交量 ÷ 当天分钟均量的 60 日均值(放量下探 = 恐慌出清,缩量 = 无人问津);最低点出现的时刻
    day_argmin(Low) ÷ 240 的 60 日均值(早 = 开盘抛压之后被承接,晚 = 抛压持续到尾盘)。

    (D) 反应函数(种子 9、10、11):昨日下探深度(σ̄ 单位)对今日隔夜缺口(今开 ÷ 昨收 − 1)的 120 日斜率(下探之后隔夜被接回,还是继续砸);昨日
    CLV 对今日日内收益的 120 日斜率(收盘位置的延续或回吐);CLV 的 120 日一阶自相关(接货行为的持续性)。

