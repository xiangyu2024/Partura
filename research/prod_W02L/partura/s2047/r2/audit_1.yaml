划掉第 9 号(重复):cross_mean(day_gini(Amt),120)。day_gini 的 docstring 自述是 day_std / day_mean 的不爆版本,即与已知族 cross_mean(day_std(Amt),30) 是同一个分散度量换了归一化。相关度表显示它与 known 0.66、与 liq 0.74、与 size 0.63,都很高。是同一个东西的写法变体。
保留的理由:第 2、3、8、11 号的 day_argmin(Low) / day_argmax(High) 在平盘日返回 0(ops_ext 与 dt_day.py 第 182-192 行,torch.argmin 取首个最小值下标),所以一字板日有系统偏差。但这些日子只占 120 日的一小部分,不构成定义坏掉,保留;PI 应注意这一偏差。第 1 号与第 12 号都是 ar1(Ret) 的读数,第 12 号为 5 日均值的 120 日 z 分数,度量的是相对自身历史的变化,不是同一个写法,保留。第 7 号 ar1(Close) 对价格水平取系数,主要捕捉日内趋势持续性,与 day_sum(Ret) 可能重叠,但这不是数学问题。
