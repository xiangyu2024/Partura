    reasons: '位 a 是 E 深挖,核心 day_sum(Ret)。核心检查:它在 loc.md 共性表里是子树(+0.98,含 48 个候选,p 0.000),且原样出现在全部 12 个种子里;与 5 个控制的 |ρ| 为 liq 0.00、vol 0.01、rev 0.18、known 0.00、size 0.04,全部 < 0.8;与快照任一 head 的原始 |ρ| 最大 0.11。核心通过。
划掉第 10 号(数学问题):sub(cross_semistd_neg(day_sum(Ret),120), cross_semistd_pos(day_sum(Ret),120))。源码 ops_ext.py 第 751-761 行的 _semistd 只在 x>0 且前一日 x>0 时取对数比 log(x[t]/x[t-1]),它的定义对象是正的价格水平。day_sum(Ret) 是累计收益,约一半交易日为负,这些日被置为 NaN,剩下的是相邻两日收益之比的对数,不再是半标准差。覆盖率 0.996 是因为窗口里仍有 3 个以上有限点,pipeline 的门槛没有抓住这个问题。
创新度 4:快照的 6 个 head 全部围绕 day_min(Ret)、day_min(High)-day_mean(Amt)、day_var(Open),没有任何一个含 day_sum(Ret);种子与 head 的原始 |ρ| 最大 0.35(第 8 号),残差最大 0.49(第 8 号,与 vol 0.43 有一定重叠)。gap 与日内收益相减的写法(第 1、6、7、12 号)是隔夜与日内收益的分解,快照里没有这一写法。第 1 号与 known 0.38、liq 0.36,属于较高但未过自动门槛的相关。
合理度 4:机制清楚,隔夜 / 日内分解有文献依据(Lou-Polk-Skouras 2019 一类的隔夜与日内收益拉锯);第 3 号 cross_regbeta(x,y,d) 按 rolling_ols(x,y) 的 beta 定义(见 AlphaCube-steering/src/alphacube/operators/dt_cross.py 第 299 行),是 y=day_sum(Ret) 对 x=cs_mean(day_sum(Ret)) 的回归,与 hypothesis 写的日内市场 beta 一致。gap 只用 t 日开盘价和 t-1 日收盘价,无前视;除数全为收盘价或 120 日标准差,未见近零除数(第 9 号的分母在 120 日全为零时才会爆,实际很少)。
如果它有 alpha,最可能来自:隔夜与日内收益的投资者构成分解,或者个股日内收益对全市场日内均值的 beta。风险是 train 与 valid 可能符号切换(hypothesis 已注明),这不是挡的理由。
注意(不划):第 3 号与第 4 号(cross_corr(day_sum(Ret), cs_mean(day_sum(Ret)),120))在统计上相关,beta 等于 corr 乘以个股标准差再除以常数市场标准差,二者的差只在个股波动这一项。它们是两个写法,不是重复,保留。'
