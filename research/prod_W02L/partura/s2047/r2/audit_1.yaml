合理度 3:机制说得清(Roll 价差反弹、日内极值时间、成交重心与参与者构成)。扣掉 1 分是因为:argmin 的并列偏差是一个明确的测量问题,ar1 在价格水平上可能只是趋势持续性,而且 day_centroid 的分母有 tot 大于 0 的守卫,不是问题。这些都不触发 §4 的数学问题,所以放行。
如果它有 alpha,最可能来自:成交额与极值的日内时间分布(参与者构成:机构收盘执行、散户开盘驱动),或买卖价差反弹这一慢变流动性成本成分。'
