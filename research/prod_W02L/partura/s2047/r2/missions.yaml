  core: 'day_sum(Ret)'
  hypothesis: |
    核心:day_sum(Ret) = 个股当日日内(开盘到收盘)累计收益。Ret 第一根分钟收益恒为 0,所以它不含隔夜跳空。依据:本批 168 个已评分候选里,含它的 48 个均值 -1.61,不含的 -2.59,差 +0.98(p 0.000),是共性表里统计最扎实的子树;本流第 1 轮里最好的几个候选(-0.20 ~ -0.32,train 为正)全是「滞后的日内最差分钟收益对 day_sum(Ret) 的 120 日回归」。但那些候选的外围全是同一种:cross_regbeta / cross_reg_tvalue / cross_corr,回归元是滞后的某个价位量,y 是 day_sum(Ret)。我认为它们的 alpha 不在「滞后的价位量」上,而在 day_sum(Ret) 这个 y 本身,尤其在日内收益与隔夜收益的分解上。
    这次要试的外围(和快照里已见过的全不同,不再用「滞后回归元 + 对 day_sum(Ret) 回归」这种写法):
    (1) 隔夜与日内的拉锯。隔夜跳空 gap = log(day_first(Open) / 昨日 day_last(Close)),用 cross_mean(gap, 120) 减去 cross_mean(day_sum(Ret), 120)。文献(Lou-Polk-Skouras 2019,Berkeley-Hendershott-Bergsma 类研究)中隔夜收益长期为正、日内长期为负的个股属性可以持续,A 股的机制是散户日内追涨、机构隔夜建仓。这是 120 日的慢属性,和 20 日反转、波动、市值没有机械关系(只有当两项因同一次大涨同向时才相关,而差分把它们扣掉了一部分)。
    (2) 日内收益对全市场日内平均收益(cs_mean(day_sum(Ret)))的 120 日 beta / 相关,即日内市场 beta。低 beta 溢价(Frazzini-Pedersen 2014)的日内版;日内 beta 与日频 beta 不同,不含隔夜跳空,更像个股在盘中对大盘情绪的敏感度。
    (3) 日内收益的自相关 / 左尾 / 夏普 / 上下半方差之差:读的是「日内收益是不是稳定为负 / 带偏度」。
    (4) 日内收益与隔夜跳空的关系(跳空后日内回补还是延续):cross_corr / cross_regbeta(gap, day_sum(Ret), 120)。回补强 = 隔夜跳空是情绪过度反应,日内被逆向资金回补;延续强 = 带信息。
    (5) 日内收益与成交量惊奇的耦合,最后一组做对照。
    实现:全部 120 或 60 日的 cross_* 成对 / 分布统计量,窗口内缺失日成对剔除。读数是无量纲(相关、斜率、均值差)或收益量级的慢变属性,换手低。gap 的分母是昨日收盘,恒正,不存在除零;Open 在一字板日有值。
    为什么和库里已有的不同:本批已评分候选(loc 里能看到的)里含 day_sum(Ret) 的外围全是 cross_reg* / cross_corr,回归元为 cross_delay 的价位量,没有看到 cross_mean / cross_autocorr / cross_tail_mean_q25 / cross_semistd_* / 与 gap 配对的写法(只核对了 loc 可见的候选,没有逐条核对全库);库里也没有隔夜跳空与日内收益的相减。
    为什么样本外还会在:隔夜 / 日内的分解是投资者构成(散户 vs 机构)的结构性信号,文献里在多个市场持续了十年以上;低 beta 是被杠杆约束支撑的溢价。风险:第 1 轮 train 为正、valid 为负的现象说明这一族在 2023 年之后可能有体制切换,所以种子里放了符号不同的几种读数,让 GP 自己找稳定的。
    数学检查:全部只用 t 日及以前的数据(gap 用当日开盘价和昨日收盘价,开盘价在当日 9:30 之后才有,t 日收盘后才计算,t+1 日交易)。无除以近零的量(cross_stddev 120 日,窗口不满用扩张窗口)。
