- type: N
  hypothesis: |
    机制:日内**时间结构**的慢变属性,而不是价格水平。本批的共性表里富集最高的子树里有一类全是无量纲的日内路径形状:day_ar1_coefficient(Close) +0.80(p 0.023)、day_at_max_ratio(Open) +0.77(p 0.053)、pow_2(day_argmin(High)) +0.57(p 0.035)、day_argmin(High) +0.48,而水平量(day_max(High) +0.45、day_max(Close) +0.31)富集最弱、水平 head 的得分是 -2.8。也就是说,在这一批里「一天里什么时候发生了什么」比「价格是多少」更活。本轮全部用时间位置 / 路径形状读数,读数的单位是分钟序号、比例或相关,与名义价格、市值、绝对波动无机械关系。
    五组读数(全部 60 / 120 日慢均值,少数用相对自身历史的 z 值):
    (a) 分钟收益一阶自相关 day_ar1_coefficient(Ret):负值 = 买卖价差反弹(Roll 1984),是价差 / 流动性成本的无量纲代理,不同于成交额或波动水平;(种子 1、7)
    (b) 日内最低 / 最高价出现的分钟序号 day_argmin(Low) / day_argmax(High) 及其差:最低价晚出现 = 尾盘被卖压打到最低(信息交易者 / 强平),早出现 = 开盘冲击后被逆向资金回补;极值位置的时间分布是 intraday 动量的 Heston-Korajczyk-Sadka(2010)式「日内模式」的个股版;(种子 2、3、8、11)
    (c) 成交额的日内重心 day_centroid(Amt) 及与日内收益的相关:成交集中在尾盘 = 机构按收盘价执行(VWAP / TWAP / 收盘算法),集中在开盘 = 散户和消息驱动;(种子 4、5、10)
    (d) 成交额的日内基尼 day_gini(Amt)(成交集中度)与「价格停在最低价的时间占比」day_at_min_ratio(Low);(种子 6、9)
    (e) 对照:种子 12 用相对自身历史的 z 值而不是水平。
    为什么和库里已有的不同:本批 loc 里可见的含 day_argmin 的候选是 pow_2(day_argmin(High)) 这种单日读数的外裹,没有看到 cross_mean / cross_stddev / cross_corr 的慢窗口写法(只核对了 loc 可见的候选);day_centroid(Amt)、day_gini(Amt)、day_ar1_coefficient(Ret) 在库里是否出现我没有逐条核对,但与成交额 / 收益的日内时间重心配对的写法本批里没有;所有种子是 cross_* 慢窗口,而本批的头部都是单日读数。
    为什么样本外还会在:日内成交重心和极值时间由参与者构成决定(机构 vs 散户 vs 量化算法),变化慢,120 日平均后名次稳定,换手低;买卖价差反弹是流动性成本,有文献支持的溢价(Amihud-Mendelson 1986 的价差溢价)。风险:这些读数与流动性控制(成交额)可能有非线性交互,尺子已扣掉线性 / U 形 / S 形;另一个风险是分钟序号受涨跌停 / 一字板影响(整天不动时 argmin = 0),这类日子在 120 日里占比小。
    数学检查:day_argmin / day_argmax 是序号,整天常数时给 0,不爆;day_centroid / day_gini 对成交额为 0 的整天给缺失 / 0,不除近零;cross_stddev 的分母不出现;全部只用 t 日及以前。
