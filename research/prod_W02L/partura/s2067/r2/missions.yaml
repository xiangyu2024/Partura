- type: E
  core: day_durbin_watson(Amt)
  hypothesis: 核心 day_durbin_watson(Amt) 是分钟成交额序列的 Durbin-Watson 统计量(约 2(1-一阶自相关)):低 = 当天成交额一块一块持续放大 / 缩小(大单被算法持续拆分、有人在连续建仓),高 = 成交额分钟间来回跳动(零散散户撮合)。它在批里是共性表里富集的部件(含它 14 个候选均值 -1.93 对 -2.89,p 0.001),但上一轮的 E 位只深挖了 day_corr(|Ret延迟|,Amt) 核心,这个核心还没有被单独作为核心外围化过,库里含它的候选都是 sub(day_product..., day_durbin_watson(Amt)) 这种两项相减。本位的外围全部是「把当日读数放进自己的历史或同类里再读」:(a) 与自己 40-60 日均值之差 / 除以标准差 = 异常的持续性(某天突然被连续拆单),这是事件型而不是水平型信号,和流动性控制(水平)正交;(b) 减去 day_durbin_watson(Volume):成交额 = 价 x 量,两者 DW 之差剩下价格路径对成交额平滑度的贡献,去掉纯成交量节奏;(c) 与 sign(day_sum(Ret)) 相乘:持续放量发生在上涨日还是下跌日(拆单买入 vs 拆单卖出的方向),这是方向性的信息,控制里没有;(d) cs_bucket_zscore 按 LogFloatCap 分桶,把大盘 / 小盘各自内部比较,新尺子已去掉对市值的非线性,这里直接在桶内排序;(e) 与 day_durbin_watson(abs_(Ret)) 相减:成交额节奏相对波动节奏。为什么样本外还会在:机构订单拆分的持续性是执行层面的结构,和行情阶段无关;异常持续度是日度换手低的事件信号(经 EMA 后换手降到周频),成本能承受。风险:DW 本身与流动性有一定相关,所以多数种子写成差分 / 偏离。
