- type: N
  hypothesis: 机制:成交额的「记忆衰减曲线」。day_corr(Amt, in_delay(Amt,k)) 是分钟成交额在 k 分钟间隔上的自相关,把不同 k 的读数相减得到衰减速度:长间隔(15 / 30 分钟)自相关高、短间隔(1 分钟)自相关相对低 = 慢变的大单拆分流(机构)压过快变的零散撮合;反之是散户跳动型。再和价格侧的同样曲线(abs_(Ret) 的自相关 = 波动聚集,或 Ret 自相关 = 微观结构反转)相减,得到「成交额的聚集是否超过波动的聚集」:成交额记忆超过价格记忆 = 有人在不推动价格地持续吸筹 / 派发(隐蔽执行),这是信息交易者的典型指纹。算子实现:day_corr 与 in_delay 都作用在分钟轴,差值是日度量,再用 cross_mean / cross_ema 跨 20-40 日平滑(把单日相关的大噪声压掉,这是上一轮批里 day_corr 类 head 为负分的主因)、用 cs_bucket_zscore 在市值桶内比较。与库不同:库里 head 与 122 个候选全部是 day_corr(|Ret|, 量) 这种价量交叉相关或 DW / autocorr_n1 单点读数,没有「同一变量不同间隔的自相关之差」,也没有「量的记忆 减 价的记忆」;day_autocorr_n1 只有 1 分钟间隔且是单点。样本外为何还在:订单拆分执行的持续时间由机构资金规模和流动性约束决定,变化很慢;差分与跨日平滑使它与水平型控制(流动性 / 波动)基本正交。
  inspired_by: 批 1/2 的 head:day_autocorr_n1(pow_2(in_rank(...Amt...))) 方向 +1 以及 day_durbin_watson(Amt / Volume) 在共性表里的富集 (+0.96 / +1.05),说明成交额分钟间的序列相关结构本身带信息;而第 1 轮的价量互相关 N 位最好只到 -0.59,说明价量交叉项太弱,改用单变量自相关曲线
