    reasons: '三个 head 都是单向的 day_corr(|Ret 延迟|, 量);本位的差分 day_corr(abs_(Ret),in_delay(Volume,5)) 减去 day_corr(abs_(in_delay(Ret,5)),Volume)(以及 Amt、有符号、log(Amt) 版本)是双向的「领先–滞后不对称」,与快照 head 的原始秩 |ρ| 最大 0.34(seed 1 与 head 的 Volume 版本),残差 |ρ| 在 0.09–0.41 之间,与 5 个控制的原始 |ρ| 最大 0.38(seed 11 与已知族),明显不是换写法。给 4 而不是 5,因为它是 head 的结构组合而不是新的数据源。合理度 4:所有 day_corr 与 in_delay 在分钟轴上向后取值,无前视;seed 8 的分母 add(abs_(P),abs_(Q)) 使 (P-Q)/(|P|+|Q|) 恒在 [-1,1] 之内,不会爆点,只是两者都接近 0 的票的值接近噪声符号,这是弱点但不是 §4 的数值伪影;seed 12 的 log(Amt) 经 log 的 |x|>EPS 守卫,不会出现 -inf。机制说得通:共同的日内 U 形季节性在差分中部分抵消,剩下的是方向性的先后关系。如果它有 alpha,最可能来自投资者结构(散户 / 机构占比)决定的量价领先方向,这个结构变化慢。划掉:无。注意 seed 4、5 与 seed 1、2 只是 Volume 换成 Amt,两个字段不同,不算重复;seed 9 是同一延迟的有符号相关,不是领先–滞后,但与快照 head 的 |ρ| 0.24、残差 0.09,不是重复,保留。12 个种子全部保留,≥ 4 通过。'
