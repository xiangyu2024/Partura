    reasons: '核心 day_corr(abs_(in_delay(Ret,5)),Amt) 就是快照 head 2 本身(相关度表 |ρ|=1.00,score -2.70);外围是跨日平滑(cross_mean / cross_ema)、比值、分位尾均值、分桶去市值、与符号的乘积。与该 head 的原始秩 |ρ| 为 0.18–0.57(seed 1 0.55、seed 6 0.54、seed 12 0.57),但对 5 个控制取残差后与该 head 的交易信号残差 |ρ| 在 seed 1/2/3/6/7/8 为 0.70–0.77,说明这些种子大多仍是同一个交易信号的平滑版本;只有 seed 4、5、9、10、11 的残差偏离到 0.07–0.48。因为它不是换个写法的同一度量(时间尺度与截面处理确有变化),不给 1,但也不算真正新的,给 3。合理度 4:cross_mean / cross_ema 按交易日因果平滑;day_corr 只用当日分钟;in_delay 向后取值(算子定义核对,无前视);cs_bucket_zscore 按 LogFloatCap 分桶;cs_mean 与 ts_regres 的用法正确(ts_regres(x,y,d) 是 y 对 x 的滚动残差,此处 y=核心、x=day_sum(Ret),用法与「去掉当天涨跌机械成分」一致)。不触及 §4 的任何陷阱(无 nanrank_last 类算子、无 in_regres(X,in_mean_full(X)))。机制是「波动先行、成交跟随」反映的信息传导速度;风险是 |Ret| 与 Amt 的日内相关可能主要来自共同的 U 形日内季节性,但这是定义上的担心,不是 §4 的数学问题,不挡。如果它有 alpha,最可能来自小盘题材票价格发现延迟这种结构性差异,经慢平滑后留下的截面稳定部分,而不是 5 分钟级的瞬时信息。划掉 seed 12:cross_mean(sub(core,cs_mean(core)),40) 中 cs_mean(core) 是每日截面常数(所有票同值),减去它后对 40 日取均值,每日截面秩与 cross_mean(core,40) 完全相同,只在窗口内有缺失日的票上有微小偏差,属于重复。核心与 5 个控制的原始 |ρ| 最大 0.33(liq、known),< 0.8 通过;无种子触发 ≥0.7 的 head 自动划掉或 ≥0.8 的控制自动划掉。剩 11 个种子 ≥ 4。通过。'
