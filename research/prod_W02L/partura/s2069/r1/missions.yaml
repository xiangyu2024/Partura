  - type: N
    hypothesis: 'Float-normalised turnover shocks inside size buckets. Raw volume and amount (which all library heads use, always unnormalised) mostly proxy for size and liquidity, which the controls strip out. Dividing volume by floating shares (log(day_sum(Volume)) - LogFloatShares = log turnover of float) measures the fraction of the free float that changed hands, a clean attention / disagreement proxy that the library never touches because the LogFloat* leaves are new. Mechanism: abnormal turnover relative to the stock own history and relative to its same-size peers (cs_bucket_rank by LogFloatCap, cross_zscore against 20-60 day history) marks attention shocks and informed trading; in A-shares high-attention small caps are later reversed, while quiet-turnover stocks with rising turnover trend (we let GP choose the sign through the rank direction). Second leg: intraday return skew and return-volume correlation averaged over days, bucketed by size, capturing lottery preference. Because operators work on float-normalised, bucket-ranked and history-relative quantities, the exposure to the liquidity and size controls is removed by construction and the residual attention effect should persist out of sample.'
    inspired_by: 'Batch 1 heads all built from day_sum(Amt)/day_sum(Volume) (VWAP) and mean volume (ts_mean(day_sum(Volume), k)) with every one scoring negative after control residualisation: raw volume is absorbed by the controls, so the same volume information needs to be float-normalised and bucketed to become new.'
