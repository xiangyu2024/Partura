    hypothesis: 'Core = 4-day rolling correlation between the daily VWAP (Amt/Volume) and a 26-day sum of 5-day mean volume: it measures whether the average transaction price co-moves with slow-moving participation, i.e. whether price is being pushed up on persistent volume (accumulation) or on fading volume. Every library head wraps it only in cs_rank(ts_decay_linear(.)) and then differences it against an Open/volume-correlation argmin leg. Here the periphery is completely different: size-bucket-neutral ranking (cs_bucket_rank by LogFloatCap, which removes the size-dependent level of the correlation within the cross-section), EMA/z-score of the correlation against its own history (a change in accumulation rather than its level), cross-day sign persistence, tail-of-liquidity cs_last_* masks that drop the thinnest names, and interactions with intraday return skew / close-based price change. The mechanism is persistent institutional-style accumulation by small and mid caps whose participation drifts slowly; it should survive out of sample because bucketed ranking and history-relative scaling remove the size and liquidity exposures that the controls absorb, leaving the within-size accumulation timing.'
