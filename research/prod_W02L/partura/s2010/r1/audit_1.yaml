slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [3, 4, 5, 12]
    reasons: '位 a 为 E 深挖,核心 day_durbin_watson(Vwap)(下称 DW)是 head 1 的子树,核心门槛通过:核心与五个控制的 |ρ| 最大为 vol 0.69,小于 0.8。自动划掉 3、4、12:与 head 1 的原始 |ρ| 分别为 0.73、0.72、0.82,都大于等于 0.7。另划 5:div(cross_mean(DW,20), cross_mean(DW,241)) 与 head 1 的原始 |ρ| 只有 0.21(库禁令的原始口径抓不到),但残差 |ρ| 高达 0.74;它用的是同一条 DW(Vwap) 序列、同一个 241 日窗口,去掉五个控制后两者几乎是同一个非控制成分,属于 head 1 的换皮,划掉。放行的 1、2、6、7、8、9、10、11 与 head 1 的残差 |ρ| 在 0.13 到 0.49 之间,与控制的 |ρ| 最大 0.41(种子 1 的市值),都不是同一个东西。逐个说明(如果有 alpha,最可能来自哪里):1 与 2 是 DW 的变异系数,水平被除掉(vol 控制 0.03 与 0.01),2 只是内层多一个 5 日求和,是近邻写法,但控制谱与对 head 1 的残差不同(市值 0.41 对 0.31,残差 0.44 对 0.49),放行;alpha 来自离散度,即波动的波动。6 与 7 是短窗相对长窗的对数差与 z 分数,与 vol、rev 控制的 |ρ| 在 0.35 到 0.44 之间,alpha 来自近期粗糙度相对常态的偏离,风险是可能被波动控制的非线性项吃掉。8 是 cross_semistd_pos 与 cross_semistd_neg 对日度对数变化取的上下行半标准差之比,与 Bollerslev 式的上下行写法一致;alpha 来自冲击的不对称。9 是 120 日尾部均值的对数差;alpha 来自分布尾部形状。10 是 60 日峰均比;alpha 来自 60 日内的极端波动日。11 是 Close 版与 Vwap 版 DW 的对数差;alpha 来自买卖价差弹跳的占比。创新度给 4,不给 5:这些仍是同一条 DW(Vwap) 序列的不同泛函,1 与 2 的残差对 head 1 仍在 0.44 到 0.49。合理度给 4,逐个核对算子:cross_fangzheng = cross_mean + cross_stddev;cross_zscore 对窗口 sd 的相对量级有护栏;cross_semistd_pos 与 cross_semistd_neg 作用于日度对数变化,与理由一致;尾部均值与峰均比的分母都是正的均值(DW 大于 0,day_durbin_watson 保证分母大于 1e-8),没有近零分母;全部只用 t 日收盘前数据,t+1 才交易,无前视。热身期:rolling_windows 左填 NaN 而不剔除,前一年约占训练段 12% 的扩展窗口,不构成结果主要由热身期决定,不挡。log 对 |x| 小于等于 1e-9 返回 NaN 而不是下限截断,存活种子覆盖率不低于 0.996,不构成问题。批内成员的外围逐字比对未做(按任务说明不读共性表),由 GP 的骨架禁令兜底。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [4, 9]
    reasons: '位 b 为 N 新想法,不适用核心门槛。自动规则:没有种子原始 |ρ| 大于等于 0.7(最大 0.37),没有控制 |ρ| 大于等于 0.8(最大 0.52,种子 5 的流动性),没有自动划掉。划掉 9:流水线已判废品,覆盖率 0.859,原因是数学问题(定义坏掉)。代码上,cross_reg_tvalue 的预测变量是第一个参数,即 DW(开盘 30 分钟);rolling_ols 里 var_x 是 120 日离差平方和(不除以窗口长度),beta 在 var_x 小于等于 EPS(1e-9)时返回 NaN,t 值的 se 分母也是 var_x 加 EPS。分段 DW 的量级约 1e-6 到 1e-5,120 日离差平方和正好落在这个绝对阈值附近,所以缺失是系统性的,集中在开盘段粗糙度波动小的股票窗口;t 值也不再对 DW 的单位不变。划掉 4:它与种子 1 的控制谱几乎相同(流动性 0.369 与 0.369,已知族 0.331 与 0.331,市值 0.002 与 0.003;对 head 的原始 |ρ| 0.30 与 0.30,残差 0.35 与 0.36),只是把 cross_mean(·,60) 换成 cross_ema(·,30),是同一个信号的换写法,属于重复。放行 1、2、3、5、6、7、8、10、11。逐个说明(如果有 alpha,最可能来自哪里):1、2、3、5、6、7 是开盘段、尾盘段与盘中段 DW 的对数差或份额,7 是 Close 版,与 1 的控制谱有差别(市值 0.14 对 0.00);alpha 来自参与者构成的慢变差异,即隔夜信息密集与被动调仓之别。6 是段间差的 120 日标准差,alpha 来自这个差的稳定性。8 是开盘粗糙度与隔夜缺口 |开盘/昨收 − 1| 的 120 日相关,alpha 来自单位隔夜消息引出的开盘价格发现。10 与 11 是尾盘粗糙度与 14:29 前累计收益的相关(10 带号,11 取绝对值),alpha 来自尾盘追涨杀跌与被动调仓的差异。创新度给 4:各候选都不是 head 的换皮(原始 |ρ| 0.09 到 0.36,残差 0.06 到 0.36),分段比与尾盘相关是新的读法;不给 5,因为 1、2、3、5 的控制谱偏向流动性与已知成交族(0.21 到 0.52),残差后虽然下降,仍不是纯新信息。合理度给 4:in_slice(x, s, e) 取 x[:, s:e+1],开盘、盘中、尾盘分别是 30、180、30 根 bar;段内 DW 为 ΣΔ²/ΣP²,对价格尺度不变,段长不同只产生 (n−1)/n 的常数偏移(log 比约 −0.03),对截面排序无影响。缺口用 ts_delay(day_last(Close),1),即前一交易日收盘,无前视;种子 10、11 的尾盘 DW 与 14:29 前累计收益都是 t 日收盘前的数据,t+1 才交易。cross_corr 的分母是 sqrt(var·var) 加 EPS,绝对 EPS 在 DW 量级下只让低波动票的相关向 0 收缩几个百分点,不构成支配;|gap| 的 Pearson 相关对新股与复牌的单日极端值敏感,是小样本风险,不构成数学问题。'
R:
  - head: 'cross_fangzheng(ts_sum(day_durbin_watson(Vwap), 10), 241)'
    soundness: 4
    reasons: 'R 组评合理度 4。7 个变体依次为:去掉均值只留标准差(v1)、变异系数(v2)、上行半标准差(v3)、High 版(v4)、滞后 20 日自相关(v5)、峰均比(v6)、尾部对数差(v7)。算子逐个核对:cross_stddev 与 cross_mean 为 nan 忽略的滚动统计;v2、v6、v7 的分母是 241 日 ts_sum(DW) 的正均值,没有近零分母;v3 作用于日度对数变化;v5 的滞后 20 大于 10 日求和的窗口,没有重叠。机制说得通:均值是水平,与波动控制同向,标准差混了水平与形态,去掉或除掉水平的方向是对的。提醒:v4 与 head 的原始 |ρ| 为 0.98,是换字段不换信息,替换只是改名;v1 保留了水平项(vol 控制 |ρ| 0.43),是回到水平的风险,不是数学问题。已知族 |ρ| 全部小于 0.5(最大 0.15)。'
  - head: 'ts_sum(day_durbin_watson(Low), 20)'
    soundness: 4
    reasons: 'R 组评合理度 4。4 个变体依次为:High 版(v1)、241 日 fangzheng 的 High 版(v2)、High 与 Low 两路径 DW 的 20 日和的对数差(v3)、同一对数差的 120 日均值(v4)。v1、v2 的依据是姊妹 head 的经验(Low 换 High 好 0.24)和窗口符号翻转的观察,机制是快窗口的换手与只看一侧,说得通,算子也没有问题。提醒:v1 与波动控制的 |ρ| 为 0.93,等于换了一个波动水平代理,需要靠奖励去掉 vol 的线性与非线性项来检验,不是数学问题。v3、v4 的机制写成上下冲击的不对称(Bollerslev 式),但 High 与 Low 是价格包络而不是带符号的收益半方差,对数差主要反映分钟内区间与弹跳的不对称,机制比算子实现的说得更强。这是合理度的扣分点,但没有数学问题,不压到 3 以下。已知族 |ρ| 全部小于 0.25。'
  - head: 'sqrt(ts_scale(ts_sum(day_durbin_watson(Volume), 20), 40))'
    soundness: 4
    reasons: 'R 组评合理度 4。3 个变体依次为:120 日 z 分数(v1)、20 日均值比 120 日均值(v2)、EMA(5) 减 EMA(60)(v3)。v1、v2 是无量纲的自标准化:v1 的分母是窗口标准差加 EPS,窗口整体不变时返回 0;v2 的分母是正的 120 日均值。head 的 ts_scale 是 x 除以 40 日窗口和(scale_last_ratio),与 v2 的「短窗相对长窗」是同一思路;机制(基线过短、过快)与拆解表(去掉 ts_scale 掉 0.56)一致。提醒:v3 是 DW 单位的差而不是比值,水平会进入(vol 控制 |ρ| 0.42),是量纲上的弱点,不是数学问题。DW(Volume) 在停牌日为 NaN(分母不大于 1e-8),不是 0。已知族 |ρ| 全部小于 0.5(最大 0.36)。'
summary: 'a 位(E)与 b 位(N)都通过审计,创新度与合理度均为 4,划完分别剩 8 与 9 个种子;a 划掉 3、4、5、12,b 划掉 4、9;三个 R 组合理度均为 4 且无数学问题;关键两点是 b9 的废品来自 rolling_ols 的绝对 EPS 阈值与 DW 量级冲突(覆盖率 0.859),a5 是 head 1 在残差空间的换皮(残差 0.74,原始仅 0.21)。'
