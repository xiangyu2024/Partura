slots:
- type: E
  core: day_durbin_watson(Vwap)
  hypothesis: '机制:核心 C0 = day_durbin_watson(Vwap)。DW 是 Σ(ΔP)² / ΣP²(不去均值);价格在一天里几乎不动时,它等于「每分钟平方收益的均值」,所以
    C0 就是用分钟 Vwap 路径算的当天已实现方差,无量纲。本批 9 个成员全是它的平滑(ts_sum 10 / 20、cross_fangzheng、嵌套求和)。拆解表读出三件事:(1)
    唯一不太差的 head 是 cross_fangzheng(ts_sum(C0, 10), 241),−1.16(train −1.16 / valid −0.51);窗口
    120 → −1.36,482 → −2.06,241 是局部最好。(2) ts_sum 不承重:去掉后是 −1.08,比有它还好;单独的 C0 与 ts_sum(C0,
    10) 是 −3.20 与 −3.48,所以承重的是「一年窗口上的均值 + 标准差」这一层,不是 10 日平滑。(3) Vwap 换成 Close 几乎不变(−1.36,valid
    −0.49),所以读到的不是 Vwap 特有的微观结构,而是已实现方差在一年里的形态。已实现方差的水平是波动控制(20 日 std(Ret) 均值)的亲戚,会被奖励吃掉;没被吃掉的是它的「形态」,这是这个
    E 位要试的:离散度(波动的波动;Baltussen 等 2018 报告波动不确定性高的股票后续收益偏低)、持续性(日度自相关:信息是连续流入还是一阵一阵事件驱动)、短长期限结构(最近
    10~20 日相对一年是收缩还是放大)、上行与下行冲击的不对称(Patton-Sheppard 2015、Bollerslev 等 2020 的好坏波动)、分位尾部形状(高波动日均值对低波动日均值)、Close
    版本与 Vwap 版本的差(买卖价差反弹噪声占比)。

    算子怎样实现:每个种子原样带着 C0,外围只用日轴算子(cross_*,窗口 5 ~ 241 日)把「水平」换成「形态」:cross_stddev ÷ cross_mean(变异系数,水平被除掉);cross_autocorr(滞后
    1 日 / 5 日);短窗均值 ÷ 长窗均值(及对数差、cross_zscore);cross_semistd_pos 与 cross_semistd_neg
    的对数差;cross_tail_mean_q75 与 q25 的对数差;cross_max ÷ cross_mean;Close 版与 Vwap 版的对数差。

    为什么和以前不一样:快照里所有含 C0 的外围都是「求和」或「均值 + 标准差」这两类水平加总(ts_sum、cross_fangzheng、二者嵌套)。没有一个把它除以自己的均值、取日度自相关、做期限结构、或拆成上行
    / 下行。12 个种子的骨架逐个用 AlphaCube 的 skeleton_key 与 members.csv 里 5583 个骨架核对过,都不在两个库里。与三个
    head 的区别:head 读水平(与已知成交额族 ρ −0.11 ~ 0.24,但与波动控制必然同向);这里的种子都是无量纲的形态量,水平被除掉或被差分掉。

    为什么样本外还会在:读的是「这只股票的波动自己怎么波动」这个慢变的个股性格(参与者构成:追涨杀跌的散户脉冲对稳定的机构流;涨跌停、停牌、消息事件的频率),窗口
    60 ~ 241 日,名次几个月不变,换手低。这也是本批里窗口最长的那个 head 最不差的原因:最慢的版本最不被 15 bp 成本吃掉。风险(事先写明):这一族可能仍然是波动水平的代理(例如变异系数与水平负相关),那样会被波动控制的非线性项吃掉;也可能只是噪声。

    数学检查:C0 在一天里有效点少于 2、或整行为常数(涨跌停封板、停牌)时是 NaN,这是窄的、已知的缺失;C0 数量级约 1e-7 ~ 1e-5,大于 log
    的下限 1e-9,所以 log 不会把它们变成 NaN 块;所有比值的分母都是正的均值 / 尾部均值 / 半标准差(要求 ≥3 个有效日),没有近零分母;窗口都
    ≥ 5 且主要 ≥ 60 日,热身期只占样本很小的一段;无前视:全部用 t 日收盘及以前的数据,t+1 才交易。已知的算子行为:cross_corr / cross_autocorr
    在窗口没有有效对时返回 0 而不是缺失,只影响刚上市 / 复牌的少数股票。'
