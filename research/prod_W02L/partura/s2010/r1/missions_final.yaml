- type: N
  hypothesis: '机制:一天里「价格路径在什么时段最粗糙」。本批所有成员都在整天的 Vwap / Low / Volume 路径上读一个 DW,整天的
    DW 把开盘、盘中、尾盘三段混成一个数;而三段的参与者不同:开盘半小时是隔夜信息与集合竞价后的价格发现,盘中是常规流动性交易,尾盘(含收盘集合竞价)是被动资金调仓、情绪化追价与可能的收盘价操纵(Admati-Pfleiderer
    1988 的日内模式:自主型流动性交易者与知情交易者集中在开盘与收盘)。想法:把一天切成开盘 [1, 30]、盘中 [31, 210]、尾盘 [211, 240]
    三段,各算一次 DW(每段内是每分钟平方收益的平均,所以三段可以直接相比,无量纲),再看「哪一段更粗糙、这个分配是否稳定、它与隔夜缺口 / 当天走势怎么联动」。

    算子怎样实现:day_durbin_watson(in_slice(Vwap, 1, 30)) 为开盘段 O,in_slice(Vwap, 31, 210)
    为盘中段 M,in_slice(Vwap, 211, 240) 为尾盘段 C;(a) 段间对数差 sub(log(O), log(M))、sub(log(C),
    log(M))、sub(log(O), log(C))、有界的份额 O ÷ (O + C),再用 cross_mean(60 ~ 120 日)或 cross_ema(半衰期
    30 日)变成慢变的个股特征;(b) 它的稳定性 cross_stddev(·, 120);(c) 开盘段粗糙度对隔夜缺口大小 |开盘 ÷ 昨收 − 1|
    的滚动相关 / t 值:「单位隔夜消息引出多少开盘价格发现」;(d) 尾盘粗糙度与当天走势(14:30 前累计收益及其绝对值)的滚动相关:尾盘的粗糙是追着当天涨跌走(追涨杀跌
    / 恐慌),还是与当天走势无关(被动调仓);(e) Close 版的开盘 / 盘中对数差,与 Vwap 版对照(Close 更吃买卖价差反弹)。

    为什么和已有的不同:库里 DW 的底只有整天(手写库统一用 in_slice(Ret, 11, 230) 掐头去尾)、或除以总量的份额;没有一个按时段切开再比,也没有把某一段的
    DW 与隔夜缺口、当天走势联动起来。11 个种子的骨架逐个核对,都不在两个库的 5583 个骨架里。与三个 head 比:head 读整天 DW 的水平,这里是段间比值或联动统计,都是无量纲,波动水平被除掉。与五个控制比:流动性、波动、市值是水平量;20
    日反转只有收益方向。

    为什么样本外还会在:来源是参与者构成的慢变特征(隔夜信息密度大、机构与分析师覆盖多的票,价格发现集中在开盘;散户与被动资金占比高的票,尾盘更粗糙),不是某段行情;窗口
    60 ~ 120 日,名次几个月不变,换手低。批里的现象支持「慢」:整天读数的符号在窗口之间来回翻(Low 的 ts_sum 窗口 20 取 −1、窗口 40
    取 +1),只有最长的 241 日窗口没那么差。风险(事先写明):段间比值可能和成交额分布(开盘 / 尾盘放量)同向,被已知成交额族与两个冠军吃掉。

    数学检查:各段 DW 在该段有效点少于 2 个、或整段为常数(涨跌停、停牌)时是 NaN;开盘 / 尾盘各 30 分钟,不是几乎为常数的面板;DW 数量级约
    1e-7 ~ 1e-5,大于 log 的下限 1e-9,对数差不会因为下溢变成 NaN 块;O ÷ (O + C) 的分母是两个非负量的和,只在两段同时为
    0 时缺失,取值落在 [0, 1],不会爆点;相关 / t 值类统计窗口 120 日,没有除以近零的量。无前视:缺口用 t 日开盘与 t−1 日收盘,尾盘与当天走势只用
    t 日 14:30 以前的收益,t 日收盘后才算出信号,t+1 才交易。已知的算子行为:cross_corr 在窗口没有有效对时返回 0 而不是缺失,只影响刚上市
    / 复牌的少数股票。'
