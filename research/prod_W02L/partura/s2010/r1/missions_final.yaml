R:
- head: cross_fangzheng(ts_sum(day_durbin_watson(Vwap), 10), 241)
  why: 烂的部件有两个,依据都在拆解表里。(1) cross_fangzheng = 均值 + 标准差:均值是波动水平,会被波动控制吃掉、只留下噪声,而且把水平和形态混进同一个数;去掉
    ts_sum 后分数不降反升(−1.16 → −1.08),说明 ts_sum 不承重,承重的是一年窗口。所以变体把「均值 + 标准差」换成纯标准差、变异系数(水平被除掉)、上行半标准差、峰值
    ÷ 均值、高 / 低波动日均值的对数差、滞后 20 日(大于 10 日窗口,避免重叠窗口造成的机械自相关)的日度自相关。(2) 底的价格字段:Vwap 换
    Close 几乎不变(−1.36),换 High 在姊妹 head(Low → High)上好 0.24,所以试一个 High 版;窗口 120(−1.36)与
    482(−2.06)都不如 241,所以窗口不动。数学上都有界:变异系数与峰均比的分母是正的一年均值,尾部均值取对数(下限 1e-9,DW 数量级 1e-7
    ~ 1e-5),半标准差要求至少 3 个有效日,无前视。
  variants:
  - cross_stddev(ts_sum(day_durbin_watson(Vwap), 10), 241)
  - div(cross_stddev(ts_sum(day_durbin_watson(Vwap), 10), 241), cross_mean(ts_sum(day_durbin_watson(Vwap),
    10), 241))
  - cross_semistd_pos(ts_sum(day_durbin_watson(Vwap), 10), 241)
  - cross_fangzheng(ts_sum(day_durbin_watson(High), 10), 241)
  - cross_autocorr(ts_sum(day_durbin_watson(Vwap), 10), 241, 20)
  - div(cross_max(ts_sum(day_durbin_watson(Vwap), 10), 241), cross_mean(ts_sum(day_durbin_watson(Vwap),
    10), 241))
  - sub(log(cross_tail_mean_q75(ts_sum(day_durbin_watson(Vwap), 10), 241)), log(cross_tail_mean_q25(ts_sum(day_durbin_watson(Vwap),
    10), 241)))
- head: ts_sum(day_durbin_watson(Low), 20)
  why: 烂的部件是「快」和「只看下沿」。依据:同一个式子换窗口符号就翻(窗口 20 取 −1,窗口 40 取 +1,窗口 10 取 −1),分数都在 −3 上下,是没有稳定方向的噪声;半衰期
    0 的快信号每天换手大,−2.6 里很大一部分是成本。拆解里 Low → High 好 0.24(−2.39),是唯一的正增益。变体:(1) 采用已验证的
    High;(2) 套上姊妹 head 里最有用的慢外层(241 日 fangzheng);(3) 把 Low 与 High 两条路径的 DW 做对数差:上沿路径与下沿路径的粗糙度之差是向上与向下冲击的不对称,无量纲、对水平免疫(Bollerslev
    等 2020 的好 / 坏波动的分钟版);(4) 用 120 日均值把它变慢。都有界,无近零分母(对数的下限 1e-9,DW 数量级 1e-7 ~ 1e-5),无前视。
  variants:
  - ts_sum(day_durbin_watson(High), 20)
  - cross_fangzheng(ts_sum(day_durbin_watson(High), 20), 241)
  - sub(log(ts_sum(day_durbin_watson(High), 20)), log(ts_sum(day_durbin_watson(Low),
    20)))
  - cross_mean(sub(log(day_durbin_watson(High)), log(day_durbin_watson(Low))), 120)
- head: sqrt(ts_scale(ts_sum(day_durbin_watson(Volume), 20), 40))
  why: 烂的部件是「自己的基线太短、太快」。依据:去掉 ts_scale 后从 −2.60 掉到 −3.17(必要性 +0.56),说明「当前 20 日 DW(Volume)
    相对自己近期常态」承重,不是水平本身;而基线窗口从 40 到 80 分数没变(−2.60 → −2.61),说明加长基线不伤;半衰期 5、每天换手大,−2.6
    里有成本。变体把基线换成更长且去掉硬窗口的写法:日轴 z 分数(120 日)、短窗均值对长窗均值(20 日 ÷ 120 日)、快 EMA 减慢 EMA。都有界:z
    分数的分母是窗口标准差加 EPS,窗口内整段不变时返回 0;比值的分母是正的均值;无前视。
  variants:
  - cross_zscore(ts_sum(day_durbin_watson(Volume), 20), 120)
  - div(cross_mean(day_durbin_watson(Volume), 20), cross_mean(day_durbin_watson(Volume),
    120))
  - sub(cross_ema(day_durbin_watson(Volume), 5), cross_ema(day_durbin_watson(Volume),
    60))
