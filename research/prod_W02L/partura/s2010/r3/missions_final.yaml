  hypothesis: '机制:核心 A = cross_delay(cross_delay(day_sum(in_slice(Ret, 1, 210)), 1),
    1) = 两个交易日前「14:30 以前」的累计分钟收益(量级 1e-3 ~ 3e-2,每天一个数,取值有界,无近零分母)。本流第 2 轮 E 位唯一的 head
    是 cross_corr(尾盘 30 分钟 DW, A, 241) = +0.51(train +0.70 / valid +0.51,半衰期 5);拆解:去掉一层
    cross_delay(滞后 1 天)降到 +0.19,再加一层(滞后 3 天)是 +0.36,A 单独(只当截面信号)是 −5.35,所以 A 不是自己有
    alpha,而是「它与某个同日路径统计的 241 日时间序列相关」里读到的东西;共性表里含 A 的 6 个候选均值 −0.71 对 −2.34(差 +1.63,p
    0.002),含 A 的一层滞后版本 13 个、+1.26。我的读法:alpha 来自「个股对两天前收益的反应系数」这个慢变特征(情绪 / 持仓被动再平衡在
    T+2 才进入价格路径的粗糙度),而 DW(尾盘)只是被试过的第一个搭档;滞后结构 +0.19 / +0.51 / +0.36 的非单调也可能只是估计噪声,所以本位把搭档整体换掉来检验。


    本位要试的外围(不再是「尾盘 DW 的同日 Pearson 相关」):(a) 换成别的当天微观结构搭档:尾盘已实现波动 day_std(Ret)、尾盘成交额占全天份额、Close
    版尾盘 DW、整天无关的盘中 DW(31 ~ 210)、开盘 30 分钟 DW、14:30 前收益的 AR(1)(种子 1、2、3、9、10、11);(b)
    换成当天收益本身作搭档:尾盘收益、开盘 30 分钟收益、全天绝对收益、隔夜缺口(种子 4、5、6、8、12),读的是「两天前的涨跌对今天价格行为的传导」;(c)
    换耦合写法:cross_regbeta(A, cs_rank(D), 241)(把 A 当回归元,A 的量级远大于 rolling_ols 的绝对阈值 1e-9)、双边
    cs_rank、对 A 取 sign、cross_cov 再除以均值(种子 4、7、9、13)。


    为什么和以前不一样:快照里含 A 的 6 个候选全是 cross_corr(DW(尾盘), A 的变形, 241 或 120 / 482),外围只是滞后层数与耦合函数(corr
    / cov);没有一个换掉 DW 搭档,没有回归斜率、sign、cs_rank 或「除以均值」的写法。库的 5583 条表达式里 cross_delay 只与
    1 条同现,cross_corr / cross_regbeta 与 in_slice 的日轴耦合几乎没有;种子骨架(day_std、成交额份额、Close
    的 DW、AR(1) 等搭档的组合)都不在库里。与 10 个 head 的区别:其余 head 读 DW / AR(1) 的水平与离散度,A 本身不读水平,读的是跨日时序耦合。


    为什么样本外还会在:读的是个股对过去收益的反应系数,是持仓结构(散户 / 机构占比、T+1 下的持仓年龄)这类慢变量,窗口 241 ~ 482 日,名次几个月不变,换手低;不依赖某段行情的方向,因为相关系数去掉了均值与幅度。风险(事先写明):相关估计误差约
    0.06,与截面离散度相当;滞后 2 的非单调可能是噪声,那样换搭档后整体会掉到 −1 以下。


    数学检查:全部是日轴窗口 241 的相关 / 协方差 / 回归斜率,无除以近零量(cross_cov 再除的是窗口内正均值,0 / 0 只给 NaN);A
    在上市后前两日是 NaN,为窄缺失;cross_corr 在窗口无有效对时返回 0 或 NaN,只影响新股 / 复牌;无前视:A 是两天前的收盘前数据,搭档全是
    t 日收盘及以前的数据,t+1 才交易。'
