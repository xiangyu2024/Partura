R:
- head: cross_stddev(ts_sum(day_durbin_watson(Vwap), 10), 241)
  why: 烂的部件有两个,依据在第 1 轮 R 结果与本轮拆解里。(1) 头 1 现在是 cross_stddev(ts_sum(DW(Vwap), 10),
    241) = −0.15(train −0.15 / valid −0.10,与已知族 ρ −0.15),比原来的 cross_fangzheng(= 均值
    + 标准差)好 1.0:「均值」这一项(水平,与波动同向)是拖后腿的部件,拿掉后离 0 只差 0.15;但保持「水平 vs 形态」的写法全部比它差(变异系数
    −1.77,尾部分位对数差 −0.60,峰均比 −1.83,半标准差 −1.21,滞后 20 日自相关 −1.38),说明它读到的是「一年里已实现方差的绝对离散度」中既不是水平也不是纯形态的那一部分。(2)
    这一部分混有两个我还没拆开的成分:一天里哪一段在贡献(整天 DW 把开盘 / 盘中 / 尾盘混成一个数),以及全市场共同的波动区制(raw 标准差里有大盘波动一起变的成分)。变体因此一次只改一个部件:(a)
    只取尾盘 / 开盘 / 盘中的段(变体 1 ~ 3,与本轮 E / N 位的发现对照);(b) 把方差换成波动率的平方根(变体 4)以降低尖峰的权重;(c)
    ts_sum 窗口 10 → 5 / 20,或换成 EMA(变体 5、6、10);(d) 只做部分归一化,标准差 ÷ √均值(变体 7,介于已知的 −0.15
    与变异系数 −1.77 之间);(e) 先去掉市场共同成分再取离散度:截面名次(变体 8)与减截面均值(变体 9)。数学上都有界:均值是正的,sqrt 作用于非负量,cs_rank
    取值 [0, 1],无近零分母;DW 数量级 1e-7 ~ 1e-5,大于 log 的下限 1e-9(本组没有用 log);无前视。
