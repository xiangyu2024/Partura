- type: N
  hypothesis: '机制:个股日内「收益在时间上的接力」,作为慢变的个股特征。把一天切成开盘 30 分钟 A = day_sum(in_slice(Ret,
    1, 30))、盘中 M = day_sum(in_slice(Ret, 31, 210))、14:30 前 P = day_sum(in_slice(Ret,
    1, 210))、尾盘 30 分钟 T = day_sum(in_slice(Ret, 211, 240)),估计「上午 / 盘中的方向对尾盘收益是延续还是回吐」,以及「昨日尾盘对今日开盘的传导」,用
    120 ~ 241 日的时间序列相关、斜率、sign 条件协方差。两种力量方向相反:延续(机构拆单 / 程序化交易的足迹,信息被逐步吸收:Heston-Korajczyk-Sadka
    2010 报告日内半小时收益在日间同一时刻持续,Gao-Han-Li-Zhou 2018 报告市场级日内动量,开盘半小时预测最后半小时)与回吐(买卖价差弹跳、散户追涨后的获利了结)。个股哪一种占优由持仓结构决定,所以是慢变的;A
    股 T+1 下当天买入的人当天不能卖,尾盘抛压只来自旧持仓,延续系数在涨日与跌日不对称,sign 条件协方差读的就是这个方向性。


    启发(哪一批的什么现象):本流快照 84 个已评分候选里,子树 day_sum(in_slice(Ret, 1, 210)) 出现在 17 个里,均值 −1.37
    对不含的 −2.87(差 +1.50,p 0.000);第 1 轮 N 位里分数最高的 +0.13 是 DW(尾盘)与它的 241 日相关;但它只被当作「搭档」,从没有和尾盘收益本身配对;而第
    1 轮的「水平 / 段间比」写法一个都没进前 5(−0.53 以下)。B028 / B029 合起来的另一个现象:B029 的 41 个成员几乎全是 day_ar1_coefficient(Volume)(与
    High)的各种保序包装(sigmoid / pow / cs_rank / ts_decay_linear / ts_min),本流里最好的 3 个是 −2.13
    ~ −2.34,含这些包装的候选均值 −3.1 ~ −3.4,拆解里去掉单个外壳部件分数变化都在 ±0.25 以内,只有窗口变慢才有用(ts_quantile_q75
    窗口 25 / 50 / 100 = −2.81 / −2.33 / −1.65):路径统计的「水平」被控制吃掉,只剩「更慢」;耦合系数是另一类对象,水平是被减掉的。


    算子怎样实现:cross_corr / cross_regbeta(预测量先于被预测量:第一个参数是回归元)在两个日度收益切片上滚动 120 ~ 241 日;cs_rank
    版本(种子 9、10)先在截面上把 P、T 变成相对同行的名次,再做时间序列相关,把「大盘当天一起涨跌」的共同成分去掉,留下个股特有的延续;sign 条件协方差(种子
    5、6、7)cross_cov(sign(上午方向), 尾盘收益, 241) ÷ cross_mean(|尾盘收益|, 241),方向用 sign 所以涨停等极端上午收益不起作用,cross_cov
    已去均值所以不含「上涨日占比」这个动量项,除以平均绝对尾盘收益后无量纲、有界;种子 13 把「上午分钟收益 AR(1)(路径是在趋势还是在回头,B029 的
    AR(1) 对象换成收益)」乘上上午方向再与尾盘收益相关;种子 12 用尾盘收益路径的 DW(≈ 2(1 − 一阶自相关))与上午收益相关;种子 14 用昨日尾盘收益与今日隔夜缺口的相关。


    为什么和库里已有的不同:库里 5583 条表达式中,cross_corr / cross_regbeta / cross_cov / cross_reg_tvalue
    / cross_regres 与 in_slice 同现的只有 1 条(B234 的手写式,是分钟 regres 的条件均值,不是日轴耦合),与 cross_delay
    同现的 1 条;in_slice 在库里几乎都是掐头去尾(16 ~ 225、2 ~ 237、11 ~ 230 等),没有一个把一天切成开盘 / 盘中 / 尾盘再对两段的收益做时间序列耦合。14
    个种子的骨架逐个用 AlphaCube 的 skeleton_key 与 members.csv 的 5583 个骨架核对过,都不在库里。与 6 个 head
    的区别:head 读 DW / AR(1) 的水平、离散度与包装,这里完全不读 DW(除种子 12);与五个控制的区别:20 日反转只读收益方向的累计,这里是日内两个时间切片之间的耦合系数,不是水平。


    为什么样本外还会在:来源是持仓结构与交易习惯这类慢变量(机构程序化占比、散户占比、T+1 约束下的持仓年龄),不是某段行情;窗口 120 ~ 241 日,名次几个月不变,换手低,这是这把尺子里唯一不被
    15 bp 吃满的形态。风险(事先写明):(i) 估计误差约 1/√241 = 0.06,与截面离散度相当,名次大半可能是噪声;(ii) 原始收益的耦合含个股对大盘日内走势的
    beta,与波动 / 市值控制有交互(cs_rank 版本去掉了大盘共同成分,用来对照);(iii) 上午方向被涨跌停封板的股票(尾盘收益恒为 0)会给出
    NaN 或 0,只影响少数票。


    数学检查:A、M、P、T 是各段分钟收益之和(量级 1e-3 ~ 3e-2),无近零分母;cross_regbeta 的回归元是 P 或 A(窗口内 var_x
    约 1e-3 ~ 1e-1,远大于 rolling_ols 的绝对阈值 1e-9);sign 条件协方差的分母是窗口内平均绝对收益,只在整个窗口收益恒为 0(一字板)时为
    0,此时分子也恰为 0,得到 NaN 而不是 inf;种子 13 中 day_ar1_coefficient 在 14:30 前收益平方和 > 1e-8(约
    2e-4)时才有值,与 B029 里的同一算子;缺口用 t 日开盘与 t−1 日收盘(cross_delay 取前一交易日),无前视;全部用 t 日收盘及以前的数据,t+1
    才交易。已知的算子行为:cross_corr / cross_cov 在窗口没有有效对时返回 0,只影响刚上市 / 复牌的少数股票。'
