  core: day_durbin_watson(in_slice(Vwap, 211, 240))
  hypothesis: '机制:核心 C = day_durbin_watson(in_slice(Vwap, 211, 240)) = 最后 30 分钟(14:30
    ~ 15:00)分钟 VWAP 路径的 Σ(ΔP)²/ΣP²,即「尾盘 30 分钟的相对已实现方差」(价格尺度约掉,每天一个值,量级约 1e-8 ~ 1e-5;这一段整行为常数,如涨停封死或停牌,则是
    NaN)。


    本流的证据(都是 train / valid):(1) 第 1 轮 N 位 70 个已评分候选里分数最高的一条是 cross_corr(C, day_sum(in_slice(Ret,
    1, 210)), 241) = +0.13(train +0.40 / valid +0.13,半衰期 5),同一骨架换成 in_forward_valid_part(High)
    字段、窗口 120、或换搭档之后掉到 −0.23 ~ −0.53;(2) 含 C 的 9 个候选均值 −1.02,不含的 −2.75(差 +1.73,p 0.0001);(3)
    第 1 轮同位置里 C 的「水平 / 段间比值 / 份额 / 稳定性」写法(开盘 ÷ 盘中、尾盘 ÷ 盘中的对数差,O ÷ (O + C),120 日标准差,Close
    版,共 6 个种子)一个都没有进前 5(第 5 名是 −0.53)。所以我读到的是:这个核心的信息不在水平里,在它与「当天别的价格行为」的耦合里;耦合的写法只被试过一种,即同一天的
    Pearson 相关。


    本位要试的外围(不再是同日相关),实现的是四类机制:

    (a) 领先 - 滞后(Llorente 等 2002 的「量 - 价跨日先后」思路,这里换成路径粗糙度):昨天尾盘的粗糙度 cross_delay(C,
    1) 与今天收益 / 今天绝对收益 / 今天隔夜缺口的 120 ~ 241 日滚动相关与回归斜率(种子 1、2、3、6、7、12)。回归元用 log(C)
    或 cs_rank(C),使 rolling_ols 的绝对阈值 var_x > 1e-9 不会因 C 的 1e-6 量级把斜率整体变 NaN(上一轮审计抓到过这个坑)。

    (b) 带符号的条件协方差(种子 4):cross_cov(C, sign(14:30 前收益), 241) ÷ cross_mean(C, 241),读「尾盘粗糙度是出现在涨日还是跌日」(杠杆效应
    / 追涨杀跌的分钟版)。sign 取代幅度,涨跌停带来的极端收益不起作用;cross_cov 已去均值,所以不含「一年里上涨日占比」这个动量项;再除以均值,波动水平被约掉,取值有界。

    (c) 别的搭档(种子 5、8、9、10):昨日 14:30 前收益对今天尾盘粗糙度(滞后一天的杠杆效应)、尾盘成交额占全天的份额(粗糙度有没有成交量撑着:知情
    / 被动调仓 vs 薄盘面的买卖价差弹跳)、开盘 30 分钟及盘中的粗糙度与尾盘粗糙度的联动(信息是整天持续到达还是尾盘特殊资金)。

    (d) 慢变残差(种子 11):把 log(C) 对当天 14:30 前绝对收益做 120 日回归,取残差再做 60 日平均,即「同样的价格波动下尾盘多出来的粗糙度」。


    为什么和以前不一样:快照里所有含 C 的候选外围都是 cross_corr(C, X, 120 或 241),X 是同一天的收益 / 成交额切片;没有 cross_delay(滞后)、没有回归斜率
    / t 值 / 残差、没有 sign 条件协方差、没有除以均值的无量纲化,也没有「尾盘成交额占比」「开盘 - 尾盘联动」这样的搭档。库里 5583 条表达式中,cross_corr
    / cross_regbeta / cross_cov / cross_reg_tvalue / cross_regres 与 in_slice 同现的只有
    1 条(B234 的手写式,是分钟 regres 的条件均值,不是日轴耦合),与 cross_delay 同现的 1 条;12 个种子的骨架逐个用 AlphaCube
    的 skeleton_key 与 members.csv 的 5583 个骨架核对过,都不在两个库里。与快照里 6 个 head 的区别:head 读整天或
    10 日 DW 的水平 / 一年标准差 / AR(1) 的包装,这里读尾盘一段与收益、成交的耦合系数,水平被相关 / 协方差 / 斜率去掉。


    为什么样本外还会在:读的是个股的慢变行为特征。尾盘半小时(含收盘集合竞价)是被动资金调仓、收盘价管理与追涨杀跌的散户集中的时段;A 股 T+1 下当天买入的人当天卖不出去,尾盘抛压只来自旧持仓,所以「涨日与跌日的尾盘粗糙度是否对称」反映的是持仓结构,不是某段行情。窗口
    120 ~ 241 日,名次几个月不变,换手低,这是这把尺子里唯一不被 15 bp 吃满的形态(本流读数:241 日窗口 +0.13 对 120 日窗口 −0.23)。风险(事先写明):(i)
    滚动相关的估计误差约 1/√241 = 0.06,与截面离散度相当,名次大半可能是噪声;(ii) 耦合强度可能与波动水平交互(尺子只去掉对控制的线性、平方、立方暴露,交互项去不掉)。


    数学检查:C 在该段有效点少于 2 个或整段为常数时是 NaN,是窄的、已知的缺失;log(C) 只在 C ≤ 1e-9(尾盘几乎纹丝不动的少数高价股)时为
    NaN,是窄缺失,不是 NaN 块;所有除法的分母都是窗口内的正均值(C 的均值、|收益| 的均值、全天成交额),0 / 0 只会得到 NaN 而不是 inf;cross_corr
    与 cross_cov 在窗口无有效对时返回 0 或 NaN,只影响刚上市 / 复牌的少数股票;窗口 120 ~ 241 日,热身期只占样本很小一段。无前视:全部用
    t 日收盘及以前的数据(领先 - 滞后种子只对回归元 / 搭档做 cross_delay,不做 cross_shift),t+1 才交易。'
