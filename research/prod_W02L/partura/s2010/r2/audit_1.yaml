slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [10]
    reasons: |-
      位 a 为 E 深挖,核心 C = day_durbin_watson(in_slice(Vwap, 211, 240))(尾盘 30 根分钟的 DW)。门槛:核心与 5 个控制的最大 |ρ| 为 vol 0.44(< 0.8);与 head 的最大 |ρ| 为 ts_sum(DW(High), 20) 的 0.39。核心是共性表第 20 行的子树(9 个候选含它;这一项只 grep 了该字符串核对,未通读共性表),满足 §2 的核心来源要求。12 个种子都原样含核心。
      自动划掉 10:cross_corr(尾盘 DW, 盘中 DW 31–210, 241) 与 head cross_stddev(ts_sum(DW(Vwap),10),241) 的原始 |ρ| 为 0.90(≥ 0.7),残差 0.84,库禁令会拒绝。其余种子没有触发自动规则(原始 |ρ| 最大 0.50;控制最大为 size 0.34 仅属种子 10,放行种子的控制最大为种子 9 的 liq 0.30)。
      新颖度给 4 不给 5:放行的 11 个种子中 9 个残差 |ρ| 在 0.05–0.30;5(残差 0.42)与 9(残差 0.52)仍与 head 有较强重叠;核心本身是 DW 族,与 head ts_sum(DW(High),20) 的 |ρ| 为 0.39,不是纯新信息。
      合理度给 4,逐个核对算子:cross_delay 沿日轴向后平移(later days see earlier values),无前视;cross_regbeta / cross_regres 的回归元是第一个参数(rolling_ols(x, y) 中 x 为回归元),与各种子的假设一致(种子 11 为 log C 对早盘 |收益| 的残差);cross_* 为因果滚动窗口(rolling_windows 左补 NaN,不取未来);log 只在 |x| ≤ 1e-9 时为 NaN,只影响极少数票;day_durbin_watson 的常数判断作用在输入价格上,尾段价格方差 < 1e-8(涨停封死、一字)时为 NaN,与 PI 所写的缺失一致;除法分母都是窗口内的正均值(C > 0 只要有效),无 inf;cs_rank 来自 common.rank,不经过 nanrank_last,不受其影响。
      数值点(记录,不挡):rolling_pair_reduce 的 cross_corr 分母是 sqrt(var_x·var_y) + EPS,EPS 为绝对值 1e-9,而 raw C 的时间方差远小于它。按 DW 约为 σ_d²/240、C 的时间变异系数约 0.6 估算(未实测),EPS 占分母的比例大约是:日波动 σ_d = 2% 时约 5%,1% 时约 30%,0.7% 时过半。因此 raw-C 相关种子(1、5、6、8)会对低波动票做单调收缩,把波动水平掺进排序。这只影响最低波动的少数票,σ_d 2% 的票只被收缩约 5%,不主导截面,不挡;换成 cs_rank(C) 或 log(C) 即可去掉。另外,cross_corr 在窗口无有效对时返回 0 而非 NaN,只影响刚上市或复牌的少数股票;前一年是部分窗口的热身段,噪声只会拉低 train 分(score 取 train 与 valid 中较差者),方向偏保守,不构成「结果主要由热身期决定」。
      逐个放行的种子(如果有 alpha,最可能来自哪里):
      1 cross_corr(昨日 C, 当日 Ret, 241):与 head 0.03、残差 0.05、控制最大 0.07;alpha 来自尾盘粗糙度对次日收益的领先关系(Llorente 式先后)。
      2 cross_regbeta(log 昨日 C, 当日 Ret, 241):与 head 0.10、残差 0.11、控制最大 0.08;与种子 1 的 head 相关和残差都不同(0.03/0.05 对 0.10/0.11),alpha 来自同一领先关系的标准化写法。
      3 cs_rank 版 regbeta(120 日):与 head 0.06、残差 0.06、控制最大 0.08;alpha 来自截面相对粗糙度的领先信息,去掉了绝对水平。
      4 cov(C, 早盘方向符号) ÷ mean(C):与 head 0.32、残差 0.25、vol 0.16;alpha 来自涨日与跌日尾盘粗糙度的不对称(杠杆效应的分钟版)。
      5 cross_corr(C, 昨日早盘收益):与 head 0.50、残差 0.42、liq 0.18;是本位最靠近 head 的放行种子。alpha 来自昨日早盘方向对今日尾盘粗糙度的延续;但 0.5 的高相关可能与上面的 EPS 收缩同源,需要在奖励里看它是否真的保留。
      6 cross_corr(昨日 C, |当日 Ret|, 241):与 head 0.29、残差 0.27、控制最大 0.07;alpha 来自尾盘粗糙度对次日绝对波动的预测。
      7 cs_rank 版 regbeta(120 日,回归 |Ret|):与 head 0.34、liq 0.19、known 0.18;alpha 来自粗糙度相对排名对次日波动幅度的预测;风险是与流动性的交互。
      8 cross_corr(C, 尾盘成交额占比, 241):与 head 0.32、残差 0.24、size 0.12;alpha 来自粗糙度与尾盘资金参与度的同步(知情或被动调仓 对 薄盘面弹跳)。
      9 cross_corr(log C_尾, log C_开, 241):与 head 0.51、残差 0.52、liq 0.30、known 0.28;放行,但它是本位与库最接近的放行种子之一。alpha 来自日内各段粗糙度共同的日波动体制(持续性),不一定是个股特有的。
      11 cross_mean(log C 对早盘 |收益| 的 120 日残差, 60):与 head 0.33(zscore 的 DW Volume 版)、残差 0.30、vol 0.25;alpha 来自尾盘粗糙度超出早盘绝对波动所能解释的部分(慢变的个股持仓结构)。
      12 cross_corr(昨日 cs_rank(C), 隔夜缺口, 241):与 head 0.41、残差 0.30、size 0.23;alpha 来自昨日尾盘粗糙度对隔夜消息的预测。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [2]
    reasons: |-
      位 b 为 N 新想法,不适用核心门槛。自动规则:没有种子的原始 |ρ| ≥ 0.7(最大 0.26,种子 12 对 head cross_stddev);没有控制 |ρ| ≥ 0.8(最大 0.25,种子 5 的 size);没有自动划掉。
      划掉 2(重复):种子 2 = cross_regbeta(早盘收益, 尾盘收益, 241),即 beta = corr × sd(尾盘) ÷ sd(早盘),与种子 1 = cross_corr(早盘收益, 尾盘收益, 241) 是同一个耦合的换写法。数字几乎相同:与 head ts_sum(DW(High),20) 的 |ρ| 为 0.160 对 0.164,残差 0.119 对 0.118;控制 liq 0.164 对 0.179、vol 0.165 对 0.166、known 0.165 对 0.179、size 0.190 对 0.196。只差一个个股的 sd 比例,与 r1 把 b4 划掉的理由相同。保留种子 1。
      其余放行 1、3–14。逐个说明(如果有 alpha,最可能来自哪里):
      1 cross_corr(早盘收益, 尾盘收益):与 head 0.16、残差 0.12、控制最大 0.19(size);alpha 来自个股日内收益接力的慢变持续性(Heston-Korajczyk-Sadka 式),也可能只是个股对大盘日内形态的 beta。
      3 cross_corr(开盘 30 分钟收益, 尾盘收益):与 head 0.08、控制最大 0.14;alpha 来自开盘与尾盘价格发现的同日耦合。
      4 cross_corr(昨日尾盘收益, 今日开盘 30 分钟收益):与 head 0.11、控制最大 0.11;alpha 来自尾盘收益对次日开盘半小时的传导(隔夜与日内之间)。
      5 cross_cov(sign 早盘, 尾盘收益) ÷ mean|尾盘|:与 head 0.12、size 控制 0.25(本位最高);alpha 来自涨日与跌日的尾盘延续不对称(持仓结构),需留意 size 的相关。
      6 同族,用开盘 30 分钟作条件:与 head 0.06、控制最大 0.18;alpha 来自开盘方向对尾盘的条件延续。
      7 cross_cov(sign 昨尾盘, 今开盘 30 分钟) ÷ mean|开盘 30|:与 head 0.10、控制最大 0.07;alpha 来自昨日尾盘方向对今日开盘的隔夜传导。
      8 cross_corr(盘中 31–210 收益, 尾盘收益, 241):与 head 0.17、控制最大 0.18;alpha 来自盘中与尾盘的中段延续;与种子 1 的差别在于去掉了开盘 30 分钟。
      9 cs_rank 版 cross_corr(早盘, 尾盘, 120):与 head 0.15、控制最大 0.12;cs_rank 去掉了截面共同成分,是种子 1 的对照;alpha 来自个股特有的早尾接力。
      10 cs_rank 版 cross_corr(开盘 30 分钟, 尾盘, 241):与 head 0.06、控制最大 0.06;alpha 来自个股开盘与尾盘的特有联动。
      11 cross_corr(|早盘|, |尾盘|, 241):与 head 0.12、控制最大 0.14;alpha 来自日内波动幅度的跨时段持续性(波动持续性,Patton-Sheppard 式)。
      12 cross_corr(早盘收益, DW(尾盘收益), 241):与 head 0.26(cross_stddev 的 DW(Vwap) 版)、残差 0.18、vol 0.15;alpha 来自早盘方向与尾盘收益路径粗糙度的同步。本位与 head 相关最高的一条,注意它与 DW 族的重叠。
      13 cross_corr(早盘 AR(1)·sign, 尾盘收益, 241):与 head 0.11、残差 0.13;alpha 来自早盘路径是趋势还是回头的分钟结构对尾盘的延续。
      14 cross_corr(昨尾盘收益, 隔夜缺口, 241):与 head 0.22、控制最大 0.11;alpha 来自昨日尾盘收益对隔夜缺口的传导(与 4、7 同族,但对象不同)。
      合理度给 4:机制(日内收益接力、耦合系数)与 Heston-Korajczyk-Sadka(2010)、Gao 等(2018)的文献一致。逐个核对算子:cross_corr / cross_cov 的 EPS = 1e-9 对收益和(量级 1e-2)无影响;sign 条件协方差被平均绝对值除,无量纲且有界(|cov| ≤ sd(尾盘));cs_rank 版本去掉截面共同成分。原始收益版本的耦合包含个股对大盘日内形态的 beta,这是可能来源之一,不是数学问题。day_ar1_coefficient 的 var > 1e-8 阈值在 210 分钟收益上远不触发;DW(尾盘收益) 在方差 < 1e-8(一字板)时为 NaN,与 PI 所写一致;全部用 t 日收盘前的数据,无前视。
R:
  - head: 'cross_stddev(ts_sum(day_durbin_watson(Vwap), 10), 241)'
    soundness: 4
    reasons: |-
      R 组评合理度 4。10 个变体:v1–v3 是尾盘、开盘、盘中段的 DW(Vwap) 版;v4 为 sqrt;v5、v6 为 ts_sum 5、20;v7 为除以 sqrt(均值) 的半归一化;v8 为截面 cs_rank;v9 为减截面均值;v10 为日轴 cross_ema(5)。逐个核对:cross_stddev 为忽略 NaN 的滚动标准差;DW 非负,sqrt 无问题;v7 的 sqrt(cross_mean) 分母为正(有效窗口内 DW 恒正);v8 的 cs_rank 取值 (0,1];v9 的 cs_mean 为同日截面均值、忽略 NaN;v10 为日轴因果平滑。无前视,无近零分母,无 inf。机制(去掉水平项、保留形态)与 r1 的结果一致。
      提醒但不挡:v4–v7、v9、v10 与原 head 的残差 |ρ| 为 0.96–0.99,实质是同一个东西的换窗口或换平滑写法;v1–v3 残差 0.74–0.92,vol 控制 |ρ| 约 0.38,仍贴近波动水平;v8 残差 0.45。这些是替换判定的问题,不是合理度的问题。
summary: 'a 位(E,核心为尾盘 DW)与 b 位(N)都通过:创新度与合理度均为 4;a 划掉 10(与 head 的原始 |ρ| 0.90,自动划掉),b 划掉 2(与种子 1 为同一耦合的换写法);R 组合理度 4,无数学问题。唯一需要记下的数值点:raw-C 相关(a 的 1、5、6、8)在低波动票上被绝对 EPS 收缩,不主导截面,不挡。'
