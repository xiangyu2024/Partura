- type: E
  core: day_std(pow_2(Ret))
  hypothesis: 核心 day_std(pow_2(Ret)) 是分钟收益平方的日内标准差,即波动率的波动率(收益平方序列的离散度,近似峰度 / 跳跃强度),不是波动率水平本身。
    本批 heads(含它的 cross_mean(..., 3) 两个,train -2.4 valid -2.6)都是用 3 日短窗口直接排名,方向为负,说明
    短窗口下它被「波动水平」与短期噪声主导,在新尺子里亏钱。这次不再让它兼任波动水平:(1)用 div(核心, pow_2(day_var(Ret))) 把 它按自身方差平方归一,得到近似
    sqrt(峰度-1)的无量纲厚尾度,波动水平被除掉,剩下的是「收益由少数几根大分钟驱动」的程度(跳跃 / 订单冲击特征,Amihud 式 的非连续价格发现);分母用
    replace_small_with_nan 避免近零爆点。(2)用 cross_ema 的 60~241 日长窗口把它变成慢变的股票特征,换手低、 15
    bp 成本吃不掉;(3)用 cs_bucket_rank 按 LogFloatCap 或成交额分桶后在桶内排序,让十分位书在每个规模 / 流动性桶里各取一份,新尺子只去掉
    控制的线性 / 平方 / 三次项,去不掉这种分桶后的非光滑结构;(4)短窗口减长窗口(5 日 EMA 减 120 日 EMA)度量厚尾度的近期变化, 是均值回复而非水平。和库里不同:库里只有「核心
    + 3 日平均」或套 sigmoid / sqrt / neg 的单调变换(新尺子下是同一个信号);这里改变的是 归一化、窗口量级和分桶,不是单调变换。为什么样本外还会在:跳跃
    / 彩票型厚尾特征带来的是对大涨大跌的偏好(MAX / 偏度效应),散户参与度高的票持续被高估, 是行为偏误而不是某段行情;长窗口排名换手小。数学上:分母为方差平方且
    replace_small_with_nan 处理,没有除以近零;全部为有界日频量。
