- type: N
  hypothesis: 涨跌停板归一化的极端日收益(MAX / 彩票效应的板块可比版本)。A 股主板涨跌停 10%、创业板 / 科创板 20%、ST 5%,日频字段
    LimitWidth 给出每只票当天的板宽。 日收益 r = Close_t / Close_{t-1} - 1(后复权收盘,当天收盘已知,无前视),除以
    LimitWidth 得到「离涨停有多近」:r / LimitWidth 在 +1 附近表示触及涨停, 这个量在不同板块之间可比,而原始 Ret 的极值是被板块宽度机械决定的(20%
    板天然极值更大,混入了板块信息)。机制:触及或逼近涨停的次数反映散户追涨、彩票偏好和 短期过度反应(Bali-Cakici-Whitelaw 2011 的
    MAX 效应在 A 股被放大);用 60~120 日的 EMA / 均值把它变成慢变的「涨停倾向」特征,用 is_gt 阈值计数得到频率, 用 cs_demean
    / 分桶处理方向。算子怎么实现:ts_delay 取前一日后复权收盘,div(LimitWidth) 归一,is_gt / is_lt 取阈值,cross_ema
    / cross_mean 做长窗口平均。 为什么和库里不同:本批 heads 全是 Ret / Volume 的日内离散度(波动的波动),没有一个用到日频的价格限制或隔日收益;控制里的波动、反转、流动性都不按板宽归一,
    所以板宽归一的极端度量不是它们的线性 / 平方 / 三次暴露。为什么样本外还会在:价格涨跌停制度和散户追涨的行为偏误是结构性的,不依赖某段行情;慢窗口排名换手低。
    数学上:LimitWidth 为正的常数量级(0.05~0.3),不接近零;全部为有界日频量;热身期只丢前一日。
  inspired_by: 第 1 批(day_std 一族,Ret / Volume 日内离散度)的 heads 全部亏钱:日内离散度被波动水平主导;换成日频的、按板块归一的极端收益是批里没有的维度。
