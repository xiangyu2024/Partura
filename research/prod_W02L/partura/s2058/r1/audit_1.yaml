summary: 'a 位通过(去掉与 R1 变体 8 字面重复的种子 1,剩 11 个种子,核心对控制的最大 |ρ| 0.66);b 位通过(去掉 2、3、7、8 四个门槛废品 / 常数面板种子,剩 5 个);两个 R 组合理。主要问题:a 位的「无量纲厚尾度」机制描述有误,除以的是方差平方,结果仍含 1/σ²,vol 相关 0.62–0.71 没有降下来,建议 PI 在笔记中更正;b 位 LimitWidth 是板块常数而非日频变化量,ST 的 5% 板宽不在立方体里,也需更正叙述。相关度表未包含两个冠军控制,这部分未核对。'
