R:
- head: day_sum(sigmoid(Vwap))
  why: sigmoid(Vwap) 在后复权价格水平较高时饱和到 1,day_sum 实际数的是「价格低于某阈值的分钟数」,主要是价格水平 / 上市久期,而不是价格变化;这个部件(绝对水平)是烂的。变体把价格换成相对自身历史或日内相对水平后再
    sigmoid,或延长平滑。
  variants:
  - day_sum(sigmoid(div(Vwap, day_last(Close))))
  - day_sum(sigmoid(sub(Vwap, day_mean(Vwap))))
  - cross_ema(day_sum(sigmoid(Vwap)), 20)
  - day_sum(sigmoid(Open))
  - cross_ema(day_sum(sigmoid(sub(Vwap, cross_mean(Vwap, 20)))), 20)
  - day_sum(sigmoid(div(Vwap, cross_mean(Vwap, 60))))
