- type: E
  core: day_quantile(cross_regbeta(Open, Amt, 241))
  hypothesis: 核心:对每只票,用过去 241 个交易日、同一分钟位置的(后复权开盘价 Open)对(成交额 Amt)做滚动一元回归,取斜率 beta,再取当天各分钟的中位数。后复权价格是累计收益的水平量,所以
    beta 的符号是「近一年里放量的时候价格是在涨还是在跌」,即量价趋势的确认度(量增价涨为正,放量下跌为负),是一个一年尺度的慢变量,换手很低。它在本批 91
    个候选里是唯一显著正富集的子树(含它的 4 个候选均值 -1.44 对不含 -2.34,p 0.025),而且这个核心与波动、流动性、反转控制不是同一个东西(beta
    是协动方向而不是水平)。第 1 轮含该核心的写法只有三种:cs_last_high40 分位词典序、嵌套 cross_regbeta、以及与 cross_ema(day_std(pow_2(Ret)),·)
    相减 —— 全是把核心与波动一族硬拼,分数 -1.2 ~ -1.4。本轮的外围完全不同,改为解决核心的两个结构性缺陷:(a)beta 的量纲是「价格 / 成交额」,所以高价股、大成交额股的
    beta 尺度被机械决定,用 div(核心, 价格水平) 或 cs_regres(核心, 价格 / 市值) 把尺度去掉,只留方向与相对强度;(b)beta
    是 241 日窗口的滚动量,相邻两天几乎相同,用 sub(核心, ts_delay(核心, 20/60)) 取它的「变化」(量价确认度在上升还是下降,是边际信息),或
    cross_zscore 对自身历史标准化;(c)按 LogFloatCap 分桶后桶内排序(cs_bucket_rank),让十分位多头在各规模桶内各取一份,新尺子只去线性
    / 平方 / 三次暴露,去不掉分桶结构。数学上:价格水平用 day_last(Open) 且为正的后复权价,无近零分母(除价格不除成交额);窗口全部取过去值(ts_delay
    / cross_delay),无前视。为什么样本外还会在:量价趋势确认(放量上涨的信息扩散、知情交易者随成交放大推高价格的持续性)是长期被研究的行为 / 微观结构机制,窗口一年、变化量
    20~60 日,换手低,15bp 成本吃不掉;它在 train 与 valid 都是批内最好的子树。
  seeds:
