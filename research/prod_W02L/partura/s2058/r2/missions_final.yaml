- type: N
  hypothesis: 隔夜 / 日内收益分解(overnight vs intraday)。日收益拆成两段:隔夜段 = 当日开盘价 / 前一日收盘价 - 1(day_open(Open)
    除以 ts_delay(day_last(Close),1) 再减 1),日内段 = 当日收盘 / 当日开盘 - 1。两个价格都是当日开盘或收盘已知的量,无前视;后复权价让除权日的跳空不会被误当作收益。机制:A
    股散户集中在日内交易,机构 / 信息交易者的建仓和情绪消化更多反映在集合竞价与隔夜,Lou-Polk-Skouras 式的「隔夜动量 / 日内反转」在股票层面表现为:近期隔夜收益累计高的票后续继续跑赢(隔夜段携带信息),近期日内收益累计高的票被散户追涨推高后反转。算子实现:cross_mean
    / cross_ema 对隔夜段与日内段在 20~120 日上做累计,sub 取两者之差(隔夜强而日内弱),cs_regres 用日内段累计去回归隔夜段累计得到「隔夜独有」部分,cross_zscore
    对自身历史标准化,cs_bucket_rank 按市值桶内排序。和库里不同:本流前两轮的 heads 全是分钟 Ret / Volume 的日内离散度或日收盘比(close/close),库里的收益类
    head 都是「收盘到收盘」的整日收益,没有把一天拆成隔夜与日内两段、也没有用 day_open(Open) 对前日 day_last(Close) 的跳空;整日收益
    = 两段之和,被反转控制覆盖的只是和,二者之差(以及各自的符号)与 20 日反转控制不是同一个暴露。数学上:分母是前一日后复权收盘价(正),分子是开盘价,无近零;停牌日
    Open / Close 缺失则该日缺失,不会形成伪值;热身期只丢前一日。为什么样本外还会在:散户日内追涨 vs 机构隔夜的参与者结构性分割,在 A 股 T+1
    与集合竞价制度下是稳定的,不依赖某段行情;长窗口累计换手低。
  inspired_by: 本流第 1 轮 N 位(涨停板归一的日收益,最好 -0.2,train 与 valid 近零)提示日频收盘到收盘的收益维度没有 alpha,而第
    2 批的共性子树里全是 day_last(Close) 的日比值(含 LimitWidth 归一),完全没有区分隔夜与日内;所以换成把同一天拆开的维度。
