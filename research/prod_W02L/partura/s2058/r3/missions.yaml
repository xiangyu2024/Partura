  - type: N
    hypothesis: >-
      流通股本变化(解禁 / 增发的供给冲击)。日频字段 LogFloatShares 是流通股数的对数,它只在发生解禁、增发、回购注销、限售股流通时跳变,与价格无关
      (LogFloatCap = LogFloatShares + 对数价格,所以对它求差是「纯股本变化」,价格水平被消掉)。机制:新增流通股是供给增加(解禁砸盘、定增 / 股权激励后减持压力),
      文献里的净发行异象(Pontiff-Woodgate、Loughran-Ritter)在股票层面是增发多的票后续收益低;A 股大量限售股分批解禁,时间点事先公开,
      但解禁后的抛压是持续消化的,几十到一百多个交易日。算子实现:sub(LogFloatShares, ts_delay(LogFloatShares, d)) 取 d 日股本变化率
      (d 取 20~120,只取过去值,无前视);cross_ema / cross_zscore 做平滑;cs_regres 对 LogFloatCap 取残差去掉规模效应;cross_max / is_gt
      计数跳变的次数与最大幅度;sub(LogTotalCap, LogFloatCap) 是对数的限售比例(总市值减流通市值),是「还有多少未流通股压着」的存量版本,
      cs_regres 对 ListAge 取残差去掉上市久期。和库里不同:本流 heads 与前两轮所有候选全是分钟价量的日内统计、收盘比值或 Amt 的结构,
      没有一个用到股本字段;控制里的流动性是成交额、市值是 LogFloatCap(水平),都不是股本的「变化」,
      股本变化在大多数日子是 0,只在事件日跳变,与成交额、波动、20 日反转没有机械关系,所以不是对它们的线性 / 平方 / 三次暴露。
      数学上:LogFloatShares 是有限的对数量,差分不会除以近零;大量日子差分恰好为 0,截面上有大量并列 —— 这是事件型信号的本质而非数值伪影
      (20~120 日窗口内有变化的票占比不低);热身期只丢前 d 日。为什么样本外还会在:解禁日历和增发是制度性的、持续发生的供给事件,
      散户与机构对供给冲击的消化速度不依赖某段行情;窗口长、换手低。
    inspired_by: 本流前两轮的 N 位(涨停板归一收益、隔夜 / 日内拆分)与全部 E 位都在价量序列里找 alpha 且全部落在 0 以下;本批唯一接近 0 的非价量候选是日频字段 cs_regres(ListAge, LogTotalCap)(valid +0.26),提示日频股本 / 上市信息这条线没被控制吃干净,而它里面最没被探索的是股本「变化」。
