    core: 'cs_bucket_zscore(day_quantile(cross_regbeta(Open, Amt, 241)), LogFloatCap)'
    hypothesis: >-
      核心(本批共性表里富集最强的子树,含它的 9 个候选均值 -0.46 对不含 -2.14,p 0.000):对每只票,用过去 241 个交易日同一分钟位置的
      后复权开盘价 Open 对成交额 Amt 做滚动一元回归取斜率 beta,再取当天各分钟中位数,最后在 LogFloatCap 分桶内做 z 分数。后复权价是累计收益的水平量,
      所以 beta 的符号是「近一年放量时价格是在涨还是在跌」,即量价趋势确认度;桶内 z 分数让每个市值桶各取一份,新尺子去不掉这种分桶结构。第 2 轮含该核心的
      候选只有三种外围:除以 cross_reg_fvalue / cross_regalpha / 自身 beta(最好 +0.16,train +0.49 valid +0.16,已接近线),
      以及再套一层分桶。本轮外围完全不同,改用「同一斜率与别的回归统计量 / 别的窗口 / 别的量的差或残差」:(a)beta 减去同样分桶标准化的 cross_corr
      (斜率里含波动尺度,相关系数不含,二者之差 = 价格波动相对成交额波动的比例,剥掉量价同步的强度);(b)beta 的 241 日对 60 日差分,度量确认度的近期变化;
      (c)用 cs_regres 把 beta 对 cross_reg_tvalue(显著性)或对波动做残差,留下「斜率大但不是由噪声显著性或波动产生」的部分;(d)把 Amt 换成 Volume
      与之相加,检验量价确认是否由成交额里的价格成分带来;(e)cross_ema / cross_zscore 做时间平滑或对自身历史标准化。算子上全部是 cross_reg* 家族、cs_regres、
      sub/add/mul、cross_ema 的组合,没有一个出现在第 2 轮的候选外围里。数学上:所有分量都是过去 241 或更短窗口的滚动量,无前视;分母处没有除以近零量(只用差、残差、
      乘积);分桶 z 分数在桶内标准差为 0 时由 AlphaCube 实现处理。样本外为什么还会在:慢变量(241 日窗口)换手低,15bp 成本吃不掉;量价趋势确认
      (知情交易者随放量推高价格的持续性)是长期被研究的微观结构机制,不依赖某段行情;该子树在 train 与 valid 都是批内最好,第 2 轮最好的外围在 valid 上与
      train 同向。
