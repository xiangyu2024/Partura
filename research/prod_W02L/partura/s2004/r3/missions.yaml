  core: div(day_cov(Ret, Volume), day_mean(Volume))
  hypothesis: 核心 D = div(day_cov(Ret, Volume), day_mean(Volume)),等于当天「成交量加权分钟收益」减「等权分钟收益」(恒等式 cov(R,V)/mean(V) = ΣR_tV_t/ΣV_t - mean(R_t)):放量分钟里价格涨还是跌,单位是收益,有界(≲ 15σ_R),停牌日 0/0 -> NaN,没有近零分母的爆点。这是 D 的第 2 个(也是最后一个)E 位。【本轮依据,读数来自上一轮 R 位】ts_skew(D, 120) = +0.56(train 0.56 / valid 0.79),ts_skew(D, 241) = +0.68(train 0.68 / valid 1.07),与已知族 ρ 0.02 / 0.08,与快照 head 4 的 ρ 0.34 / 0.24(<0.5,有别于该 head),已经过 gate;去 in_slice 首尾两根的 120 日版本 0.51 / 0.63(所以不是集合竞价);cs_demean 后的 80 日偏度只有 0.10 / 0.96,winsor 后 -0.13 / 0.61,说明偏度依赖未被剥掉的极端日 / 全市场共同日(推断:读的是个股参与全市场放量大涨 / 大跌日的程度,即对市场放量冲击的共偏度),cross_ema 慢化 120 日偏度 0.43 / 0.72。这三类读数都是 train 与 valid 同号为正、窗口越长越好(80 -> 120 -> 241:0.10 -> 0.56 -> 0.68 的 train),是目前本流最干净的线索;上一轮 GP(Pr2a)只在 D 外面试了截面处理 / 水平平滑 / 尾部均值(best -0.01),从没有让 GP 在 ts_skew(D, 长窗口) 附近生长。这些 R 读数没有被收录为 head,所以 GP 仍可在它们之上生长。【机制】D 的 241 日偏度 = 过去一年里大幅放量上涨日是否比大幅放量下跌日更多更极端(信息事件 / 注意力事件脚印,Gervais-Kaniel-Mingelgrin 2001 的 high-volume premium 的三阶矩版本);三阶矩是低频、低换手的个股属性,15 bp 成本下活得下来;与水平型控制(流动性、波动、市值、Amt 离散度)先天近似正交。【外围】都与上一轮 GP 看过的不同(它们是 cross_tail / cross_ema / cs_demean 的水平写法):(i) 偏度 120 / 241 / 极端值之和(ts_max + ts_min)/ 峰度;(ii) 用 60 日滚动均值去趋势后的偏度、用最近 60 日平均绝对值归一的偏度(消除波动状态的变化对三阶矩的污染);(iii) 先 5 日平均再取偏度(降噪);(iv) 对偏度做秩空间回归去掉自身离散度(ts_std(D, 241))或 120 日动量(只留下方向特征);(v) 偏度的变化(减 60 日前)、EMA、120 与 241 的秩加和(多尺度);(vi) 偏度 x 市值反向交互与 cs_flip_by_state 状态翻转;(vii) D 与日收益的 241 日相关(协偏度式读法)。种子均原样含 D。【样本外为什么还会在】三阶矩、慢变量、无量纲,在 train(2018-2023)与 valid(2024-2025)上同号;不靠某一段行情。已知风险:valid 一向比 train 好 0.2-0.4,所以 train 仍是约束,偏度对 head 4 的 ρ 若抬到 0.5 以上(窗口短 / 去趋势后)相关度表可能划掉几个。
