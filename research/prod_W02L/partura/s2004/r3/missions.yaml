  hypothesis: 核心 C = cross_regalpha(day_quantile(Vwap), day_quantile(High), 15),原样取自快照 head 6(M2 批,score -0.75)里 ts_regbeta(neg(day_cov(Low, Close)), C, 10) 的第二个参数。C 是「日内 Vwap 分位价对 High 分位价」的 15 日滚动回归截距:在回归斜率之外,Vwap 相对 High 的成交价偏低多少(价格尺度上的收盘前成交重心 vs 最高价的偏移),是个慢变量。【本轮依据,读数来自上一轮 R 位,不是推断】去掉 head 6 里有害的 ts_cov(ar1, cross_cov 链, 20) 项并只把 ts_regbeta 的窗口拉长:regbeta 窗口 10 -> 30 / 60 时(其它不变)score 0.07 / 0.89;60 日版本 train 0.89 valid 0.91、与已知族 ρ -0.16、与原 head ρ -0.39;cross_regalpha 窗口 15 -> 60 的两个版本反而 -0.40 / -0.07,所以承重的是「C(15 日截距)在 60 日窗口里与 -cov(Low,Close) 的回归斜率」,不是越慢越好。这是本流里目前样本内最好、两段几乎相等的读数,它没有被收录为 head(R 位记录里 additions 为空),所以 GP 仍可在它外面长。【机制(推断)】ts_regbeta(y, C, 60) = 过去 60 日里,个股每日「-cov(Low, Close)」(日内最低价与收盘价的协动,后复权价位尺度 ≈ 价位 × 日内低点到收盘的修复幅度)对 C 的敏感度。斜率读的是「当 Vwap 相对 High 偏低(下跌尾盘 / 低位成交)时,下影 / 收盘修复是否更大」,即日内被抛压打到低位后买盘接回的弹性(流动性提供者补偿的个股版本),是个股特有的稳定行为参数,每日换手低;和 5 个控制不是同一个度量(控制只有水平 / 波动 / 反转 / 成交额离散度 / 市值,而这里是两个日内量之间的 60 日回归系数,不是量的水平)。【和库的区别】库里 B011 的 29 条全是 cross_cov(cross_min(neg(day_cov(F,F)),15), mul(day_autocorr_n1(High), day_std(Low)),10) 外壳,没有一条让 ts_regbeta 窗口超过 15 或脱离 cross_cov 链;这里的外围是:(i) 窗口 60 / 120 / 241 与 ar1 项(day_ar1_coefficient(Amt),成交额的日内自回归 = 活跃度持续性)的加和 / 秩加和;(ii) 把 -cov(Low, Close) 换成 -cov(Ret, Close) 或无量纲版(÷ 均价乘积,去掉价位尺度,检验承重的是不是价位);(iii) 回归斜率换成相关 / 截距 / 秩空间 / 剥离全市场的 C / 去 60 日均值的 C(检验是不是全市场共同的 Vwap-High 偏移在带着走);(iv) 慢 EMA、不同窗口之差(60 日斜率减 241 日斜率 = 斜率的变化)。种子均原样含 C 和 regbeta 里 -cov(Low,Close)。【样本外为什么还会在】读数是慢的回归系数而不是水平;train 与 valid 同为 0.9,不是一段行情的产物。已知风险:价位尺度仍可能是承重的(那就是后复权价位的长周期反转 / 动量,规则 4 不算问题,但会让相关度表里与 head 8/9 / 价位类控制的 ρ 抬高)。
