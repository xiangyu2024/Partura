R:
- head: ts_skew(day_cov(Ret, Volume), 40)
  why: '烂部件有两个。(1) 内层 day_cov(Ret, Volume) 被首尾两根集合竞价盖住(推断:第一根 Ret 恒为 0、首尾两根成交量是普通分钟的十几倍),skew
    读到的是「少数几天的尾盘推价」而不是订单流;

    拆解表的依据:Volume→Amt 只到 −0.82(valid −0.09),把窗口 40→20 变成 −1.67(valid −0.47),40→80
    才 −0.63(valid +0.05)——越长越好、换底几乎不变,说明分数来自罕见大日子的稀疏估计,窗口短时三阶矩噪声主导。

    (2) 三阶矩本身对单个极端日很敏感。变体:换成去掉集合竞价的连续竞价版(in_slice 1..239)的协方差 / 相关(验证 (1));换成 ÷ 成交量均值的无量纲版本;只读最后一根的「涨跌
    × 成交份额」;长窗口 + cross_ema 平滑;mask 掉极端 10%。'
  variants:
  - ts_skew(day_cov(in_slice(Ret, 1, 239), in_slice(Volume, 1, 239)), 40)
  - ts_skew(day_cov(in_slice(Ret, 1, 239), in_slice(Volume, 1, 239)), 80)
  - ts_skew(day_corr(in_slice(Ret, 1, 239), in_slice(Volume, 1, 239)), 80)
