- type: N
  hypothesis: '新 idea:把「连续竞价里的订单流方向」和「收盘集合竞价那一下」拆开读,再读订单流方向的**持续性**。

    现象来源(本批 B010,58 条 day_cov 家族):批里的成员全是 day_cov(Ret, Volume) / day_cov(Volume, Volume)
    一类的全天协方差。

    推断(与 E 位同一条,本机没有逐项量过):第一根的 Ret 恒为 0、第一根和最后一根是集合竞价、成交量是普通分钟的十几倍,所以这些全天协方差几乎只读到两根集合竞价,

    其余 239 根连续竞价分钟里的量价方向被它们盖住了。微观结构文献里最该有信息的恰恰是连续竞价里的有符号订单流:机构大单被拆成许多小单,

    有符号成交量因此在时间上自相关(个股层面表现为「某只票的买卖方向在连续几天里持续」);噪声交易者没有这种持续性。本批没有任何成员单独读过这一块。


    算子怎么实现:in_slice(x, 1, 239) 取下标 1..239(去掉第 0 根与最后一根,下标闭区间,已按 AlphaCube 源码核对),在切片上用无量纲的
    day_corr(Ret, Volume)(量价相关)、day_signed_ratio(Ret, Volume)

    (上涨分钟成交量占比 − 下跌分钟占比,取值 [−1,1])和单位化的 day_cov;再用日轴算子读它们:

    (1) 水平:cross_mean(·, 60) / cross_ema(cross_zscore(·, 60), 30)(个股相对自己,去水平);

    (2) **持续性**:cross_autocorr(·, 60, 1) 与 cross_autocorr(·, 120, 1)(日间一阶自相关:机构拆单
    → 正,噪声交易 → 约 0);

    分钟级持续性 day_autocorr(mul(sign(Ret), Volume), 1)(分钟间的有符号成交量自相关,取 40 日均值);持续性 × 方向的乘积(「持续地买」);

    (3) **集合竞价那一下单读**:mul(day_last(Ret), div(day_last(Volume), day_sum(Volume))) =
    最后一根的涨跌 × 它占全天成交量的份额(无量纲,单位是收益 × 份额),

    以及它与次日隔夜跳空的 60 日相关;

    (4) **拆分的度量**:cross_corr(全天 day_cov(Ret, Volume), 连续竞价 day_cov, 60) = 全天协方差有多大比例由集合竞价决定(个股层面的慢变量);

    连续竞价量价相关的 z 分数 − 集合竞价推价的 z 分数;

    (5) 横截面处理沿用 W01 里有效的写法:名义价桶内 z 分数(sub(LogFloatCap, LogFloatShares) 只作分桶变量,「流通市值
    = 流通股本 × 价」的前提未在本机验证)、低流通股本优先 cs_first_low40、去掉极端 10% 的 cs_mask_top_replace_mean_neg。


    和库不同:库里没有 day_cov / day_corr 作用在 in_slice 切片上,没有 day_autocorr(mul(sign(Ret), Volume)),没有
    mul(day_last(Ret), 成交份额),没有日频字段叶子,也没有 cross_zscore / cross_ema / cs_bucket_* /
    cs_first_*;

    15 个种子的骨架与 5583 条库骨架逐条比对(skeleton_key)全部不重复。和 E 位的区别:E 位在核心 C(≈ 集合竞价那一下)上深挖,这一位读的是
    C 里被盖住的那一块和它的持续性;两个位的结果合起来可以回答「alpha 在集合竞价还是在连续竞价」。

    为什么样本外还会在:持续性和相关度都是无量纲的个股层面慢变量(窗口 60–120 日),机构拆单留下的订单流自相关是微观结构的稳定特征,不依赖某段行情;

    水平量的版本用 cross_zscore 去掉了与流动性 / 波动控制重合的水平。已知风险:minute 级 sign(Ret) 在 Ret = 0 的平盘分钟(低流动性票多)取
    0,持续性读数会向 0 缩;持续性可能与流动性控制仍有中度相关(|ρ| 多半 < 0.5),新尺子会再去掉一部分。'
