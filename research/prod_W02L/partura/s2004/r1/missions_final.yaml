- type: E
  core: day_cov(Ret, Volume)
  hypothesis: '机制(推断,标明哪些没在数据上逐项量过)。核心 C = day_cov(Ret, Volume) = 当天 241 根分钟里 Ret
    与 Volume 的协方差 Σ(R−R̄)(V−V̄)/241。

    两件已知的事实(Partura 以前的 F106 实测):第一根分钟的 Ret 在 100% 的股票-日上恰好为 0(不含隔夜跳空),每个有值的股票-日都是
    241 根有效分钟。

    一件 A 股常识(本机没有重新量):第一根(开盘集合竞价)和最后一根(收盘集合竞价)的成交量是普通分钟的十几倍。三者合起来的推断:

    协方差的求和里,最后一根的 (R_last−R̄)(V_last−V̄) 一项大约是其余 239 根噪声项总和的几倍,开盘那一项只是 −R̄(V0−V̄)(很小)——

    所以 C 主要读的是「收盘集合竞价那一分钟的涨跌 × 那一分钟的放量」,即**尾盘集合竞价的推价方向与力度**,而不是通常说的「量价同步的连续竞价订单流」。

    这也解释了本批的现象:富集表里含 C 的 7 个候选均值差 +1.16(p 0.002);同批里含 C 的成员大多是 C 的**慢速时间序列统计**(ts_skew
    / ts_max / ts_pearson / ts_med,窗口 40),快照 head 是 ts_skew(C, 40)、拆解里窗口 80 最好——

    罕见的大幅尾盘推价日才是信息,不是每天的水平。N 位用去掉两根集合竞价的版本直接检验这个推断,这一位在 C 本身上深挖。


    为什么它可能是 alpha 的来源:尾盘集合竞价的推价有明确的行为主体——游资拉尾盘 / 砸盘、指数与 ETF 申赎、机构收盘价考核。哪些股票经常被推、往哪边推、推完第二天开盘怎么走(被隔夜回吐=做价型
    / 流动性型;被确认=信息型),

    是个股的**慢变量**(几十天内相当稳定),和事件本身的方向无关。这个慢变量在做多十分位上有选股意义的理由:被反复做价的票次日隔夜回吐、长期成本高;而「推价后第二天跳空确认」的票是有真实买盘的票。


    这一位要试的外围(和快照里见过的写法很不一样:快照里 C 只被一个单一的时间序列统计量处理——ts_skew / ts_max / ts_pearson /
    ts_med / ts_quantile——而且都保留着 C 的水平,

    C ∝ 波动 × 量能离散度,这一部分正好是新尺子要扣掉的流动性 / 波动控制,所以头部分数全是负的):

    (a) **去水平**——cross_zscore(C, 60) 把每只票换成「相对自己 60 天的异常」,再 cross_ema 半衰期 20–30 天累积;C
    ÷ day_mean(Volume) 去掉量能水平(单位变成收益);

    「净 / 总」比 cross_mean(C,20) ÷ cross_mean(|C|,120) 只留方向占比。

    (b) **关系型**(W01 里样本内最好的一类结构是两个日度量的 60 日滚动关系,窗口长所以换手低、对水平型控制先天近似正交):cross_corr(C,
    隔夜跳空)、cross_corr(昨天的 C, 今天的隔夜跳空)

    (「尾盘推价是否被第二天开盘回吐」的个股倾向,负 = 回吐型,正 = 确认型)、C 与昨日日内收益 / 当日成交额 / 当日波动的 60 日相关。全部无量纲。

    (c) **横截面处理**:价格桶内去均值(sub(LogFloatCap, LogFloatShares) = log 名义价,前提是「流通市值 = 流通股本
    × 价」;这个前提没有在本机验证,只作分桶变量);

    低流通股本优先 cs_first_low40;cs_mask_top_replace_mean / _neg(长仓十分位避开最极端 10% 的封板 / 做价型名字,方向未知所以两个符号各一条);对近
    20 日收益做秩回归取残差(去掉与反转控制的重叠);

    C 与趋势位置的符号交互(sign(cross_zscore(day_last(Close), 60)):量价背离 vs 量价确认)。

    (d) **尾部不对称**:对 C 的 120 日 z 分数取 60 日上四分位尾部均值 + 下四分位尾部均值(正 = 大额正向推价日比大额反向日更极端)——是快照头部
    ts_skew 的另一种读法(尾部均值,不是三阶矩;窗口也不同),不是同一个统计量。

    (e) **状态**:cs_flip_by_state(·, day_sum(Amt)) 让符号随市场成交额所处位置翻转(热市 / 冷市里尾盘推价的含义可能相反)。


    和库不同:库里 5583 条表达式没有 cross_zscore / cross_ema / cs_bucket_* / cs_first_* / cs_flip_by_state,没有日频字段叶子;

    本计划 16 个种子的算子骨架与 5583 条库骨架逐条比对(skeleton_key,与 members.csv 同规则)全部不重复。与三个 head 的区别:head
    是原始 C 或价格×C 的单一统计量,这里全部是去水平后的相对量或关系量。

    为什么样本外还会在:慢(半衰期 20–60 天,换手低)、无量纲(去掉水平,而水平正是被控制扣掉的那一块)、依赖的是尾盘集合竞价的制度和参与者结构而不是某段行情。

    已知风险:训练段 2018 年 8 月前沪市(约)没有收盘集合竞价(最后一根不是竞价),训练段头几个月机制略不同;方向和半衰期由 train 定,valid
    可能反过来——所以 mask 条目两个符号都给。'
