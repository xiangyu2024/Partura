  - ts_skew(mul(day_last(Ret), div(day_last(Volume), day_sum(Volume))), 80)
  - cross_ema(ts_skew(day_cov(Ret, Volume), 80), 10)
  - cs_mask_top_replace_mean(ts_skew(day_cov(Ret, Volume), 80))
  - cs_mask_top_replace_mean_neg(ts_skew(day_cov(Ret, Volume), 80))
- head: day_cov(Volume, Volume)
  why: 'day_cov(Volume, Volume) 是分钟成交量的方差 = 量能水平² × 离散度,方向 −1(做多量能小的),分数 −1.16(train
    −1.10 / valid −1.16),两段一样差。

    拆解表的依据:Volume→Amt(把股数换成金额,水平更重)掉到 −3.75(train −2.98),越带水平分越差,与「分数被水平拖累」一致;水平正是新尺子里的流动性控制要扣掉的,扣完只剩换手成本(原式换手高)。

    去掉烂部件 = 去掉水平:÷ day_mean(Volume)² 得到成交量变异系数的平方(无量纲的「脉冲程度」,首尾两根集合竞价会主导它,所以另给一个去掉两根的版本),再取
    40 日均值,或对自己 120 日历史做 z 分数。'
  variants:
  - div(day_cov(Volume, Volume), pow_2(day_mean(Volume)))
  - cross_mean(div(day_cov(Volume, Volume), pow_2(day_mean(Volume))), 40)
  - cross_mean(div(day_cov(in_slice(Volume, 1, 239), in_slice(Volume, 1, 239)), pow_2(day_mean(in_slice(Volume,
    1, 239)))), 40)
  - cross_ema(cross_zscore(day_cov(in_slice(Volume, 1, 239), in_slice(Volume, 1, 239)),
    120), 20)
