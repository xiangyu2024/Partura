attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: []
    reasons: |-
      创新度 3。核心 day_cov(Ret, Volume) 是快照 head 1 ts_skew(day_cov(Ret, Volume), 40) 的子树,库中 day_cov 家族已有 470 条(members.csv)。16 颗种子与三个 head 的原始 |ρ| 多数在 0.1 到 0.4 之间:a6 0.53、a7 0.60 与 head 1 偏高,a2、a9、a14 在 0.40 到 0.42,其余在 0.38 以下(a15 与 head 3 仅 0.02)。这些种子多是对同一个日度变量 C 的不同时间统计或关系量,不是换个控制变量的写法;新意在外层算子,cross_zscore、cross_ema、cs_bucket_*、cs_first_low40、cs_flip_by_state 在库中计数均为 0。核心对五个控制的原始 |ρ| 全部在 0.14 以下。
      合理度 3。算子逐个核对:cross_zscore 含当天、cross_ema 因果、cs_bucket 与 cs_first 按截面、cs_flip_by_state 的状态是市场均值在 241 日内的分位,实现与描述一致。前视:无。标签按 runner 默认的 open_vwap15(label.py:t+1 开盘 15 分钟 VWAP 入场),用到当天 day_last 与收盘的种子不构成前视。nanrank 陷阱:16 颗种子不含 ts_rank、cross_rank、in_rank_rolling;cs_rank 走 common.rank,缺失保持 NaN,不受影响。比值与 cross_zscore 都有守卫或有界,没有爆点。
      扣分的是理由前提。「首尾两根集合竞价主导 C」只是推断,而表中 R 1 variant 1(去掉首尾两根)与原 head 的截面秩 |ρ| 为 0.98,说明至少对偏度排序,首尾两根并不主导。E 位的「尾盘推价慢变量」故事因此只能部分靠 a3、a4 的隔夜跳空相关支撑。另外 a9 的 cs_first_low40 是阶梯式的小流通股本优先,残差只去掉 LogFloatCap 的 1 到 3 次项,去不掉阶梯选择本身,与 LogFloatShares 的 |ρ| 为 0.54,结果可能主要是小盘溢价,需要在 valid 段看尺寸残差。a15 的 cs_flip_by_state 在前 240 天的市场状态窗口不完整(PI 已说明),只影响符号,不构成定义坏掉。
      无划掉:没有 |ρ| ≥ 0.7 或 ≥ 0.8 的自动划掉情形,也没有数学问题,骨架与 members.csv 无重复(本地复核)。如果它有 alpha,最可能来自:head 1 所读的同一个分布不对称信息(a16 的尾部不对称最直接),或隔夜跳空与日内 C 的 60 日一致性(a3、a4),而不是集合竞价推价本身。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      创新度 4。快照三个 head 中,除 b6(对 day_cov(Volume, Volume) 为 0.43)与 b13(0.53)外,其余 13 颗的原始 |ρ| 都在 0.29 以下。控制上 b3 与 20 日反转为 0.48,b13 与尺寸为 0.55,b2 与已知族为 0.33,都是中度,未触发 0.8。库中 day_signed_ratio 为 0 条,cross_autocorr 仅 2 条且训练夏普为负,作用在有符号成交量上的 day_autocorr 为 0 条,持续性与有符号订单流这一块库里几乎没有读过。day_corr 库中有 301 条,所以新意在「持续性 + 集合竞价单读 + 拆分度量」的组合,不在 day_corr 本身。
      合理度 4。in_slice(x, 1, 239) 经 dt_in.py 核对是 x[:, 1:240],即下标 1 到 239 的闭区间,去掉第 0 根(Ret 恒为 0)和第 240 根(收盘),与 E 位的说法一致。连续竞价的量价相关、有符号成交占比、日间自相关的构造都按算子定义实现,持续性读数不依赖「首尾两根主导」这一前提。前视:无(同 a 位)。nanrank 陷阱:无。除零:day_signed_ratio 分母为零时输出 NaN,day_autocorr 分母有 1e-8 守卫。
      两点提醒,但不构成挡的理由:(1) 分钟收益符号是订单流的代理,1 分钟级会受买卖价跳动影响,b6 与 b5 的持续性读数可能有一部分是价格档位与平盘分钟频率,而不是订单流本身;b6 与流动性控制的 |ρ| 只有 0.04,但对 day_cov(Volume, Volume) 为 0.43。(2) b1 与 slot a 的 a1 只差去掉首尾两根,由 R 1 variant 1 的 0.98 推断,两者截面秩可能很接近;但 b1 正是 N 位检验「集合竞价 vs 连续竞价」的那一颗,保留。若要省预算,它是第一个可以划的。
      如果它有 alpha,最可能来自:连续竞价中有符号成交量的持续性(机构拆单留下的订单流自相关,b4、b5、b6),或连续竞价量价一致性与隔夜跳空的 60 日一致性(b8),而不是收盘集合竞价那一下。
R:
  - head: 'ts_skew(day_cov(Ret, Volume), 40)'
    soundness: 3
    reasons: |-
      8 个变体机械上可算、无前视;ts_skew 在 40 到 80 日窗口上的三阶矩估计噪声大,PI 已说明。variant 2、6、7、8 的窗口与截面处理方向正确。variant 3(day_corr 版)与原 head 的 |ρ| 为 0.25,variant 5 与任何 head 的 |ρ| 不超过 0.06,这两个方向上确有差异。
      主要问题在理由的前提。「首尾两根集合竞价盖住了 C」在表中没有被数据支持:variant 1(去掉首尾两根)与原 head 的截面秩 |ρ| 为 0.98,若前提成立,这个变体应与原 head 差得很多。窗口与归一化的理由(PI 的拆解说法,未核)仍然成立。合理度 3,保留。
  - head: 'day_cov(Volume, Volume)'
    soundness: 3
    reasons: |-
      v1 到 v3 是 day_cov(Volume, Volume) 除以均量平方(变异系数的平方)。机械上有界(241 根分钟时 CV² 不超过 240),不会爆点,无前视。「去掉水平」只在量纲意义上成立:表中 v1、v2、v3 与流动性控制的原始 |ρ| 为 0.61、0.64、0.64,与已知族为 0.53 到 0.55,与尺寸为 0.37 到 0.49。CV² 在截面上主要排出的是交易稀疏、成交集中在少数分钟的票,实际是换了写法的流动性度量。v4(120 日 cross_zscore 后做 EMA)的流动性 |ρ| 只有 0.20,是真正去掉水平的版本。与原 head 的 |ρ| 为 0.09 到 0.24,形式上不同。合理度 3,不挡。如果它有 alpha,最可能来自成交集中度对交易稀疏的代理,而不是「脉冲」本身。
summary: 'a 位(E,核心 day_cov(Ret, Volume))创新 3、合理 3;b 位(N)创新 4、合理 4;两位均通过,无种子划掉;R 1、R 2 合理度均为 3,保留。主要风险:a 位核心的前提(首尾集合竞价主导 C)与表中 R 1 variant 1 的 0.98 相悖;b1 与 a1 可能同序,但保留作为 N 位的关键检验。审计只用 corr_1 与 loc 的 train 数据及结构检查,未读 2026 年读数。'
