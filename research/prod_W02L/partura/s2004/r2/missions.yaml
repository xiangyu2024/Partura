- type: N
  hypothesis: |
    新 idea:**「短窗口估计关系、长窗口取稳健统计」的两级关系量**,读个股价格与成交量之间的「典型联动」,并把全市场共同部分剥掉。

    【现象来源(本流两个批 + 上一轮结果)】
    (1) 第一批 head 2 cross_quantile_q50(cross_corr(day_sum(High), day_cov(Volume, Amt), 15), 241) = −0.73(train −0.73 / valid −0.30),是 M1 三个 head 里唯一带「慢中位数」的:
        先在 15 日窗口里估价格与成交量离散度的相关,再取 241 日中位数。它的结构不是「一个长窗口的相关」(被几个事件日 / 趋势主导),而是「过去一年里大多数 15 日窗口里的典型相关」。
    (2) 上一轮 N 位最好的 5 个(−0.41 ~ −0.68)全是 cross_corr 型的关系量(全天协方差与连续竞价协方差,含换字段的变体,60 / 241 日相关);E 位最好的两个(−0.25 与 −0.27,各自 train 与 valid 只差 0.05 ~ 0.09)是 cross_corr / cross_reg_tvalue(C, day_std(Ret), 60)。
        关系量对水平型控制(流动性 / 波动 / 市值 / 已知族)先天近似正交(上一轮相关度表里这类种子对控制的 |ρ| 多在 0.2 以下),所以没被新尺子扣光。
    (3) 但 head 2 的两个变量都是**后复权价格水平**(day_sum(High) ≈ 241 × 价位,day_cov(Volume, Amt) ≈ 价位 × 成交量方差):推断 15 日窗口内的相关主要是「价格趋势 vs 价位 × 量能」,带着价格尺度;
        且全市场共同的涨跌与放量会让所有股票的窗口相关同时偏向一边。这一位把这两样去掉。

    【算子怎样实现】
    - 价格侧用收益而不是价位:R = day_sum(Ret)(当天连续竞价分钟收益之和,不含隔夜跳空)或 CC = div(day_last(Close), ts_delay(day_last(Close), 1)) − 1(含隔夜的收盘到收盘收益)。
    - 成交量侧用「相对自己 20 日均量的异常量」VA = div(day_sum(Volume), cross_mean(day_sum(Volume), 20))(无量纲)、以及上一位的 D = div(day_cov(Ret, Volume), day_mean(Volume))(放量时收益的加权差)。
    - 剥离全市场:cs_demean(·)(每天减截面均值),让相关只反映「这只票相对市场的收益与相对市场的放量」是否同向。
    - 短窗口 cross_corr(X, Y, 15 / 20) → 长窗口 cross_quantile_q50(·, 241)(中位数)、q25 / q75(只看偏弱 / 偏强一端)、cross_mean / cross_ema(平均版本做对照)、q75 − q25(关系的不稳定程度)。
    - 带滞后的版本:cross_corr(ts_delay(VA, 1), R, 15) = 「昨天放量是否预示今天上涨」(个股自己的延续 / 反转系数,Llorente 等 2002 的 per-stock 版本)。
    相关系数无量纲,不用除以近零的量;cross_quantile_q50 在窗口里有效日少时取可用日(前 241 日只是暖机,和 head 2 同样)。

    【机制:为什么可能是 alpha 来源】价量联动的符号是一个个股层面的行为特征:放量伴随上涨(追涨 / 吸筹 / 卖空受限下的知情买入)还是放量伴随下跌(恐慌 / 被迫卖出 / 派发)。
    单个长窗口相关被少数事件日主导,短窗口 + 稳健聚合读的是「典型日」,更接近这只票的常态。文献:Karpoff 1987(价量联动),Llorente-Michaely-Saar-Wang 2002(放量后收益延续或反转取决于信息不对称)。
    方向(哪边好)由尺子按 train 定,所以种子里 q25 / q75 都给。

    【和库不同】库里没有 cs_demean 作用在价量相关的两个变量上,没有 R / CC / VA 作为相关变量的两级写法(head 2 的骨架是 cross_quantile(cross_corr(day_sum(F), day_cov(F,F))),我的种子骨架都不同,已对 5583 条 skeleton_key 核对)。
    【为什么样本外还会在】慢(241 日中位数,换手低)、无量纲(价格尺度和量能水平都不进来)、市场剥离后不依赖单段行情的共同波动;依赖的是「放量时往哪边走」这个行为特征。
    【已知风险】相关类对 σ_R 可能有 0.2~0.4 的 |ρ|(波动大的票相关更稳);cross_corr 15 日窗口只有 15 个点,单个窗口噪声大,靠 241 日中位数压住;train 与 valid 的符号可能不同(尺子按 train 定,valid 可能反过来)。
