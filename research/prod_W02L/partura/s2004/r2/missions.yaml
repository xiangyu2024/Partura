  core: 'div(day_cov(Ret, Volume), day_mean(Volume))'
  hypothesis: |
    核心 D = div(day_cov(Ret, Volume), day_mean(Volume))。恒等式:cov(R,V)/mean(V) = Σ R_t V_t / Σ V_t − mean(R_t),
    即「当天分钟收益按成交量加权的均值」减「等权均值」(单位是收益;等价写法 sub(day_wmean(Ret, Volume), day_mean(Ret)),种子里一律用 div 写法以便原样含核心)。
    读的是「价格是不是在放量的分钟里涨」:+ 号 = 放量时往上走(资金推价),− 号 = 放量时往下走(派发 / 恐慌)。因为 cov ≤ σ_R σ_V 且 σ_V / V̄ ≤ √240,D 有界(≲ 15 σ_R),
    分钟全为 0 的停牌日分子分母同为 0 → NaN,没有近零分母造成的爆点。

    【本轮依据(数字都是流水线读数;「原因」是推断,已逐条标明)】
    1. 上一轮 R 位把快照 head ts_skew(day_cov(Ret, Volume), 40) 换成 ts_skew(D, 80):score −0.64 → +0.09(train +0.09 / valid +0.90),与已知族 ρ −0.02,与原 head ρ 0.45。
       这是本流里最接近线的一条。承重的是「÷ 均量」:去掉首尾两根集合竞价(in_slice 1..239)的 ts_skew,窗口 40 时与全天版本日度秩 ρ 0.98(−0.84 / −0.30,与 head 的 −0.64 / −0.08 同级),窗口 80 时 −0.56 / −0.08;
       也就是首尾两根不是承重的,而同一个 80 日窗口上 ÷ 均量把 train 从 −0.56 拉到 +0.09、valid 从 −0.08 拉到 +0.90。所以上一轮「C 主要读收盘集合竞价那一下」的推断被数据否定;
       起作用的是「去掉当天成交量水平之后,放量分钟里的价格动作」:原始 cov = V̄_t × D_t,三阶矩被放量日(含全市场放量日)的 V̄_t 抬着走,÷ V̄ 之后只剩「放量的时点与方向」。
    2. 另一个流(2009,其第 2 轮 N 位)在 Amt 加权版本上独立得到同一个原语的最好读数:cross_mean(sub(day_wmean(Ret, Amt), day_mean(Ret)), 241) = +0.07(train +0.07 / valid +0.40),是目前各流里少数 ≥ 0 的读数。
       两个流从不同方向读到同一个对象,都在 0 附近、valid 好于 train。
    3. 对比:上一轮含 D 的 5 个候选平均 −1.19(已知有 cross_mean(D, 40) 这类水平平滑写法),C 的 z 分数 + EMA、C 与 σ_R 的 60 日相关等关系 / 水平写法最好也只有 −0.25 ~ −0.7。D 的价值在**分布形状**(三阶矩)而不是水平:去掉 σ_R 的相关版本 ts_skew(day_corr(…), 80) 是 −2.2,所以承重的是「放量时收益的**幅度**」,也就是罕见的大幅放量上涨日 vs 大幅放量下跌日。

    【机制与文献】放量上涨的日子是知情买入 / 注意力事件的脚印(Gervais-Kaniel-Mingelgrin 2001 的 high-volume return premium;Llorente-Michaely-Saar-Wang 2002:信息不对称强的票放量收益延续,对冲性成交则反转)。
    D 的 80~241 日偏度 = 「过去一两个季度里,放量上涨的极端日是否比放量下跌的极端日更多」,是个股的慢变量(换手低,15 bp 成本下才活得下来;窗口越长越好是整个 wave 的共同教训)。

    【这一位要试的外围(与快照里已见过的写法不同:已知含 D 的候选是 cross_mean(D, 40) 一类水平平滑写法,没有一条做过市场剥离 / 秩空间 / 有界均值 / 极端日不对称)】
    (a) **剥离全市场共同部分**:cs_demean(D)(每天减截面均值)后再取 120 / 241 日偏度。上一轮的偏度读的是「个股自己的」还是「全市场放量大涨 / 大跌日」没法分:全市场大涨放量日所有票的 D 同时为正,偏度会被这几天主导;
        剥掉之后才是个股特有的放量推价事件。这是上一轮没试过的最大变量。
    (b) **秩空间与稳健统计**:ts_skew(cs_rank(D))(日度截面秩的偏度 = 「常在截面顶端还是底端」)、cross_mean(cs_rank(D), 241)(秩均值,不被极端值带走)、cross_mean(sigmoid(cs_robust_z(D)), 120)(有界影响的均值:单日极端值最多贡献 1,等于「方向占比」的连续版)、ts_max + ts_min(最大 / 最小日之和 = 极端日不对称)、
        尾部均值 q75 + q25(与上一轮对 C 的 z 分数做过的版本不同:这里是对剥离后的 D,窗口 120)。
    (c) **慢化与状态**:cross_ema(cs_demean(D), 120)(剥离市场后的慢水平,对照偏度)、ts_skew 的 EMA(30)、近 10 日 EMA 减 120 日 EMA(D 的变化)、对 60 日动量做秩回归取残差(去掉与反转 / 动量重合)、乘 (0.5 − 市值秩)(Llorente:小市值信息不对称强才延续,大市值反转 —— 交互项不是尺子里对市值的 1/2/3 次方能去掉的)、
        cs_flip_by_state(随全市场成交额状态翻符号)。
    (d) 与日收益的关系 cross_corr(D, day_sum(Ret), 120):放量推价是否发生在大涨日(协偏度式读法)。

    【和库的区别 / 为什么样本外还会在】库里 5583 条没有一条是 D(÷ 均量的 vw − ew 收益)的剥离市场 / 秩空间读法,cs_demean、cs_rank、cs_robust_z + sigmoid、ts_max + ts_min 作用在这条链上的骨架都不在库里(本地逐条对 skeleton_key 核对过)。
    慢(120~241 日)、无量纲(单位是收益,与流动性 / 市值水平控制先天近似正交:上一轮 R 位读数与已知族 ρ −0.02)、依赖的是放量上涨 vs 放量下跌的行为(信息 / 注意力事件)而不是某段行情。
    **已知风险**:上一轮 valid 0.90 / train 0.09,train 拖后腿(2018–2023 的大盘股抱团行情里放量推价的含义可能不同),所以 (a) 的市场剥离和 (c) 的市值交互都是针对 train 弱的设计,不是调参;若 train 仍然 < 0.3,说明信号本身是 2024 以后微盘行情的产物。
    偏度类种子与快照 head 1(ts_skew(C, 40))的日度秩 ρ 可能在 0.4~0.6,窗口 ≥ 120 时预计 < 0.5。
