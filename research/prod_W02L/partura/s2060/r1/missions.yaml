slots:
  - type: E
    core: 'day_ar1_coefficient(Volume)'
    hypothesis: |-
      机制:核心 C = day_ar1_coefficient(Volume),当天分钟成交股数序列的一阶自回归系数,读的是「量的持续性」:C 高 = 成交均匀、连续(算法 / 机构按计划拆单、流动性提供者稳定),C 低 = 成交以孤立脉冲出现(散户 / 事件冲击、间歇性挂单)。它无量纲(对 Volume 做倍数变换不变),所以不是成交额水平的另一种写法。
      本批的证据:3 个 head 全是 C 的包装,分数 -3.05 / -3.11 / -3.17,train 与 valid 同号都亏,而且把 Volume 换成 Amt(-3.11 对 -3.05)、5 日平滑改 2 或 10 日、去掉 cs_rank / sigmoid / pow_2 / ts_min 都落在 -3.0 到 -3.3 之间,没有任何一个部件是必要的(必要性在 -0.04 到 +0.15)。富集表里含 ts_decay_linear(C, 5) 的候选均值 -3.18,不含 -3.36。解读(推断,没有毛收益数):C 在样本里有稳定的横截面排序力(库里同族的 ts_mean(day_ar1_coefficient(...), 15) 样本内秩 IC 约 -0.05),但被日度 ar1 的噪声(单日 241 个点估一个系数)与 5 日窗口的高换手吃光;head 们只是在同一个噪声日信号外面套单调变换,换手没有降,所以分数全部卡在 -3。Window 5 → 10 的 train 分反而更差(-3.03)、valid 更好,说明瓶颈不是窗口一个数,而是需要把日信号变成慢变的个股属性。
      这一位在核心外面换成五类与以前 head 完全不同的外围(以前只有 ts_decay_linear + cs_rank / sigmoid / pow 的单调壳,这里一个都不用):(a) 慢聚合:cross_ema(C, 40)、cross_mean(C, 60) —— 同一个信号,有效换手低一个量级;(b) 相对自己的历史:cross_zscore(C, 120)、10 日均值减 120 日均值 —— 回答「这只票最近量变得更脉冲还是更连续」,去掉持久的个股水平(水平被流动性、市值控制吃掉),留下变化;(c) 在股本 / 流动性十分位内比较:cs_bucket_demean / cs_bucket_zscore(C 的慢均值, LogFloatCap 或 20 日成交额水平) —— 去掉 C 与市值、成交额之间的残余关系(新尺子只去掉对控制排名的低阶多项式暴露,十分位内去均值把更高阶、交互项也去掉);(d) 持续性的滚动关系 / 不稳定性:cross_corr(C, 当日收益或波动, 60)、cross_semistd_neg(C, 60)、cross_autocorr(C, 60, 1) —— 读「放量持续的日子价格怎么动」与「持续性本身是否稳定」,窗口长,换手低;(e) 与收益 ar1 的差、与近期趋势方向相乘:量的持续性相对价格持续性的超额,放量脉冲与方向的配对。
      为什么和库里已有的不同:库里的 day_ar1_coefficient 全部是 ts_mean / ts_stddev(·, 15) 或裸写,算子骨架 ts_mean(day_ar1_coefficient(F)) 被拒;这里全部是 cross_*(日轴 EMA / 均值 / z 分数 / 滚动相关)和 cs_bucket_* 外壳,骨架不同;库里也没有 C 的「相对自己历史」「十分位内」「与价格的滚动关系」读法。与 3 个 head 的区别是:head 的外围只有 5 日线性衰减,换手几乎没降,本位的种子把有效窗口拉到 20 到 120 日。
      为什么样本外还会在:成交连续性是参与者构成与交易算法普及度的结构属性(机构 / 量化占比高的票成交更平滑),数十日内排序稳定;高持续性票的价格冲击小、信息更慢扩散,文献里有「成交量聚类 / 长记忆 / 订单拆分」对应的持续溢价(Lillo-Farmer 的订单流长记忆、Chordia-Subrahmanyam 的量聚类),不依赖某一段行情。慢聚合后 15 bp 成本吃得下。
      数学检查:C 是 [-1, 1] 内的相关型系数,没有除以近零量造成的爆点;Volume 全为 0(停牌)时系数 NaN 不是无穷,不会主导截面;cross_zscore 的分母是 120 日标准差,只在 C 常数时为 0 且此时分子也为 0;全部只用 t 日收盘及以前,无前视;窗口最长 120 日,热身期只占前 120 日,不主导。
