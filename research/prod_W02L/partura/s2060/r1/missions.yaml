  - type: N
    hypothesis: |-
      机制:带方向的成交流持续性。本批的 3 个 head 与库里同族读的都是无符号成交量的一阶自回归(量的大小是否连续),它与成交额水平、流动性高度相关,分数卡在 -3。这一位换成有符号版本:S = sign(Ret) × Volume,把每分钟的成交股数按该分钟收益方向标上正负(上涨分钟的量为正、下跌为负,是不需要逐笔数据的净买卖压代理),再读 S 在日内的自相关。S 的自相关高 = 同方向的买(卖)压连续出现 = 订单拆分 / 知情方向性交易(Lillo-Farmer 的订单流长记忆,Chordia-Subrahmanyam 的订单失衡持续性);低或为负 = 买卖交替、做市商库存回补式的来回成交。与无符号 ar1 的区别:无符号 ar1 只回答「量连不连续」,有符号 ar1 回答「方向连不连续」;两者之差 sub(ar1(S), ar1(Volume)) 去掉了量的持续性这一共同部分,只留下方向的持续性。
      算子实现:mul(sign(Ret), Volume) 逐分钟构成 S,day_ar1_coefficient / day_autocorr(·, k) 在日内取滞后 1、5、10 的自相关(1 与 10 的差是方向记忆的期限结构),日轴上取 cross_mean / cross_ema(20 到 40 日)或 cross_zscore(120) 变成慢变个股属性;另有与价格 ar1(sub(…, ar1(Ret)):微观结构上收益的负 ar1 是买卖价差弹跳)的对比、十分位内去均值、以及方向持续性与当日收益的 60 日滚动相关。部分种子用 in_slice(·, 11, 230) 去掉开收盘集合竞价附近的分钟,避免异常的开收盘成交主导自相关。
      受本批启发:3 个 head 与它们全部拆解变体(Volume→Amt 几乎不变,-3.11 对 -3.05)说明无符号量的持续性是一个被反复读取、没有增量的量;富集表里唯一正的是 C 本身与它的 cs_rank,别的外围都无益。这个位不再改外围,改成改变被测的对象:从「量的连续」换到「方向的连续」。
      为什么和库里不同:库里 day_autocorr / day_ar1_coefficient / day_durbin_watson 的对象只有 Ret、Volume、Amt 及其占比的 in_slice,没有任何一条的被测序列是 sign(Ret) × 量(含 mul(sign(·), ·) 的带符号流的 0 条);带符号流的 ar1 与无符号 ar1 的日度秩相关预计中等(流动性好、量连续的票两者都高,但方向部分独立),与 Ret 的 ar1(价差弹跳)也不同,因为后者没有量权重。种子也避开 ts_mean(day_ar1_coefficient(·)) 的库骨架。
      为什么样本外还会在:方向性订单流的持续性反映知情交易者 / 机构拆单的参与程度,是结构属性,数十日内稳定;持续的单边流意味着信息扩散慢、价格延续,对应动量 / 惯性溢价,这在 A 股的机构参与度上有跨时段的证据。窗口 20 到 120 日聚合使换手低,15 bp 成本吃得下。风险:S 的符号由 sign(Ret) 决定,与当日涨跌幅相关,可能与 20 日反转控制中度相关;新尺子会去掉线性、U 形、S 形暴露,剩下的看运气。
      数学检查:sign(Ret) 在价格不动的分钟为 0,S 取 0,相当于该分钟不参与方向流,不会产生 NaN 或爆点;自相关系数在 [-1, 1],无除以近零量的爆点;整天停牌时 S 全为 0 或缺失,系数 NaN,不是无穷;只用 t 日收盘及以前,无前视;窗口最长 120 日,热身期不主导。
