    core: 'sub(signedpower(day_cov(Vwap, Volume)), pow_2(day_mean(Amt)))'
    hypothesis: '机制:核心 C = sub(signedpower(day_cov(Vwap, Volume)), pow_2(day_mean(Amt))),前一项是当日分钟 VWAP 与分钟成交量的协方差(重成交分钟是否落在日内高价位,即买方推高价格时放量的方向性倾向,带符号开方压缩尺度),后一项是日均成交额的平方(流动性水平)。本批证据:含 C 的 7 个候选均值 -0.58,不含 -2.54,差 +1.96(p 0.001),是本批富集最强的子树;上一轮 N 位里 GP 在外面套 ts_regbeta(C, ts_quantile_q75(day_skew(Volume),1), 10) 得到 +0.33(train +0.69 / valid +0.33),本流迄今最好,但那是唯一一种外壳(对成交偏度的 10 日回归斜率,换手高、窗口短)。C 的数值很大程度由 pow_2(day_mean(Amt)) 的水平决定,水平会被流动性 / 市值控制吃掉,所以真正可能有料的是 C 相对自己的变化和对水平的残差。本位把外围换成与 ts_regbeta 完全不同的五类写法:(a) 相对自己历史 cross_zscore(C,60/120) 和快慢差 sub(cross_mean(C,5),cross_mean(C,60)),去掉水平、读变化;(b) 对成交额水平做滚动回归取残差 ts_regres(C, day_mean(Amt), 20) 与 ts_regalpha(C, day_std(Ret), 20):显式剥离流动性 / 波动暴露,留下纯粹的价量协方差部分;(c) 市值十分位内标准化 cs_bucket_demean / cs_bucket_zscore(·, LogFloatCap),去掉与市值的非线性关系;(d) 与价格 / 成交偏度的滚动相关 cross_corr(C, day_std(Ret) / day_sum(Ret) / day_skew(Volume), 30-40):方向性放量是否伴随波动或上涨一起出现;(e) 离散度 cross_stddev(C,20) 与持续性 cross_autocorr_s1(C,20):方向性放量倾向是否稳定。为什么和已见过的不同:已见外围全是 ts_regbeta(·, q75(skew), 10) 一种壳,这里是 cross_zscore / ts_regres / ts_regalpha / cs_bucket / cross_corr / cross_stddev 壳,骨架不同。为什么样本外还会在:放量时价格偏高的倾向反映知情或追涨资金的进场节奏,是慢变的个股行为属性;窗口 20 至 120 日使换手低,15 bp 成本吃得下。数学检查:day_cov 是分钟协方差有限值,无近零除法;signedpower 保号;cross_zscore 分母为窗口标准差,C 常数时分子也为 0,得 0 或缺失,不爆;ts_regres 回归自变量近常数时残差只是原值去均值,不产生爆点;全部只用 t 日及以前,无前视。风险:C 与成交额水平高度相关,新尺子已去线性 / 非线性暴露,剩余看运气。如果它有 alpha,最可能来自方向性放量倾向的变化(参与者结构变化)。'
