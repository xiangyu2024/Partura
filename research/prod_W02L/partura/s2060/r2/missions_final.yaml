  core: day_at_max_ratio(Open)
  hypothesis: '机制:核心 K = day_at_max_ratio(Open),当天(有效分钟里)开盘价序列等于当日最大值的分钟占比。分钟 Open
    序列几乎不动或停在日内高点的时间越长,K 越大: 涨停封板、一字板附近、低价股 / 最小报价单位限制下价格长时间钉在同一档。它是「价格被钉住」的时间占比,无量纲,取值在
    0 到 1, 不是波动或成交额的另一种写法。本批证据:共性表里含 K 的 14 个候选均值 -1.86,不含 -2.69,差 +0.82(p 0.043),是本批富集的
    最强价格侧子树;上一轮 GP 在外面套 cross_autocorr_s1(K, 15) 得到 -0.07(train -0.07 / valid +0.17),是本流迄今最接近
    0 的读数, 也是唯一 train / valid 反号接近零的,说明 K 的时间持续性里有不被现有控制吃掉的成分。已出的 head 与种子都是对 K 做「15
    日自相关」, 外围只有这一种,所以没有人测过 K 的水平、变化、与收益的滚动关系、在市值十分位内的读法。 这一位把外围换成五类与 cross_autocorr_s1
    很不同的写法:(a) 慢水平 cross_mean / cross_ema(K, 20 到 60):近期被钉住的天数, 读「这只票长期处在涨停 / 低价钉住状态」,是个股属性,换手低;(b)
    相对自己历史 cross_zscore(K, 60)、sub(cross_mean(K,5), cross_mean(K,60)): 近期钉住比例是否上升(把水平去掉,水平会被流动性和市值控制吃掉);(c)
    十分位内去均值 cs_bucket_demean(·, LogFloatCap): 去掉 K 与市值的高阶 / 交互关系;(d) 与价格的滚动关系 cross_corr(K,
    day_sum(Ret), 40)、cross_corr(K, day_std(Ret), 40): 钉住是跟着上涨一起出现(强势封板)还是跟着下跌 / 波动出现(报价档限制),方向不同含义相反;(e)
    与对称的最低价钉住比例 K_low 的差 sub(K, day_at_min_ratio(Open)):「钉在高点」与「钉在低点」是两件事(算子文档里写明二者不能互相代替),差值读的是封板方向的净倾向。
    为什么和已有不同:库里与已出 head 里 K 只有 cross_autocorr_s1(K,15) 这一个外壳(与库同骨架会被禁令拒),这里是 cross_mean
    / cross_ema / cross_zscore / cross_corr / cs_bucket_demean 外壳加 K_low 的对比,骨架不同;与
    head 的日度秩相关预计低(K 稀疏,多数日接近 1/240,取窗口均值后才拉开)。 为什么样本外还会在:A 股涨停制度与最小报价单位是制度性的,「长期被钉在高点的票」(强势股
    / 小盘低价股)的拥挤与散户参与结构数十日内排序稳定; 与重尾事件相比,慢聚合后换手低,15 bp 成本吃得下。数学检查:K 是计数比,没有除以近零量;分母是有效分钟数且要求至少
    2 个,不会爆点; cross_zscore 分母是 60 日标准差,K 对多数票是常数 1/240 附近时分子分母同时接近 0,会产生噪声但不是无穷,这种票在截面上聚在
    0 附近, 不主导;全部只用 t 日及以前,无前视。风险:稀疏事件的窗口均值被少数涨停日主导,与已知族 / 波动控制有中度相关;新尺子去掉了线性与非线性暴露,剩余看运气。
    如果它有 alpha,最可能来自「涨停 / 钉住」的拥挤与次日溢出的慢变个股属性。'
