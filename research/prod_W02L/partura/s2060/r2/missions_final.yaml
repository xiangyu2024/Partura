- type: N
  hypothesis: 机制:量价耦合相对自己历史的变化。本批前两轮的结果显示:对 day_ar1_coefficient(Volume) 这类「量自己的持续性」,水平写法全部在
    -3 到 -2.4, 而「相对自己 120 日历史」的 cross_zscore 版本最好(-1.83,与原 head |rho| 仅 0.04),快慢均值之差次之(-2.36);信息在变化里,不在水平里
    (水平被流动性、市值控制吃掉)。上一轮的带符号成交流想法没有产出比这更好的读数。这一位换对象:不再读量的自相关,读量与价格在日内同步的程度—— day_corr(Volume,
    Ret)(量跟着涨跌方向走 = 方向性成交,放量上涨 / 放量下跌)和 day_corr(Volume, abs(Ret))(量跟着波动幅度走 = 事件冲击
    / 信息到达), 以及量峰出现的时刻 day_argmax(Volume)(量能集中在开盘还是收盘附近,读参与者构成:机构尾盘 vs 散户开盘)。每个日读数噪声很大,
    所以全部在日轴上写成「相对自己 60 到 120 日历史的偏离」或「快慢均值之差」,回答「这只票的量价关系最近是否变了」——变了意味着新信息或新参与者进入,
    价格还没完全反映,是慢变的个股状态。 算子实现:day_corr(Volume, Ret) 与 day_corr(Volume, abs(Ret)) 逐日给出相关系数(注意
    day_corr 在一方整天为常数时返回 0 不是缺失, 停牌 / 一字板票会聚在 0 附近,这类票在截面上同秩,不会产生爆点),cross_zscore(·,
    60/120) 做相对历史偏离, sub(cross_mean(·,5), cross_mean(·,60)) 做快慢差,cross_corr(耦合, day_std(Ret),
    60) 读「耦合与波动一起变」,cs_bucket_zscore(·, LogFloatCap) 去掉市值高阶关系。 受本批启发:富集表里 cross_corr(day_ar1_coefficient(Volume),
    day_std(Ret), 60) 是最强的子树(均值差 +0.94),说明量相关量与波动的滚动关系有料, 而 ar1 本身是弱的核;这里把被测的量从自己的
    ar1 换成与价格的耦合。 为什么和库里不同:库里的 Volume 读法集中在 day_ar1_coefficient / ts_mean 包装;这里的被测对象是
    Volume 与 Ret / |Ret| 的日内相关, 以及 day_argmax(Volume) 的位置,外壳是 cross_zscore / 快慢差 /
    cross_corr,骨架库里没有。 为什么样本外还会在:参与者构成变化(机构 / 北向 / 散户占比)与信息到达强度是缓慢扩散的,耦合相对历史的偏离在数周内排序稳定;
    窗口 60 到 120 日聚合使换手低,15 bp 成本吃得下。数学检查:相关系数在 [-1, 1],无近零除法;cross_zscore 分母为窗口标准差,
    常数序列时分子也为 0,得 0 或缺失,不爆;day_argmax 并列取第一个下标(零成交日返回 0,即开盘分钟,这类停牌日是少数且在慢聚合中被稀释);
    全部只用 t 日及以前,无前视。风险:耦合与波动、流动性中度相关,新尺子去掉线性与非线性暴露。如果它有 alpha,最可能来自参与者构成 / 信息到达强度变化的慢变信号。
  inspired_by: B001/B002 批:cross_zscore(day_ar1_coefficient(Volume),120) 相对历史写法最好(-1.83,与原
