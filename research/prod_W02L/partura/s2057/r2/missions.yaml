  - type: E
    core: 'ts_stddev(ts_stddev(day_zero_ratio(Ret), 10), 50)'
    hypothesis: >-
      Core = volatility of the 10-day volatility (50-day window) of the daily dead-minute share
      day_zero_ratio(Ret) (share of minutes with exactly zero return). The common-subtree table shows candidates
      containing it average +0.08 vs -2.25 for those without (7 candidates, p<0.001), and in round 1 the pure nest
      ts_stddev^4(day_zero_ratio(Ret)) scored train +0.32 / valid +0.80: the signal is present but the train leg is weak.
      Mechanism: how erratically the stock's tape switches between "alive" and "frozen" over weeks is a proxy for
      episodic attention / quote stickiness (limit-lock spells, thin-trading regimes). Round 1 only stacked more
      ts_stddev layers or a ts_delta inside the core. Here the periphery is different in kind: (a) scale / level
      normalisation (divide by the long-run dead-share level, subtract its own slow mean) so the signal is
      "unusual instability", not "illiquid"; (b) interaction with trend sign and with real volatility (subtract the
      vol-of-vol of day_std(Ret), so what remains is instability of frozenness beyond instability of price movement);
      (c) combination with the other enriched core, vol-of-vol of the intraday turnover centroid (day_centroid(Amt));
      (d) ts_corr with day-level turnover / a time-series rank or decay of the core so the train-period noise is smoothed.
      Different from the library: no library expression uses a dead-minute indicator, and these peripheries
      (ratio, residual, rank, correlation, difference of two vol-of-vols) are not in the seen candidates.
      Why it should persist: stickiness and limit-lock structure of A-share quoting is institutional (tick size, 10%/20% bands),
      and the ruler already removes linear/U/S exposure to liquidity, volatility, size and the champions, so the
      leftover is the instability component.
