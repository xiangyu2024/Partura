  - type: N
    hypothesis: >-
      Mechanism: "price-pinned trading". The difference day_zero_ratio(Ret) - day_zero_ratio(Amt) is, per day, the share
      of minutes in which the price did not move minus the share in which nothing traded; positive values mean the
      price is flat while volume still trades or the book is deep at a sticky price (absorption: large resting
      orders / price support, or locked limit with queue trading), negative values mean minutes where trades happened
      but also minutes without trade. Round 1 only looked at the dead-share of price alone and found it mostly collides with
      liquidity and the known family (levels) with the useful part in dispersion. Here we (1) contrast price-flat
      against trade-absent, which cancels most of the common liquidity component (both rise with thinness) and
      leaves the price-impact-per-trade side; (2) localise it in time of day via in_slice on the minute axis
      (morning 1-120, afternoon 121-240, last 30 minutes 211-240, first 30 minutes 1-30), because pinning at the open
      (auction aftermath) and at the close (support/closing games) are different behaviours; (3) take level
      (ts_mean), instability (ts_stddev) and the afternoon-minus-morning asymmetry. Implementation: day_zero_ratio is
      the ops_ext day collapse (exact equality to zero on finite minutes), in_slice cuts the minute axis,
      ts_mean / ts_stddev / ts_decay_linear smooth over days; no nt_*, no look-ahead (all windows are trailing).
      Why it differs from library: no library expression uses a zero-ratio indicator, nor a split of the minute axis by
      session, nor price-flat minus volume-absent. Why it could persist: tick-size and quote stickiness plus A-share
      lunch-break / closing-auction microstructure are institutional and slow-moving; ruler residualisation
      removes the liquidity and size exposure, so any remaining alpha would be the timing/pinning component.
    inspired_by: 'structure batch 1/2 and round-1 results: nested dispersion of day_zero_ratio(Ret) is the only family that came near the line (valid +0.80), and M2 heads (day_corr(pow_2(Vwap), Close), day_autocorr_n1(pow_2(Open))) are intraday price-path-structure statistics of the same kind'
    seeds:
