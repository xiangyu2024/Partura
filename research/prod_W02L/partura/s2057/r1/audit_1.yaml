    reasons: '创新度 4:四个核心量 day_gini / day_centroid(Amt 或 Volume) 是库里没有的日内成交分布统计(库与 3 个 head 都是 day_sum(nt_cs_quantile_q25(Amt)) 的嵌套 ts_stddev,形状不同)。与 3 个 head 的原始日度秩 |ρ| 最高 0.39(seed 7),残差后最高 0.25(seed 6),其余多在 0.15 以下,所以相对 head 是实质性不同的东西。但水平项与流动性、已知族的重合偏高(seed 8 已知族 0.53、seed 10 已知族 0.49、seed 7 流动性 0.81),新信息主要在残差里,不给 5 分。合理度 4:逐个核对算子:day_gini 与 day_centroid 在 ops_ext.py 中都是日内归约到 (..,1),NaN 安全,gini 有界、只看排序、不被单笔打爆;centroid 对 tot=0 返回 NaN;停牌日由引擎的交易性掩码置 NaN,不会变成有限值;ts_stddev / ts_mean / cross_mean 都是对日轴的滚动 nanstd / nanmean,10 到 50 天窗口在 train + valid 内样本充足。全组没有用 rank 类算子,不涉及 nanrank_last 陷阱。无数学问题。注意:计划里「与流动性和市值几乎正交」只对稳定性变体成立(seed 2 流动性 0.12),对水平变体(seed 7、8、10)不成立,计划的这句话不准确,但不影响放行。划掉 7:与流动性控制的 |ρ| = 0.81 ≥ 0.8,按规则自动划掉,它就是流动性的另一种写法。seed 3(Volume 版)与 seed 1(Amt 版)只差价格权重,日内价格变动小,排序几乎相同,但窗口(40 对 20)不同、残差与 head 0.20,不构成完全重复,保留。如果它有 alpha,最可能来自:成交人群的稳定性,即被指数 / 被动资金或慢机构持有的票,与事件型、散户注意力型资金交替的票,在日内成交分布上的慢变差异,而不是流动性水平本身。'
