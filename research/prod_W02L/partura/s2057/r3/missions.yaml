  - type: N
    hypothesis: "Mechanism: price-lock geometry. Rather than the share of zero-return minutes (round 1-2), measure the SHAPE of frozen time: day_flat_run_max(Close) is the longest unbroken run of unchanged closes (a limit-lock for hours versus scattered thin-trading stillness), day_at_max_ratio(Close/High) minus day_at_min_ratio(Close/Low) is the share of the day pinned at the high minus pinned at the low (locked-up vs locked-down, a signed event), and day_distinct_ratio(Close/Vwap) is how many price levels the day visited (tick-grid coarseness, thin stocks). Level (ts_mean) captures persistent stickiness; ts_stddev and nested ts_stddev capture instability of lock regimes, echoing the vol-of-vol shape that came closest in the zero-ratio family. The signed lock difference averaged over 20 days is an attention/queue-pressure trace: repeated lock-ups at the top mean unfilled buy queues. Implementation: ops_ext day collapses over minutes (day_flat_run_max, day_at_max_ratio, day_at_min_ratio, day_distinct_ratio), trailing ts_mean / ts_stddev, one seed neutralised in LimitWidth buckets; no nt_*, no look-ahead. Different from the library: no library expression uses run-length, pinned-at-extreme or distinct-level atoms, and the skeletons differ from every library skeleton. Persists because limit-band mechanics and tick-size structure are institutional, and the ruler removes liquidity, volatility, size and champion exposure so the remaining signal is the lock-geometry component."
    inspired_by: "structure batch 3 / common-subtree table: the only enriched atoms are dead-minute and timing shape statistics (day_zero_ratio(Ret), day_centroid(Amt)), versus the batch heads that are intraday price-path correlations (day_corr(pow_2(Vwap), Close), day_autocorr_n1(pow_2(Open))); lock geometry is the structural neighbour of both"
    seeds:
