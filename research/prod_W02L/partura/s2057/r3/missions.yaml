    hypothesis: "Core = ts_stddev(ts_stddev(ts_stddev(day_zero_ratio(Ret), 10), 50), 10): third-order dispersion of the daily dead-minute share. Containing candidates average +0.06 vs -1.90 (4 candidates, p 0.001) and the four-layer version is the best seen (train +0.32 / valid +0.80, below the 0.5 line because train lags). The seen periphery around this family is only more ts_stddev/ts_kurt/ts_delta layers and cs_first_low40(LogFloatCap, .). Here the periphery is cross-sectional neutralisation inside same-day deciles of regulatory / structural fields (LimitWidth, BoardCode, ListAge, LogTotalCap) via cs_bucket_demean / cs_bucket_rank, robust z-scoring, a trailing time-series rank, linear decay, a correlation with the vol-of-vol of real price volatility, and a subtraction of that real-volatility vol-of-vol so that what remains is instability of frozenness beyond instability of price movement. Mechanism: how erratically a stock flips between alive and frozen quoting, measured relative to its own board and age group, is an attention-regime proxy; mixing boards (10% / 20% limits, new listings with no limit) inflates the raw core with a structural component that probably costs train performance. Implementation: nested ts_stddev collapse daily shares into a slow instability series, bucket operators remove the group baseline each day, all windows trailing, no nt_*. Different from the library and from round 2: round 2 used size-lexicographic ordering and plain ts wrappers, not within-group neutralisation or difference against price vol-of-vol. Persists because board structure and quote stickiness are slow institutional features and the ruler removes the common liquidity/size exposure."
