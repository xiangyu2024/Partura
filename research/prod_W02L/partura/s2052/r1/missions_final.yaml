  hypothesis: '核心 C = day_ar1_coefficient(High):当天 241 根分钟最高价「水平」(不是收益)上的 AR(1) 系数。对价格水平回归
    x_t = c + phi x_{t-1},phi ≈ 1 - (分钟创新方差)/(当天价格水平的离散度),所以它是无量纲的「当天趋势性 / 平滑度 对 分钟噪声」之比:phi
    高 = 当天价格走出了一条平滑的单向路径(范围大、分钟噪声小,知情 / 机构持续流),phi 低 = 价格在窄幅里来回弹(买卖价差反弹、流动性提供者主导)。它与成交额水平、市值、波动水平天然相关较低,这是我选它的原因。

    本批 3 个 head 与 25 个候选的结构几乎全是 ts_max / cross_med 一串嵌套,它们的负分(约 -2)说明「取 5/30/40 日最大值」这种极值读法换手高、把噪声放大;拆解里
    C 单独 -2.64,拆掉 ts_max 的 knockout 有时更好(例如去掉 ts_max(...,30) 后 -2.27)。快照里已见过的外围全是
    ts_max / cross_med 的嵌套,没有一个是均值、z 分数、波动、分位、回归残差、与 Low 对照。这一位把外围整个换掉,试五类读法:(a) 慢平滑(cross_mean
    / cross_ema / cross_decay_linear 20-30 日),把日度噪声平均掉以降低换手;(b) 相对自己历史(10 日对 60 日差、60
    日 z 分数),去掉持久截面水平;(c) High 与 Low 两端的差(上沿平滑度减下沿平滑度):两端各自含买卖价差反弹,相减后反弹抵消,剩下的是「上冲有无持续性
    vs 下探有无持续性」的不对称,这是 swap High->Low 在拆解中升 +0.54 / +0.73 的直接延伸;(d) 对波动做回归残差(cross_regres
    用当天 std(Ret) 去解释 phi),去掉 phi 里 波动 机械成分;(e) 它自身的 20-40 日波动 / 下分位 / 偏度(「平滑度不稳定的票」)。样本外还会在的理由:这是微观结构层面(噪声对趋势)的持续性质,每只票的买卖价差反弹强度和机构拆单趋势强度是慢变的股票特征,不依赖某个年份的行情;外围改成慢写法后换手比
    ts_max 链低。风险:拆解显示 C 本身两段都亏(-2.64/-2.30),毛超额可能约为 0;这一位的赌注是亏的主要是换手成本。'
