- type: N
  hypothesis: '新 idea:不用「价格水平 AR(1)」,而是用日内价格路径的方差比 / 效率比 / 趋势相关,直接度量「当天价格是趋势还是来回弹」,再取慢的跨日聚合。启发:本批所有候选都围绕
    day_ar1_coefficient(High) 这个「水平的平滑度」,且 swap High->Low 变好、Close->Vwap 的 valid 从
    -2.19 升到 -0.80(Vwap 更平滑、买卖价差反弹更少),说明这批里真正起作用的变量是微观结构噪声 vs 趋势。这个量有更直接、更标准的度量:

    (1) 方差比 VR_k = std(k 分钟价差) / std(1 分钟价差)(不除 sqrt k,是同一当天横截面内可比的常数缩放):VR 高 = 价格漂移
    / 持续,VR 低 = 反弹 / 均值回复,是 Lo-MacKinlay 方差比检验的日内版本;用 in_delta 构造,不含 AR(1) 回归,骨架与库里的
    day_ar1 / day_autocorr 类不同。

    (2) 效率比 |末 - 初| / sum|分钟价差|(Kaufman 效率比):路径有多直。

    (3) day_durbin_watson(Close) ≈ 2(1 - 一阶自相关)、day_hurst(Close)、day_autocorr(Close,
    30) 的长滞后水平自相关、day_corr(Close, in_index(Close)) 的价格对时间的线性趋势相关(带符号的一款会与日内收益有关,放一个对照;abs_
    的一款是「趋势强度」不含方向)。

    全部取 10-20 日均值或 10 对 60 日差、60 日 z 分数,降低日度噪声与换手。

    机制:反弹强(VR 低)的票是流动性提供者持续被补偿 / 价差宽的票,趋势强(VR 高)的票是知情流和机构拆单持续的票,两种读法都是慢变的股票特征,且无量纲,与成交额、市值、波动水平的控制先天相关低。与库里不同:这些骨架(比值
    of 两个 std of in_delta、效率比、Hurst、DW、in_index 相关)的外围不是 ts_max 链;样本外还会在是因为微观结构噪声(买卖价差、价格最小变动单位、拆单)是结构性的,不靠某年行情。风险:与
    High 的 AR(1) 同源,若毛超额不在这个轴上则全部为负;所以种子里放了 4 种不同度量,看哪一种与控制相关最低且分数最高。'
