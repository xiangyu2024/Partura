    个月以上的价格位置。机制:(1) 52 周高点锚定——投资者以 52 周高点为参照,离高点近的票被低估新利好(George-Hwang), 离高点远的票处置效应下被压住,收益会向高点靠拢;(2)
    A 股散户对前期已大涨的票有多年尺度的反转(牛熊切换下的追涨后回落), 价格相对 250 日区间的位置是比单纯累计收益更稳的读法;(3) 价格走势与成交额协同(cross_corr(价格,
    成交额总量))反映放量上涨还是缩量上涨。 算子实现:全部用日频的 day_open(Open) / day_last(Close)(当日已知)做 ts_max
