  hypothesis: '核心 C = day_max(Ret):当天分钟收益的最大值(日内最大正向跳动),即 Bali 等人的 MAX / 彩票偏好指标的分钟版。
    证据:共性表里含 C 的 16 个候选均值差 +0.98(p<0.001),M 批里含 ListAge*C 的 5 个候选 -1.01 对 -2.56, 本组上一轮
    N 位里最好的 3 个(-0.56 ~ -0.94,valid 一度到 +0.22)全是 C 外面套 cross_ema / cross_cov 的写法;
    也就是说 C 是本组少数两段都不太亏的部件。机制:A 股散户追逐日内极端上冲的彩票型股票, 极端上冲频繁的票被高估、之后跑输(MAX 效应),多头腿拿的是「低跳动、定价更准」的一端或「相对自己历史跳动已回落」的票。
    以前见过的外围只有 cross_ema(·,10)、cross_mean(·,5) 与「cross_cov(…, cs_first_high20(BoardCode/…,
    |Amt 加权开盘|), 241)」 这种和板块 / 成交额分层拼接的写法;本位全部换掉,改为五类读法: (a) 去掉波动成分——MAX 除以自身日内标准差(跳动强度
    = 极端程度 / 常态波动)、对 20 日平均 day_std 做滚动回归取残差(净于总波动的 MAX); (b) 相对自己:5 日对 60 日差、60 日
    z 分数、90% 分位(异常跳动而不是持久水平); (c) 上下对称:max 与 |min| 之差(上冲 vs 下探不对称,抵消共同的波动 / 价差成分),与
    LimitWidth(涨跌停幅度,日频叶子)相除得到「离涨停多近」,跨 10% 与 20% 板块可比; (d) 与资金流的协方差 / 相关(60 日 cross_cov
    / cross_corr(MAX, 成交额总量 / 成交额加权收益)):跳动是否伴随放量,放量跳动是注意力驱动,无量跳动是噪声; (e) 慢平滑后再取日间波动
    cross_stddev(跳动强度的不稳定性)。 与库里不同:库里只有 ListAge 乘积与 cross_cov 的分层拼接;这里是比值、残差、对称差、分位、相关这些没有出现过的算子集合,骨架不同。
    样本外还会在的理由:彩票偏好与涨跌停制度下的散户注意力是结构性的,和年份行情无关;分母均为日内标准差 / LimitWidth(非近零量, 日内标准差在停牌日为
    NaN 而非 0)。风险:本组全部分数仍为负,毛超额可能约为 0,赌注是亏损主要来自快速换手,慢读法与净于波动能压住。'
