- type: N
  hypothesis: 新 idea:「放量爆发的方向」。当天 5 分钟平滑成交量峰值分钟 P 上的价格行为:(1) 该分钟结束的 5 分钟收益(爆发是买盘推动还是卖盘砸出,标准的有符号成交量冲击,相对价格归一);(2) 峰值成交量 / 全日平均(爆发程度)与方向的乘积;(3) 峰值处 Vwap 相对全日均价的位置;(4) 日内成交量与分钟收益的相关(符号流向,Amihud/Kyle 风格的流向 - 价格联动);(5) 峰值分钟的 (High-Low)/Close 振幅;全部取 10-30 日慢均值 / z 分数 / 与波动回归残差。机制:机构拆单与消息驱动的放量日里,爆发方向携带知情信息,其后几天出现漂移(信息缓慢扩散 + 流动性提供者补偿),是跨日可持续的结构性现象;反弹型爆发(价差宽、被动盘主导)则相反。与库里不同:库里该批围绕 day_ar1_coefficient 与 day_tide_* 的时点 / 斜率拼接,从未直接读取峰值分钟上的价格与方向,也没有成交量爆发程度 × 方向的乘积;骨架(day_locate 在 argmax 上取 in_delta 收益)与潮汐 / AR(1) 不同。样本外还会在的理由:信息扩散的延迟与被动盘补偿是结构性的,不依赖某年行情。风险:有符号冲击与 20 日反转控制中度相关(新尺子已去掉其非线性暴露),且与 M2 一样毛超额可能约为 0。
