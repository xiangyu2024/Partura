  core: day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5))))
  hypothesis: 核心 C = T = day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume,31,211),5), day_argmax(...))),即当天 5 分钟平滑成交量达到峰值之后、成交量萎缩到最低的那一分钟(「放量后枯竭点」)。它是 M2 批三个 head(day_tide_change / day_tide_speed,分数 -1.0~-1.14)共有的标记点之一;拆解显示:把潮汐里的价格换成 Vwap 后 -1.00/-0.35 变 -0.85/-0.13(valid 近 0),说明起作用的是「放量-枯竭」这个时点而价格读数越平滑越好;整段 neg(sub(...)) 时点子树单独 -1.88,说明只看时点不够、要配价格。以前见过的外围全是 day_tide_change/day_tide_speed 三标记分段拼接(峰前低谷到峰、峰到峰后低谷的相对变化或斜率),本轮完全不用 tide 算子,改为在 T 上直接取读数:(a) 峰值分钟到枯竭分钟的 Vwap/Close 收益(放量冲击之后的价格漂移:知情流持续则继续同向,流动性冲击则回吐);(b) 枯竭深度 = 枯竭点成交量 / 峰值成交量(冲击衰减得多快);(c) 枯竭点处 Low/Vwap(买卖价差反弹的下影)、枯竭点之后到收盘的 Vwap 反弹;(d) 峰后持续时长 T-P;(e) 都取 10-30 日慢均值 / z 分数 / 对波动回归残差 / 10 对 60 日差,以降低拿来换手的日度噪声。与库里不同:库里该核心只出现在潮汐拼接里,这里是价格漂移 / 衰减深度的无拼接读法,骨架不同。样本外还会在的理由:放量冲击后的吸收 / 衰减速度度量的是流动性提供者吸收冲击的能力与信息持续性,是慢变的个股微观结构属性,与年份行情无关。风险:所有同族分数都为负(-1.0 起),毛超额可能约为 0,赌注是亏损主要来自快速换手而慢读法能压住。分母均为价格或成交量,不会近零;P 在窗口末尾时 T 退化,按 NaN/平价处理,属少数日。
