- type: N
  hypothesis: '机制:个股「成交量 - 波动 - 收益」几条日序列之间的耦合强度与不对称,在截面名次空间里量,窗口 120 日。

    批里的现象(B037):(1) 9 个候选全是 |φ|(分钟成交量的日内连续性)的水平外壳,换外壳 / 换 Amt 分数不动(-2.98 ~ -3.15),唯一的杠杆是窗口越长越好(ts_min
    2 / 5 / 10 日:-3.31 / -2.98 / -2.41)——水平被控制吃掉,剩下的只有「慢」;(2) head 1 的 cs_rank 外壳是拆解里有用的部件(拿掉差
    0.15),先在截面取名次(去掉全市场同日同向的共同变动)是对的方向,但批里只读名次的水平。新想法:不读任何一个活跃度度量的水平,读两个度量在名次空间里的耦合——耦合强度是个股信息环境与参与者构成的指纹,水平的多项式控制剪不掉,而
    120 日窗口让它变慢。


    四组读数:

    (a) 混合分布假说(Clark 1973;Tauchen 与 Pitts 1983;Lamoureux 与 Lastrapes 1990):成交量和波动由同一条信息流驱动,耦合强说明价格变动主要来自信息交易,耦合弱说明成交量里噪声
    / 流动性交易占比高(散户情绪、拆单、对冲流量)。读法:cross_corr / cross_regbeta / cross_reg_tvalue(cs_rank(day_sum(Volume)),
    cs_rank(day_std(Ret)), 120),以及把批里的对象放进耦合:cs_rank(day_ar1_coefficient(Volume))
    与波动 / 波幅名次的耦合,和 cs_rank(day_gini(Volume)) 与波动名次的耦合。

    (b) 对带符号收益与无符号波幅的反应之差:cross_corr(成交量名次, 收益名次) 减 cross_corr(成交量名次, |收益| 名次)。上涨日放量、下跌日缩量的不对称是散户追涨与注意力的指纹(Barber
    与 Odean 2008;Gervais、Kaniel 与 Mingelgrin 2001 的高量收益溢价)。

    (c) 量价的跨日先后:cross_corr(昨日收益名次, 今日成交量名次) = 追涨;cross_corr(昨日成交量名次, 今日收益名次) = 量对后续收益的预测;Llorente、Michaely、Saar
    与 Wang 2002 的回归 r(t) = a + (b + c·v(t-1)) r(t-1) 里成交量区分投机(信息)交易与对冲交易,c > 0 则动量、c
    < 0 则反转,种子用 cross_regbeta(mul(滞后收益, 滞后的成交量 z 分数), 当日收益, 120) 在个股 120 日窗口里估这个 c(名次居中版本一个)。

    (d) 波动里成交量解释不了的部分:cross_regres(成交量名次, 波动名次, 60) 的残差的 30 日均值与 60 日波动,cross_corr(成交量名次,
    自己滞后一日, 120) 是成交量名次的持续性。


    算子怎样实现:cs_rank 把当天截面名次作为输入,所以全市场同时放量 / 同时大涨大跌的共同日度变动被去掉,耦合只来自个股相对其他股票的表现;cross_corr
    / cross_regbeta / cross_reg_tvalue / cross_regres 用 60 ~ 120 日滚动窗口把它变成慢变量;cross_delay
    取滞后一日;cs_demean 把名次居中以便做乘积项。日度输入是 day_sum(Volume)、day_sum(Ret)(日收益)、day_std(Ret)(日内波动)、day_gini(Volume)、day_ar1_coefficient(Volume)。


    为什么和库里不同:库里 5583 条表达式把 cs_rank 的输出放进日轴相关 / 协方差 / 回归的共 26 处(逐个数过):20 处是 3 ~ 20
    日窗口的 ts_corr / ts_cov(WorldQuant 风格的手写式,配的是价格或日收益名次对 day_sum(Volume) 名次),6 处是
    15 ~ 241 日的挖掘式(配的是价格、偏度、分位数一类,不是成交量对波动或 |收益| 的耦合)。没有一条用 day_std(Ret)、|day_sum(Ret)|、φ
    或 day_gini(Volume) 的名次做耦合,也没有 60 日以上的「成交量名次 - 波动 / 收益名次」耦合;最接近的手写式窗口短一个量级(3 ~
    20 日 对 120 日)。我把 16 个种子的算子骨架逐个对照了 4077 个不同骨架,没有一个相同。与 3 个 head(|φ| 的水平外壳)的差别是读的是协动而不是水平;与五个控制的差别是它们是水平量,耦合系数不是它们的函数(会共享一部分:流动性大的票耦合更稳定,尺子会把对水平的线性
    / U 形 / S 形暴露去掉)。


    为什么样本外还会在:耦合强度反映的是个股的投资者构成与信息环境(散户 / 机构、信息交易 / 噪声交易占比),是慢变属性,不靠某一段行情;120 日滚动相关逐日变化小,十分位书换手低,15
    bp 成本下能承受。诚实预期:出 head 的概率约 6%,更可能落在 -1.2 ~ -0.3;主要失败方式:单只股票 120 个观测的相关系数估计误差(约
    0.09)接近真实的截面离散度,名次大半是噪声;与波动 / 流动性控制共享一部分(量价耦合在小盘股上更强)。


    数学检查:窗口只含 t 日及以前,滞后用 cross_delay(无前视);cs_rank 在截面上取名次(不用 ts_rank / cross_rank
    的当天缺失返回 0 的行为),停牌日 day_sum 为 NaN 或 0 只会落在名次两端;相关 / 回归的自变量是名次或 z 分数(cross_zscore
    分母 std + 1e-9),取值有界,没有除以个股自己近零量的爆点;输出连续,不同值 ≥ 50%;最长回看 120 + 60(含 z 分数)日,头几个月的不满窗估计噪声大但不决定结果,覆盖率不受影响;不用
    ts_spearman / nt_*。'
