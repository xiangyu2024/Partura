  hypothesis: '事实(本流快照 B037 的 9 个候选 + 拆解表):9 个候选全是同一个对象 C = |φ| 的外壳,φ = day_ar1_coefficient(Volume)(当天
    241 根分钟成交量对前一分钟的 AR(1) 斜率;pow_2(pow_05(·)) = 取绝对值),外壳只有 sigmoid / pow / cs_rank
    / ts_decay_linear / ts_min(窗口 ≤ 50 日)。三个素材 head 的分数 -2.98 / -3.15 / -3.15,train
    与 valid 几乎一样(-2.98 对 -2.97)。拆解:sigmoid / pow / cs_rank 这类保序外壳拿掉最多差 0.15,Volume
    换 Amt 不变(-2.99),唯一有明显作用的是 ts_min 的窗口:2 / 5 / 10 日 = -3.31 / -2.98 / -2.41,越慢越好。结构表里这
    9 条在未去控制时训练段 rank IC -0.048 ~ -0.060、净夏普 0.9 ~ 2.0,去掉 5 个控制和两个冠军之后全部掉到 -3。解读:C
    的水平(分钟成交连续 = 流动性好的活跃票)是流动性 / 成交额离散度 / 市值这些控制的函数,水平里没有剩下的东西;越慢越好说明 15 bp 的成本也在吃分数。


    假设:C 在日轴上可以拆成三块:股票自己的水平 a_i(被控制吃掉);全市场共同的日度成交连续性状态 M_t(= 当天所有股票 C 的截面均值,宏观消息日、指数调仓、涨跌停潮时整体移动);个股特有的偏离
    e_it。水平以外的两样是控制看不到的:(1) 股票对 M_t 的暴露 b_i(成交连续性的 commonality beta),文献上是流动性风险的一个维度:Chordia、Roll
    与 Subrahmanyam 2000 的流动性共性,Pástor 与 Stambaugh 2003、Acharya 与 Pedersen 2005 的流动性风险溢价——在市场成交状态变差时一起变差的股票要求补偿。b_i
    不是水平的函数(同一个流动性水平下可高可低),所以对水平的 1 / 2 / 3 次多项式控制剪不掉它,它是个股的慢属性(持仓结构:指数 / 机构成分股 vs
    散户为主),60 ~ 180 日窗口里很稳。(2) e_it 在 60 ~ 120 日上的聚合(均值 / 波动 / 上下不对称 / 自相关):读的是这只票最近的成交连续性相对自己和市场的变化,水平被回归截距吃掉。


    算子怎样实现(16 个种子每个都原样含核心 C):cs_mean(C) 是当天的截面均值(广播回每只股票)= M_t;cross_regbeta / cross_reg_tvalue
    / cross_corr(M, C, d) 是个股 C 对 M 的 d 日滚动 beta / t 值 / 相关,d = 60 ~ 180;cross_regres(M,
    C, 60) 取回归残差 e,再用 cross_mean / cross_stddev / cross_semistd_pos 与 neg 之差 / cross_autocorr
    聚合成慢变量;cs_rank(C) 先在截面取名次、再在日轴做 20 日减 120 日的均值差或 cross_hurst,名次把全市场整体漂移去掉;cs_bucket_demean(C,
    key) 按流动性 / 波动 / 流通市值十分位分桶去均值,是比尺子的三次多项式更彻底的非参数剔除,再取 60 日均值;最后一个种子是 beta 的名次减水平的名次。


    为什么和以前不同:快照里 9 个候选的外围算子集合只有 ts_min / ts_decay_linear / sigmoid / pow / cs_rank,窗口
    ≤ 50,全部是 C 自己的平滑,没有一个把另一条序列(全市场均值)引进来,没有跨日回归,没有 60 日以上的窗口。这 16 个种子的外围是 cs_mean
    作回归元的 cross_regbeta / cross_reg_tvalue / cross_corr / cross_regres,加 cross_stddev
    / cross_semistd / cross_autocorr / cross_hurst / cs_bucket_demean,窗口 60 ~ 180。我把种子的算子骨架(抽掉字段、常数、窗口)逐个对照了两个库
    5583 条解析出的 4077 个不同骨架,没有一个相同;5583 条里 cs_mean 共出现在 48 条,绝大多数(36 处)是 is_gt 的阈值,只有
    1 条(挖掘库 B039)把价格平方的截面均值放进 ts_reg_fvalue 当回归元,没有一条以 |φ| 或任何成交量量度的全市场均值做 beta /
    相关 / 残差;也没有一条先取 cs_rank 再做日轴 hurst。预计与 3 个 head 的日度秩 |ρ| 远低于 0.7(beta / 相关 / 残差读协动与变化,不是水平),与五个控制
    < 0.5;如果某些种子(如分桶去均值那几个)与 head 仍高于 0.7,审计表会自动划掉,剩下的足够。


    为什么样本外还会在:b_i 是流动性风险暴露,补偿的是一种风险而不是一次套利,不依赖某一段行情;e_it 的聚合反映持仓结构和参与者构成的慢变,窗口 60
    ~ 180 日,十分位书的换手低,15 bp 成本下能承受。诚实预期:水平类写法最慢也只到 -1.4 上下,这里把水平拿掉,最可能的结果是分数上移到 -1
    ~ -0.3 之间但仍低于 0.5(出 head 的概率约 4%);主要失败方式:b_i 的滚动估计噪声大于截面离散,名次近似随机(换手高、被成本吃掉)。


    数学检查:所有窗口只含 t 日及以前,φ 只用 t 日分钟,t+1 交易,无前视;φ 在当天分钟成交量方差近 0 时是 NaN,不填充;cs_mean 忽略
    NaN;回归的自变量是全市场均值,标准差约 1e-2、方差远大于 0,分母不是个股自己的近零量,不会出现个股爆点;cross_hurst 在 S < 1e-9
    时给 NaN;输出连续取值(没有 argmax / 离散档),满足不同值 ≥ 50% 的闸门;最长回看 180 日;视窗从 2018-01-02 开始、没有更早的热身行,头
    d 日的滚动窗口是不满窗的(cross_mean / cross_stddev / cross_regbeta / cross_corr 在不满窗时只用已有的天,cross_hurst
    头 59 日是 NaN),这些早期估计噪声大,但只占 train 的头几个月、不决定结果,覆盖率不受影响;不用 ts_rank / cross_rank(当天缺失返回
    0 的已知行为),不用 ts_spearman / nt_*。'
