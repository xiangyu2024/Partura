  why: 烂部件有两处,依据都来自拆解表。(1) ts_min 的 5 日窗口:2 / 5 / 10 日 = -3.31 / -2.98 / -2.41,单调变好,窗口是整张表里唯一明显起作用的部件,而
    sigmoid / pow / cs_rank 这些保序外壳拿掉最多差 0.15,Volume 换 Amt 不变。(2) 水平本身是控制(流动性 / 成交额离散度
    / 市值)的函数:cs_rank 只做全截面名次,保留了对这些水平的整体暴露。变体用 cs_bucket_demean 把 |φ| 在同流动性 / 同流通市值
    / 同波动 / 同已知成交额族 / 同上市年龄十分位的股票之间去均值(非参数剔除,比尺子的三次多项式彻底),窗口各取 5 日(只换去水平这一个部件)和 50
    日(再叠加变慢);另两个把 sigmoid 里的 |φ| 对全市场均值 cs_mean 做 60 日滚动回归残差(去掉全市场共同状态)再 ts_min。每个变体只改这一处,分数变化可以直接归到被换掉的部件上。(ListAge
    对 2018 年以前上市的股票是哨兵值 10000,分桶只用名次,这些股票落在同一组,不做算术。)
