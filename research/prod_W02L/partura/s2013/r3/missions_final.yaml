- type: N
  hypothesis: 新 idea:全市场共同状态下的个股耦合——"个股自己的成交 / 收益对全市场同一量的敏感度"(commonality beta),以及它在成交异常日
    / 下跌日的条件版本。 inspired_by 是本流的现象:14 个 head 都是"个股自己 120 日窗口里收益对一个成交量度量的斜率",且 y 去掉市场均值(cs_demean)略好;第
    1 轮 R 里"回归掉全市场均值"是少数有效的处理; 本流还没有任何 head 把"全市场的量"(cs_mean 作回归元)放进斜率——回归元都是个股自己的成交量度量。
    机制(四类):(a) 条件市场 beta:cross_regbeta(mul(cs_mean(D), 滞后成交额 z 分数), D, 120),个股收益对"市场收益
    × 自己放量程度"的敏感度——放量的票被市场收益"带"得更多是信息交易 / 杠杆资金的指纹,与 Karpoff / Llorente 的量价关系是同类但回归元是市场层
    × 个股层的交互; (b) 下跌 / 上涨 beta 的不对称 sub(downside beta, upside beta)(Ang-Chen-Xing
    2006 的下行风险溢价,A 股没有融券,下行 beta 的补偿更清晰),用 is_lt / is_gt 截断市场收益实现; (c) 流动性协动 Chordia-Roll-Subrahmanyam
    2000:个股成交额 z 分数对全市场平均成交额 z 分数的斜率(cross_regbeta(cs_mean(Z), Z, 120)),流动性协动高的票对流动性冲击的暴露大,要求更高回报;
    (d) 收益 → 未来成交额的"注意力响应"斜率 cross_regbeta(cross_delay(D, 1), Z, 120)(昨日收益对今日成交额 z
    分数的回归)和它的 corr / 波动版本。 算子怎样实现:cs_mean(x) 是当日全市场平均(截面均值,每日一个数广播到每只票),cross_regbeta(x,
    y, d) 对每只票在 d 日窗口里做 y ~ x 的时序回归,所以市场层变量作回归元就得到每只票的"市场敏感度"; cross_delay(·,1) 保证只用昨日;截面均值里含当日全部股票收盘数据,是当日收盘后才知道的量,但信号在当日收盘后才使用,不违背"只用
    t 日收盘及以前"。 为什么和库不同:库里 cs_mean 作回归元的只有 0 到个位数次(第 1 轮已核对),没有 cross_regbeta(cs_mean(·),
    ·) 配成交额 z 分数;head 全是个股自己的量作回归元。 它们对 5 个控制的暴露:市场 beta 与波动 / 流动性有关,但尺子已去掉线性 / 平方
    / 立方;条件和不对称版本更靠近交互项。 为什么样本外还会在:beta 是慢变量(120 日窗口),换手低,是 head 的同类"慢斜率"家族(train
    / valid 同号);机制(下行风险溢价、流动性协动)有 2000 年前后起的跨市场证据,不依赖单一区间。 风险:市场 beta 是波动 / 规模的强函数,可能被控制吃掉;市场回归元在
    120 日窗口内变化小的区间斜率估计噪声大。
