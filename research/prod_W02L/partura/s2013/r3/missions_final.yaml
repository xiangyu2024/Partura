    共性表里含 B 的 5 个候选均值 +0.24 对 -1.71,p 0.001)。B 的数值是一个个股的"慢斜率"(120 日窗口,一年内每日一个值), 而
    head 对它的所有处理只有"对它自己再做一次 120 日回归"(嵌套 regbeta)。 假设:alpha 不在 B 的水平,而在 B 的"变化 / 稳定性
    / 相对自己历史的位置":耦合刚刚加强的票(B 相对自己 60 日的 z 分数、20 日增量)与耦合一贯强的票对后续收益含义不同 (前者是新信息在被吸收,后者是慢性特征);同时
    B 里仍带成交额量纲 1/sd(x),所以另外几项把它对市值 / 流动性做截面回归去掉水平。 外围(都与头部不同,头部只有嵌套回归):(i) 相对自己的历史
    cross_zscore / sub(B, cross_mean) / div(B, cross_stddev)(信噪比);(ii) 变化 cross_delta(B,
    20)、 cross_decay_linear(B, 20)、cross_ema;(iii) 尾部 cross_min / cross_tail_mean_q75(B
    在近 60 日里最强 / 最弱的状态); (iv) 截面回归去水平:cs_regres(B, LogFloatCap) 与 cs_regres(B, 20
    日平均成交额);(v) 对比:B(滞后 φ)减去同一结构用当日 φ 或不含 φ 的 cross_regbeta(day_sum(Amt), day_sum(Ret),
    120), 读"φ 的滞后加权带来的增量耦合";(vi) 对市场层 cs_mean(B) 的时序回归残差:个股自己的耦合偏离全市场耦合的部分。 算子:cross_*
    全部只用 t 日及以前;cs_regres(Y, X) 是每日截面上 Y 对 X 的残差;B 里 cross_delay(φ,1) 是昨日的 φ,无前视。
    为什么和库 / 以前不同:快照里含 B 的外围只有"嵌套 regbeta"与更换窗口,没有一个是对 B 取"相对历史 / 变化 / 尾部 / 截面残差";库里
