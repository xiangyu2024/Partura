slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 2, 3, 11]
    reasons: '新颖度 3：核心 Z = cross_zscore(day_sum(Volume), 60) 是快照 head 3、head 4 的共同子树（head 4 含其滞后一日），loc.json 的富集表核对属实：含它的 22 个已评分候选均值 -0.50，不含的 -2.04。核心本身与快照最大原始 |ρ| 为 0.25（head 6，ts_min(cs_bucket_demean(...),5)），残差 |ρ| 为 0.45（head 5），与五个控制的 |ρ|：liq 0.01、vol 0.15、rev 0.44、known 0.04、size 0.04，E 位核心门槛（< 0.8）通过；16 个种子都原样含核心。种子的新意只在「去掉水平乘子」与外层的 y、统计量、滞后的变换。与 head 3 的原始 |ρ|：seed 1–3 为 0.745–0.767，seed 11（带 day_max(Amt) 水平）为 0.869，这四个被表自动划掉，我同意：它们是 head 3 去掉水平后的同一截面排序的换统计量写法。其余 12 个（4–10、12–16）与 head 3 为 0.12–0.69，与各 head 的原始 |ρ| 都在 0.7 以下，不是同一个东西。库（inputs/libs_train.csv，5598 行）里已有 Amt 与收益的滚动相关族（cross_corr(Amt, Ret, 60) 精确出现 15 次，多套在 day_max / cs_sum 外壳里），但没有成交量惊奇的斜率。这不是换写法，所以不给 1；但去掉水平后与 head 3 的截面排序仍有 0.75 的相关，说明新意有限，给 3。合理度 4：机制清楚（成交量相对自己 60 日的惊奇，乘以个股 120 日的价格耦合斜率；文献 Karpoff 1987、Llorente 等 2002 讲的是量价延续还是回吐）。算子逐个核对：cross_zscore（ops_ext.py:208）分母为 sd + EPS，窗口 sd 不足水平的 1e-6 倍时返回 0；cross_regbeta / cross_regres / cross_reg_tvalue / cross_corr 都在 AlphaCube 的 rolling_ols、rolling_pair_reduce 里（operators/common.py:621、643）：beta = cov / var_x 且 var_x ≤ EPS 时给 NaN，不除近零；cross_regres(x, y, d) 返回 y 对 x 的滚动残差，因此 seed 14 是个股收益对市场均值的残差；cross_delay 只取过去的值（dt_cross.py:150）；cs_rank 保留 NaN，不经过 nanrank_last，那个 0 陷阱不适用。无前视：奖励按次日标签计（books.py），所有 x 都滞后一日；seed 10 的 x 是当日 Z、y 是当日收益，与快照 head 1 用当日成交量的约定相同，信号在收盘后形成，不前视。注意点（不挡）：PI 的 hypothesis 没有提到核心与 20 日反转控制的 |ρ| 0.44；但残差尺子已去掉其线性、平方、立方暴露，不构成挡理由。seed 6（原始 |ρ| 0.691）与 seed 14（0.667）贴着 0.7 线，按规则不划，但会是最靠近 head 3 的两个。seed 9 的 y 为日内波动，seed 4 与 5 只是滞后阶数与平滑的变体、与 seed 1 不是同一个量，保留。如果它有 alpha，最可能来自：个股对自己放量惊奇的价格反应（延续还是回吐）的慢属性，即持仓结构、信息环境、散户占比；而不是成交额水平（水平部分由 head 3 携带，本位的 seed 1–3 已划掉）。保留 4–10、12–16 共 12 个。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [13, 14, 15]
    reasons: '新颖度 4：快照 10 个 head 中 5–10 全是 φ = day_ar1_coefficient(Volume) 的水平外壳（sigmoid / pow / ts_min / ts_decay_linear），1–4 是成交额或成交量的水平乘子；没有一个 head 把构成量当回归元去回归当日收益。本位 A 组 1–12 把 φ、gini、重心、净买入比、零成交占比、Hurst、成交额加权收益这些构成量（均滞后一日）作为回归元，与 10 个 head 的原始 |ρ| 为 0.12–0.36（seed 3 0.345、seed 1 0.329、seed 2 0.364 为最高），与五个控制的最高 |ρ| 为 0.12，不是控制的换写法。PI 的库统计核对：φ(Volume) 在 inputs/libs_train.csv 中出现 228 次（与 PI 一致），但以它为参数又套在 cross_* 回归 / 相关 / 协方差里的只有 2 条（X 2503、X 3240），没有一条与 day_sum(Ret) 直接配对；day_gini、day_centroid、day_signed_ratio、day_zero_ratio、day_wmean、cross_zscore 在 CSV 里各为 0 次，与 PI 一致（CSV 共 5598 行，PI 写 5583，差异不影响判断）。因此 A 组是本质不同的回归元。B 组 13–15（median(Amt) × 构成量）与 head 2 的原始 |ρ| 为 0.756 / 0.827 / 0.742，被表自动划掉；它们的截面排序主要来自 median(Amt) 水平乘子，与 PI 的预测一致。B 组余下的 seed 16（当日 day_sum(Amt) × 滞后 φ，与 head 3 的 |ρ| 0.397）保留，但它带当日水平，是 head 3 的近亲。合理度 4：机制清楚（φ 的连续性、gini 的突发性、重心的时点，反映持仓结构与交易者构成的慢变；文献 Admati 与 Pfleiderer 1988、Barclay 与 Warner 1993、Llorente 等 2002 的 c 系数）。算子逐个核对：day_ar1_coefficient（dt_day.py:336）方差 < 1e-8 时给 NaN，不填充；day_gini（ops_ext.py:136）是按升序排列的 Gini 公式，缺失分钟排到末尾并在求和中归零，n ≤ 1 或总量为 0 时 NaN；day_centroid（ops_ext.py:155）取值在 [0, 1]，合计为 0 时 NaN；day_signed_ratio（:122）与 day_wmean（:109）的分母 clamp 1e-30 且合计为 0 时 NaN，不出现个股爆点；day_zero_ratio（:273）只统计有限分钟，全缺失为 NaN；cross_regbeta 在 var_x ≤ EPS 时给 NaN。所有 x 都滞后一日，y 为当日收益，与快照 head 的约定相同，按次日标签计无前视；seed 16 的 x 含当日 Amt，同样只用当日收盘后已知的量。注意点（不挡）：（i）day_hurst（dt_day.py:252）用 log(R/S) / log(241)，在 241 根分钟上主要读出日内 U 型累积偏差的极差，不是真正的长记忆，解释时不要说成长记忆；它若遇到分钟级 NaN，cumsum 之后全为 NaN，R 只用前缀，若停牌是整日掩码则不受影响。（ii）seed 8 的 day_zero_ratio 在多数大盘票上接近 0，窗口 var_x 可能很小，beta = corr · sd(y) / sd(x) 会被放大；var_x 的非零下限约为 (1/241)^2 ≈ 1.7e-5，远大于 EPS = 1e-9，EPS 守卫不会触发。coverage 0.99 说明多数股票窗口内都有非零变化，我不认为这是系统性爆点，但 PI 解读时应检查 top 十分位的成分。（iii）seed 10 的 day_wmean(Ret, Amt) 滞后一日对当日 day_sum(Ret) 的斜率，本质是一日收益的延续 / 反转，与控制 rev（20 日）不是同一个量，保留。如果它有 alpha，最可能来自：持仓 / 交易者构成的慢变（连续成交与一阵一阵的成交、成交的时点、买卖失衡）与当日收益在 120 日里的耦合，而不是成交额水平（A 组没有水平乘子）。保留 1–12 与 16 共 13 个。'
R:
  - head: 'cross_regbeta(mul(cross_delay(day_median(Amt), 1), cs_rank(cs_mask_top_replace_mean_neg(cross_delay(day_sum(Volume), 1)))), day_sum(Ret), 120)'
    soundness: 4
    reasons: '合理度 4：四个变体各改一处或两处（Volume 换 Amt 且窗口 240；y 换成 cs_demean 去市场；窗口 180；去掉 cs_mask_top_replace_mean_neg）。算子核对：cs_mask_top_replace_mean_neg（operators/nd_cs.py:240）把每日最低 10% 替换为当日均值，替换后的并列由列序打破，§4 明确不算问题；cs_demean 只在当日截面上做；cs_rank 保留 NaN；所有窗口只含 t 日及以前，x 滞后一日、y 为当日收益，无前视。去掉 mask 的变体 4 得到的是 Amt 滞后的名次，机制清楚。corr 表里四个变体与原 head 的原始 |ρ| 为 0.50、0.71、0.60、0.84，都在替换判定的预期范围内，不是挡理由。'
  - head: 'cross_regbeta(mul(cross_delay(day_median(Amt), 1), cs_rank(cs_mask_top_replace_mean_neg(day_sum(Volume)))), day_sum(Ret), 120)'
    soundness: 4
    reasons: '合理度 4：三个变体分别是 y 去市场（cs_demean）、窗口 90（60 与 120 之间的插值探针）、Volume 换 Amt 且窗口 60。y 去市场的机制清楚（它是本批 R 位里已知有用的那一类），与 head 2 的组一致；算子同上，cs_demean 只在当日截面上，窗口只含 t 日及以前，x 为当日成交量的名次（与快照 head 1 相同的约定，y 为次日标签前的当日收益），无前视。窗口 90 与 60 变体是参数探针，机制不新，但不是数学问题。'
  - head: 'cross_regbeta(mul(cross_delay(day_median(Amt), 1), mul(cross_delay(day_sum(Volume), 1), cross_delay(cross_zscore(day_sum(Volume), 60), 1))), day_sum(Ret), 120)'
    soundness: 4
    reasons: '合理度 4：三个变体为 Volume 换 Amt 且窗口 240、y 去市场且窗口 240、窗口 180。算子核对：cross_zscore 与 cross_delay 同上，内层 mul 的三项都滞后一日，无前视；cs_demean(day_sum(Ret)) 只在当日截面上做。head 4 的短板在 valid 一侧（loc.md 拆解），窗口 240 与 Amt 换字段的两个方向都有 train / valid 的线索，机制（水平 × 滞后量 × 惊奇，耦合斜率）说得通。合并两处改动的变体（Amt 且窗口 240）可以归因，因为两个改动都是正的单独效应。'
  - head: 'cross_regbeta(mul(day_sum(Amt), cross_delay(cross_zscore(day_sum(Amt), 60), 1)), day_sum(Ret), 120)'
    soundness: 4
    reasons: '合理度 4：两个变体为 y 去市场（cs_demean）与 Z 的窗口 120（60 换 120）。PI 自己写「没有明显的烂部件」，第二个变体是窗口探针而不是去部件；但两个变体的机制都说得通（y 去市场是去掉全市场共同部分的已知有效处理，Z 的窗口只改变相对自己的基准长度），算子无问题，无前视（day_sum(Amt) 为当日、Z 滞后一日，与 head 3 的约定相同）。因为「没有烂部件」的前提不成立而压到 3，我认为不妥，故给 4。'
summary: '槽 a 通过（新颖 3、合理 4，划掉 1、2、3、11，余 12 个，核心对五个控制的最大 |ρ| 为 0.44）；槽 b 通过（新颖 4、合理 4，划掉 13、14、15，余 13 个，需 PI 在读结果时核对 seed 8 的 1/sd(x) 放大与 seed 9 的日内 U 型读数）；R 四组合理度均为 4 全部保留；全计划未发现数学问题（前视、数值伪影、定义坏掉均未触发）。'
