    core: 'cross_zscore(day_sum(Volume), 60)'
    hypothesis: |
      事实(本流快照 + 第 1 轮结果):第 1 轮 N 位(99 次评估)出了 4 个 head(score +0.76 ~ +1.04,train 与 valid 同号同量级),全部是同一个形状:
      cross_regbeta(x, day_sum(Ret), 120),即个股自己 120 日里「当日收益对一个成交活跃度量 x 的回归斜率」(cross_regbeta 的第一个参数是回归元、第二个是被解释变量,
      已按 AlphaCube 源码核对:y ~ alpha + beta * x),x 由昨日的 day_median(Amt)、day_sum(Volume) 与 cross_zscore(day_sum(Volume), 60) 的乘积搭成。
      拆解表(loc.md):15 个 knockout(把 x 的一个部件拿掉)里 14 个仍在 +0.34 ~ +0.99,唯一的例外是 head 1 拿掉 cs_mask_top_replace_mean_neg(valid -0.37、train 仍 +0.50),
      而 head 2 里同一个部件拿掉几乎不变(+0.99 对 +1.01),说明那个部件是脆弱的装饰;最简版 cross_regbeta(day_sum(Amt), day_sum(Ret), 120) 仍是 +0.49(train +0.94);
      窗口 60 / 120 / 240 的分数在 +0.56 ~ +1.08。所以信号来自「斜率」这个统计量本身,不是某一种乘积写法。
      核心 Z = cross_zscore(day_sum(Volume), 60)(今日成交量相对自己 60 日的 z 分数):快照 158 个已评分候选里含它的 22 个平均 -0.50,不含的 -2.04(p < 0.001),
      head 4 含它(滞后一日),head 3 含它的 Amt 版本。它是无量纲、「相对自己」的量,自己没有成交额的水平乘子。

      假设:四个 head 的 x 都带成交额 / 成交量的水平乘子(head 1、2:昨日成交额中位数 × 成交量名次;head 3、4:成交额 / 成交量的水平 × 滞后惊奇),斜率 beta = corr(x, r) * sd(r) / sd(x) 因此同时带两样东西:(a) 耦合的方向(这只票放量时是不是在涨),(b) 1 / sd(x) 这个量纲因子——
      它是成交额水平的函数,新尺子只去掉对控制(流动性 / 市值 / 波动 / 已知成交额族)的线性、平方、立方暴露,量纲因子与别的量的交互项去不掉,所以 head 里有多少是 (a)、多少是 (b) 并不知道。
      这一位把 x 换成纯惊奇 Z(sd 约为 1,量纲没有了),beta 只剩 corr 与 sd(r):如果分数还在,alpha 来自耦合方向本身;如果掉光,来自量纲 / 水平。机制上 (a) 是「放量日是买盘主导还是卖盘主导」:
      A 股融券受限,Karpoff 1987 的量价正相关关系更强;Gervais、Kaniel 与 Mingelgrin 2001 的高成交量收益溢价、Llorente、Michaely、Saar 与 Wang 2002 的「成交量区分信息交易与对冲交易」都说,
      放量时价格是延续还是回吐是个股的慢属性(持仓结构、信息环境、散户占比),不是当天的行情。

      算子怎样实现(16 个种子每个都原样含 Z):cross_delay(Z, k) 取滞后 k 日的惊奇(只用 t-k 日及以前);cross_regbeta / cross_corr / cross_reg_tvalue(x, y, d) 在个股自己的 d 日窗口里估
      斜率 / 相关 / t 值。外围做了头部没做过的四件事:(i) 滞后阶数与平滑:lag 1 / lag 2(两层 cross_delay)/ 滞后一日的 5 日均 / 同日 / 60 日斜率再取 20 日均值;(ii) 被解释变量 y:全天收益换成下午段收益
      (in_slice(Ret, 121, 240),下标闭区间)、成交额加权的分钟收益 day_wmean(Ret, Amt)、cs_demean 去掉全市场同日同向的部分、对全市场均值收益 60 日回归后的残差(个体收益)、秩空间、日内波动 day_std(Ret)、
      净买入占比 day_signed_ratio(Ret, Amt);(iii) 统计量:斜率 / 相关 / t 值(三者换掉 1 / sd(x) 以外的尺度);(iv) 方向交互:mul(滞后惊奇, sign(滞后收益)),读「上涨之后放量」与「下跌之后放量」是否对应不同的后续收益;
      另外留一个带水平的对照(mul(day_max(Amt), 滞后 Z),水平用最大一分钟成交额而不是 head 用的日总额 / 中位数),用来读水平量纲还剩多少。

      为什么和以前不同:快照里已知含 Z 的 head(head 4)的外围是「滞后成交额中位数 × 滞后成交量 × 惊奇 → 对 day_sum(Ret) 回归 120 日」;我的种子外围是 cross_corr / cross_reg_tvalue / cs_demean / cross_regres / in_slice 收益 /
      sign 交互 / 秩空间,没有 mul(水平, 惊奇) 这个乘子(只有一个对照种子有)。两个库 5583 条里 cross_zscore 出现 0 次,day_sum(Ret) 出现 7 次、进入滚动回归 / 相关 / 协方差的只有 1 条
      (15 日 cross_cov,另一个参数是价格协方差的滚动最大值,不是成交量惊奇),我也逐个核对过骨架:没有一个种子的算子骨架(抽掉字段、常数、窗口)与 5583 条中任何一条相同。
      与 4 个 head 的差别:无水平乘子、y 与统计量不同;与五个控制的差别:惊奇的斜率是「相对自己的耦合」,不是水平,控制的暴露与它基本无关(Z 本身对流动性控制的日度秩相关应当很低)。

      为什么样本外还会在:耦合方向是持仓结构与信息环境的慢属性,120 日滚动估计逐日变化很小,十分位书换手低;第 1 轮 4 个 head 在 train 与 valid 同号同量级,说明这条线不依赖某一段行情。
      诚实预期:纯惊奇版本(没有水平因子)大概率比 head 差,但 y 换成去市场后的个体收益或相关系数版本可能留住大部分;最可能的失败方式是 120 个观测的相关系数估计误差(约 0.09)与截面离散度相当,
      名次大半是噪声(换手被 15 bp 吃掉)。

      数学检查:所有窗口只含 t 日及以前,滞后用 cross_delay,无前视;cross_zscore 的分母是 std + EPS,且窗口方差为 0 时返回 0(不会出 +-1 的浮点噪声);回归元 Z 的方差约 1,
      cross_regbeta 的分母 var_x > EPS 才给值,否则 NaN,不会除以近零的量;in_slice 下标闭区间且避开第 0 根;输出连续取值,不同值 >= 50%;最长回看 120 + 60 日,
      视窗从 2018-01-02 开始、没有更早的热身行,头几十日是不满窗(cross_* 在不满窗时只用已有的天),早期估计噪声大但只占 train 头几个月,不决定结果;不用 ts_rank / cross_rank,不用 ts_spearman / nt_*。
