  - type: N
    hypothesis: |
      机制:把第 1 轮在成交活跃度「水平」上找到的东西——个股自己 120 日里「当日收益对昨日成交活跃度的回归斜率」——换成活跃度的「构成」:当天的成交是连成一片还是一阵一阵,
      集中在几分钟里还是铺开,发生在上午还是尾盘,净流向是买还是卖。构成变量与水平不是一回事,控制们(流动性 / 成交额离散度 / 市值)对水平的线性 / 平方 / 立方暴露去掉之后,构成与收益的耦合还剩下。
      批里的现象(B037 / B038,17 个成员):全部是 phi = day_ar1_coefficient(Volume)(当天 241 根分钟成交量对前一分钟的 AR(1) 斜率,= 成交的连续程度 / 拆单)的水平外壳,
      换外壳(sigmoid / pow / cs_rank / ts_decay_linear)、换字段(Volume 换 Amt)分数几乎不动(-2 ~ -3),只有窗口更慢才更好(ts_quantile_q75 窗口 50、ts_decay_linear 窗口 30 是 B038 里
      仅有的三条未去控制 Sharpe 超过 2 的,train rank IC -0.043 ~ -0.049、换手 0.03 ~ 0.04);同一个对象一旦不当水平、而是当「回归元 / 残差」就明显好于所有水平写法:第 1 轮 E 位 103 次评估里最好的
      是 +0.12(train +0.66 / valid +0.12),cross_autocorr(cross_regres(cs_mask_top_replace_mean(|phi|), phi, 60), 60, 1);第 1 轮 R 位 12 个变体里最好的两个是 ts_min(cross_regres(cs_mean(·), ·, 60), 5 / 50)
      = -1.05 / -1.65,其余 10 个分桶去均值的变体在 -2.21 ~ -4.02。第 1 轮 N 位的 4 个 head 则是同一个思路的成交额版本:收益对昨日成交额的斜率。
      把两件事合起来:phi 本身的水平是死的,但 phi 对收益的「耦合」没有人试过。

      经济学:Admati 与 Pfleiderer 1988、Barclay 与 Warner 1993 的拆单 / 隐蔽交易(stealth trading):知情机构把大单拆成连续的小单,成交连续(phi 高)、不突发(gini 低)的日子里价格漂移,
      之后继续漂移;噪声 / 对冲流量则是一阵一阵、之后回吐(Llorente、Michaely、Saar 与 Wang 2002 的 c 系数:放量日的收益延续还是回吐区分信息交易与对冲交易)。
      个股对「昨日成交构成」的当日收益斜率是持仓结构与交易者构成的慢属性,不是某一天的行情。

      算子怎样实现(16 个种子,两组):
      A 组(无量纲,12 个):x = 昨日的构成量 cross_delay(·, 1) —— day_ar1_coefficient(Volume)(连续性)、day_gini(Volume)(突发性,0 = 铺开、接近 1 = 集中在少数分钟)、
      day_centroid(Amt)(成交额的时间重心,0 开盘、1 收盘)、day_signed_ratio(Ret, Amt)(上涨分钟的成交额份额减下跌分钟的份额,[-1, 1])、day_zero_ratio(Volume)(无成交分钟占比)、
      day_hurst(Volume)(成交量的长记忆)、day_wmean(Ret, Amt)(成交额加权的分钟收益);y = day_sum(Ret);统计量用 cross_regbeta / cross_corr / cross_reg_tvalue,窗口 120;一个是市场中性版(cs_demean 去掉当日全市场共同的 phi 与收益)。
      另一个是「收益延续」交互:mul(滞后的 phi, 滞后收益) 作回归元(Llorente 的 c 系数,条件变量由原来的成交量换成 phi),读的是「成交连续的日子之后收益是延续还是回吐」。
      B 组(带水平,4 个):x = 昨日 day_median(Amt) 或当日 day_sum(Amt) 乘以昨日的构成量(phi / gini / centroid)——保留 head 里反复出现的水平部件(滞后的成交额中位数,4 个 head 里有 3 个含它),
      只把头部里的「成交量名次 / 成交量惊奇」这一个乘子换成「构成」,读构成这个新乘子有没有增量。

      为什么和库里不同:5583 条里 day_ar1_coefficient(Volume) 出现 228 次,绝大多数是水平外壳(sigmoid / pow / 分位 / ts_decay_linear / ts_min),只有 6 条把它放进相关 / 协方差 / 回归(配的是开盘价 / 价格协方差 / Amt 的自相关,没有一条配收益);
      day_gini / day_centroid / day_signed_ratio / day_zero_ratio / day_wmean / cross_zscore 在 5583 条里一次都没有出现;day_sum(Ret) 出现 7 次、进入滚动回归 / 相关 / 协方差的只有 1 条(15 日 cross_cov,配价格协方差)。
      我把 16 个种子的算子骨架(抽掉字段、常数、窗口)逐个对照了两个库的骨架,没有一个相同。与 4 个 head 的差别:head 的回归元全是成交额 / 成交量的水平或水平的惊奇,
      A 组的回归元是无量纲的构成量,B 组只共享滞后的成交额中位数这一个乘子;与五个控制的差别:构成量不是水平的函数(同一个成交额水平下 phi / gini / 重心可高可低)。

      为什么样本外还会在:持仓结构与交易者构成慢变,120 日窗口的斜率逐日变化小,换手低;第 1 轮 4 个 head 在 train 与 valid 同号同量级;机制(拆单 / 信息交易的延续 vs 噪声交易的回吐)不依赖某一段行情。
      诚实预期:出 head 的概率约 8%,A 组更可能落在 -1.0 ~ 0 之间,B 组更可能过线但也更可能与 head 1 / 2 的日度秩相关 >= 0.7 被表自动划掉;
      主要失败方式:单只股票 120 个观测的斜率估计误差与截面离散度相当,名次大半是噪声。

      数学检查:窗口只含 t 日及以前,构成量全部来自当天分钟、再滞后一日(cross_delay),无前视;day_ar1_coefficient 在当天分钟成交量方差近 0 时是 NaN,不填充;
      day_gini 在总量为 0 时 NaN;day_signed_ratio 与 day_wmean 的分母是当天成交额合计(clamp 1e-30,合计为 0 给 NaN),不会出现个股爆点;cross_regbeta 在 var_x <= EPS 时给 NaN;
      day_zero_ratio 的取值在 [0, 1] 内连续、不是计数型,输出经回归后仍是连续数,不同值 >= 50%;最长回看 120 + 60 日,头几十日不满窗(只用已有的天),不决定结果;
      不用 ts_rank / cross_rank,不用 ts_spearman / nt_*。
