- type: E
  core: div(day_open(Open), ts_delay(day_last(Close), 1))
  hypothesis: '事实(全部来自快照,不含 2026 年数字):

    (1) 本流第 2 轮 N 位(隔夜 vs 日内)的最好候选是 cross_mean(div(abs_(隔夜跳空), LimitWidth), 120):score -0.38(train -0.38 / valid +0.22,方向 +1,半衰期 0),其中隔夜跳空 = div(day_open(Open), ts_delay(day_last(Close), 1)) - 1,LimitWidth 是流水线给的涨跌停幅度(主板 0.1、创业板 2020-08-24 起 0.2、科创板 0.2、北交所 0.3)。GP 在它上面长出的 cross_mean(div(signedpower(div(abs_(跳空), LimitWidth)), LimitWidth), 120) 是 -0.19(train -0.19 / valid -0.16):整个流 3 轮里唯一一个不带任何闸、两段都在 -0.2 附近的对象(第 1 轮最好 -0.97,第 2 轮 E 位带闸最好 -0.33)。signedpower 默认指数 2,即比值的平方,说明极端跳空(接近涨跌停开盘)加权更重更好;再多除一次 LimitWidth 的 div(div(.)) 版本 -0.80、减去 day_es_ratio_hi(Vwap) 的版本 -0.74 都更差。带符号的跳空均值(60 / 120 日)和「隔夜 - 日内」差没有进入前 5(<= -0.80)。

    (2) 与控制的关系(R2 相关度表,同一个种子 120 日版):对 5 个控制的日度秩 |ρ| 流动性 0.40 / 波动 0.37 / 反转 0.01 / 已知族 0.42 / 市值 0.04,都低于 0.5,不是控制的换写。

    (3) 库 5583 条里 LimitWidth 0 条,隔夜跳空比 0 条;快照里 29 个含它的候选平均 -1.37 对不含的 -2.37。


    假设:LimitWidth 归一化的隔夜跳空强度,衡量的是「信息通过休市渠道(公告、新闻、外盘)进入价格的频率与幅度」,以这个板块允许的最大波动为单位,使主板、创业板、科创板、北交所可比;它不是日内波动(控制里的波动与成交额离散度读的是交易时段的东西)。机制有三条文献线:隔夜收益与日内收益由不同的参与者决定且各自持续(Lou-Polk-Skouras 2019);散户在开盘集中买入高关注度股票(Berkman-Koch-Tuttle-Zhang 2012;Aboody 等 2018 把隔夜收益读为个股情绪);休市渠道的信息强度是股票的稳定特征,所以 241 日的慢统计应当比 120 日更干净,换手更低。这一位的 16 个种子沿着已经读到的方向外推,每个只改一处:

    - 强度的形状(种子 1、2、3、4、5、12、14):平方(1)、立方(2)、半衰期 60 的 cross_ema(3)、不取幂的 241 日均值(4)、中位数 = 典型跳空而不是极端(5)、上四分位日的均值(12)、再除一次 LimitWidth 复现 GP 的 -0.19 但窗口改 241(14)。窗口加长到 241 是因为:快照里 > -1.5 的候选几乎都是 120 日以上的慢量,同一波里目前最好的几个读数(种子 2009 的 cross_mean(·, 241) 一族,train / valid 都在 0 附近)也是 241 日窗口。

    - 方向拆分(种子 8、9):只取上跳 (g - 1)+ 与只取下跳 (g - 1)- 各除 LimitWidth,读哪一侧有 alpha、符号是什么(书会按 train 自己选方向)。

    - 跳空与同日日内的关系(种子 6、7、11、10):跳空与同日日内收益的 241 日相关(6)、跳空的一阶自相关(7)、跳空方向 × 同日日内收益(11,继续还是回吐)、隔夜强度占隔夜加日内强度之和的比例(10)——Berkman 等的「隔夜强、日内弱」机制的直接检验。

    - 相对自己的变化与中性化(种子 13、15、16):20 日强度相对自己 241 日的 z 值(13,新闻流突然增多);同一流通市值十分位内标准化(15)、同一成交额离散度(控制里的已知族)十分位内去均值(16)——去掉与规模 / 流动性的共线部分以后还剩什么。


    算子怎样实现:核心 div(day_open(Open), ts_delay(day_last(Close), 1)) 在每个种子里原样出现(分钟立方体先折成日开盘价与前一日收盘价,后复权价格,除权日连续);abs_ / sub / div / pow_2 / pow_3 / cs_winsor 做成日度强度量,cross_mean / cross_ema / cross_med / cross_tail_mean_q75 / cross_zscore / cross_corr / cross_autocorr 沿日轴做慢聚合。多数种子在聚合之前先做 cs_winsor(每天按 1% / 99% 截尾),原因是新股上市第 2 ~ 5 天(创业板、科创板无涨跌停)的跳空可达 LimitWidth 的数倍,平方 / 立方以后会让上市不到一年的名字在 241 日窗口里支配整个截面。


    为什么和已见过的不同:已见过的含该核心的候选(R2 的 N 位 15 个种子加 GP 后代)全是 120 日以内的窗口、大多不除 LimitWidth、带符号均值与「隔夜 - 日内」差占一半以上;这里没有一个与我能看到的它们的外围算子集合重复(已逐个核对),窗口、幂次、方向拆分、同日关系、桶内标准化都是新的。库里没有同骨架的表达式(逐个对照了 5583 个库骨架);与 9 个 head 的日度秩 |ρ| 预计很低(heads 全是 day_ar1_coefficient 的平滑 / 分位或价格 AR(1),种子里没有)。


    为什么样本外还会在:涨跌停幅度是制度规则,按板块给定,归一化后的强度只取决于信息到达的节奏;241 日平均几乎是股票的稳定特征,换手极低(R2 的最好读数半衰期是 0 ~ 5 天,不靠 20 日 EMA 压换手),15 bp 成本占比可以忽略。诚实预期:出 head(>= 0.5)的概率约 3%;更可能的结果是平方 / 立方 + 241 日的种子把 min 推到 -0.2 ~ 0.0 附近,train 仍是拖后腿的一段(R2 里 train -0.19 ~ -0.38、valid -0.16 ~ +0.22),方向拆分与同日关系各组之间的差是主要读数。


    数学检查:LimitWidth 只取 0.1 / 0.2 / 0.3(不会近零);ts_delay(day_last(Close), 1) 为后复权价格(正),停牌日若没有收盘价则当日跳空为 NaN,被 cross_* 当缺失,不会产生跨多日的假跳空;pow_2 / pow_3 作用在截尾后的非负比值上,不会下溢或溢出;cross_zscore 有 std + EPS 且对近常数窗口返回 0;cross_mean / cross_ema 对窗口不足的前期取已有天数,没有 NaN 热身;没有任何一个除法的分母可能近零(只有 LimitWidth 与正价格);面板不是常数(强度量连续取值)。无前视:当日开盘价与前一日收盘价都在当日开盘时已知,聚合窗口因果,t 日信号 t + 1 交易。'
