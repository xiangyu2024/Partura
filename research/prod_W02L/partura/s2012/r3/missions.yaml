R:
- head: ts_quantile_q75(day_ar1_coefficient(in_slice(Vwap, 30, 210)), 120)
  why: 烂的部件有两处,依据都在本轮拆解表里。(1) 窗口:拆解表里 q75 的窗口 60 / 120 / 240 的 score 是 -1.62 / -1.54 / -1.38,valid 都在 -0.5 ~ -0.6,train 随窗口变长单调变好(R2 的 R 组里对 φ(Volume) 头同一类窗口加长一路到 -0.79 ~ -0.88 也没有拐点),流水线自己给的 R 候选就是 240。(2) 长仓里的垃圾尾部:这个头 train -1.54、valid -0.53,差 1.0;而本流第 2 轮 E 位里同一个外壳 cs_last_high40(cs_last_high20(Y, LogFloatCap), inv(ListAge)) 把三个互不相关的 Y 都推到 train -0.33 ~ -0.42 / valid +0.4 ~ +0.6,说明外壳本身有贡献。变体:v1 只把窗口改 240(自动候选,作为基线);v2 = v1 + 年龄闸;v3 = v1 + 年龄闸 + 大市值闸;v4 = v1 + 年龄闸 + 冻结 / 不活跃闸。v2 - v1、v3 - v2、v4 - v2 分别是各闸的边际,分数变化可以直接归到闸上;同一个 Y 与 E 位里的 Y 无关,因此也是「外壳的收益是不是与 Y 无关」的对照。无数学问题:in_slice(Vwap, 30, 210) 是分钟 30 ~ 210 的价格,日内 AR(1) 因果,窗口 240 的 q75 对缺失天不计。
  variants:
  - ts_quantile_q75(day_ar1_coefficient(in_slice(Vwap, 30, 210)), 240)
  - cs_last_high40(ts_quantile_q75(day_ar1_coefficient(in_slice(Vwap, 30, 210)), 240), inv(ListAge))
  - cs_last_high40(cs_last_high20(ts_quantile_q75(day_ar1_coefficient(in_slice(Vwap, 30, 210)), 240), LogFloatCap), inv(ListAge))
  - cs_last_high40(cs_last_high20(ts_quantile_q75(day_ar1_coefficient(in_slice(Vwap, 30, 210)), 240), cross_max(day_zero_ratio(Ret), 3)), inv(ListAge))
- head: ts_quantile_q75(ts_quantile_q75(day_ar1_coefficient(Volume), 50), 50)
  why: 烂的部件是窗口与垃圾尾部。上一轮 R 组已读到:外层窗口 150 / 内 100 + 外 150 的 score 是 -0.88 / -0.79(原头 -1.80),增益 +0.9 ~ +1.0,但与已知族的 |ρ| 是 0.53 / 0.51(>= 0.5)所以没有收录——这个对象的水平被流动性类控制吃掉一部分。变体保留 100 + 150 的慢窗口,各加一个闸:v5 = 年龄闸;v6 = 年龄闸 + 大市值闸。闸把一批名字整体压到底,是对排名的非线性改动,看它能否把 |ρ_known| 拉到 0.5 以下并继续提分。无数学问题:嵌套 ts_quantile_q75 对缺失天不计,day_ar1_coefficient(Volume) 对停牌日给 NaN。
  variants:
  - cs_last_high40(ts_quantile_q75(ts_quantile_q75(day_ar1_coefficient(Volume), 100), 150), inv(ListAge))
  - cs_last_high40(cs_last_high20(ts_quantile_q75(ts_quantile_q75(day_ar1_coefficient(Volume), 100), 150), LogFloatCap), inv(ListAge))
