  hypothesis: '事实(全部来自快照与流水线代码,不含任何 2026 年数字):

    (1) 本流第 2 轮 E 位(同一个核心 inv(ListAge))108 次评估里最好的三个——score -0.33(train -0.33 / valid +0.59)、-0.37(-0.37 / +0.39)、-0.42(-0.42 / +0.61)——外壳完全一样:cs_last_high40(cs_last_high20(Y, LogFloatCap), inv(ListAge)),意思是「把 2018 年以后上市的名字(年龄闸)和流通市值最高 20% 的名字(大市值闸)都压到所有名字之下,其余按 Y 排」。而它们的 Y 互不相干(慢的 -LogFloatShares、日内 Durbin-Watson × 去重价位比、慢的 -at_max_ratio(Open)),我自己第 2 轮的种子(只带年龄闸,或年龄闸 + 一个别的垃圾标记)全部在 -0.42 以下。所以 valid 的正收益看起来来自外壳而不是 Y。

    (2) 我的读法:三个 Y 有一个共同点,都是名义价位 / 价位格点的代理。LogFloatShares 在去掉市值的线性、二次、三次暴露以后应当主要剩下价位(LogFloatCap - LogFloatShares = log 价格);价位越高,最小变动价位占价格的比例越小,日内价格格点越细(DW × 去重价位比越高,钉在同一价位上的时间占比 at_max_ratio 越低)。

    (3) 三个的 train 都是负数、valid 都是正数,拖低 min 的是 train。


    假设:外壳里混着两件事。(a) 两个闸是「清理样本」:新股与解禁供给(Ritter 1991 的 IPO 长期弱势;Field-Hanka 2001 的限售股解禁)是制度性的,两段都该有贡献。(b) 大市值闸是相对流通市值的阶梯函数,控制里的 LogFloatCap 只去掉了排名的 1 / 2 / 3 次多项式,阶梯留有残余,等价于押「非大盘相对全市场等权」,这是行情依赖的押注,可能只在 valid 的行情里赚钱。这一位的 16 个种子把这两件事拆开,并给闸之后的排序换成新的对象:

    A 组(种子 1、4、10、15、16;Y = 隔夜跳空强度)——另一个 E 位里的主线对象 |隔夜跳空| / LimitWidth 的 241 日平均(平方版)放进同一个外壳:种子 4 只有年龄闸、种子 1 = 年龄闸 + 大市值闸、种子 16 用「同一流通市值十分位内标准化」代替阶梯,三者两两之差分别读出「大市值闸的边际」和「它是不是市值阶梯」;种子 10 把年龄闸收窄到「最年轻的 10%」(high40 在哨兵并列块的作用下,实际是把 2018 年以后上市的所有名字都压下去,上市多年的也算,占比随时间上升),读闸的宽度;种子 15 把 241 日平均换成半衰期 60 天的 cross_ema。

    B 组(种子 2、3)——第二个闸换成非规模的:cross_max(day_zero_ratio(Ret), 3) 最高 20%(近 3 天里分钟收益恰好为 0 的占比最大 = 冻结 / 不活跃的名字),与 sub(LogTotalCap, LogFloatCap) 最高 10%(总市值对流通市值的对数差 = 限售比例,解禁供给的代理)。如果 B 组比 A 组的种子 1 好或差不多,说明大市值闸不是必要的、也就不是市值押注。

    C 组(种子 5、6、11、12、13、14)——名义价位 / 格点的纯形式(不再混别的 Y):log 价格两个方向、价格格点的 120 日平均(去重价位比,高 = 细)、静止分钟占比 -flat_ratio(Close)、零收益分钟占比 -zero_ratio(Ret)、不经平滑的 -LogFloatShares。检验(2):如果价位格点真是共同来源,这几个应当和 R2 的三个最好值同档或更好,并且彼此排序一致(格点细 = 价位高)。

    D 组(种子 7、8、9)——12 个月平均日收益(cross_mean(日收盘收益, 241),后复权)的两个方向,以及对流通市值十分位去均值的反向版本:控制里只有 20 日反转,长于 20 日的反转 / 动量不在控制里(De Bondt-Thaler 1985 的长期反转)。


    算子怎样实现:核心 inv(ListAge) 在每个种子里原样出现,作为 cs_last_high40 / cs_last_high10 的闸变量(把最新上市的名字——按整块并列处理——压到所有名字之下,每个名字仍有有限值,书仍对整个市场计量);第二个闸 cs_last_high20 / cs_last_high10 同理;Y 是闸里被排序的量。


    为什么和已见过的不同:已见过的含该核心的候选,外壳的第二个闸只有 LogFloatCap 一种,Y 全是价位格点或分钟统计量的一两个。这里第二个闸有三种(大市值、冻结 / 不活跃、解禁供给)加一种「没有闸、用桶内标准化」,年龄闸有两种宽度,Y 引入了库里 0 条出现过的对象:LimitWidth 归一化的隔夜跳空(库 5583 条里 LimitWidth、cs_last_*、cross_ema、cross_zscore、日频字段叶子都是 0 条;隔夜跳空比 div(day_open(Open), ts_delay(day_last(Close), 1)) 也是 0 条)。种子的算子骨架已逐个对照 5583 个库骨架,没有碰撞;外围算子集合与我能看到的 24 种已见外围逐个核对,没有重复。


    为什么样本外还会在:年龄闸、冻结闸、解禁闸是交易规则与上市制度的产物,不依赖某一段行情;Y 是 120 ~ 241 日的慢统计或日频字段(几乎不动),换手极低,15 bp 的成本占比小。诚实预期:出 head(>= 0.5)的概率约 3%;更现实的产出是「min 分数比 -0.33 好 0.1 ~ 0.3」和把 train 与 valid 的差缩小,各组之间的差是主要读数。


    数学检查:inv(ListAge) 在上市首日(ListAge = 0)是 +inf,cs_last_* 内部用 isfinite 当缺失,一只股票一天不会支配截面;老股票的哨兵并列块按整块处理,不是列序打破。Y 里的除法只有 / LimitWidth(只取 0.1 / 0.2 / 0.3,不会近零)与 / ts_delay(day_last(Close), 1)(后复权价格,为正);cross_mean / cross_ema 对缺失天不计、对窗口不足的前期取已有天数(没有 NaN 热身);cs_bucket_zscore 内部加 EPS 且桶不足 2 个名字给 NaN;pow_2 作用在 [0, 数倍] 的比值上,不会溢出;日频字段与窗口都只含当日及以前,t 日信号 t + 1 交易,没有前视。'
