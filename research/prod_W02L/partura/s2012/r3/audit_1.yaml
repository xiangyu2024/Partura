slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [13]
    reasons: '相关度表:16 个种子对快照 9 个 head 的原始 |ρ| 为 0.18 到 0.59(最高 6 号 0.59,它最像 R 组 1 的 in_slice 头,残差 0.43),全部低于 0.7 的自动线;对五个控制的原始 |ρ| 最大 0.40(8 号与流动性、14 号与市值),全部低于 0.8。核心 inv(ListAge) 对控制最大 0.32(市值),对 head 残差 0.11,满足 E 位的核心条件;表中核心的原始 |ρ| 写的是 inf,是核心本身含 +inf 的计算伪影,不影响种子。核心被流水线标废品(distinct 0.14),但每个种子都用 cs_last 把它包住,核心不作候选,不划。新在哪:members.csv 的 5583 条里 LimitWidth、ListAge、cs_last 各 0 条(已 grep 核实);快照的 9 个 head 没有年龄维度;年龄闸是新的,novelty 给 4。算子核对:ListAge 上市首日为 0、之后每个交易日加 1、进入上市状态后粘住;2018-01-02 已在市的股票共享哨兵 10000 加天数,逐日成一个并列块。inv(0) 为 +inf,_lexi 用 isfinite 把它当缺失,输出 NaN,只影响上市首日一天,不是爆点。_lexi 的带只含整块落在前 40% 的并列块,所以被压到底部的是「最年轻的至多 40%」的上市块;2018 年后上市的名字占比低于 40% 时,压住的是全部这些名字。_pct_rank 与 _rank_block 的分母是有限值个数,没有问题。这些种子不用 ts_rank、cross_rank、in_rank_rolling,也不经过 nanrank_last。划掉 13 号:day_zero_ratio(Ret) 与 day_flat_ratio(Close) 按定义都是「分钟值不变的占比」(ops_ext 的 docstring 写的是 the price did not move);Ret 为分钟收盘价的涨跌幅时两者是同一个量;相关度行逐项相同(原始 0.19 对 0.19,残差 0.18 对 0.17,流动性 0.01 对 0.01,已知族 0.03 对 0.03,市值 0.12 对 0.12),划 13 号,保留 12 号。Ret 的确切定义我在仓库里没有核到,依据主要是相关度表。7 号与 8 号只差一步市值十分位去均值,逐项相差不超过 0.02,但操作不同,与第 2 轮对 9 号与 1 号的同类差异一样放行。14 号(neg(LogFloatShares))与第 2 轮 E 位最好候选里的「慢的 -LogFloatShares」在 LogFloatShares 几乎不变的前提下秩接近,但笔记没有给出那个表达式,我无法核实逐字重复,保留,交 PI 判断。5 号与 6 号互为符号,但两侧都有闸,多头书不同,放行。外围算子集合与第 2 轮的 13 个 inv(ListAge) 外围逐个核对,没有相同的。要 PI 读数时控制的偏差(不挡):(1) 闸的覆盖随时间变化:占比低于 40% 时闸压住全部 2018 年后上市的名字,超过 40% 后只压最年轻的一部分,所以 train 与 valid 的闸可能不是同一个对象;第 2 轮 train 负、valid 正的分裂可能部分来自这里,应当画出每日闸覆盖率的曲线。(2) 1、2、3、4、10、15、16 号的 pow_2(|跳空|/LimitWidth) 没有 cs_winsor,上市 2 到 5 日无涨跌停的跳空会放大它;年龄闸把这些名字压到底部,多头书不受影响,但会影响残差回归。(3) ST 票的 LimitWidth 偏差与 b 位相同,对这个位的 Y 同样适用。(4) C 组的 log 价格依赖 FloatCap 等于收盘价乘流通股数的假设(存储平面未核)。通过:划掉 13 号后剩 15 个,≥ 4;核心对五个控制的 |ρ| 最大 0.32 < 0.8。位通过。如果它有 alpha,最可能来自闸把上市 2018 年后的新股挡在多头书外的收益差(新股长期弱势的读法),而不是 Y 在闸后的排序;其次是 Y 的 241 日尾部在老股票中的排序。核心的来源(共性表或核心卡)我没有核,任务要求不读共性表,PI 请自行确认。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '相关度表:16 个种子对 9 个 head 的原始 |ρ| 为 0.12 到 0.56(最高 15 号 0.56,4 号与 9 号 0.55),残差 0.04 到 0.47,全部低于 0.7;对五个控制的原始 |ρ| 最大 0.40(5 号与 15 号的已知族),其次 0.39(5 号的流动性、16 号的市值),全部低于 0.8。核心 div(day_open(Open), ts_delay(day_last(Close), 1)) 对 head 原始 0.12、残差 0.21,对控制最大 0.09,满足 E 位条件。核心来源(共性表或核心卡)我没有核,任务要求不读共性表,PI 请确认。新在哪:members.csv 里 LimitWidth、cs_winsor 各 0 条,day_open(Open) 与 ts_delay(day_last(Close)) 同现 0 条;快照的 head 全是 φ 的平滑,没有隔夜或日内的量。第 2 轮 N 位做过同一对象(隔夜跳空除 LimitWidth 的 120 日均值,-0.38;GP 放大到 -0.19),本位把窗口改成 241、加 cs_winsor、换成平方 / 立方 / 中位数 / 尾均值 / 正负拆分 / 同日关系;外围与第 2 轮 N 位的 14 个种子逐个核对,没有相同的。与已知族 0.31 到 0.40、流动性 0.25 到 0.39 的重叠可观,novelty 给 4,与第 2 轮 N 位同档。算子核对:ON = day_open(Open) / ts_delay(day_last(Close), 1) - 1;ts_delay 沿时间轴取 x[t-1];day_open 是当日首个有限分钟值(day_first);LimitWidth 只取 0.1 / 0.2 / 0.3(tradability.board_limit)。cs_winsor 在每个截面上按 1% / 99% 截尾,pow_2 与 pow_3 作用在截尾后的非负比值上,不会溢出。cross_mean、cross_ema、cross_med、cross_tail_mean_q75 对窗口不足的前期取已有天数(rolling_windows 左补 NaN、再忽略 NaN),没有 NaN 热身。cross_autocorr(x, d, shift) 的实现是 cross_corr(x[shift:], x[:-shift], d),与 7 号一致。cross_corr 的分母带 EPS = 1e-9,零方差窗口给 0 而不是 NaN,是中性填充。cross_zscore 是 (x_t - 均值)/(标准差 + EPS),近常数窗口返回 0。cs_bucket_* 桶内不足 2 只为 NaN。10 号的分母是两个非负均值之和,只在两者同时为 0 时为 NaN,不是爆点。14 号的第二次除以 LimitWidth 把主板(0.1)的得分相对创业板 / 科创板(0.2)放大一倍、相对北交所(0.3)放大约两倍半,是板块倾斜而不是数学问题;第 2 轮的 div(div()) 版本更差,与此一致,放行。nanrank_last 不在这些种子里。两个已知偏差,不挡但要写进读数:(1) 上市期混入:创业板与科创板注册制后上市前 5 个交易日没有涨跌停,这几天的 ON / LimitWidth 可以是数倍;cs_winsor 只截到当日截面的 99% 分位,截不住这一群;cross_mean(·, 241) 对不满 241 日的名字只取已有天数,所以刚上市名字的均值由 IPO 初期决定。这只涉及一小部分名字,不是 §4 的「系统性算不出」,但它很可能是最可能的假 alpha 来源。PI 可以把 a 位的年龄闸套到 b 位最好的种子上做对照,看读数里有多少是年龄。(2) ST 票:LimitWidth 按板块给 10%,而 ST 的涨跌幅是 5%,tradability.board_limit 的 docstring 写明 ST 在立方体里没有标记;所以 ST 的 |ON| / LimitWidth 系统性地只有一半。若最终方向取低强度(多头取低 ON 强度),ST 会被系统性地拉进多头书。(3) 全市场视图从 2018-01-02 开始,流水线默认 warmup 为 60 天,所以 2018 年上半年的 241 日窗口是不满窗的;这对所有 241 日窗口的种子一样,不是这个位独有的。划掉:没有。1 号与 12 号(241 日 pow_2 均值与 q75 尾均值)的相关度行只差 0.01 到 0.02,是同一对象的两种统计量,按第 2 轮同类差异的标准放行;8 号与 9 号是 ON 的正负两部分,不是互为符号,放行。位通过:没有划,剩 16 个 ≥ 4;核心对控制的 |ρ| 最大 0.09 < 0.8。如果它有 alpha,最可能来自上市不满一年的创业板 / 科创板新股的 IPO 初期跳空;其次是隔夜跳空强度在老股票上的慢变排序(Lou-Polk-Skouras 的读法)。'
R:
  - head: 'ts_quantile_q75(day_ar1_coefficient(in_slice(Vwap, 30, 210)), 120)'
    soundness: 4
    reasons: '算子实现正确:in_slice(Vwap, 30, 210) 取日内分钟切片,day_ar1_coefficient 对切片做 OLS,方差接近零时给 NaN 而不填充(第 2 轮审计已核);ts_quantile_q75 对缺失天不计,不经过 nanrank_last。变体 v1 只改窗口(120 到 240);v2 在 v1 上加年龄闸;v3 在 v2 上加市值闸;v4 在 v2 上加冻结闸。每个变体的分数变化都可以归到它新加的那一处,归因成立,与第 2 轮 R 组 1 的问题不同。机制「head 的烂尾是长仓里的新股与市值尾部」有相关度表支持:v2 对 head 的原始 |ρ| 为 0.52、残差 0.54,说明年龄闸确实改变了排序,不是微调。但闸会改写相关度,不只是去尾:v3 的市值闸把对流动性的原始 |ρ| 从 0.36 降到 0.09、对市值从 0.37 降到 0.13,而对 head 的残差只从 0.54 降到 0.35,所以 v3 的分数不能全归到「去掉垃圾尾部」。另外 φ 是价格水平(Vwap)的 AR(1),不是收益的持续性,它的截面变化主要来自价位粒度与买卖价弹跳;理由没有处理这一点,不是数学问题,放行。v2 到 v4 是在 head 外面加闸,不是去掉或替换部件;第 2 轮 R 组同样加了去均值的变体,按同一标准放行。给 4。'
  - head: 'ts_quantile_q75(ts_quantile_q75(day_ar1_coefficient(Volume), 50), 50)'
    soundness: 3
    reasons: '算子实现正确:嵌套 ts_quantile_q75 对缺失天不计,day_ar1_coefficient(Volume) 对停牌日为 NaN,不经过 nanrank_last。v5 = 100 / 150 慢窗口加年龄闸,v6 = v5 加市值闸;与第 2 轮已评过的 100 / 150 基座(train -0.79、valid -0.49、已知族 |ρ| 0.51)比,每个变体只多一处,归因成立。机制的问题没有解决:φ(Volume) 的分位越慢越接近流动性水平;第 2 轮审计里外层 150 的 50/150 版本与流动性 |ρ| 为 0.56。本轮 v5 的流动性 |ρ| 为 0.44、已知族为 0.43,这个下降来自闸把一批最年轻的名字整体压到底部之后的秩变化,并不说明流动性分量被去掉了。所以 R 组的接受条件「与已知族 |ρ| < 0.5」可以被闸的结构机械地满足,而不证明去掉了什么。v6 的市值闸把原始流动性与已知族的 |ρ| 压到 0.00 与 0.01,说明闸去掉的主要是大盘里的流动性名字,而不是 φ 的内容。说不清「慢窗口留下的是流动性水平还是 φ 本身」,给 3,放行。'
summary: 'PROD W02L s2012 第 3 轮审计:a 位(E,核心 inv(ListAge) 的年龄闸,是第 2 个也是最后一个用该核心的 E 位)novelty 4、soundness 4,划 13 号(与 12 号同一量),通过;b 位(E,核心为隔夜跳空比,来源未核)novelty 4、soundness 4,未划,通过;R 组 1 合理度 4,R 组 2 合理度 3,均放行。没有确认的数学问题;2018 年爬坡期、闸的覆盖漂移、ST 的 LimitWidth 偏差、上市期跳空是需要 PI 读数时控制的已知偏差。未使用任何 2026 年数据。'
