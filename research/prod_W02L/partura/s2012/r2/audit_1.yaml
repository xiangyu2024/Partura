slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [9, 11]
    reasons: '相关度表:15 个种子对快照 6 个 head 的原始 |ρ| 为 0.24 到 0.49(最高为 4 号与 11 号的 0.49),残差后 0.17 到 0.40;对 5 个控制的最大 |ρ| 为 0.68(2 号、3 号与 vol),全部低于 0.7 与 0.8 的自动线,没有自动划掉。核心 inv(ListAge) 对 head 原始 |ρ| 为 0.22、对控制最大为 0.32(size),满足 E 位的核心条件;核心在共性表里(loc.md 的 inv(ListAge) 富集行),满足 §2 的核心来源。核心本身 distinct 为 0.14(流水线标废品):2018-01-02 在市的股票共享哨兵值 10000+t,形成并列块;种子经 cs_last 或 mul 包装后 distinct 为 0.96 到 1.0,核心不作为候选,不划。新在哪:库 members.csv 的 5583 条里 cs_last 为 0 条、LimitWidth 与 ListAge 为 0 条(已 grep 核实);快照 6 个 head 没有 ListAge,全是 φ 的平滑;年龄维度是新的,novelty 给 4。要说清的一点:es 比(day_es_ratio_hi)与 vol 控制 |ρ| 在 1、2、3、6、7、8、9、10 号上为 0.52 到 0.68,笔记说与控制相关低,对 vol 不成立;Y 的这一部分与波动是换写法,降低这几个种子的新度,但还没到同一个东西(0.8),位级 novelty 仍给 4。算子核对(读了源码):(1) ListAge(dailyfields._list_age):上市首日为 0,之后每交易日 +1,粘性,哨兵 +10000,未上市为 NaN;因果(maximum.accumulate 与 cumsum 只看当天及以前)。inv(0) 为 +inf。(2) cs_last_high40 等(ops_ext._lexi):ok 掩码用 isfinite,所以上市首日的股票输出 NaN 而不是 inf;band 只推整块都在前 40% 内的并列块,哨兵块在底部,永远不进带,实际推的是最年轻的、至多 40% 的股票,与 PI 描述一致。(3) 方向问题:闸把年轻股推到输出的底部。按 PI 的约定,方向 +1 时多头书不含新股(假设成立);方向 -1 时多头书的底部十分位主要是新股,此时 alpha 来源是新股内部的排序,而不是闸之后的老股票排序。PI 笔记已注意到这一点,但假设写的是老股票在前,应按方向分开写。这不是数学问题,放行。(4) mul(inv(ListAge), X) 族:X 恒正时(10 号的 cross_mean(cs_winsor(es_hi(Open)),60) 由 es 比定义保证恒 >= 1)老股票为 c·X(c 约 1e-4,无下溢)、年轻股为 X/age,闸的机制成立。X 符号不定时(11 号的 ts_quantile_q75(day_sum(Ret),60))年轻股在 X<0 时落到小端,闸失效。(5) day_es_ratio_hi/lo(ops_ext._es_ratio):分位数绝对值小于 1e-8 或无分钟超过分位时为 NaN,不填充;日内数据收盘后可用,无前视。(6) 没有 ts_rank、cross_rank、in_rank_rolling,没有 nanrank_last 的已知缺陷;cs_winsor 每日 1%/99% 截断。(7) LimitWidth 只取 0.1、0.2、0.3(tradability.board_limit)。(8) 6 号的「冻结」标记 cross_max(day_zero_ratio(Ret),15) 数的是 Ret 恰为 0 的分钟,既含涨跌停锁定也含无成交的分钟(薄交易),不是纯冻结报价;它的 liq |ρ| 为 0.05,不是主要问题,但标签要改。(9) 7、14、15 号与 B 组用的 LogFloatCap 减 LogFloatShares 是 log 价格,要求 FloatCap 等于价格乘流通股数,这是假设,未核对存储平面。(10) 上市首日 mul 形种子为 +inf:权重构造在 books.py 之外,未核对;一只股票一天,量级很小。划掉:9 号 cs_last_high40(cs_last_high05(neg(cross_mean(cs_winsor(day_es_ratio_hi(Open)),60)),LimitWidth),inv(ListAge)) 与 1 号重复。BSE 层只在 BSE 占有限值不足 5% 的日子进带;相关度表里 9 号与 1 号的数字相同到两三位小数(原始 |ρ| 0.354 对 0.355,残差 0.318 对 0.318,5 个控制逐项相同),这一层在训练段几乎不改排序,等同 1 号。11 号 mul(inv(ListAge),ts_quantile_q75(day_sum(Ret),60)) 重复。(a) 外围算子集合(mul、ts_quantile_q75、day_sum)与已见过的 mul(inv(ListAge),ts_quantile_q75(day_sum(Ret),30))(本流第 1 轮,分数 -0.97)相同,只换了窗口,而 §2 规定外围不得与已见过的相同;(b) 相关度表与 4 号 cs_last_high40(neg(ts_quantile_q75(day_sum(Ret),60)),inv(ListAge)) 逐项接近(原始 0.489 对 0.493,残差 0.345 对 0.344,liq 0.274 对 0.282,vol 0.432 对 0.442),是同一个 q75 收益信号的第二份。10 号 mul(inv(ListAge),cross_mean(cs_winsor(day_es_ratio_hi(Open)),60)) 与 1 号数字接近(原始 0.358 对 0.355,vol 0.584 对 0.61),但结构不同(mul 形、X 恒正、闸的机制成立),不是重复,保留。12 号与 13 号互为符号镜像,但相关度表不同(原始 0.348 对 0.244),保留。如果它有 alpha,最可能来自老股票中用 60 日慢聚合的日内尾部形状排序后的收益差(方向 +1 的 cs_last 书,或 mul 形的方向 -1 书),即 PI 说的「闸加慢尾部形状」;其次是 12 号的隔夜减日内差与闸的组合。位通过:划掉 9、11 号后剩 13 个,≥ 4;核心对各控制的 |ρ| 最大 0.32,< 0.8。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [12]
    reasons: '相关度表:15 个种子对 6 个 head 的原始 |ρ| 为 0.15 到 0.59(最高 8 号为 0.59),残差后 0.02 到 0.49;对 5 个控制的最大 |ρ|:10 号与 rev 为 0.55、8 号与 known 为 0.42、8 号与 liq 为 0.40,全部低于 0.7 与 0.8,没有自动划掉。6 号(sign 乘积的 120 日均值)与 13 号(sign 均值之差)的 distinct 为 0.066 与 0.121,流水线标废品:截面只剩约 240 个水平,排序由并列块与列序决定。§4 把并列靠列序打破列为不是问题,按放行原则我不划它们;但 6 号残差只剩 0.05,几乎只剩控制,alpha 证据弱,交 PI 决定是否进 GP。新在哪:库 members.csv 的 5583 条里 day_open(Open) 与 day_last(Close) 同现为 0 条(已 grep 核实;day_open 与 ts_delay 同现的 2 条是 X 库里无关的表达式);LimitWidth、ListAge 为 0 条。快照 6 个 head 全是 φ 的平滑,没有 ON、ID。novelty 给 4 不给 5:8 号(|ON| / LimitWidth,与 known 0.42、liq 0.40、vol 0.37)与 10 号(与 rev 0.55)仍有可观的控制重叠;4 号(ID 的 120 日均值)与 liq 0.34、known 0.36、vol 0.38 也重叠。算子核对:(1) ON = day_open(Open) / ts_delay(day_last(Close),1) - 1,ID = day_last(Close) / day_open(Open) - 1。day_open 是 day_first(首个有限值),day_last 是末值;ts_delay(x,1) 即 t-1 的值;停牌前一日与上市首日为 NaN,不填充;无前视(ON 用 t 日开盘与 t-1 收盘,ID 用 t 日收盘,信号 t+1 交易)。(2) cross_* 是日轴因果窗口(rolling_windows,含 t 日及以前)。cross_regbeta(x,y,d) 是 y 对 x 的滚动斜率(rolling_ols 里 y ~ alpha + beta x),所以 5 号 cross_regbeta(ON,ID,120) 是 ID 对 ON 的斜率,与 PI 说的「日内对隔夜缺口的斜率」一致。(3) 5 号与 12 号的 cross_regbeta 没有 cs_winsor,单日极端值(首日反弹、一字板后的回落)会主导 120 日斜率。这是软问题,不是数学问题(方差的 EPS=1e-9 只挡常数序列,挡不住单点主导),不挡。(4) 7 号 div(std(ON), std(ON)+std(ID)) 有界于 [0,1],0/0 为 NaN;8 号分母 LimitWidth 只取 0.1、0.2、0.3,不近零。(5) 9 号 cs_bucket_demean(·,BoardCode):_buckets 是 ceil(序数百分位 × 10),BoardCode 只有 4 个码,十分位不是板块,而是「板块码加列序」的连续段,第 3 与第 8 个十分位跨两个板块。近似板块去均值,机制只近似实现,不挡。(6) 15 号 cs_bucket_demean(·,LogFloatCap - LogFloatShares) 是名义价位的十分位,连续量,实现正确(同 a 位的 FloatCap 假设)。(7) 3 号与 4 号是 ON、ID 各自的 120 日均值,和约等于 120 日总收益的均值,与 20 日反转的重叠由残差化处理。重复:12 号 cross_regbeta(ts_delay(ID,1),ON,120) 与 11 号 cross_corr(ts_delay(ID,1),ON,120) 是同一对变量的相关与 OLS 斜率,斜率 = 相关 × σ_ON / σ_IDlag,只差一个逐票尺度。相关度表两行逐项在 0.01 以内(原始 0.161 对 0.163,残差 0.138 对 0.138,liq 0.098 对 0.103,vol 0.155 对 0.153,rev 0.002 对 0.004,known 0.126 对 0.130,size 0.045 对 0.038),是同一个信号。划 12 号,保留 11 号。9 号(板块去均值)与 1 号的差为 0.01 到 0.02,保留。机制:隔夜与日内的参与者结构差(Lou-Polk-Skouras 2019;Berkman 等 2012;French-Roll 1986)与算子组合一致。如果它有 alpha,最可能来自 7 号(隔夜方差占比,不含收益水平;与各控制 |ρ| 都低于 0.11,残差 0.18)或 11 号(昨日日内收益与今日隔夜缺口的相关,散户日内过度反应、机构隔夜纠正的指纹)。位通过:划掉 12 号后剩 14 个,≥ 4;新度 4、合理度 4。'
R:
  - head: 'ts_quantile_q75(day_ar1_coefficient(Vwap), 40)'
    soundness: 3
    reasons: '算子实现正确:day_ar1_coefficient 在方差为零时为 NaN、不填充;in_slice 去掉开盘与收盘的前后分钟;cs_bucket_demean 的用法与 R 组一致;ts_quantile_q75 不涉及 nanrank_last。机制都说得通:窗口加长是降换手(变体 1),去掉集合竞价分钟(变体 2),板块或名义价位去均值去掉价位档的 tick 效应(变体 4、5),价格持续性减成交量持续性(变体 6)。问题在于 why 写的「每个变体只改一处,分数变化直接归到该处」与变体不符:变体 3(in_slice 30 到 210 加窗口 120)、变体 5(窗口 120 加名义价位去均值)、变体 7(q75 改 q50 加窗口 120)各改了两处,分数变化不能归到单一部件。与本流第 1 轮 R 组 1 的归因问题相同,按同一标准给 3。另外变体 6 与流动性控制 |ρ| 为 0.78、与已知族为 0.77,几乎就是流动性水平;它的机制写的是价格持续性,结果更可能是流动性残差,要记。不是数学问题,放行。'
  - head: 'ts_quantile_q75(ts_quantile_q75(day_ar1_coefficient(Volume), 50), 50)'
    soundness: 3
    reasons: '算子实现正确,无数学问题。机制是降换手(外层窗口拉长),变体 1 只改外层,变体 2 内外层同时拉长,两者都只是窗口一类的变化,机制清楚。但相关度表显示:变体 1 与流动性控制 |ρ| 为 0.56、与已知族为 0.53;变体 2 为 0.54 与 0.51。150 日窗口的 φ 分位数基本是流动性水平的慢版本。所以如果分数上升,更可能是流动性水平的残差在起作用,而不是「去烂部件」;这一点说不清,给 3,放行。'
  - head: 'ts_quantile_q75(day_ar1_coefficient(Volume), 50)'
    soundness: 3
    reasons: '算子实现正确。变体 q75(φ(Volume), 150) 与原 head 的原始 |ρ| 为 0.91,与流动性控制为 0.68、与已知族为 0.66,窗口拉到 150 天后几乎就是流动性水平的慢版本。「窗口是烂部件」的诊断(拆解里窗口 25、50、100 单调)更像换手与流动性的单调,而不是 φ 的烂部件;要分开,需要一个流动性残差后的对照。机制说不清,给 3,放行。'
summary: 'PROD W02L s2012 第 2 轮审计:a 位(E,核心 inv(ListAge) 的成熟度闸)novelty 4、soundness 4,通过;划 9 号(与 1 号重复,BSE 层在训练段几乎不生效)与 11 号(与 4 号重复,外围与已见过的 mul 形相同、只换窗口);核心 inv(ListAge) 的废品标记来自哨兵并列块,核心本身不作候选,不影响。b 位(N,隔夜与日内拆分)novelty 4、soundness 4,通过;划 12 号(与 11 号是同一对变量的相关与斜率);6 号与 13 号流水线标废品,未划,交 PI 决定。R 组三个合理度均为 3:head 1 的三个变体一次改两处、归因不成立,head 2 与 3 的窗口加长退化为流动性水平。没有数学问题(前视、数值伪影、定义坏掉均未发现);未调取 2026 年数据。'
