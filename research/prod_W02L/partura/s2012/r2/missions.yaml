R:
- head: ts_quantile_q75(day_ar1_coefficient(Vwap), 40)
  why: 烂的部件有两处,依据都在拆解表里:(1) 窗口:q75 的窗口 20 / 40 / 80 的 valid 是 -0.98 / -0.80 / -0.47,train 在 40 最好(-1.69),说明窗口越长越慢越好,成本(换手)吃掉的分数没有被窗口 40 拿回来;(2) 输入:φ 单独是 -3.09,q75 之后 -1.69,Vwap 换 Close 是 -2.57,说明价格对象有信息,但 φ 是对「价格水平」做 AR(1),开盘 / 收盘集合竞价附近的跳变和名义价位(最小变动价位占比)会把它拉向噪声。变体:窗口 120;去掉首尾 20 / 30 分钟(in_slice)再做 AR(1);对板块(BoardCode)或名义价位十分位去均值;价格持续性减成交量持续性;中位数代替 q75。每个变体只改一处,分数变化直接归到该处。
  variants:
