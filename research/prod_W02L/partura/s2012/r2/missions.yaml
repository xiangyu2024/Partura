  hypothesis: '事实(来自快照与流水线代码,不是推测):(1) 141 个已评分候选里含 inv(ListAge) 的 15 个,均值 -1.78 对 -2.76(p < 0.001);本流第 1 轮 N 位的前 5 名(-0.97 ~ -1.11)全是 mul(inv(ListAge), X),X 换成 ts_quantile_q75(day_sum(Ret), 30) / cs_winsor(day_es_ratio_hi(Open)) / day_es_ratio_hi(Close) / ts_rank(cross_stddev(LogTotalCap, 15), 1) 分数几乎不变,而且五个的方向(missions_before 里的 sign)全是 -1。(2) ListAge 的定义(dailyfields._list_age):从首个生命周期日起算的交易日数;2018-01-02 已经在市的股票统一加 10000 的哨兵,所以它们的 ListAge 彼此相同(逐日并列,按列序打破),只有 2018 年以后上市的股票有区分度。(1)(2)合起来读:X 恒正时,mul(inv(ListAge), X) 在老股票(并列块)上是 c*X(c 约 1e-4),在新股票上是 X/age(大得多),方向 -1 取最小的一端,即「老股票在前、按 X 升序」。所以 inv(ListAge) 在这里起的是成熟度闸(把 2018 年后上市的新股挡在多头书之外),不是在挑新股;X 是什么几乎无关(四个不同的 X 在同一档)。读到的现象:去掉新股这块垃圾尾部,不含该子树的候选均值 -2.76,含它的最好一批升到 -1.0,而且这个位置的候选两段都还是负的,说明闸有用但闸之后的排序没有 alpha 或被换手吃掉。


    假设:闸还有可挖的地方。(a) 闸的宽度与别的垃圾标记叠加是否更好;(b) 闸之后的排序变量 Y 现在是日度噪声大的量(day_es_ratio_hi 每天都变),换手吃掉分数,换成 20 ~ 60 日的慢聚合应当更好;(c) 在成熟股票内部哪一类 Y 有 alpha:反彩票 / 尾部形状、名义价位、限售比例、隔夜 - 日内结构。


    算子怎样实现:核心 inv(ListAge) 在每个种子里原样出现,作为 cs_last_high{10,20,40}(Y, inv(ListAge)) 的闸变量(把最新上市的 10 / 20 / 40% —— 按整块并列 —— 压到所有名字之下,其余保持 Y 的顺序;每个名字仍有有限值,书仍对整个市场计量),或作为 mul(inv(ListAge), X) 的因子。A 组 5 个:闸 x 慢的反彩票 / 尾部形状 Y(Y 取 neg,使 +1 = 成熟股票在前且 Y 高):60 日或 20 日平均的 day_es_ratio_hi(Open) / (Close)(每日 cs_winsor 先截尾)、60 日 q75 的日收益、右尾加左尾的 es 比(价格路径的偏度)。B 组 4 个:Y 固定为 A 组第 1 个,在年龄闸里再套一个别的垃圾标记,每个只加一个,用来读每个标记的边际:冻结报价 cross_max(day_zero_ratio(Ret), 15)(流水线自己的「冻结」标记,最高 20%)、名义价位最低 10%(sub(LogFloatCap, LogFloatShares) 约等于 log 价格,面值退市区的垃圾)、限售比例最高 10%(sub(LogTotalCap, LogFloatCap),解禁供给)、BSE(LimitWidth 最高并列块)。C 组 2 个:乘积形,方向留给书(-1 = 老股票按 X 升序在前),X 换成 60 日慢聚合。D 组 4 个:换 Y 为隔夜 - 日内差(与 N 位的统计量相同,这里加年龄闸,N 位不加,两位的差就是闸的 A/B)和名义价位;方向不知道的 Y 两个方向各给一个(闸会让 -1 方向的书变成新股在前,所以不能靠书翻号)。


    为什么和已见过的不同:已见过的含该核心的候选,外围全是 mul(inv(ListAge), 单个分钟统计量)(ts_quantile_q75 / cs_winsor / day_es_ratio_hi / ts_rank / cross_stddev),Y 全是日度噪声量。这里用的 cs_last_*(库 5583 条里 0 条用过,Partura 后加的算子)、cross_mean 的 20 ~ 60 日慢聚合、日频字段叶子 LogFloatCap / LogTotalCap / LogFloatShares / LimitWidth(库里 0 条用过)和第二个垃圾标记,都是已见过的外围里没有的。与 6 个 head 的日度秩 |ρ| 预计很低:heads 全是 φ = day_ar1_coefficient 的平滑 / 分位,种子里没有 φ。与 5 个控制:Y 是尾部形状 / 价位 / 隔夜 - 日内,不是它们的水平;年龄闸把一批名字整体压低,与流动性 / 市值控制的相关也低。


    为什么样本外还会在:新股的垃圾尾部是制度结构:一字板连续涨停之后的回落、上市首年的散户投机、限售股解禁(Field-Hanka 2001)、IPO 的长期弱势(Ritter 1991),不依赖某一段行情;闸变量和日频字段几乎不动,Y 取 20 ~ 60 日聚合以后也慢,换手很低,15 bp 成本占比小。诚实预期:闸的收益在快照里已经拿到了(-2.7 到 -1.0),这个位要检验的是剩下的 1.5 个点里有多少来自「慢」和「更多垃圾标记」,出 head(>= 0.5)的概率很低(约 3%),更可能的结果是分数在 -0.8 到 -0.3 之间,各标记的边际读数是主要产出。


    数学检查:inv(ListAge) 在上市首日(ListAge = 0)是 +inf,每只新股一天:cs_last_* 内部用 isfinite 判断,把它当缺失,cs_rank 把它排在最前(与「最新」一致),它当天也没有可买的下一日标签,一只股票一天不能支配横截面。哨兵造成的并列块在 cs_last_* 里按整块处理(不是列序打破);mul 形种子里老股票取值差异极小但有序,秩保序,量级 1e-4,没有下溢。day_es_ratio_hi / lo 在分位数近 0 或没有分钟超过分位时给 NaN(算子文档),cross_mean 只对有限值取平均;cs_winsor 每天按 1% / 99% 截断;day_zero_ratio 在 [0, 1];LimitWidth 只取 0.1 / 0.2 / 0.3;LimitWidth 最高的那块并列(BSE)若在某一天不足 5% 才会进带,不足或不存在时带为空,不是错误。无前视:ListAge 与日频字段都只含当日及以前,窗口因果(最长 60 日),t 日信号 t + 1 交易。'
