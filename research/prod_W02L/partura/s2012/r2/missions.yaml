- type: N
  hypothesis: '机制:A 股的价格形成分两段。隔夜(昨收 -> 今开)由开盘集合竞价、夜间累积的消息和机构 / 算法在开盘前后的指令决定;日内(开盘 -> 收盘)是连续竞价,散户成交占大头。两段的预期收益符号相反而且各自持续(Lou-Polk-Skouras 2019 的 tug of war;Berkman 等 2012:被关注的股票在开盘被散户买进,隔夜强、日内弱;Hendershott 等 2020:隔夜与日内补偿的是不同的风险 / 参与者),French-Roll 1986 说日内方差里有一大块是交易噪声而不是信息。一只票的「隔夜 - 日内」差、日内对隔夜缺口的反应方向、隔夜方差占总方差的比例,是它的参与者结构(机构 / 知情 vs 散户 / 噪声)和信息到达方式的慢变特征,不是行情水平。


    算子怎样实现:ON = sub(div(day_open(Open), ts_delay(day_last(Close), 1)), 1) 是隔夜收益,ID = sub(div(day_last(Close), day_open(Open)), 1) 是日内收益(价格是后复权,除权日连续)。统计量全部在日轴上用 60 ~ 120 日窗口:1、2、13、14 号是「隔夜均值 - 日内均值」(1、2 用每日 cs_winsor 截尾后的均值,13 号只用符号,14 号用中位数,三种对一字板 / 极端缺口的敏感度不同);3、4 号是两段各自的均值;5 号 cross_regbeta(ON, ID, 120) 是日内收益对隔夜缺口的斜率(负 = 缺口当天被回补,正 = 延续);6 号是两段符号同向的天数比;7 号是隔夜标准差占「隔夜 + 日内」标准差之和的比例(French-Roll 的方差比,是比值,与总波动的相关预计较低);8 号是缺口绝对值占该板涨跌停幅度(LimitWidth)的平均比例,把创业板 / 科创板 / 北交所的缺口量纲统一;9、15 号对板块(BoardCode)或名义价位(sub(LogFloatCap, LogFloatShares))的十分位去均值,去掉板块 / 价位档带来的整体差;10 号是「近 20 日的隔夜 - 日内差」对自己 120 日常态的 z 分数(变化量);11、12 号是「昨天的日内收益」与「今天的隔夜缺口」的相关 / 斜率(隔夜是否反转昨天的日内行情,散户日内过度反应、机构隔夜纠正的指纹)。方向都不预设,由书按 train 选。


    为什么和已有的不同:库 5583 条里没有隔夜 / 日内拆分(按 day_open 与 ts_delay 同现搜过,只有 2 条且无关);快照里的 6 个 head 是 φ(分钟成交量 / 成交价的 AR(1) 斜率)的水平平滑;5 个控制是流动性、波动、20 日总收益反转、成交额离散度、市值的水平量,两个冠军是分钟微观结构的合成。ON - ID 与总收益 ON + ID 近似正交(只在两段的横截面离散度不等时才有相关,而日内均值的离散度更大,所以它偏向负的总收益,会被 20 日反转控制吃掉一部分,残差里留下的是拆分本身),方差占比是比值,与总波动的相关预计较低。用到的 LimitWidth / BoardCode / 名义价位是日频字段叶子,库里 0 条用过。


    为什么样本外还会在:来源是参与者结构(机构 / 算法 vs 散户)与信息到达方式,是慢变的结构特征,不依赖某一段行情;窗口 60 ~ 120 日,秩的名次保持几周到几个月,换手低,15 bp 成本下可承受。诚实预期:快照里所有分数 > -1.5 的候选都是慢的,这一位的所有种子也是慢的,所以成本不是主要失败方式;主要风险是:(a) 拆分与 20 日反转控制相关(预计 0.3 ~ 0.6,没有到 0.8),残差后信号弱;(b) 隔夜均值里混着一字板 / 次新股连续涨停的缺口(cs_winsor 与符号版本部分缓解,E 位的年龄闸是对照);(c) 这个 A 股样本里隔夜 / 日内的符号可能在 train 与 valid 之间翻转,min 取小会把它压成负。出 head 的概率约 5%,最可能的形态是 7 号(方差占比)或 11 / 12 号(隔夜纠正日内),因为它们不含收益水平。


    数学检查:ON、ID 是价格比,价格恒正,停牌日 day_open / day_last 为 NaN,不填充;上市首日 ts_delay 为 NaN,所以 ON 缺失,不会把首日的 +44% 当缺口;涨停连板的缺口 ON = 涨停幅度、ID = 0 是真实值,不是数值问题,cs_winsor 与符号版本限制它的影响。cross_regbeta / cross_corr 只在窗口内有足够有限值且解释变量方差为正时出值,否则 NaN;7 号分母是两个标准差之和,只有两个都为 0 时才是 NaN(那时已经是停牌);LimitWidth 恒正(0.1 / 0.2 / 0.3);BoardCode 的十分位按序数秩切(整块并列按列序打破,即每个板块内部再按交易所列序分段),是任意但确定的分段,只用来去均值。无前视:t 日的 ON 用 t 日开盘和 t - 1 日收盘,ID 用 t 日开盘和收盘,窗口因果(最长 120 日),t 日信号 t + 1 交易。'
