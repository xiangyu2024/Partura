slots:
  - type: E
    core: 'day_ar1_coefficient(Volume)'
    hypothesis: |-
      事实(来自快照拆解):三个 head 是同一个对象的三种平滑,即 |φ|,φ = day_ar1_coefficient(Volume) = 当天 241 根分钟成交量对前一分钟的 AR(1) 斜率(pow_2(pow_05(·)) 等于取绝对值)。拆解里衰减窗 2 / 5 / 10 / 40 的分数都在 -3.2 到 -2.95,Volume 换 Amt 是 -3.02 到 -3.05(原分数 -2.99 到 -3.02),sigmoid / pow / cs_rank 这些保序外层拿掉最多只差 0.09:承重的不是外层,是 φ 的截面水平。结构表里这一批 14 个成员有 8 个就在挖掘冠军自己的第 4 族里(BATCHES.md 的 8(1)),未去控制时训练段净夏普 0.9 到 2.2、rank IC 约 -0.05、换手 0.03 到 0.26;去掉 5 个控制和两个冠军以后 train / valid 都是 -3。也就是说 φ 的水平已经是控制的一部分(流动性、成交额离散度、冠军本身),水平里没有剩下的东西。
      假设:如果 φ 里还有 alpha,它在「相对这只股票自己的常态」里,不在水平里。一只票的分钟成交突然变得更连续(算法 / 机构拆单、持续建仓)或更脉冲(注意力事件、散户集中涌入),是参与者构成的切换,持续数周,控制看不到,因为控制全是水平量。
      算子怎样实现:每个种子都原样带着核心 φ,外围只做两件事:去掉这只股票自己的水平,或在时间序列里用另一个同期的日序列把 φ 解释掉再取残差。(a) 日轴标准化:cross_zscore / cross_madz(φ, 60 或 120),或快 EMA 减慢 EMA,即 φ 最近几天对自己 60 到 120 日常态的偏离。(b) 时间序列残差 cross_regres(x, φ, 60)(第一个参数是解释变量):φ 对同期 day_gini(Volume) 的残差,把「成交集中在少数几分钟」(分布形状)和「集中在连续的几分钟」(时间依赖)分开;φ 对 |当日收益|、当日收益的残差,把价格动作带来的成交聚集拿掉。(c) 滚动相关与斜率:φ 与 |当日收益| 的 60 日相关,φ 对前一日收益的 40 日相关,φ 对当日收益的 60 日斜率:持续的成交是不是发生在大波动 / 上涨日。(d) 与近 20 日收益符号相乘:异常的持续性在趋势里还是趋势外。(e) cross_autocorr(φ, 60, 1):φ 自己的日间持续性。(f) cs_bucket_demean 以 sub(LogFloatCap, LogFloatShares)(约等于 log 价格)十分位去均值,去掉最小变动价位造成的价格档效应。(g) 减去同样标准化过的 day_std(Ret):把和价格波动共享的那一块拿掉。
      为什么和以前不同:快照里所有含 φ 的写法是保序包装加 ts_decay_linear / ts_min / ts_quantile_q75(库里还有 ts_mean / ts_stddev 之类),全部是水平或水平的平滑。这里的外围全是「相对自身历史」或「时间序列残差」,与三个 head 的日度秩 |ρ| 预计远低于 0.7,与已知成交额族、流动性、市值这些控制也预计 < 0.5(水平已被减掉)。所有种子的骨架都已逐个对照 members.csv 的 4100 个骨架,没有一个在库里(只有核心 φ 单独的骨架在库里,而它只作子树)。种子里用的 cross_zscore / cross_madz / cross_ema / cross_regres / cs_bucket_demean 与日频字段叶子,库里的表达式没有这样用 φ 的。
      为什么样本外还会在:来源是参与者结构的慢变(算法拆单 / 机构建仓对散户脉冲)在成交时间依赖上留下的变化,不依赖某一段行情;窗口取 60 到 120 日,EMA 3 到 5 日先压掉日度噪声,名次能保持几周,15 bp 成本下换手可以承受。诚实预期:出 head 的概率不高(约 5%),这个位检验的是「水平已被冠军吃光,剩下的是变化量」这一说法;不出就说明连变化量也没有。
      数学检查:φ 在当天无成交或分钟成交量几乎不动(方差 ≤ 1e-8)时是 NaN,不填充;φ 有界(多在 0 到 1),cross_zscore 的分母是 60 日 std 加 1e-9,只有 φ 整段不动才会放大,而那时 φ 本身是 NaN;cross_madz 分母 MAD 为 0 时是 NaN;cross_regres 只在解释变量窗口方差 > 1e-9 时出值,day_gini 在 [0,1)、day_sum(Ret) 的 60 日方差远大于此。种子里不用 ts_rank / cross_rank(当天缺失时返回 0 的已知行为),cs_rank 是截面排序。无前视:φ 只用 t 日分钟,日轴窗口含 t 日及以前,t+1 交易;最长热身 120 日,其余窗口 ≤ 60。
