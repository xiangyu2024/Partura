    why: |-
      这个 head 是三个里分数最好(-2.99)、平滑最长(40 日,换手最低)的一个,拆解里窗口 5 -> 2 / 10 是 -3.07 / -3.20,Volume 换 Amt 是 -3.05,sigmoid 与 pow_2 的拿掉只差 0.05 到 0.09:外壳不承重,承重的是 |φ_Volume| 的截面水平,它和流动性、成交额离散度、市值共享。去掉的办法是在这些量的十分位内去均值或取名次,而不是只靠尺子的线性 / 平方 / 立方残差(桶内去均值把各个十分位里的整体水平差也拿掉了)。变体保留 40 日平滑,只在 head 的平滑之后加一层桶内去均值 / 桶内名次,桶的变量依次是:流通市值、约等于 log 价格(sub(LogFloatCap, LogFloatShares))、已知成交额族、20 日成交额(流动性)、总市值与流通市值之差(限售 / 非流通比例,即 sub(LogTotalCap, LogFloatCap))。
