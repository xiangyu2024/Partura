  - type: N
    hypothesis: |-
      机制:订单流方向的长记忆。大单被拆成许多小单,在几分钟到几天里同方向执行,所以带符号成交量 s_t · V_t 的自相关长期为正,这是机构 / 算法拆单的指纹;散户的脉冲成交方向近似随机。批里的 φ = day_ar1_coefficient(Volume) 只读幅度的依赖,不带方向,而且幅度的依赖和日内 U 形、流动性混在一起,所以和控制(以及冠军)共享水平,新尺子下 -3。新想法是把方向加进来,并且读「方向持续性相对幅度持续性的超额」,把幅度那一块(也就是 φ 的水平)减掉,留下纯方向记忆:拆单没完成的母单,后面还有价格压力(Chordia-Subrahmanyam 的持续单边失衡预测后续收益)。
      算子怎样实现:s = sign(Ret)(分钟收益方向,收益为 0 的分钟记 0),SV = mul(sign(Ret), Volume)。(1) 日内:day_ar1_coefficient(SV),以及先把成交量除以尾随 20 分钟均量(in_mean_rolling,因果窗口)去掉 U 形的版本;sub(φ(SV), φ(Volume)) 与时间序列回归残差 cross_regres(φ(Volume), φ(SV), 60)(第一个参数是解释变量)都是「方向持续性 - 幅度持续性」。(2) 日间:cross_autocorr(day_signed_ratio(Ret, Volume), 40, 1) 是净买压的日间持续性,即多日母单;再与 20 日净买压水平相乘。(3) 日内冲击的持久度:day_corr(in_delay(SV, 1), Ret),上一分钟的带符号成交能不能预测本分钟收益,连续是知情 / 永久冲击,反转是流动性需求。(4) 成交量突变的方向 day_signed_ratio(Ret, in_logchg(Volume, 1)),以及成交最重的 10% 分钟的平均收益 day_topw_mean(Ret, Volume)。(5) 同一个统计量换到有符号的底:day_ar1_coefficient(Ret)、day_ar1_coefficient(abs_(Ret))(分钟波动的聚集)、day_ar1_coefficient(in_logchg(Volume, 1))(成交量变化的 AR1,即噪声占比,不含水平)。外面统一用 cross_mean / cross_ema(20 日)聚合,有的再做 60 日标准化。
      为什么和已有的不同:库里 day_ar1_coefficient 的输入只有原始字段、字段的分钟切片、份额、zscore / regres 这几种;没有一个把 sign(Ret) 乘进去,没有用 in_mean_rolling 去 U 形,没有用 in_logchg 做底,更没有「方向持续性减幅度持续性」。day_signed_ratio / day_topw_mean / in_logchg 是 Partura 后加的算子,库里没有。种子的骨架已逐个对照 members.csv 的 4100 个骨架,都不在库里。和三个 head 的差别:head 是 |φ_Volume| 的水平,这里是方向和差分;和控制的差别:控制是流动性 / 波动 / 反转 / 市值 / 成交额离散度的水平,方向持续性不是它们的函数(会共享一部分,因为成交稀疏时 Ret = 0、SV = 0 带噪声,尺子会把线性、U 形、S 形暴露去掉)。
      为什么样本外还会在:拆单习惯是参与者类型的慢变属性(算法 / 机构 vs 散户),不依赖某一段行情;持续建仓的母单没做完就还有价格压力,是几周的慢过程,20 日聚合以后名次稳定,15 bp 成本下换手可以承受。风险:净买压水平(第 2、4 类里一部分种子)和 20 日反转相关,尺子会去掉线性、平方、立方暴露;持续性类的种子不带水平,所以这一类应该更干净。
      数学检查:SV 有大量 0(无成交或收益为 0 的分钟),day_ar1_coefficient 只在方差 > 1e-8 时出值,Volume 以股为单位,方差远大于此;整天无成交是 NaN,不填充。AV = Volume / in_mean_rolling(Volume, 20) 的分母含当前分钟,只有最近 20 分钟全无成交才是 0,此时分子也是 0,得到 NaN 而不是无穷;首分钟 AV 恒为 1,是已知的常数项,不影响斜率。day_corr、day_signed_ratio 有界,cross_autocorr 遇常数窗口给 NaN;in_logchg 要求正值,零成交分钟给 NaN 而不是负无穷。无前视:in_delay 向过去移位,in_mean_rolling 是因果窗口(没有用居中窗口的 in_local_mean);所有量只用 t 日分钟,日轴窗口含 t 日及以前,t+1 交易;热身期最长 120 日。
    inspired_by: 'B034 批:14 个成员全是同一个无符号的 |φ_Volume| 的平滑,换成 Amt 分数不变(-3.05)、窗口 2 到 40 不变,说明统计量读的是依赖结构不是量纲;批里没有任何一个带方向的底,而且 8 个成员已经在挖掘冠军自己的第 4 族里,水平被冠军吃光。'
