R:
  - head: 'ts_decay_linear(sigmoid(pow_2(pow_2(cs_rank(ts_decay_linear(pow_2(pow_05(day_ar1_coefficient(Volume))), 5))))), 5)'
    why: |-
      烂的部件是底 |φ_Volume|(φ = day_ar1_coefficient(Volume))本身,不是外壳。依据:这个 head 在拆解里窗口 2 / 5 / 10 分别是 -3.17 / -3.02 / -2.95,Volume 换 Amt 是 -3.03,拿掉 sigmoid 是 -3.02(+0.00),拿掉 pow_2 约 +0.07,拿掉 cs_rank 约 +0.03;外壳和字段都不承重,而 φ 的水平正是控制与冠军(这一批 14 个成员有 8 个在挖掘冠军第 4 族里)已经吃掉的那一块。变体保持这个 head 的 5 + 5 平滑和保序外壳不动,一次只换底,所以分数的变化可以直接归到底上:(1) 去 U 形的底 Volume / 尾随 20 分钟均量,以及 Volume 减尾随均量;(2) 成交量变化的 AR1(in_logchg,不含水平);(3) 带符号成交量 sign(Ret) * Volume 的 AR1,及其去 U 形版本;(4) 方向持续性减幅度持续性;(5) 价格底 Ret 与 abs_(Ret) 的 AR1;(6) 日轴标准化的 φ,以及对 day_gini(Volume) 做时间序列回归后的 φ 残差。
    variants:
