- type: N
  hypothesis: >-
    想法:分钟收益的「计数式」方向(涨的分钟多还是跌的分钟多)与「金额式」方向(钱主要在涨的分钟还是跌的分钟里成交)、「大小式」方向(日内总收益)之间的错位,
    做成半衰期 30 到 120 日的慢变量。

    定位里的依据(loc.md 共性表,71 个已评分候选;候选来自上一轮的 GP,不是库的成员):含 day_pos_ratio(Ret)(一天里上涨分钟的占比,不看涨幅大小)的 17 个均值 −1.88、
    不含的 −2.46(p 0.001);含 neg(abs_(day_pos_ratio(Ret))) 的 6 个 −1.54 对 −2.40(p 0.006)。这是整张富集表里最稳的几个子树之一;
    批里 head 的承重部件(argmin 钟点)本身也是「只看位置 / 计数、不看大小」的读数,所以这个方向最贴近这批「什么在起作用」的证据。
    诚实的限定:这些候选分数都是 −1.2 ~ −1.5,没有一个过线,富集说明的是「亏得更少」(慢、换手低),不是已有 alpha;本位要看它能不能再向上走。

    实现:up = day_pos_ratio(Ret),dn = day_pos_ratio(neg(Ret))(neg 把下跌分钟变成上涨分钟),up − dn 是有界在 [−1, 1] 的「计数净买压」
    (Chordia、Roll 和 Subrahmanyam 2002 用订单不平衡预测收益;这里用分钟价格跳动的计数近似,不需要逐笔数据);除以 (up + dn + 0.05) 去掉「这一天有多少分钟价格根本没动」
    (最小变动价位 / 流动性的影响)。三类读数:(a) 慢变的净涨分钟占比(cross_ema 半衰期 30 ~ 120 日,以及收尾一小时的版本、最差四分之一天的条件均值),读「价格是不是一档一档往上走」;
    (b) 错位:计数式不平衡减去金额式的 day_signed_ratio(Ret, Amt)(两者都在 [−1, 1]),或两者截面排名后相减:涨的分钟多、但钱主要在跌的分钟里成交 = 小单在买、大单在卖;
    (c) 信息离散度:sign(日内总收益) × (dn − up)(Da、Gurun 和 Warachka 2014 的 frog-in-the-pan 在分钟层面的版本:连续的小消息之后动量延续,离散的大消息之后反转),
    以及计数不平衡与日内收益的 120 日相关(读「一天的涨跌是靠很多个小步,还是靠少数几个大跳」)。
    聚合用 cross_ema(实数权重):单日读数是分钟计数 / 241 的整数倍,cross_mean 或 cross_med 会让截面上出现大批并列,并列靠股票列序打破、携带板块信息。

    和库、head、控制的区别:库的分钟统计量要么按大小加权(day_std / day_skew / day_kurt / day_cov),要么是位置型(day_argmin),没有「涨的分钟占比」,
    更没有把它与金额式方向相减的读数,所以冠军也没有;5 个控制是水平量,计数式不平衡有界、无量纲,平坦度(没动的分钟占比)在分母里被归一,
    与流动性、波动、市值的水平关系弱。

    为什么样本外还会在:订单拆分(大单拆成小单)与信息连续性是微观结构的结构性属性,不依赖样本期的行情风格;全部读数长半衰期平滑,日换手低,
    15 bp 的成本不吃分数。数学检查:day_pos_ratio 的分母是当天有效分钟数(停牌日为 NaN);除法只有 (up + dn + 0.05);cross_corr 的窗口含当日、只用 t 日及以前的分钟,无前视;
    Ret 的第 0 根恒为 0,计入分母、不计涨跌,各股相同。已知风险:(1) 计数式净涨分钟占比与一年的日内漂移(2009 流里最接近 0 的一条线)是近亲,可能只是它的改写;
    (2) 与 20 日反转控制可能中度相关(涨的分钟多的票近期涨)。
