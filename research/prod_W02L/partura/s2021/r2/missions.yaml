  why: >-
    第 1 轮 R 的读数(R_prev.json):把 pow_1_5(day_argmin(Amt)) 换成它的 20 日均值 cross_mean(day_argmin(Amt), 20),分数从 −2.20 提到 −0.90(train −0.30 / valid −0.90),
    是 10 个变体里最好的,但与已知成交额族 |ρ| 0.64 ≥ 0.5,所以不能替换。烂的部件有两个:(1) 单日的 argmin 钟点噪声大、日换手高,
    第 1 轮的结果说明越平滑越好,所以本轮继续放慢(60 / 120 日均值、60 日 EMA),并把分母里的价格也平滑;(2) 与已知族共享的流动性水平:
    argmin(Amt) 的零成交分钟读的是流动性,把 Amt 换成 Volume(股数,不含价格),或换成有界、没有零成交人工影响的成交额重心 day_centroid(Amt),
    看 ρ_known 能否从 0.64 降到 0.5 以下;cs_rank 之和把两项放到同一量纲(第 1 轮的写法里 cov 项在加法里是乘客)。
