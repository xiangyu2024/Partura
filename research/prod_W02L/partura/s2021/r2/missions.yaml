slots:
- type: N
  hypothesis: >-
    想法:涨跌停制度下的「配给 / 排队」状态——封死的方向与频率、触板后被砸回的深度、封板后的次日兑现——做成半衰期 30 到 120 日的慢变读数。

    批里的现象(B061 + B062,30 个成员,其中 16 个在冠军的族 22 里):承重部件全是「一天里成交额 / 成交量最低那一分钟的钟点」,
    即 pow_1_5(day_argmin(Amt))、inv(day_argmin(Volume)) 再套 ts_max / sigmoid / ts_quantile_q75。argmin 对一条含零成交分钟的序列取的是
    第一个零分钟,没有零分钟时才是最安静的那一分钟,所以这个钟点同时在读三件事:停牌日、一字或接近一字的涨跌停封死、盘口很薄的票开盘前几分钟没有成交。
    三种状态被压成一个钟点,而且不分方向。B062 的成员在库自己的尺子下大多 raw 净夏普 +0.4 ~ +1.4(14 个里 12 个为正),但新尺子(冠军已含族 22)下没有一个过线、没有 head,
    说明混合体本身没有剩余;还没有被回答的问题是:把状态拆开以后,某一种状态自己有没有被混合体掩盖的、带符号的收益。

    实现(都用本波新增的算子,库与冠军里 0 次使用):(1) day_at_max_ratio / day_at_min_ratio = 一天里停在当日最高 / 最低价上的分钟占比;
    取差后,普通交易日里最小变动价位(tick)对两项的影响对称,差约为 0 ± 0.01;涨停封死日约 +0.3 ~ +0.9,跌停封死日约 −0.3 ~ −0.9。
    所以 cross_ema(差, 30 ~ 120) 读的是「封涨停相对封跌停的频率与持续时间」,是有方向的事件频率,不是钟点;signedpower(差, 2) 版本把权重压向封板日、压低 tick 噪声。
    (2) day_flat_run_max / day_flat_ratio:冻结的分钟是集中成一整段(封板),还是零散分布(薄盘):比值有界在 (0, 1],分母加 0.01 保护。
    (3) 封板后的兑现:cross_ema(昨日封板差 × 今日跳空):价格限制使未成交的买卖单被推到下一个交易日(Kim 和 Rhee 1997 的延迟价格发现、Cho 等 2003 的磁吸效应),
    这个乘积读的是「排队的需求 / 供给是否在次日开盘兑现」;cross_autocorr 读封板是否成串(连板)。(4) 触板回落:(上影线 − 下影线) 除以昨收再除以 LimitWidth,
    日频叶子把主板 / 创业板 / 科创板 / 北交所的 10% / 20% / 30% 放到同一把尺子上(LimitWidth ≥ 0.1,不会除以近零),读「冲高被砸回」与「探底被托回」的慢变倾向。
    聚合一律用 cross_ema(实数权重):单日读数是分钟计数 / 241 的整数倍,cross_mean 会让截面上出现大批并列,而并列靠股票列序打破、携带板块信息。

    和库、head、控制的区别:库 5583 条里没有一条用 at_max / at_min / flat_run_max 或 LimitWidth;三个 head 与冠军读的是钟点;
    5 个控制(流动性、波动、20 日反转、成交额离散度、市值)全是水平量,封板频率是事件计数,20 日反转控制只看收益之和,看不到「这 20 天里有几天封死在板上」。

    为什么样本外还会在:涨跌停是交易制度,不是样本期风格(2018 到 2025 年幅度只在 2020-08 创业板改为 20% 一次变化,已被 LimitWidth 吸收);
    封板的频率是个股的慢属性(题材股 / 流通盘小),长半衰期平均后日换手低,15 bp 的成本很小(同一波 2009 流的结果:慢才承重);
    方向由训练段定,不预设。数学检查:at_max / at_min 要求当天至少 2 个有效分钟(停牌日为 NaN,cross_ema 跳过缺失日),取值 [0, 1],差 [−1, 1];
    除法的分母只有 flat_ratio + 0.01(≥ 0.01)、昨收(后复权价,正数)与 LimitWidth(≥ 0.1);没有前视(昨日封板差 × 今日开盘,只用 t 日及以前)。
    已知风险:(a) 封板频率与波动、小盘高度相关,可能被控制吃掉;(b) 一字板买不进(可买性约束)会让多头书里的封涨停票被剔除,方向可能由「封跌停」一侧决定;
    (c) 一半以上的股票在窗口内没有任何封板,它们的读数只由 tick 噪声决定,排名在中段近似随机。
