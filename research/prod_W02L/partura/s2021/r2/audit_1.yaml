    reasons: '创新度 4。at_max / at_min、flat_run_max / flat_ratio、LimitWidth 都是本波新增的原语（ops_ext.py 与 dailyfields 的派生叶子）；快照 3 个 head 全是 argmin / day_cov / day_open 的钟点与价格链。残差 |ρ|（对 5 个控制取残差后与各 head 的最大值）12 个种子里 11 个 ≤ 0.115，只有种子 12 为 0.284。原始 |ρ| 对快照 head 的最高值是 0.523（种子 12，对 head 2）。与控制：表内 ≥ 0.5 的标记有两条，种子 6（vol 0.539）与种子 12（liq 0.593、known 0.533）。种子 12 的 flat_ratio 是分钟报价不变的比例（docstring：流动票约 0.2–0.5），本质是零收益率型的流动性代理，是流动性控制的换写；种子 6 的 vol 重合也偏高。种子 10 的 liq 0.433 / vol 0.463 / known 0.442 偏高但未过标记线。扣掉这三条，at_max−at_min 族（1、2、3、4、5、11）与上下影线族（9、10）与控制、head 都不是同一个量。没给 5：at_max−at_min 族里 1、2、4、5 是同一统计量的不同半衰期 / 幂次，重复度高，且 6、12 的流动性 / 波动重合。合理度 4。逐个算子核对：day_at_max_ratio / day_at_min_ratio 在有效分钟少于 2 时为 NaN，取值 [0,1]；LimitWidth 取 0.10 / 0.20 / 0.30（tradability.py 的 board_limit），下限 0.1，不会除以近零（ST 未标记，按 10% 处理，只是尺度偏差，不是数学问题）；flat_run_max 与 flat_ratio 都是分数，flat_run_max / (flat_ratio + 0.01) 落在 [0,1)，flat_ratio − flat_run_max 在 [−1,1]，量纲一致；cross_autocorr 走 cross_corr（EPS 1e-9），覆盖率全部 0.999，没有第 1 轮那种 241 日热身的结构性 NaN；没有 ts_rank / cross_rank / in_rank_rolling，不碰 nanrank_last 陷阱；cross_ema 都是因果的；种子 8 的开盘缺口只用 t 日开盘与 t−1 日收盘，无前视。两点不是挡的理由，但要写进假设：(a) 一字日（全天同价）时 at_max = at_min = 1，at_diff 恰为 0，上下影线为 0，种子 7 的 sign(收−开) 也为 0。除种子 6 外，其余 11 条在一字日读数为 0，所以假设里「封涨停日约 +0.3 ~ +0.9」只对开过板或有成交的封板日成立。(b) AlphaCube 纯多头书的约定（books.py 文档）：开盘即封涨停、无标签的持仓收益记 0；若奖励沿用该约定，at_diff 的多头腿（封涨停票）被系统性压低，方向很可能由封跌停 / 触板回落一侧决定，与 PI 的风险 (b) 一致。如果它有 alpha，最可能来自开过板之后仍封在涨停或跌停上的日子的慢频率（种子 1、2、4、5），其次是昨日封板差乘今日跳空的次日兑现（种子 8），再次是上影线 / LimitWidth 归一的触板回落（种子 9、10）。划掉：无。无数学问题；与任何 head 的 |ρ| 都 < 0.7（最高 0.523），与任何控制的 |ρ| 都 < 0.8（最高 0.593），自动划掉为 0。种子 11 对窗口内没有封板的票只输出 tick 噪声的自相关，是机制弱点而非数学错误，保留。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。计数式方向（day_pos_ratio：涨的分钟占比、跌的分钟占比，ops_ext.py 本波新增）与金额式 day_signed_ratio 的错位，快照 3 个 head 与 5 个控制里都没有对应读数。残差 |ρ| 对 3 个 head 的最高值：种子 9 为 0.284，种子 1、2、3、8 在 0.19–0.24，种子 4、5、6、7、10、12 ≤ 0.083（6、7、10 ≤ 0.03）。原始 |ρ| 对 head 的最高值是 0.402（种子 5，对 head 2），残差只有 0.06，说明重合来自控制。与控制：最高 0.479（种子 4 的流动性）、0.478（种子 5 的已知族）、0.473（种子 4 的已知族），都在 0.5 标记线以下；但流动性在种子 1、4、5、8、9 上为 0.33–0.48，计数式读数里有相当部分是流动性或最小变动价位效应。没给 5：(a) 表只含快照内 3 个 head，别的流的 head 不在表内；PI 笔记（第 2 轮）指出 2009 流那条「慢的、按金额加权的分钟收益」是它的近亲，本表无法核对；(b) 流动性相关 0.33–0.48。合理度 4。机制清楚：订单拆分（大单拆成小单留下的计数痕迹）与 frog-in-the-pan（Da、Gurun 与 Warachka 2014）。逐个算子核对：day_pos_ratio 取值 [0,1]，停牌日为 NaN；(up−dn)/(up+dn+0.05) 有界，分母下限 0.05；day_signed_ratio 取值 [−1,1]（分母为 |Amt| 之和，>0 才有值）；cs_rank 走 rank（stable argsort，NaN 排除），不是 nanrank_last，不触发 §4 的陷阱；cross_corr 与 cross_autocorr 的 EPS 1e-9 对窗口内无变化的票输出 0 而非 NaN，是低频票上的小问题；in_slice(Ret,181,240) 是 inclusive 的 60 根，Ret 第 0 根恒为 0（计入分母、不计涨跌），种子 8、12 的分段读数无前视。并列：种子 9 的 cross_tail_mean_q25 的 distinct 为 0.74（约四分之一的取值并列），种子 4 的 cs_rank 差值 distinct 0.848；按 §4 并列由股票列序打破，不是问题，但种子 9 的截面有一部分是列序决定的。如果它有 alpha，最可能来自计数式买压的慢变化（种子 1、2、3、9、10、11），其次是错位本身（种子 4、5：涨的分钟多、金额却在跌的分钟里成交）。但分钟价格计数在流动票上有相当的买卖价差反弹成分，所以更可能的来源是流动性读数（表内 liq 0.33–0.48）。划掉：无。无数学问题；与任何 head 的 |ρ| 都 < 0.7（最高 0.402），与任何控制的 |ρ| 都 < 0.8（最高 0.479）。种子 1、2、10 是同一统计量的不同归一或平滑，互为相近，但不构成重复的划掉理由，保留。'
R:
  - head: 'add(div(pow_1_5(day_argmin(Amt)), day_max(High)), cross_max(day_cov(Close, Close), 15))'
    soundness: 4
    reasons: '合理度 4。机制清楚：单日 argmin 钟点噪声大、换手高；平滑（60 / 120 日均值、60 日 EMA）与把 Amt 换成 Volume 或 day_centroid（成交额重心，ops_ext.py 第 155 行附近，tot 为 0 时输出 NaN），都是对「钟点读的是流动性」的直接处理。逐个算子核对：cross_mean(day_argmin, 60 / 120) 是线性的；div 的分母是 day_max(High)（当日正价）或 cross_mean(day_max(High), 60)（正价），不会除以近零；变体 6 的两个 cs_rank 把量纲统一（取值 (0,1]）；变体 7 去掉了 cov 项。本表 ρ_known：变体 1–5 为 0.555–0.615，过不了 < 0.5 的门槛，只有变体 6（0.011）与变体 7（0.067）有资格替换或收录（分数还需过线）。一处不挡的注意：原 head 的加法两项量纲不同，pow_1_5(argmin)/价格 与 cross_max(day_cov(Close,Close),15) 的单位是价格²，后复权价高的票 cov 项对和的排序影响更大。R 的理由说 cov 是乘客，第 1 轮分数证据支持（去掉后 −2.24 对 −2.20），但去掉 cov 的版本与 head 的日度秩 |ρ| 只有 0.86（R_prev 第 3 行），排序并非完全不受影响；变体 1–5 保留了 cov 项。分数证据较强，合理度不因此降为 3。'
  - head: 'ts_quantile_q75(ts_var(pow_1_5(day_argmin(Amt)), 20), 5)'
    soundness: 4
    reasons: '合理度 4。机制清楚：20 日内钟点（pow_1_5 后）的方差再取 5 日 q75，读的是「最安静分钟的时间是否不稳定」，对应停牌、封板、薄盘日的钟点跳变；式中没有价格项，量纲与价格无关。R 的部件判断与第 1 轮证据一致：R_prev 中 cs_bucket_demean(·, day_sum(Amt)) 从 −2.90 提到 −1.91（train −1.91 / valid −0.68），ρ_known −0.03，与原 head 的 ρ 为 −0.84，四个数都能在 R_prev.json 里核对到。逐个算子核对：cs_bucket_demean(y, x) 按 x 的十分位去均值（ops_ext.py 第 463 行附近），x = cross_mean(day_sum(Amt), 60) 只用 t 日及以前的信息；ts_var 与 ts_quantile_q75 都是因果窗口；没有除法，没有爆点。本表：变体 1（ρ_head 0.775，ρ_known 0.245）若分数过线可替换头 2；变体 2（ρ_head 0.391，ρ_known 0.046，对所有 head 的 |ρ| 都 < 0.7）若分数过线可收录为新 head；变体 3（ρ_head 0.509，ρ_known 0.027）若分数过线可替换。变体 2 的桶变量用 60 日均值来压换手，与 PI 的说法一致，合理。R 组只评合理度，不划掉。'
summary: '两个 N 位都通过（创新度 4、合理度 4，无划掉，各剩 12 个种子）；两个 R 组合理度均为 4。风险集中在槽 a：一字日的读数恒为 0，且开盘封涨停的持仓在纯多头书里记 0 收益，方向可能由封跌停一侧决定。'
