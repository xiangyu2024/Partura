slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [7]
    reasons: '创新度 4。核心 day_max(High) 本身不新：它是 head 1 的分母，也是 head 2 里 day_open(Close) 这个价格项的同类量；相关度表上核心对 head 2 的原始 |ρ| 为 0.61，对 head 1 的残差 |ρ| 为 0.72，即核心这一层是已知的价格水平分量。但外围的历史相对变换（seed 1、2、3、5、6、14：对 241/60 日自身均值、最高、区间位置、z 分数、EMA 比）对全部 3 个 head 的残差 |ρ| 只有 0.02–0.09，且与 5 个控制的最大 |ρ| 为 0.46（seed 3/5 的 rev 0.46–0.49，属中度，未触发 0.8 的自动划掉）。库里 5583 条表达式没有一条用日频叶子（LogFloatCap、LogFloatShares、FloatCap、ListAge、BoardCode 命中 0 次）；14 个种子的规范化骨架（抽掉字段、常数、窗口，与库的骨架规则约 94% 一致）都不在库的约 4093 种骨架里；库里对 day_max(High) 的 cross_* 用法只有 cross_cov(day_max(High), day_var(·))（B138 批），没有 zscore、比值、EMA、Hurst、分桶形式。给 4 不给 5，因为 seed 8–11 对 head 1/2 的残差 |ρ| 为 0.42–0.69，是同一个价格水平分量换了写法。合理度 4。机制清楚（52 周高锚定 George-Hwang 2004、名义价偏好、派息史）。逐个算子核对：比值类分母都是正价格或 max−min（seed 3 的分母可以恰好为 0，结果是 NaN 而不爆，笔记写的“严格为正”不准确）；cross_zscore 有常数窗口保护，|z| 不超过 sqrt(d−1)；cross_ema 有 1e-12 保护；窗口含当日、只用收盘前可得的信息，无前视。划掉 7：cross_delay(·,241) 是严格位移，前 241 个全局交易日对每只票都是 NaN，覆盖率 0.852 未过门槛（其余 241 窗口种子覆盖率 0.999），属“系统性算不出”（§4 定义坏掉），并把新上市第一年的票整体剔出样本。不划掉的理由：seed 12 的 cross_corr 用的是水平而非变化，测的是 60 日共同趋势，与“价涨量增”的机制不一致，但不是数学问题；seed 13 的 cross_hurst 遇 NaN 后累和只用停牌前的前缀算 R，对停牌票有偏，但与 liq 控制 |ρ| 仅 0.02，不是主导；seed 1、5、6、14 的控制画像几乎相同（liq 约 0.3、vol 约 0.35、rev 约 0.45、known 约 0.35、size 约 0.18），是同一族，会有冗余，但不是明显重复，放行；seed 4 的 rev 0.75 低于 0.8，放行。如果它有 alpha，最可能来自：价格水平相对自身历史的慢变化（52 周高锚定、12 个月反转，即 seed 1、2、3、5、6、14），其次是 seed 8–9 所指的累计派息 / 送转因子（log(H) − (LogFloatCap − LogFloatShares) 约等于 log(fac)，日内高收比只是小的误差项）。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [4]
    reasons: '创新度 4。13 个种子对全部 3 个 head 的残差 |ρ| 都在 0.008–0.084，与 5 个控制的最大 |ρ| 为 seed 1 的 rev 0.55（sum 版 ON−ID 含 −Σ总收益，部分重叠，与笔记一致），其余不超过 0.45；13 个骨架都不在库里。库里有 6 条含 day_first(Open) 与 ts_delay(day_last(Close),1) 的表达式（L239、L256、L262、L268 等），但没有一条把隔夜缺口当收益序列放在日轴上与日内收益比较，笔记“库里没有 ON 与 ID 的日轴比较”成立。合理度 4。隔夜 vs 日内的 tug of war 机制清楚。逐个算子核对：ON = day_first(Open)/ts_delay(day_last(Close),1)−1 只用 t 日开盘与 t−1 日收盘，ID 只用 t 日，无前视；b5、b13 的分母是标准差之和或绝对值之和，0/0 为 NaN，比值有界；b6、b12 的 cs_regres(Y,X) 是 Y 对 X 的截面 OLS 残差，定义正确。划掉 4：本库的 ts_regbeta(x,y,d) 来自 rolling_ols，即 y ~ alpha + beta·x 的 beta = cov(x,y)/var(x)，所以 ts_regbeta(ID,ON,40) 实际是 ON 对 ID 的斜率，与笔记写的“ID 对 ON 的 follow-through”方向相反；它等于 corr(ON,ID) × σ_ON/σ_ID，与 seed 3 的 ts_corr(ON,ID,50) 是同一对序列上的同一类量，两者的控制画像几乎一致（liq 0.18/0.17、vol 0.05/0.04、rev 0.01/0.01、known 0.17/0.15、size 0.13/0.12，差不超过 0.02），属于重复；分母 var(ID) 只有 EPS=1e-9 的绝对保护，对近乎不动的日内收益票会产生爆点。不划掉的理由：seed 9（ts_mean(sign·sign,30)，distinct 0.018，只有约 61 个水平）与 seed 10（ts_mean(argmin(Low)−argmax(High),20)，distinct 0.43）的门槛“废品”来自并列，§4 明确并列靠列序打破不是问题，不据此挡，但 PI 应知道二者是粗粒度信号；seed 1 的 sum 版本会被一字板日主导（ON 很大而 ID 为 0），中位数版 seed 2 更稳健，仅作合理度提示。如果它有 alpha，最可能来自开盘前信息与日内噪声的分工（隔夜缺口的持续性与日内回补），即 seed 1、2 的 ON−ID 聚合与 seed 7、12 的 ON 漂移；seed 10–11 的时钟部分是笔记自己说的 B061 里最弱的一块，信心最低。另外，ON 只在除权日连续时才是干净的总收益缺口，计划里 fac = 复权 VWAP / 原始 VWAP 逐日的前提没有验证，落地前应核对除权日的 ON 分布。'
R:
  - head: 'add(div(pow_1_5(day_argmin(Amt)), day_max(High)), cross_max(day_cov(Close, Close), 15))'
    soundness: 4
    reasons: '合理度 4（R 组只评合理度）。原 head 的量纲问题是真的：按算子定义，day_argmin 在 0..239，pow_1_5 之后约 0..3700，除以 day_max(High)（几十元）约为 10–300；cross_max(day_cov(Close,Close),15) 是日内方差，单位 CNY^2，量级约 0.01–1，所以在加法里 cov 项基本是乘客，与笔记 knockout +0.01 的说法一致。6 个变体逐个核对：cs_rank 用的是 common.rank，NaN 保持为 NaN，平局按列序打破（§4 不是问题），没有 nanrank_last 的 0 填充陷阱；分母都是正价格（停牌为 NaN）；variant 2 的 day_sum(Amt)/day_sum(Volume) 是原始 VWAP，与 test_label_metrics 中“存储后复权价格但不复权 Amt/Volume”的注释一致；variant 6 的 var/High^2 无量纲。variant 3 与原 head 的原始 |ρ| 为 0.85（残差 0.86），只去掉了 pow 与 cov 项，是最干净的替换候选。如果它有 alpha，最可能来自 day_argmin(Amt)（零成交分钟时取第一个空分钟）所代表的流动性时点，而不是 cov 项。'
  - head: 'ts_quantile_q75(ts_var(pow_1_5(day_argmin(Amt)), 20), 5)'
    soundness: 4
    reasons: '合理度 4（R 组只评合理度）。机制核对：Var(x^1.5) 对小幅波动的一阶近似是 2.25·x̄·Var(x)，所以 ts_var(pow_1_5(argmin),20) 本质上是“时点水平 × 时点方差”，与笔记说的“流动性水平函数”一致，也解释了为什么去掉 pow 不改变排名。variant 2（ts_std 去掉 pow）与原 head 的原始 |ρ| 为 0.98、残差 0.98，是诊断性变体而非新东西；variant 1 把方差换成 20 日均值（时点水平本身）；variant 3、4 用 cs_bucket_demean 在市值 / 成交额十分位内去均值，保留量纲，桶内不足 2 个时为 NaN，定义正确。窗口 20 日方差加 5 日分位数合理，没有除法，没有 ts_rank 或 nanrank_last 陷阱。如果它有 alpha，最可能来自最低成交分钟的时点在 20 日内的漂移（流动性节奏的变化），而不是方差本身。'
summary: '总体：slot a 创新 4、合理 4，划掉 7（严格 241 日位移，前 241 日系统性 NaN，覆盖率 0.852）；slot b 创新 4、合理 4，划掉 4（与 3 同为 ON–ID 同期共动，且 ts_regbeta 的算子方向与叙述相反、分母近零）；R 两组合理度均为 4。需要 PI 知道的三点：(1) seed 9、10 的“废品”标签来自并列，按 §4 不挡，留给 GP 与 PI 判断；(2) 快照 3 个 head 的最高分是 −2.20，远低于 0.5 的发现线，R 的替换门槛（head+0.1）只是很低的一条线；(3) 笔记自述 PI 在 grep members.csv 时扫到了 B062、B063 的表达式，计划称未使用，但这是对未来批次的泄露风险，应由总领知悉。s2021 没有更早的轮次（只有 r1），无 missions_final.yaml 或 audit_record.json 可对照。'
