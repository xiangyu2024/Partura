slots:
- type: E
  core: day_max(High)
  hypothesis: 'Core = day_max(High), the daily high of the BACK-ADJUSTED price (adjusted
    price = raw price x cumulative adjustment factor fac, where fac is the running
    product of dividends and bonus-share adjustments since listing; across stocks
    its rank is roughly raw price x payout history x vintage-of-listing, a very slow-moving
    stock characteristic). Why this is the core and not day_argmin(Amt): in this batch
    (B061, 16 members around pow_1_5(day_argmin(Amt))) the three material heads score
    -2.20 / -2.50 / -2.90; the least bad one, head 1, carries two price-level terms,
    div(., day_max(High)) (sufficiency -2.22, equal to the whole head) and cross_max(day_cov(Close,
    Close), 15), which in CNY^2 is proportional to adjusted price squared times intraday
    variance, so it is also a price level (sufficiency -2.41); the pure clock-time
    head 3 (variance of the trough minute) is the worst at -2.90, and knocking the
    power out of head 1 (plain day_argmin(Amt) instead of pow_1_5(day_argmin(Amt)))
    moves its score from -2.20 to -0.92 (train -0.48), which lets the price-level
    terms compete in the sum, while knocking out the cov term changes nothing (+0.01).
    So the part of this batch that looks like signal is a price level, and 7 of the
    16 members that hold the clock-time itself already sit in the champion''s family
    22, which the ruler removes. None of the 7 controls (liquidity, volatility, 20-day
    reversal, known Amt family, LogFloatCap, two champions) is a price level or a
    payout history, so this is a slow characteristic the ruler does not subtract.
    The slot keeps the level and grows OUTSIDE it in four directions, none of which
    the snapshot has seen (the heads wrap it in ts_quantile_q75 chains, divide an
    argmin by it, or add cross_max(day_cov)): (1) the level against its OWN history
    with day-axis operators on 60 / 241-day windows (ratio to the 1-year mean, distance
    to the 52-week high, position in the 1-year range, z-score, fast/slow EMA ratio,
    12-month change, 60-vs-241 spread, Hurst exponent): dividing the level by its
    own past strips the listing-price base and the vintage, leaving the long-horizon
    price path (52-week-high anchoring, 6-12 month reversal), a horizon that the 20-day
    reversal control does not cover; (2) the level decomposed with daily-field leaves:
    LogFloatCap - LogFloatShares is the log of the RAW nominal price (FloatCap / FloatShares),
    so log(day_max(High)) - (LogFloatCap - LogFloatShares) is the log adjustment factor
    = cumulative payout / bonus-share history (high-payout stocks), which is neither
    price, size nor liquidity; no library expression uses a daily-field leaf at all;
    (3) the level made size-neutral inside the expression: cs_bucket_demean / cs_bucket_rank
    on LogFloatCap compares a stock''s price with same-size peers (nominal-price /
    low-price preference of retail investors that is not the size effect); (4) the
    level against money flow: cross_corr(level, day_sum(Amt), 60) = does the price
    rise on rising turnover. Why it may survive out of sample: these are slow, persistent
    attributes (the decile book turns over a few percent a day, so the 15 bp cost
    is small), the mechanisms (nominal-price illusion, 52-week-high anchoring, payout
    / dividend preference) are structural rather than sample-specific, and the objective
    takes the worse of train and valid, which filters out the "train ~ 0, valid positive"
    slow low-price tilt that lab findings warn about. Math notes: all divisions have
    strictly positive denominators (price levels, ranges, means of prices); windows
    are NaN-aware, newly listed stocks (about 7 percent of the cross-section) have
    short expanding windows, so the 60-day variants are preferred where listing age
    could dominate.'
