- type: N
  hypothesis: 'Idea: split each day''s price change into the OVERNIGHT part (previous
    close to today''s first open, i.e. the call auction and the news that arrived
    while the market was closed) and the INTRADAY part (open to close, the continuous
    session, dominated by retail trading), and read how the two behave over 20-50
    days. Overnight return ON = day_first(Open) / ts_delay(day_last(Close), 1) - 1;
    intraday return ID = day_last(Close) / day_first(Open) - 1 (prices are back-adjusted
    with the same factor within a day and the factor is applied consistently across
    the ex-date, so ON is a clean total-return gap). Mechanisms the seeds implement:
    (a) tug of war: sub(ts_sum(ON), ts_sum(ID)) and robust medians: persistently strong
    overnight and weak intraday returns mean that informed / institutional flow arrives
    before the open while retail intraday trading is noise that reverts (Lou, Polk
    and Skouras 2019 find both components persist but with opposite sign of premium;
    Aboody et al. 2018 tie overnight returns to firm-specific sentiment); (b) gap
    follow-through vs gap fade: ts_corr(ON, ID) and ts_regbeta(ID, ON) and the frequency
    with which gap and session share a sign: a stock whose opening gaps are followed
    through is being repriced on information, one whose gaps fade is being pushed
    around by opening orders; (c) the information share of the closed market: std(ON)
    / (std(ON) + std(ID)) and the drift-consistency ratio sum(ON) / sum(|ON|), scale-free,
    so not a volatility level; (d) a purged version: cs_regres(sum(ON), sum(total
    return)) removes the 20-day reversal exposure inside the expression, and cs_regres(mean
    ON, mean ID) keeps only the part of the overnight drift that the session does
    not explain; (e) clock-time of the price path (carried over from the batch''s
    argmin theme, where the batch''s clock-time of the volume trough was the weak
    part): the day''s low occurring after the day''s high, averaged over 20 days,
    and its correlation with the gap. Why it differs from the library and the heads:
    the library (5583 expressions) is minute-structure statistics (in_slice, day_std,
    argmin of Amt ...), it has no expression that builds ON and ID across the day
    axis and compares them, and none of the heads or controls (liquidity, volatility,
    20-day total-return reversal, Amt dispersion family, size, two champions) is a
    split of the return by session. Correlation with the 20-day reversal control is
    partial, because the difference ON - ID is not the total return ON + ID. Why it
    may persist out of sample: the retail-vs-institution split of the trading day
    is structural in A-shares (T+1, call auction orders from institutions, retail
    intraday churn), the signals are 20-50 day averages with slow turnover, and no
    divisor can explode (ratio seeds divide by sums of absolute values or standard
    deviations of non-degenerate windows; a stock locked at the limit all window is
    NaN or a ratio of zeros, which the NaN-aware ops drop). No look-ahead: ON uses
    only the open of day t and the close of day t-1, ID only day t.'
  inspired_by: 'B061: the batch is clock-time features (pow_1_5(day_argmin(Amt)),
    day_open(Close) in head 2) and its best members carry price-level terms; the clock-time
    of the volume trough was the weakest part (head 3, -2.90), so the new idea moves
    the clock from volume to the price path: how much of the move arrives before the
    open versus during the session'
  literature:
  - source: 'Lou, Polk and Skouras, A tug of war: overnight versus intraday expected
      returns, Journal of Financial Economics'
    year: 2019
  - source: Aboody, Even-Tov, Lehavy and Trueman, Overnight returns and firm-specific
      investor sentiment, Journal of Financial and Quantitative Analysis
    year: 2018
  seeds:
  - sub(ts_sum(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), 20), ts_sum(sub(div(day_last(Close),
    day_first(Open)), 1), 20))
  - sub(ts_med(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), 40), ts_med(sub(div(day_last(Close),
    day_first(Open)), 1), 40))
  - ts_corr(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), sub(div(day_last(Close),
    day_first(Open)), 1), 50)
  - div(ts_std(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), 30), add(ts_std(sub(div(day_first(Open),
    ts_delay(day_last(Close), 1)), 1), 30), ts_std(sub(div(day_last(Close), day_first(Open)),
    1), 30)))
  - cs_regres(ts_sum(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), 20),
    ts_sum(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), 20))
  - ts_mean(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), 50)
  - ts_quantile_q25(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), 50)
  - ts_mean(mul(sign(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1)),
    sign(sub(div(day_last(Close), day_first(Open)), 1))), 30)
  - ts_mean(sub(day_argmin(Low), day_argmax(High)), 20)
  - ts_corr(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), sub(day_argmin(Low),
    day_argmax(High)), 30)
  - cs_regres(ts_mean(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1),
    50), ts_mean(sub(div(day_last(Close), day_first(Open)), 1), 50))
  - div(ts_sum(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), 30), ts_sum(abs_(sub(div(day_first(Open),
    ts_delay(day_last(Close), 1)), 1)), 30))
R:
- head: add(div(pow_1_5(day_argmin(Amt)), day_max(High)), cross_max(day_cov(Close,
    Close), 15))
  why: 'Two rotten parts, both read off the knockout table. (1) pow_1_5(day_argmin(Amt)):
    replacing it by the plain day_argmin(Amt) moves the score from -2.20 to -0.92
    (train -0.48), a gain of 1.28; the power stretches a 0..240 minute index so that,
    inside a plain add() of terms in different units, the argmin term swamps the price-variance
    term for most stocks, i.e. the sum is not the balanced mixture it looks like.
    Variants put the two terms on a common footing with cs_rank (rank sum), smooth
    the noisy daily index by its 20-day mean, or drop the clock term entirely (price-level
    U-shape: cs_rank(inv(High)) + cs_rank(cov term)) to see which half carries the
    score. (2) day_max(High) as the price denominator is the BACK-ADJUSTED high, so
    it carries the payout factor, not the nominal price retail sees; one variant swaps
    it for the raw price proxy day_sum(Amt) / day_sum(Volume) (Amt and Volume are
    unadjusted, so the ratio is raw price up to a constant unit). The cov term cross_max(day_cov(Close,
    Close), 15) is a passenger (knockout +0.01) and its CNY^2 units leak the price
    level; one variant divides it by High squared to make it scale-free.'
  variants:
  - add(cs_rank(div(day_argmin(Amt), day_max(High))), cs_rank(cross_max(day_cov(Close,
    Close), 15)))
  - add(cs_rank(div(day_argmin(Amt), div(day_sum(Amt), day_sum(Volume)))), cs_rank(cross_max(day_cov(Close,
    Close), 15)))
  - div(day_argmin(Amt), day_max(High))
  - add(div(cross_mean(day_argmin(Amt), 20), day_max(High)), cross_max(day_cov(Close,
    Close), 15))
  - add(cs_rank(inv(day_max(High))), cs_rank(cross_max(day_cov(Close, Close), 15)))
  - cross_max(div(day_cov(Close, Close), pow_2(day_max(High))), 15)
- head: ts_quantile_q75(ts_var(pow_1_5(day_argmin(Amt)), 20), 5)
  why: 'The variance of the (stretched) trough-minute index over 20 days is the weakest
    head (-2.90 in both train and valid): with zero-trade minutes the argmin of Amt
    is the first empty minute, so the index is mostly a liquidity level and its variance
    is a function of it, which the liquidity and size controls then remove; the knockout
    of the power changes nothing (-0.10). Variants take the level or the spread of
    the index instead of the variance of its power, and neutralise the whole head
    inside size or liquidity deciles so the shared level is taken out inside the expression.'
  variants:
  - ts_quantile_q75(ts_mean(day_argmin(Amt), 20), 5)
  - ts_quantile_q75(ts_std(day_argmin(Amt), 20), 5)
  - cs_bucket_demean(ts_quantile_q75(ts_var(pow_1_5(day_argmin(Amt)), 20), 5), LogFloatCap)
  - cs_bucket_demean(ts_quantile_q75(ts_var(pow_1_5(day_argmin(Amt)), 20), 5), day_sum(Amt))
