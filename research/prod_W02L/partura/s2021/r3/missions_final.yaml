- type: N
  hypothesis: 想法:市场状态切换(Cooper、Gutierrez、Hameed 2004 的「上涨市动量、下跌市反转」;Cheema 与 Nartea
    对中国市场的状态依赖研究):同一个个股读数在牛市和熊市里符号相反,不分状态直接排名时两种状态互相抵消。批里的现象(B061 到 B063,42 个成员,全是
    day_argmin 钟点 + ts_max / sigmoid / ts_quantile_q75 链):在库自己的尺子下它们大多 raw 夏普为正,新尺子(两个冠军已含这一族)下全部亏,而且
    train 与 valid 的符号不稳;第 2 轮 N 位里最接近线的 cross_ema(封板差平方, 60) 是 train -0.10 / valid
    +0.33,同样是「两段方向不一致」。不一致的一个自然解释是读数的符号依赖市场状态,而库里 5583 条表达式一条都不带「市场状态」(全部是截面内、只用个股自己的数据),所以这是库和冠军都没有的维度。实现:cs_flip_by_state(y,
    g) = 当天 g 的截面均值相对其过去 241 日中位数偏高时输出 +rank(y)、偏低时输出 -rank(y)(rank 已减 0.5,中心为 0),状态只用
    t 日及以前的数据,无前视;状态变量 g 取 cross_ema(day_sum(Ret), 60)(全市场 60 日趋势)、cross_ema(day_std(Ret),
    20)(全市场波动状态)。被翻转的 y 取三类:(a) 6 个月动量跳过最近一个月 log(ts_delay(day_last(Close), 20)) -
    log(ts_delay(day_last(Close), 120));(b) 20 日 / 60 日收益 cross_ema(day_sum(Ret),
    20 或 60) 与彩票型最大值 cross_max(day_sum(Ret), 20)(上涨市追、下跌市反);(c) 第 2 轮最接近线的封板差 cross_ema(sub(day_at_max_ratio(Close),
    day_at_min_ratio(Close)), 60) 和日内振幅 / 昨收的慢 EMA。为什么和库、head、控制不同:控制里的 20 日反转是固定符号的线性暴露,奖励把它的一次项、平方、立方都去掉,但按状态翻转后的信号在上涨日和下跌日的符号相反,日度残差随之整体翻转,是它去不掉的结构;库里无
    cs_flip_by_state。为什么样本外还会在:这是行为金融里有大量文献的状态依赖(过度自信与处置效应在上涨后加强,在下跌市里被抛压推翻),状态切换的频率低(60
    日趋势对 241 日中位数,一年只切几次),换手不被翻转本身抬高;若 y 在另一个状态里只是失效而不是反转,翻转后会明显变差,这本身是检验。数学检查:ts_delay
    的延迟 120 日在窗口开头产生 120 日 NaN(覆盖率约 0.9,不是定义坏掉:状态本身与 rank 对有值的票是良定义的);log 的参数是后复权收盘价(正数);cs_flip_by_state
    在状态未定义的日子输出 NaN 而不是静默当成低;种子里唯一的除法是第 8 个种子的振幅除以昨收(后复权价,正数),没有除以近零的量。已知风险:状态切换的次数少(2018
    到 2025 年约十几次),分数对个别年份敏感;g 的中位数基准 241 日有热身。
