    为负 valid 为正,说明读数在 2018-2021 年的小盘题材炒作段里方向与 2023-2025 不同,或被换手与噪声压住。第 2 轮见过的外围只有
    cross_ema(15/30/60/120)、ts_delay 一天、乘以隔夜跳空、快慢 EMA 之差、自相关。本轮的外围全部换成不同的机制:(1) 下尾
    / 上尾均值(cross_tail_mean_q25/q75,120 日):只读窗口里最极端的四分之一日子,即「封跌停的频率」与「封涨停的频率」分开读,窗口内没有封板的票两端都只剩
    tick 噪声而落在中段;(2) ts_quantile_q75 / ts_med 的分位数链,压掉单日一字板尖峰;(3) 对自身历史的 cross_zscore(120):读的是「这只票最近比它自己平时更多封涨停还是封跌停」的变化而不是水平,把长期题材股的永久水平去掉;(4)
    慢 EMA 241 与 60 日 EMA 之差(状态切换);(5) 除以 60 日慢波动 day_std(Ret) 的 EMA(加 0.001,波动恒正),把封板频率变成「相对于该票正常波动的封板」,降低对波动控制的暴露;(6)
    在 LogFloatCap 十分位内去均值(日频叶子,不是单日量,桶变量变化极慢,换手小):读同市值组内的封板倾向,而不是小盘本身;(7) 在 60 日成交额十分位里把最活跃的
    10% 压到最底(cs_last_high10):纯多头书买不进一字板,最活跃一端以封板为主的票被排除;(8) 乘以日内涨跌符号:封板与当日收盘方向一致才计入。算子怎样实现:全部是因果窗口,cross_ema
    实数权重避免整数并列,day_at_max_ratio / day_at_min_ratio 在有效分钟少于 2 时为 NaN,取值 0 到 1,差在 -1
    到 1,平方保留符号所以不会因符号丢失而成为无方向量。为什么与库不同:库 5583 条里没有一条用 at_max / at_min,也没有一条按「封板频率的尾部、相对自身历史、对波动归一」去读它。为什么样本外还会在:涨跌停是交易制度而不是样本期风格(幅度的唯一一次变化
    2020-08 创业板改 20% 已被日频叶子 LimitWidth 吸收,本核心本身是比例所以不依赖幅度);封板频率是个股的慢属性,慢半衰期平均后换手低,15
    bp 成本很小;方向由训练段定,不预设。已知风险:一字日读数恒为 0,开盘即封涨停的票多头书里买不进(方向可能由封跌停一侧决定);一半以上股票窗口内无封板,读数只是
