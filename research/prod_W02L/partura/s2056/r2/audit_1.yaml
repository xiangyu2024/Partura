  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [2, 12]
    reasons: '位 a 是 E 位,核心 div(day_std(Amt), day_sum(Amt)) 是快照 head cross_corr(day_sum(Amt), cross_delay(core,1), 60) 的子树。相关度表:核心与 head 原始 |ρ| 0.17、残差 0.16;与控制 liq 0.59、vol 0.01、rev 0.01、known 0.53、size 0.42,全部 < 0.8,核心门槛通过。外围创新度:种子 3(与 close/open 比率)、4(核心自相关,与 head 0.15)、5(cross_zscore 核心 120,与 head 0.14)、6(核心对自身 60 日均值的偏离,与 head 0.14)、9(与 day_min(Ret) 的 90/60 日耦合,与 head 0.39)、11(cross_delta 核心 20,与 head 0.05)、7(与 cross_delta(day_sum(Amt),1) 的耦合,与 head 0.49),都是 head 没有的伙伴或归一化方式,给 4。种子 1、8、10 仍是同一结构 cross_corr(day_sum(Amt), lagged core, w) 只换了伙伴或滞后,与 head 的 |ρ| 分别为 0.68、0.48、0.65,都低于自动划掉的 0.7,保留。种子 2(day_sum(Volume) 配核心,与 head |ρ| 0.71 ≥ 0.7,自动划掉),且它与 R 组的变体 8 完全相同。种子 12(窗口 240、滞后 1,与 head |ρ| 0.55)与 R 组变体 4 完全相同,按重复划掉。剩 10 个种子,≥ 4。数学核对:cross_delay 是沿日轴向下移(取的是过去的值),不是前视;cross_delta 为 x[t]-x[t-d];cross_zscore 的窗口含当天但只用当天及以前的值;div 是 torch.divide,日内 std 与 sum 同量级,sum 为 0 时得 NaN,不会爆点。同日配对(种子 9 的 day_min(Ret)、种子 3 中延迟后的核心与当天 close/open)是库里 head 已用的同一约定,不算前视。风险只在统计层面:60–240 日的时间序列相关是两个趋势性水平序列之间的耦合,存在共趋势造成的虚假相关,但这不是定义问题,不挡。如果它有 alpha,最可能来自核心与成交额水平的慢耦合(或种子 4–6、11 那类核心的持续性 / 相对自身历史的状态),而不是单纯的流动性(核心 liq 只有 0.59,残差会去掉这部分)。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '位 b 是 N 位,想法是今日分钟成交额曲线与自身 20/60 日同分钟平均曲线的 day_corr(分钟轴相关),库里所有 head 都是日轴的日度聚合或分钟序列 max 收拢,没有分钟轴的剖面相关,所以构造是新的。相关度表:种子与所有 head 的原始 |ρ| 为 0.15–0.42,残差 0.12–0.31,都远低于 0.7。但与控制的原始秩相关偏高:种子 1、2、3、4、6、11 的 liq 为 0.54–0.70、known 为 0.56–0.69,即大部分原始排序主要跟流动性和已知族 cross_mean(day_std(Amt),30) 同向;这种平滑度 / 流动性的重合不到 0.8,不自动划掉,也不构成同一个东西的证据,所以创新度给 3 而不给 4。种子 5、7、8、9、10、12 与 liq 只有 0.04–0.30,与 rev 在种子 8、10 为 0.56、0.53,这两个需要留意。数学核对:day_corr 在 dt_day.py:231-245 的实现是一方当天为常数(一字板、零成交)时返回 0,不是缺失,20 日均值与 60 日 cross_stddev 会把这些 0 拉进平均;种子 8 与 10 用的是 Ret,一字板日 Ret 为常数,会整天得 0,因此种子 8 的 rev 0.56 可能部分来自涨停锁定的日子。这是 §4 列出的已知伪影,只有在结果主要由它决定时才算定义坏掉,而相关度表中没有证据显示它占主导(种子 3、1 等不用 Ret 的也有 0.6–0.7 的 liq 重合,说明主要是流动性平滑度),所以不挡,给 4。延迟与窗口核对:cross_delay(cross_mean(Amt,20),1) 含当天的窗口已经被滞后一天去掉当天,不是前视;种子 5、7、12 的 cross_zscore、cross_corr 窗口都只用当天及以前;种子 9、10 的同日配对与库约定相同。如果它有 alpha,最可能来自分钟剖面的异常时点(知情或大单执行),但更可能是平滑度 / 流动性或一字板日 0 拉低 20 日均值造成的 rev 相关,残差之后未必剩下东西;PI 在读分数前应先算一下停牌以外的零成交 / 一字板日占比。'
R:
  - head: 'cross_corr(day_sum(Amt), cross_delay(div(day_std(Amt), day_sum(Amt)), 1), 60)'
    soundness: 4
    reasons: '8 个变体(窗口 90/150/180/240、去掉滞后、Volume 替换两处、核心 3 日平滑),全部是日轴 cross_corr 对已有核心或其平滑版,没有前视算子,也没有 nt_* 与 ts_spearman。其中变体 4(窗口 240,滞后 1)与种子 12 完全相同,变体 8(Volume 版,滞后 1,窗口 120)与种子 2 完全相同,二者在 R 组与种子组重复,已在种子那边划掉(种子 12、2),R 组保留评估。拉长窗口是对 60 日时间序列相关噪声的平滑,机制与原 head 同一(成交额水平与核心的慢耦合);如果它有 alpha,最可能来自窗口变长后噪声下降,而不是新的信息。变体的相关度表(窗口 90 与原 head |ρ| 0.81,与 known 0.31,残差 0.80)说明它们与原 head 高度相关,按 §2 会以替换方式生效,不需要另外收录。无数值伪影或定义问题,给 4。'
summary: '位 a(E,核心为快照 head 的子树,外围新)创新度 4、合理度 4,划掉种子 2(与 head |ρ| 0.71 且与 R 变体 8 重复)与 12(与 R 变体 4 重复),剩 10 个;位 b(N,分钟剖面 day_corr)创新度 3(与流动性、known 族原始 |ρ| 0.65–0.70,拿不准给 3)、合理度 4,无种子划掉,留意 day_corr 的 0 与一字板日的 rev 拉低;R 组合理度 4,无数学问题,变体 4 与 8 与种子重复。'
