  - type: N
    hypothesis: >-
      New idea: replace the DISPERSION measure of the intraday volume curve (std/sum, used by the only heads that work)
      by measures of its TEMPORAL STRUCTURE, and read the slow coupling with volume level through a regression slope as
      well as a correlation. For each stock-day, the 241-minute Volume curve gets (a) day_kurt / day_skew (how peaky or
      one-sided the day is), (b) day_ar1_coefficient / day_autocorr(Volume, 5) (does trading come in persistent clusters
      or isolated spikes: split-order execution creates clustering, noise trades do not), (c) day_hurst. The daily
      numbers are lagged one day (cross_delay) and related over 120 days to the volume level by cross_corr (same
      reading as the working head) or cross_regbeta (how many units of volume level per unit of clustering, a sensitivity
      rather than a unit-free correlation). Mechanism: persistent clustering of volume is the footprint of a large
      participant working an order over hours (informed or institutional, price-impacting, slowly incorporated), spikes
      are news or index events; a stock whose volume level rises exactly when its trading becomes more clustered is
      under accumulation/distribution pressure. It differs from the library: the heads are day-axis couplings of
      std/sum (dispersion, order-independent: it does not change if the minutes are shuffled) whereas autocorrelation,
      AR1 and Hurst are order-dependent and kurtosis/skew are higher moments; none of these appear in the library skeletons
      with cross_corr or regbeta of day_sum. Operators: day_* act on the minute axis within a day, cross_* on the day axis,
      cross_delay is a past lag (no look-ahead). day_autocorr / day_ar1 on a constant (zero-volume) day is degenerate, so
      suspended stocks are handled by the suspension mask. Why it should persist: it is the same slow microstructure trait
      that the working head exposes, measured on a different and plausibly cleaner moment of the intraday curve.
    inspired_by: 'batch 1-3: the only heads with positive valid are cross_corr(day_sum(F), lagged std(F)/sum(F)) at 60-120 days (Volume and Amt versions both work, window monotone), while the day_max(cross_corr) and durbin_watson families are negative; the shape-of-the-curve statistic is the active ingredient, so other shape statistics are the natural next object'
