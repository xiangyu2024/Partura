    core: 'cross_corr(day_sum(Volume), cross_delay(div(day_std(Volume), day_sum(Volume)), 1), 120)'
    hypothesis: >-
      Core = the current best head: over a 120-trading-day window, the day-axis correlation between a stock's daily
      share volume (day_sum(Volume)) and its previous-day volume burstiness (day_std over the 241 minutes divided by
      the day total, a scale-free "how concentrated was trading in a few minutes" measure; sum is not near zero for
      traded stocks, suspended days are missing). Earlier rounds showed the alpha is this slow stock-specific coupling
      (volume level co-moves with burstiness: bursty days are the high-volume days, or not), longer windows are better
      (60 -> 120 -> 240 monotone up) and the division by the sum is the necessary part. All snapshot candidates
      containing this idea use the bare coupling number (or its Amt twin) at one window. This slot keeps the core fixed
      and changes what the coupling is compared with / how it is read: (1) regime change: long window minus a short
      (20 day) window of the same coupling, i.e. a stock whose volume-burstiness relation just moved versus its own
      slow norm (information-arrival state, not a level); (2) smoothing, 60-day z-score and 20-day change of the
      coupling; (3) the coupling net of its Amt twin (Volume minus Amt version isolates the part not driven by price
      level / turnover value) and net of a volume-versus-return-volatility coupling (cross_regres or sub), so what is
      left is burstiness-specific rather than generic volume-volatility co-movement; (4) conditioning on the volume
      trend (sign of 20-day volume change) or second-order coupling with the volume level. Mechanism: institutional
      execution splits orders into bursts; whether high-volume stretches are bursty or smooth reveals urgent (informed)
      versus passive (liquidity) flow, a persistent stock-level microstructure trait, and its change signals a switch of
      the dominant participant type, which the market under-reacts to. Out of sample it should persist because the
      raw coupling already passes both train (+1.4) and valid (+1.0) and the wrappers only strip regime / level
      effects the controls pick up. Periphery differs from all seen candidates (none uses cross_mean/zscore/delta of the
      coupling, differences of windows, or residualisation against another coupling).
