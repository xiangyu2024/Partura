attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 3, 7, 8, 12, 14]
    reasons: '创新度 3:核心就是快照 head 1 本身 day_max(cross_corr(Amt, Ret, 60))(valid -0.65),E 位的新意只在外围。外围 14 个种子里,种子 1 sub(max,mean)、3 sub(max,median)、7 cs_regres(max, day_sum(Amt))、8 cs_regres(max, day_std(Ret))、12 sub(max,min) 与该 head 的日度秩 |ρ| 为 0.87–1.00,按库禁令自动划掉。种子 14 sub(max, cross_delay(max,20)) 与种子 4 cross_delta(max,20) 是同一个式子(dt_cross.py 中 cross_delta(x,d) 即 x[t]-x[t-d],等于 sub(x, cross_delay(x,d))),按重复划掉,保留种子 4。保留的 8 个(2,4,5,6,9,10,11,13)与 head 的 |ρ| 为 0.08–0.52(种子 5 为 0.52、种子 6 为 0.59,残差 0.60,都在 0.6 以下),均为对同一峰值的相对形式(峰值除以分钟剖面标准差、20 日变化、相对 60 日均值、cross_zscore、首末小时峰值对比、乘价格趋势符号、与成交额的时序相关),不是换写法,所以不给 1 分;但真正的新意集中在外围且核心本身已在库里,所以给 3 分。合理度 4:机制清楚(放量伴随上涨分钟的耦合峰值,用相对形式去掉水平暴露)。逐个算子核对:day_max、cross_corr、in_slice(181,240) 取闭区间即尾 60 个分钟槽、cross_zscore(含今日、无前视)、cs_regres 都与描述一致;没有用 ts_rank、cross_rank、in_rank_rolling,不触发 nanrank_last 陷阱。需要流水线确认的一点(不挡):停牌日 Amt 与 Ret 若以 0 填充,60 日相关会被停牌模式主导,应确认停牌掩码生效。核心与各控制的 |ρ| 最大为 size 0.35,均 < 0.8,E 位条件满足。如果它有 alpha,最可能来自放量与上涨分钟耦合的慢状态(量价确认的价格压力),相对形式去掉水平后剩下的那部分。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4:N 位的候选与快照三个 head 的日度秩 |ρ| 最大为 0.42(种子 3 cross_corr(day_sum(Amt), day_min(Ret), 60) 对 head 1,残差 0.34),与 5 个控制的 |ρ| 最大为 0.28(known 控制,种子 3 与 6)。它把耦合放到日度聚合并加下行条件,与 head 的分钟级峰值是不同的量,不是换写法;但它沿用了 Amt-Ret 耦合这一大类,所以不给 5。合理度 4:机制说得通(放量与大幅日内回撤同时出现 = 恐慌抛售后的流动性提供溢价;放量与上涨 = 吸筹;Amihud 式价格冲击斜率是已知的补偿特征)。逐个核对:cross_corr 为日轴滚动相关;day_sum(Amt)、day_min(Ret)、day_max(Ret)、day_std(Ret)、day_skew(Ret)、day_first/day_last(取有效值,NaN 跳过)都是按天聚合,无前视;窗口 60–120 日在 train 起点 2018 之后有足够热身。两点记入理由但不挡:(1) 假设文字把 div(day_last(Close), day_first(Open)) 称为收盘对开盘收益,实际表达式是当日首开到末收的日内收益(open-to-close),机制照样成立,只是写计划的文字与式子不一致,请以式子为准;(2) 种子 1、2、11 的 Close/Open 比,若停牌日首开为 0 或缺失会爆点,应由流水线确认,未经确认不挡。种子 12 把 Amt 换成 Volume,与种子 4 结构相同、量纲不同,在价格变化较小的股票上两者近似成比例,属于换写法的边缘情形,但 Volume 与 Amt 的时序相关并不是同一量,保留,评审时对照种子 4 的结果。没有种子与 head 的 |ρ| 达到 0.7,也没有与控制达到 0.8,无自动划掉,也无重复。如果它有 alpha,最可能来自日度层面的量价不对称:下行放量的成分被反转(流动性提供)、上行放量的成分带动延续。'
R:
  - head: 'day_max(cross_corr(Amt, Ret, 60))'
    soundness: 4
    reasons: 'R 只评合理度。8 个变体都是同一机制(峰值的量价耦合)的替换:窗口 90/120/180/240 是对 60 日窗口噪声的修正,机制清楚;day_quantile_q75、day_mean、day_std 把 max 的收拢换成对分钟剖面更稳健的统计,max 对单分钟噪声敏感,逻辑说得通。算子核对:cross_corr 窗口 240 需约一年热身,train 从 2018 起可满足;day_quantile_q75 需要解析器把它认作 day_quantile 的 q=0.75(dt_day.py 中 day_quantile(x, q)),若不认则该变体跑不了,属于流水线问题,不是数学问题。variant 7 把 Amt 换成 Volume,与原 head 的日度秩 |ρ| 为 0.72,规则上会走替换而不是新收录,这是预期内的,不挡。PI 引用的 120 窗口分数 -0.42 未在本次审计中复核,只按机制判断。若这些变体有 alpha,最可能来自窗口拉长后慢量价耦合的信噪比提升,而不是峰值本身。'
summary: '两个任务位均通过(a: E 位划掉 6 个种子,剩 8 个,核心与控制 |ρ| 均 < 0.8;b: N 位无划掉,剩 12 个,创新度 4、合理度 4),R 组 day_max(cross_corr(Amt,Ret,60)) 的 8 个变体合理度 4 保留;审计只用了 train/valid 段的相关度表与快照 heads,未读 2026 年数据。'
