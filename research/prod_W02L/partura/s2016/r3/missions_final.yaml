- type: E
  core: day_hurst(Low)
  hypothesis: 机制。核心 day_hurst(Low) = 当天约 241 根分钟 Low 价格序列的 R/S Hurst 指数(累计偏离均值的极差
    / 标准差,取 log 再除以 log 241):衡量当日价格路径是单边漂移的趋势日(值高)还是围绕均值来回震荡(值低)。它是尺度无关的日内形状量(价格水平与波动大小被
    S 除掉),不含成交额,也不含价格水平的排序信息。本流证据(只用 train/valid):R 拆解里 pow_2(ts_max(day_hurst(Low),30))
    把窗口 30 改 60 得 score +0.10(train +0.10 / valid +0.30),ts_max(day_hurst(Vwap),50)
    换 Close 为 -0.03(train -0.03 / valid +0.17),是本种子全部评分里最接近 0 的几条;说明慢窗口的 hurst 极值带有一点信息,短窗口被噪声吃掉。解释:一只票在近
    60~120 日内出现过的趋势日,代表机构拆单持续推动(知情资金逐步推进)留下的日内足迹,而不是散户的来回震荡;这是 Kyle 式价格冲击 / 订单流持续性(Barclay-Warner
    隐形交易、Chordia-Subrahmanyam 订单流自相关)的日内形状版本。本轮外围不再只用 ts_max 取极值,而是五类很不同的处理:(1) 慢均值
    / EMA / 上四分位 / 分位数(cross_mean、cross_ema、cross_tail_mean_q75、cross_quantile),把极值换成稳健的趋势日倾向;(2)
    相对自己的历史(cross_zscore、20 日减 241 日),近期趋势日异常增多;(3) 与价格新闻耦合(与日收益的 60 日相关 / 回归斜率、乘当日收益符号),趋势日方向是否与收益同向,把
    hurst 变成有方向的持续性;(4) 路径不对称(Low 的 hurst 减 High 的 hurst),下沿路径比上沿路径更趋势意味着低点被持续抬高(被动吸筹)还是持续压低;(5)
    去掉别的来源与分段(对 60 日波动回归残差、市值十分位内标准化、新上市最低 10% 筛子、与成交量上涨占比相乘)。与库里不同:库里 day_hurst 全部只出现在
    ts_max / pow_2 / cross_med 极值链里,两个库 5583 条表达式里没有 cross_zscore / cross_ema / cross_tail_mean_*
    / cs_bucket_* / cs_last_* / ListAge / LogFloatCap,也没有 day_hurst 与收益的耦合或 Low-High
    差;骨架不同,日度秩也应与库 head 的极值读数明显不同(平均而不是极值,方向耦合)。样本外还会在的理由:读数来自日内形状而非价格水平,不受后复权价格序累计收益的吸收;窗口
    60~241 日,日换手低,15bp 成本不是主要损耗;与两个 Amt 水平族冠军不同源。数学检查:无前视(只用当日分钟,t+1 交易);day_hurst
    在 S<1e-9(全天价平,如一字板)时返回缺失而不是 inf,这些票当天缺失;种子里唯一的除法是 div(cross_max(H,60), cross_mean(day_hurst(Close),60)),分母是
    hurst 的均值(量级 0.3~1,不近零);cross_corr 在窗口内一方不变时缺失;不使用 ts_rank / cross_rank / in_rank_rolling,nanrank_last
    陷阱不涉及;窗口 ≤ 241,热身期不主导。风险:hurst 与日内波动 / 反转有共线(种子 10 用回归残差对冲);一字板多的票读数缺失。
