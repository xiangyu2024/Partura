slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      创新度 4。16 个种子与三个 head 的日度秩 |ρ| 最大 0.18(种子 15 对 abs_(核心)),残差后最大 0.30(种子 2 对 sub(day_kurt(Ret), 核心));与五个控制的 |ρ| 最大 0.46(种子 15 对波动控制),无一 ≥ 0.5,自动划掉门槛(head 0.7、控制 0.8)全部没有触发。库内复核:16 个种子的骨架都不在 5583 条库骨架中;外围算子集合与库里 10 条含精确核心 day_quantile_q25(Open) 的候选都不同;cs_last_* / cs_bucket_* / cross_semistd_* / day_signed_ratio / LogFloatCap 在库中出现 0 次。不给 5 分:Y 族(RSJ、MAX、半方差差)属于尾部与波动不对称度量,库里 day_kurt(Ret) 出现 21 次;真正新的是价格带筛子。

      合理度 4。算子逐个核对:cs_last_low10(y, x) 把 x 最低 10% 的整块推到最底,cs_last_high05 把最高 5% 推到最底;cs_regres 是 Y 对 X 的截面 OLS 残差;cs_bucket_zscore 按 x 的十分位分桶;cross_semistd_neg 是对数日变化的下行半偏差,与提议一致。无前视(只用 t 日分钟与 t-1 收盘)。RSJ 的分母为 Σr² 且分子有界;半方差差分母为 0 时得 NaN 而不是爆点。nanrank_last 陷阱不涉及(没有 ts_rank / cross_rank / in_rank_rolling;cs_rank 对无效值返回 NaN,已读源码)。核心对每个控制的 |ρ| 为 0.46 / 0.01 / 0.07 / 0.42 / 0.43,满足 E 位的 < 0.8 要求。

      需要记下、但不构成数学问题的两点:(i) 奖励在训练期内选方向(partura/steer.py,本位未 pin),方向为 -1 时被筛掉的极端价格票会被推到多头书最前面,所以筛子只在 +1 胜出时起作用;(ii) 同一价格表达式在库内旧尺子下训练期净夏普为 +0.53(members.csv 行 4046,换手 0.0136 与笔记一致),在残差尺子下为 -1.61,说明两尾亏损来自残差化;PI 应检查它是否为对控制的多项式(三次)残差化造成的伪影。另外笔记写核心纯多头书 valid 为 -2.38,loc 表里同一书(abs_ 对正价格是恒等)为 -2.42,以 loc 为准。PI 预测「MAX 与波动控制 |ρ| 0.6~0.8 可能被划掉」没有出现(实测 0.41~0.46)。

      划掉:无。种子 1 与 16、4 与 15 只差一个符号,但在价格带内分别对应不同的书(-RSJ 与 +RSJ、-MAX 与 +MAX),奖励各自取较好的方向,不是重复。

      如果它有 alpha,最可能来自:价格带作为持有人结构的状态变量(低价与高价股上的彩票需求不同),在中间价格带里按负偏度或低 MAX 选股的溢价。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [11]
    reasons: |-
      创新度 4。N 位的整个族在库里不存在:day_signed_ratio、day_wmean、day_topw_mean、cross_tail_mean_*、cs_bucket_*、cross_ema、cross_zscore、LogFloatShares / LogFloatCap 的出现次数均为 0(复核)。保留的 15 个种子骨架都不在库中。与三个 head 的日度秩 |ρ| 最大 0.18(种子 16 对 abs_(核心)),残差后最大 0.10。对控制:多数 ≤ 0.42;种子 7、8(20 日均值与 120 日水平的对比)与 20 日反转 |ρ| 为 0.54 / 0.55,按表注属于「控制变量换个写法」,但只占 15 个里的 2 个,残差化会去掉其反转部分,不足以把整个位判为同一个东西。不给 5 分:资金加权的执行习惯与成交额或流动性的水平通道有些重叠(种子 16 对流动性 0.41、对已知族 0.42)。

      合理度 4。算子核对:A - T 按代数化简近似为「成交额权重与价格侧符号的协方差 / 平均成交额」(Close 日内变化小,T 近似分钟份额),与笔记一致;cross_zscore 的分母是 120 日标准差加 EPS,A 逐位不变时为 0;cross_tail_mean_q25 是 60 日窗口内 25% 分位阈值以下的均值;day_signed_ratio 分母为 0 只在停牌(得 NaN)。无前视:锚取当日首根开盘、前收或当日中位价,都是 t 日收盘前可知的量。nanrank_last 陷阱不涉及。

      划掉:11 号 cross_mean(day_signed_ratio(sub(Close, day_first(Open)), Volume), 120)。它与 1 号 cross_mean(day_signed_ratio(sub(Close, day_first(Open)), Amt), 60) 的骨架相同(抽掉字段与窗口后完全一致,已复核),且把成交额权重换成股数权重,偏离了位的「资金接受度」想法。属于重复,符合 §3。其余不划:12 号(路径效率)与 16 号(放量分钟收益减全天均值)不是资金接受度的直接读数,但笔记把它们列为同类对照,按放行原则保留。

      风险(不构成挡的理由):一字涨跌停日 Close 等于锚,A = T = 0,涨停多的票被拉向中间(笔记风险 2,属于解释性混淆,不是数学问题);开盘锚受集合竞价棒支配(风险 3)。笔记称「每日不同值个数与股票数相同」,库内复核的 distinct 比例为 8 号 0.995、13 号 0.978、14 与 15 号 0.999,略有并列,影响很小。

      如果它有 alpha,最可能来自:执行习惯与持有人结构造成的成交额持续落在锚上方或下方(订单失衡,Chordia 与 Subrahmanyam 2004 式),且变化慢(窗口 ≥ 20 日)。
R:
  - head: 'cross_reg_tvalue(day_quantile_q25(Open), day_kurt(Volume), 30)'
    soundness: 3
    reasons: |-
      只评合理度,给 3。变体 1 cross_corr(day_quantile_q25(Open), day_kurt(Volume), 30) 与原 head 秩恒等:简单 OLS(有截距)的斜率 t = r·sqrt((n-2)/(1-r²)),对固定窗口是 r 的严格增函数;库内复核原始 |ρ| 为 1.00、残差 0.99。所以它的分数必然与原 head 相同,「换成有界的相关系数」对排序毫无作用,过不了「+0.1」门槛,应删。t 值对两个参数对称,笔记里「回归元是价格水平 / 被回归量是 kurt」的区分不影响分数。变体 2 至 5(day_gini、日收益)确实改变统计量,并针对杠杆与非平稳,机制清楚;变体 2 与原 head 的原始 |ρ| 为 0.43,若分数高于原 head 0.1 以上,按规则收录为新 head。扣到 3 而不是 4,因为这一组里有一个恒等变体,且「有界」的理由在它身上站不住。如果它有 alpha,最可能来自价格与成交分布的同步关系本身,而不是少数尖峰日的杠杆。
  - head: 'sub(day_kurt(Ret), day_quantile_q25(Open))'
    soundness: 4
    reasons: |-
      只评合理度,给 4。机制与 head 定义一致:head 2 方向为 +1,day_kurt(Ret) 以 +1 进入,而笔记给出的单独最优方向是 -1;价格项以 -1 进入,与它自己的最优方向一致。拖累来自 kurt 项的符号与量级,变体 1(两边各取稳健 z 后相减)、变体 2(kurt 取负的 30 日均值,价格取偏离中心的距离)、变体 3(屏障版)都针对这一点。变体 1 与 head 3 的原始 |ρ| 为 0.68、残差 0.84,即稳健 z 之后价格项仍占约一半权重(两个近似独立分量等权时的 |ρ| 约 0.71),这是等权化的预期结果,不是缺陷;但笔记说的「去掉价格支配」应理解为「把价格权重降到一半」。复核:day_kurt 为 m4 / var² - 3,除法无保护,但峰度对尺度不变,上界约为分钟数(241),近零方差不会爆点,笔记「分母有界」的说法可接受。如果它有 alpha,最可能来自尾部彩票需求溢价,在符号修正之后显现。
  - head: 'abs_(day_quantile_q25(Open))'
    soundness: 4
    reasons: |-
      只评合理度,给 4。abs_ 对正价格是恒等,所以这个 head 就是价格水平的单调读法。四个变体都是非单调的「离中心距离取负」,与 head 3 的原始 |ρ| 为 0.03、0.05、0.07(变体 4 与 head 2 为 0.32)。变体 4 的中心取秩 0.45 是任意常数,没有数据依据,但它只是一个变体;它与规模控制的 |ρ| 为 0.42,会被残差化削掉一部分。机制清楚:直接检验「两头亏、中间好」是否为真;若中心版残差仍在 -2 附近,说明形状是控制暴露的伪影。笔记把核心纯多头书的 valid 写成 -2.38,loc 表里同一书为 -2.42,以 loc 为准。如果它有 alpha,最可能来自价格中段相对两端的持有人结构差异。
summary: '两个任务位都过(创新 4、合理 4);E 位无种子划掉;N 位划掉 11 号(与 1 号骨架重复),剩 15 个;R 组 head 1 的变体 1 与原 head 秩恒等,合理度 3,其余两组 4;没有任何数学问题触发挡位。'
