  hypothesis: '机制:资金加权的价格接受度(money-weighted price acceptance)。

    批里的现象(B046):整批里唯一接近随机基准的成员是耦合型 cross_reg_tvalue(day_quantile_q25(Open), day_kurt(Volume),
    30),−1.30(train −1.27 / valid −1.30);它的两个部件单独分别是 −2.38 与 −4.93,把 Open 换 Close、Volume
    换 Amt、窗口换 15 或 60 日,分数都在 −1.2 ~ −1.5。也就是说分数不在字段上,也不在价格水平或峰度本身(那两样要么被控制吸收,要么单边亏损),而在「价格路径与成交行为是否同步」这件事上。但这个耦合是在
    30 个日度点上做 OLS t 值:回归元是非平稳的价格水平、被回归量重尾,估计很吵,t 值又被少数尖峰日的杠杆支配。

    我把同一类对象搬到日内分钟轴上去估:每天 241 根分钟棒,成交额落在价格路径的哪一边。

    定义(day_signed_ratio(x, y) = Σ|y|·sign(x) / Σ|y|,有界 [−1, 1]):

    A = day_signed_ratio(Close − 锚, Amt) = 成交额落在锚上方的份额 − 落在锚下方的份额;锚取当日首根开盘价 day_first(Open)、昨日收盘价
    cross_delay(day_last(Close), 1)、当日分钟收盘价中位数 day_median(Close)。

    T = 同样的量但用 Close 当权重(Close 在一天内几乎不变,所以近似于分钟数的份额,即时间加权)。

    A − T = 「钱比时间更偏向锚上方多少」,近似等于分钟成交额(按日均值归一)与价格位置 sign(Close − 锚) 的日内协方差。价格走高时自然有更多分钟在锚上方,这一项被
    T 减掉;留下的是成交强度是否更集中在锚上方,就是 head 里「价格 × 成交行为」耦合的无尺度版本,而且每天用约 240 个点估,不是 30 个。

    另外两个同类读数:VWAP 与 TWAP 的相对价差 (day_wmean(Close, Amt) − day_mean(Close)) / day_mean(Close);放量分钟(成交额最大的
    10% 分钟)的平均收益减全天分钟平均收益 day_topw_mean(Ret, Amt) − day_mean(Ret)。

    算子怎样实现(16 个种子分五组):(a) 20~120 日聚合 cross_mean / cross_ema(慢,换手低);(b) A − T 的差(去路径形状);(c)
    相对自己历史的异常 cross_zscore(cross_mean(·, 20), 120) 与短减长;(d) 日轴尾部均值 cross_tail_mean_q25
    / q75(「最极端的卖方接受日 / 买方接受日」的平均强度,而不是平均水平);(e) 与日收益的 60 日相关 cross_corr(A, 日收益)(资金接受度与价格走向是否一致,不一致
    = 压力被吸收),以及在 LogFloatShares / LogFloatCap 十分位内标准化 cs_bucket_zscore(去掉与股本结构的共线)。另有路径效率
    day_signed_ratio(Ret, Ret) = Σ r / Σ |r|(净变动 ÷ 总路径,Kaufman 效率比的符号版)作时间加权对照。

    为什么有 alpha:机构与被动资金的大单分批执行,价格冲击是渐进吸收的(Kyle 型),订单失衡对后续收益有预测力(Chordia 与 Subrahmanyam
    2004)。成交额一贯落在锚上方、而价格并未一次反映,意味着持续的买方压力在吸收供给;反过来,散户追涨在高位放量则是反转来源。符号交给奖励按 train 选。这是慢变的持有人结构
    / 执行习惯,不依赖某一段行情。

    为什么和库里已有的不同:库里 Amt 都是「水平 / 尺度」量(day_cov(Amt, ·)、cross_max 链、ts_std(day_close(Amt))),被流动性控制与已知成交额族吃掉;这里
    Amt 只当权重,输出是有界份额,不含成交额水平,与这两个控制的 |ρ| 应当很低。5583 条表达式里 day_signed_ratio、day_wmean、day_topw_mean、cross_tail_mean_*、cross_zscore、cross_ema、cs_bucket_*、LogFloatShares
    的出现次数全是 0,16 个种子的整树骨架逐个对照过 5583 条骨架,没有重复。与上一波的 head 家族(成交额时间重心 day_centroid(Amt)、开盘棒
    × 隔夜跳空耦合、尾盘最后 30 分钟占比)也不同:它们读「成交发生在一天里的什么时间」,这里读「成交发生在价格的什么位置」。与 20 日反转控制:A 与当日涨跌同向,控制只去掉对
    20 日收益秩的线性 / 平方 / 立方暴露,A − T、分桶、与日收益相关这几类进一步去掉路径形状。

    为什么样本外还会在:来源是执行习惯与持有人结构,变化慢;窗口 ≥ 20 日、多数 60 日,秩在数周内稳定,成本低;批里耦合型成员 train 与 valid
    同分(−1.27 / −1.30),说明这一类同步性在两段里是同一回事。风险:(1) 与 20 日反转共线;(2) 一字板与涨跌停日 Close = 锚,A
    = 0 且 T = 0,这些日子被平均稀释,涨停多的票排在中间;(3) Amt 加权受开盘集合竞价棒的巨量支配,A 在开盘锚下可能主要读开盘棒;(4) 符号先验不明,靠奖励选。

    数学检查:无前视,只用 t 日分钟数据与 t−1 收盘价,t+1 才交易。day_signed_ratio 的分母 Σ|y| 为 0 只在停牌,此时得 NaN
    而不是无穷;输出有界,没有近零分母造成的爆点。VWAP−TWAP 价差的分母 day_mean(Close) 是价格水平,恒正。cross_zscore 的分母是窗口内标准差
    + EPS,A 在窗口内逐位不变时内核返回 0(已修),不爆。cross_corr 在窗口内某一方逐位不变时为 0 或空,不会无穷。所有窗口 ≤ 120 日,热身期不主导;在合成数据上
    16 个种子的面板覆盖率 95%~97%,每日不同值个数与股票数相同。'
