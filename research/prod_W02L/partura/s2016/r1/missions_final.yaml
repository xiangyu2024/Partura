  hypothesis: '机制:核心 day_quantile_q25(Open) 是当天分钟开盘价的 25% 分位,约等于名义股价水平。这一批给出的证据(拆解表与批内成员的训练期统计):

    (1) 核心单独做纯多头书:方向 −1、半衰期 5,train −1.61 / valid −2.38。批内成员 day_quantile_q25(Open)
    的训练期日换手只有 0.014,15 bp 成本一年不到 1 个点,所以这 −1.6 不是成本拖出来的。

    (2) 奖励按 train 在两个方向里取较好的那个,取定之后仍是 −1.61,所以另一个方向的 train 更差:价格对控制取残差之后,最高十分位与最低十分位都跑输等权基准,收益只能在中间带里。三个
    head(abs_、sub、回归元)都是把价格水平当连续的单调量读,读不出这种「两头亏、中间好」的形状。

    (3) Open 换 Close 同分(−2.38),所以是价格水平本身,不是某根分钟取样的噪声。

    结论:核心的信息不是「谁价格高」(分数),而是「价格带」(状态)。本位只把它当状态变量用,有三种用法:

    (a) 筛子 cs_last_low / cs_last_high:价格最低与最高的两端永远排到多头书之外,多头书只在中间带里按另一个慢信号 Y 选股。筛子的变量除了原价格,还有「价格对流通市值回归后的残差」cs_regres(cs_rank(核心),
    cs_rank(LogFloatCap))(同样市值下股价与股本结构异常的两端;因为 LogFloatCap − LogFloatShares = log
    价格,它近似是流通股本相对市值的极端值),以及再对已知成交额族 cross_mean(day_std(Amt), 30) 取残差的版本。这样筛子对准的是奖励真正量到的那部分价格信息(去掉市值与流动性之后的价格),而不是原始价格。

    (b) 分桶 cs_bucket_zscore / cs_bucket_demean:把 Y 放到名义价格十分位内标准化,去掉价格带对 Y 的整体平移。

    (c) 非单调:neg(abs_(价格到中心的距离)) 与 Y 用 cs_robust_z 做连续的加和(不用秩相加,避免秩和的大量并列)。

    Y 取三类「彩票型 / 尾部风险」属性,全部慢(窗口 20~60 日)、无尺度:

    (i) 分钟已实现符号跳跃 RSJ = day_signed_ratio(Ret, pow_2(Ret)) = Σ r²·sign(r) / Σ r² =
    (上行半方差 − 下行半方差) / 总方差,有界 [−1, 1];40~60 日均值取负,即买负偏、卖正偏(Amaya 等 2015 的方向);

    (ii) 20 日日收益最大值 MAX 取负(Bali 等 2011);

    (iii) 日收益下行半标准差与上行半标准差的归一化差 (SD⁻ − SD⁺) / (SD⁻ + SD⁺),60 日,有界。

    方向按文献先验写成「越大越想买」;MAX 与 RSJ 各放一个反向种子(第 15、16 个)做对冲。筛子的方向不会被奖励翻转:奖励按 train 取较好的符号,筛子起作用时
    +1 优于 −1(−1 会把被筛掉的票放到多头书最前面)。

    为什么价格带要和这类属性放在一起:Kumar(2009)指出彩票型偏好集中在低价、小盘、高偏度的股票,不同名义价格带的持有人结构不同,所以同一个 Y 的溢价在各价格带里不可比;分桶
    / 筛子把「价格带的持有人结构」与「彩票溢价」分开。另外低价票一个 tick 占价格的 0.3%~1%,分钟收益被 tick 离散化,RSJ 与分钟峰度类统计被机械地拉平;价格十分位内标准化把这部分扣掉。

    为什么和库里已有的不同:(1) 两个库 5583 条表达式里,cs_last_*、cs_bucket_*、cross_semistd_*、day_signed_ratio、cross_ema
    / cross_zscore、日频叶子 LogFloatCap 的出现次数全是 0(我统计了 members.csv 的骨架),所以这里的外围算子集合与以前看到的完全不同;16
    个种子的整树骨架逐个对照过 5583 条骨架,没有重复。(2) 快照三个 head 里价格只作「被排序的分数」,这里价格只出现在筛子 / 分桶的第二个参数,输出的排序由
    Y 决定;与三个 head 的日度秩 |ρ| 预计很低(< 0.3)。(3) 与控制:Y 对波动与 20 日反转有暴露(MAX 型预计与波动控制 |ρ| 0.6~0.8,可能被表里划掉几个),新尺子去掉的只是对这些控制秩的线性
    / 平方 / 立方暴露,RSJ 与半标准差归一差是有界比值,与波动水平相关较弱。

    为什么样本外还会在:(1) 价格带两端亏损在 train 与 valid 同向且 valid 更重(−1.61 / −2.38),不是某一段行情;(2) 名义价格带与持有人结构相关(散户彩票需求、1
    元面值退市规则下的低价票、高价次新与小股本高价票),是慢变的结构;(3) 筛子变量是价格的日内分位,日换手 1.4%,Y 窗口 ≥ 20 日,15 bp 成本吃不掉。风险:(a)
    筛子被市值控制的三次项吸收一部分;(b) Y 的方向先验可能错,已用反向种子对冲;(c) 彩票型属性与波动控制共线,残差可能很小;(d) MAX 在涨停处饱和(主板
    10% / 创业板科创板 20%),部分变成「板块与涨停事件」的指示。

    数学检查:无前视,全部只用 t 日收盘前的分钟数据与 t−1 收盘价,t+1 才交易。RSJ 的分母 Σ r² 为 0 只在全天无波动 / 停牌,此时得 NaN
    而不是无穷,且分子的绝对值不超过分母,有界。半标准差归一差的分母 SD⁻ + SD⁺ 为 0 只在窗口内价格不变,此时分子也为 0,得 NaN。MAX 的分母是前一日收盘价(正数),停牌后第一天前收为空得
    NaN。cs_last_* 的带按整块并列划分,名义价格是连续量几乎无并列;cs_bucket_zscore 的桶内标准差为 0 只在桶内 Y 全相等,最低成员数
    2。所有窗口 ≤ 60 日,热身期不主导;面板覆盖率在合成数据上 95%~97%,每日不同值个数与股票数相同。'
