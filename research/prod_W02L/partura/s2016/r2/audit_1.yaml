slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      创新度 4。核心 T = sub(day_topw_mean(Ret, Amt), day_mean(Ret)) 与快照 6 个 head 的日度秩 |ρ| 最大 0.04(残差后 0.01);与 5 个控制的 |ρ| 为 流动性 0.04 / 波动 0.04 / 20 日反转 0.17 / 已知族 0.04 / 市值 0.04。库 5583 条里 day_topw_mean 出现 0 次(我 grep 核对,与笔记一致)。16 个种子对 head 的最大 |ρ| 为 0.41(种子 5,cross_ema(T,60)),对控制的最大为 0.64(种子 13,与 20 日反转)、0.62(种子 4,与 20 日反转)、0.52(种子 10,波动)、0.51(种子 5,波动),均未过 0.7 / 0.8 的自动划线。种子 4、13 的 20 日均值会带着同期价格趋势,所以与反转相关高;残差化去掉控制部分后,剩下的读数不是反转的换皮,不划。不给 5:外围用的都是 cross_mean / cross_ema / cs_last / cs_bucket 这类已有算子,真正新的是核心 T。

      合理度 4。逐个算子核对:day_topw_mean 取当日 |Amt| 的 90% 分位以上(含并列)的分钟、平均其 Ret;day_mean 是全日分钟平均 Ret;两者同为逐分钟收益量纲,相减没有量纲问题。无前视(只用 t 日分钟与 t−1 收盘,t+1 交易)。没有 ts_rank / cross_rank / in_rank_rolling,nanrank_last 陷阱不涉及;cs_rank 是截面秩。窗口 ≤ 241 日,热身约一年、不主导。两点 PI 应核对(都不是挡的理由):(i) 种子 1 的 EPS 1e-4 是按合成立方体定的,真实数据上 T 的截面标准差若远小于 1e-4,比值会退化为均值排序;(ii) 种子 15 的分母 cross_mean(day_std(Ret),60) 写成「恒正」并不严格成立(若某票 60 日每天分钟收益都恰为 0,分母为 0),这是极少见的情形。

      需要 PI 核对的一点:V2 网格第 0 根是 09:30 集合竞价棒(AlphaCube 的 V2 约定;合成数据把该棒成交量乘 3,见 synthetic.py 的 auction bar)。真实数据上它的成交额是否常进前 10%,我没有核对。若进,T 的 24 根里会有一根是开盘撮合的分钟收益。它只占 1/24,不改判断,但「大额订单足迹」的解释需要去掉第 0 根的对照(in_slice(Ret, 1, 240) 版本的 T)才能成立。

      如果它有 alpha,最可能来自:知情 / 机构大额成交的方向在 60–120 日里的慢变持续(Barclay–Warner、Chakravarty、Campbell 等的机制),而不是某一段行情的产物。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [12]
    reasons: |-
      创新度 4。日内(INTRA)与隔夜(GAP)拆分的拉锯 / 耦合 / 符号乘积在库里没有:库中同时含 day_first(Open) 与 cross_delay(day_last(Close)) 的表达式只有 11 条(我 grep 数到,笔记写 17)。最接近的是 L972 cross_mean(GAP,20)、L973 cross_stddev(GAP,20) 与 L1146 cross_corr(GAP, 后半日比值, 20),都不是 INTRA / GAP 的拆分。cross_zscore、cross_tail_mean_*、cross_ema、cs_bucket_*、cs_last_*、ListAge、LogFloatCap、day_wmean、day_signed_ratio 在库里都是 0 次(核对)。16 个种子用规范化骨架对照库 5583 条(与库骨架列的一致率约 94%,是近似不是精确复现),无一命中;种子之间骨架互不相同。对快照 head 的最大 |ρ| 为 0.39(种子 1),残差后最大 0.34(种子 12,下文划掉)。对控制:种子 9 与 20 日反转 |ρ| 0.78,是本位里最接近 0.8 自动划线的一条,未触发。我不划它:它是 cross_zscore(cross_mean(INTRA,20),241),全程收益 = INTRA + 隔夜,与 20 日反转高相关主要来自 INTRA 的份额;残差化去掉 rev 之后剩下的是「−隔夜」那一侧,也就是拉锯的另一半,不是反转的换皮。种子 7、15 与波动控制 |ρ| 0.44、0.40 属于常见的水平关联。不给 5:大部分种子是同一个 X = cross_mean(INTRA−GAP,120) 加截面筛子,拆分本身是新的,但种子的外围多是已有算子。

      合理度 4。逐个算子核对:INTRA = day_last(Close)/day_first(Open) − 1、GAP = day_first(Open)/cross_delay(day_last(Close),1) − 1,都是日级、同量纲、只用 t 日收盘前的数据,t+1 交易,无前视。种子 1、2、3、5、7、8、10、11、16 量纲一致;分母守卫(种子 2 的 + 1e-3、种子 15 的 |GAP| + 5e-3)防近零。种子 4 与 14 的 cross_regbeta(x, y, d) 斜率分母是第一个参数 x 的 120 日方差(种子 4 的 x 是 INTRA,种子 14 的 x 是符号比),而不是 PI 数学检查里写的 GAP 方差;rolling_ols 对方差 ≤ 1e-9 给缺失,有守卫、不会无穷。这是描述错误,不是数学问题。种子 6 的 in_slice(Ret, 211, 240) 是最后 30 根分钟,不含第 0 根。种子 13、14 的成交额权重里有 09:30 撮合棒,但它只占全日成交额的一小部分,不改变读数。

      种子 12 划掉的理由(数学问题:量纲不一致):cross_ema(sub(day_wmean(Ret, Amt), GAP), 60) 里 day_wmean(Ret, Amt) 是逐分钟收益的成交额加权平均,量级约 1e-4(笔记自己也称它为分钟收益),GAP 是全日跳空,量级约 1e-2。两者相减几乎就是 −GAP,EMA 之后得到的是 −EMA60(跳空),而不是它声称的「日内收益减跳空」的拉锯。式子系统性地算的不是它的标签所写的量,按 §3 作为数学问题划掉。若要保留,需把日内收益换成全日累计(如 day_last(Close)/day_first(Open) − 1),并作为新种子提交。

      机制:隔夜跳空(散户关注度 / 集合竞价追涨)与日内修正(机构吸收)之间的拉锯,在 60–241 日的慢变结构里有文献支撑(Lou–Polk–Skouras 2019、Berkman 等 2012、Aboody 等 2018);窗口长、换手低,15 bp 成本不是主要损耗。风险(笔记已列,我同意):与 20 日反转共线(种子 9);一字板日 INTRA = 0、GAP = 限幅;开盘集合竞价噪声。

      如果它有 alpha,最可能来自:隔夜与日内收益在 60–241 日里的慢变耦合(投资者结构与集合竞价的系统差异),而不是某一段行情的水平。
R:
  - head: 'cross_reg_tvalue(day_quantile_q25(Open), day_kurt(Volume), 30)'
    soundness: 4
    reasons: |-
      只评合理度,给 4。机制清楚:把非平稳的价格水平换成日收益与成交分布的有界读数,统计量统一用 cross_corr,与第 1 轮 R 的结论一致。逐个核对:v1 day_centroid(Amt)、v2 day_signed_ratio(Ret, Amt)、v3 day_gini(Amt)、v7 cross_corr(跳空, day_gini(Amt), 60)、v9 day_wstd(Ret, Amt)、v10 day_flat_ratio(Close) 都是有界量,无数学问题。

      问题与核对:
      (1) v6 cross_corr(日收益, sub(day_topw_mean(Ret,Amt), day_mean(Ret)), 120) 与 E 位种子 11 cross_corr(T, 日收益, 120) 是同一个表达式(只是 cross_corr 的两个参数对调;相关度表两行数字完全相同),本轮会重复评估一次。建议删掉这一变体。
      (2) v4、v5 的 day_es_ratio_hi / lo(Ret) 分母是分钟收益的 95% / 5% 分位,守卫只排除 |分位| < 1e-8。对分钟收益的最小价位跳动而言,1e-8 不是「近零」,单日尾部均值相对分位可以达到几十倍;60 日 Pearson 相关对单日爆点敏感。所以笔记里「分母不含近零量」对这两个变体不成立。这不构成数学问题(输出有界,不支配截面),但评估后应检查它们的分数是否来自少数几天。
      (3) v1、v2、v3、v9 的 Amt 权重与 v1 的重心会把 09:30 集合竞价棒计入(它在 t=0 处),份额通常不大,不改判断。
      (4) 第 1 轮 R 的结果 cross_reg_tvalue(日收益, day_gini(Volume), 60) = −0.84 与 cross_corr(日收益, day_gini(Amt), 60) = −0.885,与原 head 的 |ρ| 0.22 / 0.21、与已知族 |ρ| 0.23 / 0.23,分数比原 head 高 0.42 ~ 0.46(≥ 0.1)。按 §2,这两条应当进入替换或收录的判定,但 R_prev.json 与 loc.md 记为 0 个替换、0 个收录。这是记账问题,PI 应核对,不影响本轮打分。

      如果它有 alpha,最可能来自:价格与成交分布的同步关系本身(成交集中在哪些分钟、收益如何分布的慢变耦合),而不是少数尖峰日的杠杆。
  - head: 'sub(day_kurt(Ret), day_quantile_q25(Open))'
    soundness: 4
    reasons: |-
      只评合理度,给 4。去掉价格水平项是对的:head 的分数 −2.35 几乎等于价格单独的 −2.38,价格项支配了差式;两个变体都只留峰度。v1 neg(cross_mean(day_kurt(Ret), 30)) 与 v2 neg(cross_mean(cs_rank(day_kurt(Ret)), 60)) 的机制清楚(峰度大 = 少数分钟跳动、其余平)。day_kurt 对 n 个点的总体峰度 m4/m2² 上界为 n,减 3 后有界,笔记「上界约为分钟数」成立。cs_rank 是截面秩,无问题。

      问题与核对:
      (1) 峰度对「少数分钟跳动、其余为平」敏感,这正是冻结 / 稀薄盘口的样子。neg(kurt) 可能主要是冻结度的代理。相关度表里 v1、v2 与市值控制 |ρ| 为 0.40、0.45(低于 0.5,不构成控制换皮)。PI 应说明它与 day_flat_ratio 的关系;奖励里的 untradable 掩码(scripts/w02l_score.py)会去掉冻结度最高的一段票,那部分收益不计。
      (2) 与原 head 的原始 |ρ| 为 0.12(v1)、0.11(v2),与库中 head 无共线。

      如果它有 alpha,最可能来自:低峰度(分钟收益分布平、少跳动)的票在截面上是否有溢价,且这种溢价不是冻结 / 稀薄盘口的代理。
