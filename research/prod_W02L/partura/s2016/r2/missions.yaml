  - type: N
    hypothesis: |-
      机制:把每只股票每天的收益拆成两段 —— 隔夜(昨收 → 今开)GAP = day_first(Open) / 昨日收盘 − 1,与日内(今开 → 今收)INTRA = day_last(Close) / day_first(Open) − 1 —— 再看这两段在 60 ~ 241 日里的慢变关系。A 股个人投资者占成交的大头、T+1,隔夜价格变动主要由消息与关注度(散户情绪、开盘集合竞价追涨)定价,日内则更多是机构 / 套利资金的吸收与修正。文献的共同点是两段收益的信息含量不同、各自有持续性:Lou-Polk-Skouras 2019(隔夜与日内预期收益的拉锯)、Berkman 等 2012(开盘买入的关注度成本)、Aboody 等 2018(隔夜收益与公司层面的投资者情绪,隔夜偏高后续反转)、Hendershott-Livdan-Rösch 2020。奖励的 20 日反转控制只看加总收益,不区分两段,所以这一拆分是日频价格里还没被控制吸掉的一块。16 个种子是同一拆分的不同读法:
      (1) 拉锯差:INTRA − GAP 的 120 日均值(种子 1)与它的稳定性 均值 /(标准差 + 1e-3)(2);
      (2) 反应函数(跳空之后日内是顺势还是回吐):INTRA 与 GAP 的 120 日相关(3)与回归斜率(4)、INTRA 乘 GAP 符号的 60 日均值(5)、尾盘 30 分钟收益与 GAP 的相关(6)、成交额加权的日内分钟收益与 GAP 的相关(13)、成交额加权的价格位置(day_signed_ratio)对 GAP 的斜率(14);
      (3) 尾部:日内最差四分之一日子的均值(7)、最大四分之一的隔夜跳空均值(8)(追高的跳空与日内吃回);
      (4) 相对自己的历史:近 20 日日内均值相对 241 日分布的 z 值(9)、成交额加权日内收益减跳空的 EMA(12)、日内除以(|跳空| + 0.5%)的 60 日均值(15);
      (5) 分段与卫生:新上市(ListAge 最低 10%)排到最后(10)、市值十分位内标准化(11)、名义股价(LogFloatCap − LogFloatShares)最低 10% / 最高 5% 排到最后(16)。奖励按训练段选符号,筛子的方向由此决定(+1 排除、−1 只在这一带里交易),两种读法都会被覆盖。

      证据(本流,train / valid):B046 / B047 是后复权价格与成交额的水平一族,给出的结论是「水平读法一律为负,只有两个量的耦合接近随机」—— 耦合 cross_reg_tvalue(价格分位, 成交量峰度, 30)为 −1.30,而它的两个部件单独为 −2.38 / −4.93;第 1 轮 R 把价格水平换成日收益后升到 −0.84 ~ −0.89。第 1 轮 N 位里最好的几条都是「慢的、有界的、分钟分布统计」(−0.71),其中 241 日窗口版本 valid(−0.31 ~ −0.61)好于 train(−1.14)。教训:放弃水平,去读两段动态的拆分与耦合。

      为什么和库里已有的不同:两个库 5583 条里含「今开 / 昨收」跳空的只有 17 条(都是 ts_delay 写法、并与秩 / 乘积混在一起),没有一条把日内与隔夜拆开做差 / 耦合 / 符号乘积;cross_zscore、cross_tail_mean_*、cross_ema、cs_bucket_*、cs_last_*、ListAge、LogFloatCap、day_wmean、day_signed_ratio 在库里出现 0 次。16 个种子的整树骨架逐个对照过 5583 条骨架,也与第 1 轮种子逐个对照,无一重复,种子之间骨架也互不相同。与快照 6 个 head(价格 / 成交额水平的幂与倒数)无共同子树。与 5 个控制:GAP 与 INTRA 是收益量纲,与 20 日反转可能有一定共线(预计 |ρ| 0.2 ~ 0.4),与流动性 / 市值 / 成交额族关系弱。

      为什么样本外还会在:隔夜 vs 日内是 A 股投资者结构(散户主导、T+1、集合竞价)的结构性差异,不是某一段行情的产物;窗口 60 ~ 241 日,日换手很低,15 bp 成本不是主要损耗;读数不含价格 / 成交额的水平。风险:(a) 与 20 日反转共线,残差很小;(b) 一字涨跌停日 GAP = ±限幅、INTRA = 0,涨停多的票读数被拉向「隔夜很高、日内为 0」;(c) 开盘价是集合竞价价格,GAP 含开盘一根棒内的噪声;(d) 斜率类(4、14)在 GAP 方差很小的窗口里会放大噪声。

      数学检查:无前视 —— GAP 用的是昨日收盘(cross_delay(·, 1)),INTRA 用当日首根开盘与最后收盘,全部在 t 日收盘前已知,t+1 才交易。价格是后复权序列:GAP 用同一序列的 Open(t) 与 Close(t−1),后复权在除权日连续,所以比值是真实的跳空,不是除权造成的假跳空。分母:day_first(Open)、昨日收盘都是正价格;种子 2 的分母 cross_stddev + 1e-3、种子 15 的分母 |GAP| + 5e-3 防近零;斜率 4 / 14 的分母是 GAP 的 120 日方差,只在窗口内跳空逐位不变(停牌是缺失、不是 0)时才为 0,得缺失而不是无穷。没有用 ts_rank / cross_rank / in_rank_rolling,nanrank_last 陷阱不涉及。窗口 ≤ 241 日,热身期不主导。已在合成立方体上把 16 个种子都跑过:覆盖率 96 ~ 97%,每日不同值个数接近股票数,没有 inf。
