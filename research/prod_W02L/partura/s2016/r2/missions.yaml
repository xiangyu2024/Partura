  - type: E
    core: 'sub(day_topw_mean(Ret, Amt), day_mean(Ret))'
    hypothesis: |-
      机制。核心 T = sub(day_topw_mean(Ret, Amt), day_mean(Ret)):当天成交额最大的 10% 分钟(约 24 根)的平均分钟收益,减全天所有分钟的平均分钟收益。成交额集中的分钟是大额订单(机构、知情资金)留下的足迹(Barclay-Warner 1993「中等规模交易承载价格影响」、Chakravarty 2001、Campbell-Ramadorai-Schwartz 2009:大额成交预示后续收益)。T > 0 = 钱最重的那几分钟比普通分钟更偏多。单日 T 噪声很大、日度换手极高(本流 R 的经验:单日量纲的统计量在 15 bp 成本下净夏普 −3 ~ −5),所以只可能在「慢变的持续性」里有 alpha;本位固定核心 T,只在外围把它变成慢、稳、无尺度的读数。

      本流证据(只用 train / valid):(i) 快照里含 T 的 7 个候选均值 −1.96,不含的 −2.69(差 +0.73,p 0.054);(ii) 第 1 轮 N 位最好的两条之一是 cross_corr(cross_mean(T, 60), 日收益, 60),score −0.71(train −0.71 / valid −0.70),两段几乎同分(它与已知族的相关度这里没有读数);它没进 head,但在那一位里是两段最均衡的一条。这说明 T 的慢读法有结构,但那一条的外围(先 60 日平均再与日收益耦合)只是其中一种。本轮预期「持续性 / 相对自己的历史」比「水平」好,没有把握的部分用多种外围去试。

      外围五类(16 个种子都原样含 T;每个种子的整树骨架都对照过两个库 5583 条骨架,也与第 1 轮种子的骨架逐个对照过,没有重复,种子之间骨架也互不相同):
      1. 持续性而非水平:均值 /(标准差 + 1e-4)(种子 1)= 大额分钟的方向是否稳定的 t 值;窗口内最大值 cross_max(2)= 最强的一次知情买入;下四分位均值 cross_tail_mean_q25(3)= 最差的那些天里大额分钟是否仍偏多。
      2. 相对自己的历史:cross_zscore(20 日均值, 241 日)(4)、cross_ema(T, 60)(5)、短(20 日)减长(241 日)(13)—— 近期出现的异常大额偏向。
      3. 去掉别的来源:对 60 日平均日收益做截面回归取残差(6)(T 的慢均值与中期动量共线,而奖励的控制里只有 20 日反转);除以分钟波动率的 60 日均值(15)(无尺度,波动大的票不再占便宜);先取截面秩再平均(14)(个别极端日不支配)。
      4. 与价格新闻的耦合(反应函数):T 与当日收益(11)、与隔夜跳空(12)的 120 日相关;T 乘当日方向的符号(10)= 大额分钟是顺着当天走势(跟风)还是逆着(逆势吸筹)。
      5. 分段与卫生:新上市(ListAge 最低 10%,7);名义股价的最低 10% 与最高 5%(8;这里的名义价格 = LogFloatCap − LogFloatShares = 对数名义价格,不是后复权价格);冻结盘口(分钟价平占比最高的 10%,16);市值十分位内标准化(9)。cs_last_* 是「分段开关」:奖励按训练段选符号,+1 时被选中的一带被排除,−1 时反而只在这一带里交易,两种读法都会被覆盖,所以我不预设方向。

      为什么和库里已有的不同:day_topw_mean、cross_zscore、cross_tail_mean_*、cross_ema、cs_last_*、cs_bucket_*、ListAge、LogFloatCap 在两个库 5583 条表达式里出现 0 次(统计过 members.csv);快照 6 个 head 都是价格或成交额的水平(后复权开盘 / 收盘价的分位、成交额的幂与倒数),与 T 没有共同子树。T 里成交额只被用来「选分钟」,不进入读数的量纲,所以读数是收益量纲的差,与流动性 / 市值 / 成交额水平一族不同源,预计与这些控制的 |ρ| 低(< 0.3);与 20 日反转可能有些共线,种子 6、13 对冲。

      为什么样本外还会在:(a) 大额分钟的方向偏置是资金结构(机构 vs 散户)的慢变特征,不是某一段行情的产物;(b) 读数全部取 60 ~ 241 日窗口,日换手低,15 bp 成本不是主要损耗;(c) 不含任何价格或成交额的水平,与两个冠军(Amt 水平一族)不同源。风险:T 与 20 日反转 / 日内动量共线(6、13 对冲);一字涨跌停日分钟收益全 0,T = 0,多涨停的票读数被拉向中间;阈值是当天 Amt 的 90% 分位,零成交分钟多时入选的分钟数偏离 24 根。

      数学检查:无前视,全部只用 t 日收盘前的分钟数据与 t−1 收盘价,t+1 才交易。T 本身没有除法(两个均值之差);种子 1 的分母 cross_stddev(T) 加了 1e-4(在合成立方体上不加会出现 ±inf,已修),种子 15 的分母是分钟波动率的 60 日均值(恒正);种子 11、12 的 cross_corr 在窗口内一方逐位不变时为 0 / 缺失,不会无穷。没有用 ts_rank / cross_rank / in_rank_rolling,nanrank_last 陷阱不涉及。窗口全部 ≤ 241 日,热身期不主导。已在合成立方体上把 16 个种子都跑过:覆盖率 96 ~ 97%,每日不同值个数接近股票数(无大面积并列,也没有 inf)。
