    why: |-
      烂的部件有两个:(1) 回归元是后复权价格水平(day_quantile_q25(Open) 的截面序 ≈ 自基期以来的累计收益,窗口内是趋势,非平稳);(2) 被回归量 day_kurt(Volume) 重尾,少数尖峰日有高杠杆。依据:拆解表里两个部件单独分别 −2.38 / −4.93,耦合 −1.30;第 1 轮 R 把价格水平换成日收益之后,cross_reg_tvalue(日收益, day_gini(Volume), 60) = −0.84、cross_corr(日收益, day_gini(Amt), 60) = −0.89,比原 head 好 0.4 ~ 0.5、与已知族 |ρ| ≤ 0.23、与原 head |ρ| 约 0.2,说明耦合形式是对的,烂的是价格水平那一半。本轮继续换第二个部件:把重尾的峰度换成有界、无尺度的分钟分布读数 —— 成交额重心 day_centroid(Amt)、成交额加权符号占比 day_signed_ratio(Ret, Amt)、日收益率的右 / 左尾形状 day_es_ratio_hi / lo、大额分钟倾向 T、成交额加权波动 day_wstd、冻结盘口占比 day_flat_ratio;新闻变量取日收益 / 隔夜跳空 / 日内收益;一个变体只改窗口(120 日)。统计量统一用 cross_corr(有界,不再用与它秩等价的 t 值 / 斜率);分母不含近零量,窗口 60 或 120。
