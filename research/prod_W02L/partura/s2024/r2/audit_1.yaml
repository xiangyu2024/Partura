R:
  - head: 'ts_stddev(day_q_stat_std(div(in_slice(Volume, 11, 230), in_sum(in_slice(Volume, 11, 230)))), 15)'
    soundness: 4
    reasons: '5 个变体只改窗口(45、60)、加 EMA(20)、做变异系数(分母 cross_mean(core,30))、分桶(LogFloatCap)。数学检查:分母 cross_mean 是 Ljung-Box 累计 Q 的截面均值,不是零附近量;Q 统计量在白噪声下有抽样下限(约 20 个滞后的 chi-square 型累计和),不会压到 0,所以 div 不会因为近零分母爆点;ts_stddev 对常数窗口返回 0,不爆;cross_ema 与 cs_bucket_zscore 没有前视。窗口拉长是 PI 从拆解里看到的单调趋势(7/15/30 日 -2.95/-1.78/-1.41),机制合理(节律的波动估计太噪、换手吃成本)。如果它有 alpha,最可能来自成交节律的慢变波动(同 slot a 的解释)。'
  - head: 'add(ts_stddev(day_q_stat_std(in_slice(Ret, 11, 230)), 15), ts_stddev(day_q_stat_std(div(in_slice(Volume, 11, 230), in_sum(in_slice(Volume, 11, 230)))), 15))'
    soundness: 3
    reasons: '5 个变体只保留 Ret 支并拉长窗口、加 EMA、分桶。数学没有问题:5 个变体都没有除法,ts_stddev 对常数窗口为 0,cross_ema 与 cs_bucket_zscore 对缺失值有保护。但机制说得不够清楚:分钟收益的 Ljung-Box Q 主要反映买卖价差反弹(bid-ask bounce)与抽样噪声,20 个滞后的累计 Q 在收益序列上绝大部分是噪声底座;PI 的依据是拆解里 Ret 支单独比整个和式好 0.45,这是经验证据,不是机制证据。按 §3 只挡数学问题,所以放行,但只给 3。如果它有 alpha,最可能来自流动性差的股票上的买卖价差反弹(与 liq 控制 0.17 的残差),而不是信息。'
