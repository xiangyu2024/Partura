    reasons: '核心 day_q_stat_std(div(in_slice(Volume,11,230), in_sum(...))) 是 ts_stddev(core,15) 的子树(corr_1.md slot a core 原始最大 |ρ| 0.511,与 5 个控制最大 0.455 即 liq,均 < 0.8,核心门槛通过)。自动划掉:种子 1(与 head |ρ| 0.735,liq 0.796)、3(0.760)、9(0.741)、10(0.899)、13(0.706),均 >= 0.7 的库禁令线。种子 8、16 的表写 废品(distinct 0.066 / 0.036,面板近似离散或近常数,ρ 与所有 head 与控制几乎都为 0 或只是量化噪声),按 §4 数值伪影划掉。剩 9 个种子(2,4,5,6,7,11,12,14,15),远高于 4 的下限。创新度给 3 而不是 4:核心已是 6 个 head 的共同底座,留下的种子大多只是对同一个 persistence 水平做 z 分数、变异系数、比值、EMA 的换写法;真正与 head 与控制都拉开的是种子 6(cross_corr 与 cs_mean,head 0.041)和 15(成交量与收益 Q 统计量的 60 日共动,head 0.236)。种子 2(cross_zscore 120,head 0.146)、5(CV,0.184)、14(比值,0.144)是自我归一化的新读法,但归一化之后仍是同一变量。合理度给 4:逐个算子核对,day_q_stat_std(dt_day.py:397)是 1..20 滞后 Ljung-Box 累计 Q 的标准差,分母 in_sum 为零时得 NaN 而非爆点;cross_argmax(种子 16)走 nanargmax_last 而不是 §4 的 nanrank_last,不踩 0 填充陷阱;cross_zscore、cs_bucket_zscore、cross_tail_mean 都是窗口算子,无前视;窗口 60-120 日与 EMA 半衰期合理。唯一需要留意的是种子 12(liq 0.717)与种子 11(liq 0.40,vol 0.40)的部分信号可能只是流动性的换皮,但未过 0.8 线,放行。如果它有 alpha,最可能来自机构拆单的持续节律(成交份额的自相关结构慢变、算法执行的股票属性),其次来自小票零成交分钟造成的节律差异(种子 2、14 的水平检验可分开两者)。'
