- type: N
  hypothesis: 机制:分钟收益分布的右尾 / 左尾形状是「彩票型偏好与散户参与度」的慢变股票属性(Bali-Cakici-Whitelaw 2011 的 MAX 效应;Barberis-Huang 2008 的累积前景理论:投资者为右偏的彩票型股票多付价格,于是其后续收益偏低)。我们有分钟数据,可以在一个节点里读出当天最极端那 5% 分钟的「超额程度」:day_es_ratio_hi(Ret) = 高于当日 95% 分位的分钟收益的均值 / 该分位(尺度已去掉,所以不是波动,也不是 skew 或 kurtosis 的矩估计,对单根异常分钟不敏感),day_es_ratio_lo 是左尾对应量;二者之差 = 日内右尾相对左尾更重,比值 = 相对尾部厚度。再用 cross_ema 做 30-40 日慢变平滑,得到「持续出现极端上冲分钟」的股票属性。第二组读法是价格路径的「卡住 / 离散」程度:day_at_max_ratio(High) 与 day_at_min_ratio(Low)(价格被钉在当日高点 / 低点的时间占比,涨停附近或尾盘拉抬时升高)、day_distinct_ratio(Close)(一天访问了多少个不同价位,低价股 / 一分钱最小变动价位粗糙,是价格水平与散户参与度的代理)、day_flat_run_max(Close)(最长不动连续段)、day_zero_ratio(Ret)(不动分钟的质量点)。分桶标准化(市值 / 上市年限)去掉这些量与规模、新股的任意形状关系。启发来源:M2 批的现象是把分钟序列的「形状」统计量(Ljung-Box Q 的标准差)变慢以后分数从 -2.95(7 日)升到 -1.41(30 日),M3 批是放量触发的冲击;这两批读的都是成交量与收益的自相关 / 持续性,而价格分布本身的尾部形状与卡住程度一条都没有被读过(本流前两轮的位 b 读的是放量时的收益与成交时点)。为什么库里没有:day_es_ratio_hi / lo、day_at_max_ratio、day_at_min_ratio、day_distinct_ratio、day_flat_run_max、day_zero_ratio、cross_ema 都是 ops_ext 后加的算子,库的 5583 条旧算子集里没有;与本流已出的 head(day_q_stat_std 节律、Q75 共动度、放量冲击、尾盘成交占比)读的是不同的对象(自相关 / 触发事件 / 成交占比 vs 价格分布的尾部与离散度)。为什么样本外还会在:彩票型偏好与散户参与度是持续的行为属性,在 A 股由散户主导的结构里不依赖某段行情;30-60 日平滑使名次慢变,成本不致吃光。可证伪:若尾部形状一族(种子 1-6、11-13)都很差而卡住 / 离散一族(7-10、14)好,说明有用的是路径粗糙度而不是尾部。数学检查:无前视(只用 t 日分钟数据与 t 日及以前的日值);day_es_ratio_hi / lo 在分位数接近 0 或没有分钟超过分位数时返回 NaN(算子文档:不是 1e4 爆点);day_es_ratio_hi 与 day_es_ratio_lo 的比值种子的分母只在 lo 有限时有定义且 |lo| >= 1,不近零;day_zero_ratio、day_flat_run_max 在一字板日接近 1,是有定义的占比不是爆点;cross_ema 在缺失日保留上一值的行为由算子文档处理;无 ts_spearman / nt_*,无 cross_shift / ts_shift / in_local_mean。
  inspired_by: M2 批的现象:分钟序列的形状统计量(day_q_stat_std)在窗口变慢后分数单调变好(7/15/30 日 = -2.95/-1.78/-1.41);M3 批的放量冲击与 M1 批的尾盘占比读的都是成交 / 收益的持续性,价格分布的尾部与离散度没有被读过。
