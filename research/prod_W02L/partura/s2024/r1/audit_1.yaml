    reasons: '核心 day_quantile_q75(Ret) 是三个 head 的共同子树;与五个控制的 |ρ| 为 0.14–0.36,未触 0.8 线。新颖度 3:各种子与最像的 head 的原始日度秩 |ρ| 为 0.05–0.30(多数 ≤0.18),但残差空间里与 head 1 或 head 2 的 |ρ| 为 0.34–0.47(种子 1、3、4、5、7、8、9、14、15),而奖励正是在残差上打分,所以重合是实的;它们又不是换写法:窗口 60–120 天、市场代理的权重、上下尾不对称、分桶标准化都是新构造,与 5 个控制的 |ρ| 最大 0.22,与已知族不超过 0.08。合理度 4:无前视;cross_corr 分母为 sqrt(varx·vary)+EPS(common.py 第 640 行),|corr| 有界,无爆点;cs_mean 忽略 NaN(nd_cs.py 第 107 行);cs_bucket_zscore、cross_zscore 有保护;没有 ts_rank / cross_rank / in_rank_rolling,nanrank_last 陷阱不触发;没有 ts_spearman 与 nt_*。需纠正的一处:笔记说 cs_mean(Q) 是「截面等权的市场序列」,并据此把 ts_pearson 的两两均值写成 cross_corr 的收缩,但恒等式 (N·corr·sd−1)/(N−1) 只对标准化序列的均值成立;cs_mean 对原始水平取平均,等价于按每只股票波动率加权的市场序列,收缩版是另一个量、只是近似。种子 14(精确的 ts_pearson(Q,20) 经 30 日 EMA)正是检验这一近似的对照。另一处对不上:cross_regbeta(x,y,d) 是 y 对 x 的回归(common.py 第 643 行起),种子 6 的排序等于 corr 乘以该股自身的 σ(Q),而表中它与 vol 控制的 |ρ| 只有 0.04,我无法从表中还原 vol 的定义,记给第 2 轮核对。划掉:无。种子 3 与 R 位 1 的变体 6 完全相同,但变体是直接评估,不算种子重复;种子 1 与 2 是同一统计量的 60 与 120 天版本,表中没有二者的相关,不能判为重复。若它有 alpha,最可能来自:(i) 分桶标准化后的共动度(种子 8、9、15、16),即去掉市值与上市年限非线性形状后的共动;(ii) 上下尾共动的不对称(种子 10、11、12),即下行共动溢价。'
