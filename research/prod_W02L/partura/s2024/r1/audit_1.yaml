    reasons: '结构新,y 不新。cs_flip_by_state 在 5583 条库里出现 0 次(members.csv 核对),W01 的 final.json 里只有 1 次(以市值差作状态)。14 个种子中 12 个是「y 乘以市场状态符号」(1–10、13、14):y 是 E 位同族的共动度(1–9)、成交量共动度(10)、ListAge(13)与 60 日共动度(14);11、12 是状态加权的两个秩的混合。新颖度只给 3,理由是表值不可信:corr_1 中翻转种子的原始 |ρ| 为 0.00–0.08,而流水线的日度秩相关 pair_rank_corr(diagnose.py 第 341 行)是有符号的日均值,翻转后每天的相关是 ±,两段行情相互抵消,表值会低估重合。我没有从脚本中确认相关度表用的就是这个函数;若是,ac_plugin.py 第 218–219 行的已知族拒绝 abs(nanmean(c)) ≥ 0.5 对翻转种子同样失效,建议用日度 |ρ| 的均值重算翻转种子后再 GP。自动划掉(|ρ| ≥ 0.7)对翻转种子也无法由本表验证。ListAge 族在 W01 中大量出现(final.json 里 ListAge 出现 42 次,多为 cs_first_* 的次序键),本表只覆盖快照 3 个 head,这一点本审计无法核对。合理度 4:无前视;g 全为日度常数;cs_flip_by_state 的状态按 t 日及以前 241 日的中位数判定,状态未定义时输出 NaN(ops_ext.py 第 562 行起);_pct_rank 与 cs_rank 对缺失输出 NaN,不触发 nanrank_last 陷阱;G1 的分母是 20 日个股波动的截面均值,远离 0。机制清楚:共动度的溢价依赖相关度状态(Pollet–Wilson 2010;Morck–Yeung–Yu 2000)。需要说明的风险:翻转是市场层面的择时,纯多头书带市场 beta,残差化只去截面控制,分数里可能混有市场择时;翻转日整个十分位换仓,换手集中。划掉:无(12 个翻转种子都不是数学问题,也不与库或其他种子重复)。若它有 alpha,最可能来自:状态条件下共动度的选股(种子 1、2、8)或尾部不对称按状态翻转(种子 4);其次是把市场趋势择时混进纯多头书(种子 6、14)。'
R:
  - head: 'sub(abs_(cs_scale(ts_pearson(day_quantile_q75(Ret), 5))), cross_argmax(cs_sum(cross_product(cross_stddev(day_var(High), 60), 60)), 5))'
    soundness: 4
    reasons: '右支 cross_argmax(cs_sum(...),5) 是逐日常数,截面排序里不起作用。左支 abs_(cs_scale(ts_pearson(Q,5))) 中 cs_scale 是按当日截面有符号和做除法(nd_cs.py 第 98 行),abs_ 之后等价于 |ts_pearson| 的截面秩,所以去掉 cs_scale 与右支不改变排序,与 PI 的消融一致。需注意的数值风险:右支的 cross_product 是 60 日连乘(nanproduct_last),其 cs_sum 可能溢出或下溢,使当日 head 无定义;取决于 dtype 与 High 的量纲,我未核对,但各变体都去掉了右支,不存在这个问题。变体都保留 abs_(与消融的 +0.52 一致),机制是共动强度(同步性),用更长窗口与平滑压换手,清楚。注意:变体 6 与 E 种子 3 完全相同;变体 3 与原 head 的残差 |ρ| 为 0.80,那是 R 替换判据,不是审计判据。无数学问题,合理度 4。若它有 alpha,最可能来自长窗口共动强度在截面上的排序,而不是 5 日估计的噪声。'
  - head: 'sub(abs_(cs_mean(ts_pearson(day_quantile_q75(Ret), 5))), day_last(Amt))'
    soundness: 3
    reasons: '左支 abs_(cs_mean(ts_pearson(Q,5))) 是逐日常数,整式的截面排序就是 -day_last(Amt),与 PI 的拆解一致。变体:(a) day_last(Amt) 除以 20 日日均成交额;(b) 40 日均最后一根成交量除以 40 日日均成交量;(c) 最后一根成交量的 60 日 z 分数;(d) 流通股本十分位内标准化。数学上没有问题:div 没有 EPS 保护(common.py 第 175 行直接 torch.divide),但分母是 20 或 40 日成交总量或额的均值,只在整段停牌时为 0,此时 day_last 为 NaN,分子也是 NaN;cross_zscore 有 sd 保护。机制说不清的地方:day_last 取的是最后一个非 NaN 的分钟(dt_day.py 第 134 行),不一定是收盘分钟;若无成交分钟在数据里是 NaN 而不是 0,冷门股读到的是最后一次成交的分钟,是交易时点的代理而不是尾盘行为;PI 自己的拆解也说信息只在水平上。变体 4 与流动性控制 |ρ| 为 0.53、与已知族为 0.57,几乎就是控制本身。机制(流动性溢价)清楚,但变体退化为流动性控制,给 3。若它有 alpha,最可能来自流动性溢价的尾端(冷门股),而不是尾盘行为。'
summary: '两个位都过线(位 a 创新 3、合理 4;位 b 创新 3、合理 4),无种子划掉;R 组合理度 4 与 3。交给 PI 的两点:位 b 的相关度表值被符号翻转抵消,新颖度与已知族 / 自动划掉的检验都不可信,应用日度 |ρ| 的均值重算;位 a 的收缩版与笔记的恒等式不等价(cs_mean 为 σ 加权),种子 14 是必要的对照。'
