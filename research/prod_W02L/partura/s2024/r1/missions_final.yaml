    再对这个标量序列取 5 日内的位置,对每只股票是同一个数,逐日排序里不起作用;拆解表里「去掉右支」(knockout)和「只留右支」(sufficiency)都是门槛废品,「只留左支」abs_(cs_scale(ts_pearson(Q,
    5))) 是 -2.35,比整个 head 的 -2.43 还好。(2) 窗口 5:5 个观测点估相关系数噪声太大,窗口 2 / 5 / 10 是 -2.15
    / -2.43 / -2.02,本批的 R 候选也是窗口 10(+0.41)与窗口 2(+0.28);原始换手 0.32(members.csv)说明成本把分数吃掉了,所以变体沿「更长窗口
    + 跨日平滑 + 廉价收缩」走:abs_ 保留(必要性 +0.52);cs_scale 在排序里无作用(去掉后 -0.08),但它给每天的截面除以当天截面和,一旦配上跨日平均就把「当天截面和近零的日子」放大,所以变体一律去掉
    cs_scale,只保留 abs_。变体都是把右支整个去掉后的左支:(a) 窗口 10 / 20 + 跨日均值 / EMA;(b) 在市值十分位内标准化;(c)
    把 N² 的 ts_pearson 换成对市场均值的相关(单因子收缩),作为同一信号的廉价版。分母:cross_corr 在窗口内序列为常数时得 0,没有近零分母,cross_mean
    / cross_ema 无分母;热身期最长 60 日。
