  hypothesis: '批里的现象(B070,11 条):其中 10 条的外层含左支 abs_(cs_mean(ts_pearson(day_quantile_q75(Ret),
    5))) 或 abs_(cs_scale(...)),这是「全市场当天的平均两两共动度」,对每只股票是同一个数,逐日截面排序把它整个丢掉。真正对排序起作用的只有右支:ts_pearson(day_quantile_q75(Ret),
    5),即每只股票的上四分位分钟收益序列和其余全部股票同一序列的 5 日滚动相关的均值(nd_ts.py 的 ts_pearson 对 j≠i 的 corr(i,j)
    取均值)。拆解表读法:单独 ts_pearson(Q, 5) -2.89(train -2.89 / valid -2.85);abs_(cs_scale(·))
    版 -2.35,拿掉 abs_ 退到 -2.95(必要性 +0.52),说明「共动强度的绝对值」比带符号的共动度好;窗口 2 / 5 / 10 是 -2.15
    / -2.43 / -2.02,没有单调结构。members.csv 里这批有实际排序内容的成员(1967 / 2019 / 2051)的原始(未平滑)换手
    0.32–0.44,说明主要问题是 5 个观测点估一个相关系数的噪声(独立序列的 5 点相关系数标准差约 0.5,而我估计股票之间持续的共动特征的离散度只有
    0.15–0.2),换手把成本吃光;我对库里这一批的读法是:共动度可能是一个慢变的股票属性,但 5 日窗口把它估成了噪声。

    机制:共动度(synchronicity,Morck–Yeung–Yu 2000)是一个持续性很强的股票属性:高共动 = 股价主要由市场 / 指数 / 资金面驱动(大票、指数与
    ETF 持仓、国家队持仓),低共动 = 价格里装的是公司特质信息或散户情绪(Jin–Myers 2006:R² 低的股票暴跌风险更高,信息不透明)。它既不是波动也不是流动性水平(是相关系数,无量纲),新尺子对
    5 个控制和两个冠军只去线性 / 平方 / 立方的排名暴露,留下的是「共动属性本身」以及它和尺寸、年龄的非线性交互,后者用分桶标准化(cs_bucket_zscore)去掉。本位只固定核心
    day_quantile_q75(Ret)(日内分钟收益的上四分位,比日收益更不受单个极端分钟影响,也不像日收益那样是 20 日反转控制的原料),外围全部重写成「便宜的收缩估计
    + 长窗口 + 平滑」。

    收缩(shrink)的做法:ts_pearson 是 O(N²d) 的,5220 只股票一天一个 5220×5220 的矩阵;但对每只股票 i 它等于 (N·corr(x_i,
    z̄)·sd(z̄) − 1)/(N−1),其中 z̄ 是全体股票标准化序列的均值,sd(z̄) 对同一天所有股票是同一个正数。所以按逐日截面排序,i 的「平均两两相关」与
    corr(x_i, z̄) 排序完全相同,而 z̄ 用 cs_mean(Q) 近似(截面等权的市场序列,单一因子收缩,Ledoit–Wolf 的做法)只需要
    O(N·d)。这样 cross_corr(Q, cs_mean(Q), d) 是 ts_pearson 的廉价版,窗口可以放到 60 / 120(ts_pearson
    的成本随窗口 d 线性增长,而且每天一个 5220×5220 的矩阵,长窗口放不起)。我保留一个精确版种子(第 14 个)用来核对「收缩版 ≈ 精确版」。

    算子怎样实现(每个种子原样带 day_quantile_q75(Ret)):(a) cross_corr(Q, cs_mean(Q), 60 / 120)
    是长窗口共动度;abs_(·) 是「共动强度」(对应 abs_ 的 +0.52),cross_ema 做 20→40 日半衰期的慢速平滑,换手低;(b) 短减长
    sub(corr_20, corr_120) 和 cross_zscore(corr_20, 120) 读「相对自己常态的脱钩」;(c) cross_regbeta(cs_mean(Q),
    Q, 120) 是对市场上四分位的 beta(带波动尺度,作对照);(d) 上下尾不对称:sub(corr(Q25 对 cs_mean(Q25)), corr(Q75
    对 cs_mean(Q75))) 读「下跌尾部比上涨尾部更同步」(Ang–Chen–Xing 2006 的下行风险溢价、Hong–Tu–Zhou 2007
    的不对称相关),cross_corr(Q, cs_mean(Q25), 60) 读自己的上涨是否发生在市场下跌时(逆周期 / 对冲型);(e) cross_tail_mean_q25
    / cross_stddev 读共动度的下尾和不稳定性;(f) cs_bucket_zscore(·, LogFloatCap / ListAge / LogFloatShares)
    在市值 / 上市年限 / 流通股本十分位内标准化,去掉共动度和规模的任意形状的关系。

    为什么和已有的不同:库里 ts_pearson 一共 49 条(B070 11 条,其余零散),cross_corr 里没有一条是「对 cs_mean 的相关」;5583
    条骨架里没有 cross_corr(·, cs_mean(·), d) 这一类,我用 skeleton_key 逐个对过,16 个种子都不在骨架库里。与三个
    head 比:它们都是 5 日窗口的原始值(head 2 就是 -ts_pearson(Q, 5),head 1 是它的绝对值,head 3 是 -day_last(Amt)
    的流动性);这里的长窗口把 5 日估计里的噪声平均掉,我估计与 head 2 的日度秩相关约 0.3–0.4(5 点估计的信噪比约 0.16,平方根量级),低于
    0.7 的禁令线。

    为什么样本外还会在:来源是股票共动属性的持续性(R² / synchronicity 的月度持续性很高),不依赖某一段行情;窗口 60–120 日加 EMA,名次在数周内几乎不变,15
    bp 成本下留得住。风险:(1) 共动度与市值强相关(大票同步),但这里用分桶标准化的种子检验非线性部分,线性 / 平方 / 立方部分已被尺子去掉;(2)
    本批原始读数都是负的,若共动度根本不带溢价,结果就是负,这是个可以被证伪的位。

    数学检查:无前视,全部只用 t 日收盘及以前的数据;cs_mean(Q) 是当天截面均值,与个股序列同一天对齐;cross_corr 在窗口内序列为常数时分母只剩
    EPS=1e-9,分子为 0,得 0 而不是爆点(底层 rolling_pair_reduce);Q 的量级约 1e-3,sqrt(var_x·var_y)
    约 1e-6(流动性差的股票约 1e-7),远大于 EPS=1e-9,没有近零分母;cross_regbeta 在市场序列方差小于 EPS 时返回 NaN,而
    60–120 日窗口内 var_x≈1e-4;窗口左侧补 NaN,前期用已有天数估计,最长回看 140 日(cross_zscore 的 20+120),scorer
    另有 lead-in 行预热,不主导;无 ts_spearman / nt_* 算子。'
