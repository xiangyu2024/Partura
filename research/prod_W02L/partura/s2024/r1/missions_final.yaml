- type: N
  hypothesis: '机制:相关度状态(correlation regime)决定「同一个持有特征」的溢价符号,把它写进表达式里。批里 11 条中 10 条的外层含左支
    abs_(cs_mean(ts_pearson(day_quantile_q75(Ret), 5))) 或 abs_(cs_scale(...)),它是「全市场当天的平均两两共动度」,对全体股票是同一个数,在逐日截面排序下被整个丢掉(这批里有
    5 条整式对每只股票每天都是同一个数,只剩并列次序即股票列序,原始 rank IC 0.010–0.013、换手 0.011–0.014,那是交易所与板块的并列效应,不是信号)。GP
    在这批里反复造出这一支,说明「平均相关度」这个量有用武之地,但 sub(常数, x) 的文法用不上它:一个逐日常数只有当它作为权重或开关,去调节两个截面信号的权重或符号,才进得了排序。库里没有这样的表达式:5583
    条里 cs_flip_by_state / cs_state_rank 一次都没有出现(W01 的 head 里只有 1 条用过 cs_flip_by_state,而且是用市值差作状态)。

    理论依据:平均两两相关是有信息的市场状态,Pollet–Wilson(2010)的平均相关预测市场收益,Driessen–Maenhout–Vilkov(2009)有相关性风险溢价;在高相关状态(宏观
    / 流动性驱动、压力期),个股收益主要被共同因子决定,与共同因子同步的股票(指数、ETF、国家队持仓,易被机构换手)和脱钩的股票(特质信息、散户情绪)的相对表现与低相关状态(信息驱动、选股时期)不同(Morck–Yeung–Yu
    2000:低共动股票的价格里装的是更多特质信息)。所以我把「共动度」这个持有特征乘上「相关度状态」的符号。尺子是逐日残差,对 5 个控制和两个冠军的暴露在每个截面上都被去掉,不能靠翻转控制本身得分,所以被翻转的
    y 必须是控制之外的特征:共动度、上下尾不对称、成交量共动度(Chordia–Roll–Subrahmanyam 2000 的流动性共同性,对数 z 分数,无量纲)、上市年限
    ListAge(次新股是风险偏好的指标,风险偏好高时跑赢)。

    状态怎么算(cheap,不用 N² 的 ts_pearson):G1 = div(cross_stddev(cs_mean(Q), 20), cs_mean(cross_stddev(Q,
    20))) 是「市场序列波动 / 个股平均波动」,在等相关模型下约等于平均两两相关的平方根(σ_m² ≈ σ̄²(1/N + ρ̄)),等价于隐含相关度指数的做法;G2
    = cs_mean(cross_corr(Q, cs_mean(Q), 20)) 是各股与市场的平均相关;G3 就是这批里原来的常数 cs_mean(ts_pearson(Q,
    5))(只留一个种子做对照,N² 贵);下尾版(用 Q25)是「下跌时的平均相关」。市场趋势状态用 cross_mean(cs_mean(day_sum(Ret)),
    20 / 60)(Cooper–Gutierrez–Hameed 2004 的市场状态)作对照。cs_flip_by_state(y, g) 在 g 的截面均值(这里就是
    g 本身)高于它过去 241 天的中位数时取 +rank(y),否则取 -rank(y)(ops_ext.py 里的定义);cs_state_rank(g,
    120) 取 g 在过去 120 天内的分位数,作为两个信号的连续权重。

    种子(共 14 个):(1)–(3) 共动度 corr(Q, cs_mean(Q), 60) 按三个相关度状态翻转;(4) 上下尾共动不对称按 G1 翻转;(5)
    自己上涨对市场下跌的相关(逆周期型)按 G1 翻转;(6) 与 (1) 同,状态换成市场 20 日趋势;(7) 下尾平均相关作状态、120 日共动度;(8)
    先 EMA 平滑的共动度按 G1 翻转(换手更低);(9) 市值分桶标准化的共动度按 G1 翻转;(10) 成交量共动度按 G1 翻转;(11)(12) 用
    cs_state_rank 做连续权重混合两个不同特征(不是翻转;如果与翻转结果相似,说明是状态在起作用而不是权重形状);(13) ListAge 按 G1
    翻转(次新股 / 老股的轮动);(14) 状态换成 60 日市场趋势。

    为什么和已有的不同:与三个 head 比,它们的内容是 ts_pearson(Q, 5) 的共动度本身或 -day_last(Amt) 的流动性,这里用的是「状态
    × 特征」的交互;与库比,没有 cs_flip_by_state / cs_state_rank / cross_corr(·, cs_mean(·), d)
    的骨架,14 个种子的骨架我都用 skeleton_key 与 5583 条的骨架集核对过,没有重复;与控制比,y 是共动度、尾部不对称、成交量共动度这类相关系数,与流动性
    / 波动 / 反转 / 市值的水平无关。

    为什么样本外还会在:来源是「风险偏好 / 相关度状态」的持续性(平均相关度的月度自相关很高),状态一个月内最多翻几次,翻转之间持有的名次是慢变的(60–120
    日窗口 + EMA 的共动度);ruler 的半衰期 20 日 EMA 会把翻转处的换手抹平。风险:(1) 翻转处整本书从顶部十分位换到底部十分位,成本在翻转日集中;若状态在中位数附近来回,换手会很大,这是个可以被证伪的位;(2)
    若共动度在两个状态下溢价同号,翻转版会比不翻转差,拆解会直接读出来(cs_flip_by_state 文档里写明了这一点)。

    数学检查:无前视,状态用到的是 t 日及以前的数据,cs_flip_by_state 的中位数窗口是过去 241 天,cs_state_rank 的分位数窗口是过去
    120 天,都是因果的;状态当天缺失(g 全缺)时输出 NaN 而不是静默的低状态;窗口左侧补 NaN,前期的分位数用已有天数估计,scorer 另有 lead-in
    行预热,热身期不主导;G1 的分母 cs_mean(cross_stddev(Q, 20)) 是 5000 只股票个股波动的均值,不会近零;cross_corr
    的分母只在窗口内序列为常数时是 EPS 的量级,此时分子也为 0,得 0;成交量共动度用 cross_zscore(day_sum(Volume), 60)(不取对数,0
    成交量不会产生 -inf);没有 ts_spearman / nt_* 算子。'
