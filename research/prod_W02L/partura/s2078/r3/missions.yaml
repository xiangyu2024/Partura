    hypothesis: 'Core = the 30-day change in the share of minutes whose volume equals the previous minute (day_flat_ratio of Volume = fraction of a "frozen tape"), taken from the batch-1/2 enrichment table (+1.35, p<0.001, 24 candidates; subtree of a head-adjacent family). It is a CHANGE (event) of tape freezing, not the level: the level is a liquidity/size proxy that the controls remove, the change measures a stock suddenly becoming more or less actively traded (attention / liquidity regime shift). Rounds 1-2 used the core only inside cross_mean(div(...)/(day_max-day_min)) price-range ratios (scores -0.6 to -0.8) and the sibling leaf day_flat_run_max; nothing has put this core under temporal-extreme, own-history-normalised, return-interaction, or size-screen peripheries. Peripheries here, each a different mechanism: (a) cross_mean 10 / ts_max 20 = persistent vs worst recent deterioration of liquidity (MAX-style); (b) divide by own 60-day mean flat ratio = relative regime shift, scale-free across names; (c) mul with 5-day mean return = price moves that come with a drying-up tape are not confirmed and revert (pure-long book takes the opposite side: stocks whose tape just became MORE continuous after a rally); (d) ts_regbeta / ts_corr of return on the core = how much returns load on liquidity regime shifts; (e) cs_last_low05/10 size screens with LogFloatCap (not LogTotalCap, which is what earlier wrappers used) = lexicographic cut so the signal operates inside the small-cap segment where zero-volume streaks occur; (f) difference with the Amt-based flat ratio change isolates share-count vs money flattening. Out-of-sample persistence: thin, intermittent trading is structural in A-shares and regime shifts in trading continuity (new listing lock-up expiry, suspension returns, attention spikes) recur every year; the reward strips the liquidity level so what remains is the dynamics.'
