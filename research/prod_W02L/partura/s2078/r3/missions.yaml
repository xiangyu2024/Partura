    hypothesis: 'Intraday lead-lag and serial dependence of minute returns and volume, built only from within-day correlations of time-shifted slices (scale-free, no level of volume or volatility). Per day: (1) day_ar1_coefficient(Ret) = minute-return autocorrelation, positive for trending / information-driven tape (gradual incorporation, institutional slicing) and negative for bid-ask-bounce / retail noise tape; (2) correlation of today minute return with the previous minute volume, day_corr(in_slice(Ret,2,240), in_slice(Volume,1,239)): does volume predict the next price move (informed flow) -- slices are aligned correctly (239 columns each, past volume vs later return, no look-ahead, no in_shift fill); (3) the reverse, volume reacting to the previous minute return (momentum-chasing volume, retail attention); (4) the difference of (2) and (3) = who leads, price or volume. All averaged over 20 days with cross_mean to make it a stock trait, optionally minus a 60-day average (change in behaviour) or day_durbin_watson. Mechanism: stocks whose volume leads price are ones where informed traders act first and prices adjust slowly; stocks whose volume chases price are attention-driven and reverse. Different from library: none of the batch heads or the 304 scored candidates use shifted-slice day_corr, ar1 or Durbin-Watson of minute returns; the heads use day_cov(Open,Ret), day_cov(Amt,Vwap), day_skew(Volume) (same-minute, level-sensitive). A correlation is bounded and invariant to rescaling Ret or Volume, so liquidity, volatility and size controls cannot absorb it linearly; it also does not equal the 20-day reversal because it is an intraday-structure statistic. Why it should persist OOS: A-share microstructure (T+1, retail dominance, price limits that slow incorporation) is structural; intraday autocorrelation and lead-lag are stable stock traits across years.'
