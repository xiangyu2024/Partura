attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [1, 2, 3, 5, 8, 9, 12]
    reasons: '核心 ts_max(cs_demean(div(day_mean(Ret), 2)), 30) 是快照 head pow_1_5(ts_max(...)) 的子树(pow_1_5 在这里几乎单调,核心与 head 的 |ρ| = 1.00 是设计使然,按规则不计为创新度低)。核心对 5 个控制的 |ρ| 为 liq 0.45、vol 0.64、rev 0.22、known 0.49、size 0.00,均 < 0.8,通过 E 位的控制门槛。划掉的种子:1(与 head 0.86)、2(与 head 0.92)、3(与 head 0.99)、5(与 head pow_05(cs_normalize(day_mean(Volume))) 0.83)、8(与 head 0.97)、9(与 head 0.74),这六个按 |ρ| ≥ 0.7 自动划掉;12 与 vol 控制 |ρ| 0.96 ≥ 0.8,自动划掉。剩 4、6、7、10、11 共 5 个,≥ 4,通过。每个种子都原样含核心,没有 ts_spearman / nt_* / cross_shift / ts_shift 等禁用或前视算子,cross_delay 是因果的。创新度 4:剩下的外围是 MAX 与 day_skew 的乘积(4)、MAX 相对 30 日前的变化(6)、MAX 与 day_corr(Ret,Volume) 的乘积(7)、MAX 减去上涨分钟占比的标准化(10)、MAX 与 flat_ratio 的乘积(11),残差后与 head 的 |ρ| 为 0.29 至 0.54,不是单调换皮;库里三个 head 都没有把 MAX 与偏度、量价确认、变化量或平盘占比组合起来。合理度 4:MAX / 彩票需求效应有文献与 A 股散户结构的基础;每个算子都按定义实现(dt_day.py 的 day_skew 用 z 的三次方均值,day_corr 与 day_flat_ratio 的定义见 ops_ext.py 与 dt_day.py:231-245)。两处 §4 伪影,不挡:(i) 种子 7 的 day_corr 在某一方当天为常数(一字板,Ret 不变)时返回 0 而非缺失,会把频繁锁板的涨停票的乘积拉到 0,这恰好是 MAX 彩票信号最集中的票,但只在这类票上显著,不是主导;(ii) 种子 4 的 day_skew 量级远大于 ts_max,乘积的排序基本由 skew 决定,这是解释上的问题,不是数学问题。另外提醒一件事:机制写的是「低 MAX 一侧做多」,相对 head 的 +1 方向应当是 -1 侧;计划书没有声明方向。head 在 +1 方向的分数为 -1.54(拆解中把窗口改成 60 日会把分数从 -1.54 提到 -0.46),与机制方向一致,请 GP 评估时确认方向。如果它有 alpha,最可能来自:低 MAX(彩票需求弱)的票在残差之后的超额收益,来源是 A 股散户彩票偏好的结构性定价,尤其体现在 MAX 与成交量确认、偏度的交互上。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [2, 3, 4, 11]
    reasons: '本批 3 个 head 分别是成交量水平(pow_05(cs_normalize(day_mean(Volume))))、Amt-Vwap 协方差(pow_2(day_cov(Amt,Vwap)))和 MAX 族(pow_1_5(ts_max(...)))。N 位改用 day_centroid(时点)、day_gini(集中度)、day_ar1_coefficient(持续性)这类与水平无关的形状算子。残差后与三个 head 的 |ρ| 为 0.04 至 0.30(种子 9 为 0.04、1 为 0.08、5 为 0.13、8 为 0.17、12 为 0.22、6/7/10 为 0.28 至 0.30),说明这是另一类信息,创新度 4。划掉的种子:2(与 liq 控制 0.82 ≥ 0.8,自动划掉)、3(与 head pow_05(cs_normalize(day_mean(Volume))) 0.84,自动划掉)、4(与该 head 0.72,且 liq 0.86,自动划掉)、11(与该 head 0.92,自动划掉)。剩 1、5、6、7、8、9、10、12 共 8 个,≥ 4,通过。种子 10(cross_mean(day_ar1_coefficient(Volume),20))与 liq 0.77、known 0.78 很接近,持续性部分混入了流动性与已知族,但未到 0.8,不划掉,也不判为同一东西。合理度 4:逐个算子核对,day_centroid 在 [0,1] 上按 |x| 加权取时点(dt_day 的 ops_ext.py:155),day_gini 对 |x| 的 Gini 有界(ops_ext.py:136),day_ar1_coefficient 的方差门槛 1e-8 对 Volume 不会误触发;无前视、无禁用算子。两处 §4 伪影,不挡:种子 7 的 day_corr(Volume, abs(Ret)) 在锁板日(abs(Ret) 常数)返回 0 而非缺失,只在锁板票上显著,不是主导;种子 8 的分母 day_gini(Amt) 只有在每分钟成交额完全相等时才为 0(会得 inf),真实数据中几乎不会出现,不是主导。机制说得通:尾盘或成块集中的成交是耐心的大资金,价格冲击逐步被定价(正向漂移);早盘均匀铺开的成交更像散户追涨,会均值回归。这是形状量而不是流动性伪装。如果它有 alpha,最可能来自成交时点分布(centroid)与成交集中度(gini)在截面上的差异,即机构与散户交易节奏的结构性区别。'
R:
  - head: 'pow_1_5(ts_max(cs_demean(div(day_mean(Ret), 2)), 30))'
    soundness: 4
    reasons: '六个 R 变体的机制与 head 相同:MAX 彩票效应需要更长的窗口。拆解中窗口 30 到 60 的 +1.08 有依据,所以窗口延长、去掉 pow_1_5、60 日区间与 60 日波动比都是可以接受的改写,没有数学问题,合理度 4。注意三点,都不挡:(a) pow_1_5 在这里几乎是恒等的,30 日 cs_demean 日均收益的最大值几乎不会全部为负,计划书里说 pow_1_5「只保留一部分截面」言过其实;相关度表中变体 1 与变体 3 的每一列数值完全相同(0.75 / 0.61 / 0.40 / 0.56 / 0.07 / 0.42 / 0.07),是同一个信号的两种写法,建议合并成一个。(b) 变体 6 的分母 cross_mean(day_std(Ret),60) 只有在一只票 60 天都锁死时才近零,会产生 §4 的爆点,但只在极少数票上,不是主导。(c) 120 日窗口(变体 4)会吃掉训练段开头约半年的热身期,不是主导。'
summary: 'slot a(E,核心为快照 head 的子树)与 slot b(N,日内量的形状算子)都通过:创新度均为 4、合理度均为 4;划掉后 a 剩 5 个种子、b 剩 8 个;R 组合理度 4,但变体 1 与 3 数值重复。这是本流的第一个通过的 N 位。'
