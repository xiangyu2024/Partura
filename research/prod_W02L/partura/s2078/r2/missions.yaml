  - type: N
    hypothesis: 'Persistent closing strength and price-path shape of the intraday tape, built from price fields only (no volume level, so not the liquidity control and not the volume-shape family tried in round 1). Per day: close relative to the day mean price (div(day_last(Close), day_mean(Close))), close location in the day range ((last - min)/(max - min)), and the share of minutes pinned at the day high versus the day low (day_at_max_ratio / day_at_min_ratio of Close). All are ratios of prices on the same day, so the back-adjusted price level cancels. Averaged over 20 days with cross_mean they measure a stock trait: does the stock habitually close strong (late-day accumulation by patient institutional buyers, which is gradually incorporated) or habitually fade into the close (retail chasing the open then selling off). Differences between the 20-day and 60-day averages measure a change in that behaviour. Mechanism: end-of-day aggressive buying is information-driven in A-shares because the closing call auction lets informed participants trade at the reference price, while intraday spikes pinned at the high are retail / limit-board attention that reverses. It is orthogonal to the 20-day reversal control (a return) because it is the shape of the path, not its end-to-end change, and to volatility because every term is a ratio. None of the six batch heads reads a price path shape: they use High mean, volume skew and covariance. Inspired by the enriched day_quantile_q75(Close) (+1.28, p 0.005) and day_last(Close) subtrees, which say the intraday Close distribution carries something, while the heads that contain them mostly wrap raw levels.'
    inspired_by: 'Batch 1 and 2 enrichment: day_quantile_q75(Close) (+1.28, p 0.005, 7 candidates) and the observation that High-based heads (ts_regbeta of day_quantile(High)) have train +0.34 at window 60, i.e. the intraday price distribution has structure that is not yet written as a scale-free shape ratio.'
    seeds:
