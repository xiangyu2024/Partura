    hypothesis: 'Core = the longest run of consecutive minutes with identical volume, as a share of the day (a scale-free "the tape stopped" statistic: zero-volume streaks in thin, neglected, or locked names). In batch 1 it is the strongest enriched leaf (mean score gap +1.80, p<0.001, 8 candidates) and the only enriched subtree that is not a return-MAX rewrite; round 1 spent its E slot on the ts_max(return) core and its N slot only touched the core inside cs_last_low05 (train +0.35, valid -0.24). No round has yet put the raw core under temporal operators. The reward removes the liquidity, volatility and size controls, so only the part of stale-tape that is NOT a level of liquidity can score. Peripheries tried here are all different mechanisms: (a) slow averaging (cross_mean 20) = persistent inattention as a stock trait; (b) surprise versus own 60-day history (sub / div with cross_mean) = an unusual freeze today, which is an event rather than a trait and is nearly orthogonal to cross-sectional liquidity; (c) ts_max over 20-30 days = worst recent freeze (MAX-style, mirrors the return-MAX that scored best in this batch); (d) lexicographic size screens cs_last_low05/10 with LogFloatCap instead of LogTotalCap, and screens applied after smoothing, which is a different segment cut than the cs_last_low05(...,LogTotalCap) already seen; (e) interaction with recent return (mul with cross_mean(day_mean(Ret),5)) and a rolling beta of returns on freeze length: do recent winners that traded in a thin tape reverse (price moves on no volume are not confirmed). Mechanism for persistence out of sample: thin / frozen trading is structural in A-shares (small caps, ST-like names, suspended-resumed names) and attention-starved prices mean-revert once volume returns; the pure-long book picks the opposite side (stocks with a fully continuous tape). Differs from the library: no library head or candidate puts the core under cross_mean / ts_max / surprise operators or conditions it on return; cs_last_low05(day_flat_run_max(Volume), LogTotalCap) is the only seen wrapper.'
