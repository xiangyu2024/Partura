slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [6, 10, 14]
    reasons: '核心 day_first(cross_sum(log(Amt),3)) 就是快照里的 head（与 day_open 同值，corr_1 原始 |ρ| 1.00），所以这一位是对已有 head 的深挖。相关度表：种子 6、10、14 与 head 的原始 |ρ| 为 0.704、0.752、0.769，按 ≥0.7 划掉；14 另有流动性 0.882、已知族 0.889，≥0.8 也划掉。余下 12 个 ≥4，过线。核心本身的已知族 |ρ| 在表中是 0.800（三位小数），与 0.8 只差舍入，按「< 0.8」的 E 位条件可能不过，请确定性检查用未舍入值判，我无法从表里分出来。创新度 3：种子 1、2、3、8、12、15 与 head 的残差 |ρ| 只有 0.07–0.32，确实是去水平的不同读法（1 号 sub(核心, cross_ema(核心,120)) 的流动性 |ρ| 仅 0.148）；但 4、5、6、7、9、11、13 的残差 |ρ| 在 0.53–0.78，是对核心的差分或分位数换写，与 head 信息高度重合，所以整体给 3 而不是 4。合理度 3：机制清楚（开盘一分钟金额水平含隔夜信息与注意力，去水平后应是异常强度），但有三处扣分：（a）算子核对：种子 8 写成 ts_regres(核心, day_mean(...), 60)，而 ts_regres(x,y,d) 返回的是 y 对 x 滚动 OLS 的残差（rolling_ols 的 resid），所以算的是「当天均值去掉核心解释的部分」，不是理由里写的「核心对水平的残差」，机制写反了；这不是数学问题，不划，但合理度要扣。（b）定义：cross_sum 是对日轴 nansum 的滚动求和，停牌或上市不足窗口时少加一项，而 log 金额每项约 15 以上，一个缺日把和拉低约三分之一；这是核心和所有种子共同继承的计数偏差，cross_ema(120) 去水平后仍保留，不算「主要由缺失决定」（停牌日占比小），所以不挡，但应记入。（c）理由里「开盘集合竞价那一分钟」在仓库文档里没有依据（day_first 只是当天第一个非缺失分钟，数据源是否含 09:25 集合竞价未核实），机制描述要核对，不影响计算。无前视：cross_ema 因果、cross_zscore 含当天且尾随、cross_delay、cross_corr 尾随；cs_bucket_demean 用截面分位，不走 nanrank_last，不触发 §4 的已知陷阱。如果它有 alpha，最可能来自开盘分钟金额在去掉流动性水平之后的异常（即 1、2、15 号那类读法），而不是 4–7 号那些与核心残差仍高的差分写法。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [11, 15]
    reasons: '划掉：15 号 cross_ema(day_es_ratio_hi(Amt),60) 与 head cross_ema(pow_05(day_autocorr_n1(Close)),120) 的原始 |ρ| 0.765（≥0.7）；11 号 cross_tail_mean_q25(day_gini(Amt),60) 的流动性 |ρ| 0.808（≥0.8）。余 13 个 ≥4，过线。创新度 4：day_centroid、day_gini、day_signed_ratio、day_wmean、day_topw_mean 这一族读的是成交额在日内的时点与方向，库里 0 次出现（loc 的 heads 与 corr_1 里，原始 |ρ| 对 head 大多 0.13–0.30，最高的 1 号 cross_ema(day_centroid(Amt),60) 也只有 0.454，且与 day_open 头的重合主要在开盘份额上）。给 4 不给 5，因为 1、3、12、14 的已知族 |ρ| 为 0.52、0.67、0.51、0.52，3 号流动性 0.75，说明有一部分仍落在已知族与流动性家族里。合理度 4：机制清楚（拆单、事件和散户集中在开盘与尾盘，时点重心与带符号的成交额占比是这些行为的个体慢变特征），算子逐个核对都对：day_centroid = sum(t*|x|)/sum(|x|)/(T-1) 落在 [0,1]；day_signed_ratio 落在 [-1,1]；div 的分母经 replace_small_with_nan(is_gt(day_std(Ret),1e-4)) 去掉一字板，无近零除；cross_ema 跳过缺日、因果；ListAge 门是 0/1 的乘法门。两处要记但不挡：（a）day_gini 把 Amt=0 的分钟计入有限值的个数 n 并排在底部（ops_ext.py 的实现），所以 3 号（流动性 |ρ| 0.75）读的带一部分零成交分钟的频率，与流动性有重叠；未达 0.8，不算同一个量，但应视作流动性的近亲。（b）成交极少的日子 day_centroid 由一两笔决定，噪声大，靠 cross_ema 60 平滑，可接受。无前视（全部为当日分钟的统计、再取尾随日窗口）；无 ts_rank、cross_rank、in_rank_rolling，不触发 nanrank_last 陷阱。如果它有 alpha，最可能来自成交额在日内时点与方向的慢变个体差异（买卖占比、开盘与尾盘集中度），尤其是 1、2、5、9、13 号的慢读法。'
R:
  - head: 'sub(0.5, abs_(ts_regres(day_quantile_q75(cross_sum(log(Amt), 3)), day_last(cross_sum(Amt, 3)), 50)))'
    soundness: 3
    reasons: '理由里把 ts_regres 说成「滚动回归斜率」，但它返回的是 rolling_ols 的残差：y = day_last(cross_sum(Amt,3)) 对 x = day_quantile_q75(cross_sum(log(Amt),3)) 做 50 日滚动 OLS 后的 resid，再取绝对值。所以 head 读的是「原始金额和对数金额分位数的线性关系在当天偏离多少」，不是斜率噪声。数学上没有近零除（var_x 不过 EPS 时输出 NaN），没有爆点问题。但 y 是原始金额、x 是对数量，单位不一致，残差被大额日主导，读的是金额水平的偏离，与流动性控制 |ρ| 0.60–0.62 重合（R 1 变体 1–4 的 liq 分别 0.60、0.59、0.62、0.61）。变体 4 把求和窗口改成 6 日，同样保留这一单位错配。241 日窗口会让训练段开头约一年处于热身期，但不主导结果。四个变体都只改窗口、保留机制，所以给 3：不是数学问题，但拆解表的解读有误，需要在收录时改写。'
  - head: 'day_first(cross_sum(log(Amt), 3))'
    soundness: 3
    reasons: '变体 day_first(cross_sum(log(Amt),10))、(…,20)、(…,60) 用的是 nansum 滚动求和（rolling_reduce + nansum_last）：窗口里缺日（停牌、上市不足）就少加一项，而每项 log 金额约 15 以上，所以窗口越长，值越反映窗口里的交易日数，计数偏差随窗口拉长放大。60 日版的流动性 |ρ| 为 0.837，部分来自这一偏差。cross_ema 变体（cross_ema(…,20)、(…,60)）与 day_first(cross_ema(log(Amt),20)) 是加权平均，缺日只跳过不加，没有这个问题。拆解表显示 3 日到 6 日 valid 变好，但变好有多少来自计数偏差没有检验；建议收录前用 ListAge 或覆盖率检验。机制（开盘金额的慢聚合，金额承重、量更差）清楚，窗口变体无除法，无前视，不触发 nanrank_last 陷阱。打 3：不是数学问题，但求和窗口变体的定义有已知偏差，不应被当作纯的金额读数。'
summary: '槽 a（E，核心即 head day_first(cross_sum(log(Amt),3))）创新 3、合理 3，划掉种子 6、10、14，余 12 个；核心的已知族 |ρ| 为 0.800（表中三位小数），需用未舍入值确认是否 < 0.8，否则 E 位不过。槽 b（N，日内成交额时点与方向）创新 4、合理 4，划掉 11、15，余 13 个，过线。两个 R 组合理度均为 3：head 1 的理由把 ts_regres 误写成斜率（实为残差）且金额与对数量单位错配；head 2 的求和窗口变体含 nansum 计数偏差。无数学问题足以挡下任一位；无前视；无 nanrank_last 陷阱。'
