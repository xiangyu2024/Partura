    core: 'day_first(cross_sum(log(Amt), 3))'
    hypothesis: >-
      核心是本流 B116 批里的 head(与 day_open(...) 同值):每天第一分钟(开盘集合竞价那一分钟)成交额的对数,
      再对最近 3 天同一位置求和(cross_sum 在日轴上滚动,所以是 3 日的开盘分钟成交额),读的是"开盘时钱有多重"。
      拆解表读数:本核心 train -1.41 / valid -0.74(valid 反而更好);cross_sum 窗口 3 -> 6 时 valid 从 -0.74 到 -0.39、2 日 -0.66,
      越慢 valid 越好;换成 Volume 反而更差(valid -2.33),说明承重的是"金额"而不是股数,即带价格的资金规模。
      问题:这个读数的主要内容是一个个股的成交额水平(流动性),而流动性已被尺子的控制去掉了,剩下的是它与流动性的差。
      这次要试的外围是把"水平"拆成三种去水平的读法,核心原样保持不动:
      (1) 相对本股自己:sub(核心, cross_ema(核心, 120)) 与 cross_zscore(核心, 60)、与自己 20 日前的差(cross_delay),
      读的是"开盘关注度的异常"(Barber-Odean 注意力:散户在开盘集合竞价被异常事件吸引,过度关注的股票随后被高估)。
      (2) 相对本股当天:sub(核心, day_mean(cross_sum(log(Amt), 3)))、减 q75、减当天最后一分钟,即开盘一分钟对全天平均 / 上四分位 /
      收盘分钟的对数比(= 开盘金额占比的对数读法,隔夜信息 + 散户集中度,与总成交额水平正交);
      cs_bucket_demean(核心, 当天均值)用分位桶而不是回归去掉水平(算子库里 cs_bucket_* 出现 0 次);
      ts_regres(核心, 当天均值, 60) 是对水平的滚动回归残差。
      (3) 对价格:sub(核心, day_first(cross_sum(log(Volume), 3))) = 开盘分钟 VWAP 的 3 日对数(与成交量对数之差),是个价位读数
      (低价股效应),库里批 B116 只有成交额叶子 87%,没人把额与量相减。
      另有 cs_bucket_demean 对 LogFloatCap(分位桶内去市值)、对 ListAge 门、以及 cross_corr(核心, day_mean(Ret), 60)
      (开盘关注度高的日子与日均收益是否同向)。
      和库里已有的不同:快照里含这个核心的只有 head 自身与 day_first / day_open 两个别名;库 5583 条里 sub / cross_ema / cross_zscore /
      cs_bucket_demean / cross_delay / ts_regres(核心作 y,当天均值作 x)的外围都没有出现(只有 ts_regres 以 day_quantile_q75 作 y 的
      head 1,是另一个子树);ListAge、LogFloatCap 叶子在库里 0 次。
      为什么样本外还会在:开盘集合竞价的成交额反映隔夜信息与散户注意力,这是 A 股的结构特征(涨跌停与 T+1 使开盘成为定价最集中的一分钟),
      且在 valid 比 train 好,没有随样本外衰减的迹象;去掉水平之后留下的是"异常开盘强度",不依赖流动性或市值。
      数学检查:log(Amt) 在 Amt=0 的分钟为缺失,cross_sum 用 nansum;没有除以近零的量;全部是尾随窗口,无前视;
      sub 的两项都在同一日同一时点,没有未来数据。
