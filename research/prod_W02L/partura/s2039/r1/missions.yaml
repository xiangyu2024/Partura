  core: 'day_autocorr_n1(Close)'
  hypothesis: |-
    机制(核心):day_autocorr_n1(Close) 是当天 241 根分钟收盘价(后复权)"水平"序列的一阶自相关。因为读的是水平而不是收益,它约等于 1 - Σ(ΔP)² / (2 Σ(P-P̄)²),即"分钟总变差相对全天价格离散度"的补数,读的是全天走势的效率 / 趋势性:趋势日接近 1,区间来回、噪声(弹跳)占主导的日子明显更低。这是我的推导,不是测的。
    读数:本批 X#1500 pow_05(day_autocorr_n1(Close)) score -2.26(train -2.26 / valid -2.17);pow_05 是保号开方(单调),所以子树 day_autocorr_n1(Close) 本身就是 -2.26,换 Vwap 为 -2.51。库自带统计换手 0.76、原始净夏普 -8.87。也就是说 head 是"一个噪声很大的日度比值统计被逐日读":两段都是负,问题不在于看错方向,在于单日可靠性低、换手把 15 bp 吃光。

    这次要试的外围是三件事,核心保持不动:
    (1) 速度:把 ρ 当成"个股的走势效率常态"而不是"当天的走势"。读法:cross_ema 半衰期 60 / 120 日、ts_mean 60 日、ts_decay_linear 120 日;日轴稳健化后再聚合(cs_winsor 先截尾、cs_rank 取日度排名再平均、log(1 - ρ) 取几何平均,因为 1 - ρ 是右偏的比值);截面减均值后再 241 日平均(去掉全市场共同漂移)。别的流的经验是慢是承重的(241 日窗口的读数最接近 0)。
    (2) 冻结日伪影(我读 dt_day.py 的 day_autocorr 得到的):分母是 sqrt(var_t * var_lag + 1e-8),全天价格不动(一字板、整日静止)的日子分子 0、ρ 恰好是 0,是整张表的最低值(正常日 0.97 ~ 0.999)。慢均值会把"一字板天数"当成主信号。所有种子用 mul(·, replace_small_with_nan(is_lt(day_flat_ratio(Close), 0.95))) 把静止分钟占比 >= 95% 的日子置缺失,只读真正在交易的日子的走势效率。在 Close(后复权水平)上这个 1e-8 地板对正常日没有影响(方差乘积远大于 1e-8)。
    (3) 不只读水平:日度水平的慢均值与 head(同一个统计)的秩相关预计偏高(单日 ρ 的跨日稳定性高时平滑版与它接近 0.7 以上),这类种子可能被库禁令 / 相关度表划掉。所以一半种子是水平之外的读法:对自己历史的 z 分数、20 日对 241 日常态的快慢差(体制变化)、120 日标准差(效率不稳定)、日度 ρ 的一阶自相关(状态持续性,cross_autocorr_s1)、与当日收益方向 / 成交额的 120 日相关(上涨日还是放量日更趋势化)、上 / 下四分位尾均值之差(日间离散)与下四分位尾均值(区间震荡日的平均水平)。另有一个 ListAge > 120 的门,去掉上市未满 120 日的名字。

    和库里已有的不同:快照里含这个核心的候选只有 pow_05(·)(日度、无聚合、无冻结日处理)。外围算子集合(cross_ema、cs_winsor、cs_rank、cross_zscore、cross_stddev、cross_autocorr_s1、cross_corr、cross_tail_mean_q25 / q75、day_flat_ratio、ListAge 门)在本批候选里一个都没出现;5583 条库表达式里 cross_ema、cross_zscore、cs_winsor、cross_tail_mean_*、day_flat_ratio 出现 0 次。16 个种子的骨架逐个对照过库的骨架集(无碰撞),外围算子集合两两不同。它们不是 head 的换写法:head 读当日的 ρ,种子读 ρ 的慢变常态 / 变化 / 不稳定 / 与方向的关系。

    为什么样本外还会在(也是我对来源的信念):走势效率反映个股的参与者构成 ——机构拆单与算法(趋势性、持续冲击)对散户与做市式来回成交(噪声、弹跳)的比例(Roll 1984 的弹跳、Hasbrouck 1993 的定价误差、Lo-MacKinlay 1988 的方差比都是同一个对象的不同读法)。这是慢变的个股结构,不依赖某段行情;窗口 60 ~ 241 日,换手比 0.76 低一个量级以上。预期并不高:水平类会被已知族 / 流动性 / 波动控制吃掉,真正有机会的是"变化、不稳定、与方向的关系"那几个种子。

    数学检查:(a) 无前视:ρ 只用当日 241 根分钟价,所有 cross_* / ts_* 窗口都是尾随窗口,t 日收盘后算、t+1 才交易;(b) 数值:冻结日已屏蔽,不会出现 0 值支配;log(add(sub(1, ρ), 0.0001)) 的真数 >= 1e-4 恒正;cross_corr 的两个输入都是有限实数(成交额加 1 再取对数,停牌日的 0 不会变 -inf);cross_ema / ts_mean 对缺失日取可用日;(c) 定义:ListAge 门只作用于一个种子,15 个种子不依赖它。本机用合成立方体(80 只 x 320 日 x 241 分钟,含停牌与未上市)把 16 个种子全算过:全部能算、无 inf、每日取值离散度 1.0(只检查运行时错误,不是任何分数)。没有用任何 2026 年数据。
