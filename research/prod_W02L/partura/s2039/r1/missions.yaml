- type: N
  hypothesis: |-
    机制:B115 的共同点是"日内价格 / 收益的 lag-1 序列相关":分钟价格里有多少是噪声弹跳、多少是信息驱动的持续漂移。这批里读数最好的(库自带 train 原始净夏普 +1.7 ~ +1.9、换手 0.05 ~ 0.08)全是在日度自相关外面套 10 日标准差 / 极小值的链,也就是"状态的稳定性"被慢窗口读,而日度水平本身(X#1500 的 Close 版、Ret 版)读数 -2.3 ~ -3.7。但 lag-1 只是方差比的一个点,库里的 day_autocorr / day_ar1_coefficient / day_durbin_watson / day_hurst 都在固定一个尺度上读,没有一条把"不同抽样频率下的方差比""噪声占比""跳跃占比"当对象(in_pct 与 in_logchg 在 5583 条里 0 次)。我的 idea:读多尺度的方差比 / 跳跃占比 / 去尺度的自相关,并做成慢变的个股属性。

    算子怎样实现(15 个种子,骨架互不相同):
    - 方差比 VR_k = day_var(in_pct(Close, k)) / (k * day_var(Ret)):k 分钟(重叠)收益的方差除以 k 倍 1 分钟方差(Lo-MacKinlay 1988)。1 = 随机游走,< 1 = 噪声 / 弹跳(流动性提供者的利润来源),> 1 = 趋势 / 持续冲击(拆单、追涨)。分母用 replace_small_with_nan 把全天不动或无成交的日子置缺失(否则 0 / 0)。k = 5 / 15 / 30。取 log(VR + 0.01) 让两侧对称,再用 cross_ema(·, 120) 变成个股常态。读法:水平(种子 1)、winsor 版(2)、偏离随机游走的程度 |VR - 1|(3,不分方向,Boehmer-Kelley 2009 的"效率偏离")、噪声的期限结构 log VR_30 - log VR_5(4)、截面减均值后的 241 日均值(5)、ListAge 门(6)、120 日标准差(7,对应本批 head 的"稳定性"读法,但直接读 VR)、20 日对 241 日常态的偏离(8)。
    - 跳跃占比:Barndorff-Nielsen-Shephard 2004 的 bipower 比 day_mean(|r_t| |r_{t-1}|) / day_mean(r²),纯扩散时约为 2/π(合成立方体里量得 0.63),有跳跃时下降。1 分钟版(9、10)与 5 分钟版(11,用 in_pct(Close, 5) 与滞后 5 根的自己相乘,抗 1 分钟弹跳噪声,思路来自 Zhang-Mykland-Ait-Sahalia 2005 / Huang-Tauchen 2005 的多尺度)。
    - 日度尺度的方差比(Lo-MacKinlay 原版,12、13):5 日 / 10 日对数收益的方差除以 k 倍日收益方差,241 日窗口,外面加 ListAge 门(窗口不足的新股);13 是 |VR - 1|。
    - 去尺度的自相关(14、15):我读 dt_day.py 发现 day_autocorr 的分母是 sqrt(var_t * var_lag + 1e-8),Ret 的量级是 1e-3,分钟波动 σ 较小的票被压缩。我用 AR(1) φ = 0.1 的合成序列量过:σ = 8e-4 时读数是真值的 0.84 倍,5e-4 时 0.52,3e-4 时 0.21;σ >= 1.3e-3 基本无影响。所以库里全部 day_autocorr_n1(Ret) 其实带着一个"低波动被压缩"的尺度因子。种子用 mul(Ret, 100) 让地板失效,读真正的相关系数(lag 1 与 lag 3,cross_ema 120)。

    和库的不同:5583 条里没有 in_pct / in_logchg、cross_ema、cs_winsor、没有给 Ret 去尺度;15 个种子的骨架逐个对照过库的骨架集(无碰撞),彼此也不相同。它们不是 head 的换写法:3 个 head 都是 lag-1 自相关(Close / Open / Ret)的日度读数或 ts_std / ts_min 链,而这里读不同抽样频率的方差比、跳跃占比、日度尺度的方差比与去尺度自相关;与 head 的相关预计中等,若 >= 0.7 由相关度表自动划掉(GP 的库禁令也会拒绝)。

    为什么样本外还会在:来源是"信息融入价格的速度与噪声占比",由参与者构成(机构 / 算法 vs 散户)决定,是慢变的个股结构(Boehmer-Kelley 2009;Hou-Moskowitz 2005 的价格延迟溢价)。窗口 60 ~ 241 日,换手低,15 bp 下不会被成本吃掉(别的流的经验:慢是承重的)。每个 VR 一天只有一个估计、噪声大,120 日平均才把噪声压下去。预期不高:水平类 VR 被流动性 / 已知族吃掉的可能性大,真正有机会的是 |VR - 1|、期限结构、跳跃占比、不稳定性这些"形状"类。

    数学检查:(a) 无前视:所有量只用当日及以前的分钟数据与日收盘,窗口都是尾随窗口;(b) 数值:VR 与跳跃占比的分母用 replace_small_with_nan(默认阈值 1e-8,正常的分钟收益方差约 1e-6)屏蔽全天不动的日子,不会出现 0 / 0 或爆点;log 的真数加 0.01 恒正;日度 VR 的分母是日收益方差的 k 倍,241 日窗口、ListAge 门去掉窗口不足的新股;in_pct 对前 k 分钟取缺失、day_var 只用有效分钟;(c) 定义:15 个种子在合成立方体(80 只 x 320 日 x 241 分钟,含停牌与未上市)上全部能算、无 inf、每日取值离散度 1.0;随机游走合成数据上 VR_15 中位数 0.91、跳跃占比 0.63,量级合理。没有用任何 2026 年数据。
