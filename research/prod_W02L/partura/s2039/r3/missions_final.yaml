  hypothesis: 新想法:成交额的突发性倾斜。把权重从 Amt 提到 Amt^2(只剩最集中的大额分钟说了算),读"极端大额分钟的方向"与"普通大额加权的方向"之差:sub(day_wmean(Ret,
