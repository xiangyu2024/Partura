    加权相当于把权重函数从线性改成凸的,不需要触发阈值,不会像 in_sustain_stddev 一族那样因为阈值 / 窗口造成大量全缺;day_topw_mean(Ret,
    Amt) 取前 10% 分钟的等权均值是它的硬截断版。与库的区别:库里 day_wmean / day_topw_mean 一类算子 0 次出现,权重做乘方也没有;B117
    的手写库那批(手写库里 26 条在冠军族里)全是 in_sustain_stddev(is_gt(log(Volume)…)) 的持续冲击检测,读的是冲击的持续时长而不是冲击时的方向。所有种子都是慢聚合(EMA
