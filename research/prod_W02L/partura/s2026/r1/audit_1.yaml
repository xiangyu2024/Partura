slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '核心 C = day_ar1_coefficient(in_slice(Ret,11,230)) 是 head 2(add(ts_stddev(C,15), ts_stddev(φ_V,15)))的子树,合法;13 个种子都含 C(逐个核过)。核心对五个控制的原始秩 |ρ|:liq 0.25 / vol 0.06 / rev 0.13 / known 0.23 / size 0.09,远低于 0.8;对三个 head 原始最大 0.175、残差最大 0.194。13 个种子对 head 的原始最大 |ρ| 都 ≤ 0.30;种子 11 与 head 2 原始 0.30、残差 0.41,是本位最高,因为 120 日尾部离散度与 head 2 的 15 日 φ 离散度方向相近,但窗口和形式不同,不判为换皮。控制列最高:种子 3 known 0.36 / liq 0.35,种子 13 size 0.25,其余 ≤ 0.28,都 < 0.5。算子核对(读了 ops_ext.py、dt_cross.py、dt_day.py、common.py、nd_cs.py):cross_ema 为日轴因果半衰期 EMA;cross_zscore 为含当日的 d 日窗口 z;cross_madz 要求有效日 ≥ d/2 且 MAD>0;cross_autocorr(x,d,s) 为 x_t 与 x_{t-s} 的滚动相关;cross_regres(x,y,d) 为 y 对 x 的滚动残差(种子 10 的 y 是 φ_R,正确);cs_regres(Y,X) 为逐日截面残差(种子 13);cross_tail_mean_q25 / q75 为下/上尾条件均值,种子 11 与 12 的形式正确(种子 12 是偏度形);day_ar1 在零方差日为 NaN,全部种子没有除法。无前视:全部尾随窗口或同日截面。数值:cross_corr 分母为 sqrt(var*var)+1e-9,φ 与日收益的 sd 积约 1e-3,远大于 EPS。问题在守卫,不在数学:cross_corr / cross_autocorr(种子 4 至 9)没有最少样本数,窗口里只有 2 个有效日时相关恰为 ±1,只有 1 个时为 0;ListAge 掩码按 dailyfields.py 只计上市天数、停牌日也计入,挡不住长期停牌刚复牌的票。cross_zscore(种子 1)在 n=2 时 z 恒为 ±1,cross_regres(种子 10)在 n=2 时残差为 0。这些影响少数票、不主导截面,不构成数学问题;建议加「有效日 ≥ d/2」守卫,同 cross_madz。种子 13 的价格中性化在库里有近亲 B111(cs_regres(φ(Ret)+…, log 开盘价)),机制相同、骨架不同。合理度 4:机制清楚(Roll 1984 的买卖价弹跳、Hou-Moskowitz 的价格延迟、φ 的相对常态与持续性),窗口 120 至 241 日合理。创新度 4:核心已在 head 2 中,但 head 2 只用它的 15 日离散度,13 个种子全部换了对象(相对常态、持续性、与其他日序列的耦合、回归残差、尾部形状、价格中性化)。骨架核对:我用 members.csv 的骨架列做了独立抽象比对(去掉字段与常数,我的抽象与库的骨架列有 94% 完全一致),27 个 E/N 种子全部为新骨架,与 PI 笔记一致;库里 cross_zscore / cross_madz / cross_ema / cross_tail_mean / in_pct 均为 0 次,day_ar1 与 cross_corr 同现 4 次、与 cross_autocorr 同现 2 次,都是不同对象。如果它有 alpha,最可能来自 φ 的多日持续性与耦合(种子 4 至 9),而不是 φ 的水平(水平已被控制吃掉)。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: 'N 位的对象是「成交条件下的一阶延续」:H 为「上一分钟属于当日成交量(或 |Ret|、成交量变化率)前 1/p 的分钟」的收益与下一分钟收益的日内相关,U 为无条件相关,种子取 H−U(种子 5 为高量腿减低量腿)后做 120 至 241 日聚合。算子核对(dt_in.py):in_topk_masked(x,y,p) 以 x 为排序键、返回 y 在前 k=(有效数+1)//p 个位置上的值,所以 in_topk_masked(V,R,5) 确实是「R 在 V 的当日前 1/5 分钟上保留」,种子 8、9 用 abs_(R) 作键也正确;in_delay 为分钟轴右移;day_corr 成对删 NaN、分母 sqrt+EPS、零方差返回 0;种子 5 的两侧差合理,U 相消。无前视:掩码用的是当日全天成交量排序,但日值在收盘后使用、t+1 交易,不跨日。对三个 head 原始 |ρ| 都 ≤ 0.164,残差 ≤ 0.244。对五个控制的原始最高:种子 14 liq 0.45、种子 8 liq 0.43 / known 0.41、种子 9 liq 0.41 / known 0.39、种子 7 size 0.38、种子 6 liq 0.38 / known 0.34。都 < 0.5,不判为换写法,但残差 IC 需单独检验。创新度 4:库里 day_corr 与 in_delay 同现 108 次、与 abs_ 同现 96 次,全是无条件、无符号的相关水平;in_topk_masked 与 day_corr 同现 0 次(我核对过),所以「条件相关」这个对象库里没有。成对数 11 至 44,单日噪声大,靠 120 日平均压到 0.015 左右。合理度 4,保留问题如下,都不是数学错误:(i) day_corr 在零方差时返回 0 而非 NaN(整日 R 全为 0,或掩码子集上 R 全为 0),涨跌停锁死票与成交稀疏票的 120 日均值会被拉向 0,种子 5 的低量腿最明显。(ii) in_topk_masked 的并列由 torch.topk 决定(实现定义,不随机也不按时间),种子 5 的低量腿在成交量为 0 的分钟超过 44 根时、种子 8、9 的 |Ret| 腿在非零 |Ret| 不足 k 根时,会选到实现决定的零分钟;只影响成交极稀疏的尾部票。(iii) 乘了成交量或成交额的相关(种子 6、7、12、14)对单个大成交分钟很敏感,日值常由少数分钟决定,可以考虑对 V 先取对数或截尾。(iv) H−U 的一大块可能只是「成交集中在开盘段」这一日内形态的代理,与信息交易无关;若开盘后数分钟的收益自相关为负,这一解释就成立,建议用去掉 09:31 至 09:45 或分时段的检验区分。(v) cross_stddev(种子 11、12)在窗口内只有 1 个有效日时输出 0,且没有掩码,只影响新股或刚复牌的票。如果它有 alpha,最可能来自成交集中于少数分钟的条件延续(Llorente 型信息交易),以及带符号成交流(种子 6、7、14),而不是 U 本身。过程注记:PI 笔记自报为看 members.csv 表头时看到了 B078 的一个成员(属于第 3 轮的批),并称 E/N 设计在看到它之前已定;文件层面无法验证先后,但它与本位的骨架不同(B078 为 lag-1 自相关,本位为条件相关),审计未据此扣分。'
R:
  - head: 'ts_stddev(day_ar1_coefficient(div(in_slice(Volume, 11, 230), in_sum(in_slice(Volume, 11, 230)))), 15)'
    soundness: 4
    reasons: '变体:窗口阶梯 45/60/90/120/180/241,先 EMA5 再 ts_stddev 120,上下四分位尾均值之差,以及 EMA120 偏差的 EMA60 绝对值。核对:ts_stddev 对应 nanstd 在日轴的 d 日窗口(nd_ts.py);cross_ema 为半衰期;_tail_mean 有 n≥2 守卫;abs_(φ − EMA120) 正确;无前视,无除法。合理度 4:慢窗口对应「φ 的多日体制变化」,机制清楚,是「慢与平滑承重」这一拆解结论的自然延伸。保留问题:(i) 长窗口(180、241)会吸收单票 φ 的漂移;φ 的漂移与价格变化相关(tick 机械成分),而 R 不带价格控制,阶梯的增益可能部分来自这一通道,而不是 φ 的持续体制。(ii) 长窗口下上市不满一年的票只有部分日,ts_stddev 对短样本有向下偏差,阶梯的增益要用 ListAge 掩码重验。(iii) 变体 1、2 与 head 3(Amt 孪生)的原始 |ρ| 为 0.57 与 0.50,残差 0.79 与 0.70,实际是同一对象的窗口换写法,这一项不计分,供替换决策参考。'
  - head: 'add(ts_stddev(day_ar1_coefficient(in_slice(Ret, 11, 230)), 15), ts_stddev(day_ar1_coefficient(div(in_slice(Volume, 11, 230), in_sum(in_slice(Volume, 11, 230)))), 15))'
    soundness: 4
    reasons: '变体:两半一起放慢到 60 与 120;Ret 半单独 120;两半先 EMA5 再 120 或 241;去掉 Volume 半的 ts_stddev(C,120);ts_stddev(EMA5(C),241)。核对:两半都是 φ 的 ts_stddev,量纲都在 [0,1] 内,相加无量纲问题;去掉 Volume 半是合法的去部件。合理度 4,机制与 R1 相同。保留问题:同 R1 的 (i) 与 (ii);另外 Ret 半的 φ 在涨跌停锁死日为 NaN,窗口内有效日少时 ts_stddev 估计偏低。变体 3(仅 Ret 半、120 日)是 C 的单独慢版本,与 E 位种子 11 同为「φ 的 120 日离散度」一类,若收录需注意与 E 位的概念重叠。'
  - head: 'ts_stddev(day_ar1_coefficient(div(in_slice(Amt, 11, 230), in_sum(in_slice(Amt, 11, 230)))), 15)'
    soundness: 4
    reasons: '唯一变体:Amt 孪生的 ts_stddev(φ_Amt, 120)。核对:div(Amt, in_sum(Amt)) 是日内常数的除法,AR(1) 对尺度不变,φ 与 Amt 原序列的 φ 相同,分母在有非 NaN 分子时为正,无除零。合理度 4:就是 head 3 的窗口变形,用来检验 Volume 与 Amt 在慢窗口上的等价,机制与 R1 相同,无数学问题。注意这一项的收录价值低,因为它与 R1 的 120 日版几乎同构,若两者都收录会重复;审计按合理度评,不扣分。'
summary: '两个任务位均放行(创新度 4、合理度 4,无种子划掉;E 位核心对五个控制的 |ρ| 最高 0.25);R 三组合理度均 4;保留问题主要是守卫缺失(corr 与 autocorr 无最少样本数,ListAge 掩码挡不住停牌后的小样本窗口)、零方差与并列的定义约定、乘成交量相关的杠杆,以及 H−U 可能只是开盘段成交集中的代理;全程只用 train 与 valid 的数据,未读任何 2026 年数据;PI 笔记自报看到 B078 一个成员,未据此扣分。'
