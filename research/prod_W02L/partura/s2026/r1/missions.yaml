- type: N
  hypothesis: |-
    机制。B076 的 10 个库因子全读同一个对象:一个序列(分钟收益或成交量份额)在第 11 ~ 230 分钟里对自己上一分钟的 AR(1) 系数,再做 15 日的 ts_mean / ts_stddev —— 只有『自己对自己』的一阶依赖。N 位问下一步:价格的分钟级一阶依赖是否取决于上一分钟的『成交状态』。这是 Llorente–Michaely–Saar–Wang(2002)的成交量–收益动态关系:信息不对称高的股票,放量之后收益延续;对冲 / 流动性驱动的股票,放量之后收益反转;Hasbrouck(1991)是带符号成交流对价格的持续影响。把这个机制放到分钟尺度,每天取一个无量纲的相关,再做 120 ~ 241 日的慢聚合,得到每只票的『成交条件下的延续 / 回吐倾向』,即谁在交易(信息交易者 vs 流动性 / 对冲 / 散户追涨)。

    算子怎样实现。令 R = in_slice(Ret, 11, 230),V = in_slice(Volume, 11, 230),A = in_slice(Amt, 11, 230)。U = day_corr(in_delay(R, 1), R) 是无条件的一阶相关(约等于批里的 C)。H = day_corr(in_delay(in_topk_masked(V, R, p), 1), R):只保留『上一分钟属于当天放量前 1/p』的那些分钟(其余置 NaN),取这些分钟的收益与下一分钟收益的相关(p = 5 / 10 / 20,每天约 44 / 22 / 11 对)。H − U = 放量之后的延续相对无条件延续的增量。种子的变形:
    (1) 条件变量:成交量放量(种子 1、2、4、5、11、13 用 Volume;种子 3 用 Amt)、价格冲击(上一分钟 |Ret| 最大的 1/5、1/10 分钟:种子 8、9,『大冲击之后是延续还是回吐』)、成交量变化率 in_pct(Volume, 1)(『突然放量』而不是『一直量大』:种子 10)。
    (2) 带符号成交流:Ret × Volume(Llorente 的交互项)、Ret × Amt(滞后 2 分钟)、sign(Ret) × Volume 作为滞后项(种子 6、7、14),与同滞后的 U 做差。
    (3) 双侧:放量侧 H 减缩量侧 L(种子 5)。缩量侧在不活跃票上收益全为 0,相关取 0,所以只放这一个。
    (4) 聚合:cross_mean 120 / 241,cross_ema 60;cross_stddev 120 / 241(不稳定度版,延续批里『离散度比水平好』的发现,种子 11、12);cross_zscore 再 EMA 40(相对自己的常态,种子 13)。

    和库里不同(都已逐条核对 5583 条表达式):in_topk_masked 与 in_delay 同现 0 次、与 day_corr 同现 0 次;day_corr 配 in_delay 与 mul 同现 0 次;in_pct、cross_zscore、cross_ema 0 次。库里有成交量与 |Ret| 的滞后相关(day_corr(abs_(in_delay(Ret, k)), Volume) 及其 log / zscore 变形约 96 条),但那是『无条件、不带符号』的相关水平;本位读的是『放量 / 带符号成交之后,延续相对无条件延续的增量』。批里 10 条只读自己对自己。14 个种子的骨架都不在库的 4100 个骨架里(逐个用 skeleton_key 核过)。

    为什么样本外还会在:来源是『谁在交易』的结构差异(信息交易者 vs 流动性 / 对冲交易者 vs 散户追涨),Llorente 等在美股里证明它跨股票稳定;H − U 是同一只票自己的两个相关之差,tick / 价格 / 波动对 H 与 U 的共同影响相消,所以不是波动或价位的换写法;全部慢聚合(120 ~ 241 日),换手低。弱点我自己知道:每天只有 11 ~ 44 对,单日相关的标准误约 0.15 ~ 0.3,靠 120 日以上的平均压到 0.015 ~ 0.03;H − U 里仍含『高成交分钟价格弹跳较小』的 tick 机械成分(低价股),那会让它与名义价格相关,而名义价格不在 5 个控制里。

    数学检查:(a) 无前视:in_delay(x, d) 是 x[t − d];in_topk_masked 用当天全天成交量排序选分钟,这个日度值只在收盘后使用、t+1 交易;所有 cross_* 窗口尾随。(b) 数值:day_corr 的分母是 sqrt(var_x · var_y) + 1e-9,放量分钟收益的方差量级 1e-6 ~ 1e-5 级(两个方差之积的平方根 ≥ 1e-5),远大于 EPS,不爆;收益全为 0 的日子(涨跌停锁死 / 极不活跃)方差为 0,相关取 0(不是 inf,也不是 NaN),成对数少于 2 才是 NaN。(c) 定义:全部种子没有除法;不用 ts_rank / cross_rank / in_rank_rolling(nanrank_last 缺失返回 0 的已知陷阱不适用);mul(Ret, Volume) 最大约 1e6,float32 平方和约 1e13,不溢出;sign(Ret) 在 Ret = 0 处为 0;in_pct 在上一分钟成交量为 0 时为 NaN,in_topk_masked 对 NaN 按缺失处理。本机用合成立方体(64 只 × 360 日 × 241 分钟,含停牌与未上市)把 14 个种子全算过:无错误、无 inf、每日取值离散度 ≥ 0.99,只检查运行时,不是任何分数。没有读任何 2026 年数据。
