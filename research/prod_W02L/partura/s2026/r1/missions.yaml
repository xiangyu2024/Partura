- type: E
  core: 'day_ar1_coefficient(in_slice(Ret, 11, 230))'
  hypothesis: |-
    机制。核心 C = day_ar1_coefficient(in_slice(Ret, 11, 230)):每天第 11 ~ 230 分钟(约 9:41 ~ 14:50,共 220 根,避开开盘集合竞价附近与尾盘)的分钟收益对上一分钟收益的 AR(1) 回归系数 φ_R。它把两种相反的力混在一起:买卖价弹跳 / 做市(Roll 1984,φ 为负)与信息驱动的连续单边成交 / 趋势(φ 为正)。无量纲,与波动水平无关,但它的水平强烈依赖 tick / 价格 / 流动性。

    批里的证据(loc.md 拆解表,新尺子):(1) 日度原值 C 自己 −3.60(train −3.57 / valid −3.60,ρ_known −0.23);在 head 2 里把一个 ts_stddev(·, 15) 拆掉、只留原值,分数变差 1.09 ~ 1.15,所以承重的不是 φ 的水平,而是『对 φ 做慢的、平滑的聚合』;(2) ts_stddev(C, 15) 单独 −2.54(ρ_known −0.09),比含它的 head 2(−2.78)还好 0.24;(3) 同结构的 ts_stddev 窗口 7 → 15 → 30 在 Volume / Amt 两个 head 上都单调变好(−3.38 → −2.74 → −2.23;−3.28 → −2.79 → −2.19),Volume 与 Amt 互换几乎不变,train 与 valid 同向。我的解读:15 日 std 里有很大一块是『每天用 220 个点估一个 φ』的抽样噪声(大小随当天活跃分钟数变,近似流动性)加上换手;有信息的部分(若有)在 φ 的多日、低频变化里,不在日度抖动里。

    这个 E 位要回答的问题:把 φ 的水平(tick / 流动性的机械成分,会被控制吃掉)与日度抽样噪声都拿掉之后,φ 的『相对自己的偏移、持续性、与其他日序列的耦合、分布形状』里还有没有东西。快照里 C 只出现在 head 2(及其拆解变体)里;下面 13 个种子的外围全部不是 ts_stddev / ts_mean 换窗口(窗口阶梯留给 R 去做):
    (1) 相对自己的常态(种子 1 ~ 3):cross_zscore(C, 120) 的 EMA 60;cross_madz 稳健版的 EMA 40;EMA 20 减 EMA 241。读『最近的 φ 相对它自己的长期状态偏了多少』,个股水平被减掉。
    (2) 持续性(种子 4、5):cross_autocorr(C, 120, 1)、cross_autocorr(C, 241, 5)。φ 的体制是否成团(信息到达有持续性 / 机构分批执行),还是纯抽样噪声(自相关 0)。
    (3) 与其他日序列的 120 日滚动相关(种子 6 ~ 9):与成交量份额的 φ_V(价格趋势日与成交平滑日是否重合)、与当日收益 day_sum(Ret)(趋势日是涨日还是跌日:上涨时平稳爬升 vs 下跌时平稳砸盘)、与 log 成交额(趋势日是否放量)、与当日波动 day_std(Ret)(弹跳在高波动日消失的程度,是 tick 机械成分的诊断种子);种子 10:cross_regres(φ_V, C, 120) 的 EMA 40(注意 cross_regres(x, y, d) 是 y 对 x 的回归残差,即 C 中 φ_V 解释不了的部分)。
    (4) 分布形状(种子 11、12):φ 的上尾均值减中位数;上下尾均值之和减 2 倍中位数(偏度,不是离散度)。
    (5) tick 机械成分对照(种子 13):每天截面上把名义价格(LogFloatCap − LogFloatShares ≈ 对数股价)对 EMA 20 平滑后的 φ 做线性回归取残差,再 EMA 40。用连续回归、不分桶(别的流的 R 里分桶去均值因桶边界跳变推高换手,全部变差)。

    和库里不同:库里 444 条含 day_ar1_coefficient,其直接外层是 pow_05(128)/ ts_decay_linear(38)/ cross_med(32)/ cross_argmax(29)/ ts_max(25)/ sigmoid(23)等,作用对象 405 条是原始字段,只有约 25 条作用在 in_slice 或 div 之后;cross_zscore、cross_madz、cross_ema、cross_tail_mean_* 在 5583 条里 0 次,日频叶子(LogFloatCap、LogFloatShares、ListAge)0 次;cross_autocorr_s1 / cross_regres 与 day_ar1_coefficient 各只在 2 条深层随机树里同现,最近的一条是 B031 的 cross_autocorr_s1(pow_05(day_ar1_coefficient(Volume)), 30)(Volume 的 φ、30 日窗口、没有掩码),本位是 Ret 的 φ、120 ~ 241 日窗口。13 个种子的骨架都不在库的 4100 个骨架里(逐个用 skeleton_key 核过)。

    为什么样本外还会在:φ 的耦合与持续性刻画的是个股的交易者构成与信息到达方式(机构拆单 / 散户追涨 / 做市商库存),是慢变的持有人结构属性,不依赖某段行情;窗口全在 120 ~ 241 日,换手低;种子 11、12 的尾部均值是阶梯式更新的,换手最低。我对这个核心不乐观:它最可能的结果是『最慢的这一类也到不了 0.5』,但这正是要排除的假设。

    数学检查:(a) 无前视:全是尾随窗口,日度值在收盘后才使用、t+1 交易;cross_autocorr 用 x[t − shift] 配 x[t]。(b) 数值:cross_corr / cross_autocorr 的分母是 sd 之积 + 1e-9,φ 的方差量级 1e-2、day_sum(Ret) 的方差约 1e-4,sd 之积 ≥ 1e-3,远大于 EPS;零收益 / 涨跌停锁死日 φ 的方差 < 1e-8,为 NaN,滚动窗口跳过;种子 4 ~ 9 乘『上市满 130 日』的掩码 replace_small_with_nan(is_gt(ListAge, 130)),避免新股窗口只有几个点;全部种子没有除法;不用 ts_rank / cross_rank / in_rank_rolling(nanrank_last 缺失返回 0 的已知陷阱不适用)。(c) 定义:本机用 AlphaCube 的合成立方体(64 只 × 360 日 × 241 分钟,含停牌与未上市)把 13 个种子全算过(日频叶子用等价物替代):无错误、无 inf、每日取值离散度 1.0,只检查运行时,不是任何分数。没有读任何 2026 年数据。
