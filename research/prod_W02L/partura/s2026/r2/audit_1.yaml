    struck_seeds: [8, 9, 15]
    reasons: '位 a 是 E 深挖,核心 C = day_flat_run_max(in_slice(Ret,11,230))。创新度 3:C 不是任何 head 的子树(head 1 的 Ret 项是 day_durbin_watson),但它是 loc.md 共性表第二行的子树(17 个候选,含 -1.28、不含 -2.76,差 +1.48,p 0.000),属于定位输出,来源合法。C 与 head 1 的原始秩 |ρ| 为 0.69、残差 0.68(corr_1.md),与 head 1 里 DW(Ret) 那一项度量的是同一现象(分钟收益的停滞),只是统计量不同(最长一段对比总个数,day_flat_ratio 是另一个量)。残差 0.68 说明对五个控制取残差后 C 仍与 head 1 高度重合,所以不给 4 或 5;但统计量不同,也不判为 1。核心对五个控制的原始秩 |ρ|:liq 0.48、known 0.44、size 0.20、vol 0.20、rev 0.11,都 < 0.8,通过。15 个种子都原样包含 C;用 loc.json 核过,没有一个与已见候选逐字相同。划掉:按 §3 自动规则,与某个 head 的原始 |ρ| ≥ 0.7 的种子 8(0.76)、9(0.77)、15(0.75) 划掉。corr_1.md 的「门槛」列对 9、15 标为「过」,与规则不符,以规则为准;对种子 8 标「废品」与规则一致。核心 0.69 低于 0.7,不按规则划,但它的「废品」标记我无法从规则复现,留给总领核对。划完剩 12 个(1-7、10-14),≥ 4,通过。算子核对(读了 ops_ext.py、dt_cross.py、nd_cs.py、common.py、dt_day.py、dt_in.py、calculate.py):day_flat_run_max 为有效分钟内相邻相等的最长连续段除以有限分钟数,值域 [0,1),有限分钟不足 2 个时为 NaN;in_slice(x,a,b) 为 x[:, a:b+1] 包含端点;cross_regres(x,y,d) 为 y 对 x 的滚动 OLS 残差(种子 4、5、7);cs_regres 为逐日截面残差(种子 6,X = LogFloatCap - LogFloatShares,在 cap = 价格 x 流通股数 的恒等下即对数股价);cross_ema、cross_zscore(有 sd 守卫)、cross_corr、cross_autocorr、cross_stddev、cross_tail_mean_q25 形式正确;无前视。停牌日在 calculate.py 中是 null 而非 0 填充,所以停牌不会被当成停滞。种子没有用 rank 算子,不触发 nanrank_last 陷阱。唯一的定义注意:刚复牌或盘中新股的有限分钟很少时,run/n 可接近 (n-1)/n,是小样本伪影,只影响少数票,不主导截面,不判数学问题。控制列最高的种子 14(vol 0.36)仍 < 0.5。合理度 4。如果它有 alpha,最可能来自成团停滞(涨跌停锁死、低流动性下连续无成交)经慢聚合与回归残差后的持续性,而不是停滞的水平。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '位 b 是 N 新想法,对象是上午与下午两段 AR(1) 之差(in_slice(Ret,11,120) 与 in_slice(Ret,121,230),各 110 分钟,端点包含、互不重叠、等长),外加同构的 DW、停滞段、相关与回归残差。创新度 4:三个 head 的原始 |ρ| 中,只有种子 9 对 head 1 为 0.58,其余最高 0.34(corr_1.md);残差最高的种子 5 为 0.42,< 0.5。库查重:members.csv 中 cross_ema 与 cross_zscore 文本出现 0 次、day_ar1_coefficient 出现 444 次,与 N 位假设一致(只做了文本计数,不是骨架比对)。种子不与 loc.json 候选逐字相同。合理度 4:算子核对,day_ar1_coefficient 为 OLS φ,var_x < 1e-8 时为 NaN;day_durbin_watson 与 day_corr 的零方差约定不同(见下);两段之差大体消去两段共享的 tick 水平,机制(知情交易集中在上午、午后被动流与申赎)清楚;全部为当日收盘后的日内窗口值,慢聚合只用过去的日,无前视,没有除法。以下是定义注意,都不是数学错误,也不主导截面,不划种子:(i) 停滞半段的 AR(1) 为 NaN,差为 NaN,覆盖偏向非停滞票;(ii) 种子 10 的 day_corr 在停滞半段返回 0 而不是 NaN,与 AR(1) 的约定不一致,停滞票的两段差会被拉向 0;(iii) 种子 9(成交量份额的 AR(1) 之差)与控制的原始 |ρ|:liq 0.62、known 0.60,高于 0.5 但低于 0.8 的自动划掉线,按规则不划,也不按重复划;它很可能在已知族 |ρ| >= 0.5 上被奖励尺子判为不合格,那是尺子的事,不是审计挡的理由。种子 4(停滞段差)与位 a 的核心同族,但外层算子不同,不算重复。如果它有 alpha,最可能来自上午价格发现在午前完成、午后积累噪声的日内集中结构,而不是两段的 tick 水平。'
