  hypothesis: >-
    核心 C = day_flat_run_max(in_slice(Ret, 11, 230)):每天第 11~230 分钟里「收益连续等于上一分钟」的最长一段占有效分钟的比例,
    即最长的一段停滞(没有任何价格变动)有多长。它读的是非同步交易 / 报价停滞(Lo-MacKinlay 1990;Lesmond 等 1999 的零收益日思想,
    这里改成日内最长连续零收益段),不是成交额水平:day_flat_ratio 只数个数,最长连续段读的是「成团」的停滞,例如被涨跌停锁死或
    整段无人成交。证据:loc 共性表里含它的 17 个候选均值 -1.28,不含 -2.76(差 +1.48,p<0.001),是本批最强的子树;第 1 轮 E 位的最好候选
    (+0.19,train +0.36 / valid +0.19,是本组最接近过线的)就是 mul(cross_corr(尾部差, C, 120), C),说明 C 本身有残差信息。
    第 1 轮的外围全是围绕 φ_R(AR1 系数)的相关与尾部均值,并且都乘了 ListAge 掩码;这次外围和它们很不同:核心单独做
    慢聚合(EMA / 零均值化 / 离散度 / 持续性)、对流动性与价格水平(sub(LogFloatCap, LogFloatShares) = 对数股价)做回归取残差
    (读「在同样成交额、同样股价下还停滞多久」,即机械的 tick 成分被拿掉后剩下的信息缺口)、与当日收益符号的 120 日滚动相关
    (停滞日之后价格是补涨还是补跌,Bekaert 等 2007 的零收益 + 流动性溢价,价格延迟,Hou-Moskowitz 2005)、以及停滞段与停滞个数之差
    (成团程度)。样本外还会在,是因为机制是微观结构的持续特征(涨跌停 / 机构持仓 / 做市深度),不是某一段行情;慢聚合压低换手,
    对流动性的回归残差把已被控制吃掉的水平再去一遍。数值上 C 在 [0,1],无除零(n>1 才有值),没有前视,每日截面取值离散。
