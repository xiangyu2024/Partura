- type: N
  hypothesis: >-
    新 idea:日内「上半场 vs 下半场」的收益微观结构不对称。库里 day_ar1_coefficient / day_durbin_watson 全部作用在整段
    in_slice(·, 11, 230) 上(本流 loc 的 6 个 head 与全部拆解都是这样),而知情交易集中在上午、下午更多是噪声与被动再平衡
    (Admati-Pfleiderer 1988 的日内集中;Heston-Korajczyk-Sadka 2010 的日内周期)。把 220 分钟拆成 11~120 与 121~230 两段,
    各算一个一阶自相关系数(或 DW / 最长停滞段),取「上午减下午」的差:差里同时去掉了每只票共有的 tick 与价格弹跳水平
    (两半共享),留下的是「价格发现在哪个半场完成」。若上午持续(AR1 为正)、下午回吐(为负),说明信息在上午已被吸收且下午有噪声,
    反之说明价格延迟到下午才消化。再做 60~120 日的慢聚合(EMA / 离散度 / 零均值化)与对当日收益的滚动相关。
    与库里已有的不同:库里 444 条含 day_ar1 的表达式作用对象基本是原始字段,没有按半场拆开再做差的;外层 cross_ema、cross_zscore
    在 5583 条里是 0 次,所以骨架全是新的。样本外还会在,是因为知情交易集中在上午、下午被动流多是 A 股结构性特征(T+1、
    午后 ETF / 指数基金申赎),不依赖某段行情。数值上差是两个有界系数之差,无除零,每日取值离散,不含前视。
  inspired_by: >-
    本流 B076 / B077 里 day_ar1_coefficient 与 day_durbin_watson 的各种 head 全部是整段 11~230 的系数;
