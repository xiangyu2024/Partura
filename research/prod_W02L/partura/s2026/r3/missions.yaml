  hypothesis: 新 idea:『上午拉升、下午封死』的时序分解。head 里的 C 与 S 取的是同一段 11~230 分钟,所以分不清『先拉后封』(盘中资金推到涨停,封单排队,次日接力)与『先封后撤』或整天横盘;这里把停滞段放在下半场(121~230 或 151~230、176~230)、收益放在上半场(11~120 / 11~150 / 11~175),乘积只有在『前段有大幅价格变动、后段价格不再变』时才大,是对封板事件的时点定位。第二条线用 LimitWidth(日频叶子,5583 条库表达式里出现 0 次)把当日收益除以该板涨跌幅限制,再设阈值 0.4 得到『接近涨停 / 跌停』的事件,事件乘以最长停滞段,上侧事件减下侧事件;第三条线用『成交量为零的分钟占比』(day_zero_ratio on Volume)读真正无成交的锁死,与价格停滞(收益等于上一分钟)不是同一个量,后者包含低价股价格不动但仍有成交的情形。对库的差别:库里的停滞段 / 零收益算子只有整段 11~230 的版本,没有任何表达式拆成『前段收益 × 后段停滞』,也没有一个用到 LimitWidth;聚合用 cross_mean 241 / cross_ema,慢聚合已在本流证明承重。机制:A 股封板有排队与接力效应(Ben-David 之类的限价与注意力文献也支持涨停后价格继续被推),上午已拉升且下午封死的股票,封单大、次日溢价高;一年的累计频率衡量的是持续特征(游资偏好 / 题材),不依赖某段行情。数值:所有项有界,除法只有除以 LimitWidth(≥ 0.05),无前视(只用当日 11~230 分钟)。种子里有 6 个对应 head 的邻近但不同的写法作对照(时点分解 vs 整段),其余是事件阈值版与成交量为零版。
