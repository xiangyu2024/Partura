  hypothesis: 机制:后复权收盘价的水平 = 自基期(2018 年或上市日)以来的累计收益,所以截面上它是一个超长周期(3 年以上)的动量 / 反转信号;第 2 轮 E 位 head(C / 前一日后复权收盘,+0.54)靠的就是除以这个水平(C 单独 -0.20),本流富集表里含 day_close(Close) 的 138 个候选均值 -1.29 对不含 -3.23(p 0.000),差 +1.94,是全表最强的共性子树。5 个控制只有 20 日反转,没有 1 年以上的反转 / 价位,所以这一维可能还留有残差。本 N 位不再带 C,直接问:长周期位置本身(没有序列相关这一部分)有没有 alpha,以及哪种刻画最稳:(a) 价位的倒数 / 对数;(b) 同市值十分位内的价位(cs_bucket_demean):去掉大盘股价位高的结构,留下同规模内的长期输家;(c) 距 2 年高点的比例(回撤深度)、距 2 年低点的比例;(d) 1 年 / 2 年累计收益与 482 / 241 日价位 z 分数,(e) 价位相对 1 年均值的偏离;(f) 未复权价 LogFloatShares - LogFloatCap(低价股)与后复权累计收益的秩和 / 秩差,把「低价」与「累计输家」拆开;(g) 价位与其 20 日滞后的 482 日相关(价位路径的平滑程度)。算子:cross_max / cross_min / cross_delay / cross_mean / cross_zscore 沿日轴取窗口,cs_bucket_demean 去市值,cs_rank 取截面秩;全部只用当日及以前的数据。为什么与库里不同:两个库的 5583 条里没有『后复权价位对自身 482 日极值 / 均值 / 滞后的比』这类长窗口价位位置(定位的富集表只显示 day_close(Close) 作为较大表达式的一个部件出现);快照 heads 全部是 C × 尺度或量额的回归。方向由奖励自动取最优(正负都可),所以不事先押多空。样本外还会在的理由:A 股长周期反转 / 低价偏好来自散户结构与退市 / ST 约束下深跌股的定价,不是样本内数值巧合。风险:价位的倒数与市值 / 流动性控制相关(深跌小盘),尺子拿走线性 / U 形暴露后可能剩得很薄;窗口只有 482 日(约 2 年),起始 2018 年初的前两年为热身期,数值定义上由 cross_* 的最小样本处理,训练段前段会缺失但不影响 2020 年之后。
