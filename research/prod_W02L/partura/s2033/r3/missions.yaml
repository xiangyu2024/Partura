  hypothesis: 机制:核心 C = 同市值十分位去均值后的日收益(后复权收盘到收盘)与其前一日值的 241 日滚动相关(同伴相对的一阶序列相关,正值 = 相对同伴有惯性)。依据(只用 train / valid):第 2 轮 E 位的唯一 head +0.54(train +0.70 / valid +0.54)是 div(C, 前一日后复权收盘);拆解表里 C 单独只有 -0.20(train +0.08),除以前一日收盘一项就带来约 +0.74,把 Close 换成 Vwap 仍 +0.45,所以承重的是「C 的符号 × 后复权价位的尺度」这一交互,而不是 C 本身。后复权收盘的水平 = 自基期以来的累计收益,低价位 = 长期输家(长周期反转,规则允许的已知读法),这个维度不在 5 个控制里(控制是流动性、波动、20 日反转、已知族、市值,另两个冠军信号)。本轮 E 位把「除以价位」这一个外围换成别的实现,看机制到底是什么:(1) 用秩权重代替 1/P 的重尾尺度:C × (1 - cs_rank(P)),C ÷ cs_rank(P),秩和 cs_rank(C) - cs_rank(P),这样截面排序不再被价位的倒数支配;(2) 平稳化的长期位置:用 1 年 / 2 年累计收益、距 2 年高点的比例、距 2 年低点的比例、482 / 241 日价位 z 分数的秩作权重(它们是「长期输家」的不同刻画,和 1/P 水平的相关性不是 1);(3) 未复权价位:LogFloatShares - LogFloatCap = -log(未复权价),低价股(散户 / 彩票偏好)与后复权累计收益是两回事,用它做权重或秩和,检验承重的是累计收益还是低价;(4) 只在 C > 0 的票里按 C / P 排(replace_small_with_nan(is_gt(C, 0))),因为尺度乘法使负 C 的票得分被价位拖到相反端,纯多头书只用头部;(5) 再按市值十分位去均值,把价位尺度与市值的残余暴露拿走。与以前不同:第 2 轮见过的外围是 div(·, 前一日价位)、乘 day_at_min_ratio(Vwap)、嵌套的 C 自身,以及 C 外面的平滑 / 分桶后处理;本轮没有一个重复,权重全是秩 / 累计收益 / 未复权价位 / 掩码。样本外还会在的理由:长周期输家 + 同伴相对惯性的组合源自 A 股散户对低价 / 深跌股的参与和反应不足,是行为偏差而非数值巧合;但 valid(+0.54)已弱于 train(+0.70),价位是否稳定是真问题,预测见笔记。
