- type: N
  hypothesis: 机制:A 股 14:57-15:00 是收盘集合竞价,最后一根分钟条 day_last(Amt) 实际是收盘竞价成交额(指数基金 / ETF 申赎、机构按收盘价调仓、算法收盘单都在这里成交,散户很少)。库里 77 条含
    day_last(Amt) 的挖掘式全是把它当水平量去做 cross_regbeta(与 Low 的水平回归)、ts_max、inv、cross_cov 的组合,没有一条把它除以全天成交额得到「收盘集合竞价占比」,也没有一条对数-对数回归或看收盘一分钟的价格反应。批里的现象(B098
    / B099,92% 与 90% 含量额叶子):头部式 ts_max(log(cross_regbeta(Low 分位数, day_last(Amt), 10)), 20) 在 train +0.33 / valid +0.15,说明收盘分钟成交额里有东西(+0.15
    是批里唯一 >0 的 head),但它读的是 Amt 对价位水平的斜率,价位水平随股价漂移,量纲不稳定。本位把它换成稳定量纲的对象:(a) 收盘占比 S = day_last(Amt) / day_sum(Amt)(有界、无量纲),看其
    20 日均值、5 日对 60 日的异常、秩口径、对同市值十分位去均值;(b) 收盘占比对当日收益的敏感(cross_regbeta / cross_corr 在 60 / 120 日):收盘机构资金是追涨还是逢低;(c) 异常占比乘收盘最后一分钟价格变动(day_last(Close)/day_last(Open)
    - 1)的 20 日累计:异常收盘需求带来的有符号推力;(d) 对数-对数弹性:log(day_last(Amt)) 对 log(day_sum(Amt)) 的 60 日斜率与最新残差:收盘成交额随全天成交额的弹性,残差是收盘特有的流量;(e)
    收盘一分钟收益与当日收益的相关(尾盘是顺势还是回吐);(f) 昨日收盘占比对今日收益的 241 日斜率。算子:日内 day_last / day_sum 取收盘分钟与全天成交额,滚动用 cross_mean / cross_regbeta
    / cross_corr / cross_regres,去风格用 cs_bucket_demean(.., LogFloatCap)。除法 day_sum(Amt) 在停牌日为 0 或缺失:S 为 NaN 或爆点,窗口里取均值时被覆盖率闸门处理,故放了
    1 个 ts_max 版本和 4 个 cs_rank / 相关系数版本(有界)。为什么与库里不同:库里没有占比,也没有对收益 / 全天额的回归;骨架(去字段后的算子序列)与全部 5583 条不同。样本外还会在的理由:收盘集合竞价的参与者结构(被动资金与机构)是制度性的,机构资金异常流入对后续收益的作用(Bogousslavsky
    2016 对日内机构再平衡与尾盘的描述;Cushing 与 Madhavan 2000 对收盘附近的价量)是缓慢的;占比和弹性对 15 bp 成本较友好(20 日以上平均)。风险:收盘占比与流动性、指数成分(市值)高度相关,尺子已拿走对这些控制的线性
    / U 形 / S 形暴露,故能否留下残差是真问题。
