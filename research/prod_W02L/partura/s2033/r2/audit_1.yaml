attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [6, 10, 13]
    reasons: '位 a 是 E 位,核心 C = cross_corr(cs_bucket_demean(r_t, LogFloatCap), cs_bucket_demean(r_{t-1}, LogFloatCap), 241),按 operators 源码核实:cross_corr 经 rolling_pair_reduce 沿日轴对每只股票做 241 日滚动相关(无最小样本数门槛,分母带 EPS),cs_bucket_demean 是按 LogFloatCap 十分位去均值。C 是「同市值十分位去均值后的日收益一阶自相关」,与笔记描述一致。核心门槛:相关度表 slot a core 与快照 head 的原始 |ρ| 最大 0.09(最像 ts_max(log(ts_max(log(cross_regbeta(...)))) 族),残差 0.02;与 liq 0.15、vol 0.15、rev 0.01、known 0.17、size 0.02,均远低于 0.8,通过。核心在库的 125 个已评分候选里有 5 个含 C(富集表 n 5,均值 -1.25 对不含 -2.77),属于库里已有的族,但不是任何 head 或控制;新内容主要在外围。novelty 给 4:C 本身不是 head,与控制 |ρ| 最大 0.17,外围的收缩 / 持续性 / 门控组合都不是 head 的换写。合理度 4:无前视(全部为 t 日及之前的尾随窗口,cross_delay 天数为正);seed 5 的分母 cross_stddev(C,120) 在几乎不变的票上会很小,但奖励按截面秩打分,爆点只让单只票上下移一个秩,不构成「支配截面」,不挡;seed 9 的第二项是 C 的 5 日滞后版本的 241 日相关,与 round 1 试过的 5 日滞后族相近但不是相同表达式(已对 r1 / r2 的 loc、corr、notebook 逐字比对,没有完全相同的写法),不算重复。划掉:(6) cs_rank(C) 是 C 的逐日截面单调变换,奖励在截面上转秩,与 C 的分组结果逐日相同,等同于 C 本身,属于重复;(10) sub(C, cs_bucket_demean(C, ListAge)) 代数上等于 C 在 ListAge 十分位内的均值(cs_bucket_demean(y,x) = y - 同十分位均值,故 C - (C - 均值) = 均值),个股之间只剩十分位标签,不含同年限同伴内的相对信息,与笔记 (3) 的意图(同年限去均值)不符,属于定义坏掉;(13) cs_winsor(mul(C, ListAge 掩码)) 与 seed 8 cs_demean(mul(C, 同一掩码)) 的截面秩只在 1% / 99% 两端并列不同,十分位分组逐只相同,属于重复。新上市风险(需 PI 核对,不挡):rolling_pair_reduce 不设最小观测数,上市后前几十日的 241 日相关由极少几对计算,会出现 ±1 的极端值。seed 8 与 13 用了 ListAge > 250 掩码,未掩码的 1–7、9、11、12、14 仍会带入这一项;笔记未给出训练段覆盖率的核对。如果它有 alpha,最可能来自同市值同伴内的慢速序列相关(反应不足 / 价格延迟),在涨跌停宽、流动性差的票上更强;最大的失败面是新上市票的噪声与流动性代理。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '位 b 是 N 位,对象是收盘分钟成交额占比 S = day_last(Amt) / day_sum(Amt)。核实:day_sum 是 nansum,全 NaN 日为 NaN,因此停牌日 S 为 NaN 而非 inf;day_last 为非负值且 ≤ day_sum,所以除法不会产生 0 以外的爆点,笔记担心的「爆点」不成立。算子方向核实:cross_regbeta(x, y, d) = rolling_ols 的 y ~ alpha + beta*x 中的 beta,即 y 对 x 的斜率。因此 seed 3 与 seed 15 是 S 对当日收益的斜率(与笔记 (b) 的「收盘占比对当日收益的敏感」一致),seed 13 是当日收益对昨日 S 的斜率(与笔记 (f) 一致),seed 10 与 11 的 log 参数全为正数,无符号问题。novelty 给 4:快照 6 个 head 没有一个含 S,热门 head 的原始 |ρ| 最大 0.18(seed 4,与 head ts_max(log(...)) 族),相关度表 seed 9 ts_max(S,20) 的 liq 0.41、known 0.38、size 0.27 最高,未达到 0.5 的控制变体线,也远低于 0.8 的门槛。注:未能定位到 5583 条库的成员文件,笔记「库里 77 条含 day_last(Amt) 全是别的组合」的库级说法没有核对,只按 head 与控制的相关度判断。合理度 4:机制有文献支撑(收盘集合竞价中的被动 / 机构成交),窗口 60–241 日合理;唯一需要 PI 核对的是事实前提:笔记假设 day_last(Amt) 覆盖 14:57–15:00 收盘集合竞价,但在 AlphaCube 文档里没有找到分钟条标签的说明(对 集合竞价 / 14:57 / 15:00 的检索无结果)。如果最后一根分钟条只是连续竞价的最后一分钟,机制标签要改,但表达式仍可计算,不属于数学问题,不挡。无划掉:seed 14 与 seed 2 只差 ListAge 掩码(改变的是可交易宇宙,不是截面秩);seed 8 与 seed 1 只差 LogFloatCap 去均值;seed 5 与 seed 4 是秩口径与原值口径的时间序列相关,不是重复;其余无逐秩相同的对。如果它有 alpha,最可能来自收盘集合竞价的参与结构(指数与 ETF 申赎、机构按收盘价调仓)在同流动性同伴里的异常流量;最大的失败面是 S 与流动性、市值的共同变动。'
R:
  - head: 'cross_regbeta(day_quantile_q25(Low), day_last(Amt), 10)'
    soundness: 4
    reasons: '只评合理度。10 个变体在 operators 源码中都有定义:cross_regbeta 为 rolling_ols 的斜率(var_x 不超过 EPS 时为缺失),log 只作用于正的价位与成交额,cross_corr 的分母带 EPS;没有前视。窗口变体 1、2、3、7(20、40、60、120)是参数改动,而不是 why 所说的「去掉或替换部件」,但这与数学无关,不挡。变体 4、5 对价位与成交额取对数,斜率成为弹性,消除了量纲问题;变体 8 对斜率做同市值十分位去均值,合理;变体 9 用 S 替换成交额,与 S 的口径一致;变体 10 用收盘价替换 q25(Low),是替换部件。why 中的「窗口 10→20 增益 +0.14」与 loc.json 的 r_candidates 记录(gain 0.1442)一致。机制:10 日斜率估计量标准误大,拉长窗口减少噪声,与「承重的是收盘分钟成交额」的拆解结论一致。注意:快照 head 本身是 ts_max(log(cross_regbeta(...))),log 作用在斜率上,但 log 的实现是 log|x|,会丢掉斜率符号,这是 head 的问题,不是 R 变体的问题,不挡。'
summary: '位 a 通过(创新 4、合理 4),划掉 6、10、13 三个:6 与核心截面秩相同,10 代数上退化为 ListAge 十分位的均值,13 与 8 的十分位分组相同;剩 11 个种子。位 b 通过(创新 4、合理 4),15 个种子全部保留;S 的分母不产生爆点,但「14:57–15:00 为收盘集合竞价」这一事实前提在仓库文档中没有找到依据,需 PI 核对。R 组合理度 4。没有种子因原始 |ρ| 达 0.7 或控制 |ρ| 达 0.8 而自动划掉;库级骨架与 77 条的说法未能核对。'
