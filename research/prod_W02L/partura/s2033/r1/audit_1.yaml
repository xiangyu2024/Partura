    soundness: 4
    reasons: '只评合理度。head 1 的 8 个变体都是单部件改动,数学上成立,无前视。变体 2、3 的 cross_stddev 与 head 中的 ts_stddev 在代码里是同一个 rolling nanstd、沿日轴运算(nd_ts.py 与 dt_cross.py 中两者都调用 rolling_reduce 与 nanstd_last),所以它们只是把窗口换成 60、120;"改用 cross_stddev" 的描述会误导,但不是数学问题。变体 4(cs_bucket_demean)与变体 8(IPO 掩码)是新增部件,不是去掉或替换,与变体的定义有出入;变体 8 与 head 的秩相关为 1.00(只把 ListAge 不超过 250 的票置为 NaN),对 head 没有增加信息,不是数学问题。变体 7 是唯一把 cs_rank 的有效域改回默认 isfinite(去掉上涨日掩码)的变体,也因此是唯一不把 A=+inf 计入最高秩的变体;head 与变体 1–6、8 都保留了 +inf 与复牌次日 NaN 被置顶的数值注记,why 没有提到这一点,但它不是 §4 的主导项。变体 2、3 与 seed 15、16 逐项相同。合理度 4:单部件拆解与 why 的假设一一对应(窗口、上涨日掩码、市值去均值、IPO 屏蔽),未覆盖的只有 NaN 置顶。'
