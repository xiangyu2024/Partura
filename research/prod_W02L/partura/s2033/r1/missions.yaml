- type: N
  hypothesis: |
    机制:同伴相对收益的慢速序列相关。个股当日相对同类的收益 x_t(去掉全市场共同部分用 cs_demean,去掉同市值十分位的均值用 cs_bucket_demean)对自己前一日值的依赖 —— 一阶回归斜率、秩相关、5 日 / 20 日滞后相关、方差比、上行后 vs 下行后的不对称、对同伴组前一日收益的滞后暴露 —— 在 120–241 日窗口估计,当作个股的慢性质。

    批里的现象(inspired_by B097):批里的想法本身没错 —— 看「今天在截面里的相对位置与昨天的相对位置有多相关」(L#211 ts_corr(秩, 滞后一日的秩, 10)、L#204 ts_autocorr(秩, 10, 1)、秩差、ts_delta),但它们的估计量又快又吵:窗口 10 日的相关系数标准误约 0.3,训练段库口径夏普 −15.8(L#204,换手 0.39);批内换手与夏普相关 −0.52,|rank IC| 中位数 0.006。而且被相关的对象是日收益比 r_t / r_{t-1}(无界、前一日近 0 时爆点),本位换成有界、稳健、慢的估计量,并把「相对什么」说清楚。

    机制与文献:(a) 公司特有信息在散户占比高、T+1、有涨跌停的 A 股被逐步吸收:同类相对收益的正自相关 = 反应不足(Hong 与 Stein 1999;Chan 2003 对有消息 / 无消息漂移与反转的区分);买卖价反弹与流动性供给使低价、薄盘票为负自相关(Avramov、Chordia 与 Goyal 2006)。先去掉市场与市值风格(A 股日收益的主要成分是风格轮动),剩下的序列相关才是个股自己的性质。(b) 方差比(Lo 与 MacKinlay 1988):5 日收益方差 /(5 × 1 日方差)的平方根 > 1 为动量型、< 1 为反转型,比一阶用了更多滞后。(c) 滞后暴露:个股对「自己同市值十分位同伴组前一日收益」的反应(Hou 与 Moskowitz 2005 的价格延迟思路,参照物是同伴组;对全市场均值的滞后暴露不在本位)。

    算子怎样实现:R = sub(div(day_close(Close), cross_delay(day_close(Close), 1)), 1)(后复权价,无复权跳变);X1 = cs_demean(R);X2 = cs_bucket_demean(R, LogFloatCap)(同市值十分位相对收益);X3 = cs_rank(R);X4 = cs_bucket_rank(R, LogFloatCap)(十分位内秩);同伴组收益 = R − X2。种子分组:(A) 一阶:cross_regbeta(滞后 X1, X1, 120 / 241)、cross_corr(X3, 滞后 X3, 120 / 241)、cross_corr(X2, 滞后 X2, 120 / 241)、cross_corr(X4, 滞后 X4, 120);(B) 其他滞后:5 日(同星期几)、20 日(同月内位置)滞后秩相关;(C) 方差比:5 日方差比的平方根;(D) 不对称:上行后斜率 − 下行后斜率;(E) 收缩与变化:十分位内去均值、向同伴均值收缩 0.6、60 日相关 − 241 日相关;(F) 同伴滞后暴露:cross_regbeta / cross_corr(滞后同伴组收益, X2, 120 / 241)。2 个种子乘 `replace_small_with_nan(is_gt(ListAge, 250))` 屏蔽 IPO 年(次新股连续一字板的相关会很高)。

    估计噪声与收缩:滞后 1 日相关在 120 日窗口的标准误约 1/√120 = 0.09,大于合理的个股真实离散度。本机合成检验(不是市场数据:3000 只票、t3 厚尾新息、真 φ 的截面标准差 0.05)按 IC 看:Pearson 相关 / 回归斜率 120 日 0.49、241 日 0.61;日秩的相关 0.53 / 0.65(厚尾下更稳)。所以种子用:秩口径、241 日窗口、向同伴均值收缩(经验贝叶斯的方向:估计越吵越要向同类均值 / 长窗口靠拢)、多窗口之差,去压估计噪声。

    与库里已有的不同:库里 5583 条里把收盘到收盘日收益与 ts_corr / ts_autocorr / cross_corr 放在一起的只有 6 条(都是 B095 / B097 的 5–15 日窗口手写式),没有一条在 ≥ 60 日窗口上估计个股收益的序列相关,更没有「相对市场 / 同类」的口径;cs_bucket_* 与日频字段(LogFloatCap、ListAge)0 次出现(逐条核对过 members.csv)。最近邻是 X#394 `cross_autocorr_s1(day_quantile_q25(Ret), 241)`(盘中分位数序列的自相关,不是收盘到收盘的相对收益)。16 个种子的 skeleton_key 与两个库的全部骨架、本波各流快照 head 的骨架都不相同。与本流 head 的不同:head 读日收益比的秩在 ≤ 20 日内的离散度(与前一日 |r| 近 0 的频率相关),这里读相对收益在日与日之间的相关,有界、无除法。与控制的不同:20 日反转控制读 20 日收益的水平,波动控制读 |r| 的水平;这里全是无量纲的相关 / 斜率 / 比值,同伴相对口径把市值风格拿掉,与五个控制和两个冠军都不是同一个量。

    为什么样本外还会在:序列相关由持仓构成(散户 / 机构)、价位的 tick 摩擦、涨跌停与 T+1 制度决定,都是慢变量;窗口 120–241 日,每天只换 1/120–1/241 的样本,换手低;不依赖某段行情。最可能的失败:真实截面离散度小于估计噪声(那样分数 ≈ −成本);相关被流动性吃掉(买卖价反弹)。方向由 train 决定,我不预设。

    数学检查:无前视(全部用 t 日收盘及以前;cross_delay 的天数为正;窗口尾随;t+1 才交易;LogFloatCap 当日已知)。无除以近零:R 的分母是前一日后复权收盘价(正数);cross_corr / cross_regbeta 在窗口内方差 ≤ EPS 时为缺失而不是爆点;方差比的分母是窗口内的 X2 标准差,停牌股窗口内没有有效点时为缺失;sqrt(5) 取 2.2361。cross_sum 把缺失日当 0(对 5 日收益增量是对的)。热身:窗口前 d−1 天按已有天数展开,噪声只拉低分数,IPO 年用 ListAge 屏蔽。闸门:相关 / 斜率 / 比值都是连续量,本机合成立方体(80 只 × 420 日,含停牌与未上市)里 16 个种子覆盖率 0.96–0.97、无 inf、每日不同值比例 1.00。我对 cross_corr(秩, 滞后秩, 120) 做过逐元素核对,与 numpy 滚动相关的差异在 1e-3 以内(相关系数 0.9999999)。
