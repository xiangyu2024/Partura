  hypothesis: |
    机制:核心 A = r_t / r_{t-1}(后复权收盘到收盘的当日收益,除以前一日收益;本批三个 head 都含它),本位读 A 的「位置」(中位数),不读它的「离散度」。

    (1) 批里的现象(loc.md、拆解表、members.csv 的训练段统计,没有用 2026 年):B097 的 19 条是同一个对象 A 的变形,A 的截面秩只在当日 r_t>0 的票里排(create_valid_mask),再取 ts_stddev / ts_mean / ts_delta / ts_corr,窗口全部 ≤ 20 日。三个 head 是 ts_stddev 的三种写法:−1.22 / −2.50 / −3.96。ts_stddev 窗口 5 / 10 / 20 / 40 日的分数是 −3.92 / −2.50 / −1.21 / −1.76(head 1、head 2 两种写法合起来读)。库口径训练段:19 条里只有 L#213(换手 0.047)接近随机基准(夏普 −0.38),其余 18 条夏普 −3.8 ~ −18.1,换手与夏普的相关 −0.52;|rank IC| 中位数 0.006、最大 0.017。也就是这一族几乎不带 rank IC,输在换手(15 bp)上。

    (2) 为什么该读位置:设 r_t = φ·r_{t-1} + e_t,则 A = φ + e_t / r_{t-1}。e_t 与 r_{t-1} 独立且对称,所以 e_t / r_{t-1} 关于 0 对称,A 的中位数就是 φ(Theil 型的稳健估计);而 A 的均值与方差不存在(Cauchy 型尾)。对 A 的秩取 10–20 日标准差,读到的主要是「前一日 r 近 0 的日子有多频繁」:前一日价位不变(r=0)时 A = ±inf、在秩里落到截面端点,这是价位离散化 / 低波动 / 流动性的代理,正是 5 个控制与两个冠军吃掉的东西(新尺子下 −1.2 ~ −4)。位置才是 φ:个股一阶自相关(价格对信息的反应延迟、买卖价反弹)是慢变的个股性质(Lo 与 MacKinlay 1988;Avramov、Chordia 与 Goyal 2006:价位低、薄盘的票为负,散户追涨与涨跌停连板的票为正),与波动、市值、成交额的水平没有函数关系。

    (3) 本机合成检验(不是市场数据):3000 只票、t3 厚尾新息、φ 的截面标准差 0.05 的 AR(1) 面板,用估计量与真 φ 的 Spearman IC:A 的中位数在 60 / 120 / 241 日窗口是 0.29 / 0.41 / 0.52;日截面秩的滚动相关是 0.41 / 0.53 / 0.65;A 的均值 ≈ 0.01(无信息)。所以本位所有种子都是 ≥ 60 日的位置估计量,没有一个对 A 本身求均值 / 方差。

    (4) 算子怎样实现:种子全部原样含 A;外围一律是日轴 cross_*(按股票分块,窗口 60–241 日)。四类:位置(cross_med 60 / 120 / 241 日、中位数的中位数、IPO 年 `ListAge > 250` 屏蔽);收缩与去风格(0.3 × 60 日 + 0.7 × 241 日的多窗口加权;向同市值十分位均值收缩一半 `x − 0.5·cs_bucket_demean(x, LogFloatCap)`;十分位内去均值;相对当日截面中位数 `A − cs_median(A)`;60 日位置对自己 241 日历史的 z 分数);状态(昨日 |r| 大于 / 小于自己 60 日波动时的 A 的条件中位数及两者之差 —— 大波动后是否反转、小波动后是否延续,即过度反应 / 反应不足的不对称);秩口径的慢版(cs_rank(A) 的 120 日均值 / 中位数、60 与 120 日标准差:本批 head 的同一个量放慢,作对照)。

    (5) 与库里已有的不同:库里 5583 条没有一条对 A 求位置统计(B097 的 19 条全是 A 的秩的短窗口离散度 / 差分);`cross_med` 套在日收益比上、cs_bucket_*、日频字段(LogFloatCap、ListAge)在 5583 条里 0 次出现(我逐条核对过 members.csv)。16 个种子的 skeleton_key 对照两个库全部骨架和本波各流快照里的 head 骨架,0 个相同;外围算子集合对照批里含 A 的 11 种外围,都不同。与本流 3 个 head 的区别:head 读 A 的秩在 ≤ 20 日内的离散度,这里读 A 的中位数(≥ 60 日);同一个 φ,前者(合成检验里)按 IC 看没有信息、后者有。

    (6) 为什么样本外还会在(以及最可能的失败):φ 取决于持仓构成、tick 价位、涨跌停与 T+1 制度,都是慢变量;窗口 60–241 日,每天只换 1/60–1/241 的样本,换手低(批里 head 的换手 0.14–0.24,这里预计 < 0.03),15 bp 不吃主体。最大的失败风险:φ 的真实截面离散度小于估计噪声(中位数估计的标准误约 1.57/√n,120 日约 0.14),那样分数 ≈ −成本;其次 φ 被流动性 / 市值控制吃掉(买卖价反弹是流动性的函数)。方向由 train 决定,我不预设。

    (7) 数学检查:无前视(全部用 t 日收盘及以前,窗口是尾随窗口,t+1 才交易;状态变量 |r_{t-1}| 与 60 日波动 t 日已知)。除以近零:r_{t-1}=0 时 A = ±inf(0/0 为 NaN);中位数与 cs_rank 是排序统计量,inf 只占端点、不传播;种子里没有 cross_mean / cross_stddev 直接作用在 A 上(作用在秩上的是有界量);cross_med 是低中位数(偶数个取较小的中间值),不插值,不会出现 inf − inf。窗口内多数日子为 ±inf 的票(极端低价、长期不动)中位数为 ±inf,这类票占比小,且只落在截面端点。热身:cross_* 窗口不满时按已有天数展开,241 日窗口前约 12% 的样本偏噪,噪声只会拉低分数;IPO 年(次新连续一字板)用 `ListAge > 250` 屏蔽,只在 1 个种子里作对照(其余不屏蔽,让搜索自己看这一块有没有用)。闸门:种子取值连续,本机合成立方体(80 只 × 420 日,含停牌与未上市)里 16 个种子覆盖率 0.96–0.97、无 inf、每日不同值比例 0.82–1.00(闸门要 ≥ 50%)。我对 cross_med 做过逐元素核对:与 numpy 低中位数 120 日滚动结果逐位相同。
