    reasons: '相关度表:核心 day_cov(Amt, Open) 与 head 1 的原始 |ρ| 0.081,与五个控制都在 0.11 以下,过 E 位的核心门槛(控制 |ρ| < 0.8)。P 类种子与 head 1 的原始 |ρ| 在 0.02 ~ 0.28 之间,最高的是 a7 cross_mean(abs_(P),60) 的 0.28(残差 0.39);与控制最近的是 a7 对 vol 0.63、a6 对 vol 0.57、a2 对 vol 0.56,都低于 0.8 的自动划掉线,没有种子被自动划掉。a14 与 head 1 的日度秩 |ρ| 只有 0.003(与 head 3 为 0.08);它的机制是 head 1 去尺度后的 20 日均值,与 R 组第 3 个变体同式,但不是换皮,保留。数学核对(读了 dt_day.py、common.py、dt_cross.py、nd_ts.py、ops_ext.py):P 的分母是正的 Ā·P̄,整日无成交时得 NaN 而不是 0 或 inf;cross_* 沿日轴向后取窗口,cross_ema 跳过缺失日,没有前视;没有用 ts_rank、cross_rank、in_rank_rolling,没有触发 nanrank_last 的 0 陷阱;没有禁用算子。PI 需要注意的放行项(不挡):(i) a6 的 cross_stddev 对全 NaN 窗口返回 0(用合成数据实测,common.py 的 nanstd_last),上市前股票日会得到 0;steer.py 的 long 版不剔除不可交易日,方向 −1 时这些票会占满多头十分位,稀释该方向的书(偏低估,不造假阳性),+1 方向不受影响;(ii) a10 的 cross_corr 对全 NaN 窗口同样返回 0(实测),有效对为 2 时返回 ±1,影响上市后约前 10 个交易日;(iii) 只有 a8 对 MV(日内涨跌)取了回归残差,a1 至 a7、a9、a12、a13 的 alpha 可能只是日内涨跌方向的慢变平均,而新尺子的五个控制里没有 MV,PI 应确认是否需要把它列入控制。如果它有 alpha,最可能来自:成交额加权价相对等权价的溢价 P 的跨日一致性,即知情买入追高或高位派发让成交偏在价格高位,是几周尺度的慢变参与者结构;若只剩 P 的幅度(a6、a7),最可能只是日内波动的代理。'
  - slot: b
