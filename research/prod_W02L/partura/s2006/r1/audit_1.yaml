    soundness: 4
    struck_seeds: []
    reasons: '相关度表:b 类种子与三个 head 的原始 |ρ| 最高 0.203(b3 对 head 1),多数在 0.1 以下;残差最高是 b8 对 head 1 的 0.385;与控制最高是 b8 对 rev 0.48、b12 对 size 0.30、b2 对 vol 0.30,都低于 0.8,没有自动划掉。创新度 4 的理由:回归元换成市场当天平均的对数活跃度 cs_mean(log(add(day_mean(Amt),1))),残差的 abs 与 b1 至 b14 的 abs_(ts_regres) 写法在 B016 批里的回归元都是个股自己的量;这个截面均值回归元是新的(PI 的 grep 结果,本步没有重核骨架)。数学核对:没有除法;log(add(·,1)) 的 +1 对 CNY 量级无影响;ts_regres / ts_regbeta 的 var_x > EPS 守护对市场对数活跃度的方差(约 1e-2)不会触发;cs_mean 只用当天有效值;没有 rank 操作;回归窗口的热身由 research.py 的 warmed_view 预加载前置数据后再裁掉(research.py:82-88),样本起点没有伪热身。PI 需要注意的放行项:(i) b6 的 cross_stddev 与 a6 同样的 0 填充问题(上市前残差为 NaN,窗口全 NaN 时返回 0),只在 −1 方向稀释多头书;(ii) b10 的 ts_corr 与 a10 同样的全 NaN 返回 0 和 2 点返回 ±1;(iii) b12 的 log(add(day_last(Amt),1)) 对单分钟成交额为 0 的票给 log(1)=0,远低于正常票的 log 值(约 11 到 16),残差绝对值会被零成交分钟主导;PI 自己写单分钟额「常为 0 或极小」,b12 的 liq 0.296、size 0.298 与此一致;R 组的 R10 同此问题;(iv) 上市后前约 10 个交易日回归窗口的有效对很少,count = 2 时残差精确为 0,影响面小;(v) b13、b14 的 15 分钟尾盘头与相邻流 2002、2005 是否同一个东西,快照只含本流 3 个 head,本步无法核对,交给 GP 库禁令。如果它有 alpha,最可能来自:特异的成交活跃度冲击(注意力或消息的痕迹,冲击退潮后价格压力回吐),以及它对市场成交额的载荷(流动性共同性,被指数或被动资金托着的票)。'
