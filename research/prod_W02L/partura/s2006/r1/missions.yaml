- type: E
  core: day_cov(Amt, Open)
  hypothesis: |-
    批里的现象(B016,16 个成员都是 sub(0.5, abs_(ts_regres(day_cov(F,F), day_last(F), 50))) 的变体,3 个 head 全是这个骨架):拆解里去掉 abs_ 的损失是 1.7 ~ 2.1(必要性 +2.06 / +1.99 / +1.73),去掉回归的损失 0.2 ~ 2.3;head 1 的窗口 25 / 50 / 100 是 −2.58 / −1.17 / −0.64(100 日时 valid +0.03),越慢越好;head 1 把 Open 换成 Close 分数不变(−1.17 → −1.19)。含核心 day_cov(Amt, Open) 的 4 个候选均分 −1.46,不含的 −2.30(差 +0.83,p 0.039)。

    机制:day_cov(Amt, Open) = (1/n)·Σ(Amt_t − Ā)(Open_t − P̄) = Ā·[成交额加权均价 − 等权均价](价格单位)。它是「尺度 × 方向」:尺度 = σ_Amt·σ_Open(日内成交额起伏乘日内价格起伏),方向与一致性 = 相关系数 ρ(Amt, Open)。head 1 换 Open 为 Close 分数不变,说明 head 里这个协方差主要承担的是前一个因子(尺度),那是 5 个控制和两个冠军的地盘;本 E 位要读被尺度盖住的另一块:这一天的钱是在价格偏高还是偏低的位置成交的(量价位置溢价)、这种倾向日复一日是否一致、它是不是当天涨跌方向的机械结果。

    算子怎样实现:P = div(day_cov(Amt, Open), mul(day_mean(Amt), day_mean(Open))) 把核心除以 Ā·P̄,得到无量纲的「成交额加权均价相对等权均价的溢价」,不再随股价和成交额水平走。每个种子都原样带核心,分五类。(1) 慢变水平:cross_ema(P, 40)、cross_tail_mean_q25(P, 60)(差日子的均值)、sub(cross_mean(P,10), cross_mean(P,120))(近期相对长期)。(2) 一致性与离散度:cross_ema(sign(核心), 30)(只看方向、不被幅度尾部支配;用 EMA 而不是均值,取值才是连续的)、div(cross_mean(P,60), cross_stddev(P,60))(P 的 t 统计量)、cross_stddev(P,60)、cross_mean(abs_(P),60)(幅度,对应批里 abs_ 的必要性)。(3) 去掉当天涨跌的机械成分:记 MV = (day_last(Close) − day_first(Open)) / day_first(Open) 为日内涨跌幅;cross_mean(ts_regres(MV, P, 60), 20) 是「P 里 60 日滚动回归对 MV 没解释的部分」的 20 日均值,cross_regbeta(MV, P, 100) 是「放量位置跟着当天方向走」的程度,cross_corr(核心, day_sum(Ret), 60),cross_mean(mul(P, sign(MV)), 40)(放量位置与当天方向同向时为正)。(4) 相对自己 / 相对同类:cross_mean(cross_zscore(P,120), 20);cs_bucket_zscore(cross_mean(P,60), cross_mean(day_std(Amt),30))(已知成交额族同一十分位内标准化,检验信息是不是该族的残余)。(5) 批内成功结构的无尺度版:cross_mean(div(abs_(ts_regres(核心, day_last(Amt), 100)), cross_mean(day_last(Amt), 100)), 20) —— 保留 head 1 的 abs_ 回归残差,窗口放到拆解里更好的 100,再除以自己 100 日尾盘单分钟成交额均值,变成相对大小,检验 head 1 的信息是不是全在尺度里。

    为什么和已有的不同:库里含这个核心的 10 条(B013 的 cross_max(核心,5)、B018 的 cross_fangzheng / cross_max 嵌套、B238 的 ts_regres(核心, day_ar1_coefficient(Open), 20)、B010 的 ts_regbeta(day_sum(Volume), 核心, 50)、B016 的 abs_ 回归)全是有量纲的原始协方差,没有一条除以 Ā·P̄(库里唯一的 div(day_cov(·,·), ·) 是 div(day_cov(Open, Volume), day_last(Open)),另一对字段、只除以价格);5583 条里没有 cross_ema / cross_zscore / sign(day_cov) / cross_regbeta(MV, P)。外围算子集合(cross_ema、cross_stddev、cross_tail_mean_q25、div、mul、day_mean、sign、cs_bucket_zscore、cross_regbeta、cross_corr 等)与快照里已见到的含核心写法({sub, abs_, ts_regres, day_last})完全不同;所有种子的骨架已逐个对照两个库的 5583 条(都不在库里)。P 是无量纲的有符号量,三个 head 是有量纲的残差幅度,日度秩相关预计低。

    为什么样本外还会在:如果有 alpha,最可能来自「成交发生在日内价格带的哪个位置」这个参与者结构:算法单(VWAP / TWAP)不会偏向某个价位,而知情买入的追高放量、或高位派发,会让成交额偏在价格高位或低位,是几周尺度上慢变的属性。种子都在 40 ~ 120 日上读,换手低,15 bp 成本不会把它吃掉;去掉了尺度和当天涨跌方向,5 个控制(流动性、波动、反转、已知族、市值)的暴露在构造上就小。风险:P 与当天涨跌方向高度相关(上涨日成交偏晚则溢价为正),所以放了回归残差版与方向交互版去分辨;如果样本内的好只来自某个行情段,min(train, valid) 会把它挡掉。

    数学检查:无前视(只用 t 日分钟,t+1 才交易,所有窗口只向后)。分母 Ā·P̄ 是正的成交额均值乘价格均值,没有近零分母;整天无成交时 Ā = 0 且协方差 = 0,得 0/0 = NaN(缺失,不是无穷);|P| ≤ CV(Amt)·σ_Open/P̄,有界(CV(Amt) ≤ √240)。一字板日(Open 恒定)P 是浮点噪声级的 0,不是爆点(分母不含 σ);只有 cross_zscore 与 div(均值, 标准差) 两个种子对「连续数十天一字板」的票会放大这种噪声,只影响这几只票,其余票的次序由 P 本身决定。cross_corr 在窗口内有效对不足时给 0(已知行为),只影响新上市 / 复牌的头几天;不用 ts_rank / cross_rank(当天缺失记 0 的已知问题)。窗口最长 120 + 20,热身约占 train 的 10%,只让这些日子无值。
