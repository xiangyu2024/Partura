- type: N
  hypothesis: |-
    批里的现象(B016):16 个成员的核心操作都是「一个日度量对另一个日度量做 50 日滚动回归,取最后一天残差的绝对值」。拆解:去掉 abs_ 的损失 1.7 ~ 2.1,窗口越长越好(head 1:25 / 50 / 100 = −2.58 / −1.17 / −0.64),把回归元里的价格 Open 换成 Close 分数不变,所以回归元里没有价格信息,只是一个「尺度匹配」的量。批里的回归元是股票自己当天的 day_cov(·,·)(有量纲,带成交额与股价水平),残差里混着系统部分(整个市场当天放量 / 缩量)与个股特异部分。head 1 与已知成交额族的秩相关是 −0.67,说明残差幅度带着成交额水平。

    新想法:把回归元换成「市场当天的同一个量」cs_mean(对数活跃度),并让被解释的量也取对数。于是 ts_regres 的残差 = 个股特异的活跃度冲击(无量纲,单位是对数),ts_regbeta / ts_corr = 个股成交额跟着市场成交额走的程度(流动性共同性,Chordia–Roll–Subrahmanyam 2000)。读法:冲击的幅度(abs 残差的均值,即 B016 的必要部件 abs_)、冲击的波动与偏度、带符号的异常特异活跃度、载荷与相关本身。预期:共同性高(成交额随市场同涨同落)的票偏机构化、被指数 / 被动资金托着;特异冲击大的票是注意力和消息驱动的票,Barber–Odean(2008)的结论是注意力驱动的买入之后价格压力回吐,而「特异冲击持续小」是被冷落的票。方向留给 train 决定。

    算子怎样实现:LA = log(add(day_mean(Amt), 1)) 是个股当日对数活跃度(day_mean 整天缺失时给 NaN,不是 0;+1 只防 log(0));LC = log(add(day_last(Amt), 1)) 是批里用的收盘最后一分钟;L15 = log(add(day_sum(in_slice(Amt, 226, 240)), 1)) 是尾盘 15 分钟成交额(单分钟成交额常为 0 或极小,15 分钟更稳);LT = log(add(day_mean(Volume), 1)) − LogFloatShares 是换手率口径(股数除以流通股本)。残差 = ts_regres(cs_mean(X), X, 100)。种子分四组:(1) 特异冲击幅度:cross_mean(abs_(残差(LA)), 20)(核心种子,就是 B016 的「abs_ 回归残差」,回归元换成市场)、cross_ema 的 30 日半衰期版、cs_bucket_zscore(·, LogFloatCap)(规模十分位内)、股数口径 LV(含名义股价维度)、换手率口径 LT(控制「大票放量」与「小票放量」的差别)。(2) 冲击的形状:cross_stddev(残差,60)(活跃度的特异波动)、ts_skew(残差,60)(尖峰倾向)、cross_mean(残差,10)(带符号的异常特异活跃度)。(3) 共同性:ts_regbeta(cs_mean(LA), LA, 120)、ts_corr(cs_mean(LA), LA, 120)、换手率口径的载荷。(4) B016 对象在尾盘上的推广:LC 的 100 日版、L15 的 150 日版,以及 cross_mean(abs_(ts_regres(LA, L15, 100)), 20)(被解释的是尾盘 15 分钟,回归元是当天总活跃度,是 head 1 的无量纲对数版)。

    为什么和已有的不同:我对 5583 条逐个 grep 过。(a) 没有任何一条把 cs_mean / cs_demean 的结果当 ts_regres / ts_regbeta / ts_corr 的回归元(含 cs_ 的 17 条 ts_corr(cs_rank(·),cs_rank(·)) 是日截面秩的相关,是另一个对象);(b) 没有 log(add(day_mean(·),1)) 的对数活跃度写法,没有 cross_mean(abs_(ts_regres(·))) 的平滑;(c) 批里 25 条 abs_(ts_regres) 的回归元全是个股自己的有量纲量;(d) LogFloatShares 做换手率分母在库里 0 次。所有种子的骨架已逐个对照两个库(都不在库里)。与三个 head 的关系:head 的残差是有量纲的幅度,与成交额水平高度相关;这里的残差在对数口径上去掉了水平和市场共同的部分,日度秩相关预计低。与波动控制可能有一定相关(特异活跃度的波动与收益波动同源),这由新尺子的残差化去掉。

    为什么样本外还会在:如果有 alpha,最可能来自注意力与持仓结构:特异的成交活跃度冲击是散户注意力和消息的痕迹,冲击退潮后价格压力回吐(Barber–Odean 2008);共同性高的票有机构 / 被动资金托底。两者都是 60 ~ 150 日尺度上慢变的属性,换手低;而且去掉了整个市场放量缩量带来的行情依赖(cs_mean 就是市场成分)。风险:特异冲击与新闻日、涨跌停日重合,若只是涨跌停的替代品,min(train, valid) 与 20 日反转 / 波动控制会把它挡掉。

    数学检查:无前视(cs_mean 只用当天截面,回归窗口只向后,含今天);LA、LC、L15 在整天缺失时是 NaN,回归时按配对有效日剔除,不是 0 填充;窗口内有效对 < 2 时 ts_regres / ts_regbeta 给 NaN;回归元方差是市场对数活跃度的方差(约 1e-2 量级),远大于 EPS = 1e-9,没有近零分母;ts_corr 窗口内有效对不足时给 0(已知行为),只影响新上市 / 复牌头几天;不用 ts_rank / cross_rank(当天缺失记 0 的已知问题);LT 里 LogFloatShares 缺失的票整条为 NaN(没有填充);没有除法。窗口最长 150 + 20 = 170 日,热身约占 train 的 12%,只让这些日子无值,不会主导排序。
