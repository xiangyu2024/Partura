- type: N
  hypothesis: 批里的现象(M3 + 共性表):day_cov(Amt, Amt) 子树在 11 个含它的候选里均分 -0.70 对 -2.68(+1.98,p<0.001),说明「日内分钟成交额的离散度」这个读数有
    alpha;但它的原始写法是方差 = 成交额水平² × 集中度²,水平部分正是新尺子要扣掉的流动性 / 市值暴露,heads 能到 ~0 是因为多层时间聚合把水平慢变量的影响稀释,train
    仍然差。新想法:把「水平」与「形状」拆开,只读形状:变异系数 CV = day_std(Amt) / day_mean(Amt) 与 CV² = day_cov(Amt,
    Amt) / 均值²(无量纲,日内成交额有多集中在少数几分钟 = 脉冲交易 / 算法拆单程度的代理),再用不同的无量纲形状量:峰均比 day_max(Amt)
    / day_mean(Amt)、分钟成交额一阶自相关 day_autocorr_n1(Amt)(成交的持续性 / 拆单)、CV(Amt) 减 CV(Volume)(差别
    = 价格分钟间变化与成交量的交互,即成交价位的离散)、CV 的 120 日波动、20 日对 241 日的变化、日内 CV 与量价协方差归一(第 1 轮 R
    已有无量纲 P,这里放进分桶)。所有形状量先在 120 ~ 241 日取慢统计量(cross_mean / cross_fangzheng / cross_stddev
    / cross_max),再在 LogFloatCap(日频叶子)/ 对数名义价格 / 已知族 K30 的十分位内标准化,最后个别再嵌套一层市值分桶。为什么和库里不同:库里
    5583 条表达式里没有任何一条把 day_cov / day_std 除以 day_mean 的均值去尺度(全部是原始方差、协方差),没有 cs_bucket_*,没有日频叶子;所以这是库里没有的「去水平、只读形状」。分母用
    add(day_mean(Amt), 1) 避免停牌日 0/0(成交额的单位是元,+1 可忽略)。与 M3 head 的区别:M3 head 是 3 日最大方差的
    241 日 mean+std(随水平变),这里是 CV(无量纲,与水平正交),日度秩相关预期 < 0.5。机制:脉冲式成交(集中在少数分钟)的票是散户 /
    题材 / 事件驱动,慢变量读的是这类票的持续属性;已知长周期换手与彩票 / 注意力效应(Baker-Wurgler 情绪型股票)会让这类票的多头腿净超额偏低或偏高,持续在样本外。风险:去掉水平后可能没有
    alpha(第 1 轮 R:除以自己的收盘棒均额 -3.14,说明在那个对象上水平承重),这是本位要检验的:若形状版明显差于 M3 水平版,说明 M3 的
    alpha 在水平上、与新尺子扣掉的重合。数学检查:无前视;分母 +1 防 0;CV 在分钟全缺失的日子为 NaN(cross_mean 忽略);窗口不满头一年为热身噪声;CV²
    值域可达几十但不是 inf,排序不被爆点支配(分桶 z 分数在重尾时桶内由极端值主导,已在 R 里的类似写法对 sqrt / log 不敏感,所以不另处理)。
