slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: []
    reasons: '创新度 3。核心 abs_(ts_regres(day_cov(Amt, Open), day_last(Amt), 100)) 就是 head 1 的子树,核心对 head 1 的原始秩 |ρ| 为 0.73、残差为 0.80(相关度表),所以核心本身不新;新的是外围:把 Z 在 120 到 241 日上做聚合(cross_mean、cross_med、cross_tail_mean_q25、cross_max、cross_stddev、cross_ema、cross_zscore)并换分桶键(已知族、对数价格、复合键、B017 键、市值、120 日均额)。seed 6、7、8、13、14 的残差对全部 head 都不超过 0.16,是真正的新结构;seed 1 到 5、9 到 12、15、16 的残差对 head 1 为 0.45 到 0.75,保留了 head 1 的非控制成分,所以给 3 而不是 4。控制:核心对 5 个控制的原始 |ρ| 最大为 0.63(流动性),低于 0.8,过 E 位的控制门。合理度 3。算子核对:ts_regres 是 rolling_ols 的残差,第二参数 day_last(Amt) 对第一参数 day_cov(Amt, Open) 回归,与计划写的方向一致;cs_bucket_zscore、cross_zscore 的输出有界(z 类至多约 √n),cross_corr 在 [-1, 1] 内,cs_regres 的 mask 正确;不用 ts_rank、cross_rank、in_rank,cs_rank 对缺失返回 NaN 而不是 0,nanrank 陷阱不会进来;无前视。数学上唯一要标的是 seed 6:分母 cross_stddev(·, 120) 是总体标准差,窗口只剩一个有效值时为 0,分子非零则给 ±inf、为零则给 NaN(取决于浮点残差),只会出现在上市后第二个有效日和长停复牌的票上,不会主导截面,但打分前要把 ±inf 当缺失。三条叙述问题把它压到 3:(1) 上交所收盘集合竞价 2018 年 8 月 20 日起才实施,120 到 241 日窗口在 2018 下半年到 2019 年跨过这个切点,SH 股票的收盘棒口径前后不同,Z 会出现板块级的水平移动,计划里 更早的窗口落在热身里 没有覆盖这一段;(2) 计划里写的 R1 结果显示回归元几乎不承重(换成市场均额分数不变),所以实际测的是收盘棒成交额相对自身趋势的偏离(元量级),不是 对协方差的残差,机制要改写;(3) seed 16 的 cross_max(·, 60) 是单日事件统计,与 持续参与 的机制不一致。划掉 0 条:没有种子满足自动划掉条件(原始 |ρ| 对 head 最高 0.52,对控制最高 0.77,均未到 0.7 与 0.8),也没有种子是数学问题或换皮;seed 5 残差对 head 1 为 0.75,但它把窗口拉到 120 日并加了市值分桶,不是换皮,留着。如果它有 alpha,最可能来自收盘集合竞价中的持续参与结构(指数与被动资金按收盘价对齐),在数月尺度上慢变、换手低,而不是收盘价位置本身。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [12]
    reasons: '创新度 4。新的是时点与回归元:被解释量改为开盘集合竞价那一根(day_first(Amt)、day_first(Volume)、开盘 5 与 15 分钟、全日最大分钟),并用隔夜跳空幅度 abs(div(day_first(Open), ts_delay(day_last(Close), 1)) − 1) 作回归元(seed 11、13、14)。除 seed 12 外,原始秩 |ρ| 对 head 都不超过 0.42(seed 10 对 head 2 为 0.39);|gap| 回归元没有任何 head 用过。残差对 head 1 最高的几条(4、5)在 0.56 到 0.57 之间,说明开盘版与收盘版仍共享一部分成交额偏离的成分,所以不给 5。seed 15(开盘 z 减 0.5 倍收盘 z)残差对全部 head 仅 0.06,是最干净的一条。控制:最大 |ρ| 是 seed 13 对已知族的 0.53,都在 0.8 之下。合理度 4。机制清楚:开盘集合竞价承载隔夜信息,跳空幅度解释不了的开盘成交额偏离是信息型参与的代理,并且与收盘版有可证伪的对照(seed 15 把两者差分)。算子核对:跳空的分母是正的昨收,没有近零分母;ts_delay 在首日与停牌后给 NaN;ts_regres 的残差有界(量级是窗口内 y 的标准差乘 √n,由 Cauchy–Schwarz 得到),回归元方差很小时不会爆,只在 var 不超过 1e-9 时给 NaN;开盘集合竞价两个板块全窗口都有,所以这一位不碰收盘口径切换,比 E 位干净。要标的三点:(a) seed 3 与 8 的回归元包含了被解释量(day_sum(Amt) 含 day_first(Amt) 或 in_slice 段),残差实际是开盘段占全日份额的线性伪装,计划里写的 没有除以日总额的份额量 不准确,机制要改写,但不足以挡;(b) seed 5 的 day_max 在多数日子落在收盘那一根,与 head 1 的被解释量有重叠;(c) seed 1 到 10 的回归元仍是 day_cov(Amt, Open),与 E 位同样的 回归元不承重 问题。划掉 seed 12:它的被解释量仍是收盘棒 day_last(Amt),不是这一位要测的开盘版,不符合这一位的 idea;同时它与 head 1 的原始秩 |ρ| 为 0.67(离库禁令阈值 0.7 只差一点)、残差为 0.74,分桶键与被解释量都与 head 1 相同,只换了回归元 abs(day_sum(Ret)) 与窗口 200;按计划里 R1 的结果回归元不承重,这是换皮。如果它有 alpha,最可能来自隔夜信息在开盘集合竞价的消化:开盘成交额偏离跳空幅度的部分,反映信息型与被动型参与者的持续差异,最站得住的是 seed 11、13、14。'
R:
  - head: 'sub(0.5, cs_bucket_zscore(abs_(ts_regres(day_cov(Amt, Open), day_last(Amt), 100)), cross_mean(day_std(Amt), 30)))'
    soundness: 3
    reasons: '合理度 3。变体只动窗口(150 到 400)、分桶键(已知族、day_std、120 日均值、市值二层)、变换(sqrt、log(1+|r|)、分桶秩)和被解释量(Close 替 Open),算子层面没有 §4 的陷阱:sqrt 与 log(1+x) 对元量级的 |残差| 安全,cs_bucket_rank 不含 nanrank 问题,分桶 z 有界;无前视。扣分的三点:(1) 窗口 200 到 400 跨过上交所 2018 年 8 月 20 日的收盘集合竞价切点,与 E 位同一个口径问题;W=300、400 在 train 前段是否已满取决于数据起点,计划写的 2018 年前一年为热身 需要核对;(2) 计划里的 R1 结果显示回归元不承重,这些变体实际检验的是收盘棒成交额偏离的水平与分桶,机制故事应改写,不是 回归残差 的信息;(3) 变体与 head 1 的原始秩 |ρ| 在 0.54 到 0.87 之间,大多是同一对象换窗口与键,不是新机制。如果它有 alpha,最可能来自收盘棒异常量的水平(相对同伴的收盘参与强度),而不是回归残差本身。'
  - head: 'cross_min(cross_min(day_cov(Low, Ret), 15), 15)'
    soundness: 4
    reasons: '合理度 4。计划的恒等式近似成立:Σ(P_t − P̄)ΔP_t = (P_n − P_0)(P_mid − P̄) + ½ΣΔP²,而 day_cov(Low, Ret) 中 Ret 是相对收益、Low 近似价格,所以 day_cov(Low, Ret) ≈ ½ × 价格 × 日内已实现方差 + 方向项,名义价格与方差的混合是真的。变体只在规模或价格的十分位内做 z(有界、无除以近零),无 §4 陷阱,无前视,也不依赖收盘棒口径(全分钟协方差)。两点要记:(1) 外层 cross_min(cross_min(·, 15), 15) 实际跨 29 个交易日(嵌套),不是 15 日;(2) 变体 3(市值分桶)与原 head 的原始秩 |ρ| 为 0.88、残差 0.90,变体 2 为 0.78,分桶只改了一小部分排序,去掉规模 的修法力度有限,计划应承认只换掉了 head 的一个成分。变体 2、3 对流动性与波动控制的 |ρ| 在 0.40 到 0.46,要留意是否又变回控制。如果它有 alpha,最可能来自 安静日 的状态:近 29 日里价格乘方差最低那一天的相对位置,是低波动、慢漂移的一种度量,而不是规模本身。'
summary: 'a 位过审(创新 3、合理 3,16 条全留);b 位过审(创新 4、合理 4,划掉 seed 12 为换皮且不符合开盘版的 idea);R1 合理 3(窗口跨 2018 年 8 月收盘口径切点、回归元不承重);R2 合理 4(恒等式成立,但变体 3 与原 head 的秩相关仍有 0.88)。'
