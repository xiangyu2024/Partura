- type: N
  hypothesis: '批里的现象(B016):16 个成员的骨架一模一样,都是「某个日度量对日度协方差做滚动回归,取最后一天残差的绝对值」,而且**被解释的量 y 全是 day_last(·)(收盘棒:Amt / Volume / Ret)**。整个库 85 条含 ts_regres 的表达式里,y 是开盘棒 day_first(Amt) 或含 in_slice 一段的 0 条,cs_bucket_* 0 条,日频叶子 0 条。第 1 轮 R 组的结果:这台「回归残差的绝对值 → 同伴内分桶 → 慢」的机器在 y = 收盘棒时是本种子里唯一接近 0 的东西(分桶后 W = 100 / 200 为 −0.48 / −0.21,valid +0.23 / +1.46,与已知族 |ρ| 0.01);回归元不承重(换成市场收盘棒均额分数不变),y 才是。


    新想法:收盘棒只是一天里两个**价格发现的拍卖点**之一,另一个是开盘(minute 0 = 集合竞价成交)。开盘集合竞价承载隔夜信息(新闻、跳空),收盘集合竞价承载组合再平衡与基准对齐;两处「持续的异常参与」读的是不同类型的参与者(信息型 vs 被动型)。本位把同一台机器换到别的时点:

    (1) y 换开盘棒:day_first(Amt)、day_first(Volume)、开盘 5 分钟 day_sum(in_slice(Amt, 1, 5))、开盘 15 分钟、全日最大一分钟 day_max(Amt);回归元用批里的 day_cov(Amt, Open) 或当天总成交额 day_sum(Amt)。

    (2) 回归元换成「新闻解释的部分」:开盘棒成交额对隔夜跳空幅度 |开盘 ÷ 昨收 − 1| 回归,|残差| = 无新闻的开盘参与;收盘棒对当天 |涨跌| 回归,|残差| = 与当天价格变动无关的收盘参与。

    (3) 窗口 100 ~ 300、同伴键换已知族(对照)/ 对数名义价格 / 复合键,以及时间聚合(cross_mean(·, 60 ~ 120))、带符号的残差聚合(cross_mean(残差, 60),读的是开盘参与高于还是低于回归线)、开盘减半个收盘的对比。

    这是个可证伪的检验:若开盘版与收盘版同量级,说明机制是「拍卖点参与强度」;若开盘版明显更差,说明 B016 的信息是收盘特有的,下一轮在收盘上继续深挖。


    算子怎样实现:骨架统一为 cs_bucket_zscore(abs_(ts_regres(x, y, W)), 键),其中 y、x 如上;例:cs_bucket_zscore(abs_(ts_regres(abs_(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1)), day_first(Amt), 200)), cross_mean(day_std(Amt), 30)) 读的是「开盘棒成交额中跳空幅度解释不了的部分的大小,在成交额离散度相近的同伴里谁长期更大」。day_first(Open) 是第 0 根(集合竞价那一根)的开盘价,ts_delay(·, 1) 是前一交易日。


    为什么和已有的不同:库里 y 全是收盘棒(见上),没有开盘棒 / 开盘段 / 最大分钟的版本,没有对跳空幅度的回归,没有分桶,没有日频叶子(5583 条里这些都是 0);这 15 个种子的骨架已逐个对照两个库(都不在库里)。与已有 head 的区别:head 的 y 是收盘棒,这里除一个对照种子(收盘棒对 |涨跌| 回归)外 y 都是开盘 / 开盘段 / 最大分钟,与 head 的日度秩相关预期 0.2 ~ 0.5(两个时点的成交额都带水平,分桶后主要共享「相对离散度的强度」);与流 2005 的「收盘份额」类不同,这里没有任何除以日总额的份额量。


    为什么样本外还会在:两个拍卖点的持续异常参与是参与者结构的属性(谁在开盘 / 收盘集中成交),几个月尺度上缓慢变化,窗口 100 ~ 300 日换手低;开盘版若成立,来源是隔夜信息交易的持续性(Cao–Ghysels–Hatheway 的开盘前价格发现),分桶去掉了成交额水平,|残差| 去掉了跳空本身。风险:开盘棒成交额与已知族共线(分桶救不回时 ρ_known 会高),开盘棒在涨停 / 一字板日几乎为 0 或极大;与收盘版一样可能 valid 好 train 差。


    数学检查:无前视(只用 t 日及以前,t+1 交易;ts_delay(day_last(Close), 1) 是昨收)。day_first 在整天缺失时为 NaN;回归窗口按有效对剔除,有效对 < 3 时为 NaN 或 0,只影响上市头几天;|开盘 ÷ 昨收 − 1| 的分母是昨收(正的价格),没有近零分母;分桶键同上;不用 ts_rank / cross_rank;没有除以日总额。一字板日开盘价恒等于昨收时 |跳空| 是 0,不是爆点,只是回归元取 0。窗口最长 300 日,热身落在 2018 年,按已有日子计算(不是 0 填充)。'
