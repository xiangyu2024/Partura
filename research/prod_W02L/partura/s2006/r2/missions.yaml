  hypothesis: '批里的现象(B016 + 第 1 轮 R 组的实测,都是样本内读数):B016 的 head 是 sub(0.5, abs_(ts_regres(day_cov(Amt, Open), day_last(Amt), W))),即「收盘棒成交额对当天的量价协方差做滚动回归,取最后一天残差的绝对值」。第 1 轮 R 组的结果:(1) 越慢越好,不分桶时 W = 50 / 100 / 150 / 250 为 −1.17 / −0.64 / −0.29(valid +0.76)/ −0.46(valid +1.06);(2) 回归元几乎不起作用:换成市场当天收盘棒均额 cs_mean(day_last(Amt)) 得 −0.59,和 −0.64 一样;(3) 除以自己的收盘棒均额变成无量纲则崩到 −3.14,所以承重的是 |残差| 的**水平**(相对同伴),不是「相对自己的偏离」;(4) 用已知成交额族 cross_mean(day_std(Amt), 30) 的十分位做同伴内标准化后,与已知族的 |ρ| 从 0.6 掉到 0.01、与流动性控制从 0.6 掉到 0.03,分数反而从 −0.64 升到 −0.48(valid +0.23);该 head 现在就是这个分桶版,W = 200 时 −0.21(train −0.21 / valid +1.46)。train 是瓶颈,日度单值噪声大。


    核心取 abs_(ts_regres(day_cov(Amt, Open), day_last(Amt), 100)),也就是上面那个每天一个值的 |残差| 序列 Z_t(窗口固定在 100)。本位不再动窗口(那是 R 组的事),而是在 Z_t **外面**试它的时间聚合、同伴键和动态读法,三类:

    (a) 时间聚合 + 同伴内标准化:cross_mean(Z, 120 / 241)、cross_ema(Z, 60)、cross_med(Z, 120)(稳健水平)、cross_tail_mean_q25(Z, 120)(「最安静的日子」的水平,持续存在的收盘参与的下限)、cross_max(Z, 60)、cross_stddev(Z, 120),外面再套 cs_bucket_zscore。

    (b) 换同伴键:已知成交额族(对照)、对数名义价格 sub(LogFloatCap, LogFloatShares)(= 流通市值 ÷ 流通股本的对数,库里一次都没出现的日频叶子)、复合键 sub(sub(LogFloatCap, LogFloatShares), LogFloatShares)、B017 批的 cross_mean(cross_min(day_cov(Low, Ret), 15), 60)(价格 × 波动的「底」,把第二个批的对象当同伴键用)、120 日均额(流动性)、已知族再嵌套市值;另有一个不用分桶的线性写法 cs_regres(cs_rank(慢 Z), cs_rank(已知族))。

    (c) 动态与耦合:均值 ÷ 标准差(无量纲,持续性)、近 20 日对 241 日之比(收盘异常是否在加剧)、相对自己 120 日历史的 z 分数的 40 日均值、Z 与当日成交额离散度 / 当日 |涨跌| 的 120 日相关(异常收盘流是出现在放量日 / 大波动日,还是与当天无关)。相关类种子外面乘了上市天数闸门 is_gt(cross_age(day_last(Amt)), 120)(次新股窗口内有效对太少,相关系数会被推到 ±1,闸门让它们落在 0 即中段)。


    算子怎样实现:每个种子都原样含核心。聚合类写成 cs_bucket_zscore(cross_mean(核心, 120), 键),意思是「在键值相近的同伴里,谁的 |残差| 长期更大」;cross_stddev / cross_med / cross_tail_mean_q25 / cross_max 换的是聚合统计量;div(cross_mean, cross_stddev) 里量纲抵消。


    为什么和已见的不同:快照里含这个核心的写法,外围只有 {sub(0.5, ·), cs_bucket_zscore, cross_mean(day_std(Amt), 30)} 作用在单日值上。这里的外围算子 cross_mean / cross_ema / cross_med / cross_tail_mean_q25 / cross_max / cross_stddev / cross_zscore / cross_corr、cs_regres / cs_rank、cross_age 与日频叶子 LogFloatCap / LogFloatShares、B017 的 day_cov(Low, Ret) 都没有出现过。5583 条库表达式里 cs_bucket_* / cross_zscore / cross_ema / cross_tail_* / 任何日频叶子都是 0 条;所有种子的骨架已逐个对照两个库(都不在库里)。与已有 head 的区别:head 是单日 |残差| 的已知族分桶,这里是 120 ~ 241 日的聚合量,换了同伴键后分桶边界也不同,日度秩相关预期 0.4 ~ 0.65;与控制的关系由分桶或无量纲化压低。


    为什么样本外还会在:收盘棒含收盘集合竞价(深交所 2006 年起,上交所约 2018 年 8 月起;更早的窗口落在热身里),这是被动 / 机构按收盘价对净值申赎与基准对齐的集中成交点,也是 Hillion–Suominen 所说的操纵收盘价的动机点。「相对同样成交额离散度的同伴,收盘棒成交额(残差)长期偏大」读的是持续的收盘参与强度,是几个月尺度上缓慢变化的持仓结构属性:聚合窗口 120 ~ 241 日,换手低,15 bp 成本吃不掉;去掉水平与同伴后与 5 个控制 + 两个冠军的暴露小。风险:valid 强于 train(+1.46 对 −0.21)说明有体制依赖,min(train, valid) 会把只在 2023 年以后成立的东西挡掉。


    数学检查:无前视(窗口只向后、含当天,t 日收盘后算出、t+1 才交易)。ts_regres 在窗口内有效对不足 3 个时为 NaN 或 0(两点完美拟合),只影响上市头几天(|残差| 落在最底部,不是爆点)。分母只出现在 div(均值, 标准差) 与 近 20 日 ÷ 241 日 两个种子,分子分母同量纲同来源,标准差只在窗口内仅 1 ~ 2 个有效日时为 0(得 NaN),不是近零爆点。cs_bucket_zscore 在同伴不足 2 只时给 NaN;cs_regres 先对两边取 cs_rank,无量纲爆点。不用 ts_rank / cross_rank(当天缺失记 0 的已知问题)。引擎对窗口不满的头几天用已有日子计算(不是 0 填充),2018 年前一年是热身噪声,最长窗口 241 + 100 日。'
