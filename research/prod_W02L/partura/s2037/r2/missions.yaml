- type: N
  hypothesis: '来自 B110 / 本组第 1 轮的现象:第 1 轮唯一过线的 head 不是任何水平或离散度,而是「成交量时间形状 x 成交额水平」的 60 日相关(+0.60),说明承重的是形状与规模的耦合(一种弹性 / 凸性),而不是某个形状指标自己。B110 的 12 条手写库(静默分钟的平均成交额 / 全天均值)全部 -1.5 到 -1.8,说明单看形状水平没用;本位把耦合读法推广到不同的形状读数与不同的规模量。

    机制:对每只股票,在 60 日内看「日内成交越集中(基尼系数 / 质心偏晚 / 峰值占比 / 有效带宽)的日子,是不是同时成交额更大 / 波动更大 / 收益更正」。正耦合 = 放量日靠少数几分钟推动(事件 / 机构脉冲);负耦合 = 放量日反而更摊平(多方参与、做市吸收)。这是参与者构成与盘口深度的慢属性。算子实现:day_gini / day_centroid / day_at_max_ratio
    / day_es_ratio_hi / energy_ratio_n 作形状读数(在 delete_open_close 之后的分钟轴上),day_sum(Amt) / log(day_sum(Amt)) / day_std(Ret) / day_sum(Ret) / |Ret| 的基尼系数作规模量,cross_corr / cross_regbeta / cross_regres 作耦合,部分外面套
    cross_ema 20。

    和库里不同:库里与这个耦合有关的写法只有谱算子 S 一个形状读数,且 S 的耦合已被核心占据;这里换成非谱的形状读数(基尼系数、质心、峰值占比)和另外的耦合对象(波动、收益、价格路径的基尼系数),骨架不在 5583 个库骨架里。无量纲、有界,窗口 60 日,热身期是 NaN,不是填充值;day_zero_ratio(Ret) 在停牌 / 涨跌停日取 1 属真实状态。样本外理由:慢变量、换手低、无量纲、不依赖行情段。风险:与成交额族相关度仍高,被控制吃掉。'
