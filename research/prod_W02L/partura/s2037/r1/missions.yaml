  hypothesis: '机制(只用本批快照里的数字):三个 head 都是 cross_stddev(S, 20),S = energy_ratio_topm_minus_q(delete_open_close(Volume), m, q, False):对当天分钟成交量(去掉开盘 / 收盘几根)做 FFT,按功率排序,取排名 q..m 的谱线能量占总能量的比例。q=5 时被去掉的通常是直流分量加最低频的两对谐波(日内 U 形的主体),所以 S 读的是「U 形之外,成交量在中频上有多大的团块」,无量纲、只依赖时间形状(拆解表里 Volume 换 Amt 分数基本不变:−0.86→−0.90、−0.98→−0.92)。核心取 S(50, 5),是 head 2 的内层子树;它单独与已知族 ρ = 0.52,低于 0.8。


    库里 S 家族 18 条只有三种外壳:原值、cross_mean(·, 20)、cross_stddev(·, 20),全是日轴上的「水平」或「二阶矩」。拆解表给出三条事实:(1) 只有离散度活下来(原值 −4.1;20 日均值与 Ret 底的版本都进不了前三);(2) 总体偏慢更好(cross_stddev 窗口 20→40:(50,5) 从 −0.98 到 −0.58,(50,10) 从 −1.69 到 −1.08;(20,5) 的 train 也从 −0.86 到 −0.61,只有它的 valid 反而变差 −0.81→−1.44;缩到 10 在 (20,5)、(50,5) 上更差),说明承重的是 S 在时间上的不稳定,而 15 bp 成本下的换手是主要损耗;(3) 离散度与已知成交额族的 ρ 在 −0.30 ~ −0.45,接近 0.5 的上限,即 head 有一部分是已知族的亲戚。


    本位把同一个 S 序列读成别的东西,外围只用日轴(慢)算子,窗口 60 ~ 120 日、EMA 半衰期 10 ~ 20 日:

    (a) 自我相对:cross_zscore / cross_madz / 快慢 EMA 之差,即「近期的团块度相对这只股票自己的常态」,把持续的个股水平(与流动性相关)扣掉;

    (b) 扣掉当日价格动作后的团块:cross_regres(day_std(Ret) 或 |day_sum(Ret)| 或 log(day_sum(Amt)), S, 60)(S 对它们回归的残差)再做 EMA / 均值 / 标准差,以及回归斜率 cross_regbeta。成交团块若伴随价格大动,多是信息性成交,会被尺子里的波动控制吃掉;没有价格动作的团块更像机械成交(算法拆单、被动 / 指数资金、大宗),是尺子之外可能留下的部分;

    (c) 与价格的协动:cross_corr(S, 当日收益 / 前一日收益 / |当日收益| / log 成交额, 60),即团块出现在上涨日还是下跌日、追涨之后还是放量日;

    (d) 稳健离散度:变异系数(std / mean,去掉水平)、75% 与 25% 分位尾均值之差、上行 / 下行半离差。


    为什么和已有的不同:库里与这个核心有关的写法只有上面三种外壳,没有回归残差、z 分数、相关、尾均值、半离差;16 个种子的骨架全部不在两个库的 5583 个骨架里(已逐个对照 struct/members.csv 的骨架集)。(b)(c) 引入了当日收益 / 成交额,(a)(d) 去掉了水平,所以与三个 head 的日度秩相关预期都低于 0.7。

    为什么样本外还会在:来源是「谁在交易」的慢变量(算法拆单 vs 散户脉冲、被动资金占比),是持股结构与执行方式的指纹,不依赖某段行情;每个种子要么以这只股票自己为参照,要么窗口 ≥ 60 日,换手低。我对它的信心不高,最可能的失败是读数仍是流动性 / 已知族的亲戚,被控制吃掉。


    数学检查:S 落在 (0, 1),分母是整天的总功率(停牌日成交全空则为 NaN),没有除以近零的爆点;cross_zscore 的分母是 60 日标准差 + EPS,只在 S 整段不动时放大,而那种情形 S 本身是 NaN;cross_regres / cross_regbeta 在回归元方差近 0 时返回 NaN;变异系数的分母 cross_mean(S, 60) 是 (0, 1) 内的 60 日均值,不会接近 0。所有窗口 ≤ 120 日,热身期是 NaN,不是填充值。无前视:只用 t 日收盘及以前的数据,t+1 才交易;ts_delay(day_sum(Ret), 1) 是滞后一天,不是超前。'
