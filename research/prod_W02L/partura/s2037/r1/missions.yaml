- type: N
  hypothesis: "批里的现象(B109,18 条,全部来自手写库):energy_ratio_topm_minus_q 这个谱算子只被喂过两个底,Volume 和有符号的 Ret(各 9 条),外壳只有原值 / 20 日均值 / 20 日标准差。Ret 底没有一条进入前三;Volume 底里只有 20 日标准差存活,而且越慢越好(窗口 20→40 把 (50,5) 从 −0.98 推到 −0.58)。没有任何一条把它喂给 |Ret|、振幅或异常成交量路径,也没有把两个谱读数放进同一个表达式里互相比较。\n\n机制:同一个无量纲的谱读数 S[x] = 「去掉最强 5 根谱线(通常是直流分量与最低频两对谐波)之后,排名 5 ~ 50 的谱线占总能量的比例」,在两条路径上各读一次:\n - S_V = S[Volume]:成交量路径在中频上的团块度;\n - S_R = S[|Ret|]:价格运动(波动)路径在中频上的团块度。\n成交稀薄的股票两者都高(一天只有几笔成交,成交量与 |收益| 都是「零加少数尖峰」),所以各自的水平主要是稀薄度,这正是新尺子用流动性 / 已知成交额族去掉的东西。但两者的差与协动把共同的稀薄度约掉,读的是失配:成交量成团而价格没有跟着动(被盘口挂单吸收:算法拆单、冰山、被动 / 指数资金、大宗),还是价格跳动而成交没有成团(薄盘口跳价、散户投机)。前者是机构 / 被动参与的指纹,后者是散户 / 彩票型需求的指纹,都是慢变量;方向我不预设,由 GP 按 train 定。\n\n算子怎样实现(16 个种子,骨架全部不在库里,已逐个对照 struct/members.csv 的 5583 条骨架):\n (1) 差:sub(S_V, S_R) 外套 cross_ema 20 / cross_mean 60 / cross_stddev 60 / cross_ema(cross_zscore(·, 60), 20);\n (2) 协动与失配回归:cross_corr(S_V, S_R, 60)、cross_regres(S_R, S_V, 60)(S_V 扣掉 S_R 以后的残差)再 EMA、cross_regbeta(S_R, S_V, 60)、两个 60 日均值之比 cross_mean(S_R, 60) / cross_mean(S_V, 60);\n (3) 新底:S_R 单独(60 日均值 / 60 日标准差)、振幅路径 (High − Low) / Vwap 的谱读数、异常成交量路径 Volume / cross_mean(Volume, 20) 的谱读数(把日内 U 形除掉,直接读异常那部分的团块度)以及它与 S_R 的差;\n (4) 另一个谱读数:energy_ratio_n(·, 0.9, False)(累计到 90% 能量需要多大比例的谱线,即有效带宽),Volume 与 |Ret| 之差,60 日均值 / 120 日稳健 z 再 EMA。\n\n为什么和已有的不同:库里没有任何表达式把谱算子喂给 |Ret| / 振幅 / 异常成交量,也没有两个谱读数的差、回归、相关或比值;与三个 head 的区别不止是换了一个外壳,而是读的对象从「成交量自己的团块」变成了「成交量相对价格运动的失配」。S_R 一条腿被减掉,所以与三个 head 的日度秩相关预期低于 0.7。\n为什么样本外还会在:这是参与者构成与盘口深度的慢属性(窗口 60 ~ 120 日,EMA 半衰期 20 日,换手低);两条腿都无量纲,与价格水平和市值无关,不是某段行情的产物。我对它的信心不高,最可能的失败是 S_R 并没有把 S_V 里的稀薄度约干净,差仍带着流动性。\n\n数学检查:所有谱读数落在 [0, 1];涨跌停封死或整天不动的日子 |Ret| 全为 0,S_R 恰好等于 0(分子分母都是 0,分母带 1e-12,所以是 0 而不是 NaN),这是真实状态而不是伪影,但这些日子会在 60 日均值里留下零;唯一的除法是两个 60 日均值之比,分母 cross_mean(S_V, 60) 是 (0, 1) 内的均值,远离 0;cross_zscore / cross_madz 的分母在序列不动时放大,但那种情形序列本身是 NaN。所有窗口 ≤ 120 日,热身期是 NaN,不是填充值。无前视:只用 t 日收盘及以前的数据,t+1 才交易。"
