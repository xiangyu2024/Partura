    S、日内低价方差 day_var(Low)、成交额水平或另一个定位量,做 60 日 cross_corr / cross_cov / cross_regbeta。机制:放量或高团块的日子里,成交峰值更靠近开盘还是收盘,反映信息冲击(开盘集中)与指数
    / 机构再平衡(尾盘集中)的混合比例随活跃度的变化,是参与者构成的慢属性;day_argmax 是整数分钟位置,与 S 的谱读数、成交额性质不同,协动测的是时序结构而不是水平。和库里不同:库里只有
    day_argmax 的 ts_sum / ts_var 单变量写法和 cross_cov(day_var, day_argmax) 一个双变量写法,没有
    day_argmax 与 S 的耦合,也没有 day_argmax 与成交额的耦合;14 个种子的骨架都不在两库的 5583 条骨架里。cross_corr
