  - type: E
    core: 'day_cov(Ret, Low)'
    hypothesis: |-
      机制:核心 C = day_cov(Ret, Low),当天分钟收益与分钟最低价(价格水平)的协方差,等于 Σ r_t (Low_t − 均值)/n,读的是「大涨大跌的分钟出现在价格高位还是低位」,即日内价格路径的凸性:正 = 涨幅集中在日内后段(尾盘拉升、资金越买越贵),负 = 涨幅集中在日内前段、之后回吐。依据(本批拆解表):(1) 单独的 day_cov(Ret, Low) 是 −4.22 / −3.43,但 head 里它是和 day_min(...Amt...) 相加的另一半,Amt 项的量级比协方差大很多个数量级,相加后的秩几乎由 Amt 项决定,所以 head 的 −1.33 说明不了 C 本身的好坏;(2) 把 Low 换成 High,整个 head 从 −1.33 升到 −0.88(R 候选,增益 +0.45),说明协方差这一半里价格口径的选择就有明显效应;(3) C 的量纲是「收益 × 名义股价」,没有除以价位,它的截面排序把高价股和低价股的路径形状混在一起,价位本身(名义股价)是个强风格(sub(LogFloatCap, LogFloatShares) = log 名义股价),这是 C 单独亏得很深的最可能原因。所以这一位只在 C 外面做三件事:a) 去量纲,除以 day_mean(Low) 或 day_std(Ret),变成无量纲的路径凸性;b) 在名义股价十分位内做去均值或 z 分数,把价位风格拿掉;c) 把日度读数变慢(20 到 120 日均值、自己 120 日 z 分数、短对长的差、与近期累计收益的滚动相关),让路径形状变成慢变的个股属性,以适应 15 bp 的换手成本。
      为什么和已有的不同:快照里含 C 的唯一外围是 add(day_min(nt_ts_med(nt_ts_min(Amt, 3), 5)), ·),这里完全没有 Amt、没有 nt_、没有 add;外围算子集合含 cross_mean / cross_zscore / cs_bucket_zscore / cs_bucket_demean / cs_robust_z / cross_corr / sign / sub / div,没有一个与它重合。库禁令按骨架拒绝,这些骨架(day_cov 外套 cross_* 和 div day_mean)我对照过库里写法没有见过的组合,个别撞上会被 GP 自己拒绝。
      为什么样本外还会在:日内路径形状反映订单的执行方式,尾盘推升 / 早盘冲高后回落是机构持续建仓与散户追涨两类参与者的差别(Gao、Han、Li、Zhou 2018 日内动量:前段收益预测后段),是市场微观结构特征,不依赖某一段行情;无量纲化并去掉名义股价之后不再是价位风格的代理;窗口 20 到 120 日换手低。最可能的失败:协方差再去量纲之后只剩与反转 / 波动控制的暴露,被奖励的残差化吃掉,那么这一位不出 head,下一轮不再押 C。数学检查:day_mean(Low) 是正的价格水平不近零;day_std(Ret) 在整天不动(停牌 / 封板)时为 0,此时分子也为 0,得 NaN,不是无穷(只作为分母的种子已避开 0/0 之外的爆点);无前视,全部只用 t 日收盘及以前,t+1 才交易;最长窗口 120 日,热身期不主导。
