  - type: N
    hypothesis: |-
      机制:成交与波动在一天里「何时发生、多集中」。本批三个 head 读的都是价格水平或成交量的单点统计(day_min、day_var、day_quantile),都没有时间轴信息,且全部亏(−1.2 到 −2.0),说明这一批的单点读数只剩成本。这一位换一个维度:分钟轴的位置。用新增算子 day_centroid(重心,0 = 全在开盘,1 = 全在收盘)、day_gini(集中度)、in_index(分钟位置)读三类东西:(A) 成交的时段:day_centroid(Volume) 或 Amt 的 20 日均值 = 成交是否后置;尾盘集中成交常来自指数 / 基金被动再平衡与收盘集合竞价前的机构调仓,开盘集中则对应隔夜消息。(B) 成交重心减收益重心:sub(day_centroid(Volume), day_centroid(Ret)) = 量与价的时间错位,价在前量在后是知情者先动、量在后追随;价在后量在前是量先堆起来、价后走。(C) 集中度:day_gini(Ret)(价格变动是否由少数分钟的脉冲构成,跳跃型)、day_gini(Volume)(是否被少数大单支配),以及相减。再配合 day_corr(in_index(Volume), Volume):成交量沿日内时间的趋势。全部再取 20 到 120 日平均或自己 120 日 z 分数,变成慢变的个股属性。
      启发(inspired_by):批里的 head 全是静态单点统计且全亏,富集表为空(18 个已评分候选没有一个共同子树),说明没有哪个单点统计在新尺子下站得住;而 day_cov(Ret, Low) 拆解后换 Low 为 High 有明显增益(+0.45),说明日内的路径与时间结构里有信号,单点的水平没有。
      为什么和已有的不同:day_centroid / day_gini / in_index 是库建成之后才加的 Partura 算子,库里 5583 条一条没有,骨架不会重复;最近的亲戚是手写库里 day_skew / day_kurt / day_std 一类只读分布形状、不读顺序的统计,而重心与 in_index 读的恰是「顺序」。(B)(C) 是两个量互相比较而不是一个量的水平,与流动性、波动、市值这些水平控制天然近乎正交。
      为什么样本外还会在:日内成交曲线的形状(U 形深浅、后置程度)是参与者构成的结构属性(机构被动与指数资金偏尾盘,散户与消息偏开盘),文献里稳定(Heston、Korajczyk、Sadka 2010 日内重复的成交模式;Bogousslavsky 2016 低频再平衡者的尾盘行为;Gao 等 2018 日内动量),在数周内名次保持,15 bp 下换手低。风险:重心类与流动性有关(大票尾盘占比不同),但奖励已残差化掉线性 / U 形 / S 形暴露。数学检查:day_centroid 在日总量为 0 时输出 NaN,不是 0;day_gini 值域 [0,1],无爆点;day_corr 值域 [-1,1];in_index 只在对应分钟有值时有值,日内缺失的票在相关里只看有限分钟;无前视,全部只用 t 日收盘及以前,t+1 才交易;窗口不超过 120 日,热身期不主导。
    inspired_by: 'B1 批:三个 head 全是静态单点统计(day_min / day_var / day_quantile)且全亏(−1.2 到 −2.0),富集表为空;day_cov(Ret, Low) 把 Low 换成 High 增益 +0.45(日内路径信息)。'
