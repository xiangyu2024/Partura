R:
  - head: 'add(day_min(nt_ts_med(nt_ts_min(Amt, 3), 5)), day_cov(Ret, Low))'
    why: |-
      烂的部件是 day_cov(Ret, Low)(单独 −4.22 / −3.43)以及两个加数的量纲:Amt 项的量级远大于协方差,add 之后秩几乎由 Amt 项决定;把 Low 换成 High 已经有 +0.45 增益(−0.88),说明协方差一半的价格口径是关键。变体:(1) 换 High 并去掉 nt_ 算子用普通 ts_ 算子;(2) 去量纲后用 cs_rank 各自取秩再相加,让两半各占一半;(3) 只留去量纲后的 High 协方差(慢);(4) 价位十分位内去均值。数学上都有界,无近零分母(day_mean(High) 是价格水平);无前视。
    variants:
      - 'add(day_min(in_min_rolling(Amt, 5)), day_cov(Ret, High))'
      - 'add(cs_rank(day_min(in_min_rolling(Amt, 5))), cs_rank(day_cov(Ret, High)))'
      - 'add(cs_rank(cross_mean(day_min(Amt), 20)), cs_rank(cross_mean(div(day_cov(Ret, High), day_mean(High)), 20)))'
      - 'cross_mean(div(day_cov(Ret, High), day_mean(High)), 20)'
      - 'cs_bucket_demean(cross_mean(day_cov(Ret, High), 20), sub(LogFloatCap, LogFloatShares))'
      - 'sub(day_cov(Ret, High), day_cov(Ret, Low))'
