      - 'ts_kurt(day_var(Ret), 120)'
      - 'cross_corr(day_var(Ret), day_sum(Ret), 60)'
      - 'cross_corr(day_var(Ret), day_sum(Volume), 60)'
      - 'cross_corr(day_var(Ret), cross_delay(day_var(Ret), 5), 60)'
      - 'cross_mean(cross_zscore(day_var(Ret), 120), 10)'
      - 'sub(cross_ema(day_var(Ret), 5), cross_ema(day_var(Ret), 60))'
      - 'cs_bucket_demean(div(ts_std(day_var(Ret), 60), ts_mean(day_var(Ret), 60)), LogFloatCap)'
      - 'cs_bucket_zscore(cross_corr(day_var(Ret), day_sum(Ret), 120), sub(LogFloatCap, LogFloatShares))'
  - type: E
    core: 'ts_delta(LogFloatShares, 50)'
    hypothesis: >-
      机制:核心 ts_delta(LogFloatShares, 50) 是流通股本在 50 个交易日内的对数变化,即供给冲击:限售股解禁、增发、可转债转股使其上升,回购注销使其下降。本批富集表里它是第二强的共性子树(25 个候选含它,-1.09 对不含的 -2.56 ... 均值差 +1.09,p<0.001),且它是一个日频字段叶子上的变换,与分钟价量统计几乎无关,所以与波动 / 流动性 / 反转这些控制天然近乎正交。上一轮 N 位只把它放在 cs_last_high20 的第二键,没有单独研究它。
      这一位只改外围:(a) 去掉市值与价位混杂:在名义股价十分位(sub(LogFloatCap, LogFloatShares))、上市年限 ListAge、板块 BoardCode 内标准化,保留纯供给变化的横向差异;(b) 多周期对比:50 日变化减 250 日变化 = 供给冲击是新近的还是长期的;(c) 近期最大一次供给冲击 ts_max(·,120),事件型(解禁日期往往集中);(d) 与动量或波动的交互:乘上过去 60 日收益的符号,等价于「涨后解禁」对「跌后解禁」不同方向;除以近期波动,等于把供给冲击按个股噪声调整;(e) 与收益的滚动相关,看供给增加是否伴随价格下跌(承接力)。
      和已有的不同:快照里含核心的外围全是 cs_first_high20 / cs_last_high20 对 day_var(Ret)、day_sum(Open) 的字典序嵌套,没有一个对核心做分组标准化、多周期差、事件最大值、符号交互或滚动相关;这些外围算子集合与以往不同。
      为什么样本外还会在:净发行异常(Pontiff & Woodford 2008;Loughran & Ritter)说明供给扩张的股票长期跑输,A 股解禁 / 增发的定价压力有大量证据;日频慢变,换手极低,适合 15 bp 成本。数学检查:LogFloatShares 是对数水平,ts_delta 是差分,不爆;无前视(ts_delta 是当前减过去);股本字段更新有阶梯性,大量股票长期为 0,并列靠列序打破(携带板块信息,规则允许),不是定义坏掉。风险:供给变化大量为 0,有效差异的票少,覆盖率偏低,覆盖不足则无头。
    seeds:
      - 'cs_bucket_demean(ts_delta(LogFloatShares, 50), ListAge)'
      - 'sub(ts_delta(LogFloatShares, 50), ts_delta(LogFloatShares, 250))'
      - 'ts_max(ts_delta(LogFloatShares, 50), 120)'
      - 'cs_bucket_zscore(ts_delta(LogFloatShares, 50), sub(LogFloatCap, LogFloatShares))'
      - 'cs_bucket_demean(ts_delta(LogFloatShares, 50), BoardCode)'
      - 'mul(ts_delta(LogFloatShares, 50), sign(cross_mean(day_sum(Ret), 60)))'
      - 'div(ts_delta(LogFloatShares, 50), cross_mean(day_std(Ret), 20))'
      - 'cross_corr(ts_delta(LogFloatShares, 50), day_sum(Ret), 120)'
      - 'sub(ts_delta(LogFloatShares, 50), cross_mean(ts_delta(LogFloatShares, 50), 250))'
      - 'cross_ema(ts_delta(LogFloatShares, 50), 20)'
      - 'cs_bucket_zscore(ts_max(ts_delta(LogFloatShares, 50), 120), ListAge)'
      - 'sub(ts_delta(LogFloatShares, 50), cross_mean(day_sum(Ret), 50))'
