slots:
  - type: E
    core: 'day_var(Ret)'
    hypothesis: >-
      机制:核心 day_var(Ret) 是当天分钟收益的方差,即日内已实现波动的水平。本批富集表里它是最强的共性子树(33 个已评分候选含它,均值 -1.51 对不含的 -2.63,p<0.001),但含它的 head/候选都把它当作「水平」去读(cs_first_high20 的第一键、day_sum 的搭档),而新尺子已经把波动水平(控制)的线性、U 形、S 形暴露全部去掉,所以水平本身没有 alpha。
      这一位只改外围,读的是波动的「时间序列形状」而不是水平:(a) 变异系数 ts_std/ts_mean = 波动是否时好时坏(vol-of-vol,与波动水平近乎正交);(b) 尖峰比 ts_max/ts_mean 与 ts_skew / ts_kurt = 波动是否由少数脉冲日构成(类彩票 MAX 效应的波动版);(c) 短长期波动之差(ema 5 对 ema 60、均值 10 对 120)= 波动期限结构,波动正在升还是在回落;(d) 波动与收益、成交量的滚动相关(cross_corr(day_var, day_sum(Ret), 60) 是杠杆效应:跌时波动放大的程度;对 day_sum(Volume) 是波动-成交耦合);(e) 自己 120 日 z 分数、市值十分位内去均值。
      和已有的不同:快照里含核心的外围只有 cs_first_high20 / cs_last_high20 的字典序嵌套与 day_sum 搭档,没有一个用日轴的 ts_std / ts_skew / ts_kurt / cross_corr / cross_ema 去读波动序列的形状;这里没有 cs_first_*、没有 nt_,也避开了 ts_std(ts_max(ts_std(day_cov(Ret,Ret)..))) 这一已出的链式写法。
      为什么样本外还会在:杠杆效应与波动的波动是个股的慢变结构属性(Black 1976 杠杆效应;Ang 等 2006 波动风险定价;Bali 等 MAX 彩票偏好),窗口 60 到 120 日,换手低,不依赖某段行情。数学检查:day_var 恒非负、有界不爆;分母用 ts_mean(day_var) 在整窗停牌时为 0 会得 NaN 而非爆点(窗口内至少一天有成交才有值);无前视,全部用 t 日及以前。风险:与波动控制仍有残余的非单调关系,若如此这位不产 head。
    seeds:
      - 'div(ts_std(day_var(Ret), 60), ts_mean(day_var(Ret), 60))'
      - 'sub(ts_mean(day_var(Ret), 10), ts_mean(day_var(Ret), 120))'
