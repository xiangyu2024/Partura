    reasons: '相关度表:核心 day_var(Ret) 与快照 6 个 head 的原始 |ρ| 最大 0.33(pow_05(day_var(nt_ts_min(Volume,30))));残差后最大 0.14;与控制 vol 的 |ρ| = 0.774,低于 0.8 的线,但很接近,记为边界通过。核心是 loc.md 共性表第 20 行的子树(33 个已评分候选含它),合格。种子 1、2、3、6、7、9、10、11、12 与所有 head 的原始 |ρ| 都 ≤ 0.44,与任一控制的 |ρ| 都 < 0.5(最高是种子 9 的 rev 0.47),没有自动划掉的。三个划掉的都是数学问题(数值伪影),不是相关度问题。(4) ts_skew(day_var,60):nanskew_last 的分母是 std**3 + EPS,EPS = 1e-9(AlphaCube-steering/src/alphacube/operators/common.py 与 ops_ext 同族算子);day_var 的 60 日窗口标准差远小于 1e-3,std 的立方远小于 1e-9,分母几乎就是 EPS,输出约等于 m3 乘 1e9,截面排序变成三阶中心矩的排序,即波动尺度立方乘符号,不是偏度。(5) ts_kurt(day_var,120):nankurt_last 要求窗口方差 var > EPS(common.py:599),day_var 的窗口方差在 1e-13 量级,远低于 1e-9,表里覆盖率只有 0.006、rev 控制的 |ρ| 为 inf,标「废品」,算不出。(8) cross_corr(day_var(Ret), cross_delay(day_var(Ret),5), 60):rolling_pair_reduce 的 corr 分母是 sqrt(var_x var_y) + EPS(common.py 621 行起),这里 sd·sd 约 1e-13 远小于 EPS,输出变成 cov / 1e-9,是协方差的尺度而不是相关,排序被波动离散程度主导。种子 6、12(cross_corr(day_var, day_sum(Ret)))的分母 sd_var·sd_ret 约 1e-8 量级,EPS 对低离散股票有可见的压缩偏差,但没有主导全截面,放行;PI 合成前应检查低离散股票的分位。种子 2、9、10 是同一个「短期对长期波动水平」结构的不同平滑,彼此相近但不是同一个写法的重复(9 有 120 日 z 分数,10 有 EMA),不划。如果它有 alpha,最可能来自:波动期限结构(短期波动相对长期水平的升降)、杠杆效应(种子 6、12 的 cross_corr(day_var, day_sum(Ret)),跌时波动放大),以及 vol-of-vol(种子 1、11 的变异系数)。'
