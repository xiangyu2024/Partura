  - type: N
    hypothesis: >-
      机制:日内分钟分布「右尾 / 左尾的形状」,用新算子 day_es_ratio_hi / day_es_ratio_lo:前者 = 超过当日 95% 分位的那些分钟的均值 / 该分位,后者 = 低于 5% 分位的分钟均值 / 该分位。
      比值无量纲,读的是极端分钟比分位「再极端多少」:接近 1 = 尾部平滑,大 = 少数分钟脉冲式爆发(对 Volume / Amt 就是大单 / 算法单脉冲,对 Ret 就是跳跃 / 彩票型分钟)。
      三类读数:(A) 成交脉冲:day_es_ratio_hi(Volume) / (Amt) 的 20-60 日均值 = 个股被大块订单点状冲击的程度,与成交水平(流动性控制)分开;
      (B) 收益尾部不对称:sub(day_es_ratio_hi(Ret), day_es_ratio_lo(Ret)) = 右尾减左尾的跳跃偏向(正跳跃多 = 彩票型,通常被高估);(C) 绝对收益尾部 day_es_ratio_hi(abs_(Ret)) 的 120 日 z 分数,= 跳跃强度的慢变属性。
      另外 cross_corr(day_es_ratio_hi(Ret), day_sum(Ret), 60) 把右尾脉冲与当日收益联系起来(涨时跳跃)。全部再做 cross_mean / cross_ema / cross_zscore 慢化,或在市值分桶内去均值。
      为什么与库不同:这两个算子是库建成之后才加入的,库里 5583 条没有一条含它们,骨架不会重复;最近的亲戚是手写库里 erm_* 一类,但那类用 +1e-6 做分母,把涨停 / 死亡日(分位 = 0)变成 1e4 的爆点,读的是「有没有过一字板」;新算子在分位近零时输出缺失,读的是真正的尾部形状。本批 head 读的是 day_quantile / day_min / day_var 等单点水平(且被流动性 / 波动控制吃掉),这里是尾部均值与分位之比,是形状不是水平。
      为什么样本外还会在:尾部脉冲是参与者结构属性(大单拆分习惯、机构与散户占比,Barber-Odean 与 MAX 彩票偏好),在数周内名次保持;15bp 成本下 20-60 日均值换手低。
      数学检查:分位近零(|q|<1e-8)时输出缺失而非 1e4,没有近零分母爆点;Volume / Amt 95% 分位为正,比值 ≥ 1 有界;Ret 的 5% 分位为负,比值 ≥ 1;全部只用当日分钟,无前视;窗口最长 120 日,热身期不主导。
      风险:Volume 尾部形状与流动性、波动都有相关,残差化后可能只剩成本;右尾脉冲与涨停日重合,涨停日 Ret 分位为 0 会被置缺失而丢票。
    inspired_by: 'M3 批:head 全部是 day_quantile_q75 / cross_quantile / 分位和极值(inv(High)、nt_ts_stddev)的单点读数,全亏(-1.7 左右),说明分位水平在新尺子下没有 alpha;把「分位」换成「分位以外尾部均值 / 分位」,读形状而不是水平。'
