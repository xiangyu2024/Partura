    reasons: '相关度表: 14 个种子对快照 6 个 head 的原始 |ρ| 最大 0.396 (种子 9, head 1), 其余多在 0.01 到 0.39 之间; 种子 1、2 与 head 2 (cs_mask_top_replace_mean_neg(...)) 的原始 |ρ| 为 0.23、0.22, 残差 0.14、0.13; 残差最大 0.307 (种子 9); 对 5 个控制的原始 |ρ| 最大 0.46 (种子 1 的规模), 未到 0.8; 没有种子满足自动划掉的条件。 库: day_first(Amt) 出现在 9 条表达式里, day_sum(Amt) 出现在 84 条里, 两者在同一表达式里共现 0 次 (members.csv 核对); 份额 div(day_first(Amt), day_sum(Amt)) 从未出现, 所以份额本身是新对象, 创新度给 4 (不给 5, 因为份额与流动性、规模的原始 |ρ| 在 0.40 到 0.46 之间, 有一部分是流动性结构)。 head 4 (ts_scale(ts_argmin(day_first(Amt),30),30)) 在库里是 B092 的成员, 它的水平形式在库里, 份额形式不在。 数据定义核对: legacy/minute_grid.py 的文档写明 241 格的 0 号是 09:30 集合竞价格, 所以 day_first(Amt) 就是开盘竞价成交额, day_last(Amt) 是 15:00 格, PI 对 OS 与 CS 的机制描述与数据定义一致。 数学: day_sum 为零时 0/0 给 NaN; day_first 无有效值时给 NaN; cross_regbeta(x,y,d) 是 rolling_ols 的 y 对 x 的斜率 (源码核对), 种子 13 的 y 是 |G-1|、x 是昨日 OS, 与 PI 描述一致; cross_corr 在常数窗口为 0, 只影响掩码之外的票; 没有前视。 唯一的定义风险是 day_first 取第一个有效格: 若某票某日 09:30 格缺失, 会落到 09:31 连续竞价格, 这是个别票个别日的缺失, 不是系统性的, 不挡。 逐个种子: 1、2 是 OS 的变异系数与对市场的残差变异系数, 同一主题 (开盘参与的突发度) 但分子不同, 不是重复; 3、5 是 OS 与 |G-1| 及 I-1 的相关; 4、11 与市场残差 RG 相关; 6、7、8 的 CS 依赖收盘格的板块结构 (有收盘集合竞价的板块才有意义, 而创业板收盘竞价据我所知自 2020 年 8 月起实行), 机制最弱但不是数学问题, 保留; 9、10 是 OS 的持续性与对市场同步性; 12 是 OS 与日内特质残差的相关; 13 是昨日 OS 对今日 |G-1| 的斜率; 14 是残差份额的离散度与残差缺口离散度之比, 分子是 0 到 1 量级的份额、分母是收益率量级, 同为无量纲但量纲不同, 机制弱, 不划 (理由不是数学问题或重复)。 全部保留 (14 ≥ 4)。 如果它有 alpha, 最可能来自开盘集合竞价参与度作为机构、指数与消息型交易者的慢变指纹 (PI 引的隔夜与日内分工一类文献), 而不是流动性水平; 若只是流动性或规模的换皮, 会被 liq 0.45 与 size 0.46 吃掉。'
R:
  - head: 'cross_ema(abs_(sub(div(day_first(Open), cross_delay(day_last(Close), 1)), 1)), 60)'
    soundness: 4
    reasons: '8 个变体都没有数学问题。 v1 cross_ema(abs_(cross_regres(cs_mean(G), G, 120)), 60) 与原 head 原始 |ρ| 0.962 (残差 0.955), 基本是同一个量的市场残差版, 替换规则下算作替换, 合理度不受影响。 v2、v5、v8 是 |G-1| 与 |I-1| 的 EMA 份额, 分母只在两者长期同时趋零时出问题 (几乎不动的票), 需要掩码排除, rank 对少数票稳健。 v3 的分子用 120 日残差、分母用 10 日 beta 的日内残差, 窗口不一致, 机制说不清, 但不是数学问题, 放行。 v4 与 v6 用 241 日尺度 (cross_ema 按半衰期计、缺失日跳过权重; cross_zscore 只要 n 大于 1 就计算): 2018 年上半年的读数受热身期影响, 但不主导全样本, 放行。 v7 是截面 cs_regres(overnight EMA, intraday EMA) 的残差, 源码核对 Y 对 X 的截面 OLS, 对重尾敏感, 读的是残差排序, 可以接受。 没有经 nanrank_last 的算子。 如果它有 alpha, 最可能来自隔夜幅度相对日内幅度的份额 (信息型隔夜冲击在总波动里的相对比重), 而不是 |G-1| 的水平, 水平会被 vol 与 liq 控制吃掉。'
  - head: 'ts_scale(ts_argmin(day_first(Amt), 30), 30)'
    soundness: 4
    reasons: '3 个变体的数学都干净。 ts_scale 在源码里是 x_t 除以窗口和 (scale_last_ratio, 和为零时分母替换为 1), 不是 min-max, 不出错; ts_argmin 与 ts_argmax 用 nanargmin_last 与 nanargmax_last, 不经 nanrank_last, 不踩 §4 的已知陷阱。 v1 把水平换成开盘竞价份额 OS, 与快照 head 4 的原始 |ρ| 为 0.70 (残差 0.74), 按 PI 的替换门槛会替换原 head, 这是 PI 的决定, 不在审计范围。 v2 把 argmin 换成 argmax 的位置读法, 与 head 4 原始 |ρ| 为 0.21; v3 用 Amt 对其 30 日截面均值的比, 与 head 4 原始 |ρ| 为 0.70 (残差 0.69), 分母只是慢变的标度, 位置读法不变, 分母包含当天但当天收盘后可得, 没有前视。 v1 与 v3 的位置读法只看窗口内排序, 对截面水平不敏感, 说明它们读的是参与度何时见底而不是流动性水平。 如果它有 alpha, 最可能来自开盘竞价量在过去 30 日里的低点位置 (参与度是否刚见底), 而不是量的水平。'
summary: '两个任务位都放行: a 创新 4、合理 4, 划掉种子 1 和 15 (与 head 1 原始 |ρ| 为 0.83 到 0.84 的换皮), 剩 14 个; b 创新 4、合理 4, 无种子划掉, 剩 14 个; 两个 R 组合理均为 4; 没有数学阻断问题; 需要总领或 PI 核对的是 div 对零分母的 inf 处理、种子 13 的机制叙述 (mean(C) 实为 GL 的中期变化), 以及 GL 与 CS 中板块与时间结构的混入。'
