    struck_seeds: [1, 15]
    reasons: '相关度表 (corr_1.json): 核心 C = cross_regres(cs_mean(G), GL, 120) 对快照 6 个 head 的原始 |ρ| 最大 0.032 (head 3), 残差最大 0.085 (head 4); 对 5 个控制的 |ρ| 在 0.023 到 0.066 之间, 远低于 0.8, 核心门槛通过。 核心在 loc.md 的机械核心卡里出现 (只用 grep 核对字符串)。 库 5583 条里 cross_regres 的自变量从未是 cs_mean(...) (0 条), G 虽出现在 11 条里, 却都没有市场残差, 所以 C 是新对象, 创新度给 4。 16 个种子都原样含 C (已逐条核对字符串)。 划掉 1 和 15: 种子 1 是 cross_stddev(C,120), 与 head 1 (cross_ema(abs_(G-1),60)) 的原始 |ρ| 为 0.837、残差 0.781; 种子 15 是 cs_regres(stddev(C), log(price)), 与 head 1 原始 0.832、残差 0.777。 二者都是 head 1 的换皮, 按 ≥0.7 的确定性规则自动划掉, 我同意。 其余 14 个保留 (14 ≥ 4)。 逐个看: 2、3、4、5、11、12 是 C 的离散度、最大值或短长比, 分母分别取 GL、日内残差、120 日振幅、10 日 beta 的日内残差、C 自身、20 日 C 的离散度, 原始 |ρ| 与 head 1 在 0.03 到 0.40 之间, 不是换皮。 6 是 C 的一阶自相关; 7、8 是 C 与日内残差 RI 的同期与滞后一日相关; 9、10 是尾部与偏度; 16 是 |C| 与 |RI| 的 EMA 比。 13 的分子 mean(C) 在带截距的滚动 OLS 下并不是零均值 (源码 rolling_ols 里 alpha = mean_y - beta*mean_x, 每天残差用各自窗口的截距), 120 日平均近似等于 GL 近 120 日均值与更长窗口加权均值之差, 即隔夜特质价位的中期变化, 不是 PI 写的「方向偏度」。 这不是数学问题, 放行, 但 PI 的叙述要改写。 种子 14 是 stddev(C) 乘后复权价, 与 head 1 的原始 |ρ| 为 0.484, 对 liq 0.555、known 0.533, 是 PI 设计的价位检验, 不是重复, 保留。 种子 4 的日内残差用 10 日滚动 beta, 残差里掺了 beta 的估计噪声, 只影响解释, 不划。 数学检查: 无前视 (G、GL、I 都在 t 日收盘后可得; cross_delay 为正向滞后; 残差只用到 t 日及以前)。 分母: cross_stddev 只有 1 个有效观测时返回 0, 而 div 对 0 返回 inf (torch.divide), 所以样本开头几天与新股上市前几日可能出 inf; 这集中在少数票和少数日子, 不主导截面, 不挡, 但请总领确认流水线把非有限值当缺失。 cross_corr 与 cross_autocorr 在 120 日热身期内用部分窗口, 2 个观测时恰为 ±1, 只影响 2018 年上半年。 没有 ts_rank、cross_rank、in_rank 等经 nanrank_last 的算子, 不踩 §4 的已知陷阱。 未核对的一项: 快照里含 C 的候选的外围是否与某个种子相同 (按任务说明不读共性表与拆解), 由 PI 的外围检验负责。 如果它有 alpha, 最可能来自: 隔夜缺口去掉市场之后的特质部分的离散度与持续性, 即这只票隔夜价格是由自身消息还是由大盘推动的慢变结构。 但 GL 与 G 的差只在最后一格没有收盘集合竞价的板块上出现 (创业板收盘集合竞价据我所知自 2020 年 8 月起实行, 之前样本里 15:00 格的含义随板块与时间变化), 所以 GL 残差里可能有相当一部分是板块与时间结构本身, 这是最可能的失败来源。'
  - slot: b
