  core: cross_regres(cs_mean(div(day_first(Open), cross_delay(day_last(Close), 1))), div(day_first(Open), cross_delay(day_last(Low), 1)), 120)
  hypothesis: |-
    机制。核心 C = cross_regres(cs_mean(G), GL, 120)。G = div(day_first(Open), cross_delay(day_last(Close), 1)) 是隔夜价比(当日第一个有效分钟的开盘价 ÷ 上一交易日收盘,后复权,停牌后复牌首日给缺失);GL = div(day_first(Open), cross_delay(day_last(Low), 1)) 是同一个缺口,只是分母取上一日最后一格的 Low(在有收盘集合竞价的板块最后一格是集合竞价的撮合价,通常 Low = Close,GL = G;其余板块 GL ≥ G,多出来的是最后一分钟的振幅);cs_mean(G) 是当日全市场等权的隔夜收益(每个交易日一个标量);cross_regres(x, y, 120) 是 y 对 x 的 120 日滚动 OLS,取今天的残差(窗口含当日、不含未来)。所以 C = 这只票今天开盘缺口里「去掉市场整体隔夜行情之后」剩下的特质部分。它是个每天符号不定的量,必须在外面套一个读法才变成因子 —— 这个位只在外围长,问的是:读 C 的哪一种统计量、拿什么去比,才是承重的。

    依据(只用 train / valid,来自本轮 loc.md 与上一轮结果)。
    (1) 上一轮 N 位的 GP 从「特质隔夜份额」种子长出的 5 个最好候选,score = +0.50 / +0.49 / +0.31 / +0.31 / +0.29(差一点过线),train / valid 分别 +0.50/+0.66、+0.49/+0.74、+0.31/+0.35、+0.31/+0.36、+0.29/+0.56,valid 全都不比 train 差。它们的形状一致:div(cross_stddev(C, 120), 分母),分子就是 C 的 120 日标准差(核心卡 4),分母是日内一侧(cs_mean(I) 对 I 的残差,I = div(day_last(Close), day_first(Open)))的特质标准差,回归窗口 5 / 10 / 120 都出现,另外夹着一个「以上一日收盘价作自变量并除以它」的小项。
    (2) 快照里含 C 的 29 个候选均值 -0.11,不含的 -2.32(p < 0.001);含 cs_mean(G) 的 59 个候选均值 -0.77、不含 -2.62。而上一轮 R 组里没对市场做回归的版本(stddev(G-1) / (stddev(G-1) + stddev(I-1)),20 / 60 / 120 日)只有 -1.07 ~ -1.32。所以承重的看来是「先对市场回归取特质残差、再读离散度的比值」,不是 G 的水平。
    (3) 这 5 个候选的外围都是同一个模板 div(·, add(·, ·)),本轮换掉模板,看模板里哪一块承重。

    16 个种子的外围(每个都原样含 C):
    A 换分母(1–5)。1 是裸 cross_stddev(C, 120),当基线。2 分母是 GL 的原始 120 日 stddev,即隔夜缺口里「特质 / 总」的离散度比,价格非同步性 1 - R² 的写法(Roll 1988;Morck, Yeung, Yu 2000:特质份额大 = 个股自己的信息多)。3 / 4 分母是日内一侧的特质 stddev,回归窗口 120 / 10(上一轮最好的几个正是短窗口,短窗口的残差更像日内的高频噪声)。5 分母是 120 日平均日内振幅 day_max(High) / day_min(Low) - 1,完全不做回归。
    B 换掉 stddev 这个读法(6–13)。6 cross_autocorr_s1(C, 120):特质缺口第二天是回吐还是延续。7 / 8 C 与日内特质残差的同期相关 / 滞后一日相关(隔夜与日内「拉锯」在特质层面的版本,Lou, Polk, Skouras 2019)。9 |C| 上四分位均值 ÷ |C| 均值:重尾程度,无量纲。10 ts_skew(C, 120):特质缺口偏度(Boyer, Mitton, Vorkink 2010)。11 cross_max(C, 120) ÷ cross_stddev(C, 120):标准化后的最大特质上跳。12 20 日 ÷ 120 日 stddev:近期的特质隔夜波动相对长期。13 cross_mean(C) ÷ cross_mean(|C|):特质缺口的方向偏度。
    C 价位检验(14、15)。这是对上一轮的一个怀疑,不是想法:最好的几个候选分母里那个小项,量级上等价于把后复权价位乘进来(价位 = 自某个基期以来的累计涨幅,是一种长期反转)。14 是 C4 乘价位 cross_delay(day_last(Close), 1);15 是把 C4 对 log 价位做截面回归取残差(去掉价位的线性部分)。14 好而 15 差 = 承重的是价位而不是特质离散度;反过来 = 离散度才是。
    D 16 是 EMA 版比值:cross_ema(|C|, 60) ÷ cross_ema(|日内特质残差|, 60)。

    与已见过的不同。快照里含 C 的候选,至少最好的那几个,外围算子集合都是 {div, add, cross_stddev, cross_regres, cross_corr, cs_mean, sub, …} 的同一个 div(C4, add(…)) 模板;本轮种子外围:单一分母(没有 add),或换成 cross_autocorr_s1、ts_skew、cross_tail_mean_q75、cross_max、cross_mean + abs_、cross_ema、cs_regres、cross_corr(C, 日内残差)。16 个骨架逐个对照 members.csv 的 5583 个骨架,没有重复。

    为什么样本外还会在。比值和相关全是无量纲的,所以不是流动性 / 市值 / 波动水平的变形;对市场回归掉之后,读的是「这只票的隔夜价格由自己的消息还是由大盘推着走」,与日内一侧(散户连续竞价为主)相比的相对份额(French, Roll 1986:信息驱动与交易驱动的方差不同;Lou, Polk, Skouras 2019:隔夜 = 机构 / 消息,日内 = 散户)。这是持有者构成与信息环境的慢变属性,120 日窗口下名次几周不变,15 bp 下换手低,不靠一个会很快衰减的价差。新尺子再把对 5 个控制和两个冠军的线性 / U 形 / S 形暴露去掉,留下的才算分。最可能的失败:一部分是板块 / 交易所结构(Low 与 Close 的差异只在没有收盘集合竞价的板块出现,列序携带板块信息);另一部分是价位(种子 14 / 15 就是为分辨它)。

    数学检查。无前视:G、GL、I 都在 t 日收盘后可得,cross_delay 的天数全为正,cross_regres / cross_stddev / cross_corr 的窗口含当日、不含未来,cs_mean 只用当日截面。分母:cross_stddev 的窗口里至少要有 2 个有效观测才有值,否则缺失;样本最前面 3 到 5 个交易日窗口里只有 1 到 2 个观测、残差恒为 0,合成数据烟测里种子 11 的 cross_max ÷ cross_stddev 在这几天出现 inf,只涉及 2018 年第一周,不是结果的主要来源。cross_regres 的自变量 cs_mean(G) 在 120 日窗口里的方差在 1e-5 量级,远高于 EPS;停牌票窗口缺失时返回缺失而不是 0;cross_autocorr_s1 / cross_corr 在常数窗口返回 0(只影响停牌与一字板票,可交易掩码已排除)。种子 14 的价位是后复权价(规则 §4:不是问题,只是长期累计涨幅)。
