- type: N
  hypothesis: |-
    机制。把一天的成交额按「在哪个竞价里成交」拆开。OS = div(day_first(Amt), day_sum(Amt)) 是开盘集合竞价那一格(day_first 取当天第一个有效分钟,开盘集合竞价的撮合落在这一格)的成交额占全天的比例;CS = div(day_last(Amt), day_sum(Amt)) 是最后一格占比(有收盘集合竞价的板块是收盘竞价,其余板块是最后一分钟的连续竞价)。OS 是 [0, 1] 的无量纲量,读的是「这只票有多大比例的成交,是在集中处理隔夜信息的那一刻完成的」。开盘 / 收盘竞价偏机构、指数、消息型交易者,盘中连续竞价偏散户(Lou, Polk, Skouras 2019;Berkman 等 2012:开盘买入的关注度成本;Amihud, Mendelson 1987:开盘与收盘的价格形成方式不同)。所以 OS 是一个慢变的「谁在交易这只票」的指纹,不是流动性水平。

    本组用四种读法(全部无量纲、120 日窗口、慢变):
    1 / 2:OS 的变异系数 stddev ÷ mean(1),与对市场平均 cs_mean(OS) 回归后的特质变异系数(2)—— 开盘关注度的「突发程度」(类似上一轮在本流里有用的「特质离散度」写法,但读的是参与度而不是价格)。
    3 – 5:OS 与隔夜缺口大小 |G - 1|(3)、与对市场回归后的特质缺口 cross_regres(cs_mean(G), G, 120)(4)、与日内收益 I - 1(5)的 120 日相关:缺口是不是伴随着集中的开盘成交(消息型缺口)还是稀薄成交下的噪声缺口,日内是延续还是回吐。
    6 – 10:参与度自己的结构:OS 与 CS 的相关(6)(开盘重的票收盘是否也重 = 机构型成交的一致性);CS 与当天价格变动的相关(7);昨日收盘竞价占比与今日缺口的相关(8)(收盘竞价的资金流是否隔夜延续);OS 的一日自相关(9);OS 与市场平均 OS 的相关(10)(参与度是否跟市场同步)。
    11 – 14:特质版:对市场回归后的 OS 残差 RO 与特质缺口 RG 的相关(11)、与日内特质残差的相关(12);昨日 OS 对今日 |G - 1| 的斜率(13);RO 的离散度 ÷ RG 的离散度(14)。

    为什么和库里、快照里不同。库里 5583 条里,day_first(Amt / Volume) 只以绝对水平(cross_sum、ts_quantile、ts_std)与 argmin 位置的形式出现,没有一条把它除以 day_sum(Amt) 变成份额,也没有一条把它与缺口、日内收益、市场平均做耦合(正则查 members.csv:day_first(Amt|Volume) 与 day_sum(Amt|Volume) 同时出现的 0 条);14 个种子的算子骨架逐个对照 5583 个骨架,没有重复。水平量是流动性,新尺子会去掉;份额的离散度、耦合和相关没有这个问题。CS 只在相关里使用,不看水平:两个板块的收盘竞价规则不同,CS 的水平带板块信息。

    为什么样本外还会在。持有者构成(机构 / 指数 / 散户占比)与成交方式是慢变的,120 日窗口下名次几周不变,15 bp 下换手低;相关、变异系数、份额都是无量纲的,与流动性 / 市值 / 波动水平不是同一个量。诚实的风险:OS 的水平与流通盘、板块(科创板 / 创业板的竞价规则不同)相关,相关类种子在回归后可能还带板块信息;参与度的变异系数与 2029 一族(成交额的波动的波动)可能同源。

    数学检查。无前视:OS、CS、G、I 都在 t 日收盘后可得,cross_delay 的天数为正,窗口含当日、不含未来。分母:day_sum(Amt) 为 0 时分子也为 0,0 / 0 给缺失而不是 inf(合成数据烟测:没有 inf);变异系数的分母是 120 日 OS 均值,正;cross_corr / cross_autocorr_s1 常数窗口返回 0(只影响停牌 / 一字板票,可交易掩码已排除);种子 14 的分母 cross_stddev(RG, 120) 在样本最前面 3 到 5 个交易日(窗口里只有 1 到 2 个观测)会出现 inf,只涉及 2018 年第一周。最长窗口 120 日。
