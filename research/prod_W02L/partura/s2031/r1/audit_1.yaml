    struck_seeds: []
    reasons: '相关度表 (corr_1.json): 14 个种子对快照 3 个 head 的原始 |ρ| 最大 0.49 (种子 2, 最像 head 2 即 Volume 版 ts_mean(select_where(...I-1...)), 两者共享 cross_mean(I-1) 这一项), 其余 0.03 到 0.40; 与最像 head 的残差 |ρ| 最大 0.63 (种子 2)、0.42 (种子 1)、0.36 (种子 10), 其余 0.02 到 0.34; 对 5 个控制的原始 |ρ| 最大 0.32 (种子 2 的波动), 核心 G 对五个控制都在 0.02 到 0.09, 远低于 0.8。 骨架 (抽掉字段、常数、窗口) 14 条都不在 5583 库里 (已用 members.csv 逐条核对); 库里含 G 子树的成员只有 11 条, 全在 B091 (972、973、991 到 998、1146), 14 个种子的外围结构与它们都不同。 新颖性给 4: 库里的隔夜项只见过 B091 的水平写法 (cross_mean、cross_stddev、select_where 门槛) 与 L1146 = cross_corr(G, 收盘 / 下午段第一根开盘价, 20), 隔夜对日内的相关、份额、符号族都不在库里; 种子 5 与 L1146 同族但窗口与日内段不同, 不算同一个量。 笔记有两处事实说法不对, 在此更正: (1) 笔记说 B091 的 22 个候选在 G 外面只有三种写法, 但 L1146 是 G 与第二个日度序列的 20 日滚动相关, 另外 11 条 (976 到 990) 根本不含 G; (2) 笔记说库里没有 G 与另一个日度序列的滚动耦合, L1146 就是一例。 相关度表只比较快照里的 3 个 head; W01 的 #4 cross_corr(day_max(Ret), G-0.5, 60) 也与 G 耦合, 不在本表内, 由 GP 库禁令再查。 合理度给 4: 每个算子已对源码核对 (cross_delay 为一个交易日滞后, 停牌日为缺失; cross_product 把缺失当单位元; cross_mean、cross_med、cross_corr、cross_regbeta 的分母与常数窗口处理都没有问题; 信号在当日收盘后可得, 无前视); 窗口 60 到 241 日, 慢变。 需注意: 种子 1、2、3 是同一个量 (G 与 I 的累计差, 对数上约等于 2 乘隔夜累计减总收益), 笔记说差值减掉了两段共有的总收益, 这只对等量共有的漂移成立; 总收益仍以负权重进入 (种子 2 的反转控制 |ρ| 约 0.2), 所以若有 alpha, 它更可能来自隔夜份额而不是动量。 种子 4 的 distinct 为 0.077, 表里门槛标为废品 (120 日上涨占比最多只有 241 个取值, 截面并列多); §4 明确把并列靠列序打破列为不是挡的理由, 且并列只影响少数十分位边界, 故不划, 请总领确认 GP 前是否已剔除它。 没有数学问题, 没有与 head 或库的重复, 全部放行。 如果它有 alpha, 最可能来自隔夜与日内两段的投资者构成差 (机构与指数持有对散户连续竞价) 这种慢变的持股指纹; 若只剩总收益的反转, 会被 rev 与已知族控制吃掉。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '相关度表: 12 个种子对快照 head 的原始 |ρ| 最大 0.31 (种子 4 与种子 12, 都是 head 1), 与 head 的残差 |ρ| 最大 0.27 (种子 11); 对 5 个控制的原始 |ρ| 最大 0.44 (种子 12 的流动性), 其中 beta 类与相关类 (种子 2、4 到 7、12) 与流动性或已知族的 |ρ| 在 0.29 到 0.44 之间, 未到 0.8; 市值类最高 0.40 (种子 3)。 骨架 12 条都不在 5583 库里。 库里 48 条含 cs_mean, 但没有一条把 cs_mean 作为 cross_corr、cross_regbeta、cross_regres、ts_corr、ts_regbeta 等双序列算子的输入 (39 条以 cs_* 作双序列首参的全是 cs_rank、cs_mask、cs_normalize、cs_sum), 故以市场序列为自变量的写法在库里没有, 给 4。 合理度给 4: 每个算子已对源码核对。 cs_mean 对有限值取均值并广播到截面; cross_regbeta(x, y, d) 是 y 对 x 的滚动 OLS 斜率, 分母是 x 的滚动平方和并与 EPS=1e-9 比较, 市场序列的平方和远高于它; cross_corr 在常数窗口返回 0 (只影响掩码之外的票); 信号在 t 日收盘后可得, 滞后项 cross_delay(...,1) 正确, 无前视。 风险: 等权 5000 只的均值由小市值主导, beta 同时是市值代理 (种子 3、5 的市值 |ρ| 为 0.33 到 0.40), 残差后是否还剩 alpha 不确定; 241 日窗口在 2018 年是扩张窗口, 种子 4、5、7 约 17% 的训练日受影响, 但不主导结果。 没有数学问题, 没有与 head 或库的重复, 全部放行。 如果它有 alpha, 最可能来自股票与市场同步结构的慢变持股指纹 (指数、ETF、机构占比决定它跟不跟大盘), 以及种子 9、10 所对应的价格延迟 (Hou 与 Moskowitz 2005) 这种流动性属性。'
R:
  - head: 'cross_stddev(sub(div(day_first(Open), cross_delay(day_last(Close), 1)), 1), 20)'
    soundness: 4
    reasons: '头 cross_stddev(G-1, 20) 在新尺子下为 -1.48, 它属 B091 的冠军族 10 (members.csv); 三个快照 head 在新尺子下全部为负 (-1.48、-2.08、-2.28), 所以它们不是「过了尺子」的 head, 库禁令对它们照常生效。 数学: 变体 1 到 4 的分母是两个非负量之和, 只在两者同时为零时缺失 (掩码排除的封板票); cs_regres(Y, X) 是 Y 对 X 的截面 OLS 残差 (源码核对); cs_bucket_zscore 的分桶标准差加了 EPS, 桶内不足 2 只时给缺失; cross_tail_mean_q75 与 cross_med 用分位数, 不经 nanrank_last, 不踩已知的缺陷。 唯一要核对的是 nanstd_last: 全为缺失的窗口返回 0 而不是缺失, 若掩码没有排除长停牌日, head 1 与变体 5、11 会把这些票排到低端; 我没有核对掩码, 请总领确认。 有效性: 变体 1 到 6 的流动性、波动、已知族 |ρ| 在 0.01 到 0.14, 确实去掉了水平; 但变体 1 的残差与 head 1 的残差仍有 0.71, 即份额之后的信号与原 head 的残差高度一致, R 带来的新信息有限; 变体 7 与 head 1 的原始 |ρ| 为 0.98, 尺寸分桶几乎没有改变排序, 等于换皮; 变体 8 到 11 与流动性、波动、已知族的 |ρ| 仍在 0.3 到 0.5, 还是水平; 变体 12 的波动 0.25、反转 0.22。 这些都不是数学问题, 放行; 替换或收录由分数与 |ρ| 门槛决定, 不在审计范围。 如果它有 alpha, 最可能来自隔夜风险占总风险的比重, 即信息型隔夜冲击在整体波动中的相对份额 (无量纲), 而不是水平本身。'
