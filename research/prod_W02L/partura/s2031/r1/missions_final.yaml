- type: N
  hypothesis: '机制:把个股的价格运动拆成两个通道 ——「隔夜」G = div(day_first(Open), cross_delay(day_last(Close),
    1))(收盘到次日集合竞价,消息、机构、指数期货与海外信息进来的地方)和「日内」I = div(day_last(Close), day_first(Open))(连续竞价,散户主导)——
    再问个股在每个通道里与全市场同通道的走势有多同步。市场序列用 cs_mean 取全截面等权均值,得到一条每个交易日都有的标量序列(市场隔夜收益 MG = cs_mean(G)、市场日内收益
    MI = cs_mean(I)、市场收盘对收盘收益 MR),再用个股自己的 G / I 对它做 120 或 241 日滚动相关或回归斜率。


    四格耦合(个股 × 市场):(G, MG) 隔夜同步度、(I, MI) 日内同步度、(I 对 MG) 个股日内如何响应当天市场的开盘缺口、(G 对 MI)
    个股缺口与当天市场日内走势的关系;外加差值(夜减日的相关 / 斜率,种子 3、5)、延迟响应(个股 G 或收益对前一日市场收益 cross_delay(MR,
    1) 的斜率,种子 9、10、12)与特质份额(个股隔夜残差波动 ÷ (隔夜残差波动 + 日内残差波动),种子 11)。


    为什么它可能有 alpha:(1) Hendershott、Livdan、Rösch 2020「A tale of night and day」:beta
    只在隔夜被定价、日内不被定价,所以隔夜 beta 与日内 beta 之差是个股收益里被定价与不被定价的部分的分离;(2) Asness、Frazzini、Gormsen、Pedersen
    2020 说低风险效应有一半来自低相关而不是低波动 —— 控制里的波动已被去掉,剩下的「相关」正是新尺子留给我们的部分;(3) Hou、Moskowitz
    2005:个股对市场信息的响应延迟(价格延迟)是慢变的流动性与关注度属性,延迟大的票有溢价;种子 9、10、12 是它在隔夜通道上的版本。机制上这三条都读「这只票的价格是被市场整体推着走,还是被自己的消息推着走」,是慢变的结构属性,120
    到 241 日窗口下名次稳定,换手低。


    为什么和库里、快照里不同:本批里 cs_mean 只当「阈值」用(个股 20 日波动是否高于市场平均),市场整体的隔夜 / 日内序列从来没被当作回归或相关的自变量。库里
    5583 条表达式中,没有任何一条在 cross_corr / cross_regbeta / cross_regres 里用 cs_mean 做自变量(正则查
    members.csv,命中 0 条;以 cs_ 开头作首参的双序列算子只有 14 条,全是挖掘库里的随机树)。W01 里隔夜缺口出现的方式是与成交额重心耦合、缺口的偏度、缺口均值当排序键,都是个股自己的序列,没有一个与市场序列耦合。head
    1 说承重的是隔夜一侧的风险水平(日内一侧同写法 -3.46,隔夜一侧 -1.48),但它只读水平,被波动控制吃掉;这里读的是协同而不是水平,12 个种子的算子骨架逐个对照
    members.csv 的 5583 个骨架,无一重复。


    为什么样本外还会在:协同结构由持股构成决定(指数 / ETF / 机构占比高的票与大盘同步,题材与散户票各走各的),持股构成变得慢;相关与斜率无量纲,不是流动性、市值、波动的水平变形;窗口
    120 到 241 日,15 bp 下换手低。诚实的风险:等权全市场均值被小盘主导,「与市场相关」在很大程度上是市值的代理 —— 新尺子去掉了市值的线性、U
    形、S 形暴露,但残差里还剩多少不知道;相关与 beta 同波动水平不是独立的(beta = 相关 × 波动比),所以相关类(种子 1、2、3、6、8)比
    beta 类更接近我要的「与波动水平无关」。


    数学检查:无前视,cs_mean 只用当日截面,cross_delay 的天数为正,窗口含当日、不含未来。cs_mean 的分母是当日有效股票数(上千只),不会近零;cross_corr
    的分母带 EPS,常数窗口得 0(已知行为,只影响停牌与一字板票,可交易掩码已排除);cross_regbeta 在自变量方差 ≤ EPS 时给缺失而不是爆点,市场序列的
    120 日方差约 1e-3 量级,远高于 EPS;种子 11 的份额分母是两个非负量之和,仅同时为 0 才缺失;cross_regres(MG, G, 120)
    是个股 G 对市场 MG 的滚动 OLS 残差(AlphaCube 的 x 在前、y 在后)。最长窗口 241 日,训练段第一年用扩张窗口。'
