    \ 2:-2.08,去掉 is_gt 后 -1.61),状态切换是负贡献。库里 5583 条里没有 G 与另一个日度序列的滚动耦合,也没有 G 的有界份额、符号占比或自相关。\n\
    \n外围的五族(14 个种子,窗口 60 到 241 日,慢变;I = div(day_last(Close), day_first(Open)) 是日内价比):\n\
