    reasons: "N 位。x_mkt = cs_mean(day_sum(Amt)) 是当日截面均值,y = 个股当日成交额,cross_regres 是 120 日滚动 OLS 的当日残差,同期全日量,无前视;cross_delay 的位置(seed 12 的 delay 作用于价格残差)都是 1 日,正确。相关度表:原始 |ρ| 的最大值是 seed 10 的 0.49(与 Pr2b),残差 |ρ| 最大 0.42;控制最大 0.51(seed 8 的 size);没有任何一条过 0.7 或控制 0.8。无一划掉。创新 4:快照里没有一个 head 或控制用成交额对市场成交额的特质残差(M1 与 M3 是价格或 Volume,Pr2b 是时间指数斜率),seed 1、3、4、6、9 的原始 |ρ| 都在 0.26 以下。seed 2、8 的分母含成交额水平,与流动性 / 规模控制 0.40 / 0.51 最近,给 4 而不是 5 的理由就是这里。合理 4:机制是成交额的非同步性(Chordia-Roll-Subrahmanyam 的 commonality 一类,指数 / 融资盘 / 被动资金主导的票同步性高);分母都是 120 日 stddev 或 120 日均值或 ema,成交额为正,无近零爆点;seed 11 的 day_first(Amt) / day_sum(Amt) 在停牌日 0/0 为 NaN 而非 inf,按缺失处理,放行。如果它有 alpha,最可能来自:成交额的特质冲击占比(seed 1、3、9),即个股自己的关注 / 消息驱动的成交,而不是 Amt 的水平。"
R:
  - head: "cross_regbeta(cross_delay(day_sum(Amt), 1), abs_(day_max(cross_age(pow_05(pow_2_5(High))))), 120)"
    soundness: 4
    reasons: "R 变体全部是 Pr2b 同一读法的窗口、EMA、比值、相关、t 值变体,数学上合法。abs_ 对 C 是 no-op(C 非负,且 cross_age 只看有限性),幂函数同样只改变 High 的数值而不改变有限性,与 PI 的拆解一致。cross_regbeta 的分母是成交额 120 日方差(元^2 量级),远高于 EPS = 1e-9,无除零爆点。唯一的合理度风险是 1/var(Amt) 把排序偏向成交额波动小的票(标准化是承重的),这是机制上的偏向,不是数学问题,放行。如果它有 alpha,最可能来自成交额的慢趋势(持有者结构的慢变化),而 1/var 的标准化是否承重要靠变体 4、5(EMA 版、相对化版)的结果判断。"
