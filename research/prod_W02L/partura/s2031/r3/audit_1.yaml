    reasons: "核心 C = day_max(cross_age(pow_05(pow_2_5(High)))) 是快照 head Pr2b 的子树(abs_ 的参数),合法。ops_ext.cross_age 只用 isfinite 的 cummax,无前视;pow 与 abs_ 对 C 是 no-op(C 只靠有限性与计数)。核心对 5 个控制的最大 |ρ| 是 size 0.48 < 0.8,过。相关度表里核心行标为废品:核心自身的截面几乎是常数(老股 = 10000+t),但候选全部是每只票 120 日的 cross_regbeta / cross_corr 时间序列回归,不依赖核心的截面排序,所以不构成候选的数值伪影,不据此挡。划掉:1(原始 |ρ| 0.84,对 Pr2b)、2(0.86)、3(0.94)、5(0.82)、7(0.72)、9(0.78)、10(0.87),都是 Pr2b 的同一读法(cov(C, x)/var(x) 或 corr)换窗口 / t 值 / EMA / 相对化,与 head 日度秩 >= 0.7,库禁令会拒绝。划掉 15 为数学问题:外层 x = delay(|G-1| / (Amt+1000)) 的量级约 1e-10,rolling_ols 的 var_x 远低于 EPS = 1e-9,beta 整个面板为 NaN(相关度表 nan 全行),定义坏掉。剩 4、6、8、11、12、13、14、16 共 8 个,>= 4 通过。创新 3:对象换了(相对成交额趋势、成交额份额、振幅比、gini、重心、|隔夜缺口|、日内高低比),但读法都是 Pr2b 的「对时间指数的 120 日斜率」;4 与 6 是 Pr2b 的归一化 / 窗口变体(原始 |ρ| 都是 0.60,残差 0.58 / 0.49),不给 4。其余对象(8 的 0.68、11 的 0.37、12 的 0.40、14 的 0.49、16 的 0.55)与 head 不是同一个量,但同属一族,所以给 3。合理 4:无前视,var_x 远高于 EPS,机制清楚(成交额 / 份额 / 参与度的慢趋势 = 持有者结构的慢流入)。如果它有 alpha,最可能来自:慢的参与度趋势本身(份额类 11、12 与流动性控制 |ρ| 只有 0.13 / 0.05 最干净),而不是 Pr2b 的 1/var(Amt) 标准化。"
