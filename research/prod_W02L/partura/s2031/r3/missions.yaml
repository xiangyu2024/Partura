  core: day_max(cross_age(pow_05(pow_2_5(High))))
  hypothesis: 机制。核心 C = day_max(cross_age(pow_05(pow_2_5(High)))) 是一个日历时间指数:cross_age 给出「自该股第一个有效值起的交易日数」(已在数据开头就有值的老股 = 10000 + 全市场同一个计数,新股 = 上市后天数),High 的幂只是保证有值的包装,不带信息。所以以 C 为一边的 cross_regbeta / cross_corr
    / cross_reg_tvalue(·, C, 120) 读的是另一边那个量在 120 个交易日里的「线性趋势」(斜率 / 相关 / t 值)。本组已有 head `cross_regbeta(cross_delay(day_sum(Amt),1), abs_(C), 120)`(+0.54,train +0.67 / valid +0.54):regbeta(x,y) 是 y 对 x 的斜率
    = cov(t, Amt)/var(Amt) = corr(Amt, t) × std(t)/std(Amt),即「成交额趋势的方向 × 1/成交额波动」,直白说就是成交额在 120 日里稳步上升、而且上升得很平稳(噪声小)的票排前面;拆解里 abs_ 与幂函数是废件(拿掉不变,+0.54),Amt 换 Volume 掉到 -0.15(valid)说明价格加权的成交额才是承重的,窗口 60 /
    240 都掉(valid -0.27 / -0.26)说明它读的是约半年的慢趋势。E 位的问题:这个「对时间指数的斜率」读法到底承重在哪——是『成交额趋势』这个量,还是『除以 var(x)』的标准化,还是回归的方向?怎样试:16 个种子保持 C 不动,换趋势的对象(相对成交额 = 去掉全市场成交额趋势;开盘 / 收盘一格成交额;开盘一格成交额占比;日内成交额集中度 gini / 重心;振幅;|隔夜缺口|;Amihud
    型 |日内收益| / 成交额)和换读法(相关 = 去掉 1/std、t 值 = 乘 sqrt(n)、反向回归 y=Amt 对 t 的斜率并用滚动均值归一 = 成交额的日增长率、先 EMA 平滑、窗口 90 / 180)。与已见过的不同:库与快照里含 C 的候选只有 head 的 regbeta(delay(sum(Amt)), abs(C)) 这一个外壳(Pr2b 的 5 个候选只是在 C 里叠幂函数
    / abs),这里的外围换成 corr / reg_tvalue / 反向 regbeta / cs_mean 相对化 / cross_ema / gini / centroid / 比值,骨架都不同。为什么样本外还会在:成交额趋势上升 = 持续增长的关注度与参与度(注意力 / 机构建仓被切碎成几个月的慢流入,Gervais-Kaniel-Mingelgrin 2001 高成交额溢价的慢变版本),这是持有者结构的变化,不依赖某段行情;去掉全市场成交额趋势后读的是相对关注度。风险:成交额趋势与市值
    / 流动性水平相关(新尺子已去掉对流动性、市值的线性 / U / S 形暴露);对 C 的斜率在 2024 年初成交额骤降的行情里可能异号(窗口 240 的 valid 掉到 -0.26 就是这类现象)。数学检查:无前视(cross_delay 天数为正;cross_age 只用到当日及以前的有限性;滚动回归窗口含当日不含未来);cross_regbeta 的分母 var(x) 在成交额不变(停牌补值)的窗口里趋近
    0,但流水线对缺失 / 常数窗口返回缺失,不是爆点;反向回归的自变量 C 在老股上是 10000+t,方差固定,无除零;Amihud 种子的分母加了 1000 元,防止停牌日成交额 0 造成除零。
