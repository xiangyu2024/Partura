- type: N
  hypothesis: 机制。上一轮本流里真正起作用的是「对市场回归掉之后的特质价格离散度份额」(French-Roll 型的特质 / 总方差,核心卡 5 一族),P 组的 +0.50 就是它长出来的;这一轮 N 位把同一个想法搬到成交额一侧:A = day_sum(Amt) 每天的成交额;cs_mean(A) 是当日全市场等权成交额(市场成交额的日度序列);cross_regres(cs_mean(A),
    A, 120) 是这只票今天的成交额在 120 日滚动里对市场成交额回归后的残差,即「个股自己的成交额冲击」(不是市场放量带来的)。于是 cross_stddev(残差,120) / cross_stddev(A,120) 就是成交额的非同步性(1 - R² 的开方版本,无量纲):大 = 这只票的成交由自己的消息 / 关注驱动,而不是跟着大盘放缩量;小 = 成交额只是市场成交额的影子(指数 /
    融资盘 / 被动资金主导,Morck-Yeung-Yu 的同步性思路,Chordia-Roll-Subrahmanyam 2000 的 commonality in liquidity)。其余 11 个种子读同一个残差的不同侧面:变异系数、对市场成交额的 beta / 相关、与价格特质残差(RI,日内收益对市场的残差)的相关及滞后相关、残差自相关(关注度是延续还是脉冲)、标准化最大冲击、残差的
    120 日均值 ÷ stddev(特质异常成交额的持续偏高,高成交额溢价的特质版本)、价格份额与成交额份额之差、开盘竞价占比的非同步性。为什么和库里不同:库里与已出 head 的成交额内容都是 day_sum(Amt) 的水平、延迟、argmin / 趋势类;没有一条在成交额上做「对市场回归取特质残差」,骨架 cross_regres(cs_mean(A), A) 在成交额上完全没有。与 5
    个控制的区别:读的是成交额对市场的耦合与特质离散度,全是无量纲比值,不是流动性水平(流动性控制是成交额水平)。为什么样本外还会在:非同步性是持有者结构与信息环境的慢变属性(指数成分 / 融资融券 / 机构占比几个季度不变),120 日窗口名次稳定,15 bp 成本下换手低;价格一侧的同类写法在本流 train / valid 都为正(+0.50 / +0.66),说明「特质 / 总」这个读法在
    A 股这把尺子上有信息,不是价格口径的偶然。风险:成交额非同步性可能是市值 / 指数成分的代理(新尺子已去掉对市值的线性 / U / S 形暴露,剩下多少未知);cross_stddev(A,120) 在极少数成交额几乎常数的老停牌股上近 0,但这类股的窗口内有效观测不足,会被置为缺失。数学检查:无前视(cs_mean 只用当日截面,回归窗口含当日不含未来);分母为 120 日 stddev
    或 120 日均值,成交额为正且非常数,无爆点;cross_regres 对只含单一自变量的滚动 OLS 取今天的残差,定义良好。
