  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 2, 3, 4, 5, 6, 13]
    reasons: '核心即快照 head 1 本身 ts_max(cs_demean(day_corr(Ret, Volume)), 120)。相关度表:核心与 5 个控制的 |ρ| 最大 0.12(known),远低于 E 位的 0.8 门槛,核心门槛通过。自动划掉 1–6 与 13:它们与 head 1 的原始日度秩 |ρ| 为 0.75 / 1.00 / 1.00 / 0.95 / 0.96 / 0.97 / 0.96,均 ≥ 0.7,与 GP 库禁令同一量,属于 §3 的自动划掉,不是数学问题;这几个都是 head 1 去掉 σ 或加 cs_regres 残差后的同一个量。剩 7–12 共 6 个,≥ 4,通过。逐个:(7) add(ts_max, ts_min) 与 head 1 的 |ρ| = 0.67,度量的是 120 日同步度上下尾的不对称,不是 head 本身,放行。(8) (ts_max - ts_mean)/ts_std 与 head 1 为 0.67,形状上是标准化极值;分子用 cs_demean 后的序列、分母用未去均值的 day_corr 的 ts_std,口径不一致,但 ts_std 不设最小样本,而比值的上界由 sqrt(n-1) 控制,n=1 时 0/0 为 NaN,没有爆点,放行。(9) cs_rank(head 1) 减 cs_rank(Amt 版同构 head),与所有 head 的 |ρ| 最大只有 0.07,两个 day_corr 在截面上高度接近,差值接近噪声,这是有效性上的弱点,不是数学问题,放行。(10) head 1 乘 120 日价格变动的符号,与 vol 控制 0.31、rev 0.21 中等相关,未到 0.5,放行。(11) head 1 乘 60 日 cs_demean 后的符号化成交额失衡,与 vol 0.29、rev 0.29、size 0.21,放行。(12) cs_rank(head 1) 减 cs_rank(120 日价格变动),与 vol 0.28、rev 0.21,放行。数学检查:cs_rank 走 nd_cs.py 的 _common_rank,无效值输出 NaN 而不是 0,不触发 nanrank_last 的停牌记 0 陷阱;day_last 取当日最后有效分钟收盘,ts_delta、ts_mean 只回看;没有前视。新颖度给 3:整个位是 head 1 的 ts_max 族外围的形状变换,核心已在库里,只有 9 与 11 的交互形式有一定新意,不给 4。如果有 alpha,最可能来自:第 11 项的买压符号交互(被价格没有反映的净买压),其次第 9 项的按股数与按金额同步之差;第 7、8 项与 head 1 的 0.67 相关,若有 alpha 更可能只是 head 1 的尾部形状,库禁令之后要留意它们是否只剩残差。'
  - slot: b
