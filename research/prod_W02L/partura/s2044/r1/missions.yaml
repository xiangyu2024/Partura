- type: E
  core: day_corr(Ret, Volume)
  hypothesis: '【读数】核心 C = day_corr(Ret, Volume):当天 241 根分钟的收益与成交量的相关系数 c_t(量价同步度;正 = 放量时在涨,负 = 放量时在跌)。这一批(B130,day_corr(F,F) 一族,58 条)里的事实(快照拆解表,不是我的推测):C 本身两段都亏(train -3.39 / valid -2.98);外面套长窗口取极值才转正:单层 ts_max 窗口 20 / 40 / 80 = -0.99 / -0.32 / +0.24,嵌套 40+80(等价于约 119 日的单层最大值)= +0.56(train +0.68 / valid +0.56);Volume 换 Amt 分数几乎不变(+0.23 / +0.52);富集表里含 C 的 7 个候选均值差 +1.10(p 0.015)。3 个 head 里两个就是 C 的 ts_max / ts_max 套 ts_max(只在窗口上不同),第三个是 Vwap 对 Amt 相关的 60 日中位数(-1.12)。

    【我的读法(推理,没有读数核对)】ts_max(c, w) 约等于 μ_i + σ_i · g(w):μ_i 是个股平均同步度,σ_i 是 c 逐日的抖动(由有效分钟数、成交是否连续、流动性决定),g(w) 随窗口变大。一个 241 分钟相关系数的抽样噪声在独立假设下约 1/sqrt(241) = 0.06,而不同股票 μ_i 的差异未必更大,所以 head 读到的很可能是「估计噪声水平 / 成交连续性」加上少数真正的极端同步日;窗口越长、换手越低、分数越高。这个核心的 alpha 究竟在 μ(持续的带量买入)、σ(噪声水平)、事件形状(极端同步日)还是 c 对未来收益的耦合里,三个现有 head 分不开。本位把 C 拆成四类与 ts_max 不同的读法来分开它们,每个种子都原样带着核心:

    (A) μ 与持续性,去掉全市场共同部分:cross_ema(cs_demean(C), 120)(先去掉同一天全市场的同步水平,再做半衰期 120 日的 EMA);cross_autocorr(C, 120, 1)(c 的逐日一阶自相关:连续数日同向的同步更像机构的拆单程序执行,孤立的噪声日没有自相关)。

    (B) 事件形状,σ 被约掉或回归掉:(ts_max - ts_mean) / ts_std(标准化极值);ts_max 对 ts_std 做截面回归取残差(去掉 σ 之后剩下的峰值);ts_max + ts_min(σ 在相加里抵消,只剩 2μ 与上下尾不对称);120 日偏度 ts_skew。

    (C) 耦合系数(Llorente, Michaely, Saar, Wang 2002 的量价动态关系):个股自己 120 ~ 180 日里「昨日 c」对「今日日收益 day_sum(Ret)」的 cross_regbeta / cross_corr / cross_reg_tvalue,以及全市场去均值版本与名次版本;另有同日耦合 cross_corr(c, day_sum(Ret), 120),和 c 对全市场平均 c 的 cross_regbeta(同步度的共性载荷)。估计量是斜率 / 相关,不是水平,不含成交额或市值的量纲。

    (D) 与价格趋势的交互:ts_max(c, 120) 乘 120 日收益的符号;ts_max(c, 120) 的截面名次减 120 日动量名次(同步度峰值高而价格没走 = 带量吸筹还没被价格反映)。

    【为什么与快照里已见过的写法不同】快照里围绕 C 的外围只有 ts_max、ts_max 套 ts_max 和 cross_med,全是「极值水平」,区别只在窗口。本位的外围是 EMA、标准化极值、截面回归残差、偏度、滚动回归斜率 / 相关 / t 值和与趋势的交互,没有一个是 ts_max 的窗口改写。15 个种子的算子骨架逐条对过两库 5583 条的骨架,都不在里面;ts_max 的窗口改写本来就会被库禁令挡掉(与 head 的日度秩相关约 0.7 以上),所以种子都避开了它。

    【为什么样本外还会在】来源是参与者构成(知情交易 / 对冲交易 / 散户投机交易的占比)和成交连续程度这类慢变量,窗口 90 ~ 180 日,同族库因子的换手只有 0.03 ~ 0.05,不依赖某一段行情;Llorente 等记录到量价动态关系在个股之间稳定地不同(信息不对称越大,放量日的收益越倾向延续)。

    【如果有 alpha,最可能来自】(C) 的个股耦合系数(别的流里,「收益对成交活跃度的滚动回归斜率」一类已经出过 head),其次是 (B) 的标准化极值,或 σ 回归掉之后的峰值;(A) 若只是水平,最可能被流动性 / 波动控制吃掉。

    【数学检查】标准化极值的分子是 max - mean,分母是同一窗口的 std,比值上界为 sqrt(n - 1),没有近零分母造成的爆点;cross_regbeta 在回归元方差不超过 EPS 时返回 NaN,不是爆点;所有滞后都是 ts_delay(·, 1),没有 ts_shift / cross_shift;不含 ts_rank / cross_rank,不触发 nanrank_last 的停牌记 0;没有用到当天收盘之后的数据。新上市约 20 日以内回归类窗口不满,噪声大,这些名字只占截面很小一部分。'
