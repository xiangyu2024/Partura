- type: N
  hypothesis: '【新想法】符号化的分钟成交额失衡,以及它与价格的错位。f_t = day_signed_ratio(Ret, Amt) = Σ(|Amt| × sign(Ret)) / Σ|Amt|:当天上涨分钟的成交额占比减下跌分钟的成交额占比,落在 [-1, 1],收益为 0 的分钟只进分母;它是不需要逐笔数据的净买压代理(Chordia 与 Subrahmanyam 2004 的 order imbalance 的分钟版)。它与 head 度量的不是同一个东西:head 用的是 corr(Ret, Volume),同时用到收益的大小和成交量的大小,受尾部和少数大分钟支配;f 只用收益的方向、按成交额加权,有界、没有尾部,而且这里全部是 60 ~ 180 日的慢量,不看单日极值。

    【算子怎样实现】(a) 慢水平:cross_ema(f, 60);cross_ema(cs_demean(f), 120)。(b) 流量对价格的错位(「吸收」假说:买压被被动对手盘吸收、价格没有反映,之后价格补涨;Kyle 1985):60 / 120 日净买入累计 cross_sum(f, d) 对同期累计收益 cross_sum(day_sum(Ret), d) 做截面回归取残差(买压里价格没有反映的部分);名次差版本 cs_rank(净买入累计) - cs_rank(累计收益);以及反向回归(涨幅里没有买压支撑的部分,即「没人买的上涨」)。(c) 耦合系数(Llorente, Michaely, Saar, Wang 2002):个股 120 ~ 180 日里「昨日 f」对「今日日收益 day_sum(Ret)」的 cross_regbeta / cross_corr / cross_reg_tvalue。(d) 持续性(机构大单拆分执行使订单流方向有长记忆:Lillo 与 Farmer 2004;Bouchaud 等 2004):cross_autocorr(f, 120, 1),以及乘以 120 日净买入方向的符号。(e) 极值与分时段:ts_max(f, 120);尾盘 61 分钟(第 181 ~ 241 分钟)的 f 的 60 日 EMA,以及它减去开盘 60 分钟(第 1 ~ 60 分钟)的 f 的 60 日 EMA(尾盘由要在收盘前完成调仓的参与者主导,开盘更多承接隔夜消息)。

    【与库里 head 和控制的区别】库里 head 全是 c = corr(Ret, Volume) 的极值 / Vwap 对 Amt 相关的中位数;这里的底是 day_signed_ratio,骨架里没有任何一个是 day_corr 或 ts_max 套 day_corr。控制是流动性、波动、20 日反转、已知成交额离散度和流通市值:f 无量纲、有界,与成交额水平、波动水平没有函数关系;(b) 类种子显式把同期累计收益回归掉,所以不是 20 日反转控制的换写法。14 个种子的算子骨架逐条对过两库 5583 条的骨架,都不在里面。

    【为什么样本外还会在】机构大单拆分执行要持续数日到数周,订单流方向的持续性和「价格没有反映的买压」是慢变量;A 股 T+1 且散户主导,买方与卖方的执行节奏不对称。窗口 60 ~ 180 日,换手低,不依赖某一段行情。

    【如果有 alpha,最可能来自】(b) 与 (c):净买入里没有被价格反映的部分(被吸收的买压),或个股对订单流的价格反应系数;(a) 的纯水平最可能被反转 / 流动性控制吃掉。

    【数学检查】f 在停牌日(Σ|Amt| = 0)为 NaN,cross_sum 用 nansum 跳过缺失日,cross_ema 跳过缺失日、不补 0;cross_corr / cross_regbeta 在方差为 0 时返回 NaN,不是爆点;种子里没有除法;不含 ts_rank / cross_rank,不触发 nanrank_last 的停牌记 0;所有滞后都是 ts_delay(·, 1),没有 ts_shift / cross_shift;f 只用当天分钟数据,没有用到当天收盘之后的数据。'
  inspired_by: 第 1 批 B130(day_corr(F,F) 一族,58 条)的现象:C = day_corr(Ret, Volume) 本身两段都亏(-3.39 / -2.98),但长窗口极值转正(单层 ts_max 窗口 20 / 40 / 80 = -0.99 / -0.32 / +0.24,嵌套约 119 日 = +0.56),Volume 换 Amt 不变,含 C 的候选均值差 +1.10(p 0.015)。说明「分钟收益与成交的日内同步」里有慢的、与量纲无关的信息,而且只在窗口 >= 80 日时才露出来。f 是同一对原料(分钟收益与成交额)的另一个统计量(方向 × 成交额加权),不读相关系数。
