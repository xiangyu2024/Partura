  hypothesis: '机制:核心 C = day_q_stat_std(Volume),当天 241 根分钟成交股数序列的 Ljung-Box Q 统计量(滞后
    1 到 20 分钟)的标准差,读的是「分钟成交量的日内自相关有多强」。它是相关量,与尺度无关,所以送转 / 拆股造成的股数水平跳变不影响它。


    本批(B002、B003)的证据:

    (1) 富集:含 C 的 42 个已评分候选均值 -1.60,不含的 -2.98(均值差 +1.38,p < 0.001);heads 全是 ts_quantile_q75
    的嵌套链。

    (2) 平滑越深越好,而且很快饱和:拆解表的 sufficiency 行,1 层 -2.32,2 层 -1.73,3 层 -1.31 到 -1.75,4 层
    -1.25,5 层 -0.69,6 层 -0.73,7 层 -0.67;在 5 层以上敲掉一层只差 -0.05 到 +0.01。这条链读的是 C 的「数百个交易日的长期水平」,一个随年份才缓慢变化的股票特征,换手约
    1% / 天,成本不是问题,问题在毛超额。

    (3) 方向翻转:这些链在库里的原始尺子下方向是 -1(原始 rank IC -0.02 到 -0.04,原始净夏普 +1.0 到 +1.5),在新尺子(去掉
    5 个控制 + 2 个冠军)下方向翻成 +1,分数 -0.67 / -0.40、-0.69 / -0.69、-0.75 / -0.56(train / valid)。读法:C
    的长期水平里有预测力的部分(分钟成交量日内黏性强 = 市值大、流动性好、成交形状稳定的股票)已经被控制吃掉;去掉之后,水平本身的毛超额不为正。

    (4) 这些链彼此的日度秩相关预计 >= 0.9(没有实测),再叠平滑层、换窗口、换分位数、换 Amt 都会与 head 的 |rho| >= 0.7 或同骨架,被库禁令拒绝;所以这一位不再给
    C 套 ts_quantile 或别的单股滤波。


    这一位要试的:C 的水平被控制吃掉了,就读 C 在控制之外的三种形态,每一种都慢(窗口 30 到 241 日;W02L 第 1 轮里别的流分数最高的几个式子大多是
    241 日均值,或 120 日离散度加流通市值十分位标准化,同一类):

    (a) 桶内水平(种子 1 到 4):在流通市值十分位、60 日成交额十分位、名义股价十分位(sub(LogFloatCap, LogFloatShares)
    = log(流通市值 / 流通股本) = log 名义股价,假设未在本机验证,只当分桶变量)内做 z 分数或去均值,或对 log 成交额做截面回归取残差。比较的是「同样大、同样活跃的股票里,谁的成交量序列更黏」。

    (b) 水平的变化(种子 5、6、13):log C 的 60 日均值减 241 日均值,或 20 日均值相对自己 241 日的 z 分数。读的是「这只票的成交序列正在变黏
    / 变散」。机制:持有期长的机构(拆单执行,成交序列平滑)进入时 C 上升、离开时下降;变化量把控制共享的水平差分掉了。

    (c) 离散度与关系(种子 7 到 12、14):log C 的 120 日标准差(特征不稳定 = 参与者构成在切换);C 与 day_std(Ret)、C
    与 day_q_stat_std(Ret)、与日成交额的 120 日滚动相关或对数弹性(成交量黏性随波动、随成交额放大的程度:消息驱动的黏性对执行驱动的黏性);对
    |Ret| 的 Q 统计量做截面回归取残差(去掉「信息到达引起的一般聚集」,留下成交量独有的黏性);对成交额离散度(已知族的原料)取残差。(c) 的水平被差分、相关系数或回归去掉了,与
    head 的秩相关应当 < 0.5。


    为什么和已见过的不同:快照里含 C 的候选,外围算子都是单股时间序列滤波(ts_quantile_q75、ts_sum、ts_stddev、ts_var、ts_delay、ts_delta、ts_skew、ts_hurst、ts_autocorr_s1、ts_argmax,以及
    3 日 cross_mean);这里的外围是截面分桶与截面回归(cs_bucket_zscore、cs_bucket_demean、cs_regres)、两个日度量的滚动关系(cross_corr、cross_regbeta)、跨窗口差(sub
    两个 cross_mean)、cross_zscore,没有一个与它们是同一个集合。所有种子的算子骨架(抽掉字段、常数、窗口)已逐个与 struct/members.csv
    的 5583 条对照,没有重复,也不与 6 个 head 同骨架。预期风险最大的是种子 1 到 4(水平仍在,与 head 的秩相关可能接近 0.7),其余种子的水平已被差分或相关系数去掉。


    为什么样本外还会在:C 的结构来源(机构拆单执行 / 做市与算法交易占比 / 投资者构成)变化以年计,窗口 60 到 241 日后名次稳定,15 bp 下换手低,分数由毛超额决定,不靠频繁调仓;(a)
    把市值与流动性的暴露用分桶拿掉,不依赖某个风格的行情;(b) 的变化量用每只票自己做对照,不依赖截面静态风格;(c) 的关系量是无量纲的相关与弹性。最可能的失败:(a)
    与 head 的秩相关 >= 0.7 被表划掉;(b)(c) 的 60 到 120 日窗口估得太吵;或者 C 在控制之外根本没有 alpha。三种情况下这一位都不出
    head,下一轮不再用这个核心。


    数学检查:Q 统计量是非负量的标准差,正常日 > 0,log 在近 0 处给 NaN 而不是负无穷;Q 只用当天分钟,cross_* 一律只回看(窗口 >=
    20 日)、cross_delay 的天数为正,无前视;cs_regres(Y, X) 是 Y 对 X 的截面残差,参数顺序按这个写;cross_regbeta(x,
    y, d) 是 y 对 x 的滚动回归斜率,种子里 x 是 log 成交额 / log 波动,y 是 log C,斜率是弹性,不是带量纲的水平;cs_bucket_zscore
    带 EPS 保护;cross_corr / cross_regbeta 窗口里有效对太少时可能返回 0(已知缺陷,只影响新股与长期停牌票,可交易掩码已排除);没有用
    ts_rank / cross_rank(日轴),不碰 nanrank_last 的停牌返回 0。'
