- type: N
  hypothesis: '机制:把每只票自己的日内成交形状除掉之后,「放量能持续多少分钟」是个慢变的参与者构成指纹。


    背景(B002 / B003):B002 的 heads 是 day_q_stat_std(Volume) 的深嵌套平滑;B003 与手写库 L#7 到 L#17(B071)是同一个统计量作用在
    Volume 或 Amt 占当天总量的比例上。分钟成交量序列的 Ljung-Box Q 主要由两件事决定:(i) 这只票稳定的日内 U 形成交分布(开盘收盘放量、午间缩量,一条几乎每天相同的确定性形状,随市值、流动性、股价一起变);(ii)
    真正的成交聚集,即放量一旦出现能延续多久。(i) 是控制变量的化身,(ii) 才可能是 alpha。证据:这些链原始方向 -1、原始 rank IC -0.02
    到 -0.05(库里原始净夏普 +1.0 到 +1.5),新尺子下方向翻成 +1、分数 -0.4 到 -0.75,即有预测力的部分是与控制共享的那一块(i)。5583
    条库式子里没有一条把 Q 统计量用在「已除去自己同分钟基线」的序列上:day_q_stat_std 的操作数只有叶子、in_slice 占比、in_zscore_rolling
    占比、pow_2(Ret) 之类。


    做法:div(Volume, cross_mean(Volume, 20)) 把每个分钟格子除以同一分钟自己过去 20 个交易日(含当天)的均值(cross_mean
    作用在分钟立方体的日轴上,每只票每个分钟有自己的基线),得到「相对自己正常水平的放量倍数」序列;U 形被除掉,留下事件性放量。再取 day_q_stat_std,即滞后
    1 到 20 分钟的 Ljung-Box Q 的标准差:倍数序列的黏性。最后取 120 到 241 日均值,变成慢变特征(其他流第 1 轮里分数最高的式子同样是
    241 日均值型)。


    为什么会有 alpha(三条可检验的链):

    (1) 订单拆分:机构大单被拆成小单,在数小时内持续成交(Lillo 与 Farmer 2004;Bouchaud 等 2004,订单方向的长记忆),放量连续出现,Q
    高;散户的单笔冲击、对倒、偶发大单是孤立尖峰,Q 低。长期 Q 高 = 拆单型参与者占比高,是持仓行为的慢变指纹,而不是流动性水平。

    (2) 注意力扩散:新闻、涨停、话题引起的放量在 A 股散户市场往往延续一整天,Q 高;长期被事件反复吸引注意的股票之后收益偏低(Barber 与 Odean
    2008 的注意力购买)。

    (3) 带符号版本(种子 4、5、7):mul(sign(Ret), 倍数) 是带方向的订单流代理(不用逐笔数据),它的 Q 是「同方向持续成交」的强度;种子
    7 把它与无符号版本相减,得到方向性延续超过纯放量聚集的部分。符号随机交替的 U 形不会推高带符号序列的自相关,所以种子 5(原始股数乘符号)本身已经近似去季节。

    方向由尺子在训练段选,我不预设。


    和已有的不同:(a) 与 head 链不同:操作数不是原始 Volume,同一统计量作用在去过 U 形的序列上,与 head 的秩相关预期 < 0.5;(b)
    与 B071 手写式不同:那里的操作数是 Volume 占当天总量的比例,仍含 U 形,这里是自己 20 日同分钟基线的倍数,并且慢 4 到 12 倍;(c)
    与第 1 轮 N 位(放量分钟里的价格签名)不同:那一位读价格,这一位读成交量序列自己的结构。种子里还有三种不同的去季节办法(除以 20 日均值、除以 20
    日中位数、对数一阶差分 in_logchg)、两种统计量(Q 统计量、5 分钟滞后自相关)、截面处理(流通市值分桶、对 |Ret| 的 Q 取残差)和时序形态(水平、离散度、变化、与波动的滚动相关)。骨架已逐个与
    5583 条库及 6 个 head 对照,没有重复。


    为什么样本外还会在:读的是参与者构成与执行方式,变化以年计;241 日均值换手低;Q 是相关量,不受送转 / 拆股的股数水平跳变影响(Volume 是未复权原始股数,基线与当天同尺度,比值抵消,这一点对本位很重要);带符号版本不依赖某段行情的方向。最可能的失败:倍数序列的尖峰让每天的
    Q 很吵(241 日均值平均掉大半,种子 12 用 log 压缩尾部);与波动控制相关(放量与波动同时出现),新尺子会去掉线性、U 形、S 形暴露;若不出
    head,下一轮不再押这个统计量。


    数学检查:基线为 0(20 日全停牌)时 div 给 NaN(不是无穷),Q 对 NaN 做配对掩码,全天无成交的日子得 NaN 而不是 0,热身期是训练段开头
    20 日,占比 < 2%,不主导;log(倍数) 在倍数为 0 时给 NaN,只影响种子 12;sign(Ret) 在 Ret = 0 时为 0,表示该分钟无方向流量,不是缺失;cross_mean
    与 cross_med 只回看含当天的 20 日,t 日收盘后可得,t+1 才交易,无前视;in_logchg 只在当天分钟轴上取差;cs_regres(Y,
    X) 是 Y 对 X 的截面残差,参数顺序按这个写;cs_bucket_zscore 带 EPS 保护;没有用 ts_rank / cross_rank。'
