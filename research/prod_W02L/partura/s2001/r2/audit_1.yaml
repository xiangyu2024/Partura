slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 4]
    reasons: '核心 day_q_stat_std(Volume) 的原始 |ρ| 与 6 个 head 的最大值为 0.35（最像的是 5 层链），与 5 个控制的 |ρ| 为 0.15–0.47，远低于 0.8，核心门槛通过。自动划掉：种子 1（与 head 原始 |ρ| 0.854，残差 0.804）、种子 4（与 head 0.751）。其余 12 个保留。创新度给 3：6 个 head 与核心是同一个统计量，新意只在外围算子。与 head 原始 |ρ| ≤0.28 的有种子 5、6、7、8、9、10、12、13，它们读的是水平变化、桶内离散、Q 与收益的关系，确实不是换写法；种子 2（0.60，残差 0.69）、3（0.52）、11（0.66）、14（0.56）仍接近 head 的水平读法，只是换了截面处理。合理度给 4：逐个算子核对，实现与理由一致。day_q_stat_std 是 20 个滞后的 Ljung-Box Q 的标准差（dt_day.py 第 366 行），对成交股数的量级不敏感；cs_regres(Y,X) 是 Y 对 X 的截面残差；cross_regbeta(x,y,d) 是 y 对 x 的滚动斜率（rolling_ols 的 y ~ alpha + beta*x），种子 9、12 的弹性读法参数顺序正确；cross_* 都是尾随窗口，无前视。数值风险（记录，不划掉）：Q 的分母是 sqrt(var*var + 1e-8)，1e-8 是绝对常数；Ret 为分钟收益（量级约 1e-3），种子 10（Q(Ret)）与种子 11（Q(|Ret|)）对安静票的自相关会被压低，Q 因此部分携带波动水平。种子 11 与 vol 控制的秩相关只有 0.02，说明这一效应在本种子上不主导。如果它有 alpha，最可能来自：桶内水平（种子 2、3）的慢变参与者构成，或 Q(成交量) 与 Q(收益) 的关系（种子 8、10）里「成交黏性」独立于「价格黏性」的部分，而不是水平本身。'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: [1, 2, 3, 5, 6, 7, 10]
    reasons: 'N 位的机制是把成交量除以同分钟 20 日均值（cross_mean 尾随且含当天，比值上界为 20；分母为 0 时分子也为 0，结果为 NaN，算子实现正确）后再取 Q，想去掉 U 形。表上的证据没有支持「去掉 U 形」这一步：自动划掉的 1、2、3、5、7、10 与 head 的原始 |ρ| 为 0.74–0.76，与流动性控制的 |ρ| 为 0.67–0.74，比值化之后的 Q 仍然携带 head 的大部分与流动性成分。种子 6 为边界（0.700，三位小数），按 ≥0.7 计入划掉；若未四舍五入的值低于 0.7，则保留，以确定性检查为准。保留的 4、8、9、11、12、13、14 与 head 的原始 |ρ| 为 0.12–0.58，确实是不同的读法，创新度给 4。合理度给 3：机制（订单拆分、注意力扩散、带符号版本）写得清楚，文献依据也成立，但算子实现的去季节效果在表上没有达到，属于实现与理由有差距。数学检查有三处 PI 写错或漏掉：（a）种子 2 用 cross_med 作分母，中位数在过半日子该分钟零成交时为 0，此时 div 对正的分子给 +inf（torch.divide 的语义，不是 NaN），整天的 Q 变成 NaN；该种子已被 head 规则划掉。（b）种子 11（in_logchg）与 12（log 比值）把零成交分钟变成 NaN；day_q_stat_std 对配对掩码取 rho，但归一化仍用全长 T=241，有效配对少的票 Q 被系统性放大，与零成交率相关。种子 11 与流动性控制的秩相关为 0.68。我没有划掉它们，因为没有看到它们主导排序，但结果应当检查。（c）PI 说「比值抵消」对拆股、送股不完全成立：20 日基线在拆股后 19 日内混合了新旧股数，比值失真。种子 9 的 X 是 Q(|Ret|)，同样受 1e-8 常数项影响（见 a 位说明）。如果它有 alpha，最可能来自：放量序列的持续性与关系（种子 4、8、9、13、14），而不是比值的水平。'
