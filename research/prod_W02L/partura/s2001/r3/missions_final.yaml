- type: N
  hypothesis: '机制:信息驱动的成交聚集 vs 执行驱动的成交聚集,读的是短窗口里"成交额变动的弹性"。day_q_stat_std(Volume)
    是当天分钟成交股数 Ljung-Box Q 的标准差(日内黏性)。cross_regbeta(log 成交额, log Q, d) 是 log Q 对 log
    成交额的 d 日滚动回归斜率:成交额放大一倍时黏性放大多少。

    灵感:第 2 轮 E 的 GP 在 Q 核心上自己长出了 cross_regbeta(log(day_sum(Amt)), log(day_q_stat_std(Volume)),
    10),window 10 的 score -0.20(train +0.09 / valid -0.20),比同一式子 window 120 的 -0.66
    好 0.46;而 Q 的长链水平式 (-0.4 到 -0.75) 毛超额为零。结论:Q 与成交额的关系在短窗口里比水平有用,慢窗口反而更差,与第 2 轮我自己写的"越慢越好"信念相反(第
    2 轮 E 与 N 的种子全部是 60 到 241 日,没有一个出 head)。

    做法:窗口 10 到 30 日的 cross_regbeta / cross_corr,把 Q 的水平(控制共享)差分成弹性与相关;弹性大 = 放量时成交变黏(拆单执行、大户在场),小
    = 放量是孤立尖峰(散户事件)。变体:(1) 换自变量(Amt 的 Q、日内波动、|Ret| 的 Q);(2) 分桶 / 回归去市值(种子 9、10);(3)
    短窗对长窗差(种子 11)与 5 日平滑(种子 12);(4) 120 日 z 分数(种子 16)检验把慢窗换成短窗后再慢化是否保留信号。

    与库的不同:库里 Q 的使用都是"Q 的时序滤波"(ts_quantile / ts_var / autocorr),没有 Q 与成交额的滚动回归;第 2
    轮 E 里只有 120 窗口的版本,骨架相同但窗口不同的候选 GP 的库禁令按骨架抽掉常数,所以此处的骨架在第 2 轮 E 的 GP 候选之外要靠外围(分桶、差、zscore)区分。

    为什么样本外还在:成交额-黏性弹性读的是参与者构成对放量的反应,与市值 / 流动性水平无关(回归斜率,无量纲);短窗口使其随市场状态而更新而不是随年份漂;缺点是噪声大、换手高。预测出
    head 概率低,主要价值是检验"短窗口是否真的好于长窗口"。

    数学检查:Q 非负,日度正;log 在 0 处给 NaN 而非 -inf;cross_regbeta/corr 窗口有效对少时可能返回 0(已知缺陷,影响新股与长期停牌票,可交易掩码已排除);cross_*
    回看含当天,无前视;cs_regres(Y, X) 是 Y 对 X 的截面残差;未用 ts_rank / cross_rank。'
