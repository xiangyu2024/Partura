    ÷ 名义股价的平方"。名义股价用的是未复权价,与股票的上市历史、送转配股史绑在一起:价格低而年龄长 = 长期无送转、价格被磨低的老票;价格高而年龄短 = 新上市、高发行价。

    证据(第 3 轮定位表,B003 附近的 229 个候选):含 div(ListAge, day_topw_mean(Open, *)) 一族的候选共 5
    到 9 个,均值差 +1.0 到 +1.35,p 约 0.006,是共性表里除 Q 链外最强的一族;第 2 轮 GP 里 add(day_q_stat_std(Volume),
    C) 一度到 train +0.66 / valid -0.04,说明 C 在 train 段有正的纯多头毛超额,valid 没有撑住,问题在外围:C 本身是"年龄
    / 价格^2"的慢变水平,与市值控制(LogFloatCap)暴露很高,valid 里大小盘风格切换把它吃掉。

    这一位要试的外围(与第 2 轮见过的"和 Q 相加"都不同):(a) 市值 / 成交额 / 名义股价分桶内标准化或回归残差,留下同样大小里"年龄 ÷ 价^2"的相对位置(种子
    2、3、7、8、10、11、16);(b) 慢化与变化量(60 日均值、20 日对 120 日差、120 日 z 分数,种子 4、5、6),降低换手;(c)
    与波动 / 成交额的 120 日滚动关系(种子 9、14、15),把水平差分掉,读"价格水平与活跃度、波动联动"的参与者结构;(d) 对 Q 水平的回归残差(种子
    13、16),利用第 2 轮发现的 C 与 Q 互补部分。

    为什么与已见不同:快照里含 C 的候选外围只有 add(Q, C) 与自己套 div;这里的外围是截面分桶 / 回归和滚动关系,没有一个与之相同。库里没有任何表达式用
    ListAge 与未复权价相除(库骨架已对照),所以与 head 的秩相关应低。

    为什么样本外还在:年龄与名义价是结构性的慢变量(以年计),换手低;来源是 A 股新股发行高价与长期低价股的投资者构成差异(彩票偏好、壳价值),不依赖某段行情;分桶后不再押大小盘风格。风险:C
    是水平,valid 里可能仍与市值族共线;则不出 head,下一轮不再用这个核心。

