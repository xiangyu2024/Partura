    reasons: '创新度 4:计划的核心是两个日度量 log 成交额 与 log Q(成交量 Ljung-Box 标准差)的滚动回归 / 相关。相关度表里对最像的 head(ts_autocorr_s1 或 ts_var 的 Q 链)原始 |ρ| 为 0.04 到 0.26,seed 15 最高 0.33(对 ts_var);对 5 个控制最高的是 seed 15 的 vol 0.48 与 liq 0.40,其余都在 0.3 以下,没有一个接近 0.8。快照里的 Q 只以时序滤波的形式出现(ts_* 与 Q 的水平),两个日度量之间的滚动关系是新的结构。算子核对:cross_regbeta(x, y, d) = rolling_ols(x, y, d)["beta"] = y 对 x 回归的斜率(dt_cross.py:299,common.py:643 的 y ~ alpha + beta*x),所以 cross_regbeta(log Amt, log Q, d) 确是 log Q 对 log 成交额的斜率,与计划描述一致。day_q_stat_std 是 Ljung-Box Q(k) 在 k=1..20 上的标准差(dt_day.py:366),非负;log 对 |x| <= 1e-9 给 NaN(common.py:211),没有 -inf 爆点;cross_* 回看含当天,无前视。合理度 4:机制清楚(放量时分钟成交的黏性是否变化,读拆单执行与孤立尖峰的参与者结构),窗口 10 到 60 日的选择有理由,变体覆盖面合适。两处小纠正(不挡):(a) 计划说 cross_regbeta 「窗口有效对少时可能返回 0」,按 common.py:663 实际返回的是 NaN(var_x <= EPS 时),不是 0;(b) 10 日窗口的斜率只有 10 个观测,估计噪声大,这是 seed 1 到 3 与 seed 12 的主要风险,但不是数学问题。种子逐个看:1 到 5、7、8、13 到 16 保留;6 与 7 的 cross_corr 与 head 的 |ρ| 都在 0.2 以下,保留;9、10 的分桶与回归保留;11 的 10 减 60 日差保留。没有种子与 head 或控制重复,也没有数学问题,全部保留。如果它有 alpha,最可能来自放量时分钟成交黏性的变化(大单拆分执行的放量变黏 vs 散户孤立尖峰的放量不变黏),即参与者结构;若无 alpha,多半是 10 日样本的估计噪声,20 与 30 日的版本更可能留下信号。'
