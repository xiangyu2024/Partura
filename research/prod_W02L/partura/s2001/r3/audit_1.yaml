    reasons: '创新度 4:核心 div(div(ListAge, day_topw_mean(Open, High)), day_topw_mean(Open, High)) 与快照里任何 head 都不是同一个东西。相关度表里对最像的 head(ts_quantile 嵌套链)原始 |ρ| 为 0.33,对 5 个控制 liq 0.28 / vol 0.08 / rev 0.02 / known 0.24 / size 0.04,全部远低于 0.8。快照 heads 没有一个用 ListAge 或价格水平,所以是新的输入维度。合理度 3(不是数学问题,但机制叙述与代码有三处对不上,下面逐条):(1) 计划说 day_topw_mean(Open, High) 是「当日最大成交量分钟上的开高平均价」,与 ops_ext.py:635 不符:day_topw_mean(y, w) 取的是 |w| 最大的 10% 分钟上 y 的均值,这里 w 是 High,所以是「最高价分钟上的开盘价均值」,与成交量无关。(2) 计划说价格是「未复权价」、机制是「送转配股史 / 名义股价」。快照里 Open/High 是后复权价(AlphaCube-steering docs/design.md §11.5:生产 store 的 Open/High/Low/Close/Vwap 是后复权价,Amt 与 Volume 是原始量)。按 §4,后复权价的排序约等于从基期以来的累计收益,是长周期动量 / 反转信号,不挡。但这意味着 P 不会在除权日跳变(没有 4 倍的 1/P² 跳变),机制要换成「累计收益指数的长周期水平」。(3) 计划说 ListAge 是「慢变的上市年龄」。dailyfields.py:206-223 显示,2018-01-02 已在上市状态的股票被加上哨兵 10000,即 ListAge = 10000 + 自 2018 起的交易日数;只有 2018 年后上市的股票才有真实年龄(约 0 到 2000)。所以大多数老票在任一日的截面上 ListAge 是同一个常数,老票之间的排序只由 P 决定,「长期无送转的老票」这个年龄维度实际上只体现为老票 / 新股的分界(量级差 5 倍以上)。另外计划说核心与市值控制「暴露很高」「valid 里大小盘切换把它吃掉」,但相关度表里核心对 size 的原始 |ρ| 只有 0.04,这一论断与表不符。这三处都不是 §4 的数学问题(表达式定义良好,无前视,无近零除法,day_topw_mean 只用当天分钟,正整数 ListAge 的分母为正),所以按 §3 放行,但不给到 4。时间序列种子(4、5、6、12、14、15)在 20 到 120 日窗口里,老票核心的变化几乎全部来自 P 的涨跌(ListAge 每天只增加 10000 的 0.01%);seed 5 对 rev 控制 |ρ| 为 0.58 与此一致。这些种子在机制上是价格路径的变换,不要把它们的结果归到年龄上,但不构成挡的理由。逐个种子:1(核心本身)保留,它不是任何 head 的复制;2、8、10、11、12 的分桶 / 回归保留;3(对 LogFloatCap 的线性残差)的 Spearman 与 liq 0.51、size 0.49 仍高,说明线性残差没去掉非线性的市值关系,但未达 0.8,不划;5 的 rev 0.58 不划,但它是价格路径的标准化;10 的分桶变量 sub(LogFloatCap, LogFloatShares) 按 docs/steering_and_daily_fields.md 的说法不一定等于后复权价的对数,计划的「名义股价」假设未验证,只当分桶变量用,保留。如果它有 alpha,最可能来自后复权价指数 P 的长周期水平(约从 2018 年或上市以来的累计收益)的反转(1/P² 的截面排序),其次来自 2018 年后上市新股与老票的分界。'
