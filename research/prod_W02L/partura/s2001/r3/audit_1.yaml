    reasons: '合理度 4。算子核对:ts_quantile 是 torch.nanquantile 在滚动窗口上取分位数(nd_ts.py:263),不走 nanrank_last,所以 §4 里 ts_rank / cross_rank / in_rank_rolling 共用的停牌排 0 问题不适用于这条链;cs_regres(Y, X) 是 Y 对 X 的截面残差(nd_cs.py:254),方向与计划一致;cross_mean(log(day_sum(Amt)), 120) 只用历史到当天的值,无前视。数值:log(day_sum(Amt)) 为正(停牌日缺失而非 0),无近零除法。热身与记忆:五层嵌套的 q75 链有效记忆约 200 个交易日,加上 120 日均值,训练段从 2018-01-02 起,前约一年为 NaN,不主导 train 与 valid 的分数,但这条链是很慢的滤波,信号变化慢,与计划说的「慢水平」一致。机制:分钟成交量日内黏性的长期水平在去掉 120 日流动性后的截面残差,说得通。变体中 1 到 8 对原 head 的 |ρ| 为 0.81 到 0.94(相关度表),按计划它们只能是替换候选而不是新 head,这一点不影响合理度。'
