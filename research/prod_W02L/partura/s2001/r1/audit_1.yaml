    reasons: '相关度表(train):14 个种子对快照 head 的原始 |ρ| 最大 0.347(种子 9,对 pow_1_5(day_max(Volume))),其余 ≤ 0.26;去控制后的残差 |ρ| 中种子 9 为 0.54,种子 13 对 ts_autocorr 头为 0.35,种子 4 为 0.32,其余 ≤ 0.27。对控制的原始 |ρ| 最大为种子 6、7 对 rev 的 0.58,种子 13 对 vol 为 0.38,都低于 0.8,无自动划掉。独立核对:14 个种子的骨架在两个库(5583 条)与 W01 的 6 个 head 中都没有相同骨架。位内有两对是同一量的不同平滑 / 标准化写法:种子 1(20 日均值)与种子 2(10 日均值的 120 日 z 分数),种子 9 与种子 11(z 分数);种子 5 是种子 1 在流动性十分位内的标准化,也属近写法,但不是 head 或控制的换写,不挡。全位不划掉。算子核对:day_wstd(Ret, Volume) 与 day_std(Ret) 的比值被夹在 [0, √241] 之内(加权方差不超过等权方差的 241 倍),分母近零不会爆点;day_wmean 与 day_mean(|Ret|) 的比值 ≤ 241,day_topw_mean 与 day_mean(|Ret|) 的比值约 ≤ 10(top 集合至少约占 10% 分钟),都有界;day_signed_ratio 在 [−1, 1];in_delay 只在当天分钟轴上移位,t 日收盘后可得,无前视;种子 12、13、14 的配对(上一分钟的成交量与符号 ↔ 下一分钟的收益或波动)与文字描述一致。非致命的定义问题(不挡,写给 PI):(i) day_corr 在某一日 Ret 全为 0(一字板)时返回 0 而不是 NaN(corr = cov / (sqrt(var·var) + EPS)),种子 9、10、11 在这些日子的信号落在 0,这类日子只占少数,不是结果的主要来源;(ii) day_topw_mean 在超过 90% 分钟零成交时阈值为 0 并退化为全天均值,种子 6 变成恒为 0,种子 4 与 13 变成比值 1,只影响极稀的票;(iii) 种子 6 与 7 对 20 日反转控制的相关为 0.58,净买入近似当日涨跌的风险(PI 已写),reward 会去掉控制的线性、U 形、S 形暴露,剩下的部分才算数。Amt 与日内比值不受送转影响,位内的比值结构对未复权股数基本免疫。如果它有 alpha,最可能来自:放量分钟的价格冲击弹性(种子 1、3、4:放量时价格是否主要动)与放量之后的订单流延续或回吐(种子 9、10、12、13:带符号成交量与次分钟收益的相关,是 Pastor 与 Stambaugh 回吐系数的分钟版),两者都是盘口深度与参与者构成的截面差异,变化慢。若它的 alpha 只是 head 残差的一部分,最可能在种子 9(残差 0.54)。'
