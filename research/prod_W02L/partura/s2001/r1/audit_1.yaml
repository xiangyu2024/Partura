    reasons: '相关度表(train,corr_1.json):核心 day_max(Volume) 即快照 head(原始 1.00),E 位允许以整个 head 为核心;核心对 liq / vol / rev / known / size 的 |ρ| 为 0.49 / 0.23 / 0.19 / 0.54 / 0.47,都低于 0.8,过核心门槛。15 个种子对 head 的原始 |ρ| 最大 0.47(种子 1),其余 ≤ 0.30;去控制后的残差 |ρ| 偏高的是种子 7(0.55)与种子 14(0.50),其余 ≤ 0.27;对控制的原始 |ρ| 最大为种子 4 对 liq 的 0.65,未到 0.8。自动划掉的条件无一触发。独立核对:37 个计划表达式(E 15 + N 14 + R 8)的骨架与 5583 条库骨架对照(骨架规则同 members.csv,宽松匹配复现 5264/5583 条,其余差异来自标量运算数的 C 标签,计划的种子没有这类运算数),无一重复;与 W01 的 6 个 head 骨架也无一相同;含 day_max(Volume) 的 27 条库表达式的外围算子集合,与 15 个种子的外围集合无一相同。未测的:种子与 W01 head、别的流 head 的 ρ(相关度表只含快照 3 个 head)。划掉种子 4:cross_mean(div(day_max(Volume), day_sum(Volume)), 20) 与 R 变体 7 表达式完全相同,只差窗口(20 对 60),是同一个量换平滑长度,R 组已直接评分,在 E 种子里再放一份就是重复。创新度 4:种子对 head 与控制的残差相关普遍低,是对同一峰值变量的新读法(相对自己历史的 z 分数与比值、与成交额的截面与时序残差、峰值与收益 / 波动的 60 日滚动相关、峰值集中度的价位分桶、冲击与趋势方向的乘积),骨架在库里找不到。没给 5,因为核心本身是库里已有的 head,而种子 7、14 的残差与 head 相关在 0.5 左右,有一部分在重复 head 的残差信号。合理度 4:逐个算子核对源码。cross_regres(x,y,d) 是 y 对 x 的滚动 OLS 残差,种子 5 的 y 为 log 峰值、x 为 log 总量,即峰值对总量的残差,符合写法;cs_regres(Y,X) 是 Y 对 X 的截面残差,种子 7 方向正确;cs_rank 是 NaN 安全的(无效值为 NaN),种子 15 不触及 nanrank_last 的停牌返回 0 陷阱;cross_delay 只向前看、in_delay 只在当天分钟轴移位,无前视;log 对 |x| ≤ 1e-9 给 NaN 而非负无穷;div(day_max, day_sum) 有界在 (0,1]。数据注意(不属于 §4 的类别,不挡,写给 PI):Volume 与 Amt 是未复权的原始股数与金额,价格是后复权(label.py 与 daily.py 注释)。送转或拆股当天股数水平跳变,种子 1、2、3、13 的 120 日 z 分数与「自己 60 日均值」之比会在事件后约一个窗口长度内失真,读到的是股数变化而不是放量冲击;种子 4、5、6、7、14、15 的比值或截面 / 回归形式基本抵消了尺度变化。种子 3 的分母 cross_mean(峰值, 60) 为 0 时输出 inf,cross_ema 把 inf 当缺失跳过,只出现在连续 60 日零成交的票上,可交易掩码已排除。种子 14 与 R 变体 3 的价位分桶 LogFloatCap 减 LogFloatShares 是否等于 log 名义股价没有在本机核实(docs 只说明 FloatCap 不能用后复权收盘价反算股数),只作分桶变量,不挡。如果它有 alpha,最可能来自:剥掉成交额水平之后,「当天量压在一分钟里」的交易方式差异(种子 5、7 的残差与种子 14 的分桶集中度,即机构拆单、算法均匀成交与脉冲式冲击的区分),其次是种子 8 到 12 的 60 日滚动相关所代表的量价同步结构。'
