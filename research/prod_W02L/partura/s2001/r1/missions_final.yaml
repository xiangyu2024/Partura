- type: N
  hypothesis: '机制:放量分钟里的价格签名。每个交易日把分钟按成交股数排序,最重的 10%(约 24 分钟)是资金实际成交的地方。在这些分钟里价格做了什么、成交量怎样带动价格,是个股的订单流构成与盘口深度留下的指纹,变化慢。全部读数用
    Ret 与 Volume 在分钟轴上构造,在日轴取 20 到 60 日均值或自己 120 日的 z 分数,变成慢变的个股属性。三组读数:

    (A) 价格冲击弹性:day_wstd(Ret, Volume) ÷ day_std(Ret)(成交量加权波动 ÷ 等权波动);day_wmean(|Ret|,
    Volume) ÷ day_mean(|Ret|);day_topw_mean(|Ret|, Volume) ÷ day_mean(|Ret|)。大于 1
    = 价格主要在放量时动(成交带来信息,或盘口薄、成交一笔价格就动);小于 1 = 价格主要在缩量分钟里动(无量跳动、买卖价差弹跳、薄盘噪声)。分子分母同单位,所以波动水平、成交额水平都被除掉了;这是个与
    Amihud 的 |收益| ÷ 成交额相近、但无量纲、已经按自己的波动归一化的价格冲击量。

    (B) 放量时的方向:day_topw_mean(Ret, Volume) − day_mean(Ret) 是最重 10% 分钟的平均收益相对全天的偏离;day_signed_ratio(Ret,
    Volume) = 上涨分钟的成交量占比 − 下跌分钟的占比,是不需要逐笔数据的净买入代理(Chordia 与 Subrahmanyam 的订单失衡的分钟近似)。我有意没有放
    day_wmean(Ret, Volume) − day_mean(Ret):恒等式 Σr·v ÷ Σv − Σr ÷ n = Cov(r, v) ÷ mean(v)
    = corr(r, v) × σ_r × CV_v,即库里手写的 cross_mean(day_corr(Ret, Volume), 20) 乘上波动与成交量离散度(正是控制里的东西),等于换皮。

    (C) 放量之后:day_corr(in_delay(sign(Ret) × Volume, 1), Ret) = 上一分钟的带符号成交量与当前分钟收益的日内相关,是
    Pástor 与 Stambaugh 的 gamma(订单流冲击后的回吐)的分钟版:正 = 订单流延续(知情),负 = 冲击后回吐(流动性提供者赚钱的地方);对
    |Ret| 的版本区分「放量引来波动」与「放量引来方向」。day_topw_mean(sign(上一分钟 Ret) × Ret, 上一分钟 Volume)
    = 最重 10% 的那些分钟之后,下一分钟的收益在多大程度上沿着它们的方向(延续,正)或相反(回吐,负);再除以全天 |Ret| 均值的版本是放量之后的波动溢出。in_delay
    只向后看一分钟,t 日全天数据在收盘时都已知,无前视。

    批里的启发:最好的信号在股数口径而不是金额口径(−1.11 对 −3.66,与已知族 rho 0.54 对 0.81),说明被奖励的不是量的水平,而是量的分布与价格的关系;day_max(Ret)
    与 day_max(Volume) 的富集都为正,说明价格一侧和成交量一侧的尖峰各自有信息。这一位把两边合起来:成交量最大的那些分钟里,价格做了什么。

    为什么和已有的不同:(1) 算子骨架全部不在两个库的 5583 个骨架里,逐个核对过。day_wstd / day_topw_mean / day_signed_ratio
    / day_wmean 是库建成之后才加的 Partura 算子,库里一条也没有;(C) 里「带符号成交量滞后一分钟」与「最重分钟之后的下一分钟」的配对库里没有(day_corr
    里带 sign 的 0 条)。(2) 库里最近的亲戚是手写的 cross_mean(day_corr(Ret, Volume), 20)、cross_mean(day_corr(Ret,
    in_delay(Volume, 1)), 20) 与 day_corr(abs_(Ret), in_delay(Volume, k)) 的日度版(B130
    / B200 / B224),两个冠军的构成里就有它们。这一位的种子里一条都没有,连交换 day_corr 参数顺序的写法也避开;(C) 里用的是带符号的成交量(sign(Ret)
    × Volume),它读的是订单流的符号延续,不是无符号的量价同步。(3) W01 的 head 里 Ret 参与的很少,都是 day_min(Ret)、day_wmean(Amt,
    Amt) 之类的单点,没有「放量分钟里的价格行为」这一族。

    为什么样本外还会在:冲击弹性与订单流延续 / 回吐是盘口深度和参与者构成(机构拆单、做市商、散户脉冲)的结构属性,20 到 120 日内名次保持;高冲击弹性(价格主要在放量时动)的股票要求更高的流动性溢价,这是文献里稳定存在的溢价,不依赖某段行情;慢聚合让换手低,15
    bp 的成本吃得下。风险:(B) 的方向类与 20 日反转控制相关(净买入近似当日涨跌),奖励会剔除线性、U 形、S 形暴露,剩下的看运气;(A)(C) 与流动性、波动控制的相关预计更低;若
    (A) 也被已知成交额族吃掉,说明冲击弹性只是流动性的另一种写法。

    数学检查:分母 day_std(Ret) 与 day_mean(|Ret|) 只在整天价格不动(停牌 / 封板)时为 0,这时分子也为 0,得 0 ÷ 0
    = NaN 而不是无穷;day_wstd 的权重和为 0 时给 NaN;day_corr 的取值在 [−1, 1],没有爆点;day_topw_mean 在成交极稀的票里(超过
    90% 分钟无成交)阈值为 0,退化为全天均值,不会出错;Ret 在个别分钟缺失时按有限分钟处理。无前视:全部只用 t 日收盘及以前,t+1 才交易。窗口不超过
    120 日,热身期不主导。'
