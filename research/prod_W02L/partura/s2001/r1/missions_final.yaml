  hypothesis: '机制:核心 C = day_max(Volume),当天单分钟最大成交股数。三条依据都在本批的拆解表和富集表里。(1) 把 Volume
    换成 Amt,分数从 −1.11 掉到 −3.66(train −3.25),与已知成交额离散度一族的 rho 从 0.54 升到 0.81。(2) 富集表里含
    day_max(Amt) 的 15 个候选均值差 −0.98(p 1.0),含 day_max(Volume)、day_max(Ret) 的反而是正的(+0.36、+0.35)。股数口径比金额口径少了「成交额水平」这一块,这一块已经被流动性控制和已知族吃掉;留下的是名义股价与流通股本、峰值相对当天总量的集中度、峰值相对自己历史的冲击。(3)
    但 C 本身是 −1.10 / −1.11(train / valid 几乎一样,方向 −1,半衰期 5):两段都稳定地亏,说明(推断,没有毛收益数)毛超额约为
    0,亏的是换手成本。pow_1_5(C) 只是单调改写,秩上同一个信号,分数逐位相同(−1.1067),所以这一位不再给 C 套单调变换或平滑,它们与 head
    是同一个信号,库禁令也会拒绝。这一位把 C 里的成分拆开,各用一种与水平无关的读法,看哪一块有毛超额。

    (a) 峰值的集中度:div(day_max(Volume), day_sum(Volume)) 的 20 日均值;对数口径下峰值对当天总量的 60 日滚动回归残差与斜率(注意
    AlphaCube 的 cross_regres(x, y, d) 是 y 对 x 回归,所以总量放第一位、峰值放第二位);截面上峰值对总量回归后的残差;峰值与总量的秩差。读的是「当天的量有多少压在一分钟里」:机构拆单、算法均匀成交与散户
    / 事件冲击的脉冲式成交在这里分开。它无量纲,与流动性水平、市值、波动控制天然低相关。

    (b) 峰值相对自己的历史:cross_zscore(log C, 120)、10 日对 120 日的对数均值差、除以自己 60 日均值再做 EMA。读的是「这只票最近的放量冲击」,个股用自己做对照,去掉让所有水平因子长得一样的持久截面水平。

    (c) 峰值与价格的 60 日滚动关系:峰值与当日 |收益|、收益、前一日收益、日内最大分钟收益、日内分钟波动的滚动相关。峰值伴随大幅价格变动 = 消息驱动;不伴随
    = 流动性驱动或对倒。W01 里样本内最好的一类结构正是「两个日度量的 60 日滚动关系」(cross_corr / cross_regbeta / cross_reg_fvalue):水平型控制对它先天近似正交,窗口长所以换手低。那一批的底是开盘第一分钟成交额,伙伴是隔夜缺口;这里的底是日内最大一分钟的股数,伙伴是收益与波动,有意不用缺口(用缺口会与那几个
    head 近重复,库禁令会拒绝)。

    (d) 峰值冲击 × 趋势方向:mul(cross_zscore(log C, 120), sign(20 日累计收益)):放量发生在上升段还是下跌段,把追涨型脉冲和抛售型脉冲分开。

    (e) 名义股价十分位内的集中度 z 分数:cs_bucket_zscore(…, sub(LogFloatCap, LogFloatShares)),sub(LogFloatCap,
    LogFloatShares) = log(流通市值 ÷ 流通股本),在 FloatCap = FloatShares × 当日名义价的假设下是 log 名义股价(假设没有在本机验证,只用作分桶变量)。把股数口径里的价位效应单独拿掉,检验
    (a) 是不是价位的代理。

    为什么和已有的不同:快照里见过的含 C 的外围算子集合是 {pow_1_5}、{ts_quantile_q50}、{ts_rank}、{abs_, pow_1_5,
    ts_argmax}、{sub, ts_scale, ts_med}、{ts_mean, mul, cs_mask_top_replace_mean_neg,
    ts_cov, ts_quantile_q50, day_skew, day_q_stat_std}。这里的外围含 cross_zscore / cross_regres
    / cross_regbeta / cross_corr / cross_ema / cs_regres / cs_bucket_zscore / day_sum
    / cross_delay 等,没有一个与它们是同一个集合。所有种子的算子骨架(抽掉字段、常数、窗口)都已逐个对照 members.csv 的 5583 个骨架,没有一个重复;含日频字段叶子的(种子
    14)骨架带 DF,更不会撞。库里最近的是成交额口径、水平、反方向的 ts_regres(day_max(Amt), day_sum(Amt), 40)(B238,即总量对峰值的残差,而且会被已知成交额族吃掉),以及
    High 口径的 ts_corr(day_max(High), day_sum(Volume), 5 / 10)(B231);这里用股数口径、对数、峰值对总量(种子
    5、6、7),伙伴换成收益与波动(种子 8 到 12),都不是它们的改写。

    为什么样本外还会在:(a)(c) 读的是参与者构成和订单执行方式这类慢变的结构属性,窗口 20 到 120 日,名次在数周内保持,15 bp 下换手低;(b)
    每只票用自己的历史做对照,不依赖截面静态风格,不容易在风格切换时翻符号(单个水平量最容易死在符号翻转上);(d) 的机制是行为性的(追涨与抛售),不依赖某段行情。最可能的失败方式:(a)
    与已知成交额族的残差相关仍高,被控制吃掉;(c) 在 60 日窗口里估得太吵;两种情况下这一位都不会出 head,下一轮不再押 C。

    数学检查:day_max(Volume) ≥ 0,停牌或无成交日为 0 或缺失;log 在近 0 处按算子定义给 NaN(不是负无穷);div(day_max,
    day_sum) 在分母为 0 时分子也为 0,得 NaN 而不是无穷,正常日取值落在 (0, 1];cross_zscore 对近常数窗口有保护(算作 0);cross_corr
    / cross_regres 窗口里有效对太少时可能返回 0(已知缺陷,只影响上市不久或长期停牌的票,奖励的可交易掩码已排除不满 0.9 × 241 天的新股与封板票,不是结果的主要来源)。无前视:全部只用
    t 日收盘及以前的数据,cross_delay 的天数都为正,t+1 才交易。最长窗口 120 日,热身期不主导。'
