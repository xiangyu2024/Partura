R:
- head: day_max(Volume)
  why: 烂的部件是「C 里与控制共享的那几块水平」,依据在拆解表里:Volume 换成 Amt,分数掉到 −3.66、与已知族的 rho 从 0.54 升到
    0.81,说明 day_max(Volume) 里有一块与成交额水平共享;而且 C 两段都稳定地亏 1.1(train −1.10 / valid −1.11,半衰期
    5),毛超额(推断)约为 0,亏的是换手成本,所以也要换慢。pow_1_5(day_max(Volume)) 只是单调改写,秩上完全一样(分数同为 −1.1067),不单独做变体。变体逐块拿掉:(1)(2)(3)(4)
    在已知族、流动性、名义股价、流通市值各自的十分位内去均值(cs_bucket_demean,保留量纲),看拿掉哪一块之后毛超额出现;(5) 对 30 日平均成交额取截面回归残差;(6)
    把 20 日平滑拉到 60 日,只降换手;(7)(8) 换成无量纲的峰值占比(60 日均值;流通市值十分位内的 z 分数)。数学上都有界:均值、残差、分桶均值都不含近零分母;峰值占比在分母为
    0 时分子也为 0,得 NaN。无前视。
