R:
- head: cs_bucket_zscore(cross_ema(abs_(day_skew(Open)), 30), LogFloatCap)
  why: head 的 cross_ema 半衰期 30 日,第 1 轮 R 里已见到「慢一点就变好」:30→60 日是 −1.22→−1.05(拆解),单日
    → 90 日 EMA 是 −3.12→−1.52;对 |偏度| 这个底而言分数几乎只由换手决定(两段分数一样:−1.22 / −1.11)。部件问题是平滑不够慢,而分桶(流通市值十分位内标准化)是有用的部件(第
    1 轮 R 里按波动分桶是 −1.76,按市值分桶是最好的 −1.22)。这里只动平滑:半衰期 120、240、以及 241 日硬窗口均值,分桶不变。
  variants:
  - cs_bucket_zscore(cross_ema(abs_(day_skew(Open)), 120), LogFloatCap)
  - cs_bucket_zscore(cross_ema(abs_(day_skew(Open)), 240), LogFloatCap)
  - cs_bucket_zscore(cross_mean(abs_(day_skew(Open)), 241), LogFloatCap)
- head: pow_05(ts_cov(sigmoid(day_argmin(Vwap)), cs_mask_top_replace_mean_neg(day_durbin_watson(Amt)),
    30))
  why: 两个烂部件。(1) 窗口:拆解里 ts_cov 30→60 是 −1.93→−1.45(+0.48)、30→15 也变好(+0.19),train 与
    valid 的差大,窗口越长越稳,所以这里再往 120 走。(2) `sigmoid(day_argmin(Vwap))`:day_argmin 返回 0
    ~ 240 的分钟位置,sigmoid 在位置 ≥ 17 时在 float32 里已经饱和为 1.0(位置 11 ~ 16 与 1 的差只有 1e-5 ~
    1e-7),所以这个量几乎只剩「日内最低价出现在开盘前几分钟内」的指示,大半个日子是常数,ts_cov 对一个几乎恒为 1 的序列取协方差,是数值上很脆弱的部件;拆解里去掉
    sigmoid 两段都变好(train −1.06→−0.38,valid −1.93→−1.51)。把它换成显式的「日内低点出现在开盘后 30 分钟内」指示
    `is_lt(day_argmin(Vwap), 31)`(0 / 1,方差有定义),或者直接用 day_argmin 本身。机制:开盘就见全天低点 = 低开高走,一年里这类日子与
    Amt 的 Durbin-Watson(成交额自相关的负担)共动的强度。
  variants:
  - pow_05(ts_cov(sigmoid(day_argmin(Vwap)), cs_mask_top_replace_mean_neg(day_durbin_watson(Amt)),
    60))
  - pow_05(ts_cov(sigmoid(day_argmin(Vwap)), cs_mask_top_replace_mean_neg(day_durbin_watson(Amt)),
    120))
  - pow_05(ts_cov(is_lt(day_argmin(Vwap), 31), cs_mask_top_replace_mean_neg(day_durbin_watson(Amt)),
    120))
  - pow_05(ts_cov(day_argmin(Vwap), day_durbin_watson(Amt), 120))
- head: cross_regalpha(day_sum(Volume), day_argmin(Ret), 15)
  why: 拆解表里窗口 15→30 是 train −1.19→−0.72 但 valid −1.29→−1.75,15→7 两段都变差(−2.41),说明窗口越长
    train 越好,估计噪声是烂部件(15 个点估一个回归截距)。这里把窗口依次拉到 60、120、241,看 valid 是否也跟着变好(其他流与本流第 1
    轮的事实:241 日窗口两段才都不再是负的大数)。机制不变:day_argmin(Ret) 是当天最大跌分钟的位置,对成交量水平回归得到的截距 = 「成交量很小时,最大跌分钟的位置」。
  variants:
  - cross_regalpha(day_sum(Volume), day_argmin(Ret), 60)
  - cross_regalpha(day_sum(Volume), day_argmin(Ret), 120)
  - cross_regalpha(day_sum(Volume), day_argmin(Ret), 241)
- head: ts_sum(cross_cov(ts_regalpha(day_sum(Vwap), day_skew(Volume), 10), day_argmin(Amt),
    15), 50)
