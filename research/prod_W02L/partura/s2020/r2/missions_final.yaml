- type: N
  hypothesis: '名称:资金流的方向与它的时钟(按时段拆开的净买入、对收益的价格冲击斜率、以成交时点为条件的跨日收益动态、日内极值时钟),全部做成 120
    ~ 241 日的个股慢性质。

    事实:(1) 本批 B059 的 3 个 head 全部是「日度量 × day_argmin(Amt / Vwap / Ret)」的 15 ~ 50 日协方差或回归,`day_argmin`
    是当天最小值所在的分钟,也就是一个日内时钟;拆解里窗口越长越好(`ts_cov` 30→60 +0.48)。(2) 本流第 1 轮 N 位的最好分数来自 241
    日窗口(+0.10 / +0.38),其他流(同一批工作的别的种子,读的是 2025-12-31 前的 loc 文件)里:「个股 120 日内、当天收益对一个量价交互变量的斜率」(`cross_regbeta(含成交额的交互变量,
    day_sum(Ret), 120)`,Llorente 等 2002 的量-收益动态的写法)有 4 条分数 +0.76 ~ +1.04、train 与 valid
    都过 0.5(是真 head);241 日窗口的成交额加权收益减等权收益的均值(量价协方差的一年平均)是 +0.07 / +0.40,没过线但同方向。共同点:都读「收益与成交的耦合」,不读水平,窗口
    ≥ 120 日。本位把耦合的两端换成本流的底:成交的方向(day_signed_ratio)与成交的时钟(day_centroid / day_argmax
    / day_argmin),这些在库里是空白(见下)。

    机制与读数(15 个种子,不用 ts_spearman / nt_*):

    (a) 按时段拆开的净买入 `day_signed_ratio(in_slice(Ret, a, b), in_slice(Amt, a, b))` = 该时段内「上涨分钟成交额占比
    − 下跌分钟成交额占比」,值域 [−1, 1](flat 分钟只进分母),是不用逐笔数据的净买入压力。收盘前 30 分钟(211 ~ 240)减开盘后 30
    分钟(1 ~ 30)的一年均值:`cross_mean(sub(收盘段净买入, 开盘段净买入), 241)`;只取收盘段;下午减上午的 90 天半衰期 EMA;以及
    `cs_bucket_zscore(·, LogFloatCap)` 的分桶版本。机制:A 股开盘段的成交主要是对隔夜消息与追涨,收盘段更多是机构的收盘价调仓与有信息的建仓(尾盘资金),一个票长期在收盘段净流入、在开盘段净流出,是被持续吸筹的指纹;一年的平均让它是慢变量。

    (b) 价格冲击:`cross_regbeta(day_signed_ratio(in_slice(Ret, 1, 240), in_slice(Amt,
    1, 240)), day_sum(Ret), 241)` = 当天收益对当天净买入占比的斜率(cross_regbeta(x, y, d) 是 y 对 x
    的斜率),一年窗口。它是 Kyle 1985 的 λ 的日度近似(价格对订单流的敏感度,Hasbrouck 2009 用同类回归估有效成本):λ 高 = 同样的净买入推动更大的价格(知情交易占比高或盘口薄);λ
    是斜率,不是水平,与成交额水平正交。另一个是滞后版本:`cross_regbeta(cross_delay(day_signed_ratio(...), 1),
    day_sum(Ret), 241)` = 昨天的净买入对今天收益的预测斜率(正 = 资金流延续,负 = 反转),以及收盘 − 开盘段净买入差的滞后版本。

    (c) 以成交时点为条件的跨日收益动态(Llorente、Michaely、Saar、Wang 2002 的 r(t) = a + (b + c·v(t−1))·r(t−1)
    里把「成交量」换成「成交的时点」):`cross_regbeta(mul(cross_delay(day_sum(Ret), 1), cross_delay(cs_demean(day_centroid(in_slice(Amt,
    1, 240))), 1)), day_sum(Ret), 241)`:截面去均值的成交重心(cs_demean 去掉全市场当天的共同位置,留下「比别的票更晚放量」)乘以昨天的收益,回归今天的收益,斜率
    > 0 = 昨天收盘前放量的那天涨跌会延续(收盘前的成交是有信息的)。同形的有价格运动重心的 120 日版本;`cross_regbeta(cross_delay(cs_demean(成交重心),
    1), day_sum(Ret), 241)` 是不带昨天收益的一阶版本。它与其他种子的差别是 x 全部有界、不随成交额水平缩放。

    (d) 日内极值时钟(B059 的对象):`cross_mean(sub(day_argmax(in_slice(Ret, 1, 240)), day_argmin(in_slice(Ret,
    1, 240))), 241)` = 一天里最大涨分钟出现的时点减最大跌分钟出现的时点的一年均值(正 = 习惯先跌后涨 = 回调被买回;负 = 先冲后砸);`cross_corr(day_argmin(Ret
    片段), day_argmax(Ret 片段), 241)` = 最大跌分钟与最大涨分钟是否聚在同一时段(聚在一起 = 买卖盘价差弹跳 / 薄盘毛刺);`cross_mean(sub(day_argmax(Vwap),
    day_argmin(Vwap)), 241)` = 日内价格高点时点减低点时点(日内趋势方向);`cross_regbeta(day_sum(Ret),
    day_argmin(in_slice(Ret, 1, 240)), 241)` = 最大跌分钟的时点对当天收益的斜率;`cross_corr(day_argmax(in_slice(Ret,
    1, 240)), day_centroid(in_slice(Amt, 1, 240)), 241)` = 最大涨分钟的时点与成交重心的同步。

    为什么和库里不同:5583 条表达式里没有一条含 `day_signed_ratio` 或 `day_centroid`(各 0 条,逐条查过);没有一条含
    `cross_delay(day_sum(Ret), ·)`(0 条),没有一条含 `cross_regbeta(…, day_sum(Ret), …)`(0
    条;库里共 69 条 cross_regbeta,逐条查过都不以 day_sum(Ret) 作因变量);同时含 day_argmax 与 day_argmin
    的 49 条(抽查的前几条是对分钟成交量局部均值做 in_slice_from_start / in_slice_to_end 再取价格的手写式)里,没有一条的
    day_argmax / day_argmin 以 in_slice(Ret, …) 作输入(0 条),也没有「最大涨分钟时点 − 最大跌分钟时点」的 241
    日平均。与快照 4 个 head 的差别:B059 的 head 的时钟读的是「最低成交额 / 最低价所在的分钟」且窗口 ≤ 50 日,我读的是收益极值与成交的方向,窗口
    120 ~ 241 日。预计与快照 6 个 head 的日度秩 |ρ| 都 < 0.3。

    为什么样本外还会在:(a)(b) 是个股持续的微观结构性质(谁在什么时候买、价格对订单流有多敏感),Kyle λ 与资金流方向在文献里是长期定价的因素,不靠某段行情;(c)
    读成交时点与收益延续的关系,是知情交易的时间指纹;(d) 是价格路径的稳定习惯。窗口 ≥ 120 日,日换手接近 0。诚实预期:本位的底在其他流里已有两类到过线,但那是量价交互;本位把一端换成方向与时钟,最好分数大约在
    −0.3 ~ +0.3,出 head 的概率约 5%;最可能的失败:(1) 240 日窗口里个股的 λ / 斜率估计噪声大于截面真实离散(斜率的标准误约 √(1/241)/σ_x);(2)
    时钟类(d)读数的取值被「整天不动」的票拉向 0 并与波动相关;(3) (a) 收盘 − 开盘净买入的截面排序主要是 A 股开盘涨停 / 一字板的票(净买入几乎恒为
    0 或 1),与流动性控制相关。

    数学检查:day_signed_ratio 的分母是该时段成交额之和,为 0(停牌)时 NaN,值域 [−1, 1] 有界;day_centroid 权重和为
    0 时 NaN,值域 [0, 1];day_argmax / day_argmin 在 in_slice(Ret, 1, 240) 内返回 0 ~ 239
    的位置,有界;整天价格不动(一字板)时两者都返回 0(并列取第一个),差 = 0,是「没有信息」的中性值,不是爆点,也不被除;停牌的票分钟全是 NaN 时返回
    NaN;全部窗口是 t 日及以前,cross_delay 天数为正(1),没有 cross_shift / in_local_mean,x 是 t − 1
    日的量、y 是 t 日收益,无前视;cross_regbeta 方差低于 1e-9 时 NaN;mul(cross_delay(day_sum(Ret),
