    head 里唯一一个两段同时变好的单点替换(Volume->Amt 几乎不变 −1.08,ts_sum 窗口 25 / 100 都不如 50)。day_sum(Vwap)
    是一天里 241 个分钟 Vwap 的和,与 day_sum(Close) 几乎是同一个水平量,Close 的水平更干净(没有成交额加权的内生噪声)。在新底
    Close 上试三个邻近部件:cross_cov 窗口 15→30、ts_regalpha 窗口 10→20、以及把 day_skew(Volume) 换成
    day_skew(Amt)(这个替换在 Vwap 上持平,不单独动)。
