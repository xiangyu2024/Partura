- type: N
  hypothesis: '名称:价格运动与成交在日内时钟上的同步性,一年尺度读数(及方向不对称版本)。

    事实(都来自本流快照与第 1 轮的结果):(1) 本流第 1 轮 N 位的最好一条 `cross_corr(day_centroid(abs_(abs_(in_slice(Ret,
    1, 240)))), day_centroid(in_slice(Amt, 1, 240)), 241)` = +0.10(train +0.10 / valid
    +0.38,半衰期 0);同一对对象把窗口改成 60 日,分数是 −0.82(train −0.09 / valid −0.82)。E 位最好的 `cross_corr(day_skew(Open),
    day_centroid(Amt), 241)` 也是 241 日窗口(−0.12 / 两段 −0.12、+0.31),同一族的 60 日版本都在 −0.3
    ~ −0.6。也就是说在这个底上,窗口从 60 拉到 241 是 +0.9 以上的杠杆,两段都不再是负的大数;第 1 轮没有人去试比 241 更慢、也没有人换过「同步」以外的读法(带方向的、回归斜率的、t
    值的、去掉开收盘的),这一位就做这件事。(2) 本批 B059 的 3 个 head 全是「某个日度量 × `day_argmin(Amt / Vwap /
    Ret)` 这个日内时钟」的 15 ~ 50 日协方差 / 回归,拆解里窗口越长越好(`ts_cov` 30→60:−1.93→−1.45;`cross_regalpha`
    15→30 的 train −1.19→−0.72);时钟类读数在本流是「慢了才有分」。(3) 控制与冠军去掉的是水平暴露;同步性是两个有界(0 ~ 1)时点的相关或斜率,无量纲、不随成交额水平缩放,所以不会被流动性
    / 市值 / 波动的多项式剪掉。


    机制:设 P_t = `day_centroid(abs_(in_slice(Ret, 1, 240)))` 是第 t 天价格运动(|分钟收益|)的重心,A_t
    = `day_centroid(in_slice(Amt, 1, 240))` 是成交额的重心,都在 [0, 1],0 = 全在开盘、1 = 全在收盘(in_slice(·,
    1, 240) 去掉第 0 根集合竞价)。个股一年内逐日的 corr(P, A) 回答「这只票的价格是在成交放出来的时候动的吗」:有信息的价格运动与成交同时发生(Admati
    与 Pfleiderer 1988 的集中交易理论、Easley 与 O''Hara 的知情交易),相关高 = 价格主要由有成交支持的信息驱动;相关低 =
    价格在没有成交的时段被几笔小单推着走(薄盘、做市商报价漂移、涨停板附近的撮合),这类价格运动之后更容易回吐。它是读「价格的成色」,与流动性的水平无关,与波动的水平无关。长窗口(241
    日以上)把它变成个股慢性质,日换手接近 0,15 bp 成本基本吃不到。

    算子怎样实现(14 个种子,每个都是 P、A 或它们的方向拆分版本,不用 ts_spearman / nt_*):

    (1) 同一对象读更慢、读斜率与 t 值:`cross_corr(P, A, 480)`(两年);`cross_regbeta(A, P, 241)`(P
    对 A 的斜率;cross_regbeta(x, y, d) 是 y 对 x 的斜率);`cross_reg_tvalue(A, P, 241)`。三者与
    corr(241) 的差别在于对 A 的离散度归一的方式不同,斜率保留「A 变化一单位 P 跟着变多少」。

    (2) 带方向:U = `day_centroid(add(R, abs_(R)))` 只在上涨分钟有质量(下跌分钟 add(R, |R|) = 0)、D
    = `day_centroid(sub(abs_(R), R))` 只在下跌分钟有质量;`sub(cross_corr(U, A, 241), cross_corr(D,
    A, 241))` = 上涨的时点与成交同步的程度减去下跌的同步程度。上涨有成交支持而下跌没有,是下跌只是噪声的指纹(以后会被买回);反过来是上涨没有成交支持。`cross_mean(sub(UA,
    DA), 241)` 里 UA = `day_centroid(mul(in_slice(Amt, 1, 240), is_gt(in_slice(Ret,
    1, 240), 0)))`(上涨分钟的成交额重心)、DA 同理取 is_lt,差 = 买盘集中的时点减卖盘集中的时点,一年的平均 = 个股的资金流是不是习惯在收盘前才进来;`cross_corr(UA,
    DA, 241)` = 买方与卖方成交的时点是否同步(同步 = 双向换手 / 做市类成交,不同步 = 单边行情推动)。

    (3) 与带符号的日度量的同步:`cross_regbeta(P, day_sum(Ret), 241)` 与 `cross_regbeta(A, day_sum(Ret),
    241)` = 当天收益对「价格运动的时点 / 成交的时点」的斜率:上涨的日子是不是价格晚动、成交晚放(越晚越涨 = 收盘前持续吸筹)。`cross_corr(P,
    abs_(gap), 241)` 里 gap = `sub(div(day_first(Open), cross_delay(day_last(Close),
    1)), 1)`(前一日收盘用 cross_delay 取正滞后,无前视):大缺口的日子里价格是不是更早动完(消息在开盘就被消化)还是整天消化。

    (4) 两个时点的相对关系:`cross_mean(sub(P, A), 241)`(价格比成交早还是晚)与 `cross_stddev(sub(P, A),
    241)`(错位的稳定程度);`cross_ema(cross_corr(P, A, 120), 120)`(换一种慢法:对 120 日相关再取 120 天半衰期的
    EMA,不用更长的硬窗口);`cs_bucket_zscore(cross_corr(P, A, 241), LogFloatCap)`(流通市值十分位内标准化,去掉任意形状的市值暴露;本流第
    1 轮 R 里按市值分桶是最好的一条写法,−1.22);去开收盘:`cross_corr(day_centroid(abs_(in_slice(Ret, 31,
    210))), day_centroid(in_slice(Amt, 31, 210)), 241)` 只在盘中 31 ~ 210 分钟读时点,避免开收盘两端的
    U 形同时主导两个重心造成的机械同步。

    为什么和库里不同:两个库 5583 条里没有一条含 `day_centroid`(0 条,按 libs_train.csv 的表达式文本逐条查过),也没有一条是
    day_argmax / day_argmin / 重心类时点读数的 241 日相关或斜率(`cross_corr(·, day_argmax / day_argmin)`
    共 2 条,搭档是价格类日度量);库里最接近的是含 `day_corr(Ret 类量, Amt 类量)` 的 58 条(同一天内、分钟之间的相关,读的是「分钟上的量价同步」),它在一天之内求相关,我这里先把每天压成一个时点再在日轴上求一年的相关
    / 斜率,是另一个量(日内波动与成交额的分钟共动随流动性水平变化很大,一年的时点同步不是水平的函数)。与 B059 的 3 个 head 的差别:它们是日度量与
    day_argmin 的短窗口协方差,不含价格运动 / 成交的重心;预计与快照 6 个 head(3 个 B059 的时钟类、3 个 |偏度| 的改写)的日度秩
    |ρ| 都 < 0.3。

    为什么样本外还会在:读的是个股的成交结构与信息环境(散户为主 / 机构为主、薄盘 / 厚盘、有信息的成交占比),这些变得慢(以季度计),不依赖某段行情;成色低的价格运动回吐、成色高的延续,是微观结构的稳定性质而不是一次套利。诚实预期:第
    1 轮同一对象的最好分数是 +0.10 / +0.38,距离 0.5 还差 0.4,train 比 valid 弱 0.3 说明 2018 ~ 2023 年间这条关系对成本更敏感;出
    head(两段 ≥ 0.5 且与已知族 |ρ| < 0.5)的概率约 6%。最可能的失败方式:(a) 241 日相关的估计误差(约 0.065)与截面真实离散度相当,名次近似随机;(b)
    与波动 / 流动性控制中度相关(开收盘集中度高的票两个重心都靠近两端)。

    数学检查:day_centroid 在分钟权重和为 0(停牌、整天无成交 / 无价格运动)时为 NaN 而不是 0,值域 [0, 1] 有界;所有窗口是 t
    日及以前的滚动,cross_delay 的天数为正,无 cross_shift / in_local_mean,无前视;cross_corr / cross_regbeta
    的自变量与因变量都是有界的时点(或有界的日收益),没有除以近零量的爆点,方差低于 1e-9 时 cross_regbeta 返回 NaN 而不是极大值;cross_corr
    对不满窗(2 个有效点)可能给 ±1(已知,只发生在上市头几天,可交易掩码已排除);视窗从 2018-01-02 起,头 241 日的窗口是扩张窗口,噪声大但只占
    train 的第一年,不主导整段;不用 ts_rank / cross_rank / in_rank_rolling,没有 nanrank 陷阱;输出连续取值,不是取值档位少的离散信号。'
