slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [3]
    reasons: '创新度 4。相关度表里槽 a 的 14 个种子对 6 个 head 的原始 |ρ| 最大为 0.415(种子 2,最像的是 cs_bucket_zscore(cross_ema(abs_(day_skew(Open)),30)),残差 0.353);对 5 个控制的 |ρ| 最大为 0.482(种子 10 的流动性,规模 0.447、已知族 0.422)。两个自动划线(head 0.7、控制 0.8)都没有触发;与控制的 |ρ| 超过换写线 0.5 的一个都没有(种子 10 的流动性 0.482 贴近但未到 0.5)。libs_train.csv 里 day_centroid 出现 0 行(本次核对),14 个种子的骨架(抽掉字段、常数、窗口)也都不在库的 5598 行骨架里。核心是「价格运动的时点重心与成交额的时点重心」的同步读法,与 head 的 |偏度| 族、pow_2 换皮不是同一个量。不给 5:14 个种子里多数是同一对重心的窗口、平滑、分桶或斜率改写,真正引入新搭档的只有种子 4(上涨分钟与下跌分钟分开)、5(买卖成交时点之差)、8(隔夜缺口)、12(买卖成交时点同步)。合理度 4。逐个算子核对:day_centroid 对 |x| 做时点加权平均再除以 T−1,落在 [0,1],整天权重和为 0 时输出 NaN 而不是 0;in_slice(x,1,240) 是 x[:,1:241],确实去掉第 0 根;cross_regbeta(x,y,d) 是 rolling_ols 的 beta,即 y 对 x 的斜率,与笔记读法一致;种子 4 的 add(R,|R|) 与 sub(|R|,R) 分别只保留上涨、下跌分钟的非负权重,重心定义成立;种子 8 的隔夜缺口用 cross_delay(day_last(Close),1),只向后移,无前视;种子不用 ts_rank、cross_rank、in_rank_rolling,没有 nanrank 陷阱。要记的一条:rolling_pair_reduce 对左侧补 NaN 后只取有效点,窗口不满时是扩张窗口,所以种子 1 的 480 日窗口在 train 前约 480 个交易日(约 1/3 的 train 样本)是扩张窗口;笔记说「只占第一年」对 480 日不成立。这是热身期噪声,不是定义坏掉,不划,但结果里应单独报告 2018–2019 段。自动划掉规则:槽 a 无一种子触发。划掉种子 3(cross_reg_tvalue(day_centroid(Amt), day_centroid(abs(Ret)), 241)):rolling_ols 的 t 值是 r·√(n−2)/√(1−r²)(n 为窗口内有效天数),n 基本相同时它与同窗口的 cross_corr(P, A, 241) 截面秩单调等价,即同一个量的换写法;该核心在种子 14 里以分桶形式保留(分桶改变排序,14 不划),种子 3 只是再写一遍,没有新的初始个体。种子 2 的斜率是 ρ·σ_P/σ_A,带时间序列标准差之比,与 corr 的秩不等价,保留。如果它有 alpha,最可能来自种子 1、13、14 的一年以上尺度的价格运动与成交时点同步(个股慢性质),其次是种子 4 与 12 的上涨 / 下跌分开的时点同步。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。libs_train.csv 里 day_signed_ratio 与 day_centroid 都是 0 行(本次核对),15 个种子的骨架也都不在库的骨架集合里。6 个 head 里没有一个含 day_signed_ratio、day_sum(Ret) 的回归或时点重心;原始 |ρ| 最大 0.244(种子 14,最像的是 |偏度| 族 head),残差最大 0.203。种子 14 与 head 3(cross_regalpha(day_sum(Volume), day_argmin(Ret), 15))共享 day_argmin(Ret) 这个时钟,原始 |ρ| 0.215,不到 0.5。控制:种子 5 与流动性 |ρ| 0.546、已知族 0.519,超过换写线 0.5 但远低于自动划线 0.8;它是 Kyle λ 的日度近似(斜率大对应深度小,理论上应与流动性反向),与流动性控制的 |ρ| 高,但不是同一个量,保留,结果里要看它的残差。day_argmax / day_argmin 在库里分别有 148 / 252 行,种子 11–15 只是这些算子的新组合,新意低于种子 1–10,所以不给 5。合理度 4。逐个算子核对:day_signed_ratio(x,y) = Σ|y|·sign(x) / Σ|y|,值域 [−1,1],x=0 的分钟只进分母,与笔记一致。种子 6、7、8、9、10 的跨日项用 cross_delay(·,1),只向后移,无前视;种子 8–10 的 cs_demean 是同一天的截面去均值,之后才滞后一天,无前视。cross_regbeta 的 EPS(1e-9)比较的是窗口内离差平方和 Σ(x−x̄)²,笔记写成「方差」口径不准,但种子 8 的 x 量级约 1e-3、离差平方和远高于阈值,不影响结论。argmax / argmin 在窗口内返回 0–239 的位置,并列取第一个。这是本槽的真实瑕疵但不是爆点:整天平盘时 argmax = argmin = 0,种子 11、13 的差为 0(中性);种子 12 的两个时点在平盘日同时被拉到 0,(0,0) 点堆在对角线上,会推高相关,限价板多的票受影响最大。它只影响少数票的部分日子,不主导截面,不划,写进结果检查。自动划掉规则:槽 b 无一种子触发,也没有可确认为重复的种子(种子 4 是种子 1 的分桶版本,分桶改变了截面排序,保留)。如果它有 alpha,最可能来自种子 1–5 的收盘段净买入压力与其对价格的冲击斜率(一年尺度的订单流敏感度,Kyle 型),其次是种子 6–10 的昨日成交时点或昨日收益对今日收益的延续;种子 11–15 若有分,更可能是并列伪影,而不是时点本身。'
R:
  - head: 'cs_bucket_zscore(cross_ema(abs_(day_skew(Open)), 30), LogFloatCap)'
    soundness: 3
    reasons: '合理度 3。算子核对:day_skew 是 z³ 的日内均值(_skew),整天不动时 x_std = 0 得 NaN,不是爆点;z 的上界约 √240 ≈ 15.5,单分钟尖峰能把偏度拉到十几的量级,所以个别尖峰日的 |偏度| 会被一分钟支配,cross_ema 30 日只能摊薄一部分;cross_ema 跳过缺失日、因果;cs_bucket_zscore 按 LogFloatCap 十分位内标准化,分母带 EPS。机制说不清:Open 是分钟价格水平,其偏度反映日内价格路径停在哪一端(随趋势变化),取绝对值后方向也丢了。说不清不是挡的理由,也没有数学问题。三个变体(半衰期 120、240,241 日均值)只改平滑,算子合法,放行。'
  - head: 'pow_05(ts_cov(sigmoid(day_argmin(Vwap)), cs_mask_top_replace_mean_neg(day_durbin_watson(Amt)), 30))'
    soundness: 3
    reasons: '合理度 3。算子核对:sigmoid(day_argmin(Vwap)) 在 argmin 超过约 17 后在 float32 下饱和为 1,所以 X 基本是「整天最低 Vwap 是否落在开盘后前十几分钟」的指示,其余日子近乎常数。若 argmin 大致均匀,30 日窗口里 X 偏离 1 的日子平均只有 1–2 天,ts_cov 实际由很少的日子决定,这是估计量有效样本太小,不是定义坏掉。cs_mask_top_replace_mean_neg 对 DW 的下尾做截面掩码;day_durbin_watson 由 Σdiff² ≤ 4Σx² 有界于约 4,无爆点;pow_05 是符号幂(x<0 时取负),定义成立。PI 对 sigmoid 饱和的诊断正确。变体 3(is_lt(argmin,31))是合理的替换;变体 4 去掉 sigmoid 后 X 的量纲与水平都会变,但不是数学问题。机制是低点时点与成交额 DW 的共动,说不清,不挡。'
  - head: 'cross_regalpha(day_sum(Volume), day_argmin(Ret), 15)'
    soundness: 3
    reasons: '合理度 3。这个 head 是截距,不是斜率:alpha = mean_y − β·mean_x,而 β·mean_x = ρ·σ_y·(mean_x/σ_x),所以 alpha 的主体是 ρ·σ_y/CV_x(CV_x 为窗口内成交量的变异系数,估计 1/CV 在 1–3 之间),mean_y 只占一部分。算子合法:rolling_ols 的 var_x 是离差平方和,量级远高于 EPS;CV 接近 0 的票在 15 日窗口里少见,没有爆点。PI 的读法「成交量很小时最大跌分钟的位置」是对零成交量的外推(窗口内成交量远离 0),这个解释不对,但不是数学问题。变体 60 / 120 / 241 日只拉长窗口,结构不变、估计噪声下降,放行。如果它有 alpha,最可能来自成交量稳定性(1/CV)与最大跌分钟时点相关的乘积,而不是「小成交量时的时点」。'
  - head: 'ts_sum(cross_cov(ts_regalpha(day_sum(Vwap), day_skew(Volume), 10), day_argmin(Amt), 15), 50)'
    soundness: 3
    reasons: '合理度 3。截距同样是外推:ts_regalpha(x=day_sum(Vwap), y=day_skew(Volume), 10) 的 alpha = mean_y − ρσ_y/CV_x,x 是 241 分钟价格之和的 10 日序列,CV_x 通常只有约 0.02–0.05,1/CV_x 大致为 20–50,alpha 的主体是 ρ·σ_y/CV_x 而不是 mean_y;截距的意义是价格为 0 处的预测,这是这个 head 最弱的地方。价格近乎不动的票(10 日内只有一两个 tick 的变化)1/CV_x 会很大,alpha 与 cross_cov 的尾部会被它们拉开,这是真实的尾部风险。但按对 10 日价格水平波动的估计,1/CV 的横截面跨度是 2–3 倍而非数量级,R4 四个变体的五个控制 |ρ| 都在 0.08 以下(相关度表),没有迹象显示它主导了截面;因此放行,尾部在结果里检查。PI 说的 Close 比 Vwap 干净(变体 1、2、4)只换了价格字段,截距放大的结构没变;变体 3 只改窗口。'
summary: '两个任务位都通过:槽 a 创新 4、合理 4,划掉种子 3(与种子 14 同核心的 t 值换写);槽 b 创新 4、合理 4,无划。R 四组合理度均为 3,全部放行。结果阶段需要单独检查三件事:种子 1 的 480 日扩张窗口(2018–2019 段)、种子 12 的平盘并列伪影、R3 / R4 截距在低 CV 票上的尾部。'
