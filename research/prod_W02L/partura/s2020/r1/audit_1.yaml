slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: |-
      创新度 3。核心 day_skew(Open) 就是快照 head abs_(day_skew(Open)) 的子树(相关度表 core 行:与 head 原始 |ρ| 0.06、残差 0.16,与五个控制的 |ρ| 最大 0.03)。16 个种子与 head 的原始 |ρ| 全部 ≤ 0.11,符号与绝对值之间、平滑前后确实不是同一个量,所以不给 1。但 16 个种子都是对同一个单日有符号偏度的平滑、尾部、截面或滚动改写,底层量没有换,所以不给 4。真正的新意在搭档:60 日滚动关系的搭档(日收益、缺口、滞后形状、log 成交额、首根成交额、成交额重心)与成交额偏度残差。我核对过 members.csv:day_skew 与 day_sum(Ret) 同现的骨架为 0 条,cross_corr(day_skew, day_sum) 的骨架也没有;库里 cross_corr(day_skew, ·) 的 61 条搭档是价格/成交量的日均值与偏度的乘积,10 日窗口。另外种子 4、5 的尾部均值去掉控制后与 head 的残差 |ρ| 为 0.46、0.38,说明上尾、下尾均值里仍含 |偏度| 的成分,是部分换皮,未到 0.7,不划。
      合理度 4。逐个算子核对:day_skew 在整天不动时 _skew 的 x_std = 0,得 0/0 = NaN;偏度有界(量级约 √(n−1) ≈ 15),不会爆点。cross_ema 跳过缺失日(不当 0)。cross_zscore 对退化窗口返回 0,分母带 EPS。cross_tail_mean_q25 / q75 用 nanquantile 只取有效日,分别取 ≤ 与 ≥ 分位数的均值。cross_regres 是 60 日时序 OLS 的窗口末日残差(y = C 对 x = 成交额偏度),与笔记一致。cs_regres 是截面 OLS 残差(Y ~ X)。cs_bucket_zscore 按 LogFloatCap 十分位内标准化。cross_regbeta(x, y, d) 是 y 对 x 的斜率,种子 10 的 log 成交额对偏度的斜率与笔记读法一致。rolling_windows 因果(左侧补 NaN),cross_delay 只向后移,无前视。种子不用 ts_rank、cross_rank、in_rank_rolling,没有 nanrank 陷阱。文字瑕疵一处:种子 13 的说明写成「对当天成交额偏度回归」,实际是 60 日时序回归的末日残差,机制不变,不扣分。
      自动划掉规则:槽 a 全部种子与 head 的原始 |ρ| 最大 0.11(< 0.7),与五个控制的 |ρ| 最大 0.23(< 0.8),无一触发。也没有可以确认为重复的种子:种子 7 与 9 同为 cross_corr 族、一个滞后一天,种子 13 与 15 都是对成交额偏度的残差,这两组之间的相关本表不含,不以此划。
      如果它有 alpha,最可能来自 (c) 组(种子 7–12)的 60 日滚动关系,它与水平控制天然近似正交、窗口长换手低;其次是 (b) 组(种子 4–6)尾部均值读出的散户彩票式上冲事件。(a) 组的 abs 版本(种子 3)若有 alpha,也只是 head 的慢化换皮。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      创新度 4。相关度表里槽 b 的 16 个种子与三个 head 的原始 |ρ| 全部 ≤ 0.10,单看 head 它们是新量。与控制:只有种子 8(gini,流动性 0.77、已知族 0.70)与种子 12(尾盘 30 分钟占比,流动性 0.66、已知族 0.62)接近控制,但未到 0.8,不自动划。库里 day_centroid、day_gini、cross_ema、cs_bucket_zscore、cross_zscore 的出现次数都是 0(libs_train.csv 核对,属实),算子是新的。但 day_argmax(Ret) 在库里有 24 行、|Ret| 的分钟切片与成交量的相关有 37 行,时点读数这个主题并不全新,所以给 4 不给 5。残差与 head 的 |ρ| 在种子 1、2、11、13、14、16 上为 0.31–0.40,去掉五个控制后这些种子仍与 |偏度| 有共同成分,新意打折;种子 3、4、5、6、7、9、10 残差与 head 的 |ρ| ≤ 0.25,是本槽较新的部分。W01 的 head 族里有 day_centroid(Volume)(W01 定位表里可见),种子 9–11 用到的成交额重心与它的相关本表没有,我无法核实,只记为待查。
      合理度 4。逐个算子核对:day_centroid = sum(t·|x|)/sum(|x|)/(T−1),值域 [0,1],tot = 0 时 NaN,一字板不会得 0。day_gini 有界,tot = 0 或 n ≤ 1 时 NaN。in_slice(x, a, b) 是闭区间 x[:, a:b+1],in_slice(·, 1, 240) 确实去掉第 0 根集合竞价,in_slice(·, 211, 240) 是最后 30 根,与笔记一致。add(r, |r|) 与 sub(|r|, r) 分别是上涨与下跌分钟的 2 倍,day_centroid 内部取绝对值,所以两者的重心差读的是涨跌时点之差,符合描述。cross_regbeta 是 centroid 对当天收益的斜率(种子 6),与笔记一致。cross_reg_fvalue 的 F = R²(n−2)/(1−R²) 是 |ρ| 的单调函数、符号丢失,与「关联强度」的说法一致。60 日窗口与 EMA 都因果。午后第一根(第 121 根)的收益跨午休,在 240 根中只占 1/240 权重,但在稀疏日(|r| 大多为 0 的票)它是重心的主要来源,这是种子 1、2、13、14 与流动性相关 0.33–0.39 的原因之一,不是数学问题。
      种子 14 有一个定义缺陷。day_argmax(dt_day.py)只对全 NaN 行返回 NaN;整天不动的行(|Ret| 全为 0,一字板)不是 NaN,torch.argmax 对并列取第一个,于是返回 0。一字板多的票,40 日 EMA 会被 0 拉向开盘,结果变成「一字板频率」而不是「最大运动的时点」。它不在 §4 的清单里,全市场上是否主导结果我没有核实(没有跑 train 统计),所以不划;但执行前应把它当作第一个要查的假阳性来源。另外 cross_corr 没有最少有效样本门槛(上市后两日的 60 日窗口只有 2 个点时返回 ±1,第一天返回 0),这是算子层的定义问题,影响种子 4、5、10 以及槽 a 的 7–9,不是本槽专有,不据此划。
      自动划掉规则:槽 b 没有种子触发 |ρ| ≥ 0.7(与 head)或 |ρ| ≥ 0.8(与控制)。
      如果它有 alpha,最可能来自种子 3(涨在后、跌在前的时点差)与种子 4–6(价格运动重心与缺口、当天收益、成交额的 60 日滚动关系),即价格发现与订单流的时点;若只是流动性或已知族的换皮,则来自种子 1、2、8、13 的日内集中度,它们与流动性相关 0.3–0.8。
R:
  - head: 'abs_(day_skew(Open))'
    soundness: 4
    reasons: |-
      逐个核对 13 个变体,数学上都有界:均值、EMA、z 分数、分桶、残差都没有近零分母。变体 6 的分母是 120 日绝对偏度的 EMA,它为正;整天不动的票在 cross_ema 里因有效权重和 ≤ 1e-12 返回 NaN。对偏度长期接近 0 的票这个比值会变大,但未见主导证据,不算问题。变体 4 cross_zscore(abs_(day_skew(Open)), 120) 与 pow_2 版 head 的原始 |ρ| 为 0.96,即基本是 head 按自身历史标准化后的版本;替换规则会处理它(known |ρ| 0.01 < 0.5),合理度不因此扣分。变体 10–12 的上午、下午切片与 in_slice 闭区间一致(1..120 上午、121..240 下午,都排除了第 0 根)。变体 13 把 sub(High, Low) 当作分钟振幅序列的偏度,是另一种形状读数,机制说得通。全部变体因果(无 cross_shift、in_local_mean),无 nanrank 陷阱。变体的机制对应清楚:慢化 (1)–(3),去水平 (4)、(7)–(9),尾部 (5),比值 (6),上下午 (10)–(12),振幅 (13)。
summary: '流 2020 第 1 轮审计:槽 a(E,核心 day_skew(Open))创新 3、合理 4;槽 b(N,价格运动时点)创新 4、合理 4;两槽都通过且无种子划掉;R(abs_(day_skew(Open)))合理 4。无硬性数学问题。待查一处:种子 14 的 day_argmax 对整天不动的票返回 0 而非 NaN,未划,建议执行前核对一字板频率。'
