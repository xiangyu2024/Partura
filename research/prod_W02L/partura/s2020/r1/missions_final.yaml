R:
- head: abs_(day_skew(Open))
  why: 烂的部件有两处,依据都在本批拆解表里。(1) 单日取值太快:它是日度量,原始日换手 0.88、原始净夏普 −15.4;新尺子下半衰期 20 之后仍是
    −3.08 / −3.12,两段几乎一样,说明毛超额约为 0(推断,没有毛收益数),亏的是换手成本。pow_2 / abs_ 的嵌套是单调改写,分数逐位相同(−3.0783),不单独做变体;Open
    换 Close 几乎不变(−2.87 / −3.25),也不做。(2) 平滑的方式:快照里只有半衰期 20 的排名 EMA(尺子自带),没有在表达式里先对原始值做慢平滑、做自己历史的
    z 分数、取尾部均值、对水平分桶的写法。变体逐块拿掉:(1)(2)(3) 换平滑(cross_mean 20 / 60 日、cross_ema 半衰期 90
    日);(4) 减去自己 120 日水平(cross_zscore);(5) 只看最偏的四分之一天(cross_tail_mean_q75);(6) 近 20
    日对 120 日的比值(绝对偏度是上升还是回落);(7)(8) 在流通市值十分位 / 波动十分位内标准化;(9) 去掉当天成交额偏度可解释的部分(cs_regres);(10)(11)(12)
    只用上午 / 下午的路径,或下午减上午(in_slice(Open, 1, 120) 与 in_slice(Open, 121, 240),午休前后各 120
    根);(13) 把价格路径换成每分钟高低差的路径 sub(High, Low),读成交波动的脉冲而不是价位的偏。数学上都有界:均值、EMA、z 分数、分桶、残差都不含近零的分母;变体
    6 的分母是 120 日绝对偏度的 EMA,为正,在整天不动的票上为 NaN;day_skew 在整天价格不动时是 NaN。无前视。
  variants:
  - cross_mean(abs_(day_skew(Open)), 20)
  - cross_mean(abs_(day_skew(Open)), 60)
  - cross_ema(abs_(day_skew(Open)), 90)
  - cross_zscore(abs_(day_skew(Open)), 120)
  - cross_tail_mean_q75(abs_(day_skew(Open)), 60)
  - div(cross_ema(abs_(day_skew(Open)), 20), cross_ema(abs_(day_skew(Open)), 120))
  - cs_bucket_zscore(cross_ema(abs_(day_skew(Open)), 30), LogFloatCap)
  - cs_bucket_zscore(cross_ema(abs_(day_skew(Open)), 30), cross_mean(day_std(Ret),
    20))
  - cs_regres(cross_ema(abs_(day_skew(Open)), 30), cross_ema(abs_(day_skew(Amt)),
    30))
  - cross_ema(abs_(day_skew(in_slice(Open, 121, 240))), 30)
  - cross_ema(abs_(day_skew(in_slice(Open, 1, 120))), 30)
  - cross_ema(sub(abs_(day_skew(in_slice(Open, 121, 240))), abs_(day_skew(in_slice(Open,
    1, 120)))), 30)
  - cross_ema(abs_(day_skew(sub(High, Low))), 30)
