  core: day_skew(Open)
  hypothesis: '机制:核心 C = day_skew(Open),当天 241 根分钟 Open(后复权价)序列的偏度。偏度对价格的水平和尺度不变,只读「这一天的价格路径,大部分时间在自己均值的下方还是上方」:C
    > 0 = 大部分时间偏低、只有短暂冲高(冲高回落;或早盘急跌后横盘、尾盘拉升);C < 0 = 大部分时间偏高、只有短暂下探(瞬间跳水又被买回;或早盘冲高后横盘、尾盘跳水)。它读的是「一天的价格是怎么走出来的」,不是涨跌多少。依据在本批拆解表里:C
    及其所有变体与已知成交额族的 rho 全在 −0.03 ~ −0.02,说明它与新尺子的 5 个控制天然正交,若它有 alpha 不会被控制与冠军吃掉。

    问题也在拆解表里:单日的 C 太快,原始日换手 0.88、原始净夏普 −15.4(批内成员表,train),新尺子下半衰期 20 之后仍是 −3.08 /
    −3.12;去掉 abs_ 只保留符号反而更差(−4.84 / −3.72);Open 换 Close 几乎不变(−2.87 / −3.25),因为两条分钟序列是同一条路径错一分钟。pow_2
    / abs_ / abs_(pow_2(abs_)) 在日内截面上是单调改写,分数逐位相同(−3.0783),所以快照里的 3 个 head 其实是同一个量。因此这一位不再给
    C 套单调变换,而是把「路径形状」当成个股的慢性质,并读它与别的日度量的关系。库里含 day_skew 的 261 条、213 个骨架,外围只有 abs_
    / cross_mean / cross_stddev / ts_decay_linear / ts_stddev / cross_quantile_q25
    这类原始算子,没有一条用 Partura 建库之后才有的 cross_ema / cross_zscore / cross_tail_mean / cs_bucket_zscore
    / cs_regres(两个库 5583 个骨架里这些算子出现 0 次),库里 cross_corr(day_skew, ·) 有 61 条,全是挖掘库的一串写法,搭档是价格
    / 成交量的日均值、偏度及其乘积,窗口多为 10 日、外面套 cross_quantile_q75;没有 C 与日收益、缺口、成交额水平、成交额时点配对的,cross_corr(day_skew,
    day_skew) 的骨架库里有,我没有用。已见过的含 C 的外围集合只有 {abs_}、{pow_2, abs_}、{pow_2}、{},下面每个种子的外围都含至少一个它们没有的算子,没有一个是同一个集合。

    种子五组:

    (a) 慢速的个股性质(种子 1、2、3):cross_ema(C, 40)(40 日半衰期,不用硬窗口,老的冲高日慢慢淡出)、cross_zscore(C,
    120)(减去个股自己 120 日的水平,持久的截面水平被去掉,留下「最近比平时更偏」的事件成分)、abs_(cross_ema(C, 30))(先平滑再取绝对值:个股是不是长期朝同一个方向偏,与种子
    1 的差别只在符号)。机制:路径不对称来自个股的盘口厚度与参与者构成(散户的追涨脉冲、机构的均匀拆单、盘后消息的集中兑现),这些变化慢,名次在数周内保持,日换手低,15
    bp 吃得下;单日 C 的 −15.4 是因为它每天都在换名次。

    (b) 尾部倾向(种子 4、5、6):cross_tail_mean_q75(C, 60) = 过去 60 日里最偏的四分之一天的平均,读「冲高回落的日子有多极端」;q25
    对应「瞬间跳水」;两者相加是上下两尾的不对称(偏度的偏度)。与日均值不同:均值被中间的普通日稀释,尾部均值只看事件日。类比文献里好波动 / 坏波动的半方差不对称(Bollerslev,
    Li, Zhao)与彩票型最大值(Bali, Cakici, Whitelaw):上冲型的事件日是散户彩票需求的指纹。

    (c) 路径形状与别的日度量的 60 日滚动关系(种子 7、8、9、10、11、12):cross_corr(C, day_sum(Ret), 60) 读「这只票涨的那些天是冲高回落型还是走出来维持型」;cross_corr(C,
    缺口, 60)(缺口 = 开盘 ÷ 前一日收盘 − 1,前一日收盘用 cross_delay 取滞后一天,无前视)读缺口是被回吐(高开 + 正偏)还是被延续,是
    Lou, Polk, Skouras 的隔夜 − 日内拉锯的路径版;cross_corr(cross_delay(C, 1), day_sum(Ret),
    60) 读昨天的形状对今天收益的个股层面可预测性(滞后,无前视);cross_regbeta(C, log(day_sum(Amt)), 60) 是成交额对路径不对称的弹性(AlphaCube
    的 cross_regbeta(x, y, d) 是 y 对 x 的斜率);cross_reg_fvalue(C, day_first(Amt), 60)
    是开盘第一根成交额与路径形状的关联强度;cross_corr(C, day_centroid(Amt), 60) 是路径形状与成交时点的同步。这是本环境里样本内最好的一类结构(W01
    的 head 里 cross_corr / cross_regbeta / cross_reg_fvalue 的两个日度量 60 日滚动关系很多):水平型控制对它先天近似正交,窗口长所以换手低。这里的底是路径形状(库里没有),不是
    W01 已经被封的 Amt 时点或缺口本身。

    (d) 价格形状里没有成交量支撑的那一块(种子 13、15):cross_regres(day_skew(Amt), C, 60) 是 C 对当天成交额偏度回归后的残差(cross_regres(x,
    y, d) 是 y 对 x 回归,所以成交额偏度放第一位),再取 30 日 EMA(残差本身是日度量);cs_regres 是截面上同样的事(各自先取 30
    日 EMA)。机制:价格路径的偏移如果伴随成交额脉冲(day_skew(Amt) 大),是信息或事件;没有脉冲的价格偏移是薄盘噪声,会回吐。残差读的就是后者。

    (e) 去掉持久水平:cs_bucket_zscore(cross_ema(C, 30), LogFloatCap)(流通市值十分位内标准化。小盘与大盘的路径偏度分布不同,tick
    约束让低价小盘的路径更阶梯;控制里的市值只去掉线性 / 平方 / 三次暴露,十分位内标准化去掉的是任意形状的暴露,所以与控制不是同一个操作);mul(cross_ema(C,
    20), sign(cross_mean(day_sum(Ret), 20)))(顺趋势的形状:上升趋势里负偏 = 大部分时间在高位、回调很快被买回,是买盘有承接的路径)。

    为什么样本外还会在:(a)(e) 读的是参与者构成与盘口深度这类慢变的结构属性;(b) 读的是散户彩票需求留下的事件指纹,行为偏差不依赖某段行情;(c)(d)
    的相关 / 斜率 / 残差是无量纲的,每只票用自己的 60 日历史做对照,不依赖截面静态风格,不容易在风格切换时整体翻号。预期上它不是高概率:C 两段都亏
    3.1 说明毛超额在单日尺度上约为 0(亏的是换手成本,推断,没有毛收益数),这一位检验的是「慢下来之后有没有毛超额」。最可能的失败:(a) 慢下来之后仍与成本持平;(c)
    在 60 日窗口里估得太吵。

    数学检查:day_skew 在整天价格不动(停牌 / 一字板)时分母为 0,得 NaN 而不是 0 或无穷,cross_ema 把缺失日跳过(不当 0),cross_zscore
    分母带 EPS;cross_corr 与 cross_regbeta 在窗口里有效对太少时可能给 0 或 NaN(已知,只影响长期停牌的票,可交易掩码已排除);cross_regres
    取的是窗口最后一天的残差,所以外面套了 cross_ema;没有除法的分母是近零的量(种子 8 的缺口分母是前一日收盘价,正数)。无前视:全部只用 t 日收盘及以前的数据,cross_delay
    的天数为正,没有 cross_shift / in_local_mean。最长窗口 120 日,热身期不主导。'
