- type: N
  hypothesis: '机制:价格运动在一天里的时点轮廓(timing of price movement)。B058 批读的是价格路径的「值分布」(偏度),这一位读的是它的「时间分布」:当天的价格运动集中在开盘附近、午后还是尾盘,上涨集中在哪里、下跌集中在哪里。时点携带的信息是:开盘附近集中的运动是隔夜公开信息被知情者在开盘后兑现(价格发现),尾盘集中的运动是被动资金、机构调仓与收盘价管理这类订单流驱动,日内均匀的运动是持续的对冲与做市成交。这些是参与者构成的结构属性,个股层面持续(Heston,
    Korajczyk, Sadka 2010:同一半小时的收益和成交在随后几十个交易日里延续;Admati 与 Pfleiderer 1988:知情交易与流动性交易的时点集中)。

    批里的启发(都是 B058 成员表和拆解表上的事实):(1) Open / High 口径的 abs_(day_skew) 与已知族 rho 约 −0.03,与控制完全正交,但原始日换手
    0.88、原始净夏普 −15.4;(2) Amt / Volume 口径的换手 0.79、−8.6;(3) 唯一慢的成员 ts_decay_linear(abs_(day_skew(Amt)),
    20)(日换手 0.13)原始是 +0.77,但它在新尺子下没有进前三,说明成交额口径的慢聚合被控制吃掉了,而价格口径的形状信息是正交的却太快。偏度把「值的不对称」压成一个数,这里把同样的日内形状换成时间轴上的读数,并全部慢聚合:每个读数都是
    [0, 1] 之内或无量纲的比值,与成交额水平、波动水平天然低相关。

    实现(在分钟轴上用 in_slice(Ret, 1, 240) 去掉第 0 根集合竞价,让轮廓只描述连续竞价;第 121 根含午休缺口,只占约 1/240
    权重):day_centroid(abs_(r)) = |r| 的重心(0 = 全在开盘,1 = 全在收盘);add(r, abs_(r)) 只保留上涨分钟(的两倍)、sub(abs_(r),
    r) 只保留下跌分钟,它们的重心之差 = 「涨在后、跌在前」还是反过来,是 B058 偏度的时间轴、带方向的版本;day_gini(abs_(r)) 是运动集中在少数分钟的程度;day_argmax(abs_(r))
    是最大一分钟运动的时点;尾盘 30 分钟占当天 |r| 的比重。再与别的日度量做 60 日滚动关系:cross_corr(重心, 缺口, 60)(缺口用 cross_delay
    取前一日收盘,无前视)、cross_corr(重心, log(day_sum(Amt)), 60)、cross_regbeta(day_sum(Ret),
    重心, 60)(AlphaCube 的 cross_regbeta(x, y, d) 是 y 对 x 的斜率:当天涨幅每高一点,运动的重心移动多少)、cross_corr(价格重心,
    成交额重心, 60)(价格运动与成交同步 = 价格在成交时动,是信息驱动;不同步 = 量没有推动价格)。成交额重心只放在对照里,不是主角:W01 的 head
    把 day_centroid(Amt) 这一族封得很满,这里的主角是价格运动的时点,种子 9、10、11 里的成交额重心用 in_slice(Amt, 1,
    240) 同样去掉了集合竞价那一根(W01 的 Amt 重心用的是含第 0 根的整天,重心很可能主要由开盘竞价那一根的成交额占比决定,这是我的推断,这里读的是连续竞价里的时点)。

    为什么和已有的不同:(1) 库里 day_centroid / day_gini / cross_ema / cs_bucket_zscore / cross_zscore
    出现 0 次(它们是库建好之后 Partura 加的算子),我把本位 16 个种子的骨架逐一与 members.csv 的 5583 个骨架比过,没有一个重复;(2)
    手写库里最近的是 day_sum(abs_(in_slice(Ret, a, b)))(L1155–1157,首 30 分钟 / 尾 30 分钟 / 中段的绝对收益)和
    cross_mean(div(day_last(in_slice(Close...)), ...), 20) 这类时段收益,它们是原始日度量或时段收益的 20
    日均值,读的是运动的大小,不是重心、集中度和占比的无量纲时点;(3) 与 W01 已封的 day_centroid(Amt) 家族不同:价格运动重心与成交额重心不是同一个量(放量不一定动价),种子
    9、10、11 就是读它们的差、相关和残差。为什么样本外还会在:时点轮廓是参与者构成的结构属性,Heston 等人记录了持续数十个交易日;滚动相关与 EMA
    让换手低;所有读数无量纲,不随成交额水平与市值的风格切换而翻号。最可能的失败:(a) 价格运动的重心被开盘第 1 根分钟的波动主导(去掉第 0 根后仍可能);(b)
    60 日滚动相关估得太吵;(c) 与已知成交额族 rho 仍高,被控制吃掉(预计较低:重心与比值都是无量纲的)。

    数学检查:day_centroid 在 sum|r| = 0(整天不动)时为 NaN(代码里 tot > 0 才有值);day_gini 在 n ≤ 1 或
    sum|r| = 0 时 NaN;尾盘占比的分母 day_sum(abs_(r)) 只有整天不动(停牌 / 一字板)时才为 0,这时分子也是 0,div 得
    0 ÷ 0 = NaN 而不是 inf,cross_mean 按 nanmean 跳过缺失日(种子 12、13);sub(abs_(r), r) 与 add(r,
    abs_(r)) 是非负的,重心有定义;cross_corr 窗口内有效对不足时可能返回 0(已知,只影响停牌多的票)。无前视:Ret 与 Amt 都是当天的分钟数据,收盘后才用;cross_delay
    只用滞后,没有 cross_shift / in_local_mean。窗口最长 120 日,热身期不主导。'
  inspired_by: B058 批:abs_(day_skew(F)) 的 Open / High 口径与已知族 rho −0.03(完全正交)但日换手 0.88、原始净夏普
