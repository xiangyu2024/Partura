    hypothesis: '核心 day_centroid(in_slice(Amt, 1, 240)) = 一天里成交额的重心时点(0 = 全在开盘,1 = 全在收盘),含它的 67 个候选均值差 +1.31 (p<0.001);本流两个正 head 里它是回归的解释端(昨天的重心,横截面去均值后),对今天的左尾深度做 241 日斜率。本位固定它做解释端,换被解释端(上一位固定被解释端、换解释端,两位互补):今天的结果量不再是左尾深度,而是别的日度结果 —— 日内收益(开盘到收盘)、收益偏度、最重成交分钟的平均收益 day_topw_mean(Ret, Amt)(共性表里含 day_topw_mean 的候选均值差最高 +2.06)、成交额加权波动 day_wstd(Ret, Amt)、日内低点停留比例 day_at_min_ratio(Close)、以及右尾 day_es_ratio_hi(Close)。机制:成交额重心偏晚 = 当天的信息 / 订单拖到尾盘才成交,通常是机构拆单或流动性晚到;这类股票接下来的价格反应(方向、偏度、尾部)里,对昨天重心的敏感度是一个个股慢性质 —— 机构订单流的粘性。与库里不同:这些写法不含 sigmoid 包裹的 es_ratio 被解释端,被解释端换成别的后骨架不同,与两个 head 的秩相关预计在 0.2 ~ 0.6(若 ≥ 0.7 会被相关度表划掉);另有两个只取斜率变化(cross_delta 3 日差,共性表里 +1.54)或市值十分位内 EMA 的版本。为什么样本外还会在:241 日窗口的回归斜率换手低,对市值与流动性正交,head 已在 train 与 valid 同时 > 0.5,说明不是某一段市场的伪影;我的预期是被解释端为收益类的写法会比尾部类差(收益更噪),这是本位要读的对比。'
