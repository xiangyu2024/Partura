    hypothesis: '核心 day_es_ratio_lo(Close) = 当天价格低于自身 5% 分位的那些分钟的均值 / 该分位,是左尾形状:当天价格路径的下探有多深、多集中(无量纲,不随价格水平变)。证据:共性表里含它的 38 个候选均值差 +1.68 (p<0.001),本流两个正 head(+0.79 / +0.59,train 与 valid 都 > 0.5)都把它放在 241 日回归的被解释端,拆解显示它的 sigmoid 层是装饰(去掉 +0.78),真正在起作用的是「昨天成交额重心(cs_demean 后)对今天左尾深度」的 241 日斜率。本位不再让它做回归的被解释端 + 重心这一个写法,而试它在外围的另外几种用法:(1) 左尾与右尾的耦合 / 差(day_es_ratio_hi 是另一个未使用的叶子算子):一年里下探与冲高是否同步,是个股的路径对称性;(2) 被解释端不变、解释端换成别的昨日日内形状量(day_gini 的成交额集中度、day_signed_ratio 的买卖方向、day_sum(Ret) 的昨日收益):读的是「什么样的昨日交易形态预示今天下探更深」,是一个信息消化 / 流动性冲击机制,不是水平;(3) 反过来的回归 / 自回归(尾部形状的持续性斜率)和 t 值版,以及市值十分位内标准化版;(4) 慢 EMA 与 25% 尾部均值(只用最糟的那部分日子)的单量版,作为没有第二个量时的参照。为什么与库里不同:库里与已出 head 的骨架里,es_ratio 只出现在被 sigmoid 包过的 centroid 回归里;这里的外围(gini / signed_ratio / es_ratio_hi / 自回归 / Close-Vwap 差)是别的骨架,与快照 head 的秩相关预计 < 0.5。为什么样本外还会在:下探深度的个股慢性质、以及它对前一日成交形态的反应系数,是 241 日窗口的估计量,换手极低(净夏普几乎不吃成本),对 beta 与流动性是正交的,这是 head 在 train 与 valid 上都 > 0.5 的原因,两段不同的市场环境下同号。'
