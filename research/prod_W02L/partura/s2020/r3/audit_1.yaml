slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [7, 8]
    reasons: '核心 day_es_ratio_lo(Close) 与各控制的原始 |ρ|:liq 0.07 / vol 0.35 / rev 0.21 / known 0.11 / size 0.00,全部 < 0.8,E 位的核心门槛通过;核心在 head 1 里是 sigmoid(sigmoid(·)) 包着的子树、在 head 2 里是 sigmoid(·) 包着的子树,满足「核心必须是快照 head 子树」。14 个种子中划掉 2 个:seed 7(cross_regbeta(es_lo, cross_delay(centroid,1), 241),与 head 1 的原始 |ρ| 0.79,即同一对变量的回归方向对调,是重复);seed 8(cross_reg_tvalue(cross_delay(cs_demean(centroid),1), es_lo, 241),与 head 1 的原始 |ρ| 0.95,是同一回归的 t 值版,是重复)。另外没有种子与任何控制的 |ρ| 达到 0.8(最高是 seed 11 的 vol 0.66、seed 12 的 vol 0.64)。剩 12 个,≥ 4,通过。与库里 loc.json 的 174 条含 day_ 或 cross_ 的候选逐字比对,划完后的 12 个种子都不在其中,外围不与已见候选相同。创新度给 4:核心虽是 head 的组成部分,但大多数种子不用 centroid 作解释端:seed 1(es_lo 与 es_hi 的左右尾耦合)、seed 2(Close 与 Vwap 的尾形差)、seed 6(es_lo 的自回归斜率)、seed 3 / 10 / 13(昨日 gini 集中度 / 收益 gini,作解释端)、seed 4 / 5(昨日买卖方向比 signed_ratio 与昨日收益 day_sum(Ret))、seed 14(昨日 wstd 波动)、seed 11 / 12(es_lo 的慢 EMA 与尾部均值,单量参照)都是库里没有的骨架。合理度给 4:数学上,各 day_* 算子只用当日分钟数据,books 按次日超额收益计分,cross_delay 天数为正,cross_delta / cross_corr 都是同日或过去的量,无前视;cross_regbeta(x,y,d) 按 common.py 的 rolling_ols 是 y 对 x 的斜率,种子的读法与假设一致;es_ratio 在收盘价为正时取值 (0,1],分母不接近零,无爆点;没有 ts_rank / cross_rank / in_rank_rolling,没有 nanrank 陷阱;没有 nt_* 与 ts_spearman。需要注意:seed 11 与 12 的 vol 相关 0.6 以上,慢版的 es_lo 有一部分是区间 / 波动的代理,不是纯形状;这不够挡,只在合理度里记一笔。如果它有 alpha,最可能来自下探形状的个股慢性质与左右尾的耦合(seed 1、6、11、12),或昨日成交集中度 / 买卖方向对今日下探深度的预测(seed 3、4、10)。'
  - slot: b
