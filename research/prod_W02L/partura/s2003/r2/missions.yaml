- type: N
  hypothesis: '机制。本位读股本结构与供给压力。两个库 5583 条表达式里 6 个日频字段(LogFloatCap、LogTotalCap、LogFloatShares、LimitWidth、BoardCode、ListAge)一次都没有出现(我对 members.csv 的表达式逐个字段计数,全是 0),日频字段只出现在尺子的控制里(LogFloatCap 的市值水平);所以「股本结构的变化与限售占比」这个维度,两个库和由它们合成的两个冠军都没有读过。数据:docs/steering_and_daily_fields.md §1.4,FloatShares = QMT daily_capital 的 circulating_capital(流通股数,只在解禁、增发、送转、回购时才变),LogTotalCap − LogFloatCap = log(总股本 / 流通股本)(两个市值用同一天的同一个价格,价格相消),即限售股占比的对数。


    子假设都有文献,机制说得清楚。(a) 解禁压力:限售股占比高 = 未来待解禁的供给大,股价在解禁前后走弱(Field-Hanka 2001, IPO lockup expirations);种子 1、2(2 是对流通市值取截面残差,剥掉「小盘股限售占比高」的混杂)。(b) 已发生的供给扩张:过去 60–241 日流通股本 / 总股本的增长(解禁、增发、送转、期权行权)对应股票发行异象:发行多的公司后续收益低(Loughran-Ritter 1995, Pontiff-Woodgate 2008);种子 3–8、11,其中 5、6 只看流通股本,7、8、11 看总股本(总股本 = 限售占比对数 + 流通股本对数,代数在种子里直接写出来)。(c) 事件频率与累计变动:过去 241 日流通股本发生变动的天数占比(sign 取 −1/0/1,abs 后取均值)、每日变动幅度绝对值累加,种子 9、10。(d) 尾盘成交强度的按流通盘归一:批里 B007 的承重部件是尾盘 1 分钟成交量 day_last(Volume)(收盘集合竞价,被动 / 机构的交易窗口);把它从「股数」换成「占流通股本的比例」(log(尾盘量) − LogFloatShares,单位换算只差一个常数,排名不受影响),慢均值读「这只股票收盘集合竞价的参与强度」,种子 12、13。


    为什么和已有的不同:没有任何一条库表达式读股本结构;尺子只去掉了市值水平(LogFloatCap 的 1/2/3 次方),限售占比 = 总股本 / 流通股本,不是市值水平本身(种子 2 与种子 11 还对 LogFloatCap 取了截面残差)。head 都是 Hurst(尾盘量)与 day_max(Ret),日度秩相关预计接近 0。


    为什么样本外还会在:解禁日程与发行都是规则驱动、公开的,每年新一批上市公司进入解禁周期,供给压力是结构性的;全部种子是慢变量(换手近零,15 bp 成本几乎不吃分数,分数 ≈ 毛超额),这是 2009 流里最好读数(−0.03)与 R 里 d = 20 → 80 单调变好的共同形状。风险:(1) 体制:2024 年起减持新规、IPO 节奏放缓会改变解禁的影响;(2) 并列:多数股票在窗口内流通股本没变,cross_delta 类种子在 0 处有大量并列,并列靠股票列序打破,携带板块信息,这不是数学问题但会让排名在 0 附近带板块倾斜,所以我同时放了连续变量的版本(种子 1、2、12、13);(3) 与市值相关:限售占比与市值(小盘 / 次新)有相关,预计与 LogFloatCap 控制的 |ρ| 在 0.2 ~ 0.4,尺子去掉线性 / U 形 / S 形部分。


    数学检查:cross_delta(x, d) = x[t] − x[t−d],因果;前 d 天为 NaN(种子 3、5、7、11 为前 241 天,约占 train 的 15%,种子 4 为前 60 天)。没有除法;只有 log(day_last(Volume)),零成交为 NaN(log 对 |x| ≤ EPS 返回 NaN),不会给 inf。sign / abs_ 返回浮点(没有用 is_gt,避免整型张量在滚动窗口里填 NaN 出错)。LogFloatShares 在 float64 里取 log 后降 float32,变动日精度 ~1e-6,足以分辨解禁 / 增发(幅度通常 > 1%);未变动时相邻两天逐位相同,差为精确 0,没有噪声。FloatShares 覆盖率由 build_daily_fields.py 的 --min-coverage 0.5 保证,缺失为 NaN 不影响其他股票的截面。无前视:t 日的股本变动只在 t 日及之后进入窗口。'
