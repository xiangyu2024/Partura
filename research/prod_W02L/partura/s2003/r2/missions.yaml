  core: day_q_stat_std(Vwap)
  hypothesis: '机制。核心 Q = day_q_stat_std(Vwap)(当天 241 根分钟 Vwap 价格水平序列的 Ljung-Box Q 统计量在 1–20 阶上的标准差;第 1 轮我读源码并用合成价格路径核实过:无量纲,价格乘 3、波动放大 10 倍都不变,读的是日内低频摆动 / 分钟噪声的比值,即价格路径的持续性,不是波动率)。本位不读 Q 的水平,读它与同一天成交量序列特征的时间序列耦合:cross_corr(Q, 成交量路径统计量, d) = 这只股票最近 d 个交易日里,价格路径越平滑 / 持续的日子,成交量路径是否也越规则 / 越成团。理论依据是量–价动态区分信息性交易与对冲 / 噪声交易(Llorente-Michaely-Saar-Wang 2002):机构分批执行时价格单边平滑、成交均匀规则,耦合强;噪声交易时价格平滑与成交脉冲无关,耦合弱。耦合是个股的慢变特质(参与者构成),相关系数无量纲,与流动性、波动、反转、市值的水平无关,不是已知成交额族的换写法。


    这一轮的依据是第 1 轮 E 位的读数,不是猜测:69 个已评分候选里最好的 5 个全是 cross_corr(Q, X, d) 一类:cross_corr(Q, day_autocorr_n1(Volume), 60) 为 −0.90(train −0.90 / valid −0.77,方向 −1,半衰期 5)、cross_corr(Q, day_q_stat_std(Volume), 15) 为 −0.98、嵌套相关 −1.34、cross_corr(Q, day_q_stat_std(Volume), 60) 为 −1.64(train −0.83 / valid −1.64)、cross_corr(Q, day_sum(Ret), 60) 为 −1.78。第 1 轮我押的「分桶 / 残差」类一个都没进前 5(桶边界跳变增加换手;同一波 2009 流量出过 cs_bucket_demean 变体 −2.6 ~ −5.2,与此一致)。相关类 −0.9 ~ −1.8 远好于该种子其余读法(−2 以下),说明里面有毛信号,但被成本吃掉:15–60 日窗口的相关系数标准误约 1/√d = 0.13 ~ 0.26,排名每天抖动,而 15 bp 成本是分数里最大的一项。同一波里 2009 流量出同一规律:种子都是 cross_mean(·, 20),GP 自己拉到 241 才得到 −0.03,另一个式子 ts_max(day_durbin_watson(Close), d) 的 d = 20 → 40 → 80 为 −2.73 → −1.77 → −0.92,「慢」才承重。


    本轮的做法:外围一律换成「慢化 + 换伙伴」,与第 1 轮种子里出现过的外围(cross_zscore、cross_ema 套 z 分数、短长均值差、裸 cross_corr、cs_bucket_zscore / cs_regres、cross_stddev、cross_tail_mean_q25)都不同。(1) 种子 1–6、9、10:短窗口相关(15–60 日)外面再套 60–241 日的 cross_mean / cross_ema / cross_decay_linear / cross_med,有效样本 > 200 日,换手明显下降,个股的耦合读数变成稳定特质;cross_med 对相关系数的偶发 ±1(有效对数很少时)稳健。(2) 换伙伴(种子 7、8、13–16):day_ar1_coefficient(Volume) 与 day_durbin_watson(Volume)(成交的自相关 / 粗糙度)、day_gini(Volume)(成交集中度)、day_centroid(Volume)(成交重心在一天里的位置)、day_q_stat_std(Ret)(收益序列的自相关结构)、|日收益|(价格路径平滑与波动幅度的耦合)。这些伙伴在库里 5583 条里读法各不相同:day_gini、day_centroid 出现 0 次,cross_ema 出现 0 次,骨架我逐个核对过,16 个种子的骨架都不在两库里。(3) 种子 10:前一日的 Q 与当日成交特征的超前滞后相关(ts_delay 取前一交易日);种子 11:快耦合(半衰期 30)减慢耦合(半衰期 241),读「耦合近期增强 / 减弱」;种子 12:两个伙伴的耦合相加,压低单一伙伴的噪声。


    为什么和已有的不同:三个 head 读的是尾盘分钟的量(Hurst)和 Q 的水平;库里含 Q 的 46 条绝大多数是水平类,唯一读耦合的一条是 signedpower(cross_quantile_q75(cross_corr(day_q_stat_std(High), day_skew(Vwap), 10), 10)),价格叶子、伙伴、外围都不同。本位的对象是 Q(Vwap) 与成交特征之间的滚动相关再做慢平滑,不是任何一个量的水平,与 head 的日度秩相关预计很低(第 1 轮同类种子对 head 的 |ρ| ≤ 0.27,与 5 个控制的 |ρ| ≤ 0.37)。


    为什么样本外还会在:参与者构成(机构分批执行 vs 散户噪声交易)是慢变的结构性属性,不依赖某一段行情;种子都套 60–241 日的平滑,换手低,风险主要是 valid 段的体制切换(第 1 轮 60 日窗口 train −0.83 / valid −1.64,15 日窗口两段接近,说明窗口越长越要看两段是否一致,我预期 day_autocorr_n1 一类伙伴比 Q(Volume) 更稳)。


    数学检查:cross_* 全部是日轴的因果滚动(窗口含当天,当天收盘后可得,t+1 交易),ts_delay 取前一交易日;没有 ts_rank / cross_rank / in_rank_rolling,不触发 nanrank_last 的停牌记 0 问题。cross_corr 按源码在窗口内有效对数 ≤ 1、或两列之一是常数时记 0(分母加了 EPS,不是 NaN,不会出现 inf),恰为 2 对时给 ±1,只影响新上市 / 刚复牌 / 长期停牌的少数股票日;停牌期的 0 会被外层均值带进去,把长期停牌的票拉向截面中部,这是已知的小偏差,不主导。没有除法、没有 log,没有除以近零的量。cross_mean / cross_ema 在前 d 天是扩张窗口(NaN 左填充,取可用日),不是 NaN,头 241 天(约 train 的 15%)读数噪声较大但有定义。Q 在一字板日为 0(常数路径),不是 NaN,会被均值类外围带进少量涨跌停日。'
