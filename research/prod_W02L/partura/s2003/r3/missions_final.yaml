- type: N
  hypothesis: '机制。对象是一年(241 日)窗口里个股日价格 / 成交路径的「形状」,全部是无量纲的形状统计,不是水平(波动、成交额、市值、20 日反转、成交额离散度是控制,两个冠军读的是水平与快变量)。r
    = ts_delta(log(day_last(Close)), 1)(后复权日对数收益),v = ts_delta(log(day_sum(Amt)),
    1)。分五组:(1) 序列相关:日收益的 1 阶 / 5 阶自相关 cross_autocorr(r, 241, k)(摩擦造成的反转或延续,Lo-MacKinlay
    1988;Avramov-Chordia-Goyal 2006),种子 3、4 乘 有效天数 / 241 收缩,4 再对 LogFloatCap 取截面残差。(2)
    方差比:VR(5) = std(5 日对数收益) / (根号 5 · std(r)),VR(20) 同理(>1 延续,<1 反转或买卖价差反弹);5 日版对
    (VR − 1) 乘 n/241 收缩。(3) 路径效率:一年净对数涨跌 / 一年总变差 = cross_delta(log Close, 241) / cross_sum(|r|,
    241)(7 带符号,8 取绝对值),读「信息是连续到达还是离散跳跃」(Da-Gurun-Warachka 2014 的 frog-in-the-pan;这里用路径效率而不是上涨日占比,因为占比只有约
    100 个取值、并列严重,会被 distinct 闸门判废)。(4) 好坏波动不对称与尾部:上行半标准差 P 与下行半标准差 N(cross_semistd_pos
    / neg 作用在后复权 Close 水平上 = 日对数变化的半标准差),种子 9 取 (P − N) / (P + N) ∈ [-1, 1] 再乘 n/241(Bollerslev-Li-Zhao
    2020 的 good / bad volatility);下行半标准差占总标准差的比例(10);std(r) / mean|r|(11,峰度的稳健代理,12
    再对 std(r) 取截面残差去掉波动水平)。(5) 聚集与噪声:cross_autocorr(|r|, 241, 1)(13,波动聚集的持续度)与成交额日变化的
    1 阶自相关(14,成交额里「噪声 vs 慢成分」的比例;与 B007 head 读的「成交路径持续性」同类,但用相关系数读,不用 R/S)。


    为什么和库里已有的不同:我对 members.csv 的表达式做了字符串检索:cross_semistd_* 0 条;日收益的 cross_autocorr
    0 条(只有 2 条手写式在分钟收益 / 20 日 Close 上做自相关再取日内均值,冠军族 −1,训练净夏普 −16);字符串检索没有发现方差比、也没有一年净涨跌
    / 总变差的写法。库里读日收益的表达式几乎都是 cross_stddev(日收益, 20) 一类的波动水平(冠军族 41 / 49),这里的 std/mean|r|、下行占比、好坏波动比是「形状」,与水平是不同的量;已核全部种子的骨架都不在两库里。


    为什么样本外还会在:序列相关 / 方差比 / 路径连续度由持有人结构(散户日内交易 vs 机构分批执行)与做市摩擦决定,是慢变特质;全部 241 日窗口,秩日度变化小,换手近
    0;本流与本波的读数都说明「慢」是前提。风险:效率与方差比与流动性(买卖价差反弹)相关,尺子去掉线性 / U 形 / S 形部分;涨跌停板截断日收益,20%
    板块(创业板 / 科创板)与 10% 主板的形状不同,携带的是板块信息,不是数学问题。


    数学检查:无前视,全部只用 t 日及以前。ts_delta(log(Close), 1) 与 cross_delta(log Close, k) 在端点缺失时为
    NaN(不足一年的新上市股票、端点日停牌的票缺失,覆盖率约 0.9 以上),不跨缺口。VR 分母 std(r) 只有整窗口停牌(r 全缺失,结果为 NaN)或全不动时为
    0,不造成爆点;根号 5 = 2.2360679,根号 20 = 4.472136 写成常数。cross_sum 把缺失日记为 0,分母是一年总变差,窗口里只要有成交就
    > 0。cross_semistd_pos / neg 要求 Close > 0(后复权价为正),窗口内有效天数 < 3 为 NaN;下行半标准差为 0(窗口内没有下跌日,多见于新股连续涨停)时
    (P − N) / (P + N) = 1,乘 n/241 压向 0 附近;P + N = 0 只在整窗口没变动时出现,给 NaN。cross_autocorr
    按源码是两列滞后后的滚动 Pearson,有效对数 ≤ 1 记 0、分母加 EPS,只影响新上市 / 长停牌的少数股票日,种子 3、4 收缩。取值连续,没有并列。'
