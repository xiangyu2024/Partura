R:
- head: ts_mean(ts_hurst(div(day_last(Volume), day_max(Low)), 20), 241)
  why: 'head 是本流第 2 轮 R 的替换(−0.22,train −0.14 / valid −0.22)。同一个 ts_hurst(尾盘量 / 当日最低价,
    20),外层窗口 25 / 80 / 120 / 241 是 −1.20 / −1.11 / −1.62 / −0.22(train −1.00 / −0.77
    / −0.66 / −0.14),拆解里 Low→High −0.18、Volume→Amt −0.63、去掉分母 −0.53,都在噪声内。我认为烂的部件有四处,每处一组变体,读法事先约定:

    (1) −inf 污染:ts_hurst 在窗口内第二老一天缺失而最老一天有值时返回 −inf(极差为 0 取对数,第 2 轮审计员核过源码),ts_mean
    把它带满整个 241 日窗口(第 2 轮审计:gate 的覆盖率,241 日版比 cross_ema 半衰期 60 的版本低 7.5 个百分点)。变体 1~3(cross_med、cross_quantile_q75、cross_tail_mean_q75)只读窗口的中位
    / 上四分位,−inf 在下尾,不传播。读法:若它们 ≥ head + 0.1,说明 −inf 在拖累;若比 head 差 0.3 以上,说明「近一年出现过停牌缺口的票被排到最低
    / 当缺失」这道筛子在贡献分数。

    (2) 还不够慢:变体 4、5 用 cross_ema 半衰期 120 / 241(记忆比 241 日硬窗口更长,旧值淡出而不是突然掉出);train 随窗口单调变好,看还能不能更好。

    (3) Hurst 窗口:变体 6、7 用 25、30 日(外层 241),看 20 是不是尖峰(外层 120 日时 Hurst 15 / 20 / 30
    是 −1.37 / −1.62 / −1.16;第 1 轮 R 里 Hurst 窗口 40 的变体 valid 塌到 −3.36)。

    (4) 重尾与市场共同成分:R/S 作用在水平序列上,尾盘一分钟成交量是重尾的,一天的巨量把整个窗口的极差拉大,变体 8 先取 log;变体 9 再 cs_demean(减掉当天全市场的平均
    log 比值),只读个股自己的路径。

    分母 day_max(Low) 不再动:拆解里去掉它 −0.31、换 High 只 +0.04,在噪声内。

