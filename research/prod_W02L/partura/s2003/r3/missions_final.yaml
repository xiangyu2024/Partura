- type: N
  hypothesis: '机制。对象是「个股自己的日序列里,有多少由全市场共同成分驱动、有多少是个股特质」,在一年(241 个交易日)窗口里读。造一个单指数:r
    = ts_delta(log(day_last(Close)), 1)(后复权日对数收益,取比值,复权基期无关),m = cs_mean(r)(全市场等权日收益,同一天对所有股票是同一个数);同样
    v = ts_delta(log(day_sum(Amt)), 1)(成交额日变化)与 cs_mean(v)、t = ts_delta(log(day_last(Volume)),
    1)(收盘一分钟成交量日变化)与 cs_mean(t)。每只股票只算「自己与这一条市场序列」的 241 日相关,不是两两相关:不用 ts_pearson 那种与全市场每只股票同期窗口相关的写法(O(S^2),慢),而用一个市场因子做单指数收缩,计算量
    O(S)。


    读法(15 个种子,6 组):(1) 收益同步性 corr(r, m)(种子 1;种子 2 乘 有效天数 / 241,把新上市 / 长停牌的短窗口噪声收缩向
    0;种子 3 在 2 的基础上对 LogFloatCap 做截面残差;种子 15 对已知成交额族 cross_mean(day_std(Amt), 30)
    做截面残差);对市场的 beta 再对市值取残差(4)。(2) 下行联动减上行联动 corr(r, min(m,0)) − corr(r, max(m,0))(5;下行
    beta 溢价,Ang-Chen-Xing 2006)。(3) 价格延迟 corr(r, 昨日 m)(6)与个股领先 corr(昨日 r, m)(7)(Hou-Moskowitz
    2005:对市场信息反应慢的票)。(4) 波动联动 corr(|r|, |m|)(8;对市场波动的敏感度,Ang-Hodrick-Xing-Zhang 2006)。(5)
    成交额联动 corr(v, cs_mean(v))(9;12 对市值取残差)= 流动性共性(Chordia-Roll-Subrahmanyam 2000;Acharya-Pedersen
    2005 的流动性风险溢价);成交额对市场动荡 corr(v, |m|)(10);收盘一分钟成交量的共性 corr(t, cs_mean(t))(11)。(6)
    价格联动减成交联动(14),以及本流 R 组 head `ts_mean(Hurst(尾盘量比), 241)` 的去市场版(13):对 cs_demean(log(day_last(Volume)))(减掉当天全市场的平均
    log 尾盘量,只留个股自己的路径)做 20 日 Hurst、再 241 日均值 —— 与 head 读同一个对象,但去掉了全市场共同的尾盘成交节奏(指数
    / ETF 申赎日、月末季末),分数差就是这个共同成分的贡献。


    为什么和库里已有的不同:我对两个库 5583 条表达式做了字符串检索:同时含 cross_corr / cross_regbeta / cross_cov
    / cross_autocorr 与 cs_mean / cs_sum / cs_demean / cs_rank / cs_scale / cs_zscore
    的只有 33 条,全是 GP 随机树(例如把 cs_sum(signedpower(...)) 当回归元),没有「个股序列对同类序列的全市场均值」这种结构;ts_delta(log(day_last(Close)),
    1) 形式的日收益 0 条,cross_valid_count 0 条。本组全是相关系数(无量纲),不是水平:波动、成交额、市值、20 日反转、成交额离散度这
    5 个控制与两个冠军读的都是水平或快变量。预计与快照 head(尾盘量路径的 Hurst、day_max(Ret)、Q 嵌套)的日度秩相关低于 0.3;与
    5 个控制:收益同步性与市值 / 流动性可能 0.4~0.6(大票联动高),所以放了取残差版,不会到 0.8。


    为什么样本外还会在:联动 / 延迟 / 流动性共性是持有人结构(指数基金与机构 vs 散户)和交易摩擦的慢变特质,不依赖某一段行情;241 日相关的秩每天几乎不动,换手近
    0,15 bp 成本几乎不吃分数;本波尺子上最接近 0 的读数里,最好的几条(本流 R 组 241 日 Hurst 均值 −0.22,2009 流 241
    日均值 −0.03)都是 120~241 日的慢统计,而 15~60 日窗口的耦合读数停在 −0.8 上下(本流第 2 轮 E 位),所以这里一律用 241。风险:2024
    年起量化与指数产品占比变化可能改变联动结构(valid 段);联动与大盘股倾斜相关,尺子会去掉线性 / U 形 / S 形部分,剩下的是「同市值同流动性下谁更联动」。


    数学检查:无前视:cs_mean(r) 与每个 cross_* 只用 t 日及以前的数据,t 日收盘后可得,t+1 交易。ts_delta(log(Close),
    1) 在停牌复牌日是缺失(前一日缺失),不跨缺口;log 对非正输入给 NaN,不给 -inf。cross_corr 按源码在有效对数 ≤ 1 时记 0、恰为
    2 对时给 ±1,分母加 EPS(不是 NaN,不出现 inf),只影响不足 241 日的新上市 / 长停牌的少数股票日,种子 2、3 乘 n/241 把它们压向
    0。cross_regbeta 在 var_x ≤ EPS 时给 NaN(市场序列不会是常数)。cs_regres 是当天截面 OLS 残差,无前视。相关系数取值连续,没有并列(distinct
    接近 1)。没有除以近零的量。种子 13 用 ts_hurst:窗口内第二老一天缺失而最老一天有值时返回 -inf(已知算子行为,与 R 组 head 同一个筛子),不主导,但该种子与
    head 的差里含它。'
