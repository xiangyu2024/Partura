    why: |-
      烂部件是乘数 day_max(Volume)。依据:拆解表里单独的 Hurst 块 log(ts_mean(…, 50)) 只有 −2.08,去掉 day_max(Volume) 乘数掉到 −2.14(必要性 +0.91),只留乘数和外层的子树 −1.29,几乎等于整个 head(−1.23);另外 log 包装本身无关紧要(拆掉它 −1.18,必要性 −0.05)。再对照另一条流(2001)的快照:day_max(Volume) 单独的 score 是 −1.11(两段 −1.10 / −1.11),比整个 head 还高 0.12。所以 head 1 的次序主要由乘数 day_max(Volume)(股数口径的日内峰值,重尾、水平量,与流动性和已知成交额族相关)决定,Hurst 块几乎没有贡献。本组把水平从乘数里拿掉:换成无量纲的「峰值 / 均值」尖峰度 div(day_max(Volume), day_mean(Volume)),和压住重尾的 log(day_max(Volume))。预计后一个仍带水平,前一个与已知族的相关会明显低于 0.5,但分数更低;这组的价值是量出「Hurst 块在去掉水平之后还剩多少」。数学上:day_mean(Volume) 在有成交的日子 > 0,整天无成交是 0 / 0 = NaN;day_max(Volume) 有成交时 log 为正有限。Hurst 部分行为同 head 2。
