  - type: N
    hypothesis: |-
      机制:收盘价相对当天成交均价的偏离(「尾盘价格压力」)以及它在次日开盘的回吐,是「尾盘一分钟」这个对象的价格侧读数。批里的现象:B007 的三个 head 全部以尾盘一分钟成交量 day_last(Volume) 为底(除以 day_max(Low) 后取 20 日 R/S Hurst),读的是「尾盘成交是不是一个持续的状态」(拆解表:去掉最外层的 ×ts_hurst(div(day_last(Volume), day_max(Low)), 20) 因子,head 2 损失 0.49、head 3 损失 0.13)。本位把同一个时点从成交量一侧搬到价格一侧。定义三个日度量:G = log(收盘价 / 当天成交量加权均价)(收盘被推高为正、压低为负);GAP = log(开盘价 / 前一日收盘价)(隔夜缺口);V = 尾盘一分钟成交量相对自己 20 日的 z 分数。假设:个股的「收盘被推离当天均价」有稳定的个体性,来源是收盘集合竞价与收盘价形成的规则(深市含集合竞价、沪市是最后一分钟,是个股的固定属性)、指数 / ETF / 基金的收盘调仓与考核、以及尾盘拉抬 / 打压行为;它的强度、与尾盘放量的联动、以及前一日的偏离在次日开盘是否回吐(回吐 = 非基本面的价格压力;Hillion-Suominen、Comerton-Forde-Putniņš),是一个与水平量(流动性、市值、成交额族)无关、有界、慢变的个体特征。
      算子怎样实现(G、GAP、V 的写法:log(div(day_last(Close), day_wmean(Vwap, Volume)))、log(div(day_first(Open), ts_delay(day_last(Close), 1)))、cross_zscore(day_last(Volume), 20);day_wmean(Vwap, Volume) 就是当天的成交量加权均价,与 Close 同单位,不依赖 Amt 的量纲):(1) 水平与平滑:G 的 20 日均值、半衰期 20 的 EMA、5 日均值相对 120 日自己历史的 z 分数、5 日对 60 日的差。(2) 与尾盘放量的联动:G × V 的 20 日均值、G 与 V 的 60 日相关、sign(G) × V 的 20 日均值(「放量往哪边推」)。(3) 次日回吐:前一日 G 与当日 GAP 的 60 日滚动相关;前一日 G × 当日 GAP 的 20 日均值。注意两者共享 log C(t−1)(G(t−1) = log C(t−1) − log VW(t−1),GAP(t) = log O(t) − log C(t−1)),所以收盘价里的噪声越大,这个相关越负,这正是要读的东西,不是估计的毛病。(4) 隔夜对尾盘:GAP 的 60 日均值减 G 的 60 日均值(「隔夜拉升 vs 尾盘拉升」,借 Lou-Polk-Skouras 的拉锯读法,不做它的月度组合)。(5) 分布:G 的 40 日标准差、上下四分位尾均值之和(拉抬与打压的幅度不对称)、G 与当天日内收益的 60 日相关、G 与同日 GAP 的 60 日相关。(6) 条件:G 的 20 日均值在已知成交额族十档内 / 流通市值十档内 z 分数。
      为什么和已有的不同:head 读的是尾盘「量」的路径形态(Hurst × 水平),本位读的是尾盘「价」,骨架与 5583 条全部不重合(逐条核对过)。手写库里 Close − 成交均价只在 2 条表达式里出现,而且是短窗口的截面排名乘积(Alpha101 风格);库里没有任何一条读它的 20–60 日均值、相对自己历史的 z 分数、与尾盘放量异常的联动、或前一日偏离与次日开盘缺口的滚动相关。挖掘库里 day_last(Volume) 出现 115 次,全是量的一侧。
      为什么样本外还会在:收盘价形成机制(集合竞价规则、T+1、基金考核日、指数调仓)是制度性的,个股在这上面的特征(是否常被尾盘推离均价、是否次日回吐)是慢变的个体属性;种子读 20–120 日窗口,换手低。预期的弱点:G 的均值类种子与 20 日反转有关(G 约等于当天下午的漂移,与日内收益同号),预计与反转控制中度相关(≤ 0.5),尺子会剥掉线性部分;更有希望的是回吐类(种子 8、9)与联动类(种子 5–7),它们读的是相关结构而不是水平。
      数学检查:G 的比值在 (0, ∞) 内、接近 1,log 后在 0 附近(±1% 量级),没有近零分母;一字板日 G = 0、GAP 可非零。V 是 20 日 z 分数,有界(|V| ≤ √19),常数窗口记 0;day_last(Volume) 在没有成交时可能为 0,不会产生 0 作分母(只有 cross_zscore 内部的 std + EPS)。没有 cross_regbeta(窗口内方差很小时斜率会爆),只用有界的相关与均值。ts_delay 取前一个交易日,停牌为 NaN;cross_corr 窗口里有效对数少时给 0 或 ±1,只影响头几天。G 用的是 t 日收盘及以前的数据,GAP(t) 用 t 日开盘和 t−1 日收盘,前一日 G(t−1) 与 GAP(t) 的相关窗口只用已发生的配对,无前视;t+1 才交易。cs_bucket_zscore 分母带 EPS。窗口 ≤ 120,热身期不主导。
