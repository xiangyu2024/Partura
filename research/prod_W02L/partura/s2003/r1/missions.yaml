      烂部件是 Volume 叶子(股数口径):拆解表里把 Volume 整条换成 Amt 后,score 从 −1.57 升到 −1.03(train −1.03 / valid −0.35,增益 +0.54),valid 只有 −0.35 是整批最好的读数。原因的推断:股数 = 额 / 名义价,名义价是 5 个控制之外的一个维度(增加噪声);day_std(Amt) 又接近已知成交额族,所以 Amt 版的 train 仍是瓶颈。本组以 Amt 版为底,试窗口(30 / 80 日)、去掉内层加法(同 head 2 的 ΔA)、Hurst 窗口 40,以及 ΔA + 40 + 30 日的叠加。注意同一 head 的 25 日窗口在 Volume 版里更差(−2.03),所以窗口方向要用 Amt 版重新试,不照搬 head 2。数学上:day_std(Amt) 是金额量级(按量级估计 1e5–1e9)的正数,加在 log 之后(log Q ≈ 7)相比起来远大于 log Q,所以 log(add(·, day_std(Amt))) 实际由 day_std(Amt) 主导(这是已知族的写法,不是新问题);Hurst 部分行为同 head 2。
