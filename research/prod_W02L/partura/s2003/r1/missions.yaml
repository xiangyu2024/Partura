slots:
  - type: E
    core: 'day_q_stat_std(Vwap)'
    hypothesis: |-
      机制:三个 head(以及库里 46 条含 day_q_stat_std(Vwap) 的挖掘库表达式)都把 Q = day_q_stat_std(Vwap) 当「底」。Q 是当天 241 根分钟 Vwap 价格水平序列的 1–20 阶自相关,做成 Ljung-Box Q 统计量序列后取的标准差。我读源码并用合成价格路径核实了它的行为(没有用任何市场数据):纯随机游走下 Q ≈ 1000 ± 300,与当天价格相对极差的相关约 0.8;把价格乘 3 或把波动放大 10 倍都不改变它(无量纲);往路径里加分钟噪声(买卖价差弹跳)它下降(噪声 0.4% / 分钟时约 390);叠加 3% 的单边趋势它上升(约 1460);常数路径(一字板、半天停牌)给 0。所以 Q 是「日内低频摆动 / 分钟噪声」的比值(方差比、价格发现的信噪比),不是波动率,也不是价格水平。
      批里的现象:共性表里含 day_q_stat_std(Vwap) 的 7 个候选均值差 +0.54(p 0.13),不含的 3 个更差。但在三个 head 里 Q 被 log(add(Q, ·))、乘 ts_hurst、再 log 压成一个很窄的带(按量级估计:log Q ≈ 7 ± 0.5,再取 log ≈ 1.9 ± 0.07;而 ts_hurst(尾盘量比, 20) 在 0.5–1 之间,相对波动约 ±14%),所以 head 的截面次序主要由 Hurst 决定(拆解表:去掉最外层 ×Hurst 因子,head 2 掉 0.49),head 的分数检验不了 Q 本身。库里读 Q 的方式只有水平类(ts_mean(log(add(Q, day_std(Vwap))), 50)、ts_quantile_q75、ts_std、裸 Q),没有一条读它「相对自己的常态」「与当天涨跌方向的关系」「在同价位 / 同流动性的票之间的相对位置」。
      本位的假设:如果 Q 里有 alpha,它不在水平(水平 = 流动性 + 价位档 + 波动状态,尺子会剥掉),而在三处。(a) 信息流的连续性:平滑、单边的日内路径(Q 高且方向一致)是机构分批建仓 / 信息缓慢扩散的指纹,对应 Hou-Moskowitz 的价格延迟溢价和 Da-Gurun-Warachka 的「连续信息动量」。(b) 相对自己常态的异常摆动 / 噪声比。(c) 同价位档(最小变动价位对分钟噪声的约束)、同流动性、同波动之后剩下的噪声比。
      算子怎样实现:每个种子原样带 day_q_stat_std(Vwap),外围一律换成快照里没出现过的读法(快照里围绕它的只有 log(add(·, day_std(·)))、乘 ts_hurst、ts_mean(50)、ts_argmin)。(1) 相对自己:cross_zscore(Q, 60);cross_ema(cross_zscore(Q, 120), 10);10 日均值减 120 日均值。(2) 与方向的关系:Q 乘 sign(当天日内收益)的 30 日均值;Q 的 z 分数乘近 20 日方向的符号;Q 与当天收益、前一日 Q 与当天收益的 60 日滚动相关(个股自己的「平滑日是否伴随上涨」的性质,与水平正交)。(3) 控制相关维度后的残差:cs_bucket_zscore 在名义股价十档(sub(LogFloatCap, LogFloatShares) 即 log 名义价)和已知成交额族十档内;cs_regres 先对分钟收益波动、再对流通市值取截面残差;cs_regres 对「价格不变分钟占比」day_flat_ratio(Vwap)(停滞度)取残差,留下的是趋势而不是停滞。(4) 稳定性:40 日标准差、与前一日 Q 的 40 日相关、下四分位尾均值。(5) 与成交量路径的同步:Q(Vwap) 的 z 分数减 Q(Volume) 的 z 分数、两条 Q 的 60 日滚动相关(价格路径持续而成交路径也成团 = 订单流在分批执行)。水平类的种子一个都没放。
      为什么和已有的不同:我用库里 5583 条的算子骨架(research/prod_W02L/struct/members.csv)逐个核对了这 16 个种子,骨架都不在库里。种子与三个 head 的关系是「同一个子树、不同的外围」,而 head 的次序由 Hurst 决定,预计日度秩相关低;多数种子去掉了水平,预计与 5 个控制的 |ρ| 也低。
      为什么样本外还会在:信息扩散速度与参与者类型(机构分批 vs 散户噪声交易)是个股的慢变性质,种子都在 30–120 日窗口上读,换手低;方向类依赖「连续信息」这一行为偏差,不依赖某一段行情。风险:Q 与当天涨跌幅度有关,方向类种子会带进一点 20 日反转(控制之一),预计中度相关(≤ 0.5),尺子会剥掉线性部分。
      数学检查:一字板 / 停牌日 Q = 0(常数路径,算子里分母下限 1e-4,自相关记 0),不是 NaN,所以平均类种子会把涨跌停频率混进来;本位大部分种子是 z 分数、相关、分桶、残差,对这类零值不敏感(cross_zscore 对常数窗口记 0)。种子里没有 log(Q) 或除以 Q。ts_delay 取前一个交易日,停牌则为 NaN。cross_corr 窗口里有效对数很少时(新上市、刚复牌)给 0 或 ±1,只影响头几天。cs_bucket_zscore 分母带 EPS,桶内至少 2 只才有值。day_flat_ratio 有界 [0, 1]。无前视:Q 只用 t 日收盘前的分钟,t+1 才交易。窗口 ≤ 120,热身期不主导。
