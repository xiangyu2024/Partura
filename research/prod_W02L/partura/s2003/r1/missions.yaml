  - head: 'ts_mean(mul(log(add(mul(log(add(day_q_stat_std(Vwap), day_std(Vwap))), ts_hurst(div(day_last(Volume), day_max(Low)), 20)), day_std(Vwap))), ts_hurst(div(day_last(Volume), day_max(Low)), 20)), 50)'
    why: |-
      三个部件有拆解表依据。(1) 内层 add(·, day_std(Vwap)):去掉它从 −1.49 升到 −1.06(增益 +0.43,本批最大的单项增益);它是价格单位的量(按后复权价估计,从 0.01 量级到几十),加在 log 之后、乘 Hurst 之前,实际只起「防 log(0)」的作用,去掉它本位记为 ΔA。(2) 外层窗口 50:25 日 −1.24(+0.25),100 日 −1.77,单调说明越短越好,所以把 ΔA 与短窗口叠加(25 / 15 日)。(3) Hurst 窗口:head 1 的内层用 40,本位试把两处都换成 40。另外三个变体用来分辨「Q 到底有没有贡献」:去掉 day_std(Vwap)(只留 log Q)、去掉外层 log 和加法结构(只剩 log(add(Q, S)) × H)、只剩 ts_mean(H, 25)。三个变体的差就是 Q 的边际贡献。数学上:一字板日 Q = 0,所以 log(day_q_stat_std(Vwap)) 在这些日是 NaN(不是 −inf),变体 4 因此覆盖率略低,其余变体保持 add(·, day_std(Vwap)) 的保护;ts_hurst 对窗口内缺失日的行为与原 head 完全相同(窗口内常数给 NaN,缺失日在最早一天 → NaN,第二早一天 → −inf,其余只用缺失之前的前缀)。
