- type: N
  hypothesis: 新 idea:burstiness 的「形状」不止 B 一种。第 1 轮的真 head 用相对离散度 B = var/mean^2 作回归元,拆解显示承重的是无量纲性与滞后(拿掉分母
    -0.69,拿掉滞后 -0.28)。B 只是二阶矩,同一个「成交一阵一阵」的现象还有别的无量纲读法:日内成交额的基尼系数 day_gini(A)(集中度,对尾部不敏感,与
    B 不同)、上尾期望损失比 day_es_ratio_hi(A)(最大一撮分钟占总额的份额)、成交额的时间质心 day_centroid(A)(成交集中在开盘还是尾盘,B
    完全读不到的一维:时间位置)、成交量(Volume)的 B(不含价格,与 Amt 的 B 之差 = 价格与数量的联合离散)。把它们放进与 head 同样的结构(昨日形状指标与今日成交额离散水平或当日收益的
    120~241 日个股相关、斜率、t 值),检验 head 的 alpha 是「脉冲度」这个一般现象还是 B 这个具体二阶矩。算子实现:A = replace_small_with_nan(Amt)
    只保留有成交的分钟;day_gini / day_es_ratio_hi / day_centroid 是 ops_ext 里的日内算子,输出每只票每天一个值;cross_delay(·,1)
    严格滞后一天;cross_corr / cross_regbeta / cross_reg_tvalue 是沿日轴的个股滚动统计。为什么与库里不同:两库里没有用
    day_gini / day_es_ratio_hi / day_centroid 度量成交额形状再取滞后相关的组合,B 的同族只有 day_var / day_mean
    的比值;与 head 的差别是度量的形状不同,而不是换写法(基尼与 CV 通常相关 0.5~0.8,时间质心与 B 近似独立)。为什么样本外还会在:成交的形状是参与者结构(机构拆单、散户集中在开盘或尾盘)的持久特征,慢变;head
    的 train / valid 同号提供了同类机制的证据。种子 5、6、14 含 Volume 的 B,用来分离价格项。风险:形状指标彼此共线,若 head
    的价值只来自 B 的特殊二阶矩,这批会在 -1 以下。
