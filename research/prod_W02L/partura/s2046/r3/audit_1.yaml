    reasons: '划掉的 9 个种子都是与快照 head 的日度秩 |ρ| ≥ 0.7 的换皮,按 §3 自动规则与「重复」划掉。1、13、16 与含该核心的 head(对 day_var(Ret) 的 240 日相关)|ρ| 为 0.99,分别只是换成 cross_reg_tvalue 的 241 窗、ts_mean 10 日平滑、cs_regres 对 log 成交额均值去截面;2、3、11 是 cross_regbeta / cross_corr 换 log(day_var(Ret)) 或 day_mean(Volume),|ρ| 0.74–0.88;4(High-Low 振幅)0.83;10(day_mean(abs_(Ret)))0.91;5 为 cross_cov 与 B 族 head 0.71,缩放后同一个秩。留下 7 个(6,7,8,9,12,14,15),与 head 的 |ρ| 为 0.13–0.52,与 5 个控制的 |ρ| 均小于 0.2,过了剩 ≥4 的门槛。核心 cross_delay(log(day_gini(rsn(Amt))),1) 与 liq 0.64、known 0.58、size 0.45、vol 0.03、rev 0.02,均 < 0.8,过了 E 位的核心门槛。数学核对:cross_delay(·,1) 严格取过去值(dt_cross.py:150-156);cross_corr / cross_regbeta / cross_reg_tvalue 是沿日轴的滚动统计(rolling_pair_reduce、rolling_ols,common.py);cs_regres 为当日截面残差;cross_zscore(·,120) 只用个股自己的 120 日窗口(ops_ext.py:208-220);cross_delta(x,1) = x[t]-x[t-1](dt_cross.py:174-180)。day_gini 在 tot=0 时记 NaN(ops_ext.py:136-152),log 在 |x|≤1e-9 时记缺失(common.py:211-212),核心的 Gini 值域为 (0,1),都不会触发 -inf 或爆点。注意:seed 6 与 seed 15 的回归元 day_var(rsn(Amt)) 是价格量纲的水平(seed 6 未取 log),Pearson 相关会被少数竞价脉冲日主导,PI 的 notebook 应当把它与 seed 15 的 log 版分开看,但这不是数学问题,不划。创新度给 3 而非 4 的理由:核心 cross_delay(log(day_gini(rsn(Amt))),1) 已是快照 head 的子树(包括 240 日对 day_var(Ret) 的相关 head),本流收获最多的就是这一个族;留下的 7 个种子只换了响应量与统计量(收益偏度、log 成交额方差的日差、120 减 480 快慢差、120 日 z 分数、gini 自相关、截面残差),与 head 的 |ρ| 都明显低于 0.7,不是同一个东西,所以不是 1–2 分。合理度给 4:成交集中度是参与者结构(拆单机构 vs 题材散户)的慢变特征,240 日窗口换手低,机制清楚。如果它有 alpha,最可能来自:同一个个股的成交集中度在 240 日尺度上的持续性或它与收益 / 波动的耦合慢变,与行情方向无关,而不是某个具体写法。'
