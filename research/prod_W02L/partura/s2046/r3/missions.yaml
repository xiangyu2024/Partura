    hypothesis: '新 idea:本流前两轮的 head(8 个,+0.58 ~ +1.28)全是「昨日成交额的形状(B 或 Gini)与今日成交额 / 价格的离散水平在个股 240 日里的相关」,形状指标始终来自成交额这一条序列。本位把「脉冲度」从成交额搬到价格路径与它们的联动:(i)价格脉冲度:abs_(Ret) 是每分钟绝对收益,其日内 Gini 与上尾份额读「波动是否集中在少数几分钟(跳跃式)」而不是均匀的噪声,是成交额形状在价格侧的对应物,库里没有;(ii)量价脉冲错配:成交额集中度减去绝对收益集中度,读「成交的一阵一阵是否伴随价格的一阵一阵」(信息型成交 vs 机械型成交);(iii)时间位置对齐:绝对收益的时间质心与成交额的时间质心的 240 日相关,读成交与价格行动是否发生在同一时段;(iv)分钟级价格冲击 Amihud:日内 mean(|Ret| / Amt)(Amt 用 replace_small_with_nan 处理,避免除以近零)是单位成交额的价格冲击,取 log 并滞后一天后与成交额离散水平 / 收益波动做 240 日相关与斜率。机制:个股自己的价格冲击与成交脉冲的联动是持久的微观结构特征(做市深度、参与者结构),与行情方向无关;算子实现:day_gini / day_es_ratio_hi / day_centroid 是日内算子输出每票每天一个值,cross_delay(·,1) 严格滞后,cross_corr / cross_regbeta / cross_reg_tvalue 是沿日轴的个股滚动统计,窗口 240 / 241 换手低。为什么与库里不同:两库与已有 head 的形状指标都来自 Amt,没有 abs_(Ret) 的 Gini / 上尾份额 / 质心,也没有 |Ret| / Amt 的日内 Amihud;与已知族 cross_mean(day_std(Amt), 30) 不同:这里是无量纲形状与相关,不是水平。为什么样本外还会在:价格脉冲度与冲击成本由市场结构决定、数月不变;同源的成交额 Gini 版 head train / valid 同号。风险:abs_(Ret) 的零回报分钟很多,Gini 的估计受最小报价变动影响,与低价股 / 流动性共线;240 日相关估计噪声大;Amihud 里 div 近零造成爆点(已用 replace_small_with_nan 保护但仍可能有极端值,取 log 压缩)。'
