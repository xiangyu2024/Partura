    hypothesis: '机制:本流第 2 轮 N 位的 head 里,承重的是「昨日成交额的集中度(日内 Gini)与今日某个活跃度 / 波动变量在个股自己 240 日里的相关」,例如 cross_corr(cross_delay(log(day_gini(rsn(Amt))),1), day_var(Ret), 240)(+0.60)与 cross_corr(cross_delay(log(cross_delay(log(day_gini(Amt)),1)),1), day_var(rsn(Amt)), 240)(+1.06,train +1.25 / valid +1.06);拆解显示拿掉里面的任一层 log / 滞后都还在 +1.1 ~ +1.4,说明承重的是 Gini 本身与慢窗口,不是某个具体写法。day_gini 是日内有成交分钟上成交额的集中度(越高越是少数几分钟占去大部分成交额),不含成交额水平。核心固定为 cross_delay(log(day_gini(rsn(Amt))),1),本位外围全部换掉:此前见过的外围只有 cross_corr(核心, day_var(Amt / Ret / High) 或 day_gini, 120 / 240 / 480) 这一个形态。本位改成(i)别的统计量:cross_reg_tvalue / cross_regbeta / cross_cov 代替相关系数(t 值把相关乘上样本量与噪声,回归斜率保留响应幅度);(ii)别的响应量:成交量均值 day_mean(Volume)、日内振幅 (最高 - 最低) / 均价、绝对收益均值、分钟收益偏度、log day_var(Amt) 的日变化,即「集中度领先于哪一类活动」;(iii)对相关本身再处理:120 日减 480 日的快慢差(相关结构正在加强还是减弱)、相关的 120 日 z 分数(惊奇)、把收益耦合对成交额耦合取截面残差(只留下集中度与价格波动的耦合中不能由与成交额的耦合解释的部分)、10 日均值平滑、对 log 成交额均值做截面残差;(iv)持续性:集中度与自己 5 日前集中度的 240 日相关。实现:cross_* 是逐只股票沿日轴的滚动统计;cross_delay(·,1) 严格取过去值;cs_regres 是当日截面回归残差;replace_small_with_nan 保证 Gini 只在有成交的分钟上算。为什么与库里不同:两库里的成交额族是 day_var(Amt) / day_mean(Amt) 的水平聚合、ts_ 窗口与 cross_cov 的原始量纲,没有无量纲集中度与慢窗口滚动统计的组合;与现 head 的差别是统计量与响应量不同(t 值 / 斜率 / 快慢差 / 对残差),而不是换写法。为什么样本外还会在:成交集中度是参与者结构(拆单机构 vs 题材散户)的慢变特征,与行情方向无关;240 日窗口换手低,15 bp 成本吃得少;尺子已经去掉了成交额水平、流动性、波动、反转、市值与两个冠军的线性与非线性暴露;train / valid 同号(同核心 head +1.25 / +1.06)。主要风险:240 日相关的估计误差与截面离散度相当;同核心 head 已有 4 个,库禁令(日度秩相关 ≥ 0.7)会挡掉相当一部分种子,所以外围要尽量远离 cross_corr(·, day_var(·), 240)。'
