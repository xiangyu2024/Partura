- type: E
  core: day_var(Low)
  hypothesis: '事实(快照,只用 train / valid):核心 day_var(Low) = 一天里 241 根分钟最低价(后复权价)的方差。(1)
    共性表里它是均值差最大的子树:含它的 9 条候选均值 -1.98,不含 -2.43(+0.44,p 0.12)。(2) head 3 里 Low 换 High
    分数几乎不变(-1.12 -> -1.18);库里 day_var(Low / High / Close / Vwap) 的训练段 rank IC(-0.0294
    ~ -0.0297)和日换手(0.32 ~ 0.33)几乎逐位相同,所以它读的是价格路径的离散度,不是 Low 这个字段。(3) 它单独做因子是 -2.27(train
    -1.53 / valid -2.27),水平读法在新尺子下是死的;head 2 里 cov 子树(含它)却是整批最稳的一块:-0.94 / -0.91(train
    / valid 几乎一样)。


    我的读法:day_var(Low) ≈ P² x V,P 是后复权价格水平,V 是日内价格路径的相对离散度(日内趋势幅度的平方加噪声)。截面上 P 跨好几个数量级,所以截面秩
    ≈ 价格水平(同波别的流已读到价格水平没有残差 alpha,我不押这个);但同一只票逐日变化的几乎全是 V(P 一天只动几个百分点,V 的日间波动是数量级的;这是由定义推出来的读法,没有用读数核对)。因此核心先取
    log、再做 60 日 z 分数 S = cross_zscore(log(day_var(Low)), 60):价格水平整个消掉,剩下「今天日内价格路径比这只票平时更有方向
    / 更不规则」的惊奇。本位押 S 和核心的三种用法,都是慢变的、个股自己的耦合系数,不是水平:

    (a) 响应系数(种子 1-5、15):个股自己 120 / 241 日里,当日收益 day_sum(Ret) 对昨日 S 的 cross_regbeta
    / cross_corr / cross_reg_tvalue(种子 3 的收益去掉全市场均值 cs_demean;种子 4、5 把 S 乘上昨日收益符号
    sign(day_sum(Ret)),区分「上涨日的强趋势」与「下跌日的强趋势」)。机制:强趋势日之后是继续还是回吐,取决于这只票的成交里价格冲击型(流动性需求)与信息型的占比,这是个股特征,在个股内持续数月(Campbell-Grossman-Wang
    1993、Llorente 等 2002 对成交量 - 收益关系的同类结论),不随某段行情的方向。同一波里种子 2013 第 1 轮 N 位的 4 个 head(+0.76
    ~ +1.04,train / valid 同号)是「当日收益对滞后成交活跃度的 120 日 cross_regbeta」,说明这一类统计量在这把尺子下被奖励;那一族(别的流已提交的计划)的回归元用的是成交量
    / 成交额 / 日内 DW / 成交 AR(1) / Gini,我没有看到有人用价格路径的惊奇。种子 15 是带价格尺度的对照(回归元不做 z 分数、不去水平):若它好于种子
    1,说明量纲因子而不是耦合方向承重。

    (b) 耦合与持续性(种子 6-10):S 的 1 阶自相关(120 日,种子 6);log day_var(Low) 与 log day_var(Amt)
    的 120 日相关(同日、滞后 1 日,种子 7、8);与 log day_var(Ret) 的 120 日相关、241 日斜率(种子 9、10)。无量纲,读的是价格路径的离散度由成交活跃度
    / 波动推动,还是自己漂移(trend 对 noise 的比例;混合分布假说,Clark 1973、Tauchen-Pitts 1983)。

    (c) 去量纲的 head 2(种子 11、12):head 2 的 cov 子树 cross_cov(ts_max(day_last(Amt), 20),
    day_var(Low), 241) = sigma_A x sigma_V x rho,尺度主导;种子 11 取相关系数 rho,种子 12 只除掉价格尺度
    sigma_V、留下 sigma_A x rho。回答「稳定的 -0.9 里 rho 占多少」。

    (d) 慢制度差与一个排除筛(种子 13、14):13 = 20 日均 log day_var(Low) 减 241 日均(价格路径离散度的制度变化,含 (P20
    / P241)^2 的价格位置);14 = 把种子 2 的排名里 day_var(Low) 最高 5%(后复权价最高的一小撮票)沉到底部(cs_last_high05),这是
    W01 以来的筛子写法,用核心本身做筛选变量。


    为什么和快照里已见的写法不同:含该核心的已见写法只有 (i) head 2 的 ts_max(cross_cov(·, ·, 241), 20)、(ii)
    head 3 的 ts_min(ts_reg_fvalue(day_std(High), ts_std(pow_2_5(·), 20), 20), 5)、(iii)
    库里把价格离散度当被解释变量的 cross_regbeta(活跃度, day_var(Low), 241)。本位的外围:取 log 再 z 分数去水平、响应变量是下一段的收益
    / 另一个离散度的对数、窗口 120、用相关系数 / t 值而不是原始协方差、sign 交互。15 个种子的算子骨架逐条与两库 5583 条的骨架核对过(抽掉字段
    / 常数 / 窗口),没有一条在库里;15 个种子共 14 种骨架(种子 7 与 9 只差一个字段)。


    为什么样本外还会在:来源是个股的参与者结构(价格冲击型成交 vs 信息型成交)这类慢变特征,窗口 120 ~ 241 日,半衰期由流水线按 train 定,换手低(这把尺子下慢是决定性的);不靠某一段行情的方向。最可能的失败:120
    日相关系数的估计误差(约 0.09)与截面真实离散度相当,名次近似随机,换手把 15 bp 吃满;S 与波动 / 20 日反转控制相关(尺子只去掉线性 /
    平方 / 立方,去不掉交互)。


    数学检查:log 的输入 day_var(Low) 是价格平方量纲,一个 tick 的日子也有 1e-7 以上,只有价格一整天不动(锁死涨跌停 / 近冻结,方差为
    0)的日子被 log 记缺失、不填充;day_var(Ret) 约 1e-7 ~ 1e-4,只有近乎冻结的日子(< 1e-9)同样记缺失;cross_zscore
    窗口接近常数时记 0,不爆;回归元滞后 1 日、响应是当日收益,两者在当日收盘时都已知,标签是下一日开盘之后,无前视;不用 ts_rank / cross_rank,不触发
    nanrank_last 的停牌记 0;cross_* 不满窗时是扩张窗口,热身期由流水线裁掉;回归元是 z 分数(方差约 1),不会被 cross_regbeta
    的方差阈值吃掉。'
