- type: N
  hypothesis: '机制:head 1 ts_sum(day_var(Amt), W) 的窗口读数:W = 25 / 50 / 100 是 -3.10 /
    -0.60 / -0.28(valid +0.24),越慢越好;Amt 换 Volume 掉到 -1.13。day_var(Amt) = 成交额水平² x
    B,B = var / mean² 是日内成交额的相对离散度(burstiness,一阵一阵的程度)。水平那一半就是已知成交额族 cross_mean(day_std(Amt),
    30) 的近亲,尺子已经去掉;累计 100 日比累计 25 日好,说明承重的是「这只票日内成交多脉冲」这个持久特征 B(参与者结构:机构拆单的平滑成交 vs
    散户 / 题材的脉冲式成交),而不是当天的水平。本位直接读 B 的无量纲形式,并把它放进「慢的、个股自己的耦合系数」这一类:同波里种子 2013 第 1 轮
    N 位的 4 个 head(+0.76 ~ +1.04,train / valid 同号)就是当日收益对滞后成交活跃度的 120 日 cross_regbeta,这类统计量在这把尺子下被奖励。


    实现:B = div(day_var(replace_small_with_nan(Amt)), pow_2(day_mean(replace_small_with_nan(Amt)))):replace_small_with_nan
    把无成交的分钟(Amt = 0)置空,只在有成交的分钟上算,既去掉成交额水平,又去掉「有成交的分钟占比」(那是另一个流动性量)。S_B = cross_zscore(log(B),
    60) 是「今天比这只票平时更脉冲」的惊奇,与水平无关。16 个种子分四组:

    (a) 响应系数(种子 1-4、6):当日收益 day_sum(Ret) 对昨日 S_B 的 120 日 cross_regbeta / cross_corr
    / cross_reg_tvalue(种子 3 去全市场均值 cs_demean),241 日相关(种子 4),S_B 乘昨日收益符号的版本(种子 6,区分「上涨日的脉冲」与「下跌日的脉冲」)。种子
    5 把回归元换成含水平的 log day_var(Amt) 惊奇作对照(水平惊奇别的流已用过,放进来只问「去掉水平后还剩多少」)。

    (b) 波动惊奇的响应(种子 7、8):昨日 log day_var(Ret) 的 z 分数对当日收益(波动与风险补偿 / 杠杆效应的个股系数)。

    (c) 成交脉冲与波动的耦合(种子 9-12):log B 与 log day_var(Ret) 的 120 日同日相关、241 日斜率、两个方向的滞后 1
    日相关(波动之后成交变脉冲,还是脉冲之后波动放大):混合分布假说(Clark 1973、Tauchen-Pitts 1983)的个股耦合强度。

    (d) 持续性与制度(种子 13-16):S_B 的 1 阶自相关(120 日);20 日均 log B 减 241 日均;241 日均 log B 的含零分钟版本(当对照,看「有成交的分钟占比」是否承重);种子
    16 = cross_regbeta(cross_delay(day_var(Amt), 1), day_sum(Ret), 120),回归元带成交额水平,是诊断:2013
    的 head 里回归元带水平、斜率里有 1/sigma_x 的量纲因子,若 16 好于 1-4,说明量纲而不是耦合方向承重,下一轮回到带水平的写法。


    为什么和库里不同:库里与 head 1 同族的成员(同批 44 条)是 ts_sum / cross_* 对 day_var(·) 的水平聚合,或 cross_cov
    / cross_regbeta 把两个原始量纲的离散度耦合起来(如 ts_sum(cross_cov(day_var(Ret), day_quantile(High),
    15), 50)、ts_max(log(cross_regbeta(log(day_quantile_q75(Ret)), day_var(Low), 241)),
    20))。本位:(i) 回归元先去水平、再取 z 分数(无量纲);(ii) 响应是收益 / 波动,不是另一个原始离散度;(iii) 窗口 120 ~ 241;(iv)
    用 replace_small_with_nan 只在有成交的分钟上算 B。16 个种子共 14 种骨架(种子 2 与 4 只差窗口、5 与 7 只差字段),逐条与两库
    5583 条的骨架核对过(抽掉字段 / 常数 / 窗口),没有一条在库里。


    为什么样本外还会在:burstiness 与成交 - 波动 - 收益的耦合强度是参与者结构的慢变特征(数月不变),不靠行情方向;半衰期由流水线按 train
    定;窗口 120 ~ 241 日,换手低。最可能的失败:120 日相关的估计误差与截面离散度相当,名次近似随机;B 在薄成交的票上与流动性控制仍有共线(有成交分钟少
    → B 估计噪声大)。


    数学检查:B 的分母是有成交分钟的均值平方(> 0),分子只有当天有成交的分钟 >= 2 根时才有值,否则缺失、不填充;log(B) 在 B <= 1e-9
    时记缺失(即完全等额的成交日,罕见);log day_var(Ret) 只有近乎冻结的日子(< 1e-9)记缺失;cross_zscore 窗口接近常数时记
    0;回归元滞后 1 日、响应是当日收益,收盘时都已知,无前视;没有 ts_rank / cross_rank,不触发 nanrank_last;cross_*
    不满窗时是扩张窗口,热身期被裁掉;回归元是 z 分数,不会被 cross_regbeta 的方差阈值吃掉。'
