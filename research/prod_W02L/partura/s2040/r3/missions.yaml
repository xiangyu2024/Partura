- type: N
  hypothesis: '新想法:「成交量在价位上的相位」Z = (Vwap 型均价 - 时间均价) / 日内价格标准差,即 `div(sub(day_wmean(Close, Volume), day_mean(Close)), add(day_std(Close), 0.001))`。day_wmean(Close, Volume) 是当天成交量加权的平均价,day_mean(Close) 是每分钟等权的平均价;两者之差 > 0 说明当天的成交量集中在价格较高的那一段(放量时价格在高位,典型是拉升放量 / 追涨),< 0 说明成交量集中在低位(逢低被承接、杀跌放量被接盘);除以当天价格的标准差把它变成''相对当天价格路径''的无量纲读数(落在约 [-1, 1] 里),底 0.001 防止一字板 / 零波动日除以近零(那种日分子也为 0,读数为 0)。它和库里的区别:库里的 head 全是对数量 / 额的水平读数(day_mean(log(Volume)) 等)、日内价格路径的占比类读数(B120 的标签占比),以及量价协方差(day_cov(Ret, log(Amt)));Z 是''成交量与价位的相位'',同一个价格路径上换一种成交量的分布,Z 就变了,而水平量和占比类读数都不变;控制里没有这一维(控制只有流动性水平、波动、反转、已知族、市值,不含价量相位)。本批拆解里 Close→Vwap 在 4 条 head 中 3 条显著变好(valid 尤其),说明''成交量加权价''比''收盘价''读到了更干净的东西,这里把它直接作为被研究的量。前视检查:只用当天已收盘的分钟,信号在收盘后算出;全部滚动窗口都在过去。


    种子分五类:(a) 慢水平:60 / 120 日均值、EMA 60(日度读数噪声大,A 股的''谁长期在高位放量''才是持有人结构的慢变属性),20 日均减 241 日均;(b) 相对同伴:在日内波动十分位内去均值、在流通市值十分位内标准化(两个都是控制的主要暴露来源,桶内相对值把它们压掉),同伴去均值后再取慢均值;(c) 时间形状:一阶自相关(241)、60 日标准差、秩的 20 日均值;(d) 对条件的反应:昨天的 Z 对今天收益的 120 日回归斜率(滞后一天,没有前视)—— 放量追高后第二天是回吐还是延续;只在成交额高于自己 20 日均值的日子计数的 Z(放量日的相位才有信息);(e) 近亲读数:收盘价相对当天成交量加权价的位置 `(收盘 - VWAP)/σ`(尾盘是在成本之上还是之下,即当天持有人的浮盈 / 浮亏),Z 与它的秩差,以及成交额加权版本(用 Amt 当权重,更偏向大额成交)。


    机制与为什么样本外还在:成交量加权价与时间均价的差,是''当天的成交是由谁、在什么价位上主导''的度量(机构拆单一般在均价附近并随价格摊开,散户追涨 / 恐慌杀跌的放量集中在价格极端处);A 股散户占比高、追涨杀跌的方向性强,日内''放量在高位''的个股倾向是慢变属性(题材股、热门股),其次日表现被后续的回吐 / 接盘所决定,这与流动性水平、波动、市值无关,所以样本外仍在。我对它能到 ≥ 0.5 的概率不高(约 8%),最大的风险是 Z 与日内收益 / 20 日反转控制过度重叠(收盘 > 均价的日子一般当天收益为正),所以种子偏向桶内、滞后一天和慢均值的写法。'
