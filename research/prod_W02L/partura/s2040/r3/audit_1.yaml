    reasons: '自动划掉:#10 cross_zscore(核心,241) 的 20 日均值(原始 |rho| 0.81,最像的 head 是 day_mean(cross_decay_linear(核心,20)),即 -1.38 那条);#11 sub(核心 20 日均, 核心 241 日均)(原始 0.80,同一个 head)。两者 >= 0.7,按规则划掉。其余 14 个种子原始 |rho| 最大 0.54(#12 cross_ema(核心,60)),残差最大 0.64(#12);对五个控制的 |rho| 最大 0.27(#13 对 size)。核心 A = day_mean(select_where(eq(in_roll_labels(Close,241),4),...)) 原样是 -3.14 那条 head 的子树,对 liq 0.01 / vol 0.02 / rev 0.07 / known 0.00 / size 0.02,E 核心闸门满足。创新度 3:核心本身是快照里已有的同一个对象(日内上尾占比,-1.38、-3.14、-3.20 三条 head 都是它或它的变体);新的是读法:#1 一阶自相关、#5 #6 滞后一天的回归与相关、#7 Hurst、#13 成交量加权的上尾占比、#16 高波动日条件、#15 水平秩乘离散秩,这些对 head 的原始 |rho| 都在 0.05 以下或是新结构;但 #2 #3 #4 #8 #9 #12 #14 仍是同一序列的平滑或去控制换皮,所以给 3,不给 4。备注:相关度表里标「废品」的(核心、#7、#9、#16)是流水线标签,我没能从代码确认它的判据,审计不以它为据。合理度 4:逐个核对。in_roll_labels(...,241) 因窗口等于整日而走全日统计量(legacy_specialized_dt.py:531),但信号是收盘后的日度聚合,不跨日、不用后面的天,不属于 §4 的前视。cross_* 为尾随窗口(rolling_windows);cross_hurst 在 S<1e-9 时记缺失,无除零;cross_regbeta(x,y) 按 rolling_ols 定义是 y 对 x 的斜率,即滞后上尾占比对当日收益的斜率,方向与 PI 写的「次日收益对昨日占比」相反,但仍是可解释的反应系数,不构成问题;#13 的 day_wmean 在总权重为 0 时返回缺失而非爆点;#14 的分母 add(下段占比, 0.01) 有下限。停牌日核心为 0(标签无效计入分母),对 60/120 日均值会把停牌多的票略推低,但核心对流动性控制的 |rho| 只有 0.01,不是主导效应,不算定义坏掉。如果它有 alpha,最可能来自:个股日内冲高并停留的持续性(拉升、尾盘抢筹的个股倾向)以及其次日的回吐。'
  - slot: b
    novelty: 4
