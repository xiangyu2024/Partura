  why: head 是「日内收益(收盘 / 开盘 − 1)× 成交量跳变事件计数(相对前一有效分钟的对数量变化超过当日 ±1 个标准差的分钟数)」的 20 日均值,分数
    −2.28。拆解表给了两条线索:窗口 20 → 40 变好 0.85(−1.43),说明 20 日太快,换手吃掉了毛收益;日内收益这一项的击倒是 −1.56
    / valid −0.33(必要性 −0.72),即收益项本身有一定贡献、事件计数项拖后腿。第 1 轮 R 位显示单纯加慢水平读数不行(多数 −1.5 以下),所以这里不只是加窗口:变体组合是
    (a) 窗口 60 / 120;(b) 把收益取符号(去掉收益大小的重尾,只留方向 × 事件强度);(c) 把事件计数转成截面秩,去掉计数的量纲和重尾;(d)
    收益与计数各取秩再相乘(两个去均值的有界信号相乘);(e) 在日内成交额水平十分位里去均值(去掉流动性这个已被控制的暴露)。依据是拆解里 `sub(div(day_last(Close),
    day_first(Open)), 1)` 与事件计数的必要性符号相反,说明烂的是量纲不匹配 / 重尾,不是核心思路。
