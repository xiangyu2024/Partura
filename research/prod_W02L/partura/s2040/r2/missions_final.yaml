- type: N
  hypothesis: '新想法:「成交量节奏」VT = `day_std(in_logchg(Volume, 1))`,即当天相邻分钟成交量对数变化的标准差(成交量自己的波动,而不是价格的波动,`in_logchg`
    对涨跌对称,不会像 in_pct 那样被倍数跳升的右尾支配;成交量为零的分钟记缺失)。它度量的是成交是平稳持续的(机构拆单、做市)还是脉冲式的(散户情绪、事件驱动、涨停板上的开关)。机制:同样的价格波动,成交量节奏越乱说明交易由非连续的、信息或情绪驱动的参与者主导,而且这种参与者结构是慢变的;把它相对「同样价格波动的同伴」去均值(`cs_bucket_demean(VT,
    day_std(Ret))`),就得到「在价格风险相同的股票里,谁的成交更脉冲」。


    怎样用算子实现:种子分三类。(a) 相对价格波动的去均值再慢聚合(cs_bucket_demean / cs_bucket_zscore 按价格波动或流通市值十分位)、秩差(成交量节奏秩减价格波动秩)再对自己历史标准化,120
    / 60 / 20 日均值;(b) 时间形状:与自己价格波动的 120 日相关与回归斜率(成交量节奏是否随价格波动同步,即成交是否「响应」价格)、120 日标准差、Hurst、20
    日对 241 日的加速度、一阶自相关;(c) 方向性的量价响应:`day_signed_ratio(in_logchg(Volume, 1), Ret)`
    = 绝对收益里发生在放量分钟的份额减去发生在缩量分钟的份额,在 [−1, 1] 内,衡量价格变动是不是在放量中完成(知情交易的特征),取 120 / 20
    日均值与同伴去均值版本。


    和库里的不同:库里的成交量读数是水平(day_mean / day_first 的 log Volume)、`in_forward_valid_part`
    的事件计数(B119,手写)、以及量价协方差 `day_cov(Ret, ·)`;成交量变化率的标准差、与价格波动的秩差、signed_ratio 的放量份额在两个库的
    5583 个骨架里都没有(我对照过 members.csv 的骨架,0 重合)。与已见的区别:第 1 轮 N 位的正分来自「同伴去均值的价格波动 + 慢的形状」,这里把被读的变量从价格波动换成成交量节奏,同一个思路迁到一个控制里没有的变量上(控制是流动性水平、波动水平、反转、已知成交额族、市值、两个冠军)。


    为什么样本外还在:成交结构是持有人结构的慢变属性;去均值 + 窗口 ≥ 60 日让日换手很低,15 bp 的成本不吃掉毛超额;相对价格波动去均值后与波动控制的暴露被压低。风险:VT
    与成交额水平相关(小票成交稀疏则脉冲多),可能仍与流动性控制有相关,但这类暴露被新尺子的三次多项式残差去掉。前视检查:全部用当天分钟数据与过去日度数据,没有未来信息;day_signed_ratio
    分母为零(整天无成交)记缺失;秩差、z 分数在窗口内标准差为零时记缺失,不出现除以近零的爆点(用秩与 cs_bucket_*,不用裸除法)。'
