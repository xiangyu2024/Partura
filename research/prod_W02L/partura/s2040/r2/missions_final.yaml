    −0.45 以下。所以有信息的是「相对同伴的波动」这个状态变量被读成「它自己时间序列的形状」,而不是它的水平均值。已见过的写法几乎全是 `cross_autocorr_s1(核心,
    241)`(一阶自相关)。


    本轮外围(16 个种子,核心都原样在内,全部不用一阶自相关,也不用已见过的 `cross_mean(… , 60)` 条件乘积):读它在时间上的其他形状。(a)
    水平和离散:120 日均值、120 日标准差(波动的波动)、绝对值的 120 日均值(「相对同伴有多不寻常」,取自 cs_bucket_demean 文档里建议的折叠);(b)
    持续性换成别的度量:Hurst 指数(241 日)、与 5 日前自己的 241 日相关(长滞后而不是滞后 1)、对自己 241 日历史取 z 分数 / 分位后做
    20 / 60 日均值;(c) 尾部与不对称:上 / 下半标准差之差、241 日上四分位尾部均值、波动峰值离现在多久(argmax);(d) 对外部变量的敏感度:对自己的收益的相关(杠杆效应:收益下跌时相对波动是否升高)、对全市场日度波动的回归斜率(压力敏感度)、与量价耦合
    `day_cov(Ret, log(Amt))` 的 120 日相关;(e) 趋势:20 日均值减 241 日均值、20 日与 120 日均值的回归残差、「水平秩
    × 离散秩」两个秩相乘。


    机制与为什么样本外还在:相对同伴的波动是持有人结构(散户占比高、涨跌停与打板资金)的慢变属性,同类股票里「躁」的一直躁;从它的时间形状读(持续、波动的波动、对压力的敏感度)而不是水平读,是因为水平被流动性
    / 波动 / 市值控制吃掉(第 1 轮 R 位的所有水平变体都在 −1.5 一带,印证了这点),而形状信息在控制里没有。和以前不同:不再套一阶自相关,换成
    Hurst、长滞后相关、尾部、回归斜率这些没有出现在已见候选里的度量。不押的:水平均值(看第 1 轮 R 结果,多半是控制的换写法)。前视检查:全部是对到当天为止的日度值做滚动窗口,没有未来信息;day_cov(Low,
    log(Amt)) 在成交额为零的分钟被记为缺失,桶内不足 2 只记缺失,不会产生爆点。'
