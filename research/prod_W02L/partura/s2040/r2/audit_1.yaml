    reasons: '位 a 为 E 深挖,核心 cs_bucket_demean(day_std(Ret), day_cov(Low, log(Amt))),这是共性表第一名(loc.md,均值差 +1.70,5 个候选)。核心定义核对:cs_bucket_demean(ops_ext.py:463)按 day_cov 十分位去均值、保留单位,桶内不足 2 只记缺失;day_cov(dt_day.py:216)有效点数 < 2 记缺失;无除以近零。相关度表(corr_1.md):核心与头的原始最大 |rho| = 0.34(ts_stddev 那个 head),残差 0.37;与控制 liq 0.04 / vol 0.68 / rev 0.29 / known 0.10 / size 0.16,均 < 0.8,E 核心检查通过。创新度 3:核心的波动成分与 vol 控制 0.68 相当高,真正新的是「同一量价协方差桶里的相对波动」,不是波动本身,所以不给 4。合理度 4:无前视,无定义问题。划掉 #9 cross_argmax(core,120):corr_1.json 中 gate=False、distinct=0.059,即 120 个取值要分给约 5000 只股票,截面绝大部分是并列,排序主要由列序决定。§4 允许的列序打破只适用于并列占少数的情形,这里并列占主导,属于数值伪影,划掉。其余放行:#3 cross_hurst 与 #6 semistd 差的覆盖率为 0.85 / 0.845(gate=False),来源是窗口内任一缺失即整窗 NaN,是选择偏差而不是缺失值填充主导结果,保留。#10 cross_mean(cross_rank(core,241),20) 碰到 §4 的 nanrank_last 已知行为:停牌日 core 为 NaN,cross_rank 返回 0,停牌票会被推到低端。这是真实陷阱,但对纯多头十分位的影响主要落在底部,并不主导顶部书,审计认为它不足以划掉,保留;PI 应在停牌日把输出还原为 NaN。#1 cross_mean(core,120) 与 vol 控制 0.73、#2 cross_stddev 与 vol 0.48:PI 笔记说不押水平均值,但计划里仍放了一个水平均值种子,这是计划内部不一致,不是数学问题,放行。如果它有 alpha,最可能来自:同类股票里相对波动的持续性与对市场压力的敏感度,即持有人结构的慢变属性;其次是 #8、#12、#13 的时间形状读数。'
