    soundness: 3
    reasons: '数学上可算,没有前视:in_forward_valid_part(dt_in.py:1036)是严格前向的 backward fill,只取当前分钟之前的有效值;in_mean_full / in_stddev_full 与 day_last(Close) 一样是当日数据,日界一致。定义上没有 §4 的问题。合理度给 3 而不是 4,原因在机制层面:阈值取的是当天自己的 mean 加减 1 个标准差,所以 up+down 的计数期望比例基本由分布形状决定(约 0.2 到 0.4 的分钟),跨日、跨股的变化很小;head 的主要变化来自 intraday 收益 乘 一个近似常数加一个形状项,「成交量跳变事件计数」这个名字高估了第二项的含义。拆解里收益项必要性为负(-0.72)也与此一致。PI 的变体(a)-(e)(窗口 60/120、取符号、计数取秩、收益与计数各取秩、桶内去均值)能检验这一点,计划合理,只是对机制的描述应改成「收益乘形状项」。'
