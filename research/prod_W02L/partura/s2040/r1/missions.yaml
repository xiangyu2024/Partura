- type: E
  core: day_cov(Ret, log(Amt))
  hypothesis: '核心 `day_cov(Ret, log(Amt))`(head 3 的第二项):当天各分钟的收益与对数成交额的协方差。`log` 是 log|x|,成交额 ≤ EPS 的分钟记缺失(不是 0),所以它只读有成交的分钟。放量分钟伴随上涨为正、伴随下跌为负,读的是「钱往哪个方向放量」。


    快照里的事实:拆解表里这一项单独是 train −3.10 / valid −1.84,但它与已知成交额族的 ρ 只有 −0.04,是本批所有部件里与已知族最不相关的。head 3 把它用 `add` 加在 `day_min(log(Amt))`(取值约 5~12)上,而它自己的量级只有 1e-4~1e-3,所以在那个 head 里它只起打破并列的作用,从来没有被真正读过。烂的是它的外围,不是核心:一天一个读数、没有归一化、没有平滑,日度读数的截面排名自相关很低,15 bp
    的成本全吃在换手上(这是推断,没有这一项自己的换手读数;同一批里 `day_first(log(Amt))` / `day_min(log(Amt))` 的原始日换手是 0.53 / 0.35)。


    机制:放量与收益同向的耦合是持有人结构的慢变属性,不是某一段行情。Llorente–Michaely–Saar–Wang (2002) 的结论是:信息交易主导的股票,量增加时收益延续(耦合为正);对冲 / 流动性交易主导的股票,量增加时收益回吐(耦合为负)。Chordia–Subrahmanyam (2004) 的订单失衡同理。这个划分用分钟数据可以直接读出来:耦合的符号 = 这只股票上钱是追着趋势放量(知情 / 追涨)还是逆着价格放量(提供流动性)。Campbell–Grossman–Wang
    (1993) 给了第二个来源:对冲型交易日的量使收益自相关为负。两者合起来的可交易含义是一个交互:近期涨幅 × 耦合符号。(耦合为正且近期上涨 → 继续;耦合为负且近期下跌 → 回吐上行;多头书只拿这两种组合的并集。)奖励的新尺子把控制的 1/2/3 次方都去掉了,两个去均值的秩相乘,在两者近似独立时对其中任一个的线性 / 平方 / 立方暴露约为零(我没有量过;耦合与 20 日收益的秩相关我预计 < 0.2),所以这类交互不会被尺子当成控制的非线性暴露去掉;它不是靠尺子的盲区,而是一个条件结构:多头书选的是「延续」与「回吐」两种情形的并集。


    外围怎么实现(16 个种子,核心都原样在内,全部按「慢」写,窗口 ≥ 60 日,除了 E5 / E6 / E11 里短的一端):

    (a) 慢聚合,三种记忆形状:均值 120 日(E1)、线性衰减 120 日(E2)、EMA 半衰期 60 日(E3)。

    (b) 去量纲:除以 σ_R·σ_logA 得日内相关系数(E4);除以 σ_R 得「对数量对价格变动的弹性」(E15,单位是 log 量)。

    (c) 相对自己:近 20 日均值对自己 241 日的 z 分数(E5);短均值减长均值(E6)。

    (d) 桶内:按流通市值十分位内 z 分数(E7),按 60 日对数成交额十分位内 z 分数(E8);这是把水平类控制里的非线性部分也拿掉,而不只是尺子里的立方。

    (e) 条件延续 / 回吐:两个截面去均值的秩相乘,耦合取 60 / 120 日均值 / 20 日 EMA,近期收益取 20 / 60 / 5 日对数收益(E9~E11);日度版本先相乘再取 60 日均值(E12);耦合乘以近 5 日涨跌符号再 60 日均值(E13)。

    (f) 日内先后与波动日:同日耦合减去「滞后 1 分钟的量与收益的协方差」(量跟着价还是量先于价,E14);只在当日波动高于自己 20 日均值的日子累加耦合(E16;消息日)。


    和库里已有的不同(我逐条翻了 `struct/members.csv`):库里读「分钟收益与量」耦合的有两类。手写库有 `cross_mean(day_corr(Ret, Volume), 20)` 与滞后 1 分钟的变体(L#480~484,皮尔逊相关、原始量、窗口 20 日);挖掘库有 55 条 `day_cov(Ret, ·)`,外面套 `ts_std` / `ts_max` 读它的波动或极值,少数读水平但窗口 ≤ 60(`ts_med(day_cov(Ret, Volume),
    40)`、`ts_mean(day_cov(Ret, Amt), 10)`)。库里没有的:(1) `log(Amt)` 口径(全库只有 head 3 这一条);(2) 窗口 ≥ 60 日读耦合的水平并按去量纲 / 弹性 / 桶内标准化;(3) 近期收益与耦合的去均值秩乘积(最接近的是手写库 L#262 的 `-rank(Δ3 收益) × ts_corr(day_first(Open), day_sum(Volume), 10)`,那里读的是开盘价与日成交量的 10 日时序相关、方向写死、没有去均值,不是分钟级的价量耦合);(4)
    `cross_zscore` / `cs_bucket_zscore`(这两个算子是 Partura 后加的,库里 0 次)。E14 的滞后一分钟耦合与库里 L#481 同一个想法,但那里窗口 20、读的是相关系数,这里是 120 日、对数量协方差的同日减滞后。我用 AlphaCube 的 `skeleton_key`(去窗口)把 16 个种子逐个对照了库的 5583 个骨架:0 个重合。本核心在快照里的唯一一次出现是 head 3 的 `add` 外围,上面所有外围都与它不同。


    样本外为什么还在:(1) 来源是持有人结构(知情 / 追涨对流动性提供),变化很慢,所以全用 ≥ 60 日窗口,日换手低,15 bp 吃不掉;(2) 条件交互的来源是已发表的结论(Llorente 等 2002),不是样本内拟合出来的形状;(3) 除 E16 里「当日波动高于自己 20 日均值」这个相对门槛外,没有绝对阈值 / 带宽,也没有「只在某个价位 / 市值档」的阶跃,所以不依赖尺子的盲区。


    数学检查:(a) 无前视:`day_cov` 只用当天分钟,收盘后可知,下一日交易;所有窗口是尾随窗口;`ts_delta(·, k)` 是 x[t] − x[t−k]。(b) 数值:`day_cov` 的量级 1e-5~1e-3,float32 下相对精度没有问题;所有除法的分母都加了 1e-6 的下限(σ_R 通常 ≥ 5e-4,所以下限不改变正常日的取值);Ret 全天为零的封板 / 停牌日分子为 0,得到 0 而不是 inf / NaN。本机用合成立方体(80 只股票
    × 320 日 × 241 分钟)把 16 个种子全算过:都能解析、无 inf、每日取值离散度 ≥ 0.95、覆盖率 0.78~0.98(带 60 日收益的几个因合成立方体只有 320 日而偏低,真实面板的热身期只占 3%)。(c) 定义:`log(Amt)` 在无成交分钟是缺失,因此 `day_cov` 只在有成交的分钟上算,至少 2 个有效分钟才有值;`cs_bucket_zscore` 的分桶按 x 的十分位。'
