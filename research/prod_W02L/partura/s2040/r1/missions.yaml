  - sub(day_mean(log(Amt)), mul(2, day_mean(log(Volume))))
  - sub(mul(0.5, day_mean(log(Amt))), mul(1.5, day_mean(log(Volume))))
  - sub(mul(2, day_mean(log(Amt))), mul(3, day_mean(log(Volume))))
  - sub(day_mean(log(Amt)), day_mean(log(Volume)))
  - cross_mean(sub(day_mean(log(Amt)), mul(2, day_mean(log(Volume)))), 120)
- head: add(day_min(log(Amt)), day_cov(Ret, log(Amt)))
  why: 烂的部件:`day_cov(Ret, log(Amt))`(拆解表:单独 train −3.10)。更准确地说是 `add` 的量纲:day_min(log Amt) 约 5~12,协方差 1e-4~1e-3,所以 head 实际等于 `day_min(log(Amt))`(单独 −1.59,和 head 一样),协方差只打破并列。变体:先各自取截面秩再相加,让两项权重相等(变体 1,日度)、再取 120 日均值(变体 2)、协方差秩减最小值秩(变体 3:耦合净掉流动性下沿);变体
    4 是 `day_min(log(Amt))` 的 241 日均值(只看最小值这一项慢下来多少)。`day_min(log(Amt))` 在有 1 手(100 股)成交的分钟里就是 log(100 × 价格),所以它一部分是价格水平、一部分是流动性下沿;这是我对它的 ρ_known −0.70 的解释。
