- type: N
  hypothesis: '机制:集合竞价与隔夜信息。立方体的分钟轴是 241 根,第 0 根是 09:30 的开盘集合竞价那一根(这一分钟 `Ret` ≡ 0、`Close` = `Open`,成交量极大;见 `research/coldstart_C03/design_r1.md`,C02 的 W2 已确认,2020 流的 PI 也据此切掉它)。所以 `day_first(log(Amt))`(本批 head 1,拆解里 valid −0.90 是本批 3 个 head 里最好的一个)读的是「开盘那一根的成交额」:它由隔夜累积的新闻与盘前挂单决定,而不是盘中的流动性。(注意
    `day_first` 取当天第一个有值的分钟,而 `log` 会把成交额为 0 的分钟变成缺失,所以开盘没有成交的票会退到它第一个有成交的分钟;这只发生在最不活跃的票上,而这些票本来就被流动性控制吃掉。)


    这个核心的问题:快照里的 head 1 是 −1.47 / −0.90,是一天一个读数(原始日换手 0.53),并且开盘这一根的成交额绝大部分是这只股票自己的活跃度水平(我估计与 log 成交额的截面相关 0.8 以上,没有数)。新尺子把活跃度去掉之后剩下的是我这里要读的东西:开盘这一根相对这只股票全天典型分钟的倍数,`OA = day_first(log(Amt)) − day_mean(log(Amt))`,无量纲、不随成交额水平单调变化。


    为什么 OA 可能有 alpha:(1) Berkman–Koch–Tuttle–Zhang (2012):散户的买单集中在开盘,开盘注意力强的票隔夜涨、盘中跌;Barber–Odean (2008):注意力驱动的买入造成价格压力、随后反转。(2) Lou–Polk–Skouras (2019):隔夜收益与日内收益各自有持续性、且来自不同的投资者(开盘拉锯),这个持续性是股票层面的慢变属性。(3) A 股的开盘集合竞价有涨跌幅限制,且散户盘前挂单占比高,所以开盘倍数是「谁在隔夜推价格」的一条较干净的读数(这是我的推断,没有数)。方向我不预设:GP
    用 train 定符号。


    算子怎样实现(13 个种子,全部是 ≥ 60 日的慢聚合或慢的关系,不碰日度噪声):

    (a) 慢水平:OA 的 60 日均值(N1)、241 日线性衰减(N2)、EMA 半衰期 60 日(N13);对自己 241 日的 z 分数再 60 日均值(N3,「开盘异常」);

    (b) 桶内:OA 的 120 日均值在流通市值十分位内标准化(N4);

    (c) 与隔夜 / 日内收益的耦合:OV = log(开盘价) − log(昨收),ID = log(收盘价) − log(开盘价)。开盘异常加权的隔夜漂移(N5、N6)、开盘异常加权的开盘后日内收益(N8,看开盘推高之后是延续还是回吐)、OA 与 OV 的 120 日相关(N7);

    (d) 稳定性:OA 的 120 日标准差(N9):习惯性大开盘与零星大开盘(消息日)可能对应两种持有人,这一条没有文献依据,是一个探针;

    (e) 线性占比与首尾对比:开盘一根占全天成交额的占比 120 日均值(N10,不取对数);开盘对数成交额减收盘最后一根(N11,开盘与尾盘「谁在交易」的对比;没有文献依据,是一个探针);

    (f) 条件:OA 的 60 日均值 × 60 日收益,两个去均值的秩相乘(N12;注意力 × 过去赢家)。


    和库里已有的不同(我逐条翻了 `struct/members.csv`):库里有 34 条把 `day_first` 作用在 Volume / Amt 上(B089 / B092 / B094 一带,例如 `cross_sum(day_first(Volume), 60)`、`ts_quantile_q75(ts_quantile_q75(day_first(Volume), 50), 40)`、`ts_kurt(day_first(Amt), 40)`),除 head
    1 自己外全部读的是开盘一根的水平或它的时序形状,没有一条把它除以全天的典型分钟(去掉活跃度水平),除 head 1 外没有一条用对数,我也没有看到把开盘量与价格(隔夜缺口 / 日内收益)配对的;价格那边,手写库有大量 WorldQuant 式的 `day_first(Open)` / `day_last(Close)` 缺口与日内收益(最接近的是 `ts_corr(day_first(Open), day_sum(Volume), 10)` 一类,配的是整日成交量,不是开盘一根)。`cross_zscore`
    / `cs_bucket_zscore` 库里 0 次。我用 `skeleton_key`(去窗口)把 13 个种子逐个对照库的 5583 个骨架:0 个重合。种子与 head 1 的 |ρ|:OA 去掉了活跃度水平、但开盘一根自己的日间波动还在,我估计 0.3~0.65,日度噪声大的种子(N8、N11)可能更高,个别被表划掉我可以接受。


    样本外为什么还在:来源是持有人结构与盘前挂单的制度(集合竞价规则、涨跌幅限制、散户盘前挂单)而不是一段行情;全部用 ≥ 60 日窗口,换手低;没有阈值 / 阶跃。预期并不高:我没有这些种子的任何读数,整个批的情况是原始读数都被成本压在 −1 以下。


    数学检查:(a) 无前视:`day_first` / `day_last` 是当天数据,OV 里的昨收用 `ts_delay(·, 1)`(res[t] = x[t−1]),今天开盘价在 9:25 已知、收盘价在 15:00 已知,t 日收盘后算、t+1 日交易。(b) 数值:OA 是两个对数量之差,量级 0~3;OV / ID 是对数价差,量级 1e-2;N10 的分母是全天成交额(量级 1e6~1e10)加 1,不会出现 0/0;`cross_zscore` 窗口内常数时返回
    0 而不是 inf。本机合成立方体(80 × 320 × 241)全算过:13 个种子无 inf、每日取值离散度 ≥ 0.99、覆盖率 0.98(N12 因 60 日收益的热身只有 0.78,真实面板的热身期只占 3%)。(c) 定义:`day_first(log(Amt))` 的退回行为见上;OV 在停牌复牌当天为缺失(昨收缺失),不会拿跨停牌的价差当隔夜收益。'
