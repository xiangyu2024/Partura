  why: 烂的部件:拆解表里把 Volume 换成 Amt 是 −2.82(比 head 的 −1.49 差 1.33),而 log Amt = log Volume + log 价格,两者之差恰是名义价格。所以股数口径比金额口径好,可能是因为金额口径多带了一个对本批不利的价格项。我沿这条直线外推:s(c) = −log Volume + c·log 价格(c = 0 是 head,c = −1 是已测的 Amt 版 −2.82);变体 2、3、4 取 c = 1、0.5、2,变体
    5 取纯价格 `day_mean(log(Amt)) − day_mean(log(Volume))`(逐分钟 VWAP 的对数均值),变体 6 把 c = 1 取 120 日均值(价格是慢变量,日换手低);变体 1 是 head 本身的 241 日均值,看慢下来多少。方向由 train 定,不预设。
