slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '自动划掉规则：无。16 个种子对快照 head 的原始日度秩 |ρ| 最大 0.33（seed 4，对 day_mean(log(Volume))），远低于 0.7；对五个控制的 |ρ| 最大 0.65（seed 6，对 rev），低于 0.8。核心 day_cov(Ret, log(Amt)) 对 head 的原始 |ρ| 最大 0.10，残差 |ρ| 最大 0.04，对五个控制最大 0.18，E 位的核心闸门满足。16 个种子对 head 的残差 |ρ| 除 seed 12（0.27，对 add 头）外都不超过 0.14，所以在 reward 的度量里它们不是任何 head 的换皮。库里：day_cov(Ret, log(Amt)) 只在快照 head 3 中出现 1 次（grep 结果）；day_cov(Ret, ·) 共 55 条，但几乎全部套在 ts_std / ts_max / ts_med 里读离散度或极值，读水平的只有 ts_mean(day_cov(Ret, Amt), ·) 1 条、ts_mean(day_cov(Ret, Volume), ·) 2 条、ts_med(day_cov(Ret, Volume), ·) 2 条；120 至 241 日窗口、log 成交额口径的耦合水平，加上去量纲与桶内标准化，库里没有。创新度 4。数学检查：(a) 无前视：day_cov 只用当天分钟（dt_day.day_cov）；cross_* 经 rolling_windows 左侧补 NaN，是尾随窗口；ts_delay 为 x[t-d]。(b) 数值：day_cov 是配对有效分钟上的总体协方差，有效分钟少于 2 时为 NaN；log 在 |Amt| <= 1e-9 时为 NaN，所以只用有成交的分钟。除法的分母都有 1e-6 下限，分子与分母同尺度，相关型变体有界，没有爆点。(c) 定义：cs_rank 走 common.rank（NaN 安全、并列按列序），不是 nanrank_last，所以 §4 的停牌记 0 秩陷阱不适用；全部 16 个表达式都不含 ts_rank、cross_rank、in_rank_rolling、ts_spearman 或 nt_*。需要标出但不挡的点：(1) 第 0 分钟是集合竞价根，Ret 恒为 0（design_r1.md 记录，C02 的 W2 已确认；审计没有另外核对数据）。它进入 day_cov 时的贡献是 -R̄·(L0-L̄)/241，可忽略；但它把 σ_logA 的分母抬高约 (L0-L̄)²/241，当 L0-L̄ 为 2 到 3 时约 0.02 到 0.04，所以归一化的种子 4、8、10 的口径会随开盘倍数微调。(2) seed 14 的滞后项 day_cov(Ret, in_delay(log(Amt), 1)) 在第 1 分钟把竞价根的对数成交额配到第 1 分钟的收益上，这一个点的杠杆是典型分钟的数倍，是这一项的噪声源，而不是「日内先后」的机制本身。(3) seed 4、8、10 在有成交分钟很少的薄日上相关系数会接近 ±1，这是采样噪声，不是数学问题。(4) seed 5、6 对 rev 控制的 |ρ| 为 0.64 与 0.65，20 日耦合均值的截面结构与 20 日收益相关；尺子去掉线性部分后残差仍很小（对 head 的残差 |ρ| 为 0.14），且不到 0.8，不划。(5) seed 1、2、3、7、12、16 对 vol 控制的 |ρ| 为 0.49 至 0.56，未归一化的协方差带 σ_R 的尺度，同理不划。(6) seed 12 含当日 1 日对数收益的截面秩，而 1 日反转不在五个控制里；若它得高分，要先查是不是 1 日反转。如果它有 alpha，最可能来自：持有人结构的慢变属性，即信息与追涨交易（分钟收益与成交额同向，耦合为正）和对冲与流动性交易（耦合为负）的分化（Llorente 等 2002；Campbell、Grossman、Wang 1993）；条件交互（耦合与近期收益的截面秩乘积）是它在去控制后仍能留下东西的可能路径。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '自动划掉规则：无。13 个种子对快照 head 的原始 |ρ| 最大 0.47（seed 9，对 day_mean(log(Volume))）；对 head 1 day_first(log(Amt)) 的原始 |ρ| 多在 0.1 至 0.4 之间（seed 1 为 0.19，seed 11 为 0.37）；对控制：seed 9 对 size 0.60、对 liq 0.58，seed 11 对 known 0.42、对 liq 0.39，其余不超过 0.27。库：cross_zscore 与 cs_bucket_* 在 5583 条里为 0 次；day_first 作用在 Amt 或 Volume 上的 34 条全部是水平或时序形状（ts_std、ts_kurt、ts_argmin、cross_sum 一类），没有一条把开盘一根除以全天典型分钟，所以原始层面是新的。但残差层面要扣分：对五个控制取残差后，seed 1、2、4、10、11、13 与 head 1 残差的 |ρ| 为 0.53 至 0.62（seed 1 为 0.62，seed 13 为 0.60，seed 4 为 0.59）。OA = day_first(log(Amt)) - day_mean(log(Amt))，被减掉的 day_mean(log(Amt)) 恰是流动性控制的主要成分，尺子在 reward 里做的减法与 OA 的减法基本重合，所以这六个种子在 reward 的度量下大部分是 head 1 的残差，它们的新意只剩平滑核的差别。在残差层面真正新的是 seed 5、6、7、8、12（残差 |ρ| 为 0.03 至 0.10），以及 seed 9（0.23）、seed 3（0.20）。这一层有实质重合，但还没有到「明显是同一个东西」，所以创新度给 3，不给 4，也不给 1。不划：0.6 不是 0.7 的重复闸门，也不是数学问题，按 §3 原则放行。数学检查：(a) 无前视：day_first、day_last、day_mean 都是当天数据；OV 用 ts_delay(·, 1) 取昨收，t 日收盘后算、t+1 日交易。(b) 定义：day_first 取第一个非 NaN 值。对数族里零成交分钟为 NaN，所以开盘根无成交的票会退到它第一个有成交的分钟；这只发生在最不活跃的票上，是口径偏差，不是填充主导，不挡。N10 用的是 day_first(Amt)，不取对数；由于零成交在立方体里是 0 而非缺失（design.md 的停牌分钟为零），开盘根无成交时它返回的是有效的 0，与对数族口径不一致，同样不挡。(c) 数值：OA 的量级在 0 到 3 之间；N10 的分母 day_sum(Amt)+1 为正，比值落在 [0, 1]；cs_bucket_zscore 的分母有 EPS；cross_stddev、cross_corr 的 120 日热身约占真实面板的 6%，不主导。机制：开盘集合竞价的隔夜信息与散户开盘注意力（Berkman 等 2012；Barber、Odean 2008），以及隔夜与日内收益在股票层面的慢变持续性（Lou 等 2019）；seed 5 至 8 的「OA 乘隔夜缺口」是这一机制的直接读法。需要留意：竞价的成交量可能随隔夜缺口幅度放大，所以 seed 5 至 8 的 OA 与缺口可能有机械联系，拿到 alpha 后应看它对缺口绝对值的暴露。如果它有 alpha，最可能来自：开盘集合竞价的隔夜信息与盘前挂单形成的价格压力（注意力驱动的开盘买入随后反转，即 Berkman 等 2012 与 Barber、Odean 2008 的那条路）；seed 5 至 8 读的是这条路与隔夜缺口的耦合。'
R:
  - head: 'day_first(log(Amt))'
    soundness: 4
    reasons: '数学检查：变体 2 至 4 的 cs_bucket_zscore 按当日 day_mean(log(Amt)) 的截面十分位分桶，再在桶内标准化，是当日截面操作，无前视；cross_mean 的 60 与 241 日窗口是尾随的；变体 1 的 cross_mean 也是尾随的。无除法、无分母近零。头部的问题（一天一个读数、读的是水平）是真的，变体都针对它：变体 2、3 与 head 1 的残差 |ρ| 为 0.50 与 0.60，变体 4 为 0.23，说明去水平确实改变了 reward 里的成分。变体 1（60 日水平）与流动性控制的 |ρ| 为 0.93，与 known 的 |ρ| 为 0.92，它只能当对照，过不了 known 闸门，但这不是数学问题，不挡。机制：慢读数降换手（头部的 -1.5 主要是成本，这是 PI 的推断，审计同意其方向，但没有毛收益的读数可以验证）；去水平后的开盘相对强度仍是开盘注意力的读法。如果它有 alpha，最可能来自：同流动性水平内比较的开盘一根相对强度所反映的开盘注意力，而不是流动性本身。'
  - head: 'day_mean(log(Volume))'
    soundness: 3
    reasons: '数学检查：log(Amt) - log(Volume) 逐分钟就是成交均价的对数（Amt / Volume 即价格），所以 day_mean(log(Amt)) - day_mean(log(Volume)) 是日内 log 价格的均值。变体公式与 PI 的 s(c) = -log Volume + c·log 价格一致：变体 2 是 c=1，变体 3 是 c=0.5，变体 4 是 c=2，变体 5 是纯价格，变体 6 是 c=1 的 120 日均值，已逐个代数核对。无前视、无除法、无分桶。机制：名义价格与最小变动价位的效应是可以说的，但这个线性组合的经济含义没有说清；c 的直线只由两个点外推（Volume 版 -1.49 与 Amt 版 -2.82），而 -2.82 同样可能是 100 股取整噪声造成的（PI 笔记也承认），变体没有把两种解释分开。残差层面，变体 1 至 6 与 head 2 的残差 |ρ| 为 0.85 至 0.99，所以它们是 head 2 换个 c 的写法，增量只能来自价格项的权重；§3 对 R 只打合理度，这一条只作为下游的提醒，不作为挡的理由。给 3：机制可以说、数学无问题，但证据薄，不为了放行而凑到 4。如果它有 alpha，最可能来自：名义价格与最小变动价位的结构（价格水平本身，而不是成交股数）。'
  - head: 'add(day_min(log(Amt)), day_cov(Ret, log(Amt)))'
    soundness: 4
    reasons: '头部的定义问题是真的：add 的两项尺度差很多，day_min(log(Amt)) 的量级约为 5 至 12，而 day_cov(Ret, log(Amt)) 按 day_cov 的定义是 σ_R 乘 σ_logA 量级的协方差，约 1e-5 至 1e-3，所以头部的排序基本就是 day_min，协方差只打破近并列。R3 修的正是这个尺度错配：变体 1 至 3 对两项各取截面秩再相加或相减，两项的权重相等。cs_rank 是 NaN 安全的（common.rank，不是 nanrank_last），§4 的停牌 0 秩陷阱不适用。变体 1 的截面秩和有并列（distinct 0.80，两个百分位秩相加的必然结果），按列序打破，§4 明确说这不是问题。变体 4 是 day_min 的 241 日均值，是流动性地板的探针，241 日热身约占真实面板的 12%，不主导。残差层面，变体与 head 3 仍有 0.66 至 0.86 的相关，是换权重后的同一读数，但不是数学问题。合理度 4。如果它有 alpha，最可能来自：耦合的符号（信息与对冲交易的分化）与最小一手（100 股）成交额所代表的流动性下沿，两者等权组合；变体 3 是净掉流动性下沿之后的耦合。'
summary: '两个任务位都通过。a 位：创新 4、合理 4，16 个种子全部保留。b 位：创新 3、合理 4，13 个种子全部保留，但其中 6 个种子在残差层面与 head 1 重合 0.53 至 0.62，已写入理由。R 三组合理度为 4、3、4，无数学问题（R2 因机制证据薄给 3）。本轮未发现前视、停牌 0 秩陷阱或定义坏掉；审计只用了 train 与 valid 的相关度表、代码定义与库结构计数，没有读取任何 2026 年的数据。'
