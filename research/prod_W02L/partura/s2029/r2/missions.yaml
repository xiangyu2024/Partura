  hypothesis: '事实(快照,不是我的推测):本流不靠阶跃、也不靠成交额水平的唯一线索,来自第 1 轮 N 位里的成交量增长上下行半标准差一族。记 P120 = cross_semistd_pos(day_mean(Volume), 120)(日对数量增长的上行半标准差,即放量脉冲的强度),N241 = cross_semistd_neg(day_mean(Volume), 241)(下行半标准差的一年版)。该族评分前 5 名里只有一条为正:`sub(log(sub(log(P120), log(sub(log(P120), log(N241))))), log(N241))`,score +0.41(train +0.60 / valid +0.41);其余四条(两个半标准差都用 120 日窗口)是 −0.31 ~ −0.42,最简单的 120 / 120 对数比是 −0.33。共性表里含 `log(sub(log(P120), log(N120)))` 的 9 个候选比不含的好 +0.80(p 0.024)。所以这一族里唯一有利的差别是:下行腿换成更长的 241 日窗口之后分数由负转正。库里 5583 条表达式一条都没用过 cross_semistd_*(它是 Partura 的扩展算子),这是个空白。我的读法(没有读数核对):那条 +0.41 的值大约是 −log N241(一年里量下降日的波动越小 = 成交越「稳」、越少被关注)加上一个关于不对称大小的小修正,所以它多半是第 1 轮六个 head 同一个「安静股」主题的连续版本 —— 但不用成交额水平、不用阶跃。


    本位假设:核心 P120 是「关注度被事件点燃」的那一腿(放量脉冲有多猛);alpha 若存在,在它相对基线(下行腿、自己的长期均值、总体量增长波动)的大小,而不在放量本身的水平。算子怎样实现(外围三组,核心 P120 原样放在每个种子里):(i) 基线腿换窗口:log P120 − log N241,log P120 − log N60(短期脉冲对一年期 / 一季度下行基线);(ii) 只留形状:不对称对自己 241 日均值去均值(cross_mean,「不对称的冲击」);对总体量增长波动 log cross_stddev(ts_delta(log(量), 1), 120) 做逐日截面回归取残差(cs_regres);乘 120 日平均收益的符号做状态交互(Llorente 型:放量伴随上涨与下跌读法相反);在流通市值十档内 / 活跃度(Z3 = 三层 ts_std(日均成交额))十档内标准化(cs_bucket_zscore);(iii) 借第 1 轮 head 的教训,把不对称放进阶跃带当「带内排序变量」:cs_last_low10 / low05(不对称, Z3 或 Z2) 把 Z3 最低一档(与 head 1 / 3 同一个被标记集合)沉到底部,cs_first_low40 / low20 则让最低 40% / 20% 整体排前面;还有一个用 cs_bucket_rank(Z3, LogFloatCap) 把带改成「同市值十档里最低的」。带内排序是与水平无关的量增长不对称,而六个 head 的带内排序是水平 / 市值(−Z2、−LogFloatCap),所以这些种子与六个 head 的日度秩 |ρ| 应当低(只共享被标记的那 10% 名字,预计 0.2 ~ 0.5)。


    为什么和库里 / head 不同:库里 0 条用 cross_semistd_*,0 条用 cs_last_* / cs_first_* / cs_bucket_*;六个 head 是成交额水平的嵌套 std 加阶跃,本位的排序变量是无量纲的量增长形状。15 个种子的算子骨架逐条核过,都不在两库 5583 条的骨架里,也不在任何已出 head 的骨架里。


    为什么样本外还会在:窗口 120 / 241 日,变量每天变动极小,换手低;来源是注意力 / 参与者结构这类慢变量(高成交量溢价,Gervais–Kaniel–Mingelgrin 2001;注意力驱动的个人投资者买入,Barber–Odean 2008),不依赖某一段行情。数学检查:log 的输入是半标准差(正数,下行腿在窗内全无下降日时为 0 → 框架的 log 返回 NaN,不填充);零成交日的对数增长是 NaN,窗口按可用日算(n ≥ 3);cs_regres 是逐日截面回归残差;sign(cross_mean(day_sum(Ret), 120)) 只用当日及以前;cs_last_* / cs_first_* 的带只收整块并列,Z3 在窗内有效点很少的新股上用少量点估计(已知:滚动算子没有最少样本数),这类票的带位置不稳,但不是系统性缺失;没有 ts_rank / cross_rank,不触发 nanrank_last 的停牌记 0;没有用到当天收盘之后的数据。'
