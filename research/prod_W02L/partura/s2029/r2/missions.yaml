- type: E
  core: ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40)
  hypothesis: '事实(快照拆解表):第 1 轮 E 位(核心 Z3 = ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40))出了 6 个 head(+1.35 ~ +0.65),形状全是 `cs_last_low10(y, x)`,方向 −1:x 是嵌套成交额标准差的水平(Z2 / Z3 / Z5,或它的 log),cs_last_low10 把 x 最低的 10%(整块并列)沉到所有人下面,其余按 y 的秩排。尺子只扣控制的 1 / 2 / 3 次秩多项式,最低一档的指示扣不掉,所以这是个「最低一档的名字」的阶跃。拆解:(a) head 1 里 log(ts_std^4) 一项数值上是死的(40→20、40→80、整体换成 Z3 都是 +1.35,train +1.44 / valid +1.35 逐位相同),y 实际是 −Z2 的水平;(b) 同一个 x、把 y 换成 log(ts_std^4)(按原方向读,带内从「水平越高越靠前」变成「水平越低越靠前」)是 −0.10(head 2 是 −0.35),head 3 去掉 y 里的 −LogFloatCap 是 −1.19(valid +0.44),head 4 同样是 −0.14;y 整体的必要性 +1.45 / +1.44 / +2.19 / +0.97;(c) 拆解表只动过 y 里的窗口和 log,没有动过 x(被标记集合)的定义和带宽。也就是说四个被拆解的 head 的带内排序都是「同一个最低档里水平 / 市值更大的排前面」,即最低一档里最不极端的那些;六个 head 的被标记集合都是嵌套成交额标准差水平的最低 10%(Z2 / Z3 / Z5 互相高度相关,我没有读数)。两个解释:H_a 阶跃指示本身承重(最低一档成交额变异的票:被忽视 / 休眠的小票,Merton 1987 的投资者认知假说、Arbel–Strebel 1982 的被忽视效应,新兴市场零交易日的流动性溢价 Lesmond 等 1999 / Bekaert 等 2007),带内排序只是微调;H_b 带内位置承重(「安静但还在交易」的那一档,最极端的休眠票是垃圾)。


    本位设计(核心 Z3 原样当 x 或放在 x 里,被标记集合固定为 Z3 最低 10%):只换带内排序 y,换成和 −Z2 / −LogFloatCap 不同、含义各异的变量,正反两个方向都放:名义价 LogFloatCap − LogFloatShares;120 日平均收益(动量 / 反转,尺子只控制 20 日反转);换手 log(ts_mean(日均成交额, 60)) − LogFloatCap;日内成交集中度 cross_mean(day_gini(Amt), 60);60 日零成交分钟占比 cross_mean(day_zero_ratio(Volume), 60)(休眠度的直接度量);成交重心 cross_mean(day_centroid(Amt), 60)。再改带宽(cs_last_low05 / low20)、改成大段条件(cs_first_low40:最低 40% 里按 y 排前面)、改带的定义(cs_bucket_rank(Z3, LogFloatCap):同市值十档内最低的),以及一个把次新股从带里排除的版本(select_where(is_gt(ListAge, 120), Z3, 1e12),检验被标记集合是不是靠新股热身期的少量点估计撑起来的)。


    可检验的区分:若 H_a,多数种子都应 ≥ 0.4(带内排序无关紧要);若 H_b,只有「水平更高 / 更活跃排前面」的种子好 —— 在 cs_last_low10(y, ·) 里即 y = 零成交占比、y = −换手、y = 基尼(分布越均匀越活跃)—— 而同一变量反方向(y = 换手)会差。为什么与 head 不同:带内排序变量不同,日度秩 |ρ| 只来自共享的 10% 名字(预计 0.2 ~ 0.5,低于 0.7 的禁令线);库里 0 条用 cs_last_* / cs_first_* / cs_bucket_* / day_zero_ratio / day_gini / day_centroid。为什么样本外还会在:被标记集合是慢变的(Z3 是三层 40 日窗口,集合每天几乎不变,换手低),不依赖某一段行情;但我保留怀疑:这是尺子的盲区(最低一档指示在 1 / 2 / 3 次多项式残差里仍然存在),若多数种子都过线,说明承重的是最低一档的指示本身,这些 head 本质上是同一个「小票尾部溢价」,不是各自独立的新 alpha。


    数学检查:y 是日值树,cs_last_* / cs_first_* 的输出是 y 的秩加 ±1,不含 NaN、无并列(并列由列序打破,§4 豁免);day_zero_ratio 是当日零成交分钟的占比(0 ~ 1),day_gini 有界,不会被一次极端值支配;select_where 的常数 1e12 比任何 Z3 都大,只把上市不满 120 日的票踢出最低一档;ListAge 的 10000 哨兵(2018-01-02 前已上市)只落在 > 120 一侧,不影响;没有 ts_rank / cross_rank,不触发 nanrank_last;没有用到当天收盘之后的数据。'
