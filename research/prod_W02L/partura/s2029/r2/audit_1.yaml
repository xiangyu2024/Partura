    novelty: 4
    soundness: 4
    struck_seeds: [14]
    reasons: '相关度表（train 抽样）：核心 cross_semistd_pos(day_mean(Volume),120) 与 11 个快照 head 的最大原始 |ρ| 0.258、残差 0.246，最像的是 M2 head pow_1_5(ts_max(pow_2(ts_max(cs_rank(...),30)),30))；与 liq / vol / rev / known / size 为 0.14 / 0.19 / 0.09 / 0.09 / 0.23，都低于 0.8，核心门槛通过。快照 11 个 head 都不含 cross_semistd_* 也不含 Volume，核心是新的。库检查：inputs/libs_train.csv 与 struct/members.csv 的 5583 条里 cross_semistd_* 出现 0 次。波内他流确有 semistd 的 head，但输入是 Close、Low、Amt（如 s2018 r2 的 cs_first_high40(cs_quantile_q25(LogFloatShares), cross_semistd_pos(day_close(Close),120)) +1.32），本表没有算它们与本位的相关，记为缺口。创新度 4（不给 5）：族与输入都与快照和库不同，但 semistd 算子在波内已有他流用过，无法核对与之的相关。合理度 4，逐个算子核对：cross_semistd 在 _semistd 中取 g = log(x_t / x_{t-1})（前后两日都为正才算），n≥3 的窗口里取 min(g,0)² 或 max(g,0)² 的均方根；零成交日 g 为 NaN，下行腿全为 0 时 log 因 |x|≤1e-9 返回 NaN，不会产生 −inf 爆点；cs_last / cs_first 走 _lexi，输出是 y 的截面秩加 ±1，整块并列整体进带，秩来自 argsort 而非 nanrank_last，停牌不会记 0；cs_regres 与 cs_bucket_zscore 都是单日截面运算；窗口 60 / 120 / 241 合理，241 日窗需要立方体有一年前史，起点未核对；没有用到收盘之后的数据。一处不挡但要记：daily.py 注明 Amt、Volume 是未复权的原始量，送转股或拆股会让 day_mean(Volume) 的对数增长出现正向跳变，直接进入 P120 的上行腿，这不在 §4 的三类之内。逐种子：划掉 14（与 M1 head ts_max(ts_std(ts_std(day_mean(Amt),40),40),40) 的原始 |ρ| 0.717 ≥ 0.70，自动划掉）；13 是 14 的翻号版但 |ρ| 0.669，不触发，保留。9 是 8 的翻号版；13 与 15 只差带宽（40% 与 20%）；8 与 10 只差标记集合（Z3 与 Z2）；都是 PI 写明的自由参数检验，不算换皮。1–7、11、12 的机制与所写一致，没有前视，没有数值陷阱。如果它有 alpha，最可能来自放量脉冲相对下行基线的强度（注意力的不对称冲击），其次是送转股造成的股数跳变，因为 P120 的上行腿会把它当成放量。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '相关度表：核心 Z3 = ts_std(ts_std(ts_std(day_mean(Amt),40),40),40) 与 M1 head ts_max(ts_std(ts_std(day_mean(Amt),40),40),40) 的原始 |ρ| 0.968、残差 0.941。核心本身是这个 head 的换写法，判法与第 1 轮 slot a 一致。与 liq / vol / rev / known / size 为 0.66 / 0.18 / 0.02 / 0.66 / 0.34，低于 0.8，核心门槛通过。Z3 第 1 轮已作 E 核心用过一次，本位是第 2 次，即上限，此后不能再作 E 核心。Z3 也是快照 head 1（+1.35）与 head 3（+1.00，x = log Z3）的子树，标记集合（Z3 最低 10%）与这两个 head 相同。16 个种子的最大原始 |ρ|：1 0.33、2 0.33、3 0.50、4 0.49、5 0.60、6 0.52、7 0.67、8 0.70、9 0.57、10 0.31、11 0.44、12 0.62、13 0.61、14 0.35、15 0.59、16 0.70。8 与 16 为 0.698，低于 0.70，不触发自动划掉，但很接近，照实记录。残差 0.27–0.67，最高是种子 13，没有 ≥0.85 的换皮。控制最高 0.57（种子 15 的 size）。创新度 3（不给 4）：标记集合与核心都与快照 head 1、3、M1 重合，这一块不是新的；真正新的是带内排序变量 y：名义价 LogFloatCap − LogFloatShares（1、2）、120 日平均收益（3、4、10、12、14）、log 换手减市值（5、6、11、13）、零成交分钟占比（8、15、16）、成交基尼（7）、成交重心（9）。两库 5583 条里 cs_last_* / cs_first_* / cs_bucket_* 与 day_zero_ratio / day_gini / day_centroid 在 Volume、Amt 上出现 0 次；他流有 day_zero_ratio(Ret) 与 day_centroid(High/Open)，输入不同。种子 3–9、11–13、15、16 与最像的 head 仍有 0.44–0.70 的重叠，说明标记集合的贡献很大。合理度 4，算子核对：cs_last_low10/05/20/40 与 cs_first_low40/20 的带是 x 的整块并列，带内 ±1，输出不含 NaN；cs_bucket_rank 在 Z3 十档内取秩，并加 1e-4 的全局秩打破并列；select_where(is_gt(ListAge,120), Z3, 1e12) 即 torch.where(x.bool(), y, z)，上市不满 120 日的票 x = 1e12，离开最低档，NaN 上市天数同样不入带；day_gini、day_centroid、day_zero_ratio 都有界，无爆点。y 的各项都是同量纲的对数（LogFloatCap − LogFloatShares 是两个 log；log 均值减 LogFloatCap 也是两个 log），没有 R3 / R4 那样的量纲错配。没有 ts_rank / cross_rank，不触发 nanrank_last；没有前视。一处记录：common.py 的 nanstd_last 在窗内有效点不超过 1 时返回 0 而非 NaN，Z1 因此在上市或长期停牌后的第一天为 0，Z3 只在那一天为 0，不构成系统性的新股标记；但上市头几个月的 Z3 来自少数点，这正是种子 16 要检验的东西，不挡。不划种子。种子 8 与 16 几乎同一排序（同一 head、同样 0.698，残差 0.540 / 0.541，差别只在上市不满 120 日的票能否入带），这是 PI 写明的诊断（新股热身是不是来源），不是换皮，保留；若两者样本内分数几乎相同，即可判定新股不是来源。种子 4 与 10 只差带宽（10% 与 20%，同 y 同 x），2 与 1、4 与 3、6 与 5 是翻号版，都是自由参数或方向的检验，保留。补充：快照里最好的 head（+1.35）的带内排序实际是 −Z2（见 R3 理由），本位的 y 变体是在替换一个水平排序，H_a（标记集合承重）与 H_b（带内位置承重）的区分仍然成立。如果它有 alpha，最可能来自两处：一是成交额变异最低一档的尾部（被忽视或休眠的小票，Merton 1987 一类的认知假说），alpha 在标记集合本身；二是带内的休眠度与交易集中度（零成交占比、成交基尼），即最不活跃但仍在交易的一档。'
R:
  - head: 'cs_last_low10(sub(log(ts_std(cs_last_low10(sub(log(ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40)), LogFloatCap), ts_std(ts_std(day_mean(Amt), 40), 40)), 40)), LogFloatCap), ts_std(ts_std(day_mean(Amt), 40), 40))'
    soundness: 3
    reasons: '快照 head（+0.82）。内层 cs_last_low10(sub(log(Z3),LogFloatCap),Z2) 的标记集合是 Z2 最低 10%；外层 ts_std(·,40) 作用在内层输出的 40 日时间序列上，即这只票在截面秩上的时间波动（进出标记的跳动也在其中）。外层 log 取的是正的 ts_std，守卫有效，没有量纲问题（log(ts_std) 与 LogFloatCap 都是对数尺度）。变体 1（去掉外层 ts_std）：内层与外层的 x 都是 Z2，外层的下沉覆盖内层的下沉；内层 log 取的是 |x|，带内排序翻转，但这些票随后被外层整体下沉，带外排序不受影响，所以不是数学问题，只是内层变得冗余；变体 1 对带外的票等价于 log(秩) − LogFloatCap，它检验的是去掉时间波动后的效果。相关度：变体 1 与快照 head 的最大原始 |ρ| 0.721（残差 0.619，size 0.637），变体 2 为 0.857（残差 0.785），没有 ≥0.8 的控制。合理度 3（不给 4）：机制只能说成排名的时间波动，经济解释不清；PI 的拆解表说外层 ts_std 的必要性为负，这个组是去掉它的检验，成立但不强。如果它有 alpha，最可能来自 Z2 最低 10% 标记在时间上的进出，而不是 log(ts_std) 这一项。'
  - head: 'cs_last_low10(sub(log(ts_std(log(ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40)), 40)), LogFloatCap), log(ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40)))'
    soundness: 4
    reasons: '快照 head（+1.00）。y = log(40 日 ts_std(log Z3)) − LogFloatCap，x = log Z3，标记集合与 Z3 最低 10% 相同（与 head 1、3 同集）。数学：ts_std(log Z3) ≥ 0，log 前有守卫，两项都是对数尺度，没有量纲错配。变体 1 去掉外层 log，得到 y = ts_std(log Z3, 40) − LogFloatCap；前一项的量级小于 LogFloatCap，排序会更偏市值（size |ρ| 0.691 与此一致），但它没有被吞掉到不计，不是 §4 的量级主导；它与原 head 的 |ρ| 为 0.952，正是 R 替换规则要检验的那一类。变体 2、3 只把带宽改为 5%、20%。相关度：三个变体与快照 head 的最大原始 |ρ| 为 0.952、0.855、0.753，没有与控制的 |ρ| ≥ 0.8。合理度 4：机制清楚（活跃度的时间波动与市值的组合，即体制切换的程度），算子都对，40 日窗口与守卫合理。如果它有 alpha，最可能来自 40 日 log 成交额变异的波动率（体制切换），其次是 5%–20% 带宽的差异。'
  - head: 'cs_last_low10(sub(log(ts_std(ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40), 40)), ts_std(ts_std(day_mean(Amt), 40), 40)), ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40))'
    soundness: 1
    reasons: '快照 head（+1.35，最好的 head）。y = log(Z4) − Z2，x = Z3，其中 Z4 = ts_std 四层、Z2 = ts_std 两层，都作用在 day_mean(Amt) 上。Amt 是元，所以 Z2 是元量级，截面离散度在 10^5 量级；log(Z4) 的截面离散度只有 O(1)。两项相减后排序基本只由 −Z2 决定，log 项数值上为零。PI 的拆解也印证了这一点：log 内的窗口从 40 改为 20 或 80，分数仍逐位为 +1.35。这是量纲错配造成的结果主导（§4 定义坏掉：结果主要由非设计的项决定）。R 组的三个带宽变体继承了同一个 y，检验的其实是 −Z2 的带宽，而不是 log 比值的带宽，R 组的标签与它计算的对象不符。同样的形式（log(·) − 元量级）也出现在快照 head 2（+1.09，log Z3 − Z2）与 head 5（+0.66，log(cs_last_low40(…)) − Z4）中，PI 应当知道。不通过，R 组删掉。如果它有 alpha，最可能来自 −Z2（成交额二阶波动的水平低端）加上 Z3 最低 10% 的标记，而不是 log 比值。'
  - head: 'cs_last_low10(sub(log(ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40)), ts_std(ts_std(day_mean(Amt), 40), 40)), ts_std(ts_std(day_mean(Amt), 40), 40))'
    soundness: 1
    reasons: '快照 head（+1.09）。y = log(Z3) − Z2，x = Z2，与 R3 是同一个量纲错配：log(Z3) 的截面离散度为 O(1)，Z2 是元量级，排序由 −Z2 独占，log 项数值上为零（PI 拆解：log 内的层数换成 Z2 后分数仍为 +1.09）。PI 去掉 log 得到 +0.78，那是 Z3 − Z2 两个元量级的比较，已经是另一个信号，不是这个 head。变体 1、2 只改带宽（5%、20%），继承同一个 y。不通过，R 组删掉。合理度 1。如果它有 alpha，最可能来自 −Z2 的截面排序（成交额水平的二阶波动低端），而不是 log(Z3) 与 Z2 的比值。'
summary: 'Slot a（E，核心 cross_semistd_pos(day_mean(Volume),120)）创新 4、合理 4，划掉种子 14（|ρ| 0.717），其余 14 个保留，通过；slot b（E，核心 Z3 第二次作 E）创新 3、合理 4，不划种子（8 与 16 为 0.698，未到线），通过；R1 合理 3 与 R2 合理 4 保留，R3 与 R4 因 log(元) 减元量级 Z2 的量纲错配（log 项数值为零）合理 1，删掉。'
