slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 2, 8, 10, 11, 12, 14]
    reasons: '槽 a 是 E 位,核心 Z4 = ts_std 四层 day_mean(Amt)。核心过门槛:与 5 个控制的原始 |ρ| 最大 0.63(liq、known),都低于 0.8。核心是 head 1(log(Z4) 项)的子树,Z4 第一次作核心,Z3 已在 r1、r2 各用一次。但核心本身与快照里的 head ts_max(Z3,40) 原始 |ρ| 0.94、残差 |ρ| 0.87,与 ts_std(ts_std(ts_max(Z2,40),40),40) 为 0.82,几乎就是已有 head 的测度。所以创新度给 3,不给 4:真正新的只有带外的排序变量(市值、名义价、120 日收益、零成交占比、量增长半方差),带本身还是 Z 族的休眠度。自动划掉:seed 1 = cs_last_low10(LogFloatCap, Z4),与 size 控制的 |ρ| 0.911,y 的排序几乎就是市值;seed 2 原始 0.743;seed 8 原始 0.825;seed 10 原始 0.902;seed 11 原始 0.852;seed 14 原始 0.906(均与 head ts_max(Z3,40) 或 ts_std(ts_std(ts_max(Z2,40),40),40) 的日度秩 |ρ| ≥ 0.7)。单独划掉 seed 12 = cs_bucket_rank(Z4, mean60):原始 |ρ| 0.603 未过线,但残差 |ρ| 0.787 对 ts_max(Z3,40),对 5 个控制取残差后它与 head 是同一个东西,按「重复」划掉。留下 3、4、5、6、7、9、13 共 7 个,满足 ≥ 4。seed 9(cs_first_low40(Z4, LogFloatCap),残差 0.597)与 seed 13(残差 0.68)未达 0.7,保留;seed 13 是 log(Z4) - log(mean60) 的无量纲版本,是这一槽里唯一不被数值压死的 log 项(与 head 1 的 log(Z4) - Z2 不同,后者的 log 项相对 Z2 是死的)。数学检查:所有种子都原样包含 Z4;没有 ts_rank、cross_rank,不触发 nanrank_last;_semistd 对零量日做 x 大于 0 的掩码,零成交日被丢弃而不是变成 inf;cs_last / cs_first 的带按整块并列处理;唯一的边界情形是 Z4 恰为 0 时 log 得 NaN 不填充,覆盖率 0.999 到 1.0,不是系统性问题。方向问题(不挡):cs_last_low10 把休眠一档推到表达式底部,「被忽视溢价」的故事只在按底部做多时成立(与六个 head 的方向 -1 一致),missions.yaml 没有写种子的方向,PI 应当声明。如果它有 alpha,最可能来自:休眠一档本身的被忽视溢价(Merton 1987),seed 9 的小市值带内按 Z4 排序则是小票内部的被忽视排序。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [10, 11]
    reasons: '槽 b 是 N 位,没有核心。自动划掉:seed 10 = ts_std(ts_std(day_std(Amt),40),40),原始 |ρ| 0.784 与 head ts_max(ts_std(ts_std(day_mean(Amt),40),40),40) 相同,≥ 0.7;seed 11 = cs_last_low10(LogFloatCap, ...),与 size 控制的 |ρ| 0.919,y 就是市值。留下 1 到 9、12、13 共 11 个。seed 4(cs_last_high10(neg(LogFloatCap), flat60))的 size |ρ| 为 0.799,刚好低于 0.8 线,保留,但它实质上是按小市值排的流动性带,应当在报告中标出。创新度给 3,不给 4:flat 三件套在 Close 上测的是什么,要看源码。ops_ext.py:82 的 day_flat_ratio docstring 写的是「1.0 = the quote never moved」,而 research/coldstart_C08/partura/s804/r1/analysis.md:108 的结论是价格字段在无成交分钟上被前值填充,无成交分钟不是 0 也不是 NaN,活跃股占 20% 到 50%。因此 Close 的 flat ratio 基本就是无成交分钟的占比,与流动性控制 liq 的 |ρ| 在 seed 1(0.526)、seed 3(0.351)、seed 8(0.360)、seed 9(0.315) 等处是可见的重叠,它不是「与成交额无关的价格发现稀疏」。好处是与 head 的残差很低(seed 1 到 9 的残差为 0.165 到 0.247,seed 12 为 0.321,seed 13 为 0.426),所以不是 head 的换皮,创新度给 3。合理度给 4:三件套的实现都对(flat_ratio 在 [0,1],day_distinct_ratio 在有限分钟少于 2 个时为 NaN,flat_run_max 按有限分钟数归一,cs_regres 是逐日截面残差,cs_bucket_rank 在 x 的十档内取秩),没有除以近零的量,没有 ts_rank,不触发 nanrank_last。需要 PI 核实的两点(不挡):(a) 停牌日 Close 是否被掩码为 NaN。计划里说停牌日为 NaN,但 flat_ratio 的 docstring 写 suspended 为 1.0。如果停牌日是 1.0,停牌票会在 60 日均值里顶到最停滞一档,结果会主要由停牌决定,那就是 §4 的「定义坏掉」。(b) day_distinct_ratio 的 docstring 自己承认对低价股在一分钱跳动下价位层级粗,即有价格水平的混杂,而价格水平(LogFloatCap - LogFloatShares)不在 5 个控制里。seed 3 应当对价格水平取残差再看。方向问题同槽 a:seed 4、5 用的是 cs_last_high10,把最停滞的 10% 推出书外,与「休眠溢价」相反,除非按方向 -1 记分。如果它有 alpha,最可能来自:价格路径停滞、无成交分钟占比高的票的流动性溢价(Lesmond 等 1999 的零收益占比在分钟级的版本,Bekaert 等 2007 的新兴市场定价),seed 6 和 seed 12 的带内排序也是这一机制。'
R:
  - head: 'cs_last_low10(sub(ts_std(log(ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40)), 40), LogFloatCap), log(ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40)))'
    soundness: 4
    reasons: 'R 组只评合理度,给 4。数学上这个 head 的 y = ts_std(log(Z4), 40) - LogFloatCap:ts_std(log Z4) 是 0.1 到 0.5 量级的无量纲量,LogFloatCap 的横截面标准差大约为 1 以上,所以 y 的截面排序主要是 -LogFloatCap,与 PI 的拆解一致(去掉 -LogFloatCap 后 train -1.17、valid +0.42),即 LogFloatCap 是承重部件。四个变体各只动一处:variant 1 把 LogFloatCap 换成 LogTotalCap,两者同一族,原始 |ρ| 0.911、残差 0.781,替换的价值只在区分流通市值与总市值,不是新机制;variant 2 把 LogFloatCap 换成 LogFloatCap - LogFloatShares(即 log 价格),是价位效应,机制清楚,没有除法;variant 3 把 x 从 log(Z3) 换成 Z4(单调变换外的一层 std,带的位置有变化,原始 |ρ| 0.739);variant 4 把 x 换成 Z2,原始 |ρ| 0.921、残差 0.611。全部是对数或水平量,没有除以近零的量,没有 ts_rank、cross_rank。如果它有 alpha,最可能来自:最低一档的成交额波动水平(休眠一档)与小市值的叠加效应,而不是两者中的任何一个单独的效应。'
summary: '槽 a 通过(创新 3 / 合理 4,自动与单独划掉 7 个,余 7 个,核心 Z4 与控制的 |ρ| 最大 0.63);槽 b 通过(创新 3 / 合理 4,划掉 2 个,余 11 个),但 flat 三件套的 Close 定义需 PI 核实;R 组合理 4,无数学问题。'
