  core: ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40)
  hypothesis: '事实(快照拆解表,不是我的推测):三个 head 是同一个对象的几种包装:A = day_mean(Amt)(日均分钟成交额,单位是元)的
    40 日标准差反复叠加(ts_std 三到四层,外加一个 ts_max)。纯叠 std 时层数越多分数越好:A 本身 −3.47,一层 −0.77,两层 −0.43(valid
    +0.56),三层 −0.29;带一个 ts_max 的 head 2 / 3 是 −0.11 / −0.21,不再单调;最好的 head 1(四层夹一个
    ts_max)−0.03。Amt 换成 Volume 后 valid 从 −0.03 / −0.11 / −0.21 掉到 −2.40 / −2.42 /
    −2.66,三个 head 一致。外层窗口 40→80:head 2 从 −0.11 升到 +0.10(train / valid 都是 +0.10),head
    1 持平,40→20 都变差。库里这一族的原样符号是 −1(越稳越买,rank IC −0.025 ~ −0.041),新尺子下 head 的方向却是 +1:原样的边际是流动性
    / 规模 / 已知族的暴露,被尺子剥掉之后剩下的是符号相反的小量。


    我的读法(由量纲推出来,没有用读数核对):核心 C = ts_std(ts_std(ts_std(A, 40), 40), 40) 的量纲是「元」,它的排名约等于
    log L + log κ3,L 是成交额水平,κ3 是第三阶的相对变异。截面上 log L 的离散度远大于 log κ3,所以 C 的排名大部分是流动性的换写法(同类的「两层标准差套成交额分位数」在别的流的相关度表里与流动性
    0.76、与已知族 0.74)。尺子只扣 1 / 2 / 3 次秩多项式,扣不干净,剩下的是水平残渣加 κ3 里与水平无关的那一小部分。纯叠 std 时「层数越多越好」恰好符合这一点:每多一层,水平在方差里的占比下降。第二条推理:三个
    40 日窗口叠起来对一只新股的「记忆」约 120 个交易日;新股上市初期的涨跌幅放开、随后连续一字板(成交额近 0)再开板放出巨量,成交额的变异极大,所以
    C 排名顶部可能集中着次新股,这时 head 读到的是「上市多久」而不是活跃度的不稳定性。这一条没有任何读数支持,所以种子里放了方向相反的一对上市天数处理来检验它。


    本位假设:如果 C 里有 alpha,它在「相对自己水平的第三阶不稳定性」里,也就是活跃度的体制切换(参与者构成在机构持股与题材散户之间换挡),而且去掉次新股之后仍然在。算子怎样实现:每个种子都原样带着核心
    C,外围只做六件事,每件都是快照里没有的。(1) 比值,把水平除掉:C ÷ 二阶 ts_std(ts_std(A, 40), 40)(活跃度的波动本身稳不稳);C
    ÷ A 的 120 日均值;C ÷ cross_mean(day_std(Amt), 30)(日间变异对日内离散度,分母是已知族的算子形式);C ÷ 二阶的
    120 日均值。(2) 换手口径:log C − LogFloatCap(成交额变异按流通市值折算)。(3) 截面处理:对 log 成交额水平回归取残差;对换手水平
    log(日均成交量) − LogFloatShares 回归取残差;在 120 日成交额均值的十档内做 z 分数;比值再对名义价 sub(LogFloatCap,
    LogFloatShares) 取残差。(4) 上市天数:cs_last_low10(·, ListAge) 把最新上市的约 10% 排到最后,cs_first_low20(·,
    ListAge) 反过来把最新的 20% 排在最前,后者是诊断:它若比前者好,alpha 在次新股而不在活跃度。(5) 动态:log C 减 60 日前的
    log C(体制切换的加速度);比值乘以 6 个月趋势的符号(下跌途中的不稳定与上涨途中的不稳定读法相反)。(6) 价格通道:Amt 版 C 除以 Volume
    版 C,约等于名义价格,用来检验「Amt 比 Volume 好」是不是价位暴露。


    为什么和以前不同:快照里围绕这个核心的外围只有 ts_max / ts_std / ts_mean(10) / ts_delay / ts_skew,全都保留成交额的元量纲,没有除法、对数差、截面回归、日频叶子(LogFloatCap
    / LogFloatShares / ListAge)。15 个种子的算子骨架逐条核过,都不在两库 5583 条里;比值类与 head 的秩相关在设计上不共享水平。为什么样本外还会在:来源是参与者结构和上市阶段这类慢变量,窗口
    40 ~ 120 日,换手低(库里同族成员的换手只有 0.02 ~ 0.05),不依赖某一段行情。数学检查:C 在窗口内有停牌日时按可用日算,不填充;log
    的输入是元量纲(1e4 以上),不触到 EPS;比值的分母是 120 日均值(> 0)或二阶 std(平稳活跃度的股票接近 0 的情形极少,且这些股票本来就该排在端点);cs_first
    / cs_last 只收整块并列;没有 ts_rank / cross_rank,不触发 nanrank_last 的停牌记 0;没有用到当天收盘之后的数据。'
