- type: N
  hypothesis: '机制:成交额 = 成交量 × 价格,所以 A = day_mean(Amt) 的变异 = 量的变异 + 价的变异 + 两者的协变。快照里的证据:三个
    head 把 Amt 换成 Volume 后 valid 从 −0.03 / −0.11 / −0.21 掉到 −2.40 / −2.42 / −2.66,去掉「价」这一半后什么都没有了。所以成交额变异里带
    alpha 的部分,要么是价位 / 规模一类的水平暴露(尺子要剥掉的那部分),要么是「量与价怎样一起动」。本位绕开水平,读两件与规模、价位都无关的事,底都换成
    Volume 并用日频叶子 LogFloatShares 折成换手率。

    (a) 换手率口径的活跃度不稳定。换手率的对数 T = log(day_mean(Volume)) − LogFloatShares,无量纲;两库 5583
    条一个日频叶子都没用过,所以这条在库里是盲区。读 T 的二阶变异(40 / 40、60 / 60 两层叠),长窗口一阶标准差,量增长的上行与下行半标准差之比(放量爆发
    vs 缩量衰退的不对称),以及「异常放量日」(量的对数超过自己 60 日均值的 0.7,即约 2 倍)与「异常缩量日」(低于一半)在 120 日里出现的频率,频率与标准差不同:它数事件,不被一两次极端日主导。依据:Chordia-Subrahmanyam-Anshuman(2001)报告换手
    / 成交额的变异与预期收益负相关;A 股有卖空约束(Miller 1977),题材脉冲型的散户交易会把定价推偏,脉冲的反复出现是慢变的参与者结构。

    (b) 量价耦合。放量是否伴随上涨:日轴上量的对数增长 ts_delta(log(day_mean(Volume)), 1) 与当日收益 day_sum(Ret)、与前一日收益、前一日量增长与当日收益的
    120 日相关与回归斜率;带符号的异常放量(上涨日的放量减去下跌日的放量,60 日均值);量水平与后复权价的 120 日相关(趋势里放量);量增长波动与收益波动之比。依据:Llorente-Michaely-Saar-Wang(2002):放量伴随的收益在信息不对称强的股票上延续、在对冲型交易为主的股票上反转,这是个股的持续属性,所以
    120 日窗口的耦合有慢变的内容。用 Volume 而不是 Amt,是因为 Amt 的对数增长里已经含有当日收益本身,与收益的相关是机械的。

    (c) 直接拆解快照里的现象:log(ts_std(Amt, 40) / ts_std(Volume, 40)) 约等于名义价格加量价耦合的修正,再对 sub(LogFloatCap,
    LogFloatShares)(名义价格的对数)做截面回归取残差,留下的是成交额变异里扣掉价位之后的量价耦合部分。

    为什么和库里不同:三个 head 都是成交额水平的嵌套标准差,与上面这些在设计上不共享水平(换手率口径、事件频率、相关与斜率都是无量纲量)。14 个种子的算子骨架逐条核过,都不在两库
    5583 条里。为什么样本外还会在:这些量刻画的是个股的参与者结构(谁在交易、以什么方式交易),窗口 60 ~ 120 日,变动慢;若有 alpha,最可能来自
    (a) 的二阶变异 / 异常放量频率(题材散户占比,与已知成交额族、流动性不是同一个维度),其次是 (b) 的带符号异常放量。数学检查:log(day_mean(Volume))
    在零成交日是 NaN(框架的 log 对 |x| ≤ EPS 返回 NaN),不填充,窗口按可用日算;LogFloatShares 是日频叶子,第 d 天的值是收盘时点可知的;cross_corr
    在有效点太少时缺失;is_gt / is_lt 的阈值是对数差,无量纲;用到的信息都在当日收盘之前;没有 ts_rank / cross_rank,不触发
    nanrank_last 的停牌记 0。'
