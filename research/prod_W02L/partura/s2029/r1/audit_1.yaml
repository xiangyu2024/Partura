  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [3, 4, 6]
    reasons: '相关度表：核心 C = ts_std(ts_std(ts_std(day_mean(Amt),40),40),40) 对快照 head ts_max(ts_std(ts_std(day_mean(Amt),40),40),40) 的原始 |ρ| 0.97、残差 |ρ| 0.94，即去掉 5 个控制后核心的交易信号几乎就是这个 head；对 liq 0.68、known 0.68，低于 0.8，核心门槛通过。创新度 3（不给 1）：核心本身是库里 head 的换写法，但外围有实质新结构，残差与所有 head 都低于 0.7 的有种子 1、8、9、10、11、12、14、15，其中种子 12（成交量版 C 的比）残差仅 0.08，种子 1（÷ 二阶 std）0.39。合理度 4：C 对 A 的缩放是一次齐次，÷ ts_mean(A,120) 与 ÷ ts_std(A,40) 精确去掉水平；cs_regres、cs_bucket_zscore、cs_last_low10 / cs_first_low20（经 _lexi 实现为最新上市 10% 沉底、20% 置顶）与描述一致；没有 ts_rank / cross_rank，不触发 nanrank_last；引擎对计算节点套停牌掩码，停牌日为 NaN；未发现前视。扣的一分在于去水平与尺子对流动性、规模的残差化有重叠。两处描述与表对不上但不挡：种子 10 的「加速度」实为 60 日对数变化；种子 12 的「约等于名义价」预期与规模相关 0.3–0.6，实测 0.04。ListAge 提醒：对 2018-01-02 前已上市的股票 ListAge 是 10000 哨兵（同值并列在顶端），训练起点后约一年「最新 10%」覆盖不足 10%，解读 8、9、15 时应分段看；不是数学问题，不挡。划掉：6 为自动划掉（原始 |ρ| 0.85 对 R1）；3 与 4 为换皮（残差 0.905 / 0.875 对同一个 head：÷ cross_mean(day_std(Amt),30) 即已知族控制本身，减 LogFloatCap 即规模控制，尺子已对它们取过残差）。种子 5（0.81）与 7（0.80）未到 0.85 的换皮线，保留。剩 12 个，过门槛。骨架与两库 5583 条的比对本审计未做。如果它有 alpha，最可能来自去水平后的相对不稳定性（种子 1、14）或上市天数分层（种子 8、9、15），不太可能来自 C 本身。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [2]
    reasons: '创新度 4：三个 head 的残差 |ρ| 都不超过 0.57（种子 3 最高），控制里最高的是种子 13 的 liq 0.43，没有一个到 0.8；底是换手率口径、量增长相关与带符号异常放量，与三个 head 的成交额嵌套 std 不是同一个东西。没给 5：只对快照 head 与控制比较，没有核对库里的 Volume 族成员；PI 笔记里「库里没有日频叶子 LogFloatShares」的说法也未核对。合理度 4，逐个核对：种子 1、2、3 的 T = log(day_mean(Volume)) − LogFloatShares，log 对零成交返回 NaN 且不填充；ts_std 与 cross_stddev 都是 rolling_reduce(nanstd_last, axis=0)。种子 4 的 cross_semistd_pos / neg 作用在 Volume 的日对数增长上（_semistd 里 g = log(x_t/x_{t−1})），与「量增长的上行 / 下行半标准差之比」一致。种子 7–9 的 cross_corr 在日轴上，滞后用 ts_delay，没有前视。种子 11 的 cross_regbeta(x,y) 是 y 对 x 的斜率，即收益对量增长的斜率，与描述一致。种子 12 的 sign(收益) 乘以异常量，确实是上涨日放量减下跌日放量。种子 14 的 LogFloatCap − LogFloatShares 是 log 价格，截面回归与描述一致。种子 10 的 120 日 corr(log 量, 收盘) 是两条趋势序列的共趋势，实际是 120 日动量的代理，尺子没有动量控制；这是提醒，不是数学问题（§4 不挡后复权价）。种子 5、6（is_gt / is_lt 计数型）被流水线 distinct 门槛判为废品（中位数 0.052 / 0.057）：取值只有约 121 档，边界并列靠列序，而 §4 明文豁免列序打破，所以我不以数学问题划掉，但请流水线按门槛处理，它们的预期分数也应下调。划掉：2 为重复，与种子 1 是同一个函数（ts_std 与 cross_stddev 等价），只改了窗口 40→60。剩 11 个，过门槛。如果它有 alpha，最可能来自换手率口径的 120 日波动（种子 3、1）或带符号的异常放量（种子 12），其次是 120 日量价共趋势（种子 10）；种子 7–9 是 120 样本的相关，独立假设下标准误约 0.09，信号偏弱。'
R:
  - head: 'ts_max(ts_std(ts_std(day_mean(Amt), 40), 40), 40)'
    soundness: 4
    reasons: '快照第 2 个 head（−0.11）。合理度 4：机制清楚（去掉元量纲，只看相对波动），算子核对正确：÷ ts_mean(A,120) 与 ÷ ts_std(A,40) 都是同量纲相除，结果无量纲；sub(log(·), LogFloatCap) 是 log(元/元)；cs_regres 是逐日截面回归残差。对原 head 的残差 |ρ|：v1 0.71、v2 0.60、v4 0.72、v5 0.62，确实改了信号；v3 0.84 与规模控制重合，改动有限。v5 只把外层窗口 80 改为 120（与 v1 同式），是参数变体而非「去掉或替换部件」，不扣分，但不算 R 变体的本意。与已知族 |ρ| 最高 0.27。如果它有 alpha，最可能来自 v1 与 v2 去量纲后的相对波动（残差 0.60–0.71），而不是 v3 的规模修正。'
  - head: 'ts_max(ts_std(ts_std(ts_std(day_mean(Amt), 40), 40), 40), 40)'
    soundness: 4
    reasons: '快照第 3 个 head（−0.21），即 E 位核心 C 外套 ts_max(·,40)。合理度 4：v1 ÷ ts_mean(A,120)、v2 三层 ÷ 二层、v3 减 LogFloatCap、v4 截面回归，都正确去量纲，对原 head 的残差 |ρ| 分别为 0.68、0.33、0.76、0.71，确实改了信号，v2 改动最大。重复提醒（不影响评分）：v1 = ts_max(E 种子 2, 80)，v2 = ts_max(E 种子 1, 80)，v3 = ts_max(E 种子 4, 80)，v4 = ts_max(E 种子 5, 80)，同一轮里 E 位与 R 组评估的是同一批表达式，请 PI 合并时去重；R 组只打合理度，不以此删组。如果它有 alpha，最可能来自 v2（三层与二层之比，即 C 的相对不稳定性），这也是 E 种子 1 的来源。'
  - head: 'ts_std(ts_std(ts_max(ts_std(day_mean(Amt), 40), 40), 40), 40)'
    soundness: 3
    reasons: '快照第 1 个 head（−0.03，本轮最好）。合理度 3：算子核对都正确。v2 的 ts_std(A,40) ÷ ts_mean(A,40) 是 40 日变异系数，分母只在几乎不成交的股票上接近 0，这类股票本就该在端点，cs 排序不被少数爆点主导；v1、v3、v4 都是同量纲相除或对数差。扣分的是机制：v1、v3、v4 对原 head 的残差 |ρ| 为 0.90、0.93、0.94。尺子已经对流动性和规模取了残差，再除以 120 日均值、减 LogFloatCap 或做截面回归，对交易信号几乎不改，所以「去掉水平残渣能再涨 0.1」在这三个变体上站不住。这是机制层面的弱点，不是数学问题，给 3。只有 v2（残差 0.49）是真正的改动。如果它有 alpha，最可能来自 v2 的变异系数结构；其余三个几乎就是原 head。'
summary: 'E 位（核心在残差空间与 R1 相关 0.94，新意只在外围）创新 3、合理 4，划掉 3、4、6 后通过；N 位创新 4、合理 4，划掉 2 后通过；R1、R2、R3 合理度 4、4、3 全部通过；R2 的四个变体与 E 位种子 1、2、4、5 只差一层 ts_max(·,80)，建议 PI 去重。'
