slots:
- type: E
  core: day_ar1_coefficient(Volume)
  hypothesis: '机制:三个 head 都是同一个核心 C0 = day_ar1_coefficient(Volume)(当天 241 根分钟成交量的一阶
    OLS 自回归系数,有界、无量纲)的「水平」平滑:ts_quantile_q75(50 日)、cross_autocorr_s1(30 日)、再套 sigmoid
    + ts_decay_linear。拆解表说明承重的是水平:窗口 25 → 50 → 100 把分数从 −2.57 提到 −1.98 → −1.65(越慢越好),Volume
    换成 Amt 几乎不变(−2.04 / −2.13),去掉 pow_05 不变(必要性 +0.01 ~ +0.04),C0 本身不平滑是 −3.44。水平与已知成交额族的
    ρ 是 −0.51(C0)到 −0.76(q75 平滑之后):它是「成交频率 / 流动性」的代理(成交笔数多、噪声小,分钟量里的日内 U 形占主导,AR1
    就高),而新尺子正好把这个线性、U 形、S 形暴露剪掉,三个 head 剩下的 −1.8 ~ −2.1 就是「没有信息 + 换手成本」的水平。所以这一位不再押
    C0 的水平,把 C0 当作一个探针:C0 高 = 当天成交连续不断地推进(大单被拆小、分笔执行的指纹,Lillo-Farmer 的订单流长记忆),方向由同一天的价格告诉我们。

    算子怎样实现:每个种子原样带着 C0,外围只做「时间序列上的耦合」,不做水平。(1) 种子 1–2、5:cross_corr / cross_regbeta(C0,
    day_sum(Ret), 60 / 120),是该股票自己 60–120 天里「持续成交」与「当天涨跌」的相关或斜率:持续成交总落在上涨日 = 持续吸筹,落在下跌日
    = 持续派发(Llorente et al. 2002 用成交量 × 收益的符号分辨知情交易与对冲交易的同一个思路)。(2) 种子 3、4、9:cross_delay
    把「成交持续在先」(昨日 C0 对今日涨跌)与「成交跟着价格走」(今日 C0 对昨日涨跌)分开,9 是前者减后者;领先才可能是信息,跟随只是追涨杀跌。(3)
    种子 6、7、8:C0 与 |收益|、隔夜跳空(开盘价 / 前收盘 − 1)、对数成交额的日变化的耦合,问持续成交是否出现在大波动日 / 跳空日 / 关注度冲击日。(4)
    种子 10–12:耦合相对自己 120 日历史的 z 分数;耦合 × C0 的 60 日 z 分数(= 该股票自己的「持续度 → 涨跌」斜率乘以今天的持续度冲击,是一个逐股的时间序列预测);C0
    的 60 日 z 分数 × 当天涨跌符号的 20 日累加。(5) 种子 13、14:C0 的 100 日标准差与四分位距,是「持续度自己有多不稳」这个第二阶量(不是水平);本流之外
    B015 批里唯一出现正分数的一族是「成交额方差的波动」(慢变的二阶量),这条是它的出处。(6) 种子 15:cs_first_low40(耦合, LogFloatCap),把耦合放进流通市值最低
    40% 的一段,作为探针(限制套利:机构不愿做的角落)。下一轮拆解去掉这个门槛,就知道分数来自门槛还是来自耦合;审计与定位都应把它当探针看,不是主张。

    为什么和库里已有的不同:库里 C0 的外围只有对 C0 自己的聚合(ts_max / ts_min / ts_quantile / cross_argmax
    / cross_hurst / cross_autocorr_s1 / ts_decay_linear 及嵌套的 sigmoid、pow),没有一个把 C0
    与价格、收益、成交额做滚动相关 / 回归,也没有 cross_zscore、cs_first_* 这类 Partura 新加的算子;耦合量是无量纲的相关系数
    / 斜率,不含 C0 的水平,所以与三个 head(都是水平)的日度秩相关预计低,与已知成交额族预计也低。15 个种子的算子骨架已逐个对照两个库的 5583
    条骨架,都不在库里。

    为什么样本外还会在:来源是「这只股票主要由谁在交易」(机构分笔执行 vs 散户脉冲)这个慢变的结构属性,半年到一年内变化很小;方向性的版本靠大单价格冲击在数日到数周内渐进消化(Bouchaud
    et al. 2004),不依赖某段行情;窗口 60–120 天、再配 EMA 半衰期 20,换手低,15 bp 下不至于被吃光。已知的风险:(a) A 股涨停
    / 一字板日的分钟成交量路径极「平」且当日收益约 +10%,滚动相关可能主要在数涨停次数(涨停基因),这会和波动 / 反转控制相关;下一轮拆解把 day_sum(Ret)
    换成去掉涨停日的收益来检验;(b) 种子 15 的分数可能只是市值门槛。

    数学检查:C0 是 OLS 斜率,有界(|C0| 一般 ≤ 1),分钟序列方差 ≤ 1e-8 或有效点 < 2 时为 NaN(停牌日),覆盖率 0.9995,不是热身期或填充决定的。cross_corr
    分母是 sqrt(var_x · var_y) + EPS,分子分母同阶,没有除以近零的爆点;已知「窗口内没有有效对时返回 0 而不是缺失」,只影响长期停牌的票。cross_regbeta
    的分母 var_x(C0 的 60–120 日方差)> EPS 才出值。种子 8 的 log(day_sum(Amt)) 对 0 成交额给 NaN。无前视:所有量只用
    t 日收盘及以前,t+1 才交易;cross_delay 只取更早的值。热身期 ≤ 120 个交易日。'
