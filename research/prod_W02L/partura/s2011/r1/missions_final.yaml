- type: N
  hypothesis: '机制:订单流的符号持续性,测量方式不被日内 U 形和成交频率污染。B031 批的现象:(1) 三个 head 是 AR1(Volume)
    的水平,Volume 换成 Amt 分数几乎不变(−1.74 / −2.04 / −2.13),说明起作用的是成交强度路径「是否连续推进」,不是单位;(2)
    水平与已知成交额族的 ρ 为 −0.51 ~ −0.76,是流动性代理,而 AR1 序列自己的一阶自相关(head 1)与已知族的 ρ 只有 −0.03 ~
    −0.08,说明 AR1 里有一部分和流动性无关;(3) 原始分钟成交量带一条所有股票共有的日内 U 形,AR1 的大小因此同时取决于「U 形 / 噪声」之比,也就是成交笔数,这正是它成为流动性代理的原因。新想法:换一种测量,读「同方向的成交是否连续出现」(Lillo-Farmer;Tóth
    et al. 2015:机构把大单拆成小单连续执行,买卖方向序列有长记忆),而不是成交量本身的平滑程度;分笔执行比例高的股票,这个量高,而且它不随成交频率机械地变化。

    算子怎样实现:(a) 带符号的成交流 mul(sign(Ret), Volume)(分钟收益的符号当作买卖方向的近似,没有逐笔数据),再取 day_ar1_coefficient:方向不连续时,U
    形被符号翻转打散,所以不再是流动性水平;种子 3、4、8、12 配时间聚合(cross_mean / ts_quantile_q75 的 20–120 日窗口),使它成为慢变量;种子
    9 用 Ret × Volume(带幅度的流)。(b) 种子 5:同窗口的带符号 AR1 减去不带符号的 AR1,差是「方向上的持续性超出成交量本身持续性」的部分,U
    形与成交频率在两项里相消。(c) 去季节:in_logchg(Volume, 1)(对数差分去掉 U 形趋势,种子 1、2、13)与 Volume − 同分钟
    20 日均值(种子 6、14,用减法而不是除法,避免除以近零)后再取 AR1:读的是「超出常态的成交冲击是否延续」。(d) 条件与状态:种子 15 = 带符号持续性
    × 近 20 日收益方向(持续的单边执行是否继续推动价格:知情吸筹继续、噪声反转);种子 7 = 带符号持续性相对自己 120 日常态的变化;种子 11 在已知成交额族十分位内排序(对流动性族的非线性中性化,线性
    / 三次中性化剪不到的交互部分);种子 10 把它放进流通市值最低 40% 的一段,作为限制套利的探针(拆解里去掉门槛就知道分数来自哪里)。

    为什么和库里已有的不同:库里 day_ar1_coefficient 的输入只有原始字段(Volume、Amt、Ret、High、Low ...)和「分钟份额」div(in_slice(F),
    in_sum(in_slice(F)))(份额仍保留 U 形),没有一个是带符号的流、对数差分、或减去同分钟均值之后的序列;库里也没有把 day_corr
    套在带符号流上,更没有 cross_mean / cross_zscore / cs_first_* / cs_bucket_rank 作外围。15 个种子的骨架逐一对照了两个库的
    5583 条骨架,都不在库里。它度量的是「方向的持续」而不是「成交量的平滑」:与三个 head 的日度秩相关预计在 0.2 ~ 0.5,低于 0.7 的库禁令线;与已知成交额族预计
    < 0.5(种子 5、11 就是为压低这一项而设)。

    为什么样本外还会在:来源是参与者结构(机构分笔执行的占比)这个慢变属性,15 bp 的成本下靠 60–120 日窗口 + 20 日半衰期的低换手撑住;方向性的版本(种子
    15)靠大单价格冲击逐步消化。风险:(a) 带符号流在价格不动的分钟为 0,对薄票零值多、AR1 偏低,与成交频率有关;种子 5(相减)和 11(桶内排序)是针对这一点;(b)
    与 20 日反转控制可能有交互,新尺子只剪各个控制的线性 / U 形 / S 形,剪不掉交互,种子 15 由此得分的话要在下一轮拆解里确认不是反转的变相。

    数学检查:sign(Ret) 在价格不动的分钟为 0,对应流为 0(不是 NaN),AR1 在整天全 0 或方差 ≤ 1e-8 时为 NaN(停牌),覆盖率应与
    head 相同(~0.9995)。in_logchg 在成交量为 0 的分钟给 NaN,薄票的相邻有效对很少,单日 AR1 只由很少的点估出,但 |φ| ≤
    1 有界,不会爆点,并被 60–120 日的均值 / 分位数 / EMA 平均掉。Volume − cross_mean(Volume, 20) 没有除法;cross_mean
    的窗口含当天、不含未来。cross_zscore 的分母是窗口标准差 + EPS,窗口内一动不动时代码把它置 0 而不是放大。没有除以近零的量,面板不是常数。无前视:所有量只用
    t 日收盘及以前,t+1 才交易;热身期 ≤ 120 个交易日。'
