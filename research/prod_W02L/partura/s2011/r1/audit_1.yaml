    reasons: '创新度4。核心 C0 = day_ar1_coefficient(Volume) 自己与流动性 liq 0.50、已知族 known 0.51 相关(相关度表的「≥0.5 换写法」标记),所以新意只能来自外围的耦合。15 个种子与三个 head 的原始秩 |ρ| 在 0.04–0.27 之间(最像的是 a13 与 cross_autocorr_s1 head 的 0.27、a8 与 ts_decay_linear head 的 0.25),残差 |ρ| 最大 0.37(a14);与 5 个控制的 |ρ| 除 a15 的 size 0.75 外都低于 0.5。库里 228 条含 C0 的表达式里,没有一条把 C0 与 day_sum(Ret)、abs_、Close、Amt 做滚动相关或回归,C0 的 ts_std 与 q75 减 q25 形式在库里也无命中,所以耦合是新对象。合理度4。机制是「成交持续性与当日涨跌同步」,即 Llorente 等(2002)量价关系在个股时间序列上的版本,说得通。逐个算子核对:cross_corr、cross_regbeta、cross_zscore、cross_mean、ts_std 都沿日轴(dt_cross.py;ops_ext.py:208);cross_delay 按日平移(dt_cross.py:150);cs_first_low40 是字典序门槛而非掩码(ops_ext.py:357);cross_regbeta 的分母 var(C0) 由 EPS=1e-9 守护,只有 C0 在整个窗口内几乎不变时才爆,这种情形少见,不算数值伪影;无前视(窗口都截止于 t,t+1 才交易);无禁用算子(ts_spearman、nt_*);a7 的分母是前收盘价、恒正,无爆点;热身不超过 120 日。不是数学问题、但要记下的风险:sumRet 与 |ret| 被一字涨停日(约 +10%)主导的可能(a1–a4、a6、a11、a12);a15 的 size 0.75 来自门槛函数,三次 size 残差去不掉阶跃,所以它的分数可能只是小盘门槛;a6 与 s2012 的 a 位种子字面相同,但不是 head 也不是控制,不划,只记录。核心与每个控制的 |ρ| 都低于 0.8(最大为 known 0.51),E 位门槛通过。无种子划掉:没有 |ρ|≥0.7 或控制 |ρ|≥0.8 的种子,没有数学问题,骨架与外围都与库无命中。如果它有 alpha,最可能来自成交持续性与收益的同步(量价关系),或限制套利的小盘区间;若 a15 领先,来源多半是门槛而非耦合。'
