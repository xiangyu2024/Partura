    reasons: '核心 day_centroid(Amt) 是 Partura 新加的算子(ops_ext.py:155,|x| 的日内重心归一化到 [0,1]),快照 9 个 head 里没有一个含它。15 个种子与 head 的最大原始 |ρ| 为 0.47(种子 12,最像的 head 是 ts_decay_linear(sigmoid(ts_quantile_q75(pow_05(day_ar1...)))) 一族),残差最大 0.45;与 5 个控制的 |ρ| 最大 0.45(种子 12 与流动性),全部低于 0.8;核心本身与 5 个控制最大 0.20。创新度 4 而非 5:成交时点结构在库里没有对应(库的 cross_corr 全是原始日内统计量),但 15 个种子是同一核心套同一个 cross_regalpha 外壳的变体,新的是一个核心,不是 15 个想法。合理度 4:算子链逐个核对——day_centroid 在 tot 为零时由 _day(…, tot>0) 给 NaN,值域 [0,1] 有界;cross_regalpha 即 rolling_ols 的截距,斜率只在 var_x > EPS(1e-9)时计算,centroid 的 241 日方差远大于它,不爆点;cross_zscore 的分母 sd+EPS 且窗口相对尺度门槛在,无前视;cross_delay 只取更早的值,t+1 交易。需要记下的一点:截距 = mean(y) − β·mean(x),而 centroid 不居中(水平约 0.5),截距是在 x=0 处的外推,β 的估计噪声会被 mean(x)/sd(x) 放大,所以截距读数的一部分是斜率噪声而不是纯漂移。这是解读问题,不是数学错误也没有爆点,不挡,留给拆解检查。划掉两个种子:11 是种子 1 的整体时移,因为 cross_delay 同时作用于 x 与 y,cross_regalpha(delay(x,1), delay(y,1), 241) = delay(cross_regalpha(x,y,241), 1),它的相关度表 7 列与种子 1 几乎逐项相同(head 0.43、残差 0.39、liq 0.30、vol 0.28、known 0.30、size 0.02,rev 0.01 对 0.02),是同一个秩;15 与种子 3 只差窗口 180 对 120,七列相关度全部相差不超过 0.01,同一个秩(按 r2 的重复口径划后者)。核心来源:核心不是任何 head 的子树(快照 heads 表里没有 centroid),按 missions 规定它应来自定位共性表或核心卡;我按指令没有读共性表,这一条请流水线核对,我没有据此划位。如果它有 alpha,最可能来自成交时点的慢变成分(尾盘集中 = 机构收盘定价需求、指数基金调仓这类参与者结构),而不是 2 日前收益的水平;种子 3、9、13 的 120 / 241 窗口与 EMA、差分版本就是在检验这一点。'
  - slot: b
    novelty: 4
