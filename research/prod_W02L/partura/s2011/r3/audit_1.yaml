    struck_seeds: []
    reasons: '14 个种子与快照 head 的最大原始 |ρ| 为 0.55(种子 14,cross_regbeta 版本),其余都在 0.50 以下;与 5 个控制的最大 |ρ| 为 0.37(种子 3 与已知族),全部低于 0.8。创新度 4:x 状态(成交额 60 日 z 分数、买卖失衡 day_signed_ratio(ops_ext.py:122)、成交额基尼 day_gini、day_std(Ret)、尾部比 day_es_ratio_hi、平盘占比 day_flat_ratio、|收益|、偏度、成交额日变化)在库里都没有对应;6 个 head 全是 AR1 水平或自相关,库里也没有 cross_regalpha 作外层。新意在状态变量和截距读法上,不是换一个 head 的写法。合理度 4:算子链逐个核对——cross_zscore 的窗口含当天,当天收盘已知,t+1 交易,无前视;day_signed_ratio 的分母 den 有 den>0 门槛且 clamp 到 1e-30,不除以近零(分母计入零收益分钟,是流动性偏向,不是数学问题);day_gini 对 |x| 排序,无有效点给 NaN;day_es_ratio_hi 在分位数近零时给 NaN 而不是 1e4 量级的爆点;day_flat_ratio 对全部 NaN 的日给 NaN,若停牌日的 Ret 未被掩码,停牌日会以 flat=1 进入回归,请流水线核对停牌掩码(V2 已有停牌掩码,若作用于 Ret 则无问题);log(0) 的 −∞ 由 isfinite 掩码排除。与 a 位同一个解读问题:day_std、day_flat_ratio、day_gini、day_es_ratio_hi、day_signed_ratio 的 241 日均值远离 0,截距是外推,读数的一部分是 β 噪声乘均值的放大,「截距 = 基础漂移」这一机制要靠 z 分数版本(种子 1、2、8)与分桶去均值版本(种子 12)来校正。不划种子的理由:没有一对种子的七列相关度全部相差不超过 0.01(r2 的重复口径)。种子 14 与 1 的 vol 相差 0.09,种子 12 与 1 的 size 相差 0.23,都不是重复;种子 13 是种子 1 的 EMA-20 平滑,七列相差在 0.03 以内,按 r2 同口径保留(它是换手变体,分数读数会主要反映平滑,拆解时要分开看)。如果它有 alpha,最可能来自放量与买卖失衡这些状态在一年内的慢变部分与收益的滞后关系(信息消化,Llorente 等 2002 与 Chordia 与 Subrahmanyam 2004 的同一思路);若水平类种子(种子 6、7)分数与之相当,则来源是流动性本身而不是状态。'
