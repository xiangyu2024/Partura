- type: N
  hypothesis: 机制:个股「基础漂移」读数。把 y = 昨日收益对一个日度状态变量 x 做 241 日滚动 OLS,取截距:当 x 取零时昨日收益的均值,即剥掉『收益随状态
    x 而变』之后的慢收益漂移。上一轮 N 位唯一出现正分的是 cross_regalpha(day_centroid(Amt), 2 日前收益, 241)(+0.32
    / +0.44)与 E 位里 cross_regalpha(L1, 昨日收益, 241)(+0.19 / +0.71):两个都是截距型,而同批的相关型 /
    水平型 / 自相关型全为负。这个 N 位问:承重的是截距(基础漂移)本身,还是 centroid / L1 这两个特定的 x?所以把 x 换成与它们无关的状态:成交额冲击(60
    日 z 分数,放量日的收益由注意力和事件主导,剥掉之后留下正常成交量时的漂移,Gervais 等 2001 高成交量溢价的反面)、买卖失衡(day_signed_ratio)、成交额集中度(day_gini)、日内波动(day_std(Ret))、尾部比(day_es_ratio_hi)、平盘分钟占比(day_flat_ratio)、|当日收益|、日内收益偏度、成交额日变化;y
    取昨日收益为主,另有同期和滞后 5 日;统计量有截距、斜率、EMA 平滑、分桶去均值。其中 day_std(Ret) 作 x 的版本是「波动调整后的漂移」(类似特质收益;与波动控制不同,因为是回归截距而不是波动水平)。为什么和库里不同:5583
    条库表达式里没有 cross_regalpha 作外层,也没有 day_gini / day_signed_ratio / day_flat_ratio /
    cross_zscore(Partura 新算子);库里的 cross_corr 全是原始日内统计量与 nt_ 算子。为什么样本外还会在:一年窗口的截距是慢变量(换手低,15
    bp 吃得少);剥离状态后的慢漂移是特质动量,6–12 个月的信息消化,文献上(Jegadeesh–Titman,Blitz 等的残差动量)比原始动量稳;不依赖某段行情。风险:截距与
    241 日平均收益高度相关(x 均值接近 0 的状态变量如 z 分数、日变化,截距 ≈ 平均昨日收益),信号可能就是一年动量,会与已知族 / 反转控制有重合(相关度表里看);这是对「承重的是不是截距本身」的直接检验:若
    z 分数 / 日变化类种子与 day_std(Ret) 类种子(截距与平均收益差很大)分数相当,承重的是动量不是 x。数学检查:OLS 分母 var(x)+EPS,x
    为日度统计量,方差远大于 EPS;窗口内无有效对时给 NaN;没有除以近零的量;无前视(y 取 cross_delay 更早值,z 分数窗口含当日、收盘后已知,t+1
    交易)。
