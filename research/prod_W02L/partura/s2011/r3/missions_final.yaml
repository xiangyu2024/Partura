  hypothesis: 机制:核心 day_centroid(Amt),成交额在日内的重心(0=开盘,1=收盘):尾盘集中的成交 = 知情 / 机构收盘定价需求;开盘集中
    = 隔夜信息释放。上一轮 N 位里正分的候选都含它:cross_regalpha(day_centroid(Amt), 2 日前收益, 241) 得 +0.32(train
    +0.32 / valid +0.44,两段同号,是目前整个流里最稳的读数),cross_corr(centroid, 昨日收益, 241) +0.27(+0.32
    / +0.27)。共性表里含 day_centroid(Amt) 的 15 个候选均值 −1.34,不含 −2.48(p 0.001)。截距读法:cross_regalpha(x,y,d)
    是 y 对 x 做 d 日滚动 OLS 的截距 = 「重心取零时的滞后收益均值」,剥掉随成交重心变化的收益之后的一年期收益漂移(慢动量 / 反转;与 20
    日反转控制不同:窗口 241 日、滞后 ≥ 1 日、且经过回归剥离)。本轮核心固定为 day_centroid(Amt),外围换成之前没见过的:y 取滞后
    1 / 3 / 20 日收益、|收益|、L1(日度成交碎片化)、成交额冲击;统计量换成回归斜率、t 值;窗口 120 / 180;241 减 60;滞后 centroid;分桶去均值(剪已知成交额族水平);EMA
    20 日平滑(降换手)。为什么和库里不同:day_centroid 是 Partura 新加算子,库里 0 次;cross_reg* 套在日内统计量上库里没有。上一轮已评分的含
    centroid 候选外围只有 cross_corr / cross_regalpha(滞后 1、2 日收益, 241);本轮外围算子集合与之不同。为什么样本外还会在:正读数
    train / valid 同号(+0.32 / +0.44),这是流内唯一不靠 valid 单边的读数;一年窗口让换手低;成交时点结构(尾盘集中)是慢变的参与者属性(机构占比
    / 指数基金调仓)。风险:centroid 在涨停一字板日取极端值;day_centroid 分母 Σ|x|=0 时给 NaN;窗口内有效点少的票给 NaN;OLS
    分母 var(x)+EPS,centroid 方差远大于 EPS。无前视:全是 t 日收盘及以前,y 取 cross_delay 更早值,t+1 交易。
