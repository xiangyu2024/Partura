    不承重(去掉后 −2.02,必要性 +0.02);Volume 换 Amt 不变(−2.04)。水平与已知成交额族的 ρ 约 −0.76,那是它被挡在 head
    之外的原因。变体把窗口放到 200 日,并在成交额族十分位内去均值(与 R 位第一组同一个办法:分桶去均值把已知族的水平剪掉,而 −0.76 正是这一块)。
  variants:
  - cs_bucket_demean(ts_quantile_q75(pow_2(day_ar1_coefficient(Volume)), 200), cross_mean(day_std(Amt),
    30))
- head: pow_2(day_ar1_coefficient(Close))
  why: 这个 head 没有自带时间平滑(拆解:子树 day_ar1_coefficient(Close) 单独 −2.44,pow_2 不承重),分数全靠书的
    EMA;Close 价格水平的 AR1 接近 1,日度估计是一个很吵的近单位根回归系数。Close 换 Vwap 更差(−3.10),说明读的是收盘价那一档的信息。变体做三件事:加慢平滑(半衰期
    60 日与 120 日的 EMA),把源头换成价格对数变化的 AR1(分钟收益的一阶自相关 = 买卖价差弹跳 / Roll 度量,平稳、有界,不是近单位根)。
  variants:
  - cross_ema(day_ar1_coefficient(Close), 60)
  - cross_ema(day_ar1_coefficient(Close), 120)
  - cross_ema(day_ar1_coefficient(in_logchg(Close, 1)), 60)
