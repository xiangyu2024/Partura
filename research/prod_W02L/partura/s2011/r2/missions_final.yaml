- type: N
  hypothesis: '机制:个股层面「成交量冲击 / 买卖失衡 → 下一日收益」的动态关系,是信息不对称程度的个股特性。Llorente、Michaely、Saar
    与 Wang(2002):信息不对称高的股票,放量日的收益倾向于延续;以对冲为主的成交,放量日的收益倾向于反转。Gervais、Kaniel 与 Mingelgrin(2001)的高成交量溢价,以及
    Chordia 与 Subrahmanyam(2004)的订单失衡对次日收益,是同一条线。这里把它写成每只股票自己一年窗口的时间序列耦合(滚动相关),而不是截面排序,所以量的是「这只股票的量价动态属于延续型还是反转型」这一慢变属性:相关系数无量纲,不含成交额或市值水平。


    这一批的什么现象启发了它:B031 / B032 共性表里 day_sum(Ret) 的均值差 +1.08(含它的 21 个候选均值 −1.93,不含的 −3.02),与
    day_ar1_coefficient(Volume) 本身的 +1.16 几乎一样大。上一轮 E 位里,把 AR1(Volume) 与当日 / 昨日涨跌做
    60 ~ 120 日滚动相关的一族(−0.72 ~ −1.2)是该批唯一明显好于水平类(−1.7 ~ −2.7)的;但 E 位核心固定为 AR1(Volume),分不开「承重的是
    AR1 还是与涨跌的耦合」。这个 N 位把 AR1 换成最朴素的成交额冲击 / 失衡变量,只保留「与涨跌的领先 / 同期耦合」这个骨架,并把窗口放到 241
    日:一年窗口的换手比 60 ~ 120 日低数倍,基线(没有信息的信号约 −1.7 ~ −2.1,主要是换手成本)会随之抬高。


    算子怎样实现:成交额冲击 = log(day_sum(Amt)) 的 60 日 z 分数(今天的成交额相对这只股票自己近 60 日是否异常,去掉持久的截面水平);买卖失衡
    = day_signed_ratio(Ret, Amt)(上涨分钟的成交额占比减下跌分钟的占比,取值 [−1, 1],没有逐笔数据时的净买入代理)。(1)
    种子 1:昨日「涨跌 × 成交额冲击」与今日涨跌的 241 日相关,是 Llorente 回归里交互项系数的无量纲版本(放量日是否延续);种子 8 是同一对象的回归斜率版本。(2)
    种子 2 ~ 4:昨日成交额冲击(水平 z 分数 / 日变化)对今日涨跌的领先相关,种子 3 是同期版本,种子 4 用日对数变化。(3) 种子 5、11:昨日失衡、昨日「失衡
    × 成交额冲击」对今日涨跌的领先相关(Chordia–Subrahmanyam 的失衡延续)。(4) 种子 9:成交额重心 day_centroid(Amt)(0
    = 开盘,1 = 收盘)与昨日涨跌的相关,尾盘集中的成交是否跟随前一日的方向。(5) 种子 10:昨日「成交额加权分钟收益减等权分钟收益」(资金经历的收益与时间平均收益之差)对今日涨跌的领先相关。(6)
    种子 6、7、12 是对照:6 是失衡水平的 60 日 EMA,7 是「成交额冲击 × 涨跌符号」的 120 日均值(带符号的放量,没有耦合),12 是种子
    2 在已知成交额族十分位内排序;如果水平类种子与耦合类种子得分相当,说明承重的不是耦合。


    为什么和库里已有的不同:库里 210 条含 cross_corr 的表达式,输入都是原始日内统计量(day_skew、day_max、Ret 自身等)和 nt_
    算子,没有一条把「昨日量冲击 / 失衡」用 cross_delay 与 day_sum(Ret) 做滚动相关;cross_zscore、day_signed_ratio、day_wmean、day_centroid
    在库里出现 0 次(这些是 Partura 新加的算子)。12 个种子的算子骨架已逐个对照 5583 条库骨架,都不在库里。与已知成交额族(cross_mean(day_std(Amt),
    30))不同:这里的量是相关系数,不含成交额水平;与 20 日反转控制不同:领先耦合是一年窗口里「昨日状态对今日收益」的相关,不是近期收益的排序。


    为什么样本外还会在:信息不对称的程度(散户占比、机构分笔执行占比、公告密度)是慢变属性,半年到一年内变化很小;延续型股票的价格对大单的消化是渐进的(Bouchaud
    等 2004),不依赖某段行情;一年窗口让换手低。已知风险:(a) 一字涨停日成交额小、收益约 +10%,耦合可能主要在数涨停次数(与波动 / 反转控制相关),要在相关度表里看残差;(b)
    241 对观测的相关系数标准误约 0.065,只有截面差异大于估计噪声才有用;(c) day_signed_ratio 用分钟收益符号近似买卖方向,与日收益同期共线(接近
    1),所以只用领先版本。


    数学检查:log(day_sum(Amt)) 对成交额 ≤ 0 给 NaN(停牌日),不会是 −inf 进入 z 分数;cross_zscore 的分母是窗口标准差
    + EPS,窗口常数时置 0;cross_corr 分母 sqrt(var·var) + EPS,窗口内无有效对时返回 0(已知行为,只影响长期停牌的票);cross_regbeta
    只在 var(x) > EPS 时出值,种子 8 的 x 是「涨跌 × z 分数」,方差远大于 EPS;day_signed_ratio 的分母 Σ|Amt|
    为 0 时 NaN;day_centroid 分母 Σ|x| 为 0 时 NaN。没有除以近零的量。无前视:所有量只用 t 日收盘及以前,t+1 才交易,领先耦合里的
    cross_delay 只取更早的值,窗口含当日、不含未来。热身期 ≤ 242 个交易日。'
