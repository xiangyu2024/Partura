  core: day_ar1_coefficient(in_logchg(Volume, 1))
  hypothesis: '机制:核心 L1 = day_ar1_coefficient(in_logchg(Volume, 1)),即当天分钟成交量「对数差分」序列的一阶
    OLS 自回归系数。对数差分去掉了日内 U 形趋势与成交量单位;若分钟成交量 = 慢变的底 + 独立的瞬时噪声,则 L1 约等于 −0.5 × 噪声占比(纯噪声
    −0.5,没有噪声趋近 0),所以 L1 读的是「成交量路径里瞬时噪声占多大」,不是成交量水平。这和 B031 / B032 批里全部 head 的对象不同:它们都是
    AR1(Volume) 的水平平滑,与已知成交额族 |ρ| 0.51 ~ 0.76(流动性代理),新尺子剪掉这一块之后剩 −1.7 ~ −2.7,即「没有信息
    + 换手成本」的基线。


    证据(第 1 轮,只用 train / valid):对 head `cross_autocorr_s1(pow_05(day_ar1_coefficient(Volume)),
    30)`(−1.80)只换源头,L1 的 60 日自相关 `cross_autocorr_s1(L1, 60)` 得 −0.64(train −0.12 /
    valid −0.64),与已知族 ρ −0.20、与三个 head ρ 0.08;同样的换法用「减同分钟 20 日均值」得 −2.45、「带符号成交流」−2.09、「C0
    的 60 日 z 分数」−2.11,都在基线上。五种换源头只有 L1 明显好于基线;上一轮 N 位里分数最好的候选(−1.79,`sub(cross_mean(L1,
    20), cross_mean(L1, 120))`)也含 L1。所以 L1 是这两批里目前唯一有迹象的底,这个位围着它长,而且不再碰 L1 的水平。


    为什么有迹象:L1 的日度序列如果自己有一阶自相关,说明这只股票的成交结构在一段时间里单向漂移(参与者结构切换:题材 / 事件 / 机构进出 / 做市行为变化),而不是「固定特性
    + 日度估计噪声」。前者慢变且有内容,后者只是流动性与有效分钟数。


    算子怎样实现:(1) 二阶估计量,不碰 L1 的水平:种子 1 自相关外套半衰期 60 日的 cross_ema;种子 2 是 241 日自相关减 60 日自相关(长期持续减短期持续);种子
    3 是 60 日 Hurst 指数;种子 4 是 20 日滞后的相关(月度持续性);种子 10 是 5 日差分的自相关;种子 11 是 5 日均值相对自己
    241 日的 z 分数。(2) 与别的日度量做一年窗口的耦合:种子 5 ~ 9、15 是 L1 与当日涨跌 / 昨日涨跌 / |涨跌| / 成交额日变化 /
    C0 的 241 日滚动相关,以及昨日 L1 对今日涨跌的相关(领先)。第 1 轮里 C0 与涨跌的 60 ~ 120 日耦合是该批最好的一族(−0.72
    ~ −1.2),这里把对象换成 L1 并把窗口放到一年,换手比 60 日窗口低数倍。(3) 对「分数只是别的东西」的探针:种子 12 把上市时间最短的 10%(ListAge)排到最后再取自相关;种子
    14 在已知成交额族十分位内排序;种子 13 减去 C0 的自相关。若这三个种子分数与种子 1 ~ 2 几乎相同,来源就不是次新股或流动性。


    为什么和库里已有的、和以前见过的不同:5583 条库表达式里没有 in_logchg,也没有 cross_zscore / cross_ema / cross_hurst
    套在 AR1 上的结构;库里 cross_autocorr_s1 只套在 pow_05(AR1(Volume)) 上;15 个种子的算子骨架已逐个对照 members.csv
    里 5583 条骨架,都不在库里。定位表里已见过的含 L1 的候选只有对 L1 水平的 cross_mean 平滑与「20 日均值减 120 日均值」(上一轮
    N 位 GP);这里的外围全是二阶量(自相关、Hurst、滞后相关、差分自相关)与一年窗口耦合,没有一个对 L1 的水平做平滑。与三个 head 的原始秩相关预计
    < 0.3(R 位里 cross_autocorr_s1(L1, 60) 实测 0.08)。


    为什么样本外还会在:参与者结构的 regime 持续性是慢属性;一年窗口加半衰期 20 日的 EMA 让换手很低,15 bp 成本吃不光;不依赖某段行情。已知风险:(a)
    L1 的日度估计依赖有效分钟对数(成交量为 0 的分钟给 NaN),薄票有效对少、估计噪声大,自相关因此与流动性有关(R 位实测与已知族 |ρ| 0.20,不高),种子
    12 / 13 / 14 是探针;(b) 次新股上市后一年内成交结构系统性漂移,自相关可能只是「次新」,种子 12 排除之;(c) 一字涨停日分钟成交量路径极平,L1
    缺失或极端,耦合种子(5 ~ 9、15)可能在数涨停次数,会和波动 / 反转控制相关,表里要看。


    数学检查:day_ar1_coefficient 是 OLS 斜率,有效对 ≥ 2 且分钟序列方差 > 1e-8 才出值,|φ| 有界,不是爆点;in_logchg
    对成交量 ≤ 0 的分钟给 NaN,不下溢;cross_autocorr_s1 与 cross_corr 的分母是 sqrt(var·var) + EPS,分子分母同阶;窗口内无有效对时返回
    0(已知行为,只影响长期停牌的票);cross_hurst 窗口标准差 < 1e-9 给 NaN;cross_zscore 窗口常数时置 0;种子里没有除法,没有除以近零的量。无前视:所有量只用
    t 日收盘及以前,t+1 才交易,cross_delay 只取更早的值。热身期 ≤ 242 个交易日,覆盖率与 head 同量级。'
