slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [3, 4, 7, 8, 10, 12]
    reasons: |
      核心 ts_kurt(day_es_ratio_lo(Open), 10) 确实是快照 head prods2059Pr2a_Ea 的子树(整条 head 为 cross_max(cs_first_high20(ts_kurt(day_es_ratio_lo(Open),10), ...), 241))。核心与五个控制的 |ρ| 最大 0.414(vol),低于 0.8,过核心门槛。本流本位只有这一个 E 位;核心与 r2 用过的 day_es_ratio_lo(Open) 不同,未超过每核心 2 个 E 位的上限。12 个外围种子与 loc.json 里已评分候选的字符串比对无精确重复。
      划掉的种子:3、4、7、8、12 对 Pr2a head 的原始 |ρ| 为 0.82、0.93、0.76、0.93、0.95,均 >= 0.7,按规则自动划掉。种子 10 的流水线门槛为「废品」,覆盖率 0.663,即约三分之一的股票日算不出;它是 cross_regres(X, Y, 120) 的 rolling_ols 取末日残差,要求末日配对有效(common.py 643-680),覆盖率过低属于定义上的系统性缺失,按 §4「定义坏掉」划掉。没有种子的控制 |ρ| 达到 0.8。
      保留 1、2、5、6、9、11 共 6 个,>= 4,通过。
      创新度给 3 而不是 4:六个保留种子都是同一条核心(10 日峰度序列)外面套另一种 241 日或 120 日时间聚合(cross_quantile_q75、cross_mean、cross_med、cross_decay_linear、cross_zscore),或再加一层 cs_bucket_zscore 市值分组。与快照的原始 |ρ| 为 0.17 到 0.61;种子 1、2、6、11 最接近的是 M3 的 ts_quantile_q75(...day_ar1_coefficient(Volume)...) head,不是 Pr2a,所以并不是换了写法的复制。但 PI 自己的拆解认为 ts_kurt 才是 Pr2a 里起作用的部分(此处我没有复核拆解数字),本位真正新的只有外层聚合,所以给 3。
      合理度给 4,数学上没有问题:day_es_ratio_lo 在分位数绝对值小于 1e-8、或无分钟低于分位时输出 NaN(ops_ext.py:676 与 _es_ratio),正价格下不会出现除零爆点;cross_* 与 ts_* 经 rolling_windows 左侧补 NaN 做因果滚动(AlphaCube common.py 433-444),没有 shift 类算子;cs_bucket_zscore 以 LogFloatCap 分十档(ops_ext.py:482)。机制说得通。注意 PI 写的「慢变属性」只对外层 241 日窗口成立,核心本身只有 10 日窗口,10 个值的峰度对单日极端值很敏感,这不是挡的理由,但 PI 不应把它当成慢变量来解释。种子 11 的 distinct 只有 0.66(截面上有大量并列),保留,GP 端请留意。
      如果它有 alpha,最可能来自:某只股票在近 10 日内出现的一次日内左尾闪崩(极端下探)之后的承接与反转;另一种可能是它只是波动的代理(vol 控制 |ρ| 0.41),残差后仍有信号才算数。

  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [5, 6]
    reasons: |
      N 位的想法是把 head 的读法「某只票在 241 日内最极端的一次日内尖峰」(cross_max(ts_kurt(·,10),241))推广到别的日内形状量与别的字段上。内层换成收益的尾形 day_es_ratio_hi(Ret) / day_es_ratio_lo(Ret)、成交量加权的波动 day_wstd(Ret,Volume)、大单方向 day_topw_mean(Ret,Volume)、成交额加权均值 day_wmean(Ret,Amt)、收盘的右尾 day_es_ratio_hi(Close),以及 ts_skew / ts_std 的内层形状矩。
      划掉:种子 5 为 lo(Low)、种子 6 为 lo(Vwap),对 Pr2a head 的原始 |ρ| 为 0.93、0.90,均 >= 0.7,按规则自动划掉。Low、Vwap 的左尾与 Open 的左尾是同一个价格水平上的同一度量,属于明显度量同一个东西的换皮。
      保留 1、2、3、4、7、8、9、10、11、12 共 10 个,>= 4,通过。控制方面没有种子的 |ρ| 达到 0.8。种子 3、8、9 的 size 控制 |ρ| 为 0.49、0.52、0.53,超过表中 0.5 的提示线,但奖励已经对市值做了残差,而且这三个种子的内层是成交量加权的波动,与市值不是同一个东西,保留。
      创新度给 4:种子 1、2、7、12 用的是收益的尾形与偏度,与库里 head 的原始 |ρ| 为 0.08 到 0.23,是真正不同的信息;种子 3、4、8、9、10 用的是放量分钟的波动、大单方向、成交额加权收益,与 head 原始 |ρ| 为 0.35 到 0.54,和 vol 控制 |ρ| 最高 0.30 左右。外层模板 cross_max(ts_kurt(·,10),241) 与 Pr2a 同形,扣 1 分。我没有在可读文件里找到库里有同骨架表达式(grep 未命中),骨架是否重复以 GP 库禁令为准。
      合理度给 4,数学检查:day_es_ratio_hi(Ret) / lo(Ret) 的分母是收益的分位数,守卫阈值 1e-8 远小于分钟收益的常见量级,只在精确为零时变 NaN(ops_ext.py:665-685),没有近零分母爆点。day_wstd、day_wmean 在成交量或成交额全零时为 NaN(ops_ext.py:109-120、621-633)。day_topw_mean(Ret, Volume) 在整日成交量为零时 thr = 0,取全部分钟收益的均值,返回 0 而不是缺失(ops_ext.py:635-643),种子 4 在零成交日可能有偏置,但只在零成交日出现,不足以支配截面,保留。全部 cross_*、ts_* 为因果滚动,没有前视。
      机制可以说:被极端事件(大单砸盘、涨跌停附近的放量)光顾过的票,其流动性提供者要求持续补偿。如果它有 alpha,最可能来自成交量加权的分钟波动(种子 3、8、9)读放量时段的风险补偿,或收益的厚尾 / 跳跃频率(种子 1、2、7、12)的慢变属性,而不是价格水平本身。

