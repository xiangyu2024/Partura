- type: E
  core: day_es_ratio_lo(Open)
  hypothesis: '机制:day_es_ratio_lo(Open) = 当天分钟开盘价里,低于 5% 分位的那些分钟的均值除以该分位数,是「日内低价端有多厚」,即日内下探的深度,
    与价格水平无关(是比值,>0 且接近 1)。它在共性表里富集最明显(含它的 15 个候选均分 -1.52,不含 -2.36,p 0.009);第 1 轮 Pr1a
    的 最好候选 cross_regbeta(day_max(Open), day_es_ratio_lo(Open), 60) 为 -0.43,是本流迄今最高,说明核心里有东西,但外围只试过「对日内高点做
    滚动回归斜率」这一种写法,且没有一个过线。本轮的核心不变,外围换成三类以前没见过的写法: (1) 时间序列形状:cross_stddev / cross_tail_mean_q25
    / cross_max / cross_min / cross_autocorr 读「下探深度的稳定性与极端程度」, 对应的机制是:日内被砸到明显低价又被承接(流动性提供者被补偿),经常发生的票是被短期流动性冲击反复光顾的票,冲击后的反弹溢价慢变;
    (2) 与成交的耦合:cross_corr(核心, 当日收益 / 成交额, 40) 读「下探发生在跌的日子还是涨的日子、放量还是缩量」,下探配放量=恐慌抛售后被吸收;
    (3) 上下对称:核心减去 day_es_ratio_hi(Open) 或相除,读价格分布左右尾不对称(与第 1 轮 Nb 在 Ret 上的做法不同,这里读的是价格水平分布,不是收益)。
    与库里已有的不同:两个库的 5583 个骨架里只有 day_es_ratio_lo 这类算子在库建成后才有,库里没有任何含它的表达式;外围用 cross_corr
    / cross_stddev / cross_tail_mean_q25 / cross_autocorr,而 Pr1a 见过的只有 cross_regbeta
    + day_max 的组合,外围算子集合不同。 为什么样本外还会在:这是在读个股的日内流动性冲击频率与深度,由持仓结构与做市深度决定,变化慢,60 日窗口使换手低;不依赖某段行情方向。
    数学检查:分位数近零时 day_es_ratio_lo 返回 NaN(已处理,价格是正的后复权价,不会近零);无除零爆点;无前视,全部只用 t 日及以前;最长窗口
    60 日。 风险:核心是价格分布形状,与波动控制中度相关;奖励已去掉线性 / U 形 / S 形暴露,剩下看运气,若本轮仍无 head,则下一轮不再押这个核心。'
