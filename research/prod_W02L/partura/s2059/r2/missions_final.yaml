- type: N
  hypothesis: 机制:知情大单的方向。读「成交最重的那 10% 分钟里,价格往哪个方向走」,以及「成交额加权的分钟收益」与「等权分钟收益」之差。 机构分批建仓
    / 出清的大单集中在放量分钟,放量分钟的收益方向(day_topw_mean(Ret, Volume))携带的是大单的价格冲击方向, 比日收益更少被零散散户噪声污染;日度读数噪声大,所以做
    20~60 日慢聚合,让「持续被大单推向同一方向」的票排前面(拆单执行的持续性, Kyle 1985 / Chordia-Subrahmanyam 2004
    的订单不平衡持续)。算子实现:day_topw_mean(Ret, Volume)(最大 10% 成交量分钟的平均收益)、 day_signed_ratio(Ret,
    Amt)(上涨分钟的成交额份额减下跌分钟的成交额份额,取值在 [-1,1])、day_wmean(Ret, Amt) 与 day_mean(Ret) 相减、
    day_centroid(Amt)(成交重心在日内的位置,0 开盘 1 收盘),再用 cross_mean / cross_decay_linear / cross_zscore
    / cross_regbeta 做日轴慢变化; 一个种子用 cross_regbeta(day_centroid(Amt), day_topw_mean(...))
    看「成交重心越靠后、大单方向越能解释…」的耦合。 为什么和库里已有的不同:本批 6 个 head 与共性表全是 nt_cs_regres(·, Low) 的日内极值
    / 价格分位的形状,骨架是「分钟级截面回归残差 -> 日内极值 -> cross_min」; 这里没有价格水平,读的是「成交量分布 x 收益方向」的交互,用的是
    day_topw_mean / day_signed_ratio / day_centroid(库建成后才有的算子, 两个库的 5583 个骨架里没有),没有任何
    nt_ 或 cross_min。 为什么样本外还会在:大单拆分执行是结构性的(机构的冲击成本约束),慢变;不依赖行情方向;方向可由 GP 决定(跟随或反转)。
    数学检查:day_signed_ratio 分母是成交额之和,停牌日为 NaN,不是 0 也不是无穷;day_topw_mean 在成交量全 0 时为 NaN;
    day_centroid 有界 [0,1];无近零分母,无前视(只用 t 日及以前),最长窗口 60 日。 风险:与 20 日反转控制相关(近期大涨票的重分钟多为上涨);奖励已去掉线性
    / U 形 / S 形暴露;若仍与反转或流动性控制重复则出不了 head。
  inspired_by: B 批 head 与共性表:nt_cs_regres(Amt|Ret, Low) 的日内极值(含 Amt 的 head 是 score
    -1.45~-1.90 里相对最好的),说明成交额的日内分布有信息,但那条线被 nt_ 禁用;这里换成不含 nt_ 的成交量加权方向读法
  seeds:
