  - cross_mean(sub(day_es_ratio_lo(Ret), day_es_ratio_hi(Ret)), 60)
  - cross_zscore(sub(day_es_ratio_lo(Ret), day_es_ratio_hi(Ret)), 60)
  - cross_mean(day_skew(Ret), 40)
  - cross_mean(day_es_ratio_lo(Ret), 40)
  - cross_mean(day_es_ratio_hi(Ret), 40)
  - cross_mean(sub(day_es_ratio_lo(Amt), day_es_ratio_hi(Amt)), 40)
  - cs_bucket_zscore(cross_mean(sub(day_es_ratio_lo(Ret), day_es_ratio_hi(Ret)), 40),
    LogFloatCap)
  - cs_bucket_zscore(cross_mean(day_skew(Ret), 40), cross_mean(day_std(Amt), 30))
