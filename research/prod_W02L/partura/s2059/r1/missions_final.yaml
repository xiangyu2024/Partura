  seeds:
  - cross_mean(cs_regres(day_min(Low), day_max(High)), 60)
  - cross_mean(cs_regres(day_min(Low), day_max(High)), 120)
  - cross_zscore(cs_regres(day_min(Low), day_max(High)), 120)
  - cross_mean(cs_regres(log(day_min(Low)), log(day_max(High))), 90)
  - cross_regbeta(day_min(Low), day_max(High), 60)
  - cross_regbeta(log(day_min(Low)), log(day_max(High)), 120)
  - cross_regres(day_min(Low), day_max(High), 60)
