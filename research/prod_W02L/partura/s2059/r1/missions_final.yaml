- type: N
  hypothesis: '机制:日内「高点相对低点的伸展」的跨股票异常,再看它在日轴上的持续程度。批里三个 head 都是 cross_min(day_max(nt_cs_regres(High
    或 Ret, Low)), 15~60):分钟级跨股票回归残差的日内最大值,再取最近 15~60 日的最小值,即「最近一个月里最不张扬的那个日内峰」。三个
    head 的 score 都在 -1.9 ~ -2.4(train 与 valid 同号为负),说明这条线的毛收益接近 0、被成本吃掉;但有一点是明确的:窗口越长越好(60->120
    增益 +0.85,15->30 反而变差只是噪声),说明被读到的是慢变的个股属性,不是日度噪声。这一位保留这个思路,拿掉两个坏部件:(1) nt_cs_regres
    被环境禁用,而且分钟级回归的残差每分钟都在换,日内取最大值读的是单个分钟的极端点;(2) cross_min 只取窗口内一个点,噪声大、换手高。新做法:先在日度聚合后做截面回归,cs_regres(day_max(High),
    day_min(Low)) = 日内最高价对最低价做截面回归的残差,即「同样的日低点水平下,日内最高点多伸出去多少」,价格水平(后复权价排序约等于长周期动量)被回归吸收一部分,留下的是日内波动幅度中与水平无关的部分,等价于一个对数尺度无关的
    Parkinson 区间的变体;再用 60~120 日均值或滚动回归斜率(cross_regbeta(day_min(Low), day_max(High),
    60):该股高点对低点的弹性,beta>1 = 低点每抬高一点,高点伸出更多,上冲型)把它变成慢变属性;并配上上影线 / 下影线不对称 sub(day_max(High),
    day_mean(Vwap)) 与 sub(day_mean(Vwap), day_min(Low)) 的比值(买盘拉升后被卖出 vs 恐慌下杀后被承接),这是一个
    pattern 读法,库里的 cross_min / day_max 残差没有读过上下影线不对称。算子实现:day_max / day_min / day_mean
    把分钟聚到日,cs_regres 做截面残差,cross_regbeta / cross_mean / cross_zscore 做日轴慢变化。

    为什么与库里已有的不同:库里的 head 是「分钟级残差 -> 日内最大 -> 日轴最小值」,日轴聚合是 min;这里日轴聚合是 mean / regbeta
    / zscore,输入是日度 High / Low 的截面残差或上下影线比,没有分钟级残差,也没有 min 聚合,算子骨架与两个库都不同(已对照 loc 的
    head 与共性表;完整 5583 个骨架的对照交给确定性审计工具)。

    为什么样本外还会在:日内区间的不对称是参与者构成(散户追涨杀跌的影线、机构分批吸纳的下影线)的结构性痕迹,60~120 日窗口上名次保持,换手低;不依赖某段行情的方向。风险:与波动控制(日内区间就是波动)相关高,奖励剔除线性、U
    形和 S 形暴露后剩下的看影线不对称与回归残差是否还有信息;如果被波动控制吃掉,这一位出不了 head,下一轮不再押区间一族。

    数学检查:day_max(High) 与 day_min(Low) 为正的价格,不会近零分母;影线比的分母 sub(day_mean(Vwap), day_min(Low))
    在整天价格不动(停牌 / 一字板)时为 0,分子也为 0,得 NaN,不是无穷;为防爆点,种子里用 log 或 cs_rank 压缩。无前视:全部只用 t
    日收盘及以前,t+1 才交易。最长窗口 120 日,热身期不主导。'
  inspired_by: B 批:三个 head 都是 cross_min(day_max(nt_cs_regres(High|Ret, Low)), 15~60);60->120
