  - cross_zscore(log(div(sub(day_max(High), day_mean(Vwap)), sub(day_mean(Vwap), day_min(Low)))),
    90)
  - cs_bucket_zscore(cross_mean(cs_regres(day_min(Low), day_max(High)), 60), LogFloatCap)
  - cs_bucket_zscore(cross_mean(log(div(sub(day_max(High), day_mean(Vwap)), sub(day_mean(Vwap),
    day_min(Low)))), 60), cross_mean(day_std(Amt), 30))
- type: N
  hypothesis: '机制:日内收益分布的左右尾不对称(跳跃的符号)及其在日轴上的持续性。批里的 head 都读 Ret 与 High 的分钟级截面残差的「日内最大值」,即只读上尾的一个点,且全部亏损(score
    -1.9 ~ -2.4);Ret 版在 60->120 窗口上从 -2.28 到 -1.43,说明慢变聚合比点估计好。新想法:把上尾与下尾对称地读出来并相减,读的是「这只票的惊喜是向上跳还是向下跳」。算子实现:ops_ext
    里的 day_es_ratio_hi(Ret) / day_es_ratio_lo(Ret)(日内最极端分钟的收益占全天的比例,上尾 / 下尾),相减得到
    day 级的尾部不对称;day_skew(Ret) 是分钟偏度;在日轴上用 cross_semistd_neg / cross_semistd_pos(日度收益的下行
    / 上行半标准差)的对数比(Barndorff-Nielsen 等的 signed jump variation 的日度版,下行半方差占比高 = 下跌尾厚,预期收益补偿);最后
    cross_mean 到 20~60 日。分开读上下尾的理由:上尾(彩票偏好、Bali 等的 MAX 效应)被高估,下尾(崩盘风险、Kelly 与 Jiang
    2014 的尾部风险溢价)被补偿;这一位的符号选择交给 GP 的方向,而不是由我事先押注。

    为什么与库里已有的不同:库里的 head 与共性表只有「day_max(分钟残差)」的上尾单点,没有下尾,也没有上下尾相减;day_es_ratio_hi
    / lo、cross_semistd_neg / pos 是库建成之后才加的算子,库里不会出现(两个库的 5583 个骨架逐个对照交给确定性审计工具)。与波动控制的关系:除以总量后得到的是「份额」或「偏度」,与波动水平的暴露在构造上就小,这是它与波动
    / 流动性控制天然低相关的原因。

    为什么样本外还会在:尾部不对称由持仓者结构(散户 vs 机构)与风险厌恶决定,慢变;对尾部的补偿在文献里跨市场稳健,与某段行情无关;20~60 日聚合使换手低,15
    bp 吃得下。风险:偏度类与 20 日反转控制相关(近期一次大涨会抬高上尾),奖励会剔除线性、U 形和 S 形暴露,剩下看运气;下行半标准差版与波动控制相关高,所以种子里同时放比值版(尺度无关)。

    数学检查:day_es_ratio 在全天无价格变动时分子分母都为 0,得 NaN 不是无穷;半标准差比值的分母在窗口内无下行日时为 0,种子里用 add(·,
    常数) 的形式或差而非比;day_skew 的分母 std 为 0 时给 NaN。无前视:全部只用 t 日收盘及以前,t+1 才交易。最长窗口 60 日,热身期不主导。'
  inspired_by: B 批:三个 head 全是 day_max(nt_cs_regres(Ret|High, Low)) 的上尾单点,score 均 <
