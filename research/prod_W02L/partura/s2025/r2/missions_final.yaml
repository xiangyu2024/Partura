- type: N
  hypothesis: '机制:同一天里不同时段的「钱」(成交量加权收益)是否同向、是否延续到次日、是否与全市场同步,是个股资金构成(散户注意力 / 信息交易
    vs 机构与被动基准资金)的慢变指纹。


    批里的现象(B074;loc.md 与 members.csv):(1) 14 个成员只读两样东西:Volume 的窗口总和(day_sum(Volume,
    2..237 / 238..240)),以及开盘 / 尾盘四个窗口(1–20、1–50、191–240、221–240)的成交量加权收益 VW = Σ(Ret·Volume)
    / ΣVolume,各自做 20 日均值或 20 日 std。(2) 单日 VW 全被换手压垮(日换手 0.84 ~ 0.86,库口径夏普 −12 ~ −17);20
    日均值后日换手 0.15 ~ 0.18、夏普 −1.4 ~ +0.35;20 日 std 后日换手 0.09,开盘窗口夏普 +1.1 / +1.27(rank
    IC −0.038 / −0.041,members.csv 标为冠军的一个族),尾盘窗口 −0.69 / +0.16(不在冠军族)。批里只有「单个时段 VW
    的变异性」有读数,而且全是单窗口、20 日。(3) 新尺子下三个素材 head:尾盘 50 分钟 VW 的 20 日均值 −2.35,Volume 窗口和
    −1.42 / −1.53,都是水平读法。本流第 1 轮 R 的教训:水平类慢化后变差,变异性 / 耦合类越慢越好(ts_stddev 60 → 241:−0.98
    → −0.30)。


    新想法:不读单个窗口的水平,读「窗口之间的关系」,全部做 180 ~ 241 日的慢聚合。记 FO = day_wmean(Ret, Volume) 在第
    1..50 分钟,FL = 在第 191..240 分钟,FM = 在第 51..190 分钟(中段)。(day_wmean 权重取 |w|,Volume
    ≥ 0;5583 条库里 day_wmean 出现 0 次。第 0 根分钟是集合竞价、Ret 恒为 0,这一点来自旧研究 C02 文件与 2009 流笔记,我没有自己测。)

    (A) 时段之间的动量 / 反转系数(日内动量,Gao, Han, Li & Zhou 2018):cross_corr(FO, FL, 241);cross_regbeta(FO,
    FM, 241)(开盘资金流对中段资金流的斜率);cross_corr(cross_delay(FL, 1), FO, 180)(昨日尾盘资金流与今日开盘资金流
    = 隔夜桥,Heston, Korajczyk & Sadka 2010 的日内收益周期性);cross_corr(FL, 当日第 1..190 分钟收益,
    180)(尾盘追涨 / 抄底的系数)。

    (B) 资金流对次日收益的预测系数(Llorente et al. 2002:信息性成交伴随延续、对冲性成交伴随反转):cross_corr(cross_delay(FL,
    1), day_sum(Ret), 241);cross_corr(cross_delay(放量前 10% 分钟的收益均值, 1), day_sum(Ret),
    241)(B073 的对象);cross_reg_tvalue(cross_delay(FL − 尾盘等权收益, 1), day_sum(Ret), 241)。

    (C) 钱加权 − 时间加权的倾斜(净买压):cross_mean(FL − day_mean(尾盘 Ret), 241);cross_ema(FO − day_mean(开盘
    Ret), 120);两者之差(尾盘倾斜减开盘倾斜)。读的是成交量集中在涨分钟还是跌分钟;加权减等权去掉了纯价格漂移。

    (D) 与全市场同步(cs_mean 只对日频 FL / FO 取截面均值):cross_corr(FL, cs_mean(FL), 180);cross_reg_tvalue(cs_mean(FO),
    FO, 241);cross_regbeta(cs_mean(FL), FL, 241);以及尾盘同步减开盘同步。尾盘资金流与全市场同步 = 被指数 / ETF
    / 基准型资金交易(收盘价是净值基准),开盘同步 = 隔夜消息与注意力;读的是持仓结构的代理,不是水平(Morck, Yeung & Yu 2000 的同步性思路搬到分时段资金流上)。

    (E) 变异性的时段比:div(cross_stddev(FL, 241), cross_stddev(FO, 241))。库里只有各窗口 20 日 std
    的单独读数,没有它们的比(日内波动集中在收盘还是集中在开盘)。


    为什么和库里不同:库里读的是单个窗口 VW 的水平或 20 日 std,以及 Volume 的窗口和;没有一条读两个窗口之间的相关 / 斜率 / 时差、VW
    对次日收益的系数、钱加权与时间加权的差、VW 对全市场 VW 的同步性或时段波动比。15 个 seed 的算子骨架互不相同,也都不在两个库的 5583 条里(已逐个对照
    members.csv)。与快照 head 的关系:head 5 是尾盘 VW 的 20 日均值,只有 (C) 的尾盘倾斜与它有重叠,预计 |ρ| < 0.5;其余与所有
    head 预计 < 0.3。


    为什么样本外还会在(如果真有 alpha):(A)(B) 是个股日内资金流的时序结构(信息性 vs 流动性成交、日内动量的参与者构成),(D) 是被动 /
    基准资金占比,都是持仓结构的慢变特质,不依赖某一段行情;窗口 180 ~ 241 日,名次在数周内几乎不变,15 bp 成本吃不掉。


    风险:(i) 相关 / 斜率估计误差大(241 日窗口下相关的标准误约 0.065),排名可能近似随机;(ii) (D) 与市值 / 流动性共享一部分(大票同步性高),尺子扣掉线性
    / 平方 / 立方暴露后残余可能很小;(iii) 一字板的票整天 Ret = 0,VW 恒为 0,相关度是 0 或 NaN,它们在截面上并列(并列靠股票列序打破,规则允许);(iv)
    窗口没满时是扩张窗口(不是 NaN),2018 年初样本很少时 cross_corr 会是 ±1,只影响最前面约一个月。


    数学检查:day_wmean 在权重和为 0(停牌)时得 NaN;cross_corr / cross_regbeta / cross_reg_tvalue
    在窗口内输入近似常数时由实现的下限给 0 或 NaN。全部 15 个 seed 里只有 (E) 有除法:分母 cross_stddev(FO, 241) 只有在
    FO 在窗口内恒为同一个非 NaN 值(例如整年一字板)时才是 0,那样的票没有可交易标签;inf 若出现,在逐日排名里只是一个极端端点,不会支配截面。无前视:所有输入只用
    t 日及以前的数据,t + 1 日才交易;cross_delay(·, 1) 只用 t − 1 日的值,与 t 日收益的相关在 t 日收盘后才算出。'
