  hypothesis: '机制:核心 C = sub(day_skew(放量前 10% 分钟的收益), day_skew(静默后 10% 分钟的收益))。in_topk_masked(Volume,
    Ret, 10) 每天在第 11..240 分钟里取成交量最高的约 23 个分钟的收益(`False` 版取最低的约 23 个),day_skew 是这 23
    个收益的偏度,所以 C = 放量腿偏度 − 静默腿偏度,读的是「价格跳动的方向性不对称,在放量时与静默时有多大差别」。C 高 = 放量分钟里大涨的分钟多于大跌的、静默分钟没有这种偏(信息
    / 注意力 / 彩票型需求推着价格向上跳);C 低 = 放量主要伴随向下的跳(抛压)。


    选它的依据(全是 train / valid 内的读数):

    (1) 第 1 轮 N 位里 `cross_mean(C, 241)` 是该位最好的读数之一(−0.43;train −0.43 / valid +0.48),离本流迄今最好(E
    位 −0.25)不远。共性表:含 C 的 9 个已评分候选均分 −1.36 对 −2.29(p 0.019)。第 1 轮相关度表里 `cross_mean(C,
    60)` 对 5 个控制的 |ρ| 是流动性 0.32 / 波动 0.04 / 反转 0.02 / 已知族 0.30 / 市值 0.08,对所有 head
    ≤ 0.16,所以去掉控制之后它基本还在。

    (2) 第 1 轮 R 的结论:σ(放量腿)的「变异性」越慢越好(ts_stddev 窗口 60 / 80 / 120 / 160 / 241 = −0.98
    / −0.72 / −0.27 / −0.29 / −0.30),而对「水平」做慢均值反而更差(σ静默的 ts_mean 60 / 120 = −3.42
    / −4.14,与已知族 |ρ| 0.54 ~ 0.56)。水平被流动性 / 已知族控制吃掉,变异性、不对称、耦合系数没有。C 是无量纲的「形状差」,不含波动水平。

    (3) 单日读数噪声极大:23 个分钟的样本偏度标准误约 √(6/23) ≈ 0.5,所以所有 seed 都在 180 ~ 241 日上聚合(一年约 5,500
    个分钟)。


    外围:快照里含 C 的候选可见的外围只有 cross_mean(60 / 241) 一类的时间平均。下面五类都不在其中,每个 seed 的算子骨架互不相同、也都不在两个库的
    5583 条里(已逐个对照 members.csv):

    (a) 与全市场「放量偏度」状态的关系:cross_regbeta(cs_mean(C), C, 241)(个股 C 对当日全市场平均 C 的 241 日回归斜率
    = 对市场放量偏度状态的载荷,类 coskewness,Harvey & Siddique 2000)、cross_corr(C, cs_mean(C),
    241)(同步性)。要回答的是:被定价的是系统性的偏度暴露还是个股自己的偏度。(cs_mean 只对日频值取截面均值,是合法写法。)

    (b) 与当日 / 次日收益的关系:cross_corr(C, day_sum(Ret), 180)(当日收益有多少是放量跳推动的)、cross_corr(cross_delay(C,
    1), day_sum(Ret), 241) 与 cross_reg_tvalue(cross_delay(C, 1), day_sum(Ret), 241)(上一日的放量偏度差对次日收益的预测系数:Llorente
    et al. 2002「信息性成交伴随延续、对冲性成交伴随反转」的个股持续特质;t 值与相关都无量纲)。

    (c) 稳健位置与尾部:cross_med(C, 241)、cross_tail_mean_q75 / q25(C, 241)(偏度差最高 / 最低四分之一的天的均值
    = 上 / 下尾事件)、两者之差、cross_decay_linear(C, 241)。

    (d) 可靠性与持续性:div(cross_mean(C, 241), cross_stddev(C, 241))(均值除以自身波动 = 稳定为正还是偶尔为正)、cross_stddev(C,
    241)(偏度差自己的不稳定度,对应 R 的结论「变异性类越慢越好」)、cross_autocorr(C, 180, 1)(这个形状差是持续的个股特质还是随机噪声)。

    (e) 市场状态:大盘(cs_mean(day_sum(Ret)),当日开盘到收盘的等权均值)下跌日的平均 C 减上涨日的平均 C(下跌日放量偏度更负 =
    恐慌式抛压)。


    为什么样本外还会在(如果真有 alpha):偏度偏好(彩票型需求,Barberis & Huang 2008;Boyer, Mitton & Vorkink
    2010)以及放量时是信息交易还是流动性交易(Llorente et al. 2002),是持仓者构成和注意力的慢变特质,不依赖某一段行情;聚合窗口 180
    ~ 241 日,名次在数周内几乎不变,15 bp 成本吃不掉。(a)(b) 里的系数是个股自己的反应模式,不是水平。


    风险:(i) train 是本核心的卡点(`cross_mean(C, 241)` train −0.43 / valid +0.48),我没有机制能说明
    train 为何弱;(ii) 相关 / 回归类的估计误差大;cross_* 在窗口没满时是扩张窗口(不是 NaN),2018 年初样本很少时 cross_corr
    会是 ±1,只影响最前面约一个月;(iii) (a) 类可能与市值 / 流动性共享一部分(大票更同步)。


    数学检查:day_skew 在 23 个收益全相同(σ = 0)时得 NaN 而不是无穷;|skew| ≤ (n−2)/√(n−1) ≈ 4.5,有界,不会爆点。C
    本身没有除法。全部 seed 里只有 div(cross_mean(C), cross_stddev(C)) 有除法:分母只有在 C 在窗口内为常数时才是
    0(得 NaN 或 inf,而偏度差取连续值,不会发生);inf 若出现,在逐日排名里只是一个极端端点,不会支配截面。无前视:所有输入只用 t 日及以前的数据,t
    + 1 日才交易;cross_delay(C, 1) 只用 t − 1 日的 C;(e) 的大盘收益是 t 日收盘前已知。'
