  hypothesis: 新 idea:「收益极值有没有成交量撑着」。day_pdf_quantile_bilateral_half_width(Ret, Volume, n)(默认中心 = 成交量峰值分钟,已读源码)的实现:先把当日分钟收益做 min-max 归一到 [0,1](无量纲,不含波动水平);以成交量最大的那一分钟为中心,按分钟位置距离由近到远累加成交量占比,累计到 ≥ n 为止,返回这个时间窗口内归一化收益的半极差(上限 0.5)。值大 = 当日最高 / 最低收益的分钟落在围绕成交峰值、包含 n 比例成交量的时间窗口内(极端价格由放量驱动,信息型);值小 = 极端收益出现在离放量峰值很远、成交稀薄的时段(买卖价弹跳 / 薄盘噪声)。库里 B075 的 12 条只读单个 n=0.9 的这个量的 20 日均值 / std(新尺子下 head 分数 −2.0 ~ −2.5),本组的不同:(1) 读不同 n 的差(0.9−0.5、0.9−0.7、0.95−0.8):差掉共同的日内结构,留下「极值离放量中心多远」的梯度 —— 窄窗口(n=0.5)已含极值的日子与要到宽窗口才含极值的日子之分;(2) 早盘 2–120 与午后 121–240 的同一量之差(极端是否随时段被量撑着);(3) 用成交额 Amt 做权重,以及 Volume 权重减 Amt 权重(价位加权的差别);(4) 聚合一律是 120–241 日的慢变异性(std)/ 慢均值 / EMA —— 本流 R 与 E 的读数都说「慢 + 变异性」才不被控制吃掉,而 B075 的 20 日窗口过快。为什么样本外还在:微结构的信息 / 噪声分解(知情交易的极端价格伴随量,噪声价格不伴随量),按股票的持续性高,不依赖某段行情;读数是 [0,0.5] 内的归一化量,全部是减法,没有除法,不会爆点。已知风险:单日读数在 0.5 附近饱和(n=0.9 时几乎覆盖全天),差分后分布集中,靠慢窗口放大稳定的个股差异。
