  hypothesis: 核心 = 本流最好的 head `ts_stddev(day_std(放量前 20% 分钟收益), 160)`(−0.28,拆解:80 / 320 都更差,换 Amt 不变;train / valid 同号,没有被卡一端):放量分钟里价格离散度的 160 日变异性(波动率的波动率,按「在量大的时候价格是否时松时紧」)。alpha 的可能来源:信息到达的间歇性(Clark 混合分布:量大分钟的离散度随信息流变化,变异大 = 信息流不稳 / 被关注度忽高忽低),不是波动水平本身(核心是 std 的 std,已被慢窗口去掉水平)。前几轮用过的外围(第 1 轮 E 位对 σT − σB 的 cross_max / cross_sum 外壳,R 对该 head 的 log / EMA / 窗口 / 核心差)都是「对核心自己做时间变换或聚合」。本组外围完全不同,是「拿别的东西来对照核心」:(1) 减去 / 回归掉「全天分钟收益」的同样的变异性(除掉整体波动率的波动率,问放量条件有没有额外信息;用 cs_rank 差和 cs_regres 两种,不做除法,没有近零爆点);(2) 减去静默腿的同一量(放量与静默的变异性差);(3) 与同一加权方式下的收益分布半宽的变异性(B075 的量)秩相加 —— 两个独立估计量的混合;(4) 加上放量腿与静默腿离散度的 160 日相关、与当日收益和的相关(杠杆 / 同步类耦合);(5) 核心相对自己 241 日历史的位置 ts_rank,以及核心相对一个季度前的变化(新 / 旧信息流)。样本外还在的理由:机制是信息流稳定性,和股票的信息环境(分析师覆盖 / 散户占比)有关,持续性强;每个种子都含核心原样,核心与已知族的 |ρ| 只有 −0.12。
