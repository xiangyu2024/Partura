slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 10, 12]
    reasons: '核心 = head 1 原样，每个种子都原样含核心；核心与 liq / vol / rev / known / size 的 |ρ| 为 0.03 / 0.38 / 0.22 / 0.00 / 0.24，均 <0.8，E 位条件满足。自动划掉的 1、10、12 是相关度表的 ρ≥0.7 规则（与库禁令同一个量）：1 = cross_zscore(C,60) 与 head 1 的原始 |ρ| 0.74（残差只有 0.04，说明高 ρ 主要来自控制的共同部分）；10 = cross_stddev(C,60) 与 head 2 的 0.73；12 = C 减自身 180 日均值与 head 1 的 0.73。创新度 3 而不是 4：剩下 12 个里，2、4、5、11、13、14 与 head 1 的交易信号残差 |ρ| 在 0.51–0.75，是同一个弹性读数的时间平滑或除以全天波动，属于换了写法；3、6、7、8、9、15 才是新读法，与 head 1 残差 |ρ| 分别为 0.24 / 0.17 / 0.03 / 0.02 / 0.00 / 0.09（fast-slow 差、对全天波动的回归残差、与日收益或成交额的相关、趋势符号翻转）。合理度 4：算子逐个核对，无数学问题。day_std 为总体标准差；cross_* 与 ts_* 同为日轴因果滚动，窗口含当天，无前视；cross_regres(x,y,d) 是 y 对 x 的滚动 OLS 残差（rolling_ols 为 y ~ alpha + beta x），所以 cross_regres(σ全天, C, 60) 确为 C 去掉全天波动后的残差；div(C, σT+σB) 落在 [−1,1]；σT ≤ √10·σ全天 使 div(C, σ全天) 有界。与 PI 笔记不符的一点：60–240 日窗口的前面不是 NaN。rolling_windows 用 NaN 垫底，但 nanmean / nanstd 只平均可得的天数，所以前 d−1 天是扩张窗口统计量（窗口 180 时约占 2018 训练段的 13%），不是主导，不挡，但 PI 应改掉这句。13 的桶边界每天按截面重算，会推高换手（PI 引的别的流的经验），是风险不是问题。外围 2 与 14 和 R 组 2 的变体同族（只差窗口或半衰期），是冗余，不是数学问题，不划，PI 若想省预算可以拿掉其一。如果它有 alpha，最可能来自：个股价格对成交活跃度的弹性在去掉波动水平之后的慢变部分，尤其是 6（残差回归到全天波动）与 13（同价位桶内标准化）这类去掉了水平的读法。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '15 个种子的骨架在两库 5583 条里都没有（已逐个核对）；与三个 head 的原始日度秩 |ρ| 全部 ≤0.34（最高 b13 的 0.34、b1 的 0.33）；与五个控制的 |ρ| 最大 0.66（b10 与流动性），都 <0.8，没有自动划掉的。不划（不是数学问题也不是重复）的几处：(i) b3、b8 的 gate 为废品（distinct 0.30）：pos_ratio 只有 k/23 个取值，60 日平均后仍有大量并列，十分位边界上的并列组按股票列序切开。按 §4 这是并列靠列序打破，规则明确允许，所以不据此划；但 PI 应知道它的有效分辨率很粗。b8 的零收益按非正计数，读出来的主要是「下一分钟动不动」，与流动性 |ρ| 0.46 相关、与 head 3 的交易信号残差 0.48，这是合理度上的弱点，不是数学问题。(ii) b11 / b12 的 |Ret| / sqrt(Volume)：Volume=0 且 Ret≠0 的格子得 +inf，会先于正常分钟入选，但权重是 Volume=0 所以不进入加权均值；PI 在跑之前应先在训练段统计这类格子的占比，若不是零就要改分母。(iii) b14 / b15 的 day_corr 在整天平盘（Ret 全为 0）时返回 0 而不是 NaN（分母加了 1e-9），涨跌停锁死的日子会被放到截面中间，影响有限。(iv) 近似重复：b11 与 b12 只差平滑器（mean20 对 ema60）；b10 = b9 减去全天成交量重心，若截面相关很高，留一个就够。创新度 4：骨架全新，读的是偏度、方向比例、放量后延续、放量时点与价格冲击选分钟，这些库里都没有；b15 与 head 1 的交易信号残差 0.60、b3 与 head 1 残差 0.44，属于部分重合，不是同一个东西。合理度 4：算子逐个核对，in_topk_masked 的 k=(有效分钟数+1)//p，p=10 为放量前 10%、p=5 为前 20%，与 PI 文字一致；day_skew 的绝对值上界约 4.5（n=23），day_kurt 为超额峰度、上界 20；day_signed_ratio ∈ [−1,1]；b6 / b7 用的是 t−1 分钟的符号乘 t 分钟的收益，同日内，无前视。如果它有 alpha，最可能来自：放量分钟里价格的方向与形状（偏度、净买压、放量后延续）在个股上的慢变特性，尤其是 b4（与所有 head 的 |ρ| ≤0.26）与 b6（≤0.22）这类只用 60 日以上聚合的读法。'
R:
  - head: 'ts_stddev(day_std(in_topk_masked(in_slice(Volume, 11, 240), in_slice(Ret, 11, 240), 10)), 20)'
    soundness: 3
    reasons: '变体：窗口 60 / 80 / 120 / 160 / 241，以及变异系数 ts_stddev / ts_mean（60、120）。数学无问题：ts_stddev 与 ts_mean 都是日轴因果滚动；非负序列的变异系数（总体标准差除以均值）上界为 √59；分母为 0 时得 NaN。与 PI 笔记不符的一点：241 窗口的前 240 天不是 NaN，而是对可得天数的扩张统计，占 2018 训练段约 18%，不是主导，不挡。合理度 3 而不是 4：「慢是承重的」的理由来自尺子对换手的惩罚，不是经济机制；拉长窗口读的是放量腿与静默腿价差的稳定性，这个机制能说，但 PI 没有解释它为什么应当有 alpha。如果它有 alpha，最可能来自：放量价差相对自身常态的稳定性（慢变的价格冲击结构），而不是换手本身。'
  - head: 'sub(day_std(in_topk_masked(in_slice(Volume, 11, 240), in_slice(Ret, 11, 240), 10)), day_std(in_topk_masked(in_slice(Volume, 11, 240), in_slice(Ret, 11, 240), 10, False)))'
    soundness: 4
    reasons: '变体：对 head 1 本身做 ts_mean 40 / 120 / 241、cross_ema 60，以及归一化弹性 ts_mean(C/(σT+σB), 60)。数学无问题：都是因果日轴平滑；ts_mean 与 cross_mean 在本代码里是同一个滚动均值（nd_ts.py 与 dt_cross.py 的实现相同）；归一化版的分母在 σT 与 σB 同为 0 时得 NaN，且 |C| ≤ σT+σB，输出落在 [−1,1]。同样有上面 R 组 1 说的扩张窗口前期问题。机制清楚：日度读数被换手和噪声压住，平均掉它们正是拆解表里 20 日平滑 head 的做法（库里 ts_mean(day_std(T10),20) 的库口径换手为 0.06，而 day_std(T10) 本身为 0.62）。合理度 4。如果它有 alpha，最可能来自：价格–成交弹性的慢变部分（个股的微观结构常态），而不是某一天的弹性。'
  - head: 'day_std(in_topk_masked(in_slice(Volume, 11, 240), in_slice(Ret, 11, 240), 10, False))'
    soundness: 3
    reasons: '变体：ts_mean(σB, 60 / 120)、ts_stddev(σB, 60)、ts_mean(σB/σ全天, 60)。数学无问题：σB ≤ √10·σ全天，比值有界，分母为 0 时得 NaN；扩张窗口问题同上。前三个变体的骨架与库里 B073 的成员相同（只是叶子从放量腿换成静默腿），表达式本身不在库里；R 是直接评估，不受库禁令约束。合理度 3 而不是 4：机制是「静默分钟动不动」，本质上是零收益频率、买卖价弹跳和流动性的代理；PI 估计它与已知族的 |ρ| 约 0.4、可能过 0.5 线，这说明它的读数会和流动性控制重合。这不是数学问题，所以不给 1。如果它有 alpha，最可能来自：静默时段价格不动的程度作为流动性状态的代理，它的 alpha 与流动性溢价是同一来源，应当按流动性读数来看。'
summary: '三件事：E 位通过（创新 3、合理 4；划掉 1、10、12 三个 ρ≥0.7 的重复，剩 12 个，其中 2、4、5、11、13、14 与 head 1 残差 |ρ| 0.51–0.75，属于换皮）；N 位通过（创新 4、合理 4，不划）；R 三组合理度 3 / 4 / 3 全部保留。没有需要挡的数学问题。需要 PI 在跑之前处理或记录的：PI 笔记中「前 d−1 天为 NaN」与代码不符（实际为扩张窗口，不主导）；b11 / b12 的 Volume=0 且 Ret≠0 格子；b14 / b15 的平盘零值；b3 / b8 的 gate 废品（按规则不据此划）。本次只用了计划、相关度表、定位表、库的骨架字符串与算子源码，未读取或计算 2026 年的任何数据。'
