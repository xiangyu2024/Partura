  hypothesis: |-
    机制:核心 C 就是 head 1(分数 −2.26,方向 −1,半衰期 20)原样:sub(day_std(放量前 10% 分钟的收益), day_std(静默后 10% 分钟的收益)),in_slice 取第 11..240 分钟,每边约 23 个分钟。它读的是「放量时价格是否比静默时动得更凶」,即价格对成交活跃度的弹性。解释(Clark 1973 的混合分布假说):信息到达同时抬高成交量与波动;如果放量分钟的价格反而不比静默分钟更激烈,说明放量主要是被深度吸收的拆单 / 机构执行(价格冲击小),反过来则是薄盘里被推着走。

    批里的证据(loc.md 拆解表,新尺子):(1) 只留放量腿 −4.06、只留静默腿 −2.49,两腿之差 −2.26 比任何一条腿都好,承重的是「相对差」不是水平;(2) Volume→Amt 互换几乎不变(−2.19),起作用的是「按活跃度给分钟排序」,不是股数;(3) 同一对象的 ts_stddev 窗口 10 / 20 / 40 为 −3.21 / −2.42 / −1.37,越慢越好,说明尺子在罚日度噪声造成的换手,而 C 每天只由 2 × 23 个分钟收益决定,噪声很大。

    这个 E 位要回答的问题:把 C 的日度噪声和它里面的乘性波动水平拿掉之后,个股持续的「价格–成交弹性」里,还有没有尺子没吃掉的东西。外围只做四类,快照里只出现过 sub / ts_stddev 两种包装,下面的写法都不在里面:
    (1) 相对自己的常态 / 变化量:cross_zscore(C, 60)、快 EMA 减慢 EMA、C 减自己 180 日均值、先 EMA 5 再做 120 日 z 分数。每只股票以自己的历史做对照,读的是「最近的弹性相对它自己的常态是否异常」。
    (2) 去掉波动的乘性暴露:C 约等于「波动水平 × 弹性」,尺子只扣控制秩的 1 / 2 / 3 次加性项,扣不掉乘性的波动暴露。所以写成 div(C, add(σ放量, σ静默))(落在 [−1, 1] 的归一化弹性)与 div(C, day_std(全天分钟收益))(无量纲),把波动水平从分子里除掉,只留弹性本身。
    (3) 与自己其他日序列的关系:cross_regres(day_std(Ret 全天), C, 60) 是 C 对当日全天波动做 60 日回归后的残差(C 里总体波动解释不了的部分;注意 cross_regres(x, y) 是 y 对 x 的回归残差,这里 y = C);cross_corr(C, day_sum(Ret), 60) 与 cross_corr(C, log(day_sum(Amt)), 60) 读弹性在涨日 / 放量日是否更高(杠杆效应 / 追涨);C 的 z 分数与 20 日趋势符号相乘。
    (4) 慢聚合与分布形状:cross_ema(C, 120)、cross_mean(C, 180)、cross_stddev(C, 60)(弹性自己的不稳定度,类比 head 2 的 ts_stddev,但这里不含波动水平那一半)、cross_tail_mean_q75(C, 120)(弹性偏高那几天的平均),以及一个名义价格十分位内的 z 分数 cs_bucket_zscore(·, sub(LogFloatCap, LogFloatShares))。最后这个的理由:静默腿含买卖价弹跳噪声,弹跳噪声正比于 tick / 价格,而名义价格不在 5 个控制里;桶内标准化把这一半去掉,与不去桶的种子对照,就能分出「价格 / tick 代理」与「真弹性」。

    为什么和库里已有的不同:库里与核心有关的 14 条(B073)全是对放量 / 静默分钟收益做 std 或 mean 约化,外面只套 ts_mean / ts_stddev / ts_rank / rank / 一个 ts 标准化(都是单个 head 的「水平」读法);没有一条做日轴 z 分数、对其他日序列的回归残差或滚动相关、乘性归一化、尾部均值或桶内标准化。这些写法的算子骨架已逐个对照 members.csv 的 5583 个骨架,没有一个相同。预期它们与 head 1 的日度秩 |ρ| 在 0.1 ~ 0.65(去掉水平与噪声之后,与单日版本的相关明显下降;最慢的几个种子最高),与 5 个控制的 |ρ| 预计 < 0.5。

    为什么样本外还会在(如果真有 alpha):来源是个股的价格冲击弹性,取决于参与者构成(机构拆单 vs 散户追涨)与盘口深度,是慢变的结构属性;每只股票用自己的历史做对照,不依赖某一段行情;聚合窗口全部在 60 ~ 180 日,名次在数周内保持,15 bp 成本下不至于被换手吃掉。主要风险:(a) 弹性与流动性 / 价格代理太近,被控制吃掉;(b) 本批 13 个已评分候选的均值约 −3.3,最好的三个也只有 −2.3 ~ −2.5,train 与 valid 都为负,所以先验上本位置的期望分数仍为负,价值在于看「去水平、去噪声」能把分数推到哪里。

    数学检查:C 自身没有除法;σ 的下界是 0(分钟收益全为 0,例如停牌 / 涨跌停锁死),此时 C 有限。归一化分母 add(σ放量, σ静默) 与 day_std(全天) 只有在两边全为 0 时才为 0,那时分子也是 0,得 NaN 而不是爆点;而且 σ放量 ≤ √10 × σ全天(10% 子集围绕自己均值的方差不超过围绕全体均值的方差的 10 倍),所以 div(C, σ全天) 有界(绝对值 ≲ 3.2)。σ静默 = 0(静默分钟全是零收益)出现在较不活跃的票上(loc 里该单腿的不同值占比 0.878,即约 12% 的格子并列,多半就是 0),它们在 div(C, add(·)) 上并列在顶端(= 1),这是一种真实的「静默时价格不动」状态而不是数值伪影,并列靠股票列序打破(规则允许);慢 EMA 之后并列大幅减少。cross_regres 的方差阈值 1e-9 对量级 1e-3 的输入没有问题(60 日 Σdx² ≈ 1e-5)。无前视:所有量只用 t 日的分钟数据与 t 日及以前的日序列,t + 1 日才交易。热身期:窗口 ≤ 180,前 59 ~ 179 个交易日为 NaN,不主导 train(约 1350 个交易日)。
