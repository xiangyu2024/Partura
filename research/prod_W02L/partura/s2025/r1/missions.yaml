- type: N
  hypothesis: |-
    机制:放量分钟里价格怎么动,暴露的是谁在交易。批里的现象(B073;loc.md 与 members.csv):(1) 14 个成员全是「放量前 10% 分钟的收益」的 std 或 mean 约化,外面套 ts_mean / ts_stddev / ts_rank / 标准化;(2) 单日读数全被换手压垮:day_std(放量分钟收益)日换手 0.62、库口径训练夏普 −5.0,唯一读方向的 day_mean 日换手 0.85、夏普 −7.9;只有 20 日平滑后的 std 活了下来(日换手 0.06 ~ 0.09、夏普 +1.3 ~ +2.3,未去控制,rank IC 约 −0.05)。也就是说在这一批里,成败由换手 / 噪声决定,不是「方向没有信息」:23 个分钟收益的日均值几乎全是噪声,批里的 day_mean 一族从来没有被平滑过(没有 ts_mean(day_mean(·)) 这样的成员),它的慢聚合没有人试过;(3) 新尺子下三个素材 head 都在 −2.3 ~ −2.5,Volume 换 Amt 几乎不变,所以对象是「按活跃度挑出来的分钟」本身。方向、形状、放量之后价格去哪、放量发生在一天的什么位置,这四件事批里一条都没读。

    新想法:在同一个对象(放量前 10% 分钟的收益 T = in_topk_masked(Volume, Ret, 10),静默腿 B 是最低 10%)上,读五类不依赖波动水平的量,全部做 20 ~ 120 日的慢聚合:
    (a) 形状 / 彩票性:cross_mean(day_skew(T), 60)、放量偏度减静默偏度、放量分钟峰度。偏度、峰度无量纲,与波动控制的水平脱钩;高频已实现偏度负向预测截面收益(Amaya et al. 2015:投资者偏好彩票型的正偏度,把它买贵)。放量分钟的偏度比全分钟的偏度更集中地反映大单推动的方向。
    (b) 方向与资金流:day_signed_ratio(T, 放量分钟的成交量)= 放量分钟里涨分钟的成交量占比减跌分钟的占比(净买压);day_pos_ratio(T) − day_pos_ratio(B)= 涨分钟占比在放量时比静默时多多少(成交量与方向的联动);day_wmean(T, 放量分钟成交量)除以全天分钟收益 std(无量纲);day_corr(Volume, Ret) 与 day_corr(Volume, |Ret|)(成交量与带符号收益 / 幅度的日内相关)。依据:Chordia & Subrahmanyam (2004) 订单失衡预测之后的收益;Llorente et al. (2002) 投机性成交伴随收益延续、对冲性成交伴随反转。方向类的老问题是与 20 日反转近(尺子会扣掉对反转秩的线性 / U 形 / S 形暴露),所以全部用 60 日以上的聚合,读的是个股持续的特性而不是最近一周的涨跌。
    (c) 放量之后价格去哪:mul(in_topk_masked(in_delay(Volume, 1), Ret, 10), sign(in_delay(Ret, 1))) = 放量那一分钟之后下一分钟的收益,乘以放量那一分钟收益的符号。正 = 放量后延续(信息性成交,价格冲击是永久的);负 = 放量后回吐(流动性冲击,供给方得到补偿)。取日均值、再除以全天 std(无量纲)、或取其中「延续」的比例(day_pos_ratio),再做 60 ~ 120 日聚合。依据:Campbell, Grossman & Wang (1993),放量时一阶自相关更负;这是它的分钟级、个股持续特性版本。注意内层用的是 t − 1 分钟的成交量与 t 分钟的收益,都在同一天收盘之前,t + 1 日才交易,不是前视。
    (d) 放量发生在一天的什么位置:day_centroid(放量分钟的成交量)(放量集中在开盘附近还是尾盘,0 = 开盘,1 = 收盘),以及它减去全天成交量的重心(放量比平时更靠前 / 靠后)。day_centroid 在 W01(旧尺子,未对冠军取残差)里出过大分 head(成交额重心),但库里没有任何一条读「放量分钟自己」的重心。
    (e) 另一种选分钟的办法:不按成交量、按价格冲击 |Ret| / sqrt(Volume) 选最高的 20% 分钟(「聪明钱」的选法),取这些分钟的成交量加权 Vwap 除以全天成交量加权 Vwap,记为 Q。Q > 1 = 价格冲击大的分钟发生在当天更高的价位(净推升),Q < 1 = 集中在低价位(净打压)。库里没有按价格冲击选分钟,day_wmean 也是 0 次出现。

    为什么和库里已有的不同:库里读放量分钟的写法只有 std / mean / |mean| / 收益份额 / 放量分钟第一个与最后一个价格之比,全是单日水平或离散度的读法;以上五类的算子骨架(skew / kurt / pos_ratio / signed_ratio / wmean / centroid / 延迟一分钟的放量掩码 / 价格冲击掩码 + 外面的日轴聚合)已逐个对照 members.csv 的 5583 个骨架,没有一个相同。与控制相比:偏度、峰度、比例、相关、重心、Q 都是无量纲量,波动 / 成交额水平 / 市值被除掉了;与已知成交额离散度一族相比,它们读的是「价格在放量时做了什么」而不是「成交额在日内的绝对离散」。

    为什么样本外还会在(如果真有 alpha):来源是参与者类型(机构拆单 vs 散户追涨;信息性 vs 流动性成交)在放量分钟的价格路径上留下的指纹,是慢变的个股特性;所有种子都用 60 日以上聚合(Q 是 20 / 60 日),名次在数周内保持,15 bp 成本下留得下来;「放量后延续 / 回吐」是价格冲击是否永久的微观结构性质,不依赖某段行情。风险:(i) 方向类与 20 日反转 / 流动性近,被控制吃掉;(ii) 日度噪声大,即使 60 日平均,换手仍可能压过信号(批里未平滑的 day_mean 一族就是这样);(iii) 重心类可能与 W01 的 head 太像,被整波库禁令拒绝(这是预期内的)。我的先验:最可能出分的是无方向的 (c) 与 (d),最不可能的是 (a) 的峰度。

    数学检查:day_skew / day_kurt 的分母是放量分钟收益的 std,为 0(23 个分钟收益全为 0)时得 NaN 而不是无穷;非零个数很少时偏度、峰度有界(≲ 4.4 与 ≲ 23),不会爆点。day_signed_ratio ∈ [−1, 1];day_pos_ratio ∈ [0, 1];day_corr 有界;day_centroid ∈ [0, 1]。day_wmean 的权重和为 0 时得 NaN;除以全天 std 时,std 为 0(分钟收益全为 0)的日子分子也是 0,得 NaN。Q 的分母是全天成交量加权的 Vwap(正),Q 在 1 附近(约 ±3%);价格冲击 |Ret| / sqrt(Volume) 在 Volume = 0 的分钟是 0/0 = NaN(这些分钟不入选),不会出现支配截面的爆点。无前视:所有量只用 t 日分钟数据,t + 1 日才交易;(c) 里的 t − 1 与 t 分钟都在同一日内。热身期:窗口 ≤ 120 日,前 19 ~ 119 个交易日为 NaN,不主导 train。
  inspired_by: B073(放量前 10% 分钟的收益被约化成 std / mean):14 个成员全读『离散度或均值』,唯一读方向的 day_mean 是批内换手最高(0.85)、库口径夏普最差(−7.9)的一类且从未被平滑,std 类经 20 日平滑后换手只有 0.06–0.09;方向 / 形状 / 放量之后价格去向 / 放量发生的时刻,批里没有一条读。
