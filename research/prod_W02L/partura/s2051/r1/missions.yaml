  - type: N
    hypothesis: >-
      想法:分钟价格路径上的「跳跃 / 尖峰强度」,经多日平滑后读成个股的慢属性。本批 3 个 head 与 18 个候选全都是 nt_ts_kurt(价, 10/30)(分钟轴上的滚动峰度)再 day_max / day_skew,
      全部在新尺子下为负(-0.58 ~ -2.95)。批内证据:换价格字段几乎不救(Low->High -0.58->-0.51;Vwap->Close 在窗口 30 上 -2.95->-4.22),窗口 5/20/60 都更差且 train / valid 互相翻转,
      说明「滚动窗口峰度的日内极值」读到的主要是窗口边缘与量化噪声,而不是跳跃本身;承重的可能是「当天分钟收益分布是否厚尾」这个更干净的量。
      本位用不含 nt_ 的算子直接度量:(1) 当天分钟收益的整日峰度 day_kurt(in_delta(Vwap,1))、偏度、5 分钟对数收益的峰度;(2) 分钟价格相对滚动 30 分钟均值 / 标准差的最大 / 最小 z 值
      (in_zscore_rolling / in_madz 的 day_max / day_min):上冲幅度与下探幅度,以及两者的不对称(彩票型 MAX 效应的日内版);(3) 期望损失比 day_es_ratio_hi / lo(尾部均值与全体均值之比,不依赖窗口);
      (4) 波动的爆发度 = 滚动 10 分钟标准差的日内最大 / 均值;(5) 与成交量峰度的协动(价格跳跃是否伴随放量,信息型对噪声型)。所有量都外面套 cross_mean / cross_ema / cross_stddev 20~60 日平滑,
      再必要时做同市值桶内去均值(cs_bucket_demean,控制只扣加性的 1~3 次秩多项式,桶内相对量是交互项)。
      与库的区别:库里这一族是 nt_ts_kurt 的滚动窗口峰度 + day_max / day_skew;本位的种子没有一个含 nt_ts_kurt,骨架是「整日分布矩 / 滚动 z 的极值 / es 比 + 多日平滑」,
      且多日平滑(cross_*)在本批里一个都没有——批内全是单日值经 EMA 半衰期进尺子。不含滚动峰度窗口,所以不受批内窗口翻转的伤。
      样本外还会在的理由:A 股散户对「有尖峰」的彩票型股票的偏好(Bali-Cakici-Whitelaw MAX,Barberis-Huang 彩票偏好)是结构性的;多日平滑后换手低,15bp 成本下可做;
      厚尾 / 尖峰频率是个股的慢属性(信息到达与流动性供给方式),不靠某一段行情。预期与波动 / 流动性控制中度相关(0.3~0.6),新尺子扣掉线性与非线性暴露后剩下的是形状。
    inspired_by: 'B 批 head1~3:nt_ts_kurt(Low/Vwap,10/30) 的 day_max / day_skew 全部为负,窗口 5/20/60 与字段互换都不稳,train / valid 互相翻转,说明窗口版读的是噪声,厚尾本身尚未被干净地度量'
