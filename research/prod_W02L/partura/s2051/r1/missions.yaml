  - type: N
    hypothesis: >-
      想法:当天价格极值出现的「时刻」与日内路径的直线程度,读成知情交易的节奏。本批候选只看价格窗口的高阶矩(峰度)和它的日内最大值 / 偏度,完全不含「极值在什么时候」这一维;
      本位把时间维引进来:(1) 当天 Vwap 最高点与最低点在分钟轴上的位置 day_argmax / day_argmin 及其差(尾盘创日高 = 知情买盘延续到收盘,上午冲高回落 = 派发型),多日平滑;
      (2) 成交额重心 day_centroid(Amt) 与最高点位置之差:放量发生在价格创高之前还是之后;(3) 当天 Vwap 与分钟序号的相关 day_corr(Vwap, in_index(Vwap))(日内趋势的直线程度,
      越直越像单向知情流,越弯越像噪声往返),以及量价相关 day_corr(Vwap, Amt);(4) 最高点对最低点的 High / Low 版本、最大值占时比 day_at_max_ratio(高位停留时间);
      (5) 与上述同样的量在同市值桶内去均值,以及与当天收益的协动。全部套 cross_mean / cross_corr 20~60 日平滑。
      与库的区别:库里 day_argmax / day_argmin 一族存在但极少作用在价格路径上并以多日均值读成慢属性;本批 head 为 nt_ts_kurt(矩),与时间位置无关;
      本位的种子也不含 nt_ts_kurt,骨架是「极值位置 / 重心 / 路径相关 + 多日平滑」,核对过不是本批任何 head 的写法。
      样本外还会在的理由:A 股涨跌停与 T+1 让「尾盘强势」承载隔夜持有意愿(日内收尾位置与次日开盘跳空的关系是长期被记录的行为现象);
      知情交易的日内节奏由市场结构决定,不靠某段行情;位置类量是无量纲的,不随波动水平漂移,被波动控制吃掉的部分少;20~60 日平滑换手低。
      预期与 20 日反转控制有中度相关(尾盘位置与当日收益相关),新尺子扣掉线性 / 非线性暴露后看剩余。
