    reasons: '创新度 3:与三个 head(day_skew(nt_ts_kurt(Low,10))、day_max(nt_ts_kurt(Vwap,10))、day_max(nt_ts_kurt(Vwap,30)))的原始 |ρ| 最高为 0.27(seed 4,对 day_max(nt_ts_kurt(Vwap,10))),单看原始值低。但残差 |ρ| 在 seed 1、3、4、5、8、10、12 处为 0.45–0.59,即去掉五个控制后这几条仍与 nt_ts_kurt 尾部形状的 head 残差同向,属于同族换写法(整日矩 / 滚动 z 极值 / es 比)。残差 |ρ| 低于 0.4 的 seed 2、6、7、9、11、13、14 才是真正的新方向。不取 4 分的原因之一:奖励对每个表达式已做半衰期 20 的 EMA,这里的 cross_mean(…,20) 与之叠加成双重平滑,「多日平滑是新的」这一点本身打折。合理度 4:机制是彩票型偏好 / MAX 效应加上信息到达的厚尾程度,分钟收益的尖峰与尾部形状是个股的慢属性,说得通。逐算子核对:in_delta、in_logchg 为因果差分;in_zscore_rolling 为尾随窗口、分母 std+EPS 且 z 有界(至多 sqrt(29));in_madz 有 MAD>0 守卫且因果;day_kurt / day_skew 标度不变;day_es_ratio_hi / lo 在分位数近零时记 NaN;cross_* 只沿日轴。无前视,无 nt_*,无 nanrank_last。定义上记两处但都不构成「主要由它决定」:(a) rolling_windows 对开盘前 29 分钟是部分窗口,nanstd_last 对全 NaN 窗口返回 0 而不是 NaN,所以盘中停牌的股票在 seed 11 的 div(day_max(in_stddev_rolling),day_mean(in_stddev_rolling)) 分母里混入零,使比值偏高;(b) day_es_ratio 在分位数为 0 的平盘日记 NaN,把流动性最差的平盘日系统性地移出截面。两者都只影响停牌或平盘日子,seed 11 的 liq / vol 相关为 0.02 / 0.21,没有支配截面,不挡。如果它有 alpha,最可能来自:厚尾与跳跃频率在散户彩票偏好下的定价,以及残差空间里仍与 head 同向的那部分尾部形状。'
