  hypothesis: 核心 day_kurt(Volume) = 当天分钟成交量分布的峰度:越大说明当天的量集中在少数几分钟(事件 / 大单 / 脉冲式成交),越小说明量铺得均匀(被动、做市式成交)。
    本批证据:含它的 36 个候选均值 -1.37 对不含 -2.33(p<0.001),是批内最稳的富集部件;批内最好的非 nt 候选(第 1 轮 Pr1a,
    cross_corr(day_kurt(Δ²Vwap), day_kurt(Volume), 241))也靠它,但只有 +0.09。库里含它的写法几乎全是「单日值直接进
    ts_/cross_ 的 sum / quantile / regalpha / pow / mul」(单日值换手 0.81、净夏普 -10,纯噪声被成本吃掉),没有一个先做足够长的平滑再读成慢属性,
    更没有把它和收益方向、市值桶、自身历史做交互。本位的外围全换成这三类:(1) 长窗口平滑(cross_mean / cross_ema 40~120 日),把脉冲式成交读成个股的慢属性
    (机构 / 事件型票与散户均匀型票的差别,Easley-O'Hara 的知情交易者 / 订单流毒性思路,2002);(2) 与自身历史的偏离 cross_zscore(今天比自己平时更脉冲
    = 有新信息到达,Gervais-Kaniel-Mingelgrin 的高成交量收益效应,2001),再平滑;(3) 与当日收益 day_sum(Ret)
    的 cross_corr / cross_regbeta:脉冲放量伴随上涨 还是下跌,区分「买方事件」与「卖方事件」,这是带方向的量,不是控制里的流动性 /
    波动 / 反转;(4) 同市值桶内去均值 cs_bucket_demean, 避免被 LogFloatCap 的非线性暴露吃掉。新尺子已经去掉流动性、波动、反转与市值的线性
    / U 形 / S 形暴露,峰度是无量纲形状量,与总成交量水平关系弱; 平滑后换手低,15bp 成本下可做。样本外还会在的理由:成交脉冲性反映个股参与者结构(机构
    vs 散户占比),是慢变的结构性属性,不依赖某段行情。 预期:多数纯平滑版仍被 volume 相关控制部分吃掉,最有机会的是带方向的 cross_corr
