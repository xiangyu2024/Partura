  hypothesis: 想法:成交量冲击事件的「新鲜度」与事件当日的方向 = 日频的量价事件漂移。批内线索是 cross_argmax(Volume, 30)(过去
    30 日里成交量最大的那一天距今几日)出现在富集候选里, 而库里所有含它的写法都先 day_min / day_close 压成一个数、再被 ts_ / cross_
    拿去做回归,没有人把它当成「事件时钟」去读。 本位用日轴算子直接实现:(1) cross_argmax(day_sum(Amt), d) / cross_argmax(day_sum(Volume),
    d):最近一次放量日离今天多远(新鲜度),放量冲击后价格漂移随时间衰减 (Gervais-Kaniel-Mingelgrin 高成交量收益溢价 2001;Barber-Odean
    的注意力驱动买入 2008 —— 放量吸引散户注意,持续数日到数周);(2) 方向:放量事件日的收益由 cross_argmax 的位置给出,无法直接索引,因此用
    cross_corr(day_sum(Ret), 当日量的日轴冲击) 与 cross_regbeta(day_sum(Ret), 量冲击, d) 作为「量冲击与收益同向度」,
    以及量冲击 × 收益的日度乘积再做长窗口均值 cross_mean(mul(day_sum(Ret), cross_zscore(day_sum(Amt),
    20)), d);(3) 以对数换手 sub(log(day_sum(Volume)), LogFloatShares) 代替成交量水平,去掉股本规模的机械差异;(4)
    与市值桶内去均值。与库的区别:库里没有以 day_sum(Amt / Volume) 为底、以 cross_zscore / cross_argmax /
    「冲击×收益」为骨架的东西,批内是分钟轴形状量(峰度、argmax 位置)加 ts_ 滚动,骨架完全不同;它也不是 20 日反转控制 —— 反转用的是收益水平,本位用的是量冲击与收益的交互。
    样本外还会在的理由:注意力与信息消化速度是结构性的,放量后的反应不足 / 过度反应由散户占比与 T+1、涨跌停制度决定,不靠某段行情; 日轴量冲击平滑后换手低。预期:纯新鲜度版与流动性控制中度相关;交互版(冲击×收益)最可能在去控制后留下东西,约
