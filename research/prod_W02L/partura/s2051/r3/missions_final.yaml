- type: N
  hypothesis: 新 idea:「放量时成交时间分布怎么变」的日轴敏感度,但换掉峰度,改读成交量在分钟轴上的另外几种形状:日内集中度 day_gini(Volume)、成交量时间重心
    day_centroid(Volume)、成交量偏度 day_skew(Volume)、最大一分钟占比 day_at_max_ratio(Volume)、高分位量占比
    day_es_ratio_hi(Volume)。机制:本批唯一有 alpha 的写法是 cross_regbeta(量水平, 量峰度) —— 过去 60~120
    日里,放量日是否伴随成交更脉冲。它读的是个股的「量是怎么放出来的」:事件 / 大单型放量(量集中到几分钟,信息驱动)和散户均匀放量(整天铺开)的区别。峰度只是分钟轴形状的一个矩;gini
    / 重心 / 偏度 / 最大占比从不同侧面读同一件事,而且重心还带时间信息(放量是发生在开盘、午后还是尾盘 —— 尾盘放量与次日动量、开盘放量与隔夜信息的文献不同,Heston-Korajczyk-Sadka
    2010 的日内周期)。库里和 head 里这些形状量只出现在单日值 + ts_ 滚动里(换手高被成本吃掉),没有人把它们作为日轴回归的「响应」去读与量水平的敏感度。算子实现:cross_regbeta
    / cross_corr(日轴滚动回归,窗口 60~241)对 (day_sum(Volume) 或 day_sum(Amt) 或换手,形状量),再配 ts_mean
    5 日平滑(head 的拆解表明平滑是必要成分,+0.35)。与库不同:骨架里的形状算子不是 day_kurt,日轴回归的两侧是不同的形状族;也不是 20
    日反转 / 流动性控制(无量纲、回归系数而非水平)。样本外还会在的理由:成交时间分布的结构由参与者构成(机构 vs 散户)与交易制度(集合竞价、涨跌停、T+1)决定,是慢变的结构属性;回归
    / 相关系数把水平暴露去掉,留下的是动态耦合,且平滑后换手低。预测:gini / 重心版最可能过线,其余约 20% 概率各出 1 个 head。
