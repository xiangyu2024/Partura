  hypothesis: 核心 ts_mean(day_kurt(Volume), 5) 是本流唯一过线 head(+1.00,cross_regbeta(day_sum(Volume),
    它, 60))的右半边:把当天分钟成交量分布的峰度(量集中在少数几分钟 = 事件 / 大单脉冲,量铺得均匀 = 被动做市式成交)取 5 日均值,变成个股的「近一周脉冲性」。拆解里去掉
    5 日平滑后分数从 +1.00 降到 +0.65(必要性 +0.35),说明平滑本身是 alpha 成分;单独拿它做 sufficiency 是 -4.29,说明
    alpha 不在脉冲性水平本身,而在它和「成交量水平」的日轴关系里(regbeta = 过去 60 日里量水平对脉冲性的敏感度:放量时是否伴随脉冲,即放量是事件驱动还是均匀的散户换手,Easley-O
    Hara 知情交易的订单流毒性思路,2002)。已见过的外围只有 day_sum(Volume) 作为 y、窗口 60/30/120(以及 Amt 互换)。本位换三件事,都不是已见写法:(1)
    被回归 / 被关联的另一侧不再是原始成交量,而是换手 sub(log(day_sum(Volume)), LogFloatShares)、日轴放量 z 分数
    cross_zscore(day_sum(Volume), 20)、成交量形状量 day_gini(Volume) / day_centroid(Volume)、当日收益
    day_sum(Ret)(带方向的脉冲:买方事件 vs 卖方事件);(2) 窗口用 120 / 241(loc 里 60->120 的变体是 +1.20,比原
    head 还高,慢窗口更稳);(3) 用 cross_corr / cs_bucket_demean(同市值桶内) 替代 regbeta,去掉市值规模暴露。新尺子已去掉流动性
    / 波动 / 反转 / 市值的线性与 U 形暴露,峰度是无量纲形状量;平滑后换手低,15 bp 成本下可做。样本外还会在的理由:成交脉冲性反映参与者结构(机构
    / 事件型 vs 散户均匀型),是慢变的结构属性。预测:带窗口 120 的 regbeta 版最可能过线,桶内版和 corr 版大概率弱于 regbeta。
