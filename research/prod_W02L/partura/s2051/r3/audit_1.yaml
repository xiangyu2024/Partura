    reasons: '创新度 4:12 个种子保持与 head 1 相同的日轴回归骨架 cross_regbeta(day_sum(Volume), ts_mean(·,5), d),但 y 侧换成 head 1 没有的形状量:日内时间重心 day_centroid(Volume)(与 11 个 head 的原始 |ρ| 最高 0.11,是 head 完全没有的「何时成交」信息)、gini(Volume) / gini(Amt)(与最像 head 的原始 |ρ| 0.45 / 0.44,都是 ts_max(cross_med(day_ar1_coefficient(Amt))) 那一族,与 head 1 相关低)、es 比 day_es_ratio_hi(Volume)(0.06)。偏度 day_skew(Volume)(seed 3)与 head 1 原始 |ρ| 0.58,是尾部形状的近亲,是最像 head 1 的种子,但不算同一个量。与控制:seed 11 的 day_zero_ratio 与 liq 0.73、known 0.72、size 0.68 最高,seed 6 与 known 0.52、seed 10 与 known 0.48;都低于 0.8 的自动划掉线,按「明显度量同一个东西」只能挡的原则,保留,但在此记为风险。seed 1 与 seed 10 只差 Volume / Amt(gini 的 y 侧),是近重复,两者都保留。创新度 4。合理度 4:逐个核对。day_gini、day_centroid(tot 大于 0 时有定义)、day_skew、day_es_ratio_hi(分位为 0 时输出 NaN,不爆点)都是分钟内聚合,无前视;cross_regbeta、ts_mean、cross_corr 因果;cs_bucket_demean 同日截面;没有 nt_* 与 ts_spearman。划掉 seed 4:day_at_max_ratio 的 docstring 写的是「取值等于当日最大值的分钟占比」,hypothesis 写的是「最大一分钟占比」(当日最大一分钟量 / 全天量),两者不是同一个量。对连续的成交量,它几乎只计 tie 数除以分钟数;对按手数量化的成交量,结果主要由手数的 tie 决定,这是定义坏掉(§4)。相关度表里它的原始 |ρ| 只有 0.06 也与此一致。需要 PI 核对的一点(不划掉):seed 11 的 day_zero_ratio(Volume) 在停牌日如果是有限的 0 而不是缺失,停牌日 zero_ratio 为 1 且 day_sum 为 0,会主导 120 日斜率;需确认 V2 数据里停牌日已经是 NaN(停牌掩码)。我无法在本流程里核对数据,只记作风险。如果 slot b 有 alpha,最可能来自:成交时间分布(重心 / gini)与放量的日轴耦合,即参与者的交易时段结构(开盘 / 尾盘集中 vs 全天均匀)的慢变部分;最可能的是 centroid 与 gini 版,偏度版是 head 1 的换皮。'
