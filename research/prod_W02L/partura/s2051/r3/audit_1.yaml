    reasons: '创新度 3:12 个种子全部是快照 head 1 的骨架 cross_regbeta(x, ts_mean(day_kurt(Volume),5), d),只改被回归侧 x(log 换手、日轴放量 z、day_sum(Ret)、day_sum(Amt))、形状量(gini / 重心)、窗口(120 / 241 / 30 差)、corr、市值桶内或 EMA 后处理。相关度表里与 head 1 的原始 |ρ| 为 seed 9 桶内版 0.58、seed 7 corr 版 0.54、seed 1 换手版 0.53、seed 2 zscore 版 0.48,这些是同一个 head 的换写或后处理,不算本质不同。真正带来新信息的是 seed 5(day_sum(Ret),与 head 原始 |ρ| 仅 0.14,带方向的脉冲:买方 / 卖方事件)、seed 12(120 与 30 窗口之差,0.17)、seed 3 与 seed 4(gini / 重心,0.26 / 0.38)。与控制:核心本身 liq 0.35、known 0.30;seed 1 liq 0.19、seed 6 size 0.22,都在 0.5 以下,没有和控制度量同一个东西。按 §3 只有「同一个东西」才给 1,这些是换写但不同输入,给 3。合理度 4:逐个核对算子。cross_regbeta = rolling_ols 的 beta,日轴因果滚动(rolling_windows 左填 NaN),y 对 x 的斜率,所以是「脉冲性对量水平的敏感度」,hypothesis 把方向写反了(写成量水平对脉冲性),但「放量时是否伴随脉冲」的含义与算子一致,不影响分数。ts_mean 因果;day_kurt / day_gini / day_centroid / day_sum 是分钟内聚合;log 在 |x| 不超过 EPS 时返回 NaN,seed 1 不会产生 -inf;cs_bucket_demean 用同日 LogFloatCap 做截面分组,无前视;cross_ema、cross_zscore 只用到当日及以前。未命中 §4 任何陷阱,不含 nt_* 与 ts_spearman。需要 PI 核对的一点(不划掉):seed 11 的 cross_zscore(regbeta, 241) 用的是绝对 EPS = 1e-9,而 regbeta 的量级取决于成交量单位(股),若 beta 的截面标准差接近 1e-9,z 会被系统性压缩;这是量纲风险,不是已确认的数学问题。如果 slot a 有 alpha,最可能来自 head 1 的 120 日版本(放量与脉冲性的慢变耦合,即参与者结构),而不是 seed 之间的换写。'
  - slot: b
