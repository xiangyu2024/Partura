- type: N
  hypothesis: '机制:上一轮 N 位给出的唯一线索是「变化的形状」:Q 的日度对数变化的下行 / 上行半标准差之差(核心 A)在新尺子下 train +0.28 / valid +0.05,而同一批里的水平(neg 单独与 liq 0.54)、离散度(cross_stddev 两层,最好 −0.47)和相关 / 自相关(−0.5 以下)都没有。这一位把这个「变化的形状」透镜用到别的通道上,并加一个第二块想法「参与广度」。两块都是无量纲的,不乘水平。


    第一块,换通道。不同的活动序列在「跳」的时候含义不同:(a) 总量通道:day_sum(Amt) / day_sum(Volume)(整天的成交,含放量分钟,事件驱动)与 day_max(Amt)(当天最大的一根分钟成交额,单笔大单 / 新闻)的上跳偏度;(b) 价格通道:day_std(Ret) 的波动跳升对回落的不对称(波动聚集与杠杆效应的写法,和波动控制的差别是它不含水平);(c) 形状通道:day_gini(Amt) 成交集中度、day_centroid(Amt) 成交重心(0 = 开盘,1 = 收盘)在日度上的跳跃偏度:参与者构成切换(机构拆单 VWAP 对散户尾盘脉冲)时,这两个量会成跳;(d) 通道之间的差:Q 的偏度减波动的偏度(种子 7)、减总量的偏度(种子 8),分别扣掉「价格在跳」和「事件在跳」,留下「安静时段的广泛参与在跳」。


    第二块,参与广度。同一只股票放量端(q75)的增长是事件(新闻 / 涨停)、薄端(q25)的增长是广泛参与(持续的资金流入 / 做市商与机构进场),两者对后续收益的含义可能不同:种子 9 / 10 是薄端与总量的「近 20 日均值对近 120 日均值」的对数比(参与趋势),种子 11 是薄端的增长减放量端的增长(增长是否集中在事件上);种子 12 / 13 / 14 是日度对数变化的 60 日相关:薄端对总量、薄端对放量端,以及两者之差,相关高 = 跳同时出现在整个分布上(广泛参与),相关低 = 只有少数分钟在跳(事件)。


    算子怎样实现:cross_semistd_neg / pos(x, d) 对正值序列的日度对数变化取下 / 上半标准差(x > 0 且前一日 > 0,至少 3 天),sub 取差;增长 = log(cross_mean(x, 20)) − log(cross_mean(x, 120));cross_corr(cross_delta(log(x), 1), cross_delta(log(y), 1), 60) 是两个对数变化序列的 60 日 Pearson 相关;这些通道全部来自 day_* 算子,当天一个数。


    为什么和库里的不同:两个库的 5583 条表达式里 cross_semistd_* 出现 0 次,cross_delta(log(·)) 出现 0 次,day_gini(Amt)、day_centroid(Amt) 出现 0 次(它们是 Partura 后加的算子;库里含 day_max(Amt) 的 20 条都是取值、幂变换、ts_ 平滑或回归,没有一条取对数变化的形状);「对数增长之差」、「对数变化的 60 日相关」这些写法也都不在库里;所以骨架全是新的。与 3 个 head 的相关度:无量纲、不含水平,预期原始 |ρ| ≤ 0.3;与 5 个控制:偏度与相关把水平差掉了,预期 ≤ 0.3,风险最大的是种子 3(day_std(Ret) 的偏度,可能与 vol 控制的残差相关)和种子 10(总量增长,可能与 liq 有关)。


    为什么样本外还会在:每一条都有一个行为 / 微观结构上的机制,而不是对某段行情的拟合:参与的跳跃偏度 = 注意力与信息到达的节奏(Hong–Stein 1999 的信息渐进扩散:新闻先在一部分人里传,成交慢慢扩散,上跳偏度大 = 一次性涌入再回落;下跳偏度大 = 参与断崖),广度 = 参与者构成(Llorente 等 2002:成交量与收益的关系取决于是对冲交易还是信息交易)。窗口 20 到 120 日,半衰期的选择交给奖励,换手低,15 bp 付得起。风险:偏度在 60 日窗口里估计噪声大,总量通道可能被冠军(Amt 族)吃掉;如果这一位一个正的也不出,结论是「Q 的偏度那一点点信号不能推广到别的通道」。


    数学检查:无前视,窗口都止于 t 日。半标准差要求 x > 0 且前一日 > 0,day_std(Ret) 在停牌日为 0 的日子被跳过,不是填充;day_gini 与 day_centroid 在当天成交为 0 时 NaN;log(cross_mean(·, 20)) 在整窗为 0 时 NaN(|x| ≤ 1e-9 返回 NaN),是窄缺失;cross_corr 有界在 [−1, 1],有效配对少时会放大(已知行为,按小样本提醒,不是定义坏掉);没有除以近零的量,没有 ts_rank / cross_rank / in_rank_rolling。'
