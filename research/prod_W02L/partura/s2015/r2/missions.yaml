  hypothesis: '机制:第 1 轮 N 位的 70 次评估里,只有一条在新尺子(去掉 5 个控制和两个冠军)下 train 与 valid 同时为正:核心 A = sub(cross_semistd_neg(Q, 60), cross_semistd_pos(Q, 60)),Q = day_quantile_q25(Amt)(安静分钟的成交额)。A 的读数是 train +0.28 / valid +0.05,方向 −1(多头买 A 小的一端 = 上行半标准差大于下行半标准差的票),半衰期 5;它与 5 个控制的原始 |ρ| 只有 liq 0.15 / vol 0.22 / rev 0.15 / known 0.18 / size 0.01,与 3 个 head 的原始 |ρ| 0.10、残差 0.04。所以它不是水平(neg 单独与 liq 0.54、known 0.48、size 0.42 相关,是水平的代理),也不是离散度(上一轮 E 位的两层 cross_stddev 深挖最好 −0.47,没有一条为正),而是「日度对数变化的偏度」:安静分钟的成交额在 60 天里是上跳式(参与一次性涌入、慢慢回落,A < 0)还是下跳式(参与断崖式撤出、慢慢爬回,A > 0)。同批里把规模除掉的兄弟 neg / (neg + pos) 是 −0.51(train +0.05),说明承重的是「差」,并且带着规模。


    这一位的赌注:A 里有真信号,但 60 日窗口里只有少数几次跳,估计噪声大,valid 只有 +0.05(2023 年以后更弱),所以外围要回答五个问题。(a) 降噪:同一个潜变量「参与的跳跃偏度」可以在分钟成交额分布的不同位置读到,把中位数(种子 1)、q75 放量端(种子 2)、Volume 口径(种子 4)与 A 相加,是三个相关但噪声不完全相同的估计量取平均。(b) 承重的是什么:种子 3 = A − A(q75) 是「薄端的跳跃偏度减放量端的」,即广泛参与对少数分钟事件;种子 5 = A − A(Volume 的 q25),Amt 的对数变化 ≈ Volume 的对数变化 + 价格的对数变化,所以差读的是价格通道。两条的 train / valid 谁正,直接告诉我们 A 是参与还是价格。(c) 期限:种子 6 / 7 加 20 日与 120 日窗口版本,种子 8 加上前一个不重叠的 60 日窗口(共 120 日有效样本),种子 9 取 A 自己 60 日的变化(偏度正在改善还是恶化)。(d) 规模:种子 10 = A × (neg + pos) = neg² − pos²,半方差之差,给大跳更多权重,是上一轮失败的比率版的反面。(e) 桶内与状态:种子 11 / 12 在流动性(cross_mean(day_sum(Amt), 30))与流通市值十分位内标准化 / 取秩,每个桶里分布对齐,十分位书在各桶持仓相同,比线性残差更彻底;种子 13 乘上自身近 20 日涨跌的符号(参与上跳伴随上涨 = 追涨式注意力,伴随下跌 = 恐慌式抛售,若两者后续相反,A 的符号应随之翻转,Llorente 等 2002 的「成交量–收益」动态关系的写法);种子 14 用 cs_flip_by_state 按全市场成交额的状态翻转 A(热市买上跳、冷市反过来),如果 A 与状态无关这一条会明显比 A 差,这本身就是检验。


    算子怎样实现:cross_semistd_neg / pos(x, d) 是 x 日度对数变化 log(x[t] / x[t−1]) 的下行 / 上行半标准差,sqrt(mean(min(g, 0)²)) 与 sqrt(mean(max(g, 0)²)),只用 x > 0 且前一日 > 0 的日子,至少 3 天;day_quantile_q25 / day_median / day_quantile_q75 是当天 241 根分钟成交额的分位。每个种子都原样含核心 A;外围全部是「怎么降噪 / 怎么拆 / 怎么标准化」,快照里含 A 的候选共 4 个(A 自己加 3 个 N 位 GP 的变异,例如把 A 嵌进 cs_first_low20 再套 cross_autocorr_s1 / cross_product 的那条),这些外围一个也没用。


    为什么和库里的不同:两个库的 5583 条表达式里没有任何 cross_semistd_*(0 条)、没有 cs_bucket_*、没有 cs_flip_by_state、没有对数变化(cross_delta(log(·)))的写法,骨架都是新的;与 3 个 head 的相关度应当极低(A 对 head 的原始 |ρ| 0.10)。与已知族、流动性、市值的相关度也低(A 本身 ≤ 0.22)。


    为什么样本外还会在:来源是「参与上跳的偏度」,一个无量纲的形状量,不乘水平;窗口 60 日、半衰期 5,日换手低,15 bp 成本付得起。文献两个方向都有:Gervais 等 2001 发现放量日之后的收益为正(可见度 / 注意力假说),Barber–Odean 2008 说注意力事件推动散户净买入、之后有反转;A 在 train 与 valid 的方向属于前者。风险:后者在小票里更强,valid 的 +0.05 说明这一读数很薄,外围若不能把它抬到 0.5 以上,结论就是「参与的跳跃偏度有一点点信号,不够」。


    数学检查:无前视,所有窗口止于 t 日,t+1 才交易。Q 在极薄的票上可为 0,这些日子被半标准差跳过(不是填充),有效日少于 3 天时 NaN,是窄缺失;所有 sub / add / mul 都没有除以近零的量;种子 8 的 cross_delay 与种子 9 的 cross_delta 在最初 60 日为 NaN,热身期只有 2018 年头几个月;sign(cross_sum(day_sum(Ret), 20)) 只取 −1 / 0 / +1,cross_sum 把缺失日记为 0 是对收益增量的正确做法;种子 14 的状态是全市场同一个数,按 t 日及以前的 241 日中位数算,不含未来;cs_bucket_* 并列按代码顺序打破(已知行为,带板块信息)。没有用 ts_rank / cross_rank / in_rank_rolling,所以 nanrank_last 的陷阱不适用。'
