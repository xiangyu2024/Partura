attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      位 a(E)。核心 A = sub(cross_semistd_neg(Q,60), cross_semistd_pos(Q,60)),Q = day_quantile_q25(Amt)(每日 241 根分钟成交额的 25% 分位)。

      来源与门槛:
      - 核心来源合法:A 在 loc.md 的「共性」表里出现。快照里 6 个 head 都不含 cross_semistd,所以只能走共性表这一条路,这条路是允许的。
      - 与 5 个控制的原始 |ρ|:liq 0.162 / vol 0.245 / rev 0.182 / known 0.194 / size 0.014,全部 < 0.8,过。
      - 与 6 个 head 的原始 |ρ| 最大 0.237(最像的是 M2 的 add(ts_quantile_q50(cross_max(day_close(Volume),5),1), day_quantile_q25(sliding_top_sum_masked_p5(Low,High,5)))),残差 0.095。计划第一段写的「与 3 个 head 的原始 |ρ| 0.10、残差 0.04」与本表不符,以本表为准;两者都远低于 0.7。
      - 自动划掉:无。14 条与 head 的原始 |ρ| 最大 0.258(第 7 条),与控制的原始 |ρ| 最大 0.421(第 13 条的 rev),均未触发 0.7 / 0.8 的线。

      骨架与新颖性:14 条都原样含核心(逐条子树核对)。按 members.csv 的骨架格式(抽掉字段、常数、窗口)与两库 5583 条逐一对照,14 条全部不在库内(库里 cross_semistd_* 0 条)。外围也不同于 round 1 的 N 位里含 A 的候选(A 本身,以及 cross_product(cross_autocorr_s1(cs_first_low20(...,A),60),5))。核心是「对数变化的上下半标准差之差」,与 head 的「水平离散度的 ts_std」不是同一个对象。输入仍是 B043 族的 Q25(Amt),所以新颖度给 4,不给 5。

      数学核对(对照源码,不只看笔记):
      - 前视:cross_* 用的 rolling_windows 是左填充的因果窗口(AlphaCube-steering/src/alphacube/operators/common.py:433),窗口止于 t;cross_delay 是向后平移(dt_cross.py:150),不是 shift;cs_flip_by_state 的状态是 t 日及以前的市场截面均值的百分位(partura/ops_ext.py:537、562),因果;cs_bucket_* 只用 t 日截面。
      - 数值:_semistd(partura/ops_ext.py:751–762)要求 x>0 且前一日>0、至少 3 个有效日,否则 NaN,没有 0 填充;log 对 |x| <= 1e-9 为 NaN(common.py:211);没有除以近零的量。
      - 热身:最长 120 日窗口(种子 7、8、9),训练段从 2018 年起算,热身在 2018 年内结束,不主导结果。
      - 风险(不挡):Q25 对薄票可以在几百元和几万元之间跳动(对数变化 4 到 7 左右),半标准差按 RMS 计,单日跳的权重大。这是估计噪声,不是爆点(有界、非除零);liq 残差化会去掉大部分薄票效应。计划里说的「60 日窗口里只有少数几次跳」就是这个问题,它支持 PI 的降噪设计,但不构成数学问题。

      逐条(每条末句是「若有 alpha,最可能来自」):
      1. A + A_median(中位数口径):原始 0.239 / 残差 0.089,最大控制 vol 0.276。若有 alpha,来自中位数口径对薄端稀疏分钟的降噪。
      2. A + A_q75:原始 0.249 / 残差 0.094,最大控制 vol 0.285。若有 alpha,来自放量端上的同一跳跃偏度(事件型成交)。
      3. A − A_q75:原始 0.104 / 残差 0.051,所有控制 <= 0.092。若有 alpha,来自薄端偏度减去放量端偏度之后,广泛参与而非少数事件的部分。
      4. A + A_Volume(股数口径):原始 0.232 / 残差 0.094,vol 0.232。若有 alpha,来自股数口径下的同一偏度,与 Amt 口径的差落在价格通道。
      5. A − A_Volume:原始 0.206 / 残差 0.086,vol 0.348。若有 alpha,来自价格通道(Amt 与 Volume 对数变化之差近似价格的对数变化)的偏度。
      6. A + A_20:原始 0.243 / 残差 0.096,rev 0.357。若有 alpha,来自偏度的 20 日短期版本;rev 0.357 偏高,需要留意它与 20 日反转的重合。
      7. A + A_120:原始 0.258 / 残差 0.132。若有 alpha,来自偏度的长期持续性。
      8. A + cross_delay(A,60):原始 0.255 / 残差 0.176,是本位残差最大的一条(仍 < 0.5)。若有 alpha,来自偏度在相邻两个不重叠 60 日窗口之间的持续性。
      9. cross_delta(A,60):原始 0.096 / 残差 0.110,vol 0.143。若有 alpha,来自偏度自身的 60 日变化(改善或恶化)。
      10. A × (neg + pos),等于 neg² − pos²:原始 0.192 / 残差 0.080,vol 0.251。若有 alpha,来自给大跳更高的权重(半方差之差),与比率版本不同。
      11. cs_bucket_zscore(A, cross_mean(day_sum(Amt),30)):原始 0.129 / 残差 0.093,liq 0.038。若有 alpha,来自同一流动性档内谁的偏度更极端。
      12. cs_bucket_rank(A, LogFloatCap):原始 0.231 / 残差 0.093,size 0.000。若有 alpha,来自同一市值十分位内的偏度秩。
      13. A × sign(cross_sum(day_sum(Ret),20)):原始 0.164 / 残差 0.086,rev 0.421 为本位最大的控制 |ρ|(< 0.8)。符号项来自 20 日累计收益,与 20 日反转控制天然相关,这一点计划里没有说。若有 alpha,来自上跳伴随上涨(追涨)与伴随下跌(恐慌)两种含义的区分。
      14. cs_flip_by_state(A, day_sum(Amt)):原始 0.037 / 残差 0.032,所有控制 <= 0.029。若有 alpha,来自偏度在冷热市场之间的符号翻转;若 A 与市场状态无关,这一条会明显比 A 差,这本身就是检验。

  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      位 b(N)。14 条候选,无核心。自动划掉:无。与 head 的原始 |ρ| 最大 0.285(第 9 条),与控制的原始 |ρ| 最大 0.494(第 10 条的 vol),均未触发 0.7 / 0.8 的线。

      与计划的出入(以表为准):
      - 计划预期原始 |ρ| <= 0.3。实际第 9 到 11 条与控制的最大 |ρ| 为 0.39 到 0.49(流动性增长项与流动性水平、波动、已知族相关),超出预期。
      - 计划说与 head 的相关「应当极低」。残差 |ρ| 的范围是 0.032 到 0.103(第 1 到 8、12 到 14 条),只有第 9 到 11 条较高:对 C2 类二阶离散度的 head 分别为 0.434、0.459、0.335。低于 0.5,不触发替换或拒绝,但说明这三条与 C2 类 head 在去掉控制后仍有共享成分。

      骨架:14 条按 members.csv 的格式对照两库 5583 条,全部不在库内(库里 cross_semistd_* 0 条、cs_bucket_* 0 条、day_gini / day_centroid 0 条、cross_delta(log·) 0 条)。

      数学核对:
      - 前视:cross_delta、cross_corr、cross_mean 只用 t 及以前(dt_cross.py:174、193、223);day_* 是当日收盘后可得的量,交易在 t+1。
      - 半标准差(第 1 到 8 条):同 a 位,x>0 且前一日>0、至少 3 日,无 0 填充。第 3 条的 day_std(Ret) 在全日价格不动时为 0,被跳过,不是填充。
      - 对数(第 9 到 14 条):log 对 |x| <= 1e-9 为 NaN(common.py:211),是窄缺失,不是填充。Q25 对薄票为 0 的日子被跳过,不当作 0。
      - cross_corr(第 12 到 14 条):rolling_pair_reduce(common.py:621–640)的分母 count 下限为 1。没有有效配对的窗口输出 0,不是 NaN;只有 2 个有效配对时输出 ±1。表中第 12 到 14 条的覆盖率为 1.0,说明这些 0 被当成了覆盖。无效窗口的占比未知。这是 §4「缺失值填充」的形式:若停牌或薄票占比大,这三条的合理度应下调到 3。本位不挡(占比不知道),请流水线报告有效配对数 < 10 的股票占比。
      - day_centroid(第 6 条):时间轴在 [0,1] 上,首分钟为 0(partura/ops_ext.py:155–168)。当日成交集中在开盘几分钟时 centroid 接近 0,其对数变化可达 ±4 以上,单日就能主导 60 日半标准差。这是尾部风险,不挡;请流水线报告 |Δlog centroid| 的分位数。
      - 热身:第 9 到 11 条的 120 日均值在 2018 年内结束热身。

      逐条(每条末句是「若有 alpha,最可能来自」):
      1. sub(neg, pos) 作用于 day_sum(Amt):原始 0.225 / 残差 0.098,vol 0.268。若有 alpha,来自总成交额的上跳 / 下跳偏度(注意力到达的节奏)。
      2. 同第 1 条,Volume 口径:原始 0.214 / 残差 0.095,vol 0.236。若有 alpha,来自股数口径(不含价格变动)的同一节奏。
      3. sub(neg, pos) 作用于 day_std(Ret):原始 0.121 / 残差 0.040,vol 0.128。若有 alpha,来自波动的杠杆效应(下跌时波动升高快于上涨时的非对称)。
      4. sub(neg, pos) 作用于 day_max(Amt):原始 0.261 / 残差 0.101,vol 0.246、known 0.228。若有 alpha,来自单笔大单(新闻或大资金)冲击的频率非对称。
      5. sub(neg, pos) 作用于 day_gini(Amt):原始 0.133 / 残差 0.093,known 0.142。若有 alpha,来自成交集中度的跳跃偏度(从分散到集中的切换,例如机构拆单与尾盘脉冲)。
      6. sub(neg, pos) 作用于 day_centroid(Amt):原始 0.098 / 残差 0.038,vol 0.114。若有 alpha,来自成交时间分布的切换(开盘集中与尾盘集中)。尾部风险见上。
      7. A_Q25 − A_std(Ret):原始 0.207 / 残差 0.082,vol 0.217。若有 alpha,来自安静分钟的参与跳跃独立于价格跳跃的部分。
      8. A_Q25 − A_sum:原始 0.108 / 残差 0.032,known 0.123。若有 alpha,来自薄端与总量偏度之差(安静时段的参与对事件)。
      9. sub(log(cross_mean(Q25,20)), log(cross_mean(Q25,120))):原始 0.285 / 残差 0.434(对 C2 类 head),vol 0.476、known 0.415、liq 0.387。若有 alpha,来自安静分钟参与的流动性动量。它是本位最不新的一条:与控制的 |ρ| 高,残差仍有 0.43。
      10. 同第 9 条,用总成交额:原始 0.268 / 残差 0.459(对 C2 类 head),vol 0.494 为本位最大的控制 |ρ|。若有 alpha,来自总量流动性动量。残差 0.459 是本位最高的残差。
      11. Q25 增长减 Q75 增长:原始 0.235 / 残差 0.335,known 0.387、liq 0.379。若有 alpha,来自流动性增长是否集中在安静分钟(广泛参与)还是放量分钟(事件)。
      12. cross_corr(Δlog Q25, Δlog Sum, 60):原始 0.145 / 残差 0.040,vol 0.263。若有 alpha,来自薄端与总量同步变化的程度(广泛参与)。
      13. cross_corr(Δlog Q25, Δlog Q75, 60):原始 0.242 / 残差 0.103,liq 0.276、known 0.267。若有 alpha,来自分布整体是否同步(整体同步为广泛参与,只有少数分钟在跳为事件)。
      14. 第 12 条减去 Q75 版本:原始 0.151 / 残差 0.050,size 0.149。若有 alpha,来自薄端相对放量端与总量的相关差。

R:
  - head: 'ts_std(cross_stddev(day_quantile_q25(Amt), 60), 50)'
    soundness: 4
    reasons: |-
      烂部件 = 「Q25 这一个分位」的选择。计划的依据是共性表里中位数口径的离散度更好,这是训练与验证段的候选数据,允许使用。两个变体:(1) ts_std(cross_stddev(day_median(Amt),60),50);(2) ts_std(add(cross_stddev(Q25,60), cross_stddev(median,60)),50)。
      数学:无除法,窗口不变;day_median 与 day_quantile 都是当日 241 根分钟的分位(dt_day.py:151;catalog.py:169),无前视。cross_stddev 对全 NaN 窗口输出 0(AlphaCube-steering/src/alphacube/operators/common.py:556–560 的 count 下限为 1),这是继承自 head 的性质,不是新问题。
      给 PI 的注意(不挡):变体 1 与原 head 的原始 |ρ| 0.989、与已知族 |ρ| 0.715;变体 2 为 0.995 / 0.719。已知族 >= 0.5,按 §2 的替换与收录门槛,无论分数如何都不能替换或收录。
      合理度 4。若有 alpha,来自去掉 Q25 稀疏分钟噪声之后的分散度(分位口径的降噪),而不是去水平。
  - head: 'ts_std(cross_stddev(day_quantile_q25(Amt), 60), 40)'
    soundness: 4
    reasons: |-
      同一个部件,窗口 40 不动。两个变体:(1) ts_std(cross_stddev(day_median(Amt),60),40);(2) ts_std(add(cross_stddev(Q25,60), cross_stddev(median,60)),40)。无除法,无近零分母,无前视。继承 cross_stddev 全 NaN 窗口输出 0 的性质(同上)。
      给 PI 的注意(不挡):变体 1 与原 head 的原始 |ρ| 0.988、与已知族 |ρ| 0.712;变体 2 为 0.995 / 0.716。已知族 >= 0.5,无法替换或收录。
      合理度 4。若有 alpha,来自同一降噪后的 40 日安静分钟波动。
  - head: 'ts_std(cross_stddev(cross_stddev(day_quantile_q25(Amt), 60), 60), 10)'
    soundness: 4
    reasons: |-
      烂部件是 Q25 的选择(最外层 ts_std(·,10) 不动)。C2 是慢变量,对它取 10 日标准差读到的主要是斜率与噪声。三个变体:(1) ts_std(cross_stddev(cross_stddev(day_median(Amt),60),60),10);(2) ts_std(add(C2(Q25), C2(median)),10);(3) add(ts_std(C2(Q25),10), ts_std(C2(median),10))。变体 3 是两个 head 相加,不是去掉或替换部件,但它也只是替换分位,可以接受。
      数学:无除法,无前视,窗口不变;与前两组同样继承 cross_stddev 的全 NaN 窗口输出 0。
      给 PI 的注意(不挡):三个变体与原 head 的原始 |ρ| 为 0.964 / 0.983 / 0.986,与已知族 |ρ| 为 0.550 / 0.556 / 0.566,全部 >= 0.5,无法替换或收录。
      合理度 4。若有 alpha,来自 C2 的斜率与去掉乘性水平后的二阶不稳定。
summary: 两个任务位都过审(位 a 创新 4 / 合理 4,位 b 创新 4 / 合理 4),未划掉任何种子(无 >= 0.7 head 或 >= 0.8 控制的自动触发,无数学问题)。三个 R 组合理度均为 4,无数学问题,但 7 个变体与已知族 |ρ| 为 0.55 到 0.72,按 §2 的门槛不具备替换或收录资格。计划对 head 的相关数与表不一致(以表为准)。位 b 的 cross_corr 种子 12 到 14 在无有效配对时输出 0 且覆盖率为 1.0,需流水线报告有效配对数占比。
