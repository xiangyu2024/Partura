- type: N
  hypothesis: '机制:把「安静分钟成交额的波动有多大」换成「它为什么波动、波动是什么形状」。批里的现象:(1) 13 个候选全是 Q = day_quantile_q25(Amt)
    或同类分位的 60 日离散度的变形,含 Amt 的 7 条均值 −0.81、含 Low 的 4 条 −2.36(差 +1.62,p 0.001);(2) 离散度
    I1 = cross_stddev(Q, 60) 以人民币计,与已知成交额族的 rho 是 −0.91,尺子把水平剪掉后三个 head 只剩 −0.3 ~
    −0.7;(3) 套两层的 cross_stddev(cross_stddev(Q, 60), 60) 比一层好 0.75,说明「波动自己的变化」里有信息。也就是说:「波动有多大」这个量被水平绑架了,而「波动从哪里来、往哪个方向、是否持续」是无量纲的,不乘水平,也不在两个库里。

    新想法:把 Q 的波动按成因拆成五类,全部用对数变化、相关或自相关表达,所以与水平无关。(a) 方向:骤降与激增。cross_semistd_neg / cross_semistd_pos(Q,
    60) 是日度对数变化的下行 / 上行半标准差(只用 Q > 0 且前一日 > 0 的日子),以及下行占比 neg / (neg + pos)。骤降 = 做市与大资金撤出、安静分钟没人接,激增
    = 注意力涌入;两者对后续收益的含义相反,而 std 把它们混在一起。(b) 共同对个股:个股薄端流动性的对数变化对全市场同一序列(cs_mean(log(Q)),所有票同一个数)的回归
    beta 与相关(流动性共性,Chordia-Roll-Subrahmanyam 2000;流动性 beta,Acharya-Pedersen 2005:对市场流动性冲击敏感的股票要求溢价),以及扣掉市场后的个股自身波动
    cross_stddev(cs_demean(log(Q)), 60)(特质流动性波动,类比特质波动率)。(c) 与价格活动的耦合:cross_corr(Q,
    day_std(Ret), 60)、cross_corr(对数变化, abs(日收益), 60):价格动荡时安静分钟是涌入还是消失(Brunnermeier-Pedersen
    2009 的流动性螺旋:流动性与波动共同恶化的股票风险更大)。(d) 持续性:对数变化的一阶自相关,负 = 噪声主导的估计量、正 = 状态切换。(e) 形状:Q
    / q75(安静分钟对放量分钟的比,在 [0, 1],每天一个无量纲数)的均值与 60 日离散度,即成交是否均匀,与 day_gini 一族不同的是它跨日读「均匀程度的不稳定」。

    为什么和已有的不同:库里 day_quantile_q25 只出现在 cross_stddev / cross_max / ts_sum 的同量纲套法里;种子的骨架里有
    cross_semistd_*、cs_demean(log(·)) 的跨日离散度、对市场序列的回归 beta / 相关、与 day_std(Ret) 的 cross_corr、对数变化的
    cross_autocorr、Q / q75 的比,逐个对照 members.csv 的骨架集都不在库里。与 head 的相关度应该很低(无量纲量不乘水平);与已知族、流动性、市值也应该低,因为对数变化与相关把水平差掉了。与
    5 个控制的差别:控制全是水平或价格波动 / 反转,这里没有一条是水平。

    为什么样本外还会在:每一类都是有文献的风险或溢价通道(流动性共性与流动性 beta、流动性螺旋、vol-of-vol),不是对某段行情的拟合;窗口都是 60
    日,日换手不会高,15 bp 下付得起;方向 / 共性 / 耦合这几类由参与者结构决定,慢变。风险:相关与 beta 的估计量在 60 日窗口里有噪声(排名在
    EMA 下才稳);(c) 类与波动控制可能有残余相关,尺子已剪掉线性、U 形、S 形暴露;如果这一位一个 head 也不出,结论就是「Q 的波动里除了水平什么也没有」,同样有信息。

    数学检查:无前视,全部是 t 日及以前的窗口。log(Q) 在 Q = 0 时是 NaN(内核对 |x| ≤ 1e-9 返回 NaN),该日在窗口里被跳过、不是填充;cross_semistd_*
    内核要求 Q > 0 且前一日 > 0、至少 3 天,否则 NaN;beta 在窗口内市场序列无方差时 NaN;cross_corr / cross_autocorr
    有界在 [−1, 1],没有除以近零的爆点;Q / q75 在 q75 = 0 时 0/0 = NaN(窄缺失)。覆盖率以流水线的闸门为准(拆解表里 Q 相关量的覆盖率是
    0.9995,新加的 log 与半标准差只会多出 Q = 0 的日子)。热身期最长 61 日。'
