  hypothesis: '机制:本批 13 个候选与 3 个素材 head 都是同一个对象 Q = day_quantile_q25(Amt)(每天 241 根分钟成交额的
    25% 分位,即「安静分钟」的成交额水平)的离散度:I1 = cross_stddev(Q, 60) 是 60 日离散度,三个 head 再套 ts_std(50
    / 40 / 10)或再套一层 cross_stddev。拆解表读出:(1) 去掉 cross_stddev 一层,分数从 −0.30 掉到 −1.12(必要性
    +0.82),所以承重的是「离散度」这一层,不是外面的 ts_std(窗口 25 / 50 / 100 是 −0.51 / −0.30 / −0.31,基本平);(2)
    套两层的 C2 = cross_stddev(cross_stddev(Q, 60), 60) 单独就有 −0.36(train −0.36 / valid
    +0.17,方向 +1、半衰期 0),比一层的 −1.11 好 0.75,所以「离散度自己的变动」才是有信息的那一阶;(3) Amt 换成 Volume 变差
    1.2 到 1.6 分,所以承重的是成交额口径(含价格),不是股数;(4) 含 Amt 的 7 条均值 −0.81,含 Low 的 −2.36,Amt 这一族与其它口径差
    +1.62(p 0.001)。

    问题在量纲:若分钟成交额近似乘性,Q_t = L·exp(u_t),则 I1 ≈ L·σ_u,C2 ≈ L·std(σ_u):水平 L 乘着相对不稳定性。L
    正是已知成交额族(I1 与它的 rho 是 −0.91,C2 是 −0.74)、流动性、市值以及两个冠军共同吃掉的东西,所以 head 的 −0.3 ~ −0.7
    读成「水平暴露被剪掉之后的残差」。head 1 的 valid 是 +0.62 而 train 是 −0.30,方向上说明 2023 年以后的样本里 σ_u
    的不稳定已经有读数;这一位要赌的就是把 L 在表达式里去掉以后,剩下的相对不稳定性能不能把 train 也带到正。σ_u 的不稳定 = 流动性风险的不确定性(vol-of-vol:Baltussen
    等 2018 在价格波动上发现它定价为负;Chordia 等 2001 发现成交活跃度的波动与预期收益负相关),机制是行为 / 微观结构性的:参与者构成在机构拆单、量化做市、散户脉冲之间切换,会让安静分钟的成交时断时续,这种切换慢变,不依赖某段行情。

    算子怎样实现:每个种子都原样带着 C2,外围只做「去水平」或「换一个参照」,与快照里见过的 ts_std / ts_sum / cross_fangzheng
    / cross_max 套法完全不同:(1) 比率 div(C2, add(C2, I1)) 是 C2 / I1 的单调变换(秩相同),分母改成和,是为了
    I1 → 0 而 C2 > 0(尖峰刚离开窗口)时不出现无穷;div(C2, cross_mean(Q, 60)) 用均值当尺;(2) 桶内标准化 cs_bucket_zscore
    / cs_bucket_demean / cs_bucket_rank,按流动性(cross_mean(day_sum(Amt), 30))、已知族(cross_mean(day_std(Amt),
    30))、波动(cross_mean(day_std(Ret), 20))、市值(LogFloatCap)十分位:比线性残差更彻底,每个桶里分布对齐,十分位多头书在各桶持仓相同;(3)
    自身历史 cross_zscore(C2, 120)、cross_delta(C2, 40):不稳定性正在升还是降;(4) 对照价格口径:sub(cs_rank(C2),
    cs_rank(收益的 vol-of-vol))是「流动性的不稳定」减去「价格的不稳定」(两个秩相关越高,差与 C2 的相关越低,所以比回归残差去得更干净),以及与
    Volume 口径的秩差(Amt = Volume × 价,差出来的是价格水平通道,名义股价不在 5 个控制里);(5) 薄端对厚端:C2 占「C2 + q75
    口径二阶离散度」的份额,和对 day_median 的份额,回答不稳定是出在安静分钟还是放量分钟;(6) 状态交互:乘以薄端流动性趋势 sign(cross_mean(Q,
    20) − cross_mean(Q, 120)),区分「不稳定而且在枯竭」与「不稳定而且在涌入」;(7) 期限结构:C2 占「C2 + 20 / 20 日口径的
    cross_stddev(cross_stddev(Q, 20), 20)」的份额,即长窗口不稳定相对短窗口不稳定,区分「长期持续的切换」与「最近几周的脉冲」。

    为什么和已有的不同:库里含 cross_stddev(day_quantile_q25(·), 60) 的表达式全是同量纲的平滑(ts_std / ts_sum
    / cross_fangzheng / cross_max)或再嵌套 cross_stddev,没有一条做比率、桶内标准化、自身历史 z 分数、与收益口径的对照、薄端对厚端的份额或状态交互;这些骨架逐个对照
    members.csv 的骨架集都不在库里(种子的骨架检查见 notebook)。去了水平以后,它们与三个 head 的日度秩 |ρ| 预计远低于 0.7,与已知族
    |ρ| 预计低于 0.5。

    为什么样本外还会在:来源是 σ_u 自己的变动,每只股票用自己的历史或同一流动性桶里的同类作参照,不依赖截面水平;窗口是 60 加 60 日,慢变,日换手
    0.03 到 0.04(批内 head 的实测),15 bp 成本几乎不付;切换是参与者结构的变化,不是某段行情的产物。风险:去水平之后可能什么也不剩(那样这一位就是「vol-of-vol
    没有 alpha」的干净反证);桶内标准化的种子仍有流动性或市值残留,尺子已把线性、U 形、S 形暴露剪掉。

    数学检查:无前视,窗口都含 t 日收盘及以前,t+1 才交易;Q 在稀疏成交的票上可为 0,整个 60 日窗口为 0 时 cross_stddev = 0,比值
    0/0 = NaN,这是窄的缺失(拆解表覆盖率 0.9995),不是填充或热身期决定的;所有比率都用「x / (x + y)」或除以均值,分母只在整窗为 0
    时为 0,没有 C2 / 近零 I1 的爆点;cs_bucket_* 按代码顺序破并列(已知行为,带板块信息);最长窗口 120 日,热身期不主导。'
