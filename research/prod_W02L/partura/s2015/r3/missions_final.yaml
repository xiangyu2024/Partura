  hypothesis: 机制:本流唯一过线的 head(train +0.59 / valid +1.21)是 div(day_zero_ratio(Volume),
    A_amt + A_vol),其中 day_zero_ratio(Volume) = 当天有效分钟里成交量恰好为 0 的比例(停牌、涨跌停封死、极薄票整分钟无成交),A
    = 安静分钟成交额(或成交量)日度对数变化的下行半标准差减上行半标准差。拆解表显示:核心 A 单独只有 +0.05,而分子 zero_ratio 一加进来,score
    由 +0.05 升到 +0.53(分子 Volume 换成 Amt 同样 +0.53),共性表里含 day_zero_ratio(Volume) 的 10
    个候选均值 -0.07,不含的 -1.69(差 +1.62,p<0.001)。所以这个流里承重的新东西是「分钟级无成交的比例」,也就是间歇性交易 / 价格发现受阻,而不是
    head 里被它除掉的那个偏度项。本 E 位把 zero_ratio 固定为核心,在它外面换掉 head 的写法:head 是「当天值 / 偏度之和」的除法(分母会变号、会在
    0 附近爆),这里一律不用偏度当分母,改用:(1) 时间平滑(20 / 60 日均值)得到持续性的间歇交易强度而不是单日噪声;(2) 期限差 20 日 -
    120 日(无成交正在加剧还是缓解,复牌 / 解封后);(3) 与价格不动比例 day_zero_ratio(Ret) 之差:Ret 为 0 而 Volume
    不为 0 = 有成交但价格被钉住(涨跌停 / 一档),两个比例之差把「无人交易」与「有人交易但封死」分开;(4) 截面秩的加 / 乘组合(cs_rank 之和、之积)与
    A 或成交额增长组合,秩组合不涉及除法也不受量纲影响;(5) 桶内标准化(同流动性十分位内比较 zero_ratio)与按全市场成交额状态翻转;(6) 日度序列的离散度
    / 与波动的相关 / 60 日最大值,读的是无成交的不稳定性与波动聚集。算子实现:day_zero_ratio 对当天有限分钟计数 x==0 的占比,不是填充;cross_mean
    对 d 日取均值;cs_rank 是当日截面秩。为什么和库里不同:两个库 5583 条里 day_zero_ratio 是新算子,骨架为 0 条(库只用 day_quantile_q25、day_median
    等分位量);与 head 的区别是外围没有 semistd 分母,与已出 head 的相关应低于 0.7。为什么样本外还会在:无成交占比是 A 股停牌 /
    封板 / 薄票的结构性特征,持续性强、半衰期长(head 用 20),换手低,15bp 成本付得起;valid +1.21 比 train +0.59 更好说明不是只靠
    2018-2019 的停牌潮。风险:它可能只是低流动性 / 小市值的另一个代理(尺子已去掉线性、平方、立方暴露,但没去掉停牌这一类状态),如果是,外围里的桶内标准化版本会明显变差,这本身就能回答。数学检查:无前视,窗口止于
    t 日;zero_ratio 取值 0..1 无近零分母;种子 6 的分母 cross_mean(q25(Amt),60) 在极薄票上可能为 0(已知风险,仅一条种子,若爆点支配则自动被
    ρ / 度量排除);cs_rank 并列按列序打破。
  seeds:
