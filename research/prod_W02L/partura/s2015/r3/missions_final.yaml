- type: N
  hypothesis: 机制:本流 head 的拆解说明承重量是「分钟里无成交的比例」(day_zero_ratio(Volume)),它读的是当天价格发现是否连续:停牌、涨跌停封死、极薄票整段时间无人成交。这一位提出的新想法是:无成交只是日内「活动不连续性」的一个读数,同一类现象还有
    (a) 最长的连续无变化分钟段 day_flat_run_max(Volume) / day_flat_run_max(Ret)(最长的一次断档,而不是断档总量,区分「均匀稀疏」与「一次大断档」,一次大断档
    = 午间前后集中停摆或封板);(b) 日内不同收盘价的比例 day_distinct_ratio(Close)(价格在多少个不同档位上成交:低价股、一档大的票价格格点少,分钟间重复多,读的是
    tick 约束而不是流动性水平);(c) 价格不动的分钟占比 day_flat_ratio(Ret);(d) 价格不动与成交为零之差:Ret 不动但 Volume
    非零 = 有成交但价格被钉(涨跌停 / 整数关口),说明有人在买卖但不能发现价格,这是与「完全无人交易」相反的状态。预期:被钉住的票(价格有成交没位移)是被压抑的需求
    / 供给,价格发现延后,多头买「有成交但不动」的一端?方向由尺子自动判定,两个方向都可能。算子实现:day_flat_run_max(x) 取当天最长的一段相邻分钟值完全相等的长度;day_distinct_ratio(x)
    = 不同取值数 / 有效分钟数;day_flat_ratio(x) = 相邻分钟相等的比例;外层用 cross_mean(d 日)平滑,cross_stddev
    取其不稳定性,cross_delta(60) 取其变化,cs_rank 之积 / 差做无量纲组合,cs_bucket_zscore 在流通市值桶内标准化(去掉小票的格点效应),cs_flip_by_state
    按全市场成交额状态翻转(热市 / 冷市断档含义相反的检验)。为什么和库里不同:两个库 5583 条的原子是分位 / 极值 / 时序统计,没有这几个日内「相等性」原子(骨架
    0 条),不是已有 head 换写法;与 head 的区别是 head 的核心是 zero 占比 / 偏度比,这里不含 day_zero_ratio 与 semistd
    的组合(只有一条种子含 day_zero_ratio,用来检验与 head 的关系)。为什么样本外还会在:这是交易规则(涨跌停、一档价位、停牌)带来的结构性现象,不依赖某一段行情,与
    head 同源但读数不同,可以带来 head 之外的暴露。风险:day_flat_run_max / day_flat_ratio 可能与流动性或价格水平高度共线(尺子已去掉线性、平方、立方暴露);day_distinct_ratio(Close)
    与价格水平(低价股)相关,已用 LogFloatCap 桶内标准化版本检验。数学检查:无前视(窗口止于 t);比例取值 0..1,无近零分母;停牌日分钟值全
    NaN 时 day_* 返回 NaN,cross_mean 对缺失天数的处理是窄缺失,不由填充决定;没有用 ts_rank / cross_rank,nanrank_last
    陷阱不适用。
  inspired_by: B043 / 共性表里含 day_zero_ratio(Volume) 的候选(均值差 +1.62)与 head 拆解:承重的是分钟级间歇交易(无成交分钟占比),而不是分位偏度;这一位把「间歇性
    / 价格被钉住」这类日内微观结构形态换成别的原子读出来。
  seeds:
  - cross_mean(day_distinct_ratio(Close), 20)
  - cross_mean(day_flat_ratio(Ret), 20)
  - sub(cross_mean(day_flat_run_max(Ret), 20), cross_mean(day_flat_run_max(Volume),
    20))
  - cross_stddev(day_flat_run_max(Volume), 60)
  - cross_corr(day_zero_ratio(Volume), day_zero_ratio(Ret), 60)
  - cs_bucket_zscore(cross_mean(day_distinct_ratio(Close), 20), LogFloatCap)
  - cross_delta(cross_mean(day_flat_ratio(Ret), 20), 60)
  - sub(cs_rank(cross_mean(day_distinct_ratio(Close), 60)), cs_rank(cross_mean(day_flat_ratio(Ret),
    60)))
  - cs_flip_by_state(cross_mean(day_flat_run_max(Volume), 20), day_sum(Amt))
