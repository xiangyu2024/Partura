  hypothesis: 机制。本流第1轮 Pr1a 的最好候选是 cs_first_low20(LogTotalCap, day_es_ratio_hi(inv(cross_max(Close, 241)))),净夏普 +0.38/+0.38(train/valid 都为正,是本流仅有的正读数),它的结构是「用一个价格路径状态 x 划出最低 20% 的带并整体置顶,带内按总市值排」。而本流其余候选(单独的锚定比值、隔夜日内均值)都是负的。这说明被奖励的是「条件」而不是单个读数:状态(离一年高点多远)× 规模的交互,即深度回撤的大市值股票(机构持仓为主,回撤后均值回复,而非小票的垃圾股)与靠近高点的小市值票,两种带的行为不同。尺子去掉的是对市值、反转、波动的线性/平方/立方暴露,而分带置顶是阶跃,去不掉。算子怎样实现:用 cs_first_low20 / cs_first_high20 / cs_first_low40 / cs_last_* 这些带算子,x = 现价 / 一年(或半年)内高点 (day_close(Close) 对 cross_max,无量纲,后复权基期抵消),y 换成总市值、流通股本、慢的日内收益均值、隔夜减日内之差;并把角色互换(用市值划带、带内按锚定比值排)。与库里已有的不同:库里 5583 条没有这种「锚定比值划带 + 内部另一变量排序」的写法(两个库的骨架已被禁,我选的外层 cs_first_*(单字段, 价格路径比值) 骨架不是库里的);第1轮 N 位是把比值单独读,这一次是条件交互。为什么样本外还会在:规模×回撤的交互来自参与者结构(机构 vs 散户)和融资融券约束,是慢变的;比值只用 t 日收盘及以前的后复权价格;x 在窗口内换手低(一年高点只在新高时变),所以带的成员更替慢。数学检查:分母 cross_max / cross_min 是正价格,不除近零;cs_first_* 的带由并列整块判断,一年窗口内未满的热身期为 NaN(train 起点附近),不主导;不用 argmax,没有并列过多的问题。如果有 alpha,最可能来自深度回撤带中大市值(或慢的日内强度更高)的票的修复。
