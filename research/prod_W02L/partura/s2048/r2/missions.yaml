  hypothesis: 机制。库里的结构批里最显著的共性子树是 cs_first_low20(LogTotalCap, ListAge):把上市最短的 20% 次新股整体置顶,其内部按总市值排名。次新股溢价(IPO 彩票偏好、注册制前后的新股炒作与上市初期的参与者构成)是由 ListAge 这个日频字段决定的结构属性,不是某段行情;置顶是阶跃而不是线性暴露,所以尺子里 5 个控制(含市值的线性/平方/立方)去不掉它,这是核心含 +0.93 均值差(p 0.039)的原因。但核心本身的毛排序里,次新股内部按市值排只是一个粗读数,非次新股部分按市值排基本是市值控制。这一次的外围处理不再给核心再叠市值,而是:(1) 用价格路径状态(现价/一年高点,George-Hwang 锚定;后复权基期在比值里抵消)来换掉非次新部分的排序(add / sub 核心,或把核心当 y 放进 cs_first_low20/high20 的第二层状态带里),(2) 用慢的日内/隔夜拆分(Lou-Polk-Skouras)在次新股带内部重排,(3) cross_ema 把阶跃平滑成慢信号,降换手。与以前不同:本流第1轮的锚定/隔夜种子都是单独使用,没有一个和次新带组合;核心外围此前未被试过(快照里含核心的 4 个候选都是 cross_min 或无外围)。为什么样本外还会在:ListAge 带随时间自然更替,次新股制度(涨跌停放宽、注册制)改变的是幅度不是方向;锚定比值只用 t 日收盘及以前的价格,无前视;cs_first 在并列块上整块判断,不会按列序随意切带。数学检查:比值分母是正的后复权最高价,不是近零量;ListAge 为日频整数,最低 20% 的带由整块并列决定,带可能比 20% 窄但不会为空常数面板;核心外加比值后量纲不同(核心在 (0,2],比值在 (0,1]),但只是加权差,不产生爆点;无前视。如果有 alpha,最可能来自次新股带的内部排序与带外的锚定读数。
