summary: '两个位都过审计:位 a(E,核心 cs_first_low20(LogTotalCap, ListAge))创新 4、合理 3,位 b(N,比值划带)创新 4、合理 3,无种子划掉(与 head 与控制的 |ρ| 都没有触发自动划掉,也没有数学问题)。两处定义偏差要写进结果解释:cross_max(…,241) 对上市不满 241 天的票不是 NaN 而是上市以来的最高(PI 笔记的「热身期 NaN」说法不对),年轻票可能混进深回撤带;另外快照里 3 个 head 的 score 为 -1.13 / -1.16、低于 0.5 的发现线,却仍标为 head,需要 PI 核对是否是旧尺子遗留。'
