slots:
  - slot: a
    novelty: 4
    soundness: 3
    struck_seeds: []
    reasons: '位 a 是 E 深挖,核心 cs_first_low20(LogTotalCap, ListAge)。创新度:核心与快照 3 个 head 的原始 |ρ| 最大 0.12,残差 0.30;12 个种子与 head 的原始 |ρ| 最大 0.40(种子 2 、3 、4 、7 在 0.08 到 0.20 之间),与 5 个控制的 |ρ| 全部 < 0.5(最大为种子 11 的 liq 0.49、known 0.48,核心本身为 liq 0.35、known 0.32、size 0.25)。head 全是 day_std(Volume) 一族,次新股置顶这个结构不是 head 也不是控制的换写。注意:核心本身不在 struct/members.csv 的 5583 条里(该文件里没有任何 ListAge 或 cs_first 字样),它来自 loc.json 的 enrichment(4 个候选,均值差 +0.93,p 0.039),是快照候选而非库成员,所以不按库骨架算重复。自动划掉:无(与 head |ρ| 全部 < 0.7,与控制 |ρ| 全部 < 0.8)。数学核对:(1) cs_first_low20 在 ops_ext.py 的 _lexi / _rank_block 里按并列块整块判断带,带宽不超过 20%,输出 (0,2] 无 NaN,此处没有问题;(2) ListAge 有并列,整块判断正确。问题(不构成数学问题,所以不划种子,只降到 3 分):(a) cross_max(day_close, 241) 经 rolling_windows 左填 NaN,nanmax_last 跳过 NaN,所以上市不满 241 天的票不是 NaN,而是「上市以来的最高价」比值。而核心的带恰好是最年轻的 20%,这部分票的比值锚定的是上市以来而非一年高点。PI 笔记里「热身期为 NaN、不主导」的说法与代码不符。这是定义上的偏差,落在本位想研究的人群上,不是 NaN 或爆点,故不划。(b) 种子 2 、3(add / sub 核心与比值)里比值在 (0,1] 内的散布约 0.2,而带的阶跃是 1,带的成员不再是硬阶跃而是软的;笔记说「置顶是阶跃」对这两个种子不成立。(c) 种子 10(add 核心与 ON 的 120 日均值)里 ON 均值的量级约 1e-3,而排名相邻的一步约 2e-4(约 5000 只票),它只能轻微搅动核心的邻近次序,没有做成「带内重排」。机制本身清楚:次新股的 IPO 彩票偏好与注册制后的炒作,是由 ListAge 决定的结构属性;这个机制本身应给 4 分,但算子组合在外围的实现有上面三处偏差,故合理度给 3。如果有 alpha,最可能来自:最年轻 20% 带内部按市值的排序(新股溢价与规模的交互),其次是上市以来比值对这一带的锚定读数;后者要先排除上市天数的混杂。'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: []
    reasons: '位 b 是 N 新想法:价格相对一年高点的比值 x 划带,带内按另一变量排序(角色互换也在内)。创新度:与快照 3 个 head 的原始 |ρ| 最大 0.40(种子 2,LogFloatShares 版本对 cross_mean(day_std(Volume),20));与 5 个控制的 |ρ| 最大为种子 11 的 known 0.62、liq 0.63(低于 0.8,不自动划);种子 2 的 size 0.45。没有一个种子与控制或 head 是同一度量的换写,head 全是 day_std(Volume) 一族,比值状态划带与它不同。库里 struct/members.csv 没有 cs_first 结构,所以这个外层骨架对库是新的。注意:种子 1 、5 、6 、10 与种子 13 是 r1 的 Pr1a 冠军 cs_first_low20(LogTotalCap, day_es_ratio_hi(inv(cross_max(Close, 241)))) 的家族(种子 1 把 ES 比值换成原始比值,种子 13 把 Close 换成 Open),但冠军本身不是 head,也不是 5583 条库成员的骨架,所以不按重复划掉;种子 13 在 r1 只单独评过 day_es_ratio_hi(inv(cross_max(Open,241)))(-0.48),带的外层没有被试过。自动划掉:无。数学核对:(1) div(day_close, cross_max(day_close, w)) 的分母是后复权收盘的窗口最大,为正且不小于分子,不除近零,没有数值问题;(2) cs_first_* / cs_last_* 与 slot a 同一套 _lexi,带按并列块整块判断,没问题;(3) 与 slot a 同样的定义偏差:cross_max(…,241) 对上市不满 241 天的票是「上市以来最高」,不是 NaN。这里更要注意:带是「比值最低 20%」,即深度回撤的票,而年轻票的比值大多是上市以来的最高(新股上市后回落的多),所以年轻票可能被系统性地推进深回撤带;这意味着 r1 的 +0.38 可能部分是上市天数的混杂,而不是锚定 × 规模的交互。这是定义偏差而不是 NaN 或爆点,不划种子,合理度给 3。PI 笔记里「一年窗口未满为 NaN」同样与代码不符。机制清楚:George-Hwang 锚定加上规模交互,比值只用 t 日及以前的价格,无前视,所以机制给 4 的分值之外再扣在算子定义上。如果有 alpha,最可能来自:深度回撤带中大市值票的修复(锚定与规模交互),或其次是上市天数的混杂。建议 PI 在验证时加 ListAge 大于等于 241 的子样本或对 ListAge 取残差,以分开这两个来源。'
