    -6.4:单日读数每天换名次,换手把毛收益吃光;唯一不是它的成员 pow_2(pow_2(sigmoid^3(day_min(Close)))) 读的是后复权收盘价的水平(训练
    +1.40,IC 为负 -0.010),水平信号换手低、扣费后活得下来,说明这把尺子奖励慢的、低换手的东西。day_min(Ret) 一族相邻流已在深挖(尾部动力学),这里不重复它,而是把「水平慢信号能活」这条线接到一个有行为金融依据的读数上:价格相对自己一年内高点
    / 低点的位置(锚定效应)。

    George–Hwang(2004)的「52 周高点」:投资者把 52 周高点当锚,现价离高点越近,越不愿给出好消息的溢价,对利好反应不足,之后收益更高;现价离高点远的票,利空被当成已兑现,反而被过度抛售,收益较低。机制来自锚定与处置效应,不是某段行情的风格,而且信号只在窗口内的极值易主或价格明显移动时才变,换手天然低,扣
    15 bp 后不致命。

    算子怎么实现(全部只用 t 日收盘及以前的后复权价,没有前视)。H = day_close(Close)(日收盘价,后复权);比值 H / cross_max(H,
    w) 是无量纲的「离高点多近」,后复权基期在比值里抵消,所以它不是价格水平也不是累计收益,而是路径形状;w = 241 / 120 / 60。其余写法读同一个锚点的不同侧面:(1)区间位置
    (H - min) / (max - min);(2)离低点的距离 H / cross_min(H, 241);(3)高点出现的时间 cross_argmax(H,
    241) 与低点出现的时间之差(新高多久了);(4)近 20 日的高点相对一年高点(George–Hwang 的近期高点版本)与 20 日前价格相对一年高点(去掉最近
    20 日的短期反转);(5)用 VWAP 对日内最高价的版本(去掉收盘价尾盘噪声);(6)短窗口比值减长窗口比值(锚点在不同时间尺度上是否一致);(7)近
    20 日最低相对一年最低(低点在抬高还是在下移)。

    为什么和库里已有的不同。我在 struct/members.csv 的 5583 条里查过:div(day_close(Close), cross_max(...))
    这个骨架 0 条,cross_max(day_close(Close), w) 的写法 0 条(含 cross_max(day_close( 的 14 条全是
    Volume 的);day_close(Close) 在库里 12 条,都是做分母的归一化(日振幅 / 收盘)或被 ts_med 包着。cross_max
    / cross_min 共 340 多条,但都嵌在 ts_*、cross_fangzheng 等多层结构里,没有「现价对自己高点的距离」这个读数。

    为什么样本外还会在。锚定 / 处置效应是行为偏差,George–Hwang 在美股、之后多个市场里都有报告;读的是路径形状而不是水平,不依赖某段行情的风格。风险写在这里:这个比值与
    20 日反转控制、波动控制有一定相关(波动大的票离高点更远;最近大跌的票比值低),尺子会把对它们的线性、平方、立方暴露去掉,剩下的取决于一年尺度的锚点相对
    20 日反转多出来的那一部分;停牌日 cross_max 对有效值取极值,不会产生 0 或爆点。

    数学检查。(i)分母 cross_max(H, w) 与 cross_min(H, w):后复权收盘价为正,窗口内无有效值时是 NaN(跳过),不是爆点;(ii)(max
    - min) 在窗口内价格不动(长期停牌 / 一字板)时为 0,得 NaN 或 inf 的只有极少数票,每天截面排名只受极少数点影响,量级上没有浮点溢出;(iii)全部是
    t 日收盘及以前的值,没有前视;(iv)热身期 w 个交易日之前为 NaN,是 train 起点附近少量日期的缺失,不是主导。'
