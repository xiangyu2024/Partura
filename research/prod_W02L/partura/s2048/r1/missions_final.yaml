- type: N
  hypothesis: '机制。B142 的现象:这批只有一个读数 day_min(Ret),含 sigmoid / pow_2 的各种写法在尺子下等价,训练净夏普
    -6.4(单日读数,每天换名次,换手吃掉全部收益);它读的是一天内收益的尾部,A 股的日内尾部大半是事件(涨跌停打开 / 封板、公告),事件当天的单点读数没有持续性。库里整个日内收益分布矩(day_skew
    / day_kurt / day_min / day_max of Ret 共几百条)说的都是一天内部发生了什么,把收盘到收盘当作一条连续路径。我从另一个维度换读数:把一天的收益切成「隔夜」与「日内」两段。

    Lou–Polk–Skouras(2019,拔河):机构、专业交易者更多在夜里(开盘集合竞价)对信息做出反应并建仓,零售更多在连续竞价阶段交易;个股隔夜收益的横截面有持续性(隔夜动量),日内收益则有反转特征。这是由「谁在什么时段交易」决定的结构属性,不是某年的风格。

    算子怎么实现(没有前视:隔夜收益 ON_t = Open_t / Close_{t-1} - 1 在 t 日开盘就已确定,日内收益 ID_t = Close_t
    / Open_t - 1 到 t 日收盘确定,都在信号计算日收盘之前)。ON = sub(div(day_open(Open), cross_delay(day_close(Close),
    1)), 1);ID = sub(div(day_close(Close), day_open(Open)), 1)。写法:(1)ON 的 20 / 60
    / 120 / 241 日均值,(2)ID 的 60 / 241 日均值,(3)二者之差(隔夜与日内的拔河强度,窗口 120 / 241 与 EMA 60),(4)差按
    120 日 ON 波动归一,(5)ON 与 ID 的 120 日相关(为负 = 隔夜涨幅被日内回吐,零售在追高),(6)昨日隔夜对今日日内的 120 日回归斜率,以及昨日日内对今日隔夜的斜率(跨时段反应函数),(7)|ON|
    与 |ID| 均值之差(信息在夜里还是在盘中释放)。

    为什么和库里已有的不同。我在 members.csv 里查过:day_open 出现在 145 条,但都是做分母的归一化(日振幅 / 开盘)或分钟级切片,没有一条与
    cross_delay(day_close(...), 1) 做比得到隔夜收益,cross_delay(day_close 的写法 0 条;也没有「隔夜 vs
    日内」的拆分。相邻的是日内 Ret 分布矩,它们在一天内部计算,看不到夜里发生的那一段。

    为什么样本外还会在。参与者构成(机构夜里 / 零售盘中)是慢变的个股属性,2018 年以来集合竞价、涨跌停制度和投资者结构变化不大;所有种子都是 ≥ 20
    日(多数 ≥ 60 日)的均值,换手低,扣 15 bp 后不致命。风险写在这里:隔夜收益的长均值与总收益 / 20 日反转控制相关;ID 均值与反转相关更强;与市值、流动性也可能有关(小盘跳空更大)。尺子会去掉线性、平方、立方暴露,剩下的是隔夜相对日内的拆分;若仍与控制纠缠,结果可能是零。

    数学检查。(i)除数 day_open(Open) 与 cross_delay(day_close(Close), 1):后复权价为正,不除近零;停牌日 Open
    缺失为 NaN,cross_mean / cross_ema 跳过,不是 0 填充;(ii)第一个交易日无前收为 NaN,是热身期;(iii)后复权价序列抵消了除权跳变,隔夜收益不含除权缺口;(iv)归一化种子分母加了
    0.001,有下限;一字涨跌停的 ON 值有界(约 ≤ 21%);(v)cross_regbeta / cross_corr 在窗口内常数时为 0 或 NaN,不是爆点;(vi)没有前视。'
