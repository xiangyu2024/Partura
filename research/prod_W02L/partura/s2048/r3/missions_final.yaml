- type: N
  hypothesis: 机制。涨跌停幅度是交易所按板块设定的制度属性(主板 10%、创业板/科创板 20%、ST 5%,数据里是日频字段 LimitWidth
    与 BoardCode), 不同板块的投资者构成与「彩票式」博弈空间不同(Kumar 2009;Bali-Cakici-Whitelaw 2011 的极端收益偏好),所以同一个读数(小市值、
    日内回吐、振幅)在不同板块的定价不同。本流 r2 的成功 head 把「阶跃带 × 另一变量排序」作为被奖励的结构,但带变量一直是 ListAge 或慢的日内收益;本轮的新想法是把带变量换成板块/涨跌幅制度:用
    cs_first_*/cs_last_* 以 LimitWidth 或 BoardCode 划带(并列整块判断,因此带是「整个板块」而不是任意切点),带内/带外按总市值、流通股本、慢日内收益、一年高点比值、
    慢振幅排序,或用 cs_bucket_demean/zscore 在板块内部去中心化。与库里已有的不同:库里 5583 条没有一条以 LimitWidth
    / BoardCode 为带变量(两个库的骨架已被禁,而这些种子的外层骨架是 cs_*(字段读数, 日频制度字段));与 r2 的 head 也不同,它们的带是
    ListAge 或 C。为什么样本外还会在:板块制度是缓慢变化的(2020 年创业板注册制把涨跌幅放宽到 20% 是一次性、之后稳定的结构变化), 以它划出的参与者群体稳定;阶跃不会被
    5 个控制的线性/平方/立方暴露去掉;不依赖任何一段行情。数学检查:LimitWidth / BoardCode 是日频 离散字段,并列块巨大,带可能比 20%
    窄甚至为空(此时只剩 y 的排序,不会是常数面板,因为 y 保持序数排名);cs_bucket_* 在桶内不足 2 只时返回 NaN;分母只有正价格;无前视。如果有
    alpha,最可能来自某一板块内部的小市值/日内回吐读数,而不是板块本身。
