  hypothesis: '机制。本流唯一成功的 head 族(r2 的 E 位,6 个 head,score +0.6~+1.07)形如 cs_first_low20(Y,
    C), 其中 C = cross_mean(sub(div(day_close(Close), day_open(Open)), 1), 241) 是过去一年的平均日内收益(收盘/开盘-1)。
    拆解表给出关键事实:把 Y 里的 ListAge 拿掉(knockout)分数几乎不变(+1.02 对 +1.07),把 C 单独拿出来是 -4.39; 所以
    alpha 来源不是次新股,而是「C 最低的 20% 的票被整体置顶,其余票按 Y 排序」这个阶跃交互,方向 -1 意味着多头腿是 C 不在最低 20% 带里、且
    Y(总市值)偏小的老股。经济解释:A 股日内收益长期为负、隔夜收益为正(Lou-Polk-Skouras 2019 的隔夜/日内拆分,以及 A 股开盘跳涨后回落的散户集合竞价追涨),一年平均日内收益最差的
    20% 是持续被开盘价「透支」的炒作票(开盘冲高、 日内回吐),它们是被挖出的雷区;避开雷区后在剩余票里做小市值多头,是一个由持续的参与者结构(散户集合竞价追涨)决定的阶跃。
    阶跃不会被 5 个控制的线性/平方/立方暴露去掉,换手低(C 是 241 日均值)。本次的外围处理与 r2 已见过的写法很不一样: r2 的所有 head
    都是「cs_first_low20(次新股·市值 的两层核, C 或 C 的变体)」,即 C 只当带变量、Y 只当(次新股·市值)。这次 (1) 换 Y:流通股本、流通市值、总市值与流通市值之差(限售股占比)、一年高点比值、慢的隔夜收益、慢的日振幅(High/Low,彩票偏好,Bali-Cakici-Whitelaw
    2011); (2) 换带的宽度和方向(low40 / high20 / last_*),并用两层嵌套的带(先按隔夜读数划一层,再按 C 划一层)把「隔夜透支」和「日内回吐」
    两个角度分开;(3) 用 cs_bucket_demean 取代阶跃,检验是不是「带」而不是「连续暴露」在起作用。数学检查:C 是价格比值的 均值,分母 day_open
    是正价格,无近零爆点;cs_first_* 的带由并列整块判断,C 在 241 日热身后每天几乎无并列;ListAge 与 LogTotalCap 是日频字段,无前视;cross_delay
    取的是过去值。如果有 alpha,最可能来自「避开持续被开盘价透支的票」后的小市值老股 (低估值、低关注),以及在带外按另一读数(振幅)排序产生的与市值不同的暴露。'
