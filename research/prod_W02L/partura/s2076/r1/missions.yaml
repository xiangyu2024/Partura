    hypothesis: 'Core = head 1 子树:pow_2_5 对负数返回缺失,所以 pow_2_5(pow_2_5(Ret)) 只保留上涨分钟的 Ret^6.25,day_var 就是当天上涨分钟尖峰的离散度,即「日内向上跳跃 / 彩票性」强度(MAX 效应的分钟版,偏好彩票的散户会过度追捧导致之后被低估)。现有 head 把它用 ts_sum 10 再 cross_sum 241 做成长期水平,train -0.25 / valid +0.07,水平型写法基本被市值和已知波动族吸收。这次的外围完全不同:不取水平,取「彩票性的变化 / 惊喜」:短窗 EMA 减长窗 EMA、截面 zscore、cross_stddev(彩票性的不稳定)、分位尾部均值、以及用当天总方差归一。机制是散户注意力随跳跃爆发而突变,边际变化比长期水平更能分出下一阶段的过度定价;减长窗均值相当于去掉股票自身的常态水平(对市值/波动的静态暴露),所以残差后仍留下信息。样本外会在:行为偏差(彩票偏好 / 注意力)持久,且 A 股散户占比高。'
