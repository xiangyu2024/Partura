    hypothesis: '新想法:分钟级「成交额 -> 下一分钟收益」的引领滞后相关。day_corr(Ret, in_delay(Amt, 1)) 度量当天每一分钟的收益与前一分钟成交额的相关:为正说明放量之后价格继续沿推动方向走(知情交易者分拆订单、冲击逐步被吸收,动量型),为负说明放量之后回吐(流动性冲击型 / 噪声交易者推高后反转)。库里的 day_corr 类 head 都是同分钟的 Ret 与 Amt(或其波动的平滑量)的同期相关,没有时间错位;错位后度量的是价格发现的速度,而不是同期的量价关系。in_delay 空出的前 d 分钟是缺失(不是 -1 填充),day_corr 只用有效分钟,没有数值伪影。日间再用 cross_mean / cross_ema 平均去噪:持续地处于「放量后回吐」状态的股票,其做市成本 / 逆向选择成本更高,价格被短期冲击推偏,之后会被纠正;这类微观结构特征与市值、波动、20 日反转暴露关系不大。样本外会在:微观结构的反应方式由市场参与者结构决定,变化慢。'
    inspired_by: '批里的 day_corr(波动平滑量, Amt) head 与 day_cov(Low, Ret)、day_autocorr_n1(High) 等分钟级相关类候选:它们都没有做量对后续收益的错位,这里补上。'
