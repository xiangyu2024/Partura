    reasons: '相关度表:核心 day_zero_ratio(Amt) 与 liq 0.73、known 0.72、size 0.55 的 |ρ| 偏高,它度量的是成交稀薄度,本质上接近流动性控制的换写法;残差化后仍与 head 有 0.46 的相关,这是创新度要扣的地方。核心与各控制 |ρ| 都 < 0.8,过 E 的控制门。创新度 3:外围里种子 1(ts_corr 与 day_skew(Ret))、5(与成交重心 day_centroid)、7(ts_cov 与 day_skew(Ret))、8(尾盘分段对比)、9(前半小时偏度)、11(ts_corr 的 z-score 版)与 head 的 |ρ| 都在 0.03–0.28,与控制 ≤0.13,是新的量。种子 2(与 day_pos_ratio(Ret))、3(与 day_std(Low))、4(与 day_gini(Amt))、12(与 day_es_ratio_hi(Close))与 liq / known / size 相关 0.44–0.66,其中 3 的 day_std(Low) 带价位量纲,ts_cov 会把价位水平带进来,换写法的可能性大,不能给高分。整体 3。合理度 4:逐个算子核对,ts_corr、ts_cov 的常数序列返回 0 不是伪影;day_gini、day_centroid 在零成交日有 tot>0 的掩码,返回缺失而不是 0,不会人为制造与 zero_ratio 的相关;day_pos_ratio(Ret) 把零收益分钟计为非正,与零成交分钟有机械耦合,这会让种子 2 的 ρ 偏高一部分,但不是数学错误。核心单独 distinct 仅 0.027,是因为它落在 k/241 的离散网格上,门槛未过;候选本身 distinct 均 ≥ 0.96,不是面板常数,不挡。机制:成交稀薄 / 无成交分钟意味着流动性提供者缺席,价格形状随之变化,对应价格冲击补偿。如果它有 alpha,最可能来自流动性溢价,并可能与 size 控制未吸收的小票尾部有关。划掉的种子:6(与 head 的 |ρ| 0.78 ≥ 0.7,自动划掉)、10(与 liq 的 |ρ| 0.85 ≥ 0.8,自动划掉,门槛也未过)。存活 1、2、3、4、5、7、8、9、11、12 共 10 个。注意:种子 1 与 11 共用内层 ts_corr(zero, day_skew(Ret), 20),只是外层分别为 30 日均值与 40 日 z-score;两者的两两 |ρ| 不在相关度表里,不能确认为重复,保留,留给下一轮的库禁令处理。'
