    reasons: '相关度表:核心 cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)),10),30) 就是快照 head 1 sigmoid(...) 的主体(原始与残差 |ρ| 都是 1.00),按 E 规则这是设计使然;核心与 liq 0.24 / vol 0.16 / rev 0.02 / known 0.26 / size 0.10 都低于 0.8,过 E 的控制门。创新度 3:外围里种子 1(cross_zscore 60,ρ 0.56)、3(cross_ema 20,ρ 0.59)、10(减 120 日水平,ρ 0.60)只是同一信号的标准化、平滑、去水平换写法,与 head 仍高度相关;种子 2(10 日均值减 30 日均值,ρ 0.07)和 12(与 day_pos_ratio(Ret) 版的 z-score 差,ρ 0.17)是结构上真正不同的量(持续性的变化),但只占 5 个存活种子中的两个,整体不到 4。合理度 4:逐个算子核对(cross_mean、ts_cov、day_zero_ratio、day_skew、sqrt、cross_ema 为因果半衰期写法、cross_zscore 为含当日的滚动窗、ts_mean、ts_decay_linear、cross_tail_mean_q75、cs_winsor),没有前视;sqrt 对负偏度返回缺失是有意只留正偏部分,不是伪影。机制说得通:成交额为零的分钟占比衡量薄成交,与日内向上尖峰持续共动,对应的是流动性缺席下的单边推动,补偿是流动性 / 彩票偏好溢价。如果它有 alpha,最可能来自这一溢价,而不是 liq / known 控制能吸收的水平项。划掉的种子:4(ρ 0.73)、5(0.85)、6(0.99)、7(0.90)、8(0.98)、9(0.89),都是与 head 的日度秩 |ρ| ≥ 0.7 的自动划掉;11(ts_rank 60)门槛未过,distinct 仅 0.034(输出几乎只落在 60 日排名的网格上),且 ts_rank 对当日缺失返回 0(nanrank_last),而核心在负偏度日缺失,属于数值伪影,按数学问题划掉。存活 1、2、3、10、12 共 5 个,满足 ≥4。'
  - slot: b
