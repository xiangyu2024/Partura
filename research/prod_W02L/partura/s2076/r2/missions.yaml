      - 'ts_rank(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30), 60)'
      - 'sub(cross_zscore(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30), 20), cross_zscore(cross_mean(ts_cov(day_zero_ratio(Amt), day_pos_ratio(Ret), 10), 30), 20))'
  - type: E
    core: 'day_zero_ratio(Amt)'
    hypothesis: >-
      核心 day_zero_ratio(Amt) = 当天成交额恰为 0 的分钟占比,是本流唯一过线 head 里决定性的部件(单独当信号被门槛挡掉,但含它的 10 个候选均值 -0.17,不含的 -2.78,
      p 0.000):衡量个股的交易稀薄 / 锁板程度。head 里它与开盘价偏度做 10 日协方差,本轮不再用偏度当搭档,改成其他「当日价格路径形状」量作搭档,并改变组合方式:
      ts_corr(而不是 ts_cov)把稀薄度与价格形状的共动标准化,避免被稀薄度自身的方差支配;搭档取 day_skew(Ret)(分钟收益偏度)、day_pos_ratio(Ret)(上涨分钟占比)、
      day_std(Low)(日内低点分散度)、day_gini(Amt)(成交额集中度)、day_centroid(Amt)(成交额重心时点)。机制:稀薄日若伴随单边价格形状 / 成交集中在某个时点,
      说明少量订单在推动价格,即流动性提供者缺席时的价格冲击;持续出现的股票补偿溢价由此而来。另一类外围是用 in_slice 把成交额为 0 的分钟占比分别在开盘半小时和尾盘半小时内取,
      看稀薄发生在哪个时段(尾盘稀薄代表收盘无人接盘,开盘稀薄代表集合竞价后无承接),这和 head 的全天占比不同。样本外还会在:交易稀薄的补偿属于结构性的微观结构溢价;
      与库里 head 不同在于搭档与组合方式都不同,库禁令会挡掉重复骨架。
    seeds:
      - 'cross_mean(ts_corr(day_zero_ratio(Amt), day_skew(Ret), 20), 30)'
      - 'cross_mean(ts_corr(day_zero_ratio(Amt), day_pos_ratio(Ret), 20), 30)'
      - 'cross_mean(ts_cov(day_zero_ratio(Amt), day_std(Low), 10), 30)'
      - 'cross_mean(ts_cov(day_zero_ratio(Amt), day_gini(Amt), 10), 30)'
      - 'cross_mean(ts_cov(day_zero_ratio(Amt), day_centroid(Amt), 10), 30)'
      - 'cross_mean(ts_corr(day_zero_ratio(Amt), sqrt(day_skew(Close)), 20), 30)'
      - 'cross_mean(ts_cov(day_zero_ratio(Amt), day_skew(Ret), 10), 30)'
      - 'sub(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30), cross_mean(ts_cov(day_zero_ratio(in_slice(Amt, 210, 240)), sqrt(day_skew(Open)), 10), 30))'
      - 'cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(in_slice(Open, 0, 60))), 10), 30)'
      - 'cross_mean(sub(day_zero_ratio(Amt), day_zero_ratio(in_slice(Amt, 0, 30))), 30)'
      - 'cross_zscore(ts_corr(day_zero_ratio(Amt), day_skew(Ret), 20), 40)'
      - 'cross_mean(ts_cov(day_zero_ratio(Amt), day_es_ratio_hi(Close), 10), 30)'
