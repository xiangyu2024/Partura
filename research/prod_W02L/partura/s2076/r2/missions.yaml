  - type: E
    core: 'cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30)'
    hypothesis: >-
      核心 = 本流唯一过线 head(sigmoid 只是单调变换)去掉外壳的主体。day_zero_ratio(Amt) 是当天成交额恰为 0 的分钟占比(无成交 / 极薄交易 / 涨跌停锁死),
      sqrt(day_skew(Open)) 是分钟开盘价路径的正偏度(日内价格被少数几笔成交向上拉出尖峰;负偏度处 sqrt 为带符号 / 缺失,只留正偏的部分)。ts_cov 10 日度量
      「越稀薄的日子,价格尖峰越向上」这件事是否成对出现,cross_mean 30 把它做成持续状态:持续在薄成交里被少量买单向上顶的股票,是被操纵 / 彩票化 / 缺乏知情做市的票,
      后续的补偿或回吐由此而来(这是拆解里 knockout 去掉 sqrt(skew) 后分数从 +0.66 掉到 -0.21、去掉 cross_mean 掉到 +0.35 所支持的:交互项与持续化缺一不可)。
      上一轮只试过 sigmoid / 重复 cross_mean 这类单调或同类外壳,没有改变信号的构造。本轮外围全部换成结构上不同的处理:(1) cross_zscore / cross_ema / ts_decay_linear
      改变平滑核与标准化;(2) 减去自身 120 日水平或短窗减长窗,提取「协同的变化」而不是水平,水平会被市值与流动性控制吸收;(3) 减去同样写法下用日内上涨分钟占比替换偏度的协方差,
      去掉「薄成交 × 任何方向的日内波动」的共同成分,只留偏度特有的部分;(4) 乘上持续稀薄度 cross_mean(day_zero_ratio(Amt),30) 或除以其波动,检验交互是否只在稀薄状态下成立;
      (5) 分位尾部均值 / winsor 防止个别爆点支配。样本外还会在:稀薄交易 × 向上尖峰的行为(注意力吸引的单边推动)属于微观结构与散户偏好,train 与 valid 同样站得住(+0.67 / +0.66),
      而且两段分数几乎相等,没有明显的时段依赖。
    seeds:
