      - 'sub(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 10), cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30))'
      - 'cross_ema(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30), 20)'
      - 'cross_tail_mean_q75(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30), 20)'
      - 'ts_decay_linear(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30), 20)'
      - 'cs_winsor(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30))'
      - 'sub(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30), cross_mean(ts_cov(day_zero_ratio(Amt), day_pos_ratio(Ret), 10), 30))'
      - 'mul(cross_mean(ts_cov(day_zero_ratio(Amt), sqrt(day_skew(Open)), 10), 30), cross_mean(day_zero_ratio(Amt), 30))'
