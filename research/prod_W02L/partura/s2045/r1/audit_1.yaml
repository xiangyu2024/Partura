slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 2, 3, 4, 5, 6, 9, 10, 13, 15]
    reasons: '核心 C = ts_std(cross_stddev(day_cov(Amt, cross_delta(Amt,30)),60),50) 是 head 1 的第二个加数,满足 E 位要求(核心为快照 head 的子树)。核心与各控制的 |ρ|:流动性 0.69、已知族 0.70、市值 0.44、波动 0.18、反转 0.01,均 < 0.8,核心过关。15 个种子逐条核:(1) 自动划掉(与 head 1 原始 |ρ| >= 0.7):3(0.78)、4(0.92)、5(0.93)、15(0.95)。(2) 划为重复:残差 |ρ| 与 head 1 在 0.85 以上的 1(0.89)、2(0.86)、6(0.91)、9(0.92)、10(0.88)、13(0.93)。这些种子原始 |ρ| 只有 0.14 到 0.53,是因为原始秩被控制的量级拉开了;但新尺子本来就用控制的 1/2/3 次多项式去掉这部分,对控制取残差后它们与 head 1 的残差几乎是同一个信号,在奖励空间里是换写法在同一个残差上押注。0.85 这个阈值是审计员的判断,不是规则写明的数。保留 7(残差 0.71,原始 0.50)、8(残差 0.13,原始 0.07)、11(残差 0.35,原始 0.29)、12(残差 0.49,原始 0.42)、14(残差 0.68,原始 0.65),共 5 个,>= 4 通过。创新度给 3 不给 4:保留的 8、11、12 在残差空间确实不同于 head 1,但 7、14 仍与 head 1 残差相关 0.68 到 0.71,且整个位的核心就是 head 1 的 C,新意主要在外围。合理度给 4:数学检查通过。除数全部是 Amt^2 量级的 +1(pow_2(known)+1、cross_mean(day_cov(Amt,Amt),241)+1、ts_std(cross_stddev(day_cov(Amt,Amt),60),50)+1、cross_delay(C,120)+1),不会 0/0;log 在 |x|<EPS 时返回 NaN 而不是 -inf(common.py);cs_regres 是逐日截面 OLS 残差(nd_cs.py);cs_bucket_rank 在控制十分位内取秩并加 1e-4 的全局秩打破并列(ops_ext.py),是干净的非参数去量级;cross_zscore 是 60 日时序自标准化、含当日、不含未来(ops_ext.py);cross_delay 向后移,只看过去;不用 ts_rank / cross_rank,不触发 nanrank_last。两点不挡但请 PI 注意:(a) 种子 10 的描述写了对流动性做逐日回归,实际只对 cross_mean(day_mean(Amt),60) 一个变量回归,描述偏差不影响数学;(b) 种子 12 的嵌套窗口约 260 日(C 的 140 日加 120 日滞后),若面板起点恰为 2018-01-02,2018 年大部分会是热身期,打分前应确认面板起点。如果它有 alpha,最可能来自脉冲记忆(C 的时序强度)相对一阶离散度与流动性的残差;种子 8(除以不带 ΔAmt 的二阶离散度)与 11(C 的自身历史 z 分数)最能分辨这一点。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '外壳 ts_std(cross_stddev(·,60),50) 与 head 1 的 C 同形,但底全部换成有界或无量纲的日内统计量(day_corr、day_kurt、day_gini、day_centroid,以及除以日均值后的 day_cov),这一点是新的。相关度表里 12 个种子对快照 head 的原始 |ρ| 为 0.04 到 0.60,残差 |ρ| 为 0.06 到 0.34,对 5 个控制的 |ρ| 最大 0.52。没有到 0.7 或 0.8 的划线,没有自动划掉的种子,也找不到与 head 或控制的重复。原始 |ρ| 0.60 的是种子 11(cross_stddev(day_corr(Amt,cross_delay(Amt,1)),120)),它是一层版本,与 head 1 的加数 add 结构相近,但残差只有 0.34,保留。库里 day_corr 只见于一阶用法,本批与快照中都没有这个二阶外壳。创新度给 4 不给 5:外壳本身来自 head 1 的 C,而且 head 1 的 alpha 是否需要 Amt^2 量级还没有被本批检验。合理度给 4:数学检查通过。day_corr 分母含 EPS,分钟序列恒定时返回 0 而不是爆点(dt_day.py);day_gini 与 day_centroid 有界(gini 在 [0,1),centroid 在 [0,1]),总量为 0 时返回 NaN 或被守卫(ops_ext.py);cross_delay / cross_delta 只看过去;窗口嵌套 110 到 185 日,换手低。两点不挡但请 PI 注意:(a) 种子 6 的 day_kurt 无界,外面两层 std 消不掉尖峰,60 日内一次大宗成交就会主导截面秩,它更像尖峰记忆而不是参与者结构,是 6 号的弱点;(b) 种子 4 用 day_mean(Amt) 作除数,全天零成交的交易日会 0/0,但停牌日已被掩成 NaN,影响有限。如果它有 alpha,最可能来自成交分布形状(分钟相关、成交重心)的稳定性与突变之间的切换频率,它与成交额水平和流动性正交;种子 2、3、8 最能分辨这一点。'
R:
  - head: 'add(ts_quantile_q50(day_cov(Amt, cross_delta(Amt, 30)), 40), ts_std(cross_stddev(day_cov(Amt, cross_delta(Amt, 30)), 60), 50))'
    soundness: 4
    reasons: '9 个变体都是 head 1 自身子结构的窗口、滞后或去掉 q50 水平项的改写,没有新的除法或对数,数学检查通过。机制清楚:要么敲掉水平项让 C 独立(变体 3、4 等),要么保留水平项并把外壳放慢(变体 1、2)。变体 1、2 保留水平项后残差 |ρ| 分别为 0.62、0.55,与 head 1 残差有明显差距,值得真正跑。两点不挡但请 PI 注意:变体 7(cross_delta 60)与变体 8(cross_delta 10)与原 head 1 的原始 |ρ| 都是 0.95,实际是换个滞后的同一个 head,拿到 +0.1 的增益的机会很小,这是 PI 应当预期的。'
  - head: 'ts_sum(cross_stddev(cross_max(day_cov(cross_delta(Amt, 241), Amt), 3), 241), 5)'
    soundness: 3
    reasons: '变体都是日轴滚动 max、std、ts_sum 的组合,没有除法,数学检查通过。但机制说不清:241 日年度滞后与 cross_max(·,3) 的组合测的是什么,没有一句话能讲清楚;head 2 训练段为负(-0.24),变体只是改窗口和滞后。变体 1 只是把 30 与 241 对调;变体 4 把 cross_max 窗口从 3 改成 10,原始 |ρ| 为 1.00,与 head 2 几乎相同,对去烂部件没有实质贡献,应视为无效变体。给 3:不挡,但 PI 应预期这组变体增益很低。'
summary: 'slot a 通过(10 个种子划掉:4 个自动划掉、6 个残差重复;余 5 个,创新 3、合理 4);slot b 通过(无划掉,创新 4、合理 4);R1 合理 4 保留,R2 合理 3 保留;无数学问题导致的挡。'
