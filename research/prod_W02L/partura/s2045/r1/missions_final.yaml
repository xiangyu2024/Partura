  hypothesis: '事实(来自本批 loc 拆解表,不是推测):head 1 = add(ts_quantile_q50(X, 40), C),其中 X
    = day_cov(Amt, cross_delta(Amt, 30)),C = ts_std(cross_stddev(X, 60), 50) 就是本位核心。拆解读数:C
    单独 +0.47(train +0.47 / valid +1.26);q50 项单独 -3.15;X 本身 -4.19;只留 cross_stddev 一层(去掉最外层
    ts_std)-0.03;把 q50 项敲掉(换成它里面的 X 本身,即 add(X, C))后整体从 +0.40 变成 +0.58(必要性 -0.18);Amt
    换成 Volume 掉到 -2.02;q50 的窗口 20 / 80 基本不动(+0.48 / +0.39)。读法:一阶量(X 的水平、X 的一阶离散度)在新尺子下没有
    alpha,承重的只有外面再套一层的「二阶离散度」C;而且 valid(+1.26)明显好于 train(+0.47),不像只在 train 上拟合出来的。库里
    5583 条里这个骨架族(day_cov(Amt, ·) 外面套 cross_stddev / ts_std)有二十多条,但全是原始量级(单位 Amt^2)的绝对量;用
    cs_bucket_rank / cs_regres / cross_zscore / 除以一阶离散度把 C 做成相对量的,库里 0 条(这几个算子库里本身
    0 条)。


    机制(推断,没有读数核对):X = Var_m(A_d) - Cov_m(A_d, A_{d-30}),即当日分钟成交额的日内方差减去与 30 日前同一分钟形状的协方差(m
    为分钟、A 为分钟成交额)。当天成交被少数分钟垄断(大宗、事件、涨跌停日的日内形态突变)时 X 骤增;cross_stddev(X, 60) 是 60 日里这类脉冲的强度,再对它做
    50 日 ts_std,读的是脉冲进入 / 离开 60 日窗口造成的跳变:C 大 = 近 110 日内出现过强度很大的成交分布突变,相当于一个带衰减的「脉冲记忆」。C
    的单位是 Amt^2,所以它与成交额水平、一阶离散度(已知族 cross_mean(day_std(Amt), 30))同向;新尺子只去掉控制的秩的 1 /
    2 / 3 次多项式暴露,留下的 +0.47 / +1.26 是水平之外的部分。本位要回答的是:承重的到底是「脉冲记忆相对这只票正常量级的大小」(相对量),还是水平本身残留的非线性。


    算子怎样实现(核心 C 原样放进每个种子,外围五组):(i) 相对量:C 除以一阶离散度的平方 add(pow_2(cross_mean(day_std(Amt),
    30)), 1)(正是已知族,量纲同为 Amt^2)、除以自己一年的分钟成交额方差 cross_mean(day_cov(Amt, Amt), 241)、除以不带
    ΔAmt 的同构二阶离散度(库里 day_cov(Amt, Amt) 版,与已知族 |rho| 约 0.8)——后者把「ΔAmt 带来的新部分」和「已知的一阶部分」分开;(ii)
    非参数去量级:cs_bucket_rank(C, ·) 在已知族 / 流动性 / 流通市值 / 波动 / 20 日收益的十分位内取秩,对每个控制的暴露按构造为
    0(比线性残差在尾部更干净);(iii) 回归取残差:log C 对 log 已知族、log 流动性做逐日截面回归;(iv) 对自己的历史:cross_zscore(C,
    60)、C 除以 120 日前的 C(脉冲记忆在升还是在降);(v) 状态与筛选:乘 20 日收益的秩(放量脉冲且上涨 vs 下跌)、sub 一阶离散度的秩、排除流动性最低
    20% 后再按 C 排(脉冲在极小票里多是噪声,cs_last_low20)。


    为什么和库里 / head 不同:head 1 是 add(水平项, C),C 以绝对量原样和 q50 水平项相加;本位 15 个种子都把 C 换成相对量
    / 桶内秩 / 残差 / 自己历史的 z 分数,整棵树的算子骨架逐条核过,都不在两库 5583 条的骨架里,也不与任何流已出 head 的骨架相同;外围算子集合(如
    {div, pow_2, cross_mean, day_std}、{cs_bucket_rank, cross_mean, day_std}、{cs_regres,
    log, add})与快照里含 C 的候选(只有 head 1,外围 {add, ts_quantile_q50, day_cov, cross_delta})都不同。种子对
    head 1 的日度秩 |rho| 预计 0.3 到 0.8,最贴近 C 的(排除最低 20%、对市值分桶)可能被表划掉,其余是实质性的重排。


    为什么样本外还会在:C 的窗口是 30 + 60 + 50 日的嵌套,每天变动很小,换手低,成本不是病;来源是事件 / 关注度冲击的持续性(参与者结构在冲击之后慢速回归),不依赖某一段行情;valid
    好于 train,说明它不是只在 train 里找到的形态。


    数学检查:除数一律 +1(Amt 以元计,+1 不改变任何有量级的票,只防 0 / 0);log 的输入 C >= 0,C = 0 时 log 返回 NaN
    而不是 -inf,不污染排序;cs_regres / cs_bucket_rank / cs_rank 对 NaN 安全,不触发 nanrank_last
    的停牌记 0(没有用 ts_rank / cross_rank);所有窗口只用当日及以前的数据(cross_delta / cross_delay 向前看,cross_zscore
    含当日但不含未来);停牌日在 cross_* 输入处被掩成 NaN,不是 0。如果它有 alpha,最可能来自「脉冲记忆」相对一阶离散度的残差,组 (ii)
    的桶内秩是最干净的检验。'
