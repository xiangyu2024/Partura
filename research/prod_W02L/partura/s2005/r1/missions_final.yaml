- type: N
  hypothesis: '机制:尾盘最后一根分钟棒(含收盘集合竞价时段的成交)的成交行为,去掉水平以后的「相对」读法。批里的现象有三条:(1) head 3 是
    cross_max 链乘上 ts_min(pow_3(ts_std(day_close(Amt), 50)), 1),拆解表里这个乘进去的因子单独拿出来是整批最好的分数(−0.52,train
    −0.52 / valid −0.39),而整个 head 是 −1.85,链那一半单独只有 −2.29;也就是这批里承重的是尾盘棒成交额的 50 日波动,链是累赘。(2)
    但这个因子与已知成交额族的 rho 是 −0.89,说明它读到的主要是成交额水平(流动性),新尺子正是要把水平去掉;库里含 ts_std(day_close(Amt),
    50) 的表达式有十几条,多数带冠军族标记,所以「尾盘棒成交额的水平」这个方向已经被冠军控制吃掉,能留下的只可能是去掉水平之后的东西。(3) 同一批里 Amt
    换成 Volume 反而好 1.0(−1.83 → −0.83),说明价格 / 规模的尺度是负担。新想法:不用尾盘棒的绝对成交额,用它相对当天总成交的份额
    share = day_close(Amt) / day_sum(Amt),无量纲、范围 [0, 1],水平被除掉;再读它的均值(持续的尾盘占比)、日间波动(尾盘行为稳不稳)、尖峰(极端尾盘日)、与当天收益及隔夜跳空的耦合(尾盘资金是追涨还是逆势)、与开盘棒份额之差(尾盘与隔夜消息驱动的不对称)、以及尾盘
    30 分钟内按成交额加权的买卖方向。

    行为含义:尾盘集合竞价与最后几分钟成交,是被动资金(指数 / ETF)、以收盘价为基准的机构执行、日内平仓与追涨资金集中的地方;尾盘占比的稳定水平反映的是持有人结构,不是流动性水平。机制上与
    Admati-Pfleiderer 的「知情与流动性交易在开盘与收盘集中」一致,与 Bogousslavsky 的不频繁再平衡一致。

    算子怎样实现:全部是 day_close(Amt) / day_sum(Amt) 的函数。(a) cross_mean / cross_ema 做 40 日持续水平,cross_stddev
    与「标准差除以均值」做稳定性,cross_zscore 做相对自己 120 日常态的异常,cross_tail_mean_q75 做尖峰;(b) cross_corr(份额,
    当日收益 / 隔夜跳空, 60) 做耦合;(c) mul(份额, sign(尾盘 30 分钟收益)) 与 day_signed_ratio(in_slice(Ret,
    211, 241), in_slice(Amt, 211, 241)) 做带方向的尾盘压力;(d) 份额之差 close − first,以及 day_close(Amt)
    / day_max(Amt) 作对照;(e) cs_bucket_zscore 按 LogFloatShares 或 ListAge 十分位做非参数去水平。分母都选当天总成交额或当天最大分钟成交额,只在整天无成交时为
    0,此时分子也为 0,得 NaN,不会出现除以近零的爆点。

    为什么和已有的不同:库里 day_close(Amt) 出现 43 次,全部是原始成交额水平(mul / ts_std / cross_max / pow
    套 day_close(Amt))或与别的量的未归一化协方差;两个库 5583 条里没有一条用 day_close 除以全天总量得到份额,也一次都没有出现过
    cs_bucket_*、cross_zscore、cross_ema、cross_tail_mean_*(我对 members.csv 逐条统计过)。16
    个种子的整树骨架都对照过库的骨架集,没有重复。与 3 个 head 比,它们读的是 Amt 与价格的协方差水平,而这里是无量纲的份额,日度秩相关预计很低。

    为什么样本外还会在:来源是尾盘参与者类型(被动与基准型机构 vs 追涨散户)的持有人结构差异,是慢变的结构属性,聚合窗口 40 到 120 日,换手低;份额无量纲,不随规模和流动性变化而漂移。风险:(1)
    若无成交的分钟在数据里是 NaN 而不是 0,day_close 取的是最后一根有成交的分钟;对流动性好的票这就是最后一根棒,对冷门票是尾盘最后一笔成交,两种读法都有意义,不影响数学有效性;(2)
    尾盘占比与已知成交额族 / 市值仍可能有一部分共同暴露,尺子会去掉线性 / 平方 / 立方部分,分桶版本检验剩下的非线性部分;(3) 与 W01 里按 LogFloatShares
    分桶的尾盘占比类头(最后 30 分钟占比)可能有较高相关,库禁令会拒绝 |rho| ≥ 0.7 的近亲。

    数学检查:无前视,只用 t 日收盘及以前的数据,t+1 才交易。份额有界,cross_mean、cross_ema 之类没有爆点;「标准差除以均值」的分母是
    60 日份额均值,只有整个窗口都没有尾盘成交时为 0,此时分子也为 0,得 NaN;窗口不超过 120 日,热身期不主导。'
