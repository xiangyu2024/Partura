- type: E
  core: day_cov(Ret, Close)
  hypothesis: '机制:价格路径的几何,不是价格水平。核心 day_cov(Ret, Close) 是一天内分钟收益与分钟收盘价水平的协方差。把价格写成
    C_t = P0 (1 + S_t)(S_t 为当天累计收益),用恒等式 Σ r_t S_t = (S_n^2 + Σ r_t^2)/2,可得 day_cov(Ret,
    Close) ≈ (P0/n) [ RV/2 + R (R/2 - Sbar) ];R 是日内总收益,RV 是分钟收益平方和,Sbar 是日内累计收益路径的均值。我用随机游走数值核对过这个分解(2000
    条模拟路径,相对误差中位数不到 1%)。三项各有来源:(1) P0 是名义价格水平。它不在 5 个控制里(只与流通市值部分相关);head 2 把整个量再套
    cross_max(·, 60),我的读法是它主要在按「名义价格 × 近 60 日最剧烈的那天」排序。拆解表支持这个读法:不套 cross_max 的 day_cov(Ret,
    Close) 本身 −1.25(train −1.14 / valid −1.25,方向 −1,半衰期 20,与已知族 rho 0.34),套了 cross_max
    的 head 反而更差(−1.84),窗口 60 → 120 又好 0.14,窗口越长越好。(2) RV/2 是已实现方差,被波动控制吃掉。(3) R (R/2
    − Sbar) 才是留下来的东西:当天的涨跌是否集中在尾盘。价格路径在起终点连线下方时为正(上涨日的涨幅主要在尾盘、下跌日的跌幅主要在尾盘),早盘走完、尾盘回吐时为负。这是库里没有人单独读出来的量:两个库
    5583 条里 day_cov(Ret, Close) 只出现 3 次,全是原始尺度(带价格水平)。

    行为含义:尾盘集中的价格变动来自只在临近收盘才出手的资金,例如以收盘价 / VWAP 为基准的执行单、指数与 ETF 申赎、考核日行为,以及追涨杀跌的情绪脉冲。持续地尾盘集中的股票有稳定的尾盘需求方(持有人结构),这是慢变的属性,不依赖某一段行情。

    算子怎样实现(每个种子原样带核心):(a) 除以 day_mean(Close) 去价格水平,得无量纲的 [RV/2 + R(R/2 − Sbar)]/n;(b)
    再减 0.5 * day_var(Ret)(day_var(Ret) ≈ RV/n)把波动项扣掉,留下方向性的尾盘集中度;(c) 相关系数形式 div(cov,
    std * std) 同时除掉价格和波动;(d) 用 20 到 120 日聚合:cross_mean / cross_ema / cross_zscore
    / 短减长 / 均值除以标准差(一致性),换手低,15 bp 成本下留得住;(e) 日轴尾部统计 cross_max / cross_min / cross_tail_mean_q75
    / cross_semistd_pos,读「极端尾盘拉升或跳水日」的频率与幅度(关注度 / 彩票型事件),其中 cross_tail_mean_q75 与
    cross_semistd_pos 在两个库里一次都没出现;(f) 非参数去水平:cs_bucket_zscore 按价格十分位或流通市值十分位、cs_bucket_demean
    按已知成交额族十分位。新尺子只去掉控制排名的线性 / 平方 / 立方暴露,桶内标准化可以去掉任意形状的水平暴露;(g) mul(sign(day_sum(Ret)),
    ·) 的交互项,读上涨日与下跌日的方差不对称。

    为什么和已有的不同:三个 head 都是 cross_max 链套 day_cov(Amt, Low) 或 day_cov(Ret, Close),读的是名义价格
    / 成交额的水平。这里没有 cross_max 链,没有 Amt 的尺度,价格水平被除掉,外围是 20 到 120 日的聚合、尾部统计和分桶标准化。16 个种子的整树骨架我逐个对照了
    members.csv 里 5583 条库表达式的骨架,没有一个重复。与 head 2 的日度秩相关预计明显低于 0.7(价格水平被去掉),与已知族预计低(不含
    Amt)。

    为什么样本外还会在:来源是尾盘交易者的持有人结构 / 执行习惯,属于慢变的结构属性;聚合窗口至少 20 日,名次在数周内保持。风险:方向性尾盘集中度与 20
    日反转可能有关(尾盘拉升日后的回吐),尺子已去掉反转的线性 / 平方 / 立方暴露;近似 C_t = P0 (1 + S_t) 只用来解释各项含义,种子并不依赖它精确成立;若
    Ret 的第一根含隔夜跳空,R 就含隔夜成分,这时同时读到跳空,仍是有信息的量。

    数学检查:无前视,只用 t 日收盘及以前的数据,t+1 才交易。day_mean(Close) 为 0 只在停牌,此时 cov = 0,得 NaN 而不是无穷;相关形式的分母
    day_std 为 0 时分子也为 0,同样得 NaN;day_var(Ret) 有限。cross_stddev 作分母的种子(均值 / 标准差)在窗口内全部相等时得
    NaN。没有近零分母造成的爆点。所有窗口不超过 120 日,热身期不主导。'
