R:
- head: cross_max(cross_max(cross_max(day_cov(Amt, Low), 5), 5), 30)
  why: 烂的部件是「成交额与价格的尺度」。依据(拆解表):day_cov(Amt, Low) 本身与已知族 rho 只有 0.02(协方差有正有负,符号被抵消),套一层
    cross_max(·, 5) 升到 0.64,两层 0.73,三层 0.80;也就是 cross_max 把一个符号平衡的耦合量变成了「最大的那一天的尺度」,实质成了成交额水平的代理,这正是已知族与流动性控制要吃掉的部分。两个单项修补各自有效:Amt
    换 Volume 好 1.0(−1.83 → −0.83),窗口 30 → 60 好 0.57(−1.26)。但这两个变体与已知族的 rho 是 −0.74
    / −0.74,进不了 R 候选(要求 < 0.5)。所以变体的做法是在保留单项修补的同时,把水平从「参数形式」改成「非参数」:(1) 把 Volume 版
    + 窗口 60 叠加,再在已知族十分位内去均值(rho_known 机械地接近 0);(2) Amt 版 + 窗口 60,十分位内 z 分数;(3) 在 cross_max
    链内部先把耦合量除成无量纲(协方差除以两个均值之积、或除以两个标准差之积),水平在最大值之前就被去掉;(4) 用 LogFloatShares 十分位对 Volume
    版标准化,因为股数的尺度正比于流通股本;(5) 原式整体在已知族十分位内去均值,作为检验「水平通道」这个判断的干净对照。分母都是当天的均值或标准差,只在整天停牌时为
    0,此时分子也为 0,得 NaN,没有爆点。
