attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [1, 7]
    reasons: |-
      核心与快照的关系:day_cov(Ret, Close) 是 head 2 cross_max(day_cov(Ret, Close), 60) 的子树,合规。核心对 5 个控制的最大 |ρ| 为 0.34(liq / vol / known),低于 E 位的 0.8 门槛;对 head 的原始 |ρ| 为 0.57、残差 0.70。members.csv 里含该核心的只有 3 条,B013 中只有 head 2 含它;种子外围的算子集合与它不同,未违反「外围不得重复」。核心单独(sufficiency)的分数为 -1.247,即 head 2 的大部分信号来自 P0 与 RV 两项,E 位要证明的是去掉这两项后剩下的那一支。

      数学核对:我独立推了 day_cov(Ret,Close) = (P0/n)[RV/2 + R(R/2 − Sbar)],由 Σ r_t S_t = (S_n² + Σ r_t²)/2 成立。减 0.5·day_var(Ret) 后 RV 项约相消,剩下 R(R/2 − Sbar)/n,与笔记一致。

      创新度 4:除掉价格水平与 RV 后,读的是日内路径的时间结构,不是 head 2 的换写法。主要种子(1–6、8、9、14)与 head 的原始 |ρ| 为 0.40–0.53,残差 0.18–0.43;库里没有含该量的 cross_tail / semistd / cs_bucket 类读法。扣的一点是:16 个种子其实是同一个量的不同聚合,种子 16 与 R 2 variant 1(cross_max 换成 cross_mean,窗口同为 120)只差外层聚合。

      合理度 4:无前视;day_mean(Close) 与 day_std 分母只在整天停牌时为 0,此时分子也为 0,得 NaN;窗口都不超过 120,热身不主导。两处读法的修正不构成挡的理由:(a) 对种子 2 这类式子,R(R/2 − Sbar) 对尾盘发生的涨或跌都为正、对早盘发生的涨或跌都为负,与符号无关,笔记中「上涨日尾盘 / 下跌日尾盘」说的是同一件事。真正带方向的是种子 15 的 sign(R) 乘子,它读的是尾盘拉升减尾盘跳水。(b) 若 Ret 的第一根含隔夜跳空,跳空在路径上算作早走,对两个方向都给负号,此时种子也在读跳空幅度的反面,需要 PI 核对数据里第一根 Ret 的定义。

      逐个种子:
      - 1 划掉(自动规则):与 vol 控制的 |ρ| = 0.81 ≥ 0.8,是「几乎就是这个控制」。种子 16 同外围(只差窗口),但 vol |ρ| 为 0.74,未过门槛,保留。
      - 7 划掉(数学问题):cross_semistd_pos 的定义域是正值序列(ops_ext.py:773 调用 ops_ext.py:751 的 _semistd,第 754 行只保留 x > 0 且前一日 > 0 的配对)。输入是有符号的 R(R/2 − Sbar)/n,运算只留下相邻两日同为正的配对,输出反映的是符号持续性,不是半离差。gate 不过(coverage 0.877,与 head 的最大 |ρ| 0.046),对应 corr_1.md 的「废品」。
      - 9(价格十分位分桶)保留:它只去掉价格十分位的均值,桶内 P0 仍然线性存在,价格水平没有完全去掉,与 head 2 的原始 |ρ| 0.53 同向。这是机制上的缺口,不是数学问题。
      - 12 与 2 外围算子集相同,但 12 是两个窗口之差的结构,不是重复,保留。
      - 其余保留。划完剩 14 个,过 ≥ 4 的门槛。

      如果它有 alpha,最可能来自:收盘前资金的时间集中(尾盘的被动 / 基准型执行与情绪脉冲)所反映的慢变持有人结构,而不是某段行情的 RV 或价格水平。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      核心 day_close(Amt) / day_sum(Amt) 是无量纲份额。算子语义核对:day_close 即 day_last,取全天最后一个非 NaN 值;day_sum 为全天和。分母只在全天无成交时为 0,此时分子也为 0,得 NaN,没有爆点。

      库里核对(members.csv,5583 条):day_close(Amt) 出现 43 次,全部是原始水平;份额形式出现 0 次;cs_bucket_*、cross_zscore、cross_ema、cross_tail_mean_*、cross_semistd_*、day_signed_ratio 均为 0 次。PI 的新颖性说法属实。

      创新度 4:份额与快照 head 的原始 |ρ| 最高 0.42(种子 14 与 head 3 的链),残差最高 0.33。控制的最大 |ρ|:liq 0.51(种子 8)、known 0.47(种子 16)、size 0.49(种子 15),都不到 0.8。它不是流动性的换写法,但有流动性暴露;尺子去掉的是线性 / 平方 / 立方部分,分桶版才检验非线性部分。

      合理度 4:无前视。ts_delay(day_close(Close), 1) 在日轴取前一日收盘;day_first(Open) 是当日开盘,收盘前已知。cross_corr 是 60 日时间序列相关(AlphaCube dt_cross.py 的 rolling_pair_reduce, axis=0)。in_slice(·, 211, 241) 的实际切片是 x[:, 211:242](dt_in.py:324),在 241 格下即 211..240,也就是尾盘最后 30 格,与笔记一致,前提是格子的时间映射符合 PI 的假设。

      需要核对的一点(这个位最大的风险,但不构成挡的理由):AlphaCube 合成数据中 Amt = Volume × 价格,无成交分钟取 0(synthetic.py:124、139)。若真实数据同此约定,则尾盘那一根无成交时 day_close(Amt) = 0,而不是笔记所说的「最后一根有成交的分钟」(那只在 NaN 约定下成立)。两种约定下,流动性差的票份额都会退化成「最后一根是否成交」的指示,是流动性通道而非尾盘行为。种子 8、16 的 liq |ρ| 0.45–0.51 与之吻合。请用真实数据确认约定。

      逐个种子:
      - 1–7 未算出(CUDA OOM,流水线显存问题,不是表达式问题)。不划掉,但它们没有 gate、没有 |ρ|、没有控制检查,自动划掉规则无法执行,进 GP 前必须重算。其中 2 是 1 的 Volume 版,15 与 1 都是 40 日的不同聚合(EMA / 均值),两者可能高度共线,但在 1 算不出时无法确认,不划。
      - 8–16 没有与任一 head 的 |ρ| ≥ 0.7,也没有控制 ≥ 0.8,全部保留。种子 13 的短减长与 1 同属「持续水平」但结构不同,保留。
      - 划完后可算种子 9 个(另有 7 个未算),过 ≥ 4 的门槛。

      如果它有 alpha,最可能来自:尾盘最后一根的成交占比反映持有人结构(被动与基准型机构的收盘集中执行、ETF 申赎)的慢变差异,而不是 Amt 的规模或流动性水平。若结果主要是零成交约定下的流动性指示,则来自不交易的小票。
R:
  - head: 'cross_max(cross_max(cross_max(day_cov(Amt, Low), 5), 5), 30)'
    soundness: 4
    reasons: |-
      sufficiency 与消融数字与 loc.json 一致:day_cov(Amt, Low) 单独 rho_known 0.02;cross_max 链 rho_known 从 0.64 升到 0.73;Amt 换 Volume 得 -0.835(rho_known -0.74);窗口 30 换 60 得 -1.264。机制清楚:cross_max 把符号平衡的耦合量变成「最大一天的尺度」,是成交额水平的代理。
      变体数学:v3 与 v4 在 cross_max 之前做无量纲化(cov / (均值×均值) 与相关形式),相关形式有界;v1、v2、v5、v6 为分桶去均值或分桶 z 分数,分母是桶内标准差加 EPS。没有除以近零量的情形,整窗无成交时为 NaN。合理度 4。
  - head: 'cross_max(day_cov(Ret, Close), 60)'
    soundness: 4
    reasons: |-
      sufficiency 与 loc.json 一致:day_cov(Ret, Close) 单独 -1.247,套 cross_max(·, 60) 后为 -1.841,窗口 120 为 -1.698。恒等式见 slot a,成立。变体 v1 与 v2 用 day_mean(Close) 或相关形式去价格水平(相关形式有界),v3 与 v4 为分桶去均值。分母只在停牌日为 0,分子同时为 0,得 NaN。
      风险(不构成挡的理由):v1 保留了 RV/2 项,cross_max(·, 120) 取的是 120 日内 RV 最大的那一天,读的可能是极端波动日通道,vol 控制的残差未必完全吸收;v3 与 v4 的价格分桶只去分桶均值,桶内价格水平仍在。合理度 4。
  - head: 'cross_max(mul(cross_max(cross_max(day_cov(Amt, Low), 5), 15), ts_min(pow_3(ts_std(day_close(Amt), 50)), 1)), 5)'
    soundness: 4
    reasons: |-
      sufficiency 与 loc.json 一致:ts_min(pow_3(ts_std(day_close(Amt), 50)), 1) 单独 -0.521(rho_known -0.89),cross_max 链单独 -2.285,整体 -1.85。好的一半确是水平量。
      变体数学:v1 的 CV(ts_std / ts_mean)对非负量有界,上界约 √(n−1) ≈ 7,不会因分母近零而爆点;v3 为两个标准差之比,同理稳定。pow_3 是单调变换,对排序无影响;乘子的水平与链的水平相乘后共同决定排序,变体去掉的正是乘子的水平部分。v2 与 v4 是分桶去水平,桶内仍有水平差异,属于部分去水平。v1 与快照中最像的 head 的原始 |ρ| 为 0.90、残差 0.83,按 R 规则是替换候选,不是数学问题。合理度 4。
summary: 'a 位通过:划 1(vol |ρ| 0.81,自动划掉)与 7(cross_semistd_pos 用在有符号量上,gate 不过),剩 14 个;创新度 4、合理度 4。b 位通过:创新度 4、合理度 4,无划;其中 1–7 因 CUDA OOM 未算,进 GP 前需重算;Amt 在无成交分钟上是 NaN 还是 0 需用真实数据核对。R 三组合理度均为 4,未见数学问题。快照 3 个 head 的 score 为 -1.83 / -1.84 / -1.85,按 §1 的定义并不过尺子(发现要求 ≥ 0.5),流水线称之为素材 head,PI 应留意。'
