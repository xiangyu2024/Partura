attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [2, 5, 8, 13]
    reasons: '核心 ts_std(cross_stddev(day_cov(Amt, Amt), 60), 50) 就是快照 M3 三个 head 的共同子树(相关度表原始 |ρ| 1.00),E 位的新意只能在外围。外围保留的 12 个种子对快照 head 的原始 |ρ| 在 0.06–0.62 之间:种子 1、4、6、11 在 0.5–0.6,种子 3、7、9、10、12、14、15、16 在 0.44 以下;残差 |ρ| 仍高的有种子 1(0.86,对 head「cross_max 链」那个)和种子 4(0.77),所以它们只是部分换写法,定 3 而不是 4。种子 7、12、14、15、16 的原始与残差都在 0.3 以下,是真正改了量。核心对控制的 |ρ|:liq 0.72、known 0.73、size 0.38、vol 0.21、rev 0.01,与每个控制都 < 0.8,E 位控制条件过。划掉:种子 2(对某 head 原始 |ρ| 0.80)和种子 8(0.81),按库禁令门槛 0.7 自动划掉;种子 13 是废品(ts_rank 取窗口内秩,相关度表的 distinct 只有 0.076,面板几乎是常数,且 nanrank_last 在停牌日返回 0 的已知行为会把停牌票系统性推到底部,按 §4 定义坏掉挡);种子 5 的残差 |ρ| 0.958 与 M3 的第二个 head(cross_max 链那个)在奖励空间几乎是同一个东西,原始 |ρ| 只有 0.50 所以不被库禁令挡,按「重复」划掉。保留种子里需要注意的两点但不构成挡的理由:种子 12(cs_first_low40 按流通市值)实际是把最小 40% 市值的票排到顶端的闸,与 size 控制 |ρ| 0.64,可能主要在吃尺寸;种子 9、10 的 Amt 与 Volume 之比近似带价格平方的尺度,是 PI 设计的价格水平检验,按设计保留。种子 1 的残差 0.857 也偏高,属边界,放行。如果这一位有 alpha,最可能来自成交额二阶不稳定的慢变部分(资金参与的突发性,题材或游资票的间歇放量),去掉水平之后仍在,而不是价格或规模本身;其余保留种子的机制同理,都是对这个核心做无尺度化、分桶或自比。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [6, 8, 9, 13]
    reasons: '快照的 9 个 head 中,M3 三个 head 以及另外几个 head 全是 day_cov / day_std 等水平量加 cross_max 链;这一批的形状量(基尼 day_gini、偏度 day_skew、峰度 day_kurt、重心 day_centroid、尾部比 day_es_ratio)是无尺度的,库里的 5583 条骨架里没有对形状量做 cross_stddev 再 ts_std 的二阶聚合,所以新意定 4。划掉:种子 8(cov(Ret, Amt) 的二阶不稳定,对某 head 原始 |ρ| 0.90)、种子 9(cov(Close, Close),对 head 原始 |ρ| 0.77)、种子 13(std(Amt),对 M3 head 原始 |ρ| 0.97,残差 0.95),三者过库禁令门槛 0.7 自动划掉;种子 6 是废品(day_at_max_ratio 在 241 分钟上几乎全是 1/240,相关度表 distinct 只有 0.008,面板近似常数,按 §4 数值伪影挡)。保留的 10 个种子原始 |ρ| 在 0.07–0.46 之间,残差最高的是种子 7(0.54,波动的波动,vol 控制 |ρ| 0.31),都 < 0.8 的控制门槛,没有超线。合理度给 4:形状量的日内计算没有数学问题(gini 有界、skew/kurt 在分钟不足时为 NaN、es_ratio 在分位数近零时为 NaN、centroid 与 at_max 有界),二阶聚合的 60 与 50 日窗口在两层的分母一致,不存在窗口错配。组内有重复:种子 1(gini 的二阶不稳定)与种子 10(同一 gini 的变异系数)是同一个量的两种写法,这不是划掉的理由(只挡对库里 head 的重复),但意味着初代里会有相近个体。如果这一位有 alpha,来源分别是:种子 1、10 日内成交额集中度的不稳定(资金进出集中在少数分钟的程度在变);种子 2、3 大单尾部的突发性(峰度对单笔敏感,信号预计弱);种子 4 日内成交重心的漂移(时段偏好的变化);种子 5、14 右尾与左尾放量缩量的频率;种子 7 日内波动的不稳定;种子 11 量与价离散度的耦合;种子 12 零收益分钟占比的不稳定,这一条最像 tick 大小与停滞交易的代理,带价格水平的成分,若它出 alpha 要优先查它是否只是价格水平。'
R:
  - head: 'add(ts_quantile_q50(day_cov(Amt, Amt), 1), ts_std(cross_stddev(day_cov(Amt, Amt), 60), 50))'
    soundness: 3
    reasons: 'R 1 的头就是 M3 的第一个 head。8 个变体里 6 个都在数学上无问题(窗口最长 241 日,分母不接近零的情形有 NaN 兜底)。但理由写的是「去掉多余的水平项」,而变体 1–4 仍保留 ts_quantile_q50(day_cov(Amt, Amt), 1) 水平项:它们对控制的 |ρ| 是 liq 0.75–0.84、known 0.76–0.86,只改了波动窗口,与理由不符;只有变体 5、6 真正去掉了水平项。所以机制在变体 5、6 上算实现了,在 1–4 上没实现,合理度定 3,不挡。变体 6 的窗口 120 + 241 热身约 1.4 年,从 2018-01-02 起会吃掉 train 前部一段,但不是结果的主要来源,不挡。'
  - head: 'add(ts_quantile_q50(day_cov(Amt, Amt), 40), ts_std(cross_stddev(day_cov(Amt, Amt), 60), 50))'
    soundness: 4
    reasons: 'R 2 的头是 M3 的第三个 head。理由与变体一致:保留水平项、只把内外窗口推慢(60 到 100 或 120),机制清楚,与 M3 成交额二阶不稳定同源,没有数学问题。变体 1、2 对 liq 与 known 的 |ρ| 都在 0.77–0.78,说明它们仍是水平主导的量,这是奖励与新颖度上的问题,不是合理度上的挡理由。合理度 4。'
summary: 'a 位通过(创新度 3、合理度 4,划掉种子 2、5、8、13,余 12 个,核心对各控制 |ρ| < 0.8);b 位通过(创新度 4、合理度 4,划掉种子 6、8、9、13,余 10 个);R 1 合理度 3(变体 1–4 未做理由所说的去水平,不挡),R 2 合理度 4;两个位与两组 R 均无整位数学问题。'
