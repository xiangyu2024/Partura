- type: E
  core: ts_std(cross_stddev(day_cov(Amt, Amt), 60), 50)
  hypothesis: 机制:成交额的「二阶不稳定性」。day_cov(Amt, Amt) 是一天里分钟成交额的方差(日内成交额的离散度,尺度 = 成交额的平方);cross_stddev(·, 60) 是它在 60 日里的波动,即「日内放量程度」这件事自己有多不稳;外面再套 ts_std(·, 50) 是这个 60 日波动在 50 日里的变化,即成交结构的「政权切换」有多频繁(时而平静、时而突发性放量)。本批证据(只用
    train / valid):三个 head(+0.62 / +0.56 / +0.44,train 与 valid 都为正,valid 更高)全部含这个子树;拆解里单独的 ts_std(cross_stddev(day_cov(Amt, Amt), 60), 50) 就是 +0.56 / +1.02,而 head 的另一半(ts_quantile 的 day_cov(Amt, Amt) 水平)单独是
    -3.75、去掉它分数不变,所以承重的只有这个子树;去掉 cross_stddev 掉到 +0.01,去掉外层 ts_std 掉到 +0.26,两层都必要;Amt 换成 Volume 掉到 -2.13,说明承重的是以「元」计的尺度(价格乘股数)或价格加权的成交结构,而不是股数的不稳定性。这一轮要试的外围(和快照里见过的「add(水平项, 核心)」全然不同,所有种子都不再加 day_cov(Amt,
    Amt) 水平项):(1) 非参数的去水平:在已知族 cross_mean(day_std(Amt), 30) 的十分位内、流通市值十分位内、名义价十分位内标准化,或除以已知族的平方(得到无量纲的相对不稳定性);(2) 自比:除以自己 50 日均值(变异系数)、除以 241 日的常态方差、与自己 241 日 z 分数、与 60 日前的差(不稳定性是在上升还是下降);(3) 价格与股数分解:核心除以同一结构的
    Volume 版,比值约等于价格尺度的平方,检验承重的是名义价位(上一轮本流 N 位的价格水平假设)还是成交结构;(4) 小盘优先(cs_first_low40)与新股压底(cs_last_low10)的闸。为什么和库里不同:库里含 day_cov(Amt, Amt) 的候选全是原始尺度的加法组合(水平项加核心),没有一条把核心去水平、自比、分桶或做价量分解;去水平之后与 head 的秩相关应明显下降(这些种子的价值在于另一个量,不是同一个量换写法)。为什么样本外还会在:来源是一个慢变的个股属性,即资金参与的突发性(题材股
    / 游资票的间歇性放量,Gervais-Kaniel-Mingelgrin 的高成交额溢价一类机制),换手低(60 日与 50 日的双层窗口,日度秩几乎不动),15 bp 成本留得住;三个 head 在 valid 段比 train 还好(+0.93 / +1.03 / +0.84),说明它不是样本内的一段行情。风险:核心的大部分可能只是成交额水平(尺度 = Amt 的平方),去水平之后消失,这正是本位要检验的;若去水平的种子全部落在
    -1 以下,则结论是「承重的是水平而非不稳定性」,这个核心就不再用。数学检查:无前视,只用 t 日收盘及以前;种子里的分母(ts_mean(cross_stddev(...)))、(已知族的平方)、(Volume 版核心)只在窗口内整段停牌或成交额恒定时为 0,此时分子也为 0 得 NaN,不会爆点;cross_zscore 的分母是 241 日标准差,新股窗口内有效日不足时返回 NaN;排序靠截面秩,不受尺度溢出影响(Amt
    的平方在 float32 约 1e18 量级仍远低于上界)。
