- type: N
  hypothesis: 机制:同一个「二阶不稳定性」的想法,换到成交结构的「形状」上,不再读以元计的水平。受本批启发:本批最有 alpha 的子树 ts_std(cross_stddev(day_cov(Amt, Amt), 60), 50) 含两层:内层是日内成交额离散度,外层是它的不稳定性;但 day_cov(Amt, Amt) 的尺度是成交额的平方(与 Volume 版相差 2.7 个单位的分数),不能区分「结构在变」与「规模大」。这里用无尺度的日内形状量(基尼系数
    day_gini、偏度 day_skew、峰度 day_kurt、成交额重心 day_centroid、最大分钟的位置 day_at_max_ratio、上端期望损失比 / 下端 day_es_ratio_hi / lo)替换内层,外层保持「60 日波动再取 50 日波动」。算子:day_* 把分钟成交额压成日度的形状数,cross_stddev 取 60 日波动,ts_std 取 50 日的波动;全部是日度序列的慢聚合。另外给两个相邻的对象:(a)
    收益的波动之波动(ts_std(cross_stddev(day_std(Ret), 60), 50))与成交额的波动之波动的相关(cross_corr 版,读「放量是否伴随价格剧烈」的耦合,没有尺度);(b) 价格尺度版 day_cov(Close, Close) 与 day_cov(Ret, Amt),把核心的 Amt 换成价格或收益,检验承重的是价格尺度、成交额还是二者的耦合;还有变异系数版与不动日占比版。为什么和库里不同:两个库
    5583 条表达式的骨架全部是 day_cov / day_std 类的水平量加 cross_max / cross_mean 类的聚合;没有一条是对形状量(基尼、偏度、峰度、重心、最大位置)做「cross_stddev 再 ts_std」的二阶聚合(骨架不同);二阶不稳定性在整个库里只出现在 day_cov(Amt, Amt) 这一种尺度量上。为什么样本外还会在:若来源是资金参与的突发性,则形状量的不稳定性是同一个慢属性的无尺度版本,不依赖成交额的绝对规模,控制(流动性、市值、成交额已知族)吃不掉;窗口
    60 与 50 日,日度秩变化慢,成本低。风险:形状量噪声大,二阶聚合后信噪比可能太低(峰度、最大位置尤其);如果全部在 -1 以下,说明本批的 alpha 确实依赖尺度,而不是不稳定性。数学检查:无前视;day_kurt / day_skew 在分钟数不足时返回 NaN;day_gini 对全零成交额返回 NaN;cross_corr 窗口内一个序列为常数时返回 NaN 或 0,不是爆点;种子
    10 的分母 ts_mean(cross_stddev(day_gini(Amt), 60), 50) 为正的量,不接近零;Amt 的平方在 float32 不溢出。
  inspired_by: M3 批:三个 head(+0.62 / +0.56 / +0.44)全含 ts_std(cross_stddev(day_cov(Amt, Amt), 60), 50);去掉外层 ts_std 掉到 +0.26、去掉 cross_stddev 掉到 +0.01、Amt 换 Volume 掉到 -2.13,而水平项 day_cov(Amt, Amt) 单独 -3.75,说明承重的是成交额二阶不稳定性(且带以元计的尺度)
