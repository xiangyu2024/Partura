- type: N
  hypothesis: |-
    机制:价格水平的三个慢变组成部分(名义价、复权因子、限售比例),它们都在 5 个控制与两个冠军之外。来源是 B013 / B014 的承重对象:day_cov(Close, Ret) 约等于 (P0/n)[RV/2 + R(R/2 - Sbar)],day_cov(Amt, Low) 是成交额与价格水平的协方差;两者里的 P0 都是后复权价格水平,跨股票差几十倍,而且不在 5 个控制里(控制只有流动性、波动、20 日反转、已知成交额族、流通市值)。B014 里 cross_mean(day_cov(Close, Ret), 60) 在没有控制时样本内净夏普是 +0.70,窗口 3 日是 -1.85(members.csv,只含 train),单调地越慢越好;新尺子把波动 RV、市值、流动性与两个冠军去掉以后,整批 head 剩下的是 -1.4 ~ -1.85。我的假设(不是已证实的事实):留下来的承重物之一是慢变的价格水平 P0 本身。第 1 轮 R 的读数不一致,所以这个 N 位的任务就是把它拆开检验:cross_max(div(day_cov(Ret, Close), day_mean(Close)), 120) 比同窗口原式(-1.70)好 0.18(-1.52),但相关系数形式(同时除掉价格与波动)差 0.76(-2.46),按价格十分位去均值也差 0.2(-1.90),最后这条说明价格十分位里确实有信号被去掉了。

    后复权价 = 不复权名义价 x 复权因子:P_adj = P_nom * F。AlphaCube 文档(design.md 11.5)核实过:生产 store 的 Open/High/Low/Close/Vwap 是后复权价,Amt 与 Volume 是原始值,Close/(Amt/Volume) 跨股票从 2.5 到 113,每只票内部几乎是常数,就是 F;F 只在除权除息日跳,只含 t 日及以前的送转与分红,没有前视(后复权的基期在过去)。把 P0 拆开:
    (1) 名义价 P_nom = 流通市值 / 流通股本,日频叶子精确给出:LogFloatCap - LogFloatShares;也能用 day_sum(Amt)/day_sum(Volume) 从分钟数据得到(种子里两种来源都有,互相核对)。经济含义:散户的低价幻觉与彩票偏好(Birru-Wang 2016,Kumar 2009;Blume-Husic 1973 记录了低价股的历史收益更高),另外最小报价单位占价格的比例使低价股的相对价差更大(流动性溢价)。AlphaCube 自己的记录:不复权低价单因子在旧尺子下 train 净夏普 +0.98,日换手只有 2.0%(docs/可交易回测.md 21.4,没有控制的口径),是最慢的风格之一。
    (2) 复权因子 F:log F = log(后复权收盘) - log(名义价),是累计分红与送转的历史,即派现纪律与成熟度;长期派现与从不派现的公司由不同的投资者持有(Baker-Wurgler 2004 的 dividend clientele),送转降低名义价而不改变价值(Grinblatt-Masulis-Titman 1984)。
    (3) 限售比例 log(总市值 / 流通市值):未来解禁的供给压力(Field-Hanka 2001)。
    这三样都是日频、慢变,换手接近 0,15 bp 成本不是问题。

    算子怎样实现:全部用 6 个日频叶子与 day_last / day_sum 写,不含任何分钟聚合的水平。种子分四类:(a) 原始量(名义价、后复权价、复权因子、限售比例);(b) 非参数去市值:cs_bucket_demean / cs_bucket_zscore 按流通市值十分位,因为尺子只去掉市值排名的 1/2/3 次项,桶内标准化可以去掉任意形状的市值暴露,留下「同市值的票里,价格更低 / 因子更高」;(c) 垃圾尾部闸:cs_last_low05 把名义价最低的 5% 压到底部再按低价排(这个尺子的多头书对没有标签的持仓记 0,不套可交易掩码,所以按价格单调排序时,最低价一端的壳 / 异常票可能占据头部,这一点第 1 轮没有数据,是待检验的假设),cs_last_high20 按市值把最大的 20% 压到底部,cs_last_low10 按上市年龄把最新的 10% 压到底部;(d) 两个量互相去掉:名义价在复权因子十分位内、复权因子在名义价十分位内(因为送转同时降低名义价并抬高 F,两者有机械的负相关,要分开读)。

    为什么和已有的不同:两个库 5583 条全部是分钟聚合,6 个日频叶子 0 次出现(grep 核对),也没有任何一条做名义价与复权因子的拆分;库里唯一接近的是 day_cov(Close, Ret) 这一族,它把价格水平乘进了方差。与 3 个 head 比,这里没有协方差、没有方差、没有 cross_max 链,是静态的价格水平;与 5 个控制比,名义价 / 复权因子 / 限售比例都不是市值、流动性、波动、反转或成交额族。

    为什么样本外还会在:来源是散户与机构的持股偏好(低价、派现、解禁约束),这些是结构性的、慢变的,不依赖某一段行情;换手低,成本几乎不吃信号;别的流(2012、2021)独立地读到过同一类线索:价格十分位去均值把一个素材 head 提升 1.55,含 LogFloatShares 的表达式把最好读数推到 -0.2 ~ -0.3,说明名义价位是被控制和冠军都没盖住的变量。风险:(1) 名义价与市值、上市年龄有相关,尺子只去掉市值的 1/2/3 次项,所以才有桶内版本;(2) 2018 年以后上市的新股名义价偏高(注册制发行价),可能让名义价读成「新股」,所以有年龄闸与价格闸;(3) 复权因子的基期若不是上市日,F 的截面差只剩样本内的分红史,仍然是有信息的量;(4) 低价股效应在 2024 年初的小盘冲击里可能阶段性失效,valid 段会检验。

    数学检查:无前视:LogFloatCap / LogTotalCap / LogFloatShares 存的是收盘时点已知的值,后复权价只含过去的除权;全部不含除法,或只除以 day_sum(Volume)(只在整天无成交时为 0,此时分子也为 0,得 NaN),没有近零分母的爆点;取 log 的量都是正的;种子是日频静态量加慢聚合,面板不是常数(名义价的截面差是数量级的),不会因热身期主导;tie 只出现在极少的并列价格上。
