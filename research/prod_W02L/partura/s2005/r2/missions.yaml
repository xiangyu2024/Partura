- type: E
  core: day_cov(Amt, Low)
  hypothesis: |-
    机制:日内「钱落在价格路径的哪一段」。核心 day_cov(Amt, Low) 是一天里分钟成交额与分钟最低价(价格水平)的协方差。除以两个均值(day_mean(Amt) * day_mean(Low))得到相对的 VWAP 减 TWAP 缺口(成交额加权价与等权价之差占价格的比例,等于 rho * CV_A * CV_L);除以两个标准差得到相关系数 rho,无量纲、范围 [-1, 1]。rho 为正:成交额集中在日内价格较高的分钟(追涨、趋势尾段放量、拉高出货);rho 为负:成交额集中在价格较低的分钟(逢低承接、恐慌放量)。读的是资金「到场时点相对于价格路径」的习惯,是持有人结构 / 执行风格的个股属性,不是成交额的水平。与当日收益符号相乘后,读的是尾段加速是顺着当天趋势还是逆着趋势。

    和库里不同:两个库里含 day_cov(Amt, Low) 的 27 条表达式(我用 members.csv 逐条核对过)里 23 条套 cross_max 链,其余 4 条是裸协方差、abs_、ts_quantile / cross_delay 的写法;全部是裸协方差,没有一条无量纲化,聚合窗口没有一条超过 60 日。裸协方差约等于「成交额水平 x 价格水平 x rho 项」,符号正负抵消,一套 cross_max 就变成「最大那一天的成交额规模」,拆解表里单独 rho_known 0.02、一层 cross_max 0.64、三层 0.80,正是新尺子要吃掉的成交额水平通道。第 1 轮 R 里同一个对象去掉水平以后(Volume 版,除以两个均值之积,放进 5/5/60 的 cross_max 链)已经是 -0.95(train -0.14 / valid -0.95)、rho_known -0.11,比整批 head 的 -1.4 ~ -1.85 好 0.5 ~ 0.9,说明去掉水平之后核心没有死;它的毛病是链太短、valid 段差。这一次的外围全部是慢的、无水平的聚合,和快照里见过的写法(cross_max 链、5 到 60 日)不同:(a) cross_mean 241 / 120 日,三种无量纲写法(相关系数、相对缺口、除以均值与标准差);(b) cross_ema 60,以及「20 日 EMA 相对自己 241 日常态的 z 分数」;(c) 上 / 下四分位尾部均值(241 日),读极端追涨日 / 恐慌日的频率与幅度;(d) 均值除以标准差(一致性)与单独的标准差(耦合的不稳定程度);(e) 与当日收益符号相乘、与当日收益的 120 日时间序列相关;(f) 非参数闸:按流通市值十分位内 z 分数,以及把上市年龄最低 10% 压到底部(新股不在老股的价量关系里)。

    为什么样本外还会在:(1) 来源是持有人与执行风格(被动与基准型执行偏尾盘,追涨偏上涨段,逢低承接偏下跌段),是慢变属性,跨年稳定,不依赖某一段行情;(2) 窗口 120 ~ 241 日,日换手低,15 bp 成本留得住:本流第 1 轮 E 位最好的候选(-0.84)用的就是 241 日窗口的下尾均值;别的流里接近 0 的读数有不少是 120 ~ 241 日窗口(2009 流 cross_mean(sub(day_wmean(Ret, Amt), day_mean(Ret)), 241) 的 train / valid 为 +0.07 / +0.40,2012 流的 120 日均值读数为 -0.19);(3) 相关系数没有成交额水平、价格水平、波动水平,尺子里的 5 个控制与两个冠军(都是水平型)吃不掉它。风险:rho 可能主要由日内趋势方向与成交量 U 形共同决定,于是与 20 日反转有关(尺子已去掉反转的线性 / 平方 / 立方部分);日度 rho 噪声大,必须 120 日以上聚合,否则被 15 bp 吃掉。

    数学检查:无前视,只用 t 日收盘及以前的数据,t+1 才交易。day_std(Low) 或 day_std(Amt) 为 0 只在整天停牌或一字板,此时协方差也为 0,得 NaN 而不是无穷;相关系数有界;相对缺口的分母 day_mean(Amt) * day_mean(Low) 只在整天无成交时为 0,分子同时为 0,得 NaN;相对缺口的上界是 CV_A * CV_L,CV_A 至多约 sqrt(241),没有近零分母造成的爆点。所有窗口不超过 241 日,第 1 年热身期只占样本的一小部分,不主导结果。cross_tail_mean_q25 / q75 在窗口内不足数据时返回 NaN,不是 0。
