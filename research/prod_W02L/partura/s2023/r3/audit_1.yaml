slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [2, 4, 6, 7, 9, 10, 13]
    reasons: '核心检查:核心 day_wmean(Ret, log(log(abs_(Ret)))) 是快照 head cross_mean(day_wmean(Ret, log(log(abs_(Ret)))), 241) 的子树,来源合规;与 5 个控制的 |ρ| 为 liq 0.01、vol 0.03、rev 0.16、known 0.01、size 0.05,全部 < 0.8,通过。算子核对:log 是保护型(|x| <= EPS = 1e-9 给 NaN),day_wmean 取 |w|,零收益分钟被排除,当天全部零收益时输出 NaN 而不是 0;day_* 只用当天分钟,cross_* 回看含当天,无前视;无 ts_rank、cross_rank、nanrank_last、ts_spearman、nt_*。逐个种子:(1) 划掉 2、4、6、7、9:与 head 的原始日度秩 |ρ| 分别为 0.96、0.80、0.89、0.89、0.93,触发库禁令的 0.7 自动划掉;其中 6、7、9 与 R 组变体 4、7、6 表达式相同。(2) 划掉 10:cross_med(C, 241) 与 R 组变体 5 表达式相同(原始 |ρ| 0.38),重复划掉。(3) 划掉 13:cross_decay_linear(C, 120) 与 head 的 cross_mean(C, 241) 是同一日度序列 C 的两种慢平滑(原始 |ρ| 0.67、残差 0.60),与 r1 审计员划掉种子 13 的理由同类(同一内层只换外层平滑),按重复划掉。(4) 保留 1、3、5、8、11、12、14:种子 1 是 C 为正的日数占比(原始 |ρ| 0.38,残差 0.34),有一处定义问题需要 PI 注意:is_gt 对 NaN 返回 0,停牌日 C 为 NaN 时被计为「非上涨日」,241 日均值会被停牌天数稀释;这是系统性偏差但不是结果的主要来源,不划,请 PI 出结果时检查停牌股的截面。种子 3 是 C 对 cs_mean(C) 的 beta,cross_regbeta 第一参数为自变量,写法正确(原始 |ρ| 0.22,残差 0.34,size 控制 0.36,低于 0.8)。种子 5 是对市场 C 回归 60 日的残差再取 120 日均值(原始 |ρ| 0.13,残差 0.18)。种子 8 是 C 减去 log 权重版的同一 day_wmean(原始 |ρ| 0.60,残差 0.59),只留权重倾斜项,不是重复。种子 11 是市场下跌日的 C(原始 |ρ| 0.29,liq 0.31、size 0.33,都低于 0.8)。种子 12 是 C 的 241 日 1 阶自相关(原始 |ρ| 0.04)。种子 14 是 241 日与 30 日均值之差(原始 |ρ| 0.41,残差 0.58),是期限结构而不是水平。保留 7 个种子,满足至少 4 个的要求。创新度 3:保留种子多为 C 的新读法(beta、残差、条件、自相关、期限差),但 1、8、14 仍是 C 的同一序列的重排,残差 |ρ| 在 0.58 到 0.59 以上,不能给 4;也不能给 2,因为 3、5、11、12 的对照都在 0.3 以下,确实是新读法。合理度 4:核心机制(非零分钟的平均漂移)说得通,算子组合与描述逐个一致。如果它有 alpha,最可能来自活跃分钟的平均漂移里扣掉市场共同成分之后的个股慢漂移(种子 3、5),或者 tick 与最小变动价位的微观结构效应(种子 1、8)。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [5, 13]
    reasons: '核心检查:N 位,无核心。原始日度秩 |ρ| 对快照 7 个 head 的最大值为 0.55(种子 2 对 ts_max(q75 Volume, 40)),控制最大为 0.48(种子 14 对 liq),都不触发自动划掉。逐个种子:(1) 划掉 5(数学问题,数值伪影):权重 1/(|Ret| + 1e-4) 对零收益分钟给出 1e4,是对近零量取倒数,而 day_signed_ratio 的分母是 sum(|y|),零收益分钟的权重约为 |Ret| = 1e-3 分钟的 11 倍,分母被零收益分钟支配,截面排序主要反映当天零收益分钟的占比,符合 §4「除以近零的量造成的爆点支配了截面」。(2) 划掉 13(重复):q25 阈值的小幅桶与种子 1 的 q50 小幅桶是同一对象,只换了分位阈值,与 r1 划掉种子 13 的理由同类。(3) 保留 1、2、3、4、6、7、8、9、10、11、12、14,共 12 个。数学核对:种子 6 的权重 1/(|Ret| + 5e-4) 对零收益分钟给 2000,与典型小幅分钟的 700 左右同量级,未形成爆点,保留,但 PI 应检查零收益占比高的票;种子 11 的分子是小幅桶均值 day_wmean(Ret, 小幅桶),分母是小幅桶平均幅度加 1e-6,由 |mean r| <= mean |r| 可知比值有界在 [-1, 1],不是 r1 划掉的那种分子分母同为近零的情况;种子 4 的分母 sum(|loglog|) 对非零分钟是正数,不爆;种子 12 的分母是小幅非零分钟计数,空桶给 NaN。种子 1、9、11、12 的残差与 ts_max(q75 Volume, 40) 的残差 |ρ| 分别为 0.82、0.80、0.78、0.79,说明扣掉控制后这几个种子读的成分与放量 head 有很大重合,原始 |ρ| 都在 0.6 以下所以不划,但创新度扣 1。创新度 3:按|Ret| 分位数切桶、以及只读符号的读法在快照和库里都没有出现,但残差层面与放量 head 的共享成分较大,种子 14(放量分钟收益)又属于 2009 与 2025 流已出的 Amt 加权收益一族,所以给 3 不给 4。合理度 4:机制清楚(安静分钟里的净方向与大幅冲击的分离),逐个算子核对与描述一致,无前视,分位数是当天截面内逐票计算的。如果它有 alpha,最可能来自安静分钟里的慢速净方向(小单累积或 tick 回弹的不对称,种子 7、8、12),其次是小幅桶与大幅冲击之间的读数差(种子 3、9);如果结果主要来自与放量 head 的残差共享部分,则更可能是开收盘时段的价格模式,PI 应用 U 形时段控制检验。'
R:
  - head: 'cross_mean(day_wmean(Ret, log(log(abs_(Ret)))), 241)'
    soundness: 4
    reasons: '5 个变体的数学都正常。变体 1 是 is_gt(abs_(Ret), 1e-6) 权重下的等权非零分钟均值,是 head 去掉 loglog 倾斜后的干净极限,与 head 的 ρ 为 0.97,是对权重部件的正确检验。变体 2 是三层 log 权重,权重近乎平坦(|Ret| 在 1e-6 到 1e-2 之间仅差约 2.3 倍),在 |Ret| 约 0.066 处权重为 0、在约 0.368 处为 NaN,都是分钟涨跌幅量级之外的极端点,不影响结果。变体 3 是 360 日窗口,无问题。变体 4、5、6、7 与种子 6、10、9、7 表达式完全相同,是重复的评估,但不影响合理度。注意变体 7 即 C 减去 day_mean(Ret),由于 day_mean 把零收益分钟计为 0,变体 7 等于非零分钟均值乘以零收益占比,PI 应留意它的截面可能主要是零收益占比,这一点不是数学错误。如果它有 alpha,最可能来自去掉活跃度项之后的慢速分钟漂移(变体 1、3),以及去掉市场层面成分之后的个股部分(变体 7)。'
summary: '种子 2023 第 3 轮审计:a 位通过(创新 3、合理 4,划掉 2、4、6、7、9、10、13,剩 7 个);b 位通过(创新 3、合理 4,划掉 5、13,剩 12 个);R 组合理 4,数学合法,变体 4 到 7 与 a 位种子重复。'
