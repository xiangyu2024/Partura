attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '核心检查:day_quantile_q75(Volume) 是 3 个 head 的子树(ts_stddev、ts_max、sub(0.5,abs_(ts_regres(...)))),E 核心规则满足。核心与 5 个控制的 |ρ| 为 liq 0.64、vol 0.21、rev 0.19、known 0.67、size 0.56,全部 < 0.8,通过。核心自身与 ts_stddev(C,10) 的原始 |ρ| 为 0.92,gate 为 False(不同值占比 0.35,股数整手并列多),这些只说明核心接近 head 的水平项,对 E 位不构成拦截理由,但说明它本身不能当候选用。逐个种子核对:(1) 数学:无 ts_rank、cross_rank、nanrank_last、ts_spearman、nt_*;cross_* 按日轴且只回看含当天,无前视;log(C+100) 有下界 log(100);除法分母为 +100 的量(种子 6、7、11)或由分子子集绝对值界定的比值;种子 8 的 log(day_std(Ret)) 在 Ret 全零时为 NaN(log 的 EPS 保护),不是 -inf;cross_zscore 对恒定窗口返回 0(源码确认);cross_corr 值域 ±1,cross_regbeta 的 var_x 是窗口和而非均值,EPS 保护基本不触发。PI 笔记里「cross_regbeta 有效对太少时返回 0」不准确:regbeta 返回 NaN,cross_corr 才在无有效对时返回 0。(2) 重复:15 个种子按我自己的骨架规范化(抽掉字段、常数、窗口)与 5583 条库表达式比对,0 条重合(库里 310 条我的解析器解不了,只会漏判,不会误判);cross_zscore、cross_ema、cs_bucket_zscore 在库里各出现 0 次。与 3 个 head 的原始 |ρ| 最大 0.38(种子 2),与控制最大 0.65(种子 6,liq),没有触发 0.7 或 0.8 的自动划掉。种子 6 与 7 只差分母(中位数或均值),是近亲,但分母携带的偏度信息不同,不划。(3) 已知弱点(非 §4 陷阱,不划):种子 3、4、8 到 13 用未复权股数 C,1 送 1 时送转当天股数约翻倍,会污染之后 60 到 241 日的窗口;种子 3 的 log 均值比会先跳约 ln2,持续数月,最严重。种子 1、2、5、14、15 用 log C - LogFloatShares 抵消送转,是干净的。种子 9、10、14 的 cross_corr 在窗口有效点少时由极少点决定(2 点即 ±1);笔记称可交易掩码已排除新股,我没有核实掩码,请总领确认。种子 15 的日收益回归斜率受涨跌停日的高杠杆影响。创新度 4:三个算子族在库里未出现,15 个种子对 3 个 head 与 5 个控制的 |ρ| 大多 < 0.4,与 head 的原始 |ρ| 都 < 0.4。合理度 4:机制清楚(关注度冲击、量价耦合、量的波动率),算子组合与描述逐个核对一致;送转混杂是可修的定义问题。如果它有 alpha,最可能来自换手标准化后的异常放量(种子 1、2)与量价耦合(种子 9、10、14、15),即 C 作为每只票自己时间序列的动态,而不是 C 的水平。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [8, 13]
    reasons: '划掉种子 8(数学,数值伪影):分子是 day_wmean(abs_(Ret), 放量指示),分母是 day_wmean(abs_(Ret), 缩量指示) + 0.000001。封涨停或封跌停的日子里,低量分钟的价格不动,Ret 精确为 0,分母取 0 + 0.000001;而放量分钟里只要有一次价格移动,分子就在 1e-4 到 1e-3 量级,比值到 1e2 到 1e3。一个 241 日均值里出现一两次就支配该票的截面排名,并把涨停次数当成信号。PI 笔记「封板日分子分母同为 0」只对停牌日成立;早盘封板、盘中仍有移动的日子分子不为 0,分母却近零。这正是 §4「除以近零的量造成的爆点支配了截面」。划掉种子 13(重复):它的内层与种子 2 完全相同,都是 X = day_wmean(Ret,放量) - day_wmean(Ret,缩量),只换外层平滑(241 日等权均值对半衰期 240 日 EMA)。相关度表里两者对 3 个 head 的原始 |ρ| 都是 0.23,对 5 个控制逐列相差不超过 0.03(liq 0.48 对 0.51,known 0.46 对 0.49),残差 0.11 对 0.14,是同一个日度序列的两种慢平滑。其余 14 个种子无数学问题:day_wmean、day_signed_ratio 在权重和为 0 时给 NaN;day_wstd 对 day_std 的比值有界(约 2 倍根号 241);种子 9 的价格位置比分子不超过分母;种子 5、6 的 day_signed_ratio 分母有 0 的保护。创新度 3:day_wmean、day_signed_ratio、day_wstd、cs_bucket_zscore、cross_zscore、cross_ema 在库里各出现 0 次,种子与 3 个 head 的原始 |ρ| 都 <= 0.28,但「高成交量分钟的收益」这一族在本波已有 head:s2025 r2 的成交量加权收益 cross_mean(...,20)、in_topk_masked(Volume,Ret,10) 的波动;s2009 r2、r3 的 day_signed_ratio(·,Amt)。相关度表不含这些 head,所以给 3 而不是 4。合理度 4:机制清楚(放量分钟的价格压力与净买入),算子组合与描述一致。需要注意,q75 阈值选出的分钟大多是开收盘 U 形时段,PI 笔记也承认这一点,所以读数可能是开收盘的价格模式,而不是事件性放量的信息含量;种子 15、16(去 U 形)是这个区分的检验。如果它有 alpha,最可能来自放量分钟收益与净买入在 241 日上的持续偏向(种子 2、3、5、6),更可能是开收盘时段的价格模式。'
R:
  - head: 'ts_max(day_quantile_q75(Volume), 40)'
    soundness: 4
    reasons: '变体数学正常:ts_max 与 ts_mean 的输入是 log 换手或原始 C 的 40 日窗口,cross_ema 半衰期 60 日,无除法。head 的三个缺陷(股数水平、尖峰记忆、未做流通股本折算)与四个变体对应得上。变体 1(换手的 ts_max)与 head 的 |ρ| 为 0.18(残差 0.26),变体 3(换手的 ts_mean)为 0.12(残差 0.12),都是实质改变。变体 2(ts_mean)与变体 4(cross_ema 60)与 head 的原始 |ρ| 为 0.97、0.93(残差 0.94、0.85),基本是同一信号的改写(变体 2 的已知族 |ρ| 为 0.71),不影响合理度,但不会产生新信息。如果它有 alpha,最可能来自近期最大放量所代表的关注度冲击,换手标准化后仍在。'
  - head: 'ts_stddev(day_quantile_q75(Volume), 10)'
    soundness: 4
    reasons: '变体数学正常:变异系数的分母为 ts_mean(C,60)+100 ≥ 100;log 换手与 log(C+100) 的 120 日标准差无除法。head 的烂部件判断成立:ts_stddev 的量纲是股数,随水平放大;10 日窗口只有 10 个点。变体 1 除以均值得到无量纲变异系数(原始 |ρ| 0.11,残差 0.24),变体 2 改用送转免疫的 log 换手(0.14,残差 0.21),变体 3 拉长到 120 日的 log 标准差(0.10,残差 0.23),三者与 head 都不同。如果它有 alpha,最可能来自放量自身的波动(量的不稳定,参与者构成切换),在换手标准化后仍在。'
  - head: 'sub(0.5, abs_(ts_regres(day_cov(Close, Open), day_quantile_q75(Volume), 50)))'
    soundness: 3
    reasons: '扣到 3 的理由是机制叙述与实际读数不符,不是数学错误。ts_regres(x, y, d) 返回的是 y 对 x 的滚动回归残差(common.py 的 rolling_ols 中 resid = last_y - pred(last_x);nd_ts.py:283 调用它)。head 中 x = day_cov(Close,Open)、y = day_quantile_q75(Volume),所以残差是股数对日内协方差的残差,绝对值的尺度由成交量水平决定,而不是 PI 笔记说的价格尺度。变体 1 与 3 的第一部分只除以 pow_2(day_mean(Close)) 改变 x 的尺度,而 beta 随 x 同比例缩放,残差不变:表中变体 1 与 head 的原始 |ρ| 为 0.98(残差 0.99),基本是同一信号,检验不了 PI 想检验的假设(PI 预测它会掉到 -2.5 以下,按这个机制不会)。真正去掉股数尺度的是变体 2、3、4,它们改了 y(对 log(C+100) 或换手回归),与 head 的 |ρ| 为 0.41、0.32、0.16。变体 2 对 day_cov 取 log 会丢符号,但日内 Close 与 Open 的协方差几乎恒正,不构成数学问题。如果它有 alpha,最可能来自日内价格波动中不能被成交量解释的部分,但这一读法需要按股数尺度重写。'
summary: '种子 2023 第 1 轮:E 位 a 通过(创新 4、合理 4、无划掉),N 位 b 通过(创新 3、合理 4,划掉种子 8 为除以近零的封板日分母、划掉种子 13 为与种子 2 的内层重复);三个 R 组合理度 4、4、3,R3 的机制按 ts_regres 方向纠正为股数尺度,其变体 1 与 head 基本是同一信号。'
