  hypothesis: |-
    机制:核心 C = day_quantile_q75(Volume),当天 241 根分钟成交股数的 75% 分位,即「放量分钟」的股数水平(未复权原始股数,不是金额)。

    本批(B067,54 条,37 个已评分)的证据(都来自 loc.md):
    (1) 富集:含 C 的 7 个候选均值 -1.99,不含的 -2.80(均值差 +0.81,p 0.004),是本批唯一显著的核心;含 q75(Low) / q75(Ret) 的差 +0.62 / +0.37,都不显著。
    (2) 3 个 heads 全是「对 C 的水平做单股时间序列滤波」:ts_max(C, 40) -1.36(train -1.16 / valid -1.36)、ts_stddev(C, 10) -1.48、sub(0.5, abs_(ts_regres(day_cov(Close, Open), C, 50))) -1.56。两段同号为负。
    (3) 把 Volume 换成 Amt:ts_max 版 ρ_known -0.95、ts_stddev 版 ρ_known 0.88,就是已知成交额族本身;Volume 版的窗口变体与已知族 ρ 0.62 到 0.71。
    读法(推断,没有毛收益数):C 的水平 = 流动性(股数 ≈ 金额 ÷ 名义价),在库里的原始尺子下 ts_max 版 train 净夏普 +1.65、换手 2.3%,到新尺子下掉到 -1.2 到 -1.5,说明水平里有预测力的部分全被控制和冠军吃掉了。所以这一位不再问「C 有多大」,问「C 作为每只票自己的时间序列在做什么」。

    这一位要试的七种读法(全部无量纲或按自己历史标准化,窗口 >= 60 日,其中相关 / 回归类 241 日):
    (a) 异常放量(种子 1、2、4):C 相对自己 120 日 / 241 日历史的 z 分数,再用 cross_ema 半衰期 30 日或 20 日均值对 241 日标准化;种子 1、2 先把 C 换成 log(C + 100) - LogFloatShares,即放量分钟的换手,这样送转 / 拆股造成的股数水平跳变被流通股本抵消。机制:Gervais、Kaniel 与 Mingelgrin 的高成交量溢价(2001)与 Barber 与 Odean 的注意力购买(2008):相对自己常态的放量是关注度冲击,不是流动性水平。种子 4 再在流通市值十分位内标准化。
    (b) 放量趋势(种子 3):log(60 日均 C + 100) 减 log(241 日均 C + 100),季度对年度的放量变化。
    (c) 放量的不稳定(种子 5、14):log 换手的 120 日标准差,及其与日内波动 day_std(Ret) 的 241 日相关;参与者构成在切换(散户 / 机构)的指纹,是水平的二阶量。
    (d) 日内形状(种子 6、7):C ÷ (中位数 + 100)、C ÷ (均值 + 100) 的 241 日均值:放量分钟相对典型分钟有多「尖」,不依赖水平,是机构拆单(平滑)对散户事件(尖峰)的指纹。
    (e) 量价耦合(种子 8、9、10、15):C 与波动 / 当日 |收益| / 当日收益的 241 日滚动相关与回归斜率。量与 |收益| 同升 = 信息驱动成交,量与收益同升 = 资金净流入的持续性(量价相关),估的是这只票自己的耦合强度,水平被相关系数和斜率去掉。
    (f) 带方向累计(种子 11):120 日内上涨日放量占比减下跌日(OBV 的无量纲版)。
    (g) 量价背离(种子 12、13):放量的 z 分数减价格 z 分数 / 减 |收益| z 分数,取 EMA:放量没有被价格确认的部分。

    为什么和已见过的不同:快照里含 C 的候选,外围是 ts_max、ts_stddev、ts_min、ts_std、ts_decay_linear、ts_cov、ts_regres(day_cov(Close, Open), C, 50)、cs_mean、cs_quantile、signedpower、pow_2,即全部是对 C 水平的单股滤波 / 同一族截面变换。这里的外围是 cross_zscore、cross_ema、cs_bucket_zscore、cross_corr、cross_regbeta、sign 加权的 cross_sum、日内比值,**两个库 5583 条里 cross_zscore / cross_ema 出现 0 次**,15 个种子的算子骨架已逐个与 struct/members.csv 全部骨架对照(chk.py 脚本),没有重复。它们读的是 C 的动态与关系,不是水平,所以与 3 个 heads(水平滤波)的秩相关预期 < 0.5,与流动性 / 市值控制预期也低。

    为什么样本外还会在:(a)(b) 的异常放量是投资者关注度的冲击,关注度对 A 股散户的价格压力随制度和行情更替而存在;(c)(d) 的不稳定与形状反映参与者构成(拆单型机构 / 事件型散户),以季度到年计变化,窗口 120 到 241 日后名次稳定、换手低,这是前面各流里分数最高的那一类(慢、无量纲、与水平控制正交);(e)(f)(g) 是每只票自己的耦合强度,不依赖某段行情的风格。

    数学检查:C 是非负量,log(C + 100) 的 100 是一手,所以 C = 0(分钟成交稀疏的票)时给 log(100),不是 -inf;所有除法分母加了 100 或 add 下限(中位数 / 均值 / 累计量);cross_zscore 对恒定窗口返回 0(自带保护),cross_corr / cross_regbeta 有效对太少时可能返回 0(已知缺陷,只影响新股与长期停牌,可交易掩码已排除);LogFloatShares 是日频字段(日终可知,float64 取 log 再降精度),与 C 同一天对齐;全部 cross_* 与 ts_* 只回看(含当天),t 日收盘后可得,t+1 才交易,无前视;没有用 ts_rank / cross_rank,不碰 nanrank_last 的停牌返回 0;没有用 ts_spearman / nt_*。种子 3、4、8、9、10、11、12、13 直接用未复权的 C 水平,送转当日 C 会成倍跳,影响约 60 到 241 日,这是已知弱点;种子 6、7 是日内比值,送转前后同比例缩放,不受影响;换手版的种子 1、2、5、14、15 用 LogFloatShares 抵消,也不受影响。
    最可能的失败:C 在水平之外没有毛超额(两段都亏);或与流动性 / 波动的暴露仍重;或 60 到 120 日的 z 分数估得太吵被 15 bp 吃掉。三种情况下这个核心第 2 轮最多再用一次。
