- type: N
  hypothesis: |-
    机制:用「当天成交股数的 75% 分位」当阈值,把每天的分钟切成放量分钟(Volume 高于它)和其余分钟,读放量分钟里价格在做什么。读的是「放量分钟的价格签名」,不是放量有多大。

    背景(B067):本批唯一的显著梯度是含 day_quantile_q75(Volume) 的候选(富集 +0.81,p 0.004),但 3 个 heads 都是对它水平的滤波,它换成 Amt 就是已知成交额族(ρ_known -0.95 / 0.88),水平版的 Volume 与已知族 ρ 0.62 到 0.71。结论(推断):水平是流动性的变形,被控制吃掉。这个量还有一个没被用过的用法:它是一天之内自带的、与单位 / 水平无关的「放量阈值」。放量发生在哪里、方向如何、带来多少波动,是资金行为的签名,不依赖这只票有多活跃。

    做法(全部是 day_* 一层,再用 cross_mean / cross_ema 取慢聚合):
    H = is_gt(Volume, day_quantile_q75(Volume)),取值 0 / 1 的整数,当天的 q75 广播到全部分钟,所以阈值每天每只票自己定,没有量纲。L = is_lt(Volume, day_quantile_q75(Volume)),其余分钟。H2 = mul(H, is_gt(Volume, cross_mean(Volume, 20))),放量且高于自己同分钟 20 日均值(去掉固定的 U 形放量,留事件性放量)。
    (1) 放量分钟平均收益 day_wmean(Ret, H)(种子 1、4):放量时价格往哪走。资金实际经历的收益,与 day_mean(Ret) 的差读的是「收益是不是集中在放量时」。
    (2) 放量减其余(种子 2、3、10、13):day_wmean(Ret, H) - day_wmean(Ret, L),种子 3 再除以当天波动做成无量纲的信噪比。持续的正差 = 放量分钟持续推高价格(机构吸筹 / 事件性买盘);持续的负差 = 放量时被砸。
    (3) 放量时的净买入(种子 5、6、12):day_signed_ratio(Ret, mul(Volume, H)) = 放量分钟里上涨分钟成交占比减下跌分钟占比,不需要逐笔数据的方向代理;种子 6 减去全天的版本,留下放量分钟独有的方向性;种子 12 对自己的历史做 z 分数。
    (4) 放量时的波动与冲击(种子 7、8):放量分钟的收益波动占全天的比例、放量分钟 |Ret| 与其余分钟 |Ret| 的比值:成交驱动价格移动的程度。
    (5) 价格位置(种子 9):放量分钟的均价在当天最低价到最高价之间的位置(0 = 全部在最低点附近,1 = 在最高点附近)。
    (6) 同步性(种子 11、14):放量分钟收益与全天收益的 241 日相关与斜率:一天的方向是不是在放量分钟里定的。
    (7) 去 U 形的事件性放量(种子 15、16):用 H2 代替 H,做放量分钟平均收益与净买入。
    全部取 120 到 241 日窗口(cross_mean 241、cross_ema 半衰期 60 / 120 / 240)。种子 10 在流通市值十分位内标准化。

    为什么和库里的 / 已有的 heads 不同:
    (a) 两个库 5583 条里 day_wmean / day_signed_ratio / day_wstd / cs_bucket_zscore / cross_zscore / cross_ema 一共出现 0 次。手写库有「放量」条件因子(例如 L#1129 到 L#1142:Volume 高于自己同分钟 20 日均值加一个标准差,再做 day_sum / day_product / 20 日 cross_sum),也有 is_gt(Ret, day_quantile(Ret, 0.95)) 这种用收益自己分位数的条件,但:放量阈值都是「每分钟对自己 20 日基线」,窗口 20 日,聚合是求和 / 连乘,没有「用当天成交股数自己的 75% 分位当阈值」的写法,也没有 241 日的慢聚合。16 个种子的算子骨架已逐个与 struct/members.csv 的全部骨架对照(chk.py 脚本),没有重复。
    (b) 一个必须说清的区别:当天 q75 阈值选出的放量分钟,大部分落在开盘与尾盘的 U 形高峰,其余是盘中事件;所以种子 1 到 14 读到的主要是「市场最活跃的时段里价格的动作」(2009 流发现 Amt 加权收益的读数可能来自开盘 / 尾盘附近,同一层意思)。手写库的 20 日基线放量把 U 形除掉了,读的是事件性放量。种子 15、16 用「高于当天 q75 且高于自己同分钟 20 日均值」两个条件相乘,把固定的 U 形放量去掉,留事件性放量,与前 14 个拆开比较:哪一种读数有毛超额。
    (c) 与 3 个 heads、5 个控制不同:heads 是 Volume 水平的滤波,控制是流动性 / 波动 / 20 日反转 / 成交额离散度 / 市值,这些都是水平量;这里全是收益值或比值,不含任何 Volume 的水平,秩相关预期 < 0.5(例外是种子 7、8 的波动类,可能与波动控制 0.3 到 0.5)。

    为什么样本外还会在:放量分钟是知情交易者 / 机构大单执行的地方(Easley 与 O'Hara 1987 的交易量含信息;Chordia 与 Subrahmanyam 2004 的订单失衡预测收益),放量分钟的价格倾向在季度到年的尺度上持续(机构建仓 / 减仓以月计);A 股散户主导,这些持续的资金足迹不容易被套利掉。241 日聚合后换手低,不靠频繁调仓;全部无量纲,不依赖某段行情的风格。方向由尺子在训练段选,我不预设。

    数学检查:H / L 是 0 / 1 整数权重,day_wmean / day_wstd / day_signed_ratio 取 |w| 为权重,某天没有任何分钟超过 q75(成交几乎恒定)权重和为 0,给 NaN 而不是 0;Volume 为 NaN 的分钟 is_gt 为 0,不进权重;Ret 第 0 根(集合竞价)恒为 0,所以不含隔夜跳空;分母都加了下限(day_std(Ret) + 0.000001,其量级 1e-3;day_wmean(|Ret|, L) + 0.000001,量级 5e-4;价格区间 + 0.0001,价格是后复权,区间量级 0.1 以上),停牌日 / 封板日分子分母同为 0 得 0,不爆;阈值与权重都只用当天的分钟,t 日收盘后可得,t+1 才交易,无前视;全部 cross_* 只回看含当天;没有用 ts_rank / cross_rank,不碰 nanrank_last 的停牌返回 0;没有用 ts_spearman / nt_*。已在合成数据上逐个跑通(覆盖率与不同值占比正常),没有碰真实数据。
    最可能的失败:放量分钟的收益倾向被 20 日反转 / 波动吃掉(收益值与当日涨跌同号);或与别的流里「按成交额加权的收益」一族(2009 流)是同一个量,被整波库禁令拒绝;或全部落在 -1 到 -0.3,说明放量分钟的方向性没有毛超额。
