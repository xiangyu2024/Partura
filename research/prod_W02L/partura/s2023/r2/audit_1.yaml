attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 3
    struck_seeds: [2, 3, 7, 8, 9, 13, 15]
    reasons: '核心检查:day_sum(Ret) 在本批共性表里(含它的 10 个候选均值 -1.38,不含 -2.19,差 +0.81,p 0.008),属于 loc.md 共性表的子树,E 核心来源合规;快照里不是 head 的子树,但共性表是允许的来源。核心与 5 个控制的 |ρ| 为 liq 0.00、vol 0.01、rev 0.18、known 0.00、size 0.04,全部 < 0.8,通过。核心与 6 个 head 的原始 |ρ| 最大 0.05,不触发库禁令。逐个种子核对:(1) 数学问题,划掉 2、3、7、8、9、13、15。算子 cross_regbeta、cross_regalpha、cross_regres 的第一参数是自变量 x、第二参数是因变量 y(dt_cross.py 299 到 311 行;common.py 的 rolling_ols 中 beta = cov(x,y)/var(x),resid = y - pred(x),与 r1 审计员对 ts_regres 的读法一致)。这些种子写成 cross_regbeta(个股日收益, cs_mean(...)),算出的是市场对个股的斜率 = ρ·σ_m/σ_i,而不是个股对市场的 β(β 需要 cs_mean 放在第一位);alpha 与 resid 同样读的是市场一侧。它们的 |ρ| 与 vol 控制达 0.25 到 0.38,是 ρ/σ 形状而非 PI 想检验的低 β 异常,估计量写反,划掉;交换两个参数即可恢复,留给 PI 下一轮处理。(2) 其余 8 个种子 1、4、5、6、10、11、12、14 无数学问题:cross_corr、cross_autocorr 按日轴且只回看含当天,ts_skew 对 241 日窗口,10、11 的上下行均值与平方占比有界,无 ts_rank、cross_rank、nanrank_last、ts_spearman、nt_*;原始 |ρ| 对 3 个 head 最大 0.28(种子 10 对 ts_max(q75 Volume)),对控制最大 0.41(种子 10 对 vol),都不触发自动划掉。创新度 4:快照的 head 没有一个度量个股与市场的关系或上下行结构,8 个保留种子与 head 的残差 |ρ| 均 < 0.3。合理度 3:核心机制(低 beta、下行 beta 与延迟相关)没有被实现,只剩下 8 个种子的相关与偏度形态,其中低 beta 的 idea 本身站得住,但算子方向写反,故给 3 而不是 4。如果它有 alpha,最可能来自个股日收益与市场日收益的相关 / 滞后相关(种子 4、12)以及个股日收益自身的偏度与上下行不对称(种子 1、10、11、14)。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [4]
    reasons: '核心检查:N 位,无核心。与 6 个 head 的原始 |ρ| 都 <= 0.35(种子 13 对 ts_max 为 0.35,最大),快照里没有任何 head 按分钟收益的正负号切分,这一点与新颖度的判断相关。与控制的 |ρ| 最大为种子 14 对 vol 的 0.66 与种子 11 对 vol 的 0.63,均 < 0.8,不触发自动划掉。逐个种子核对:(1) 数学问题,划掉种子 4。它是 day_wmean(Ret, up) / (1e-6 - day_wmean(Ret, down)),分母是 1e-6 加上当天下行分钟均值的绝对值。一天只有一两个微小的下行 tick(例如 -1e-4)、上行分钟幅度 1e-2 的票,单日比值就约 100,241 日均值被这几天支配,与 r1 审计员因同类「分母近零的封板日」划掉的种子 8 是同一类问题。种子 7 不划:它的分母是 day_std + 1e-6,上行均值 / 标准差的比值在只有 k 个上行分钟时有界于 sqrt(241/k),不会爆。其余种子无数学问题:day_wmean 按 |w| 取权且权重和为 0 时给 NaN;day_pos_ratio、day_zero_ratio 停牌为 NaN(ops_ext.py 292 行),不会被当成 0 填充;种子 15 的 log|Ret| 在 Ret=0 时为 -inf,被 day_wmean 的有限性掩码排除,分子分母同步排除;种子 8 的分母加 1e-9,日平方和量级约 1e-4,不爆;种子 13 的 cs_bucket_zscore 每桶 n >= 2 才输出,有 EPS 保护。种子 5、6、7 与 ts_max(q75 Volume) 头的残差 |ρ| 为 0.76、0.76、0.79,说明在去掉 5 个控制后它们与放量头的内容相当接近,但原始 |ρ| 只有 0.25 到 0.42,不触发 0.7 的自动划掉,也不算重复,只在新颖度上扣 1 分。(2) 另一点:N 位的 hypothesis 写「权重 |log Ret| 近似均匀」不准确,实际 |log r| 对小涨跌分钟权重很大,反而更支持最小变动价位(tick)效应的解释;这不影响打分,但说明种子 1、2、3 与 log 版本的关系需要 PI 在下一轮自己核实。创新度 3:up/down 切分与 tick 效应的 idea 没有出现在快照里,但残差上与放量 head 有 0.4 到 0.8 的共享部分,给 3 而不是 4。合理度 4:机制清楚(最小变动价位与上下行不对称),逐个算子核对与描述一致。如果它有 alpha,最可能来自价格离散度 / 最小变动价位在名义价上的差异(种子 1、2、5、6、15),其次是上下行幅度的不对称(种子 3、9、10、11)。'
R:
  - head: 'cs_demean(cross_mean(cross_regbeta(day_autocorr_n1(High), day_median(Close), 241), 30))'
    soundness: 4
    reasons: '头:cs_demean(cross_mean(cross_regbeta(day_autocorr_n1(High), day_median(Close), 241), 30))。算子核对:cross_regbeta(x=day_autocorr_n1(High), y=day_median(Close)) 是 y 对 x 的滚动斜率,也就是价格对日内自相关的回归斜率;PI 笔记把价格写成「回归自变量」,角色写反了,但斜率随价格尺度线性放大这个结论仍然成立。后复权价格水平在 §4 里不是问题(它的截面排序近似累计收益的长周期动量 / 反转),所以头本身定义合规,不触发数学划掉。变体 1(cross_corr)把 y 的尺度去掉,是真正的去尺度修正;变体 2(y 换成 day_sum(Ret))、变体 4(cross_ema 代替 cross_mean)、变体 5(去掉外层平滑)都是良定义的;变体 3 用 cross_regres 取残差,但残差仍是价格单位,没有去掉尺度,PI 把它说成去尺度是不对的,这一条不影响它的数学合法性,只说明它的机制叙述有误。无 ts_rank、cross_rank、nanrank_last、ts_spearman、nt_*,无前视(cross_* 只回看含当天)。变体 1 与头的原始 |ρ| 为 0.78(残差 0.81),会被当作同一信号的换写,这是替换判断的事情,不是审计员的划掉理由。如果它有 alpha,最可能来自日内高价的一阶自相关在 241 日里与后复权价格趋势的共动(慢变的价格位置),而不是放量。'
summary: '种子 2023 第 2 轮审计:a 位通过(创新 4、合理 3,划掉 2、3、7、8、9、13、15 共 7 个,理由是回归估计量写反,算出的是市场对个股的斜率而非个股 β,剩 8 个种子);b 位通过(创新 3、合理 4,划掉种子 4 为分母可近零的比值,剩 15 个种子);R 组合理度 4,数学合法,变体 3 的去尺度说法有误但不影响通过。'
