  hypothesis: '机制:把分钟收益拆成上涨分钟和下跌分钟,读它们大小的「不对称」。在第 1 轮 N 位的 83 个评分候选里,唯一两段都为正的是 cross_mean(day_wmean(Ret,
    log(Ret)), 241):分数 +0.44(train +0.44,valid +1.01)。log(Ret) 对负收益是 NaN(被 day_wmean
    排除),所以它就是「上涨分钟的平均涨幅(权重 |log Ret| 近似均匀)」的 241 日均值,和放量无关。我的推断:它读的是上行分钟的平均幅度,一半来自价格最小变动单位(名义价越低,一个
    tick 对应的分钟收益越大),一半来自上行 / 下行不对称。这两者在新尺子里不被市值 / 波动 / 流动性控制吃掉(名义价和市值不同)。

    这一位用 6 种读法把它拆开并外推(全部 241 日或 120 日半衰期慢聚合):

    (1) 上行均幅与下行均幅分开(种子 1、2):day_wmean(Ret, is_gt(Ret,0)) 与 is_lt;

    (2) 两者之和与比值(种子 3、4):和 = 上下不对称、与 tick 效应相消,比值无量纲;种子 3 若好而种子 1 差,说明 alpha 在不对称,不在
    tick 大小;

    (3) 上涨分钟占比、零收益分钟占比(种子 5、6):后者是价格离散度 / 流动性的直接读数,检验「tick 效应」假设;

    (4) 上行均幅除以日波动(种子 7):去掉波动尺度;

    (5) 上行半方差占比(种子 8)、上行与下行标准差之差(种子 9),即有符号波动(Barndorff-Nielsen、Kinnebrock 与 Shephard
    2010;Patton 与 Sheppard 2015 发现下行半方差预测更低的未来收益);

    (6) 成交量加权的版本(种子 10、11)、减当日均收益(种子 12)、市值十分位内标准化(种子 13)、只取上 10% 大涨分钟(种子 14)、权重换成
    log|Ret| 与 sqrt|Ret|(种子 15、16)。

    为什么与库里 / heads 不同:3 个 B067 heads 与 B068 的 heads 都是日内分位数 / 中位数 / 协方差的水平量,没有任何一个按分钟收益的正负号切分;两个库
    5583 条里 is_gt(Ret, 0) 出现 0 次,day_pos_ratio / day_wstd / day_zero_ratio 骨架已逐个对照,零重复。与第
    1 轮 N 位的区别:那一轮用成交量 q75 做阈值(放量分钟),这里用收益的符号做阈值,不涉及 Volume 任何水平,是对那个唯一正信号的机制拆解。

    为什么样本外还会在:最小变动价位与价格离散度是市场微观结构的稳定特征,不随行情风格变;上行 / 下行半方差不对称是被文献记录的风险溢价来源,散户主导的 A
    股里「彩票偏好」使上行大波动被高估,收益为负,是行为性的而非某段行情。241 日慢聚合使名次稳定,换手低。

    数学检查:day_wmean 对 is_gt / is_lt 的 0/1 权重取 |w|,当天无上涨分钟(停牌)权重和为 0 给 NaN 而不是 0;Ret
    第 0 根恒为 0 不计入;分母 day_std(Ret)+1e-6(量级 1e-3)、1e-6 与日平方和 +1e-9(量级 1e-5),不爆;种子 15
    的 log(|Ret|) 在 Ret=0 时为 -inf 被 day_wmean 当非有限值排除;无前视(只用当天分钟,cross_* 回看含当天,t+1
    才交易);不含 ts_rank / cross_rank,不碰 nanrank_last;没有 ts_spearman / nt_*;合成数据上全部评估通过,覆盖率
    0.97。

    最可能的失败:效应主要是名义价(tick)效应,被价格相关控制 + 冠军吸收,残差后为负;或者是 train 弱 valid 强的行情差异(第 1 轮读数的
    train +0.44 vs valid +1.01 提示这种可能),使较差者仍低于 0.5。'
