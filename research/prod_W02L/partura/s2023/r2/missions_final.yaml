  hypothesis: '机制:核心 C = day_sum(Ret),当天 241 根分钟收益之和,即 t 日的日收益(收盘后可得,t+1 才交易)。本批共性表里含
    C 的 10 个候选均值 -1.38,不含 -2.19(差 +0.81,p 0.008),是本批仅次于 Volume q75 的显著核心;快照里含 C 的候选只有
    ts_min(C,5)、ts_delay(signedpower(C^2),10)、cs_rank 套 ts_min 这类「对 C 的短窗口水平滤波」,没有一个读
    C 与市场收益之间的关系。

    这一位不问「C 有多大」,问「这只票的日收益序列相对大盘日收益(cs_mean(C),全市场当日截面均值)是什么样的」。做法:用 cross_regbeta
    / cross_regalpha / cross_corr / cross_regres 把个股日收益对市场日收益做 120 到 241 日滚动回归,取

    (1) 市场 beta(种子 2、13),(2) 滚动 alpha(种子 3),(3) 与市场的相关(种子 4、14;种子 8、12 对市场滞后一天的相关与回归即反应迟缓
    / 滞后 beta,Hou 与 Moskowitz 2005 的延迟度量),(4) 上涨市与下跌市的 beta 之差(种子 7,Ang、Chen 与 Xing
    2006 的下行风险;种子 13 只回归在市场下跌日的暴露),(5) 去市场后残差的偏度(种子 15,Boyer、Mitton 与 Vorkink 2010
    的特质偏度),(6) 个股自身日收益的偏度 / 自相关(种子 1、5、6),(7) 上涨日均收益减下跌日均收益及上行半方差占比(种子 10、11,Barndorff-Nielsen、Kinnebrock
    与 Shephard 2010 的有符号波动)。

    为什么与已见写法不同:快照里没有任何候选把 C 与 cs_mean(C) 放进 cross_regbeta / cross_regalpha / cross_corr
    / cross_regres,也没有半方差占比 / 滞后 beta(两个库 5583 条的骨架与这些种子的骨架已逐个对照,零重复;ts_kurt 版 骨架撞库已删除)。控制里的
    20 日反转是 C 的 20 日和,vol 是 day_std(Ret),本质是水平量;beta / 相关 / 偏度 / 自相关是无量纲的关系量,先天与 5
    个控制近乎正交,所以不应被新尺子残差掉。

    为什么样本外还会在:A 股散户占比高,低 beta / 低相关 / 对市场反应迟缓 / 正特质偏度是被反复记录的横截面特征(低 beta 异常、彩票偏好),由杠杆约束与博彩偏好驱动,不是某段行情的风格;120
    到 241 日窗口使排名慢变,换手低,15 bp 不会吃掉。方向由尺子在训练段选。

    数学检查:cs_mean 是当日截面均值,全部同日,无前视;cross_* 只回看含当天;cross_regbeta 对市场方差近 0(窗口内市场不动)只在极端窗口出现,这里市场日收益有
    120 日以上的真实波动;种子 11 分母加 1e-6(日收益平方均值量级 1e-4);偏度 / 相关 / 回归不含 ts_rank / cross_rank,不碰
    nanrank_last 停牌返回 0 的问题;没有用 ts_spearman / nt_*;停牌日 C 为 0 或 NaN,窗口内有效点数不足时返回 NaN,已在合成数据上逐个跑通(覆盖率
    0.96 以上,不同值占比 1.0)。

    最可能的失败:beta / 相关与波动、市值控制仍重叠,残差后什么也不剩;或者低 beta 的毛超额在 2018 到 2023 的 A 股里为负、两段分数都在
    -1.5 到 -0.5。'
