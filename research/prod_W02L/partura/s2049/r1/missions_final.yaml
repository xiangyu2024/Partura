- type: N
  inspired_by: B145 的拆解表:day_cov(Volume, Low) 单独 -4.21、20 日回归 F 值 -1.94 ~ -3.49、F
    值外面再套 5 日 ts_min 又变差(H1 -1.94 -> -2.34,H2 -2.07 -> -2.54);F 不带符号,而「价格高处放量还是低处放量」的符号才是这个积木的内容
  hypothesis: '机制。一天里成交量落在价格路径的什么位置,是个股的订单流类型的指纹:成交量随价格抬升而放大(追涨 / 在高处派发),还是在价格低处放大(逢低承接
    / 恐慌割肉)。Llorente–Michaely–Saar–Wang(2002)的结论是:信息不对称大、投机性成交为主的票,放量伴随收益延续;对冲性成交为主的票,放量伴随反转,所以「量与价同向的程度」是个体的稳定属性。A
    股 T+1、个人投资者占比高,追涨的成交一旦买在日内高位当天出不来,这个属性对之后的收益有方向性影响;符号由 train 定。

    B145 的现象:三个 head 的共同积木 day_cov(Volume, Low) = mean(Volume) × (成交量加权价 - 时间加权价);它单日的读数噪声大(单独
    -4.21,valid -3.77),包上 20 ~ 40 日回归 F 值后好很多(-1.94 ~ -3.49),但 F = t² 不带符号,把「方向」丢了;外面再套
    5 日 ts_min 反而变差(H1 -1.94 -> -2.34,H2 -2.07 -> -2.54)。共性表里含 ts_reg_fvalue(day_std(High),
    day_cov(Volume, Low), 20) 的 4 个候选均分 -3.74,不含的 -3.00(p 0.90),所以没有证据说明这个 F 值本身有
    alpha;我的看法是 F 值是个有噪声的、无符号的、短窗口的统计量,值得做的是把「量价同向程度」做成带符号、无量纲、慢聚合的版本,再让 GP 去选最稳的写法。

    算子怎么实现(全部是日内读数的日轴聚合,没有前视)。无量纲化:day_corr(Volume, Low)(分钟轴皮尔逊相关,∈ [-1, 1],价格水平和股数都不进来);或者
    (day_wmean(Low, Volume) - day_mean(Low)) / (day_std(Low) + 0.0001),即成交量加权价与时间加权价之差按当日价格离散度归一(B145
    积木的无量纲版本);或者 day_cov / (day_mean(Volume) × (day_std(Low) + 0.0001))。慢聚合:cross_ema(·,
    60 ~ 120) / cross_mean(·, 241)。种子分六类:

    (1)水平:相关与归一化价差的 60 / 90 / 120 / 241 日聚合(Low、Vwap 两个价格底);

    (2)变化:近 20 日 EMA 减自己 240 日 EMA(相对自己常态的变化);

    (3)与日收益的耦合:cross_regbeta / cross_corr(当日收益, 当日量价相关, 120 / 241),读「涨的日子量价同向是否更强」(追涨的非对称),以及与当日波动的相关;

    (4)B145 自己的回归结构换成带符号、无量纲的响应:ts_reg_tvalue(day_std(High), day_corr(Volume, Low),
    60);

    (5)条件版本:上涨日的平均量价相关减下跌日的平均量价相关(120 日);

    (6)区间位置版本(同一个「钱在价格路径的哪里」,换一种写法):成交量加权 VWAP 在当日 [Low, High] 区间里的位置、收盘价相对当日 VWAP
    的位置(按区间宽度归一,读尾盘是在抬价还是压价)、以及 Chaikin 式的「收盘区间位置按成交量加权」的 120 日累加。

    为什么和库里已有的不同。库里最近的是 cross_mean(day_corr(Ret, Volume), 20):用的是分钟收益(增量)与成交量的相关,窗口
    20 日;本位用的是价格水平(Low / Vwap)与成交量的相关或协方差,度量的是「成交量对价格路径的位置」而不是「成交量对价格变化的响应」(水平相关含日内趋势方向与成交量时间分布的交互,增量相关不含),种子的算子骨架也不同(day_wmean、cross_ema、cross_regbeta
    套相关、区间位置归一):我把 15 个种子的骨架逐个对库里 4077 个骨架核对过,0 个在库里(同样写法的 cross_mean(day_corr(Volume,
    Low), ·) 被骨架禁令拒绝,所以没有放进来)。与 head 的区别:head 是不带符号的 F 值,本位全部带符号。与控制的区别:相关与区间位置是无量纲量,不随市值
    / 成交额水平走;但日内趋势方向进入价差,与 20 日反转 / 波动可能有 0.2 ~ 0.4 的相关,尺子会把线性与非线性暴露去掉。

    为什么样本外还会在。订单流类型(散户追涨 vs 机构承接)是慢变的个股属性,日轴 ≥ 60 日聚合既压低日内噪声,也压低换手,扣 15 bp 后不致命。风险写在这里:这个量有一部分是日内漂移方向
    × 成交量时间分布(开盘放量还是尾盘放量)的混合,尾盘 / 开盘放量的个股差异可能已经被成交额离散度族与流动性控制吃掉;若所有种子都落在 -1 ~ -2,说明水平读数没有信息,下一轮再看符号
    / 条件版本。

    数学检查。(i)day_corr 的分母是 sqrt(var_x·var_y) + 1e-9,价格整天不动(一字板)时为 0(不是 NaN,不是爆点),这些日子在慢均值里相当于「没有耦合」,是定义内的行为;停牌日整天无值为
    NaN,cross_ema / cross_mean 跳过。(ii)归一化价差的分母 day_std(Low) + 0.0001、区间宽度 (day_max(High)
    - day_min(Low)) + 0.0001 都有下限;价格不动的日子分子同样为 0,比值为 0 而不是爆点;区间位置 ∈ [0, 1] 有界。(iii)cross_regbeta(当日收益,
    量价相关, w):响应 ∈ [-1, 1]、回归量是百分比收益,斜率有界(只在窗口内收益方差几乎为 0 的票上可能放大,这类票是停牌 / 长期一字板,会被覆盖率闸门筛掉)。(iv)只用到
    t 日收盘前已知的日内数据。'
