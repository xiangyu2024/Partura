- type: N
  inspired_by: B145 的三个 head 全含 day_cov(Volume, Low)(= mean(Volume) × (成交量加权 Low 均价
    - 等权 Low 均价)),即「一天里的钱成交在价格路径的什么位置」;把它从日内搬到日轴,就是持有人的平均成本相对现价(资本利得悬置)
  hypothesis: '机制。B145 里 9 个候选、3 个 head 的共同积木是 day_cov(Volume, Low)。恒等式:cov(V, L)
    = mean(V) × (Σ V·L / Σ V - mean(L)),即「成交量加权的价格」减「时间加权的价格」,读的是钱成交在价格路径的高处还是低处。拆解表里它单独的分数是
    -4.21(train -4.21 / valid -3.77),比包上 20 日回归 F 值(-1.94 ~ -3.49)差得多,说明单日的这个读数噪声大、符号天天翻;F
    值把它在 20 ~ 40 日上稳定下来,但 F 不带符号,「钱在高处还是低处」这条信息被丢掉了。本位把同一个对象从日内搬到日轴,做成一个慢变的、带符号的量:持有人的平均成本相对现价。

    把过去 w 个交易日的成交量加权均价当作这只票持有人的平均成本(参考价 RP_w = Σ_k V_k × VWAP_k / Σ_k V_k,其中 VWAP_k
    = day_wmean(Vwap, Volume) 是第 k 日的成交量加权均价,V_k = day_sum(Volume)),现价相对它的位置 (P -
    RP_w) / P 就是 Grinblatt–Han(2005)的资本利得悬置(CGO):正 = 平均持有人浮盈,负 = 浮亏。行为机制:处置效应(Shefrin–Statman
    1985)使浮盈的人过早卖、浮亏的人不肯割,卖压 / 惜售把价格拖离它的信息价值,再随悬置消化慢慢回来(Frazzini 2006:对消息的反应不足)。A
    股个人投资者成交占比高、处置效应强,这个机制应该比美股更明显;符号(浮盈多的票之后更好还是更差)我不预设,由 train 定方向。

    算子怎么实现(全部只用 t 日收盘前的数据,没有前视)。日 VWAP = day_wmean(Vwap, Volume);成交量加权参考价 = 分子分母各做一次日轴累加再相除:div(cross_sum(mul(day_wmean(Vwap,
    Volume), day_sum(Volume)), w), cross_sum(day_sum(Volume), w));cross_ema 版本等价于「按半衰期指数衰减的成交量权重」(旧成交量的权重随新成交淡出,近似
    GH 里的换手衰减权重)。种子分五类:

    (1)成交量加权参考价的 CGO,窗口 60 / 120 / 241 日(cross_sum 版)、半衰期 30 / 60 / 120 日(cross_ema
    版,现价用 3 日 EMA 抗单日噪声);

    (2)对照:等权参考价(cross_mean(日 VWAP, 120)),看「成交量加权」本身有没有贡献;

    (3)把参考价拆成「成交量加权减时间加权」:RP_w / TWAP_w - 1,= B145 积木在日轴上的无量纲版本,读的是过去 w 日里钱集中在价格路径的高处还是低处(不含现价,所以与
    20 日反转几乎无关);窗口 120 / 241 日与半衰期 60 日;

    (4)浮盈 / 浮亏拆开:add(x, abs_(x)) = 2·max(x, 0) 只留浮盈部分,sub(x, abs_(x)) = 2·min(x, 0)
    只留浮亏部分,检验两侧是否对称(处置效应预言惜售发生在浮亏侧);

    (5)按成本分布的宽度归一:(P - RP_120) / (近 120 日日 VWAP 的标准差 + 0.001),现价偏离在自己价格波动里占多大;以及现价换成当日
    VWAP(去掉收盘价的尾盘噪声)。

    为什么和库里已有的不同。(a)不是 head 的变体:head 是日内协方差上的 20 ~ 40 日回归 F 值,本位是跨日的成交量加权价格对现价,没有回归、没有
    F。(b)库里没有这类算子:对 struct/members.csv 解析后的 5521 条表达式做算子计数,day_wmean、cross_ema、cross_tail_mean_q25
    出现 0 次;我把 14 个种子的骨架逐个对库里 4077 个骨架(members.csv + libs_train.csv)核对过,0 个在库里,GP 的骨架禁令不会拒绝它们。(c)与
    5 个控制的区别:20 日反转读的是 20 日收益,本位的参考价窗口 ≥ 60 日且按成交量加权(放量日权重大),第 3 类甚至不含现价;市值 / 流动性
    / 波动是水平量,CGO 是无量纲的相对位置;已知成交额离散度族读的是成交额的日内离散,与价格位置无关。

    为什么样本外还会在。来源是行为偏差(处置效应、锚定在成本价)而不是某一段行情的风格;所有种子都是 ≥ 60 日的累加或 EMA,换手低,扣 15 bp 后不致命(本批拆解里外层窗口
    5 -> 10 在 3 个 head 里有 2 个改善 0.18 ~ 0.38,说明这个尺子对慢的东西更友好)。风险也要写在这里:CGO 与中期(3 ~ 8
    个月)动量 / 反转重叠,两个冠军可能已经吃掉;如果 train 与 valid 的符号不一致,分数会被较差的一段卡住。

    数学检查。(i)分母:cross_sum(day_sum(Volume), w) 在整个窗口都停牌时为 0,分子同样为 0,0/0 = NaN,不是爆点;day_close(Close)
    为正的后复权价;「标准差 + 0.001」版本的分母有下限,价格几乎不动的票分子也趋于 0,比值有界。(ii)量级:后复权价(最大数千)× 日成交股数(最大
    1e7 量级)× 241 日累加 ≈ 1e13,float32 范围 3e38 内,cross_ema 在 float64 里算。(iii)缺失:停牌日 day_wmean
    为 NaN(权重和为 0),cross_sum / cross_mean 跳过缺失、cross_ema 重新归一,不填 0;日轴前 w - 1 天用不满的窗口(所有慢表达式共有的热身,不是这个位特有的)。(iv)复权:Vwap、Close
    同为后复权价,在同一个复权基准下比较,除权除息不会造出假的浮盈浮亏。'
