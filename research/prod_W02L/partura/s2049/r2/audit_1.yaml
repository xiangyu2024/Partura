    reasons: '创新 4:核心 C = 成交量加权 241 日参考价减等权 241 日均价(价格单位)。corr_1.json 里核心的原始 max |ρ| 0.196(最像 head 为 ts_mean(day_sum(add(select_where(...Ret 去均值...)))),20)),残差 0.091;五个控制中最大的是 liq 0.239、known 0.232,都不是同一个量。库里没有 day_wmean 加 cross_sum 比值的骨架。注意:同一核心在第 1 轮 N 位(CGO 族)已试过,95 个候选 0 个过线,最好 train -0.14 / valid +0.68(r1/missions_final.yaml 与 r2/loc.json 的 core_cards 第一条),这不影响创新度(尺子结果不是库成员),但 PI 需核对 E 外围是否与那批候选相同;我能看到的只有 core_cards 与 r1 的种子,没能逐个核对全部 120 个存档外围。核心确实在快照共性表里(core_cards 第一条,source enrichment,n_with 8,p 0.0001),满足 E 的核心来源要求。合理 4:机制清楚(Grinblatt-Han 资本利得悬置 / 处置效应的成本位置)。算子逐个核对成立:day_wmean(Vwap, Volume) 是日成交量加权价,cross_sum(mul(dwV, dsumV))/cross_sum(dsumV) 是成交量权重的成本,cross_mean(dwV) 是时间权重,差值即成交量集中在价格路径高位还是低位。数学:cross_sum(day_sum(Volume),241) 在整窗停牌时为 0/0 得 NaN 而非爆点;种子 1 的分母 cross_stddev+0.001、种子 2 与 11 的 +0.0001、种子 10 的 +0.001、种子 12 与 7 的分母是价格比,都没有近零分母。未归一的种子(3、4、5、6、8、9)截面排序混入价格水平,这是量纲问题(PI 已说明),不是数学问题,不挡。种子 6 是两个价格单位量相乘,截面意义需 PI 想清楚,不挡。种子 7 把 CGO 项 (vw/C - 1) 与「现价相对 241 日均价」项 (1 - C/close) 同号相加,两种机制混在一起,复盘时要分开看,不挡。种子 11 划掉:与种子 2 是同一个核心被日收益波动的 120 日均值与 60 日 EMA 两种慢聚合归一,corr_1.json 里两者的 head 与五个控制 |ρ| 几乎相同(head 0.143 对 0.145,liq 0.195 对 0.195,known 0.182 对 0.182,size 0.066 对 0.067),属于重复。核心与五个控制的 |ρ| 为 liq 0.239、vol 0.075、rev 0.014、known 0.232、size 0.048,全部小于 0.8,E 门槛通过。如果它有 alpha,最可能来自:持有人浮盈 / 浮亏的处置效应(惜售与卖压)随参考价偏离慢慢消化;其次是 60 至 241 日的中期价格相对均值效应,这与两个冠军的中期动量可能重叠。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [8]
    reasons: '创新 4:这些种子的字段是 Volume 按分钟涨跌符号拆分后的订单流失衡 imb = (涨分钟量 - 跌分钟量)/(日量+1),快照 head 是 M2 半方差 / 偏度族(select_where(is_gt(Ret,0),...))与 M1 的 F 值族,原始最大 |ρ| 在多数种子上 0.2 至 0.45(种子 1 为 0.364,对 M2 的 ts_mean(day_sum(log(...)),20) 这一 head;种子 5 为 0.453)。残差 |ρ| 最大 0.28(种子 3)。控制:种子 9 cross_regbeta 的 liq 与 known 都是 0.447、vol 0.566;种子 5 的 vol 0.49;种子 7 的 vol 0.46,属中度,不划。种子 8 cross_ema(day_wmean(up 收益,Volume) - day_wmean(down 收益,Volume), 60) 与快照 head ts_mean(day_sum(log(...)),20) 的原始 |ρ| 为 0.700(corr_1.json 数值即 0.7),达到 GP 库禁令与自动划掉的 0.7 门槛,划去;它本质上是 M2 族的成交量加权版本。合理 4:机制清楚,Chordia-Subrahmanyam 订单失衡自相关(机构分批建仓或派发持续同号,慢聚合保留持续成分)。算子逐个核对成立:select_where(is_gt(Ret,0), Volume, 0) 取涨分钟量,day_sum 聚合到日,div 归一;分母 +1 在股数单位下可忽略;imb 有界于 [-1,1]。数学:停牌日 imb 为 0 而非 NaN(分子分母都是 0 填充),是定义内的填充;长期停牌票的慢 EMA 会向 0 回归,影响面有限,记为风险不挡。种子 9 cross_regbeta(day_sum(Ret), imb, 120) 的分母是 imb 的 120 日方差且无下限,方差近零的票可能爆点,需 PI 在 train 上查分布,但 corr_1 未显示它主导截面,不挡。种子 14 的 cross_ema(cov(Ret,Vol)/(std(Ret)*mean(Vol)+0.0001), 90) 由 Cauchy-Schwarz 有界于成交量变异系数之内,无爆点。种子 1、2、3 是同一 imb 的窗口变体(60 EMA、241 均值、120 EMA),窗口不同且 head 与控制 |ρ| 有差异,不视为重复。如果它有 alpha,最可能来自:机构 / 北向 / 游资的建仓周期以周到月计,订单流失衡持续同号、价格慢慢消化;但更可能的是它吸收了日内收益路径(涨分钟量占比与日收益同号),最终会退化为中期动量,与两个冠军或 M2 族重叠。'
