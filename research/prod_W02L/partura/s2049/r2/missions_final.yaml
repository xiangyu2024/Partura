    2004 的订单失衡自相关:失衡持续多日,价格慢慢消化),散户噪声交易失衡来回翻。慢聚合把单日噪声压低,保留持续建仓的个股属性。另有成交量加权收益 - 等权收益(价格冲击:放量分钟是推涨还是推跌)、上涨
    / 下跌分钟成交量加权收益之差、与日收益的耦合(失衡是否只在涨日出现)、失衡的变化量(近期 vs 一年常态)。

    算子:select_where(is_gt(Ret,0), Volume, 0) 取涨分钟成交量,day_sum 日内累加,div 归一;day_wmean(Ret,
    Volume) 为成交量加权收益;cross_ema / cross_mean / cross_regbeta / cross_corr 做日轴聚合,全部只用
