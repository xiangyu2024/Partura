    reasons: '创新 4:核心 C(成交量加权 241 日参考价减等权 241 日均价,再除以价格水平)在 corr_1.json 里对 9 个 head 的原始 max |ρ| 为 0.23(最像的是 cross_mean(div(day_std(select_where(is_lt(...))),day_std(Ret)),20)),残差 0.097;对 5 个控制 liq 0.239、vol 0.075、rev 0.014、known 0.232、size 0.048,全部远低于 0.8,E 门槛通过。外围与 r1、r2 的 missions 及 audit 记录中的种子逐字比对,没有完全相同的串。注意:该核心在 r1 的 N 位已试过(含核心的候选 0 个过线),r2 的 E 位用过 12 个外围;本轮是它的第 2 个也是最后一个 E 位,符合至多 2 个的上限。核心来源我没有重核:按说明不读共性表,只依据 r2 审计记录「核心在快照共性表里」,这一条需要 PI 自己保证。合理 4:机制清楚(处置效应 / 持有成本位置,Grinblatt-Han 型资本利得悬置)。逐个算子核对:day_wmean(Vwap,Volume) 是日成交量加权价;cross_sum(mul(...,day_sum(Volume)),241)/cross_sum(day_sum(Volume),241) 是成交量权重的 241 日成本;cross_mean(day_wmean(...),241) 是时间等权;差值为成交集中在价格路径高位还是低位。除以 cross_mean(day_close,241)+0.0001 把价格单位变成相对偏离,分母不近零。cs_bucket_zscore / cs_bucket_demean / cs_bucket_rank 在每个十分位内至少 2 只才输出(ops_ext.py 第 463 行起),定义成立。cs_flip_by_state 的状态是截面均值的 241 日 trailing 百分位(_trailing_rank 含当天、不含未来),无前视,不触发 §4。种子 1(未除价格)与种子 2(除价格)的截面次序不同,corr 数字差别大,不算重复。种子 12 划掉:cs_winsor(cs_bucket_demean(X/价格,LogFloatCap)) 与种子 2 的 cs_bucket_zscore(X/价格,LogFloatCap) 只差按十分位标准差的缩放加截尾,corr_1.json 中对 head 的原始 |ρ| 为 0.225 对 0.229、残差 0.174 对 0.173,liq 0.195 对 0.201,known 0.208 对 0.214,属于同一信号的换皮。种子 13 的 BoardCode 是 0 至 3 的类别码(dailyfields.py 第 68 行起),按编码排序的十分位只能近似地把四类板块分开,可能合并或留空,需要 PI 核对分组;这不是数学错误,且残差与控制的 |ρ| 仍在 0.8 以下,不挡。如果它有 alpha,最可能来自:持有人的浮盈浮亏(处置效应)随参考价偏离慢慢消化;同类内比较(同市值 / 同波动 / 同上市年限)去掉了整体的规模和板块差异后,若仍有超额,就是成本位置本身的截面信息。'
