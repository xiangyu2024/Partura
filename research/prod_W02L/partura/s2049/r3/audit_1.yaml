    reasons: '创新 4:N 位读的是成交量加权的分钟收益波动 day_wstd(Ret,Volume) 与等权波动 day_std(Ret) 之比,即收益二阶矩在成交量时间轴上的分配。corr_1.json 中对 9 个 head 的原始 |ρ| 在 0.14 至 0.54 之间(最高为种子 4 对 M3 的 cross_mean(div(day_std(select_where(is_lt(...))),day_std(Ret)),20));对 5 个控制,b1、b2、b11 对 size 为 0.6,是这一族的已知共线方向,但不是同一个量;其余种子对 vol 等控制多在 0.4 以下。库里 B146 / B147 的半方差族都是等权分钟矩,这里是加权版本,这是新的地方。种子 4(上行量加权半波动 / 总量加权波动)是 B147 族的加权版,原始 |ρ| 0.54 低于 0.7 门槛,不划,但创新性主要在加权上。合理 4:机制清楚(放量分钟的价格发现型波动 vs 薄成交分钟的买卖价差跳动,Easley 与 OHara 的知情交易思路)。算子逐个核对:day_wstd、day_topw_mean(ops_ext.py 第 621、635 行)与文档一致;分母加 0.0001 相对分钟收益量级 1e-3 是合理下限;day_es_ratio_lo / hi(第 665、676 行)都是尾部均值除以分位数,lo 的分位为负,比值为正,相减后是尾部形状的不对称,符号处理正确。数学风险记录(不挡,需 PI 核对):(1)day_es_ratio_* 只在分位绝对值小于 1e-8 时输出 NaN;低活跃票的 5% 分位可能落在 0 与 -1e-3 之间的插值点上,绝对值约 1e-5,比值会爆到几十上百,而种子 6(cross_mean 在 120 日上取日度原始值的均值)未经截面排序就平均,会被少数几天支配。这属于 §4 的数值伪影类,应在 train 上查分位绝对值的分布;若成立,种子 6 与 7 应先截面排序再平均。(2)select_where 把非选中分钟填 0 后再算 std,上行 / 下行的 std 掺入大量 0 值,这是 B147 族既有的定义,沿用,不挡。种子 2 划掉:cross_mean(day_wstd(Ret,Volume)/(day_std(Ret)+0.0001),241) 与种子 1 的 cross_ema(同一个 X,120) 只差慢聚合方式,corr_1.json 对 head 与控制的数字差 0.01 至 0.04,残差 0.434 对 0.396,属于度量同一个东西的重复。种子 11 同样共享 X,只乘了 day_wstd(Ret,Amt)/day_wstd(Ret,Volume) 这个因子;两者的截面次序在分钟价格变化内差别有限,是否重复 PI 应在 train 上看 rank 相关,这里不挡。种子 3(差而非比)对 vol 控制 |ρ| 为 0.556,更像一个波动水平代理,PI 需留意,不挡。如果它有 alpha,最可能来自:放量分钟的波动占比反映的是知情或机构分批的价格发现,慢变、结构性(做市深度、散户占比),因此可能是持续的截面溢价;更可能的情形是它退化为成交量与波动的同步度(volume-volatility coupling),与流动性控制或 B147 族重叠。'
