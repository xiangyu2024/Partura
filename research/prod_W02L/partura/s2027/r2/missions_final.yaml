  hypothesis: 机制:Llorente-Michaely-Saar-Wang(2002)指出放量时的收益延续与否取决于交易是信息驱动还是流动性驱动:信息驱动的放量,价格变动在后续继续;流动性驱动的放量,价格会回吐。B080
    的 head 读的是放量 10% 分钟里收益的『离散度』(日内,除以绝对均值),它们在新尺子下全为负(−2.7~−3.0)。离散度把方向吃掉了:同样是放量分钟,同向大涨和大跌被当成一回事。本任务读的是方向和量价协同本身:(a)
    放量分钟(Volume 最大的 1/10、1/5、1/20)的带符号收益均值/总和,再取 20~60 日慢均值或截面标准化后慢 EMA(第 1 轮显示慢状态承重,快读数是噪声);(b)
    放量减缩量分钟的收益差(把 Volume 乘 −1 取最小量分钟),去掉全日方向;(c) 带符号的放量方向纯度 sum(Ret)/sum(|Ret|);(d)
    分钟尺度量价的同期、量领先收益、收益领先量三种相关(库里只有 |Ret| 与 Volume 的相关族,没有带符号版和 lead-lag 版);(e) 收益大的分钟里的成交量(信息冲击处的量能)。算子怎样实现:in_topk_masked(x,
    y, p) 按 x 排名返回 y 在 x 最大 1/p 位置上的值,其余为缺失,day_mean 在有效值上取平均;mul(Volume, -1) 取最小量分钟;day_corr
    在 11..240 的分钟上算皮尔逊相关,lead-lag 靠两个错位切片(长度相同)实现。与库的区别:库里有 day_std(topk) 的离散度及其比值(B080),有
    day_last/day_first(topk) 的比值,有 |Ret| 与 Volume 的 day_corr;没有放量分钟的带符号均值、放缩量之差、带符号的量价相关。这些是不同的数学对象,而不是离散度的换写。为什么样本外还会在:A
    股散户占比高,放量时的方向对应关注度冲击(Barber-Odean 2008 的关注度驱动买入)后短期过度反应、之后回吐,方向跟量的组合是行为机制而不是样本拟合;慢均值把单日噪声去掉,与第
    1 轮得到的『慢者好』一致;这些量对波动 / 流动性控制的线性与非线性暴露已被尺子去掉,剩下的是方向信息。风险:A 股涨跌停会让放量分钟的收益被截断,放量收益与
    20 日反转可能重叠。
