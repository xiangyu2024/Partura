- type: N
  hypothesis: 机制:把「对上市天数(时间)的滚动回归」当作一个通用的『趋势显著性 / 斜率 / 相关』算子,作用在微观结构状态量上,读的是状态量近 60~250
    日是否在系统性地变坏或变好,而不是状态量的水平或离散度。库里的 4206+1392 条在 cross_reg_fvalue(ListAge, 僵价占比) 这种
    F 值上有一批嵌套写法(第 2 轮最好 valid +0.11),但没有 t 值(带符号:趋势方向,F 值把方向丢了)、没有斜率(量纲化趋势)、没有时间相关、没有换成别的状态量(波动、成交量集中度、非线性流动性、收盘价僵价)的版本,也没有
    250 日对 60 日的趋势差(趋势的变化)。算子实现:cross_reg_tvalue(ListAge, y, 60) = 对 y 做 y ~ α + β·ListAge
    的 60 日滚动回归的 t 值,符号 = 趋势方向;cross_regbeta 给斜率;cross_corr(ListAge, y, 60) 给秩无关的趋势相关;cross_reg_tvalue(僵价占比,
    非流动性, 60) 把自变量换成僵价占比,读的是非流动性对僵价的敏感度。与库的区别:F 值是 t 值的平方,丢了符号,而『变坏』与『变好』对未来收益方向相反,t
    值与斜率保留了这个方向;这是不同的数学对象,不是 F 的换写。为什么样本外还会在:状态量的方向性趋势代表流动性 / 关注度的再配置(Amihud 流动性溢价的时间变化、被遗忘的票的低关注度溢价),A
    股散户关注度与僵价的慢变化是持续的行为特征;趋势类读数是 60 日以上的慢变量,低换手,适合扣 15bp 后的纯多头。尺子去掉对流动性、波动的线性 / 非线性暴露,剩下方向。风险:时间回归对共同的上市年龄效应(新股)敏感,新股僵价与普遍规律相反;t
    值有 1/√60 级别的抽样噪声。
