slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '核心 K = ts_cov(inv(day_quantile_q25(Volume)), cross_reg_fvalue(ListAge, day_flat_run_max(Open), 60), 30) 来源合规:它是 loc.md 共性表第 1 条(富集 +1.68),但只有 4 个候选含 K,样本很薄。K 对快照 9 个 head 的原始 |ρ| 最大 0.026、残差最大 0.046;对 liq 0.007、vol 0.000、rev 0.002、known 0.005、size 0.027,全部 <0.8,E 条件通过。16 个外围全部原样含 K;与 loc.md 列出的含 K 候选(Amt 版与 Open 版的嵌套式)逐条比对,没有完全相同的外围。自动划掉:无(原始 |ρ| 最大 0.49 为 seed 7 对 day_mean(Volume),对控制最大 0.53 为 seed 7 对 size,都未到 0.7 / 0.8);无重复种子。逐个看:外围全部是 K 的单调 / 平滑 / 标准化 / 截面残差 / 滚动斜率与相关变换,彼此不是同一对象。算子核对:cross_ema 因果、按半衰期、跳过缺失;cross_zscore 有 sd 下限守卫;cs_regres 为截面线性残差;cross_regbeta(K, day_mean(Ret), 120) 是 y 对 K 的时间轴 OLS 斜率,与写法一致;无前视。风险记录但不挡:K 的原始覆盖率只有 0.886(流水线 gate 不过),根源是 inv(q25 Volume) 的零或缺失分母;经 cross_ema / ts_mean / ts_decay_linear 等平滑的变体覆盖回到 0.94 以上(seed 1 到 4、13 到 16),seed 5、6 这类未平滑的变体承袭了这 11% 缺口,但缺口集中在停牌与薄票日,并未主导结果,保留。seed 6 除以 ts_stddev(K,60) + 1e-6 是绝对下限,若 K 的日尺度接近 1e-6 会退化成 K 的缩放而不是标准化,PI 须先看 K 的量级。seed 7 的 cs_bucket_rank 以 LogFloatShares 分组,但对 LogFloatCap 的 |ρ| 仍为 0.53,说明按股数分组没有去掉价格 / 市值暴露(inv(Volume) 随价格变化)。seed 8 的 BoardCode 不是板块分组,是十分位切分加列序打破(§4 允许列序),假设文字里的板块内排名不成立,应改写为板块分组或删去「板块」字样。创新度 3:K 与所有 head 的 |ρ| 都低,对象本身不在 head 里;但 K 的 Amt 版已作为库候选存在(loc.md 第 123 到 127 行),Open 版只换了价量字段,外围是变换层而不是新对象,所以不给 4。合理度 4:机制(僵价趋势与非流动性的慢联动,关注度与流动性供给的慢变量)说得通,算子实现与描述一致。如果它有 alpha,最可能来自冷门股的慢状态切换,即僵价趋势与非流动性同向变化的票在慢速修正中的收益差。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [2, 7, 9, 11]
    reasons: 'N 位的对象是状态量的时间趋势读数(t 值、斜率、相关)。对 heads 的原始 |ρ| 最大 0.19(seed 12),对控制最大 0.35(seed 6 对 vol),在阈值内。逐个看:(一)划掉 seed 2、9、11,理由是数学问题(§4 数值伪影 / 定义坏掉)。inv(day_quantile_q25(Volume)) 在日内成交量 q25 为 0 时得到 inf,缺失时得到 NaN。rolling_ols 的有效掩码只剔除 NaN(AlphaCube-steering 的 common.py 里 valid = ~(isnan(wx) | isnan(wy))),inf 会直接进入 var_x 与 cov,使整个 60 或 120 日窗口的斜率或 t 值被这一天的爆点支配,或变成 NaN。流水线覆盖率为 0.842、0.841、0.780,而同窗口的 ListAge 系列是 0.999,缺口集中在最薄的票上,符合 §4 的除以近零量、系统性算不出。这一点的根源 inv(q25 Volume) 与核心 K 相同,但 K 经 EMA 填补(见 slot a),所以 slot a 不划。(二)划掉 seed 7,理由是重复:cross_corr(ListAge, day_flat_run_max(Open), 60) 与 cross_reg_tvalue(ListAge, 同一 y, 60) 是同一窗口同一对象,满足 t = r·sqrt(n-2)/sqrt(1-r²),截面秩几乎相同(只差窗口内有效天数的不同),是 seed 8 第一项那个 t 值的换写,不加新信息。(三)保留的 seed 1、3、4、5、6、8、10、12:seed 1 是 flat-Close 的 t 值;seed 3 是带符号斜率,与 F 值相比保留了方向,假设对 F 丢符号的判断成立;seed 4、5、10 是 F 值(等于 t 的平方,只保留 |t| 排序),读的是 vol、gini、僵价对 std 的趋势强度,状态量与库里 F 族不同;seed 8 是 60 日与 250 日趋势之差,250 日窗口对次新股只有短样本,差异中有部分是热身期效应,PI 应看 ListAge 大于 250 的子样本;seed 12 的 Amt 相等几乎全是无成交分钟(0 等于 0),读的是无成交连续段,与流动性控制 |ρ| 约 0.29 到 0.30,可以保留但需注明。(四)共同风险,§4 不算问题,记录:ListAge 对新股的 IPO 涨跌停段敏感,次新股的僵价趋势可能与普遍规律相反。创新度 4:对象是带符号的状态量趋势,库里只有 F 值的 |t| 版本,符号是实质新信息;不给 5 是因为 seed 4、5、10 只是 |t| 版本换了状态量。合理度 4:机制说得通(状态量趋势的方向性再配置,对应 Amihud 流动性溢价的时间变化与被遗忘票的低关注溢价),算子实现与描述一致;被划掉的三个属于数值项,不是机制问题。如果它有 alpha,最可能来自状态量(僵价 / 波动 / 成交集中度)的趋势方向,即流动性溢价的时间变化。'
