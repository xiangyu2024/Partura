- type: N
  hypothesis: |-
    机制:B079 的三条 head 读的是分钟收益序列相关的「幅度」(Ljung-Box Q 的标准差),这个量对符号、滞后位置、日内时段、成交状态一律不分,并且在两处有损:
    (a) 符号被平方吃掉。负的序列相关(买卖价差反弹、价格压力、做市商库存调整)是流动性需求方付出、供给方赚取的暂时价格冲击;正的序列相关(分钟收益持续同向)是机构母单被拆成子单、信息缓慢扩散。两者对未来收益的含义相反(Roll 1984;Campbell-Grossman-Wang 1993:收益序列相关对成交量的依赖,在于交易是流动性驱动还是信息驱动),Q 把它们加在一起。
    (b) 尺度耦合。AlphaCube 自相关核的分母是 sqrt(var_t·var_{t−k} + 1e-8),这里的 var 是 220 个分钟收益的平方和:分钟波动 0.05% 的票 var ≈ 5.5e-5、乘积约 3e-9,1e-8 把 ρ 压到约一半;波动 0.15% 以上才基本不受影响。所以 head 在低波动票上同时读到了波动水平。把 Ret 乘 100 之后分母项远大于 1e-8,耦合消失,读到的才是纯序列相关。

    库里已有的相关内容:手写库自带的 train 统计(不去控制)里,ts_mean / ts_stddev(day_autocorr(Ret, 1), 15) 的净夏普是 +1.77 / +0.99,day_ar1_coefficient 版 +1.56 / +0.79,day_durbin_watson 版 +1.55 / +0.72。第 0 步全库(5583 条)的新尺子分数中位 −2.44,没有一条能当 head,Q 同族去掉 5 个控制与两个冠军后是 −1.3 ~ −1.9。我据此推断 lag-1 这一块已经被控制和冠军吃掉(推断,没有它们各自的新尺子分数)。所以本位的种子避开 lag-1 的有符号自相关(只在差分里当参照),去读库里没有的东西。库里 day_autocorr 的 26 处全是 lag 1;in_sum_rolling 只出现 5 次、没有一条是方差比;对 Ret 的 in_slice 只有 (11, 230) 这类整段,没有 (11, 60)、(190, 230)、(121, 230)、(15, 230)、(25, 230) 这些起止点。
      A 组(4 个):Ret×100 后 lag 3、lag 5、lag 2-5 之和、lag 5 减 lag 1 的有符号自相关,取 40-60 天半衰期的 cross_ema。lag 2-5(2-5 分钟)是母单拆分的时间尺度,lag 1 主要是价差反弹,两者之差分开「拆单持续」与「价差反弹」。
      B 组(3 个):多尺度方差比 VR(q) = var(q 分钟收益之和) / (q·var(1 分钟收益))(Lo-MacKinlay 1988),q = 5、15,以及 VR(5) 的截面名次再 EMA。VR > 1 是持续、< 1 是反弹;不依赖 ρ 的估计,也不含 1e-8 项。
      C 组(2 个):sign(Ret) 的 lag 2 / lag 5 自相关。符号序列有界、不受大跳影响,只读方向的持续性(零收益分钟记 0),不随价位离散的量纲变化。
      D 组(4 个):同一件事换到更粗的尺度或另一个时段:日内收益的 120 日 1 日自相关(cross_autocorr(day_sum(Ret), 120, 1)),首小时(09:41-10:30)收益与尾盘(14:10-14:50)收益的 120 日滚动相关,上午与下午收益的 120 日相关,以及「首小时 lag-1 自相关减下午 lag-1 自相关」的 EMA。读的是日内动量 / 反转在这只股票上是否稳定(时段异质:开盘由隔夜信息驱动,午后由库存与再平衡驱动)。
      E 组(2 个):同一个 Q,但在 Ret×100 上(去掉尺度耦合)与在 |Ret|×100 上(绝对收益的序列相关 = 波动聚集 / 信息到达的持续性),都取 60 天半衰期的 cross_ema。回答「head 里的东西是序列相关本身,还是波动水平」。
      F 组(1 个):幅度加权的 lag-3 自相关减去只看符号的 lag-3 自相关:大幅度的分钟收益相对于「只看方向」是更持续还是更反弹,读机构 / 噪声之分。

    为什么样本外还会在:来源是交易者构成、报价机制、拆单习惯这类慢变量,不依赖某段行情;全部是 40-120 日量级的因果平滑,换手低(这是同批拆解里已经看到的最大杠杆:窗口越长越好);无前视(所有分钟统计只用 t 日 09:41-14:50,窗口尾随,t 日收盘后算、t+1 交易)。
    数学检查:ρ、VR 均为有界量或非负的方差比;VR 分母是 q·var(1 分钟收益)(方差,≥ 0),全日价格不动的票分母为 0 时 0/0 得到缺失,不会爆点;所有自相关作用在 Ret×100 或 sign(Ret) 上,不含 1e-8 项主导;cross_corr / cross_autocorr 是 120 日窗口内的相关系数,有界。合成立方体上 16 个种子全部能算、无 inf、日度离散度接近 1。
    预期:新内容不等于新 alpha。最好分数我预期在 −1.2 ~ −0.2,出 head 的概率约 5%;最可能成功的是 B 组与 D 组(库里没有、与冠军和控制的重叠最小),A 组与 E 组更可能被波动与流动性吃掉。
