  hypothesis: |-
    机制:核心是 B079(手写库,10 条)的 Ljung-Box Q 统计量标准差:day_q_stat_std(in_slice(Ret, 11, 230), 10) 对 09:41-14:50 的分钟收益(避开开盘 10 分钟与尾盘 10 分钟的集合竞价段),算滞后 1..10 的累计 Q_m = T(T+2)·Σρ_k²/(T−k),再取这 10 个累计值的标准差(与已知族 rho_known −0.04)。它读的是「分钟收益序列相关的幅度,偏重 lag ≥ 2 的累计部分」,是价格离散(tick / 价格)、订单拆分、做市报价行为在分钟尺度上的一张指纹。

    已有的读数(只用 train / valid):核心裸用 −3.63;外套 ts_stddev(·, 15) 为 −1.47,窗口 7 → 15 → 30 为 −2.16 → −1.47 → −1.34;三个 head 全是 ts_stddev 包 Q 这一条链(Q5 / Q10 / Q20 同形)。裸值最差、窗口越长越好,说明承重的是 Q 的慢状态而不是每日读数:一天 220 个分钟收益估出的 Q 本身有不小的抽样噪声(白噪声下 Q 的累计路径标准差就是一个约 3 的随机量,真实的序列相关只在上面加一点),日度读数在截面上每天洗一次牌,15 bp 的成本全吃在换手上。

    这一位只在核心外面改外围,全部不是库里已有的写法(库里围绕 Q 只有 ts_mean / ts_stddev / ts_quantile_q75 及其嵌套、ts_sum、ts_var、ts_argmax、ts_scale、cross_med;这类骨架已被禁。下面 16 个种子的骨架我用库的 skeleton_key 逐个对过,没有一个在库的 5583 条里):
    (1) 先截面排名再做时间聚合(cs_rank 再 cross_ema / cross_stddev / ts_decay_linear)。Q 的绝对量级随个股的分钟波动与价位异质,原值直接做时间平均时,水平被少数高 Q 个股和少数爆发日支配;先取当日截面名次,读到的是「这只票相对同日同行的序列相关位置」,慢平均后是稳定的类型而不是噪声。cross_stddev(cs_rank(Q), 60) 读「类型漂移」:原 head 的 ts_stddev 把水平和波动混在一起(原值的标准差随水平放大),排名之后水平被抹掉,只留位置的不稳定性。
    (2) 水平的动态:快慢 EMA 之差(10 对 60 天半衰期)、慢 EMA 的 60 日变化、名次的 5 日对 120 日之差、cross_zscore(对自己历史的异常度)再 EMA。读的是「相对自己的常态,序列相关结构正在变强还是变弱」,是参与者构成(机构拆单 / 散户 / 做市)变化的慢变量,与水平因子相对正交。
    (3) 形状与共动:60 日偏度、下行半标准差、上四分位尾均值(cross_tail_mean_q75)、Q 序列自身的 1 日自相关、变异系数 stddev / mean、Q 与同日分钟波动 day_std 的 60 日相关、Q 与同日零收益分钟占比 day_zero_ratio 的 60 日相关。区分「持续偏高」「偶发爆发」「随波动同步」「由 tick 冻结 / 封板驱动」四种来源:持续型(机构切单)更可能带信息,偶发型与冻结型是噪声或封板。
    (4) 去掉 Q 与自身波动的耦合:Q 的水平与个股的分钟波动水平有关(自相关核分母含 1e-8,低波动票的 ρ 被压低,N 位会细说);控制里的波动会在截面上去掉这一块,但在时间序列上它仍然在。cross_regres(day_std, Q, 60) 把每只票的 Q 对它自己的分钟波动做 60 日滚动回归,取今天的残差再 EMA;cross_regbeta(day_std, Q, 120) 读 Q 对波动的敏感度。留下的是「相对自己的波动,序列相关偏多 / 偏少」。

    为什么和库里已有的不同:库里没有 cross_ema、没有 cs_rank 前置于 Q、没有 cross_zscore / cross_corr / cross_autocorr / cross_regres / cross_regbeta / ts_skew / 尾均值 / 半标准差作用在 Ret 的 Q 上,也没有 Q 的动态(差、变化、相对自身)。ts_stddev(·, 15) 读的是 15 日内水平的波动,这里读的是排名位置、动态、形状与回归残差,预期和 head 的日度秩相关在 0.3-0.6 之间,不是换写法。
    为什么样本外还会在:来源是交易者构成与价位结构这类慢变量,2018-2025 年的分钟微观结构制度基本不变;所有窗口都是 60-120 日的因果窗口(cross_ema 是半衰期 d 天的指数加权,其余是尾随窗口),换手低;t 日的值只用 t 日及以前的分钟与日,没有前视(回归残差只用窗口内含 t 日的样本)。
    数学检查:Q 与 ρ 是有界量,无近零分母;唯一的除法(变异系数)分母加了 1e-6,Q ≥ 0 且 60 日均值几乎不会为 0;cs_rank 每日在截面内排名,缺失保持缺失;窗口未满的开头段与库里其它慢因子一样偏噪,但不是缺失填充主导。我用 80 只 × 320 日 × 241 分钟的合成立方体把 16 个种子都算过:全部能算、无 inf、日度离散度接近 1(只有 Q 与零收益占比的相关一条在合成数据里因为没有零收益分钟而退化,真实数据里流动性好的票零收益分钟占 20%-50%)。
    预期:这条链的水平因子已被控制和冠军吃掉,所以这一位多半只把最好分数从 −1.3 推到 −1 ~ −0.4,出 head 的概率约 2%。
