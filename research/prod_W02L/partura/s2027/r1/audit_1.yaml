attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [10, 13]
    reasons: '核心 day_q_stat_std(in_slice(Ret,11,230),10) 是 head ts_stddev(Q10,15) 的子树。相关度表(corr_1.md):核心对 head 原始 |ρ| 0.16、残差 0.24;对 liq 0.03、vol 0.13、rev 0.06、known 0.04、size 0.04,都 <0.8,E 条件通过。16 条外围都原样含核心(已逐条核对)。创新度 3:外围是同一条 Q10 日序列的不同汇总(截面名次后的慢 EMA、变异系数、偏度、尾均值、自相关、Q 的 EMA 差与 z 分数、对 day_std 的回归斜率与残差),与三个 head 的原始 |ρ| 在 0.02–0.56 之间,不是换写法,所以不压到 2;但读的仍是同一个统计量,所以不给 4。库内 members.csv 里 cross_ema、cross_semistd_neg、cs_rank 套在 day_q_stat_std 上的都是 0 条,形式确实新,只是对象已饱和(day_q_stat_std 在库里 291 条)。划掉 10(数学问题):cross_semistd_neg 取 log(Q_t/Q_{t-1}),_semistd 只 clamp 到 1e-30、没有下限。Q 由 ρ² 累加,ρ 的分母是 sqrt(var_t·var_k+1e-8),方差低于约 1e-4(分钟波动低于约 0.07%)时 ρ 近似正比于方差、Q 近似正比于方差²;分钟波动 0.03% 的日子 Q 约为 0.1% 日子的 5%,log 约 −3、平方约 9,远大于常态的日间对数变动,semistd 由这些跳主导。这是 §4 除以近零量的数值伪影。划掉 13(重复):ts_decay_linear(cs_rank(Q10),90) 与种子 1 cross_ema(cs_rank(Q10),30) 是同一截面名次序列的慢平均,只换核;两者对 head 的最像项都是 Q5(0.38 与 0.37),五个控制与残差几乎一致(liq 0.11/0.12、vol 0.49/0.48、known 0.14/0.14、size 0.22/0.20、残差 0.26/0.25),属重复。其余 14 条放行。数学核过:种子 3 的 CV 分母 mean(Q)+1e-6,Q 非负,CV 约 ≤√60,无爆点;种子 5 的 cross_zscore 有界;种子 14 的 cross_regbeta(day_std,Q,120) 斜率分母是 day_std 的 120 日方差(需大于 EPS 1e-9),日内波动几乎不变的票会放大,但下游按截面排名,影响有限,不划。种子 4、5、8 同属 Q 水平动态的一簇,互不重复,保留。如果它有 alpha,最可能来自:截面名次化后去掉 Q 的水平、只留位置的慢变化;或 Q 对 day_std 回归后的残差(去掉 1e-8 耦合后的序列相关结构变化)。不是来自 Q 的水平本身。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [7]
    reasons: '16 条分六组(A 有符号滞后 3、5、2–5 之和、5 减 1;B 方差比 VR5、VR15、cs_rank(VR5);C 符号序列自相关 2、5;D 日内时段 4 条;E 去耦合的 Q(Ret×100、|Ret|×100);F 幅度减符号)。新意经 members.csv 核实:day_autocorr 的 26 处全是 lag 1,没有 sign(...) 上的 day_autocorr,也没有方差比形式 day_var(in_slice(in_sum_rolling(...))) 的条目。三个 head 全是 Q,Q 由 ρ² 累加、丢符号,所以有符号的 ρ_k 与方差比是 Q 没有的信息。相关度表:除种子 14(0.39,是 Q 的水平)外,全部种子对三个 head 的原始 |ρ| ≤0.18。创新度 4 不给 5:VR(q) 近似为 1+2Σ(1−k/q)ρ_k,与 A 组同源;种子 5、6 与 liq 0.39–0.43、known 0.35–0.38 偏相关;种子 3 与 size 0.59(高于 0.5 的参考线)。数学核过:Ret×100 后 day_autocorr 分母 sqrt(var·var+1e-8) 的方差是 10^2 量级,远离下限(种子 1–4、13、16);sign 序列的方差也是 10^2 量级,不受下限影响(8、9);VR 分子分母同为方差,尺度相消,不爆点(5–7);种子 10–12 的 cross_corr / cross_autocorr 的 EPS 1e-9 远小于 50–110 分钟日和的方差(约 10^-5);day_sum 在全停牌日返回 NaN(_sum 用 isfinite 判),没有补零;所有窗口都在 t 日 14:50 之前,rolling_windows 因果,无前视。两个小问题不影响结果:VR 的滚动和从第 11 分钟起算而分母样本从第 15 或 25 分钟起,样本略不一致;种子 11 的「首小时」实为 09:41–10:30 的 50 分钟。划掉 7(重复):cs_rank(VR5) 的 EMA60 与种子 5 的 VR5 EMA40 对三个 head 的 |ρ|(0.06 对 0.08)与五个控制的 |ρ|(liq 0.40 对 0.39、known 0.35 对 0.35、vol 0.02 对 0.03、size 0.03 对 0.04)几乎相同,是同一信号换截面名次与半衰期,属重复。其余 15 条放行。如果它有 alpha,最可能来自:有符号的日内收益结构(lag 2–5 的拆单持续对 lag 1 的价差反弹;方差比 >1 为持续、<1 为反弹),或上午与下午、首尾时段收益的 120 日相关的股票特异性(日内动量在个股间的差异),而不是 Q 的波动水平。'
R:
  - head: 'ts_stddev(day_q_stat_std(in_slice(Ret, 11, 230)), 15)'
    soundness: 4
    reasons: 'head 为 ts_stddev(Q20,15)(score −1.34,HL 5)。变体:窗口 45/60/90/120、cs_rank 前置、Ret×100 各一类。窗口的诊断有 ablation 数据支撑:7→15→30 的 score 为 −1.98→−1.34→−1.30,但 score 取 min(train,valid),30 日版的 valid 从 −0.83 退到 −1.19,收益几乎全来自 train,不指望延伸到 45–120 日能过 0.1 的门槛。数学无问题:Q 非负,ts_stddev 有界。Ret×100 最有依据:它消掉 ρ 分母里 1e-8 下限对低波动票的压低(220 分钟方差约 5e-5 时 ρ 只剩约一半),修的是 head 的真实定义缺陷;cs_rank 前置去掉水平、只留名次。两点注记不影响合理度:cs_rank 前置与 Ret×100 是插入节点,不是 §2 字面的「去掉或替换部件」,下一轮归类时需注意;120 日热身占 train 约 8%,不构成主导。如果它有 alpha,最可能来自 Q 的慢状态(分钟序列相关结构的稳定性),而非 15 日的噪声水平。'
  - head: 'ts_stddev(day_q_stat_std(in_slice(Ret, 11, 230), 10), 15)'
    soundness: 4
    reasons: 'head 为 ts_stddev(Q10,15)(score −1.47)。窗口 7→15→30 为 −2.16→−1.47→−1.34,train 与 valid 同向变好(valid −0.95→−0.78),比 R1 的窗口诊断更站得住;ablation 里 Q10 的 30 日版与原 head 的 ρ 为 0.77,属替换而非收录的形状。合理度 4:机制同 R1;Ret×100 与 cs_rank 前置同样是插入节点(注记同 R1)。数学无问题。如果它有 alpha,最可能来自 Q10 的慢状态,与 R1 同源。'
  - head: 'ts_stddev(day_q_stat_std(in_slice(Ret, 11, 230), 5), 15)'
    soundness: 3
    reasons: 'head 为 ts_stddev(Q5,15)(score −1.85,HL 0)。变体只有窗口 45/60/90/120(4 条)。数学无问题;30 日版从 −1.85 到 −1.70,是三个 head 里增益最大的一个。合理度给 3 而不是 4:机制与 R1、R2 相同,但 Q5 只含滞后 1–5,其中 lag 1 的价差反弹成分占比应当最大(推断;库内 day_autocorr 全是 lag 1 也说明这一块被探索得最多),所以「Q5 的慢状态」的解释比 Q10、Q20 薄,延伸窗口更可能只是平滑噪声。不是数学问题,放行。如果它有 alpha,最可能来自被平滑掉的 Q5 离散度中的慢部分,而非结构性的序列相关。'
summary: '槽 a 通过(创新 3、合理 4,划 10、13 后剩 14);槽 b 通过(创新 4、合理 4,划 7 后剩 15);R 三组合理度 4、4、3,无数学级硬伤。唯一的硬数学问题是种子 10 的 semistd 对数比;Q 的 1e-8 下限让它随波动水平耦合,是 head 本身的缺陷,只有 R1、R2 的 Ret×100 变体直接修它。'
