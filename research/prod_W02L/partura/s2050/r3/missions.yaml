- type: N
  hypothesis: 'New idea: intraday path efficiency. For each day compute the net intraday move |log(last close / first open)| divided by the total path length day_sum(abs(Ret)) over the minutes; the ratio is near 1 for a directional, one-sided day (a block of informed / institutional flow pushing the price) and near 0 for a noisy day that goes back and forth (retail churn, bid-ask bounce). Then smooth over 20-120 days, or take the signed version (efficiency times the sign of the net move, i.e. a signed directional-flow measure) and the share of the ratio explained by the opening half hour. Operators: day_last(Close), day_first(Open), div, log, abs, day_sum implement the ratio; cross_mean / cross_zscore / cross_ema smooth; sub of the cross_mean over a short and a long window gives the recent change; cs_bucket_demean on LogFloatCap removes size. Different from the library: batches 1-3 are about the dispersion of minute returns (day_std of the positive part, ratios to day_std(Ret)), the level of the open price, and the fourth moment of the Vwap, and all of them are scale measures of the minute return; efficiency divides the net move by the path length, so it is invariant to the volatility scale and is a path-shape quantity (like a Hurst measure, but in closed form and without a regression, and not the same as day_hurst already used in the snapshot because day_hurst uses a rescaled range). Different from the controls: volatility is divided out and the signed version is the daily return scaled by path length, which is only partly the 20-day reversal control. Out of sample it persists because directional intraday flow reflects institutions splitting large orders (a structural market feature that gets absorbed slowly, so it predicts returns over days) whereas noisy churn is retail, which loses on average.'
  inspired_by: 'Batch 1 (all heads are day_std-of-Ret volatility proxies with deep negative scores, so a scale-free path measure is the natural next step) and batch 3 (day_hurst / ts_kurt of Close-over-Open appear as the positively enriched parts, which indicates path-shape rather than scale information helps)'
