- type: E
  core: 'ts_kurt(div(day_last(Close), day_first(Open)), 50)'
  hypothesis: 'Core = 50-day kurtosis of the daily intraday return ratio (close over first open). It is the subtree with the largest positive enrichment in the batch snapshot (+1.38, p 0.006; candidates containing it average -1.22 vs -2.59 without) and has not been used as an E core in rounds 1-2 (those used the upside-minute-std core and day_sum(Open)). Mechanism: kurtosis of the daily open-to-close move measures how jump-prone / lottery-like a stock is (rare large intraday moves, event and news driven, retail lottery demand); stocks with fat-tailed intraday paths are overpriced by lottery-seeking retail investors and low-kurtosis stocks earn a premium, a well-documented A-share feature (MAX / skewness preference). It is a fourth-moment shape statistic, not a level, so rank volatility is only partly in it, and the new ruler removes the linear and U-shaped part of volatility anyway. Periphery differs from every candidate seen in the snapshot (which only wrap it in cross_mean(...,60) ratios against cross_delay of prices or in pow_3 / ts_kurt chains): here we (a) take own-history deviations (core minus its 120-day mean, ratio to its own cross_stddev) so that a persistent kurtosis level is not mixed with a change in it, a recent kurtosis surprise being the under-reacted piece; (b) demean inside size buckets (cs_bucket_demean on LogFloatCap) and inside turnover buckets (Amt) so cap / liquidity are not mixed in; (c) combine with its comovement with turnover via cross_corr(core, day_sum(Amt), 60), i.e. whether fat tails coincide with volume spikes (news) or occur in quiet trading (noise); (d) cross_delta over 20 days, i.e. kurtosis momentum. The library has the base ts_kurt only inside other skeletons (ts_kurt of day_hurst, pow_3 chains); these deviation / bucket-neutral / comovement skeletons are not among the 5583 expressions. It should persist out of sample because lottery demand is a structural behavioural feature of the A-share retail base, not a fitted pattern.'
