slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 6, 7, 10, 11]
    reasons: '核心 = day_std(上行分钟) 是 head H1 cross_stddev(core,20) 的子树。相关度表:核心与三个 head 的最大原始 |ρ| = 0.44(H1);与 vol 控制 0.73(低于 0.8,核心过门槛),与 liq 0.19、rev 0.33、known 0.24、size 0.04。核心本身基本是波动水平的代理,新意只能来自外围。自动划掉:seed 1 与 H3 的原始 |ρ| 0.81(≥0.7,div(上行,下行) 与 H3 只差分母,实质是同一个比值换写);seed 6 与 vol 0.97、seed 7 与 vol 0.90(≥0.8,几乎就是 vol 控制);seed 10 与 H2 的 0.77;seed 11 与 H1 的 0.87。保留 7 个:seed 2、3、4、5、8、9、12。seed 2、3 用 cross_zscore 做自身历史去水平(与 H 的最大 |ρ| 0.07、0.16,与控制最大 0.35),是这一批里没有的结构;seed 4、5 是 5 日均值对 60 日均值、以及它的 20 日变化量,与 H1 最大 |ρ| 0.20、0.25,但与 rev 0.51、0.53 中度相关,按 §4 不挡;seed 8 是上行波动与 20 日收益和的 cross_corr(|ρ| 0.26);seed 9 是 div(上行,下行) 的上四分位尾均值,与 H2 的原始 |ρ| 为 0.695,低于 0.7 的门槛,贴线但放行,理由见下;seed 12 先做 20 日 zscore 再按流动性分桶去均值。新意打 3 分:上行与下行的不对称比、自身历史 zscore 和分桶中性化是库里 head 没有的写法,但核心的家族(三个 head 全部深负、与 vol 0.73)是已经看过的。合理度打 4 分:核心与各外围算子逐个核对,定义与 §4 的已知陷阱无关。停牌日 is_gt(NaN,0) 返回 0,但 docs/design.md 写明停牌掩码在每个计算节点出口施加,所以不会出现停牌票因 0 排到低端的伪影。数值上唯一要留意的是:seed 2、9 的分子是 div 的分母 day_std(下行) 在几乎只涨的日子可能很小,比值成重尾;seed 9 的上四分位尾均值对这种重尾最敏感。这是否主导结果我无法在本次审计里核实,按 §4 只有「结果主要由它决定」才算定义坏掉,所以不据此挡,建议 PI 在评估时看一下分位数分布。如果它有 alpha,最可能来自:上行跳跃的彩票偏好(买入有大涨分钟的股票),以及个股相对自身历史的异常上行冲击,而不是整体波动水平。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: 'N 位的 idea 是符号化成交份额(day_signed_ratio(Ret,Amt),有界 [-1,1])、尾部形态(day_es_ratio_hi/lo)、以及成交加权收益与时间加权收益之差(day_wmean)。相关度表:与三个 head 的最大原始 |ρ|:seed 5 为 0.59(H3,cross_mean(sub(day_wmean(Ret,Amt),day_mean(Ret)),20));seed 1 为 0.47(H3);seed 10 为 0.39(H2);其余都在 0.17 以下。与 5 个控制最大 |ρ|:seed 11 与 rev 0.60,seed 5 与 rev 0.55,seed 8 与 rev 0.40,seed 10 与 size 0.32,都低于 0.8,过门槛。注意:rev 0.5 以上的几个(seed 5、seed 11)是 20 日反转的一个换写,这一点要在 PI 的解读中说明,但不构成自动划掉。全部 12 个种子保留。新意打 4 分:signed flow 与尾部形态是 head 完全没有的量(head 全是上行波动的幅度),与控制(liq、vol、rev、day_std(Amt)、cap)的符号与幅度都不同。合理度打 4 分:day_signed_ratio 的分子分母与 NaN 处理都正常(分母 clamp 且 den>0 才输出);day_es_ratio 在分位数近零时返回 NaN,不会爆点;cross_zscore、cross_delta、cs_bucket_demean 的定义都与 §4 无关。一处描述错误:seed 7 与 seed 12 的假设写的是「收盘 30 分钟」,但 in_slice(Ret,181,241) 取的是 bar 181 到 240,按 ops 定义 bar 0 为 09:30 集合竞价、bar 121 为 13:01,所以实际窗口是 14:01 到 15:00,共 60 分钟。这是解读错误,不是数学问题,窗口本身仍然有效,不挡,但写讲稿时要按 60 分钟理解。如果它有 alpha,最可能来自:大单分拆带来的持续资金压力(seed 2、3、4,flow 对价格影响逐步吸收);盘中成交重心与价格重心的偏离,即大钱在高点还是低点成交(seed 5、6);尾部分布形状的不对称(seed 1、9);收盘或开盘的知情资金集中(seed 7、8、12)。'
R:
  - head: 'cross_mean(div(day_std(select_where(is_gt(Ret, create_like(Ret, 0), False), Ret, create_like(Ret, 0))), day_std(Ret)), 20)'
    soundness: 4
    reasons: '四个变体都是对 H3 的窗口或分母做去除或替换,直接评估,不涉及新结构。变体 1(60 日)与原 head 的原始 |ρ| 0.75(≥0.5,对替换有效),残差 0.85;变体 2(80 日)|ρ| 0.71,残差 0.78;两者与 size 控制的 |ρ| 为 0.495 与 0.525,变体 2 略超 0.5,要在替换前看残差。变体 3 去掉分母(cross_mean(上行,60))与 vol 控制的 |ρ| 为 0.88,几乎就是 vol 控制,按 R 规则只打合理度,它的数学没有问题,但它基本是 vol 水平,不指望过替换门槛。变体 4 与原 head 的 |ρ| 0.10,是 zscore 形式的同一件事,残差 0.04,是噪声。数学上:分母 day_std(Ret) 是全天总分钟波动,不会比上行分量小,比值在 [0,1] 附近,无爆点;全部数值在 train 与 valid 上的窗口消融(20 到 40 单调增益)是 PI 给的证据,未在本审计中核对。合理度打 4 分:窗口变长、对上行份额做平滑,是机制清楚的去噪。'
summary: '2 个任务位都过(a:创新 3、合理 4,划掉 1、6、7、10、11,剩 7 个;b:创新 4、合理 4,12 个全留);R 组合理 4。a 的 seed 9 贴线(0.695)、seed 2 与 9 有 div 重尾风险,都只在理由中标注、未挡;b 的 seed 7 与 12 窗口描述有误(实为 14:01 到 15:00 的 60 分钟),不挡。'
