- type: N
  hypothesis: '机制:这个批的 37 条都把 DW 在整个交易日上聚合成一个数。它的分子 Σ(ΔP)² 就是整天的已实现方差,于是价格变动发生在「一天的什么时点」被整个丢掉了:同样的一份方差,可能集中在隔夜(开盘跳空,公告
    / 新闻 / 机构订单)、开盘半小时、午休后重新开盘(午休期间的信息消化)、中间的清淡时段,或尾盘(日内交易者平仓、基准跟踪、尾盘拉抬 / 砸盘、收盘集合竞价)。时点的构成是参与者结构与信息到达方式的指纹(Admati
    & Pfleiderer 1988 的日内模式;Heston、Korajczyk、Sadka 2010 的日内收益周期性;Lou、Polk、Skouras
    2019 的隔夜 vs 日内),是慢变的个股属性。时点份额是比值,方差的水平已经被除掉,所以和 vol 控制、成交额离散度一族天然正交的部分最大 —— 这正是水平型
    DW(批里最好的也只有 −2.06,窗口 30 → 60 还翻了方向)被尺子吃掉之后还能剩下的东西。

    算子怎样实现(都是新结构):(a) 方差重心:day_centroid(in_slice(Ret, 1, 240)) 与 day_centroid(pow_2(in_slice(Ret,
    1, 240))),day_centroid 对 |x| 取一阶矩,0 = 全在开盘、1 = 全在收盘;V2 格点第 0 列是 09:30 集合竞价,切片
    1..240 只取连续竞价分钟。(b) 分段份额:day_sum(in_slice(pow_2(Ret), a, b)) / day_sum(in_slice(pow_2(Ret),
    1, 240)),(a, b) = (211, 240) 尾盘、(1, 30) 开盘、(121, 150) 午后开盘,取 30 到 40 日均值或 60 日
    z 分数,以及「尾盘份额 − 开盘份额」。(c) 隔夜份额:gap² / (gap² + Σ 日内 r²),gap = Open_t / Close_{t−1}
    − 1,逐日再取 40 日均值,和 60 日求和之比两个版本。(d) 上午与下午的 DW 对数比:log DW(Vwap 前 120 分钟) − log DW(Vwap
    后 120 分钟) 的 40 日均值。(e) 耦合:cross_corr(方差重心, 隔夜跳空 / 成交额重心, 60) —— 价格是在成交活跃的时点动,还是在清淡时点被少量成交推动。(f)
    分段收益的持续性:尾盘减开盘收益的 60 日均值、隔夜减日内收益的 60 日均值(tug-of-war)、尾盘 day_signed_ratio(Ret,
    Amt)(尾盘净买入占比)的 60 日均值、前 30 分钟收益对后 30 分钟收益的 60 日滚动斜率(日内动量,Gao、Han、Li、Zhou 2018)。

    为什么和库里已有的不同:day_centroid、day_signed_ratio 在 5583 条里一次都没出现;「pow_2(Ret) 的分段份额」「隔夜份额」「上午
    / 下午 DW 对数比」「分段收益差」的骨架库里都没有;16 个种子的骨架已逐个对照 members.csv 的全部骨架,没有一个在库里(库里有 284 条用到
    in_slice(Ret, …),全是同一个切片 (11, 230),作为 day_autocorr / day_corr / day_durbin_watson
    / day_mean 等整段统计的输入;没有一条比较不同时段的份额,也没有 in_slice 与 pow_2 的组合)。和批里的 head 比:head 是整日
    DW 的水平 / 10 日均值与标准差,这里是方差在时钟上的位置,二者度量的东西不同。(e) 里的成交额重心 day_centroid(Amt) 是已在别处出现过的特征,这里只把它作为对齐对象,而不是信号本身。

    为什么样本外还会在:参与者构成与信息到达的时点结构是慢变的(几个月到几年不变),所以窗口 40 到 60 日的份额名次稳定、半衰期 20 的 EMA 下换手低,15
    bp 成本吃不掉;机制是行为 / 微观结构性的(隔夜与日内的收益差在多个市场被记录且持续),不依赖某段行情。风险:尾盘份额可能与流动性 / 小市值相关,尺子对这类线性、U
    形、S 形暴露都会去掉;开盘份额在涨跌停一字板上趋近 1,这是真实的行为(整天行情在开盘前已完成),不是缺失填充。

    数学检查:分段份额的分子是分母的子集,0 ≤ 份额 ≤ 1;分母为 0(整天价格不动 / 停牌)时给 NaN,不是爆点,也没有除以近零的量造成的重尾。Ret²
    约在 1e-6 到 1e-10 之间,float32 不下溢,但没有任何一个 cross_corr / cross_regbeta / cross_zscore
    直接作用在平方后的小量上(只作用在 [0, 1] 的重心 / 份额、约 1e-2 的 gap、约 1e-2 的收益和上),避开 EPS = 1e-9 的分母。DW
    对数比里的 DW 恒正(常数日给 NaN),log 有限。cross_corr 在窗口内没有有效对时返回 0(已知算子行为),只在停牌 / 新股窗口出现。无前视:所有量只用
    t 日及以前的数据,ts_delay(·, 1) 向过去移;t+1 才交易。热身期最多 60 日。'
