    60)
  - cs_bucket_demean(cross_sum(log(day_durbin_watson(Close)), 60), cross_mean(day_std(Amt),
    30))
- head: log(day_durbin_watson(Vwap))
  why: 烂的部件是「当日水平」:既是波动水平,又每天重排,换手高(sufficiency −3.20、方向 +1 / 半衰期 20 才勉强不死);Vwap →
    Close 更差(−4.05),说明没有口径上的好处。变体去掉水平:相对自己一年水平的短期偏离、对数差去掉与 Close 共有的波动部分后做 60 日 EMA(慢、低换手)、对自己
    241 日分布的 z 分数。全是 log(DW) 的有限函数,窗口 ≤ 241,无前视。
  variants:
  - sub(cross_mean(log(day_durbin_watson(Vwap)), 20), cross_mean(log(day_durbin_watson(Vwap)),
    241))
  - cross_ema(sub(log(day_durbin_watson(Vwap)), log(day_durbin_watson(Close))), 60)
  - cross_zscore(log(day_durbin_watson(Vwap)), 241)
