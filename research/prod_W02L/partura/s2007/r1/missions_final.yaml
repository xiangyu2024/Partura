- type: E
  core: ts_scale(day_durbin_watson(Vwap), 10)
  hypothesis: '机制与证据:

    (1) 水平被尺子吃掉。day_durbin_watson 的实现是 Σ(ΔP)² / ΣP²(不去均值,AlphaCube dt_day.py),对价格
    P 就是尺度无关的分钟已实现方差(典型 1e-6 量级),所以它的「水平」就是波动,而 5 个控制里已有 cross_mean(day_std(Ret),
    20) 与成交额离散度一族。批里水平型的 head 全是负分(log(DW(Vwap)) −3.13、cross_sum(DW(Close), 60) −2.06),cross_sum
    的窗口从 30 变 60 还把方向翻了过来(−3.72 方向 −1 → −2.06 方向 +1):短窗口读到的是短期波动 / 反转,长窗口才是持久水平,两者都是尺子要去掉的东西。

    (2) 没被吃掉的是「冲击」。第二个 head 的核心 C = ts_scale(day_durbin_watson(Vwap), 10) 是「今天的 DW
    占最近 10 日 DW 之和的比例」,均值约 0.1,与水平无关(拆解表里 C 与已知族的 rho 只有 0.057),读的是粗糙度相对自己近况的冲击。证据:(a)
    拆掉 ts_scale(knockout)score 几乎不变(−2.94 → −2.88,必要性 −0.06),但 valid 从 −0.95 掉到 −2.20,方向与半衰期也变了(+1
    / 20 → −1 / 5);(b) C 单独只有 −5.65,所以承重的不是 C 的瞬时值,而是 C 在时间上的聚合(cross_fangzheng =
    均值 + 标准差);(c) 聚合窗口 10 → 20,score −2.94 → −2.22、valid −0.95 → −0.45,10 → 5 则变差(−3.60)。越慢、越是二阶统计越好。所以本任务把
    C 当核心,问:C 这条序列的「时间动态」里,哪一种统计在 60 到 241 日的慢窗口上带 alpha?

    (3) 经济含义(每个种子对应一种):C 的 60 日标准差 = 波动的波动 VoV(Baltussen、van Bekkum、van der Grient
    2018:对风险水平的不确定性被定价,VoV 高的股票之后收益偏低,且在控制波动水平之后仍在);cross_semistd_pos 减 cross_semistd_neg、上尾均值、峰度
    = 粗糙度是尖峰型(事件 / 跳跃)还是平稳型;C 与前一天 C 的相关 = 波动聚集性,信息型粗糙度会持续、噪声型当天回落;C 与当日收益、前一日收益、隔夜跳空的滚动相关
    = 波动-收益不对称(杠杆效应 / 下跌恐慌 vs 追涨,Bekaert & Wu 2000);C 与成交额冲击 ts_scale(day_sum(Amt),
    10)、成交量粗糙度冲击的相关 = 粗糙度是信息驱动还是噪声交易驱动(混合分布假说)。这些都是个股的持久行为特征,不是某段行情的产物。

    算子怎样实现:16 个种子都原样带着 C,外围只做 (i) 二阶统计:cross_stddev(C, 60 / 241)、cross_semistd_pos
    / neg(C, 60)、cross_tail_mean_q75(C, 60)、ts_kurt(C, 50)、cross_madz(C, 60);(ii)
    聚集性:cross_corr(C, ts_delay(C, 1), 60);(iii) 耦合:cross_corr / cross_regbeta(C, 当日收益
    day_sum(Ret) / 前一日收益 / 隔夜跳空 Open_t / Close_{t−1} − 1 / ts_scale(day_sum(Amt),
    10) / ts_scale(day_durbin_watson(Volume), 10) / day_signed_ratio(Ret, Amt) / day_max(Ret),
    60 或 241)。

    为什么和库里已有的不同:该批 37 条(以及整个库里含 ts_scale(DW) 的 3 条)都是对 DW 做单层包装(cross_sum / ts_med
    / ts_scale / sigmoid / pow)再取均值或分位。整个库里含 DW 的 341 条中,与另一条日度序列直接配对的只有零星的随机组合(例如
    ts_regbeta(day_last(Amt), day_durbin_watson(Open), 10),窗口只有 10),没有一条以「冲击序列 C」为一腿、在
    60 日以上的窗口里与收益 / 隔夜跳空 / 成交额冲击做耦合,也没有一条取 C 的半方差、上尾均值或峰度(ts_kurt 只在两条随机嵌套里出现,都不是直接作用在
    DW 序列上);cross_semistd_* 与 cross_tail_mean_q75 两个算子在 5583 条里一次都没出现。16 个种子的骨架已逐个对照
    members.csv 的全部骨架,没有一个在库里。与三个 head(水平,或 C 的 10 日均值 + 标准差)的日度秩相关预计低于 0.5:二阶矩的窗口是
    60 / 241 而不是 10,耦合量是相关系数,与水平无关;与成交额离散度一族也不同:那一族读日内成交额的绝对离散,这里读粗糙度相对自己近况的波动与同步性。

    为什么样本外还会在:这些统计量是个股行为特征(波动不确定性、波动-收益不对称、信息 / 噪声交易构成),窗口 60 日以上,名次几周内稳定,配合半衰期 20
    的 EMA 换手很低,15 bp 成本吃不掉;VoV 溢价在美国与别的市场的跨样本文献里都有记录。风险:VoV 与波动水平相关,尺子已经把对波动的线性 /
    U 形 / S 形暴露去掉;C 做了「除以自己 10 日总和」,水平已经被除掉,所以残差里留下的主要是动态部分。

    数学检查:DW 在日内价格为常数(或有效点不足 2 个)时给 NaN,拆解表里 ts_scale(DW(Vwap), 10) 的覆盖率 0.998;ts_scale
    的分母是近 10 日 DW 之和(约 1e-5 量级,远大于 EPS = 1e-9;只有这 10 日几乎都冻结才会被置为 1,这时 C ≈ 0,在截面里排最低,这是窄的已知情形);C
    约在 0 到 1 之间,量级 0.1 ± 0.05,所以 cross_corr、cross_regbeta、cross_zscore 的分母(标准差乘积约
    1e-3)远大于 EPS,不会被缩到 0(这也是为什么没有直接对原始 DW 做相关:原始 DW 的标准差约 1e-6,标准差乘积 1e-8 会接近 EPS
    造成人为收缩)。cross_corr 在窗口内没有有效对时返回 0 而不是缺失(已知算子行为),只在停牌 / 新股的窗口出现。无前视:只用 t 日及以前的数据,ts_delay(·,
    1) 只向过去移;t+1 才交易。热身期最多 10 + 241 日,只有 241 窗口的 2 个种子受影响。'
