- head: cross_sum(day_durbin_watson(Close), 60)
  why: 烂的部件是「水平」:DW(Close) 是分钟已实现方差,加上收盘价的买卖价差跳动(bid-ask bounce)噪声,60 日求和之后就是持久的波动水平,正好是波动
    / 流动性控制要去掉的东西(窗口 30 → 60 方向翻转,−3.72 → −2.06;Close → Vwap 几乎不变 −2.17,说明起作用的不是价格口径)。变体把「波动水平」去掉,留下「噪声占比」:Close
    与 Vwap 的 DW 对数差(Close 的路径比 Vwap 多出来的跳动,属于微观结构噪声,Roll 1984 的价差思想),逐日横截面回归去掉 Vwap
    的 DW 之后的残差,以及在成交额离散度一族的十分位内去均值。log(DW) 恒有限(常数日给 NaN),cs_regres 在横截面上每天回归,无前视。
