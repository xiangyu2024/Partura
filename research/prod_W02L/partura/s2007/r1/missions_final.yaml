R:
- head: cross_fangzheng(ts_scale(day_durbin_watson(Vwap), 10), 10)
  why: 烂的部件是「窗口太短、聚合里混着一个与水平相关的均值项」。拆解表:窗口 10 → 20,score −2.94 → −2.22、valid −0.95
    → −0.45;10 → 5 变差(−3.60);拆掉 ts_scale 几乎不变(必要性 −0.06)但 valid 掉到 −2.20,说明承重的是 C
    = ts_scale(DW(Vwap), 10) 的时间聚合,而且越慢越好。cross_fangzheng = 均值 + 标准差,C 的 10 日均值约为
    0.1 的常数加上趋势,真正的信息在标准差(波动的波动)和不对称。变体:窗口 20 / 60(locate 已给的 20 加上更慢的 60);只留标准差、半方差(cross_stddev
    / cross_semistd_pos),去掉均值项;ts_scale 内窗口 10 → 20。cross_stddev 与 cross_semistd 对
    C 都有界、无近零的分母。
