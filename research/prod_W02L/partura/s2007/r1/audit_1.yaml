    reasons: '创新度 4。位内 16 个种子的骨架都不在两个库的 5583 条骨架里(逐个对照 struct/members.csv 核过:day_centroid、day_signed_ratio、cross_semistd_*、cross_tail_mean_*、cross_madz 库里都是 0 条;含 ts_scale(DW) 的只有 3 条,且没有一条对 C 取 60 日以上的二阶统计,或与收益、隔夜跳空、成交额冲击做耦合)。与快照三个 head 的原始日度秩 |ρ|:种子 1–16 除种子 15(cross_madz,对 log DW(Vwap) 为 0.43)外都在 0.32 以下;对 5 个控制的原始 |ρ| 最大 0.46(种子 2 对 size),但尺子已去掉线性 / U 形 / S 形暴露,不据此扣分。扣分的地方:种子 1 与种子 2 是同一个量(C 的 cross_stddev)只换 60 与 241 窗口;种子 1、3、5 对 head 2 的残差 |ρ| 为 0.49–0.56,说明一部分与 head 2 共享结构。但它们不是同一个东西,所以给 4 不给 5。合理度 4。机制清楚:慢窗口的 C 二阶统计对应波动的波动(VoV),半方差与峰度对应粗糙度的不对称与尖峰,C 与收益、隔夜跳空、成交额冲击的滚动相关对应波动与交易的同步性。逐个核对算子:ts_scale 是 x_t 除以含 t 的 10 日 nansum(和小于 EPS 时分母置 1),C 落在 [0,1];cross_* 都是因果滚动窗口(rolling_windows 左填 NaN,ts_delay 只向过去移);cross_semistd 用 x_t 与 x_{t-1} 的对数变化,因果;cross_madz 用历史中位数与 MAD,因果;没有用到 ts_rank、cross_rank、in_rank_rolling,所以 nanrank_last 的停牌补 0 问题不适用。风险都不构成数学问题,放行:(a) 核心 C 对 head 1、head 3 的原始 |ρ| 在表里是 inf(见 summary),PI 说 C 与水平无关的判断在表里没有被量到;种子 15 与 head 3 的 0.43 提示 C 族带一部分水平成分。(b) 种子 3、4 与 R 1 变体 6 对 C 取对数变化,C 接近 0 的日子(近乎不动的 VWAP)会产生大的对数跳动,可能主导半方差;秩变换限制了影响,但没有截面检查,建议 r2 看分布。(c) cross_corr 在窗口内无有效对时返回 0 而非缺失(已知行为),只影响停牌或新股窗口。(d) ts_scale 的 EPS 分支只在 10 日 DW 和几乎为 0 时触发,窄。核心对各控制的 |ρ| 最大 0.102(vol),远低于 0.8,通过。如果它有 alpha,最可能来自慢窗口 C 的二阶统计(VoV 一类),或 C 与当日收益、隔夜跳空的耦合(波动-收益不对称)。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [9]
    reasons: '创新度 4。16 个种子的骨架都不在库里(members.csv 核过:day_centroid、day_signed_ratio、in_slice(pow_2(...))、cross_semistd_*、cross_tail_mean_* 都是 0 条;库里 284 条 in_slice(Ret,...) 全是同一切片 (11,230) 的整段统计,没有一条比较不同时段的份额)。与快照三个 head 的原始 |ρ|:种子 7–16 全部有限,最大 0.382(种子 15 对 head 1),其余多在 0.3 以下;种子 1–6 对 head 2 为 inf(见 summary),不作为相似证据。对控制的暴露偏大:种子 3 对 liq 0.565、known 0.523,种子 8 对 known 0.422,种子 1、2、6 对 liq 与 known 为 0.34–0.38。这说明不少信号可能是换手或门槛型的时点效应,是风险但不是重复,不据此扣分。种子 1 与种子 2 是 |Ret| 与 Ret² 两种权重下的时点重心,权重不同,保留。合理度 4。机制清楚:方差在一天中的位置对应 Admati-Pfleiderer 的日内模式,隔夜与日内收益的 tug-of-war,以及尾盘净买入。时段切片已核对:in_slice 为闭区间,列 0 为 09:30 集合竞价,(1,30) 即 09:31–10:00,(121,150) 即 13:01–13:30,(211,240) 即 14:31–15:00,与笔记一致;gap 用 day_first(Open) 与前一日 day_last(Close),全部因果。算子:div 没有 EPS 保护,但份额的分母是包含分子的总和,0/0 给 NaN、不会给 inf;cross_regbeta 在 var_x 小于等于 EPS 时给 NaN,种子 16 的开盘 30 分钟方差很小时斜率会放大,但秩变换后只影响次序,放行。划掉种子 9:它与种子 8 是同一个量(隔夜方差份额 gap²/(gap²+Σr²)),只换了聚合方式(60 日求和之比对 40 日逐日均值),是同一个东西的两种写法,按重复划掉。种子 10 与种子 3 同一份尾盘份额,只换标准化(60 日 z 分数对 40 日均值),不是同一个量,保留。注意:种子 1–6 对 head 2 的 inf 若被流水线当作 ≥0.7 自动划掉,位剩 9 个,仍过线,位的通过结论不变;但这应由 PI 复算后再定。如果它有 alpha,最可能来自尾盘与隔夜这类慢变的参与者结构指纹(与波动水平、成交额族正交),或尾盘减开盘的分段收益持续性。'
R:
  - head: 'cross_fangzheng(ts_scale(day_durbin_watson(Vwap), 10), 10)'
    soundness: 4
    reasons: '三个变体只改窗口(20、60)或内层 ts_scale 窗口(20),骨架与 head 2 相同,是同一个 head 的参数扫描;其余变体去掉均值项,只留标准差或半方差,或再做 EMA 平滑,是对水平项的合理替换。机制(越慢越好 = 持久的波动不确定性)与相关度表一致:cross_stddev(C,20) 对 head 2 的原始 |ρ| 为 0.45、残差为 0.75,若分数过线则是替换候选。算子链都因果,无数学问题,合理度 4。需要协调员核实的一点:R 的定义是「去掉或替换部件」,纯窗口改动可能不算部件替换;这里按机制打分,没有因形式扣分。如果它有 alpha,最可能来自去掉水平项之后的慢波动统计。'
  - head: 'cross_sum(day_durbin_watson(Close), 60)'
    soundness: 4
    reasons: '变体 1 与 2 用 DW(Close) 相对 DW(Vwap) 的对数差(收盘价比 VWAP 多出的路径跳动,即买卖价差与微观结构噪声,Roll 的思想)作为噪声占比,机制清楚;变体 2 用 cs_regres 在每个截面上去掉 log DW(Vwap) 的水平,无前视。变体 3 在已知族的十分位内去均值,机制合理。数学上 DW 恒正(常数日已是 NaN),log 有限;cs_bucket_demean 的桶按截面百分位划分,无数学问题,合理度 4。冗余提示(不是数学问题):变体 3 对原 head 1 的原始 |ρ| 为 0.731,是几乎同一个排序的桶内版本;变体 1 与 R 3 变体 2 是同一个量的符号反转,一个用求和、一个用 EMA。如果它有 alpha,最可能来自收盘价路径噪声占比的慢变部分。'
  - head: 'log(day_durbin_watson(Vwap))'
    soundness: 4
    reasons: '变体 1 是 20 日均值减 241 日均值,即相对长期水平的短期偏离,去掉了水平,机制清楚;变体 2 是 Vwap 与 Close 的 log DW 差的 60 日 EMA(与 R 2 变体 1 同一个量,见上);变体 3 是 log DW(Vwap) 对自身 241 日的 z 分数,对 head 3 的原始 |ρ| 为 0.718,是按个股标准化的换皮,作为替换候选合理,但不是新东西。三个变体的覆盖率为 0.997–0.999,热身期不主导结果;算子因果;合理度 4。如果它有 alpha,最可能来自瞬时粗糙度冲击的均值回复。'
