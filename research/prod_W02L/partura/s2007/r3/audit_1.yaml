attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [1, 9]
    reasons: '创新度 4。核心 K = day_close(in_kurt_full(Amt)) 是快照 head 3 的子树,不是新对象;但外围 cross_corr(K, 跳空 / 日收益类) 的读法在相关度表里与 9 个 head 的原始 |ρ| 最大 0.46(seed 12,与 DW 一族 head 相近),与 5 个控制最大 0.33(seed 12 与波动),已知族 |ρ| 最大 0.36(seed 2),都远低于 0.7 / 0.8 的线。第 2 轮 K 的 E 位只试过 cross_corr(K, |跳空|, 241) 一条外围,其余读法是新的,所以给 4 不给 5(核心本身已在库里)。合理度 4。逐个算子核对:cross_corr 为 cov / (sqrt(var_x·var_y) + EPS),两侧是 K 与 |跳空| 的离差平方和,|跳空| 的平方和约 0.02 远大于 EPS,无爆点;cross_regbeta(K, |跳空|) 按 rolling_ols 的 y ~ alpha + beta·x 约定是 |跳空| 对 K 的斜率,var_x 是 K 的离差平方和,与 PI 的说明一致;ts_delay 只向过去平移;|跳空| 用当日开盘与昨日收盘,t 日收盘后已知,无前视;cs_bucket_zscore 在分桶内标准化,无除以近零量;seed 10 的 close/open 是当日内的量,收盘后才有,但与 t+1 交易一致。划掉 1 与 9:这两条的外围算子集合(去掉核心 K 之后的全部算子)与第 2 轮已见种子 cross_corr(K, abs_(跳空), 241) 逐个相同,只是 ts_delay 挪到了 K 或跳空上,按「外围不得与已见过的含该核心的候选相同」属于重复;这是按算子集合读的判断,PI 若认为要按表达式读,可以恢复,不影响本位通过。风险不挡:K 是超额峰度,单日大宗成交可把它推到上百,而 cross_corr / cross_regbeta / 乘积均值都是 Pearson 型,一天主导 241 日窗口(seed 2、7、12 尤甚);第 2 轮 valid +0.64 说明这条读法在本数据上没有失效。train 最早约一年混有 2018-08 之前上交所没有收盘集合竞价的制度差异,K 在那段不同质,也不挡。如果它有 alpha,最可能来自「成交挤在少数几根」与「隔夜价格跳」耦合的稳定性(seed 2、5、6、7、11 的 60 日均值 / 标准差读法),而不是 K 的水平。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [13, 14]
    reasons: '创新度 4。外围 day_signed_ratio、day_gini、day_es_ratio_hi、day_zero_ratio、DW(Ret) 与隔夜跳空的 cross_corr / cross_regbeta 组合,在相关度表里对快照 head 的原始 |ρ| 最大 0.40(seed 3,与 ts_std 一族),对 5 个控制最大 0.42(seed 3 与流动性和已知族,liq 0.42 未到 0.8;gini 是成交集中度的流动性读法,PI 要留意它可能只是流动性的换写)。seed 11 对 head 的 |ρ| 仅 0.06,是差分形式的新读法。seed 7(隔夜跳空与日内收益的相关)是 overnight / intraday 分解的经典读法,文献里有先例(Lou-Polk-Skouras 2019),我没有核对库里是否已有这个写法,给 4。合理度 4。逐个算子核对:day_signed_ratio = Σ|Amt|·sign(Ret) / Σ|Amt| 在 [-1, 1],分母 clamp 在 1e-30,全天无成交给 NaN;day_gini 有界;day_zero_ratio 在 [0, 1];cross_regbeta(S, F) 是 F 对 S 的斜率,var_x 是 S 的离差平方和,约 0.02 远大于 EPS;ts_delay 只向过去;seed 10 的 F_{t-1} 与 S_t 都是 t 日开盘前已知的量,无前视;ts_scale(day_sum(Amt), 30) 分母是 30 日成交额之和,停牌日已掩成 NaN。划掉 13 与 14:流水线门槛为 废品(gate false),distinct 分别只有 0.129 与 0.286。它们是 cross_mean(sign(S)·sign(日收益), 241) 的形式,241 个离散值除以 241 只有约 483 档可取,5000 只票必然大量并列,截面排序主要由列序决定。§4 把列序并列当作非问题,只限于偶发并列;这里并列占了绝大多数票,面板几乎是常数,属数学问题,划。14 的市值差分桶只是 13 的分桶版本,同一个问题。机制是持有人构成与信息吸收速度(跳空后日内订单流是否延续),说得通;seed 5 的零收益分钟占比在涨跌停锁定和停牌附近会同时大、跳空也大,可能是涨跌停机制而不是信息吸收,而 BoardCode 不在 5 个控制里,这一点交 PI 检验,不挡。如果它有 alpha,最可能来自隔夜跳空被日内订单流确认或回补的持续性(seed 2、4、7、8、12),其次是成交集中度与跳空的耦合(seed 3、5、6)。'
R:
  - head: 'ts_std(mul(day_close(in_relative_distance_m(Amt)), ts_min(pow_3(day_durbin_watson(Open)), 1)), 40)'
    soundness: 3
    reasons: '合理度 3。机制是「日内相对距离的时序稳定性乘上价格粗糙度的立方」,经济含义弱,但说不清机制不是挡的理由。算子核对:ts_min(·, 1) 是恒等,这一层是空包装;ts_std 直接开方、没有 EPS 守卫;窗口 ≤ 241 日,无前视。两点需要 PI 核实,都不构成挡的理由:(a) in_relative_distance_m 对 Amt 做 x / (prefix_min + EPS),若某分钟之前出现精确为 0 的成交额,该值会被放大到约 1e9 倍并主导截面。需要先数一下股票日里 Amt 精确为 0 的分钟占比;如果不小,这一组就是 §4 的数值伪影。库里的 head 也用到这个算子,这条风险不是只针对 R。(b) pow_3(DW(Open)) 的量级约 1e-18,ts_std 里的平方离差落在 float32 的次正规区,低价低波动的票精度会下降,但不是主导。变体 4 去掉了 pow_3,正好绕开 (b)。变体 5、6 与流动性控制的 |ρ| 分别为 0.87、0.81,变体 4 为 0.68,它们读的是流动性,按「同一东西」的原则,选变体时应去掉。R 组是否替换由流水线判,这里只评合理度。如果它有 alpha,最可能来自日内成交分布的稳定性(窗口越长越好,与拆解一致),而不是价格粗糙度本身。'
  - head: 'abs_(ts_std(ts_min(pow_3(day_durbin_watson(Open)), 1), 50))'
    soundness: 3
    reasons: '合理度 3。机制是「价格粗糙度立方的时序波动」,是粗糙度的变动性读法;abs_ 作用在标准差上是恒等,这一层是空包装,ts_min(·, 1) 也是恒等。窗口 50 到 241 的拉长只改估计噪声,结构不变,不是问题。算子核对:ts_std 直接开方,没有除法,无前视。同 R1 一样,pow_3(DW) 的量级约 1e-18 到 1e-21,平方离差在 float32 次正规区,精度会降,但不主导;全部变体都保留了 pow_3,如要消除这一风险,应在变体中去掉 pow_3,不挡。变体 3 与原 head 的 |ρ| 为 0.79,属于替换类,由流水线判;变体 1、2、4 的已知族 |ρ| 为 0.10 到 0.19,没有到 0.5。如果它有 alpha,最可能来自价格粗糙度的稳定性(变动性越低、越稳定的票越好),而不是粗糙度水平。'
summary: '两个 E/N 任务位都过审计:位 a 创新度 4、合理度 4,划掉 1、9(外围与第 2 轮已见种子算子集合相同),剩 10 个;位 b 创新度 4、合理度 4,划掉 13、14(面板并列过半,近乎常数),剩 12 个。两个 R 组合理度均为 3 放行;R1 有一条需先核实的风险:in_relative_distance_m 在 Amt 出现精确 0 的分钟时会爆点放大,PI 核实前不应以 R1 替换原 head。'
