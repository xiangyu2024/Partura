- type: N
  hypothesis: '机制:第 2 轮 E 位里,读数为正的外围是「成交集中度 与 价格跳 的耦合」,不是集中度本身。本任务把这条搬到不含 K 的、各自独立的成交
    / 订单流度量上,并加一条没人试过的新机制:隔夜跳空的方向与日内订单流的方向是否一致(跳空被订单流确认 / 反转)。

    经济含义:(a)「跳空 × 订单流同向」:隔夜新信息使开盘价跳空,若当天成交额加权的净买卖方向与跳空同向(day_signed_ratio(Ret, Amt)
    = 按成交额加权的涨跌分钟占比),说明信息被持续消化,价格延续;反向则是过度反应被纠正(跳空回补)。241 日窗口的相关 / 斜率 / 一致率估计出这只票是「延续型」还是「回补型」,这是个股的持久属性(参与者构成与信息环境),对应隔夜
    - 日内两段收益符号不同的文献(Lou-Polk-Skouras 2019;Berkman 等 2012 的隔夜 / 日内分解)。(b)「|跳空| 与 成交额冲击
    / 基尼 / 尾部占比 / 零收益占比 / 分钟 DW 的耦合」:跳空是否带来相应的成交反应,衡量信息被注意与处理的强度(Kim-Verrecchia 1994:信息事件引发成交增加)。(c)
    滞后项:昨天订单流对今天跳空的相关(订单流是否提前泄露隔夜信息)。

    算子怎样实现(14 个种子):S = div(day_first(Open), ts_delay(day_last(Close), 1)) - 1(带符号跳空,约
    0.01 量级);G = abs_(S);F = day_signed_ratio(Ret, Amt)(在 [-1, 1],分母是成交额之和,0/0 给 NaN);cross_corr
    / cross_regbeta 241 日;cross_mean(sign(S) × F, 241)、cross_mean(sign(S) × sign(日收益),
    241) 是一致率(取值有界,没有除法);两个同伴内版本(市值十分位 / 名义价位十分位内 z 分数);一个差:跳空与订单流相关 减 跳空与日收益相关。

    为什么和库里已有的不同:day_signed_ratio 是 ops_ext 新算子,库里 0 条;cross_corr 伙伴是隔夜跳空的写法库里没有;带符号跳空
    × 订单流的一致率这类写法 0 条;不含 day_centroid(Amt)(W01 领地,已避开)与 K(上面 E 位的核心)。

    为什么样本外还会在:延续型 / 回补型是持有人与信息环境的结构,慢变;241 日窗口估计的名次几个月内稳定,半衰期 20 下换手低,15 bp 吃不掉;机制不依赖某段行情。风险(如实):延续
    / 回补强度与波动、流动性相关,尺子去掉线性 / U 形 / S 形暴露,门槛型暴露去不掉;训练段最早约 241 日混着收盘集合竞价上线前的制度差异;第 2
    轮的 train 与 valid 常一边 0 一边 -0.7。

    数学检查:S 与 G 是价格比值,分母是昨日收盘价(正),无近零分母;F 有界;cross_corr 分母是窗口内偏差平方和的平方根(S 的约 0.02 开方,远大于
    EPS=1e-9);cross_regbeta 的 var_x 是 S 的偏差平方和(约 0.02 >> 1e-9);cross_corr 无有效对返回 0(停牌窗口,已知行为);day_zero_ratio(Ret)
    在 [0, 1],day_durbin_watson(Ret) 在分母 <= 1e-8(冻结日)给 NaN;所有量只用 t 日及以前的数据,滞后项只向过去移;不用
    ts_rank / cross_rank,nanrank_last 不适用。'
