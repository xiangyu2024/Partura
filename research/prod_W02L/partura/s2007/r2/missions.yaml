  hypothesis: '机制与证据:

    (1) 核心 K = day_close(in_kurt_full(Amt)):当天 241 根分钟成交额的超额峰度(数值上等于 day_kurt(Amt);分母是方差的平方,Amt 的水平和价位都被除掉,无量纲;上界 n−3 = 238,常数日 0/0 给 NaN,不会爆点)。它读「一天的成交是平稳铺开,还是挤在几根里(开盘
    / 收盘集合竞价、事件、大单)」。

    (2) 快照给的证据与缺口。快照里只有 head 3 含 K,而且是被乘进去的:cross_max(mul(K, X), 5),X 是 40 日收盘棒成交额标准差的三次方。拆解表:K 单独(窗口 5 的 cross_max)−3.79,但与已知族的 ρ 只有 0.23(整条
    head 的 ρ −0.76 是 X 带来的);X 单独 −0.48,乘上 K 反而 −0.58。所以快照没有证明 K 自己有 alpha,只证明了两件事:K 不是成交额离散度(已知族控制)的换皮;「5 日最大值」这种最快的聚合把它做成了满换手的噪声(库里原式 day_kurt(Amt)
    日换手 0.81、训练净夏普 −9.9)。没人把它放慢过:库里含 day_kurt(Amt) 的 6 条是原样、5 日差分、30 日标准差、3 日均值之类,没有一条是 120 日以上的聚合、分桶或耦合。本任务只问一件事:把 K 放慢、去掉混进来的成分之后,它有没有独立于水平的
    alpha。

    (3) 经济含义:稳定铺开(K 低)的成交是被拆单的机构 / 算法执行(Kyle 1985:知情者平滑下单;Barclay-Warner 1993:隐身交易;Keim-Madhavan 1997:机构在小盘里拆单以压低冲击),挤成几根(K 高)的是事件驱动、散户追涨或集合竞价集中。这是参与者结构的指纹,几个季度不变,不依赖某一段行情。

    (4) 算子怎样实现(15 个种子都原样带着 K):(i)慢聚合:cross_mean / cross_med(241,中位数版防个别日的大单)、cross_tail_mean_q75(241)、cross_stddev(120)、20 日均值减 241 日均值(参与者结构的最近变化);(ii)同伴内:cs_bucket_zscore(慢均值,
    LogFloatCap) 与 cs_bucket_zscore(慢均值, sub(LogFloatCap, LogFloatShares))(名义价位),在市值或价位十分位内比较,而不是对全市场比较(本波别的流里,同伴内标准化是读数最好的写法之一);(iii)耦合:K 与当日收益、成交额冲击
    ts_scale(day_sum(Amt), 30)、隔夜跳空绝对值的 241 日相关,昨天的 K 对今天收益的 241 日回归斜率(爆量之后的反应),K 与自身滞后一天的 120 日相关(持续性);(iv)价量对照:K 减 Ret 分钟序列峰度的 241 日均值(只有量爆、价不爆
    vs 价量同爆)、K 与 Ret 峰度的 241 日相关、K × sign(日收益) 的 241 日均值(上涨日爆量 vs 下跌日爆量)。

    (5) 与库里已有的不同:15 个种子的骨架逐个对照 members.csv 的 5583 个骨架,没有一个在库里;cs_bucket_zscore、LogFloatShares、cross_tail_mean_q75 在 5583 条里一次都没出现;in_kurt_full
    只出现 4 次,作用在 Amt 上的只有 head 3 这一次。与三个 Amt 的 head(都由 X 主导,与已知族 ρ 约 −0.8)预计日度秩相关低于 0.5。W01 里用到 day_kurt(Amt) 的只是把它当耦合伙伴(与成交额质心、开盘棒成交额配对),本任务配对的是收益、成交额冲击、隔夜跳空绝对值与价格峰度,不同。

    (6) 样本外为什么还会在:参与者结构慢变,241 日均值的名次几个月内稳定,半衰期 20 下换手低,15 bp 吃不掉;(ii)的同伴内写法去掉了「小盘本来就更尖」的混入。如实写风险:K 一部分是流动性代理(薄的票更尖),尺子去掉了线性 / U 形 / S 形暴露,门槛型暴露去不掉;K
    主要由开盘与收盘集合竞价那两根的相对大小决定,上交所 2018-08 以前没有收盘集合竞价,训练段最早约一年(窗口 241)的读数混着这个制度变化;如果这一类 train 偏弱、valid 为正,取 min 就到不了 0.5。

    (7) 数学检查:K 有界(下界 −2,上界 238),没有近零分母;常数日 / 停牌日给 NaN,不是填充。cross_corr / cross_regbeta 的分母是窗口内偏差平方和(K 的约 1e3~1e5,ts_scale(day_sum(Amt), 30) 约 0.03、隔夜跳空绝对值约
    0.01,乘积的平方根都远大于 EPS = 1e-9)。sign(day_sum(Ret)) 取 −1 / 0 / 1。所有量只用 t 日及以前的数据,ts_delay(·, 1) 只向过去移,t+1 才交易;不用 ts_rank / cross_rank,所以 nanrank_last
    的停牌补 0 不适用;热身期最多 241 日。'
