- type: N
  hypothesis: '机制:B020 批(cross_decay_linear 一族,32 条)里,过了尺子的每一条都是「收盘棒成交额平滑量的标准差」一类,而同一个平滑量本身 day_close(cross_decay_linear(Amt, 30)) 在新尺子下只有 −3.52(与已知族
    ρ 0.95):水平被控制吃掉,留下来的是变动性。变动性还越慢越好(外层 ts_std 窗口 20 → 40 → 80:−0.91 → −0.56 → −0.39;嵌套头 −0.69 → −0.39 → −0.07,valid +0.14)。但留下来的东西与已知族 ρ 仍是
    −0.77 ~ −0.82(它本质上是「成交额水平 × 变动」),所以不能当 head。本任务把「变动性胜过水平」这条搬到已经无量纲的量上:先用比值 / 重心 / 基尼 / 相关把水平除掉,再在 120 日窗口上取标准差,读的是「交易模式的不稳定性」,不再带成交额水平。

    经济含义:稳定的交易模式(成交额冲击小、成交重心固定、集中度固定、隔夜与日内的方差配比固定)属于结构稳定的持有人(机构、长期资金),不稳定的属于事件驱动、投机或持有人在换手的股票。文献:交易活动的变动性被定价(Chordia-Subrahmanyam-Anshuman 2001:成交额
    / 换手的变异系数对收益为负且在控制水平之后仍在);对风险水平的不确定性被定价(Baltussen 等 2018);日内成交 / 收益的时点模式是持久的个股属性(Heston 等 2010);隔夜与日内的方差配比对应参与者构成(Lou 等 2019);与市场同步性的变化对应信息环境的变化(Morck
    等 2000)。

    算子怎样实现(16 个种子,五组):(a) 成交额冲击 A = ts_scale(day_sum(Amt), 30)(今天额占最近 30 日额之和,约 0.03,无量纲)的变动:cross_stddev(A, 120)、cross_stddev(cross_stddev(A,
    10), 120)(冲击的聚集性)、cross_stddev(A, 30) − cross_stddev(A, 241)(变动性的近远差);(b) 成交时点与集中度:cross_stddev 作用在 day_centroid(Amt)(成交重心)、day_centroid(pow_2(in_slice(Ret,
    1, 240)))(方差重心)、day_gini(Amt)、day_es_ratio_hi(Amt)、day_zero_ratio(Ret)(价格不动的分钟占比)、day_signed_ratio(Ret, Amt)(净买入占比)、day_durbin_watson(Ret)(分钟收益的跳动
    / 动量度量)、收盘价对当日成交额加权均价的比值;(c) 方差配比:隔夜跳空的 120 日标准差占「隔夜 + 日内两个标准差之和」的份额(分母是两个非负数之和,0/0 给 NaN,不会爆点);(d) 耦合的不稳定性:cross_stddev(cross_corr(A, 日收益,
    60), 120)(价量关系是否稳定)、cross_stddev(cross_corr(日收益, cs_mean(日收益), 60), 120)(与市场同步性是否稳定);(e) 同伴内:把 (a)、(b) 里最有代表性的两个放在市值或名义价位十分位内做 z 分数(cs_bucket_zscore),去掉「小盘本来就更不稳定」的混入。

    为什么和库里已有的不同:库里 cross_stddev(day_…) 有 133 条,但内层全是 Amt / Ret 的水平量或 day_corr / day_cov;内层为 day_centroid、day_gini、day_es_ratio_hi、day_signed_ratio、day_zero_ratio、ts_scale(day_sum(Amt))、嵌套
    cross_corr 的,在 5583 条里逐个核对都是 0 条;cs_bucket_zscore 与 LogFloatShares 也是 0 条。16 个种子的骨架逐个对照 members.csv 的全部骨架,没有一个在库里(两个骨架在库里的写法——开盘 / 尾盘 30 分钟份额的标准差、day_skew
    / day_corr 的标准差——已换掉)。与本批 head 的区别:head 是「成交额水平 × 变动」(与已知族 ρ −0.8),这里的内层都已无量纲,预计与三个 Amt head 的日度秩相关低于 0.5。

    为什么样本外还会在:持有人结构与交易模式慢变,120 日标准差的估计误差约 6%(1/√(2n)),名次几周内稳定,半衰期 20 下换手低,15 bp 吃不掉;机制不依赖某段行情。风险(如实):不稳定性与流动性 / 市值 / 波动相关,尺子去掉线性 / U 形 / S 形暴露,门槛型暴露去不掉;训练段最早约
    120 日的读数混着上交所 2018-08 以前没有收盘集合竞价的制度差异;如果 train 偏弱、valid 为正,取 min 到不了 0.5。

    数学检查:所有内层量有界或是比值(A ∈ (0, 1];重心 ∈ [0, 1];基尼 ∈ [0, 1];zero_ratio ∈ [0, 1];signed_ratio ∈ [−1, 1];DW(Ret) 在分母 ≤ 1e-8 或日内方差 < 1e-8(冻结日)时给 NaN,Ret
    的平方和约 1e-5 ~ 1e-3,远大于 1e-8;收盘价 / 加权均价约 1 ± 0.01),cross_stddev 没有除法;cross_corr ∈ [−1, 1],窗口内没有有效对时返回 0 而不是缺失(已知算子行为,只出现在停牌 / 新股窗口);cs_mean
    是当日全截面均值(只用当日已知收益);day_centroid(pow_2(in_slice(Ret, 1, 240))) 的 Ret² 约 1e-6,只用来算重心(比值),不进相关 / 回归;ts_delay 只向过去移;不用 ts_rank / cross_rank,nanrank_last
    不适用;热身期最多 120 + 60 日。'
