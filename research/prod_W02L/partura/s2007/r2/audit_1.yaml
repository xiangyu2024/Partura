attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [3]
    reasons: '创新度 4。核心 K = day_close(in_kurt_full(Amt)) 对快照三个 head 的原始日度秩 |ρ| 最大 0.19(最像的是 ts_std(day_close(cross_decay_linear(Amt, 30)), 40)),残差 0.09;对 5 个控制的最大 |ρ| 是流动性 0.23。15 个种子对快照 head 的原始 |ρ| 最大 0.36(种子 3 对 head 1),其余多在 0.32 以下;种子 10、12 等几乎与 head 无关。库里 in_kurt_full 只出现 4 次,作用在 Amt 上的只有快照 head 3 这一条(我用 members.csv 核过:cross_mean(day_close(in_kurt...)) 0 条,day_close(in_kurt 只有 head 3 一条)。K 的 241 日慢聚合、同伴内标准化、与收益 / 隔夜跳空的耦合,骨架都不在库里。扣分的地方:种子 1 与种子 3 是同一个 241 日窗口上 K 的中心趋势估计(均值对中位数),输入与窗口都相同,两者的秩相关应当很高,控制暴露也几乎一样(流动性 0.46 对 0.49、已知族 0.38 对 0.41),属于同一个量的两种写法,按重复划掉种子 3,保留种子 1。种子 11(上四分位均值)是同一窗口上的尾部统计,不是同一个量,保留。种子 5、6 是种子 1、6 加上同伴内 z 分数,去掉了市值 / 价位的混入,保留。给 4 不给 5,因为整个位仍集中在 K 的水平这一族上。合理度 4。逐个核算子:_kurt 是超额峰度(分子分母都是 nanmean),分母用 torch.divide 不加 EPS,但常数日是 0/0 得 NaN、不会爆点;峰度尺度不变,价位和成交额水平被消掉;上界 n−3 有界。day_close 取最后一个有效值,K 全天常数,无前视。cross_regbeta(x, y, d) 对应 rolling_ols(x, y),即 y 对 x 的滚动斜率;种子 10 的 cross_regbeta(ts_delay(K, 1), day_sum(Ret), 241) 是今日收益对昨日 K 的斜率,与笔记一致,且 ts_delay 只向过去移。cross_corr 在窗口内无有效对时返回 0(已知行为,只在新股和停牌窗口),不是缺失,不构成问题。种子 15 的 sign(day_sum(Ret)) 在 0 处为 0,等于把平盘日屏蔽掉,是合理的方向屏蔽。没有用 ts_rank / cross_rank,nanrank_last 不适用。风险(不构成数学问题,不据此挡):K 主要由开盘与尾盘集合竞价两根的相对大小决定,上交所 2018-08 以前没有收盘集合竞价,train 最前约一年的读数混着制度差;笔记已如实写明。如果它有 alpha,最可能来自参与者结构的慢变(被拆单的机构 / 算法执行与事件性放量的占比),体现在 241 日水平或其变动上。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。16 个种子的骨架都不在库里(members.csv 核过:cross_stddev(ts_scale(day_sum(Amt) 0 条,cross_stddev(cross_corr 0 条,cross_stddev(day_durbin_watson 0 条;cs_bucket_zscore、day_centroid、day_gini、day_es_ratio_hi、day_zero_ratio、day_signed_ratio、day_wmean 都是 0 条;cross_stddev(day_ 共 133 条,但内层都不是这批算子)。与快照三个 head 的原始日度秩 |ρ|:最大的是种子 16 对 head 1(cross_sum(DW(Close), 60))的 0.665,低于 0.7 的自动划掉线,但接近;其余多在 0.47 以下(种子 1 对 head 2 为 0.47)。对控制:种子 1、2 对已知族只有 0.04,对流动性 0.01;种子 16 对流动性 0.385、对波动 0.527、对已知族 0.386,波动 0.527 略高于 0.5,但离 0.8 的硬线远,不划。扣分的地方:种子 6(day_gini)与种子 7(day_es_ratio_hi)都是成交额在分钟间集中度的 120 日标准差,两者都读同一个分布的尾部形状,秩相关可能偏高,但 gini 和上尾比不是同一个量,保留,请 PI 在第 3 轮前复算两者的秩相关。种子 1 与 2 同为成交额冲击 A 的 120 日波动,种子 2 多了一层 10 日平滑(冲击的聚集性),保留。种子 4 与 11、种子 12 与 1 是同一个量加同伴内 z 分数,与第 1 位的同伴写法一样,保留。合理度 4。逐个核算子:ts_scale(x, 30) 是 x_t 除以 30 日和(和小于 EPS 时分母置 1),A 落在 (0, 1] 且无量纲。day_centroid、day_gini、day_signed_ratio、day_wmean、day_es_ratio_hi 都有显式的 NaN 分支(分母或总量为 0 时给 NaN,不会填成 0),停牌和封板不会被当作真实的 0 读数。种子 8 的分母是两个非负标准差之和,0/0 给 NaN。cross_stddev 无除法。种子 10 的 cs_mean 是当日截面均值,只用当日收盘后已知的收益,t 日形成、t+1 交易,无前视。种子 9、10 的 cross_corr 因果,热身最多 180 日。种子 5 的 in_slice(Ret, 1, 240) 与笔记切片一致。种子 15 的 DW(Ret) 有一个笔记没写到的守卫:day_durbin_watson 在逐分钟方差 var_x < 1e-8 时给 NaN(笔记写的是分母平方和 ≤ 1e-8,那是另一道守卫)。这意味着逐分钟收益标准差低于约 1e-4 的极安静日会被剔成 NaN。正常 A 股分钟收益的标准差是 1e-3 量级,影响小,不构成数学问题,但 PI 应当知道。种子 13 的 zero_ratio 在涨停封板日接近 1,因此它的 120 日标准差主要读封板频率,机制清楚,也不是数学问题。种子 16 的 Close 除以 VWAP(day_wmean 以 |Amt| 为权)没有除以近零量。如果它有 alpha,最可能来自成交冲击的时间变动性(种子 1、2)、成交时点与集中度的稳定性(4 至 7、11)、量价与市场同步性的稳定(9、10),或收盘相对当日均价的溢价的稳定(16)。'
R:
  - head: 'ts_std(day_close(cross_decay_linear(Amt, 30)), 40)'
    soundness: 4
    reasons: '5 个变体都是对同一个 head 的部件替换:(a)(b) 把收盘棒平滑额的标准差除以全天平滑额的标准差,分子分母带同一个水平,比值无量纲,分母是正的标准差,只在全天额恒定时为 0,这种情况在覆盖率门槛里处理;(c) 对数后取标准差,log(x + 1) 对加常数不敏感,机制是成交额的对数变动性;(d)(e) 把 Amt 换成 Volume。机制上 (d)(e) 仍是「变动性」,但 Volume 的标准差仍随成交量水平同比例缩放,并没有完全去掉水平,PI 在笔记里把这点写成了「去掉价位」,实际只去掉了价位而没去掉量级。这是合理度的一个保留,不是数学问题,不扣分。整组没有数学问题,机制清楚,合理度 4。如果它有 alpha,最可能来自成交额或成交量的变动性在去掉水平之后的残余。'
  - head: 'abs_(ts_std(ts_std(day_close(cross_decay_linear(Amt, 30)), 10), 40))'
    soundness: 4
    reasons: '两个变体:(a) 收盘棒与全天的嵌套标准差之比,无量纲,分母是正的嵌套标准差;(b) Volume 版窗口 120。变体 (b) 外层的 abs_ 是 no-op,因为标准差本来非负,不影响结果,也不构成问题。嵌套窗口 10 加 120 的热身约 150 日,在 train 段内足够。机制是「水平的波动的波动」,与笔记的拆解表一致。整组没有数学问题,合理度 4。如果它有 alpha,最可能来自嵌套变动性在去掉水平之后的残余。'
summary: '两个任务位都过(a 与 b 的创新度、合理度都是 4);a 划掉种子 3(cross_med(K, 241) 与种子 1 同窗口同输入,属于同一个量),划完剩 14 个,核心 K 对各控制的 |ρ| 最大 0.23,远低于 0.8;b 无划掉,划完剩 16 个,最近的 head |ρ| 为 0.665(低于 0.7);R 两组合理度均为 4,不删。corr_1.json 的 39 行里没有非有限值,r1 审计里提到的 inf 问题本轮没有再现。自动划掉规则在本轮没有触发。两个 R 组里的 Volume 变体仍有量级缩放,是合理度的保留而不是数学问题。'
