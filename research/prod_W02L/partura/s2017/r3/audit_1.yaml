    reasons: '创新度 4。N 位的新量是 day_quantile_q25(Volume) / (day_mean(Volume)+1),即安静分钟成交底板相对当天均值的形状比;快照 head 原始 |ρ| 最大 0.31(seed 9,与 M2 的 Close 比值 head,残差 0.26),seed 1 只有 0.11。与控制:seed 1 的 liq 0.09、vol 0.17、rev 0.23、known 0.10、size 0.03。划掉的 4 个种子(2、7、10、11)与控制 |ρ| 超过 0.8:seed 2 liq 0.86 / known 0.81,seed 7 liq 0.82 / known 0.76,seed 10 liq 0.83,seed 11 liq 0.82,这是未做 z 化的水平版本,与流动性几乎是同一个量(换写法),按规则自动划掉。z 化或做差后的版本(1、3、5、6、8、9、12)与 liq 基本在 0.3 以下。seed 4(未 z 的 cross_mean(ratio,40) 再做 LogFloatCap 分桶标准化)与 liq 0.54、known 0.48,是部分流动性的换写法,但未过 0.8 的线,不单独划,只在此记录。合理度 4。数学:分母 +1 保护,对非负成交量有 mean 大于等于 0.75 乘以 q25,因此比值有界(约 4/3 以内),不会爆点;q25 对 q75 的 log 比也有界;cross_zscore、cross_mean、cross_delta、cross_semistd_pos、cross_corr 都是逐股票时间窗、无前视;cs_bucket_zscore(LogFloatCap)、cs_regres 是截面算子。机制:成交的均匀程度(分单或算法执行与脉冲式注意力的差别)是慢变的投资者结构特征,Kyle 与 Barber-Odean 一族的说法说得通,窗口(60、40、20、120 日)合理。扣分点(不挡):停牌日 Volume 为 0,比值为 0,停牌多的票同样会被推到底部,影响只在底部,与 a 位同类。如果它有 alpha,最可能来自:持续成交的票被机构慢速建仓、脉冲型的票被注意力追高后回吐,即形状而不是水平。'
