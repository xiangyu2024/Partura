  core: cross_zscore(day_quantile_q25(Volume), 60)
  hypothesis: 机制。核心是本批(B 系列 Volume 一族)共性表里富集最强的子树 cross_zscore(day_quantile_q25(Volume), 60):当天分钟成交量的 25 分位(安静分钟的成交量底板),相对自己过去 60 日历史的 z 分数,即「基础关注度 / 持续成交的底板相对自己抬升了多少」(Gervais–Kaniel–Mingelgrin 2001 的放量溢价与
    Barber–Odean 2008 的注意力一族,但读的是底板而不是总量或峰值,所以不是成交量水平 / 流动性控制)。快照事实:含它的 4–14 个候选均值差 +1.36(p 0.000),上一轮 N 位里 GP 长出的最好候选 −0.08(valid +0.15)就是它加 cross_semistd_pos;已见过的外围只有 cs_normalize 叠加、cross_semistd_pos、cross_quantile_q25,都是「单日
    z 再取半标准差 / 下分位」。这次外围全部换成库里没有的类别:(1)长窗口平滑 cross_mean / cross_ema / cross_decay_linear,把单日 z 的噪声与换手压下去(D 一族已量过平滑单调变好);(2)减去同窗口的成交额底板 z:Volume 与 Amt 之差是价格水平,留下的是「股数口径的关注度」,排除价格变动带来的成交额;(3)流通市值桶内标准化、对 5
    日波动 z 做截面回归残差:去掉小盘 / 高波动暴露而不是靠控制线性剥掉;(4)cross_tail_mean_q75 / cross_max:只看关注度抬升的上尾;(5)与当日收益的 60 日相关:底板抬升时价格是否同向(知情 vs 噪声关注);(6)与 120 日价格趋势的名次乘积、按市场 60 日趋势状态翻符号、短减长均值差 / 40 日差分:关注度变化的方向性。为什么样本外还会在:持续成交的底板抬升反映机构
    / 算法执行与基础关注度的慢变化,不依赖某段行情;慢变量换手低,15 bp 成本吃得下;Volume 的 25 分位对少数异常分钟不敏感,不像 sum 或 max 被单个脉冲主导。数学检查:z 分数有常数窗口保护;停牌日成交量为 0 时分位为 0,窗口里全 0 则 z 缺失,不是爆点;没有除以近零的量(cross_corr 在窗口常数时缺失);只用当天及以前的数据;热身最长 120 日,不主导。
