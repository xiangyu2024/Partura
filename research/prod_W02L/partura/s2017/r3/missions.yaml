- type: N
  hypothesis: 机制。快照共性表里的 Volume 底板(day_quantile_q25(Volume))是富集最强的部件,但它的水平随股票换手差异巨大。新想法:读「成交量的轮廓形状」而不是水平——安静分钟的成交量除以当天平均成交量(底板 / 均值,0 到 1 之间,尺度无关),越高说明全天成交越均匀、持续(机构 / 算法分单、VWAP 式执行),越低说明成交集中在少数脉冲分钟(彩票型
    / 事件驱动的散户脉冲);再取相对自己 60 日历史的 z 分数、40 日均值、与成交量 75 分位或成交额中位数比的变体。算子实现:div(day_quantile_q25(Volume), day_mean(Volume)+1) 等,分母是当天平均成交量加 1,停牌日为 0/1=0,不会爆点;库里骨架没有任何一条把成交量的下分位除以均值 / 上分位(库里的 day_quantile_q25
    只作为水平被 cross_zscore 使用),所以不是换写法:这个量与成交量水平的秩相关低,度量的是分布形状(Gini / 偏度的近亲,但用分位数而不是矩,对单个极端分钟稳健)。为什么样本外还会在:成交的均匀程度是执行方式与投资者结构的慢变特征(Kyle 1985 式的分单、Barber–Odean 2008 的注意力脉冲),持续成交的票被机构慢速建仓,脉冲型的票被注意力追高后回吐;慢平均
    / z 分数后换手低。最可能的失败方式:与流动性控制或两个冠军里的 Amt 族重合,残差变小;或只是换手率的另一种写法(由相关度表检验)。
  inspired_by: 第 3 轮快照共性表:day_quantile_q25(Volume) 与 cross_zscore(day_quantile_q25(Volume), 60) 的均值差 +1.01 / +1.36(p 0.000);上一轮 N 位最好 −0.08(valid +0.15)是 cross_semistd_pos(…Volume 底板 z…, 241) —— 现象是成交量的安静分钟底板有信息,没有人读它的形状(与均值
    / 上分位之比)
