- type: N
  hypothesis: '机制。价格趋势与成交活跃度的趋势一起读,而不是各读各的。B049 的拆解给的线索:价格水平单读的纯多头书两头都亏(−1.61 / −2.38),批里唯一好一点的是非单调的
    head 1;单变量的单调读法没有残差,信息如果有,应该在两个变量的交互里。


    文献依据三条:(a) Lee–Swaminathan 2000:动量与成交量一起决定后续收益,成交量高的赢家(glamour)的动量更短、之后更差,成交量低的赢家更持久;(b)
    Gervais–Kaniel–Mingelgrin 2001:成交量异常高的股票之后收益偏高(可见度溢价);(c) Llorente–Michaely–Saar–Wang
    2002:价量相关性区分投机性成交(收益延续)与对冲性成交(收益反转)。三者说的是同一件事:价格方向与成交量方向的「配对」是个股的状态,分别读两个变量的边际效应读不到它。奖励的控制(流动性、波动、20
    日反转、已知成交额族、流通市值,再加两个冠军)取的是单变量的 1 / 2 / 3 次方,里面没有「价格趋势 × 成交量趋势」的交互,控制里的成交额类是水平
    / 离散度量,也不是个股相对自己历史的成交量变化;逐日残差去掉的是控制的暴露,去不掉这个交互。


    算子怎样实现。P = cross_delta(log(day_quantile(Close)), 120 或 241):核心路径(分钟收盘价中位数)的对数涨幅,中位数不被开收盘尖峰带偏。TO
    = sub(log(add(day_quantile(Amt), 1)), LogFloatCap) = log(典型分钟成交额 ÷ 流通市值),即「典型分钟的换手率」:典型分钟取中位数,不被放量尖峰带偏;除以流通市值之后,价格水平与送转都被约掉(Amt
    是不复权的原始成交额);add(·, 1) 只是在某些票的典型分钟成交额为 0 时避免 log 缺失。六类读法:① 种子 1–4,去中心化名次的乘积 (rank(P)−½)(rank(V)−½),价格趋势与成交量趋势同向时为正;V
    分别取 TO 的 120 日变化、60 日变化、相对自己 120 日历史的 z 分数、20 日均值减 120 日均值;② 种子 5、6,名次的差与和;③ 种子
    7、8,截面回归残差(价格趋势里成交量趋势解释不了的部分,及反过来的部分);④ 种子 9、10,桶内标准化 —— Lee–Swaminathan 的设计:价格趋势在成交量趋势十分位内的
    z 分数,与成交量趋势在价格趋势十分位内的 z 分数(即价格涨跌之外的成交量异常);⑤ 种子 11–13,日度价格变化与换手(水平或变化)的 60 / 120
    日滚动相关与斜率,即 Llorente 的价量关系;⑥ 种子 14、15,单变量的 z 分数(对照,用来看交互有没有增量)与 sign(价格趋势) × z
    分数。方向由奖励在 train 里按 ±1 定,所以乘积与差各放一个。


    为什么和已有的不同:两个库 5583 条表达式里 LogFloatCap 等日频叶子、cross_zscore、cs_bucket_zscore、作用在日度对数价格上的
    cross_delta 都是 0 条,「价格趋势与换手趋势的配对」一条也没有;cs_regres 在库里有 72 条,但没有一条以换手或价格趋势作回归元;我用
    skeleton_key 把 15 个种子的骨架逐一对照过两个库的骨架集(5583 条里 5526 条能解析),没有重复。它也不是控制的换皮:控制里没有任何一个是换手趋势或价量配对;换手的变化量对流动性水平控制的相关预计低(变化量不含水平)。与
    head 的关系:head 1 是价格水平的名次(混着基期价和累计收益),这里的 P 是路径的涨幅、V 是成交量的趋势,与它的日度秩相关预计在 0.3 以下。


    为什么样本外还会在:来源是投资者类型与注意力的结构(散户追逐高成交的赢家、机构建仓期间成交量与价格同向推进),这类结构慢变、不依赖某段行情;窗口 60~241
    日,名次基于排序而不是数值,对尖峰不敏感,换手低。最可能的失败方式:(a) 换手趋势与两个冠军里的成交额族重合,残差为零;(b) 价量交互的符号在 train
    与 valid 不一致(A 股的高换手赢家在不同阶段表现不同),min 为负;(c) LogFloatCap 的更新滞后在送转 / 解禁日产生台阶,换手变化有噪声;(d)
    11–13 号滚动相关 / 斜率在 60~120 日窗口里估得吵。


    数学检查:无前视 —— 全部只用 t 日收盘及以前,cross_delta 的天数为正,t+1 才交易;数值 —— 复权价为正、log 安全;add(·,
    1) 保证 log 的输入 ≥ 1;cross_zscore 对近常数窗口有保护;cross_corr / cross_regbeta 在有效点太少时可能给
    0(只影响长期停牌的票,不是结果的主要来源);cs_regres 对 X 无方差的日子返回 Y 去均值(不会出现除零);乘积与差都由名次构成,有界,没有爆点;热身:最长
    241 日,不主导。本机用 AlphaCube 自带的合成立方体(含伪造的流通市值日频字段)把这 15 个种子都算过,都能算、没有报错;没有碰真实数据。'
