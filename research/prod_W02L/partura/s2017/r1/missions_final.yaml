- type: E
  core: day_quantile(Close)
  hypothesis: '机制。核心 C = day_quantile(Close):当天 241 根分钟收盘价的中位数,是一条不被开盘 / 尾盘尖峰带偏的稳健日度价格路径。价格字段是后复权价(规则
    §4),所以 C 的截面名次约等于「基期价 × 上市以来累计收益」,水平本身是长周期动量 / 反转与名义价的混合体。


    快照里的两条线索(都在 loc 的拆解表里,不是我的推测):(1) 水平的单调读法没有残差 alpha:day_quantile(Vwap) 方向 −1、半衰期
    5,train −1.61 / valid −2.38,与已知族 ρ +0.42,库里同一个量(day_quantile(Close))的日换手只有 0.014,所以亏的不是成本;(2)
    批里唯一好一点的 head 1 是非单调的 —— 把截面最低 10% 用截面均值替换,−2.38 变成 −0.59(valid +0.13),必要性 +1.79,Vwap
    换成 Close 几乎不变(−0.56 / +0.16)。单调读法两头亏、只做一点非单调处理就好很多,与「这条路径里的信息是有条件的」相容。这是我的假设,批里没有直接证据(本批几乎所有成员都是单调读法)。


    我要检验的条件是市场状态。文献依据:(a) Cooper–Gutierrez–Hameed 2004:动量的符号随市场状态翻,上涨市里延续、下跌市里反转;(b)
    Daniel–Moskowitz 2016:熊市之后的反弹里输家猛涨(动量崩盘),符号由市场状态决定;(c) Baker–Wurgler 2006:高情绪期里小盘
    / 高波动 / 不盈利 / 不派息的票之后跑输,低情绪期跑赢。A 股散户占比高,「追涨」与「抄底」随牛熊轮换,所以后复权价格路径的长周期变化(12 个月、6
    个月、跳过最近 20 日的 12−1)以及水平本身的预测符号,可能随市场状态翻。奖励的方向只在 train 里按 ±1 定一次:一个随状态翻符号的溢价,在固定符号下两种状态互相抵消,这正是「水平单调读法两头亏」可能藏住它的地方。注意奖励的残差是逐日取的,控制暴露每天都被去掉,所以翻符号不是在绕过控制,只是让每天选的那一侧更对。


    算子怎样实现:y = 核心路径的长周期读数(log(C) 的 cross_delta 60 / 120 / 241 日,一个跳过最近 20 日的 12−1,或
    log(C) 水平本身);g = 市场状态的原料。cs_flip_by_state(y, g)(读 ops_ext.py 源码核实过):取当天 g 的截面均值,看它在自己近
    241 日里的分位,高于中位数取 +(rank(y)−0.5)、否则取 −(rank(y)−0.5);只用尾随窗口,t 日收盘后算,t+1 才交易。g 有四种读法:①
    等权对数价格指数的水平 log(C)(种子 1、2、10),即指数处在自己一年区间的哪一半;② 指数的 120 / 60 日变化(种子 3、4、5、6、11、14),比水平少受新股上市拉低均值的影响;③
    上涨广度 = 20 日变化为正的股票占比 is_gt0(cross_delta(log(C), 20))(种子 7、8);④ 截面离散度 cs_stddev_full(cross_delta(log(C),
    20))(种子 9)。种子 12、13 用 cs_state_rank 与 select_where 在两种不同的风格之间按状态切换,而不是翻同一个信号的符号:12
    是上涨市 12 个月动量、下跌市买低水平;13 是广度高时买高水平、广度低时买 6 个月输家。种子 14 把 head 1 的「最低一档用均值替换」包在翻符号信号外面。种子
    15 是不带状态的 12 个月变化,当对照:如果它与最好的翻转种子同分,说明状态没有贡献。


    为什么和快照里见过的不同:见过的含 C 的外围算子集合是 {sigmoid, cs_quantile_q25}、{cs_rank}、{ts_max}、{ts_max,
    cross_med}、{ts_spearman}、{cross_corr, cross_delta, …}、{ts_min, …},全是对水平的单调 / 短窗口读法;这里的外围含
    cs_flip_by_state / cs_state_rank / select_where / log / 长窗口 cross_delta,没有一个与它们是同一个集合。库里
    5583 条表达式中 cs_flip_by_state、cs_state_rank、cross_zscore、日频叶子都是 0 条;含 cross_delta(day_quantile
    或 day_quantile_q75 (Vwap), 3 / 10) 的有 29 条,全是短窗口;长窗口(≥ 60 日)的 cross_delta 都作用在分钟字段(Open
    / High / Low / Volume / Amt / Ret)或 day_argmax / day_var 这类日内统计量上,没有一条作用在日度对数价格上。15
    个种子的骨架我用 skeleton_key 逐一对照过两个库能解析的表达式的骨架(5583 条里 5526 条能解析),没有重复。


    为什么样本外还会在:来源是行为与制度,不是某段行情 —— 散户追涨杀跌随牛熊轮换(CGH 2004)、熊市反弹里的高 beta 输家(DM 2016)、情绪对不同类股票的非对称影响(BW
    2006);状态变量是 120~241 日的慢变量,一年翻符号的次数很少,15 bp 的成本吃得下;y 是 60~241 日的路径变化,本身换手低。最可能的失败方式:(a)
    状态在指数位于中位数附近时来回翻,换手把分数吃掉(我预计 9 号离散度与 7、8 号广度的翻转最差);(b) train 段 2018–2023 只有 5
    年半、状态切换点太少,条件关系估不准,train 与 valid 的最优符号不一致,min 为负;(c) 12 个月变化与 20 日反转控制有相关,残差变小。


    数学检查:无前视 —— cross_delta / cross_delay 的天数都为正,状态只用尾随窗口;数值 —— 复权价为正、log 安全,cs_flip_by_state
    对状态没有定义的日子整行缺失(不是静默的「低」),取值是 ±(秩 − 0.5),没有除以近零量,没有爆点;热身 —— 最长窗口 241 日,库里单个 241
    日窗口的表达式覆盖率是 0.999,热身不主导;水平类状态在最初 241 天用不满的窗口算分位,但 y 在那段时间里本来就缺失。本机用 AlphaCube
    自带的合成立方体把这 15 个种子(以及 N 位与 R 的全部表达式)都算过,都能算、没有报错;没有碰真实数据。'
