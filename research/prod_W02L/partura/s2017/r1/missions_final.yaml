R:
- head: signedpower(cs_mask_top_replace_mean_neg(day_quantile(Vwap)))
  why: 这一组是机制检验,不是修补。head 1 的唯一承重部件是 cs_mask_top_replace_mean_neg(拆解表里去掉它 −2.38,必要性
    +1.79):它把截面最低 10% 的值换成截面算术均值。价格分布右偏,算术均值落在价格分布的中高位(我的推断,约 70 分位,没有测),所以被换掉的一档(后复权价最低
    = 上市以来跌得最惨的一批票)被放到中上位置、并列块内按列序排。变体改变这一档落在哪里和换多宽:log / sqrt / pow_2 把「均值」移到约中位
    / 中高 / 更高(变体 1–3);连用两次,最低 20% 都拉到均值(4);最高一档也换掉,价格变成纯「中间带」(5);60 日均值只降换手(6);把水平换成
    log 复权因子 = log(后复权价) − log(原始名义价)(7)、12 个月变化(8)后做同样的最低一档替换。数学:单调变换 + 截面替换,没有近零分母;无前视。预期:如果落点重要,1–3
    的分数会不同;如果「拿掉最低一档」本身才是承重的,它们几乎一样,而 4 会更好。
  variants:
  - signedpower(cs_mask_top_replace_mean_neg(log(day_quantile(Vwap))))
  - signedpower(cs_mask_top_replace_mean_neg(sqrt(day_quantile(Vwap))))
  - signedpower(cs_mask_top_replace_mean_neg(pow_2(day_quantile(Vwap))))
