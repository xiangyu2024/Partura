slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '核心 day_quantile(Close)：与 H1 原始 |ρ| 0.66、残差 0.60，与 H2/H3 不超过 0.17，与控制 liq 0.46 / known 0.42 / size 0.42，都在 E 位门槛内（核心与每个控制 < 0.8）。15 个种子与三个 head 的原始 |ρ| 最高 0.30（13 号，残差 0.36），12 号 0.26，其余多在 0.17 以下；与控制最高 0.37（15 号，liq 与 known）。没有种子触发 0.7 / 0.8 的确定性划掉。创新度 4：批内的 cs_flip_by_state、cs_state_rank、cross_zscore、LogFloatCap 在 struct/members.csv 的 5583 条里都是 0 条，cross_delta(log(day_quantile(...))) 也是 0 条（已核对）；这些种子的核心是市场状态翻转符号，不是 H1 的水平读法。合理度 4：逐个算子对源码核对（ops_ext.py、nd_cs.py、common.py）。cs_flip_by_state 取当天 g 的截面均值，在自身 241 日里的分位高于 0.5 取正号、否则取负号，y 取截面分位减 0.5，状态无定义时整行 NaN；cs_state_rank 是同一个市场量的分位，对所有股票相同；rolling_windows 左补 NaN，窗口只含 t 及以前，没有前视；cs_mask_top_replace_mean_neg 确实把最低 10% 换成行均值；log 有 EPS 保护，day_quantile(Close) 为正，没有除零或爆点。机制：动量符号随牛熊翻转（Cooper-Gutierrez-Hameed 2004；Daniel-Moskowitz 2016 的崩盘后输家反弹），下跌市取低 y 的方向与 DM 一致。需要写清的三点，都不构成挡的理由：(a) 241 日窗口的覆盖约 0.85（热身约 15%），表格的「废品」标签来自覆盖门槛，不是数学问题，热身占比不主导结果；(b) 状态分位在前 240 个交易日用的是扩张窗口（_trailing_rank 只数有限值），PI 笔记说 y 在那段时间缺失，这只对 y 本身是 241 日窗口的种子（1、3、5、7、12、14、15）成立；2、4、6、8、9、10、11 的 y 在 2018 年已有值，翻转会用短历史分位；(c) 状态是等权截面均值，会被新股与退市的组成变化带动，PI 也注意到了（它说 120 日变化比水平少受影响），这是机制上的弱点，不是数学问题。如果它有 alpha，最可能来自 12 个月动量在市场状态之间的符号切换（下跌、低位时做反转），而不是水平本身。'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: [11, 12]
    reasons: '创新度 4：保留的种子与三个 head 的原始 |ρ| 都不超过 0.12，残差在 0.05 以内；与控制最高 0.38（14 号，与 20 日反转），6 号 0.37（vol、rev、known），其余多在 0.3 以下，不是控制换皮。库里 LogFloatCap、FloatCap、cross_delta(log(day_quantile(...))) 都是 0 条；库里只有 6 条 day_quantile(Amt)，都不除以流通市值，其中只有一条是 cross_delta(pow_2_5(day_quantile(Amt)), 5)。价格趋势与换手趋势的配对是新结构。合理度 3：机制说得通（Lee-Swaminathan 2000 的动量与成交量；Llorente 等 2002 的价量相关）。数学问题在 TO 的定义上：log(add(day_quantile(Amt), 1)) 并不是「避免 NaN」。典型分钟成交额为 0 的日子（一字板或零成交）会得到 log(1)=0，比正常值低约 9 到 12 个对数单位，而且它不是缺失，是一个爆点。这个爆点在窗口统计量里会支配结果：11 号（60 日 corr，TO 水平含爆点）与 12 号（120 日 corr，ΔTO1 含两个爆点，一个在当天、一个在次日）。按零成交股票日占比约 0.1% 估计（未核实，数据在远端 store），12 号的极端十分位约 60% 由爆点决定，11 号约 30%，两者划掉。其余种子的影响如下。1、2、3、5、6、9 只在端点的秩上受影响，每个事件只影响 2 个交易日，极端十分位污染约 2%，保留。7、8、10 是截面回归或桶内 z，每天只有少数爆点，污染约 2%，保留。14、15、3 的 120 日 z 分母被抬高，受影响股票被压到中间，不占极端，保留。4 号（20 日均值之差）的受影响股票进入底部十分位，约 10% 到 20%，保留但列为观察。13 号（120 日滚动斜率）的分母被一个事件主导，但斜率落在正常范围中段，保留但列为观察。2、3 号的「废品」标签来自 241 日窗口覆盖约 0.85，不划。若 train 段零成交股票日占比低于约 0.05%，11、12 可以救回。如果它有 alpha，最可能来自价格趋势与换手趋势的名次配对（1、2、5、6 最直接）：放量上涨的赢家延续、放量下跌的输家反转。'
R:
  - head: 'signedpower(cs_mask_top_replace_mean_neg(day_quantile(Vwap)))'
    soundness: 4
    reasons: '8 个变体都是 H1 的合法算子组合，没有数学问题（signedpower 对正值与负的对数值都保序；mask 与 log 都没有除零）。它们是同一个检验的放置与宽度变化：1 到 3 把被换的最低 10% 的「均值」放在对数均值、平方根均值、平方均值的位置。对数正态下算术均值的分位约为 Φ(σ/2)，σ 取 0.7 到 1 时是 64 到 69 分位，与 PI 说的约 70 分位一致（这是我的推算，没有在截面上量）。4 连用两次，把最低 20% 换掉；5 再换最高 10%；6 用 60 日均值；7 是 log(后复权价) - (log 流通市值 - log 流通股本) = log(复权因子) + 日内 VWAP 偏差，跨股票的分散主要来自复权因子（HANDOFF 的换手率定义把流通市值当分母，所以流通市值是未复权的，这一点成立）；8 是 241 日变化，覆盖约 0.85，属于热身，不挡。变体 1 到 3、5、6 与原 head 的原始 |ρ| 都在 0.94 以上，它们本来就是放置检验；R 只评合理度，不因此挡。如果 head 1 的分数有来源，最可能是「最低一档被拿出尾部」本身，变体 4 最能分开「拿出」与「放在哪里」。'
  - head: 'cs_rank(day_quantile(Ret))'
    soundness: 4
    reasons: '4 个变体都是 day_quantile(Ret) 的平滑（60 日均值、241 日均值、60 日 EMA、120 日符号均值），都是线性或有界的操作，没有数学问题；cross_ema 与 cross_mean 都是因果的。变体 1、2、4 的截面不同值占比分别为 0.29、0.49、0.04，多数股票并列，列序打破是允许的（§4），所以这些变体测的部分是板块序；变体 3（EMA，不同值占比 0.75）是最干净的检验。变体 1、2 与原 head 2 的原始 |ρ| 只有 0.02 到 0.04（残差 0.06 到 0.08），与流动性控制约 0.4，即它们在 liq 与 known 上有暴露，但去掉控制后与原 head 仍然不同。合理度 4：机制清楚（并列板块序对方向频率），检验设计对，241 日窗口的覆盖为 0.999，热身不主导。如果 head 2 的分数有来源，最可能是方向频率（变体 3、4）而不是板块序；如果平滑后分数变差，说明它靠的是并列。'
summary: '槽 a 通过（4/4，不划）；槽 b 通过（4/3，划掉 11、12，余 13 个）；两个 R 组都通过（4/4）；唯一需要 PI 核实的是 TO 的 add(·, 1) 地板，把零成交股票日的值换成 NaN 或截去地板并量出 train 段的占比，它决定 11、12 能否救回，也决定 4 与 13 是否要划。'
