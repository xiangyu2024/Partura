  hypothesis: 机制。核心 D 是库里手写族(B050)的一个成员:当天所有「5 分钟涨幅超过当天 1 分钟收益 95 分位」的分钟里,这些超额 5 分钟涨幅的平均大小,再除以当天
    1 分钟收益 95 分位本身,即「向上尾部跳跃的幅度,以当天正常波动为单位」。快照里的事实(loc 拆解表):D 单读 −0.79(train −0.79
    / valid −0.66);最后一次除以 q95 是承重部件(去掉它 −4.22,必要性 +3.43),说明信息在「跳跃相对波动」而不在跳跃的绝对大小;同一个量加
    20 日平均 −0.42(valid +0.12)、40 日平均 −0.21(train +0.07),分数随平滑单调变好,说明 D 单日读数噪声大、信号在慢变量里。已见过的含
    D 的外围只有 {ts_mean}、{rank, create_valid_mask, abs_}。这次的外围全部是库里没有的:日轴 cross_mean
    / cross_ema 长窗口平滑(60 / 120 日,比见过的更长),cross_zscore(相对自己 120 日历史的跳跃惊异)、短长均值之差(跳跃强度的变化)、cs_bucket_zscore
    / cs_regres(在流通市值桶内读,而不是靠市值控制线性去掉)、与 120 日价格趋势的名次乘积(跳跃 × 动量)、cs_flip_by_state(随市场
    60 日趋势状态翻符号)、cross_quantile 下分位(只看稳定的跳跃)、cross_corr 与成交量(跳跃伴随放量的程度)。为什么样本外还会在:向上尾部的跳跃强度是慢变的个股特征(彩票型
    / 事件驱动 / 知情交易的足迹,Bali–Cakici–Whitelaw 2011 的 MAX 效应与 Amaya et al. 2015 的已实现偏度属于同一族),长窗口平滑把单日噪声与换手压下去,15
    bp 成本吃得下;相对 q95 的归一化把波动水平约掉,所以与波动控制的重合小。数学检查:分母都有 1e-06 保护,分子是有界和;未用任何未来数据;cross_zscore
    / bucket 对常数窗口有保护;热身最长 240 日,不主导。
