  hypothesis: 机制。B050 的 D 只用「跳跃有多大」,没有用「跳跃发生时成交了多少」。新想法:当天成交额里有多大比例是在向上尾部 5 分钟涨幅(超过当天
    1 分钟收益 95 分位)的分钟里成交的,与向下尾部(5 分钟跌幅低于 5 分位)对应的比例相减——即「跳跃里的资金参与度」,区分有知情资金推动的跳跃(放量,Easley–O'Hara
    类信息成交)与稀薄盘口里的价格跳动(缩量,之后回吐)。算子:div(day_sum(select_where(cond, Amt, 0)), day_sum(Amt)+1),取值
    [0,1],分母不近零,没有爆点;cond 是库里手写族用的同一类「5 分钟涨幅 > 当天 q95」,但库里没有一条把它当成交额权重的筛子(库里的 select_where
    取的都是涨幅本身),所以骨架不同,度量的对象也不同:不是尾部有多大,而是尾部上的成交额占比。再用 cross_mean 40 / 60 日平滑、cross_zscore(相对自己历史的惊异)、涨跌两侧相减、成交量版本、桶内标准化、与
    120 日价格趋势交互做外围。为什么样本外会在:资金参与度反映的是知情交易 / 机构建仓的结构,不依赖某段行情;慢平均后换手低。最可能的失败方式:与成交额控制与两个冠军里的
    Amt 族重合,残差变小;涨跌两侧在 train 与 valid 符号不一致。
  inspired_by: B050(第 2 批,手写库 div(div(day_sum(select_where(is_gt(5 分钟涨幅, 当天 q95)…))))
