attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [1, 3, 6, 9]
    reasons: '位 a 是 E 深挖,核心 = B050 head 本身(相关度表 |ρ| 1.00 对 head 1)。规则允许整个 head 作核心。核心对 5 个控制的 |ρ| 最大 0.10(liq),远低于 0.8。外围全部是 cross_* 日轴平滑 / 标准化,或 cs_* 截面变换(cs_bucket_zscore 按 LogFloatCap 分桶、cs_regres、cs_flip_by_state、cross_corr 与 Volume、cs_mask_top_replace_mean_neg、cross_quantile 等)。划掉的种子:(1) cross_mean(core,60),与 head 2 的 |ρ| 0.734,≥0.7;另外 cross_mean 与 ts_mean 在日轴都是 rolling_reduce(nanmean) axis=0(dt_cross.py:223、nd_ts.py:147),它和本轮 R 变体 2 (ts_mean 60) 是同一函数,属于重复。(3) cross_zscore(core,120),与 rank(core) head 的原始 |ρ| 0.796,≥0.7。(6) cs_regres(cross_mean(core,40), LogFloatCap),与市值的原始 |ρ| 0.795(接近 0.8 线),同时与 liq 0.62、known 0.63 也高。残差按定义对当天的 X 截面正交,秩相关却接近 0.8,说明 OLS 斜率被核心截面尾部的极端值带偏,残差实际上是市值 / 流动性的单调函数,属于数值伪影,划掉。(9) cross_quantile(core, 120, 0.25) 算不出:dt_cross.py:212 的签名是 cross_quantile(x, q, d),这里 q=120、d=int(0.25)=0,参数顺序反了(正确写法应为 (core, 0.25, 120),PI 可以另行提交,这次不救)。剩 2、4、5、7、8、10、11、12、13、14、15 共 11 个。创新度给 3 而非 4:长窗口平滑是 head 2 (ts_mean 20) 与 R 变体 (ts_mean / cross_ema 40、60、120) 同一维度的延伸;真正新的外围是 cs_flip_by_state、按规模分桶、截面回归、与成交量的相关、截面分位数这些结构。合理度给 3:机制清楚,逐个算子核对未发现实现错误,窗口不长于 240 日,无前视。但有一个未经数据验证的数值风险,这里不划,只提醒 PI:核心最后一步除以 (q95 + 1e-6)。限涨停锁死的票上 q95 可以恰为 0,那时当天值约等于 分子 / 1e-6,是爆点;PI 自己的拆解里去掉最后这个 /q95 损失 4.22,说明信号正压在这个分母上。如果这类票占比不小,而 40 至 240 日的均值又把爆点留在窗口里,那么分数可能主要来自「近期涨停锁死」这一个事件,而不是跳跃幅度本身。在 GP 之前需要先量一下 q95 < 1e-4 的 stock-day 占比,以及这些票在均值里的份额。如果它有 alpha,最可能来自:向上尾部跳跃的相对幅度作为慢变的个股特征(彩票型 / 知情交易足迹,与 MAX 效应、已实现偏度同族),或者涨停锁死事件本身;不太可能来自流动性(liq 最大 0.28)。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [6, 12]
    reasons: '位 b 是 N 新想法:成交额(Amt)加权的向上尾部分钟占比 U = day_sum(select_where(5 分钟涨幅 > 当天 q95, Amt, 0)) / (day_sum(Amt) + 1),取值在 [0,1],与对应的下尾占比相减(种子 3、9)或单独使用(种子 1、2、5 等)。相关度表:最像的 head 是 ts_mean(core,20),种子 1 原始 |ρ| 0.29、残差 0.22,说明去掉控制后大部分与 head 不重合;控制 liq 0.39、known 0.39、vol 0.34,均低于 0.5 的控制变量线。创新度 4:它度量的是跳跃分钟里的成交占比(资金参与度),不是跳跃幅度,库里没有把 Amt 当权重的表达式。注意种子 4(Volume 版,vol |ρ| 0.505)与种子 8(vol 0.486)贴着 0.5 线,不划,但 PI 应留意它们是否只是波动率的换写。合理度 4:分母是当天总成交额加 1 元,没有近零除数,不存在 slot a 那种 q95 爆点;cond 只做比较不做除法;select_where、day_sum、cross_mean、cs_bucket_zscore、cs_rank 逐个核对无误;无前视。种子 9 的 (U−L)/(U+L+0.01) 有界。需要 PI 核对的一点(我只读了注释、未核实数据):停牌格上 Amt 必须是 NaN,由引擎掩码给出;若它是 0,U 会变成 0/1=0,把停牌多的票系统性推到低端,这和 §4 的 nanrank_last 陷阱是同一类问题。store.py 的注释说引擎在算子之前做掩码,所以这里放行。如果它有 alpha,最可能来自:知情资金或机构在大幅跳跃时的参与程度(Easley–O''Hara 类信息成交),与 head 的「跳跃幅度」互补。最可能的失败方式是它只是换了权重的流动性(liq 0.39)。划掉的种子:(6) cs_rank(cross_mean(U,40)),与种子 1 的日度秩完全相同(cs_rank 是逐日的单调变换,§1 规定按截面排名后的信号一致),重复。(12) cross_mean(Amt 加权收益差,40),liq 0.941、known 0.943,≥0.8,几乎就是流动性控制。剩 1、2、3、4、5、7、8、9、10、11 共 10 个。'
R:
  - head: 'ts_mean(div(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20)'
    soundness: 3
    reasons: 'R 组是 head 2 (ts_mean 20) 的去部件 / 换分母与换窗口变体,只评合理度。数学上每个变体都是均值加带 1e-06 保护的除法,无前视,窗口 120 日以内。不过分母是 q95、q90、q99 或 day_std(Ret) 之一,存在和 slot a 同样的爆点风险:限涨停锁死的票 q95 或日内标准差可以为 0,此时值约等于 分子 / 1e-6。变体 6 用日内标准差作分母,停牌或锁死日同样会爆。这不是已确认的数学错误,也没有证据说它主导了结果,所以给 3,不压到 2。变体 2 (ts_mean 60) 与 slot a 种子 1 是同一函数(cross_mean 与 ts_mean 在日轴等价),属于重复,两处只需保留一个。变体 2 与原 head 的 |ρ| 0.73,若它的 score 达到原 head + 0.1 且 |ρ| < 0.5 才会被考虑;按规则,≥0.5 时作为替换,PI 不要因此把它当成新的收录。'
summary: '位 a(E,核心为 B050 head 本身):创新 3、合理 3,划掉 1、3、6、9 后剩 11 个,通过。位 b(N,成交额加权的尾部占比):创新 4、合理 4,划掉 6、12 后剩 10 个,通过。R 组合理 3,保留。主要风险:核心和 R 组共用的除以 q95 / std(+1e-6) 分母,在限涨停锁死的票上可能爆点,请 PI 在 GP 之前量一下 q95 近零的 stock-day 占比及其在 40 至 240 日均值里的份额。'
