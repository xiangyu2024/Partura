    reasons: '创新度 4:核心 C = cross_corr(day_flat_ratio(Vwap), day_sum(Ret), 60) 在 corr_1 中与快照 9 个 head 的原始 |ρ| 最大 0.26(最像 ts_mean(mul(log(add(log(add(day_last(Volume), day_std(Vwap))), day_std(Vwap))), ts_hurst(day_last(Volume), 20)), 50)),残差最大 0.14;与 5 个控制最大 0.20(known),控制换写法的嫌疑低。快照里的 head 全是 Hurst、Volume/Vwap 协方差、分位与水平的组合,没有一个读 Ret 与价格黏性的日度时序相关。外围 12 个种子与 head 的最大 |ρ| 为 0.39(种子 8),与 5 个控制的最大 |ρ| 为 0.59(种子 8 对 liq)、0.58(种子 8 对 known),其余都在 0.5 以下。种子 8 是 C 减去 C_amt,最像控制,但未到 0.8 的自动划门槛,保留。种子 1、2、3、12 是对同一条日序列 C 的平滑或标准化(cross_zscore 120、cross_ema 20、ts_mean 20、减 120 日均值),彼此高度相关,这是写法选择,相关表不含种子间相关,无法直接核对,不划。如果它有 alpha,最可能来自一字板与涨跌停锁定日的方向(见下条),其次才是稀疏成交的价格黏性。合理度 4:没有数学问题。无前视:只用 cross_delay 与当天收盘及以前的量,没有 cross_shift、ts_shift、in_local_mean、in_shift;没有 nt_* 与 ts_spearman。cross_corr 在窗口内某一方常数时返回 0(rolling_pair_reduce 的 cov/(sqrt(varx*vary)+EPS)),计划说「被可交易掩码排除」这一条我无法核对,但没有迹象表明它主导结果。cs_bucket_zscore 与 cs_bucket_demean 按当日十分位分桶(ops_ext.py 的 _buckets / _pct_rank),对 LogFloatCap、ListAge 是正确的分桶。LimitWidth 只有三个取值,并列按列序打破(规则允许),所以「同涨跌停板块内比」的桶实际是按列序切的近似板块,只需在说明里写清,不算问题。机制需要修正:day_flat_ratio(Vwap) 在一字板或全天锁定的日子接近 1,而这些日子的 day_sum(Ret) 恰是涨停或跌停幅度,所以 C 很大程度上在读「涨跌停锁定日的方向与频率」,不只是稀疏成交的价格延迟。计划的机制里没有区分这两者,外围应当能拆开它们。'
