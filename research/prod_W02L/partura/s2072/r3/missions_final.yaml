- type: N
  hypothesis: 机制:价格对"自己上一日信息"的反应延迟(Lo-MacKinlay 1990 的收益自相关与交叉自相关;Hou-Moskowitz 2005
    的价格延迟:反应慢的票,当日收益能被前几日信息预测)。 对每只票用最近 60 到 120 个交易日的日度收益,度量"当日收益与前一日(或前二日)收益 / 前一日成交额变化"的相关或回归斜率:相关为正
    = 信息进入价格是渐进的(动量式延迟), 为负 = 过度反应后回吐(Roll 1984 买卖价差反弹、流动性冲击回吐)。这是一个无量纲、有界的"价格动力学"读数,不是收益水平也不是波动水平,所以对已去掉的
    5 个控制(流动性、波动、20 日反转、成交额族、市值)线性 / 非线性暴露后还能剩下东西的机会比水平类大;与 C 类(分钟均价不动占比)的区别:这里读的是日轴上
    收益自身的时序结构,不依赖分钟离散。算子怎样实现:cross_corr(day_sum(Ret), cross_delay(day_sum(Ret), 1),
    60) 是一阶自相关; cross_regbeta(day_sum(Ret), cross_delay(day_sum(Ret), 1), 120) 是更长窗口的自回归斜率;cross_corr(day_sum(Ret),
    cross_delay(day_sum(Amt), 1), 60) 是"前日成交额→今日收益"的领先滞后(量价延迟);cross_corr(day_open(Ret),
    day_sum(Ret), 60) 是开盘一分钟走势对全天的延续性;再配合 LimitWidth / LogFloatCap 桶内标准化、 cross_zscore
    与自身历史对照。为什么与已有的不同:本批 9 个 head 全是 Vwap/High 的截面协方差、Hurst、分位数与对数水平的组合,没有一个读"日度收益与自身滞后的时序结构";
    收益的滞后相关与 Hurst(量 R/S 的序列持续性)也不是同一个量。风险:一阶自相关与 20 日反转控制可能中度相关(反转的短窗口版),桶内标准化与二阶滞后(cross_delay
    2)是为了拆开。 为什么样本外还会在:价格延迟来自信息扩散与做市库存的慢变结构,不依赖某段行情;60 到 120 日估计窗口使名次变化慢,15 bp 成本吃得下。
