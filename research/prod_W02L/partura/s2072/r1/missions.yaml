  - type: N
    hypothesis: |-
      机制:成交量在一天里的"时间形状"——成交重心在开盘还是收盘(day_centroid(Volume),0 = 全在开盘、1 = 全在收盘)、成交集中度(day_gini(Volume),0 = 匀摊、1 = 几分钟装下全天)。直觉(Admati-Pfleiderer 的日内成交量集中;Jain-Joh 1988 的日内量形状):知情或机构大单不会匀摊,常压在开盘价发现和尾盘;重心偏晚 / 集中度高的票是"有一次性事件冲击或尾盘行为"的票,重心靠前的是隔夜信息被开盘消化的票。两个量都无量纲、有界,只读分钟轴上的"何时",与成交额水平、波动水平、市值几乎无关,和已知的 day_last(Volume) 水平链也不同(那读的是最后一分钟的量水平,这里读的是整条分钟曲线的形状)。每天取一次噪声大,所以在日轴取 20 到 120 日聚合或用自己 120 日的 z 分数,让换手低。
      算子怎么实现:day_centroid(Volume)(Partura 后加的算子,库里没有)、day_gini(Volume);变体:用 Amt 代替 Volume;重心之差 sub(day_centroid(Volume), day_centroid(abs_(Ret))) = 成交相对波动偏早还是偏晚(量价时间错位:成交跟着价格走还是价格后于成交);集中度对波动的 cs_regres 残差;流通市值十分位内标准化;当日重心相对自己 60 日均值的偏离。
      批里的启发:本批 3 个 head 全是 day_last(Volume)(收盘一分钟的量)与 ts_hurst 的组合,且都亏;说明读"量分布的某一个点"本身已经被水平吃掉,而读完整曲线的形状是未见过的一块。head 3 里的 in_max(Ret) 与 day_quantile 也说明分钟内的分布位置信息被批里关心,但都是价格侧,量侧的时间形状没人试过。
      为什么与已有的不同:骨架 cross_mean(day_centroid(F), d) / cross_mean(day_gini(F), d) / sub(day_centroid(Volume), day_centroid(abs_(Ret))) 不在两个库的 5583 个骨架里(day_centroid、day_gini 是 Partura 后加的);库里最近的是 day_last / day_open(取某一个分钟点)与 day_std / day_skew 类(位置无关的离散度),它们都丢掉了"何时"这个信息。
      为什么样本外还会在:成交时间形状是个股由投资者结构(散户占比、机构占比、指数成分)决定的慢变指纹,不依赖某段行情;慢聚合让 15 bp 成本吃得下;文献方向稳定(尾盘量集中与机构再平衡、信息交易时间选择)。风险:被已知成交额族或流动性控制吃掉(集中度与换手相关);桶内标准化和残差就是为此。
      数学检查:day_centroid 与 day_gini 在整天无成交时为 NaN 不是无穷;分母 sum|x| 钳到 1e-30;取值在 [0, 1] 内没有爆点;sub 两个重心都在 [0, 1];无前视:只用 t 日收盘及以前的分钟数据,t+1 交易;最长窗口 120 日,热身期不主导。
    inspired_by: 'B 批 3 个 head 全是 day_last(Volume)(收盘一分钟量)× ts_hurst 且全亏;读量分布的单个点被水平吃掉,整条分钟曲线的时间形状(重心 / 集中度)是未见过的一块。'
