  - type: E
    core: 'ts_hurst(day_last(Volume), 20)'
    hypothesis: |-
      机制:核心 C = ts_hurst(day_last(Volume), 20) 是"每天最后一分钟成交股数"这条日序列在 20 日窗口里的 Hurst 指数(持续性):大 = 收盘集合竞价量这个行为本身有记忆(同一批尾盘参与者——指数 / 被动再平衡、尾盘规避隔夜风险的机构——反复出现),小 = 每天独立、随机。它是无量纲的"形状"读数,水平被 Hurst 的 R/S 规范化除掉,所以与流动性、成交额水平这些水平型控制天然不共线。依据在本批:3 个 head 都是 ts_mean(mul(log(add(day_last(Volume), day_std(Vwap))), ts_hurst(...)), 50) 的变体,拆解里 ts_hurst(...) 单独当信号时是 head 里最好的部分(-0.78 / -0.78 / -1.25,sufficiency 行),而外面的 log(add(Volume, 日内 Vwap 波动)) 水平项是拖累(去掉它 knockout 后 head 1 的必要性为正、水平子树自己 -1.6),也就是 alpha 的候选来源在 Hurst 这一块,不在水平乘子和 ts_mean@50 平滑。三个 head 全亏,说明已见过的外围(mul 水平、ts_mean 50 日)错了,而不是 Hurst 没东西。
      这次要试的外围(全部是本批没见过的写法):(a) 慢聚合与自身历史对照:cross_mean(C, 60)、cross_zscore(C, 120)、C 的 10 日均值除以 120 日均值——持续性本身的变化,而非水平;(b) 流通市值十分位内标准化 cs_bucket_zscore(·, LogFloatCap)——去掉大小盘混在 Hurst 里的差异;(c) 差:C 减去收益的 Hurst(ts_hurst(day_sum(Ret), 20)),即"量的记忆比价格的记忆强多少",把共同的采样噪声消掉;(d) C 对成交额的 Hurst 做 cs_regres 残差(去掉量/额共有的部分);(e) C 乘 20 日趋势的符号:有记忆的尾盘量 × 已有趋势方向 = 趋势里有人持续建仓。
      为什么与已有的不同:本批所有含 C 的外围是 {mul, log, add, day_std(Vwap), ts_mean} 的组合;种子用 cross_zscore / cs_bucket_zscore / cs_regres / 差 / 符号门,不含 mul(log(add(Volume, day_std(Vwap)))) 水平项,也不含 ts_mean@50。库禁令会再拒绝骨架重复的。
      为什么样本外还会在:Hurst 窗口 20 日再叠 60 到 120 日聚合,名次变化慢,15 bp 成本吃得下;机制是参与者构成的结构属性(谁在收盘集合竞价里反复出现),不依赖某段行情;若被已知成交额族吃掉就不会出 head,下一轮不再押这个核心。
      数学检查:Volume >= 0,最后一分钟无成交时该日为 0,20 日窗口全为常数时 Hurst 为 NaN 或固定值(涨停 / 停牌票,已被可交易掩码排除,不是结果的主要来源);cross_zscore 对近常数窗口有保护;差与残差都是有界量,没有除以近零的爆点。无前视:只用 t 日收盘及以前,t+1 交易;最长窗口 120 日,热身期不主导。
