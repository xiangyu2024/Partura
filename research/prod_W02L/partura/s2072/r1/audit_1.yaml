    reasons: '核心 ts_hurst(day_last(Volume),20) 在 head 1 中直接作为子树出现(head 2、3 只含相近的 Hurst 变体, 不是同一个核心); 核心与 head 1 的原始 |ρ| 0.37、残差 0.35, 与 5 个控制的 |ρ| 全部低于 0.18(liq 0.097, vol 0.173, rev 0.080, known 0.117, size 0.094), 满足 E 位核心与控制 < 0.8 的要求。创新度 3: 核心本身是 head 内部的一段, 新的部分在外层(横截面 z 分数、桶内标准化、与收益 Hurst 之差、回归残差、符号门、短长均值之比), 这些外层并不是库里的 head, 但 12 个种子里有 5 个与 head 的原始 |ρ| 在 0.61–0.77 之间(种子 1 为 0.766, 种子 9 为 0.644, 种子 12 为 0.630, 种子 3 为 0.666, 种子 5 为 0.606), 说明多数外层改动没有把信号移开 head。合理度 3: 公式没有数学问题, ts_hurst 在 20 日窗口上有 s_d 与 NaN 保护, 最长窗口 120 日, 热身期不主导, 无前视(t 日收盘后计算、t+1 交易); 但 log(R/S)/log(20) 是 20 个点上的粗糙估计, 偏差与噪声都大, 「记忆」的解释没有验证; 更可能测到的是最后一分钟成交量序列的尖峰程度。种子 12 的 abs_(sub(H,0.5)) 以 0.5 为中心, 在这个估计量下 0.5 不一定是随机游走的值, 距离的中心不清楚。划掉: 种子 1 (与 head 1 的原始 |ρ| 0.766 ≥ 0.7, 按库禁令自动划掉); 其余 11 个保留, 划完还剩 11 个 ≥ 4。如果它有 alpha, 最可能来自收盘一分钟成交量的尖峰程度与收盘集合竞价量占比的时变结构(尾盘参与者构成), 而不是 Hurst 本身的序列记忆。'
