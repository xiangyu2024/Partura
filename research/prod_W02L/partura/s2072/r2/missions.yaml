  hypothesis: '机制:核心 C = day_quantile_q25(Low) 是每天分钟最低价序列的 25% 分位(日内价格区间的下沿水平,后复权价格)。本批证据:含 C 的 19 个候选平均 -1.23 对不含 -2.01(均值差 +0.79,p 0.001,本批共性表第一名),上一轮 N 位唯一接近过线的两个候选(-0.20 / valid +0.32,-0.65)都含 pow_05(C),且是 head 之外外围最不一样的 cross_regbeta;说明 C 这一块是本批里最值得深挖的来源。解读:后复权价格水平在股票之间的排序约等于基期以来的累计收益(长周期动量 / 反转),下沿分位比收盘更抗尾盘噪声;控制里只有 20 日反转与市值,没有"数年尺度的价格位置",所以对控制取残差后可能还剩东西。
    这次要试的外围(与本批已见的 pow_05 / div(·,-1) / cs_last_low20 / cross_regbeta(·,·,30) 写法都不同):(a) 去掉自身慢变水平只留动态:cross_zscore(C,120)、C 减自己 120 日均值再 EMA;(b) 标度无关的区间深度 div(C, day_mean(Vwap)) = 下沿相对均价的位置,去掉绝对价格水平只读日内下探深度;(c) 同一市值十分位内 / 同一涨跌幅板块 LimitWidth 内标准化(cs_bucket_zscore、cs_bucket_demean)——价格水平在不同板块里含义不同;(d) 对 LogFloatCap 的截面回归残差 cs_regres,去掉大小盘;(e) C 序列的 Hurst 与下尾均值(ts_hurst(C,20)、cross_tail_mean_q25)——价格下沿的持续性与最差一段的水平;(f) 与成交额的时间序列相关 cross_corr(C, day_sum(Amt), 60) = 价格下沿抬升时是否放量。
    为什么与以前不同:本批含 C 的外围是 {pow_05, div(·,-1), cs_last_low20, cross_regbeta@30, cs_first_low40} 的组合,种子用 zscore / 慢均值差 / 比值 / 桶内标准化 / Hurst / 下尾均值 / 时序相关,不含上述任何一个外围算子组合。库禁令还会拒绝骨架重复的。
    为什么样本外还会在:机制是价格位置 / 下探深度这类慢变结构属性(累计收益、价位对应的投资者结构与最小变动价位),120 日量级聚合后名次变化慢,15 bp 成本吃得下;不依赖某段行情。风险:被 20 日反转与市值控制吃掉,残差化与桶内标准化就是为此;若 valid 仍为负则下轮不再押该核心。
    数学检查:Low > 0 且是后复权价格,分位数不会溢出;div(C, day_mean(Vwap)) 分母为正价格,不是近零量;cross_zscore 有 EPS 保护;无前视:只用 t 日收盘及以前,t+1 交易;最长窗口 120 日,热身期不主导。'
