    hypothesis: '核心 C = cross_delay(day_at_max_ratio(Close),1):昨天收盘价等于当日最高(收盘价)的分钟占比,即昨天『一直封在/贴着日内高位』的程度(取昨日值,无前视)。证据:本批共性表里 C 的子树富集(含 C 的 30 个候选均值 -1.23 对 -1.84,p 0.009),上一轮 N 位 cross_mean(mul(C, 当日涨幅),120) 是本组目前最好的 +0.27(train +0.28 / valid +0.27,两段同号,未到 0.5)。机制:C×当日涨幅 = 『昨天收得强、今天继续涨』的延续强度,在 A 股读的是封板 / 强势收盘后的次日接力(涨停追逐)与游资接力的持续性。上次的外围只有 cross_mean(mul(C, 涨幅),120) 这一种写法,这次换成:(1) cross_corr / cross_cov 把它写成 C 与当日涨幅的 120 日截面时序相关 / 协方差(读的是个股自己『强收盘之后是否接力』的响应系数,而不是均值);(2) 把当日涨幅拆成隔夜跳空(day_first(Open)/昨收-1)与日内收益(涨幅-跳空),看接力发生在集合竞价还是盘中(A 股隔夜与日内行为方向常相反);(3) 用 LimitWidth / LogFloatCap 桶内去均值,同板块同市值票里比较;(4) 20 日对 120 日的变化、尾部均值、除以 60 日波动的标准化与成交额加权。和库里不同:库里 5583 条骨架没有 day_at_max_ratio 乘跳空 / 相关的写法,已出的含 C 候选全是 cross_mean(mul(C,涨幅),120) 一族。样本外为什么还在:涨跌停制度与散户接力是结构性行为,120 日慢变量换手低,15 bp 影响小。算子全是 day_*压日值再用 cross_* 尾随窗口,没有前视;除数 cross_stddev 为 60 日波动(正常日 >0,零则缺失),不是近零爆点;day_at_max_ratio 用 Close 的分钟占比,没用 ts_rank / cross_rank,避开停牌 0 值。最可能的失败:C 的水平与流动性 / 反转控制相关被吃掉。'
