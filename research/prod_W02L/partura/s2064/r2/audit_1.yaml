    reasons: '核心 X = day_max(High)/ts_delay(day_last(Close),1)(当日最高价 / 昨收,出现在 loc.md 共性表第 22 行与核心卡第 89 行)。相关度表:核心与快照 head 的原始 |ρ| 最大 0.51(与 day_durbin_watson(nt_ts_max(...)) 那条),残差 0.67;与 5 个控制最大 0.24,远低于 0.8。种子 1–12 与 head 的原始 |ρ| 在 0.05–0.65 之间,均低于 0.7 的自动划线门槛;与控制最大为种子 2 的 0.69(波动),低于 0.8。创新度给 3 而不是 1:X 是日内冲高的单一日值,而 head 是上行分钟的 pow_2_5(Ret) 方差(torch.pow 对负底数给 NaN,已在 common.py 核对,只读上涨分钟),两者同属上行尾部一大类,但不是同一个量,残差相关仍有 0.35–0.73。算子逐个核对:day_max / day_last 把分钟压成日值,ts_delay 取昨日,cross_max / cross_tail_mean_q75 / cross_mean / cross_zscore / cross_corr / cross_autocorr / cross_stddev 都是尾随窗口,cs_bucket_* 是当日截面分桶;无前视,无 rank,无 nt_*,窗口 20–120 日。合理度给 4:MAX / 彩票偏好(散户追冲高的票之后被高估)机制清楚,算子组合实现了它。划掉种子 10:机制写的是上冲对下探的不对称,但 sub(div(day_max(High),昨收), div(day_min(Low),昨收)) 实际算的是 (日高 - 日低)/昨收,即日内振幅;它与波动控制 |ρ| 0.68、残差与 head 0.73,是波动估计量的换写法,按「重复」划掉(不是数学问题)。如果它有 alpha,最可能来自冲高后回吐(种子 3、4 的上影线读法)或同市值桶内的追涨强度(种子 5、6),而不是 X 的水平本身,水平会被波动 / 反转控制吃掉。'
