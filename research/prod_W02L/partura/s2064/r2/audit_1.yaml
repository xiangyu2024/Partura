    reasons: '6 个变体都是可执行的合法组合:pow_2_5 对负收益为 NaN(torch.pow 对负底数取非整数指数),因此 day_var(pow_2_5(Ret)) 是上行分钟的方差,day_var(pow_2_5(neg(Ret))) 是下行分钟的方差,variant 3 的上下行差与 variant 4 的下行版都有定义、无前视、无 rank。variant 1、2、6 是按 LogFloatCap 或 ListAge 分桶的截面标准化 / 去均值,是正常的桶内比较(分桶不依赖未来值)。variant 5 只把窗口从 50 换到 120,是参数调整,机制不变,但不构成数学问题,合理度给 4 而不是更低。相关度表里 variant 3 与原 head 的原始 |ρ| 为 0.93,说明它几乎就是原式的换写法,机制上只是把上行方差换成上下行差;这一点交由收录 / 替换规则判定,不影响合理度。如果它有 alpha,最可能来自上行与下行分钟方差之差所编码的收益不对称(variant 3、4),而不是上行方差的水平。'
