    reasons: '核心是封板时长类:day_at_max_ratio / day_flat_ratio / day_flat_run_max / day_distinct_ratio 乘以涨幅 /LimitWidth,或在 is_gt 事件下的版本。相关度表:与 head 的原始 |ρ| 最大为种子 4 的 0.50,其余 0.18–0.42,残差 0.10–0.36;与控制最大为种子 10 的 0.31(size)与种子 3 的 0.31 之外,最大 0.39(波动,种子 2 与 4),均远低于 0.8。快照里 head 全部是 day_var(pow_2_5(Ret)) 或 nt_ 写法,没有 day_at_max_ratio / day_flat_* 系列,对快照是新的;对全库 5583 条的新颖性本次未核对(只看了 heads 与 loc 候选),沿用 PI 的骨架核对声明。创新度给 4。算子逐个核对:LimitWidth 为 0.05–0.3 的常数,无近零除数;day_at_max_ratio 在不足两分钟的日返回 NaN;cross_delay 取过去;无 rank,无 nt_*;涨幅 /LimitWidth 在涨跌停日约为 ±1,封板时长 × 方向读出锁定强度,机制(封板时单边排队,次日溢价后因拥挤回吐)清楚。合理度给 4。划掉种子 6、7、9:流水线门槛已标为「废品」,distinct 分别为 0.19、0.36、0.43,即面板几乎全部并列 / 近常数,属 §4 的数值伪影;6、7 的 is_gt(·,0.9) 是 PI 第 1 轮 N 位事件版(阈值 0.95,得分 +0.09)的变体,与计划自己写的「改用分钟级连续版」相矛盾。种子 10 不乘涨幅,是普通停滞度(流动性 / tick 粘性),与封板机制关系弱,但不是数学问题,不划;它依赖停牌掩码把停牌日置为 NaN,请总领确认掩码对 day_flat_run_max 生效。如果它有 alpha,最可能来自涨停 / 跌停锁定强度(种子 1、4、8、11、12 的归一化写法)在次日的溢价与回吐,而不是停滞本身。'
R:
