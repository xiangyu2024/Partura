  - type: E
    core: 'div(day_max(High), ts_delay(day_last(Close), 1))'
    hypothesis: >-
      核心 X = 当日最高价 / 前一日收盘价,即「相对昨收的盘中最大涨幅」(只用当日与前一日数据,无前视;前一日收盘取自 ts_delay,正常价格不近零)。
      本批证据:含 X 的 32 个已评分候选均值 -0.76,不含的 -2.24(p<0.001),是共性表里富集最强的非平凡子树之一;但 X 本身在快照 head 里没有出现过
      (3 个 head 全是 day_var(pow_2_5(Ret)) 的时序滤波),所以库里没人把它当主体。机制:这是 Bali-Cakici-Whitelaw 的 MAX / 彩票偏好在 A 股的盘中版本——散户追逐
      「摸到大涨」的票,近期盘中冲高越多的票被追涨越狠,之后被高估;而冲高之后收盘回落的部分是卖压证据。第 1 轮 N 位用 LimitWidth 做成涨停事件指示(阈值 0.95),
      得分只有 +0.09,说明事件版太稀疏;这一位要试的是**连续版**:不加 LimitWidth 的阈值,而是用时序尾部、截面形状与桶内比较来读 X 的分布。外围(与快照里任何含 X 的候选都不同,
      那些全是 LimitWidth 事件指示 + cross_mean 120):(1)尾部强度 cross_max / cross_tail_mean_q75(X,60) = 近 60 日最极端的冲高,MAX 因子的直接写法;
      (2)冲高减收盘 = X - Close/昨收 的回吐,尾部均值读「冲高后回落」幅度;(3)同市值桶内的比较(cs_bucket_demean,LogFloatCap),市值的线性与非线性暴露已被尺子去掉,桶内比较拿到的是
      「同样大的票里谁更爱冲高」;(4)与成交额的关系 cross_corr(X, day_sum(Amt)):冲高由放量驱动 = 消息 / 追涨,无量冲高 = 噪声;(5)相对自己的变化 cross_zscore(X,60)、20 日对 120 日;
      (6)上冲对下探的不对称 X - 日最低 / 昨收。算子实现全部是 day_* 把分钟压成日值再用尾随窗口 cross_*,无前视,窗口 20-120 日、换手低,15 bp 影响小。为什么与库里不同:两个库 5583
      条表达式的骨架都已被禁,X 作为主体(而非 Ret 的幂方差)是新的;连续尾部 / 回吐 / 桶内 / 相关写法和快照里的涨停事件写法不是同一个量。样本外为什么还在:涨停制度与散户追涨行为是结构性的,
      非某段行情;最可能的失败:X 的水平被波动 / 反转控制吃掉,留下的只有与 X 回吐相关的成分;已知风险:X 的尾部与 head 的上行方差族有一定相关(会被库禁令挡掉的自动淘汰)。
