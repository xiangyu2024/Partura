  - type: N
    hypothesis: >-
      新 idea:「封板时长」。涨跌停制度下,一只票当天被封在涨(跌)停价上的时间长短,分钟数据里表现为「日内最高价上停留的分钟占比」和「价格不动的最长连续段」:
      day_at_max_ratio(Close) = 收盘价等于当日最大值的分钟占比(封板 / 收在最高),day_flat_ratio(Close) = 分钟收益为零的占比(一字板 / 无量冻结),day_flat_run_max(Close) = 最长的零收益连续段。
      第 1 轮 N 位把涨停读成「High 触及阈值」的二元事件,得分 +0.09 仅勉强为正,且事件稀疏;封板时长是连续量,读的是封单强度而不是有没有碰到。
      两个库里 5583 条表达式没有一条用过 day_at_max_ratio / day_flat_ratio / day_flat_run_max 与 LimitWidth 的组合(已对 members 骨架核对:库里的 day_flat_* 用在波动代理上,而不是封板)。
      机制:封得久 = 未成交买单排队 = 极端的单边需求,A 股散户与游资追涨,封板强的票次日溢价但随后因为排队拥挤、解封抛压而回吐;把它乘上方向(当日涨幅 / LimitWidth,无量纲化后四类板块可比)
      就同时读出涨停(正)与跌停(负)的锁定强度,60-120 日尾随平均后是慢变量;同时用 ListAge 做桶内比较,因为新股(上市天数短)的涨跌停规则、散户参与度与老票完全不同,
      尺子里没有 ListAge 的暴露可被去掉。算子:全部是 day_* 压到日值、ts_delay / cross_delay 取过去、cross_mean 做尾随窗口;停牌日由日值缺失 -> 被 cross_mean 忽略,
      不使用 ts_rank / cross_rank,避开 nanrank_last 的停牌 0 值。除数 LimitWidth 为 0.05-0.3 的常数,没有近零除数;day_flat_ratio 在只有常数价的停牌日是缺失或 1,不是伪影主导。
      样本外为什么还在:涨跌停制度与散户结构变化慢,2018-2025 全期存在;连续的锁定强度不是波动 / 流动性 / 反转 / 市值的线性或 U 形函数。最可能的失败:锁定强度与流动性控制强相关(一字板成交极少)被吃掉。
    inspired_by: '本批 candidates 里 day_last(Close) / day_max(High) / 昨收 的比值子树富集最强(均值差 +1.0~1.56),第 1 轮 N 位涨停事件指示 +0.09 是批内唯一为正的;事件稀疏,改用分钟级的封板时长读同一个现象'
