- type: N
  hypothesis: 机制:涨跌停是 A 股特有的价格上限,LimitWidth(板块涨跌幅宽度,10% / 20% / 5% / 30%)是日频字段;两个库
    5583 条表达式一次都没用过这个字段,也没有任何以「当日最高价逼近涨停」为对象的写法。把当日涨幅除以 LimitWidth 得到无量纲的「占限幅比例」u,不同板块可比。事件定义:u_high=(day_max(High)/前一日收盘-1)/LimitWidth,u_close
    同理取收盘;touch=u_high>0.95(盘中碰到或逼近涨停),sealed=touch 且 u_close>0.95(封住),failed=touch
    且 u_close<0.95(炸板),giveback=u_high-u_close(最高到收盘的回吐占限幅比例)。想法:散户的涨停追逐在 A 股是强行为模式。近
    60-120 日炸板 / 回吐多的票,说明追涨需求碰到了持续的卖压(解禁、套现、大户出货),之后趋于弱;封板次数多的票是另一种(筹码锁定,短期延续但长期回吐)。这些频率是慢变量(60-120
    日窗口、事件稀疏),换手低,15 bp 影响小。算子怎样实现:全部用 day_max / day_min / day_last 把分钟压成日值,ts_delay(day_last(Close),1)
    取前一日收盘(只用已知数据,无前视),is_gt / is_lt 生成 0/1 指示,cross_mean / cross_max 做尾随窗口频率;种子里分成几族:频率(1,4,9)、炸板条件频率(2,10,12)、回吐幅度(3,11,13)、相对自己的变化(5)、桶内标准化(6,10)、触碰后次日延续(8,用
    cross_delay 把触碰推后一天再乘当日 u_close,无前视)、跌停镜像(9,14 的差分,读涨跌停需求的不对称)。为什么样本外还会在:涨跌停制度和散户结构变化慢,2018-2025
    都存在;事件频率不是价格水平,尺子里的流动性 / 波动 / 反转 / 市值控制只能线性与 U 形地吃掉其中一部分。数学检查:LimitWidth 为正常数(0.05-0.3),不会造成近零除数;ts_delay(day_last(Close),1)
