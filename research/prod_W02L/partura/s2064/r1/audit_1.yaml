    reasons: '位类型 N,涨停限幅事件(u = 日涨幅 / LimitWidth)。库核对:members.csv 中 LimitWidth 出现 0 次,cross_delay(is_gt(...)) 形式 0 次,所以限幅字段与触碰事件是库里没有的对象。数学核对:day_max / day_min 用 nanmax / nanmin,停牌日的 NaN 不会被填成 0;ts_delay(day_last(Close),1) 只取前一日收盘;cross_delay(touch,1) 只向后看,无前视;LimitWidth 为正常数,除法无近零分母;没有用 ts_rank / cross_rank,不碰 nanrank_last 的停牌 0 值。划掉 1、2、4、5、6、9、10、12、14:gate 的分布值为 0.009 至 0.147,即 85% 以上的票在该日取值并列(多为 0),排名基本由股票列序决定。这是 §4 的面板几乎是常数,不是一般的并列(一般并列靠列序不算问题),所以划掉。其中 10 另有一条数学问题:桶的依据 LimitWidth 只有 4 个取值,10 个桶在 argsort 下退化成按列序的板块顺序。留下 3、7、8、11、13 共 5 个(划完剩 5 个,够 4 个的线)。3:上影线 (High - Close) 归一化后的 60 日均值,不限于涨停日,与限幅的联系较弱,机制是盘中高点的卖压被拒;raw 0.38,过。7:cross_max 归一化后的 60 日收盘涨幅,即 MAX 效应(彩票需求),raw 0.42,known 控制 0.44,未到 0.8,过。8:涨停次日当日收益的 120 日均值,用 cross_delay 把触碰推后一天,符号待 GP 定,是本位最新的一条;raw 0.11,过。11:涨停日的炸板回吐(高点到收盘占限幅比)的 120 日均值,对象是炸板的供给压力;raw 0.41,过。13:盘中冲高到 50% 限幅后的回吐,阈值 0.5 是任意选择,与 0.95 的涨停事件不同,机制是盘中冲高回落;raw 0.45,过。如果它有 alpha,最可能来自涨停事件带来的散户追涨与卖压不对称(炸板回吐、次日延续),这些与库里已有 head 的 raw 相关都不超过 0.45。通过:创新度 4、合理度 4,划完剩 5 个种子。'
