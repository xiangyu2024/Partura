    reasons: '位类型 E,核心 day_var(pow_2_5(Ret)) (C)。相关度表:核心与三个 head 的原始 |ρ| 最大 0.32(残差 0.05),与控制最大为 vol 0.61,低于 0.8,通过 E 位的核心控制门槛。库核对(members.csv):含 day_var(pow_2_5(Ret)) 的 8 条全是 ts_std / neg / cross_sum / ts_sum 的外壳;没有 cross_mean(C)、cs_bucket、cross_corr、cross_regbeta 等形式;含 day_var(pow_2_5(neg(Ret))) 的写法为 0 条(只有 4176 号 day_quantile_q25(in_rank(pow_2_5(neg(Ret)))),对象不同),所以 D 这一部件是库里没有的。数学核对:pow_ 在 e>1 时直接 torch.pow,负底得 NaN(common.py:216 起);_stddev 用 nanmean,所以 C 确实只读上行分钟的方差,PI 的推断成立,这是设计而不是 bug;所有 cross_* / cs_* 都是尾随窗口,cross_delay 与 ts_delay 只向后移,无前视;cs_bucket 用 argsort 排秩,按 LogFloatCap 分桶。逐个种子:1 cs_bucket_zscore 按 LogFloatCap 分桶后 z 化,raw 0.10,size 0.71 未到 0.8,过。2 20 日均值减 241 日均值再分桶,raw 0.16,与 8 同一对象但一个分桶一个不分,不算重复,过。3 上行/下行 60 日均值之比,raw 0.36,控制最大 0.13,过;分母在几乎不交易的票上可能接近 0,这是需要看尾部的风险,但不是本身的数学问题。4 C 与 D 的 120 日时序相关,raw 0.66,离 0.7 的库禁线很近,与 head 有共同成分,但未达划掉线,过。6 C 与 Amt 的 120 日时序相关,raw 0.03,过。8 20 日均值相对 241 日的 z,raw 0.40,与 2 的对象相近但形式不同,过。9 241 日均值在 log 价格(LogFloatCap 减 LogFloatShares,即 log 价格)十分位内去均值,raw 0.17,过。10 C 的 120 日一阶自相关,raw 0.17,过。11 C 对总方差 day_var(Ret) 的截面残差,raw 0.54,vol 0.74 偏高但未到 0.8,过。14 C 与滞后收盘的 120 日相关,raw 0.28,过,但价格水平非平稳,相关里有较大的趋势成分,是本位机制最弱的一条。划掉 5、7、12、13:gate 未过。5 与 12 的覆盖率为 0.15 与 0.17,13 为 0.07,都是 log 版本,缺失主要由 log 的截断与 D 的 NaN 决定;7 的分布值为 0.17,面板大部分并列。这些属于 §4 的定义坏掉与数值伪影(结果主要由缺失填充或并列决定),不是普通并列。如果它有 alpha,最可能来自上行尾部强度的横截面差异(彩票需求、追涨后的过度定价);与 vol 的共同部分被残差吃掉后,剩下的是桶内、相对自身历史、上行与下行的不对称这几类结构。通过:创新度 4、合理度 4,划完剩 10 个种子,核心与控制 |ρ| 均 < 0.8。'
