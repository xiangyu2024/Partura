  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [3]
    reasons: '创新度 4。核心 day_argmax(Amt)(成交额峰值所在的分钟)与快照 6 个 head 的原始 |ρ| 最大 0.10,与 5 个控制的 |ρ| 最大 0.18(known 0.18、liq 0.17),不是任何 head 或控制的换皮。外层(day_locate 取峰值分钟的价格、峰值分钟与 day_argmax(High/Low) 的时间差、ts_corr 的时间序列共动、稳定性)在快照里没有出现过。扣 1 分的理由:核心子树在批内已有 4 个候选含它(共性表 +0.62,p 0.12),所以「成交峰值时点」本身不是新对象,新的是外层。合理度 4。机制清楚(峰值成交的时点与价格冲击,反映持仓者结构与拆单方式)。逐个算子核对:day_argmax 取首个最大值的下标(全 NaN 行返回 NaN),day_locate 按 y 索引取 x 的值(越界或 NaN 返回 NaN),两者都是分钟轴单节点收集;日轴只用 ts_mean / cross_mean / cross_ema / ts_std / ts_corr 平滑;没有 shift,没有前视。扣 1 分的两点:(1) day_argmax 对并列值取第一个下标,所以整行相等(平盘、一字板、零成交且未被置 NaN)的日子返回 0(开盘峰)。这把这类票系统性推向「开盘峰」。需要 PI 核对停牌日的 Amt 是 NaN 还是 0;若是 0,这个伪影影响所有含 day_argmax(Amt) 的种子。(2) seed 1 的 ts_mean(day_locate(Ret, day_argmax(Amt)), 20) 是峰值分钟上一根 1 分钟收益的 20 日均值,单分钟样本噪声大,机制要靠 20 日平均来撑。划掉 seed 3:ts_mean(sub(day_argmax(Amt), day_argmax(High)), 20) 的 gate 为 False,distinct 0.427(其余过门槛的种子在 0.51 以上),说明截面上约 57% 的股票取值并列。并列的主要来源很可能是两个 argmax 同时落在首分钟(0)的日子,这正是上一条的伪影,这个种子的排序主要由并列结构决定,属于 §4 的数值伪影,划掉(请 PI 复核并列来源)。其余不划:seed 4、seed 10 与 seed 3 是同一模板(argmax(Amt) 减去另一价格字段的 argmax,只换了 Low / Close / High),但相关度表没有给种子两两 ρ,我不凭推断划掉,请 PI 核对两两相关。seed 9 的 ts_mean(mul(day_argmax(Amt), day_signed_ratio(Ret, Amt)), 20) 把 0 到 240 的时点和 -1 到 1 的净买压相乘,量纲混合但不是数学错误,放行。剩 9 个种子(≥4),核心对各控制的 |ρ| 最大 0.18 < 0.8,E 位通过。若它有 alpha,最可能来自:大额成交集中在哪个时点反映的持仓结构(开盘峰偏向隔夜消息与散户,收盘峰偏向机构再平衡与收盘集合竞价),以及峰值时价格冲击的持续性,而不是 Amt 的水平。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。N 位的对象是带符号的成交额加权收益与净买压(day_wmean(Ret, Amt)、day_signed_ratio(Ret, Amt)、day_topw_mean(Ret, Amt)),快照里 6 个 head 全部是分钟序列的幅度与尾部形状(kurt、var、std)。相关度表:原始 |ρ| 与 head 的最大值为 seed 4 的 0.45、seed 8 的 0.28、seed 5 的 0.25,其余 ≤ 0.18;残差 |ρ| 除 seed 4(0.57)外都在 0.09 到 0.20 之间。seed 4 的 day_centroid(Ret) 取的是 |Ret|,不带符号,与头部同属幅度类,残差偏高,按幅度类处理;它的时序对象(成交相对价格变动的先后)仍与 kurt 不同。扣 1 分的理由:控制里的 rev 与符号类高度相关(seed 1 为 0.55,seed 2 为 0.61,seed 3 为 0.64),说明大部分原始信号是 20 日反转在日内的投影,新尺子会去掉它,剩下的是否有 alpha 要看残差。合理度 4。机制清楚(资金体验到的收益与时间平均收益之差;成交额集中在上涨还是下跌分钟;重成交分钟的平均收益)。逐个算子核对:day_wmean = sum(x|w|)/sum|w|;day_signed_ratio = sum(|y| sign(x))/sum|y|,值域 [-1, 1];day_topw_mean 取 |w| 前 10% 的分钟(含并列,nanquantile 0.9);day_centroid 是 |x| 的时间重心,值域 [0, 1]。都是分钟轴单节点收集,日轴只用 ts_mean / ts_quantile_q75 / cross_mean / cross_ema 平滑,没有前视。扣 1 分的三点(均未确认为数学问题,按 §3 放行):(1) seed 6 与 seed 10 用 |in_pct(Amt, 1)| 当权重。in_pct 除以任意非零基数(只对精确 0 返回 NaN),Amt 在薄成交分钟会出现很大的权重,可能让一两分钟支配 day_wmean 或 day_signed_ratio。这是 §4 的「除以近零的量」类风险,但我没有证据它支配了截面(seed 6 的 liq 0.19、seed 10 的 liq 0.11),请 PI 量化一日内最大权重占 sum|w| 的比例。(2) seed 2、seed 7、seed 10 的 day_signed_ratio 在一字涨停日恒为 +1(所有分钟 Ret > 0),这些票会在截面上聚到顶端,是定义上的饱和,不是数学错误。(3) seed 2 与 seed 7 对同一日度序列 day_signed_ratio(Ret, Amt) 都取 20 日窗口,只差外层 ts_mean 与 ts_quantile_q75;seed 1 与 seed 8 共用 day_wmean(Ret, Amt)。这是近重复的结构,但相关度表没有种子两两 ρ,我不凭推断划掉,请 PI 核对两两相关(若 ρ ≥ 0.7,应划去其一)。不划的理由:所有种子对 head 的原始 |ρ| 都 < 0.5,对控制的 |ρ| 都 < 0.8,没有自动划掉的条件。剩 10 个种子(≥4)。若它有 alpha,最可能来自:大户在上涨分钟还是下跌分钟集中成交(累积或派发)。这是持仓方的结构性行为,不是某个市场态的产物。'
