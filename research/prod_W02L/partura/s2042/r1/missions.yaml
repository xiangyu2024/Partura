- type: E
  core: 'day_kurt(Low)'
  hypothesis: |-
    核心读的是什么:day_kurt(Low) = 当天 241 根分钟最低价「水平序列」的超额峰度,mean((x-mu)^4)/sigma^4 - 3。它对价格尺度和平移都不变(无量纲);一天单边漂移时接近 -1.2,区间震荡再加一两次远离的刺(下影线 / 洗盘)时为大正数,两点分布取下限 -2,所以 add(day_kurt, 4) 恒 >= 2,拿它做分母不会出现近零爆点;停牌或一价到底 -> 方差 0 -> NaN,该日在后面的均值里被跳过。

    批里的证据只有「慢」,没有「峰度读到了东西」:B124(59 条,全是 day_kurt 的外壳)里 day_kurt(Low) 的富集 +0.75(p 0.031),快照里含它的两个 head 都是套了 ts_std 的慢写法(都是 -1.63);同一批里的裸水平写法(day_kurt(Low) / day_kurt(Vwap) / inv / log / pow_3 一类)在库自己的尺子下是 -15 ~ -45;拆解表里 ts_std 窗口 25 / 50 / 100 为 -1.84 / -1.63 / -1.27,单调。这 59 条没有一条做过下面四件事:(1) 带方向:全是无符号的形状量;(2) 先在当日截面上排名 / 去均值再做时间聚合:原始 day_kurt 的时间波动里大部分是「全市场同一天的路径形态」(大趋势日所有票一起变低),ts_std / ts_sum 量到的是个股对市场形态日的暴露,不是它自己的;(3) 同伴内标准化:整个库 5583 条里 cs_bucket_* 0 次、日频叶子 LogFloatCap / LogFloatShares / ListAge 0 次;(4) 与另一个形状量对比:库里含 day_kurt 的 190 条中,同一条里读两个不同字段峰度的只有 1 条(还含被禁的 ts_spearman),与 cross_ema 同现 0 条,与 day_sum(Ret) 同现 0 条。

    这个位在核心外面试四条机制,种子分四组(骨架互不相同,我用库的 skeleton_key 对 5583 条逐个核过,都不在库里):
    A 带方向的「信息型漂移」(种子 1-5、14、15):日内收益除以 (day_kurt(Low)+4),即平滑单边路径上的涨跌当作信息推动(拆单的机构 / 知情交易者,Kyle 1985;Barclay-Warner 1993 的隐蔽交易),冲上去又掉回来的尖峰上的涨跌当作噪声 / 流动性冲击(Campbell-Grossman-Wang 1993:非信息性价格变动会反转);再取 60-241 日的均值 / EMA,得到个股持续的「漂移质量」。它与 12 个月动量有交集,但尺子只控 20 日反转,没有控中期动量。变体换成成交额加权收益 day_wmean(Ret, Amt)、成交额方向占比 day_signed_ratio(Ret, Amt)、截面排名乘积(对市场整体涨跌稳健)、形状与收益的 60 日相关(尖峰日是涨还是跌)。
    B 影线不对称(种子 6-8):Low 路径的峰度读下影线 / 向下洗盘,High 的读上影线,「低 - 高」是个股持续的上下影线倾向(威廉影线类因子的分钟版);先用 cs_rank / cs_winsor / cs_robust_z 压住极端日(峰度的上界约等于分钟数 241,一天的极端值会主导均值)。
    C 相对自己的历史(种子 9、10):cross_zscore、快慢 EMA 之差读的是形态的「变化」,把个股持续的水平拿掉 —— 水平正是新尺子里流动性、波动、市值三个控制会吃掉的部分。
    D 同伴内标准化(种子 11-13):在名义价格(sub(LogFloatCap, LogFloatShares) = log(流通市值 / 流通股本) = log 股价)或已知成交额族的十分位内取 z 分数 / 去均值,放在 241 日均值「之后」,不放在日频之前(日频之前的桶边界跳变会加换手,邻流 2009 的 cs_bucket_demean 读数 -2.6 ~ -5.2 就是这样;放在慢聚合之后,邻流 2008 的 cs_bucket_zscore(cross_stddev(·, 120), LogFloatCap) 是该流最好的一档)。

    和以前不一样的地方:外围算子集合(cs_rank / cs_bucket_* / cross_ema / cross_zscore / day_sum(Ret) / day_signed_ratio / ListAge 掩码等)和这一批里含 day_kurt(Low) 的 13 个成员(外围是 ts_std、ts_decay_linear、cross_sum、ts_pearson、sigmoid、ts_kurt、ts_quantile_q50、cs_demean、inv、log、cross_mean(,3) 一类)没有一个相同;更重要的是做的事不同:加方向、先截面再时间、同伴内、新股掩码。

    为什么样本外还会在:来源是「谁在交易这只票」这一类持续的个股属性(机构拆单对散户追涨杀跌、影线倾向、盘口深度),A 股参与者结构 2018-2025 年变化慢;窗口 60-241 日、全是排名 / 比值 / 相关,换手低,15 bp 下不会被成本吃掉;不依赖某段行情。预期并不高:批内没有任何正分,新尺子又把波动、流动性、市值、已知成交额族、反转和两个冠军都去掉了。

    数学检查:(a) 无前视:所有输入是当天分钟,所有窗口是尾随窗口(cross_* / ts_* 都用截至当日的数据),t 日收盘后算、t+1 才交易。(b) 数值:除法的分母一律是 add(day_kurt, 4) >= 2;cross_corr 有界;cross_zscore 自带 EPS 与常数窗口保护;cs_robust_z 带 EPS;cs_winsor 截在 1% / 99%;day_signed_ratio 在 [-1, 1];涉及相关的种子乘 replace_small_with_nan(is_gt(ListAge, 120)),上市 120 个交易日内置缺失(cross_corr 对窗内点数没有下限,两点相关恒为 +-1,新股和复牌后的短窗口会出这种值;数据首日已上市的票 ListAge = 10000,不受影响)。(c) 定义:没有会系统性算不出的写法;本机用合成立方体(60 只 x 320 日 x 241 分钟,含停牌与未上市)把 15 个种子全算过,都能算、无 inf、每日取值离散度 1.0(只检查运行时错误,不是任何分数)。没有用任何 2026 年数据。
