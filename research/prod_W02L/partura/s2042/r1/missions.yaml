- type: N
  hypothesis: |-
    现象:B124 里「价格路径的峰度」与「成交量路径的峰度」的富集符号相反 —— day_kurt(Low) +0.75(p 0.031)、day_kurt(Vwap) +0.46、day_kurt(High) +0.39,而 day_kurt(Volume) -0.17、day_kurt(Amt) -1.47(p 都不显著)。价格形状有读数、成交量形状没有;更重要的是 59 条里没有一条把两者放在一起(同一条里读两个不同字段峰度的只有 1 条,含被禁的 ts_spearman;day_kurt 与 cross_corr 同现 1 条;所有价格字段的峰度都只配常数或自己的时间统计量)。这个位问的是:价格路径上的尖峰 / 洗盘,有没有成交量的突发作支撑。

    机制:一天里价格路径出现偏离并伴随成交量突发,是信息驱动的价格发现(Karpoff 1987 的价格变动与成交量关系;Llorente-Michaely-Saar-Wang 2002:带量的价格变动延续,对冲性 / 不带量的反转;Gervais-Kaniel-Mingelgrin 2001 的高成交量溢价);价格偏离而成交量路径平淡 = 薄盘口里的小单冲击,属流动性噪声,会被回吐。一只票这两类日子的占比取决于盘口深度和参与者构成,是持续的个股属性,不是某天的事件。所以要量的是「价格形状」和「成交形状」的耦合 / 差,而不是任何一个的水平(水平就是新尺子里流动性与已知成交额族控制要吃掉的部分)。

    算子怎样实现(种子 15 个,骨架互不相同,都不在库的 5583 个骨架里,我用库的 skeleton_key 逐条核过):
    (1) 时间维耦合:cross_corr(day_kurt(价格字段), day_kurt(量字段), 60-120) 再用 cross_ema / cross_mean 慢平滑(种子 1-3、14、15);价格字段取 Vwap / High / Close,量字段取 Volume / Amt,种子 15 拿 day_kurt(Ret) 看收益尾部与成交量尾部是否同步;
    (2) 截面排名差 / 乘积 / 残差:cs_rank(day_kurt(价格)) - cs_rank(day_kurt(量)),先在当日截面上排名(去掉「全市场同一天价格或成交形状一起变」的共同成分),再取 120-241 日均值(种子 4-7、9、12);其中 6 在名义价格十分位内标准化,9、12 是当日截面 cs_regres 残差(价格形状排名里与成交形状排名无关的部分);
    (3) 个股自己的回归残差:ts_regres / cross_regres(价格峰度 对 成交量峰度,60-120 日),取「量的形状解释不了的价格形状」,再慢平滑(种子 8、13);
    (4) 对数比:log(day_kurt(价格)+4) - log(day_kurt(量)+4),无需截面排名,只用对数把峰度的长右尾压平(种子 10、11)。

    和库不一样:库 5583 条里 day_kurt(Volume) 19 条、day_kurt(Amt) 6 条,读成交量形状的共 25 条,其中与价格字段的峰度同现的 0 条;读两个不同字段峰度的只有 1 条(含被禁的 ts_spearman);cs_rank 与 day_kurt 同现 6 条、cs_regres 与 day_kurt 同现 2 条,都只作用在单个形状量上;cs_bucket_* 0 条、cs_winsor / cs_robust_z 0 条、cross_ema 与 cross_zscore 0 条;日频叶子 0 条。批里的 59 条没有一条在算「价格形状相对成交形状」。

    为什么样本外还会在:盘口深度、参与者构成(机构 / 散户占比、做市与程序化交易)是慢变量,耦合和差读的是这些慢变量的指纹;全部种子窗口 60-241 日、取排名或相关,换手低;不依赖某一段行情。预期:价格形状与成交形状之差与流动性控制相关(volume 形状是稀疏成交的函数),所以对流动性 / 已知成交额族的 |rho| 预计 0.3-0.6,尺子会吃掉一部分;最可能留下的是时间维耦合与回归残差(种子 1-3、8、13、14),因为它们对每只票自己的水平不敏感。

    数学检查:(a) 无前视:所有输入是当天分钟,窗口全是尾随窗口,t 日收盘后算、t+1 才交易。(b) 数值:log(day_kurt+4) 的真数 >= 2;cross_corr 有界,窗内点数没有下限,两点相关恒为 +-1,所以时间维耦合与回归残差的种子(1-3、8、13-15)都乘了 replace_small_with_nan(is_gt(ListAge, 120)),上市 120 个交易日内置缺失,其余种子先做当日截面排名再取 120-241 日均值;cs_regres 是当日截面 OLS,不会有近零除法;cs_rank 取百分位。(c) 定义:本机合成立方体(含停牌与未上市)上 15 个种子全算过,无 inf,每日取值离散度 1.0;没有用任何 2026 年数据。
