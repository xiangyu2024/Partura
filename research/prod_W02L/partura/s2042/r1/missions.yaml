R:
- head: 'ts_std(day_kurt(Low), 50)'
  why: |-
    三个烂部件,都有拆解表的依据:(a) 窗口太短 —— ts_std 窗口 25 / 50 / 100 为 -1.84 / -1.63 / -1.27,单调变好,说明分数被换手成本压着;这里放 120 / 150 / 241 看曲线是否继续上升(120 是下面几个变体共同的对照锚);(b) 原始 day_kurt 的时间标准差里有一大块是「全市场同一天的路径形态」(趋势日所有票一起变低),先 cs_rank / cs_demean 再做时间 std,才是个股自己的形态不稳定;(c) 水平:标准差会随形态水平变化,同伴内标准化(名义价格 sub(LogFloatCap, LogFloatShares) 十分位、LogFloatCap 十分位)放在 120 日 std「之后」,邻流 2008 在 cross_stddev(log DW, 120) 上用同样做法,读数 -0.73,它的两层嵌套后代 -0.06,是该流最好的一档;(d) 新股窗口(ListAge 掩码)与除以自身均值的变异系数(day_kurt+4 >= 2,分母安全)各一个。
    全部变体都比原 head 慢、对市场形态日不敏感或在同伴内;读数看 120 日锚对 cs_rank / cs_demean / bucket / CV / 掩码五个相对变化。
