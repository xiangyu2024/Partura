slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。核心 day_kurt(Low) 本身在快照 head 3(ts_std(day_kurt(Low),50))里出现过,但外围结构是新的:用 struct/members.csv 核对,15 个种子的外围算子集合与 B124 中 13 条含该核心的成员、以及全库 21 条含该核心的表达式,都不相同。相关度表:对快照 3 个 head 的原始 |ρ| 最高 0.51(种子 9,对 head 3,残差 0.50),没有触发 0.7 的自动划掉线;对 5 个控制的原始 |ρ| 最高 0.49(种子 15,波动),核心对各控制的 |ρ| 在 0.00 到 0.06 之间,远低于 0.8 的核心门槛。种子 1、2、14、15 是「带方向的日内收益或成交额方向占比,除以 (峰度+4)」,库里 day_kurt 与 day_sum(Ret) 同现 0 条、与 cross_ema 同现 0 条,是新的。种子 9、10 是峰度自身的时间变化,与 head 3 有交集但不是同一个量。合理度 4。逐个核对:分母 add(day_kurt(Low),4) 在精确算术下 >= 2(四阶矩比方差平方 >= 1),不会爆点;cross_corr、cross_zscore(带 EPS 与常数窗口保护)、cs_winsor、cs_robust_z、cs_bucket_* 都有保护或归一化;掩码 replace_small_with_nan(is_gt(ListAge,120)) 在引擎节点输出时转为 float32(engine/kernels.py 的 _as_float),我在 float 输入上核过,结果为 1 或 NaN。有两点是 PI 笔记里的说法需要改正,但都不构成挡的理由:(a) PI 写一价到底的日子是 NaN,实测 day_kurt 在 Low 为常数时,价格如 12.34 得 -2,价格如 10.0 这类精确表示得 NaN;这些日子取最平滑端,对 1/(kurt+4) 类种子(1、2、13、14、15)有贡献,但占比小、多为不可成交的一字板,不主导排序,不属于 §4 的数学问题,建议 PI 修正说明并在 t+1 可成交性上核查;(b) 种子 1、13、14 没有 ListAge 掩码,新股的少数日均值噪声大但无偏,不主导。种子 1、2、14、15 的 241 日或 60 日均值接近 12 个月或 3 个月动量经峰度加权的形式,与尺子未控的中期动量有交集,PI 已承认这一点。如果它有 alpha,最可能来自:平滑单边路径上的涨跌代表知情拆单这类持续的个股属性;或中期动量经峰度加权后的残余。全部 15 个种子放行,没有划掉。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。N 位把价格形状与成交形状放在同一个表达式里:库 5583 条中含 day_kurt 的 190 条,同时读两个不同字段峰度的只有 1 条(且含被禁的 ts_spearman),价格峰度与成交峰度同现 0 条,这个组合是新的。相关度表:对 3 个 head 的原始 |ρ| 最高 0.50(种子 7,对 head 2),残差最高 0.46(种子 7),都未到 0.7;对 5 个控制的原始 |ρ| 最高 0.50(种子 10、11,流动性),这是 rank 差、对数比类与流动性的共同成分,但控制残差后的数已经由尺子去掉,不是同一个东西。合理度 4。逐个核对:种子 1、2、3、14、15 是 cross_corr(60 或 120 日)类耦合,都乘了 ListAge>120 掩码,与叙述一致;种子 4 到 7、9 到 12 是 cs_rank 的差、积、对数差或 cs_regres 残差,与叙述一致(cs_regres(Y,X) 是 Y 对 X 的残差,方向正确)。种子 8 与 13 的方向有问题:ts_regres(x,y,d) 与 cross_regres(x,y,d) 返回的是 y 对 x 回归的残差,第二个参数才是被解释变量(我用合成数据核过),所以种子 8(x=Vwap 峰度,y=Volume 峰度)与种子 13(x=High 峰度,y=Volume 峰度)算的是「成交量峰度不能被价格峰度解释的部分」,与叙述「价格形状不能被成交形状解释」方向相反。这不是数学问题(表达式良定义,未出现爆点),所以放行;但 PI 把 8、13 当作最可能留存者的预期建立在反向残差上,建议 PI 交换参数或改叙述。数学安全:除法分母 cs_rank 在 (0,1] 内,log 的真数 >= 2;rolling_ols 在 var_x 不大于 EPS 时给 NaN;cross_corr 在窗内有效点少时给 ±1,这只出现在停牌后复牌的短窗口,不主导。如果它有 alpha,最可能来自:价格尾部与成交量尾部同步或背离的个股持续差异(盘口深度、参与者结构这类慢变量),或成交量形状中价格解释不了的那部分。种子 4 与 6 只差一层同伴内标准化,1 与 13、15 只差外层平滑与中性化;按规则「重复」才能划,这些是 PI 有意设计的变体,不划,但会占用初代个体。全部 15 个种子放行,没有划掉。'
R:
  - head: 'ts_std(day_kurt(Low), 50)'
    soundness: 4
    reasons: '合理度 4。变体都是 ts_std 的窗口变化、cs_rank 或 cs_demean 之后再取 ts_std、同伴内标准化、除以 (均值+4) 的变异系数、以及新股掩码。数学上没有问题:ts_std 用 nanstd_last,按有效日数归一化,没有 sum 类的长度偏差;div(ts_std, add(ts_mean(kurt),4)) 的分母在 ts_mean 不小于 -2 时不小于 2;cs_demean、cs_rank 不引入爆点。各变体与快照 head 的最大原始 |ρ| 在 0.37 到 0.91 之间,其中变体 1、2、7 的最大值来自 head 2(0.73、0.90、0.91),这是 PI 的替换判定要处理的问题,不是挡的理由。两点提醒:变体 11 只比变体 3 多一个 ListAge 掩码,几乎是同一个量,属冗余而非错误;窗口 241 的变体若 store 没有 2018 年前的回看数据,train 前一年用的是部分窗口,这对横截面上共同的有效日数不影响排名,不挡。如果这一组有效,最可能来自 120 到 241 日的慢平滑在换手成本下留下的那部分,与 PI 的拆解表一致。全组放行。'
  - head: 'neg(cross_sum(ts_decay_linear(ts_std(day_kurt(Low), 50), 10), 241))'
    soundness: 1
    reasons: '合理度 1(数学问题,§4「定义坏掉」)。head 2 的外层是 cross_sum(…,241)。cross_sum 用 nansum_last,窗内 NaN 按 0 相加,并且不按有效日数归一化。于是窗内有效日数随上市天数变化:上市不满 241 日的股票,窗内的和只包含它上市以来的天数,和线性地变小。内层 ts_decay_linear(ts_std(…)) 非负,所以 neg(sum) 对新股系统性地偏向截面的同一端。这是方向确定的偏差,不是随机噪声,会主导极端十分位的组成。以上是从代码推出的结构结论,我没有在数据上核实新股在极端十分位中的占比,IPO 密集期这个占比可能很大。变体 1、2、4 都保留 cross_sum(…,241),继承该偏差;变体 3(cross_ema 归一化)不受影响,但按规则整组删除。补充理由(不是数学问题):变体 2、3、4 与 head 2 的原始 |ρ| 为 0.98、0.91、0.98,是同一个东西换写法。原 head 2 本身有同样偏差,建议总领核实快照 head 2 在极端十分位上的新股占比。本轮删除此 R 组。'
summary: '两个任务位都通过(创新度与合理度均为 4,15 个种子无一划掉;种子 8、13 的回归参数顺序与叙述相反,已注明但不挡);R 组 1 放行,R 组 2 因 cross_sum(…,241) 对新股的长度偏差(§4 定义坏掉)整组删除。'
