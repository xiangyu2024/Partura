slots:
  - slot: a
    novelty: 4
    soundness: 3
    struck_seeds: []
    reasons: '创新度 4。核心 C = cross_argmax(day_quantile(Open),60) 来自 loc.json 的 enrichment 核心卡(effect 1.03,n 51),来源合法。库内以 Open 为字段的 cross_argmax(day_quantile(...)) 只有快照里的 ts_std(C,50) 一条;快照 head 里 Vwap 版的 ts_std(C_Vwap,25) 与核心的日度秩 |ρ| 为 0.43(核心本身不过尺子,这是预期的)。15 个种子全部是 C 对一个日度路径量的 120 日(a10、a11 为 60 日)回归、相关、截距或 t 值读数;库内 cross_regbeta(cross_argmax...) 出现 0 次,cross_regalpha / cross_reg_tvalue 套 cross_argmax 的只有一条且结构不同。与 head 的原始 |ρ| 全部在 0.14 以下(a1 至 a15 依次为 0.03、0.06、0.04、0.08、0.07、0.10、0.03、0.10、0.04、0.14、0.06、0.07、0.08、0.09、0.09),残差后最高 0.22。与 5 个控制的 |ρ| 最高 0.30(a10 对流动性、波动、已知族),远低于 0.8。外围算子集合与第 1 轮已见的含 C 候选逐一比对,无相同者。本位是 C 的第 2 个 E 位,符合每个核心至多 2 个 E 位的上限。合理度 3。逐个算子核对:cross_argmax 用 nanargmax_last,pct 的分子按日历位置计(距今天数加一),分母按窗口有效天数计,所以窗口内有停牌缺口时 C 可以超过 1;并列的最高点取窗口里最老的一天(torch.argmax 取首个)。cross_regbeta(x,y,d) 是 y 对 x 的滚动斜率 cov/var(x),var(x) 不超过 EPS=1e-9 时给 NaN,方向与实现一致。a4 是反向回归(x 为对数收益,斜率为 C 对收益),a9 的 t 值对 C 的尺度不变。a8 的截距是 mean(R1) 减 beta 乘 mean(C),而 C 的取值只在 1/60 到 1 之间,「刚创新高那一天的期望收益」是对 C=0 的外推,属于读法问题,不是数学问题。扣分的理由有两条。其一,机制与文献不对应:George & Hwang(2004)讲的是价格与 52 周高点的距离,而 C 是高点的年龄,引用的是另一个变量;一个个股 120 日时序斜率如何转化为截面收益溢价,计划里没有论证。其二,除 a4、a9、a13 外的 12 个种子都含 1/var(C)(a12 显式写作 corr/σ_C),趋势持续的票 σ_C 小,斜率被放大;这不是数学错误,但 PI 应检查 σ_C 的下尾是否支配截面。C 的 pct 缺口与并列规则规模小,不主导结果。§4 的 nanrank_last 陷阱不触发(种子里没有 ts_rank、cross_rank、in_rank_rolling),没有禁用算子 ts_spearman 与 nt_*,无前视(C、R1、ON、ID 都只用 t 日及以前的数据)。如果它有 alpha,最可能来自:高点年龄这个慢状态与隔夜、日内收益的个股时序斜率(a1 至 a3,注意力与锚定加上两类参与者的差异),其次是趋势持续性经 1/var(C) 放大的那部分(a7、a12、a14)。划掉:无。自动规则不触发(种子与 head 的原始 |ρ| 最高 0.14、核心 0.43,均低于 0.7;种子与控制的 |ρ| 最高 0.30、核心最高 0.30,均低于 0.8)。'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: []
    reasons: '创新度 4。库内 day_centroid、LimitWidth、LogFloatShares、LogFloatCap 减 LogFloatShares、cs_mean 套 ts_corr 或 ts_regbeta 的出现次数均为 0;31 个种子的骨架与两库 5583 条对照为 0 命中(我的骨架函数与库里 skeleton 列有约 5.6% 的字面差异,可能漏掉少数)。与 head 的原始 |ρ| 最高 0.31(b7 对 signedpower 那个 head),b1 对 cross_mean(day_skew(Ret),20) 为 0.23,其余都在 0.30 以下。与 5 个控制的 |ρ| 最高 0.56(b13 对已知族 0.56、对流动性 0.55),未到 0.8 的线;b9 对规模 0.40。b13 的成交时点读数与流动性族偏高,PI 应看它是否只是成交额水平的另一面。ON/ID 的隔夜与日内拆分、市场同步性本身是教科书读法,新的是 Z 的涨跌停口径与成交重心,所以给 4 而不是 5。合理度 3。ON(当日开盘对前收)、ID(收盘对开盘)、R1 的定义正确,cross_delay 天数为正,无前视;b1 至 b4、b6 的分子分母口径一致。b2、b16 的分母是 ID 或 ON 的 120 日标准差加 1e-4,典型值在 0.01 到 0.02,保护弱但够用,不会产生截面爆点。b5、b13、b14 的 day_centroid 是按 |x| 的分钟加权重心 t/(T-1),在 [0,1] 内,全天权重为零时给 NaN。b7 至 b9 的 cs_mean 是当日截面有限值的均值,无前视。b15 的 LogFloatCap 减 LogFloatShares,若 FloatCap 等于价格乘流通股数(我没有核对数据口径),就是未复权价的对数,低价股读法机制清楚。问题在 b10 至 b12:Z = R1 / LimitWidth 的分母有两处与实际不符。(i) tradability.py 的 board_limit 只给 0.10、0.20、0.30 三档,ST 的 5% 不在数据里(它只靠一字规则兜住封板判定),计划里写的「0.05 到 0.3」不成立,ST 的 Z 因此被减半。(ii) board_limit 不处理新股上市初期的特殊涨跌幅;依我所知的交易所规则,科创板与 2020 年 8 月后的创业板上市头几日不设涨跌幅限制(PI 需核实)。这些日子的 Z 可以到 5 以上,cross_max(Z,60) 与 cross_mean(Z^3,120) 会被单日支配,截面极端会是上市初期的票。这是定义口径错误,不是 §4 所列的数学问题,按 §3 只挡数学问题的原则我不划它们;但它对三个种子的极端统计有系统影响,所以合理度给 3,并要求 PI 下一轮用 ListAge 排除上市初期、ST 单独处理。划掉:无。无与 head 或控制同义的种子(原始 |ρ| 最高 0.31,对控制最高 0.56,自动规则不触发)。骨架与禁用算子检查通过。如果它有 alpha,最可能来自:隔夜与日内两类参与者的差异(b1 至 b4、b6),其次是市场同步性(b7 至 b9)、成交时点(b5、b13、b14)、低价股(b15);b10 至 b12 的涨跌停口径极端需要先去掉上市初期与 ST 的效应,才能说它是什么。'
R:
  - head: 'cross_mean(day_skew(Ret), 20)'
    soundness: 4
    reasons: '只评合理度。变体 80 与 160 日均值、半衰期 40 与 80 的 cross_ema、120 日中位数、120 日符号均值,都是窗口或平滑的改动,算子实现与口径一致(cross_ema 按半衰期且跳过缺失日,cross_med 用 nanmedian)。day_skew 在一字板日收益全为 0,0/0 得 NaN,被 cross_mean 跳过,所以封板多的票窗口里有效天数变少,这是口径问题,不是错误。skew 的三次 z 均值在 241 个分钟上有界(约 ±15),无数值爆点,无前视。修改窗口是合理的去噪检验。如果它有 alpha,来自分钟收益分布偏度的慢变化(彩票式偏好)。'
  - head: 'ts_stddev(day_skew(Vwap), 20)'
    soundness: 4
    reasons: '只评合理度。变体 80 与 160 日的 ts_stddev、cross_ema(·,40) 平滑、ts_mean(abs(ts_delta(·,1)),60) 都是合法的稳定性度量。注意 day_skew 作用在 Vwap 的分钟价格水平上而不是收益,读的是日内 VWAP 路径的形状。一字板日 Vwap 几乎为常数,skew 的分母趋于零,这类日子得到 NaN 还是舍入噪声取决于 Vwap 的舍入,PI 可以查一下;若是噪声,它会污染 20 日标准差。最后一个变体与原 head 的 ρ 为 0.58,度量相近但不同。无前视。如果它有 alpha,来自日内 VWAP 路径形状的不稳定性(与 B053 同一族的时间形状读法)。'
  - head: 'signedpower(cross_quantile_q75(cross_reg_fvalue(day_skew(Open), day_skew(Open), 10), 241))'
    soundness: 4
    reasons: '只评合理度。cross_reg_fvalue(x,x,10) 的残差平方和只剩舍入量级(beta 为 1 的舍入误差,约 1e-12 量级),远小于 EPS=1e-9(common.py),所以 fvalue 约等于 10 日离差平方和除以 1e-9,排序就是 10 日方差。这是退化写法,但浮点不主导排序。fvalue 的上界约 2e12(skew 有界约 ±15),平方后在 float32 内不溢出。signedpower(e=2) 单调,不改秩。变体把退化回归换成 cross_stddev 是诚实的改写,但它度量的是同一个 10 日方差读数,与原式 ρ 为 0.81 到 0.99,按 R 规则不会带来 0.1 的分数提升,PI 不应期待它替换出新东西(这不是合理度问题)。无前视。如果它有 alpha,来自日内开盘价路径形状的 10 日不稳定性,经 241 日分位的慢化。'
summary: '两个位都通过且无划掉:a 位创新 4、合理 3,15 个种子全留;b 位创新 4、合理 3,16 个种子全留;R 三组合理均 4,全部保留。主要注意:a 的斜率类种子含 1/var(C),且引用的文献对应的是高点距离而不是高点年龄;b 的 b10 至 b12 用的 LimitWidth 没有 ST 的 5% 与上市初期的不设限,需 PI 用 ListAge 与 ST 处理;R3 的退化回归数值上可接受,但变体与原式基本同秩。'
