  hypothesis: '机制:核心 C = cross_argmax(day_quantile(Open), 60) 是「60 日高点的年龄」(pct 口径,约
    (最高点距今天数 + 1) / 窗口有效天数;有界、无量纲、对价格水平与波动水平不变)。


    (1) 第 1 轮这一位的读数(只用 train / valid)说了什么:把 C 当状态直接读(cross_ema / cross_zscore / C
    减 Cmin 的水平与离散 / 条件读法)没有一个进前列;进入前 5 名的全部是 cross_regbeta(C, 一个日度路径量, 120),得分 −0.39
    ~ −0.46,而且 train / valid 几乎相同(−0.39 / −0.36、−0.40 / −0.23、−0.41 / −0.24),比 head
    ts_std(C, 50)(−2.18)与同批 head 的底(−1.5 ~ −1.6)好一个点以上。GP 自己改出来的最好伙伴是「收盘价对 3 日最低价的涨幅」,不是我放的日收益。所以
    C 本身看不出 alpha;如果有,它在「某个日度路径量对高点年龄的 120 日响应」里:斜率 = 相关 × σ_y / σ_C,窗口 120 日、C 每天只动
    1/60,是个慢变量。这一位沿这条线深挖,外围换成第 1 轮没碰过的写法。


    (2) 外围的五组新写法,每个种子原样带着 C(下面 R1 = 日收盘 / 前一日收盘 − 1,ON = 开盘 / 前收 − 1,ID = 收盘 / 开盘
    − 1,Cmin = cross_argmin(day_quantile(Open), 60)):

    (a) 把「收益」按一天里何时赚到拆开(Lou、Polk & Skouras 2019 的 tug of war:隔夜更多是机构、日内更多是散户):cross_regbeta(C,
    ON, 120)、cross_regbeta(C, ID, 120)、两者之差、cross_reg_tvalue(C, ON, 120)。机制:高点很新鲜时,隔夜与日内对路径状态的响应方向如果相反,就说明是谁在推「创新高」;这比一个混合的日收益更干净,也是第
    1 轮没有的拆法。

    (b) 伙伴换成大盘相对收益:ts_regbeta(C, R1 − cs_mean(R1), 120)(ND 面,cs_mean 当市场序列),去掉全市场共同波动对斜率的污染。

    (c) 伙伴换成路径几何的另外几个量:收盘对 5 日高点的回撤(与 GP 找到的「距 3 日低点」对称)、日内振幅 high / low − 1、成交额对数增长
    cross_delta(log(day_sum(Amt)), 1)(Gervais、Kaniel & Mingelgrin 2001:创新高时的放量)。

    (d) 换响应的统计量:截距 cross_regalpha(C, R1, 120)(= 刚创新高那一天的期望收益);把斜率拆成 corr 与 σ 两半:除以
    σ_y(分母加 1e-4 的保护)留下 corr / σ_C,乘 σ_C 留下 corr × σ_y,——去掉 σ_y 后若得分明显变差,说明增益来自波动那一半(已被控制吃掉一部分);反向回归
    cross_regbeta(对数收益, C, 120);对 R1 先做半衰期 5 的 EMA 再回归。

    (e) 状态换成 C 减 Cmin(Aroon 振荡思路;第 1 轮 R 组里 ts_std(C 减 Cmin, 25) 是该组最好的,−1.36,train
    −1.19 / valid −1.36,两段平衡),以及对 60 日斜率再做半衰期 30 的 EMA 二次平滑。


    (3) 为什么和库里、和 head 不同:15 个种子的算子骨架(抽掉字段、常数、窗口)我逐个对照了 members.csv 的 5583 个骨架,一个都不在其中;库里含
    C 同款骨架的只有 ts_std / cross_quantile_q25 / sigmoid / cs_demean / neg 这类对 C 的变换或离散度读法,没有一个是「C
    与另一条日度路径的 120 日回归」。以 ON / ID 为伙伴、cs_mean 为市场序列、cross_regalpha / cross_reg_tvalue
    为统计量、日内振幅或回撤为伙伴的写法,都不是第 1 轮已评分过的候选(那些全是 cross_regbeta / cross_corr 配 R1 或成交额峰值位置)。本批
    head(day_skew 一族)读的是分钟内价格形状,与这里的日度路径回归没有共同的算子,日度秩 |ρ| 预计 < 0.3。


    (4) 为什么样本外还会在:读数每天只换窗口的 1/120,换手低,15 bp 的成本拖累小(第 1 轮里这一族的 train / valid 几乎相同,不像别的读法只有
    valid 在动);机制是锚定与注意力(George & Hwang 2004:靠近高点时好消息反应不足)再加上隔夜 / 日内两类参与者的差异,都是市场结构性的,不依赖某一段行情。最可能的失败方式:斜率里
    σ_y 那一半其实是波动读数,被 vol 控制吃掉之后只剩噪声((d) 的拆分正好检验这一点);隔夜与日内的拆分在一字板日(开盘 = 收盘)失真;C 只有约
    60 个取值,但所有种子的外围都是连续量,不会因并列而按列序选股。


    (5) 数学检查:C、R1、ON、ID 只用 t 日及以前的价格(day_open 是 t 日第一根有效分钟的开盘价,day_close 是最后一根的收盘价,t
    日收盘后全部已知,t+1 才交易),无前视;cross_delay 的天数为正。分母:R1 / ON 的分母是前收(后复权价,正数),ID 的分母是 t 日开盘价;除以
    σ_y 的那个种子,分母 cross_stddev(R1, 120) 加了 1e−4(日收益标准差在 1e−2 量级),不会出现除以近零的爆点。cross_regbeta
    / cross_corr 在窗口内 C 的方差为 0 时算子给 NaN(var_x > EPS 的保护),只影响长期停牌的票(可交易掩码已排除)。窗口在前
    d−1 天按已有天数展开,不是缺失也不是 0;最长的链是 120 日窗口加 C 自己的 60 日,约 180 日,占 train + valid 约 1,960
    个交易日的 9%,早期读数较噪、只会拉低分数。'
