  why: 拆解里 cross_mean 窗口 20→40 涨了 +0.30(train −1.46→−1.16、valid −1.00→−0.79,两段同时变好),20
    日窗口里的逐日形状噪声是烂部件。继续放慢到 80 / 160 日、改指数加权(半衰期 40 / 80,没有硬窗口掉出去的跳变)、取中位数(对个别极端偏度日稳健)、只取偏度符号的占比(忽略大小)。
  variants:
  - cross_mean(day_skew(Ret), 80)
  - cross_mean(day_skew(Ret), 160)
  - cross_ema(day_skew(Ret), 40)
  - cross_ema(day_skew(Ret), 80)
  - cross_med(day_skew(Ret), 120)
  - cross_mean(sign(day_skew(Ret)), 120)
- head: ts_stddev(day_skew(Vwap), 20)
  why: 拆解里 ts_stddev@20→10 是 −1.65、@20→40 是 −1.73(train −1.10 / valid −1.73),Vwap→Close
    几乎不变(−1.42):读数与字段无关,窗口一变 train 与 valid 此消彼长,窗口里的逐日硬跳变是烂部件。试 80 / 160 日、先 EMA 平滑、以及换成「偏度日变化的平均绝对值」(同样读偏度的不稳定,但不是方差,对一个极端日不敏感)。
  variants:
  - ts_stddev(day_skew(Vwap), 80)
  - ts_stddev(day_skew(Vwap), 160)
  - cross_ema(ts_stddev(day_skew(Vwap), 20), 40)
  - ts_mean(abs_(ts_delta(day_skew(Vwap), 1)), 60)
- head: signedpower(cross_quantile_q75(cross_reg_fvalue(day_skew(Open), day_skew(Open),
    10), 241))
  why: cross_reg_fvalue(x, x, 10) 是对自己回归:拟合完全,fvalue = 解释平方和 / EPS,实质是 x 的 10 日方差乘一个常数,数值上是退化写法。拆解里去掉它掉到
    −2.54(必要性 +0.97),说明有用的是「day_skew(Open) 的 10 日方差」;外层 q75 去掉只差 0.22(signedpower
    单调,不改变秩)。把退化回归换成诚实的 cross_stddev(day_skew(Open), 10),并试 241 日均值、窗口 20、EMA 半衰期
    60。
  variants:
  - cross_quantile_q75(cross_stddev(day_skew(Open), 10), 241)
  - cross_mean(cross_stddev(day_skew(Open), 10), 241)
  - cross_quantile_q75(cross_stddev(day_skew(Open), 20), 241)
  - cross_ema(cross_stddev(day_skew(Open), 10), 60)
