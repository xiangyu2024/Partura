- type: N
  hypothesis: '机制:把 B053 的「形状」读数搬到它看不见的地方。B053 的 3 个 head 读的是一天内分钟价格路径的形状(day_skew:价格是一直待在低位只偶尔冲高,还是反过来);拆解表里换字段(Vwap→Close、Open→Close)分数几乎不变,说明读到的是「一天里价格何时动」这类时间形状,而不是价位;而且全靠放慢才抬离底(cross_mean
    窗口 20→40 把 −1.46 提到 −1.16,train / valid 同时变好)。这一位问同一类问题,但放到分钟数据看不见的地方,窗口一律取 60
    ~ 120 日,读数都是比值 / 相关 / 无量纲量:


    (A) 隔夜 vs 日内(收益何时赚到,分钟线看不见的是收盘到次日开盘):ON = 开盘 / 前收 − 1,ID = 收盘 / 开盘 − 1(day_open(Open)、day_close(Close)、cross_delay
    实现)。Lou、Polk & Skouras 2019 的 tug of war:隔夜收益持续为正、日内持续为负的股票,背后是机构与散户两类客户群的差别,而且这种差别在
    3 到 12 个月内持续。种子:120 日隔夜均值减日内均值;各自 120 日夏普之差;隔夜波动对日内波动的比(信息是在盘外到达还是在盘中被交易出来);同日的相关与回归(缺口续航
    / 回补:cross_corr(ON, ID, 120)、cross_regbeta(ON, ID, 120));前一日日内对次日隔夜的相关(散户日内过度反应被隔夜纠正)。


    (B) 系统性 vs 特质性:与全市场日收益(cs_mean(R1),R1 = 日收益)的 120 日相关与贝塔(Morck、Yeung & Yu 2000
    的 synchronicity:同步性高的股票价格里公司特有信息少),以及隔夜与日内两种同步性之差(盘外信息有多大比例是系统性的)。ND 面写法:ts_corr
    / ts_regbeta 配 cs_mean。


    (C) 涨跌停单位下的极端:Z = R1 / LimitWidth(日频字段,主板 10%、创业板科创板 20%、ST 5%,把日收益换成「占当天允许涨跌幅的比例」,不同板块可比)。60
    / 120 日最大值、三次方均值、上下极端之和。B053 的 day_skew(Ret) 是分钟级的彩票性(Amaya 等 2015 的已实现偏度),这里是日级(Bali、Cakici
    & Whitelaw 2011 的 MAX;Barberis & Huang 2008 的彩票偏好),并用到库里一次都没出现过的 LimitWidth。


    (D) 成交的时间:day_centroid(Amt) = 当天成交额沿分钟轴的重心(0 = 全在开盘,1 = 全在收盘),Admati & Pfleiderer
    1988:成交的日内时点反映知情与流动性交易者的构成。B053 只看价格形状,没看成交何时发生。种子:重心的 60 日 EMA;成交重心与波动重心(day_centroid(abs_(Ret)))之差;成交重心与日收益的
    120 日相关(尾盘放量是否与上涨同日)。


    (E) 名义价格:LogFloatCap − LogFloatShares = log(流通市值 / 流通股数) = 未复权股价的对数,低价股效应的一个干净写法,只有这一个种子用到流通股数,是整个
    N 里唯一的日频字段水平读数。


    为什么和库里、和控制不同:LimitWidth、LogFloatCap、LogFloatShares、day_centroid 在两个库的 5583 条里一次都没出现过;库里的缺口读数(手写库里
    day_first(Open) 对前收的几条)最长只到 5 日窗口,多数是单日取绝对值或排名,没有一个是 60 ~ 120 日尺度的均值 / 相关 / 波动比;cs_mean
    当市场序列去做 120 日相关与贝塔的写法库里也没有。我把 16 个种子的算子骨架(抽掉字段、常数、窗口)逐个对照了 members.csv 的 5583
    个骨架,没有一个重复。控制:流动性(成交额水平)、波动(日收益绝对值水平)、20 日反转、已知成交额族、市值,都读水平或 20 日尺度;这里的读数几乎全是比值、相关、对数差,水平被约掉,窗口长到
    60 ~ 120 日。估计与 20 日反转的相关 < 0.4;(B) 的贝塔与 (C) 的最大值与波动控制有一定相关(约 0.4 ~ 0.6),但不会到 0.8,而且尺子会去掉它的线性、U
    形、S 形暴露。


    第 1 轮的教训怎么用的:第 1 轮 N 位(日收益路径的连续性:效率比、线性度、跳变占比、上下行半离差)全部 ≤ −0.81,GP 在种子上改出来的最好的一个是
    LogFloatShares 口袋加上行半离差(−0.81),说明单量的日度路径比值本身没有 alpha;第 1 轮 E 位最好的是「两个日度路径量的 120
    日回归」(−0.39)。所以这一位 16 个种子里一半是「两条日度量的 120 日关系」(缺口续航 / 回补、隔夜与日内的同步性、成交重心与日收益的相关、系统性),一半是
    120 日尺度的单量读数(隔夜 vs 日内的均值与波动、涨跌停单位下的极端、名义价格)。


    为什么样本外还会在:全部是 60 ~ 120 日的慢变量(窗口每天只换 1/60 ~ 1/120 的样本),换手低,15 bp 的成本拖累小;机制是客户群与信息到达方式的结构性差别(盘外机构
    vs 盘中散户、系统性 vs 特质性信息、散户的彩票偏好与涨跌停制度),这些在 A 股是长期存在的,不依赖某一段行情;读数是比值或相关,风格轮动(小盘 /
    高波)对它们的冲击比对水平类因子小。最可能的失败方式:隔夜 − 日内在 train 与 valid 的符号相反(方向由 train 定,min(train,
    valid) 会很差);(B)(C) 被波动控制吃掉;(E) 名义价格在 2018 ~ 2023 与 2023 之后风格切换。


    数学检查:ON、ID、R1、Z 只用 t 日及以前的价格与 t 日的 LimitWidth(第 d 天的日频平面存的是收盘时点已知的东西),t 日收盘后算出,t+1
    才交易,无前视;cross_delay 的天数为正;cs_mean 是 t 日的截面均值,只用 t 日数据。分母:ON 的分母是前收(后复权价,正数),ID
    的分母是开盘价,Z 的分母是 LimitWidth(0.05 ~ 0.3,不为零);种子里除以波动的两处(隔夜 / 日内波动比、夏普之差)分母加了 1e−4(日收益标准差在
    1e−2 量级),不会出现除以近零造成的爆点;一字板的日内收益为 0,不是缺失,整个窗口都是一字板才会让标准差接近 0,这只在新股上市后头几天出现,可交易掩码已排除。cross_corr
    / cross_regbeta / ts_corr / ts_regbeta 在窗口内方差为 0 时算子给 NaN(不为 0);day_centroid 在整天成交额为
    0 时给 NaN。热身期:最长的链是 120 日窗口加 60 日 EMA(约 180 日),占 train + valid 约 1,960 个交易日的 9%,早期读数较噪,只会拉低分数。种子都是连续取值,过得了「不同值
    ≥ 50%」的闸门(LogFloatCap − LogFloatShares 对每只股票是各自的连续值)。'
