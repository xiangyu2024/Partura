slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '类型 E,核心 C = div(day_close(Close), cross_delay(day_close(Close),1))(当日总收益)。创新度 4:快照 7 个 head 全是 day_skew 一族(heads 表),没有任何 head 含 C、LimitWidth 或 ListAge;C 与各 head 的原始 |ρ| <= 0.06,残差 <= 0.10(corr_1.md「slot a core」行)。13 个种子与 head 的原始 |ρ| 在 0.13 到 0.53 之间,最高的几个都是 ts_stddev(day_skew(Vwap),160)(种子 2、13 为 0.53;种子 6、9 为 0.48 到 0.49);去掉 5 个控制后种子 1、6、9 仍有 0.41 到 0.49 的重叠,说明事件强度与「日内形状 160 日波动」共享一个非控制成分(热门、高换手股票),但都低于 0.7 的库禁令线,不是同一个量的换写法。本流第 2 轮 N 位(prods2018Pr2b_Nb)已探过涨停事件族,best 列表里有 cross_max(收益−LimitWidth,60)(valid +0.10)、cross_max(cross_max(Z,60),60)等;本位的频率 EMA、尾部均值、炸板与次日溢价是外围上的新写法,所以给 4 不给 5。合理度 4:逐个算子核对。C 只用 t 与 t−1 收盘(cross_delay 只往回看),LimitWidth、ListAge 是 t 日已知的日频字段,无前视。is_gt/is_lt 对 NaN 给 0,随后引擎的停牌掩码把非交易格还原为 NaN(engine.py 文档),所以停牌不会以 0 的形式进入 EMA。cross_ema 是以有效日为分母的归一化加权平均(ops_ext.py:172),没有热身偏置。cross_tail_mean_q75/q25 只看过去 d 天(ops_ext.py:300 起)。种子 8 = EMA(触及) − EMA(封住) 是线性等价的「触及未封住」强度,且恒非负(封住日必是触及日);种子 9 的分子不超过分母,值域 [0,1),分母下限 0.01 有效。种子 12 的 cross_max/(cross_stddev+0.01) 受样本数约束,最大约为 sqrt(120),只有整窗几乎常数时才会到百级;尺子是截面排名,单只股票的爆点不支配截面。种子 13 的 Z 四次方在 ListAge<=5 处被置 0。窗口 20/30/60/120 与涨停的衰减尺度相称。机制层面两点,不是挡的理由:(a) 种子 1、3、4、6、7、8、9、10、11、12 没有 ListAge 排除,上市头几日不设涨跌幅时的大涨会被记为涨停事件,只有 2、5、13 做了排除(is_gt(ListAge,5) 实际排除 6 天,比不设涨跌幅的 5 天多 1 天,偏保守);(b) 种子 10 与 11 骨架相同,只差一个字段(开盘溢价对收盘收益),不是重复,保留,但 PI 应知道两者高度相关。不划种子:没有种子的原始 |ρ| 达到 0.7,没有控制的 |ρ| 达到 0.8,13 个种子都落在核心的 (a) 到 (f) 某一项内,也没有完全相同的表达式(只能对 missions_before 的 best 列表做精确比对,存档 267 条全文不在输入里,这一条未能全查)。E 位约束:C 在 r3/loc.json 的 core_cards 与富集表中(含 C 的 65 个候选,均值差 +1.26,p 0.000);此前 E 核心只用过 cross_argmax(day_quantile(Open),60)(r1、r2 各 1 个 E 位),所以 C 是第一个 E 核心;核心与 5 个控制的 |ρ| 最大 0.17(rev),< 0.8;13 个种子机械检查都原样包含 C。如果它有 alpha,最可能来自涨跌停的限幅延迟价格发现,以及涨停次日的溢价与短线资金接力(种子 1、2、8、9、10、11);或高涨跌停频率股票的彩票式偏好(种子 6、7、12、13)。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [9]
    reasons: '类型 N。创新度 4:14 个种子全是「收益对昨天或同日某个市场、个股状态」的 120 日滚动关系读数,x 是 cs_mean 的滞后收益、涨跌停占比、LimitWidth 指示或个股滞后量;LimitWidth 不在快照的任何 head 中(heads 表)。原始 |ρ| 最高是种子 5 与 pow_2(cross_product(cross_corr(day_skew(High),...)))的 0.37,其余多数 <= 0.20;控制中最高是种子 5 的 size 0.25、vol 0.22,种子 12 的 vol 0.18、known 0.18,都远低于 0.5,不是控制的换写法。种子 1、2、3 共用同一个 x,实际独立的约 10 个,这是多样性问题,不是重复。库里的 5583 条我在工作区里没找到文件,「LimitWidth 从未出现」「cross_regbeta 的 x 都是分钟统计量」这两条依 PI 的 grep,我没有独立核对。合理度 4(种子 9 划掉后):所有 x、y 只用 t 及以前的数据,cross_delay 只往回看。按 common.py 的 rolling_ols,ts_regbeta(x,y) 与 cross_regbeta 是 y 对 x 的滚动 OLS 斜率(y ~ alpha + beta·x),方向与假设一致;var(x) 不足时给 NaN,不会爆点。cs_mean 只在有效股票上平均,引擎的停牌掩码作用于每个节点,所以涨跌停占比的分母是有效股票数,不是全部列。机制层面三点,不是挡的理由:(a) 种子 2 的 t 值比 1 的斜率干净,因为斜率随个股 σ 放大;(b) 种子 5 是同日的市场涨停占比,x_t 与 y_t 同日,得到的是股票在热门日的敏感度(风险暴露),不是昨天到今天的预测;组内标题写的是「昨天」,与种子 5 不一致,PI 应改名或删去;(c) 种子 4、5、14 的市场涨跌停计数把上市头几日不设涨跌幅时的大涨也算了进去,IPO 集中的时段会抬高 x。种子 9 划掉的理由是数学问题(定义坏掉)。CLV = (Close−Low)/(High−Low+0.0001)。一字涨停日 High=Low=Close,分子为 0、分母为 0.0001,CLV = 0,即把最强的涨停日读成收在最低;一字跌停日 CLV = 0 恰好正确,所以错误只出现在涨停一侧。PI 笔记说「分子分母都是 0」,分母其实是 0.0001,结论 CLV = 0 却是错的。后果是涨停股一字日次日的收益(继续上涨的概率高)被放在 x=0 处,斜率被机械地压成负值,即伪「反转」信号。修法是零振幅日取 0.5 或 1 后重算。其余种子无划掉理由(无 0.7 与 0.8 的自动划线,也无完全相同的表达式;种子 10 与 12 只差是否去掉大盘,按规则不算重复)。如果它有 alpha,最可能来自对前一日大盘的响应(信息扩散慢,种子 1、2、3、13)、市场情绪日的敏感度(种子 4、5、14),或个股的滞后性格(昨天隔夜缺口、振幅、收益、5 日累计,种子 7、8、10、11、12)。'
R:
  - head: 'cross_mean(cross_stddev(day_skew(Open), 10), 241)'
    soundness: 4
    reasons: '合理度 4。机制是日内价格形状的 10 日不稳定性在 241 日上的慢平均,说不清机制不是挡的理由。拆解里字段 Open 换成 Close 把 -0.88 提到 -0.50,两段都更好,与 R 理由一致;算子组合核对无误(day_skew 为日内、cross_stddev 为日轴 10、cross_mean 为日轴 241)。变体 cross_ema(cross_stddev(day_skew(Close),10),120) 是归一化的指数平均,没有热身偏置。cross_mean 在前 240 天是扩张窗口(rolling_windows 左补 NaN,common.py:433),2018 年早期的值由少数几天决定,只影响训练段前两年的噪声,不构成 §4 的定义问题。变体与原 head 的 |ρ| 为 0.88 到 0.98(corr_1.md「R 1」行),按 R 规则是替换候选而非新 head,审计只评合理度,不据此扣分。如果它有 alpha,最可能来自日内价格形状的不稳定性所代表的机构 / 散户交易强度的慢变化。'
  - head: 'ts_stddev(day_skew(Vwap), 160)'
    soundness: 4
    reasons: '合理度 4。机制是 VWAP 口径日内偏度的 160 日滚动标准差,拆解表显示窗口由 160 放到 320 时两段同时变好(-0.71 到 -0.48),说明硬窗口长度确实是部件问题,与 R 理由一致。变体 ts_stddev 放到 241、480,以及 Close 配 320、cross_ema(·,60) 都是同一算子在不同窗口或软窗口下的写法,算子组合正确。480 变体的前 480 天是扩张窗口,2018 到 2019 年的训练段估计更吵,但不是 NaN 或常数,不是 §4 的问题。变体与原 head 的 |ρ| 为 0.73 到 0.95(corr_1.md「R 2」行),按 R 规则是替换候选,审计只评合理度。如果它有 alpha,最可能来自日内价格形状的波动在中期的持续性,也就是价格路径的不稳定性本身。'
  - head: 'cross_mean(day_skew(Ret), 160)'
    soundness: 4
    reasons: '合理度 4。这是本流最好的 head(-0.39,train -0.39 / valid -0.14),机制与第一组相同,都是日内偏度的慢平均。拆解里 train 与 valid 此消彼长(320 日时 valid 为 +0.19 而 train 掉到 -0.47),试 241 日、EMA(·,120) 的软窗口、以及「160 日均值减 480 日均值」去掉长期底,都是合理的部件替换写法,算子核对无误。「160 减 480」在 t<160 时两项都是扩张窗口、差为 0,是正常的热身表现,不是 bug。变体与原 head 的 |ρ| 为 0.47 到 0.95(corr_1.md「R 3」行),按 R 规则处理,审计只评合理度。如果它有 alpha,最可能来自日收益偏度水平的长期变化,即收益分布的不对称程度随时间的慢漂移。'
summary: '两位都通过:a(E,核心 C)13 个种子全留,创新 4、合理 4;b(N)划掉种子 9(CLV 在一字涨停日读成 0 的定义错误),留 13 个,创新 4、合理 4;三个 R 组合理度均为 4。无自动划线。给 PI 的提醒:种子 9 的 CLV 应修;E 种子中 ListAge 上市头排除只覆盖 2、5、13,应补到其余种子;N 组种子 5 是同日量,与组标题「昨天」不符。'
