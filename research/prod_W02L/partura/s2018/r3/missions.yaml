- type: N
  hypothesis: |-
    机制:一类「今天的收益对昨天某个状态的 120 日响应」的读数 —— 每只股票自己估计的、可预测性的强度与符号。结构上沿用本流第 1 轮 E 位最好的写法(cross_regbeta(状态量, 日度路径量, 120)),但把状态量换成 B054 与前两轮都没碰过的变量。

    inspired_by 的现象见下;种子分四组(R1 = 日收益 = div(day_close(Close), cross_delay(day_close(Close), 1)) − 1,MKT = cs_mean(R1)):
    (A)对昨天大盘的响应(信息扩散速度):斜率 ts_regbeta(cs_mean(cross_delay(R1, 1)), R1, 120)(种子 1)、t 值(种子 2)、先对当天大盘回归取残差再对昨天大盘回归(种子 3,Hou & Moskowitz 2005 的价格延迟思路:慢吸收大盘信息的股票,收益里有对昨天大盘的响应)、只取大盘为负的那一半(种子 13)。机制:信息扩散慢的股票有延迟溢价(Lo & MacKinlay 1990;Chordia & Swaminathan 2000 是成交量版)。
    (B)对昨天市场情绪的响应(新数据):x = 昨天全市场涨停占比 cs_mean(is_gt(R1 / LimitWidth, 0.95))(种子 4)、同日的涨停占比(种子 5)、昨天跌停占比(种子 14)、昨天全市场的日内振幅(种子 6)。机制:炒作情绪好的日子,对情绪敏感的股票跟随;LimitWidth 是库里一次都没出现过的叶子。
    (C)对自己昨天的响应:昨天隔夜缺口(种子 7)、昨天日内振幅(种子 8)、昨天收盘位置 CLV = (收盘 − 最低) / (最高 − 最低 + 0.0001)(种子 9)、昨天收益 = 一阶自回归(种子 10)、昨天起的 5 日累计收益(种子 11)、扣掉大盘后的特质一阶自回归(种子 12)。机制:读的是「反转 / 延续」的个股性格,窗口 120 日是慢变量。

    为什么和库里、和 head 不同:库里 cross_regbeta 有 69 条、ts_regbeta 有 30 条,但它们的 x、y 都是分钟统计量(day_q_stat_std、day_var、nt_* 一类)的组合;我 grep 过:x 或 y 是 cross_delay / ts_delay 的滚动回归、相关一条没有,以 cs_mean(跨股票均值)当 ts_regbeta / ts_corr / ts_cov 的 x 的一条没有,「昨天的状态对今天的日收益」的写法库里没有;本流 7 个 head 全是 day_skew(分钟内价格形状)与其嵌套相关。第 2 轮同族种子(ts_corr / ts_regbeta 配当天大盘,隔夜 / 日内的同日相关)与 head 的日度秩 |ρ| 最高 0.31;本位全部读「昨天 → 今天」的滞后关系或情绪占比,预计更低。

    为什么样本外还会在:窗口 120 日(每天只换 1/120 的样本),慢变量,换手低;机制(信息扩散、散户情绪、反转 / 延续性格)是结构性的。本流已有的教训:单量的日度路径比值没有 alpha(第 1 轮 N 位全部 ≤ −0.81),两个日度量的关系类读数相对最好(第 1 轮 E 位 −0.39),所以这一位 14 个种子全是「关系类」,没有一个是单量的比值。最可能的失败方式:120 日回归斜率的估计噪声大(每个窗口只有 120 个点),截面排名里噪声占主导,train / valid 不一致;种子 1、2、3 彼此高度相关(同一个 x),所以实际独立的种子约 10 个;一阶自回归类(种子 10、12)与流动性的相关可能偏高(买卖价差反弹),预计 0.2 ~ 0.4,不到 0.8 的划线。

    数学检查:所有 x、y 只用 t 日及以前的数据(cross_delay 的天数为正),t 日收盘后算出,t+1 才交易;ts_regbeta / cross_regbeta 在窗口内 x 的方差为 0 时给 NaN(var_x > EPS 的保护),涨停占比与大盘收益每天都在变,不会是常数;CLV 的分母加了 0.0001(最高 − 最低是后复权价的量级,一字板日分子分母都是 0,CLV = 0);select_where(大盘为负, 大盘, 0.0) 里的 0.0 是浮点常数,和 cs_mean 同为浮点。已在一个本地合成立方体上(60 只 × 320 日,CPU,无真实数据)确认 14 个种子都能算出、覆盖率约 0.97;涨停占比类种子在合成数据里没有涨停事件(x 为常数,NaN),这是合成数据的缘故,真实数据里全市场每天都有涨停。
  inspired_by: B054(33 个成员,signedpower(cross_quantile_q75(cross_corr(day_skew(High), mul(day_mean(High), day_skew(High)), 10), 241)) 一族)与本流的定位表:(i) 含 day_skew 的候选均值 −2.7 ~ −3.5,含日度收益路径 C 的 65 个候选均值 −1.13(富集 +1.26,p < 0.001),分钟内形状读数是烂部件、日度路径才有东西;(ii) B054 的 head 是「两个量的滚动相关再嵌套」,说明这一类结构本身有读数,只是它们读的变量(分钟偏度)是坏的;(iii) 第 1 轮 E 位最好的一族是 cross_regbeta(状态量, 日度路径量, 120)。所以把「两个量的滚动关系」搬到日度路径上:今天收益对昨天状态的响应。
