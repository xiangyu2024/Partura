- type: E
  core: div(day_close(Close), cross_delay(day_close(Close), 1))
  hypothesis: |-
    机制:核心 C = div(day_close(Close), cross_delay(day_close(Close), 1)) 是日收益的总比值(后复权收盘对前一日收盘;后复权后的比值跨除权日连续,等于真实的除权后收益)。这一位沿本流目前唯一抬离「底」的一条线深挖:价格涨跌停的事件结构。

    (1) 这一线是怎么来的(只用 train / valid 的读数)。本流 267 个已评分候选里,最好的三个都含 C:第 2 轮 N 位的 cross_max(收益 − LimitWidth, 60) = +0.31 / +0.10,cross_max(cross_max(收益 / LimitWidth, 60), 60) = +0.75 / 0.00,第 2 轮 E 位的 regalpha / 波动 = +0.09 / +0.06。前两个读的是「60 到 120 日里最近有没有碰到本板涨停」(收益 − LimitWidth 对涨停股约为 0,对其余股为负;LimitWidth 随板块取 10% / 20% / 30%,所以主板与创业板、科创板的涨停可比)。窗口越长 train 越好(60 日 0.31 → 120 日 0.75),valid 在 60 日最好、120 日为 0、241 日为 −0.32。含 C 的 65 个候选均值 −1.13,不含 −2.4(富集 +1.26,p < 0.001),而含 day_skew 的候选均值 −2.7 到 −3.5。所以信号如果有,在「涨停事件」,而不在 C 的其他写法;最大值只是事件的一个统计量,这一位换掉统计量。

    (2) 机制与文献。涨跌停是 A 股最显眼的事件:限幅会延迟价格发现、使涨停之后的几天继续同向(Kim & Rhee 1997 对价格限幅的研究;Bali、Cakici & Whitelaw 2011 的 MAX 是同一类「极端日」读数,但美股方向相反),T+1 与散户 / 短线资金的跟风让事件带有持续性与可预期的衰减。max 读不到的几件事,正是本位 13 个种子的外围(Z = 日收益 / LimitWidth):
    (a) 频率与新近度:cross_ema(is_gt(收益 / LimitWidth, 0.95), 20 / 30 / 60) 是涨停事件的指数衰减强度(半衰期 20 ~ 60 日),同时含次数与新近度;is_gt 对缺失给 0,EMA 的尾部让取值连续(旧事件的权重按 0.5^(天数 / 半衰期) 衰减但不为 0),不是离散计数,过得了「不同值 ≥ 50%」的闸门。种子 1、2。
    (b) 上市初期的污染:科创板与 2020-08 后的创业板上市头 5 日不设涨跌幅,LimitWidth 对这些日子失真(上一轮审计员指出的口径问题)。种子 2、5、13 用 is_gt(ListAge, 5) 把上市头 5 日排除;ST(5%)不在 LimitWidth 里,0.95 的阈值使 ST 的涨停不被计入,这是有意保守。
    (c) 对称与方向:跌停强度(种子 4)与涨停减跌停(种子 3),以及上 / 下四分位的均值之和(种子 7,日收益 / LimitWidth 的偏度式读数,cross_tail_mean_q75 与 q25 取窗口内尾部的条件均值)。
    (d) 封板质量(炸板):盘中最高价触及涨停但收盘没有封住,是「买盘不足以撑到收盘」(种子 8,触及的 EMA 强度减去收盘封住的 EMA 强度;种子 9 是封住 / 触及的比,分母加 0.01)。
    (e) 事件之后:昨天涨停、今天的开盘溢价(种子 10)与收益(种子 11)的 60 日 EMA,读的是短线资金接力的强弱(A 股常说的涨停次日溢价)。
    (f) 极端相对典型:cross_max(Z, 120) / (cross_stddev(Z, 120) + 0.01)(种子 12)与 Z 的四次方均值(种子 13,pow_2 两次),前者是无量纲的「跳」,后者把涨停日权重推到平方外。种子 6 是 Z 的上四分位均值。

    (3) 为什么和库里、和 head 不同。我 grep 过两个库的 5583 条表达式:LimitWidth、ListAge、BoardCode、cross_ema、cross_tail_mean 一次都没出现;is_gt / is_lt 出现 792 次,但作用在分钟轴的掩码上(in_slice、delete_open_close 一类),没有一条对日涨跌幅做事件指示,更没有「事件指示的指数衰减强度」;本流 7 个 head 全是 day_skew(分钟内价格形状)一族,上一轮同类种子(cross_max(Z, 60) 等)与 head 的日度秩 |ρ| 不超过 0.25。本位 13 个种子与已见过的含 C 候选的外围(cross_max / sub / LimitWidth 一类)都不同,新增的算子有 is_gt、is_lt、cross_ema、cross_tail_mean_q75 / q25、select_where、ListAge。

    (4) 为什么样本外还会在,以及最可能的失败方式。机制是制度性的(±10% / 20% 限幅、T+1、散户与短线资金占比高),不依赖某一段行情;种子的半衰期取 20 ~ 60 日,换手低,15 bp 成本拖累小。但是数据已经给了警告:同一族 train 强(0.75)而 valid 为 0,最可能的原因是 2023 年下半年起监管收紧、对炒作的惩罚加重,事件溢价变弱。这一位的价值就在于它直接检验:新近度 / 频率(a)、去上市初期(b)、封板质量(d)能否让 valid 抬起来;评分是 min(train, valid),所以只有两段都有才算。失败方式:事件强度与波动控制的相关偏高(预计 0.3 ~ 0.55,低于 0.8 的划线),被尺子去掉线性 / U 形 / S 形暴露后剩得少;种子 10、11 是稀疏事件,噪声大。

    (5) 数学检查。C 只用 t 日与 t−1 日收盘,日频字段 LimitWidth / ListAge 是 t 日已知量,cross_delay(·, 1) 只往回看,无前视(t 日收盘后算出,t+1 才交易)。第 1 天 C 为 NaN,is_gt / is_lt 对 NaN 给 0,EMA 把这一天当作无事件。分母:种子 9 的分母 cross_ema(触及) + 0.01 不会为 0;种子 12 的 cross_stddev(Z, 120) + 0.01,Z 的典型标准差约 0.2 ~ 0.4,一字板全窗口为常数时分母是 0.01、分子为 0 或常数,不会出现爆点。select_where(ListAge > 5, 收益 − LimitWidth, −1.0) 把上市初期排到最低,不进最大值。已在一个本地合成立方体上(60 只 × 320 日,CPU,无真实数据)逐个确认 13 个种子都能算出、覆盖率约 0.97 以上;事件类种子在把阈值降到 0.25 后不同值比例为 1.0。
