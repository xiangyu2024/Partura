slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [5]
    reasons: '创新度 4。核心 C = cross_argmax(day_quantile(Open),60) 的价格路径版本在库里只有 head 一条(members.csv 中 cross_argmax(day_quantile(...)) 共 15 条,用 Open 的只有 head;其余是 Ret、Amt 等字段的变换)。cross_argmax(day_sum(Amt),60) 在库里出现 0 次,所以 seed 9 至 11 的成交额峰值时差是新核心。cross_ema、cross_zscore、cross_age、cs_first_low40、cs_flip_by_state、cross_semistd 在库里各出现 0 次。与 head 的日度秩 |ρ| 最高 0.36(seed 3),与 5 个控制最高 0.30(核心对 rev),残差后最高 0.46(seed 12)。低相关本身不算新颖的证据,但外围读法确实不在 head 或库里。核心与 head 同族,所以给 4 而不是 5。合理度 4。逐个算子核对:cross_argmax 用 nanargmax_last,pct = (距今天数+1)/有效天数,窗口左侧 NaN 补齐,只用 t 日及以前的数据;cross_ema 跳过缺失日;cross_zscore 含当天,近常数窗口置 0;cs_first_low40 把市值最低 40% 的票整体加 1 抬到上段;cs_flip_by_state 用 _trailing_rank(含当天、241 日窗口),NaN 安全;cross_corr 带 EPS 有界;cross_regbeta(C,R1,120) 是 R1 对 C 的斜率(cov/var(C));cross_age 对首日已有数据的票从 10000 起算,相关对平移不变。§4 的 nanrank_last 陷阱不适用:没有种子用 ts_rank、cross_rank 或 in_rank_rolling,cs_flip 的 _trailing_rank 在缺失时返回 NaN 而不是 0。三处需要记下,但都不是主导结果的数学问题:(1) C 的 pct 分子按日历位置计、分母按有效天数计,窗口内部有缺失日时 C 可以超过 1,超出幅度约为缺失天数与有效天数之比。PI 笔记说只影响长期停牌的票,实际上窗口内任何缺口都会,但影响小。(2) seed 12 的 cs_first_low40(ts_std(C,25),LogFloatCap) 与市值秩的 |ρ| 为 0.72,低于 0.8 的自动划掉线,但阶跃位于 40% 分位,残差只去掉市值秩的一、二、三次项,阶跃的非多项式部分会留下小盘尾部暴露。(3) seed 4 与 seed 6 是同一对 EMA 的差与对数比,近似重复。种子间相关表没有给出,未核实数值,所以不划,交 PI 处理。划掉:seed 5,理由是重复。它与 R 组变体 11 逐字相同(missions.yaml 第 30 行与第 83 行),同一轮中会被重复发现。其余自动规则不触发:head |ρ| 最大 0.36 小于 0.7,控制 |ρ| 最大 0.72 小于 0.8;核心对控制的 |ρ| 最大 0.30 小于 0.8,E 位通过。如果它有 alpha,最可能来自:60 日高点年龄的相位与状态(seed 1 至 4 与 seed 6 的 cross_zscore、EMA 与 Aroon 式相位切换,即 52 周高点锚定的读法),其次是高点与成交额峰值的时差(seed 9 至 11,量先于价),再次是小盘段内的离散度(seed 12)。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。库里 cross_age、cross_semistd、cross_zscore、cs_flip_by_state 各出现 0 次;cross_regbeta 的 69 条中没有一条的参数同时含 day_close 与 cross_delay;cross_sum(abs_) 只有 2 条,都不是效率比或路径长度比。最接近的库内表达式是 L303,它含 12 日区间内收盘位置的 ts_corr 组合,是随机振荡型,不是区间效率。与 head 的日度秩 |ρ| 最高 0.30(seed 1 与 seed 5),seed 7 与 seed 9 只有 0.01。与 5 个控制最高 0.48(seed 1 对 20 日反转),seed 4 为 0.47,都低于 0.5,不按控制换写法处理。但 seed 1 与 seed 4 靠近 0.5,残差后会被削弱。合理度 4。逐个核对:seed 1、3、4 的分子与分母都取 60 日窗口内的 R1,和除以绝对值和,值在 [−1,1];seed 1 的分子与分母跳过同样的日子(R1 为 NaN 时两者都跳过),自洽。seed 2 用 120 日对数价差与同窗口的 |Δlog| 和,分子分母口径见下文 (2)。seed 5、6 是 cross_corr 与 cross_reg_tvalue 对时间斜坡,符号随趋势方向;简单回归下 t 值与相关对 x、y 互换对称,参数顺序不影响。seed 7 的 max/sum 在 [0,1];seed 10、11 的半离差在有效日不足 3 时为 NaN,log 对 0 返回 NaN,不是负无穷。以下问题都不是 §4 的数学问题,不划:(1) seed 8 的 mul(cross_sum(R1,60), cross_mean(sign(R1),60)) 是符号对称的。累计涨跌为负且多数日下跌的票乘积为正,与累计上涨且多数日上涨的票同号。算子组合实现的是趋势强度乘一致性,不是 idea 里「涨得多但多数日下跌则为负」的方向性判断。它更像一个探针,PI 应理解为它测的是强趋势而非连续上涨。(2) seed 2 的分子是 120 日对数价格差,跨停牌缺口的变化计入分子;分母只加有限的 |Δlog|,缺口日被跳过。因此有停牌的窗口里数值可以超过 1,影响限于有停牌的票。seed 1、3、4 的分子分母口径一致,不受影响。(3) PI 写 (D) 区间效率在 (0,1] 不对。总区间 max(High)−min(Low) 含隔夜跳空,分母只加日内区间,比值可以超过 1,在日内区间接近 0 的连续涨跌停票上会放大,排名后影响有限。(4) seed 10、11 的机制是上行与下行波动的不对称(Bollerslev 式好坏波动),不是路径连续性;idea 文本把 (E) 列入,故保留。(5) 种子内冗余:seed 1、3、4 是同一效率比的原值、绝对值与时间 z 分数三种写法,seed 10、11 是同一上下行比的 60 日与 120 日两种窗口。这是冗余,不是重复,不划。划掉:无。自动规则不触发。如果它有 alpha,最可能来自:集中大涨日与连续小涨日的注意力差异(seed 1 至 4、8 的路径效率与一致性,即 Da、Gurun 与 Warachka 的 frog-in-the-pan 读法),其次是跳变占比(seed 7)与上下行波动比(seed 10、11)。'
R:
  - head: 'ts_std(cross_argmax(day_quantile(Open), 60), 50)'
    soundness: 4
    reasons: '只评合理度。机制:ts_std 的 50 日窗口在拆解中偏慢,窗口 25 的 score 为 −1.59,valid 由 −2.18 升到 −1.30(train 两者都是 −1.59)。增益 +0.59 全部来自 valid,只有这一段样本支持。这是规则允许的选择,但证据只有一段,PI 应在下一轮检验。argmax 的复位跳与窗口选择在数学上有界:ts_std 与均值不含近零分母,argmax 的 pct 在 (0,1] 附近,cross_zscore 对近常数窗口有保护,无前视,无 §4 陷阱(nanstd_last 按有效数计,缺失不当作 0)。变体 1、6、7 与 head 的原始 |ρ| 为 0.46 至 0.47,残差后 0.55 至 0.56;变体 6 与 7 只把 Open 换成 Close 或 Vwap,几乎是同一个 ts_std(C,25),重复度高,但不违规。变体 9 与 head 的 ρ 为 0.67(残差 0.79),变体 15 为 0.77(残差 0.80),两者都是对 head 的平滑。按 R 规则它们走替换路径(ρ 不小于 0.5),与库禁令 0.7 的收录路径不冲突。变体 1、9、15 与已知族 |ρ| 为 0.01、0.03、0.07。变体 11 与 E 位 seed 5 逐字相同,E 位那一条已划掉,R 组保留。机械门槛标为废品的变体 2、3、5、10、13 不在本次打分内。'
summary: '两个位均通过:a 位创新 4、合理 4,划掉 seed 5(与 R 变体 11 重复),余 12 个;b 位创新 4、合理 4,无划掉,11 个。R 组合理 4 保留。主要注意:a 的 seed 12 小盘残留、seed 4 与 seed 6 近重复、C 的 pct 在窗口内部缺口可超过 1;b 的 seed 8 符号对称、seed 2 缺口口径、(D) 的 (0,1] 界不成立。'
