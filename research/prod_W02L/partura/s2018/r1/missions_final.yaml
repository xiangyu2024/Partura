  core: cross_argmax(day_quantile(Open), 60)
  hypothesis: '机制:核心 C = cross_argmax(day_quantile(Open), 60)。day_quantile(Open) 是当天各分钟开盘价的中位数,即一条日度价格路径(后复权);cross_argmax(·,
    60) 在日轴上取最近 60 个交易日里最高点的位置,pct 口径 = (最高点距今天数 + 1) / 窗口内有效天数,取值约在 (0, 1]:1/60 =
    今天刚创 60 日新高,1 = 最高点在窗口最早那一天。所以 C 是「60 日高点的年龄」,有界、无量纲、对价格水平与波动水平不变(把价格乘任何正常数,argmax
    的位置不变)。

    (1) 批里的拆解说了什么(只用 train / valid 的数)。head = ts_std(C, 50),−2.18(train −1.59 / valid
    −2.18)。把 argmax 拿掉的 ts_std(day_quantile(Open), 50) 是 −2.19,必要性只有 +0.01,但它与已知成交额族的
    ρ 是 0.53;带 argmax 的几个变体(Open 换 Close、窗口 25、窗口 100)的 ρ_known 只有 −0.06 / −0.02 /
    0.09。所以 argmax 这一层不是增益,它的作用是把「价格水平的波动」(已知族吃掉的那一块)换成一个与水平无关的「路径形状」读数。再看 train 列:三个
    ts_std 窗口(25 / 50 / 100)是 −1.590 / −1.594 / −1.594,几乎逐位相同,Open 换 Close 是 −1.56,去掉
    argmax 的两个变体是 −1.61 / −1.64;只有 valid 列在动(−1.30 到 −2.38),窗口 25 最好。我把 train 的 −1.6
    读成这一族共同的底(扣 15 bp 之后的成本拖累,毛超额约为 0),不是信息;批里目前没有证据说明 C 本身带 alpha。所以这一位是低先验的探索:不给一个已被证实的东西加码,而是问「C
    换一种外围读法会怎样」。

    (2) head 的外围只有一个:ts_std(离散度)。批里别的成员(Ret 口径)也只是 ts_std、cross_quantile_q25、sigmoid、cs_demean、ts_quantile_q50、neg
    这几种。这个位把外围换成五类 head 没有碰过的读法,每个种子都原样带着 C:

    (a) 年龄的状态读法:cross_ema(C, 20)、cross_zscore(C, 120)(相对自己 120 日平均年龄)、cross_ema(C,
    5) 减 cross_ema(C, 60)(高点在变新鲜还是变陈旧)。机制是 52 周高点锚定(George & Hwang 2004):投资者拿近期高点当参照价,离高点近时对好消息反应不足、离高点远时对坏消息反应过度;这里读的是「时间」距离而不是价格距离,而且是个有界的慢变量。

    (b) 高点与低点的对称读法:C 减 Cmin,Cmin = cross_argmin(day_quantile(Open), 60) 是同一路径 60 日最低点的年龄。这是
    Aroon 振荡器(Chande & Kroll 1994)的思路:最近一次极值是高点还是低点、多久以前。取 cross_ema(·, 20) 看水平,取
    ts_std(·, 25) 看趋势相位切换的频繁程度(来回切 = 震荡),再取两个年龄的 log 比。

    (c) 高点与日收益的滚动关系:cross_corr(C, R1, 60) 与 cross_regbeta(C, R1, 120),R1 = 日收盘对前一日收盘的收益(含隔夜)。创新高总是伴随上涨日,问题是创新高靠少数几个大涨日(跳变),还是靠一串小涨日慢慢爬上去;这两种来源后续的表现通常不同(注意力有限的市场里,连续的小消息被低估,集中的大消息被过度反应,Da、Gurun
    & Warachka 2014 的 frog-in-the-pan)。窗口 60 到 120 日,变化慢。W01 里样本内最好的一类结构正是「两个日度量的
    60 日滚动关系」,这里的底和伙伴(高点年龄 × 日收益)与那几个 head 都不同。

    (d) 价格高点与成交额高点的时间关系:Camt = cross_argmax(day_sum(Amt), 60) 只取成交额 60 日峰值的「位置」,不含任何成交额水平,所以不可能是已知成交额族的改写。cross_corr(C,
    Camt, 120)(两条锯齿线是否同时复位 = 放量创新高)、ts_std(C 减 Camt, 25)(价量峰值时差的离散度)、cross_ema(Camt
    减 C, 20)(时差的水平;Camt 大于 C 表示成交额峰值比价格峰值更早,价格是在缩量上创的新高)。机制是量先于价(Karpoff 1987)与放量日的后续收益(Gervais、Kaniel
    & Mingelgrin 2001):价格高点有没有被成交确认。

    (e) 条件读法:cs_first_low40(ts_std(C, 25), LogFloatCap):把 ts_std(C, 25) 只在流通市值最低的
    40% 里排序,其余排在后面,依据是套利限制越强异象越强(Stambaugh、Yu & Yuan 2015);cs_flip_by_state(cross_ema(C,
    20), day_sum(Amt)):全市场成交额高于自己 241 日中位数时取正号、低于时取负号,依据是异象的符号随情绪状态变(Baker & Wurgler
    2006)。如果 C 本身没有稳定的符号,翻转版会明显比 cross_ema(C, 20) 更差,这本身就是检验。

    (3) 为什么和库里、和 head 不同:库里含 C 同款骨架的只有 ts_std、ts_std 套 ts_std、cross_quantile_q25 套
    ts_std、sigmoid 与 cross_mean 等,外围算子集合与这里 13 个种子没有一个相同;cross_ema、cross_zscore、cross_argmin、cross_corr(以
    C 为一端)、cross_regbeta(以 C 为一端)、cs_first_low40、cs_flip_by_state 这些算子都没有和 C 一起出现过。我把
    13 个种子的算子骨架(抽掉字段、常数、窗口)逐个对照了 members.csv 的 5583 个骨架,没有一个重复;唯一与 head 同骨架的写法 ts_std(C,
    25) 我没有放进种子(它在 R 组)。种子对 head ts_std(C, 50) 的相关预计都低于 0.7:(a)(b) 读的是水平或相位,(c)(d)
    是 C 与另一条序列的关系,都不是 C 自己的离散度。

    (4) 为什么样本外还会在:这里每一种读法都是慢变量(窗口 20 到 120 日,锯齿的年龄每天只变 1/60,没有一个读数逐日抖动),换手低,15 bp
    的成本拖累小;机制是行为性的(锚定、注意力、套利限制),不依赖某一段行情;读的都是形状,不是水平,所以风格轮动(小盘 / 价值 / 高波)对它们的冲击比对水平类因子小。最可能的失败方式:C
    本身的符号不稳(最近一次极值的年龄在不同年份朝不同方向),(a) 与 20 日反转控制仍然有 0.5 左右的相关,被尺子去掉之后什么都不剩;(c)(d) 在
    60 日窗口里估得太吵。

    (5) 数学检查:C 只用 t 日及以前的开盘价(分钟线内取中位数,当天收盘后才知道,t+1 才交易),无前视;窗口里有停牌日时 pct 的分母是有效天数,C
    可能略大于 1,只影响长期停牌的票,可交易掩码已排除;day_quantile 在整天无数据时给 NaN,不是 0;cross_zscore 对近常数窗口有保护(算作
    0);cross_corr 与 cross_regbeta 的窗口里有效对太少时可能给 0(已知缺陷,只影响上市不久的票,掩码已排除);除法只出现在 R1
    里,分母是前一日收盘价(正数);Camt 只取位置,不含成交额水平,没有溢出。热身期:最长的链是 cross_zscore(C, 120),C 自己的窗口
    60 日加 120 日,约 180 日,占 train + valid 约 1,960 个交易日的 9%;窗口在前 d−1 天按已有天数展开(不是缺失、不是
    0),早期读数较噪,只会拉低这个种子的分数,不会造出信号,所以不主导结果。C 本身只有约 60 个取值,单独做根会过不了「不同值 ≥ 50%」的闸门,所以所有种子都在外面加了连续取值的外围(ts_std、cross_ema、cross_zscore、滚动相关与回归、乘
    / 减连续量),不会因为并列而变成按列序选股。'
