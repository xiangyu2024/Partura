- type: N
  hypothesis: '机制:价格路径的连续性。同一个 60 到 120 日的累计涨跌,可以来自一长串小而同向的日涨跌(连续),也可以来自少数几个大日、其余日子来回抖(跳变)。注意力有限、信息逐步扩散的市场里,两种路径的后续不同:连续的小消息被低估,价格继续漂;集中的大消息被注意到,容易过度反应后回吐(Hong
    & Stein 1999 的逐步扩散;Da、Gurun & Warachka 2014 的 frog-in-the-pan / information discreteness)。A
    股散户占比高、注意力集中在涨跌幅榜上,这个区别应当更明显。这一位把「路径连续性」做成一组无量纲的读数,全部从日度收盘 / 最高 / 最低价构造。R1 = 日收盘对前一日收盘的收益
    = sub(div(day_close(Close), cross_delay(day_close(Close), 1)), 1),含隔夜跳空,只用 t 日及以前的价格。

    (A) 路径效率:cross_sum(R1, 60) / cross_sum(abs_(R1), 60):净涨跌除以全部日涨跌的绝对值之和,取值在 [−1,
    1],Kaufman 效率比的带符号版本;另一个写法用 120 日对数价格差除以 120 日日对数变化的绝对值之和(cross_delay 与 cross_delta
    实现),同一个量换一种构造。1 = 每天都朝同一方向走,0 = 来回抖到抵消。取绝对值的版本是「趋势对震荡」,不带方向;还有它相对自己 120 日历史的 z
    分数(cross_zscore)。

    (B) 趋势线性度:cross_corr(log(day_close(Close)), cross_age(day_close(Close)), 60) 与
    cross_reg_tvalue(cross_age(day_close(Close)), log(day_close(Close)), 120):对数价格对时间(cross_age
    是上市以来的交易日序号,在窗口里就是一条斜坡)的相关与回归 t 值,读的是价格是不是沿一条直线走,与跳变路径(阶梯形)区分。

    (C) 跳变占比与一致性:cross_max(abs_(R1), 60) / cross_sum(abs_(R1), 60)(最大的一天占全部日波动的份额,不依赖波动水平);cross_sum(R1,
    60) 乘 cross_mean(sign(R1), 60)(累计涨跌方向与多数日方向是否一致:涨得多但多数日是下跌 = 靠少数大涨日,乘积为负)。

    (D) 区间效率:(cross_max(day_max(High), 60) 减 cross_min(day_min(Low), 60)) / cross_sum(日内高低差,
    60):60 日总区间对每天区间之和,Choppiness 指标的思路:价格一路走远时接近一个大数,原地来回时很小。

    (E) 上下行不对称:60 日上行半离差对下行半离差的对数比 log(cross_semistd_pos(·, 60)) 减 log(cross_semistd_neg(·,
    60)),以及 120 日的上行份额 pos / (pos + neg),总波动水平被比值约掉,留下涨跌幅度的不对称(Bollerslev、Li & Zhao
    2020 的 good / bad volatility 思路)。

    为什么和库里、和控制不同:两个库(5583 条)里读日度价格路径的几乎只有手写库的 WorldQuant 式 ts_* 表达式;日收益的「和除以绝对值之和」、cross_age、cross_semistd_*、cross_zscore、cross_max
    套 abs_ 这些结构一个都没有(我对 members.csv 做过检查:cross_age、cross_semistd、cross_zscore、day_gini
    出现 0 次,cross_sum(abs_(…)) 只有 2 条且读的是别的量)。库里挖出来的因子几乎都读分钟级结构与成交量。控制:20 日反转只看 20
    日、读的是水平;波动控制读 |R1| 的水平;这里的读数都是比值或相关,水平已经被除掉,窗口 60 到 120 日,和 20 日反转的相关预计在 0.3 到
    0.6 之间(A、C 与 60 日动量有关,但尺子只去掉 20 日反转的线性、U 形、S 形暴露,其余留下)。批里的启发:B052 的拆解表说,带 argmax
    的变体 ρ_known 几乎为 0 而去掉 argmax 的是 0.53,即「路径形状」读数能逃出五个控制;这里把路径形状从「高点年龄」换成「日收益路径的连续性」。

    为什么样本外还会在:窗口 60 到 120 日,读数每天只变一个窗口的 1/60 到 1/120,换手低,15 bp 成本拖累小;机制是注意力与信息扩散,是市场结构性的,不依赖某段行情;比值型读数对风格轮动(高波动
    / 小盘)的暴露低。最可能的失败方式:(A)(C) 与 60 日动量过度共线而被控制吃掉;(B) 的斜坡在窗口内被停牌打断时失真;(E) 在涨跌停板制度下上下行幅度被截断,读到的是板块限幅而不是不对称。

    数学检查:R1 的分母是前一日收盘价(后复权价,正数);cross_sum(abs_(R1), d) 只在窗口里一天都没有有效收益时为 NaN(整窗口停牌),不为
    0;除出来的量都是有界比值((A) 在 [−1, 1],(C) 的最大日占比与 (D) 的区间效率在 (0, 1],(E) 的上行份额在 (0, 1)),(C)
    的乘积是一个有界量乘一个 [−1, 1] 的量,没有除以近零造成的爆点;cross_semistd_* 在有效日不足 3 天时给 NaN,窗口里没有下行日时下行半离差为
    0、取 log 得 NaN,不是负无穷;cross_age 对上市首日已在数据里的票给 10000 起算(窗口内仍是斜坡,相关与 t 值对平移不变);log
    在近 0 处按算子定义给 NaN;sign(R1) 遇到 NaN 给 NaN、cross_mean 跳过缺失。无前视:全部只用 t 日收盘及以前的数据,cross_delay
    的天数为正,t+1 才交易。热身期:最长的链是 cross_zscore(·, 120) 套 60 日效率(约 180 日)与 120 日窗口的各个读数,占
    train + valid 约 1,960 个交易日的 9% 以内;窗口在前 d−1 天按已有天数展开(不是缺失、不是 0),早期读数较噪,只会拉低分数、不会造出信号,所以不主导结果。所有种子都是连续取值(比值、相关、t
    值、对数比),过得了「不同值 ≥ 50%」的闸门。'
