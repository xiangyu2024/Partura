- head: ts_std(cross_argmax(day_quantile(Open), 60), 50)
  why: 烂的部件有两个,依据都在拆解表里。第一,ts_std 的 50 日窗口太慢:窗口 25 是 −1.59(train −1.59 / valid −1.30),比
    head 好 0.59,而窗口 100 是 −2.19,窗口越长 valid 越差。第二,argmax 的锯齿本身:C 每天加 1/60、创新高时一下子复位,ts_std
    读的大半是复位的跳,而不是年龄的水平;train 列在三个窗口上几乎相同(−1.590 到 −1.594),说明 train 读到的是共同的底。变体先沿着已经看见的方向(窗口
    25 / 15 / 10;高点窗口 30 / 120;Open 换 Close / Vwap / 日内最高价),再换掉烂的部件:先用 cross_ema 平滑
    C 再取 ts_std(去掉复位的跳)、取 argmin 与 argmax 的对称版本和差(Aroon 振荡器)、用日差的绝对值均值读复位频率、对离散度取
