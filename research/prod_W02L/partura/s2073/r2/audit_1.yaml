  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [3]
    reasons: '创新度 3。核心 day_cov(Low, Close) 本身与快照 head pow_05(day_max(nt_ts_stddev(Vwap, 30))) 的日度秩 |ρ| 为 0.94、残差 0.99,与 pow_2(day_max(pow_1_5(Vwap))) 为 0.88、与 q75 那个 head 为 0.87,即核心单独看就是已有 head 的同一个量,PI 说「库里 (Low,Close) 配对从未出现」只在 head 结构上成立,度量上不成立。新内容在外围:保留的 9 个种子与 head 的原始 |ρ| 为 0.07~0.35、残差为 0.08~0.24(时序相关、对数、z 分数、偏度、EMA 等外层),相对 5 个控制的 |ρ| 最高 0.52(核心对 liq),没有一条 ≥0.8。外层不是核心的换皮,所以给 3,但扣分理由写清楚:核心本身不新,新的只是外层。核心是否属于快照 head 子树按 PI 的定位认定(快照里没有 day_cov(Low, Close) 的直接子树,未展开共性表,按指示不读)。合理度 3。数学上过:day_cov 在一字板日为 0,经 log 变成 NaN(log 对 |x| 小于 EPS 返回 NaN),不是爆点;cross_regres(x, y, d) 是 y 对 x 的滚动回归残差(dt_cross.py:309),种子 4 写的是 log 成交额 log 协方差的残差,与假设一致;cross_zscore、cross_mean、cross_ema 为日轴滚动窗口,未见前视。机制说不通的一半:假设说「水平被流动性、价位、波动控制吃掉」,但 5 个控制里没有名义价位,核心与 head 的残差 0.99 说明共同成分正是未被控制的名义价位;种子 1、2、4、5 的写法里仍保留名义价位(种子 5 除以均价平方才去掉它),所以大部分搜索空间仍在名义价位上。如果它有 alpha,最可能来自名义价位的截面溢价(价格水平本身的定价偏差),其次是收盘相对日内低点的承接 / 尾盘砸盘行为。种子 3 划掉:相关度表第 2、3 行逐位相同(原始 0.264、残差 0.094、五个控制几乎一致),day_sum(Low) 与 day_mean(Close) 同为名义价位,截面秩几乎一致,属重复。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [3, 5, 7, 8]
    reasons: '创新度 3。假设的核心是收益分布形状:右 / 左尾条件均值比、上下行半标准差拆分、日内停留时间。与库的关系要更正:手写库 src/alphacube/legacy/factor_set_merged.py 里已有 erm_up_mag_1m、erm_dn_mag_1m、erm_mag_gap_1m、erm_up_freq_1m、erm_dn_freq_1m、erm_tail_width_1m,与 day_es_ratio_hi / lo 是同一个量,只是分母用 +1e-6 而不是 NaN 守卫(ops_ext.py 的 docstring 自己也这么写)。所以种子 1、2、10(es 差的 20 日均值、60 日均值、120 日 z 分数)度量的是库里已有量的换写法;它们与快照 head 的相关都很低(原始 ≤0.12),不违反库禁令,但「从未出现」的说法不成立,PI 应当知道。保留下来的新内容是:种子 4(成交额右尾比,与 liq 0.53)、种子 6(下行 / 上行半标准差比)、种子 9(上涨分钟占比的 60 日差,与 erm_up_freq 族有距离)。综合给 3,不压分:新组件仍在。合理度 4。机制清楚(博彩型右尾偏好、下行半波动的风险补偿或抛压;与 liq、vol、rev、size 的相关都低)。算子核对:day_es_ratio_hi / lo 用 nanquantile 并以 k>0 与 |v|>1e-8 守卫,分母近零置缺失,没有爆点;cross_semistd_pos / neg 以 day_mean(Close) 的日对数变化为输入(ops_ext.py:773 起),正确;day_pos_ratio 把 x>0 计为上涨,符合定义。两个小瑕疵不扣分:es 比在当日 q95(或 q05)为负的日子(跌停封死型)符号翻转,守卫只挡近零,影响在 20 日均值里被摊薄;种子 6 的除数 semistd_pos 若为 0 会出 inf。划掉:种子 3 与种子 1 线性等价(mean(a-b)=mean(a)-mean(b),只在缺失日的处理上不同,相关度表两行几乎逐位相同),属重复;种子 5 的 rev 控制 |ρ| = 0.88 ≥ 0.8,按规则自动划掉(它几乎就是 20 日反转);种子 7 门槛为「废品」,distinct 比例 0.263,day_at_max_ratio(High) 与 day_at_min_ratio(Low) 在多数股票上都是 1/240,两者相减多数为 0,截面由并列主导,属定义坏掉;种子 8 门槛为「废品」,distinct 比例 0.418(大量并列),最大残差 0.82(liq 0.54),定义上以并列为主,划掉。剩 6 个种子(1、2、4、6、9、10),≥4,通过。如果它有 alpha,最可能来自博彩型右尾偏好(右尾厚的股票被散户追捧而高估),其次是下行半波动带来的风险补偿或有信息性的抛压。'
R:
  - head: 'ts_max(day_corr(pow_1_5(Ret), Vwap), 40)'
    soundness: 3
    reasons: '只评合理度。6 个变体的写法合法,每个只换一个部件或一个外层聚合,与 PI 所列的原始 / 残差 |ρ| 一致(Close 版 0.73 / 0.72,Open 版 0.77 / 0.77,Close-60 版 0.60 / 0.61;ts_mean 版 0.19 / 0.13 只是外层换成均值,不是同一个替换)。但有一个定义偏离必须写清:catalog 中 pow_1_5 是 pow_(x, 1.5),而 pow_ 对 e>1 直接返回 torch.pow(x, e)(common.py:216 起,只有 e≤1 才走 sign·|x|^e 的符号保留分支)。负底的非整数幂为 NaN,所以 pow_1_5(Ret) 在每个下跌分钟都是 NaN,day_corr 的有效掩码把它们丢掉。于是 head 实际算的是「上涨或持平分钟子集上 Ret^1.5 与 Vwap 的当日相关」,不是假设里的全日相关。本次没有在 torch 下实际跑数(系统 python 无 torch),这一条是按源码语义判的。对 PI 的诊断的影响:Vwap→Close 增益 +0.28 是在同一个子集定义上比较的,所以那个比较仍然成立,但「去烂部件」漏掉了最可能的烂部件,也就是 pow_1_5 本身。6 个变体里只有第 5 个(ts_max(day_corr(Ret, Close), 40))去掉了 pow_1_5,它是唯一计算假设量的变体(与 head 的原始 |ρ| 0.40,残差 0.35)。建议 PI 补一个用 signedpower 或 pow_05 替换 pow_1_5 的变体,并把根因说法改成子集定义。给 3:数学上不崩溃,定义偏离写清楚即可,不挡;若总领把「只在子集上算」视为 §4 的定义坏掉,则降为 2 并删组。另外可以顺带注意:day_corr 在一字板日(Ret 或 Close 为常数)返回 0 而非缺失,ts_max 会把这些 0 当作窗口最大值,属于已知行为,这里不扣分。'
summary: '两个任务位都过:a 创新 3 / 合理 3,划掉 3 号种子,剩 9 个(核心 day_cov(Low,Close) 本身与 head pow_05(day_max(nt_ts_stddev(Vwap,30))) 的 |ρ| 0.94,新内容在外层);b 创新 3 / 合理 4,划掉 3、5、7、8 号,剩 6 个(es 尾部比与手写库 erm_mag_gap_1m 族同量,PI 的从未出现说法不成立);R 组合理度 3,但 pow_1_5 对负收益返回 NaN,head 实际是上涨分钟子集上的相关,PI 的 Vwap 根因需要改写,建议补 signedpower 替换变体。'
