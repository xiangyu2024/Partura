    hypothesis: '核心 day_cov(Low, Close) 是日内最低价与收盘价逐分钟的协方差:它读「收盘相对日内低点的位置 + 价格带宽度」,是 day_cov(Low, High)(本批 49 个候选含它,含它者均值差 +1.04)的近亲,但把 High 换成 Close,多出收盘位置信息(尾盘是否拉离低点)。它在共性表里均值差 +1.47(p 0.003,含 4 个候选),比 Low,High 版更强。第 1 轮对 day_cov(Low, High) 的最好结果(-0.66)全是 cross_corr(核心, 另一个日度量, 60) 这一外围,说明「核心与成交额 / 价位在 60 日内的联动」比核心的水平更接近 alpha;本轮换核心,并把外围改成未试过的写法:cross_regres(log 成交额对 log 核心,残差 = 成交额解释不了的价格带变化)、对自己 120 日的 z 分数 / 与 10 日均值之差(只留变化量,去掉水平和流动性)、ts_skew(带宽的偏度,读偶发的大幅下探收回)、相对价格平方的无量纲化(去掉价位)。机制:低点到收盘的协同运动大,代表日内下探后被承接(买盘在低位吸筹)或尾盘被砸;其时序变化(相对自己的历史)而不是水平,才是信息,因为水平被流动性 / 价位 / 波动控制吃掉。不同于库里:库里的 day_cov 只出现在 (Low,High) 与 (Close,Close) 配对,(Low,Close) 配对仅在共性表里作为部件出现,外围从未带 regres / 变化量。样本外还会在,是因为下探被承接 / 尾盘砸盘这类日内资金行为由制度(T+1、涨跌停、尾盘集合竞价)决定,不依赖某段行情。数值:全部分母都是价位平方或自身历史均值,不用 day_cov(Close,Close) 这类可能为零的除数。'
