    hypothesis: '新 idea:分钟收益的尾部不对称与日度下行 / 上行半波动。上一轮 N 位押了成交时间位置;本轮转向「收益分布的形状」,因为本批 head 全是水平 / 离散度,形状(偏向哪一侧的极端)完全没碰。算子实现:day_es_ratio_hi(Ret) 是分钟收益高于当天 95% 分位的均值除以该分位(右尾厚度),day_es_ratio_lo(Ret) 是左尾对应量,二者之差 = 当天是「暴涨型」还是「暴跌型」的极端;分母为 0 的停牌 / 封板日返回缺失而不是爆点(ops_ext 已处理)。cross_semistd_pos/neg(day_mean(Close), d) 是日度对数变化的上行 / 下行半标准差,二者之差(或比值)是已实现的上下行波动不对称,无量纲、有界,与水平波动控制低相关。day_at_max_ratio(High) 减 day_at_min_ratio(Low) 读当天在最高点 / 最低点停留的时间(封板与否的方向区分)。机制:右尾极端多(彩票型、跳涨)的股票被散户追捧而被高估(博彩偏好),下行半波动占优的股票则被风险溢价补偿或有信息性抛压;这是形状溢价,与波动水平、流动性、市值、反转控制不同源,取 20~60 日均值后换手低。样本外还会在,因为博彩偏好与涨跌停制度下的右尾行为是结构性的。与库里不同:库里 head 全是 std / cov / max 等二阶或顺序无关水平量,极端分位的条件均值之比与半波动拆分从未出现。'
