R:
  - head: 'cross_max(mul(ts_std(day_durbin_watson(Open), 40), ts_min(pow_3(ts_std(day_close(Amt), 50)), 1)), 60)'
    soundness: 3
    reasons: '变体只改外层窗口(90/180/240)、Open 换成 Close、以及去掉 pow_3 或把 pow_3 换成 ts_std(core,50),数学上都可计算,没有 §4 陷阱,pow_3 作用于非负的 std 也不会对负数缺失。机制说得通但偏弱:day_durbin_watson(Open) = sum(diff(p)^2)/sum(p^2),是归一化后的分钟价格路径粗糙度,数值上接近日内已实现波动(对 vol 控制的原始 |ρ| 为 0.20,不算重合),而不是 notebook 说的「路径平滑」,叙述需要修正,但不是数学问题。外层窗口加长是参数层面的稳定性解释。提醒:ts_min(x,1) 按 rolling_reduce 的定义是恒等映射(nd_ts.py:172),所以 PI 说的「去掉 ts_min 的必要性 +0.03」不能来自去掉 ts_min 本身,R 组里也没有单独去掉 ts_min 的变体,这一句在 PI 的理由里应当删掉或改成去掉 pow_3。'
  - head: 'ts_max(day_corr(pow_1_5(Ret), Close), 60)'
    soundness: 3
    reasons: '按 rules §4,pow_1_5 对负收益返回缺失,所以 day_corr 实际只在上涨分钟与零分钟上算,head 的定义与「收益与价格的日内相关」的字面意思不一致。但它在计算上是良定义的(count >= 2 保护),且没有证据表明结果主要由这一缺失模式决定,因此不判为「定义坏掉」。变体 3(pow_05)与 4(signedpower)直接检验这一点,是对的检验。注意变体 1、2、5、6 仍然保留 pow_1_5,它们的结果不能读成「修正了这个问题」。机制:日内收盘价与上涨分钟收益的同步关系,机制不清楚,但按 §3 说不清机制不是挡的理由。'
summary: 'a 位:核心对流动性与已知族 |ρ| 0.90,E 门槛不过,将被改为普通 GP(外围 8 个种子可用,创新度 3、合理度 4);b 位:N 通过,划 5 号(对 head 0.78 与 liq 0.86),创新度 4、合理度 4;R 两组数学上无硬伤,合理度均 3;ts_min(x,1) 为恒等,PI 的 ts_min 必要性说法需要修正。'
