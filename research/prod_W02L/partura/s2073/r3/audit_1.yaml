    reasons: '相关度表:E 核心 ts_std(day_close(Amt),50) 与 head 的原始 |ρ| 为 0.97(它是 head 的子树,设计使然,不计入创新度),但与控制 liq 0.90、known 0.90 均 >= 0.8,按 §3 的 E 核心控制门槛这一位会被确定性规则改为普通 GP,这是规则决定,不是我的分数。创新度 3:外围 2/3/9 是尾盘成交额波动与全天成交额的比例(与 liq 0.38/0.40,known 0.33/0.40,与 head 最大原始 |ρ| 0.32/0.41/0.36),度量的不是 head 也不是控制;4/5/6/7/10 是对自己历史的 z 分、去均值、回归残差、与总成交额的相关、偏度,与 head 的原始 |ρ| 在 0.10–0.43 之间。但核心本身与已知族 cross_mean(day_std(Amt),30) 的 |ρ| 为 0.90,外围多数仍是这个流动性水平 / 波动量的变形,所以不给 4。划掉 1:cross_max(ts_std(core,50),120) 与 head cross_max(mul(ts_std(day_durbin_watson(Open),40), ts_min(pow_3(core),1)),60) 的原始 |ρ| 为 0.87(>= 0.7),且与该 head 同一外层 cross_max 结构,库禁令也会拒。划掉 8:ts_rank(core,120) 的 gate 为 false,distinct 仅 0.078,截面高度并列(离散化的名次),不是可用的连续信号。合理度 4:机制清楚,收盘集合竞价那一分钟的成交额波动是尾盘事件型资金占用的代理;比例与残差都是对称的秩型运算,分母 ts_std(day_sum(Amt),50) 与 cross_mean(day_sum(Amt),50) 停牌日缺失而不是零,没有近零爆点;逐个算子核对,没有 cross_shift、ts_shift、in_local_mean 等前视算子,没有 nt_*;cross_regres(log 总额波动, log 核心波动, 60) 按 rolling_ols(x,y) 的定义是 y 对 x 回归取残差,即核心中不能被总额波动解释的部分,与设计说明一致。如果它有 alpha,最可能来自:尾盘成交额的相对不稳定(比例与残差),即收盘集合竞价的资金是否被事件型资金间歇占用。剩余种子 2,3,4,5,6,7,9,10 共 8 个,满足 >= 4。'
