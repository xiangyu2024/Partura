    why: >-
      拆解里唯一变好的单一改动是外层窗口 cross_max 60 -> 120(-0.14 到 +0.21,train / valid 同号 +0.21 / +0.33),Open->Close 也几乎持平(-0.02,+0.12);
      30 日窗口更差(-0.36),说明外层极值聚合的窗口越长越好,烂的部件是过短的 60 日窗口。变体沿着这个方向继续拉长窗口(90 / 180 / 240)并与 Open->Close 组合,
      再检验去掉 ts_min 与 pow_3 的写法(两者的必要性只有 +0.03 / +0.07,几乎不起作用)。
