  - type: E
    core: 'ts_std(day_close(Amt), 50)'
    hypothesis: >-
      核心 ts_std(day_close(Amt), 50) 是「最后一分钟(收盘集合竞价所在分钟)成交额」在过去 50 天的标准差。它是本批唯一在多个 head 里反复出现的部件
      (7 个候选含它,均值差 +1.44,p 0.000;含它的 head 分数 -0.14 ~ -0.57,是本批最接近 0 的一族;拆解里把它拿掉分数掉 2.6)。
      前几轮的 E 位押的是价位带宽 day_cov(Low, *) 与 cross_corr 外围,和这个核心无关。机制:收盘价由集合竞价决定,收盘分钟的成交额反映机构调仓 / 指数基金 /
      尾盘抢筹的被动与知情订单;这一量的时序波动大,说明这只股票的尾盘被「事件型资金」间歇性占用,价格发现被推迟到尾盘,次日有延续或反转的定价偏差。
      但水平(ts_std 本身)主要是流动性与成交额大小,被控制吃掉,所以这次外围只做三件库里 head 都没做的事:(1) 用全天成交额的均值 / 波动做无量纲化,
      变成「尾盘成交额的相对不稳定」;(2) 对自己 120 日历史取 z 分数 / 差分,只留变化量;(3) 用 cross_regres 把全天成交额的波动对应的部分回归掉,留下尾盘特有的残差。
      以前见过的外围全是 cross_max(mul(核心 或其立方, ts_min(day_durbin_watson(Open), ...)), 5/60) 和 abs_(ts_std(核心, 40)),
      这里没有任何一条含 Open 的 DW、cross_max 乘积或 abs_ 套叠,换的是除法、回归、z 分数、与 day_sum(Amt) 的联动。
      样本外还会在,因为尾盘集合竞价制度(14:57 起)与指数 / 公募调仓日历是结构性的,不依赖某段行情;窗口 50 日以上换手也低。
      数值:分母用 day_sum(Amt) 的 50 日均值 / 标准差,停牌日缺失而不是零,不会除近零爆点;其余都是对称的秩型运算。
    seeds:
