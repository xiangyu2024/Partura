slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [4, 7]
    reasons: '位 a 是 E 深挖,核心 day_cov(Low, High) 取自快照 head 2(loc.md 第 2 行)的子树,核心与 5 个控制的 |ρ| 为 liq 0.52 / vol 0.26 / rev 0.13 / known 0.49 / size 0.36,均 < 0.8,核心门槛通过。创新度 3:核心与 head 1 pow_05(day_max(nt_ts_stddev(Vwap, 30))) 的原始日度秩 |ρ| = 0.94、残差 0.99,即核心本身基本就是 head 1 所度量的日内波幅 / 水平这一维;新意只能来自外围的归一化与时序变换。外围变换确实改变了信号:种子 2 cross_zscore(log(cov), 120) 与 head 的最大 |ρ| 0.27,种子 8 与 head 的最大 |ρ| 0.19,种子 4 与 head 0.46,所以不是换皮,但也不算本质上的新东西,给 3。合理度 3:逐个核对算子,div(cov, mean(Close)^2) 确为无量纲(价格平方 / 价格平方),cov / cov(Close,Close) 也无量纲,log 在 AlphaCube operators/common.py:211-214 里取 log|x| 且 |x| <= EPS 返回 NaN,cross_zscore 是对自身 d 日窗口的 z 分数(含当日,不前视),cs_bucket_zscore(y, x) 的分桶变量 sub(LogFloatCap, LogFloatShares) = log 名义股价,与 (e) 的假设一致。机制说明偏笼统(「趋势追逐、成交配合」),没有具体说明为什么样本外会在,但说不清机制不是挡的理由。划掉:种子 4 `cross_mean(div(day_cov(Low, High), day_cov(Close, Close)), 20)` 的除数 day_cov(Close, Close) 是未加 EPS 的 torch.divide(common.py:175-180),收盘价全天不动时方差为 0,0/0 得 NaN,接近不动时得巨大值;外层又是算术 cross_mean(…, 20),一个爆点就能主导 20 日均值。这正是 §4 的「除以近零的量造成的爆点支配了截面」,数学上无界,按规则划掉(若要保留,需先加 EPS 下限或在均值前取截面秩)。种子 7 `cs_bucket_zscore(log(cov), sub(LogFloatCap, LogFloatShares))` 与 head 1 的原始日度秩 |ρ| = 0.73 ≥ 0.7,按确定性规则自动划掉。其余 8 个种子保留(1,2,3,5,6,8,9,10),都与 head 的原始 |ρ| < 0.7 且与控制的 |ρ| < 0.8,包括种子 1 cross_mean(div(cov, price^2), 20),它与 head 3 的原始 |ρ| 0.57 但残差只有 0.33。种子 5 cross_regres(log(day_sum(Amt)), log(cov), 60) 与所有 head 的 |ρ| 都 < 0.1,是这个位里最可能有独立信息的一个,但 cross_regres 的 y 与 x 顺序要求是 y 对 x 回归,这里的写法正确。如果它有 alpha,最可能来自价格路径离散与成交额之间的残差化关系(成交额解释掉的部分之外的日内价格带变化),其次来自价格水平归一化后的日内趋势强度。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [6]
    reasons: '位 b 是 N 新想法,三个 head 全是波动 / 离散度(nt_ts_stddev 价格与成交额、day_cov(Low,High)、ts_stddev 成交额),而 day_centroid、in_index、day_signed_ratio 都不在三个 head 的骨架里(head 2 用的是 in_sorted_cumsum_backward,按值排序后累加,不带分钟顺序),所以「缺分钟顺序信息」这个 idea 与库里的 head 确实不同,创新度 4。库骨架是否已有带 day_centroid 的表达式,我没有逐条核对 5583 条,那是 GP 库禁令的职责,这里不替它做。合理度 4:逐个核对算子:day_centroid(x) = sum(t·|x|)/sum(|x|)/(T-1) 确实落在 [0,1](ops_ext.py:155-169),0 = 开盘、1 = 收盘;in_index(x) = t/(T-1) 只看位置、不看 x 的值(ops_ext.py:684-692),无前视;day_signed_ratio(Ret, Amt) 在 [-1, 1] 之间,Ret 为 0 的分钟只进分母,定义干净(ops_ext.py:122-135);cs_bucket_zscore 的分桶变量是 amount 的 30 日均值,用来消除流动性水平,机制对得上。机制说得通:尾盘放量与指数 / 被动资金调仓相关,开盘放量与隔夜消息相关,质心与价格运动是否同步可以把消息驱动与流动性驱动分开。与控制的相关度都不高(liq 0.00 ~ 0.69),但 b5 sub(centroid(Amt), centroid(Volume)) 与 20 日反转的 |ρ| = 0.64,b9 cross_mean(day_signed_ratio(Ret, Amt), 20) 与 20 日反转的 |ρ| = 0.61,这两个最像反转,但都 < 0.8,保留。划掉:种子 6 `cross_mean(day_corr(in_index(Close), Amt), 20)` 与种子 1 `cross_mean(day_corr(in_index(Amt), Amt), 20)` 的 in_index 只返回时间位置,与 x 的取值无关,只要 Close 与 Amt 在同一批分钟上有限,两个表达式完全相同。这一点由相关度表佐证:两者与 head 的原始 |ρ| 与残差 |ρ| 与各控制的 |ρ| 逐项一致(0.65 / 0.09 / 0.69 / 0.39 / 0.12 / 0.69 / 0.27),属于重复,按规则划掉。其余 8 个种子保留(1,2,3,4,5,7,8,9),其中种子 7 cross_mean(day_corr(in_index(Amt), abs_(Ret)), 20) 有一个 §4 的已知陷阱:一字板日 Ret 全天恒为 0,abs_(Ret) 方差为 0,day_corr 返回 0 而非缺失,这些票会在截面上聚在 0。只有一字板日会触发,占比应该不高,不是主导项,不划,但要在评估时检查。如果它有 alpha,最可能来自成交的日内时间结构(尾盘成交占比与收盘前机构调仓),其次来自价格运动与成交同步性(消息驱动与流动性驱动的区分)。'
