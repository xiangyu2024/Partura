  hypothesis: '核心 C = day_cov(Low, High):当天分钟最低价与最高价序列的协方差。它是本批第 2 个 head 里唯一不含 nt_* 的实质子树,单独就有 -2.31(train -1.56 / valid -2.31),
    比整个 head 外面的 q75 / cross_scale / ts_scale 包装(各只差 0.03)几乎没有加成,说明信息在 C 本身;而加 ts_scale(30) 后掉到 -3.34、再加 cross_scale 掉到 -5.70,
    说明时序标准化会把它做坏。C 的量纲是价格平方 × 日内趋势,实质是「当天价格带随时间一起上移 / 下移的幅度」(分钟 Low 与 High 几乎同涨同跌,协方差 ≈ 日内价格路径的方差),
    是一个以价格水平(名义股价)为主导的量。已见过的外围只有 q75 / ts_scale / cross_scale(都是对原值做排序式变换,在新尺子下同一个信号)。
    这一位用与水平无关的方式重新读 C,各实现一个机制:(a) 除以当日均价平方 = 无量纲的日内趋势强度(去掉名义价格);(b) 除以 day_cov(Close, Close)(收盘价自身的日内方差),
    读「价格带」与「收盘路径」的比值,即日内高低点相对收盘是否同步位移;(c) 取对数后相对自己 120 日历史的 z 分数 / 10 日对 120 日差,个股自己做对照,去掉持久的截面价位;
    (d) 对成交额总量做 60 日滚动回归残差 / 相关,读「价格路径的离散与成交量的联动」,是 W01 里窗口长、换手低的一类滚动关系;(e) 名义股价十分位内做 z 分数
    (分桶变量 sub(LogFloatCap, LogFloatShares) = log 名义股价),检验 C 里剩下的是不是价位代理。依据:head 的方向为 -1 且两段都亏(未必有毛超额,亏的可能是换手),
    所以重点是换成慢变、无量纲的读法。为什么样本外还会在:无量纲的日内趋势强度 / 价格带与成交的滚动关系是行为性的(趋势追逐、成交配合),不依赖某一段的价位结构。'
