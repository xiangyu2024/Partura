- type: N
  hypothesis: '新 idea:成交在一天里的「时间位置」。本批三个 head 全是波动 / 离散度(nt_ts_stddev、day_cov、ts_stddev 成交额),都是顺序无关的统计量,而且全部在新尺子下亏(−2.2 ~ −2.5):
    水平 / 离散一族已被控制和已知族吃光。日内顺序信息则一个也没用:day_centroid(Amt) 是成交额的质心在 [0,1] 上的位置(0 = 开盘,1 = 收盘),day_corr(in_index(Amt), Amt) 读成交是否后置,
    sub(day_centroid(Amt), day_centroid(abs_(Ret))) 读「钱」与「价格运动」是否在同一时段发生,sub(day_centroid(Amt), day_centroid(Volume)) 因 Amt = 价 × 量,读日内价格斜率。
    机制:尾盘放量(质心靠后)多见于被动 / 指数资金、收盘前的机构调仓与尾盘抢筹;开盘放量多见于隔夜消息与散户追价。质心还相对价格运动是否同步,把「消息驱动」(量价同时)与「流动性驱动」(量价错开)分开。
    它们都无量纲、有界,与流动性 / 市值 / 波动水平控制天然低相关,取 20 日均值或相对自己 120 日的 z 分数后换手也低。样本外还会在,是因为日内成交的时间结构由制度(集合竞价、指数调仓、T+1)与参与者构成决定,而不是某段行情。
    不同于库里的:库里的 day_* 骨架多是离散度 / 集中度(std、gini、max),带分钟顺序(in_index、centroid)的几乎没有。'
