    reasons: '新颖度:N 的思路是成交量 / 成交额加权收益的偏度与价量相关。快照 head day_quantile_q75(mul(High, Ret)) 与它的原始 |ρ| 都 ≤ 0.07 左右(种子 1 至 5、7 的原始 |ρ| 为 0.02 至 0.07,种子 4 为 0.18,种子 5 为 0.20),残差 |ρ| 在 0.02 至 0.09 之间;控制方面,种子 1、2、3、7 与 liq、vol、known、size 都 ≤ 0.12,rev 为 0.18 至 0.32;种子 4、5、10 的 day_corr 与 rev 为 0.56、0.34、0.39,未达 0.8。新颖度给 4。这个判断只对快照 head 与 5 个控制,我没有去对 5583 条库的骨架,这一点请后续核对。种子 6:sub(day_mean(mul(Ret, Amt)), day_mean(Ret)) 量纲不一致。day_mean 是普通均值(dt_day.py:92),mul(Ret, Amt) 的均值带成交额量纲(元级),减去收益率量级的 day_mean(Ret) 后,结果被前一项主导,实际算出的是未归一化的成交额加权收益,不是说明里的 Amt 加权收益与等权收益之差。这是数学 / 定义问题,划掉。种子 11、12:与 liq 0.85、known 0.84 都 ≥ 0.8,按规则自动划掉。种子 9 PI 标 废品,但没有数学理由,保留。种子 1、2、3、7、8 只用 day_skew / day_kurt / day_mean 的形状统计,skew 对尺度不变,没有量纲问题。合理度给 3:机制(知情方向性流 / 大单不对称的持续性)说得通,但 skew 的符号主要受成交量集中度驱动,与"成交量集中"的区分不清,所以只给 3,不给 4。监控:种子 4、5、10 的 day_corr 在一字板 / 零成交日返回 0 而不是缺失(dt_day.py:231 至 245),这些票会在截面上聚在 0 附近;暂不划,留作复核。剩 9 个种子 1、2、3、4、5、7、8、9、10,≥ 4。如果它有 alpha,最可能来自成交量集中度与大单方向不对称在 20 日尺度上的持续性,而不是收益偏度的水平本身。'
