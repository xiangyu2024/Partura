    reasons: '核心就是快照 head day_quantile_q75(mul(High, Ret))(相关度表原始 |ρ| 1.00,score -2.76),所以核心本身不新;新的是外围。种子 4(sub 自身 40 日均值,原始 0.39、残差 0.06、known 0.05)、种子 8(与 day_sum(Amt) 的 ts_corr,原始 0.14、残差 0.09)、种子 11(q75 减 20 日均值再衰减,残差 0.03)、种子 12(ts_regres 对 day_std(Ret) 取残差,残差 0.09),与 head 和 5 个控制都基本不相关,算新。种子 3 是同一个 q75 做平滑加 ts_std 标准化,残差 0.47,仍接近 head,但它不是重复全部,不划。种子 1、2、7、9、10 原始 |ρ| 为 0.81、0.86、0.73、0.97、0.80,都 ≥ 0.7,按规则自动划掉。没有种子与控制的 |ρ| ≥ 0.8(最大 liq 0.67 是种子 1,已划)。核心对 5 个控制:liq 0.55、known 0.51、size 0.39、vol 0.16、rev 0.15,均 < 0.8,E 位门槛过。剩 7 个种子 3、4、5、6、8、11、12,≥ 4。合理度:机制是日内上尾的彩票 / 注意力溢价(Bali-Cakici-Whitelaw MAX 效应的分钟级版本),说得通;逐个核对算子 day_quantile_q75、ts_mean、ts_std、ts_corr、ts_regres、ts_skew、ts_rank,都是回看型,没有前视;核心在 High 上带价格水平成分,这是已知的,不算定义坏掉。两点只作监控、不划:种子 3 的 ts_std 分母在停牌多的票上可能接近零;种子 5(ts_rank,PI 标 废品)没有给出数学理由,而 ts_rank 在当天缺失时返回 0(nanrank_last),若停牌票主导截面则需要复核,在能确认之前不划。如果它有 alpha,最可能来自日内上尾相对自身历史的异常部分,以及尾部与成交额的同步性,而不是 High 带来的价格水平。'
