    in price units and so is dominated by high-priced stocks), (b) own-history demeaning / delta / ts_rank of the residual (abnormal rather than persistent displacement), (c) conditional on money flow (ts_corr
    with daily Amt, division by average turnover = displacement per unit of traded value, an Amihud-like impact reading), (d) interaction with the stock''s trailing halt frequency (stocks that are often
