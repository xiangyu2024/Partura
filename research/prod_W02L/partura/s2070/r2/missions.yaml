- type: N
  hypothesis: Intraday lead-lag between minute volume/turnover and the NEXT minute's return (information diffusion / order-flow predictability). Per day, correlate minute return at t with minute volume
    (or amount) at t-1, built without any fill by slicing the two series with offset windows (in_slice(Ret,2,237) vs in_slice(Volume,1,236); end index inclusive, equal length 236, so no lookahead and no
    in_shift -1 fill artefact). Positive values mean volume bursts are followed by same-direction price moves (continuation of informed flow, slow liquidity provision); negative means volume bursts are
    followed by reversals (price pressure that mean-reverts; liquidity-provision premium). The reverse direction (volume at t responding to return at t-1) separates volume-chasing retail behaviour from
    informed flow, and their difference isolates the lead-lag asymmetry. Also minute return autocorrelation (day_autocorr / lagged corr), a classic microstructure bid-ask-bounce / underreaction measure.
    Different from the r1 N slot (day_skew of Ret*Volume, same-minute day_corr(Ret,Amt)) because those are contemporaneous co-movement statistics, whereas this is a temporal-ordering statistic that the
    batch's heads (same-minute shapes, level regressions) cannot express. Averaged over 20-60 days to cut noise; the lead-lag structure reflects slow information incorporation by A-share retail and persists
    structurally. Cross-day smoothing and own-history z-scores are the only post-processing.
