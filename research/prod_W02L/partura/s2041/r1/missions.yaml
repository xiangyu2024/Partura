  - type: N
    hypothesis: >-
      The batch is entirely about volume under extreme price buckets and all negative; the lesson is that conditioning volume on price level is just liquidity. New idea: measure the micro-structure of how price and volume co-move inside the day rather than the level - intraday price-volume correlation (day_corr(Amt,Ret), lagged correlation of price change with volume), return autocorrelation (momentum vs bounce within the day), intraday range position of the close (close-low over high-low), skew of minute returns, and drawdown from the high at the close, each averaged over 5-20 days to cut noise. Mechanism: positive price-volume correlation reveals informed or trend-chasing trading, negative autocorrelation reveals liquidity-provision bounce, and close position in the range reveals end-of-day demand; all are scale-free, so the ruler's liquidity / volatility controls are not trivially re-measured. Library-wise these are shape statistics, not conditional volume sums, so they are structurally different from every batch member. They should persist because the behavioural pricing of order-flow pressure is slow-moving and cross-day means give stable signals.
    inspired_by: 'batch 1 of stream 2041: all three heads (and the whole 26-candidate set) are Volume or Amt sums selected by in_roll_labels buckets of Close or Vwap, scoring -1.5 to -4.1; the Volume to Amt swap is far worse (-3.9), which says the level is a liquidity read and a different, scale-free statistic of the same price-bucket tail structure is needed'
    seeds:
        - 'div(day_sum(select_where(is_gt(in_zscore_rolling(Vwap, 60), 1), Amt, create_like(in_slice(Close, 1, 1), 0))), add(day_sum(Amt), create_like(in_slice(Close, 1, 1), 1e-05)))'
        - 'cross_mean(day_corr(in_delta(Vwap, 5), Volume), 20)'
        - 'cross_mean(day_corr(in_pct(Close, 5), in_shift(Volume, 5)), 20)'
        - 'day_corr(Ret, in_shift(Ret, 1))'
        - 'cross_mean(day_autocorr(Ret, 1), 20)'
        - 'div(day_std(select_where(is_lt(in_argmax(Close, 30), 0.5), Ret, create_like(in_slice(Close, 1, 1), 0))), add(day_std(Ret), create_like(in_slice(Close, 1, 1), 1e-05)))'
        - 'cross_mean(day_skew(Ret), 20)'
        - 'cross_mean(day_corr(Vwap, in_index(Close)), 20)'
        - 'cross_mean(day_corr(Amt, Ret), 10)'
        - 'cross_mean(sub(day_max(Close), day_close(Close)), 10)'
        - 'cross_mean(div(sub(day_close(Close), day_min(Close)), add(sub(day_max(Close), day_min(Close)), create_like(in_slice(Close, 1, 1), 1e-05))), 10)'
