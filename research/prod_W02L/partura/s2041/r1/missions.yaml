    core: 'day_mean(select_where(eq(in_roll_labels(Close, 241), 4), Volume, create_like(in_slice(Close, 1, 1), 0)))'
    hypothesis: >-
      Three batch heads all keep only the minutes where the 241-minute rolling z-score bucket of Close is in an extreme tail (label 4 = price above mean+1.28 sigma, label 0 = below) and then sum or average the raw Volume, and all score about -1.5 to -1.8; the raw level of Volume is what the ruler removes (liquidity control), so the level is the rotten part and the core (volume that trades while price is stretched to the upper tail) may still carry information. Mechanism: volume at stretched-high prices is chasing or distribution volume (retail momentum chasing, large holders unloading into strength); its share of the day total, its imbalance against the lower-tail share, and its deviation from the stock's own 20-day normal are level-free measures of how much of the day's trading happened under price stress. The seeds wrap the core with the day-total volume as a denominator, a lower-tail or neutral-bucket benchmark, a cross-day mean/zscore against the stock's own history, and a direction-conditioned (Ret>0 / Ret<0) split. The library only has the raw day_sum/day_mean of this tail volume (and an Amt/Vwap variant); ratios, differences against opposite tail and across-day z-scores were never tried, so the new thing is the cross-sectionally comparable normalisation, not a different tail. Out of sample it should persist because tail-volume share is a behavioural trait (who trades when price is extended) that is slow-moving and cross-day averaging reduces noise; the ratio forms have no look-ahead (all minute data are same-day) and a guarded denominator.
