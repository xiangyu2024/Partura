slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [8, 13]
    reasons: |-
      核心 = 快照 head 3 本身 day_mean(select_where(eq(in_roll_labels(Close,241),4),Volume,0)),原样包含,属于「整个 head 也可以」。核心与 5 个控制的 |rho|:liq 0.55 / vol 0.18 / rev 0.16 / known 0.57 / size 0.45,均 < 0.8,通过 E 位的控制检查。
      外围以该核心为分子:成交占比(种子 1、2、3、14),相对 20 日均量(种子 5),本股跨日 z 分数(种子 6),5 日减 40 日均值(种子 12),按 Ret 方向条件化(种子 10、11),与下尾/中性桶的差或比(种子 4、7、9)。种子之间外围两两不同;种子 2 与 3 只差窗口 20/5,算子集合相同,但不是同一表达式,保留。
      新颖度给 3 而非 4:核心本身就是库内 head,外围的比率化确实改变了信号(种子 1–7、9、14 与 head 3 的残差 |rho| 在 0.12–0.19),但全部是同一个 tail 成交量的归一化。
      划掉种子 8:sub(tail4, tail2) 与 head 1(下尾量)的残差 |rho| = 0.91,尺子上与库内 head 是同一个东西。划掉种子 13:Volume/Amt 在尾部即约 1/尾部 VWAP,与 head 3 的残差 |rho| = 0.87,尺子上与核心重合。种子 10(残差 0.72)保留。
      需核对、不划:种子 7、9 用 label-0 / label-3 分桶成交量作分母,+1e-5 的护栏相对于股数量级很小;若某股某日该桶成交为 0,比值会爆。截面排序会削弱单点爆点,现有材料没有显示它主导截面,只能作为核对项。
      机制说明需要改写:in_roll_labels 在窗口等于行长时走 in_mean_full / in_stddev_full(dt_in.py 中 window == x.shape[-1] 分支),而分钟网格是 241 根(legacy/minute_grid.py)。因此这里的标签是按全天价格分布切的,不是「241 分钟滚动的拉伸」。日终可得,用于次日交易没有前视;但不能当盘中信号。若它有 alpha,最可能来自全天价格高位停留时段的成交集中(与追涨或派发相关的日内形态),而不是水平流动性。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [1, 4]
    reasons: |-
      新颖度:候选是日内价量相关、自相关、偏度、区间位置等形态统计,与快照 3 个 head(条件量求和)结构不同。原始 |rho| 除种子 1、6 外均 <= 0.28(种子 2 为 0.28,3 为 0.10,5 为 0.11,7 为 0.13,8 为 0.18,9 为 0.23,10 为 0.12,11 为 0.19,12 为 0.23);种子 6 为 0.56,由 argmax 选出的 Ret 标准差,与 head 的残差 |rho| 为 0.50。
      但与 20 日反转控制的 |rho| 偏高:种子 2 为 0.60,种子 8 为 0.56,种子 12 为 0.57,种子 9 为 0.42;种子 10 与流动性控制为 0.57。都低于 0.8 的自动划线,按 §3 放行;这些是「换了写法的反转」的风险,所以创新度给 4 而非 5。
      划掉种子 1:div(Amt 占比)与 head 2 的原始 |rho| = 0.75 >= 0.7,库禁令本来就会拒,自动划。
      划掉种子 4:day_corr(Ret, in_shift(Ret,1)) 的移位默认 fill_value = -1.0(dt_in.py:281),于是唯一的配对是 (Ret[0], -1.0)。Ret 的量纲约 1e-3,哨兵比典型值大三个数量级,在 day_corr 的协方差与方差里占主导:哨兵项约 1e-3 量级,其余 239 对的真实协方差约 1e-4 量级,var_y 几乎全由哨兵决定。结果退化为开盘首分钟收益除以日波动,属于数值伪影,划掉。种子 5(day_autocorr)用成对掩码,没有这个问题,保留。
      其余种子不划。种子 3 的哨兵落在 in_pct 为 NaN 的位置,被掩码排除,安全。种子 6 的 in_argmax 取值为 (距最新的位置+1)/有效点数(common.py nanargmax_last),由 rolling_windows 因果取窗,无前视。种子 10 的 day_max(Close)-day_close(Close) 单位是元而非无量纲,截面排序带价格水平,与「scale-free」的描述不符,这是定义与描述的偏差,不属于 §4 的数学问题,放行。
      如果它有 alpha,最可能来自日内价量同步性(种子 2、9)与收盘在日内区间中位置及高低点回撤(种子 10、11)所代表的尾盘需求压力与流动性提供的行为差异。
R:
  - head: 'day_mean(select_where(eq(in_roll_labels(Close, 241), 0), Volume, create_like(in_slice(Close, 1, 1), 0)))'
    soundness: 4
    reasons: |-
      替换理由成立:把下尾成交量的水平换成占比或相对量,6 个变体都是因果的(day_sum、cross_mean、cross_zscore 为本股自身历史 20 日 z,见 ops_ext.py:208;没有 nanrank 类算子,不受 §4 的 rank 陷阱影响)。分母都是全天成交量或其 20 日均值加 1e-5,停牌日分子为 0,不会爆。
      残差 |rho| 与原 head 的对照(相关度表):变体 1 为 0.24,变体 2 为 0.17,变体 3 为 0.12,变体 4 为 0.16,变体 5 为 0.16(对 head 3),变体 6 为 0.19;变体与原 head 的原始 |rho| 为 0.48、0.09、0.51、0.54、0.41、0.20。
      需核对、不挡:标签 0 的判定是 x <= m - 1.28*sigma,若某日全天价格不变(一字板,sigma = 0),全天分钟都会落进标签 0,此时 tail0 量等于全天成交量。这会污染原 head 与所有变体的下尾系列。它不是本次能判定的数学问题,只要求在 R 的结果里检查一字板日的占比。
