slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [4, 12]
    reasons: |
      核心 day_corr(in_delta(Vwap,5),Volume) 出现在 loc.md 共性表 enrichment 行里(+1.02, p 0.005, 9 个候选),属于合法核心。核心与 5 个控制的 |ρ| 为 0.04 / 0.04 / 0.17 / 0.04 / 0.04,远低于 0.8。原始 |ρ| 与快照 head 的最大值为 0.59(最像的是 volume 尾部日和乘 Ret 均值那个 head),残差 0.22;与其余 head 的 |ρ| 更低。
      创新度 4:快照 6 个 head 全是成交量水平 / 尾部量和,或日内开收价路径的截面标准差,没有一个是维度无关的日内价量共动相关。核心本身在库的 enrichment 候选里出现过,所以新意主要在外围的跨日归一、桶内中性化与偏度,不在核心的形式上。
      合理度 4:day_corr(dt_day.py:231)在分钟轴上算相关;in_delta(dt_in.py:301)前 5 分钟为 NaN;所有外围只用同日或更早的数据,没有前视。已核对的数值点:day_corr 在一方为常数(一字板、零成交)时返回 0 而不是缺失,这类票会在截面上聚到 0。未核实其占比,但外围几乎都是多日聚合,且 ts_skew、桶内中性化会减弱它,不足以判定它主导结果,按 §4 不挡。
      种子 4 划掉(数学问题):cross_semistd_pos 的实现 _semistd(ops_ext.py:751-761)只对 x>0 且前一日 x>0 的日子取对数变化,而 day_corr 取值在 [-1,1] 之间、约一半为负。该种子只看正-正相邻日的上行半波动,负相关股票的大部分日子被 NaN 掉,结果主要由符号模式和缺失决定,属于 §4 的定义坏掉。
      种子 12 划掉(重复):cs_robust_z(ops_ext.py:500-505)是逐日截面 (x-med)/(1.4826·MAD+EPS),对 cross_mean(day_corr,20) 是逐日单调仿射变换,日度秩与种子 1 完全相同,corr 表两行逐项一致。
      留意但不挡:种子 9 的 cs_last_high10 不是 PI 写的「字典序打破并列」,_lexi(ops_ext.py:339-353)是把 day_gini(High) 最高 10% 的股票整块压到末位,其余按 cross_mean(day_corr,15) 排。它是可编码的设计,不是数学问题,但种子的机制描述应改为「最高 gini 的 10% 固定排末位」。种子 1 与 rev 控制 |ρ| 0.60,低于 0.8 的自动划掉线,保留。
      如果它有 alpha,最可能来自:高频价量共动所反映的信息型或趋势追随机构流,在 A 股散户主导的市场里表现为慢变的行为特征,靠跨日平均降噪后持续存在。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [7]
    reasons: |
      快照 6 个 head 都是日内标签量的聚合,或日内开收价路径的截面标准差,没有一个含隔夜腿 open_t / close_{t-1}。corr 表里原始最大 |ρ| 为 0.66(种子 9,对 cross_stddev(Vwap 路径) head),其余 ≤ 0.31;残差全部 ≤ 0.34。种子 2 对 rev 控制 |ρ| 为 0.59(低于 0.8),说明 gap 减日内的 20 日差与 20 日反转有一部分重合,但不是同一个量。创新度 4。
      合理度 4:机制清楚,隔夜 / 日内收益分歧(隔夜机构与新闻流与日内散户反转)在 A 股有文献基础。逐个核对算子:cross_delay(dt_cross.py:150)只取前一日的收盘,没有前视;day_first(Open) 是 09:30 集合竞价列(dt_in.py in_half 注释);分母都是价格、远离 0;没有 cross_shift、in_local_mean、ts_spearman 或 nt_*。cross_corr 是 axis=0 的因果滚动(common.py rolling_windows 左填 NaN)。
      种子 7 划掉(重复):cross_mean(gap,20) 减 cross_mean(intraday,20) 与种子 2 的 cross_mean(gap - intraday,20) 在均值线性上相同,只差 NaN 处理;corr 表两行的全部数字一致。
      留意但不挡:种子 9 的 cross_semistd_neg 作用在 gap 比值上,度量的是 gap 比值日间对数变化的下行半波动,不是隔夜收益本身的下行波动,PI 笔记的说法不准确。它与 vol 控制 |ρ| 0.55、known 族 0.48、head 0.66 都偏高,是下一轮要盯的点;但不构成数学问题或重复,保留。
      种子 10 用 day_close(Vwap) 代替 day_close(Close) 做日内腿,窗口为 10 而不是 20,与种子 2 不完全相同,保留。
      如果它有 alpha,最可能来自:隔夜跳空的跨日持续性(溢价或折价),以及隔夜与日内的反转关系,来源是散户日内过度反应与机构隔夜流的分工。
