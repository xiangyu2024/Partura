  core: 'day_corr(in_delta(Vwap, 5), Volume)'
  hypothesis: 'Core day_corr(in_delta(Vwap, 5), Volume): within-day correlation between the 5-minute change of VWAP and the minute volume, i.e. whether volume arrives with price moves (informed/momentum-chasing flow, positive) or against them (liquidity provision, negative). It is a dimensionless correlation, so unlike the level-volume heads of batch 1 it is not the liquidity control. Enrichment table: +1.02 (p 0.005, 9 candidates), never given an outer treatment in rounds 1-2 (those used day_gini(Open/High), day_first(Open), Close/Open ratios). Note day_corr returns 0 (not missing) when one side is constant (limit-up one-word boards, zero-volume days), so such stocks cluster at 0 in the cross-section; the outer treatments below deal with it by multi-day averaging, bucket-neutralisation and tail-skew so the result is not decided by that artifact. Periphery this round is all cross-day persistence / shape: cross_mean (stable trait), cross_zscore (surprise vs own history), ts_skew and cross_semistd (asymmetry of the daily correlations: stocks with occasional very informed-volume days), difference from the 40-day own mean, and cs_bucket_demean/zscore inside deciles of float cap, listing age and Amt (removes the size/age mix that the ruler only removes linearly in rank), and cs_last_high10 lexicographic tie-break with day_gini(High). Mechanism: persistent volume-follows-price is a footprint of informed or trend-following institutional flow and predicts continuation or slow incorporation in A-shares where retail dominates; bucket-neutral versions keep it from being a size proxy. Out of sample: order-flow style is a slow-moving behavioural trait, not tied to the 2018-2023 regime; no look-ahead (same-day minutes and earlier days only).'
