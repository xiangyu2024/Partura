- type: N
  hypothesis: 'Overnight-versus-intraday return decomposition. Gap = day_first(Open) / previous day_last(Close) (overnight return, uses cross_delay so only the past close), intraday = day_last(Close) / day_first(Open). In A-shares overnight returns are dominated by institutional / news flow and intraday by retail trading, and the two are known to show opposite persistence (overnight drift, intraday reversal). Stream 2041 batches were all about intraday volume labels and intraday open/close dispersion; none touch the overnight leg, which the price-level controls (20-day reversal, volatility, liquidity) mix with intraday moves in one close-to-close return. Operators: cross_mean of the gap over d days (persistent overnight premium), the gap minus the intraday return (trait difference), cross_corr(gap, intraday, d) per stock (negative = overnight moves reverse intraday, a retail-overreaction footprint), and bucket-neutral versions inside float-cap deciles to remove the size mix. Library hand-written expressions use close-to-close Ret and intraday slices, not the previous-close-to-open leg with a cross-day lag, so the structures are new. Out of sample: the overnight/intraday split is a structural feature of the market microstructure (T+1, retail intraday trading), not a sample artifact. No look-ahead: cross_delay takes the previous day; denominators are prices, away from zero.'
  inspired_by: 'Batch 2 (cross_stddev of close/open ratios, day_first(Open) enrichment +1.83) showed the intraday open-to-close leg is where the stream finds signal-like structure but is crushed by the volatility control; the overnight leg is the unexamined complement.'
