slots:
- type: E
  core: day_gini(High)
  hypothesis: 'Core day_gini(High): the within-day inequality of the High path (Gini of |High| across minutes). Enrichment table puts it first among structural cores (+1.31, p 0.001, 14 candidates) and
    the round-1 N run found cs_first_low20(day_gini(Open), ...) at -0.50, the closest to passing anything in this stream; High has not been given a different periphery. Mechanism: for a price level series
    the Gini is a scale-free measure of how unevenly price is spread over the day, i.e. a path-shape/range proxy that is not the level of volume (which the liquidity control kills). Previous periphery used
    only the lexicographic screen cs_first_low20 with a price level; this round wraps it differently: multi-day persistence/dispersion (cross_mean, cross_zscore, cross_stddev, semistd, tail mean, EMA),
    relative-to-own-history (minus 40-day mean), relative to the Low path (High minus Low Gini = asymmetry of upside vs downside excursions), normalised by Volume Gini (price-path inequality relative to
    trade-size inequality), and cross-sectional neutralisation inside deciles of Amt / float cap / listing age / board (cs_bucket_*), which removes the size and board mix the ruler only removes linearly-in-rank.
    Library has none of these wrappers on this core. Out of sample: intraday excursion asymmetry priced by lottery/attention demand is a persistent behavioural trait; bucket-neutral versions avoid the size
    regime shift. No look-ahead (same-day minutes, days earlier only); denominators guarded by 1e-5.'
  seeds:
  - cross_mean(day_gini(High), 20)
  - sub(day_gini(High), day_gini(Low))
  - cs_bucket_demean(day_gini(High), LogFloatCap)
  - cs_bucket_zscore(day_gini(High), day_sum(Amt))
  - cross_zscore(day_gini(High), 20)
  - cross_stddev(day_gini(High), 20)
  - cs_robust_z(day_gini(High))
  - div(day_gini(High), add(day_gini(Volume), create_like(in_slice(Close, 1, 1), 1e-05)))
  - cross_semistd_pos(day_gini(High), 20)
  - sub(day_gini(High), cross_mean(day_gini(High), 40))
  - cs_bucket_demean(cross_mean(day_gini(High), 10), ListAge)
  - cross_tail_mean_q75(day_gini(High), 20)
  - cs_last_high10(day_gini(High), day_gini(Volume))
  - cross_ema(day_gini(High), 10)
  - mul(day_gini(High), LimitWidth)
  - cs_bucket_zscore(cross_mean(day_gini(High), 5), BoardCode)
- type: N
  hypothesis: 'New idea from the board-specific price limits (LimitWidth leaf, 10/20/30% boards; the library never uses it): measure how close each day''s extreme comes to the stock''s own limit, in units
    of the limit: (day high - previous close)/previous close/LimitWidth (upside proximity), the same for the day low (downside), and the close-to-close return in limit units. Mechanism: the A-share daily
    limit makes the extreme excursion a censored, bounded variable; stocks that routinely touch 70-100% of the limit are lottery/speculative names whose limit-chasing demand pulls the price above fair value,
    while repeated near-limit-down touches show forced selling; limit-normalised means over 10-20 days, counts of near-limit days (>90%), sup over 20 days (cross_max), and the up minus down asymmetry are
    board-comparable (a 20% board stock with a 10% move is not the same as a 10% board stock), which volatility controls (raw returns) do not do. The batch showed that raw price-bucket volume sums are pure
    liquidity, so the signal should be a scale-free, bounded, event-type statistic. Also bucket-demeaned by float cap and by BoardCode to test regime stability. It differs structurally from every batch
    member: it uses previous close via cross_shift, High/Low extremes, and LimitWidth, with no Volume or in_roll_labels. It should persist because retail attention/lottery demand for limit-touching stocks
    is a documented, stable A-share behaviour (limit-up chasing followed by reversal). No look-ahead: previous close is known before the day; denominator guarded.'
  inspired_by: 'Batch 1-2 of stream 2041: heads are in_roll_labels(Close) tail-volume sums (liquidity, -1.5..-1.9) and cross_stddev(close/open over the window) (volatility of intraday return, -1.8..-1.9);
    both are unbounded return or volume levels. Enrichment of day_first(Open), day_close(Vwap) shows price-extreme/location features carry the least-bad information, so a bounded, board-normalised extreme-return
    statistic is the next step.'
  seeds:
  - cross_mean(div(div(sub(day_max(High), cross_shift(day_last(Close), 1)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), 10)
  - cross_max(div(div(sub(day_max(High), cross_shift(day_last(Close), 1)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), 20)
  - cross_mean(div(div(sub(cross_shift(day_last(Close), 1), day_min(Low)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), 10)
  - cross_max(div(div(sub(cross_shift(day_last(Close), 1), day_min(Low)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), 20)
  - cross_mean(sub(div(div(sub(day_max(High), cross_shift(day_last(Close), 1)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), div(div(sub(cross_shift(day_last(Close),
    1), day_min(Low)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth)), 20)
  - div(div(sub(day_max(High), cross_shift(day_last(Close), 1)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth)
  - cross_mean(div(div(sub(day_last(Close), cross_shift(day_last(Close), 1)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), 20)
  - cross_stddev(div(div(sub(day_last(Close), cross_shift(day_last(Close), 1)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), 20)
  - cross_sum(is_gt(div(div(sub(day_max(High), cross_shift(day_last(Close), 1)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), create_like(in_slice(Close,
    1, 1), 0.9)), 20)
