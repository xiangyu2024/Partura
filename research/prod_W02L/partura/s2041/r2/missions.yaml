    1), day_min(Low)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth)), 20)
  - cross_zscore(div(div(sub(day_max(High), cross_shift(day_last(Close), 1)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), 20)
  - cross_ema(div(div(sub(day_last(Close), cross_shift(day_last(Close), 1)), add(cross_shift(day_last(Close), 1), create_like(in_slice(Close, 1, 1), 1e-05))), LimitWidth), 5)
