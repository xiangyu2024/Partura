slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 2, 3, 11]
    reasons: '创新度 3:核心 day_pdf_quantile_single(Ret,Volume,0.95,True) 就是三个 head 共用的子树(corr_1.json 中 head 原始最大 |ρ| 为 0.231 ~ 0.62 不等),所以多数种子只是对同一个日值做平滑或去水平:cross_ema(60)、cross_mean(120)、桶内去均值等与 head 原始 |ρ| 在 0.49–0.70 之间,是 head 的换窗口版本。但 zscore(120)、与日收益/日波动的滚动相关、autocorr、tail_q25、两个核心分位之差等与 head 几乎不相关(|ρ| ≤ 0.16 或 0.22–0.30),是对同一核心的新量,所以不判为 1。合理度 4:逐个算子核对:day_pdf_quantile_single 的 minmax 缩放与 left=True 的 searchsorted(作用于升序累计量)正确;cross_zscore、cross_ema、cross_corr、cross_tail_mean_q25、cs_bucket_demean 的定义与文档一致;seed 10 的分桶变量是 LogFloatCap 减 LogFloatShares,即 log 价格(字段是 log 量),不是市值,与 size 控制不同。无前视,不含 ts_rank / cross_rank / in_rank_rolling,没有 nanrank_last 陷阱。核心对五个控制的 |ρ| 均 ≤ 0.045。划掉的种子:1、2、3 与 R 1 的 variant 4、3、5 字符串完全相同(重复,R 直接评估即可,GP 不必再种一次);11 cross_semistd_neg 的算子文档要求输入为正的水平量,这里输入是 [0,1] 内的日内位置,log 比值在位置接近 0 时爆点,对 60 日均方根的贡献会被少数股票日主导,属于 §4 的数值伪影(按机制判断,PI 可在 train 上核对是否真由爆点主导)。seed 10 的原始 |ρ| 精确值为 0.696,低于 0.7 的自动划掉线,不划(md 表里四舍五入成 0.70,这是边界)。如果它有 alpha,最可能来自尾盘放量时价格在当日区间内的位置在数十日尺度上的个股差异(机构执行紧迫度、知情交易的时点偏好),而不是单分钟读数的噪声。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [3, 7, 8]
    reasons: '创新度 4:被测对象是成交量时钟上的时刻(in_index 作 x,Volume 作权重),不是 Ret 的读数。与三个 head(都是 Ret 的分钟读数)的原始 |ρ| 全部 ≤ 0.17,残差 |ρ| ≤ 0.11,不是同一个量。与控制的原始 |ρ| 在 0.4–0.5(liq、known),有中等程度的流动性暴露,这一点要靠残差去看;但 0.5 不是同一个量,不判为 1。合理度 4:in_index 的 t/(T-1)、minmax 缩放(分钟轴完整时为恒等变换,截取区间时为仿射变换,都不改变截面排序)、day_centroid 对 |x| 的加权都核对过,定义正确;全部只用当日及以前数据,无前视。划掉的种子:3 把 Volume 权重换成 Amt,它与 1 的控制 |ρ| 逐位几乎一致(liq 0.471 对 0.472,vol 0.433 对 0.436,known 0.503 对 0.505,残差 0.105 对 0.105),是同一个量换了权重,重复;7 用 left=False,pdf 的 left=False 分支对降序的反向累计和做 torch.searchsorted,二分查找的前提(升序)不成立,输出退化为几乎恒定的第一分钟(distinct 0.001),是定义坏掉的数学问题;8 只是把 seed 1 的分钟窗口裁成 [11,230),裁剪后 minmax 把中位时刻映射成 (t-11)/218 的仿射变换,中位分钟几乎相同,与 seed 1 重复。不划的:5 与 9 的并列比例较高(distinct 0.41 与 0.26),但并列由股票列序打破属于 §4 允许的情形,9 是 Amt 与 Volume 中位时刻之差,信号集中在少数股票日,记为风险,不算定义坏掉;seed 1 的 distinct 0.545 同理。如果它有 alpha,最可能来自成交时点分布所反映的参与者构成(机构与被动资金的尾盘集中、或开盘前置的散户流动),这是慢变的个股属性。'
