    soundness: 4
    reasons: '合理度 4:拆解里 20 日短窗与 Volume 权重被指为烂部件。变体拉长到 80 / 120 日,并把 Volume 换成 Amt 作为 pdf 权重(Amt 把价格纳入权重,与 Volume 只差每分钟价格的加权),机制说得通;pdf 与 minmax 路径对 f=Amt 与 f=Volume 相同,没有数值问题;cross_ema 半衰期 60 的语义正确。没有用 left=False。'
summary: 'a、b 两位都过审:a 创新 3 / 合理 4、划掉 1、2、3、11 后剩 10 个种子;b 创新 4 / 合理 4、划掉 3、7、8 后剩 10 个种子;E 核心对五个控制的 |ρ| 均 ≤ 0.045。R 两组合理度均为 4。另请总领注意:day_pdf_quantile_single 的 left=False 分支对降序累计量做 searchsorted,输出退化,库里若有此类成员需单独核对。'
