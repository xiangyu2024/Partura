    core: 'day_pdf_quantile_single(Ret, Volume, 0.95, True)'
    hypothesis: |-
      机制:核心 C = day_pdf_quantile_single(Ret, Volume, 0.95, True)。算子把当天分钟收益按当日最大最小值缩放到 [0,1],再按分钟顺序累加成交量占比,取累计成交量首次达到 95% 的那一分钟的缩放收益(x 并不排序,所以这是「成交量时钟」上第 95% 处的那根分钟收益在当日区间里的位置)。读的是尾盘放量时价格相对当日区间的方向:机构拆单 / 尾盘集中成交时的价格压力,以及知情者在量集中的时点推价。
      本批证据(只用 train / valid):3 个 head(q=0.95 / 0.8 / 0.6)全是 cross_mean(C_q, 20),分数 -0.73 / -0.83 / -0.85,都不是发现。拆解里最重要的一条是平滑窗口:C 本身(裸日值)-2.94,窗口 10 为 -1.01、20 为 -0.73、40 为 -0.55(valid +0.00),单调变好,说明日值是单分钟读数,噪声极大,可用信息只在慢尺度上出现;换 Volume→Amt 差别不大。所以这一位的核心是把「单根分钟读数」变成「长窗口的个股属性」,而不是再用 20 日简单平均。
      本位外围与以前见过的(只有 cross_mean 窗口 10 / 20 / 40 与裸日值)完全不同,五类:(a) 慢聚合 / 指数加权:cross_ema(C, 60)、cross_mean(C, 120),把有效窗口拉到 60 到 120 日,换手低一个量级,15 bp 才吃得下;(b) 相对自己的历史:cross_zscore(C, 120)、短窗均值减长窗均值,去掉个股持久水平(水平被流动性、市值、波动控制吃掉),只留尾盘价格压力的变化;(c) 尾部对称化:C 减同一天 5% 处的读数(sub(C, C_0.05)),去掉当天收益区间缩放带来的共同位置项,只留「尾盘相对开盘段」的价格斜率,再取慢均值;(d) 滚动关系:cross_corr(C, day_sum(Ret), 60)、cross_corr(C, day_std(Ret), 60),问「尾盘价格压力与当日收益 / 波动是否同向」,比水平更稳;(e) 在市值十分位内去均值 cs_bucket_demean(·, LogFloatCap),去掉大小盘对该读数的非线性暴露(新尺子只去掉对控制排名低阶多项式暴露,十分位内去均值把交互项也去掉)。
      为什么和库里不同:库里 day_pdf_quantile_single 全部是裸写,或 cross_mean(·, 20) 一层包装;骨架 cross_mean(day_pdf_quantile_single(F,F)) 被拒。这里的外层是 cross_ema / cross_zscore / sub / cross_corr / cs_bucket_demean 与差分结构,骨架都不在库里;与三个 head 的区别是有效窗口从 20 日拉到 60 到 120 日、并且做了去水平 / 去尺度处理。
      为什么样本外还会在:尾盘集中成交时的价格方向反映机构执行紧迫度与知情交易的时点偏好,是个股的结构性交易行为,数十日内排序稳定(拆解里窗口越长分越高、valid 趋近 0,是稳定属性在噪声被平均掉后露头的迹象,不是挑出来的窗口);A 股 T+1 与尾盘成交占比高,对应文献里的日内动量 / 尾盘效应(Gao-Han-Li-Zhou 2018 intraday momentum 的末半小时收益预测)。风险诚实说明:单个 head 的分数仍为负,这个位的期望是「长窗口把分数拉到 0 附近或略为正」,命中不保证。
      数学检查:缩放用 (x-min)/(max-min+1e-12),全天价格不动(max=min)时 C 为 0 而非爆点;整天停牌则 NaN,不是无穷;cross_zscore 分母为 120 日标准差,C 常数时分子也为 0;全部只用当日及以前数据,无前视;窗口最长 120 日,热身期只占前 120 日。
