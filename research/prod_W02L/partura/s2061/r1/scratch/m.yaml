  - type: N
    hypothesis: |-
      机制:成交量时钟(volume clock)——一天中成交量在时间轴上的分布位置。把 in_index(Volume)(每分钟在一天中的位置 t/(T-1))作为 x,成交量作为权重,用 day_pdf_quantile_single 取累计成交量达到 q 的时刻:q=0.5 即「成交量中位时刻」,q=0.25 / 0.75 之差是成交量在时间上的集中度。它回答「这只票的成交是前置(开盘集中)还是后置(尾盘集中)」。前置型多见于隔夜信息消化与散户追涨型流动,后置型多见于机构调仓、基金申赎和指数 / 收盘价敏感的交易(收盘价对净值、保证金、期权有意义),这是参与者构成的结构属性,不是成交额水平的另一种写法。
      算子实现:day_pdf_quantile_single(in_index(Volume), Volume, q, True) 里 in_index 把每分钟换成时刻位置,Volume 作为 pdf 权重,算子里 x 做了 minmax 缩放(对时刻位置只是线性映射,不改变排序),返回的就是累计量达 q 的分钟位置。日轴上用 cross_mean / cross_ema(40 到 60 日)或 cross_zscore(120) 变成慢变个股属性;变体有:Amt 作权重(成交额时钟)、q=0.25 与 0.75 之差(集中度)、q=0.9 且 left=False(自尾向前)、去掉开收盘集合竞价附近分钟(in_slice 11 到 230)、与 Volume 时钟的差(Amt 时钟减 Volume 时钟 = 价格在日内的倾斜)、以及与当日收益的 60 日滚动相关(时钟是否在大涨日前置)、市值十分位内去均值。
      受本批启发:本批 3 个 head 与库里 106 条 day_pdf_* 全部是「分钟收益在量时钟上的读数」,即 day_pdf_*(Ret, Volume),没有一条用 in_index 或 day_centroid 把「时间位置」本身当被测对象(members 里 in_index / day_centroid 0 条)。head 的失败(裸日值 -2.9,窗口越长越好)说明 Ret 的读数是噪声很大的单分钟值;换成「时刻」就成了一个无量纲、噪声小得多的日值(量的累计曲线本身是平滑的),且与 Ret、波动、成交额水平的联系间接。
      为什么和库里不同:被测对象是时刻而非收益 / 价格,骨架 day_pdf_quantile_single(O:in_index(F), F) 不在库里;day_centroid 虽在 ops_ext 里,库的 5583 条中没有。与控制的关系:量的前置 / 后置与流动性、波动有一定相关,但不是它们的单调函数;新尺子还会去掉对控制排名的线性、U 形、S 形暴露。
      为什么样本外还会在:成交时点分布由参与者构成(机构 / 散户占比、做市与算法拆单的 VWAP/TWAP 偏好)决定,是慢变的结构属性,数十日内排序稳定;尾盘集中的票被基金申赎 / 指数被动资金占比高,其价格压力在后续有可预测的方向(文献:Heston-Korajczyk-Sadka 2010 日内周期性——日内成交时点对未来同一时点的预测;Bogousslavsky 2021 对尾盘 / 日内参与者构成与收益的研究)。窗口 40 到 120 日,换手低,15 bp 成本吃得下。风险:可能与流动性控制中度相关;被去掉线性暴露后剩下的是看运气的部分。
      数学检查:in_index 在 Volume 有限的分钟取 t/(T-1),停牌分钟为 NaN 被 mask 掉;整天无成交时 pdf 全 NaN 给 NaN,不是无穷;缩放分母含 1e-12;全天只有一个有效分钟时 q 位置为 0,不造成爆点;只用当日及以前数据,无前视;窗口最长 120 日。
