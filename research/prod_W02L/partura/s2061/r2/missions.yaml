- type: N
  hypothesis: |-
    机制:开盘首分钟的成交额占当日总成交额的比重(开盘关注度份额)D = day_open(Amt) / day_sum(Amt)。它回答「这只票一天里多大一块成交挤在开盘那一分钟」:份额高多是散户 / 短线资金追隔夜消息、涨停板跳空反应、集合竞价后的第一波抢单;份额低则成交分散在全天、参与者偏机构执行(VWAP / TWAP 拆单)。这是参与者构成的结构属性,是一个比例,所以对成交额水平(流动性控制)大体免疫,与市值也不是单调关系。
    算子实现:div(day_open(Amt), day_sum(Amt)) 得到日值,日轴上用 cross_mean / cross_ema(40 到 60 日)变慢,或 cross_zscore(120) 看份额相对自己历史的变化(关注度突然抬升 = 有新消息 / 新资金进入);变体:用 Volume 份额(与 Amt 份额之差 = 开盘一分钟的价格相对全天的倾斜);用 cross_corr(份额, day_sum(Ret), 60) 问「份额高的日子是否伴随上涨」(追涨 vs 恐慌);用 cross_regbeta 把份额对前一日份额回归得到关注度的持续性;用 cs_bucket_demean 在复权价十分位内去均值。
    受本批启发:本批 28 个含 day_open(Amt) 的候选均值 -0.94,不含 -2.57(p 0.000),说明开盘首分钟成交额这个量里确有信息;但这 28 个全部把它放进「与 LogFloatCap 的回归」或「截面掩顶」里,当作 241 日回归的因变量,没有一条把它除以当日总成交额得到份额,也没有取慢均值。那些候选的信息一部分只是「当日成交额水平」,被流动性控制吸走;份额是无量纲的,把水平去掉后留下的才是新的。
    为什么和库里不同:库里 day_open(Amt) 的表达式里 div(day_open(Amt), day_max(High)) 一类是除以价格,并没有除以 day_sum(Amt);骨架 div(day_open(F), day_sum(F)) 经检查不在 day_open(Amt) 的已见写法里。被测对象是份额,不是回归的 F 值。
    为什么样本外还会在:开盘参与者构成(散户情绪 vs 机构执行)是个股慢变的结构属性,数十日内排序稳定;开盘关注度高的票往往是散户主导、定价噪声大的票,后续存在可预测的修正(行为金融:散户注意力驱动的买入压力之后反转,Barber-Odean 2008 attention-driven buying)。窗口 40 到 120 日,换手低,15 bp 成本吃得下。风险:份额可能与波动 / 流动性中度相关;被去掉线性暴露后剩下的是看运气的部分。
    数学检查:day_sum(Amt) 对在市交易日恒为正(整天停牌则分子分母都 NaN,不是除以零);份额在 [0,1],无爆点;开盘分钟在停牌后复牌日可能很大,但份额有界;只用当日及以前数据,无前视;窗口最长 120 日。
  inspired_by: 第 2 批(T 批):含 day_open(Amt) 的 28 个候选均值 -0.94、不含 -2.57(p 0.000),且全部把它当作与 LogFloatCap 回归的因变量,没有一条去掉成交额水平、取开盘份额。
