  core: 'cross_reg_fvalue(pow_3(LogFloatCap), day_open(Amt), 241)'
  hypothesis: |-
    机制:核心 C = cross_reg_fvalue(pow_3(LogFloatCap), day_open(Amt), 241)。对每只股票,在过去 241 个交易日上用 LogFloatCap^3 去解释「开盘第一分钟成交额」day_open(Amt),取回归的 F 值。LogFloatCap 在个股内部是慢变量(流通市值随价格涨跌漂移),所以 C 度量的是:这只票的开盘首分钟成交额(集合竞价后的第一波参与度、隔夜信息消化的强度)与自身市值轨迹同步到什么程度,即「开盘关注度是否跟着市值涨跌走」。不是成交额水平,也不是市值水平。
    本批证据(只用 train / valid):第 2 批里含 day_open(Amt) 的候选 28 个均值 -0.94,不含的 -2.57,含 cross_reg_fvalue(pow_3(LogFloatCap), day_open(Amt), 241) 的 6 个均值 -1.00 / 不含 -2.29(p 0.011)。上一轮的 N 位里该核心外面包 cs_mask_top_replace_mean 得 +0.13 / +0.12(train 与 valid 同号),是本流目前唯一稳定为正的一类,但没过 0.5。已见过的外围只有 cs_mask_top_replace_mean(1 到 3 层嵌套,越叠越差)。
    本位外围与已见写法完全不同,五类:(a) 时间维稳定化:cross_ema / cross_mean(C, 20) 与 cross_zscore(C, 120),F 值是 241 日窗口估计,日间跳动大,平滑后排序更稳、换手低一个量级,15 bp 才吃得下;(b) 对照核心:sub(C, 把 day_open(Amt) 换成 day_close(Amt) 的同一回归),开盘与收盘首尾两端参与度对市值同步性之差,去掉「一般成交活跃度与市值同步」的共同部分,只留开盘特有的;(c) 截面稳健化:cs_winsor(C)、cs_robust_z(C)、cs_mask_top_replace_mean_neg(C)(这里压的是底部而不是上一轮的顶部,F 值右偏重尾,尾部被少数股票日支配);(d) 截面内分层去均值:cs_bucket_demean(C, day_mean(Low)) 在复权价格十分位内去均值(按价格不按市值,所以不是重复 size 控制);(e) 时间差分 cross_delta(C, 20),看关注度同步性的变化而非水平。
    为什么和库里不同:库里与这个核心同形的全是 cs_mask_top_replace_mean 一层或多层包装(骨架已被拒);这里的外层是 ema / zscore / 差 / winsor / 价格桶去均值 / delta,与那些写法骨架不同。外围集合与已见候选不同。
    为什么样本外还会在:开盘首分钟的成交额反映隔夜消息与被动资金之外的主动参与,这个参与度与市值的同步性是个股的结构性特征(小盘高关注 vs 大盘机构执行),数月内排序稳定(241 日窗口本身就慢);A 股开盘高度由散户与短线资金主导,这类行为稳定。上一轮同核心在两个时段同号为正(+0.13 / +0.12),说明不是单段偶然。诚实说明:期望是把 +0.1 附近的分数推向 0.3 到 0.5,过线概率不高。
    数学检查:F 值在窗口内 day_open(Amt) 近常数时分母近零,会产生爆点;因此种子大量用截面 winsor / robust_z / 掩顶或 ema 压掉爆点;只用当日及以前数据,无前视;最长窗口 241 日,热身期占前一年;停牌日 day_open(Amt) 为 NaN 被 mask。
