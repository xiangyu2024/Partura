slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [4]
    reasons: '相关度表(corr_1.md / corr_1.json,只用 train 段)核心 day_mean(Low) 与快照 6 个 head 的原始 |ρ| 最大 0.109(cross_mean(day_pdf_quantile_single(Ret, Volume, 0.95, True), 120)),残差最大 0.133;与控制 liq 0.466 / vol 0.064 / rev 0.026 / known 0.427 / size 0.441,都低于 0.8,E 位的核心门槛通过。创新度 4:核心是后复权日均低价的水平,快照 head 全部由分钟收益与成交量的 pdf 读数、argmax 构成,没有一个含价格水平;核心与任何 head 或控制都不是同一个量的换写法。外围的 52 周高点比值、低点比值、区间位置、均线比与交叉在快照里没有对应的 head。不给 5:核心的价格路径在本批第 3 批的 18 个候选里已出现过(多作分桶键),骨架是否已在库里交给 GP 的库禁令核对。合理度 4:逐个算子核对。cross_max / cross_min / cross_mean / cross_ema / cross_zscore / cross_corr 都是日轴 trailing 窗口(dt_cross.py 的 rolling 系列),窗口只含当日及以前,无前视;div 为逐元素除法(common.py:175),分母是复权价格的 241 日最大 / 最小 / 均值,恒为正,无爆点;seed 7 的极差分母在整年恒价时分子也为 0,得 NaN 而非无穷;cs_bucket_demean / cs_bucket_zscore(ops_ext.py:463 / 482)按市值十分位内去均值。机制(George-Hwang 式 52 周高点锚定、处置效应)说得通,数学上没有问题。提醒但不划:seed 8 是两条 EMA 的绝对元差而非百分比差,分值会被价格水平放大,与「均线交叉 / 百分比动量」的叙事不完全一致;如要读百分比动量,应除以慢均线。这是定义写法的提醒,不是挡的理由。种子划掉:第 4 个 cross_rank(day_mean(Low), 241) 在相关度表的门槛列记为废品(distinct 0.178,截面取值大量并列,面板接近退化),按 §4 的面板几乎是常数划掉。其余 11 个保留(≥4)。第 10 号 cs_mask_top_replace_mean_neg(div(C, max241)) 与第 1 号只差底部 10% 的替换;它改变了底部成员的排位并进入残差回归,与 cs_mask 类写法的既定口径一致,保留,相关度行差距 ≤0.03,记此备查。如果它有 alpha,最可能来自:价格相对 52 周高点与自身区间位置所代表的锚定 / 处置效应;其次是大小盘内部的慢动量(第 5 / 6 号)。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [9]
    reasons: '相关度表:N 位 12 个种子与快照 6 个 head 的原始 |ρ| 最大 0.32(seed 10,cross_mean(day_centroid(Amt), 120)),残差最大 0.19;与控制 liq 最大 0.78(seed 3,gini)、known 最大 0.70(seed 3、7),均低于 0.8,无自动划掉。创新度 4:快照 head 全部是分钟收益 / 成交量的 pdf 读数与 argmax,没有一个读取成交的日内时点分布(day_centroid / day_gini / in_index 都不在快照 head 里);centroid 系列与 liq / known 的 |ρ| 约 0.5,是中度相关,不是同一个量的换写法。gini(seed 3)与流动性控制 0.78 相关,确实更接近流动性代理,但它是形状量而非水平量,且低于 0.8 的划掉门槛,放行;此处记下,不计为划掉。合理度 4:逐个算子核对。day_centroid(ops_ext.py:155)= sum(t·|x|)/sum(|x|)/(T−1),缺失分钟权重为 0,整天零成交返回 NaN,值域 [0,1],无爆点。day_gini(ops_ext.py:136)按排序后的标准基尼公式计算,空 / 零成交日为 NaN。in_index(ops_ext.py:684)只取 t/(T−1),无前视。cross_corr / cross_autocorr / cross_tail_mean_q75 / cross_zscore / cross_ema 都是日轴 trailing 窗口。seed 7 的 day_corr(in_index(Amt), Amt) 在数学上等于 (centroid − 0.5) 除以 Amt 日内变异系数再乘常数,是 centroid 按日内离散度归一的写法,数学上正确。需提醒 pipeline:day_corr 在某一方当天为常数时返回 0 而非缺失(dt_day.py:231-245),若停牌日 Amt 写成 0 而非 NaN,60 日均值会被拖向 0,请确认 Amt 停牌日为 NaN;这不构成对该种子的划掉理由。机制(成交时点分布反映参与者构成,开盘散户抢单与尾盘机构调仓的差别)说得通。种子划掉:第 9 个 cs_bucket_demean(cross_mean(day_centroid(Amt), 60), LogFloatCap) 与第 1 个 cross_mean(day_centroid(Amt), 60) 是重复:相关度表几乎逐位相同(head 0.282 对 0.282,残差 0.134 对 0.134,liq 0.494 对 0.495,known 0.520 对 0.522,vol 0.430 对 0.438,size 0.018 对 0.036),只是在市值十分位内减去各桶均值,截面秩变化很小,是换皮,划掉。其余 11 个保留(≥4)。如果它有 alpha,最可能来自:日内成交时点的参与者结构(开盘散户抢单、尾盘机构调仓),其次是 Amt 与 Volume 两种加权下的日内价格时点差(第 4 号),窗口越长越稳定。'
R:
  - head: 'pow_2(neg(pow_05(abs_(cross_argmax(day_ar1_coefficient(Ret), 241)))))'
    soundness: 4
    reasons: '此 head 的单调外层(pow_2 / neg / pow_05 / abs_)不改变排序,实际是 cross_argmax 给出的 241 日窗口内最大 AR(1) 所在日的相对位置。拆解的诊断成立:烂的部件是 cross_argmax 这个只看单点的离散峰值位置统计,变体把它换成 day_ar1_coefficient(Ret) 的稳定聚合(均值 120 / 241、ema 60、分位 50、尾部均值 q25 / q75)是合理的修复方向。算子核对:day_ar1_coefficient(dt_day.py:367)在零方差日(一字板、零波动)返回 NaN 而非 0 或无穷,无爆点;cross_mean / cross_ema / cross_quantile(dt_cross.py:212) / cross_tail_mean_q25 / q75 都是日轴 trailing 窗口,无前视,热身最长 241 日。机制:分钟收益一阶自相关为负多来自买卖价差的反弹(bid-ask bounce),慢水平可以读作有效价差 / 微观结构摩擦的代理,与流动性溢价可以联系起来;符号方向不如原 head 清楚,但这只是合理度的弱点,不是数学问题。相关度表:各变体与 liq 约 0.26 到 0.34、known 约 0.21 到 0.28 相关,与快照 head 的原始 |ρ| 在 0.04 到 0.10,这是流动性代理的特征,但不是挡的理由。变体中无 nt_* 或 ts_spearman,无前视算子。合理度 4,保留。'
