- type: N
  hypothesis: 机制:成交的「时钟」——一天里成交额的重心落在哪一分钟(day_centroid(Amt) = sum(t*Amt_t)/sum(Amt),0=全在开盘,1=全在收盘)。受本批启发:含
    day_open(Amt) 的 99 个候选均值 -0.92,不含 -2.55(p 0.000),说明「成交发生在开盘」这件事有信息;而前两轮 N 位只试了开盘一分钟的份额(div(day_open(Amt),
    day_sum(Amt)) 及其差分、自相关,分数 -0.1 到 -0.5),那是单点读数,噪声大。重心是整条日内成交曲线的一阶矩,用到全天 240 分钟,噪声小得多,而且同时把开盘抢单、午间、尾盘集中成交三种行为压成一个无量纲数(量纲上与成交额水平、流动性无关)。算子怎样实现:day_centroid(Amt)
    或 day_centroid(Volume) 得日值(ops_ext.py:155),日轴用 cross_mean / cross_ema(60 到 120
    日)变慢(上一轮教训:日值噪声大、水平里有信息,所以保留水平不 zscore 为主);变体:Amt 重心减 Volume 重心(= 成交价格在日内的倾向:重心后移时价格是否也被抬高),cross_corr(重心,
    当日收益, 60)(尾盘集中成交的日子是否伴随上涨,度量机构尾盘建仓 / 散户追涨),day_corr(in_index(Amt), Amt) 的另一种背载度量,day_gini
    的集中度,cs_bucket_demean 在市值十分位内去均值。为什么和库里不同:库里与 day_open 相关的写法是 day_open(F) 的回归
    / 掩顶 / 份额,以及 day_pdf_quantile_single 的累计成交量分位(只读一个分位点处的价格读数,不是成交时间分布本身);day_centroid
    / day_gini 这类整条曲线统计在本流快照里没有出现,骨架与快照 head 不同。为什么样本外还会在:成交时点分布反映参与者构成(散户偏开盘 / 机构偏
    VWAP 与尾盘),是个股慢变的结构属性,数十日内排序稳定;尾盘集中成交伴随机构调仓与信息交易(日内动量文献:末段成交与收益的关系)。风险:重心可能和波动
    / 流动性中度相关,被去掉线性暴露后剩下的才是我们要的;诚实预期过 0.5 的概率约 15%。数学检查:重心分母为当日总成交额,在市日恒正,值域 [0,1]
    无爆点;整天零成交 / 停牌为 NaN 不是无穷;一字板日成交集中在开盘分钟,重心接近 0 —— 那是真实的交易时点而非数值伪影,但涨停票会被聚类到低端,是已知板块信息;无前视,窗口
    ≤ 120 日。
