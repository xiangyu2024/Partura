    / 反转的位置变量)。本批证据(只用 train / valid):第 3 批含 day_mean(Low) 的 18 个候选均值 -0.96,不含 -1.91(p
    0.004),本流前两轮里它只作为 cs_bucket_demean 的分桶键出现,从没有被当成被测信号本身;新尺子已经去掉对 20 日反转、市值、流动性、波动、已知族和两个冠军的线性
    / U 形 / S 形暴露,但 1 年尺度的「价格相对自己 52 周高低点的位置」不在这些控制里。本位外围全部是价格路径上的位置 / 相对量,与以前见过的(把它当分桶键)完全不同:(a)
    锚定 52 周高点 div(C, cross_max(C,241))(George-Hwang 2004:离 52 周高点近的票被投资者锚定、对好消息反应不足,后续继续上涨);(b)
    随机指标位置 (C-min)/(max-min),在自身 241 日区间内的相对位置;(c) 相对自身长均线 div(C, cross_mean(C,120))
    与 ema 短减长的均线交叉;(d) cross_rank(C,241) 时间序列分位;(e) 用 LogFloatCap 十分位 cs_bucket_demean
    / cs_bucket_zscore 去掉大小盘内的价格路径差异(这把交互项也去掉,新尺子只去掉低阶多项式);(f) cross_corr(C, day_sum(Amt),60)
    问价格路径与成交额是否同向(价量齐升 = 资金流入);(g) cs_mask_top_replace_mean_neg 压底部尾部。算子怎样实现:全部在日轴上用
    cross_* 对复权价格路径取极值 / 均值 / 秩 / 相关,没有任何前视(窗口只含当日及以前);热身 241 日在 train 内。为什么和库里不同:库里含
    day_mean(Low) 的候选是它做分桶键或裸写,骨架里没有「除以自身 241 日最大值 / 区间位置 / 均线比」这类时间序列相对位置,这些骨架不在库里;与核心
    head 无关联(corr 表里核心与 head 的 |ρ| 应很低)。为什么样本外还会在:锚定与处置效应是行为偏差,A 股散户占比高、涨停 / 涨幅限制使信息吸收慢,52
    周高点效应在多国样本外长期存在;价格相对位置的排序换手低(窗口 120 到 241 日),15 bp 成本吃得下。诚实说明:相对位置 div(C, 52w
    max) 与 20 日反转 / 动量有中度相关,会被尺子去掉一部分;期望是把 train / valid 拉到 0 附近或略正,过 0.5 概率约 20%。数学检查:Low
