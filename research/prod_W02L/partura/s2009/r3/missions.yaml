R:
- head: ts_max(day_durbin_watson(Close), 80)
  why: '烂部件是「窗口内取全市场共同的冲击日」。DW(Close) = Σ(ΔC)² / (ΣC² + 1e-8),作用在价格水平上近似每分钟已实现方差(量级 1e-6 ~ 1e-5)。第 2 轮 R 的窗口梯度:ts_max 窗口 80 → 241 在 train 上 −0.45 → +0.20(越长越好),valid 在 −0.73 ~ −1.53 之间不动(80: −0.92,100: −1.30,120: −1.23,160: −1.30,200: −1.24,241: −0.73;Vwap 120 / 241: −1.53 / −0.73),所以窗口不是 valid 的瓶颈。我猜的烂部件:全市场共同的大波动日(如 valid 段 2024 年 1 ~ 2 月的小盘股下跌、2024 年 9 月的急涨)让所有股票在同一天取到窗口最大值,ts_max 变成「该股方差对市场冲击的敏感度」(vol-beta),不是个股自己的属性;同时 max 本身只看单日极值。变体只动这一件事:先做每天的截面秩 cs_rank(去掉市场共同冲击)再取 ts_max / ts_mean;或者去掉单日极值(ts_mean、q75、5 日均值后取 max)。数学上:DW ∈ [0, 4];cs_rank 有界 (0, 1];ts_max / ts_mean / ts_quantile_q75 沿日轴、因果;分母是价格平方和,不近零;没有 log 折叠;无前视;窗口 ≤ 241 日,热身期取可用日。'
  variants:
  - ts_max(cs_rank(day_durbin_watson(Close)), 80)
  - ts_max(cs_rank(day_durbin_watson(Close)), 241)
  - ts_mean(cs_rank(day_durbin_watson(Close)), 80)
  - ts_mean(cs_rank(day_durbin_watson(Close)), 241)
  - ts_mean(day_durbin_watson(Close), 80)
  - ts_quantile_q75(day_durbin_watson(Close), 80)
  - ts_max(cross_mean(day_durbin_watson(Close), 5), 80)
- head: cross_mean(mul(ts_regres(day_mean(High), day_close(Amt), 50), sigmoid(day_durbin_watson(Low))), 241)
  why: 烂部件是 sigmoid(day_durbin_watson(Low)) 这一因子。依据(loc.md 拆解表,单个改动):去掉 sigmoid(knockout)−3.27 → −1.84(train −1.84 / valid −0.42,增益 +1.44);Amt → Volume −2.63(+0.64);外层 cross_mean 241 → 482 为 −3.08(+0.19)、→ 120 为 −3.13(+0.15)。解释(从算子源码读出来的,不是测的):DW(Low) 作用在价格水平上,= Σ(ΔLow)² / ΣLow² ≈ 每分钟收益平方的均值,量级 1e-6 ~ 1e-5;sigmoid(x) ≈ 0.5 + x / 4,float32 在 0.5 附近的刻度约 6e-8,所以 sigmoid(DW(Low)) 估计只剩几十档,多数股票并列,乘积里「方差」这一项被量化掉了;去掉 sigmoid 后 ts_regres(价格水平残差) × DW(Low) 才真正进入。(本批别的 head 里 sigmoid 作用在 DW(Amt)(量级 1 ~ 3)上,不会被量化,所以它们的 knockout 几乎为 0。)loc 只量了单个改动,这一组直接量它们的组合(去 sigmoid + 换 Volume、去 sigmoid + 482 日、去 sigmoid + 换 Close 的 DW),看增益是否可加。数学上:DW(Low) ≥ 0 有界;ts_regres 的残差有限;mul 无近零分母;cross_mean 取可用日;无前视。
  variants:
  - cross_mean(mul(ts_regres(day_mean(High), day_close(Amt), 50), day_durbin_watson(Low)), 241)
  - cross_mean(mul(ts_regres(day_mean(High), day_close(Volume), 50), day_durbin_watson(Low)), 241)
  - cross_mean(mul(ts_regres(day_mean(High), day_close(Amt), 50), day_durbin_watson(Low)), 482)
  - cross_mean(mul(ts_regres(day_mean(High), day_close(Volume), 50), day_durbin_watson(Low)), 482)
  - cross_mean(mul(ts_regres(day_mean(High), day_close(Amt), 50), day_durbin_watson(Close)), 241)
- head: cross_mean(sigmoid(sigmoid(pow_2(sigmoid(day_durbin_watson(Ret))))), 3)
  why: 烂部件是 3 日窗口(太快,换手吃掉信号)。依据(loc.md 拆解表):去掉任何一层 sigmoid / pow_2 几乎不动(knockout −3.48 / −3.49 / −3.73),窗口 3 → 2 / 6 为 −3.47 / −3.44,形状与窗口在 2 ~ 6 日内都不承重;而本流的重复发现是「慢才承重」(ts_max(DW(Close), d) 的 d 每翻一倍好约 0.9 分;N 位 20 日 → 241 日)。变体只改窗口:120 / 241 / 482,其余原样(sigmoid 栈保留,所以只是窗口的单因素消融)。预期:梯度单调变好但仍为负,DW(Ret) 的水平与流动性共线(分钟收益一阶自相关反映买卖价差反弹),慢聚合救不了方向。数学上:DW(Ret) ∈ [0, 4],这里的 sigmoid / pow_2 栈把它压到 0.66 ~ 0.67 一带,跨度约 1e-2,远大于 float32 刻度,没有量化问题;cross_mean 取可用日;无 log;无前视。
  variants:
  - cross_mean(sigmoid(sigmoid(pow_2(sigmoid(day_durbin_watson(Ret))))), 120)
  - cross_mean(sigmoid(sigmoid(pow_2(sigmoid(day_durbin_watson(Ret))))), 241)
  - cross_mean(sigmoid(sigmoid(pow_2(sigmoid(day_durbin_watson(Ret))))), 482)
