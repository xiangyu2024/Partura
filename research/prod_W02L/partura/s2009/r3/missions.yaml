- type: N
  hypothesis: |-
    机制。A 股一天的收益分成两段:隔夜(上一交易日收盘 → 今天第一笔 Open,由开盘集合竞价定价)与日内(Open → Close,连续竞价)。两段由不同的参与者定价:隔夜 = 盘后消息与集合竞价委托(机构、被注意力吸引的散户在开盘集中下单),日内 = 盘中交易者。文献读法:Lou–Polk–Skouras(2019)发现动量收益主要来自隔夜段、日内段是反转,而且个股的隔夜收益与日内收益各自在年度尺度上持续(tug of war);Berkman 等(2012)显示注意力高的股票开盘价被推高、日内回吐;Aboody 等(2018)把个股隔夜收益读成个股层面的投资者情绪代理;French–Roll(1986)用交易时段与非交易时段的方差比分离「私有信息通过交易进入价格」与「公开消息」。A 股散户是成交主力、T+1 当天买入不能卖出,这几种效应应该不弱于成熟市场。

    算子怎么实现。OV = sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1)(隔夜收益;价格是后复权,除权不会造出假缺口),ID = sub(div(day_last(Close), day_first(Open)), 1)(日内收益)。种子分五类:
    (i)慢的水平:cross_mean(OV, 241)、cross_mean(cs_winsor(OV − ID), 241)(截尾版,抗复牌极端缺口)、cross_mean(OV − ID, 241)、半衰期 120 日的 cross_ema、482 日 ts_mean、线性衰减 241 日;
    (ii)一致性:cross_mean(OV, 241) 除以自己的 241 日标准差(日度信噪比,分母加 1e-3 下限);
    (iii)缺口回补系数:cross_corr(OV, ID, 241)(负 = 缺口被日内回补,注意力推高后回吐;正 = 缺口被日内延续)、上一日日内与今天隔夜的相关 cross_corr(ts_delay(ID, 1), OV, 241)(隔夜是否反转前一日的日内走势)、mul(sign(OV), ID) 的 241 日均值(缺口方向上的日内收益)、cross_autocorr(OV, 241, 1)(隔夜收益的一阶自相关);
    (iv)方差拆分:cross_stddev(OV) / cross_stddev(ID)、mean|OV| / mean|ID|(French–Roll 的非交易时段对交易时段,无量纲,不是波动水平);
    (v)用涨跌停幅度作标尺:div(OV, LimitWidth) 把缺口换成「占当天允许涨跌幅的比例」(主板 10%、创业板 / 科创板 20%、ST 5% 的缺口可比),以及 cross_zscore(cross_mean(OV − ID, 20), 241)(最近一个月的 tug of war 相对自己一年常态)。方向由尺子自己选。

    为什么和库里已有的不同,以及它怎么从本流的现象来。本流前两轮所有 day_wmean(Ret, ·) 一族用的 Ret 是日内连续竞价段的分钟收益,不含隔夜缺口(day_first(Open) 与上一日收盘之间的那一段),隔夜这一半从没测过;而 C = day_wmean(Ret, Amt) − day_mean(Ret) 的 241 日均值是本种子第一个非负读数(+0.066,valid +0.399),说明日内路径这一半值得在一年尺度上继续,隔夜是最直接的补集。库里隔夜缺口出现很少:对 struct/members.csv 计数,同时含 day_first(Open) 与上一日收盘的表达式 17 条,多数是手写的 cs_rank 乘积 / abs 写法;窗口 ≥ 120 日的缺口均值、隔夜减日内、缺口回补相关、方差拆分在库里没有。库里最近的是 B091:cross_mean(缺口, 20)(老尺子净夏普 −1.13)、cross_stddev(缺口, 20)、一条 20 日的缺口 / 日内相关,用 cross_delay 写法(骨架键与本位的 ts_delay 写法不同,数值上是同一个缺口;不同的是本位全是 ≥ 120 日的慢聚合与「隔夜对日内」的组合);日内收益的 20 日均值在 B225,骨架相同的 241 日版会被 GP 拒绝,所以本位不放。20 日窗口的版本会被尺子里的 20 日反转吃掉,这里全部 ≥ 120 日(只有 cross_zscore 的内层 20 日均值是为了读变化量)。

    为什么样本外还会在。来源是投资者结构(散户 / 机构比例、关注度)的慢变属性,不是某一段行情的事。我对符号的预期是 OV − ID 为负(隔夜被注意力推高、日内回吐的股票之后表现差),但尺子会自己选方向,而且可能整体为零:隔夜 − 日内与市值、流动性、波动相关时,尺子去掉这些暴露后可能什么也不剩 —— 这正是这个位要测的。

    数学检查。(a)ts_delay(day_last(Close), 1) 是上一个交易日行的收盘价;若该行缺失(停牌 / 上市首日)则 OV 为 NaN,不是 0,cross_mean 等取可用日。若数据把停牌日价格用前值填充,则停牌日 OV = ID = 0,复牌日 OV 含整段停牌的跳空;这样的极端缺口只改变该股自己的秩,不会支配截面(5220 只股票,十分位 520 只);cs_winsor 的种子进一步截尾。(b)div 的分母:收盘价为正;比值种子的分母都加了下限(1e-3 / 1e-4):cross_stddev 在窗口只有一个有效日时返回 0,没有下限会在每只新股的第二个有效日输出 ±inf。(c)LimitWidth 为日频叶子(取值 0.05 / 0.1 / 0.2 / 0.3),不为 0,div(OV, LimitWidth) 无爆点。(d)cross_corr / cross_autocorr 在窗口内某一边是常数时为 NaN,不是 0。(e)无前视:day_first(Open) 是今天第一笔 Open(开盘时已知),day_last(Close) 是收盘价;因子在 t 日收盘后算出,t+1 交易;ts_delay 取的是过去一日。(f)所有窗口 ≤ 482 日,热身期按可用日取平均。(g)已知算子行为(ts_rank / cross_rank / in_rank_rolling 当天缺失返回 0):本位不使用这三个算子。
