- type: E
  core: sub(day_wmean(Ret, Amt), day_mean(Ret))
  hypothesis: |-
    机制。核心 C = sub(day_wmean(Ret, Amt), day_mean(Ret)) 是「按成交额加权的分钟收益」减「等权分钟收益」。恒等式:C = Σ_t (a_t/Σa − 1/T)(r_t − r̄),即日内分钟收益与分钟成交额的协方差除以平均成交额,读的是「价格是不是在钱多的分钟里动、往哪边动」(放量时的方向)。Amt 作权重天然带日内 U 形(开盘、尾盘权重大),所以 C 主要是开盘后半小时与尾盘的价格动作相对全天平均的偏离;方向由尺子自己选(sign 可正可负)。文献读法:Llorente 等(2002)把放量时价格延续的成交归为投机 / 信息性成交,放量时价格反转的归为对冲性成交;Chordia–Subrahmanyam(2004)的持续单边失衡也预测收益。在个股层面把它平均 241 日,读到的是「这只股票的参与者类型偏向」,是慢变的结构属性。

    证据(全部来自本流前两轮和定位输出,只用 train / valid)。本流第 2 轮 N 位 68 个已评分候选里最好的是 cross_mean(C, 241) = +0.066(train +0.066 / valid +0.399,半衰期 5),其后 cross_mean(cross_mean(C, 10), 241) +0.056,cross_mean(cross_mean(C, 241), 5) −0.036(valid +0.589)。共性表里含 C 的 15 个候选均分 −0.98、不含的 −2.42(均值差 +1.44,p < 0.001);含 cross_mean(C, 241) 的 5 个候选均值差 +1.55(p 0.005)。这是本种子迄今唯一接近 0.5 线的读数,而且被卡住的是 train(+0.07),不是 valid(+0.40 ~ +0.59)。第 2 轮相关度表里 cross_mean(C, 241) 对已知族 0.19、流动性 0.15、市值 0.19、20 日反转 0.05,对波动 0.39(C 的幅度随分钟收益的波动放大)。

    这个 E 位要回答「cross_mean(C, 241) 的慢读数为什么 train 只有 +0.07,换哪种处理能把它抬起来」。种子按四个假设分组,外围的算子集合与本流此前所有含 C 的候选(只有 cross_mean 一层 / 两层,及多减一个 day_mean 的变体)都不同:
    (1) 与控制的交互暴露混杂。尺子只去掉对控制排名的 1 / 2 / 3 次多项式暴露,去不掉「在某个控制的某个桶里才成立」的交互;C 对波动有 0.39 的相关。种子:每天先在控制的十分位桶内去均值(cs_bucket_demean;一个种子用 cs_bucket_zscore 再除以桶内标准差,一个种子用 cs_bucket_rank 取桶内百分位),桶取尺子里控制的原式 cross_mean(day_std(Ret), 20)、cross_mean(day_sum(Amt), 30)、cross_mean(day_std(Amt), 30)、LogFloatCap,以及先市值后已知族的两次去均值,最后再做 241 日均值。第 2 轮 R 的教训是把桶内去均值套在最终信号上,桶边界跳变让换手爆炸(−2.6 ~ −5.2);这里套在被 241 日均值平均的日度输入上,桶边界跳变被平均掉,最终信号仍是慢变量,没有这个成本。如果 C 的 valid +0.40 只是风格暴露,它在这里会掉下来,这是一个能证伪的检验。
    (2) 尺度与极端日。241 日算术均值被少数全市场大涨大跌日、个股涨跌停日支配,每天的截面离散度也随行情放缩。种子:每天截面稳健 z 分数(cs_robust_z)、每天 1% / 99% 截尾(cs_winsor)、除以当天分钟收益标准差得到无量纲的「量钟相关」(div(C, add(day_std(Ret), 0.00001)),|C| / σ ≤ sqrt(T − 1) ≈ 15.5,有界,见下)、截面秩的 482 日均值。
    (3) 记忆与时间尺度。慢是承重的:本流 R2 里 ts_max(DW(Close), d) 的 d = 20 → 40 → 80 为 −2.73 → −1.77 → −0.92;第 1 轮 N 位的种子是 cross_mean(·, 20),被 GP 自己再套一层 241 日均值之后才到 −0.03 ~ −0.05。种子换成不同的慢聚合:最近 20 日均值相对自己 241 日的 z 分数(cross_zscore,读变化量)、半衰期 240 日的 EMA、线性衰减 241 日、482 日 ts_mean。
    (4) 市场状态条件。cross_cov / cross_corr(C, cs_mean(day_sum(Ret)), 241):C 与全市场等权日内收益的 241 日协方差 / 相关,读「大盘下跌日里放量分钟的价格表现」(下跌日放量上涨 = 承接 / 知情买入),是 C 的条件版本而不是水平。

    为什么和库里已有的不同。day_wmean、cs_bucket_demean / cs_bucket_zscore / cs_bucket_rank、cs_robust_z、cs_winsor、cross_zscore、cross_ema 在两个库 5583 条表达式里出现 0 次(对 struct/members.csv 的表达式列计数);16 个种子的骨架我逐个对 members.csv 的 skeleton 列核对过,0 个在库里,GP 的骨架禁令不会拒绝它们。库里与 C 最近的是 B074 一族(前 20 / 50 分钟的成交量加权收益、20 日窗口),没有全天、没有减等权、没有一年尺度、没有桶内去均值后再平均。

    为什么样本外还会在。来源是参与者类型的慢变偏向,不依赖某一段行情;种子全部是 ≥ 240 日的聚合(除 cross_zscore 的内层 20 日均值),换手低,15 bp 成本不致命;桶内去均值版本去掉的是对四个控制的非线性暴露,所以留下的东西如果还有分数,就不是已知风格的换皮。风险:train 的 +0.07 也可能只是 C 在 2018 ~ 2020 年不工作(体制),这个位改变不了,只能告诉我是不是暴露造成的。

    数学检查。(a)day_wmean 的权重和为 0(整天无成交)得 NaN,不是 0;停牌日 NaN,cross_mean / ts_mean / cross_ema 取可用日,不填 0。(b)div(C, add(day_std(Ret), 0.00001)):C = Σ(w_t − 1/T)(r_t − r̄),由 Cauchy–Schwarz |C| ≤ sqrt(Σw² − 1/T) · sqrt(T) · σ_r ≤ sqrt(T − 1) σ_r,故 |C| / σ_r ≤ 约 15.5;分母已加 1e-5 下限,整天 Ret 全 0(涨跌停封板)时分子精确为 0,得 0 而不是 inf。(c)cs_robust_z 的分母是 1.4826 MAD + EPS,MAD = 0 需要截面一半以上的股票 C 取同一值,C 是连续量,只会在大面积停牌日出现,此时有效股票少,不是爆点。(d)cs_bucket_demean / cs_bucket_zscore 桶内少于 2 只股票得 NaN(cs_bucket_rank 的并列由全截面秩打破);桶内百分位有界 (0, 1];LogFloatCap 是日频叶子,存的是收盘时点已知的值,没有隐式 shift。(e)cross_cov / cross_corr 用的 cs_mean(day_sum(Ret)) 是当天全市场等权均值,只用 t 日收盘及以前的数据。(f)无前视:所有量只用 t 日收盘及以前的数据,t+1 交易;窗口最长 482 日,热身期窗口按可用日取平均,不是常数填充。(g)已知算子行为(ts_rank / cross_rank / in_rank_rolling 当天缺失返回 0):本位不使用这三个算子。
