    reasons: '创新度 4。核心 C = sub(day_wmean(Ret, Amt), day_mean(Ret)) 在 struct/members.csv 的 5583 条表达式里 day_wmean 出现 0 次(直接对 expression 列计数)。C 的恒等式成立:day_wmean 的权重取 |Amt| 并归一化,所以 C = cov_t(Ret, Amt) / mean_t(Amt),是归一化的分钟收益与成交额协方差,不是快照 head 或控制的换皮。corr_1.json 里核心对 9 个快照 head 的原始 |ρ| 最大 0.044、残差 0.064;对 5 个控制最大 0.146(rev)。16 个种子对 head 的原始 |ρ| 最大 0.50(种子 12,cross_decay_linear 241),多数与 ts_max(day_durbin_watson(Close), 80) 在 0.2 到 0.5 之间,是 241 日慢聚合把 DW 的水平部分带回来,不是 DW 的同一个东西;对控制最大 0.52(种子 10,rev,即 cross_zscore 的 20 日内层均值),其余 0.36 以下。合理度 4。逐个算子核对:cs_bucket_demean / cs_bucket_zscore / cs_bucket_rank 的第一参数是被中性化的 y、第二参数是桶变量(ops_ext.py 463 / 482 / 239),桶内不足 2 只为 NaN;cs_robust_z = (x - med) / (1.4826 MAD + 1e-9) 逐日;cs_winsor 逐日 1% / 99% 截尾;cross_zscore 的窗口含当日、因果;cross_ema 的半衰期 d 与 1 - 0.5^(1/d) 一致;cross_cov / cross_corr 走 rolling_pair_reduce;全部因果,无前视。数学检查:种子 3 的 |C| / (sd_r + 1e-5) 由 Cauchy-Schwarz 有界于约 sqrt(T-1) = 15.5,无爆点;秩变换后单点也不会支配截面。PI 笔记中需要更正、但不据此划种子的三处:(a) 检查 (d) 说 cross_corr 在常数窗口为 NaN,实际为 0(rolling_pair_reduce 的分子为 0、分母为 EPS,我用 torch 实测确认),只影响上市后前约 2 天的窗口(种子 15、16),量很小;(b) 共性表里 C 的富集 +1.44 与 day_mean(Ret) 的 +1.23 同源,但含 C 的 15 个候选均分 -0.98 仍优于其余含 day_mean 的候选(约 -1.5),C 自身有一点证据,主要来自 cross_mean(C, 241) 这一个 +0.066 读数;(c) 482 日窗口在训练段前约三分之一为展开窗口(若立方体从 2018-01-02 起算),种子 13、14 的读数要注意,但它不是「主要由热身期决定」,不构成 §4 的定义问题。如果它有 alpha,最可能来自放量分钟价格方向的慢均值(Llorente 等 2002 的放量延续 / 反转读法);若它只是控制暴露,桶内去均值的种子 4 至 9 应当在 train 上掉下来,这是一个可证伪的检验。通过判定:创新 4 ≥ 3、合理 4 ≥ 3、未划种子剩 16 ≥ 4;核心对五个控制的最大 |ρ| 0.146 < 0.8。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。库里的隔夜缺口原语只在 20 日窗口出现:B091 的 cross_mean(gap, 20)(写法是 cross_delay,数值上与 ts_delay 相同,已核对 dt_cross.py 的 cross_delay 定义),B225 的 cross_mean(ID, 20),B233 的日内收益 20 日标准差。241 日慢均值、OV 减 ID、缺口回补相关 cross_corr(OV, ID, 241)、LimitWidth 标尺、cross_zscore 的缺口版在库里为 0 次(LimitWidth、cross_zscore 计数为 0,cross_autocorr 只有 Ret 与 Close 两条)。同时含 day_first(Open) 与上一日收盘 delay 的表达式计数为 17,与 PI 笔记一致。种子对快照 head 的原始 |ρ| 最大 0.325(种子 6,OV 减 ID 的 cross_decay_linear 版),多数与 ts_max(day_durbin_watson(Close), 80) 相关在 0.2 到 0.3;对控制最大:rev 0.512(种子 13,cross_zscore 的 20 日内层,与 20 日反转相关),vol 0.331(种子 6),liq 0.258(种子 6),均未到 0.8。种子 1 cross_mean(OV, 241) 与 B091 的差别只是窗口 20 到 241,属于同一原语的慢版本,但它与 B091 不是同一个 head 或控制,不压到 3。合理度 4。逐个核对:OV = day_first(Open) / ts_delay(day_last(Close), 1) - 1、ID = day_last(Close) / day_first(Open) - 1,用的都是 t 日收盘前已知的量,无前视;ts_delay 首行为 NaN;各比值的分母都加了下限;cross_stddev 对只有一个有效日的窗口返回 0,cross_mean 对全 NaN 窗口为 NaN(实测)。引擎会把不可交易格设为 NaN(engine.py 252 等),所以下面的退化值只出现在可交易的上市初期,不进入其余截面。需要 PI 更正、但不据此划种子的三处:(a) LimitWidth 的取值不是 0.05 / 0.1 / 0.2 / 0.3。tradability.py 的 board_limit 只有 0.10(主板,以及注册制前的创业板)、0.20(科创板,以及注册制后的创业板)、0.30(北交所);立方体里没有 ST 标记,所以 ST 股记为 10% 而不是 5%,「ST 5% 的缺口可比」这一句不成立(ST 占比小,影响有限)。LimitWidth 不为 0,所以 div(OV, LimitWidth) 没有爆点。(b) 检查 (d) 说 cross_corr 与 cross_autocorr 在常数窗口为 NaN,实际为 0;窗口内只有一对有效值时输出 0,两对时输出恰为 ±1,只在上市后约前 3 天出现,每天截面上只有个位数的股票,不构成 §4 的爆点,但 PI 应知道。(c) 种子 7、10 的分母下限 1e-3 是绝对量,对日内标准差不到 0.1% 的票(一字板多的票)会截断比值,秩变换后这是低波动暴露而非伪影。如果它有 alpha,最可能来自隔夜与日内两段的拉锯:注意力推高的股票隔夜被推高、日内回吐(缺口回补系数 cross_corr(OV, ID, 241) 与 OV 减 ID 的慢均值),而不是 OV 的水平(水平 cross_mean(OV, 241) 对市值的 |ρ| 为 0.18,水平是市值与波动的代理)。通过判定:创新 4 ≥ 3、合理 4 ≥ 3、未划种子剩 16 ≥ 4;对五个控制的最大 |ρ| 0.512 < 0.8。'
R:
  - head: 'ts_max(day_durbin_watson(Close), 80)'
    soundness: 4
    reasons: '合理度 4。DW(Close) = Σ(ΔC)² / (ΣC² + 1e-8) 是量纲一的量,近似每分钟收益平方的均值(已实现方差),已核对 dt_day.py:273 的实现;单日价格方差低于 1e-8 时返回 NaN(不是 0),分母不近零。cs_rank 逐日截面秩在 (0, 1];ts_max / ts_mean / ts_quantile_q75 沿日轴、因果;无 log 折叠,无前视。变体 1 的 cs_rank 去掉了全市场共同的冲击日,机制清楚(市场级波动日让所有股票同时取到窗口最大值)。与原 head 的 |ρ|:变体 1 为 0.95(替换候选),变体 2 为 0.69,变体 3 至 7 在 0.53 到 0.93 之间;与已知族的 |ρ| 全部在 0.31 以下,满足 R 规则的 0.5 条件。如果它有 alpha,最可能是个股极端波动日的集中(特质波动),而不是市场共同冲击。'
  - head: 'cross_mean(mul(ts_regres(day_mean(High), day_close(Amt), 50), sigmoid(day_durbin_watson(Low))), 241)'
    soundness: 3
    reasons: '合理度 3(不是 1:没有 §4 所列的数学问题,但机制段与算子组合不符)。PI 的 why 把 ts_regres 写成了「价格水平残差」,方向写反了:ts_regres(x, y, d) 返回的是 y 对 x 的 d 日滚动 OLS 残差(common.py 643 的 rolling_ols 返回 y 减 (α + β·x) 的 resid),我用 torch 实测确认(ts_regres(x, y) 的残差 sd 为 1.04,ts_regres(y, x) 为 0.47,与理论值 1.0 / 0.45 一致)。所以这一组实际是 day_close(Amt) 对 day_mean(High) 的残差;day_close 是 day_last 的别名(dt_day.py 145),即收盘那一根分钟的成交额,而不是价格。残差的单位是金额,乘 DW(Low) 之后,截面大小随股票的分钟成交额规模变化,排序里混进了成交额规模信息;PI 的「价格水平残差 × DW」机制不成立。sigmoid 量化的论述是对的(我实测:float32 下 DW(Low) 在 1e-6 到 1e-5 之间只有 39 个不同的 sigmoid 值),去掉 sigmoid 后乘子就是 DW 本身,这一点说得通。若想要的是价格对成交额的残差,应写 ts_regres(day_close(Amt), day_mean(High), 50)。变体 1 至 5 都继承了这个方向问题;数学上仍然合法(有限,无近零分母,无前视),只是 why 段要改写。如果它有 alpha,最可能来自收盘分钟成交额的异常与 DW(Low) 日内波动的乘积,而不是价格水平。'
  - head: 'cross_mean(sigmoid(sigmoid(pow_2(sigmoid(day_durbin_watson(Ret))))), 3)'
    soundness: 4
    reasons: '合理度 4。DW(Ret) 对分钟收益的一阶自相关敏感,取值在 [0, 4](上界来自 Σ(a - b)² ≤ 2Σa² + 2Σb²);sigmoid / pow_2 栈把它变成 DW 的单调变换,在 DW ∈ [0, 4] 上只占 0.637 到 0.673 的区间,在 [1, 3] 上为 0.653 到 0.671(我实测),远大于 float32 刻度,无量化问题。所以唯一有效的改动是 cross_mean 的窗口,三个变体只改窗口(120 / 241 / 482),是单因素消融,设计合理。机制(DW 高表示买卖价差反弹,即流动性差)说得通。无 log,无近零分母,无前视。注意:482 日窗口在训练段前约三分之一为展开窗口(若立方体从 2018-01-02 起算),如果 482 版比 241 版好,要区分是慢的收益还是热身期的平均效应。'
summary: '两个任务位都通过(创新 4、合理 4,未划种子,剩余 16 个,E 核心对五个控制的最大 |ρ| 为 0.146);R 组 1 合理度 4、组 2 合理度 3(机制段把 ts_regres 的残差方向写反了)、组 3 合理度 4;没有任何项达到数学问题的 1 分;PI 需要更正 ts_regres 方向、cross_corr 退化窗口返回 0 而非 NaN、LimitWidth 取值与 ST 标记、以及 482 日窗口的热身期四处。'
