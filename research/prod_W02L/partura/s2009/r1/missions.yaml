slots:
  - type: E
    core: 'log(log(day_durbin_watson(Volume)))'
    hypothesis: |-
      机制:三个 head 都是同一个核心 C0 = log(log(day_durbin_watson(Volume))) 的平滑(ts_sum 5 / 10、cross_fangzheng 10),窗口 5 / 10 / 20 的分数几乎相同(−2.27 / −2.23 / −2.2 一带),说明承重的不是平滑,而是 C0 的「水平」,也就是一只股票长期习惯的成交节奏。day_durbin_watson 的定义是 Σ(ΔV)² / ΣV²(不去均值),等于 2(1 − r1),r1 是未中心化的一阶自相关;在近似独立的情形下它约等于 2·CV²/(1+CV²),CV 是当日分钟成交量的变异系数。所以它读的是「当天成交有多成团 / 多不连续」。这个水平和已知成交额离散度一族相关(拆解表里 C0 与已知族的 rho 是 −0.52),它反映的是持久的个股属性(参与者构成、流动性、板块),奖励尺子本来就会把这部分吃掉。尺子没有吃掉的是它的「变化」:同一只股票当前的成交节奏相对自己过去 60 日的常态是否异常成团。这对应参与者构成的短期切换:追涨杀跌的散户脉冲取代了算法拆单的平滑成交(或相反)。构成切换留下的价格压力要在几天到几周内慢慢回吐,这个机制是行为 / 微观结构性的,不依赖某段行情。
      算子怎样实现:每个种子都原样带着 C0,外围只做「去掉水平」或「把它和别的量对齐」:(1) cross_zscore / cross_madz(C0, 60) 与快 EMA 减慢 EMA、C0 减自己 60 日均值、10 日均值减 120 日均值、cross_delta:变化量。(2) cross_regres(C0, day_sum(Ret) 或 abs_(day_sum(Ret)), 60):对当日收益回归后的残差,也就是价格动作解释不了的成团;cross_corr(C0, day_sum(Ret) 或其滞后一天, 40):成团是否发生在上涨日 / 追涨之后。(3) mul(cross_zscore(C0,60), sign(20 日累计收益)):成团异常与趋势方向的交互。(4) cs_bucket_demean / cs_bucket_zscore 按市值或价格十分位去均值:消掉最小变动价位和整手交易造成的机械差异,这一版与不去桶的版本对照,本身就检验「真来源 vs 规模 / 价格代理」。
      为什么和已有的不同:库里与这个核心有关的写法全是对 C0 做 ts_sum / cross_fangzheng / 嵌套求和,都是「水平」;没有一个库表达式做过日轴 z 分数、残差、与收益的滚动相关或桶内去均值,这些写法的骨架全部不在两个库里(已逐个对照 members.csv 的骨架集)。因为它们去掉了持久水平,与三个 head 的日度秩相关预计远低于 0.7,与已知成交额族也预计低于 0.5。
      为什么样本外还会在:信号的来源是「相对自己常态的节奏切换」,每只股票用自己做对照,不依赖截面水平;构成切换到价格压力回吐是慢过程,名次在数日内保持,15 bp 成本下不至于被换手吃掉;为留住持续性,窗口都在 20 到 120 日。
      数学检查:C0 在 DW ≤ 1(取 log 后为负再取对数)与当天无成交时是 NaN,这是已知的、窄的缺失(拆解表里覆盖率 0.9995),不是热身期填充决定的。C0 的左尾被 log(log) 拉长但是有限:DW 取 1.01 时约 −4.6,取 2 时约 −0.37,不是奇点,所以不会有除以近零的爆点;依然担心左尾时用 cross_madz、cs_winsor、EMA 这类稳健写法。cross_zscore 分母是近 60 日标准差加 EPS,只有整段时间 C0 一动不动(停牌)才会放大,那时 C0 本身是 NaN。无前视:只用 t 日收盘及以前的数据,t+1 才交易。所有窗口 ≤ 120 日,热身期不主导。
