R:
  - head: 'ts_sum(log(log(day_durbin_watson(Volume))), 10)'
    why: |-
      烂的部件是「和已知成交额离散度一族共享的持久水平」:拆解表里核心 log(log(day_durbin_watson(Volume))) 与已知族的 rho 是 −0.52,加上 ts_sum 5 / 10 / 20 后是 −0.63 / −0.63 / −0.73,窗口 5 / 10 / 20 的分数几乎相同,说明平滑不承重、水平才承重,而水平正是新尺子要吃掉的。变体的做法:(1) 在已知族自己(cross_mean(day_std(Amt), 30))、市值、成交额水平的十分位内去均值,保留桶内的成团差异;(2) 换掉被日内 U 形污染的底:除以自己 20 日同分钟均量、开方稳定方差、先做 3 分钟均值去掉分钟级噪声;(3) 把对左尾敏感的 ts_sum 换成中位数 ts_med。数学上都有界,没有近零的分母(逐分钟标准化的分母为 0 时分子也为 0,得 NaN)。
    variants:
      - 'cs_bucket_demean(ts_sum(log(log(day_durbin_watson(Volume))), 10), cross_mean(day_std(Amt), 30))'
      - 'cs_bucket_demean(ts_sum(log(log(day_durbin_watson(Volume))), 10), LogFloatCap)'
      - 'cs_bucket_demean(ts_sum(log(log(day_durbin_watson(Volume))), 10), cross_mean(day_sum(Amt), 20))'
      - 'ts_sum(log(log(day_durbin_watson(div(Volume, cross_mean(Volume, 20))))), 10)'
      - 'ts_sum(log(log(day_durbin_watson(sqrt(Volume)))), 10)'
      - 'ts_sum(log(log(day_durbin_watson(in_mean_rolling(Volume, 3)))), 10)'
      - 'ts_med(log(log(day_durbin_watson(Volume))), 10)'
  - head: 'ts_sum(log(log(day_durbin_watson(Volume))), 5)'
    why: |-
      同一个烂部件:水平与已知族共享。窗口 2 / 5 / 10 / 20 的分数几乎相同,所以不再缩短窗口,而是在已知族十分位内去均值,并把窗口拉到 40(慢变结构属性,换手更低)。
    variants:
      - 'cs_bucket_demean(ts_sum(log(log(day_durbin_watson(Volume))), 5), cross_mean(day_std(Amt), 30))'
      - 'cs_bucket_demean(ts_sum(log(log(day_durbin_watson(Volume))), 40), cross_mean(day_std(Amt), 30))'
  - head: 'cross_fangzheng(log(log(day_durbin_watson(Volume))), 10)'
    why: |-
      拆解表里窗口 10 → 20 把分数从 −2.35 提到 −2.03,但这个变体的 rho_known 是 −0.74,所以没进 R 候选(与已知族 |rho| ≥ 0.5);所以保持 20 日窗口,同时去掉已知族 / 市值桶内的均值,并换成逐分钟标准化的底。cross_fangzheng 是日轴均值加标准差,都有界,没有近零的分母。
    variants:
      - 'cs_bucket_demean(cross_fangzheng(log(log(day_durbin_watson(Volume))), 20), cross_mean(day_std(Amt), 30))'
      - 'cs_bucket_demean(cross_fangzheng(log(log(day_durbin_watson(Volume))), 10), cross_mean(day_std(Amt), 30))'
      - 'cross_fangzheng(log(log(day_durbin_watson(div(Volume, cross_mean(Volume, 20))))), 20)'
      - 'cs_bucket_demean(cross_fangzheng(log(log(day_durbin_watson(Volume))), 10), LogFloatCap)'
