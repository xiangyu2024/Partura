  - type: N
    hypothesis: |-
      机制:成交量路径怎样「成团」,揭示谁在交易。批里的现象是:day_durbin_watson 作用在 Volume 上比作用在 Vwap 上好(含 / 不含均值差 +0.93,p 0.04),Volume 换成 Amt 三个 head 的分数几乎不变(−2.25 / −2.25 / −2.31),窗口长短不重要。也就是说起作用的是「成交强度路径的形状」,不是股数、也不是价格。但原始分钟成交量路径被一条对所有股票都相同的日内 U 形(集合竞价、开盘半小时、尾盘放量)支配:day_durbin_watson 的分子分母都主要由这条确定性曲线决定,个股特有的成团被糊在里面。新想法:先把每个分钟除以这只股票自己过去 20 日同一分钟的平均成交量,div(Volume, cross_mean(Volume, 20))(cross_mean 作用在分钟级的日 × 分钟面板上,沿日轴滚动,所以得到的是每个分钟自己的 20 日均量;库里有 17 条用到 cross_mean(Volume, 20),全部只是「放量分钟」的阈值(Volume 大于 20 日均量加减标准差)做二值掩码,没有一条用它连续地标准化整条路径),得到「异常成交量路径」AV:均值约为 1,去掉了 U 形与竞价尖峰,且因为当天也在均值里,AV 有上界 20,不会爆点。再读 AV 的结构:(a) 粗糙度 day_durbin_watson(AV),比原始版本干净;(b) 持续性 day_autocorr(AV, 1 或 5):知情或机构的母单被拆成很多子单,异常成交会持续多个分钟,散户的噪声交易则是孤立的脉冲(Lillo & Farmer 的订单流长记忆、Kyle & Obizhaeva 的母单假设);(c) 方向:day_signed_ratio(Ret, AV)、day_wmean(Ret, AV)是「成交量异常的那些分钟里价格往哪边走」,把方向和持续性相乘 mul(净买入方向, 持续性)就是母单买入的脚印(Llorente et al. 2002:投机性成交伴随收益延续,对冲性成交伴随反转);(d) 形状:day_skew、day_gini 读异常量集中在少数几分钟的程度;(e) 多尺度:day_durbin_watson(in_mean_rolling(AV, 5)) 与 1 分钟版本的差 / 比,是「成团中有多少发生在 5 分钟以上的慢时间尺度」,慢尺度成团是母单、快尺度成团是噪声;(f) 带符号的 DW:day_durbin_watson(mul(sign(Ret), AV)) 度量带符号订单流的粗糙度,越光滑越像持续的单边买卖。
      为什么和已有的不同:库里 day_durbin_watson 的输入只有原始场(Volume / Amt / Vwap / Close 等)、Ret 的切片或整天除以总量的份额(后者仍保留 U 形),没有一个在日轴上对分钟面板做逐分钟标准化;以 AV 为底的 autocorr、signed_ratio、wmean、gini、skew、多尺度 DW、带符号 DW 的骨架,逐个对照 members.csv,都不在两个库里。和五个控制比:AV 是无量纲比值,波动 / 成交额水平 / 市值被除掉了;和已知成交额离散度一族比:它读的是「相对自己常态」而不是「日内成交额的绝对离散」。
      为什么样本外还会在:来源是参与者类型(机构拆单 vs 散户脉冲)在分钟级成交路径上留下的指纹,是慢变的结构属性;所有种子都用 cross_mean(·, 20 到 40) 聚合,名次持续,15 bp 成本下留得下来;方向 × 持续性的版本是母单买入后价格逐步消化的漂移,不依赖某段行情。风险:方向种子与 20 日反转可能相关,尺子对反转的线性、U 形、S 形暴露都会剔除。
      数学检查:AV 的分母是含当天的 20 日同分钟均值,为 0 只在 20 日同一分钟都无成交时,此时当天该分钟也为 0,得到 NaN 而不是无穷;AV ≤ 20。day_durbin_watson 在 [0, 4] 内有界,day_autocorr、day_signed_ratio、day_corr 有界,没有除以近零的爆点;day_skew 与 day_gini 在整天无量时给 NaN。无前视:cross_mean 的窗口含当天收盘及以前,t+1 才交易。热身期只有前 19 个交易日,其余窗口 ≤ 60。
    inspired_by: 'B025 批:DW(Volume) 优于 DW(Vwap)、Volume 与 Amt 互换不变、窗口无关、已知成交额族的 rho −0.52;日内 U 形污染 DW 的读数。'
