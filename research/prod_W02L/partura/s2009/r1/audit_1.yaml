slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [7, 8]
    reasons: '创新度 3。核心 log(log(day_durbin_watson(Volume))) 已在库中:members.csv 里含它的表达式有 5 条,其中 cross_fangzheng(核心,10) 原式在库中,三个快照 head 也都是库表达式。所以 E 位的新意只能在外围的去水平变换上。相关度表(corr_1.md)显示外围种子对 head 的原始 |ρ| 为 0.07–0.65,对 5 个控制取残差后多在 0.04–0.19(种子 3 为 0.26),这是真正的新形状,不给 1。但种子 15(cross_stddev)残差 |ρ| 为 0.561、与 liq 0.466 / known 0.437 相关,是 head 的部分重述;核心自身对 ts_sum5 的残差 |ρ| 为 0.963,即核心几乎就是 head 的输入。综合给 3。合理度 3。这不是 §4 的数学问题,但 PI 的数学检查有实质错误,需要 PI 知道:(1) common.py:211 的 log 实现为 log|x|(|x|≤EPS=1e-9 时为 NaN),所以 C0=log|log DW|,对 DW 不是单调的:DW 与 1/DW 给出相同的 C0,DW=1 处下探到约 −20.7 后变 NaN。PI 写的「DW≤1 为 NaN」「取单调变换排名不变」都不对。(2) PI 用「很窄的缺失模式」解释单层与双层 log 相差 1.9 分,但 loc.json 消融中 log(DW) 与 log(log(DW)) 的覆盖率都是 0.9995,缺失模式解释不了这个差距;差距来自折叠(−4.21 对 −2.32)。所以「成团水平」的机制只在 DW>1 一侧成立。(3) 算术型种子(种子 3–5、9–10、12–15 的 EMA、求和、相关、回归、标准差)在 DW≈1 附近的深谷上会被单日支配,PI 没有量过这个尾部的频率,审计员没有数据可核,故不以此判 1。(4) 种子 12、13 的机制写成「C0 对收益的残差」,但 cross_regres(x,y,d) 调用的是 rolling_ols(x,y) 的残差,即收益对 C0 的残差(dt_cross.py:309、common.py:643)。算出来的是合法的、与所有 head 和控制都不相关的量(原始 |ρ| 0.066 / 0.072,残差 0.105 / 0.184)。规则只允许因数学问题或重复划种子,所以不划,但机制描述必须改。划掉 7、8:原始 |ρ| 对 ts_sum10 分别为 0.862、0.858(≥0.7),按规则自动划掉。骨架按库规则复现后,16 个种子的骨架在库中均为 0 命中,不会被库禁令拒绝。若它有 alpha,最可能来自 C0 相对个股自身 60 日常态的偏离(即 |log DW| 的节奏切换),尤其是种子 3(快慢 EMA 差)与种子 9(10 日均值减 120 日均值),而不是 PI 所写的成团水平的单调变化。通过判定:创新 3≥3、合理 3≥3、划完剩 14≥4、核心对五个控制的最大 |ρ| 为 0.518<0.8。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [1, 2, 3, 4, 11, 13]
    reasons: '创新度 4。AV=div(Volume,cross_mean(Volume,20))(逐分钟除以自身 20 日同分钟均量)在库的 5583 条表达式里零次出现;day_signed_ratio、day_wmean、day_gini 在库里也零次出现(字符串检索)。存活种子 5–10、12、14–16 对快照 head 的原始 |ρ| 为 0.04–0.51,对控制的最大 |ρ| 为 0.58(种子 6 对 20 日反转 0.577,种子 8 为 0.545)。这些中度相关属于尺子会剥掉的部分,不是换皮;对 5 个控制取残差后对 head 的 |ρ| 为 0.03–0.31,是真正的新形状。扣 1 分的依据是 PI 的预言被数据否定:AV 版 DW(种子 1、2、13)与流动性的 |ρ| 为 0.88–0.90,AV 版 autocorr(种子 3、4)为 0.75–0.78,R1 变体 4(AV 版 ts_sum)为 0.70,R3 变体 3(AV 版 cross_fangzheng)为 0.765,已知族 0.76–0.85。所以「AV 去掉了流动性与成交额水平」不成立。另外,种子 3(day_autocorr(AV,1))与种子 1 同源:DW≈2v(1−r1_c)/(μ²+v)且 μ≈1,两者只差一个与离散度 v 有关的因子,按重复处理(它本来也因原始 |ρ| 0.743 被自动划掉)。合理度 4。机制清楚(拆单母单的持续性加方向×持续性,Llorente et al. 2002;Lillo & Farmer 2004),算子逐个核对:in_delay(Ret,1) 是后移一分钟(dt_in.py:266,result[:,d:]=x[:,:T-d]),无前视;in_mean_rolling 为因果窗口(rolling_windows 左填 NaN);cross_mean 沿日轴因果(dt_cross.py:223);日级聚合在收盘后用于次日交易;AV 的分母含当日,只在 20 日同分钟全为 0 时出现 0/0=NaN,AV≤20 成立;DW 与 autocorr 有界;没有 log 折叠;种子 14 的分子分母同尺度缩放,比值实际有界。需要 PI 注意的非 §4 问题:sign(Ret) 与 day_signed_ratio 中的 Ret=0 分钟是真实零值而非缺失,会把零收益分钟占比(最小变动价位效应)混进种子 5、9、16,解读时应注明。划掉 1、2、3、4、11、13:原始 |ρ| 为 0.777、0.726、0.743、0.724、0.704、0.779(≥0.7),且种子 1、2、11、13 对流动性的 |ρ| 为 0.88–0.90(≥0.8),按规则自动划掉。若它有 alpha,最可能来自 AV 的方向×持续性(种子 5、6、8、9:大额母单买入后价格逐步消化,是参与者类型在分钟成交路径上的指纹),其次来自 AV 偏度(种子 10)与 DW(AV) 相对自身 60 日的偏离(种子 12),而不是 DW(AV) 的水平(水平只是流动性)。通过判定:创新 4≥3、合理 4≥3、划完剩 10≥4。本位是 N 位,满足「3 轮里至少 1 个 N 通过审计」的要求。'
