R:
- head: ts_max(day_durbin_watson(Close), 40)
  why: >-
    烂部件是窗口(记忆长度),不是 DW(Close) 本身。依据:loc.md 的拆解表里,单日 day_durbin_watson(Close) 只有 −4.03(换手高、成本吃掉),套 ts_max 后窗口 20 → 40 → 80 为 −2.73 → −1.77 → −0.92
    (80 日版 train −0.45 / valid −0.92),30 → 60 为 −2.11 → −1.19,15 → 30 为 −3.64 → −2.11:每翻一倍约好 0.9,单调,没有走平的迹象。DW(Close) = Σ(ΔC)² / (ΣC² + 1e-8) 是每分钟已实现方差的
    近似(价格不去均值时 ≈ 分钟收益平方的均值),取窗口内的最大值是「近一段时间里最极端的一天的方差」,换手由新最大值进入与旧最大值退出决定,窗口越长越稳。
    上一轮的教训是:换掉水平的写法(桶内去均值)会因为桶边界跳变增加换手,反而更差(−2.6 ~ −5.2),所以这一组只动窗口与价格字段,不动结构。
    这一组把窗口拉到 100 / 120 / 160 / 200 / 241 并保留 80 做锚点,Close 换成 Vwap(拆解表里 Close → Vwap 在 20 / 30 / 40 日窗口分数差在 ±0.5 以内)在 120 与 241 日各测一次,
    目的是找到这条单调线的拐点,看长窗口是否仍有 alpha、还是只是在省成本。数学上:DW ∈ [0, 4],ts_max 有界;分母是价格平方和,不会近零;单个错误报价最多贡献 (Δ)² / ΣC²,
    不会爆点;没有 log 折叠;无前视;窗口最长 241 日,热身期取可用日。
