- head: ts_sum(log(log(day_durbin_watson(Volume))), 10)
  why: >-
    烂部件是「水平」:它与已知成交额离散度一族共享持久的个股属性(上一轮相关度表里 ρ_known −0.63),窗口 5 / 10 / 20 分数几乎相同,说明承重的不是平滑。上一轮 R 把水平换成桶内去均值是错的
    (−2.8 ~ −5.2,桶边界造成换手)。第 1 轮 E 位给出了更好的替代:把水平换成「慢均值的变化」。cross_stddev(log(cross_mean(C0, 120)), 60) 为 −0.69(train −0.69 / valid −0.37),
    再套一层 cross_stddev(·, 60) 为 −0.82(valid +0.34),C0 = log(log(DW(Volume))),比原 head 的 −2.23 好 1.5 分以上,且在 120 日均值之上取 60 日标准差,持久水平基本被拿掉了(平均值的 60 日内变化
    读的是成团程度的体制切换)。这一组直接把这三个写法作为原 head 的变体评估(最后一个去掉外层 log,看 log|·| 折叠是否承重)。数学上:log 的实现是 log|x|,所以 C0 对 DW 在 DW = 1 处折叠(上一轮审计员已指出),
    cross_mean(C0, 120) 对折叠点附近的单日值是平均,不是单日支配;cross_stddev 对缺失日按有限日处理;窗口 ≤ 120 + 60 日;无前视。
