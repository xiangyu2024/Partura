- type: N
  hypothesis: >-
    机制:一只股票「按成交额加权的分钟收益」day_wmean(Ret, Amt) 在一年尺度上的稳定偏向,以及它与等权收益之差、与方向性资金流、与日内时段的结构。读的是「钱在这只股票上实际赚到(或亏掉)的
    分钟收益」:钱多的分钟(开盘后半小时、尾盘)权重大,死分钟权重小。它不是日收益(day_sum(Ret) 对每分钟等权;第 1 分钟是集合竞价,Ret 恒为 0,所以也不含隔夜跳空),
    而是日内连续竞价段里「放量时价格往哪边走」的累计。

    批里与本流上一轮的现象(两条合起来才是这个想法):(1) 本流第 1 轮 N 位(Pr1b)88 个已评分候选里最接近及格线的是 cross_mean(cross_mean(day_wmean(Ret, add(Amt, Amt)), 20), 241)
    一族:−0.047(train −0.047 / valid +0.202)和 −0.025(train −0.025 / valid +0.229),半衰期 0,是本流迄今最好的读数(DW 水平一族 −1.8 ~ −2.7,E 位最好 −0.69);
    同一外围换成相对自己 20 日同分钟均额的 AV 权重后降到 −0.38,窗口只有 20 日的版本与 20 日反转 |ρ| 0.58。(2) B026 的拆解表里 ts_max(day_durbin_watson(Close)) 的窗口 20 → 40 → 80 给出
    −2.73 → −1.77 → −0.92,同样是「越慢越好」。结论:新尺子对 15 bp 成本很苛刻,这一族可以站住的是慢(≥ 120 日)、不靠半衰期平滑、换手低的状态量。上一轮这个想法是在 20 日窗口下提出的
    (种子全是 cross_mean(·, 20)),GP 自己把它拉到 241 才出现 −0.03;这一轮把「慢」写进种子,并把这个读数拆开,看它的承重部分到底是什么。

    拆成五个问题,每个对应一类种子(算子怎样实现):
    (a) 是不是「钱加权」本身:day_wmean(Ret, Amt) 减等权 day_mean(Ret) = cov_t(Ret, Amt) / mean(Amt),价格是否在放量的时候动(信息性放量延续、对冲性放量反转,Llorente 等 2002;
    Gervais 等 2001 的高成交溢价);慢聚合用 cross_mean 241 或 cross_ema 半衰期 120,权重分别用 Amt 与 Volume。day_topw_mean(Ret, Amt) 减 day_mean(Ret) 是只看成交最重的 10% 分钟的事件版。
    (b) 是不是「一年的趋势」:241 日均值减 21 日均值(跳过最近一个月,避开新尺子已去掉的 20 日反转),与 241 日均值除以 241 日标准差(漂移的质量,类似 Da-Gurun-Warachka 2014 的连续信息:
    一年里许多个小步骤累积出来的漂移会延续,少数大跳累积出来的会回吐),与 cross_mean(sign(·), 241)(正日占比)、ts_mean(cs_rank(·), 241)(每天截面排名的 241 日均值,对极端日稳健)。
    (c) 是不是「谁在买」:day_signed_ratio(Ret, Amt) 是上涨分钟的成交额占比减下跌分钟的占比,净买入压力的无 tick 数据代理;慢聚合(241 日均值、半衰期 120 的 EMA、241 减 21)读的是持续的单边资金流
    (Chordia-Subrahmanyam 2004:持续的单边失衡预测之后的收益)。零收益分钟是真实的零(最小变动价位),只进分母,所以信号里混着「零收益分钟占比」的成分,解读时要记得。
    (d) 是不是「某个时段」:用 in_slice 把 Ret 和 Amt 取同一段(in_slice 的右端点含在内;第 0 根是集合竞价,第 1~120 根上午,第 121~240 根下午),在开盘后 30 分钟(1~30)、尾盘 30 分钟
    (211~240)分别做成交额加权收益,再做「下午减上午」;另外 cross_mean(day_last(Ret), 241) 只看最后一根(尾盘集合竞价跳动)。Heston-Korajczyk-Sadka(2010)发现某个半小时的收益会在之后多日的同一时段重现,
    Lou-Polk-Skouras(2019)发现个股的日内收益与隔夜收益各自持续;这一类种子问的是上一轮 −0.03 的承重部分是不是开收盘那几根的权重(原始 Amt 权重在开收盘最大,AV 权重把它们去掉了,这可能
    解释了为什么原始权重 −0.03 比 AV 权重 −0.38 好,是假设,不是结论)。
    (e) 先后顺序:day_wmean(Ret, in_delay(Amt, 1)) 用前一分钟的成交额当权重,读的是「放量之后的下一分钟价格往哪边走」(量先价后,权重只含更早的分钟,不前视)。

    为什么和已有的不同:库的 5583 条里 day_wmean、day_signed_ratio、day_topw_mean、cross_ema 一次都没出现;最近的是 B074(前 20 / 50 分钟的成交量加权收益 div(day_sum(mul(in_slice(Ret, 1, 20), ...)), ...),
    窗口 20 日,净夏普 −1.4 / −0.7,控制之前),它只有开盘前几十分钟、只有 20 日、没有「减等权」「241 减 21」「尾盘 / 下午减上午」「正日占比」「日度信噪比」这些结构。
    和五个控制比:这些量对价格水平、成交额水平、市值是无量纲的(收益与占比),对波动是除以过或减掉了,对 20 日反转是 120~241 日窗口与跳月处理;种子的 ρ 以相关度表为准,我的预期是对控制都 < 0.5。

    为什么样本外还会在:来源是参与者类型与资金流方向这两件慢变的事(谁在放量时买、哪个时段的订单带信息),一年窗口把它们变成近似常数的个股属性,换手极低,15 bp 的成本摊下来很薄;
    而且每个种子都是一只股票自己对自己的比较(加权减等权、下午减上午、241 减 21),大盘涨跌与持久的水平被同一天的差抵消。风险:(1) 趋势类种子(b)与动量 / 反转有重叠,
    尺子只去 20 日反转的暴露,不去 1 年动量;(2) 开收盘那几根的权重大,读数可能主要来自开盘 / 尾盘集合竞价附近的价格动作而不是日内全天;时段种子就是为了把这一点分开。

    数学检查:day_wmean 的权重取绝对值,分母是权重和,和为 0 才是 NaN;Amt 的平方不在种子里,没有溢出;cross_stddev(·, 241) 在分母上只有整段 241 日日度值全相同(长期停牌)才为 0,
    那时分子也是 NaN;sign(0) = 0 是涨跌停封板日,不造成缺失;in_delay(Amt, 1) 的第一根为 NaN,day_wmean 忽略非有限权重;in_slice 在两个参数上取同一段,权重与收益逐分钟对齐。
    没有 log,没有除以近零的量(上一轮审计员指出的 log 取绝对值折叠与这里无关)。无前视:全部是 t 日收盘及以前的数据,t+1 交易;窗口 ≤ 241 日,热身期按可用日取平均(cross_mean 与 cross_ema 都忽略缺失)。
