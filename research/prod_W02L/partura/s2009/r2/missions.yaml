- type: E
  core: day_wmean(Ret, div(Amt, cross_mean(Amt, 20)))
  hypothesis: >-
    机制:核心 W = day_wmean(Ret, AV),AV = div(Amt, cross_mean(Amt, 20)) 是「相对自己 20 日同分钟常态的异常成交额」,W 是按 AV 加权的分钟收益,
    读的是「在这只股票今天异常活跃的那些分钟里,价格往哪边走」。因为 AV 把每个分钟除以自己 20 日同分钟均额,日内 U 形与开收盘竞价的固定大额被除掉了,W
    只剩个股自己的异常活跃分钟(消息 / 对冲 / 拆单的脚印)。恒等式:W = 等权分钟收益 + cov_t(Ret, AV)/mean(AV),也就是「等权的价格走势」加上
    「价格是否在异常放量的时候动」。后一项就是 Campbell-Grossman-Wang(1993)与 Llorente 等(2002)区分的两类成交:对冲性放量伴随反转,信息性 / 投机性放量伴随延续。
    把它们按一年慢慢累计,读到的是这只股票的参与者类型偏向(谁在异常放量时交易),这是慢变的结构属性。

    证据与要回答的问题:本流第 1 轮 N 位里含核心 W 的 4 个候选均分 −1.20,不含的 −2.51(均值差 +1.32,p 0.021),是共性表里均值差最大的子树(第二位是 log(cross_mean(C0, 120)) 的 +0.72,p 0.022);
    其中 cross_mean(cross_mean(W, 20), 241) 为 −0.38(train −0.38 / valid −0.25);同一个外围套在不做 AV 标准化的 add(Amt, Amt) 权重上是 −0.047
    (valid +0.20),套在 Amt / cross_mean(Close, 20) 上是 −0.025(valid +0.23)。也就是同样的外围,AV 倾斜让分数低了约 0.35。这个 E 位要回答:AV 倾斜部分
    (异常活跃分钟的收益)本身是来源还是噪声?种子里放了三类对照:(a) 把 W 减去等权分钟收益 day_mean(Ret)、减去原始成交额权重 day_wmean(Ret, Amt),
    只留「异常放量的那部分」;(b) 慢聚合方式换掉前一轮见过的「只套 cross_mean」写法:半衰期 120 日的 cross_ema、快慢 EMA 差、241 日均值减 21 日均值(跳过最近一个月,
    避开新尺子已去掉的 20 日反转部分);(c) 分布形状:241 日里上 25% 分位均值减下 25% 分位均值(上行日与下行日的不对称)、正日占比 cross_mean(sign(W), 241)、
    截面排名的 241 日均值 ts_mean(cs_rank(W), 241)(对极端日稳健)、每天用 AV 加权标准差标准化后再平均(日度信噪比)、W 与当日收益 day_sum(Ret) 的 120 日相关
    (一天的涨跌有多少发生在异常放量分钟里)。

    为什么和已有的不同:我看到的含 W 的候选(−0.38 与上一轮 N 位的 20 日版)外围算子都只有 cross_mean(一层或两层均值);这里的外围用了 cross_ema、sub、day_mean、day_wmean、cross_stddev、div、sign、cross_tail_mean_q75 /
    q25、cs_rank、cross_corr、day_wstd,骨架逐个核对不在两个库的 5583 条里(day_wmean、cross_ema、cross_tail_mean 在库里出现 0 次)。库里与 W 最近的是 B074 一族
    (前 20 / 50 分钟的成交量加权收益、20 日窗口),没有全天、没有相对自己同分钟的标准化、没有一年尺度。

    为什么样本外还会在:来源是参与者类型的慢变偏向,不依赖某段行情;外围全部是 120 到 241 日的聚合,换手低,15 bp 成本不致命(上一轮同类的 hl=0 候选就是不加平滑的);
    用「减去等权」或「减去原始权重」的种子是在拿同一天、同一只股票的两种加权方式相减,天然去掉大盘涨跌与持久水平。风险:W 对 20 日反转的暴露(上轮 20 日版 ρ 0.58),
    所以种子都放在 120 日以上的窗口或做了 241 减 21 的跳月;尺子本身会去掉对反转的线性、U 形、S 形暴露。

    数学检查:AV 的分母 cross_mean(Amt, 20) 含当天,为 0 只在 20 日同一分钟全无成交,此时当天该分钟的 Amt 也是 0,得 NaN 不是无穷,day_wmean 对非有限权重整分钟忽略;AV ≤ 20,
    所以没有爆点。day_wmean 的权重取绝对值、分母为权重和,和为 0 才是 NaN。第 1 分钟是集合竞价(Ret 恒为 0),权重上有效但收益为 0,不泄露隔夜跳空,也不制造前视。
    cross_corr 的 120 日窗口内两个序列都是日度的、有界;div(W, day_wstd(Ret, AV)) 的分母为 0 当且仅当整天 Ret 全 0(涨跌停封板),此时 W 也是 0,0 / 0 = NaN,不是爆点,
    |W| / 加权标准差也被样本量上界约束(不超过约 15)。cross_tail_mean 与 cross_ema 都按有限日处理缺失,不填 0。无前视:只用 t 日收盘及以前,t+1 交易;
    所有窗口 ≤ 241 日,热身期的部分窗口按可用日取平均,不是常数填充。
