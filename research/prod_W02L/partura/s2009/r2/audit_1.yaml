    reasons: '创新度 4。库的 5583 条表达式里 day_wmean、day_signed_ratio、day_topw_mean、cross_ema、cross_tail_mean、day_wstd 各出现 0 次(对 struct/members.csv 的表达式列直接计数);16 个种子的骨架在库里都是 0 条,GP 库禁令不会拒绝它们。对快照 head 的原始 |ρ|:种子 8、9、10、11、12、13、14 在 0.03–0.19,种子 8、9 的 size 为 0.39 / 0.41;种子 1、2、3 与 DW40 的 |ρ| 为 0.42–0.47,是 W 的慢聚合,换皮程度中等,不计为 1。合理度 4。算子实现与描述基本一致:in_slice(X,1,120) 与 in_slice(X,121,240) 切的是上午与下午连续竞价(第 0 格集合竞价不在内);in_slice(X,211,240) 是尾 30 格,in_slice(X,1,30) 是开盘后 30 格;in_delay(Amt,1) 的第 0 格为 NaN、被 day_wmean 忽略,权重只来自更早的格,无前视;day_signed_ratio 在分母为 0 时输出 NaN(不是 0)。需要 PI 改的(都不据此划种子):(a) 种子 4、10 的 sub(cross_mean(X,241), cross_mean(X,21)) 与 E 位种子 5 同款,「跳过最近一个月」不成立,对 rev 的 |ρ| 为 0.541 与 0.557,是 20 日反转的暴露(round-1 同类的 cross_mean(W,20) 对 rev 为 0.58)。(b) 种子 15 的 day_topw_mean 在当日 90% 以上分钟 Amt 为 0 时阈值为 0,sel 变成全部分钟,输出退化为全日均值(sub 为 0);它只出现在 illiquid 日,不是 §4 的爆点,但种子对 liq 的 |ρ| 为 0.449,可能有这部分贡献。(c) 种子 5 的 div(cross_mean(W_Amt,241), cross_stddev(W_Amt,241)) 与 E 位种子 7 同款分母问题(单有效日时分母为 0,输出 ±inf,仅限该日)。(d) 种子 6 的 cross_mean(sign(W_Amt),241) 在 corr_1.json 里 distinct 0.147、门槛为废品;同样按 §4 的列序并列规则不据此划。如果它有 alpha,最可能来自三处:种子 8、9 的持续净买入失衡(Chordia–Subrahmanyam 式的单边资金流,但 size 相关 0.39–0.41,可能只是大盘股的资金结构);种子 11–14 的分段价格动作持续性(开盘、尾盘、午后减上午,Heston–Korajczyk–Sadka 式的同时段重现);种子 1–3 的放量加权收益慢均值(放量时价格方向的参与者类型,Llorente 等 2002)。通过判定:创新 4 ≥ 3、合理 4 ≥ 3、未划种子剩 16 ≥ 4;对五个控制的最大 |ρ| 为 0.557(种子 10,rev),未到 0.8 的自动划线。'
R:
  - head: 'ts_max(day_durbin_watson(Close), 40)'
    soundness: 4
    reasons: '合理度 4。DW(Close) = Σ(ΔC)²/(ΣC²+1e-8) 是未去均值的比值,和经典 Durbin-Watson 不同,量纲为 (ΔC/C)²;它非负,上界 4(由 (a-b)² ≤ 2a²+2b²),分母在 var<1e-8 的常数日返回 NaN,无 log 与除以近零的问题。ts_max 沿日轴、因果。窗口 80 / 100 / 120 / 160 / 200 / 241 与 Vwap 变体对原 head 的原始 |ρ| 为 0.56–0.80,按 R 规则(≥0.5)属于替换候选,替换与否由 PI 的分数决定。注意两点:(a) N = 200 与 241 的变体在样本起点后的前 N−1 个交易日是展开窗口(取截至当日的最大),241 版约占训练段的 18%,不是主导,但应在报告中注明;(b) Vwap 在零成交分钟为 NaN,DW 跳过这些对,不造成问题。机制清楚:最极端一天的已实现方差,与 MAX 效应(Bali 等 2011)同类。'
  - head: 'ts_sum(log(log(day_durbin_watson(Volume))), 10)'
    soundness: 3
    reasons: '合理度 3,不是 1。C0 = log|log DW(Volume)| 继承了折叠:common.py:211 的 log 是 log|x|,|x| ≤ 1e-9 时为 NaN,DW=1 处下探到约 −20.7,round-1 的审计已指出,当时没有证据显示它支配截面。本组的新风险在变体 1、2:它们在 cross_mean(C0,120) 外面又套了一层 log|·|。120 日均值可以过零,过零附近 log|·| 下探,之后的 60 日 cross_stddev 会被这些下探支配,这是 §4 的「除以近零量 / 对数近零造成的爆点」类型。PI 说「折叠点附近的单日值被平均掉」只对单日值成立,对均值过零不成立。变体 3 没有外层 log,数学上干净。变体 1、2 对原 head 的 |ρ| 为 0.42 / 0.38,对流动性为 0.496 / 0.443,与 0.5 的边界接近。我无法量过零频率,所以不压到 1;PI 应先统计 cross_mean(C0,120) 的过零比例,或对进入对数的量加下限。如果它有 alpha,最可能来自 C0 的 120 日水平变化的节奏(体制切换),而不是 DW 的水平。'
summary: '两个任务位都通过(创新 4、合理 4,未划种子)。R 组 1 合理度 4,R 组 2 合理度 3。PI 需要改的三件事:(i) 241 减 21 的种子(slot a 5、6,slot b 4、10)不是跳过最近一个月,而是 20 日反转的暴露(rev 0.54–0.58);(ii) 核心段的 |W|/σ 有界与「分母为 0 只在 Ret 全 0」两个说法不成立,cross_stddev 与 day_wstd 分母的 inf 风险未量化;(iii) R 组 2 变体 1、2 对 120 日均值再取 log|·|,均值过零时会爆。'
