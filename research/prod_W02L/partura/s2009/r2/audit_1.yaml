    reasons: '创新度 4。核心 W = day_wmean(Ret, div(Amt, cross_mean(Amt, 20))) 在 struct/members.csv 的 5583 条表达式里 day_wmean 出现 0 次,核心骨架 O:day_wmean(F,O:div(F,O:cross_mean(F))) 库内 0 条。corr_1.json 里核心对 6 个快照 head 的原始 |ρ| 最大 0.025(ts_max(day_durbin_watson(Close),20)),残差 0.044;对 5 个控制最大 0.154(rev),核心本身不是换皮。外围种子 1、2、4、7、11、12、13 对 liq / known 在 0.32–0.45,这是 241 日慢均值把 W 的水平部分带回来(核心自己对 liq 只有 0.029),属于中度重叠,不是同一个东西,不压到 3。合理度 4。核心恒等式成立:W = day_mean(Ret) + cov_t(Ret, AV) / mean(AV)。AV 的分母含当日(cross_mean 沿日轴、因果),AV ≤ 20,0/0 只在 20 日同分钟全为零时出现;全部是 t 日收盘及以前的数据,无前视。第 0 格是 09:30 集合竞价(dt_in.py:314),在 241 网格上只进权重。需要 PI 改的错误(都不是 §3 的挡项,不据此划种子):(a) 种子 5、6 写成「跳过最近一个月」,实际 cross_mean(W,241) 减 cross_mean(W,21) 的 241 日窗口把最近 21 日也算进去,是长均值减短均值;对 rev 的 |ρ| 为 0.582(种子 5)与 0.537(种子 6),round-1 的 cross_mean(W,20) 对 rev 也是 0.58,这是 20 日反转的暴露,不是避开了它。(b) 种子 9 的 q75 尾均值减 q25 尾均值是 241 日日度分布的离散度(尺度),不是「上行日与下行日的不对称」,它与 vol 0.530、size 0.489 相关。(c) 核心段写「|W|/加权标准差不超过约 15」不对:权重不均匀时 |μ|/σ 没有上界(两点情形为 sqrt(p/(1-p))); 「分母为 0 当且仅当整天 Ret 全 0」也不对:day_wstd 在所有计权分钟收益相同时即为 0(或只剩舍入误差量级),W/σ 会变成 inf 或很大的有限值。(d) 种子 7 的 div(cross_mean(W,241), cross_stddev(W,241)) 与种子 13 的 cross_mean(div(W, day_wstd(Ret,AV)),241) 有未加保护的分母。nanstd_last 在窗口只有一个有效日时返回 0,所以种子 7 在每只股票的第一个有效日(含 2018-01-02 样本起点)输出 ±inf,只影响那一天;种子 13 的 ±inf 若发生,会经 cross_mean(·,241) 持续 241 日,但它需要整日计权分钟收益全部相同,我无法在现有资料里量出频率,不构成 §4 的「爆点支配截面」,不划;建议 PI 跑前加分母下限或统计零分母频率。(e) 种子 12 的 cross_corr(W, day_sum(Ret), 120) 两边共享等权收益项,读数主要反映 cov 项占 W 方差的比例,「涨跌有多少发生在放量分钟里」说得过头。(f) 核心段把集合竞价写成「第 1 分钟」,N 位写成「第 0 根」,编号不一致;「Ret 恒为 0」在代码里找不到依据(synthetic.py 的 Ret = close/open-1 在该格非零),未核实。种子 8 的 cross_mean(sign(W),241) 在 corr_1.json 里 distinct 0.147、门槛为废品,截面同值很多,但 §4 明确「并列靠列序打破」不是问题,不据此划。通过判定:创新 4 ≥ 3、合理 4 ≥ 3、未划种子剩 13 ≥ 4;核心对五个控制的最大 |ρ| 0.154 < 0.8。如果它有 alpha,最可能来自放量分钟的价格方向(cov(Ret,AV) 的符号与持续性,Llorente 等 2002 的读法),而不是 W 的幅度(幅度与 vol 相关 0.3–0.4)。'
