  hypothesis: '机制:把一天的收益拆成「隔夜跳空」(今日第一分钟价 / 昨日收盘价)与「日内」(今日收盘价 / 今日第一分钟价)两段,在日轴上分别累积。隔夜段主要由机构与消息驱动的集合竞价和盘前信息决定,日内段主要由散户的连续竞价交易驱动(A 股文献里隔夜收益持续为正、日内收益持续为负的现象与散户情绪溢价相关);个股「隔夜均值 - 日内均值」的差读的是机构资金与散户情绪的相对力量,是慢变的持仓者结构特征。算子实现:day_first(Close) 与 cross_delay(day_close(Close), 1) 相除得隔夜比,day_close(Close) 与 day_first(Close) 相除得日内比,减 1 后用 cross_mean / cross_ema / cross_zscore 在 20-120 日上平滑;另给「隔夜持续性」(隔夜比对 20 日前同一量的 cross_corr)和「隔夜均值对日内均值的 cross_regbeta」两个种子,读的是两段收益是否反向回吐。灵感:本批共性表里最强的是 day_mean(Ret) 的日轴累计(+1.16 到 +1.51),说明每天的收益水平经日轴累积后有信息,但没人把当日收益拆成隔夜与日内两段;核心 day_mean(Ret) 对整天的分钟收益等权,把隔夜这一段(第一分钟相对昨收的跳空)与盘中混在了一起,这里把它们分开。和库里不同:库里与日内价格相关的表达式都是在分钟轴上做分位 / 加权 / 回归(day_topw_mean、day_quantile、day_durbin_watson 一族),没有用 day_first 与前一日 day_close 的跨日差去构造隔夜跳空的;这个构造的骨架(day_first / cross_delay(day_close) 相除)不在库里。度量的对象是跨日价格跳空而不是日内分钟路径,和头部里的 Amt / Volume 水平量(cross_sum 一族)、控制里的流动性 / 波动 / 20 日反转不是同一件事(隔夜收益累计是当日收益的一部分,但减去日内部分后与纯反转的暴露不同)。为什么样本外还会在:隔夜与日内的收益分化来自机构与散户参与时段不同,A 股的涨跌停与 T+1 制度使这种结构长期存在,不靠某一段行情;窗口 20-120 日,换手低。没有前视:隔夜比用的是今天开盘与昨天收盘,日内比用今天开盘与收盘,都是当天收盘后已知,cross_delay 取过去值;不含 cross_shift / ts_shift / ts_spearman / nt_*。风险:后复权价格在除权日有跳变(已复权所以隔夜比不含除权跳变);开盘第一分钟可能无成交(缺失)的票由日轴均值吸收;一字板股票隔夜与日内都是 0 或常数。'
