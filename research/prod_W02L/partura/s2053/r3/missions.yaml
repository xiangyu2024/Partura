  hypothesis: '机制:核心 = 日均分钟收益 day_mean(Ret)(约等于当日收益 / 241)先做 10 日滚动和、再做 15 日滚动和,等价于一个三角形权重的约 24 日窗口动量(中间几天权重最大、最近和最远几天权重小),读的是个股「几周尺度上的方向性漂移」。本批共性表里含它的 7 个候选均值差 +1.36(p 0.001,含 / 不含 -0.95 / -2.31),含它的候选是本流目前全部评分里最接近过线的(上一轮 Pr2a_Ea 的 log(cross_regbeta(核心, day_topw_mean(Ret, Close), 241)) 为 -0.16,train -0.10)。上一轮对它的外围只有两类:(a) 对 day_topw_mean(Ret, Close) 做 241 日回归取 beta 再 log;(b) 再套一层 cross_sum / log。本轮外围换成完全不同的一组,把「动量」本身做干净:1) 除以自身的日收益波动(cross_stddev(day_mean(Ret), 60) 或 cross_mean(day_std(Ret), 60)),得到风险调整后的趋势强度(平滑、稳定的上涨比靠一两个大阳线涨上来的更有持续性,也更不容易被波动控制吃掉);2) 减去最近 5 日累计收益(跳过最近一周,去掉与 20 日反转控制重叠的短期反转部分,只留中期动量);3) 对自己的 60-120 日分布做 cross_zscore / cross_rank(个股相对自己历史的动量位置,而不是跨股水平);4) 用 cross_regbeta 对日成交量水平或日内波动做回归取 beta(动量对量能 / 波动的敏感度,量价配合的趋势);5) 短窗口减长窗口(加速 / 减速)。没有一个外围用到上一轮的 topw 回归 + log 写法。和库里不同:库里含该核心的只有 log(cross_regbeta(…, topw, 241)) 这一族及其嵌套;除以波动、跳过近期、对自身历史标准化、对成交量回归的写法骨架都不在 5583 条库表达式里,所以不会被库禁令拒绝。为什么样本外还会在:中期动量在 A 股由处置效应、散户追涨杀跌与信息缓慢扩散驱动,是行为偏差,不靠某一段行情;新尺子已经去掉了对 20 日反转、波动、流动性、市值、已知族和两个冠军的线性 / U 形 / S 形暴露,剩下的是这些之外的中期趋势成分;窗口长所以换手低,15bp 成本下对纯多头书有利。没有前视:day_mean(Ret) 当日收盘后才有,日轴算子只用当天及过去,不含 cross_shift / ts_shift / ts_spearman / nt_*。风险:动量本身可能与 20 日反转控制负相关,跳过近期的种子是对照;若 train 与 valid 的市场状态不同(动量崩溃),波动调整种子应更稳。'
