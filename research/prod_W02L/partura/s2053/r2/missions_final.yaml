- type: N
  hypothesis: 机制:把本批唯一的富集现象(day_topw_mean(Ret, Close) 按价格位置选分钟再平均收益,含它的候选均值差 +0.8,p
    0.009)推广成「按价格偏离选分钟」的一族。核心思路:分钟收益的信息含量取决于这一分钟价格相对当天所处的位置。用 in_demean(Close)(分钟价减当天均价)作权重,day_topw_mean
    取 |偏离| 最大的 10% 分钟,即当天价格最极端(高端或低端)的分钟,再平均它们的收益:收益符号与偏离方向一致 = 极端价位上趋势延续(信息推动),相反
    = 极端价位被回拉(流动性推动)。用 in_delta(Close, 30)(30 分钟价格变动)作权重则是「在最猛的半小时涨跌里,收益继续还是回吐」。再配
    day_topw_mean(Volume, Close)(价格高位区的成交量,与全天成交的对比)当作承接强度、两种权重之差当作位置信息与成交信息的分歧。 算子实现:全部是
    day_topw_mean(收益或量, 权重) 加日轴 cross_mean / cross_ema / cross_zscore 平滑;权重用 in_demean、in_delta、abs_、in_rank
    在分钟轴上构造,不依赖 Amt / Volume 的水平。日轴窗口取 20-30 天,换手低。 和库里不同:库里与核心的组合只有按 Close 加权这一种;偏离均价加权、30
    分钟涨跌幅加权、按成交量排名加权的变体和骨架(分钟轴先构造权重再 day_topw_mean)都不在 5583 条库表达式里。度量对象是价格位置 / 价格冲击里的收益,而头部
    head 全是 Amt / Volume 的水平量(cross_sum 一族),与它们不是同一件事。 为什么样本外还会在:极端价位上的收益延续或回拉对应信息交易
    vs 流动性交易的比例,是个股持仓者结构的慢变特征,不靠某一段行情;与流动性、波动、反转、市值控制相比,它读的是日内路径形状而不是水平,新尺子去掉控制的非线性暴露后剩下这部分。没有前视:全部为当日分钟数据与过去的日轴窗口;不含
    ts_spearman / nt_*。
  inspired_by: 本批共性表:day_topw_mean(Ret, Close) 的含有者均值差 +0.80(p 0.009),含 cross_semistd_neg(·,
