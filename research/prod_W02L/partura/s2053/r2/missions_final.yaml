- type: E
  core: day_topw_mean(Ret, Close)
  hypothesis: 机制:核心是「一天里价格最高的 10% 分钟(按 |Close| 取前 10%)的平均分钟收益」。这些分钟就是当天的价格高位区,那里的收益为正
    = 价格在高位仍被继续买上去(接盘力量足、突破延续),为负 = 在高位被派发 / 冲高回落。这是一个逐日、按股票的「高位承接 vs 派发」读数。 上一轮(Pr1a_Na)对它只做了两类外围:cross_semistd_neg
    下行半标准差(经 log 比,要求相邻两天的值同为正,大量天数被丢掉)+ ts_stddev / cs_demean / ts_quantile,也就是只读它的「波动
    / 离散度」。这些全部得分为负(-0.74 到 -0.87),说明核心的二阶矩不是 alpha 所在。本位换成读「水平与方向」的外围:日轴上的均值 / 指数均值
    / 线性衰减均值(把一天一个的噪声读数变成慢变的「习惯性高位承接」,低换手,15bp 成本下对纯多头书有利)、 减去全天平均收益或减去按成交量加权的最重分钟收益(去掉「当天整体涨跌」只留高位区的超额漂移,等于问:高位分钟比成交最重的分钟更强还是更弱)、与全天平均收益的
    60 日相关(高位区收益跟全天方向的耦合度)、短均值减长均值(承接力在变强还是变弱)。没有一个外围用到上一轮见过的 semistd / stddev / demean
    / quantile 族。 和库里不同:库里含 day_topw_mean(Ret, Close) 的只有上一轮那几类二阶矩写法;水平型的日轴均值、差分、相关写法不在
    5583 条库表达式的骨架里。核心本身以价格位置选分钟、以收益为被平均量,和成交量 / 金额水平型的头部(Amt 一族,已被控制)度量的不是同一件事。 为什么样本外还会在:高位承接是持仓者结构(获利盘兑现
    vs 追涨资金)的慢变特征,和流动性、波动、20 日反转、市值几个水平型控制几乎正交;日轴平滑后换手低。没有前视:当日分钟序列算出日度量,日轴窗口只用当天及过去;种子不含
    ts_spearman / nt_*。风险:|Close| 用的是后复权价,分钟价格高位区在趋势股里偏向当天较晚的分钟,可能混入日内趋势,sub(核心, 全天平均收益)
    的种子正是对照。
