    reasons: '相关度表:b 位原始 |ρ| 与 head 最高为 b9 的 0.95(与 day_sum(cross_sum(Volume, 3)) 同式的成交量加权,≥ 0.7 自动划掉),其余 ≤ 0.38。与控制最高:b6 rev 0.64、b7 rev 0.54、b9 liq 0.69(已划),其余多在 0.2–0.5;没有 ≥ 0.8 的种子。算子核对:day_topw_mean 取 |w| 前 10%,in_demean(x) = x - in_mean_full(x) 是分钟轴上的减当天均值(与 Close 同序的只是平移,但取绝对值后选中的是两端极端),in_delta(x, d) = x[t] - x[t-d] 是向后差分,in_rank 是分钟轴上的截面秩(单调),abs_ 无前视;没有 cross_shift、ts_shift、in_local_mean、ts_spearman、nt_*。划掉 9:与 head |ρ| 0.95,自动规则。问题记录(都不是数学问题,不据此挡):(1) b1、b2 的机制说「收益符号与偏离方向一致 = 延续,相反 = 回拉」,但 day_topw_mean 对 |w| 取两端合并的前 10%,再对 Ret 求一个平均,算子分不出高端与低端各自的收益;它实际量的是「价格两端极端分钟的平均收益」,这是良定义的量,但方向故事没有被算子实现,若有 alpha 来自两端收益的合并水平或不对称,而不是 PI 描述的方向拆分。合理度因此给 3 而非 4。(2) b6 的 in_rank(Volume) 在分钟轴上单调,按 |秩| 取前 10% 与按 Volume 取前 10% 选中的分钟基本相同(只差分位插值的边界),所以 b6 是 day_topw_mean(Ret, Volume) 外加 cross_mean 的换写法。它不是 head 或控制的重复,计划里 a 位 seed 7 只是在 sub 里用了 day_topw_mean(Ret, Volume),也不是同一个种子,所以不按「重复」划掉;但它的「截面秩加权」这一层没有新内容,PI 不应把它当作独立的新想法。(3) b8 的 y = in_delta(Close, 5) 是元的价格变动,不是收益,元值随价格水平放大;日度截面秩去掉了股票之间的尺度,但信号可能在载入价格水平,而价格水平不在 5 个控制里,定义上不算坏掉,奖励阶段应检查它与价格水平的相关。(4) b5 的 abs_ 与 day_topw_mean 内部的 |w| 重复,无害。(5) b1、b2、b3、b4、b10 共用 Ret 为被平均量,只在权重与平滑上不同,相互之间的相关不在相关度表里,预期高。创新度给 3:权重换成偏离均价、30 分钟涨跌、量秩、绝对涨跌是新构造,与 head 相关低,但仍在 day_topw_mean(Ret, ·) 一族内,且 b5、b3、b6 与反转、波动控制有 0.3–0.6 的相关,不是真正的新测量对象。合理度给 3(b1、b2 的机制未被算子实现;b8 有单位问题;其余机制清楚)。如果它有 alpha,最可能来自:日内最大的 30 分钟价格变动之后收益是延续还是回吐(b3、b4、b10),这是冲击的信息与流动性两种解释的分界,符号要在奖励里确认。'
