    reasons: '相关度表:快照 0 个 head,与 head 的 |ρ| 全为 0,库禁令不触发;5 个控制的原始秩 |ρ| 最大 0.54(seed 2 的 liq)、已知族最大 0.53,均 < 0.8,无自动划掉。PI 笔记里「与流动性控制天然几乎正交」与表不符:水平型 seed 1/2/9 与 liq 为 0.45–0.54、与 known 为 0.49–0.53;z 分数型 seed 3 与各控制都 ≤ 0.10,seed 4 的 day_centroid 也只到 0.44–0.50。算子核对:day_argmax 忽略 NaN、整行 NaN 给 NaN;in_local_mean 是日内居中窗口,只用当天分钟,收盘后可得,和库里其它日度量同口径;cross_mean / cross_ema / cross_zscore / cross_stddev 只沿日轴,无前视;没有用 cross_rank / ts_rank,不触发 nanrank_last 的停牌问题;没有 ts_spearman 或 nt_*。库内核对:libs_train.csv 中 cross_(mean|ema|zscore|stddev) 包裹 day_argmax(in_local_mean(...)) 的骨架数为 0,裸的 day_argmax 核心只以日内整数形式出现在 L9xx 系列、被取值比例闸门挡掉,所以日轴平滑版本确有库里没有的结构。创新度给 3 而不是 4:核心测的仍是同一个日内峰值分钟,平滑改变的是形式,但 seed 3 / seed 4 的控制相关接近 0,说明有实质新信息。划掉:无。seed 8 只是切片窗口 16..226 不同,语义也不同(去掉开盘与尾盘各 14 分钟),保留;seed 1 / 2 / 9 是同一核心的不同聚合,不是同式重复,保留。注意一处待核对:若 241 格对应 9:30–15:00 且含收盘集合竞价,则 in_slice(Volume,2,237) 排掉了最后 3 格,与 N1 中「尾盘指数基金调仓」的机制只能部分对应,不作为挡的理由。如果它有 alpha,最可能来自:成交量峰值时刻的慢变习惯(投资者结构、开盘冲击与尾盘执行的占比),而不是流动性水平;z 分数版本(seed 3)与控制几乎正交,是这个解释的主要检验。'
  - slot: b
