    reasons: '相关度表:快照 0 个 head,库禁令不触发;原始秩 |ρ| 与各控制:liq 0.00–0.48、vol 0.01–0.38、rev ≤ 0.15、known 0.01–0.48、size 0.00–0.61(b5 的 size 0.61 最高),均 < 0.8,无自动划掉。算子核对:in_slice_to_end(S, peak) 保留 peak 及之后的列,in_slice_from_start(S, peak) 保留 0..peak,二者与 peak 都在 in_slice(Volume,2,237) 之后的同一列索引下,索引一致;day_argmin / day_min / day_max 忽略 NaN;div 是普通除法;没有 nt_* 或 ts_spearman。创新度给 3:库里 L912 / L913 已有前 / 后低谷时刻的裸形式,都被挡掉;本位的时长差、深度比与日轴平滑是新构造,但低谷时刻本身是库里已探过的量,所以给 3 而不是 4。合理度给 4:消化速度与信息扩散 / 做市深度的对应清楚,b4(cross_zscore 的时长差,与各控制 ≤ 0.09)是这一位最干净的候选。风险记录(不作为挡的理由):(1) b5 的 div(day_max(S), day_min(post-peak S)) 分母是峰值后 5 分钟平滑量的最小值,若某只票在非停牌日的某个 5 分钟窗口成交量为 0,会得到有限但很大的比值,cross_ema 半衰期 10 天会把这个单点带约 10 天,可能在截面上占主导;表中 b5 的 size 相关 0.61 也与此相符。本位没有给出它支配截面的证据,放行,但奖励阶段应检查 b5 的截面最大值与分位数。(2) 上冲时长(seed 2 / 9)的峰前低谷可能落在开盘前几格,带有开盘集合竞价的特征,偏差可以接受。划掉 9:与 2 同式(cross_mean(sub(peak, pre-peak trough), ·)),只是窗口 20 换成 10,是同一信号的换窗版本,按「重复」划掉;其余 8 个保留。如果它有 alpha,最可能来自:冲击消化的快慢反映的是知情者分批建仓还是一次性流动性冲击,因此慢衰减与快衰减对应的反转 / 延续方向应该相反,符号要在奖励里确认。'
