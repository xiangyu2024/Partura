- type: N
  hypothesis: '机制:成交量峰值之后「多久、多深」衰减,读的是冲击的消化速度。取平滑后的分钟量 S(5 分钟局部均值,避开单笔噪声),T_after = 峰值之后的第一个低谷时刻(day_argmin(in_slice_to_end(S, 峰值时刻))),T_before = 峰值之前的低谷时刻(本批 L912-L947 的成员);T_after - 峰值 = 峰值后的衰减时长,峰值 - T_before = 放量上冲时长,二者差 = 冲击的对称性。S 峰值后的最低值 / 峰值 = 衰减深度(1 = 没有衰减,量一直维持,0 = 完全消退)。慢衰减 / 高持续 = 知情者分批吃货、信息逐步扩散(信息扩散慢则后续有漂移);快衰减 = 一次性的流动性冲击或事件脉冲(多为反转)。

    为什么和库里不同:库里只有日内整数形式(三种:峰值、峰值前低谷、峰值后低谷),全部被取值比例闸门挡掉,没有人拿它们做差、做比、做日轴平滑;本位的差 / 比 / 相关 / 稳定性是新的构造。做差之后两个整数变成一个范围较宽的整数,再日轴平均 10-20 天后连续。比值种子(day_max(S) / 峰值后最低量)是无量纲的,所以与成交量水平(流动性控制)、市值天然正交;分母是峰值后的窗口最小值,在 S 已经 5 分钟平滑且量为股数、停牌日整天缺失(NaN)的情况下不会取到 0 附近造成爆点,偶发的 0 会被日轴平均和截面排名吸收,不由它主导。

    为什么样本外还会在:冲击消化速度与信息扩散速度、做市深度、持仓者结构相关,是股票的慢变特征;窗口取 10-60 天所以换手低,15bp 成本下纯多头书可存活。没有前视:峰值与低谷都是当日完整分钟序列算出的日度量,放进日轴窗口只用过去与当天,当天收盘后才有这个值,与本库其它日度因子同口径。种子均不含 ts_spearman / nt_*。'
