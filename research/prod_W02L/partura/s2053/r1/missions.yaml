  hypothesis: '机制:日内成交量峰值出现在几点,是一个按股票持续的「交易者构成 / 信息到达节奏」特征。峰值早(开盘一小时内)= 隔夜信息、散户与追价主导的开盘冲击;峰值晚(尾盘)= 指数基金 / 机构按收盘价调仓、保守的执行算法(VWAP 末段加量)。这个量在本批 9 个成员(B157,结构核心 day_argmax(in_local_mean(in_slice(Volume, a, b), 5)))里是日内分钟序号(整数 0-236),截面上只有 200 多个不同值,第 0 步全部被「不同取值比例 ≥ 0.5」的闸门挡掉,不是因子退化而是离散:没有人测过它的 alpha。本位的做法是在日轴上平滑(cross_mean / cross_ema 取 10-30 天均值),把一天一个的整数变成每只股票的「习惯性峰值时刻」连续量,闸门可过,并且天然低换手(窗口长),在 15bp 成本下对纯多头书有利。

    为什么和库里不同:库里该核心只以日内整数形式出现、没有过尺子,也没有任何日轴平滑版本;种子里用的日轴算子(cross_mean / cross_ema / cross_zscore / cross_stddev / cross_corr)与峰值时刻的组合,不在 5583 条库表达式的骨架里。另外几个种子用 day_centroid(成交量的时间重心,连续)、和 |Ret| 峰值时刻的差(量与价的峰值是否同步:同步 = 消息驱动,错开 = 流动性驱动)、峰值时刻的 60 日稳定性(cross_stddev),读的是节奏的稳定性而不是水平。

    为什么样本外还会在:它度量的是投资者结构与交易执行方式(散户 vs 机构、指数基金的收盘调仓),这是慢变的结构特征,不靠某一段行情;时刻本身与流动性水平、波动、市值、20 日反转这几个控制天然几乎正交(控制读的是水平 / 收益,不读时刻),所以新尺子去掉控制的非线性暴露之后剩下的就是它。没有前视:in_slice(Volume, 2, 237) 只用当天分钟、日轴窗口只用过去天数。种子均不含 ts_spearman / nt_*。风险:峰值时刻有并列(靠列序打破)、停牌日值缺失,窗口均值缓解;如果杂音大,cross_zscore / cross_stddev 种子提供对照。'
