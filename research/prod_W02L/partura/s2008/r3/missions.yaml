  hypothesis: 核心 C = cross_stddev(ts_sum(log(day_durbin_watson(Vwap)), 10), 241),即本流现有 head(-0.09,train -0.07 / valid -0.09):个股当天分钟 VWAP 路径相对已实现方差 RV(DW 未去均值 = Σ(ΔVwap)²/ΣVwap²,价格尺度约掉)取对数、10 日和、再取 241 日标准差 = 慢速 vol-of-vol(波动的突发性)。证据(全是 train / valid):第 1 轮 R 组只留离散度 -0.09、只留均值 -2.61,差 2.5;Vwap 换 Close 无损;窗口 180 / 300 / 120 / 482 与 IQR / 半偏差写法全都变差(第 2 轮 R:-0.33 ~ -1.8),241 是峰;它与五个控制的 |ρ| 只有 0.04 ~ 0.34,所以尺子没有把它吃掉,而是它自己 train / valid 都在 0 附近,被混进来的成分稀释。前两轮 E 位围绕的是 120 日 / 无 ts_sum 的 C',外围写法是 cs_bucket_zscore(·, LogFloatCap) 单层双层嵌套、cs_regres(·, RV 基线 / 成交量突发 / Close 突发)、cs_flip_by_state(·, 市场 RV 或成交额状态)、cross_mean 平滑,最好 -0.25。本位换成 241 日的 C(ts_sum 摊平锁死日极值,是已知最好的写法),外围换成以前没用过的五类:(1) 上市批次同伴(cs_bucket_zscore(·, ListAge),用上市龄分组而不是市值分组:同一批上市的票共享板块 / 制度 / 持有人构成)与成交额水平 / 日收益波动同伴;(2) 时间维度的相对量:ts_delta(C, 60) 与 cross_zscore(C, 60) = 突发性相对自己 60 日前 / 近期常态的变化,而不是水平(水平里有刻度差,变化里没有);(3) 两路差:cs_rank(C) 减去成交额同口径突发性的秩(只剩价格自己的突发,不是放量带动的)、减去 Close 路径同口径突发性(扣掉弹跳噪声)、减去 60 日短窗同口径突发性(慢减快 = 突发性的期限结构);(4) 回归扣除:对同口径成交额突发性、对名义价格 LogFloatCap - LogFloatShares、对 RV 基线 cross_mean(ts_sum(log DW, 10), 241) 做截面残差(同口径的 241 日版,前两轮是 120 日版);(5) 市场收益状态翻转 cs_flip_by_state(·, cross_mean(day_sum(Ret), 20)):检验突发性溢价的符号是否随近 20 日市场涨跌状态变,前两轮翻转的状态是波动 / 成交额,没有用收益。为什么和库不同:两个库全部 5583 条里没有一条含 ListAge / LogFloatCap / cs_regres / cs_bucket_* / cs_flip_by_state,表达式外围基本只有 ts / cross 统计;这里的外围全是截面交互项,而尺子只扣控制秩的 1 ~ 3 次多项式,交互项、同伴内相对量、回归残差不在被扣掉的范围。为什么样本外还会在:突发性是个股信息流与参与者构成的慢属性(241 日窗口,换手低,15 bp 可承受);外围扣的是机械成分(刻度、放量、噪声、状态),剩下的是价格自身的不确定性,对应信息不确定性溢价(Zhang 2006 等,文献在 2023-08 以前)。预期只是从 -0.1 变到略正,不是大幅越线。数学检查:无前视(全部尾随窗口,ts_delay 为滞后);所有种子乘上市 > 241 日掩码 M,避免新股窗口未填满的估计点占据十分位两端;DW 分母远大于 1e-8,常数行为缺失不会 inf,ts_sum 摊平近常数日的极小值;cs_regres / cs_bucket_zscore 只用当天截面;不用任何 2026 年数据。
