- type: N
  hypothesis: 想法:读微观结构噪声的状态依赖,而不是水平 / 离散度。day_durbin_watson(Ret) = Σ(Δr)²/Σr²,约等于 2 - 2ρ1(未去均值的分钟收益一阶自相关):>2 = 买卖价弹跳 / 反转(流动性提供主导),<2 = 动量 / 订单拆分(信息交易主导)。它是无量纲的,与前面全流用的 DW(Vwap)(方差读法)不同。库里 DW(Ret) 只出现在 B024 的水平外壳里(sigmoid(pow_2(DW(Ret))) 的 q75 / cross_mean),全部是对自己做时序统计;没有一条读「微观结构状态 × 外部状态」的联动。我读的是:(a) 弹跳强度随成交额变大时是变强还是变弱(ts_corr / ts_regbeta(DW(Ret), log 日成交额)):放量日从反转型变成动量型的票 = 知情交易的量一出来就占主导,这类票的信息被慢速吸收;(b) 与当天 |日收益| 的联动(大动日是否伴随动量型分钟路径);(c) 昨日分钟自相关对今日收益的联动 ts_corr(ts_delay(DW(Ret),1), day_sum(Ret))(滞后,没有前视);(d) 两种自相关联动:分钟收益自相关与分钟成交量自相关的相关(day_autocorr_n1(Ret) 与 day_autocorr_n1(Volume),订单拆分会同时让两者为正);(e) 与 RV 的联动 ts_corr(DW(Ret), log DW(Vwap)):方差大时弹跳是否更强;(f) 个股相对市场的弹跳状态:对 cs_mean(DW(Ret)) 的 ts_regres 残差再做 EMA(特质弹跳冲击),及同伴内标准化版、状态翻转版;(g) 对照:成交量自相关与成交额的相关(第 12 个种子)等。灵感:本批 B024 与前两批里最好的得分都来自 DW 的离散度 / 慢窗口,说明承重的是 DW 序列随时间的结构而不是水平;前两轮 N 位把联动读在 Vwap 的 RV 上(同步性 / 市场联动),这里换成 Ret 的符号性质(反转 vs 动量),且搭档是成交额 / 收益 / 成交量自相关,不是市场序列。算子怎样实现:全部是 120 或 241 日滚动的 ts_corr / ts_regbeta / ts_regres,外面乘 replace_small_with_nan(is_gt(ListAge, 窗口)) 掩码(ts_corr 对窗内有效点没有最少样本数,新股窗口只有 2 个点时相关系数恰为 ±1,会占满十分位两端);滞后用 ts_delay,没有 ts_shift(那是前视)。与库的区别:这些骨架(ts_corr / ts_regbeta 以 DW(Ret) 或 day_autocorr_n1 为一端、日频成交额 / 收益为另一端、外乘上市掩码)不在两个库里,已逐个核对。样本外为什么还会在:反转 vs 动量的分钟微观结构由市场制度(T+1、涨跌停、做市商缺位、散户订单拆分习惯)和持有人构成决定,是慢属性;联动统计窗口 120 ~ 241 日,换手低;风险我也写在这里:联动可能只是成交额 / 流动性风格的代理(尺子已扣控制的 1 ~ 3 次秩,所以这次看的是风格以外还剩什么),方向我不预设,由 train 选。数学检查:无前视;DW 的分母 Σr² 是分钟收益平方和,涨跌停锁死日分母近 0 时返回缺失而不是 inf(算子对近常数行返回 NaN);ts_corr 对缺失(停牌)成对剔除;种子 13 的 sub(DW(Ret), 2) 只是平移,相关系数不变,仅为可读性,不是数学问题;不使用 2026 年数据。
  inspired_by: B024(第 3 批)与前两批:DW 的承重在序列结构而不在水平;DW(Ret) ≈ 2 - 2×分钟收益一阶自相关(反转 vs 动量),库里只读它的水平外壳,没有读它和成交额 / 收益 / 成交量自相关的联动
