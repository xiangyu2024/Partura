    struck_seeds: []
    reasons: '创新度 3。核心 C = cross_stddev(ts_sum(log(day_durbin_watson(Vwap)), 10), 241) 就是快照 head1(prods2008M1,score -0.09),相关度表里核心对 head1 的原始 |ρ| 为 1.00,所以这一位的起点就是 head1 本身。E 位允许以 head 子树为核心,但新意只能来自外围。外围里真正离开 head1 的是种子 4(ts_delta(C,60),残差 0.24)、5(cross_zscore(C,60),残差 0.14)、11(cs_flip_by_state(C, 市场 20 日收益状态),残差 0.07);种子 6、7、9、10 与 head1 的原始 |ρ| 为 0.49–0.61,仍然大部分是 C 的重新切分(对成交额突发性或另一窗口的秩相减、截面回归残差),所以不给 4。控制:核心对 5 个控制的 |ρ| 为 0.05–0.31(size 最高),低于 0.8;种子 4、5、11 对控制的最高值低于 0.2,种子 6、7、9、10 对控制的最高值不超过 0.17。合理度 4。逐个算子核对:ts_sum 与 ts_delay 都是尾随窗口;log 在 |x|≤EPS 时返回 NaN,day_durbin_watson 在行方差 <1e-8 时返回 NaN,所以常数日(锁死、停牌)是缺失而不是 -inf,PI 的说法成立;DW(Vwap) = Σ(ΔV)²/ΣV² 有界(≤4)且尺度不变。cs_regres / cs_bucket_zscore 只用当天截面;cross_zscore 与 cross_stddev 是按日轴的尾随窗口;cs_flip_by_state 的状态是 cross_mean(day_sum(Ret),20) 的截面均值(_market_series = nanmean)对 241 日尾随中位数,确实是市场状态。需要记下但不足以挡的一点:ts_sum 是 nansum 语义,10 日窗内停牌或锁死日不计入和,和的项数随缺失天数变化,241 日标准差因此部分在读缺失天数。这一点 r2 审计员对 head1 的 R 变体也提过。ListAge>241 的掩码挡不住停牌票;未见它主导截面,按 §4 放行,但 PI 应当测一下 10 日窗内有缺失的 stock-day 比例。如果它有 alpha,最可能来自:突发性(DW 的 241 日离散度)扣掉放量、刻度、状态等机械成分之后剩下的价格路径不确定性,即信息不确定性溢价;其次是 cs_bucket_zscore 与上市龄分组带来的批次同伴结构(这部分种子已被表内划掉,留下的是 cs_regres 与 cs_flip 的残差形式)。表内自动划掉 1、2、3、8、12、13、14(与 head1 原始 |ρ| 0.86–1.00,超过库禁令的 0.7),余 7 个(4、5、6、7、9、10、11),划完仍 ≥4,通过;我不另划。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。N 位的 14 个种子对快照的原始 |ρ| 最大为 0.50(种子 6),其余多数在 0.42 以下;对 head3(ts_quantile_q75(cross_mean(pow_3(sigmoid(pow_2(DW(Ret)))),3),30))的残差最大 0.49。注意:快照里 head3 本身读的就是 DW(Ret),所以「用 DW(Ret)」不是新东西;新的是 DW(Ret) 与成交额、收益、成交量自相关之间的联动(种子 1、3、6、12),以及与昨日收益的错位联动(4、5)和市场弹跳的特质分量(8、9、11)。种子 1 与 3 对的是同一对变量(corr 与 beta 的关系),不是换皮但相关,记为 GP 的冗余风险。控制:14 个种子对 liq 最高 0.39(种子 8),vol 最高 0.33(种子 8),known 最高 0.40(种子 8),没有 ≥0.8 的。种子 13 的 sub(DW,2) 只是平移,ts_corr 不变,是可读性写法,不是数学问题,也不算重复,保留。合理度 4。数学核对:DW(Ret) = Σ(Δr)²/Σr² 有界在 [0,4],分母为零或行方差 <1e-8 时返回 NaN,不会爆点;DW ≈ 2−2ρ1 的读法成立。ts_delay 为滞后,没有前视。ts_regres(x,y,d) 返回 y 对 x 的滚动 OLS 残差(rolling_ols 是 y ~ alpha + beta·x),种子 8 的 ts_regres(cs_mean(DW),DW,241) 正好是个股 DW 去掉市场分量,方向对。ts_regbeta(x,y) 返回 y 对 x 的斜率:种子 3 写的是 ts_regbeta(DW, logAmt),得到的是 logAmt 对 DW 的斜率,与 idea 中「弹跳强度随成交额如何变」的读法方向相反,但这是统计量定义上的反向,符号由 train 选,不算数学问题,PI 在读结果时注意即可。两处风险记下:(a) ts_corr 没有最少样本数,长期停牌的票在 120 日窗口内只剩两三个有效点时相关系数为 ±1,is_gt(ListAge,120) 挡不住停牌,这类票不多,未见主导截面;(b) is_constant 的 1e-8 阈值作用在收益的方差上,是尺度相关的截断,极安静的日子会被判 NaN,属于样本减少而非爆点。如果它有 alpha,最可能来自:有弹跳(负自相关)的票在放量时转为动量型,说明知情交易的量一出来信息就被慢速吸收;或者这些联动只是换手与流动性风格的代理(尺子已扣 1–3 次秩,所以留下的是风格以外的部分)。'
R:
  - head: 'ts_quantile_q75(cross_mean(pow_3(sigmoid(pow_2(day_durbin_watson(Ret)))), 3), 30)'
    soundness: 4
    reasons: '合理度 4。数学:DW(Ret) 在 [0,4],pow_2 ≤ 16,sigmoid 有界,pow_3 ≤ 4096 的上界在 float32 内不溢出;cross_mean(·,3) 与 ts_quantile_q75(·,30) 都是尾随窗口,无前视,无爆点。PI 的拆解说法成立:pow_2、pow_3、sigmoid 都是对 DW 的单调变换,在日度秩下不改变排序,只改变分位数的形状;cross_mean(·,3) 是 3 日平滑。变体 1 与变体 2 在相关度表中数值完全相同(与 head3 的 |ρ| 0.96、残差 0.96、控制值一致),即 ts_quantile_q75(pow_3(sigmoid(pow_2(DW))),30) 与 ts_quantile_q75(DW,30) 基本是同一信号,线性插值的分位数只差非线性变换的插值误差;这是冗余评估,不是数学问题,PI 可以只留其一。变体 5(cross_stddev(DW,241),与 head1 的 |ρ| 0.37)与变体 7(cross_stddev(ts_sum(DW,10),241),与 head1 的 |ρ| 0.54)是 DW(Ret) 的离散度读法,与全流「离散度比水平好」的结论一致。R 组整体合理,保留。'
summary: '槽 a(E)通过:创新 3、合理 4;表内自动划掉 1、2、3、8、12、13、14,余 7 个(4、5、6、7、9、10、11),审计员未另划。核心 C 即 head1(原始 |ρ| 1.00),E 位实质是在 head1 上做残差。槽 b(N)通过:创新 4、合理 4,表内无划掉,14 个全保留。R 组合理度 4,变体 1 与 2 冗余。要点给 PI:(1) 快照 9 个 head 的 score 全为负(最高 -0.09),与 §1「heads 是过了尺子的成员」(≥0.5 为发现)不符,需 PI 说明;(2) 核心 C 的 ts_sum 对缺失日是 nansum 计数,停牌票的项数偏差需要测比例;(3) ts_regbeta(x,y) 返回 y 对 x 的斜率,种子 3 的读法方向与 idea 相反,符号由 train 选,不影响通过。'
