slots:
  - type: E
    core: 'day_durbin_watson(Vwap)'
    hypothesis: >-
      核心 day_durbin_watson(Vwap):未去均值的 Durbin-Watson = Σ(ΔVwap)²/ΣVwap²,即当天 241 根分钟 VWAP 路径的相对已实现方差
      (价格尺度在分子分母里约掉;分钟 VWAP 的 tick 量化与买卖价弹跳会抬高它),每天一个值。本批 18 个候选和 3 个素材 head 全都只读它的「水平」
      (log、ts_sum 10、两三层 cross_fangzheng、241 日窗口);新尺子去掉波动、流动性、20 日反转、Amt 离散度、市值和两个冠军之后,水平版全是负分(−1.35 ~ −2.59),
      因为水平就是波动,已被控制吃掉。批内证据说明承重的不是水平:head3 拆掉内层 cross_fangzheng(= 10 日 mean + std,混进了水平)后从 −2.59 升到 −1.69(+0.91),
      剩下的就是 ts_std(log DW, 40);窗口 20 / 80 的 train / valid 互相翻转(−1.60/−2.11 对 −0.63/−2.30),说明 40 日窗口读的是噪声;head1 把窗口拉到 241 是批里最好(−1.35)。
      我的信念:这个状态变量里被控制吃掉的是水平,可能还剩 alpha 的是它的「时间序列形状」和「与别的日频量的协动」。
      本位的外围就是读这条路径的形状:(1) 偏度 / 上冲下落的不对称(ts_skew、cross_semistd_pos 减 cross_semistd_neg;spike 型对平稳型);
      (2) 持续性(cross_autocorr:噪声底型是个股的持久属性,信息冲击型是瞬时的,两者的定价不同);
      (3) 相对自己一年常态的偏离(cross_ema 快慢差)与相对变异(cross_stddev ÷ cross_mean,即单位波动的波动率的波动);
      (4) 与别的日频量的协动:与 log 成交额的相关 / F 值(信息驱动的粗糙 = 量价同动,噪声驱动的粗糙 = 量价脱钩)、与日内收益的相关(杠杆)、与 |隔夜跳空| 的相关(新闻到达 vs 盘中噪声);
      (5) 同市值同伴内的相对位置(cs_bucket_demean / cs_bucket_zscore,用 LogFloatCap 分桶;控制只扣加性的 1~3 次秩多项式,同伴内相对量是交互项,不在扣除范围),
      以及一个只在小市值尾部做 / 一个排除上市最短 10% 的变体。
      与库的区别:库里 341 条含 day_durbin_watson 的表达式几乎都是用 log / ts_sum / cross_fangzheng / sigmoid / pow_3 / ts_min / cross_max 这类「水平型」算子包它;
      只有个别随机长出来的深层嵌套(不到 4%)把 DW 塞进 cross_corr / ts_regbeta 里,且没有一条是以 Vwap 路径的偏度 / 持续性 / 与成交额或跳空的协动为主体,
      也没有 ts_skew、cross_autocorr、cross_reg_fvalue、cross_semistd_*、cs_bucket_* 作用在它上面(已逐条核对骨架:seeds 的骨架都不在两个库的 5583 条里);
      外围算子集合也全部不同于已见的 {cross_fangzheng, ts_sum, log, ts_std}。
      样本外还会在的理由:形状与协动量是无量纲的比较,不随波动水平漂移;持续性、同伴内相对位置是个股的慢属性(窗口 60~241 日,换手低,15 bp 成本友好);
      对应的文献机制在 2023-08 以前:风险不确定性(vol-of-vol)溢价(Baltussen、van Bekkum、Van der Grient,JFE 2018)、混合分布假说下的量价协动(Clark 1973;Tauchen-Pitts 1983)、
      波动率的杠杆与不对称。预期多数 seeds 与三个素材 head 的 |ρ| 低于 0.7(形状量与水平量的截面相关通常 0.2~0.5)。
