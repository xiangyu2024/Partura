  - head: 'cross_fangzheng(cross_fangzheng(ts_sum(log(day_durbin_watson(Vwap)), 10), 10), 241)'
    why: >-
      cross_fangzheng = mean + std,把「水平」和「离散度」加在一起;loc 拆解:拆掉内层 fangzheng 几乎无损(−1.35 → −1.40),只有最外层 241 日窗口承重(120 / 482 都差 0.6~0.7)。
      变体把 241 日窗口里的 mean 与 std 分开,看承重的是哪一半。
