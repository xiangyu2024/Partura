R:
  - head: 'ts_std(cross_fangzheng(log(day_durbin_watson(Vwap)), 10), 40)'
    why: >-
      烂部件 = 内层 cross_fangzheng(·, 10)(10 日 mean + std,把水平混了进来)和不稳的 40 日窗口。loc 拆解:拆掉内层后 −2.59 → −1.69(+0.91);
      窗口 20 / 80 的 train / valid 互相翻转(40 日读到的是噪声)。变体:拆内层并拉长窗口(40 / 120 / 241),用 EMA(5) 平滑代替 fangzheng,
      以及 loc 已评分的三个邻居(窗口 20 / 80;去掉 log)。
    variants:
      - 'ts_std(log(day_durbin_watson(Vwap)), 40)'
      - 'ts_std(log(day_durbin_watson(Vwap)), 120)'
      - 'ts_std(log(day_durbin_watson(Vwap)), 241)'
      - 'ts_std(cross_ema(log(day_durbin_watson(Vwap)), 5), 120)'
