  - type: N
    hypothesis: >-
      想法:分钟价格路径的粗糙度 = 扩散(真实波动,已被波动控制与冠军吃掉)+ 微观结构噪声(买卖价弹跳、tick 量化,噪声底约与 (tick / 名义价格)² 成正比)。
      噪声占比与名义股价是个股的慢属性,刻画的是「散户主导、最小变动价位占价格比重大、难以套利」,而不是波动:
      (a) 弹跳强度 = DW(Close) 对 DW(Vwap) 的比(取 log 相减):分钟 Close 是该分钟最后一笔,在买卖价之间跳;分钟 Vwap 把该分钟内的成交平均掉,
      所以两条路径共享同一个扩散方差,比值里波动约掉,只剩噪声占比;另一个口径是 5 分钟变化的方差对 1 分钟变化方差的比(方差比,<1 即反转型噪声);
      (b) 名义股价 = LogFloatCap − LogFloatShares(流通市值 ÷ 流通股本;立方体里 Close / Vwap 是后复权价,无法给出名义价格,这两个日频叶子是唯一来源;两个库一个都没用过日频叶子);
      (c) 两者的交互:相对价格隐含的噪声底的「超额粗糙」(cs_regres / cs_bucket_demean)、在最低价 10% 之外做弹跳强度(低价尾部是面值退市线附近的垃圾股)、
      每只股票自己的「粗糙度对价格的弹性」(cross_corr / cross_regbeta:价格下跌时粗糙度是否抬高,抬高 = tick 噪声底支配)。
      灵感来自本批现象:在 B022 里 Vwap→Close 互换对 head1 几乎无影响(−1.35→−1.48),对 head3 变差(−2.59→−3.40);含 Volume 版 DW 的候选均值比含 Vwap 版的低 0.5(不显著),
      说明 DW(Vwap) 读到的不只是波动,价格路径本身的特性在起作用;DW 作用在 Close 与 Vwap 两条路径上的差,就是在把「波动」与「弹跳 / tick 噪声」分开。
      与库的区别:库里 day_durbin_watson 要么单独作用于一条价格 / 量路径(Close / Open 版共 71 条,都是水平型用法),要么外面套水平型算子,
      没有一条把两条价格路径的 DW 相减或相除(仅有 ret 版与成交量版相加的 6 条);
      两个库一条日频叶子都没用过,所以没有任何表达式含 LogFloatCap − LogFloatShares;方差比 div(day_var(in_delta(Vwap,5)), day_var(in_delta(Vwap,1))) 的骨架也不在库里(已逐条核对,seeds 骨架全部不在 5583 条里)。
      与控制的关系:弹跳强度里波动约掉,所以不是波动控制;我预期名义股价与市值控制的秩相关在 0.3~0.5(未核实),和流动性 / 反转 / Amt 离散度更远;预期各控制的 |ρ| 全部低于 0.8。
      样本外还会在的理由:tick 大小是交易所规则(0.01 元固定),噪声占比 / 名义价格是由规则决定的慢变量,不靠某段行情;低价股的彩票偏好与散户占比是 A 股的结构性事实
      (名义价格错觉:Birru-Wang 2016 在美股,A 股低价股同理),弹跳强度对应有效价差的成本溢价(Amihud-Mendelson 1986;Roll 1984),均早于 2023-08。
      这些量变化慢(60~241 日窗口或日频叶子本身),换手低,15 bp 成本下仍可交易。
