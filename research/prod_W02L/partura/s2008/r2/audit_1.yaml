    reasons: '创新度 4。快照 6 个 head 对 N 位的原始 |ρ| 最大为 0.36(种子 1),大多数种子的残差在 0.27 以下;市场 RV 的同步性 ts_corr(L, cs_mean(L)) 不是 head 的换写法(库与快照的骨架核对由流水线做,我没有重算)。扣分的是种子 9–11:它们的残差与 cross_fangzheng(·,241) 系 head 有 0.50–0.53 的重合,vol 控制 |ρ| 为 0.53,这三条的新意打折;整位的主体(种子 1–5、7、8、12、14–16)残差在 0.27 以下,是新的。 合理度 4。无前视:m_t 是当天截面均值,rolling 窗口都是尾随窗口,ts_regres 取窗内最后一天的残差,收盘后算、t+1 交易。逐个核对:ts_regbeta(x, y) 是 y 对 x 的斜率,所以种子 8 是 L 对市场收益、种子 16 是 L 对 m_t,方向正确;ts_regres(m_t, L) 中 x、y 的顺序对种子 10、11 正确。保留两条意见:(a) rolling_pair_reduce 的 count 只 clamp 到 1,没有最少样本数(已核对),长期停牌、窗口内有效点很少的票会取到 ±1 的极端值,而纯多头十分位会把它们买进;覆盖率(约 0.95)看不出这一点。建议加最少有效对数的门槛,但它不主导截面,不挡。(b) 种子 8 与 16 的 beta = ρ·σ_L/σ_m,排名里混进了个股自己的 RV 离散度(与 head1 同族),读数时要区分。 数学问题:种子 6。写法是 cross_mean(mul(is_gt(cs_mean(L), ·), L − cs_mean(L)), 241) 减去同样的 is_lt 版本;非该状态的日子记为 0 后再按窗口有效天数平均,所以结果 = f_H·μ_H − f_L·μ_L(f 为窗内两个状态的天数占比,μ 为状态内 L − m 的均值),不是想法里的 μ_H − μ_L。无状态依赖时它退化为 (f_H − f_L)·μ_i,即窗内相对市场的 RV 水平乘以状态占比的符号,是 RV 水平类信号(与 vol 控制 |ρ| 0.26),不是状态依赖。公式没有实现它的想法,属于定义坏掉,划掉。 重复:种子 13。它与种子 12 的控制谱几乎一样(liq 0.034 / 0.033、vol 0.283 / 0.282、size 0.149 / 0.148、known 0.071 / 0.070),头部残差两条都在 0.002 以内(对 cross_fangzheng(·,241) 为 0.202 / 0.200 与 0.204 / 0.202),只是把 DW(Close) 换成了 std(Ret),划掉并留 12。 放行但需注意:种子 11 与 10 的头部残差几乎相同(0.519 / 0.521),控制谱差 0.02 以内,只差一个 size 分桶;按放行原则保留,PI 若要省预算可以删 11。种子 1 与 3(cs_median 替代 cs_mean)的控制谱差约 0.01、残差 0.208 / 0.209,也是近似重复,但 3 作为稳健对照的用途保留。 如果它有 alpha,最可能来自:个股 RV 与市场 RV 的同步性中、扣掉市值与流动性之后的部分(种子 1、12、14),以及 RV 对市场收益的联动(种子 7、8)。'
R:
  - head: 'cross_stddev(ts_sum(log(day_durbin_watson(Vwap)), 10), 241)'
    soundness: 3
    reasons: '合理度 3。头 1 是快照里分数最好的 head(score -0.09)。它的 ts_sum(log(DW(Vwap)), 10) 用的是 nansum(缺失日不计入),停牌日、EPS 截掉的日子、常数判断为真的日子都不进和,10 日和的项数随缺失天数变化,241 日 std 于是部分在读「10 日里缺了几天」。7 个变体中 1、2、5、6、7 保留 ts_sum,3、4 改用未取对数的 ts_sum(DW, 10),同样有计数效应;所以 R 组拆掉的是外层 std,没有隔离计数效应,回答不了「std 是不是承重部件」。IQR 与半偏差的数学本身正确(cross_quantile_q75 / q25 在 AlphaCube catalog.py 注册为烘焙变体;cross_semistd_* 取的是日对数变化);无前视。判为放行、不判定义坏掉,但建议加一个 ts_mean(log(DW(Vwap)), 10) 的变体,把计数效应单独拿出来。如果它有 alpha,最可能来自计数效应(股价较高的票,锁死日被截掉,10 日和的项数更少),或 RV 序列的上冲与下落不对称。'
summary: '槽 a(E)通过:创新 3、合理 3,表内自动划掉 4、5、14,余 12 个,我未另划。槽 b(N)通过:创新 4、合理 4,划掉 6(公式错)与 13(与 12 重复),余 14 个。R 合理 3。要点:核心 C 与 head1 的原始 |ρ| 为 0.74,E 位只能在 head1 邻域里找残差;flip 种子的 0.05 是符号相消;两处 DW 数值问题(log 的 EPS 与 float32 的常数判断)建议 PI 在合成前核对。'
