    reasons: '创新度 3。核心 C = cross_stddev(log(day_durbin_watson(Vwap)), 120) 在 loc 共性表第 22 行,是合法的 E 核心;但它与快照 head1 ts_std(log(DW(Vwap)), 40) 的原始 |ρ| 为 0.738(残差 0.636),已超过库禁令的 0.7,所以 E 位的每个候选都要靠外围把与 head1 的相关压下来,这一位实际是在 head1 的邻域里找残差。核心与 5 个控制的 |ρ| 为 liq 0.13、vol 0.14、rev 0.04、known 0.14、size 0.32,都小于 0.8,核心检查通过。外围中的同伴分桶与回归(种子 1–6、13、14)原始 |ρ| 为 0.60–0.70、残差 0.49–0.64,仍在 head1 的邻域内;只有种子 7–10、12、15(Close 路径突发、成交量突发、半偏差、状态翻转、二阶标准化)离 head1 较远(原始 |ρ| 0.05–0.46),所以给 3 而不是 4。 合理度 3。无前视:cross_stddev、cs_bucket_zscore、cs_regres、cross_ema、cross_zscore、ts_delta 都只用当天截面或尾随窗口。cs_flip_by_state 的 g 写成逐票 cross_mean(·,20),算子内部 _market_series 再取截面均值(partura/ops_ext.py:562),与想法的「市场状态」一致;前 241 日的状态秩是扩张窗口,2018 年的符号偏噪,但不主导。cs_bucket_zscore 与 cs_flip_by_state 用的是 _pct_rank(缺失留空、不记为 0),不涉及 §4 的 nanrank 陷阱。种子 3 的 LimitWidth 只有 3 个取值,十分位基本按(板块,列序)切块,按 §4 列序打破并列是允许的。两处数值问题 PI 需要在合成前核对,但都不足以挡:(a) AlphaCube operators/common.py 的 log 在 |x| ≤ EPS = 1e-9 时返回 NaN;一个最小价位的单步跳动使 DW 约为 4e-7/P²,股价 P 约 20 元以上时落到 EPS 以下,于是锁死日对高价票被截掉、对低价票取到约 -19。C 的 120 日 std 因此带有股价档位的成分,这可能是核心与市值 0.32 相关的一部分。(b) day_durbin_watson(dt_day.py)的常数判断 var<1e-8 是用 E[x²]−E[x]² 算的;store 是 float32,价格 10 元量级时舍入误差约 1e-5,远大于阈值,近锁死日是否变成 NaN 取决于舍入。合成立方体上的检查抓不到这两点。种子 1、10 按名义价格分桶,能部分扣掉 (a) 的价位成分,读数时要单独看。cs_regres 的 X 是未排秩的右偏量(种子 5、6、7、12、15),斜率可能由少数票决定,合成前核对。表内自动划掉 4、5、14(|ρ| 0.704 / 0.705 / 0.717 ≥ 0.7);4 与 5 的控制谱与残差几乎相同(残差 0.636 / 0.637),是同一个操作的两种写法。种子 8、9 的 |ρ| 只有 0.05,这是 pair_rank_corr(diagnose.py:341,逐日秩相关的平均)的符号相消,不是新意的证据;我没有划掉它们,因为它们既不是数学问题也不与其他种子重复。其余种子没有数学问题或重复。如果它有 alpha,最可能来自:把 C 中的股价档位与流通结构扣掉之后剩下的突发性(种子 1、2、10),以及在市场 RV 高低两种状态下符号相反的那部分(种子 8、9)。'
