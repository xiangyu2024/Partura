- type: N
  hypothesis: '想法:把 RV 放进「相对市场」的框架里读。个股当天分钟 VWAP 路径的相对已实现方差 log DW(Vwap)(下记 L)可以拆成「全市场一起动的部分」(当天全市场 L 的截面均值 m_t = cs_mean(L))和「自己的部分」。这一批(以及整个库)只读 L 的总量:水平、均值加标准差、各种窗口的平滑,没有一条读「这只股票的 RV 怎样跟着市场 RV 动」。两种读法在文献里对应不同的价格:(1) 对系统性波动变化的暴露(Ang–Hodrick–Xing–Zhang 2006:对市场波动冲击越敏感的票平均回报越低);(2) 同步性 / 共同性(Morck–Yeung–Yu 2000 的收益同步性;Chordia–Roll–Subrahmanyam 2000 与 Hasbrouck–Seppi 2001 的流动性 / 订单流共同性):RV 跟着市场走的票主要被指数 / 机构篮子 / 融资盘这类共同持有人驱动,RV 与市场脱钩的票由个股消息与散户关注驱动,两类票的定价不同。它不是波动水平:相关系数无量纲,与 L 的水平和单只票的刻度无关。

    灵感:本流 B022 / B023 的 R 组与 loc 的拆解显示,承重的是 RV 序列的离散度而不是水平(只留 std -0.09、只留 mean -2.61),价格路径换成 Close 无损(-0.00)。离散度 = 市场共同起伏 + 个股自己的起伏;E 位在扣第二部分,这个位直接读第一部分与两部分的关系,并把读法换到别的状态变量(Close 路径、std(Ret)、成交额)上看是不是 RV 特有。


    算子怎样实现:全部是慢变量,窗口 120 / 241 日。(a) 同步性:ts_corr(L, cs_mean(L), 241)(及 120 日、市场用截面中位数 cs_median 的稳健版);(b) 同伴内版本:同步性在市值分位内 / 在自己 RV 基线分位内标准化 cs_bucket_zscore;(c) 状态依赖:在「当天市场 L 高于自己 241 日均值」的日子里个股相对市场的 L(L - m_t)的均值,减去「低于」的日子里的均值,读 RV 的周期性(进入动荡时比市场抬得更多还是更少);(d) 与市场方向的联动:ts_corr / ts_regbeta(L, 当天全市场等权日收益 cs_mean(day_sum(Ret)))(RV 在市场下跌日抬高的票 = 暴露在崩盘波动上);(e) 相对自己历史:L 的 10 日 EMA 对 241 日窗口的 z 分数,减去同一量的截面均值(自己的波动状态相对自己常态,再减去市场的);(f) 特质 RV 冲击:ts_regres(m_t, L, 241) 的最后一天残差再取 20 日 EMA(去掉市场部分后最近一个月的异常 RV);(g) 对照:同样的同步性换到 DW(Close)、std(Ret)、log 成交额上,以及 RV 同步性减去成交额同步性,看是 RV 特有还是任何量的同步性都一样;AHXZ 的字面写法(ts_regbeta(m_t, L, 241))留 1 条。全部种子外面都乘 M = replace_small_with_nan(is_gt(ListAge, 241))(120 日窗口的种子用 120):ts_corr / ts_regbeta 对窗内有效点没有最少样本数(核对过 rolling_pair_reduce),新股窗口只有 2 个点时相关系数恰为 ±1,会占满十分位两端。


    与库 / 快照的区别:两个库 5583 条里,把 cs_mean / cs_median 作为 ts_corr / ts_regbeta / cross_corr 搭档的只有 1 条(ts_pearson(cs_mean(·), 20)),且作用在价格分位上,不是 RV;含 cs_mean / cs_median 的共 61 条里,22 条把它当 is_gt / is_lt 的阈值,39 条是对全市场序列本身再做时序统计,都不是「个股量 × 市场量」的联动统计。快照里 6 个 head 都是 L 这一条路径自己的水平 / 离散度 / hurst 统计。也没有一条含 ListAge 掩码、cross_zscore 或 cross_ema。16 个种子的骨架互不相同、都不在库里(已解析核对)。预期种子与 6 个 head 的 |ρ| 在 0.1 ~ 0.5,与控制的 |ρ|:同步性类与市值 / 流动性 0.3 ~ 0.6(指数成分 / 大市值票同步性高),都低于 0.8。


    样本外为什么还会在:联动结构取决于持有人构成(指数与机构 / 融资盘 / 散户)与 T+1、涨跌停制度,是慢变量;窗口 120 ~ 241 日,换手低,15 bp 可承受;AHXZ 与同步性文献都在 2023-08 以前。风险我也写在这里:同步性可能只是市值 / 流动性风格的代理(旧研究 C01 的价格同步性族在风格中性化后几乎消失);尺子已把市值与流动性的 1 ~ 3 次秩多项式扣掉,所以这一次是直接看风格以外还剩什么;多空方向我不预设,由 train 选。


    数学检查:(a) 无前视:m_t 用当天截面(t 日收盘已知),所有窗口为尾随窗口,ts_regres 返回窗口最后一天的残差(用到窗内含当天的数据,没有未来);t 日收盘后算、t+1 交易。(b) 数值:L 是对 DW 取对数,DW 分母远大于 1e-8、常数行为缺失,所以不会有 -inf;m_t 是约 5000 只票的均值,近常数日的极端值被稀释;ts_corr 在某只票 L 为缺失(停牌)的日子成对剔除;cs_median 版是稳健对照。(c) 定义:ListAge 掩码避免热身期决定结果;市场用全 A 等权,小市值占主导,这是口径选择。已在合成立方体上把 16 个种子全部算过:都能算、无 inf、每日取值离散度 1.0。没有使用任何 2026 年数据。'
