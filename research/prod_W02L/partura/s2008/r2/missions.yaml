  hypothesis: '核心 C = cross_stddev(log(day_durbin_watson(Vwap)), 120):个股「当天分钟 VWAP 路径的相对已实现方差(DW 未去均值 = Σ(ΔVwap)²/ΣVwap²,价格尺度约掉)」取对数后,在最近 120 个交易日里的标准差,即方差的方差(vol-of-vol,「波动的突发性」)。

    证据(本流快照与第 1 轮结果,全是 train / valid):(1) 第 1 轮 R 组的「均值对离散度」对照:同一条 241 日线,只留离散度 cross_stddev(ts_sum(log DW, 10), 241) 得 -0.09(train -0.07 / valid -0.09,现在是本流最好的 head),只留均值 cross_mean(ts_sum(log DW, 10), 241) 得 -2.61,差 2.5;拆掉 ts_sum 的 cross_stddev(log DW, 241) 为 -0.93;loc 里 Vwap 换成 Close 几乎无损(-0.00),窗口 120 / 482 变差。承重的是「RV 这条序列的离散度」,不是价格路径,也不是水平。(2) 共性表里含 C 的 10 个已评分候选均值 -1.53,不含的 -2.15(差 +0.64,p 0.051)。(3) 相关度表里这类离散度与波动 / 流动性 / 20 日反转 / 已知族 / 市值五个控制的 |ρ| 只有 0.04 ~ 0.34,尺子没有把它吃掉;它在 train / valid 都接近 0,更像是被「混进来的别的东西」稀释了。混进来的东西有四种:(a) 静态属性:价格档位 / 流通比例 / 板块 / 上市批次不同的票 RV 的刻度不同,低价股的买卖价弹跳噪声底 ∝ (tick / 名义价格)²,噪声占比的波动也进了 std;(b) 全市场一起的波动起伏(2018、2020-02、2024-09),暴露度不同的票 std 被系统性拉开;(c) 成交量自己的突发(放量带动价格方差一起突发,这是「信息驱动」,不是价格自身的不稳);(d) 最近一个月的突发(与 20 日反转 / 波动控制相邻的短期成分)。第 1 轮 E 位唯一明显有用的外围就是同市值分位内标准化(cs_bucket_zscore(C, LogFloatCap) -0.73,两层嵌套 -0.06),说明「把 C 里不属于价格自身突发的成分扣掉」这条路是通的。本位的押注就是把这些成分一个一个扣掉,看剩下的纯价格突发有没有 alpha。


    算子怎样实现:15 个种子全部原样含 C,外面都乘 M = replace_small_with_nan(is_gt(ListAge, 120))(上市不满 120 个交易日置缺失:cross_stddev 在窗口未填满时用几个点估计,新股会占据十分位两端)。分四族:(A) 同伴内标准化 cs_bucket_zscore(C, X),X = 名义价格 LogFloatCap - LogFloatShares、流通比例 LogFloatCap - LogTotalCap、LimitWidth(板块;并列按列序打破,列序 = 交易所与代码段 ≈ 上市批次)、自己的 RV 基线水平 cross_mean(log DW, 120)、成交额水平、过去 120 日涨幅(Zhang 2006:信息不确定性在赢家 / 输家里作用方向相反);(B) 回归扣除 cs_regres(C, Z),Z = RV 基线水平、成交量的突发 cross_stddev(log(day_sum(Volume)), 120)、Close 路径的突发 cross_stddev(log DW(Close), 120)(Close 比 Vwap 多一份弹跳噪声,残差 = 去掉噪声后的真实方差突发)、近 20 日突发(留下 120 日尺度的 regime 性)、DW 日度变化的下半偏差 cross_semistd_neg(DW, 120)(留下上冲型突发);(C) 市场状态翻转 cs_flip_by_state(C, g),g = 20 日平均 log RV 的截面均值(市场波动状态)或 20 日平均 log 成交额(市场活跃状态):状态高于过去 241 日中位数取 +,否则取 -,检验「突发性溢价的符号随市场不确定性变化」(Baltussen–van Bekkum–Van der Grient 2018;Huang–Schlag–Shaliastovich–Thimme 2019);翻转只改变截面秩的符号,换手只在状态翻转的几天发生;(D) 二阶 / 平滑:价格档位版的「同伴内标准化 → 120 日 std → 再标准化」(第 1 轮 -0.06 写法的价格档位版)、同伴内标准化后再取 120 日均值(更慢,降换手)。


    与库 / 快照的区别:第 1 轮 E 位的 16 个种子与 loc 列出的 5 个最好候选里,C 的外围只有 cs_bucket_zscore / cs_bucket_demean / cs_first_low20 配 LogFloatCap 的同伴分组(单层与双层)、cross_corr(DW, log DW 或 log 市值)与 ts / cross 平滑;没有 cs_regres、cs_flip_by_state,也没有价格 / 流通比例 / 涨幅 / 成交额 / 基线 RV 作为同伴分组,没有 Close 路径、成交量突发、半偏差作为被扣除项。两个库 5583 条表达式里没有一条含 LogFloatCap / LimitWidth / ListAge / cs_bucket_* / cs_flip_by_state,cs_regres 在库里 72 条都是随机深树里的偶然用法,没有一条拿它扣 RV 的突发;15 个种子的骨架互不相同,也不在库的骨架集里(已解析并逐条核对)。


    样本外为什么还会在:突发性是个股信息流与参与者构成的慢属性(120 日窗口,换手低,15 bp 下可交易);同伴内标准化 / 回归扣除去掉的是机械成分,剩下的价格自身突发对应被定价的信息不确定性(文献全在 2023-08 以前);尺子只扣控制秩的 1 ~ 3 次多项式,同伴内相对量、回归残差、状态翻转都是交互项,不在被扣掉的范围里,所以 train / valid 都接近 0 的 C 有可能在去掉混入成分之后露出来。我预期的是「接近 0 的变成略正」,不是大幅越线。


    数学检查:(a) 无前视:窗口全是尾随窗口;cs_bucket_zscore / cs_regres 只用当天截面;cs_flip_by_state 的状态是当天截面均值对自己过去 241 日中位数(含当天,但当天收盘已知),t 日收盘后算、t+1 交易。(b) 数值:DW 的分母 ΣP² 远大于 1e-8,常数行返回缺失而不是 inf;近常数日(涨跌停锁死)DW 极小、log 很负,会抬高 std 的左尾,这是真实的「几乎不动」信息;R 组的稳健离散度变体专门检验它是否在主导。除 LimitWidth 外所有同伴变量都是连续量;LimitWidth 只有三个取值,并列由列序打破,是板块 / 上市批次分组,不是常数面板。已在合成立方体上把 15 个种子全部算过:都能算、无 inf。没有使用任何 2026 年数据。'
