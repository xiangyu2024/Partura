- type: N
  hypothesis: '想法:尾盘最后一根 Amt 的「突发度」—— 被动 / 机构资金在收盘集合竞价里成交的事件指纹。读它相对自己常态的峰值(burst)、两端(收盘 vs 开盘)峰值之差、和分布形状,不读水平。


    来源(批里的现象):B112 里唯一 train 为正的 head 是 ts_max(ts_max(log(cross_regbeta(day_last(Amt), day_open(Amt), 10)), 20), 50)(score −0.43,train +0.11 / valid −0.43)。它的拆解给出四个事实:(1) 把 cross_regbeta 整个敲掉,只剩 ts_max(ts_max(log(day_last(Amt)), 20), 50),分数不变(−0.43 对 −0.43,必要性 +0.00;这个变体 train −0.43 / valid −0.28);而 day_last(Amt) 单独是 −3.83(train −3.16 / valid −3.83)。(2) 外层窗口 50 → 100,train +0.11 → +0.38,valid −0.43 → −0.53;50 → 25 两段都变差(−0.15 / −0.59)。(3) Amt → Volume 互换几乎无影响(−0.50)。(4) 敲掉 log,train +0.29 / valid −0.73。所以承重的不是回归斜率,而是「最后一根 Amt 在 70 日窗口里的峰值」这个慢状态,加上对重尾的压缩。另外要注意:AlphaCube 的 log 是 log(|x|)(|x| ≤ EPS 为缺失),cross_regbeta 在 10 日窗口里除以最后一根 Amt 的方差,方差接近 0 时斜率会爆点 —— 所以 head 读到的是「斜率绝对值的 70 日峰值」,一部分是爆点。这也是我不拿这个斜率做 E 的核心的原因(E 的候选必须原样带着它),而改用 N,把斜率里承重的部分单独写出来。


    机制:15:00 那根分钟线含收盘集合竞价(14:57 ~ 15:00 撮合),指数 / ETF / 量化 / 机构的「收盘价成交」集中在这里;指数调样、MSCI / 富时 / 中证定期调整日、ETF 申赎、大宗交易会让它在一天内放大数倍,散户主导的开盘竞价(day_open(Amt))则是另一端。单位自身常态的峰值(burst)是被动与机构需求事件的指纹;60 ~ 120 日窗口正好覆盖季度 / 半年度的调整周期,事件有记忆而不是单日噪声,所以才会出现「窗口越长 train 越好」。


    算子怎样实现(14 个种子,L = day_last(Amt)、O = day_open(Amt)、T = day_sum(Amt)):

    (1) 种子 1、10:峰值 / 常态 —— cross_max(L, 70) ÷ cross_mean(L, 70);峰值 ÷(60 日均值 + 1)的 70 日最大。无量纲,流动性水平约掉(控制能拿走的只剩与波动 / 换手的残余关系)。

    (2) 种子 2、14:cross_zscore(L, 120) 的 60 日最大;cross_madz(log(L + 1), 60) 的 EMA(半衰期 20)—— 用标准差 / MAD 为单位的突发。

    (3) 种子 3、4:收盘占比 L ÷ T 的 70 日峰值减均值;120 日上四分位尾部均值 —— 占比是自身流动性已标准化的量。

    (4) 种子 5、6:两端峰值之差 cross_max(log(L + 1), 70) − cross_max(log(O + 1), 70)(机构收盘端 vs 散户开盘端,水平约掉);同一个峰值在 LogFloatCap 十分位桶内去均值(同市值同伴内的相对量,是交互项)。

    (5) 种子 7 ~ 9:cross_stddev(log(L + 1), 60)、一阶自相关、120 日四分位比(log 相减)—— 收盘端的变化性 / 持续性 / 分布宽度。

    (6) 种子 11 ~ 13:把 head 里承重的斜率换成有界形式 —— 斜率的截面秩的 120 日均值、秩的 60 日 EMA(不受爆点支配)、L 与 O 的 60 日相关(无量纲)。


    和库里已有的不同:两个库里 day_last(Amt) 出现 120 次,都是作为叶子进复杂树(例:ts_stddev(cross_fangzheng(ts_regalpha(log(day_sum(Amt)), neg(day_last(Amt)), 10), 241), 5)、cross_max(cross_max(mul(day_close(Amt), …), 5), 5))或与别的量做相关 / 回归;cross_tail_mean_*、cross_madz、cross_zscore 在库里 0 次;没有一条在「峰值 ÷ 常态」「收盘端峰值 − 开盘端峰值」「收盘占比的尾部均值」上。W01 的 head 里有 cs_bucket_demean(开盘占比均值 − 收盘占比均值, LogFloatCap) 与 cs_bucket_zscore(cross_mean(尾盘 30 分钟占比, 20), …) 这类水平 / 均值版,这里读的是峰值与尾部。14 个种子的骨架(去窗口 / 常数 / 字段)我用库的 skeleton_key 对照过 4100 个不同骨架,都不在其中。


    为什么样本外还会在:来源是制度性的 —— 指数 / ETF 的定期调整日历、被动资金占比的结构性增长(2018 年起北向、公募、ETF 规模持续增大),不依赖某段行情;事件有 1 ~ 2 个季度的记忆,换手低。预期并不高:该 head 的 valid 比 train 差,我预期好的种子是 train 与 valid 都在 −0.5 附近,而不是越线。若把峰值换成 burst 之后分数反而比 head 差,说明 head 读到的是流动性水平(被控制拿走),下一轮就不再押收盘端。


    数学检查:(a) 无前视:全部是尾随窗口;t 日收盘后算、t+1 才交易(最后一根 Amt 是 15:00 那一根,当日收盘即已知)。(b) 数值:除法的分母是 cross_mean(L, w)(任一天 > 0 则为正;窗内全为 0 时得到 0 / 0 = 缺失,不会 inf)、T(停牌日 0 / 0 = 缺失);log 的自变量都 +1(Amt 单位是元,+1 可忽略);cross_zscore 分母带 EPS,常数序列得 0;种子 11、12 用 cs_rank 包住斜率,爆点只影响序而不影响量。(c) 定义:day_last 取最后一个非缺失分钟;若无成交分钟是缺失而不是 0,个别冷门股的「最后一根」会是更早的分钟,但比值型种子读的是「最后一笔相对自己常态的突发」,不依赖它恰好是 15:00;两个交易所收盘集合竞价制度的起始时点并不同步(我没有核实具体日期),早期样本里的水平差异在比值型种子里被自身常态约掉,水平型种子(5、6 的差)只在同一只股票内做差。本机用合成立方体把 14 个种子全算了一遍:都能算、无 inf、覆盖 0.89 ~ 0.98(最低的是 120 日 MAD 窗口在 320 日样本里的暖机)。没有用任何 2026 年数据。'
