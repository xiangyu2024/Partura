R:
- head: ts_max(ts_max(log(cross_regbeta(day_last(Amt), day_open(Amt), 10)), 20), 50)
  why: 拆解显示:cross_regbeta 本身没有必要(敲掉后分数不变 −0.43 对 −0.43),而它在 10 日窗口里除以最后一根 Amt 的方差,方差接近 0 时斜率爆点,log 又是 log(|x|),所以读到的一部分是爆点;内层 ts_max(…,20) 也没有必要(敲掉 −0.42)。变体:(1) 回归窗口 10 → 20 降噪;(2) 换成无量纲的 cross_corr;(3) 在对数上做回归(弹性,不爆点);(4) 先 5 日均值再取 70 日最大(压住单日尖刺);(5) 外面套半衰期 10 的 EMA(降换手);(6) 用 20 日最大的 50 日均值代替嵌套最大;(7) 用上四分位尾部均值代替最大值。
  variants:
  - ts_max(ts_max(log(cross_regbeta(day_last(Amt), day_open(Amt), 20)), 20), 50)
  - ts_max(ts_max(cross_corr(day_last(Amt), day_open(Amt), 10), 20), 50)
  - ts_max(ts_max(cross_regbeta(log(add(day_last(Amt), 1)), log(add(day_open(Amt), 1)), 10), 20), 50)
  - ts_max(cross_mean(log(cross_regbeta(day_last(Amt), day_open(Amt), 10)), 5), 70)
  - cross_ema(ts_max(ts_max(log(cross_regbeta(day_last(Amt), day_open(Amt), 10)), 20), 50), 10)
  - cross_mean(ts_max(log(cross_regbeta(day_last(Amt), day_open(Amt), 10)), 20), 50)
  - cross_tail_mean_q75(log(cross_regbeta(day_last(Amt), day_open(Amt), 10)), 70)
- head: ts_decay_linear(day_open(Volume), 5)
  why: ts_decay_linear(day_open(Volume), 5) 读的是竞价成交股数的水平,被股价与流通股本的量纲压着(Volume 以股计,不同价位不可比);window 2 / 10 的拆解几乎不变(−1.18 / −1.24),说明承重的是 day_open(Volume) 的水平本身,而不是衰减窗口。变体改成无量纲的:竞价占全天比、竞价量 ÷ 流通股数(对数相减)、60 日 z 分数、截面秩、对数。
  variants:
  - ts_decay_linear(div(day_open(Volume), add(day_sum(Volume), 1)), 5)
  - ts_decay_linear(sub(log(add(day_open(Volume), 1)), LogFloatShares), 5)
  - ts_decay_linear(cross_zscore(day_open(Volume), 60), 5)
  - ts_decay_linear(cs_rank(day_open(Volume)), 5)
  - ts_decay_linear(log(add(day_open(Volume), 1)), 5)
- head: signedpower(day_open(Amt))
  why: signedpower(day_open(Amt)) 对正数是单调变换(秩上等同 day_open(Amt) 本身,sufficiency 与 head 同为 −1.30),所以 signedpower 是烂部件;水平被流动性控制拿走。变体:除以 20 日均成交额(竞价强度)、60 日 z 分数、对数竞价额 − LogFloatCap(竞价换手)。
  variants:
  - signedpower(div(day_open(Amt), add(cross_mean(day_sum(Amt), 20), 1)))
  - cross_zscore(day_open(Amt), 60)
  - sub(log(add(day_open(Amt), 1)), LogFloatCap)
