- type: N
  hypothesis: '想法:把「后复权价格」里被库当成水平读的那一块拆开,只读其中的累计复权因子 F 的变化 —— 每只股票过去 1~3 年实际派出去的现金分红与送转股,以及扣掉同期流通股增发 / 解禁摊薄之后的净股东回报(net payout)。


    来源(批里的现象):B112 的 41 条成员全是 day_open(价格叶子)(9:30 竞价分钟;High / Low / Vwap 在该分钟是同一个价,所以批里 day_open(High)、day_open(Vwap)、pow_2(day_open(Low))、neg(day_open(High)) 的库内 train 统计逐位相同),再套 pow_2 / sigmoid / cross_sum(3) / cross_delta(15) 这类单调或短窗变形。规则 §4 已写明后复权价的截面排序约等于从基期起的累计收益,所以这一批读的其实只有一个量:竞价价格的后复权水平(= 基期价 × 终身总回报)。新尺子去掉 5 个控制和两个冠军之后它们全是负分(批内最好 −0.43,其余多在 −1 以下),而且没有一条把后复权价与名义价格放在一起看。


    事实依据(文档,不是我的猜测):AlphaCube docs/steering_and_daily_fields.md §1.4 写明 Close 是后复权价,FloatCap = circulating_market_value、FloatShares = circulating_capital(股数),例:000001.SZ 在 2026-09-16 约 11.70 元/股,即 FloatCap / FloatShares 是名义价格。所以 LogFloatCap − LogFloatShares = log 名义收盘价,而 G = log(day_last(Close)) − (LogFloatCap − LogFloatShares) = log F(t):F 只在除权除息日跳升(现金分红按 P_前收 / P_除权参考价,送转股按 1 + 送转比例),其余日子不变,里面没有任何价格涨跌。我对两个库的 5583 条表达式逐条数过:LogFloatCap、LogFloatShares、LogTotalCap、FloatCap 一共出现 0 次,所以 G 是库没有读过的变量。


    算子怎样实现(14 个种子):

    (1) 种子 1、2:S10 = cross_mean(G, 10)(10 日均值压住 FloatCap 与后复权收盘取价时点不一致带来的噪声),再减它在 241 / 482 个交易日窗口内的最小值 cross_min(S10, w)。F 近似单调,窗内最小值就是窗口起点的水平,差 = 窗口内累计分红送转(trailing payout);窗口在样本起点不满时用已有历史,不产生缺失。

    (2) 种子 3:cross_stddev(S10 的日差, 482) —— 除权除息跳升的大小与频率(F 的「跳跃度」),连续量,不依赖窗口起点。种子 4:净股东回报 = 种子 1 减去同期 LogFloatShares 的增长(同样的 10 日均值 − 窗内最小值);送转股在 G 与 LogFloatShares 两边按同一比例抵消,剩下的是 现金分红 − 净增发 / 解禁摊薄 / 回购注销,即流通股口径的净股东回报。种子 5:只取 −(LogFloatShares 的 241 日增长),即净发行异象的单独读法,用来分开「分红」与「摊薄」两半各自有没有分数。

    (3) 种子 6 ~ 8、14:时间平滑形式 —— 种子 1 的 120 日均值、种子 4 的半衰期 60 EMA、种子 1 的截面秩 60 日均值、种子 4 的 482 日版截面秩 30 日 EMA(换手更低,也不让个别除权日支配排序)。

    (4) 种子 9、10、13:cs_bucket_zscore / cs_bucket_demean 以 LogFloatCap 十分位分桶 —— 同市值同伴内的相对回报,是交互项,新尺子只扣市值秩的 1~3 次多项式,扣不掉同伴内相对量。

    (5) 种子 11:除以 cross_mean(day_std(Ret), 60) + 0.0002 —— 每单位波动的分红(分钟收益 std 量级约 1e-3,常数不会压住分母)。

    (6) 种子 12:S10 本身(从基期起的累计复权,「寿命」口径),作对照。


    和库里已有的不同:库里读价格叶子的都是水平 / 短差分;读日频叶子的 0 条。这里的 F 是(后复权价 ÷ 名义价)的比,价格涨跌在比值里约掉,只剩公司行为。它也不是 W01 已有 head 的换写法:W01 的 head 里 LogFloatShares 出现在阶跃筛子(cs_first_* 以 ts_delta(LogFloatShares, 20 / 60) 的秩作增发 / 解禁筛)、名义价格 sub(LogFloatCap, LogFloatShares) 的分桶与筛子、以及 cs_regres 里的相加项;没有一条把名义价与后复权价相减得到累计复权因子,也没有 cross_min / 窗内差这类对分红送转的读法。


    为什么有 alpha 且样本外还会在:(a) 现金分红与送转是管理层的可信承诺,发出去就收不回(Miller–Rock 1985 的分红信号);持续高分红 + 低净增发的股票对应较好的盈余质量与较少的股权摊薄(Boudoukh et al. 2007 的 net payout yield;Pontiff–Woodgate 2008 的净发行异象:增发多的后续收益低)。(b) A 股 2018 年起监管持续推动现金分红与回购(分红与再融资挂钩的制度),且流通股增发 / 解禁有可预期的供给压力,这两股力量在 train 和 valid 两段都存在,不依赖某段行情。(c) 变量慢(窗口 241 ~ 482 日,外加 120 日平滑),15 bp 成本下换手低。预期并不高:分红强度与低波动、大市值、低换手相关,新尺子会扣掉其中大部分,我预期它是「离线更近」而不是越线。


    数学检查:(a) 无前视:G 用 t 日的后复权收盘与 t 日的名义收盘(FloatCap / FloatShares 同为收盘口径),窗口全是尾随窗口,t 日收盘后算、t+1 才交易。(b) 数值:除法只在种子 11(分母约 1e-3,另加 0.0002),其余全是加减,无除零、无爆点;种子 11 的 cross_mean(day_std(Ret), 60) 窗口在样本首日不满,但不为 0。(c) 离散度:不分红的股票在 241 日窗口里 G 差为 0,会并列,但 241 / 482 日窗口里分红股占大多数,并列的是少数(只有 120 日以下的窗口才会让并列占多数,所以我没有放短窗口 / 事件计数)。(d) 定义:若 FloatCap 的取价时点与后复权收盘有一天的错位,G 会带一点日内噪声,10 日均值已压低;极端情况下(数据源完全不一致)读到的是噪声,种子会得到接近 0 的分数而不是错的方向。没有用任何 2026 年数据,本机只用合成立方体(80 只 × 320 日 × 241 分钟,含 FloatCap / TotalCap / FloatShares)把 14 个种子全算了一遍:都能算、无 inf,每日取值离散度 0.93 ~ 1.00(只是检查运行时错误,不是任何分数)。'
