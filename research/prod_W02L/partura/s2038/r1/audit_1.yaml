slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '数学与定义:G = log(day_last(Close)) - (LogFloatCap - LogFloatShares) 就是后复权累计因子 log F。docs/steering_and_daily_fields.md §1.4 写明 Close 是后复权的、FloatCap 读 circulating_market_value、FloatShares 读 circulating_capital,所以 FloatCap/FloatShares 是不复权名义价,相减得 log F,只在除权除息与送转日跳升。全部是尾随窗口,无前视。唯一的除法(种子 11)分母是 cross_mean(day_std(Ret),60)+0.0002,有正下限,无除零。cs_rank 对缺失保持 NaN,不触发 nanrank_last 的 0 填充陷阱。相关度表:种子 1-11、14 对三个 head 的原始 |ρ| 在 0.10-0.17;种子 12 与 ts_decay_linear(day_open(Volume),5) 原始 0.40、残差 0.37;种子 13 原始 0.24、残差 0.37。对 5 个控制:种子 12 的 size 0.45 最高,种子 11 的 vol 0.30,其余 ≤0.22。创新度:inputs/libs_train.csv 共 5598 行(L 1392 + X 4206),其中 LogFloatCap、LogFloatShares、LogTotalCap、FloatCap、FloatShares 合计出现 0 次,与笔记一致(已核对)。W01 检查 head 3 只把 LogFloatCap 与 LogFloatShares 的组合当分桶键,没有读收盘价与名义价之差。W01 的 head 不在相关度表里,我只做了文本核对,没有算 ρ。信息源是新的,机制(分红、送转、增发)属已知族,所以给 4 不给 5。不构成挡的理由但需注意:(a) 241 / 482 日窗口在 2018 年起始段是部分窗口(cross_min 取的是 2018-01-02 以来的最小值),482 窗的种子 2、3、10、14 头两年受影响,但不是主导。(b) 种子 5 的「净发行」标签不干净:LogFloatShares 的增长含送转股,而 G 在种子 4、10、14 里与它抵消,种子 5 没有抵消,等于惩罚送转。(c) 种子 12、13 用的是 G 的水平(自厂商复权基期起的累计),依赖复权基期,基本是 size 的代理,保留为 PI 的对照。(d) 种子 1、2、4、6、7、8、10、14 都是同一个「S10 减窗内最小值」的变体(窗长、平滑、截面秩、分桶),组内近似重复多。组内两两 ρ 不在相关度表里,按规则只能以数学问题或重复划掉,我没有算组内 ρ,所以不划。(e) corr_1.json 的 distinct 字段(我理解为截面不同值占比)显示种子 1、2、5 分别为 0.74、0.82、0.54,零分红或零增发的票在截面上并列、按列序打破。规则上不是问题,但种子 5 近一半截面并列,分数可能含板块效应。(f) 数据检查建议:在 train 上核对 G 的日跳变是否与除权日对齐;若 circulating_market_value 与 circulating_capital 的时点不一致,增发日会出现假跳变。计划里引用的一个 2026 年个股价格示例未用于判断。如果它有 alpha,最可能来自分红与送转的公司行为(高送转与现金分红的信号),以及增发与解禁的供给压力(净发行异象),而不是价格水平或流动性。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [5]
    reasons: '数学:无数学问题。没有 ts_rank、cross_rank、in_rank_rolling,nanrank_last 的 0 填充陷阱不触发;cs_rank 对缺失保持 NaN。除法的分母是 cross_mean(L,·)、day_sum(Amt) 或 L+1 类的非负量,停牌日 day_sum 为 NaN 而非 0,无 inf。种子 3、4 的 L/T 在停牌或无成交日为缺失。cross_zscore 常数窗口取 0,cross_madz 的 MAD 为 0 时为缺失,cross_ema 跳过缺失日,都不爆。相关度表:种子 5 对 head ts_max(ts_max(log(cross_regbeta(day_last(Amt),day_open(Amt),10)),20),50) 的原始 |ρ| 为 0.735(残差 0.66),越过 0.7,自动划掉;它与 head 承重项(收盘金额的 log 峰值)同源。其余种子对 head 的原始 |ρ| 在 0.12-0.42(种子 6 最高 0.42,种子 12 为 0.37,种子 4、11、14 为 0.33-0.34)。对控制:种子 6 liq 0.58、known 0.59,种子 4 liq 0.52、size 0.45、known 0.46,种子 7 liq 0.41、size 0.36,种子 14 liq 0.36、vol 0.35、known 0.39,均低于 0.8,不自动划。创新度 3:libs_train.csv 里 day_last(Amt) 共出现 95 次(77 条),笔记写的是 120 次,我数到的是这个数。ts_max(day_last(Amt),5/10/20) 的形式在库里有 6 条,cross_regbeta(day_last(Amt),day_open(Amt),10) 只有 head 这一条,含 day_last(Amt) 的 regbeta 族有二三十条。库里 0 条的写法有:收盘峰值除以常态(种子 1)、收盘占比 L/T 的峰值与尾部均值(种子 3、4)、同市值分桶去均值(种子 6)、cross_zscore(种子 2)、cross_madz 与 cross_ema(种子 14)、cross_autocorr(种子 8)、分位数 IQR(种子 9)、cross_stddev(种子 7)。但底层变量在库里挖得很深,峰值形式与 head 承重项同源(种子 5、6),所以给 3 不给 4。合理度 4:机制清楚。15:00 那一根含收盘集合竞价,指数调样、ETF 申赎、大宗交易等被动或机构成交会让它在一天内放大,用自身常态归一化的峰值是这类事件的指纹。需 PI 注意的:(a) 种子 11、12 是 cs_rank(cross_regbeta(L,O,10)) 的 120 日均值与 60 日 EMA,与笔记的假设相矛盾:笔记自己的拆解说回归斜率不承重(敲掉后分数不变),假设又写「不读回归斜率」。这是 head 的 regbeta 族换了平滑,不是划掉的理由(规则只允许数学问题或重复),但下一轮应说清。种子 13 用的是 L 与 O 的 60 日相关,也不在「峰值之差」里。(b) 制度断点:我的记忆是沪深两所收盘集合竞价都是 2018-08-20 起,笔记说两所起始不同步且未核实。若属实,train 前约 160 个交易日的 L 是连续竞价的最后一分钟,70-120 日窗口会跨过断点到 2018 年底,这段截面效应会进入 train 分数。请 PI 核实日期。(c) 种子 1 与种子 10 都是「峰值 / 常态」(均值窗 70 对 60,max 与比的顺序不同),近似重复。组内两两 ρ 不在表里,按规则不划;若要划,先算组内 ρ。全算太慢时可以按日抽样做 shrink 估计;本轮我没有做额外相关度计算,表是完整的(43 行,3 个 head 与 5 个控制齐全)。如果它有 alpha,最可能来自收盘集合竞价端的被动与机构需求事件(指数调样、ETF 申赎),它们以 70-120 日的慢状态出现,而不是单日噪声。'
R:
  - head: 'ts_max(ts_max(log(cross_regbeta(day_last(Amt), day_open(Amt), 10)), 20), 50)'
    soundness: 4
    reasons: '数学:cross_regbeta 是 rolling OLS 的 beta = cov/var_x(common.py rolling_ols),只在 var_x ≤ EPS(1e-9) 时为 NaN;金额量纲下 var 远大于 EPS,所以笔记说的「方差接近 0 时爆点」只在收盘金额近乎常数时才出现,比笔记的说法弱。log 是 log(|x|),|x| ≤ EPS 为缺失,无问题。变体:v2 cross_corr(有界,与 head 原始 |ρ| 0.34)与 v3 对数上回归(弹性,|ρ| 0.38)正对着这个问题,合理;v1、v4-v7 保留 cross_regbeta 的除法,与 head 的 |ρ| 为 0.82-0.91(只换窗口或平滑),若爆点主导会继承,但表里没有证据。笔记的消融(去掉回归分数不变)支持「承重的是收盘峰值」这一机制。已知族 |ρ| 全部低于 0.5(0.10-0.38)。如果它有 alpha,最可能来自收盘端金额的慢状态(峰值),而不是回归斜率。'
  - head: 'ts_decay_linear(day_open(Volume), 5)'
    soundness: 4
    reasons: '数学:无问题。day_open(Volume) 是首个非缺失分钟的成交量,day_sum(Volume) 加 1 无除零;LogFloatShares 是允许的日频叶子,ND 面接受。变体:v1 竞价量占全天量(有界,与 head 原始 |ρ| 0.70);v2 log 竞价量减 LogFloatShares,即竞价换手(原始 0.69);v3 60 日 z 分数,用自身历史(原始 0.40);v4、v5 是 cs_rank 与 log 变换,与 head 原始 |ρ| 为 0.96-0.98,几乎是同一个信号,而且对流动性控制 |ρ| 为 0.64-0.65、对已知族为 0.68-0.69,等于重写流动性。v2 对已知族 0.54,v4、v5 为 0.68 以上,按规则过不了替换条件「已知族 |ρ| < 0.5」,应只作参照。head 承重的是竞价成交股数的水平,其量纲随股价与流通股本变化,标准化后才是竞价需求。机制清楚,合理度 4。如果它有 alpha,最可能来自竞价需求的相对强度(相对换手或相对占比),而不是流动性水平本身。'
  - head: 'signedpower(day_open(Amt))'
    soundness: 4
    reasons: '数学:signedpower 默认 e=2(common.py),对 Amt ≥ 0 是单调变换,截面秩与 day_open(Amt) 完全相同,笔记说它是烂部件是对的,无数学问题。变体:v1 竞价额 ÷ 20 日均日总额(无量纲,与 head 原始 |ρ| 0.77);v2 60 日 z 分数,用自身历史(原始 0.50);v3 log 竞价额减 LogFloatCap,即竞价额占流通市值,是竞价换手的价值口径(原始 0.78,已知族 0.41,流动性 0.38)。三者都换成无量纲的量,机制清楚,合理度 4。如果它有 alpha,最可能来自竞价额相对自身规模或相对流通市值的强度。'
summary: '两个 N 位都过(a:创新 4、合理 4,不划;b:创新 3、合理 4,划种子 5 自动划掉),三个 R 组合理度均为 4 放行;无数学问题触发挡,待 PI 核实的是 b 位收盘集合竞价的制度断点日期、种子 11、12 的斜率与假设相矛盾,以及 a 位 G 的时点是否与除权日对齐。'
