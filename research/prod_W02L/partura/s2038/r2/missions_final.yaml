- type: N
  hypothesis: '想法:同伴内中性化的「订单流指纹」。把日内的订单流状态量(持续性、方向性、时间重心)放进规模 / 流动性 / 上市年龄的十分位同伴里做相对读法,而不是读水平。


    来源(B113,60 条成员,共有结构 day_autocorr_n1(F),即分钟序列的一阶自相关):

    (1) 批里原始 train 夏普最好的几条都是这个量的慢平滑:pow_2_5(cross_mean(day_autocorr_n1(Amt), 30))
    +2.10、ts_quantile_q25(day_autocorr_n1(Volume), 20) +1.95、ts_min(day_autocorr_n1(Volume),
    50) +1.63;但换成新尺子(扣掉 5 个控制和两个冠军)以后这一族全是负的(本流 3 个素材 head 是 -1.01 / -1.52 / -1.87)。读法:成交量路径越平滑,多半是越大、越活跃的股票(零成交分钟少、日内曲线更规则),所以这个量的水平几乎就是流动性
    / 规模的代理,控制把它吃掉了。

    (2) 拆解里唯一还有东西的子结构是 cross_max(day_autocorr_n1(Volume), 60):单独评分 -0.19(train +0.53
    / valid -0.19),敲掉它整个 head 掉到 -3.16(必要性 +2.15);而外面再套的 ts_min(·, 50) 与两层 cross_quantile_q25
    只是在往下拖(head -1.01)。也就是说 train 段里「成交量路径的持续性」带着一点信息,但被水平混在一起,valid 段又被水平拖负。

    (3) 另外库里 5583 条表达式一个都没用 day_signed_ratio、day_wmean、cs_bucket_rank / cs_bucket_zscore(同伴内相对),所以它们既不在两个冠军里,也不在
    5 个控制里。


    机制:大单拆分(VWAP / TWAP 算法、机构的 meta-order)在分钟序列上留下两个指纹:(i) 持续性 —— 成交量路径的自相关高(同一笔母单被切成连续的子单,Lillo–Farmer
    的订单流长记忆);(ii) 方向性 —— 成交额加权的上涨 / 下跌分钟占比不平衡(day_signed_ratio(Ret, Amt) = 上涨分钟成交额占比减下跌分钟占比,不需要逐笔数据,是「主力净流入」的分钟版;day_wmean(Ret,
    Amt) - day_mean(Ret) 是同一件事的另一种写法)。两者同时出现(种子 9)才像知情的单向母单,只有持续性是流动性,只有方向性是噪声。再加(iii)
    成交额的时间重心 day_centroid(Amt)(种子 8,越靠近收盘越晚)。


    算子怎样实现:全部先取 40~120 日的 cross_mean / cross_ema(种子 11 先取 5 日再对自己 120 日常态做 z 分数)压低噪声(也压低换手),再用
    cs_bucket_rank / cs_bucket_zscore / cs_bucket_demean 对 LogFloatCap、LogFloatShares、ListAge
    或 60 日总成交额的十分位做同伴内相对(种子 1~9、11、13、14):每个十分位内部输出都是均匀的,所以输出对这些变量没有任何水平倾斜,控制能拿走的只剩跨十分位之外的东西;种子
    12 用 cs_regres 做线性版(对数成交量的残差)对照;种子 10 是先同伴内排名、再时间平均的顺序对照;种子 14 把方向性换成不加成交额权重的上涨分钟占比
    day_pos_ratio(Ret),检验「成交额加权」是否承重。这和上一轮的做法不同:第 1 轮的位 a 读的是日频叶子构造的累计复权因子,位 b 读的是收盘端成交额的尾部突发度,都是在「读一个量的水平
    / 峰值」;这里读的是「同伴内的订单流相对状态」。


    为什么样本外还会在:(a) 母单拆分是机构交易的机械特征(执行算法、考核约束),不随行情风格变;(b) 同伴内相对读法天然去掉规模 / 流动性的水平,剩下的只能是「同样大小的票里谁的资金流更像知情机构」,这是一个条件信息,不是已经被两个冠军吸收的水平因子;(c)
    窗口 60~120 日,换手低。预期不高(本流 B113 的素材全是负分):这条路成立与否的第一个读数是种子 9(持续 × 方向)是否优于单独的持续性(种子
    5、6)和单独的方向性(种子 1、2、4)。


    数学检查:day_signed_ratio ∈ [-1, 1],分母是成交额之和,当天全无成交则缺失,不会爆点;cs_bucket_rank 在每个十分位里输出均匀分布,并用整体排名以
    1e-4 的权重打破十个十分位之间的并列;cs_bucket_zscore 用总体标准差 + EPS 做分母,桶里人数 < 2 时缺失;cs_regres
    是逐日截面 OLS 残差,无前视。无前视(全部是 t 日收盘后可知的日内统计和日频字段)。

