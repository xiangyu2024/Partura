- type: E
  core: 'day_last(Amt)'
  hypothesis: |
    核心 day_last(Amt):15:00 那根分钟线的成交额。深交所早有、上交所自 2018 年起也有 14:57~15:00 的收盘集合竞价,指数 / ETF 申赎 / 量化对冲 / 机构的「按收盘价成交」单集中在这一根里,所以它是全天最「机构化」的一根;散户主导的是 9:30 的开盘竞价(day_open(Amt))。

    事实依据(本流第 1 轮,只用 train / valid 的数):
    (1) GP 自己长出来的 `cs_first_low20(day_last(Amt), LogFloatShares)` 是本流全部评分里最高的 +0.48(train +0.75 / valid +0.48,与已知族 |ρ| 0.44,离 0.5 的线差 0.02),它的嵌套重复写法同分。两段都为正,而且 train 比 valid 还高。
    (2) 核心卡里 day_last(Amt) 在 34 个已评分候选里,含它的均值 -1.32、不含的 -2.39(p 0.000);同批 day_open(Amt) 是 16 个、+1.12。
    (3) 我第 1 轮写的 14 个「收盘端突发度」种子(峰值 / 常态、z 分数、占比、斜率形)除了 cs_rank(cross_regbeta(day_last(Amt), day_open(Amt), 10)) 的慢平滑版(-0.09 ~ -0.18)以外都在 -0.33 以下,所以「突发」不是承重的;承重的是那个阶跃:cs_first_low20 把流通股本最小的 20%(整块并列一起)整体排到所有其他股票之上,段内再按收盘集合竞价成交额排序,每只股票仍有不同的值。
    (4) 诚实的警告:阶跃不在新尺子扣除的范围内(尺子只扣 5 个控制和 2 个冠军的 1~3 次秩多项式,而 LogFloatShares 不是控制,控制里的规模是 LogFloatCap),所以这里出的 head 可能一部分是「小股本段倾斜」,不全是段内排序。种子里专门放了对照:种子 9、15 是同伴内中性化(cs_bucket_rank),没有任何段倾斜;如果它们比阶跃版差很多,就说明承重的是段倾斜本身,下一轮就把核心换成段变量而不是收盘成交额。

    这一轮要试的外围(和第 1 轮见过的 cs_first_low20(·, LogFloatShares) / cross_ema(cs_rank(cross_regbeta(·)))/ ts_max(ts_max(log(·))) 的算子集合都不一样,每个种子的外围算子集合彼此也不同),每个种子动三层里的一层:
    (a) 段变量换成别的「供给 / 持有结构」:名义价格的负对数 sub(LogFloatShares, LogFloatCap)(种子 4 是最高价 20%,种子 5 是最低价 20%)、受限股占比 sub(LogTotalCap, LogFloatCap)(种子 6,最小的 40% = 几乎全流通的)、上市天数 ListAge(种子 7,最年轻的 20% = 次新股)。机制:流通股少 + 价格高的票做市深度浅,机构建仓只能在收盘集合竞价里集中成交(Kyle 的价格冲击系数 ∝ 1 / 深度),同一笔收盘成交额在这些票里携带的信息更多;次新股的流通盘被锁定股份压着,散户筹码结构和老股不同。
    (b) 段内排序量换成无量纲或慢的形式,去掉对流动性水平的残余:收盘占比 day_last(Amt) / day_sum(Amt)(种子 2)、收盘成交额除以流通市值(换手率口径,种子 3)、对自己 60 日常态的 z 分数(种子 11)、短 5 日对长 60 日均值之差(种子 12)、20 日峰值(种子 13)、20 日均值(种子 1)、EMA(种子 7、10)、第 1 轮里最接近零的慢平滑回归斜率(种子 14,收盘端 Amt 对开盘端 Amt 的 10 日回归斜率,量纲为 1,不含流动性水平)。
    (c) 段结构换成别的形状:段宽 20% / 40%(种子 6、10)、两个段取并(种子 16,两个阶跃之和)、在阶跃之上再剔除总成交额最低 10% 的死股(种子 8,cs_last_low10,和另一条流里剔除最低 10% 的筛子同一思路,但这里的筛子是总成交额)、同伴内中性化(种子 9、15,cs_bucket_rank 按 LogFloatShares 十分位 / LogFloatCap 十分位)。

    数学检查:无前视(day_last 是 t 日 15:00 的值,LogFloat* / ListAge 是收盘时点可知的日频字段,t 日收盘后算、t+1 才交易);除法只有种子 2(分母 day_sum(Amt) + 1,不会爆点;停牌日 0 / 1 = 0,是取值而不是缺失,排序里被推到低端,属于规则 §4 已知的行为)和种子 3(对数前加 1,减的是对数市值,量级一致);cross_zscore 在常数窗口里返回 0 而不是浮点噪声;阶跃算子的输出 rank + 1 保证没有并列(分布闸门不会因阶跃而塌)。热身期:最长窗口 60 日,其余 ≤ 20 日。

    为什么样本外还会在:(i) 收盘集合竞价里机构 / 被动资金的行为由制度驱动(指数调整、ETF 申赎、基金考核日的收盘价),不依赖某一段行情;(ii) 小股本 / 高价股的供给约束是结构性的(流通股少、可借券少、机构容量小),train 和 valid 两段在第 1 轮都是正的;(iii) 排序量全部是慢的或被 EMA / 均值压低,15 bp 的成本下换手可承受。我的预期不高:最可能的结果是若干个 0.3 ~ 0.7 的候选,其中一部分只是阶跃倾斜的变体。
