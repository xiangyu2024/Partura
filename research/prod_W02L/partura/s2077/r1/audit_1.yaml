    reasons: '位 a 是 E 深挖,核心 day_median(div(abs_(Ret), Amt)) 就是快照 head 1(原始 |ρ| 1.00),对 5 个控制的 |ρ| 为 liq 0.45、vol 0.08、rev 0.03、known 0.47、size 0.54,全部低于 0.8,核心过门槛。外围多数是冲击的动态而不是水平:seed 1、2 是冲击相对自身 20/60 日均值的偏离与比值(原始 |ρ| 0.33 / 0.58,残差 0.23 / 0.50);seed 3、4 是 cross_zscore 与 cross_delta(残差 0.21 / 0.17,与 head 基本不同);seed 5、12 是冲击与收益、成交额的滚动相关(残差 0.21 / 0.61);seed 7、10 是短均线比长均线与平滑后的偏离。seed 6 cross_stddev 与 liq 0.78、known 0.77,seed 11 sub(cross_max, cross_mean) 与 liq 0.79,都接近但未到 0.8 的自动划线,保留并记为边界。seed 8 cross_tail_mean_q75 原始 head |ρ| 0.79 ≥ 0.7,按库禁令自动划掉(残差 0.82)。seed 9 cs_bucket_demean(·, LogFloatCap) 原始 |ρ| 0.63 但残差 |ρ| 0.89,去掉规模后基本就是 head 本身,属于换皮,划掉。创新度给 3 而不是 4:动态与水平确实不同,但 seed 6、11 与 liq 控制高度相关,且多数候选仍与 head 残差 0.4 以上。合理度给 4:算子核对过,cross_delta 为 x[t]-x[t-d](dt_cross.py:174-180),cs_bucket_demean 只用同日截面(ops_ext.py:463),cross_tail_mean_q75 只用最近 d 日(ops_ext.py:320),无前视;覆盖率 1.00,无数值伪影主导。机制清楚:冲击相对自身历史下降会吸引流动性提供者,冲击的上升对应库存风险。如果它有 alpha,最可能来自冲击的变化与离散度(seed 1、2、4、7),而不是水平。剩余 10 个种子,远超 4 个门槛。'
