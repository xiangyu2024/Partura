    hypothesis: 'Intraday lead-lag and timing structure of flow versus price. Batch 1 heads are same-minute, sign-split volume/return ratios inside the first 50 minutes and the open-minute volume change; they all treat price and volume at the same minute. The idea is (a) lagged flow-to-price coupling: day_corr(Ret at t+1, Volume at t) built by offsetting in_slice windows by one minute (no fill value, no look-ahead: both windows are inside the same day and only past volume is paired with the later return) measures whether volume bursts are followed by continuation (informed flow, Easley-O Hara style) or reversal (liquidity demand); (b) amount-weighted minus time-weighted return, div(day_sum(mul(Ret, Amt)), day_sum(Amt)) - day_mean(Ret), says whether the money traded on the up moves or the down moves, i.e. where the day volume sat relative to the path; (c) the gap between the minute of peak amount and the minute of the day low (day_argmax(Amt) - day_argmin(Low)) is a timing statistic: capitulation volume at the low (reversal) versus volume at the high; (d) morning-vs-afternoon (minutes 1-120 vs 122-241) correlation/covariance of returns and of volume profiles, a continuation-versus-reversal fingerprint of intraday trend persistence. Rolling means (cross_mean 20) turn the one-day noisy statistics into slow states. Differs from the library: no head uses a lagged minute pairing, an amount-weighted-minus-equal-weighted return, an argmax/argmin timing gap or half-day contrasts. Why it should persist: all four measure how informed vs liquidity-driven flow shows up in the order of events within the day, a structural property of the A-share retail-dominated tape, and a 20-day average of such a state is slow and not mechanically the same as liquidity, size, volatility or reversal.'
