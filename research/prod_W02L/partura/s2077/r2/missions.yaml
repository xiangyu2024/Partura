    hypothesis: 'Core = day_sum(Ret), the day total of minute returns (the daily return). The locate table says it is the most enriched subtree in the batch (11 candidates, mean score -1.59 vs -2.99 without it, p 0.001), and the one nest that got a positive score last round was cross_corr(Amihud, day_sum(Ret)) i.e. the daily return entered through a rolling correlation, not as a level. A daily-return LEVEL is just short-term reversal and is stripped by the controls; the bet is on the rolling co-movement structure of the daily return with other daily microstructure states (Llorente-Michaely-Saar-Wang 2002: return-volume correlation separates information-driven trades (continuation) from liquidity/hedging trades (reversal)). Periphery is a 20-40 day cross_corr / cross_regres / cross_reg_tvalue / cross_cov of day_sum(Ret) against a DIFFERENT partner each time: volume level (day_sum(Volume)), volume dispersion (day_std(Amt), day_gini(sqrt(Volume))), flat-minute share (day_zero_ratio(Low)), intraday return-volume correlation, own lag, own intraday volatility (leverage effect), opening-window return. Last round used only the Amihud median as partner, so this is a different set of partners and, in the regression forms, a residual/t-stat rather than a correlation. Why it should persist: stocks whose daily returns have been backed by volume (informed flow) keep drifting while those whose returns came on thin or erratic volume revert; this is a slow-moving, behavioural/microstructure state that the linear/U/S exposure to liquidity, size, volatility, 20d reversal and the champions does not capture.'
