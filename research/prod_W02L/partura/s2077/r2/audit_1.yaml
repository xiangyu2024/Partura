slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [3]
    reasons: 'Core day_sum(Ret) is legal: it is a subtree in the commonality enrichment table (loc.md line 20, +1.40, p 0.001), and it is not a control-like object (raw max |rho| to heads 0.12; controls liq 0.00, vol 0.01, rev 0.18, known 0.00, size 0.04, all well under 0.8). Every kept seed contains day_sum(Ret) as a subtree. No seed is auto-struck: max raw |rho| to a head is 0.22 (seed 5, gini), and no control |rho| reaches 0.8. Seed 3 is struck on a math ground: day_zero_ratio (ops_ext.py:273-283) counts x == 0 exactly, and Low is a price that is never exactly zero, so the operator is identically 0. cross_corr against a constant is undefined; corr_1.json shows gate False, distinct 0.0, and all controls NaN. This is a definition that is broken as written, not a judgement about the idea. Kept seeds, with the head and control evidence from corr_1.md: seed 1 cross_corr(day_sum(Ret), day_sum(Volume), 30) (residual vs heads 0.06, rev 0.30, liq 0.11); seed 2 cross_corr with day_std(Amt) (rev 0.40, below 0.5, residual 0.04); seed 4 cross_corr with day_corr(Ret, Volume) (residual 0.15, liq 0.09); seed 5 cross_corr with day_gini(sqrt(Volume)) (residual 0.14, known 0.23, liq 0.19); seed 6 cross_corr with day_std(Ret) (residual 0.07, rev 0.33); seed 7 cross_corr with the opening 30-minute return (residual 0.05); seed 8 cross_corr with cross_delay(day_sum(Ret),1) (own lag, all controls at most 0.03); seed 9 cross_reg_tvalue on day_sum(Amt) (rev 0.43, below 0.5); seed 10 cross_regres on day_sum(Volume) (residual 0.33, rev 0.25); seed 11 cross_cov with day_kurt(Amt) (residual 0.15); seed 12 cross_corr(abs_(day_sum(Ret)), day_sum(Amt)) (residual 0.08). Two near-overlaps are noted but not struck: seeds 1 and 10 both pair day_sum(Ret) with day_sum(Volume), and regres slope equals corr times sigma_r over sigma_v, so they differ by scaling and window (30 vs 20) and are not a pure duplicate. Seed 9 is the most reversal-like (rev 0.43). The core itself is a daily return level, which the controls strip, so the alpha must come from the 20-day co-movement structure. If the slot has alpha, it most likely comes from the joint persistence of return with volume and turnover states (Llorente-Michaely-Saar-Wang style return-volume coupling), not from the level. Novelty 4: no head is a rolling correlation or regression of daily return, and the heads are all sums, quantiles or opening-window sign splits.'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: [1, 2, 3, 8, 9, 10]
    reasons: 'Strikes 1, 2, 3, 8, 9, 10 are on a math ground. in_slice(x, start, end) = x[:, start:end+1] (dt_in.py:324-325) on a 241-column day grid (in_expand N=241, dt_in.py:~331), so the last valid column is 240. The end index 241 is out of range and Python slicing truncates it silently. in_slice(Ret,2,241) gives 239 columns, in_slice(Volume,1,240) gives 240, in_slice(Volume,122,241) gives 119, and in_slice(Volume,1,120) gives 120. The paired day_corr / day_cov therefore receives unequal lengths. corr_1.json records KeyError: x for exactly these six seeds, which is consistent with that cause. The lagged-pairing idea is the N hypothesis at the centre, but as written these expressions have no defined value, so they are struck as a broken definition. Note for PI only, not a rewrite: the correct form would need end index 240 with equal widths (for example in_slice(Ret,2,240) against in_slice(Volume,1,239)). Kept seeds: 4 cross_mean(sub(div(day_sum(mul(Ret,Amt)), day_sum(Amt)), day_mean(Ret)), 20), residual vs heads 0.14, but rev 0.55 and vol 0.41 are high; this is a 20-day amount-weighted minus equal-weighted intraday return, and it is not the same as reversal (not |rho| 0.8 or more), so it is kept. Seed 5, the un-smoothed version of seed 4, is kept as a separate seed rather than a duplicate: the reward runs EMA half-lives 0, 5 and 20, so seed 5 covers the short horizons that the 20-day mean in seed 4 does not. Seed 6 cross_mean(sub(day_argmax(Amt), day_argmin(Low)), 20): liq 0.45 and known 0.44 are the highest control overlaps in the slot but below 0.8, so it is kept. Soundness is held down by a tie artifact. dt_day.py:172-190 returns the first index on ties, so argmin(Low) returns 0 on limit-locked or suspended days, and the difference then reads argmax(Amt) on those days. I did not find that this artifact dominates the 20-day mean, so the seed is kept under section 4. Seed 7 sub(day_argmax(Amt), day_argmax(Vwap)): the residual vs heads is 0.22 (the highest in the slot), liq 0.14, known 0.14. It is integer-valued, with only about 481 possible values across roughly 5000 stocks (distinct 0.098), so ranks are coarse, and it has the same zero-volume tie behaviour. This is not a math problem, so it is kept. Two of the four surviving seeds (6 and 7) carry gate False in corr_1.json. The rule only strikes math problems, so both stay, but the slot passes with exactly 4 seeds. If the workflow drops these two as waste, the slot would fall below the threshold of 4 kept seeds. Alpha source, if any: the timing of volume peaks relative to the day low and the VWAP peak (capitulation volume versus volume at the high), and the amount-weighted direction of intraday flow (money on up moves versus down moves). Novelty 4: no head is an argmax or timing gap, and the head-level residual correlations are 0.07 to 0.22.'
