- type: N
  hypothesis: |-
    机制:日内收益分布的"尾部不对称"(Bowley 分位偏度)及它的慢变量。B = (q75 + q25) / (q75 - q25) 或 (q75 + q25) / day_std,其中 q75、q25 是当天分钟收益的 75% / 25% 分位数。
    q25 是下行尾,q75 是上行尾:B > 0 表示上行分钟比下行分钟更猛(买盘集中冲击),B < 0 表示下行更猛(抛压集中)。它无量纲(除以分布宽度),和波动 / 成交额 / 市值水平型控制低相关,
    又和只看单边 q25 的已见写法不同:q25 单独与波动共线,Bowley 把对称部分(波动)除掉,只剩方向性的不对称,也就是"当天的大分钟究竟是买还是卖"。
    批里的启发:本批最强的共性子树是 day_quantile_q25(Ret)(含它的候选 -1.16 对 -2.53,p 0.000),说明日内收益分布的下行尾携带信息;
    上一轮 N 位的方差比是同一类"路径形状"读数但被 head 之一(与 q25 head 的 |ρ| 0.64~0.70)吃掉了重合部分;Bowley 偏度把 q25 与 q75 对称化后是不同的量(两个分位数之和而不是单边)。
    算子怎么实现:day_quantile_q75 / day_quantile_q25 / day_std 都在库里;日轴上取 cross_mean(·, 20/60) 或 cross_zscore(·, 120) 让名次慢变(日度的 B 噪声大);
    再加两个读法:(1) B 与当日收益 day_sum(Ret) 的 60 日滚动相关(尾部不对称是否被净方向解释,残差 = 日内买卖冲击与收盘价无关的一面);
    (2) 流通市值桶内标准化。另有 q75 与 q25 的 60 日均值之差 = 平均宽度对 B 的拆分(sub 版),用作对照。
    为什么库里没有:库里的 day_quantile 骨架只有 q25 包 in_rank/pow_2_5 的一种;add(q75, q25) 与 div(·, sub(q75, q25)) 的骨架不在 5583 条里(骨架禁令会再确认);day_skew 是三阶矩,对极端分钟极敏感,Bowley 对极端稳健,是不同的量。
    为什么样本外还会在:分位偏度读的是日内大分钟的方向性(知情买卖 / 机构集中执行),是个股慢变的参与者属性;稳健(对极端分钟不敏感),慢聚合后换手低。
    风险:与 q25 的 head 共线(q25 是 B 的一半);滚动相关写法 60 日噪声大。
    数学检查:q75 = q25 = 0 的日子(大半分钟不动的低流动票)分母为 0 → NaN 不是爆点;day_std 版除以波动同理;B 的取值在 [-1, 1] 内(除以 IQR 版),没有爆点;无前视:只用 t 日收盘及以前。
  inspired_by: B220 批:共性子树 day_quantile_q25(Ret) 含它的 11 个候选均值差 +1.37(p 0.000);q25 head 与 q25 单边写法被波动吃掉,换成 q75 与 q25 的对称化(Bowley 偏度)读方向性不对称。
