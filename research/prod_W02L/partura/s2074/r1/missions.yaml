  - type: N
    hypothesis: |-
      机制:日内价格路径的"方差比"(variance ratio,Lo 与 MacKinlay 1988;Hasbrouck 微观结构噪声)。若分钟价格是随机游走,k 分钟收益的方差 = k × 1 分钟收益的方差;比值 VR(k) = Var(k 分钟收益) / (k × Var(1 分钟收益)) 大于 1 = 日内价格趋势性延续(知情订单流分批消化、动量型参与者),小于 1 = 价格被买卖价差弹跳和流动性冲击拉回(噪声大、盘口薄、做市商赚钱的地方)。VR 无量纲,分子分母都是同一只票同一天的收益方差,所以波动水平、成交额水平、市值都被除掉了,与波动 / 流动性 / 市值这些水平型控制天然低相关。它是个股盘口微观结构与参与者构成的指纹(噪声占比),名次慢变:每天取一次噪声大,所以全部读数在日轴取 20 到 120 日均值或自己 120 日的 z 分数,让换手低。
      算子怎么实现:in_logchg(Close, k) 是 k 分钟对数收益(重叠窗口),day_var 取当天方差,除以 k × day_var(in_logchg(Close, 1));变体:k = 3 / 5 / 15 / 30;用 Vwap 代替 Close(Vwap 本身已是分钟内均价,噪声更小,VR 读的是真实价格路径而非报价弹跳);分钟级 Volume 加权的版本(day_wstd);与 |日收益|² 的比(日内波动里有多少是"路径噪声"而非"净位移",即 day_var(in_logchg(Close,1)) × 分钟数 ÷ (日对数收益)² 的 20 日均值再取对数);桶内标准化;5 分钟 VR 对 1 分钟 ar1 系数 day_ar1_coefficient(Ret) 的 cs_regres 残差(去掉与已有一阶自相关写法重叠的部分)。
      批里的启发:本批 head 之一是 ts_sum(day_ar1_coefficient(neg(Vwap)), 10),是分钟 Vwap 水平的一阶自相关系数,它与已知族的 rho 只有 -0.20、对 10 日窗口的各种改法(5 / 20 日,换 Close)在 -2.2 到 -2.5 之间稳定(train -2.19 / valid -2.01),说明日内价格路径的持续性读数与控制不共线;另一个 head 是 day_quantile_q25(in_rank(pow_2_5(neg(Ret))))(日内收益分布的左尾),也是路径形状。但水平的 ar1 系数混着价格水平与趋势,VR 是它的规范化版本:只看收益(去掉水平)、只看方差比(去掉尺度)。
      为什么与已有的不同:骨架 div(day_var(in_logchg(F, k)), mul(k, day_var(in_logchg(F, 1)))) 以及 cross_mean / cross_zscore 包它的写法不在两个库的 5583 个骨架里(in_logchg 是 Partura 后加的算子,库里没有);库里最近的是 day_ar1_coefficient / day_hurst / day_autocorr 一类:它们读的是同一个量(收益序列的线性相关)的逐点自相关估计,VR 是多滞后自相关的加权和,而且分子分母一除,对极端分钟更稳;日度写法里 cross_mean(day_ar1_coefficient(Ret), 20) 之类库里有,本位的种子避开了纯 ar1 / hurst 的写法。
      为什么样本外还会在:微观结构噪声占比与盘口深度、tick 大小相对股价的比例、做市商参与度挂钩,是个股慢变的结构属性,不依赖某段行情;低 VR(噪声多)的票是流动性提供者的收益来源,有流动性溢价的方向文献稳定(Amihud、Hasbrouck 2009 的有效价差);慢聚合让 15 bp 的成本吃得下。风险:被已知成交额族或波动控制吃掉(VR 与价差 / 换手相关);或者只是 tick size 效应(低价股 VR 低);桶内标准化与对数口径就是为这个。
      数学检查:day_var(1 分钟收益) 只在整天价格不动(停牌 / 涨跌停封板)时为 0,这时分子也为 0,得 NaN 不是无穷;窗口长度(分钟数)是常数,不影响秩;VR 取值落在 (0, 数倍) 之内,没有爆点,对数后更稳;in_logchg 要求价格为正,非正得 NaN。无前视:只用 t 日收盘及以前的分钟数据,t+1 交易;最长窗口 120 日,热身期不主导。
    inspired_by: 'B220 批:ts_sum(day_ar1_coefficient(neg(Vwap)), 10) 与已知族 rho -0.20、窗口 / 价格口径改动都稳定在 -2.2~-2.5;day_quantile_q25(in_rank(pow_2_5(neg(Ret)))) 读日内收益分布形状。日内价格路径读数与水平控制不共线,把水平 ar1 规范化成无量纲的方差比。'
