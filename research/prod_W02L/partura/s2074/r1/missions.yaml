    core: 'day_close(neg(Volume))'
    hypothesis: |-
      机制:核心 C = day_close(neg(Volume)) = 负的"当天最后一分钟成交股数"(A 股 14:57-15:00 是收盘集合竞价,最后一分钟装着收盘撮合量;方向由奖励自己定,所以 neg 只是符号)。依据在本批拆解表:head pow_2(C) 是 -1.55(train -1.18 / valid -1.55),C 本身 -1.61,与已知族 rho 0.60;换成 Amt 掉到 -3.83、rho 0.80。就是说股数口径的收盘量比金额口径少一块"成交额水平"(被流动性和已知成交额族吃掉),但两段都亏、几乎一样(-1.18 / -1.55),推断毛超额约为 0、亏的是换手(原始 C 是每天换一次的快变量)。所以单调包装(pow_2)没有用,是同一个信号。这一位把 C 拆成与水平无关、变化慢的读法,看哪一块有毛超额:
      (a) 收盘量占当天总量的比例 div(C, day_sum(Volume)) 的 20 到 60 日均值,以及在流通市值十分位内的 z 分数:收盘集合竞价的参与者(指数基金、被动再平衡、尾盘规避隔夜风险的机构)占比是慢变的参与者构成属性,无量纲;
      (b) C 相对自己历史的位置:cross_zscore(C, 120),10 日均值除以 120 日均值,除以 60 日均值后 EMA:收盘量的异常放大 = 尾盘有集中的资金行为,个股用自己做对照,去掉所有水平控制共有的持久截面水平;
      (c) C 与价格的 60 日滚动关系:收盘量与当日收益、|收益|、日内波动的 60 日滚动相关;收盘量对总量的 60 日滚动回归残差与斜率;收盘量与总量在截面上的回归残差(cs_regres):尾盘放量伴随上涨(拉尾盘)还是伴随下跌(尾盘砸盘)是两种不同的知情或操纵行为,滚动相关把它写成每只票自己的慢变属性;
      (d) 收盘量放大 × 近 20 日趋势方向:mul(cross_zscore(C,120), sign(20 日累计收益))。
      为什么与已有的不同:本批见过的含 C 的外围只有 {pow_2},库里 5583 条骨架里没有 cross_zscore / cross_corr / cross_regbeta / cross_regres / cs_bucket_zscore / cs_regres / cross_ema 包 day_close(Volume) 的写法(逐个与 members.csv 骨架核对过思路,GP 的骨架禁令会再确认);库里最近的是 day_last(Volume) 类水平写法(B099 一带的 day_last(Amt) 链,金额口径、是水平,与本位的比例/滚动关系/桶内标准化不同)。
      为什么样本外还会在:(a)(c) 读的是收盘集合竞价参与者构成这类慢变的结构属性,窗口 20 到 120 日,名次数周内不变,15 bp 下换手低;(b) 用个股自己的历史做对照,不靠静态风格,不易在风格切换时翻符号;(d) 机制是行为性的(尾盘追涨与尾盘抛售),不依赖某段行情。风险:(a) 与已知成交额族的残差相关仍高;(c) 60 日窗口估得太吵;这两种情况下不出 head,下一轮不再押 C。
      数学检查:Volume >= 0,最后一分钟无成交时 C = -0 或缺失;div(C, day_sum(Volume)) 分母为 0 时分子也为 0,得 NaN 不是无穷,正常取值在 [-1, 0];cross_zscore 对近常数窗口有保护;cross_corr / cross_regres 窗口有效对太少时可能返回 0(已知缺陷,可交易掩码已排除新股与长期停牌,不是结果的主要来源)。无前视:只用 t 日收盘及以前,cross_delay 天数为正,t+1 交易;最长窗口 120 日,热身期不主导。
