- type: N
  hypothesis: 机制:"收盘分钟冲击的跨日反应系数"。day_close(Ret) 是最后一分钟(收盘集合竞价)的收益,是一天里最容易被指数基金、机构收盘价交易与尾盘拉抬
    / 砸盘推动的价格冲击;本批共性表里它是富集最强的子树(含它的 4 个候选均值 -0.53、不含 -2.46,均值差 +1.93,p 0.001)。想法是不读冲击大小,读它的"后果结构":对每只票,用最近
    60~120 个交易日估计 (i) 昨日收盘冲击对今日全天收益的回归斜率 cross_regbeta(day_sum(Ret), cross_delay(day_close(Ret),
    1), d) = 收盘价冲击是被次日反转(流动性型冲击)还是被延续(信息型冲击);(ii) 收盘冲击与当日其余收益的滚动相关 cross_corr(day_close(Ret),
    day_sum(Ret), d) = 尾盘是否在追随当日趋势(趋势型资金)还是逆势;(iii) 收盘冲击的自相关 cross_corr(day_close(Ret),
    cross_delay(day_close(Ret),1), d) = 尾盘冲击是否有持续的同向资金;(iv) 收盘分钟收益与最大成交额分钟收益之差 sub(day_close(Ret),
    day_topw_mean(Ret, Amt)) 的慢均值 = 尾盘价格相对日内最重分钟的偏离。算子实现:全部是 cross_corr / cross_regbeta(滚动
    60~120 日)作用在两个日频序列上,只用 t 日及以前的值,滞后用 cross_delay。与库的区别:库里 day_close(Ret) 只作为 cross_delay(day_close(Ret),1)
    等简单形式出现在 4 个候选里,没有"滚动回归斜率 / 滚动相关"的读法;已有 head(day_close(neg(Volume)) 一族)读的是收盘分钟的成交量水平,这里读的是收盘分钟价格冲击与后续
    / 同期收益的关系,量纲是斜率与相关系数,无量纲,不会被流动性 / 波动 / 市值控制线性吃掉。为什么样本外还会在:收盘冲击是被反转还是延续,取决于个股的参与者结构(指数成分
    / 融资盘 / 游资尾盘拉抬),这种结构变化慢(季度级),所以 60~120 日窗口的系数排名稳定,周换手低;系数本身是"这只票的尾盘价格是噪声还是信息"的代理,不依赖当期风格。风险:day_close(Ret)
    在一字板 / 停牌日为 0 且各板块收盘集合竞价制度不同(深市有、沪市某些时期没有),会引入结构差异,故以滚动系数而非水平做主力。数学检查:cross_corr
    一方为常数(停牌 / 一字板)返回 0 不是缺失,只影响少数票且已有可交易掩码;cross_regbeta 的自变量接近常数时斜率可能爆点,对排名后做控制回归不受单调变换影响,但个别票的极端值只占截面一两个名次;无前视(滞后只用
    cross_delay 正天数)。
