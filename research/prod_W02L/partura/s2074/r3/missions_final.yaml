    cross_delay(day_sum(Ret),1), 30/60),说明 K 的"慢滚动读法"有料。上一轮外围只试过"对昨日收益的滚动回归斜率"这一族;这一位全部换成别的读法:(a)
    K 的 60 日均值 / 120 日自身 z 分数 / 10 日对 60 日的差(放量事件的慢变状态,而非单日尖峰);(b) K 与当日收益、昨日收益、收盘分钟收益
    day_close(Ret)(共性表里 +1.93 的子树)、成交额波动 day_std(Amt) 的 60~120 日滚动相关,以及对 day_std(Ret)
    的滚动回归残差(去波动后的放量),读的是"放量是否伴随方向"这种结构关系,而不是放量水平(水平会被流动性 / 波动控制吃掉);(c) 流通市值桶内标准化 cs_bucket_zscore,去掉小盘票放量天然更大的结构;(d)
    对 120 日均值做比,度量放量的相对异常。与库的区别:库里含 K 的结构只有 cross_regbeta(K, cross_delay(day_sum(Ret),1),
    15/30/60) 一族,没有相关 / 残差 / 桶内标准化 / EMA 的写法,骨架禁令会再确认。为什么样本外还会在:10% 最大分钟的体量对下行尾部取残差后,代表无方向的事件性资金参与;事件性放量后的信息消化需要数周,窗口
    20~120 日、排名周内几乎不动,15bp 下换手低;相关类写法拿到的是资金行为与价格方向的稳定关系,不是风格水平,风格切换时不易翻号。风险:放量体量与流动性控制强相关,靠
    cs_regres 去掉尾部后仍可能残留,所以以滚动关系为主力。数学检查:无前视(滞后用 cross_delay 正天数);cs_regres 在某天有效票极少时可能为空,可交易掩码已去掉新股与长期停牌,不是爆点;cross_corr
    当一方为常数返回 0 的已知行为只出现在少数停牌票上。
