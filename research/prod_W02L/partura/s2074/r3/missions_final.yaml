    day_quantile_q25(Ret) 做截面回归取残差:剩下的是"没有被下跌尾部解释的放量",即与卖压无关的纯放量事件(换手事件、机构大单、题材启动)。依据:本批候选里含
    day_topw_mean(Amt, Amt) 的 7 个均值 -0.70、不含 -2.48(均值差 +1.78,p 0.000),含 cs_regres(topw,
