    struck_seeds: [8, 12]
    reasons: '创新度 4。核心 K = cs_regres(day_topw_mean(Amt,Amt), day_quantile_q25(Ret)) 在共性表里(+1.78, p 0.000),是 PI 点名的 E 核心,符合核心来源规则。相关度表:K 与 head ts_max(day_cov(nt_ts_delta(Amt,30),Amt),20) 的原始 |ρ| 为 0.52、残差 0.25,与其他 head 更低;与控制 liq 0.53、known 0.54、size 0.48、vol 0.13、rev 0.10,均低于 0.8 的核心划掉线。核心与 head 的重合主要在放量水平这一侧,去掉下行尾部后的残差与 head 基本不同,所以不判为同一个东西。种子逐个看:seed 1(cross_mean K 60,原始 0.66)接近 0.7 但未到线,与 liq 0.72、known 0.73 偏高,是 K 的平滑版,保留;seed 2、3、4、6、7、9、10、11 与 head 的原始 |ρ| 在 0.02 至 0.37 之间,残差 |ρ| 均 0.29 以下。划掉 seed 8(cross_corr K 与 day_std(Amt) 120 日,原始 |ρ| 0.71 对 ts_quantile_q75(day_ar1_coefficient(nt_ts_med(Volume,3)),50),到 0.7 自动划掉,且 liq 0.77、known 0.75 贴近控制)与 seed 12(div K 与 cross_mean(day_topw_mean(Amt,Amt),120),原始 |ρ| 0.72 对 ts_max(day_cov(nt_ts_delta(Amt,30),Amt),20),自动划掉,liq 0.76、known 0.77)。剩 10 个 ≥ 4。数学检查:cs_regres 是逐日截面 OLS,beta 在 var 不足时取 0,mask 处理正常;day_topw_mean 取 |w| 前 10% 分钟的均值,定义正常;cross_ema、cross_zscore、cross_mean、cross_corr 均是沿日轴的因果滚动窗;全部 seed 无 nt_*、无 ts_spearman、无 cross_shift 或 ts_shift 等前视算子,cross_delay 只用正天数;div(seed 12)的分母是 120 日均成交额均值,非零,已划掉不影响。注意一处机制与算子错位:rolling_ols(x,y) 以 y 对 x 回归,所以 seed 5 的 cross_regres(K, day_std(Ret), 60) 算的是 day_std(Ret) 对 K 的滚动残差,与计划里「K 对 day_std(Ret) 的滚动回归残差」的读法方向相反。这是描述与算子的不一致,不是数学问题,不划掉,写 GP 时应说明。合理度 4。如果它有 alpha,最可能来自:成交放量事件里去掉下行尾部后的残差(无方向的事件资金参与),与流动性控制有一半左右的交叠,alpha 最可能落在放量状态的 20 至 120 日慢变与价格方向之间的稳定关系上,而不是单日尖峰本身。'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: []
    reasons: '创新度 4。N 位读的是 day_close(Ret)(收盘分钟收益)的跨日结构,即滚动回归斜率、滚动相关与相对 topw 偏离。相关度表:12 个种子与 9 个 head 的原始 |ρ| 全部 ≤ 0.24(最高 seed 8,对 ts_max(day_cov(nt_ts_delta(Amt,15),Amt),20) 为 0.24);与控制 liq、vol、rev、known、size 全部 ≤ 0.27(最高 seed 8 的 vol 0.27),没有接近 0.5 的。head pow_2(day_close(neg(Volume))) 只与它共享「收盘分钟」这个位置,读的是价格冲击而不是成交量水平,不是同一个东西。库禁令针对 5583 条骨架的部分由 GP 兜底,这里只对 9 个 head 与 5 个控制核对。合理度 3。数学上无非法算子:cross_corr、cross_regbeta、cross_regres 都是 60 或 120 日的因果滚动窗,cross_delay 只用正天数,无 nt_*、无前视;cross_corr 一方为常数时返回 0,只影响停牌与一字板的少数票,已在可交易掩码内。但有一处机制与算子错位:rolling_ols(x,y) 以 y 对 x 回归,beta = cov(x,y)/var(x)。所以 seed 1、2 的 cross_regbeta(day_sum(Ret), cross_delay(day_close(Ret),1), d) 算的是「昨日收盘冲击对今日收益回归」的反向,即昨日收盘冲击 对 今日 day_sum 的回归,其分母是 var(day_sum),而计划里「昨日收盘冲击对今日收益的回归斜率」的经济读法需要 cross_regbeta(cross_delay(day_close(Ret),1), day_sum(Ret), d) 才对应。seed 10 cross_regres(day_sum(Ret), cross_delay(day_close(Ret),1), 60) 同样是反向残差;seed 9 是 seed 1 的时间轴 z 分数。这是描述与算子的不一致,不是数学问题,所以只在合理度里扣到 3,不划掉;但写 GP 之前应对调参数复核,否则 seed 1、2、10 读的是「昨日收盘冲击被今日收益解释的程度」,仍是有定义的信号,只是不是计划里的那个。seed 7 cross_regbeta(day_close(Ret), cross_delay(day_sum(Ret),1), 60) 方向与「尾盘冲击对昨日收益」的读法一致,无问题。无种子划掉:重复只在 seed 4 与 5(同一对、60 与 120 日窗)、seed 1 与 2(同一回归、60 与 120 日窗)之间,是窗口变化的正常搜索,不算重复。如果它有 alpha,最可能来自:尾盘分钟价格冲击被后续收益吸收还是反转的快慢,由个股参与者结构(指数、融资、尾盘资金)决定,这种结构季度级变化,所以 60 至 120 日的系数排名稳定,周换手低。'
