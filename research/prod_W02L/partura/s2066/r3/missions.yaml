    hypothesis: '今日日内量形状对本股自身典型形状的偏离。机制:每只股票有自己稳定的日内成交节奏(开盘冲击、午后低谷、尾盘放量),由持有人结构与做市习惯决定;某天形状显著偏离常态,说明当天有非常规的知情 / 事件驱动成交(或被动资金异常调仓),这类偏离在后几天会随信息消化而延续或回吐。实现:典型形状 = cross_ema(Volume, 60) 沿日轴逐分钟槽位平滑得到的 241 点曲线(用 cross_delay 取严格昨日及以前,今日形状不污染基准);今日形状 = Volume;用 day_corr(今日量, 典型量) 度量形状相关(1 = 与常态一致),或把两者各自除以当天总量后取分钟差的绝对值均值(day_mean(abs_(sub(...)))) 度量形状的 L1 距离,再用 cross_mean / cross_ema 多日平滑,cross_zscore 取相对自身历史的异常。与库里的不同:库里候选 (div(Volume, in_sum(Volume)) 的偏度 / 峰度的 20 日离散度,以及 in_cov(Ret, Close, 30) 一族) 读的是单日形状的自身矩或价格协方差,没有一条把今日形状与自身的多日基准曲线逐分钟比较;骨架也不同(两个库的骨架里没有「今日量与日轴 EMA 量逐分钟做差 / 相关」)。day_corr 在一方当天为常数(零成交)时返回 0 而不是缺失,停牌票会聚在 0,所以种子里部分用 L1 距离版本并配合平滑。样本外还会在的理由:形状偏离测的是成交结构的变化而非价格水平,不是对任何控制(流动性水平、波动、反转)的线性暴露;慢变量,换手低。'
