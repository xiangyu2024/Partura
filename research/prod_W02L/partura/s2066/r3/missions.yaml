    core: 'day_hurst(cross_ema(pow_1_5(Volume), 60))'
    hypothesis: 'day_hurst(cross_ema(pow_1_5(Volume), 60)) 是「该股票最近约 60 日(半衰期)平均日内成交量曲线」的 Hurst 指数:cross_ema 沿日轴逐分钟槽位平滑,得到典型日内量形状,再看这条形状在分钟轴上的持续性(长记忆)。它读的是股票的常态日内量节奏,是慢变量(持有人结构 / 做市分拆下单习惯)。上一轮最好的是 sub(核心, day_hurst(Volume))(train +1.23, valid +0.27):减去「当天原始量形状」的 Hurst,即典型形状与今日形状的持续性差,train 很强、valid 衰减但仍为正,是目前本种子唯一有正分的线索。上一轮外围只试了 Hurst 自己的原始量版本(Volume / pow_1_5(Volume))。这次换外围:(1) 做差的对象改成别的字段的 Hurst(Amt、价格 Ret 的 Hurst、较短半衰期 5 日 EMA 的量曲线),问的是「量节奏的长记忆是否独立于价格与金额的长记忆」,和上一轮对同字段原始量的差不同;(2) 用 cross_delay 把典型形状换成严格昨日及以前、今日形状进来比,去掉今日自己对 EMA 的贡献;(3) 做 cs_bucket_rank / cs_bucket_demean,在市值或成交额十分位内比较,去掉规模暴露但不假设线性;(4) 用 cross_zscore 取相对自身历史的偏离。库里 5583 条骨架没有 Hurst 类算子,所以不是库里同一个量。样本外还会在的理由:典型日内量形状的持续性是执行习惯(拆单、做市)决定的,变化慢,不靠某段行情;valid 上仍为正说明未完全过拟合 train。风险:Hurst 估计噪声大,所以多数种子带多日平滑。'
