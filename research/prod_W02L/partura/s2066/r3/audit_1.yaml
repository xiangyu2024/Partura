    struck_seeds: []
    reasons: '创新度 4:核心 day_hurst(cross_ema(pow_1_5(Volume),60)) 与外围的 Hurst 类算子在 9 个 head、库禁令骨架里都没有,库的 5583 条骨架也没有 Hurst 类算子(loc.md 共性表里这是富集子树,不是 head)。相关度表:核心与 9 个 head 的原始 |ρ| 最大 0.31(最像 cross_stddev(day_skew(div(Volume,in_sum(Volume))),20)),残差 0.17;12 个种子与 head 的原始 |ρ| 最大 0.28(seed 1 与 kurt 版),残差最大 0.17;核心与 5 个控制 |ρ| 全部低于 0.8(最大 0.23,市值)。与控制的相关上,seed 5、9、10 的流动性与已知族 |ρ| 在 0.50 到 0.56 之间,偏高但不是同一个量,且奖励已对控制的线性 U 形 S 形暴露做了残差。打 4 是因为 R/S 范围对标准差是与 head 的分布矩、方差类不同的度量。合理度 3:算子组合按定义实现了 R/S Hurst(dt_day.py:269-283,对每行做 demean 累积和的极差除以标准差,再取 log(T)),无前视,无 nt_*,无数值伪影(pow_1_5 对非负量合法,cross_ema 在 float64 中计算)。但经济解释与度量不符:R/S 作用在 241 点的平滑典型曲线上时,读的主要是曲线的累积起伏形状(开盘与尾盘的 U 形),H 值被压在 0.5 到 0.7 之间,差值更像形状差而非「交易节奏的长记忆」。另外核心假说里第 (2) 点(用 cross_delay 取严格昨日及以前的典型形状)在 12 个种子中一个都没有实现,且 cross_ema 仍含今日量(权重约 1.1%),典型曲线并非纯过去。这是计划与种子不一致,不是数学问题,所以打 3 而不是 2。如果它有 alpha,最可能来自:做市或拆单习惯决定的典型日内成交曲线形状,在个股之间的稳定排序;而不是长记忆本身。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [6]
    reasons: '创新度 3:没有任何 head 含 day_corr 或「今日分钟量与自身典型曲线」的比较(head 最大原始 |ρ| 0.41,是 cross_stddev(div(day_skew...)) 一族,残差 0.14 到 0.15),在 head 层面是新的。但与控制的相关很高的是水平版本:流动性 |ρ| 为 seed 1 0.37、seed 2 0.62、seed 4 0.38、seed 5 0.72、seed 6 0.84、seed 8 0.42、seed 9 0.36、seed 10 0.38;已知族 seed 2 0.62、seed 5 0.68、seed 6 0.78。噪声大、成交少的票曲线相关天生低,所以这些水平版本可能主要是流动性暴露换了写法。相对自身历史的版本(seed 3 的 cross_zscore 与 seed 7 的 cross_zscore 版 L1)与流动性 |ρ| 只有 0.01,与已知族 0.00 到 0.01,是最像新东西的,应在这里看到的新意主要来自它们。打 3 而不是 4 因为多数种子的新意被流动性相关拉低。划掉第 6 号:相关度表中它与流动性控制 |ρ| 为 0.84,达到自动划掉的 0.8 门槛(与第 5 号同族,平滑版)。第 5 号流动性 |ρ| 0.72,未达门槛,但留意。合理度 4:机制清楚:今日分钟量曲线与自身 60 日 EMA 典型曲线(严格昨日及以前)的偏离,用 day_corr 或 L1 距离度量。cross_delay(·,1) 严格取昨日及以前,无前视(cross_ema 本身只用 t 及以前的日子)。L1 版用 div(Volume,in_sum(Volume)) 归一化后比较,零成交时为 0/0 缺失,不会落入 day_corr 的 0 填充。陷阱检查:day_corr 对一方当天常数返回 0(dt_day.py:231-245),若零成交或一字板日子占比高,这些票会聚在 0;库里没有证据显示这一占比高到主导结果,故不作为定义坏掉。假说里的方向没有先验(延续或回吐都写进了假说),这是机制弱点,但不是数学问题。如果它有 alpha,最可能来自:知情或事件驱动的非常规成交日(曲线偏离),或者薄流动性票的曲线噪声(那样就是流动性,不是新东西,可以用相对历史的版本区分)。'
R:
  - head: 'cross_stddev(day_var(cross_med(Ret, 60)), 60)'
    soundness: 3
    reasons: '算子合法:cross_med(Ret,60) 是逐分钟槽的 60 日中位收益,day_var 取 241 个槽的方差,cross_stddev 对其取 d 日标准差(dt_cross.py:290-291);四个变体只改窗口或把 day_var 换成 day_std 再取 120 日标准差,都是合法算子,无前视,无 nt_*,无数值伪影。机制说不清:该量是典型日内收益曲线离散度的时间稳定性,与价格信息的关系没有交代,拉长窗口的理由靠拆解增益(+0.39),不是机制。这不是数学问题,打 3。变体与原 head 的 |ρ| 为 0.64、0.55、0.58、0.52,替换效果会与原 head 接近。如果有 alpha,最可能来自日内收益节奏随时间的稳定性(做市或收盘拉升习惯)。'
  - head: 'cross_stddev(day_skew(div(Volume, in_sum(Volume))), 20)'
    soundness: 3
    reasons: '算子合法:day_skew 对归一化量曲线取 241 点偏度,cross_stddev 取 d 日标准差;变体 60、120 为窗口拉长,cross_mean(day_skew,60) 为水平版本,都无前视、无 nt_*。除零成交外 div 的 0/0 为缺失,不会变成 0。机制说不清:为什么偏度的时间离散度比水平更有信息没有交代;水平版本(日内量分布长期偏斜,如尾盘或早盘集中的习惯)机制清楚,但它不是 head 的同一个量。注意变体与 kurt 版 head 的 |ρ| 为 0.53 到 0.65(相关度表中最像的 head 是 kurt 版而非 skew 版),替换后可能与库里 kurt 版 head 重合,这是后续替换判断的问题,不是本次审计的挡点。打 3。如果有 alpha,最可能来自个股日内成交分布偏斜习惯随时间的变化。'
