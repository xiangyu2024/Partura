      - 'cs_bucket_demean(cross_zscore(day_signed_ratio(Ret, Amt), 20), LogFloatCap)'
      - 'sub(cs_rank(cross_mean(day_signed_ratio(Ret, Amt), 10)), cs_rank(cross_mean(day_pos_ratio(Ret), 10)))'
      - 'cross_mean(sub(day_signed_ratio(Ret, Amt), day_signed_ratio(Ret, Volume)), 10)'
      - 'cross_mean(day_signed_ratio(Ret, Amt), 20)'
