    / cross_stddev 取质心的异常和离散度——放量时点突然后移或不稳定,是机构调仓日而不是常态;(2)cs_bucket_rank / cs_bucket_demean
    在市值或成交额十分位内比较,去掉大票尾盘放量多的规模暴露,但不假设线性;(3)与 day_centroid(Ret)(价格波动重心)作差:放量与价格变动不同时发生。库里
    5583 条骨架没有任何质心类算子,所以不是同一个量;它是慢变量(持有人结构),换手低,样本外应该留得住。风险:被流动性控制吃掉,所以一半种子用分桶配平。
