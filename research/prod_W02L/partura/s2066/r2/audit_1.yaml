    reasons: '核心 day_centroid(pow_3(pow_1_5(Volume))) 与快照 4 个 head 的日度秩 |ρ| 最大 0.05(相关度表 slot a core 行),与 5 个控制最大 0.21(known),均远低于 0.8 的核心门槛。库里 head 全是 order-free 的形状统计(cross_stddev(day_skew/day_kurt(归一化成交量)))和 in_cov 一族,没有时间位置类算子,所以是新量,创新度 4。种子:seed 2 / seed 7 是 cross_stddev(质心) 与 head cross_stddev(day_kurt(...)) 的 |ρ| 为 0.30 / 0.27(残差 0.19 / 0.19),两者都是「日内成交形状的截面离散度」这一族,但矩不同、不是换写法,保留。seed 6 的 day_centroid(Ret) 按 ops_ext.py:160 取的是 |Ret| 的质心(价格波动重心),与表达式注释一致。seed 8 cross_regbeta(两个质心)、seed 9 / seed 3 的 sub(EMA 长短差)都是因果的(cross_ema 与 rolling_windows 都是 trailing 窗口,dt_cross / common.py:433),没有 nt_* 与 shift 类算子。数学:Volume^4.5 在 float32 下只在单分钟成交量超过约 3.6e8 股时才溢出,A 股实际不触及,不挡。注意:指数 4.5 使质心几乎由当天最大的 1–3 根分钟决定,结果会近乎双峰(峰在开盘或在分钟轴末端时取 0 或 1),这是 PI 在 hypothesis 里已说明的设计选择,不是数学问题,放行;但审计时应预期它的信号可能退化成「日内峰值是否落在收盘撮合」这一度量。如果它有 alpha,最可能来自日内放量峰落在尾盘集合竞价(机构收盘撮合、被动资金按收盘价成交)还是开盘段的占比差。'
  - slot: b
