    reasons: '核心 day_hurst(cross_ema(pow_1_5(Volume), 60)) 与快照 head 的日度秩 |ρ| 最大 0.31(cross_stddev(day_skew(归一化成交量)), 残差 0.17),与 5 个控制最大 0.23(size),低于门槛。它不是任何 head 的子树,也不是控制的换写法,创新度 4;与 head 的 0.31 说明两者都是日内成交形状的统计,但 Hurst 是持续性/自相似度量而非偏度,保留。算子核对:day_hurst(dt_day.py:290)是对每行(241 分钟)做 R/S 估计,trailing 无前视;cross_ema(ops_ext.py:172)沿日轴做因果 EMA,缺失日被跳过而不是填 0,没有填充伪影;热身期只在 2018 年开头几十日权重集中,对 train 段影响可忽略。机制与算子对不上,这是挡不掉、但要记下的问题:hypothesis 讲的是「当天量节奏的持续性」(知情资金分拆下单),而 day_hurst 作用的是 60 日 EMA 平滑后的平均日内剖面,当天的节奏被大部分平均掉了,剩下的主要是这只股票典型的 U 形剖面深浅与持续性,更像慢变量的形态属性(与 size 的 0.23 相关也对得上)。真正把「当天节奏变化」带进来的是 seed 6 / seed 10 的 sub(平滑 Hurst, 未平滑 day_hurst(Volume^1.5)) 与 EMA 差分这两条通道,所以这两条是本位最有可能出 alpha 的地方。不是数学问题,放行,soundness 给 3。种子 seed 7(cross_ema(sub(...),10))与 liq 0.56、known 0.58 相关偏高,但未到 0.8 的自动划线线,且与 head 的残差 0.09、与 head 的原始 |ρ| 0.25 都不是重复,保留,只在结果里标记为最像控制换写法的一条。其余 seed 的 known / liq 都低于 0.4,无需划。'
