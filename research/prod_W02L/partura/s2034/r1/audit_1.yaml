slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。快照三个 head 中与槽 a 最近的是 head 1 ts_decay_linear(ts_max(day_sum(Amt),50),50)(水平的峰值)。相关度表:原始日度秩 |ρ| 最大 0.35(种子 6),其余多在 0.1 到 0.3;去掉 5 个控制后与 head 1 的残差 |ρ| 最大 0.53(种子 7)、0.51(种子 11),其余不超过 0.44;与已知族最大 0.39(种子 6),与流动性最大 0.34,与波动最大 0.50(种子 4),与 20 日反转最大 0.49(种子 11),与市值最大 0.14(种子 11)。种子的写法都是「当前放量或峰值 相对自己基线」(对数差、除以 cross_mean 或 cross_med 的 120 日基线、对自己 120 日历史的 cross_zscore、对 120 日基线的 cs_regres、在流动性 市值 名义股价分桶内标准化),水平不在表达式里,与 head 1 不是同一个量。种子 7 是最接近 head 1 的一个(流动性分桶内的 ts_max,残差 0.53),但原始 |ρ| 只有 0.26,按放行原则保留。组内有明显冗余:3、4、12、14 都是 cross_zscore 的不同平滑,5、13 都是 Amt 与基线之比的不同平滑,约 5 个构造撑起 16 个种子;这是槽内冗余而不是与库或控制的重复,不划,但请 PI 知道。合理度 4。逐个算子核对(AlphaCube dt_cross.py、nd_ts.py、nd_cs.py 与 Partura ops_ext.py):cross_* 沿日轴滚动,窗口含当天,cross_delay 只用过去;cross_zscore 为 (x 减窗口均值) 除以 (窗口标准差 + EPS),窗口平直返回 0,当天缺失返回缺失;log 对 |x| 不大于 1e-9 返回缺失;除数是 120 日均值或中位数(上市股票为正,div 没有零守卫但在可交易样本上不会为零);没有 ts_rank、cross_rank、in_rank_rolling,因此不碰 nanrank_last 把缺失当 0 的行为;cs_regres 与 cs_bucket_* 是同日截面,无前视。骨架检查:16 个种子的骨架经 struct/members.csv 的同一骨架约定对照(先对 5583 条库骨架自测),全部不在库中;命中库的只有三个 R head 自身。机制清楚:Gervais、Kaniel 与 Mingelgrin (2001) 的高成交量溢价,与 Barber 与 Odean (2008) 的注意力:放量后相对自己常态的股票在随后数周有正超额。如果它有 alpha,最可能来自放量引起的关注与可见度溢价(小市值、低关注股票最强),其次是放量时的短期反转。种子 16 的 ts_skew 对 log 成交额的左尾敏感(一字板、复牌首日的极小成交额会主导偏度),它读到的可能是地量日而不是放量,符号读法不清楚,但这不是数学问题。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [2, 9, 10]
    reasons: '创新度 4。快照三个 head 都是对成交额或成交股数单一序列的平滑、峰值或波动;槽 b 的 16 个种子全部是两个量之间的关系(滚动相关、滚动斜率、滚动回归残差、截面回归残差),没有任何 head 或控制是这种构造。相关度表:原始日度秩 |ρ| 最大 0.41(种子 10,之后划掉),未划的种子中最大 0.40(种子 4,对 head 1);去掉控制后与 head 的残差 |ρ| 最大 0.50(种子 14 对 head 1),其余不超过 0.45;与控制的最大 |ρ|(未划的种子)为与反转 0.41(种子 5)、与已知族 0.39(种子 13)、与流动性 0.37(种子 4、13)。库内有 85 条同时含 Amt 与 cross_regres、cross_regbeta 或 cross_corr 的成员,但 0 条同时含 log 与 Amt 与 cross_regres,0 条含 cross_zscore 或 cs_bucket_*(struct/members.csv 核对),所以「量与波动 收益的对数关系」在库里没有同类。划掉的三个如下,其余保留。种子 2 划掉(重复):与种子 1 同一对输入 lag(ret·z)、同一窗口 120 日;cross_regbeta(x,y,d) 是 y 对 x 的斜率(rolling_ols 实现),cross_corr 是相关,二者比值 = sd(ret)/sd(ret·z_lag) ≈ 1/RMS(z_lag),而 z 是自己 60 日窗口的 z 分数,RMS 近似为 1 且逐股变动小,所以截面排序近似相同;相关度表两者 3 个 head 与 5 个控制的数相差不超过 0.01。种子 9 划掉(与波动控制 |ρ| 0.849,不小于 0.8 自动划):它等于 60 日均 log σ(日内波动)对 60 日均 log A 的截面回归残差(log(σ/A) 与 log σ 对 log A 的残差相同),去掉的是流动性水平,剩下的就是波动本身,与波动控制同一个量。种子 10 划掉(重复):cs_bucket_zscore(种子 4, 流通市值) 只是在市值十分位内标准化种子 4 的 cross_regbeta(log A, log σ, 60);种子 4 与市值的 |ρ| 只有 0.013,分桶标准化几乎不改变次序,相关度表 8 个数相差不超过 0.02。未划、请 PI 注意:种子 12 与 16 的相关度表几乎相同(差 0.007),但 16 是 cross_regbeta,等于 corr 乘以 sd(ret_120) 除以 sd(lag z),与 12 的排序在按 sd(ret) 缩放的意义上不同,无法断定重复,放行;请补算 12 与 16 的截面秩相关。种子 5 与 13 都是「log A 对 log σ 的滚动回归残差」的不同平滑(10 日均值、60 日窗口 对 30 日均值、120 日窗口),相关度表差异明显,不划。合理度 4。三条机制链各有文献:投机性与对冲性成交(Llorente、Michaely、Saar 与 Wang 2002;种子 1、2、12、16);没有被价格解释的成交(Karpoff 1987 综述;种子 5、6、7、8、13、14);价格冲击弹性与量价相关(Kyle 1985、Amihud 2002;种子 3、4、11、15)。算子逐个核对:cross_regres 与 cross_regbeta 按对剔除缺失(两者都非缺失才参与),beta 在自变量方差不超过 1e-9 时为缺失;cross_delay 的滞后为 1,无前视;回归斜率、相关与残差都是无量纲的,不随成交额水平变化。已知的数值问题(挡不住,但 PI 要知道):(1) cross_corr 在有效点少于 2 个时返回 0 而不是缺失,恰好 2 个时返回 ±1,这两种极端都会出现在新股前几天;(2) cross_stddev(种子 8)背后的 nanstd_last 在窗口只有 0 或 1 个有效值时返回 0 而不是缺失,长期停牌与未上市股票会被推到该种子的一端(符号为 -1 时推到最高端);(3) 120 日窗口对新股的估计噪声很大。相关度表里覆盖率 1.0 因此偏高。这些应当由 steer.py 注释中的 untradable 掩码(上市太近、末 15 日冻结且最差五分之一)挡在持仓之外,PI 需确认「上市太近」的阈值大于新股进入窗口的前 2 到 3 个交易日。如果它有 alpha,最可能来自参与者构成(知情或投机成交与对冲成交的比例,Llorente 等 2002),或者量能没有被价格解释时的吸收与派发(Karpoff 的量价综述),其次是价格冲击弹性(Kyle 的 lambda 与 Amihud 的非流动性)。我最不看好的是种子 1、12、16 的相关与斜率版:日度收益噪声大,120 日估计的标准误与点估计同量级。'
R:
  - head: 'ts_decay_linear(ts_max(day_sum(Amt), 50), 50)'
    soundness: 4
    reasons: '合理度 4。四个变体把 head 1 的水平换成相对水平(除以 120 日均值、对数差、120 日基线的截面回归、流动性或市值分桶内标准化),代数正确:分母都是上市股票的正值,cs_regres 与 cs_bucket_* 都有守卫;方向 +1 与 head 1 一致。机制与槽 a 相同(放量的注意力与高成交量溢价),不是换皮:变体 1、2、3、4、6 的原始 |ρ| 在 0.19 到 0.38 之间,变体 5 为 0.77。两点请 PI 注意:(1) 变体同时把半衰期从 50 改为 25,分数比较混了「去水平」与「改窗口」两个改动;PI 笔记里 25 日版的 head 1 为 -0.34、50 日版为 -0.80,变体的增益应对照相应窗口来读;(2) 变体 5(市值分桶)与已知族 |ρ| 0.67、流动性 0.66 仍高,去水平没有去掉控制,过不了「已知族 |ρ| 小于 0.5」的门,留着无害。如果它有 alpha,最可能来自 25 日窗口内相对峰值的持续性,或与槽 a 同源的放量溢价。'
  - head: 'ts_min(inv(ts_std(ts_decay_linear(ts_decay_linear(day_sum(Amt), 50), 50), 10)), 10)'
    soundness: 3
    reasons: '合理度 3。数学上没有错:S 为正时 ts_min(inv(S),10) 等于 1/ts_max(S,10),变体 ts_max(·) 是同一个量的单调改写,但方向相反。head 2 的方向是 -1,因此它的有效信号随 ts_max(S,10) 递增;变体若要保持同一个信号,方向必须写成 +1。计划里的 R 变体没有方向字段,PI 笔记与 loc 里的「排序相同」只在符号翻转后成立;若沿用 head 2 的 -1,四个变体全部反号,测试无效,须在计划里写明方向 +1。另一个问题:变体 3 保留了第二层 50 日平滑,而 PI 自己的诊断说第二层平滑是烂部件(去掉后 -0.71),变体 3 与这一诊断矛盾;相关度表里它与 head 2 的残差 |ρ| 高达 0.85,实质上只是 head 2 换成对数写法。变体 1、2、4 去掉了第二层平滑或除以水平,机制是「10 日成交额平滑的不稳定性」,PI 没有给出这个不稳定性应带正或负号的理由,这是合理度降为 3 的原因,不是数学问题。nanstd_last 在全缺失窗口返回 0,与 head 2 在同一情形下(inv 得到 +inf,方向 -1 后到最低端)同向,不构成伪影。如果它有 alpha,最可能来自成交额不稳定性本身(放量的不可预测性与信息到达),但符号需要 PI 论证。'
  - head: 'ts_decay_linear(day_sum(Volume), 5)'
    soundness: 4
    reasons: '合理度 4。变体 3 sub(ts_decay_linear(log(day_sum(Volume)),5), LogFloatShares) 是 log(成交股数 除以 流通股本) 的 5 日加权平均,即对数换手率。LogFloatShares 是 log(FloatShares) 的日频字段(steering 文档确认),两者的差是尺度无关量;没有除法、没有可能为零的分母,数学干净。方向 -1 与 head 3 一致。机制是换手率与未来收益的负向关系(文献里常见的换手效应),这是 R3 里唯一带来新信息的变体:相关度表中它与 head 3 的残差 |ρ| 只有 0.12,与波动 0.49、已知族 0.37、市值 0.355、流动性 0.345,都在 0.5 以下。变体 1 是对成交额的截面回归残差(约等于 -log 名义股价加上共享水平的残余),变体 2 是流动性分桶内的成交股数 z 分数;两者与 head 3 的残差 |ρ| 都是 0.94,去掉控制后几乎就是 head 3,它们的增益只能来自名义股价效应,这个机制比换手弱,但没有数学问题。如果它有 alpha,最可能来自换手率本身(变体 3),其次是名义股价效应(变体 1)。'
summary: '槽 a 与槽 b 均通过(创新度 4、合理度 4)。槽 b 划掉种子 2、9、10 三个(2 与 10 为与种子 1、4 的重复,9 为与波动控制 |ρ| 0.849),剩 13 个。R1 与 R3 合理度 4;R2 合理度 3 仍保留,但计划必须写明方向 +1,且变体 3 与 PI 自己的诊断矛盾,需要修正。未发现前视、因算子导致的 nanrank 缺失当 0 陷阱或禁用算子;数值层面的 cross_corr 与 nanstd_last 的 0 填充、以及新股的少点噪声,要靠 untradable 掩码挡住,PI 需确认阈值。相关度只覆盖快照的 3 个 head,库内其余成员与别的流、W01 的 heads 的秩相关未核对。全程只用 train 与 valid 的数据和源码,没有读取或计算任何 2026 年的结果。'
