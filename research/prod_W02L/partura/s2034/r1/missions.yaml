- type: N
  hypothesis: |
    机制:成交额序列与价格变动之间的关系(量能不能推动价格),以及「没有被价格解释的成交」,读成无量纲的相关、弹性、回归残差。

    本批(B100)里的缺口:32 条成员全是成交额的单变量时间序列(水平、平滑、峰值、波动),没有一条把当天的成交额与当天的价格变动联系起来(只有手写库 L#289 / L#321 两条把 Amt 与 Volume 相除)。证据:
    (1) 水平版全部是控制的化身:`day_sum(Amt)` 与已知族 rho 0.89,平滑版 0.98。把 Amt 换成 Volume(股数 = 金额 ÷ 名义价格)rho 降到 0.58 到 0.72;不带峰值的水平版分数从 -3.6 抬到 -1.4,带峰值的 head 1 却从 -0.80 掉到 -1.78,方向 -1:股数版只是少了一点与控制共享的水平,多出来的是名义股价,不是 alpha。
    (2) head 2(`ts_min(inv(ts_std(两层平滑的 Amt, 10)), 10)`)是整个快照里 valid 最接近 0 的一个(-0.10,train -1.26),拆解里去掉第二层平滑后 -0.71 / -0.32:读的是成交额水平的「漂移速度」。但它没有说这种漂移是不是伴随价格变动 —— 一次放量如果没有推动价格,说明有人在另一侧吸收;推动了价格,说明是方向性的订单流。这一对关系库里没人读过。

    为什么会有 alpha(三条链,各自对应一组种子):
    (a) 投机性成交与对冲性成交(Llorente、Michaely、Saar 与 Wang 2002):放量之后收益延续的股票,放的是知情 / 投机性成交;放量之后收益反转的股票,放的是对冲 / 流动性成交。做法是看「昨天的收益 × 昨天的相对成交量」能否预测今天的收益(种子 1、2、12、16)。这是个股层面的慢变特征(参与者构成),估计窗口 120 日。
    (b) 没有被价格解释的成交(Karpoff 1987 的量价关系综述,威科夫的「努力与结果」):对 log 成交额与 log 日内波动做 60 日滚动回归,取最新一天的残差,再做 10 到 30 日均值。残差为正 = 成交很大但价格没怎么动,可能是知情方在悄悄吸收或派发,乘以收益符号(种子 7)区分吸筹与派发。滚动回归的截距吸收了各股自己的水平,所以残差与流动性 / 市值水平正交(种子 5、6、7、8、13、14)。
    (c) 价格冲击弹性(Kyle 1985 的 lambda、Amihud 2002 的非流动性):log 波动对 log 成交额的 60 日回归斜率(种子 4、10)、波动与相对成交量的相关(种子 3)、量与收益的相关(种子 11)、对数 Amihud 残差(种子 9,先对 Amt 水平做截面回归,去掉与流动性控制共享的水平)。斜率 / 相关都无量纲,不是 Amt 的水平。

    算子怎样实现:`cross_regres(x, y, d)` 是 y 对 x 的 d 日滚动回归在当天的残差,x 在前;`cross_regbeta(x, y, d)` 是斜率;`cross_corr` 是滚动相关;`cross_zscore(log(day_sum(Amt)), 60)` 是当天成交额对自己 60 日历史的 z 分数;`day_sum(Ret)` 是当天分钟收益之和(盘中收益),`day_std(Ret)` 是当天分钟收益的标准差(日内波动);`day_wmean(Ret, Amt)` 是成交额加权的分钟收益(种子 15,资金实际经历的收益 与放量的关系);`cross_delay(·, 1)` 把昨天的值放到今天对齐。种子 10、14 再按流通市值 / 流动性十分位分桶(cs_bucket_zscore / cs_bucket_demean),把残余的规模差去掉。

    和库里已有的、和 head 的不同:
    (a) 库里成交额基本只出现在单变量滤波里;我读过的库内 11 条在日度和上做 cross_corr / cross_regbeta / cross_regres 的成员,都是随机拼出的价格与量混合(例如 `cross_corr(day_sum(Close), day_max(High), 10)`),没有一条是成交额对收益 / 波动的滚动关系或回归残差。16 个种子的骨架逐个与 struct/members.csv 的 4077 个不同骨架对照,全部不在其中。
    (b) 与 head 1 / 2 / 3(成交额水平的平滑 / 峰值 / 波动 / 股数水平)的区别:这里读的是两个量之间的关系或回归残差,不含水平,所以与它们的秩相关预计 < 0.3。
    (c) 与波动控制(`cross_mean(day_std(Ret), 20)`)的区别:弹性、相关和残差都对波动做了条件化或配对,预计与波动控制的秩相关 < 0.5;如果对波动控制 >= 0.8 会被相关度表划掉,不影响其余种子。
    (d) 与本波别的流不重复:2001 号流的 N 位读分钟级的放量价格签名;这里是日级的量价关系。

    为什么样本外还会在:(a) 参与者构成与市场深度是慢变量(以年计),窗口 60 到 120 日下排名稳定,换手低,分数由毛超额决定;(b) 全是无量纲统计量(相关、斜率、z 分数、残差),不依赖某段行情的方向,也不受送转拆股影响;(c) 三条链互相独立,至少两条在文献里有样本外的事实;(d) 水平被滚动回归的截距或分桶吸收,尺子的 7 个控制 + 它们的平方三次方吃掉的部分很小,剩下的就是这个信号本身。最可能的失败:(1)日度收益噪声大,60 到 120 日的相关 / 斜率估得太吵(种子 1、2、12、16 最容易);(2)弹性与相关类是波动控制或 20 日反转的另一种写法(放量与大涨大跌同时出现),表上相关偏高;(3)毛超额为 0,15 bp 吃掉所有。

    数学检查:`log(day_std(Ret))` 在一字板 / 停牌日 day_std = 0,log 在 |x| <= 1e-9 时给 NaN,这些日子在回归里被配对剔除,不是 -inf;cross_regbeta 在自变量方差 <= 1e-9 时给 NaN;`cross_corr` 在有效点不足 2 个时返回 0(已知缺陷),只影响新股与长停牌股和训练开头 120 日(不到训练段的 9%),不主导排序;没有用 ts_rank / cross_rank(日轴);cross_delay(·, 1) 的天数为正,今天只用昨天及以前,无前视;所有窗口只回看含当天,t 日收盘后可得、t+1 才交易;没有除以近零的量(除数都是对数差或 z 分数的标准差窗口,无逐位相同时 cross_zscore 返回 0);种子在合成立方体(70 只 × 300 日 × 241 分钟,含停牌与未上市)上全部能算,覆盖 97% 到 98%,每日取值几乎全不相同,无 inf(只是检查运行时,不是分数)。
