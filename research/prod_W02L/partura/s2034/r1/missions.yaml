  hypothesis: |
    机制:「最近一个月成交额相对自己的常态放出的尖峰」,而且把水平在表达式里就去掉,不靠尺子事后回归。

    本批(B100,`day_sum(Amt)` 一族 32 条,3 个素材 head 全是负分)里的证据:
    (1) 这一族在库里的原始读数(struct/members.csv,只含 train):多数成员秩 IC -0.03 到 -0.05,换手 1% 到 8%,库自己尺子下的净夏普 +1.3 到 +1.9,是流动性溢价的教科书形态。新尺子(去掉 5 个控制 + 2 个冠军)下全部转负:`day_sum(Amt)` 与已知族 rho 0.89,`ts_decay_linear(day_sum(Amt), 50)` 0.98,三个素材 head 的分数 -0.80 / -1.26 / -1.34。结论:成交额的水平就是控制的化身,水平里没有剩下的东西。
    (2) 拆解表里唯一符号对得上、分数最高的是 `ts_max(day_sum(Amt), 50)`:方向 +1(买近 50 日峰值大的)、半衰期 5,分数 -0.50(train -0.50 / valid -0.34)。head 1 在它外面再套 ts_decay_linear,窗口 100 / 50 / 25 的分数是 -1.36 / -0.80 / -0.34,平滑越长越差。读法:有内容的是「最近一个月放过多大的量」这件事本身,长平滑只是把水平加了回来。
    (3) 但 `ts_max(day_sum(Amt), 50)` 与已知族 rho = -0.93,尺子看到的只是剩下的 7%,而这 7% 恰好是「峰值相对水平」。所以这一位把「相对」直接写进表达式:峰值除以(或减去)自己的基线,而不是让尺子去回归。

    为什么会有 alpha(两条可检验的链):
    (a) Gervais、Kaniel 与 Mingelgrin(2001)的高成交量溢价:成交额相对自己常态显著放大的股票,因可见度上升而在随后数周有正的超额收益,溢价在小市值、低关注度的股票里最强。
    (b) Barber 与 Odean(2008)的注意力:放量把散户的买入集中到引人注意的股票上,A 股散户占比高,这条链更强;方向也可能反过来(放量后的反转)。方向不预设,由尺子在训练段定。

    算子怎样实现(每个种子由三块拼成):
    (i) 度量放量的统计量:峰值(ts_max / cross_max)、上尾均值(cross_tail_mean_q75)、75 分位(cross_quantile_q75)、均值 / 指数均值(cross_mean / cross_ema)、偏度(ts_skew)。
    (ii) 去水平的办法:对数差、除以 120 日均值或中位数、对自己 120 日历史做 cross_zscore、对 120 日对数均值做截面回归 cs_regres、在流动性十分位 / 流通市值十分位 / 名义股价十分位(sub(LogFloatCap, LogFloatShares) = log(流通市值 ÷ 流通股本))内标准化(cs_bucket_zscore / cs_bucket_demean)。五种写法互相独立,如果有效就不依赖某一种。
    (iii) 方向条件:无条件、乘以当天日内收益的符号或大小(`day_sum(Ret)` = 当天分钟收益之和),看放量是出现在上涨日还是下跌日。
    窗口:峰值窗 20 到 50 日(拆解里的甜区),基线 120 日(基线必须比峰值窗长得多,否则峰值把自己的基线抬起来)。

    和库里已有的、和 head 的不同:
    (a) 本批 32 条里 ts_max / ts_quantile / ts_std 都直接作用在成交额水平上;全库 5598 条里没有把成交额除以或减去自己的 cross_mean / cross_med 基线(grep 核对),也没有 cross_zscore、cross_ema、cs_bucket_*(各 0 条),所以「相对自己常态的放量」没人读过。
    (b) 16 个种子的算子骨架(skeleton_key,抽掉字段、常数、窗口)已逐个与 struct/members.csv 解析出的 4077 个不同骨架对照,全部不在其中。
    (c) 种子 8、15 用日频叶子 LogFloatCap / LogFloatShares 作分桶键;库里 0 / 5598 条用过任何一个日频叶子(grep 核对)。
    (d) 与 head 1 的区别:head 1 与已知族 rho -0.9,是水平;这里的种子除以基线、对基线回归或在水平分桶内标准化,水平不在,所以秩相关表上与三个 head 预计 < 0.5,与流动性 / 市值控制预计 < 0.5。

    为什么样本外还会在:读的是事件(放量),事件每个月都发生,不依赖某一段行情的风格;峰值窗是月度量级,换手低;5 种去水平写法同时在场,真有信号时不会只在一种写法上成立;表达式是无量纲的比值 / z 分数 / 回归残差,不受送转拆股的水平跳变影响(Amt 是金额,本来就不受股数影响)。最可能的失败:(1)「放量」与 20 日反转和波动控制同源(放量常伴随大涨大跌),被尺子去掉 —— 种子 9、10 用日内收益的符号 / 大小是为了把这块显性化,看它到底是方向还是纯放量;(2)毛超额本来就是 0,和库里一样亏在 15 bp;(3)基线在新股和长期停牌股上估不准。

