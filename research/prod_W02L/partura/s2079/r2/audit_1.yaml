    reasons: 'E 位。核心 day_corr(in_slice(Amt,2,240), in_slice(Ret,1,239)) 与 6 个 head 的原始 |rho| 最大 0.03,与 5 个控制最大 0.16(rev),核心本身不是 head 的换皮,也不与控制重合,E 位的核心控制条件 (<0.8) 通过。种子整体的审计:a1 ts_stddev(core,20) 与 range 波动 head (ts_stddev(sub(div(day_max(High),ts_delay(day_last(Close),1)),1),100)) 原始 |rho| 0.52,a2 ts_stddev(core,60) 为 0.63,a6 cross_regbeta(core,day_sum(Ret),60) 为 0.68,都在 0.7 自动划掉线之下,残差 |rho| 分别为 0.23、0.47、0.41,说明去掉 head 与控制后不是同一个东西,保留。a1、a2、a11 与 known 控制 (cross_mean(day_std(Amt),30)) 的 |rho| 为 0.45–0.48,是部分重合但不是同一个量,不划。a10 cs_bucket_demean(cross_mean(core,30),LogFloatCap) 与 r1 已出现的 cross_mean(core,20) 不同(多了窗口与分桶),不算外围重复。a3、a4、a5、a7、a8、a9、a11、a12 与所有 head 的 |rho| 都在 0.5 以下,不是换皮。创新度:库里 6 个 head 全是 Amt 的跨日协方差 / 回归 beta(经 ts_max 或 ts_var)与 range 的 ts_stddev,没有一个用过 day_corr 的错位量价关系;种子度量的是这个关系的不稳定性、与日内收益的耦合、去水平的变化和尾部,所以给 4。合理度:逐个核对算子。in_slice(Amt,2,240) 与 in_slice(Ret,1,239) 都是 239 列且对齐(Amt 第 j+1 分钟对 Ret 第 j 分钟),都在当天之内,没有前视,没有填充值;ts_stddev、ts_skew、ts_max、ts_min、ts_quantile_q75(ts_quantile 的 q=0.75 版本,已在目录中)、cross_corr、cross_regbeta、cross_regres、cs_bucket_demean 的定义与用途都正确;mul 与 sign 的符号切换机制清楚。唯一的风险是 §4 的 day_corr 定义:某一方当天是常数(一字板、零波动)时返回 0 而不是缺失,这些票的核心值会聚在 0,ts_stddev 与 ts_skew 会部分量到这类天数的频率。这是要核实的点,但我无法判断它是否主导结果,不据此挡。如果有 alpha,最可能来自:成交与价格之间的追随/回吐关系本身的不稳定性(参与者结构在不同阶段切换),其次是一字板涨停股的流动性状态。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: 'N 位。种子用的三个节点 day_signed_ratio(Ret,Amt)、day_wmean(Ret,Amt)、day_topw_mean(Ret,Amt) 都不在 6 个 head 里(head 只用 Amt 的跨日协方差 / 回归 beta 与 range 的 ts_stddev),与 head 的原始 |rho| 最大 0.49(b6 cross_ema(sub(day_wmean(Ret,Amt),day_mean(Ret)),30) 对 range 波动 head,残差 0.25),所有种子都在 0.7 之下,不划。与控制的关系:b1 cross_mean(day_signed_ratio,20)、b4 cross_mean(sub(day_wmean,day_mean),20)、b7 cross_mean(day_topw_mean,20)、b11 cs_bucket_demean(cross_mean(sr,20),LogFloatCap) 与 20 日反转控制的原始 |rho| 为 0.55–0.64,因为 20 日均值的符号比与 20 日收益的符号高度相关。这是「控制换个写法」的迹象,但没有达到 0.8 的自动划掉线,而且奖励是对控制取残差的,这几个种子会被残差压低,不是审计员可以挡的理由,只记下来。b10 与 liq 0.29、size 0.22 的相关也在线内。创新度给 4:三个节点度量的是成交量加权的买卖失衡与金额加权收益,与库里所有 head 与控制都不同(是「钱落在哪一边」,不是「什么时点」,也不是幅度),只有部分种子与反转控制重叠。合理度:逐个算子核对。day_signed_ratio(x,y) = sum(|y|·sign(x))/sum(|y|),有效分钟才计分母,定义无误、有界。day_wmean(x,w) 以 |w| 为权重,定义无误;sub(day_wmean(Ret,Amt), day_mean(Ret)) 的符号与含义清楚。day_topw_mean(y,w) 取 w 的前 10% 分钟(含并列),定义无误。cross_zscore、cross_mean、cross_ema、cross_corr(对日收益和 signed ratio,40 天)、cs_bucket_demean 定义正确。b12 cross_mean(sub(sr(Ret,Amt), sr(Ret,Volume)),30) 的两个 sign 份额差来自 Amt 与 Volume 只差一个日内价格权重,差值可能偏小,主要是噪声,但不是数学问题,不挡。风险点同 a 位:day_signed_ratio 在收益全为 0 的分钟计入分母而不计入分子,一字板涨停日会被压向 0(而不是 +1),这与「买压」的含义相反;这是定义上的弱点,需要核实它是否主导结果,目前不据此挡。如果有 alpha,最可能来自:大额资金的单边买卖在多日里延续(拆单执行、信息扩散),其次是涨停锁仓日的买压被压低后的状态差。'
