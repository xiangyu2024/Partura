  - sub(ts_stddev(sub(div(day_max(High), ts_delay(day_last(Close), 1)), 1), 50), ts_stddev(sub(div(day_min(Low),
    ts_delay(day_last(Close), 1)), 1), 50))
  - ts_stddev(sub(div(day_max(High), ts_delay(day_last(Close), 1)), 1), 100)
  - sub(ts_stddev(sub(div(day_max(High), ts_delay(day_last(Close), 1)), 1), 50), ts_stddev(sub(div(day_min(Low),
    ts_delay(day_last(Close), 1)), 1), 200))
