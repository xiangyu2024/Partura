    reasons: 'N 位。新想法是「即时反应速度」:day_corr(Amt_t, Ret_{t-1}) 减去滞后 5 或 10 分钟的相关,再取多日峰值或分位。快照的 9 个 head 没有一个用过 day_corr 的错位量价关系,库里 day_corr 的错位量价只在 E 位的共性表里出现,所以这个度量对 head 是新的。原始 |rho| 最大 0.60(b7,与振幅的 ts_stddev head 相关),b5、b10 分别为 0.49、0.48,其余 0.02–0.32;残差最大 0.30(b10 与 ts_stddev head);与控制最大 0.61(b7 与 known,b7 与 liq 0.60)。b7 与 head 的 0.60 离 0.7 的库禁令线只差一点,与 liq / known 的 0.6 也较高,但都低于 0.7 与 0.8 的自动划线;它是 q75 版的 day_corr(Amt,|Ret|),度量的是量与绝对收益的协同而不是 Amt 水平,放行,但 PI 要在 GP 的库禁令检查里留意它。逐个核对算子与对齐:b1 ts_max(lag1 减 lag10,40):lag1 为 Amt[2..240] 对 Ret[1..239](239 列),lag10 为 Amt[11..240] 对 Ret[1..230](230 列),滞后方向正确; b2 lag1 减 lag5 对 Amt[6..240] 对 Ret[1..235]; b3 cross_mean 20 日; b4 ts_quantile_q75(lag1 减 lag5,20); b5 ts_max(corr(Amt,|Ret|),40); b6 in_delta(Amt,1) 的 in_slice(2,240) 全部有效(in_delta 的前 d 列为 NaN,切片从 2 起不受影响); b7 与 b5 同构的分位数版; b8 上下午两半的 119 列对 119 列,滞后 1 一致; b9 cross_zscore(差,60),cross_zscore 含当天,无前视; b10 corr(Amt,Ret) 减 corr(Amt,|Ret|) 再取 ts_max; b11 cs_bucket_demean 按 LogFloatCap 分桶; b12 滞后 2 的 Amt[3..240] 对 Ret[1..238],长度 238 对 238,与峰减均值同构。全部无前视,无填充值,无 nt_*。风险点:lag10 的相关样本少掉了开盘 2..10 分钟(高换手的开盘段),所以 lag1 减 lag10 的差值里混入了「开盘段与其余时段相关性之差」,不是纯粹的反应速度对比;lag5 同理少掉 5 分钟。这是构造上的混杂而不是数学错误,且不能确定它是否主导结果,按 §3 放行,并提醒 PI 结果解释时要把两者分开。如果有 alpha,最可能来自:参与者的执行技术(算法 / 程序化 对 人工拆单)在 1 分钟与 5–10 分钟两个时间尺度上的反应差异,次之来自开盘段的成交与价格错位。'
