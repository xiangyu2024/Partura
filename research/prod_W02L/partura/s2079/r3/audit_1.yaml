    reasons: 'E 位。核心 ts_max(day_corr(in_slice(Amt,2,240),in_slice(Ret,1,239)),40) 与快照 9 个 head 的原始 |rho| 最大 0.40(最像的是 ts_stddev(日内高点振幅,100)),残差 0.21;与 5 个控制最大 0.23(known),均低于 0.8 的核心控制线,E 条件通过。快照里的 head 全是 Amt 的跨日协方差 / 回归 beta(经 ts_max 或 ts_var)、振幅的 ts_stddev、成交量的均值,没有一个用过 day_corr 的错位量价关系,所以核心不是 head 的换皮。外围逐个核对(原始 |rho| / 最大控制 |rho|): a1 sub(ts_max,ts_mean) 0.32 / 0.14 与 a2 div(ts_max,ts_stddev) 0.25 / 0.29(liq) 是对自身历史去水平或标准化,度量的是峰值相对常态的位置,放行; a3 峰值减 Volume 版峰值 0.10 / 0.16,是金额与股数的差,放行; a4 反向 (Ret 领先 Amt) 峰值差 0.25 / 0.20,是价格跟随成交还是成交跟随价格的对照,放行; a5 减 |Ret| 版峰值 0.32 / 0.27(known),与控制有一定重合但不是同一量,放行; a6 乘 sign(20 日均收益) 0.11 / 与 rev 控制 0.58,这是把 20 日反转二值化后乘在峰值上,与 rev 的重合较高但远低于 0.8,且残差后保留的仍是峰值的截面结构,放行; a7 对 day_sum(Ret) 做 60 日回归残差 0.07 / 0.09(vol),放行; a8 cs_bucket_demean(峰值, LogFloatCap) 0.40 / 0.35(known),是去掉规模分桶后的峰值,放行; a9 cross_zscore(峰值,60) 0.10 / 0.16(rev 与 size 之外的 rev),放行; a10 峰值减最小值 0.46 / 0.30(known),与 head 的重合最高但非同一量,放行; a11 峰值乘 cross_rank(day_std(Ret),20) 0.11 / rev 0.25,放行; a12 ts_delay(峰值,20) 0.40 / 0.17,是核心的 20 日滞后版,与核心为同一对象只是滞后,不是 head 或控制的换皮,放行。数学核对:in_slice(Amt,2,240) 与 in_slice(Ret,1,239) 都是 239 列且对齐(Amt 第 j+1 分钟配 Ret 第 j 分钟),无前视,无 in_shift / ts_shift / cross_shift,无 nt_*,无 end=241 越界;in_delta / cross_zscore / cross_regres(对日轴滚动 OLS 残差) / cs_bucket_demean 的定义与用途都正确。唯一需要核实的一点是 §4 的 day_corr 定义:一字板或零波动日一侧为常数时返回 0 而不是缺失,a10 的 ts_min 会把这些 0 当作极小值,a10 的结果可能部分是「近 40 日有过一字板」的指示。目前无法判断它是否主导结果,按 §4 不据此挡。如果有 alpha,最可能来自:同一只股票近 40 个交易日内出现过的、成交与价格同向错位的单日极端事件的频率和强度(追价订单流的事件型脉冲),其次来自 Amt 相对 Volume 的价格水平成分,或一字板日的 0 填充造成的截面结构。'
