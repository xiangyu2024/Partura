- type: E
  core: 'ts_max(day_corr(in_slice(Amt, 2, 240), in_slice(Ret, 1, 239)), 40)'
  hypothesis: >-
    Core = the 40-day maximum of the within-day lead-lag correlation between a minute's turnover and the previous
    minute's return (Amt over minutes 2..240 against Ret over minutes 1..239, no fill value). It is the single most
    enriched subtree in the batch (+2.41, p 0.000, six candidates, all of them positive) and its sibling ts_max@50 was
    the best earlier result (+0.41, train +0.46 / valid +0.41), the closest to the 0.5 line; round 2 changed the core
    around the plain series (ts_stddev, level-minus-mean, return interaction) but the peak statistic itself only got
    ts_max/cross_decay_linear stacked on it. The mechanism: the maximum picks out the stock's most extreme day of
    money-follows-price in the last 40 days, i.e. an episode of one-sided, price-chasing order flow (retail momentum
    chasing or an institution splitting an order after its own footprints). Such episodes are rare, event-like and
    leave drift after them, which is why the peak works while the average (cross_mean@30, -0.98) does not. This round
    keeps the peak and changes what it is compared with, not how long it is smoothed: (a) minus the stock's own
    40-day mean of the same series or divided by its 40-day stddev (how far the peak is above that stock's normal
    behaviour: removes the persistent level that liquidity/size controls absorb); (b) minus the peak of the same
    correlation computed with Volume instead of Amt (the part of the coupling that comes from price level rather than
    share count: money-weighted vs share-weighted flow); (c) minus the peak of the reverse direction (price follows
    turnover: impact) or of the absolute-return version (volatility-volume feedback), so only the pure
    chase-after-price part is left; (d) a regression residual against the daily return and a return-sign interaction,
    separating chasing after gains (lottery demand) from after losses (capitulation); (e) a size-bucket demean and a
    cross-sectional z-score so that the ranking is within comparable stocks and days. None of these (difference from
    own-history, ratio to own dispersion, cross-field peak differences, sign interaction, bucket demean) is in the
    seen periphery, which is only ts_max@50, ts_max stacked on ts_max, cross_decay_linear and plain ts_max@40. Out
    of sample: who trades after price moves is a slow participant-mix property of each stock, and ranking on the
    peak relative to the stock's own norm is not the liquidity level the controls remove.
