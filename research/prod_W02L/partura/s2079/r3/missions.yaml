- type: N
  hypothesis: >-
    New idea: the SPEED of the flow response to price inside the day. Round-2's only working piece correlates turnover
    with the return one minute earlier. A stock whose turnover responds to price within one minute (fast, algorithmic
    or momentum-chasing flow) behaves differently from one whose turnover responds ten or thirty minutes later (slow,
    human or institutional flow that is being worked). The statistic is the difference of two lead-lag correlations,
    day_corr(Amt_t, Ret_{t-1}) minus day_corr(Amt_t, Ret_{t-k}) with k = 5 or 10, implemented by slicing the two minute
    series with different offsets (equal-length slices: Amt over 11..240 against Ret over 1..230 for k=10; Amt over
    6..240 against Ret over 1..235 for k=5) and subtracted. The gap is positive when the immediate reaction dominates
    and negative when it is delayed. It is then summarised by its own multi-day peak (ts_max, the form that worked for
    the one-lag version) or by a stock's deviation from its own history. Other seeds change what is correlated: turnover
    with absolute return (attention following surprises irrespective of sign: volatility-volume feedback), turnover
    change in_delta(Amt) with return (the new-money arrival rate), and the reaction to the intraday amplitude of
    returns in the first versus the second half of the day (in_half). The difference of two correlations of the same
    stock on the same day removes the stock's level of Amt-Ret coupling, which is largely a liquidity and volatility
    attribute that the controls absorb; what is left is the timing profile of order flow, which is not any
    snapshot head (heads are cross_cov of Amt levels, regression betas of price range, hurst and quantile-of-std
    statistics) and not the single-lag core itself. Out of sample: reaction speed is an execution technology / participant
    type property (algos vs discretionary flow), persistent across stocks and years, and the ranking is on the profile
    not the level.
  inspired_by: >-
    Batch commonality table: day_corr(in_slice(Amt, 2, 240), in_slice(Ret, 1, 239)) appears in 52 candidates with mean
    difference +0.84 and its ts_max@40/q75@1 forms are the top two rows (+2.41, +1.98); earlier rounds only varied the
    smoothing and the daily-series statistics around the single one-minute lag, never the lag itself.
