attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 6, 11]
    reasons: '创新度 3。核心 G = cross_ema(day_gini(Amt), 60) 是尺度不变的成交额集中度(基尼,值域 [0,1)),它与库里 head 的最大原始 |ρ| 为 0.41(对象是 cross_quantile_q25 那个成交量底),对 5 个控制取残差后与 head 的 |ρ| 只有 0.16,所以不是任何 head 的换写。但它的原始秩与流动性控制 |ρ| = 0.75、已知族 0.67、市值 0.64 都偏高,说明它大部分原始变异落在成交额水平 / 分散度这条轴上,打不到 4 或 5。合理度 4。day_gini 对分钟 |Amt| 求基尼,全天无成交返回缺失(函数内 tot > 0 判断),值域有界、无爆点;cross_ema 是尾随、跳过缺失日的 EMA,无前视;没有触发 §4 的任何陷阱。核心对 5 个控制的最大 |ρ| 是 0.75(流动性),低于 0.8,过核心门槛。划掉的种子:第 6 号 mul(G, cs_rank(LogTotalCap)) 与市值控制 |ρ| = 0.82,第 11 号 cs_first_low40(LogTotalCap, G) 与市值 |ρ| = 0.81,两者按表自动划掉;第 1 号 cs_regres(G, LogFloatCap) 判为重复:奖励已对 LogFloatCap 的排名及其平方、三次方取残差,先对原始市值做回归再排名,在奖励空间里与核心几乎相同,划掉。第 7 号 cs_bucket_demean(G, LogFloatCap) 是分段去均值,非线性,与奖励的多项式去除不同,保留。第 3 号 sub(G_Amt, G_Vol) 是两个近似相同的成交额集中度相减,信号可能很弱,但既不是数学问题也不是明显重复,保留。剩余 13 个种子,远多于 4。如果它有 alpha,最可能来自:成交额在一天之内是挤在少数几分钟(事件 / 大单驱动)还是被 VWAP 式摊平(机构被动执行),这是持有人结构的慢变量;若它只是流动性的另一种写法,残差后应很快消失,这一点交给 GP 的奖励去检验。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [2]
    reasons: '创新度 3。核心 N 是分钟收益的 Durbin-Watson:day_durbin_watson(Ret),值域有界。库里没有以它为主信号的 head,原始秩与所有 head 的 |ρ| 都不高(最大 0.25,对象是 cross_quantile_q25 那个成交量底)。但对 5 个控制取残差之后,大部分种子与成交量底 head 的残差 |ρ| 升到 0.50 到 0.63(b1 为 0.61),说明去掉控制后 DW 与成交量底的残差信号共享大部分变异;另外种子 b14(原始 0.65)、b3(原始 0.55)、b7(原始 0.57,且与波动控制 0.76)的原始相关也偏高。所以打 3 不打 4。合理度 4。数学上 DW 有界:每项 diff 平方不超过 2(x_i² + x_{i+1}²),所以 DW 在 [0,4] 内,分母近零由 1e-8 门槛和 NaN 处理,不会爆点;方差低于 1e-8 的日子(涨跌停锁死等)整行为缺失,由 cross_ema 跳过,不是主导结果的伪影。cross_zscore、cross_tail_mean_q25、cross_stddev 都是尾随窗口;cross_corr 与 cross_regbeta 都用 cross_delay(·,1) 的滞后量,无前视。机制说得通:分钟收益负自相关是买卖价差弹回(做市库存、价差成本),正自相关是拆单延续;两个方向都有解释。需要在奖励里检验的一点是:相对 tick size 随价格水平变化,DW 可能带上价位成分,这是检验问题,不是挡的理由。划掉的种子:第 2 号 cs_regres(G_DW, LogFloatCap) 与第 1 号一样,在奖励空间里是重复(奖励本来就对市值去残差),划掉。没有种子触发按表的自动划掉规则(最大原始 |ρ| 为 0.65,低于 0.7;最大控制 |ρ| 为 0.76,低于 0.8)。第 5 号 cs_bucket_demean 与第 9 号 cs_regres 对流动性的处理与第 1 号不同(分段 / 非线性或不同的流动性量),保留。剩余 13 个种子。如果它有 alpha,最可能来自:低流动性、低价票的微观结构成本(买卖价差反弹)在慢变量上的持续差异,或 tick size 相关的价位效应。'
R:
  - head: 'div(cs_first_low40(LogTotalCap, day_close(Low)), cross_ema(add(day_kurt(Volume), 3), 20))'
    soundness: 4
    reasons: '合理度 4。分母 cross_ema(add(day_kurt(Volume), 3), 20) 中 day_kurt 是超额峰度(函数内为 m4/m2² - 3),经验分布上 m4 ≥ m2²(Jensen),所以超额峰度 ≥ -2,加 3 后 ≥ 1,分母恒为正且不近零,不会有除以近零的爆点。分子 cs_first_low40 是截面秩的有界变换,值域在 (0, 2] 内。8 个变体只改窗口(10 / 5)、价位字段(Low / High / Vwap)、成交形状字段(Volume / Amt)和一次 sqrt,数学上同样干净:day_close 是当天最后一个有效分钟值,无前视;cross_ema 尾随、跳过缺失日。变体与原 head 的原始 |ρ| 为 0.96 到 0.99,即它们本质上是同一个 head 的微调。R 只评合理度,这不是扣分理由;是否替换由奖励决定。没有触发 §4 的任何陷阱。'
summary: '槽 a(E,核心 G 为成交额集中度)通过,划掉 1、6、11,剩 13;槽 b(N,DW)通过,划掉 2,剩 13,但 DW 残差与成交量底 head 共享约 0.6,创新度打 3;R 组合理度 4,无数学问题。'
