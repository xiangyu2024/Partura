    reasons: '创新度 4。快照 0 个 head,无自动划掉。相关度表中 15 个种子与 5 个控制的 |ρ| 最大为 0.38(种子 1 的 known),种子 4 的 known 0.37、种子 12 的 known 0.36,没有一个 ≥0.5。库检查:members.csv 的 5583 条里,cs_mean 作为 ts_corr、ts_regbeta、ts_regres 的变量 0 次(与 PI 笔记一致);15 个种子的骨架(去窗口)都不在库的 4100 个骨架里,互不相同。5 个控制里没有市场 beta 这一项,个股对等权市场的相关与 beta 是控制之外的一个维度;与波动 |ρ| 0.05–0.30、市值 0.05–0.31、流动性 0.00–0.35,都没到 0.5。合理度 4。机制清楚(Morck–Yeung–Yu 的同步性、Ang–Chen–Xing 与 Bollerslev–Li–Zhao 的下行与半 beta、Hou–Moskowitz 的价格延迟、Lou–Polk–Skouras 的隔夜与日内分工)。算子核对:ts_regbeta(x, y, d) 是 y 对 x 的滚动斜率,x 为自变量,与 PI 的说法一致;ts_regres 返回当日残差;零膨胀的上下行回归对每只股票的权重只依赖市场序列,是线性泛函,排序有效;ts_delay 因果;gap 用前一日收盘,无前视;市场为同日截面 cs_mean;种子 8–10 的 cross_mean 是日轴滚动均值,指示变量只依赖市场序列,排序不受共同的 1/120 因子影响。数值:种子 13 的 ts_corr 分母是 sd_x·sd_y 加 EPS(1e-9),分钟均值的截面 sd 乘积粗估在 1e-9 到 3e-9 之间,EPS 约占分母的三分之一到一半,低波动票的相关被压向协方差,排序带一层波动倾向。这不是爆点,也不是常数,只是部分失真,不挡;PI 应改用按尺度的 EPS。其余种子的分母都是日收益量级,不受影响。上下行阈值 ±1% 在等权市场下粗估约 20% 的交易日,样本量够。相关度表未含 W01 的 6 个 head(struct/check_w01_heads.csv,规则 §1 计入库),未能核对;最近的是 W4 cross_corr(day_max(Ret), gap−0.5, 60),它是个股自身 gap 与日内最大分钟收益的相关,与种子 14、15(gap 与市场 gap 的相关)结构不同,不挡。如果它有 alpha,最可能来自持有人结构差异(指数与机构对散户)造成的个股与市场联动差异,尤其是下行日的半 beta 与开盘缺口的同步性(隔夜与日内分工),而不是 beta 水平本身。'
