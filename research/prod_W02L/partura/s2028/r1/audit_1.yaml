    reasons: '创新度 4。快照 0 个 head,相关度表的 head 列全为 0,无自动划掉。5 个控制的 |ρ| 最大的是种子 14 的 known 0.52、liq 0.51,种子 13 的 known 0.47、liq 0.46,种子 12 的 known 0.43、vol 0.42,这三个最接近 0.5 线(归一后的滚动最大值与成交额族、流动性重合较多,是「控制换写法」的风险候选),但规则只挡 ≥0.8 的,不挡;其余 12 个种子(不含 5)的控制 |ρ| 都在 0.4 以下(最大是种子 11 的 rev 0.39)。库检查(struct/members.csv,5583 条):ts_skew 23 次,逐条核对,无一作用在收盘到收盘的日收益上;ts_kurt 17 次同样不在日收益上;cs_winsor、cross_semistd_*、cross_tail_mean_*、LimitWidth、ListAge 各 0 次。用 AlphaCube 的 parser 与 skeleton_key(去窗口)把 31 个种子与库的 4100 个不同骨架比对(对库中 300 条抽样复算,300/300 一致):0 个命中,31 个互不相同。种子 16 的内层序列 cs_demean(day_mean(Ret)) 与 B082 的内层序列相同(B082 的 cs_demean(sub(day_mean(Ret),c)) 中的常数被截面去均值消掉),新的只是除以自身 σ 的写法;种子 12–14 是 B082 族的 MAX 效应换成 LimitWidth 归一后的日收益,与库的 MAX 族同源但结构不同。冠军两列不在相关度表里(规则 §1 的残差还去掉两个冠军),冠军侧的创新度没法从表核实。合理度 4。机制清楚(Bali–Cakici–Whitelaw 的彩票偏好、Chen–Hong–Stein 的崩盘偏度、Boyer–Mitton–Vorkink 的预期特质偏度)。算子逐个核对:ts_skew、ts_kurt 用 nanskew_last、nankurt_last,矩估计、无最少样本数,靠 ListAge 掩码;cs_winsor 是截面 nanquantile 1%/99%;cross_quantile、cross_tail_mean_q25/q75、cross_max、cross_stddev、cross_semistd_* 都是时间轴滚动、NaN 跳过;没有任何种子用 nanrank_last(ts_rank、cross_rank、in_rank_rolling),§4 的已知陷阱不适用。无前视:ts_delay 因果,cs_demean 只用当日截面。种子 7、8 的分母(IQR、尾均值差)没有加常数,与 PI 笔记「除法都加了小常数」不符,但在真实收益上不接近 0,不挡。划掉的种子 5(数学问题,数值伪影):nanskew_last 的分母是 std**3 + EPS,EPS = 1e-9(common.py),而 day_mean(Ret) 的 60 日截面去均值后的 std 量级约 1e-4(按分钟收益 σ≈1e-3 粗估),std³ 约 1e-12,比 EPS 小三个数量级,输出退化为 1e9 × 三阶矩 = skew·σ³·1e9,截面排序由日内波动的立方主导,不是偏度。PI 的「无 inf、离散度 1.0」检查抓不到这一点。不挡但要记:种子 5、16 没有 ListAge 掩码(覆盖 0.999,其余 0.973),上市 60 日内的新股窗口只占约 1–2% 的票,不是结果的主要决定者,留着,但 PI 应补掩码;种子 12 的 distinct 0.729 来自 cs_winsor 截尾后 cross_max 的并列,规则列为列序打破的非问题,不挡;种子 11 是两个半标准差之差(收益单位),本质带波动水平(vol |ρ| 0.36),机制说明里的「形状」不完全成立,但不是数学问题。如果它有 alpha,最可能来自日收益两侧尾部不对称(彩票偏好与崩盘风险)在涨跌停制度下 40–120 日的慢变化部分,也就是偏度与尾部不对称里没被波动、流动性、市值与 20 日反转控制吸收掉的那一截。'
  - slot: b
    novelty: 4
