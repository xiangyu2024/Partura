    条含除法或标准化。库自己的 train 统计里它们的秩 IC 几乎全在 −0.03 ~ −0.06(近期最大的相对涨幅越高,未来收益越低),换手约 0.03:这就是
    MAX / 彩票效应(Bali–Cakici–Whitelaw 2011)。但 ts_max 的水平同时随波动、市值、涨跌幅宽度抬高,新尺子里的波动、市值、流动性三个控制会把这部分吃掉。我的押注是:把尺度拿掉之后剩下的是收益分布的「形状」(右尾对左尾、偏度),这是散户彩票偏好(Barberis–Huang
    2008;Boyer–Mitton–Vorkink 2010 的预期特质偏度;Kumar 2009)和崩盘风险(Chen–Hong–Stein 2001)被定价的对象,而不是波动本身。A
    股散户占比高,涨跌停制度又把右尾变成可预期的事件,所以形状应当有定价。


    算子怎样实现:RR = cs_demean(ts_delta(log(day_last(Close)), 1)) 是收盘到收盘(含隔夜)的市场相对对数收益,B082
    读的是盘中、不含隔夜。种子读 RR 的形状而不是水平:ts_skew(40 / 60 / 120 日,其中一条先 cs_winsor、一条外面套 cross_ema)、ts_kurt、四分位偏度(Bowley)、上
    / 下四分位尾均值的不对称指数、max 与 min 的不对称指数、上 / 下半偏差之比(cross_semistd_pos / neg)。4 条把日收益除以板块涨跌幅宽度
    LimitWidth(再 cs_winsor)后读偏度或滚动最大值:10% 板、20% 板、ST 的同样涨幅不是同一件事(K002 的涨停筛子成立,正是因为按板块限幅来认);两条用
    B082 自己的叶子 day_mean(Ret)(盘中)做对照,看成立的是盘中还是整日。max / σ 只留 2 条当对照(C02 旧尺子下,除以自身波动的
    MAX 比原始 MAX 更差:train −0.67 对 −0.38),主力是偏度与不对称指数 —— 同一批旧读数里它们最好:日收益 40 日偏度 train
    0.47 / valid 0.54,与已知族 ρ 0.18,是这一族离线最近的一条。


    和库里已有的不同:库(5583 条)里 ts_skew 只出现 23 次,全部作用在分钟结构量或价格水平上,没有一条作用在日收益上;cross_semistd_*、cross_tail_mean_*、cs_winsor
