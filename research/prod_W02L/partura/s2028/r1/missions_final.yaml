    逐个对照过)。它们不是 B082 的换写法:全是无量纲的形状量,不随波动水平单调变化。


    为什么样本外还会在:来源是散户持股结构与涨跌停制度,2018 ~ 2025 年基本不变(2020 年创业板改 20% 已被 LimitWidth 吸收);形状量用
    40 ~ 120 日窗口,变化慢,15 bp 下换手低;不依赖某段行情。预期并不高:旧尺子(没有去掉两个冠军)下最好的日收益偏度只有 0.47,新尺子只会更低,所以我预期它是「离线更近」,不是直接越线。


    数学检查:(a) 无前视:ts_delta(x, 1) = x[t] − x[t−1](ts_delay 令 res[t] = x[t−d]);cs_demean
    只用当天截面;所有窗口是尾随窗口;t 日收盘后算,t+1 才交易。(b) 数值:ts_skew、ts_kurt 等对窗内有效值直接算、没有最少样本数,新股窗口没填满时会用
