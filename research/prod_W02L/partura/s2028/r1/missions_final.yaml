- type: N
  hypothesis: '机制:B082 每天做 cs_demean,把个股收益里的市场部分整个扔掉;这一批(以及整个库)只读「去掉市场之后剩下什么」,没有一条读「这只股票怎么跟市场联动」:库
    5583 条里没有任何一条把截面均值 cs_mean 当 ts_corr / ts_regbeta 的变量用。联动结构有四个被文献定价的维度:(1) 同步性
    / R²(Morck–Yeung–Yu 2000):同步性高说明价格由市场、指数、机构的一篮子交易驱动,个股特质信息少;低则是散户与消息驱动。(2) 上下行不对称(Ang–Chen–Xing
    2006 的下行 beta;Bollerslev–Li–Zhao 2020 的半 beta):市场下跌日跌得更多的票要求补偿。(3) 价格延迟(Hou–Moskowitz
    2005):对滞后一日的市场收益仍有反应,说明信息扩散慢、被忽视,要求溢价。(4) 开盘缺口的同步性:集合竞价是指数产品和机构程序单集中成交的地方,缺口跟着市场走的票和缺口自成一格的票是两类持有人(Lou–Polk–Skouras
    2019 的隔夜 / 日内分工)。


    算子怎样实现:RET = ts_delta(log(day_last(Close)), 1),MKT = cs_mean(RET) 是当日等权市场收益(同一天所有股票取同一个数)。种子
    1 ~ 2 是 60 / 120 日滚动相关 ts_corr(其中 2 先对 RET 做 cs_winsor);种子 3 是 beta,ts_regbeta(MKT,
    RET, d) 的第一个参数是自变量;种子 4 是特质占比(ts_regres 的残差标准差除以总标准差,约 sqrt(1 − R²));种子 5 是 40
    日相关减 120 日相关(同步性的变化);6 ~ 7 把市场滞后一日(ts_delay)做延迟度量;8 ~ 10 是市场跌超 1% 的日子与涨超 1% 的日子里个股相对市场的平均超额(抗跌
    vs 跟涨);11 ~ 12 是下行半 beta 减上行半 beta、下行日相关(零膨胀写法,是含截距 OLS 的近似:零点会稀释斜率,但对所有股票一视同仁,排序有效);13
    ~ 15 把同样的联动换到 B082 自己的叶子 day_mean(Ret)(盘中)和隔夜缺口 G = day_first(Open) / ts_delay(day_last(Close),
    1) − 1 上。


    和库里已有的不同:联动类在库里 0 / 5583;15 个种子的骨架互不相同,都不在库的骨架集里(用库的 skeleton_key 逐个对照过)。不是控制的换皮:控制是波动、市值、流动性、已知成交额族和
    20 日反转;联动统计是相关、斜率、条件均值。beta(种子 3、7)与总波动有关,我预计与波动控制的 |ρ| 在 0.4 ~ 0.6,但相关系数、特质占比、不对称的差是比值或差,不随波动水平单调。


    为什么样本外还会在:联动结构取决于持有人构成(指数 / 机构 / 散户)以及 T+1、涨跌停制度,都是慢变量,窗口 40 ~ 120 日,15 bp 下换手低。已有证据:旧研究
    C01 的价格同步性族(ts_pearson,价格序列与全市场的平均相关)在旧尺子样本内是最强的一族,但做风格中性化后几乎消失 —— 所以这里最大的风险是联动统计本质上是市值
    / 流动性风格;这一次直接用新尺子(已去掉 5 个风格控制与两个冠军)来看剩下什么。多空方向我不预设,由 train 选。


    数学检查:(a) 无前视:cs_mean(RET) 用当天截面,t 日收盘已知;ts_delay(MKT, 1) 是 t−1 日的市场;窗口是尾随窗口;t+1
    才交易。(b) 数值:ts_corr 的分母是 sqrt(var_x × var_y) + 1e-9,窗内有效点只有 2 ~ 3 个时会给 ±1,所以乘 M
    去掉上市 120 个交易日内的票;ts_regbeta 在自变量方差和 ≤ 1e-9 时给缺失,日收益 60 日窗内的平方和约 1e-2 量级,不会触发;除法的分母加了
    0.0001 以避免 0/0。is_lt / is_gt 对缺失返回 0,但乘上缺失的 RET 仍是缺失,所以停牌日同时从两个序列里退出。(c) 市场用等权全
    A,小市值占主导,这是口径选择(与市值加权的差别正是规模暴露),不是数学问题。本机用合成立方体把 15 个种子全算过:都能算、无 inf、每日取值离散度 1.0。没有用任何
    2026 年数据。'
