    reasons: '创新度 4。相关度表(corr_1.json)里 16 个种子与三个 head 的原始 |ρ| 全部 ≤0.27(最大为种子 3 与 head1 的 0.27),残差 |ρ| ≤0.33;与 5 个控制的 |ρ| 最大 0.50(种子 1 与流动性,已知族 0.41),都不到 0.8。库检查(struct/members.csv,5583 条):含 day_kurt(Volume) 的 19 条逐条读过,没有一条把 K 与日收益、|收益| 或隔夜缺口做滚动相关或回归,PI 这一断言成立;只有库成员 X 2036 用到 K 的 20 日自相关,但它是 ts_reg_tvalue 的回归元,与 Open 日内自相关的截面中位数做回归,不是耦合。16 个种子的骨架(用 AlphaCube 的 parser 与 skeleton_key 去窗口;先对 5583 条库表达式复算 400 条,与 csv 骨架 400/400 一致)与库骨架 0 命中。耦合类种子(6、7、8、9、10、11、13、14、16)对三个 head 的残差 |ρ| 全部 ≤0.11,是真正新的读法;水平类种子(1–5、12、15)是 K 的慢水平或慢比较,种子 1 与流动性 0.50、已知族 0.41 有实质重合,属于 K 水平读法的换写,但它不与 head 或控制是同一个东西,不压到 1 分。归档的 49 条已评分候选不在 loc.json 里(paid 只是个数),外围唯一性只能对照库成员与快照 head,16 个种子的外围算子集合与两者都不相等。合理度 4。机制清楚(Llorente、Michaely、Saar、Wang 2002 的成交-收益耦合方向;Gervais、Kaniel、Mingelgrin 2001 的放量注意力)。算子逐个核对:day_kurt / day_skew 走 common.py 的 _kurt / _skew,没有 EPS(div 是纯除法),所以第 1 轮报出的 nanskew_last 的 EPS 伪影不适用于本轮(本轮只用日级版本,没有 ts_skew / ts_kurt);cross_corr 与 cross_regbeta 的分母 sqrt(var_x·var_y)+1e-9 中 var_y 是日收益方差(约 1e-4 量级),EPS 不起作用;cross_regbeta 的 var_x 是 120 日 z 分数平方和(约 120),不是近零除数;cross_zscore 有 1e-6 的常数窗保护。无前视:cross_delay(·,1) 用昨日 K,隔夜缺口用当日开盘价,全部 t 日收盘后计算、t+1 交易。需要修正的一点:种子 6 的斜率 = corr × σ_r(个股相对收益的 120 日标准差),σ 进入了信号,PI 写的「不带量纲」只对 x 一侧成立;不过 corr 符号混杂,它与波动控制的 |ρ| 只有 0.07,不是数学问题,不挡。种子 15 的 cs_flip_by_state 是按市场波动 trailing rank 的截面符号翻转,前 240 个交易日的状态是扩张窗估计,只影响热身期,不挡。如果它有 alpha,最可能来自 K 的同日或滞后形状与市场相对收益、|收益|、隔夜缺口的慢耦合(成交形状携带的信息);水平类种子若有 alpha,更可能只是流动性的慢代理。划掉:无。没有自动划掉的理由(与任一 head 的原始 |ρ| 最大 0.27 < 0.7,与控制最大 0.50 < 0.8),也没有数学问题或重复。'
