    reasons: '创新度 3。相关度表:种子 1–8 对 head 的残差 |ρ| 为 0.29–0.61(种子 7 对 head1 为 0.61);其中 1、2、3、5、6、7、8 的市值 |ρ| 为 0.49–0.76(种子 4 是高价段排除,市值 |ρ| 仅 0.01,但对 head1 的残差为 0.49),这一半是 head1「阶跃×价位」写法的换皮。PI 自己的消融(loc.json ablation)也显示:去掉 K、只剩 cs_first_low40(LogTotalCap, Low) 时训练段 +0.02、验证段 +0.56,阶跃×市值在训练段几乎没有分数,换写法并不增加信息。种子 9–16 用的是库与快照里都没有的变量(流通比、名义价、成交基尼、日内偏度、成交重心、K、残差波动),对 head 的残差 |ρ| 为 0.11–0.40,cs_* 阶跃算子在库里 0 次,骨架 0 命中,是真正的新读法;但种子 11、14(成交基尼)与流动性 0.54、0.57、已知族 0.49、0.50 有明显重合,种子 16(残差波动)与波动控制 0.68 接近。两半合起来给 3:不是「同一个东西」,整体也谈不上新。合理度 4。算子逐个核对:cs_first/last_low/high 走 ops_ext.py 的 _lexi,整块并列处理,输出为序数名次加平移,无 NaN、无并列;cs_bucket_* 桶内不足 2 只给缺失,桶内 sd 加 EPS 不接近 0;day_gini、day_centroid、day_skew、day_kurt、day_std 是同日的日内统计;cross_ema 因果;cs_regres 是同日截面回归,方差远大于 EPS。无前视,全部 t 日收盘后计算。核心 day_close(Low) 是当天最后一根分钟的最低价(后复权,按规则 §4 不是问题)。种子 9 的截面有约 23% 并列(distinct 0.77),来自流通股本与总股本相同的票的 log 比恰为 0,并列由列序打破,按 §4 不挡。种子 10 的 LogFloatCap − LogFloatShares = log(流通市值 / 流通股本) = log 名义价,与核心的后复权价是两个不同的概念,PI 的描述正确。如果它有 alpha,最可能来自价位档位排除(低价或高价段被整体移出多头)与另一个横截面量的交互:非市值的那一半更可能是低价股的成交结构或股本结构信息;市值的那一半若有 alpha,更可能来自阶跃本身,即 head1 去掉 K 后剩下的那一部分。核心 day_close(Low) 与各控制的 |ρ| 最大 0.47,过 E 位核心检查。划掉:无。没有自动划掉的种子(与任一 head 的原始 |ρ| 最大 0.44 < 0.7,与控制最大 0.76 < 0.8),也没有数学问题或重复。'
R:
  - head: 'div(cs_first_low40(LogTotalCap, day_close(Low)), day_kurt(Volume))'
    soundness: 4
    reasons: '合理度 4。逐个核对:v1 的 add(K,3) 是总体峰度 m4/m2² ≥ 1(_kurt 用总体矩),恒不近零、不翻号,是干净的检验;v2 没有除法(sub(A, cs_rank(K)),两边尺度不同但无数学问题);v3、v4、v5 的分母 ≥1;v6、v7 仍以 K 为分母,只改字段或档位宽度,作对照可用;v8 的分母是 K 的 20 日 EMA(超额峰度取值 [-2, +∞),仍会过零),它只能检验「慢」,检验不了「安全」,所以要与 v3 配对读,PI 的读法正确。PI 对「分母近零」的担心成立:K 在 (-2, 0) 的票 A/K 为负,会落在 sign -1 多头书的最前端。但 v1 与原 head 的秩相关 0.99 不能单独排除伪影,因为伪影集中在多头十分位采样的尾部,秩相关对尾部不敏感,要看 v1 的分数本身。无前视(K 与 A 均为当日截面量,t 日收盘后算)。如果它有 alpha,最可能来自阶跃 × 小市值 × 1/K 的真实结构(非低价段内的小市值、成交尖峰);若 v1 的分数与原 head 同水平,这一点成立,若 v1 崩掉,则 alpha 来自 K<0 票的符号伪影。'
  - head: 'pow_1_5(ts_max(ts_max(pow_2(ts_max(cs_demean(sub(ts_max(cs_demean(sub(day_mean(Ret), 2)), 10), 2)), 10)), 10), 30))'
    soundness: 3
    reasons: '合理度 3。数学上没有问题:无除法;pow_2 作用在 ts_max 的输出上,pow_1_5 作用在非负量上;所有窗口为尾随;sub(·,2) 在 cs_demean 下是空操作(float32 下引入约 1e-7 的量化,相对截面离散约 1e-4,影响可忽略)。但机制描述与 PI 自己的消融和库统计相反:R2 的理由写「sign +1:近期相对涨幅最大的票继续跑赢,不是库里 MAX / 彩票的方向」。loc.json 的消融里,同一链去掉 pow_2 的有符号版本 ts_max(cs_demean(sub(ts_max(cs_demean(sub(day_mean(Ret),2)),10),2)),10) 在 sign +1 下训练 −2.10、验证 −2.06,即近期相对峰值最高的票继续跑输,这正是 MAX / 彩票方向;pow_2 之后的 −0.67 是把正负两端的极端都收进多头书后较弱的版本。库成员 X 1118(与 head2 表达式逐字相同)训练段秩 IC −0.040;去窗口骨架下 72 条 day_mean(Ret)+pow_2(ts_max) 家族的训练段秩 IC 中位数 −0.041,同样指向 MAX 方向。所以 30→60 日等窗口测试实际探的是「近期极端相对日收益幅度」的慢变化,而不是「延续」。另外 v1–v5 的截面并列比例高(distinct 0.53–0.61,停牌或不动的票共享取值,按列序打破),v6–v8 因平滑而 distinct 1.0,窗口结论与并列结构有部分混杂;按 §4 列序并列不是挡的理由,只记录。v1–v5 与库成员 X 1118 同骨架(只改窗口),R 不是 GP 候选,库禁令不适用,只作说明。如果它有 alpha,最可能来自近期极端相对日收益(MAX / 彩票偏好)的慢部分:近期有过极端相对涨跌峰值的票随后收益偏低,pow_2 把两端都收进了多头书。'
