slots:
- type: E
  core: 'day_kurt(Volume)'
  hypothesis: |-
    核心 K = day_kurt(Volume):个股当天 241 根分钟成交量的超额峰度。它是尺度不变量(成交量乘任何常数,K 不变),所以不含「成交量有多大」这个水平 / 流动性的量纲;K 高 = 当天成交挤在少数几分钟(事件、大单、集合竞价堆量),K 低 = 成交摊得平(算法拆单、机构按 VWAP 执行)。

    证据(全部是 2025-12-31 以前的读数):(1) 本流唯一的真 head `div(cs_first_low40(LogTotalCap, day_close(Low)), day_kurt(Volume))` score +0.73(train +0.73 / valid +0.82);拆解里去掉 K、只剩阶跃×市值,变成 +0.02 / +0.56,所以 K 一个部件把 train 抬了约 0.7;但 K 单独是 -4.93(sufficiency),所以 K 的水平本身不是信息、是「条件下的 K」或「K 的动态」。(2) 库 5583 条里 day_kurt(Volume) 只出现 19 次,最像样的是 `ts_quantile_q75(pow_2(·), 30)`、`cross_sum(pow_2(·), 15)`、`ts_quantile_q50(·, 20)`(库自己 train 尺子下约 0.41 / 0.22 / 0.05,而裸 K 是 -10.03)—— 慢一点就从 -10 回到 0 附近,说明噪声是主因;19 条里有几条把 K 与价格水平量(day_last(High)、day_quantile_q25(Open))做滚动回归,但没有一条把 K 与日收益、|收益|、隔夜缺口做滚动相关 / 回归,也没有一条把 K 放到自己的历史里标准化。
    另一件由定义得出的事:day_kurt 是「超额」峰度(原始峰度 - 3,代码 `div(mean(x^4), var^2) - 3`),取值下界 -2,成交摊得很平的票可以为负或接近 0;head 里 A / K 的比值在这类票上会翻号或爆点,这个疑点我另在 R 组里直接检验(把分母换成原始峰度 K + 3,并给一个不做除法的写法)。本位的种子一律不用 K 作分母。

    假设:K 的水平被流动性与持有人结构吃掉(所以单独是 -4.9);K 的「时间序列行为」才是慢变量里的信息 —— (a) 相对自己常态的惊奇(cross_zscore);(b) 昨天的成交形状对今天收益 / 隔夜缺口的滞后耦合(Llorente、Michaely、Saar、Wang 2002:成交量与随后收益的耦合方向由信息不对称决定,投机性成交接延续、对冲性成交接反转;这里把「成交量」换成「成交分布的形状」);(c) K 与 |收益| / 收益的同日共动(Gervais、Kaniel、Mingelgrin 2001:放量吸引注意力);(d) K 与价格跳变峰度 day_kurt(Ret) 的共动(量与价同时「成团」是信息驱动,只有量成团是流动性 / 大单);(e) 形状的不稳定度。这些读法都是 120 日左右的慢量,15 bp 下可交易。

    算子怎样实现:16 个种子全部原样含 K。RZ = cross_zscore(K, 60) 是今天的 K 对自己 60 日的 z 分数(无量纲,sd 约 1),所以 cross_regbeta(RZ 滞后 1 日, 当日市场相对收益, 120) 的斜率 = corr × σ_r,不带 1 / σ_x 的量纲。这一点是刻意的:另一条流(2013)里出 head 的 `cross_regbeta(含成交额水平的回归元, day_sum(Ret), 120)` 是带成交额水平量纲的斜率,其 alpha 有一部分可能来自 1 / σ_Amt 这个小盘 / 低流动性的量纲;K 的 z 分数里没有这个量纲,所以这里若有 head,来源只能是耦合方向、不是小盘尾部。种子分五组:(A)慢水平与去水平(1 ~ 5:cross_ema 60;对 LogFloatCap 做截面回归残差;对价位 log(day_close(Low)) 做残差;20 日对 241 日的差;自己历史 z 分数的 EMA);(B)滞后耦合(6 ~ 8、16:对市场相对收益的斜率 / 相关 / t 值,日内收益版,隔夜缺口版);(C)同日共动(9、10:对 |收益| 与对带符号收益);(D)形状对形状(11、12:K 与 day_kurt(Ret) 的名次相关;名次空间里 K 与 day_kurt(Amt) 的差);(E)稳定性 / 持续性与状态(13 ~ 15:K 名次的 120 日标准差;K 名次的一阶自相关;市场波动状态翻转符号)。滚动耦合的种子乘 M = replace_small_with_nan(is_gt(ListAge, 120)),把上市 120 个交易日内的票置缺失。

    和库 / 快照的区别:快照里含 K 的候选只有 head 1 一族(外围是 cs_first_low40 / cs_last_high05 阶跃带和 `div(·, K)` 比值,以及 `div(·, -5)` 的对照),没有一个种子用 K 的动态;库里 K 的 19 条没有耦合读法(见上)。本位与 head 1 的差别:不要阶跃带、不要市值、不除以 K,只读 K 自己的时间序列行为;因此与 head 1 的日度秩相关预计只来自 K 水平的那一小部分(预计 |ρ| 0.1 ~ 0.5)。

    为什么样本外还会在:成交形状取决于谁在交易(算法执行的机构 vs 事件 / 散户)和 T+1、集合竞价、涨跌停制度,是慢变量;耦合读数用 120 日窗口,变化慢;文献都在 2023-08 以前。预期并不高:K 单独是 -4.9,慢化后最多回到 0 附近;我押的是 z 分数滞后耦合有可能比水平多出信息。

    数学检查:(a) 无前视:滞后耦合里的 x 是 K 的 1 日滞后(昨天收盘已知),y 是今天的收益,窗口尾随,t 日收盘后算、t + 1 交易;隔夜缺口 = day_first(Open) / ts_delay(day_last(Close), 1) - 1 在 t 日开盘已知。(b) 数值:K 是比值型统计量,分钟成交量方差为 0(整天无成交、停牌)时 day_kurt 为缺失,不是 inf;cross_zscore 对近常数窗口给 0(代码里有相对 1e-6 的保护),不会产生 ±1 的浮点噪声;cross_corr / cross_regbeta 在窗内有效对少时可能给 ±1,所以乘 M(ListAge 掩码);K 本身量级是几到几十,不触发 1e-9 的 EPS 问题(不像收益量级的偏度)。(c) 定义:cross_* 在窗口未满时是扩张窗口,样本首个月所有票都在用少量点估计,这对全部种子一视同仁,不是某一类的偏置;名次类种子(cs_rank)在并列时靠列序打破,K 是连续量,并列极少。已在合成立方体上把 16 个种子全部算过(无 inf)。没有用任何 2026 年数据。
  inspired_by: 'loc 的拆解:head 1 里 day_kurt(Volume) 把 score 从 +0.02 抬到 +0.73,但单独是 -4.93;库里 K 只有 19 条且无耦合读法'
