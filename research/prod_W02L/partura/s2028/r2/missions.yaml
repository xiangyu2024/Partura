R:
- head: 'div(cs_first_low40(LogTotalCap, day_close(Low)), day_kurt(Volume))'
  why: |-
    检验 head 的分数是否来自分母 day_kurt(Volume) 的符号翻转 / 近零爆点。day_kurt 是超额峰度(原始峰度 - 3,取值在 [-2, +无穷)):原始峰度接近 3 或小于 3 的票(成交摊得很平)分母接近 0 或为负,A / K 在这些票上翻号或取极端值,而 sign = -1 的多头书取的正是比值最低的那一端(K 为小负数、A 为正的票比值为负,落在最前)。loc 里 Low→High、Volume→Amt 都不变(+0.75 / +0.74)与这个解释相容,也与真实效应相容,所以直接分开:
    a. 分母换成原始峰度 add(K, 3)(>= 1,不翻号也不近零);b. 完全不做除法:sub(A, cs_rank(K)),K 只以名次进入(0 ~ 1),检验「A 小且 K 大」这个组合本身有没有分数;c. d. 在 a 的基础上把分母做慢(cross_ema 20 / cross_mean 60,不再受每日噪声支配);e. 去掉阶跃,市值用连续名次 cs_rank(LogTotalCap)(检验阶跃是否必要);f. LogTotalCap 换成控制变量 LogFloatCap(检验是不是总股本与流通股本之差);g. 档位宽度 40% 改 20%;h. 只把原分母做慢 cross_ema(K, 20)(与 c 配对,区分「慢」与「安全分母」)。
    读法:a、b 保持 head 水平(± 0.3)= 效应是真的、不是分母伪影;a、b 崩掉(< -1)而原 head 在 +0.7 = 分数来自 K 的符号翻转 / 近零爆点;c 比 a 好 0.3 以上 = 慢是杠杆。
    数学:所有变体都没有对近零量的除法:分母要么 >= 1(a、c、d、e),要么是原 head 的分母(f、g、h,其中原分母的近零问题正是本组要量的对象),b 没有除法;无前视。
