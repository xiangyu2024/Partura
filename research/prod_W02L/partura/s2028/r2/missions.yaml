- type: E
  core: 'day_close(Low)'
  hypothesis: |-
    核心 T = day_close(Low):当天最后一分钟的最低价,价格是后复权的(规则 §4:不是数学问题)。后复权价位在股票之间的排序约等于「从数据起点以来的累计表现 × 起点价位」,所以它是一个极慢的状态变量:低档位 = 长期输家 / 边缘化 / ST 与退市候选(「垃圾」),高档位 = 长期幸存者。

    证据与疑点(全部是 2025-12-31 以前的读数,我如实写在这里):(1) loc 共性表里含 T 的 22 个已评分候选均值 -1.16、不含的 -2.09,差 +0.93、p 0.014,是本流共性表里唯一 p < 0.05 的子树;但这 22 个大半是我第 1 轮 GP 位自己的后代,不是独立证据。(2) head 1 的 `cs_first_low40(LogTotalCap, T)`(把 T 最低的 40% 整体排到最前、其内按市值排序)单独 +0.02 / +0.56(train / valid);T 单独 -2.35;把 Low 换成 High 几乎不变(+0.75)—— 所以起作用的不是「Low」,而是「价位档位 × 市值」这个交互。(3) 疑点:总领在 PROGRESS.md 里指出,阶跃算子 `cs_first_low40` 等于把一组票整体抬到最前,尺子只扣控制排名的 1 / 2 / 3 次项,扣不掉「档位阶跃」,所以 head 1 可能是尺子的盲区而不是新信号。本位的设计就是对这个疑点的直接检验:种子里同时放阶跃 / 排除版本(5 个)、连续版本(乘积、残差、同伴内去均值 / 标准化,5 个)、换掉市值的版本(6 个)。读法:若连续版本和阶跃版本都不行、只有 head 1 那一种写法行,说明是阶跃的伪影;若同伴内的连续版本(种子 8、9、14)也到 0 附近以上,说明「同价位同伴内的相对市值 / 相对形状」是真的交互。

    机制(如果有 alpha):Asness、Frazzini、Israel、Moskowitz、Pedersen(2018,「Size matters, if you control your junk」)—— 小市值溢价在扣掉垃圾股之后才干净地出现:垃圾小票(长期输家)拖累小盘因子。A 股 2020 年起的退市新规把垃圾股的折价从模糊变成可执行,小市值里「没被边缘化」的部分是稳定的。长期输家的价位档位(T 的低分位)正是这种垃圾的一个慢代理;纯多头书只能做多,所以「把低档位票排除出多头书」是对纯多头最直接的改进(这也是 cs_last_low* 版本的写法)。长期反转(DeBondt 与 Thaler 1985)是反方向的假设(长期输家反弹),种子里两个方向都有(first / last、low / high),方向交给 train 选。

    算子怎样实现:16 个种子全部原样含 T(T 的分位决定档位)。(A)阶跃 / 排除(1 ~ 5):`cs_last_low10 / low20(LogTotalCap, T)` = 价位最低的 10% / 20% 被压到最底(排除版),`cs_first_high40`、`cs_last_high40`(顶部档位的对称版本)、`cs_first_low20`(head 1 的 40% 改 20%);(B)连续(6 ~ 8):名次乘积 `mul(cs_rank(LogTotalCap), cs_rank(T))`、市值名次对价位名次的截面回归残差 `cs_regres`、市值在同价位十分位内的去均值 `cs_bucket_demean`;(C)换掉市值(9 ~ 16):用流通比例 `sub(LogFloatCap, LogTotalCap)`(= log(流通股 / 总股本),价格相消,纯股本结构)、名义股价 `sub(LogFloatCap, LogFloatShares)`、成交集中度 `cross_ema(day_gini(Amt), 60)`、日内收益偏度 `cross_ema(day_skew(Ret), 60)`、成交重心 `cross_ema(day_centroid(Amt), 60)`、K 的慢水平(与另一位的核心 K 搭起来)作为被档位处理的主信号,处理方式是排除版、同伴内标准化版。

    和库 / 快照的区别:库 5583 条里 day_close(Low) 只出现 6 次,cs_first_* / cs_last_* / cs_bucket_* 这三类算子 0 次(它们是 Partura 加的算子)。快照里含 T 的候选(loc 收录的 49 个已评分候选里有 22 个)外围都是 `cs_first_low40(·, T)`、`cs_last_high05(·, T)` 与除以 -5 / K,主信号几乎都是 LogTotalCap;本位的外围(low10 / low20 排除、high40 对称、连续乘积 / 残差 / 同伴内去均值、换掉主信号)全是第 1 轮没出现过的写法。

    为什么样本外还会在:价位档位是极慢变量(换手极低,15 bp 几乎不构成负担),来源是制度性的(退市新规、垃圾股的持续折价),不依赖某一段行情;文献 2018 年的结论是跨国家、跨时期稳定的。但我给的概率不高:档位阶跃可能只是小盘 / 反转风格的另一种写法,train 与 valid 的符号也可能不一致。

    数学检查:(a) 无前视:T 是当日分钟数据,档位用当日截面名次,t 日收盘后算、t + 1 交易。(b) 数值:cs_first_* / cs_last_* 在 x 的并列块上整块处理,输出取 y 的序数名次再平移,不会有 NaN 或并列;主信号的分母都不含近零除法;cs_bucket_* 在桶内不足 2 只时给缺失。(c) 定义:这些档位操作在「档位边界」附近会让个别票名次大幅跳变,抬高换手,这是已知的代价(别的流的 R 组里分桶版普遍变差 0.4 ~ 3),所以我把分桶版只放 3 个、其余用 cross_ema 先把主信号做慢。已在合成立方体上把 16 个种子全部算过(无 inf)。没有用任何 2026 年数据。
