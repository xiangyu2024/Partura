    reasons: '相关度表:P 组 10 个种子全部过门槛。与快照 3 个 head 的原始 |ρ| 最大 0.44(最像 day_var(in_max_rolling(Vwap,60)));残差后与 head 的 |ρ| 为 0.02–0.19,与 head 实质不同。控制列:seed 1、2、7、9 与流动性 |ρ| 0.53–0.66、已知族 0.43–0.57(seed 2 的市值 0.51),这四个是放量集中度换写法后仍贴着流动性/规模走,所以创新度给 3 而不是 4–5;seed 3、4、8、10 的量价相关族与各控制 |ρ| 多在 0.2–0.35,是新东西。算子核对(读了源码):day_max/day_sum/day_mean/day_median 是日内归约(dt_day.py);div 无保护,但成交量非负时 max ≤ sum、max/mean ≤ 分钟数 241,比值有界,不会爆点;day_sum 全缺失返回 NaN;cross_mean、cross_zscore、in_max_rolling 都用 rolling_windows(common.py:433,左侧补 NaN 的因果窗),无前视;in_max_rolling(Volume,5) 只看过去 5 分钟;没有 ts_shift / cross_shift / in_local_mean / nt_* / ts_spearman。划掉与否:seed 5 与 seed 1 只差 10 日均值与 120 日 z-score,seed 7 与 seed 2 只差 median/mean 一项,是同一原语的近亲,但 z-score 按股票做时间标准化会改变截面排序,没有可核对的证据说明是同一个信号,不划,建议 PI 在提交前看一下这两对的截面相关。seed 9 的 day_max/day_median 在中位数为 0 时是 inf(分钟成交量为 0 的日子,比如一字板),但 corr_1.json 里它的覆盖率是 0.968,非有限格只约 3%,不足以支配截面,不划,建议 PI 补查停牌和一字板日的占比。如果它有 alpha,最可能来自:放量突发集中于少数分钟的机构大单或事件冲击之后,价量方向的知情买卖(day_corr(Volume,Ret) 一族)被截面定价,而不是滚动峰值的离散。'
  - slot: b
