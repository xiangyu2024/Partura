    reasons: '相关度表:P 组 10 个种子里 9 个过门槛,seed 10 的门槛为「废品」。与 3 个 head 的原始 |ρ| 最大 0.17(seed 7),残差后 0.02–0.21,与 head 实质不同。控制列:seed 1、3、4 与 20 日反转 |ρ| 0.53–0.55,是收盘在日内区间的位置、日内趋势与短期反转在截面上有重叠;但这是中度重叠而不是同一个量,且残差化已去掉控制的线性与非线性暴露,按 §3 不能因此挡,所以创新度给 4。算子核对:day_last/day_first/day_mean/day_max/day_min 是日内归约;in_index 定义为 t/(T-1)(ops_ext.py:684,有限处取值,无前视);day_corr(dt_day.py:231)带 EPS,收盘为常数的一字板日 corr 返回 0 而不是 NaN,这是偏向 0 的小伪影,只在平盘日出现,20 日均值下影响有限,不划;seed 3 的分母是日内振幅,为 0 时 0/0 = NaN,分子不大于分母,值域在 [0,1],无爆点;seed 6 是 seed 1 的 10 日均值再做 60 日 z-score,同一原语的近亲,与 seed 1 的截面差异靠 z-score 产生,无证据是重复,不划;seed 7 是两个比值之差,数值有界。seed 10 划掉:它的 gate 显示 distinct = 0.499,即截面里唯一值只有一半左右,很可能是 day_mean(Vwap) 与 day_mean(Close) 精确相等(整日无成交或一字板的填充),于是十分位边界上的股票由列序决定,正是 diagnose.py levels_ok 所指的已知风险,属于数值伪影(定义坏掉),是数学问题,可以划。如果它有 alpha,最可能来自:收盘与均价在日内区间中的位置反映尾盘买卖力量,以及日内路径的持续性(日内动量);或者是残差化之后留下的、与 20 日反转不同的日内价格信息。'
