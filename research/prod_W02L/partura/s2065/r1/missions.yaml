- hypothesis: '机制:成交量的"突发集中度"与价格对突发的反应。本批三个 head 都是对分钟滚动最大值(Amt / Volume / Vwap 的 60 分钟窗口)再取日内离散度(day_q_stat_std / day_var),全部亏(-1.5 到 -2.4),窗口改动几乎不动分数,说明"滚动峰值的日内离散"本身是被换手/规模吃掉的量,没有毛超额。这一位换分解:不取峰值的离散,而是取"当天最大一分钟成交量占全天的份额"(day_max(Volume) / day_sum(Volume),即突发集中度)与"峰值相对均值的倍数"(day_max(Amt) / day_mean(Amt)),在日轴取 20-60 日均值成为个股的慢变属性;再配对价格:day_corr(Volume, Ret) 读放量分钟价格往哪走(知情买盘 vs 抛压),day_corr(Amt, Ret) 同理;最后把集中度与 20 日累计收益符号相乘,区分"涨时突发放量(追涨)"与"跌时突发放量(恐慌)"。算子:day_max、day_sum、day_mean、day_corr、cross_mean、cross_zscore,都是现成算子;骨架里没有 in_max_rolling,也没有 day_q_stat_std,与三个 head 的骨架不同(那些是滚动峰值再取分位统计的标准差),这里是日内全局最大值的比值与量价相关。

    为什么样本外还会在:放量突发集中于少数分钟反映机构大单/事件冲击,A 股散户占比高,事件性放量后的方向偏离(Chordia-Subrahmanyam 订单失衡、高成交量溢价)是行为与信息扩散,不是某段行情;20-60 日均值降低换手。风险:集中度与流动性/波动控制相关,新尺子会去掉线性/U 形暴露,剩下的看运气。

    数学检查:day_sum(Volume) 在停牌日为 0 或缺失,比值给 NaN 或被屏蔽;分母是全天总量或均值,不除以近零的量;无前视,只用 t 日及以前的数据;窗口 ≤ 60 日,热身期不主导。'
  inspired_by: 本批三个 head(in_max_rolling 后取日内离散):全亏、窗口不敏感,说明滚动峰值离散只是规模/换手的代理;换成日内最大值集中度与放量分钟的价格方向。
  seeds:
