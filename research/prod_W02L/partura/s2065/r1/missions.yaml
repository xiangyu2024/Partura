  - cross_mean(div(day_max(Amt), day_mean(Amt)), 40)
  - cross_mean(day_corr(Volume, Ret), 40)
  - cross_mean(day_corr(Amt, Ret), 60)
  - cross_zscore(cross_mean(div(day_max(Volume), day_sum(Volume)), 10), 120)
  - cross_mean(mul(div(day_max(Volume), day_sum(Volume)), sign(cross_mean(day_sum(Ret), 20))), 40)
  - cross_mean(sub(div(day_max(Amt), day_mean(Amt)), div(day_median(Amt), day_mean(Amt))), 30)
  - cross_mean(day_corr(in_max_rolling(Volume, 5), Ret), 40)
  - cross_mean(div(day_max(Volume), day_median(Volume)), 60)
  - cross_mean(day_corr(Volume, abs_(Ret)), 40)
  type: N
- hypothesis: '机制:收盘价相对全天成交均价/高低区间的位置(日内尾盘买卖压力)与日内价格路径的趋势性。本批三个 head 里 Vwap 滚动峰值的方差(最差,-2.35,方向 -1)说明 Vwap 的水平信息被价格水平/规模吃掉。这一位只取无量纲的相对位置:day_last(Close) 相对 day_mean(Vwap) 的偏离(收在均价上方 = 尾盘被买),其标准化版本 (Close - Vwap 均值)/day_std(Close),收盘在当日高低区间中的位置 (Close - Low)/(High - Low),在日轴取 10-40 日均值;另加价格对时间的相关 day_corr(Close, in_index(Close)),衡量日内趋势性。都是现成算子的组合,与三个 head 的"滚动峰值 + 离散"骨架不同。

    为什么样本外还会在:收盘位置反映尾盘知情/机构交易与日内趋势的持续,A 股 T+1 下收在高位的股票次日有跟随(日内动量)也可能被追涨后反转,方向由 GP 搜索;这是微观结构 + 行为偏好,不依赖某段行情。风险:与 20 日反转控制相关,尺子会去掉线性与非线性暴露。

    数学检查:分母是全天高低差或价格标准差,日内不动(一字板)时为 0,算子给缺失而不是爆点;无前视(day_last(Close) 是 t 日收盘,t+1 才交易);窗口 ≤ 40 日。'
