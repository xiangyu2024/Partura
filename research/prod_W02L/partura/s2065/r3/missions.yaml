  - type: N
    hypothesis: >-
      机制:名义(未复权)股价水平与"复权因子"。LogFloatCap - LogFloatShares = log(未复权价格)(市值 = 价 x 流通股),
      这是真实的低价股/彩票偏好变量(A 股散户偏爱一两块钱的名义低价股);而后复权价 day_mean(Close) 的对数减去它,
      = 自基期以来累计分红送转的对数复权因子,衡量公司长期的现金分红与送转历史(分红型 vs 不分红型)。
      本种子前两轮围着后复权价格水平(day_mean(Close))的截面裁切和时间轴处理,最好约 -0.1,没出 head;
      原因可能是后复权价把"累计收益""名义价格""分红"三件事混在一起,这一位把它们拆开:名义价格水平、复权因子、
      复权价对名义价的比。控制里只有 LogFloatCap(市值),名义价与市值是不同的量(价 x 股本中的价部分),复权因子更是控制里没有的。
      算子实现:sub(LogFloatCap, LogFloatShares) 取名义价对数;log(day_mean(Close)) 取复权价对数,相减得复权因子;
      日轴上做 cross_mean / cross_delta 以降低换手。与库里不同:库里的价格类表达式只含分钟价格字段的统计,
      没有任何一条引入股本叶子去还原名义价。
      样本外还会在:低名义价偏好与分红史(股息/质量偏好)是长期行为/基本面特征,每年都在,不依赖某段行情。
      数学检查:log 的输入是正的后复权均价,停牌缺失时给缺失;股本叶子是日频常数,无近零除数;无前视;窗口 ≤ 120 日。
    inspired_by: 本批共性表里 day_mean(Close) 及其变形(pow_05/pow_2/cross_quantile_q25)是唯一系统富集的子树,但前两轮都没出 head,推测是三种信息混在后复权价里。
