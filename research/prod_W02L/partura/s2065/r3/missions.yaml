  - type: N
    hypothesis: >-
      机制:可流通股本的扩张(限售股解禁/增发上市)造成的供给压力,以及总股本与流通股本之间尚未上市的"悬挑"比例。
      本种子前两轮在价格水平和日内形态上全部失败(最好约 -0.1),本批 heads 也全是日内离散统计;这一位完全换数据:只用日频叶子
      LogFloatShares 与 LogTotalCap/LogFloatCap(控制里只有 LogFloatCap 的水平,没有股本的变化量)。
      算子实现:cross_delta(LogFloatShares, d) 是过去 d 日流通股数的对数变化(解禁/新增流通盘事件的累计强度);
      sub(LogTotalCap, LogFloatCap) 是 log(总股本/流通股本),即未流通比例的对数(悬挑);再配上 ListAge(次新/解禁周期阶段)与
      cross_max/cross_mean 在日轴上做平滑,使信号变化慢、换手低(纯多头 15bp 成本下必要)。
      和库里不同:库里 5583 条全是分钟字段的日内统计,没有以股本变化为主体的表达式;和控制也不同,控制只含市值水平,
      股本变化量与流动性、波动、反转、市值水平的暴露都弱。
      样本外还会在:A 股解禁日前后的负超额、以及大比例未流通股带来的供给压力是制度性的(股改后限售解禁周期),
      每年都在发生,不依赖某段行情;方向让 GP 自己选。
      数学检查:LogFloatShares 在多数日子不变,差分大量为 0,截面上会有大片并列(列序打破并列,携带板块信息);
      无除以近零的量,无前视(只用过去股本);窗口 ≤ 250 日。
    inspired_by: 本批 heads 全是分钟字段的日内离散统计且全部为负;共性里唯一正向富集的 day_mean(Close) 是水平类量,说明分钟路径里没有残差 alpha,转向分钟数据之外的日频股本结构。
