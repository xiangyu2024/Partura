    里, 即「收盘拉升旗标」(尾盘抢筹 / 涨停封板 / 收盘集合竞价冲高的 0-1 事件)。上一轮唯一接近过线的候选(+0.31,valid +0.48) 是把它放进
    cross_reg_fvalue(…, 241) 的 F 值回归里,外围全是「截面回归的显著性」。本轮外围完全换成时间序列上的事件频率与相互作用: 对旗标取
    ts_mean / cross_ema 得到一只票过去 60~120 天「尾盘被拉升」的频率(事件稀疏,所以必须累计才有排序信息); 与 ts_corr(旗标,
    当日均收益) 衡量尾盘拉升是否是整天走势的延续(延续型是真实买盘,独立型是尾盘操纵 / 做收盘价); 与 LimitWidth / ListAge 相乘,把同一个旗标放到涨跌停宽度与上市年龄的制度背景里(板块与新股的尾盘拉升含义不同),
    这是库里没有的字段用法。机制:被反复在收盘价上拉升的票,收盘价偏离当日公允价,次日会被冲回(反转)或被资金持续接力(动量), 两者都不是流动性 / 波动 /
    20 日反转 / 市值控制能解释的;样本外还会在,因为收盘拉升行为由收盘集合竞价规则、基金考核与散户追涨决定, 是制度性的慢变量。全部只用当天及更早的数据(ts_*
    窗口向后,不含 shift)。'
