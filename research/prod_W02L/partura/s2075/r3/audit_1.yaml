    soundness: 3
    reasons: '快照里该 head 已在第 2 轮被替换为窗口 60 版本(R_prev.json 的 replacements 与 loc.md 的 head 表:cross_mean(div(day_skew(Ret), day_kurt(Ret)), 60),score -0.51),本组 head 写的仍是窗口 20 的旧文本,应改成 60 版本,否则替换判定会对错原 head。why 里说「60 与 120 都只到 -0.51」,但 R_prev.json 与 notebook 里只有 20/40/60 以及 40 的 EMA、标准差与 wmean 变体的记录,没有 120 窗口的读数,这句需要更正。变体 1–3 只改窗口或半衰期(cross_mean 241 日;cross_ema 半衰期 120 与 240),机制与 head 一致,没有数学问题。变体 4 的 add(day_kurt(Ret), day_std(Ret)) 中 day_std(Ret) 是分钟收益的标准差(量级千分之几),而 day_kurt 是超额峰度(AlphaCube-steering/src/alphacube/operators/common.py:418–422 的 _kurt 减去了 3),量级为 1 到几十,所以加法基本是 no-op,只在超额峰度接近 0 的日子有差别;它实际上只是窗口 120 的 head,不是新结构。另外,分母是超额峰度,在它接近 0 时比值会爆炸,而 cross_mean 是在排名之前对原始值取均值,单个爆点日会主导 60 或 241 日的均值,四个变体都带着这个分母,都可能继承这一伪影。这需要看 train/valid 的分布才能确认,我没有算,不足以判为数学问题,但结果出来后应该检查。机制(尾部形状、拥挤)说得比较含糊,所以给 3 分而不是 4。'
