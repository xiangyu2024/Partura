  hypothesis: 新 idea:日内价格路径的「持续性/趋势性」是个很慢的个股属性。day_hurst(分钟价格路径) 衡量一天内价格是趋势型(H>0.5)还是回归型(H<0.5),与成交量的集中度(day_gini)、成交重心(day_centroid)、分钟收益一阶自相关(day_ar1_coefficient)同属日内微观结构度量。做法:把这些日内度量取 241 日均值/中位数/EMA(无量纲、极慢),或取它们之间的 241 日相关、对日收益的回归斜率、横截面残差(去掉两个慢变量中公共的部分),读的是「这只票长期以来是被知情/趋势型资金推动,还是被做市商/噪声交易者在均值回复」。与库不同:库里 day_hurst(Open) 只出现在 cross_sum(…,241) 一种骨架并被禁;这里换成 cross_mean/cross_med/cross_ema 的不同聚合、换价格口径(Close、Ret 的 hurst)、换成对成交量形态的度量、以及两个慢变量的相关/回归/残差,骨架不同。为什么样本外还会在:第 2 批里 cross_sum(day_hurst(Open),241) 一族在评分候选里均值高出约 1.6(p<0.001),说明「241 日慢的日内路径统计」整体比其他读法好得多,且是最慢的一类,换手最低;机制上趋势型 vs 均值回复型的结构性差异(订单拆分、做市比例、涨跌停与板块特征)跨时期稳定。若其中一部分只是名义股价/价差代理(报价单位弹跳),新尺子去不掉最小报价单位,这是已知风险,留给 valid 段检验。
