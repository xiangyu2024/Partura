- hypothesis: 新想法:「日内行为的跨年不稳定度」。本流已测的结论是 alpha 的唯一线索是慢(241 日 std 单调好于短窗口)且读的是不稳定性而非水平(C
    的水平没有 alpha,ts_stddev(|C|,241) 有)。前两轮 N 位用的是 241 日均值(cross_mean(day_hurst), day_centroid,
    day_gini 等,读水平)没有出成绩,所以这一位把同样的日内形态量改读为 241 日标准差:ts_stddev(day_centroid(Volume),241)(成交重心的日间漂移:交易时段是否稳定,机构拆单
    / 散户集中交易时段切换)、day_gini(成交量集中度的不稳定)、day_hurst(Close / Ret)(日内趋势 / 回归性质的切换)、day_ar1
    / day_autocorr(分钟收益自相关的不稳定:买卖价差弹跳与趋势交替)、day_signed_ratio(Ret, Volume)(量价方向耦合的不稳定)、day_zero_ratio
    / day_flat_ratio(零收益 / 无变动分钟占比:最小报价单位与流动性状态的切换)、以及用 cs_rank / cs_demean 先在截面上取相对位置再取
    std(去掉全市场共同的冲击日)。实现:全部是 日内函数 day_* 取日值,再用 ts_stddev 241 日(或除以 241 日均值得到 CV)读离散;不含前一轮用过的
    cross_mean 水平读法,也不含 C 事件。与库不同:库里 ts_stddev 的外壳只套在 C(放量事件均值)和少数波动量上,没有套在日内形态量(重心
    / 基尼 / 赫斯特 / 自相关 / 零收益占比)上。为什么样本外还会在:这是 head 机制(知情 / 拥挤交易导致的行为切换)在另一族日内测度上的复制,窗口一年以上、换手极低;各测度彼此不是同一量(重心看时段、gini
    看集中、hurst 看路径),若有 alpha 来自「行为不稳定的票被低估」这个共同成分,多种读法会一起出现,提高 GP 能找到的概率。风险:名义股价 /
    最小报价单位会通过 zero_ratio 与 hurst 代理进来(新尺子去不掉),valid 段会检验。
