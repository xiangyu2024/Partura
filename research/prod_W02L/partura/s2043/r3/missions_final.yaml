  hypothesis: 核心 A0 = abs_(day_mean(mul(replace_small_with_nan(is_gt(分钟成交量增量, 当天增量均值+1倍标准差)),
    分钟收益))):放量分钟的平均收益 C 的绝对值(第 31~210 分钟)。证据(本流前两轮、只用 train/valid):ts_stddev(A0, 241)
    是目前本流最好的 head(train 0.39 / valid 0.63),且窗口越长 valid 越好(360 日 0.73、480 日 0.79),说明
    alpha 在「放量时价格冲击幅度跨一年的波动(不稳定性)」这个几乎静态的个股属性上,换手极低所以扣 15bp 后还在;C 的水平本身没有 alpha。本轮不再用前两轮已测过的写法(ts_stddev
    单窗口、ts_mean / add 外壳、CV、分位数、偏度、自相关、回归斜率),而是换六类读法:(1)长短窗口的波动比 ts_stddev(A0,241)/ts_stddev(A0,60),去掉长期静态成分后读「近期是否更不稳」的结构变化;(2)上行
    / 下行半标准差(cross_semistd_pos / neg):只度量冲击放大那一侧的离散,把对称波动里与波动率控制共享的部分拆开;(3)稳健或排名后的离散:先用
    cs_rank / cs_robust_z / cs_winsor 把 A0 每天在截面上变成相对位置再取 241 日 std,去掉全市场共同的冲击日(这些日子整个截面一起动,与波动控制重合),只留个股相对冲击排名的不稳定度;(4)方差稳定化与差分:sqrt(A0)
    的 std、A0 一阶差分的 std(只度量日间噪声、不管持久水平)、局部 20 日 std 的 241 日均值或 60 日 std 的线性衰减加权(vol-of-vol
    的路径读法);(5)尾部形态:峰度、最大值减中位数、稳健 z 分数;(6)241 日 std 减去局部 std 的均值(长期静态部分减去短期噪声部分)。这些与已有
    head 的函数形式都不同(head 是单窗口 std),骨架库里没有;外围与前两轮含核心的候选(ts_mean/ts_stddev/add/in_sustain_stddev
    外壳,quantile/skew/autocorr/regbeta)都不同。样本外为什么还会在:机制是知情交易者进出导致的价格冲击不稳定(流动性供给薄、散户拥挤的票冲击忽大忽小),是个股长期性格,不依赖某一段行情;新尺子已去掉对波动
    / 流动性 / 市值的线性 / U / S 暴露,残差里剩下的是冲击的「不稳定性」而非「大小」。风险:与 ts_stddev(A0,241) head 本身
    ρ 偏高的写法会被库禁令挡掉,最可能的幸存者是排名后离散和半标准差、长短比。
