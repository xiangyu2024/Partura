  hypothesis: '机制:核心 C = day_mean(mul(replace_small_with_nan(is_gt(ΔV, 当天 ΔV 的均值 +
    1 倍标准差)), Ret)),其中 ΔV = 第 31~210 分钟里成交量较上一分钟的增量。含义:每天把「成交量突然放大」的分钟挑出来,取这些分钟的平均收益
    = 个股在放量冲击时刻的价格反应(没有放量分钟则为 NaN)。这个原料本身已经在库里挖到了底:本批 42 个候选里含 C 的富集(均值差 +1.33~+1.49,p
    0.001,含 / 不含 −1.78 / −3.11),但库里对 C 的全部写法只有一种思路 —— 对 C 的水平、绝对值、20 日内离散度做加工(ts_stddev、ts_mean、abs_、cs_demean、add、day_std
    / day_max 换统计量)。三个素材 head(−1.09 / −1.12 / −1.35)全是 ts_stddev(abs_(cs_demean(C)),
    20) 一类,不是真 head。


    本批拆解给出两条证据,决定了这一位怎么押:(1) 看「慢」:C 单独 −2.82,套 ts_stddev 之后 −1.09,窗口 10 / 20 / 40
    日 train 是 −1.79 / −1.09 / −0.84、valid −1.96 / −0.21 / +0.03(head 1;head 2 同向:−0.78
    / valid +0.13),单调变好;所以在新尺子下换手 × 15 bp 是第一成本,任何写法都应该是慢变量。(2) 看「口径」:Volume 换 Amt
    分数不动(−1.07 / −1.12 / −1.33),说明信息在「放量时刻的价格反应」,不在成交量口径。这一位不再给 C 做平滑 / 取绝对值 / 取离散度(那些是库里已有的写法,和
    head 的日度秩相关必然 ≥ 0.7,GP 的库禁令会拒绝),而是把 C 当成「放量冲击后价格反应」这一原料,问它在 60~241 日的慢尺度上有什么稳定的统计结构。四组:


    (a)Llorente、Michaely、Saar、Wang(2002)的跨日先后:cross_regbeta / cross_corr / cross_reg_tvalue(昨日的
    C, 当日收益或去市场的当日收益, 120~180 日)。斜率为正 = 这只股票的放量冲击之后价格倾向延续(知情交易),为负 = 倾向回吐(对冲 / 流动性交易)。种子
    1~5。回归元与被解释变量之间隔一天(cross_delay(C, 1)),当日收益 day_sum(Ret) 在当日收盘已知,没有前视;被解释变量去掉全市场共同部分(cs_demean)是为了不让市场日效应进入斜率。

    (b)同日关系:C 与当日收益 / 前一日收益的 60~120 日相关或斜率(种子 6、7、8)。读的是「当天的涨跌有多少是放量分钟贡献的」和「放量分钟是不是追着昨天的方向走」。

    (c)无量纲、慢的聚合:C 除以当天分钟收益标准差再取 30 日 EMA(种子 9;|C| ≤ 最大分钟收益,分母为 0 时分子也为 0,得 NaN,不会爆点);C
    去市场后的 90 日中位数(种子 10,对个别极端放量日稳健;我有意没有用 sign 的天数占比,那种取值档位太少,过不了 GP 的「不同值 ≥ 50%」闸门);C
    的 1 日 / 5 日自相关(种子 11、12,放量冲击方向是否连续几天同向 = 资金连续净买入还是单日噪声);C 减去当天窗口内全部分钟的平均收益、以及对其做截面回归残差,再取
    60 日均值或 40 日 EMA(种子 13~15,去掉当天漂移,只留「放量比不放量多出来的收益」);C 的 241 日均值(种子 16)。

    为什么和已有的不同:快照里含 C 的写法外围算子集合只有 {ts_stddev, ts_mean, abs_, cs_demean, add} 与换统计量的
    {day_std, day_max, day_product};这里用的是 cross_regbeta / cross_corr / cross_reg_tvalue
    / cross_autocorr / cross_delay / cross_ema / cross_zscore 式的跨日关系与 cs_regres,没有
    ts_stddev 也没有 abs_。16 个种子的算子骨架(抽掉字段、常数、窗口)已逐个对照两个库 5583 条和 3 个 head,全部不同。库里与它们最近的是
    B127 自己的 ts_mean / ts_stddev 外壳,和这里的回归 / 相关 / 自相关不是同一个量。

    为什么样本外还会在:(1)这些是「个股自己的、慢的」统计量,120 日估计,名次几周内基本不变,15 bp 下换手低(窗口越长越好是本批证据);(2)机制是订单流构成:放量冲击是知情资金推动还是流动性冲击,取决于持仓者结构、融券约束和做市深度,这些变化慢,不依赖某一段行情;(3)全部是相关
    / 斜率 / 自相关 / 占比,不含成交额水平,对流动性、波动、市值控制先天近似正交 —— 新尺子去掉的是对控制的线性 / U 形 / S 形暴露,这里本来就没有水平暴露。最可能的失败方式:单日
    C 只是 20~30 次放量分钟收益的均值,噪声大,60~180 日的相关估计误差约 0.1,可能大于股票之间真实的离散度,名次近似随机,换手把成本吃满;对当日收益的回归带有
    20 日反转暴露。预期:这一位大概率出不了 head,但如果出,最可能是 (a) 组的 120~180 日版本。

    数学检查:无前视(只用 t 日 31~210 分钟与 t−1 及更早的 C);cross_* 的窗口在样本头部是扩张窗口,对所有种子一样,不主导结果;cross_corr
    / cross_regbeta 在窗口内有效对太少时返回 NaN 或 0,只影响新股 / 长期停牌的票,可交易掩码已排除;没有除以近零量的种子,除法只出现在
    C ÷ day_std(Ret)(有界)。'
