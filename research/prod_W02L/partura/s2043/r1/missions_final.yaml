- type: N
  hypothesis: '机制:放量之后价格怎么走 —— 延续还是回吐。每天把「成交量较上一分钟突然放大(增量超过当天增量均值 + 1 倍标准差)」的分钟标为事件
    S(与 B127 同一个事件定义,保证本 idea 与库的唯一区别是读法),在每个事件上取两个量:冲击收益 imp = 事件分钟自己的 Ret;之后 5 分钟的平均收益
    post5 = in_sustain_mean(S, Ret, 5, 1)(第 4 个参数 start_offset = 1,从事件下一分钟开始,不含事件分钟;全在当天
    31~210 分钟之内)。事件内的相关 day_corr(imp, post5) 为负 = 放量冲击被回吐(流动性冲击 / 买卖价差弹跳 / 对冲交易),为正
    = 冲击被延续(知情交易、永久价格冲击)。带符号的延续量 SC = day_mean(sign(imp) × post5) = 「沿冲击方向继续走了多少」,除以
    day_mean(|post5|) 得到 [−1, 1] 的延续占比。这是 Hasbrouck(1991)永久 / 临时价格冲击的分钟事件版,也是 Pástor–Stambaugh(2003)gamma
    的事件版。


    来自 B127 的现象:(1)库里对放量事件只读两个量 —— 事件上的平均收益 C(水平类,单独 −2.82)和事件之后的波动 in_sustain_stddev(head
    3 的第二项,单独 −2.00,在全库出现 121 次);事件之后的**带符号走向**(in_sustain_mean 全库 4 次,没有一次和事件分钟的收益配对)从来没读过。(2)窗口越慢越好(ts_stddev
    10 / 20 / 40 日 train −1.79 / −1.09 / −0.84),所以这里全部是 60~120 日的慢聚合。(3)Volume 换 Amt
    不变,说明读的是放量的价格反应,不是成交量口径。


    算子怎样实现:(i)种子 1~4:在日内事件之间算 imp 与 post5(或 post10)的相关 day_corr,再取 60 / 120 日均值或 30
    日 EMA —— 一天约 20~30 个事件一起估一个相关,比对日度均值做 120 日回归的估计误差小得多;(ii)种子 5、6、11:SC 的 60 日均值、延续占比的
    40 日 EMA、SC 除以当天分钟收益标准差(无量纲);(iii)种子 7、8、9:对日度均值做 120 日的回归斜率 / 相关(post5 对 imp)和
    post5 − imp 的 60 日均值;(iv)种子 10、13:昨日的 SC 或昨日的事件相关作回归元、去市场的当日收益作被解释变量的 120 日斜率(Llorente
    式的跨日先后);(v)种子 12:换一个事件定义,当天成交量增量最大的 10% 分钟(in_top_quantile_flag),检验结论不依赖「均值 +
    1 倍标准差」的阈值。

    为什么和库里已有的不同:库里是「事件上的收益水平 / 绝对值 / 日度离散度」(C 的水平、ts_stddev、ts_mean、in_sustain_stddev),都是不带方向配对的量级;这里是事件分钟与其之后价格路径的方向配对(相关、同号乘积、回归斜率),是符号
    / 无量纲 / 慢的统计量,13 个种子的骨架(抽掉字段、常数、窗口)已逐个对照两个库 5583 条和 3 个 head,全部不同(in_sustain_mean、day_corr(事件序列,
    事件序列)、sign × post5 的组合库里都没有)。

    为什么样本外还会在:(1)延续 / 回吐是个股的订单流结构属性(持仓者构成、做市深度、最小报价单位相对股价),变化慢,60~120 日的名次稳定,换手低;(2)相关
    / 同号占比无量纲,不含成交额或波动水平,对流动性、波动、市值控制近似正交;(3)机制有文献与微观结构依据(永久 / 临时冲击)。最可能的失败方式:买卖价差弹跳使
    corr(imp, post5) 机械为负,低价股 / 价差大的股票更负,这部分与名义股价和流动性有关 —— 新尺子去掉了对流动性与市值的线性 / U /
    S 暴露,名义股价这块去不掉,所以如果这一位有效,有一部分可能是「最小报价单位相对股价」的代理;事件数很少的股票 day_corr 取 ±1 极端值,60
    日以上均值把它抹平。预期:大概率出不了 head;若出,最可能是事件内相关的 120 日均值(种子 2)或 SC 的慢聚合(种子 5、11)。

    数学检查:事件和 post5 都只用当天 31~210 分钟(事件窗口在切片末尾被截断,nanmean 只用剩下的分钟),无前视;day_corr 只在两个序列同时有值的事件分钟上算,有效对少于
    2 时为 NaN,分母加了 EPS;种子 6 的分母 day_mean(|post5|) 为 0 时分子也为 0,得 NaN;种子 11 的分母 day_std(Ret)
    同理(有界);没有除以近零量的爆点;in_sustain_mean 是向量化实现(不像 in_interval_* 逐行循环,所以我没有用 in_interval_*)。'
