- type: N
  hypothesis: 'Lead-lag price-volume coupling at the minute level. The batch''s only
    positive lead uses the contemporaneous within-day minute correlation of Volume
    and Ret; it cannot say who leads. New idea: correlate return with volume shifted
    by k minutes in BOTH directions, using in_slice with equal-length windows so no
    filler values and no look-ahead across days: day_corr(in_slice(Ret,2,240), in_slice(Volume,1,239))
    = return in minute t against volume in minute t-1 (volume leads price: informed
    / order-splitting flow that moves the next minute''s price), versus day_corr(in_slice(Ret,1,239),
    in_slice(Volume,2,240)) = volume reacting to the previous return (volume follows
    price: momentum-chasing / retail reaction). Their difference per day is a lead-minus-lag
    asymmetry; the trailing 241-day peak of the lead leg (as the known core does for
    the contemporaneous leg) is a persistent trait: which stocks have bursts where
    order flow predicts the next minute. Also 5-minute shifted versions (in_slice(Ret,6,240)
    vs in_slice(Volume,1,235)), the day_corr with Amt, and ts_mean / cross_mean smoothing
    of the signed asymmetry. Why different from the library: no library expression
    uses shifted-minute slices of Ret against Volume (library has only contemporaneous
    day_corr), and the signed lead-minus-lag asymmetry is a direction-of-causality
    measure that the contemporaneous coupling, volatility and liquidity controls do
    not contain. Why it should persist: the lead of volume over price reflects informed-flow
    and market-microstructure latency (Kyle-style price impact arriving in next minutes),
    while volume-follows-price reflects retail chasing; these are structural features
    of A-share intraday trading rather than sample-specific. Note day_corr returns
    0 (not missing) when a side is constant (limit-up, zero volume), so such stocks
    cluster at 0 in the cross-section; peak statistics over 241 days limit this.'
