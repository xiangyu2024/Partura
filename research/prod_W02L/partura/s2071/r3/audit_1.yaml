  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [10, 11]
    reasons: '相关度表:核心 cross_max(abs_(day_corr(Volume,Ret)),241) 与快照 9 个 head 的原始 |ρ| 最大 0.206(day_median(pow_2(nt_cs_rank(Ret)))),残差 0.179;与控制 liq 0.037、vol 0.000、rev 0.032、known 0.003、size 0.112,都远低于 0.8,过 E 位的控制门槛。核心在 loc.md 共性表里有(+1.86 那一行),是子树,种子都原样包含核心。创新度给 4:核心是价量分钟相关的年内峰值,与所有 head(range 乘日内波动水平、nt_cs_rank 矩)度量的东西不同,控制也几乎不含它;没有给 5,因为外围都是对同一核心的截面与时序包装。种子 1 至 4 是按 LogFloatCap、LimitWidth、BoardCode、ListAge 分桶去均值。cs_bucket_demean 的分桶是十分位,离散控制(LimitWidth、BoardCode 只有 4 档左右)的十分位切分由列序打破,所以这两个种子的「同板块」实际是同板块内按列序切片,不是严格同板块;这不是数学错误(§4 列序并列不挡),但结果里要注意。种子 2、3 与 size 的 |ρ| 分别为 0.287、0.261,说明分桶去均值后仍有市值暴露,与分桶变量本意相符,保留。种子 5、6 是分桶秩,与种子 1 的去均值形式不同,保留。种子 7、8 是对 Amt 与 vol 的截面回归残差,残差与该控制的 |ρ| 分别为 0.005 与 0.001,去掉的正是这两个控制,保留。种子 9 是除以 60 日平均日内波动,与 vol 控制 0.677、与范围 head 0.609,都低于 0.7 与 0.8 的划线;分母是 60 日平均波动,不接近零,机制是单位波动的耦合强度,保留。种子 12 是核心的 20 日半衰期 EMA,与核心是同一量的时序平滑;r2 已测过 cross_max 的平滑平台(+0.41 到 +0.42),边际价值可能小,但它不是重复也不是数学问题,保留。划掉 10 与 11:11 是 cs_robust_z,即 (x 减中位数)/(1.4826 MAD) 的每日严格递增仿射变换,截面秩与核心逐日完全相同,按日截面秩打分的奖励下是同一个信号;10 是 cs_winsor,只在每日 1% 与 99% 分位截断,秩只在两端约 1% 内并列,其余排序与核心一致,同样是重复。前视检查:没有 shift 类算子,cross_max 只用过去 241 天。风险提示(不挡):cross_max 对样本量很敏感,当天有效分钟很少的日子(盘中停牌、新股)可能拉高峰值,建议 PI 查当天有效分钟数对峰值的影响;相关度表里 liq 0.037 说明目前没有明显的样本量伪影。如果它有 alpha,最可能来自:在同类(市值、板块、上市年限)里价量耦合的年内峰值偏高的股票,即持续的散户注意力集中,而不是波动水平。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [12]
    reasons: '相关度表:b1 cross_max(abs_(day_corr(in_slice(Ret,2,240),in_slice(Volume,1,239))),241) 与 head 原始 |ρ| 0.132(残差 0.155);b2 反向错位 0.160;b3 五分钟错位 0.130;b4 与 b5 的符号非对称项原始 0.413 与 0.357、残差 0.153 与 0.157,但与 liq 0.37、vol 0.34、known 0.38 偏高(都低于 0.5 的已知族门槛),说明非对称项有一部分是流动性与波动的换皮,要在结果里单独看;b6 0.109;b7 0.063;b8 0.166;b9 原始 0.234 残差 0.342,与 size 0.36 偏高;b10 ts_std 非对称 0.359,与 liq 0.307、known 0.311;b11 两峰差 0.101。没有任何种子与 head 或控制的 |ρ| 达到 0.7 或 0.8,无自动划掉。切片长度核对:in_slice 两端含,Ret 2..240 与 Volume 1..239 都是 239 列,Ret 1..239 与 Volume 2..240 都是 239 列,Ret 6..240 与 Volume 1..235 都是 235 列,Ret 2..240 与 Amt 1..239 等长,没有越界,也没有填充值进入 day_corr。前视检查:所有错位都在同一个交易日内,cross_max、cross_mean、ts_mean、ts_std 都是过去窗口,cross_ema 是因果的,没有 shift。创新度给 4:库里的 head 与控制都没有有方向的分钟错位相关,符号非对称项测的是先后方向,与同时相关不是同一个东西;没有给 5,因为非对称项与流动性和已知族的相关偏高,可能只是换了写法。合理度给 4:机制清楚(量领先价 = 知情或拆单流在下一分钟推动价格;量跟随价 = 追涨的散户反应),非对称相减能抵消两者共有的日内 U 型成分,设计是对的;提醒:day_corr 在某一侧为常数时返回 0,涨停或零成交日会把截面聚在 0 附近,241 天最大值会部分缓解这一点。划掉 12:cross_argmax 的 120 日窗口输出是离散的位置档,gate 不通过,distinct 仅 0.077,即绝大部分单元取值重复,截面秩主要由并列块与列序决定,这是数值伪影(§4 的面板几乎是常数),不是 alpha。剩 11 个种子,满足 4 个以上。如果它有 alpha,最可能来自:知情流领先价格的分钟级延迟(量在前一分钟先动,价在下一分钟跟上),或散户追涨的反向关系,即同一股票量价结构的日内先后方向,而不是量价同时相关的强度。'
R:
  - head: 'ts_regbeta(cs_regres(mul(-5, day_close(Volume)), day_kurt(Volume)), day_close(cross_argmax(Vwap, 60)), 10)'
    soundness: 3
    reasons: '相关度表:R 1 的四个变体与原 head 的原始 |ρ| 为 0.41、0.19、0.26、0.34,残差 0.74、0.47、0.57、0.62;变体与 liq、vol、known 的 |ρ| 都不超过 0.05,与控制无关。合理度给 3:机制说不清。ts_regbeta 的因变量是 cs_regres(day_close(Volume), day_kurt(Volume)) 的截面残差,即收盘那一分钟成交量在峰度上的剩余;自变量是 Vwap 或 Close 的 60 日 argmax 位置的 day_close。为什么成交量剩余对峰值时点的 10 日时序斜率有预测力,机制上没有交代。算子核对:mul(-5, .) 是常数缩放,cs_regres 对尺度不变,符号由 beta 吸收,这一步确实是 no-op,不是问题;day_close(Volume) 取的是收盘那一分钟的成交量,是单分钟观测,噪声大,这是定义上的弱点,但不是数学错误。窗口 10 到 20、30、40 的扫描是在 train 与 valid 上做的,属于样本内选择,不是挡的理由,但结果里要标明。没有前视算子。如果它有 alpha,最可能来自:尾盘成交量的截面剩余随 VWAP 峰值时点的变化,即尾盘资金集中与个股峰值时点的关系。'
  - head: 'ts_autocorr_s1(add(ts_std(signedpower(day_var(Close)), 5), day_quantile_q25(cross_argmax(Vwap, 30))), 20)'
    soundness: 3
    reasons: '相关度表:R 2 的变体与原 head 的原始 |ρ| 为 0.44、0.74、0.15,残差 0.70、0.71、0.17;变体 2 与原 head 高相关(0.74),是换了 ts_std 窗口与 argmax 来源的结果,不是新信号。合理度给 3:add 把两个量纲完全不同的量直接相加。day_var(Close) 是日内收盘价的方差,单位是元的平方,signedpower 0.5 之后仍随股价水平放大;day_quantile_q25(cross_argmax(Vwap, 30)) 的取值是 0 到 1 的时点位置。相加的结果由量级更大的一项主导,权重由单位决定,不由机制决定。这意味着 head 的一部分可能是股价水平的代理;控制(size 是市值,不是股价)不含股价水平,这一点要在结果里单独检查,但它不是数学错误:没有除以近零量,没有前视算子,ts_autocorr_s1 是窗口 20 的一阶自相关。cross_argmax(Vwap, 30) 只有 30 个离散档,会造成并列,但不是常数面板。变体 1 把 Vwap 换成 Close 是合理的对照。如果它有 alpha,最可能来自:日内收盘价离散程度的一阶自相关(价格波动是否持续),而不是 VWAP 峰值时点本身。'
summary: '2071 r3 审计:a 位(E,核心 cross_max(abs_(day_corr(Volume,Ret)),241) 的截面外围)划掉 10、11 两个重复后剩 10 个种子,创新度 4、合理度 4;b 位(N,分钟错位价量相关)划掉 12(数值伪影,distinct 0.077)后剩 11 个种子,创新度 4、合理度 4;两个 R 组合理度均为 3;未发现数学问题(前视、常量面板)的挡点。'
