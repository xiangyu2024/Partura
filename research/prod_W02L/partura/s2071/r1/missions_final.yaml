    day_min(Low)), day_open(Open)), 60)), 10)
- type: N
  hypothesis: 'All heads in this batch measure the size of intraday movement (range,
    std, sum|ret|). The new idea is the SHAPE of the intraday path instead of its
    size: (a) close location value (Close-Low)/(High-Low), where closing near the
    high signals late-day buying pressure / chasing and near the low signals forced
    selling; (b) timing of the extremes, argmax(High) minus argmin(Low), late highs
    mean the day ended with a rally; (c) efficiency |Close-Open|/range, trending versus
    choppy days; (d) overnight gap level and gap volatility (Open vs previous Close),
    overnight returns are driven by news and institutions while the intraday part
    is retail; (e) minute-return skew / kurt / max (lottery-like MAX preference, overpaid
    by retail and so low long-side return); (f) price-amount minute correlation. Each
    is built from day_* aggregates of minute fields, normalized by range or by price,
    so it does not carry the vol level, and it is averaged over 20 days with ts_mean
    / ts_std to give a persistent trait. Why it should persist out of sample: lottery
    preference, retail chasing of late-day strength and the overnight-versus-intraday
    split are well documented behavioral and microstructure effects (Bali et al MAX,
    overnight-intraday literature) and are structural to a retail-heavy A-share market.'
  inspired_by: 'Batch 1 (intraday range x day volatility heads): every one is a vol-size
    measure that loses after the controls, so the unexplored axis is the path shape
    rather than the size.'
  seeds:
  - ts_mean(div(sub(day_close(Close), day_min(Low)), sub(day_max(High), day_min(Low))),
    20)
  - ts_mean(sub(day_argmax(High), day_argmin(Low)), 20)
  - ts_mean(day_skew(Ret), 20)
  - ts_mean(div(sub(day_open(Open), ts_delay(day_close(Close), 1)), ts_delay(day_close(Close),
    1)), 20)
  - ts_mean(div(abs_(sub(day_close(Close), day_open(Open))), sub(day_max(High), day_min(Low))),
    20)
  - ts_mean(day_kurt(Ret), 20)
  - ts_mean(day_corr(Ret, Amt), 20)
