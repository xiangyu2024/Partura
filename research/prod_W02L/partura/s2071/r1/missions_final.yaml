- type: E
  core: div(sub(day_max(High), day_min(Low)), day_open(Open))
  hypothesis: 'The three heads are all ts_mean(intraday range/open x a day-vol multiplier,
    20) and all score about -1.6 to -1.8 after the champion/liquidity/vol controls;
    the loc knockouts show the vol multiplier is dead weight (dropping it gains +0.3
    to +0.4) and the range/open (High-Low over Open, a Parkinson-type daily range)
    is the only reusable part. A 20-day mean of the range is just a vol LEVEL, which
    the vol/liquidity controls absorb, so the residual long book loses. Here the range
    core is kept but the periphery asks a different question: the DYNAMICS of the
    range rather than its level (range compression/expansion = short mean over long
    mean, range vol-of-vol ts_std/ts_mean, trailing time-series rank, skew of range,
    5-vs-40 differences, correlation of range with signed return or amount). Mechanism:
    stocks whose range is contracting relative to their own history are in quiet accumulation
    / pre-breakout, while expanding range marks attention shocks that retail overpays
    for and reverts; vol-of-vol is a priced uncertainty about uncertainty. These are
    ratios and differences of the same stock against itself so they are nearly orthogonal
    to the cross-sectional vol level the controls remove; unlike the seen peripheries
    (x Ret std / sum|Ret| then ts_mean) none uses a second intraday field as multiplier
    and all change the time-series aggregation. Out of sample it should persist because
    attention-driven range expansion followed by mean reversion is a behavioral pattern
    not tied to the sample period.'
  seeds:
  - div(ts_mean(div(sub(day_max(High), day_min(Low)), day_open(Open)), 5), ts_mean(div(sub(day_max(High),
    day_min(Low)), day_open(Open)), 60))
  - ts_rank(div(sub(day_max(High), day_min(Low)), day_open(Open)), 60)
  - sub(ts_mean(div(sub(day_max(High), day_min(Low)), day_open(Open)), 5), ts_mean(div(sub(day_max(High),
    day_min(Low)), day_open(Open)), 40))
  - ts_skew(div(sub(day_max(High), day_min(Low)), day_open(Open)), 40)
  - div(ts_std(div(sub(day_max(High), day_min(Low)), day_open(Open)), 20), ts_mean(div(sub(day_max(High),
    day_min(Low)), day_open(Open)), 20))
  - ts_delta(ts_mean(div(sub(day_max(High), day_min(Low)), day_open(Open)), 5), 10)
  - div(div(sub(day_max(High), day_min(Low)), day_open(Open)), ts_mean(div(sub(day_max(High),
    day_min(Low)), day_open(Open)), 60))
  - ts_corr(div(sub(day_max(High), day_min(Low)), day_open(Open)), day_sum(Amt), 20)
  - ts_corr(div(sub(day_max(High), day_min(Low)), day_open(Open)), div(sub(day_close(Close),
