- id: H5_closing_push_reverts
  hypothesis: 收盘前最后半小时被拉上去的股票随后回吐;这部分溢价是做收盘价、尾盘抢筹造成的临时价格压力。
  thesis:
    mechanism: >-
      尾盘的买压有特殊来源:以收盘价为基准的委托(指数基金、做市与结算)、盘后信息前的抢筹、
      以及刻意影响收盘价的行为。它们把收盘价推离日内均衡,属于临时溢价,之后回吐。
      收盘段的收益因此应与未来收益负相关,而同样长度的盘中其它时段不应有这个性质。
    counterparty: >-
      必须在收盘前成交的被动与规则驱动资金(跟踪收盘价的委托、尾盘情绪买盘):它们没有择时自由度,
      为确定性成交付价;对手是愿意在尾盘卖出、并在之后几周买回的流动性提供方。
    prediction: >-
      方向 sign = −1。核心 v1–v3 的 score 落在 0.3–0.9,换手 0.02–0.04。
      C01 的日频读数:sub(day_first(Ret), day_last(Ret)) 选了 +1(即做空收盘分钟强的一侧)、毛 +5.6%/年、
      换手 0.104、净分 −0.59;慢形式的赌注同 H3,是把换手压下来。
      对照 v8(下午中段同样 30 分钟)的 |score| 应小于核心的一半 —— 时段本身必须重要,否则机制不成立。
      v6(尾盘成交额占比)用来分辨「是收盘段的收益」还是「是收盘段的活跃度」。残差 v7 ≥ 0.4。
      v3 与 v1 是同一件事的两种写法(价格比值 vs 分钟收益求和),两者应接近;若差很多,说明 Ret 的分钟定义与价格比值不一致。
    fails_if: >-
      v8(下午中段)与核心同样好 —— 那不是收盘段特有的机制,只是「某 30 分钟的收益」,会被 H1 吸收;
      残差 v7 < 0.3 —— 那它只是 H1 的一个子段;
      核心全部落在 0 附近而 H1 过线 —— 最可能的解释是标签吃不到这段:进场是次日开盘 15 分钟 VWAP,
      若尾盘溢价在 t→t+1 的隔夜就回吐完,收益发生在标签之外,这一条无论机制对不对都赚不到;
      v6(尾盘成交额占比)远好于 v1 —— 那做功的是尾盘活跃度(更接近注意力/被动资金规模),机制要改写成 H6 那一类;
      核心在 train 上选出 sign = +1(做多尾盘拉升者)—— 那是尾盘知情买入的延续,不是临时溢价回吐,本假设即否。
  novelty: >-
      C01 的 G5 族(day_last(Ret) / in_sum_rolling(Ret, ·))共 14 条读数,只有 2 条过 0.7,
      而那 2 条都是 div(…day_std(Amt)…, …) 这种被流动性水平装饰的形式(|ρ已知| 0.79 与 0.92),
      裸形式 day_last(Ret) 的 ρ已知 = −0.006 但日频净分 −0.59。没有一条命中 48 个 head。
      本假设只用无量纲的收益/占比,预期 |ρ已知| < 0.2;与 H1 的区别是时段(最后 30 分钟 vs 全天),
      由 v7 的截面残差和 v8 的错误时段对照共同证明。
  variants:
  - {id: v1,  role: core,     expr: "cross_mean(day_last(in_sum_rolling(Ret, 30)), 30)", predicts: "过线,sign −1,score 0.3–0.9。最后 30 分钟的收益(E1 已核对:day_last(in_sum_rolling(Ret, 30)) 正是当天最后 30 分钟 Ret 之和),30 日平均。"}
  - {id: v2,  role: core,     expr: "cross_mean(day_last(Ret), 30)", predicts: "同向但弱于 v1(单分钟噪声大)。C01 裸日频版净分 −0.59、ρ已知 −0.006,慢化后应转正。"}
  - {id: v3,  role: core,     expr: "cross_mean(log(div(day_last(Close), day_last(in_delay(Close, 30)))), 30)", predicts: "与 v1 接近(同一件事的价格比值写法)。两者的差就是 Ret 分钟定义与价格比值之间的不一致。"}
  - {id: v4,  role: ablation, expr: "cross_mean(day_last(in_sum_rolling(Ret, 15)), 30)", predicts: "若机制真是收盘压力,15 分钟应比 30 分钟更集中、score ≥ v1;若更弱,说明溢价是整个尾盘积累的。"}
