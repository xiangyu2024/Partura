# C02 第 1 轮假设(W1,主研写)。7 个假设,64 个变体 = B 组 64 次付费评估。
#
# 预算说明:B 组每种子的 GP 预算 = 192 − ⌈变体数/8⌉。57–64 个变体都扣 8 次,所以写满 64 个
# 比写 60 个多拿 4 次直接读数而 GP 预算不变。按此把余量全部投给 H1–H4。
#
# 记号(YAML 里已全部展开,此处只为阅读):
#   O = log(div(day_first(Open), ts_delay(day_last(Close), 1)))   隔夜:今开 / 昨收(价格后复权,跨日比值干净)
#   I = log(div(day_last(Close), day_first(Open)))                盘中:今收 / 今开
#   D = log(div(day_last(Close), ts_delay(day_last(Close), 1)))   日收益:今收 / 昨收,D ≈ O + I
#   A = cross_mean(log(div(day_max(High), day_min(Low))), 30)      日内振幅(无方向),H1 的对照
#
# 判据:score = min(train, valid) 的十分位纯多头净超额夏普(扣 15bp,方向与半衰期 0/5/20 在 train 定);
#   score ≥ 0.7 = 发现;与已知族 cross_mean(day_std(Amt), 30) 的实测 |ρ| ≥ 0.5 直接拒;
#   还原毛收益 = train_ann + 0.756 × 日换手,所以慢形式(换手 ≤ 0.04)是唯一能活下来的写法。
#
# 自己定的硬规矩(C01 假象的来源,逐条避开):
#   不用 cs_first_* / cs_last_* / cs_mask_*(C01 的 60 个低 ρ 通过者里 52 个是它们平移造出来的);
#   不用 day_distinct_ratio / day_zero_ratio / day_flat_ratio 做筛选。
#   【总领更正】原注「奖励已把最冻结的 20% 排出可交易集」不对:partura/steer.py reward() 只在 long_tradable /
#   long_bucket / long_marginal 时套 untradable 掩码,本实验的 long 奖励不剔冻结股。所以凡是「除以一个在一价/冻结股上
#   趋近 0 的量」的写法(H1/v8、H1/v11、H3/v5–v6)都可能被冻结股的比值发散带进十分位,读数异常好时先查这一点;
#   Amt / Volume 只作权重、相关、比值,不作排序水平(H6 是唯一例外:只用两个窗口的比值,水平被约掉);
#   不碰 C01 head 族(价格上的 ts_pearson、价格路径的 day_kurt / day_hurst、inv/div(…day_std(Close)…));
#   cross_* 窗口 15/30/60(H6 的冲击腿按机制必须短,用 5/60/241),ts_* 窗口 20/30/40/50;
#   除 H1 外每个假设都有一条 cs_regres(·, cross_mean(I, 30)) 的增量变体 —— 直接检验不报变体之间的相关,
#   截面残差是这一步唯一能读出「是不是 H1 换了一张脸」的办法;H1 自己则对振幅对照 A 做残差。
#
# 执行环节(E1)查到的、影响读数解释的算子边界,写在相关假设的 fails_if 里:
#   log(x) 实为 log(|x|),只在 |x| ≤ 1e-9 时给 NaN —— 本文件所有 log 的参数都是正的价格比值,安全;
#   day_last(in_sum_rolling(Ret, d)) 确实等于当天最后 d 分钟的 Ret 之和(滚动轴在行内,不跨天);
#   day_first(in_sum_rolling(Ret, d)) 只等于第一分钟自己(左侧 NaN 补位 + nansum),所以本文件不用它;
#   day_topw_mean(y, w) 在 w 无离散度(Amt≡0)时退化为 day_mean(y),H3 的「减去等权」因此在零成交日恰好为 0 而非 NaN;
#   day_wmean / day_signed_ratio 在 Σ|w| ≤ 0 时为 NaN(零成交日),覆盖率门槛要留意;
#   cross_ema(x, d) 的 d 是半衰期,不是窗口长度。
#
# 总领审阅(W1,改动 3 个变体、补若干判据;变体总数仍为 64):
#   H3/v11 原安慰剂(High 加权减 Close 加权)两项都约等于等权,构造上就≈0,永远「通过」,区分不了机制与代理。
#     换成 cross_delay(Amt, 3) 加权:同一只股票、同一分钟时点、3 个交易日前的成交额 —— 保留日内 U 形(开盘/尾盘
#     集合竞价那几分钟仍最重)与集中度,只拆掉「今天的钱落在今天的哪几分钟」。这才是 H3 最该排除的代理:
#     加权收益可能只是「开盘那一分钟 + 尾盘那几分钟的收益」(H2/H5 的地盘)。
#   H3/v4(窗口 60)让位给 v3 那种写法(day_topw_mean)的同款安慰剂,两种核心各有一个匹配对照。
#   H6/v3(5 日对 241 日)让位给「对 C01 head 的残差」:C01 head cross_scale(mul(signedpower(day_std(Volume)),
#     day_first(Volume)), 241)(sign −1,+2.05,ρ已知 仅 +0.32)本身就是「相对自身一年的量」,所以 H6 更可能的结局
#     不是被 ρ已知 拒,而是过线但与这个 head |ρ| ≥ 0.7、不算新。直接检验不报与 C01 head 的相关,残差是唯一读法。
#   各假设的 fails_if 补上「train 选出的方向与预测相反即否」(H2 原本就有);H1/v13、H2 的预测补了 C01 / 文献的先验。

hypotheses:

# ─────────────────────────────────────────────────────────────────────────────
- id: H1_slow_intraday_reversal
  hypothesis: 盘中(开盘到收盘)累积的那部分收益会在之后几周回吐;把它按月平滑后做空高者、做多低者,净分能过线。
  thesis:
    mechanism: >-
      盘中价格由追涨杀跌的流动性需求推动:买方急于成交时付出价格冲击,把价格推离其信息价值。
      这部分位移没有信息,随后几周随着买压消散而回吐。隔夜那一跳主要是信息与机构委托,不属于这个机制,
      所以「只取盘中段」应该比「取整日收益」更干净,平滑 30 天是为了把单日噪声和成本一起压下去。
    counterparty: >-
      盘中追价的短线资金和散户:他们在价格已经被推高之后继续市价买入,支付了冲击成本;
      另一边是提供流动性、愿意在几周尺度上承担反转不确定性的做市与套利资金。
    prediction: >-
      方向 sign = −1(做多过去 30 日盘中段累计最低的一端)。核心 v1–v4 的 score 落在 0.7–1.1,
      换手 0.02–0.04;v2 应复现 C01 的读数(train ≈ 0.89、valid ≈ 0.86、换手 ≈ 0.030),是环境一致性的校准锚。
      窗口单调性:15 < 30 ≤ 50(C01 的 5/10/20/30 读数是 0.40/0.63/0.74/0.86,单调上升,所以 50 可能更好)。
      纯盘中 v1 应不低于含隔夜的 v10;对照 A(v13,无方向的振幅)|score| < 0.3,核心至少高出它 0.4;
      对振幅做残差后的 v12 仍 ≥ 0.4,最好 ≥ 0.7。
    fails_if: >-
      v13(振幅)与核心同样好,或 v12 残差 < 0.3 —— 那说明读到的是波动的代理,不是反转;
      v2 复现不出 C01 的 0.86(差 0.3 以上)—— 那说明 C02 的奖励/可交易集与 C01 不可比,本轮全部读数都要重新校准;
      v10(含隔夜的日收益)明显优于 v1(纯盘中)—— 那机制不是盘中价格压力,H2 才是对的那一边;
      v8(按日内波动归一)远好于 v1 —— 那起作用的是「波动归一」这一步,机制陈述要改写;
      核心在 train 上选出 sign = +1(做多盘中段累计最高者)—— 那是盘中动量而不是回吐,本假设即否。
      【总领】v8 / v11 的分母在冻结股上趋近 0(long 奖励不剔冻结股),它们若远好于 v1,先当作比值发散的假象,不当作机制证据。
  novelty: >-
      与已知族无关:表达式里没有 Amt / Volume,ρ已知 在 C01 实测为 +0.24(ts_mean(day_mean(Ret), 30))。
      与 C01 的 48 个 head 也不同族:那 48 个是流动性水平(day_std/day_first 作用在 Amt/Volume)、
      一价日与粗刻度(day_distinct_ratio / day_std(Close))、价格上的 ts_pearson(源码语义是跨股票同步性)、
      价格路径的 day_kurt 四族,没有一个以「收益到账的时段」为原料。C01 R3 里这条两次独立出现
      (ts_mean(day_mean(Ret), 30) +0.86;ts_scale(sqrt(day_mean(Low)), 30) +0.84),但 C01 门槛是 1.0,
      所以它不在 heads 里 —— 按 C02 的 0.7 门槛它本身就是发现。v2/v3 是对这个 C01 近失者的潜在大幅改进
      (只换窗口;C01 从未测过 40/50),v1/v4 是新写法(把隔夜剥掉,只留盘中段)。
  variants:
  - {id: v1,  role: core,     expr: "cross_mean(log(div(day_last(Close), day_first(Open))), 30)", predicts: "过线,sign −1,score 0.7–1.1,换手 ≈ 0.03。纯盘中段,是本假设最干净的写法,也是其它假设做残差的基准。"}
  - {id: v2,  role: core,     expr: "ts_mean(day_mean(Ret), 30)", predicts: "过线,sign −1,score ≈ 0.86(train 0.89 / valid 0.86,换手 0.030)。C01 原式,环境一致性的校准锚。"}
  - {id: v3,  role: core,     expr: "ts_mean(day_mean(Ret), 50)", predicts: "过线且 ≥ v2。C01 的窗口 5/10/20/30 单调上升到 0.86,50 从未测过,换手应降到 ≈ 0.02。"}
  - {id: v4,  role: core,     expr: "cross_ema(log(div(day_last(Close), day_first(Open))), 30)", predicts: "过线,与 v1 同向同量级;半衰期 30 的 EMA 换手低于 v1,净分应 ≥ v1。"}
  - {id: v5,  role: ablation, expr: "cross_mean(log(div(day_last(Close), day_first(Open))), 15)", predicts: "弱于 v1(0.3–0.7):窗口短、换手高,成本吃掉大半。"}
  - {id: v6,  role: ablation, expr: "cross_mean(log(div(day_last(Close), day_first(Open))), 60)", predicts: "与 v1 相当或略好,换手最低;若明显更差,说明回吐在一个月内完成。"}
  - {id: v7,  role: ablation, expr: "cross_mean(log(div(day_last(Close), day_first(Close))), 30)", predicts: "与 v1 几乎相同(只去掉开盘集合竞价到第一分钟收盘这一小段)。若明显弱于 v1,说明做功的是开盘那一分钟,机制要并入 H2。"}
  - {id: v8,  role: ablation, expr: "div(cross_mean(day_sum(Ret), 30), cross_mean(day_std(Ret), 30))", predicts: "与 v1 相当。C01 已知日内低波本身是负的(cross_mean(day_std(Ret), 60) train −0.51),所以分母只起归一作用;若远好于 v1,机制陈述要改。"}
  - {id: v9,  role: ablation, expr: "log(div(day_last(Close), ts_delay(day_last(Close), 20)))", predicts: "0.3–0.8,弱于 v1。经典月度反转(含隔夜、不平滑),用来定位 v1 的增量来自哪里。"}
  - {id: v10, role: ablation, expr: "ts_mean(log(div(day_last(Close), ts_delay(day_last(Close), 1))), 30)", predicts: "弱于 v1。整日收益 D ≈ O + I;若 v10 ≈ v1,说明隔夜腿 O 在这个尺度上没方向,H2 的前提不成立。"}
  - {id: v11, role: ablation, expr: "div(cross_mean(log(div(day_last(Close), day_first(Open))), 30), cross_mean(log(div(day_max(High), day_min(Low))), 30))", predicts: "≥ v1。按振幅归一的反转强度(每单位日内振幅的回吐),是 A 股常见的改进写法。"}
  - {id: v12, role: ablation, expr: "cs_regres(cross_mean(log(div(day_last(Close), day_first(Open))), 30), cross_mean(log(div(day_max(High), day_min(Low))), 30))", predicts: "≥ 0.4,最好 ≥ 0.7。剔除振幅后仍然成立,才能说反转不是波动的代理。"}
  - {id: v13, role: control,  expr: "cross_mean(log(div(day_max(High), day_min(Low))), 30)", predicts: "不过线,score < 0.3,而且很可能是负的(C01 的 cross_mean(day_std(Ret), 60) 选 −1、train −0.51:2018–2021 纯多头低波跑输),负分不算否、只说明它不是核心的代理。无方向的日内振幅:同样的原料、去掉方向。若它和核心一样好,H1 其实是波动因子。"}

