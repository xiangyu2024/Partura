  - {id: v7,  role: ablation, expr: "cs_regres(cross_mean(day_last(in_sum_rolling(Ret, 30)), 30), cross_mean(log(div(day_last(Close), day_first(Open))), 30))", predicts: "≥ 0.4。剔除全天盘中收益后,收盘段还剩多少 —— 决定这是不是一个独立机制。"}
  - {id: v8,  role: control,  expr: "cross_mean(day_last(in_sum_rolling(in_delay(Ret, 60), 30)), 30)", predicts: "|score| < 核心的一半。错误时段的对照:收盘前 60 分钟之前的那 30 分钟(下午中段),结构完全相同、只换时段。"}

