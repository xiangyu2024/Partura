- id: H3_money_weighted_price_reverts
  hypothesis: 成交额最集中的那些分钟里出现的价格变动是临时的下单压力,会回吐;时间上均匀发生的漂移才是信息。
  thesis:
    mechanism: >-
      成批下单(机构拆单、ETF 申赎、散户情绪集中入场)会在少数分钟里同时放量并把价格推开,
      这部分位移是流动性对价,之后回吐;真正的信息则是在全天均匀渗透的。
      所以「按成交额加权的分钟收益」减去「等权的分钟收益」度量的正是这种集中下单造成的价格压力,
      它是无量纲的(Amt 只作权重、被分母约掉),与成交额的水平无关。
    counterparty: >-
      急于在短时间内完成大额买入的资金(拆单不够细的机构、情绪驱动的集中买盘):
      它们为即时性付钱;收钱的是把头寸慢慢接下来、并在之后几周等价格回落的提供方。
    prediction: >-
      方向 sign = −1。三个核心 v1–v3 的 score 落在 0.5–1.0,换手 0.02–0.04。
      C01 的日频读数:sub(day_signed_ratio(Ret, Amt), day_signed_ratio(Ret, Close)) 选了 −1、毛 +7.7%/年、
      换手 0.112、净分 −0.83、ρ已知 +0.06;所以慢形式的全部赌注就是「把 0.112 的换手压到 0.03 而毛收益不掉太多」。
      安慰剂 v4 / v11(权重换成 3 个交易日前同一分钟的成交额 cross_delay(Amt, 3):日内 U 形与集中度不变,
      只拆掉今天的钱与今天的分钟收益的对齐)|score| < 0.3,核心至少是各自安慰剂的 3 倍。
      残差 v9 / v10 ≥ 0.4:钱推动的压力必须在剔除盘中段收益之后仍然存在,否则它只是 H1 的加权版。
      【总领先验】对立读法:成交额最重的分钟也可能是知情资金(大单)在做,那样方向是 +1(延续);
      C01 里同一包装 sub(1, ts_spearman(day_signed_ratio(Ret, ·), 50)) 下,High 权重(≈等权)+0.79 反而高于 Amt 权重 +0.70,
      即那里的信息来自等权的涨跌分钟占比,不是「钱」。所以本假设的先验偏低。
    fails_if: >-
      v11 / v4(3 日前同一分钟的成交额做权重)的 score ≥ 对应核心 v1 / v3 的 70% —— 那说明不是「今天的钱」在起作用,
      加权与等权之差只是「开盘集合竞价那一分钟 + 尾盘那几分钟」的时段收益,归 H2 / H5,不归本假设;
      核心在 train 上选出 sign = +1 —— 那是大额资金的方向被延续(知情交易),价格压力回吐的机制陈述反了;
      v7 / v8(不减等权的裸形式)好于 v1 / v3 —— 那起作用的是水平而不是「加权减等权」,要重新查它与已知族的 ρ;
      残差 v9 / v10 < 0.3 —— 那这一族只是 H1 的另一种写法;
      核心全部被相关度拒绝(|ρ已知| ≥ 0.5)—— 虽然 Amt 只作权重,但若加权差仍与成交额离散度同构,这条路关死。
      还要留意零成交/停牌日:day_signed_ratio 与 day_wmean 在 Σ|w| ≤ 0 时为 NaN,
      day_topw_mean 则退化为 day_mean(所以 v3 在那些日子恰好为 0);若核心的覆盖率 < 0.9 被门槛废掉,
      要换成 v3 这种不产生 NaN 的写法再读。
  novelty: >-
      Amt 只出现在权重位置,量纲被分母约掉,结构上与已知族(成交额的水平与离散度)不同;
      C01 实测 ρ已知 = +0.06。C01 的 G3 族(day_signed_ratio / day_wmean / day_topw_mean 作用在 Ret 上)
      共 20 条读数,只有 2 条过 0.7,而那 2 条都靠 ts_spearman(本环境禁用),没有一条命中 48 个 head
      —— 也就是说这一族在 C01 里从未以干净的慢形式被读过。
  variants:
  - {id: v1,  role: core,     expr: "cross_mean(sub(day_signed_ratio(Ret, Amt), day_signed_ratio(Ret, Close)), 30)", predicts: "过线,sign −1,score 0.5–1.0,换手 ≈ 0.03。C01 日频毛 +7.7%,慢化后应把成本从 8.5%/年降到 2.3%/年。"}
  - {id: v2,  role: core,     expr: "cross_mean(sub(day_wmean(Ret, Amt), day_mean(Ret)), 30)", predicts: "过线,sign −1,与 v1 同量级。直接写成「加权均值减等权均值」,量纲是收益而不是占比。"}
  - {id: v3,  role: core,     expr: "cross_mean(sub(day_topw_mean(Ret, Amt), day_mean(Ret)), 30)", predicts: "过线,sign −1,可能最强:只看成交额最大的 10% 分钟,机制最集中,且零成交日退化为 0 而非 NaN。"}
  - {id: v4,  role: control,  expr: "cross_mean(sub(day_topw_mean(Ret, cross_delay(Amt, 3)), day_mean(Ret)), 30)", predicts: "|score| < 0.3,且 < v3 的 1/3。v3 的匹配安慰剂(总领替换原「窗口 60」消融):成交额最大的 10% 分钟换成 3 日前同一时点最重的那些分钟 —— 结构上仍主要是开盘与尾盘的分钟,只是不再与今天的钱对齐。若它 ≥ v3 的 70%,v3 读到的是时段。"}
  - {id: v5,  role: ablation, expr: "cross_mean(div(sub(day_wmean(Ret, Amt), day_mean(Ret)), day_std(Ret)), 30)", predicts: "≥ v2。按日内波动归一,使高波动股票不占满极值分位。"}
  - {id: v6,  role: ablation, expr: "cross_mean(div(sub(day_topw_mean(Ret, Amt), day_mean(Ret)), day_std(Ret)), 30)", predicts: "≥ v3,同上。若归一后反而变差,说明做功的是波动水平。"}
  - {id: v7,  role: ablation, expr: "cross_mean(day_signed_ratio(Ret, Amt), 30)", predicts: "弱于 v1。不减等权基准,混进了「这只股票本身涨跌多」的成分,应被 H1 吸收。"}
  - {id: v8,  role: ablation, expr: "cross_mean(day_topw_mean(Ret, Amt), 30)", predicts: "弱于 v3,同上。v7/v8 与 v1/v3 的差就是「减去等权」这一步的价值。"}
  - {id: v9,  role: ablation, expr: "cs_regres(cross_mean(sub(day_signed_ratio(Ret, Amt), day_signed_ratio(Ret, Close)), 30), cross_mean(log(div(day_last(Close), day_first(Open))), 30))", predicts: "≥ 0.4。剔除盘中段收益后仍成立,才说明读到的是「钱」而不是「涨跌」。"}
  - {id: v10, role: ablation, expr: "cs_regres(cross_mean(sub(day_topw_mean(Ret, Amt), day_mean(Ret)), 30), cross_mean(log(div(day_last(Close), day_first(Open))), 30))", predicts: "≥ 0.4。v3 的残差;v9 与 v10 中较强的那个决定 W2 选哪种写法做种子。"}
  - {id: v11, role: control,  expr: "cross_mean(sub(day_signed_ratio(Ret, cross_delay(Amt, 3)), day_signed_ratio(Ret, Close)), 30)", predicts: "不过线,|score| < 0.3,且 < v1 的 1/3。v1 的匹配安慰剂(总领替换原 High 权重 —— 那个两项构造上≈相消,永远「通过」,区分不了任何东西):权重是 3 日前同一分钟的成交额,保留这只票的日内 U 形与集中度,只拆掉与今天的对齐。若它 ≥ v1 的 70%,v1 读到的是开盘/尾盘时段,不是钱。"}

