- id: H7_daily_max_lottery
  hypothesis: 日频收益分布的右尾(过去 20 日的单日最大涨幅、收益偏度)预示跑输 —— 这是把 C01 已否的「日内彩票形状」搬到日频再试一次。
  thesis:
    mechanism: >-
      偏好彩票型回报的投资者愿意为「最近出现过大涨」的股票多付钱(Bali–Cakici–Whitelaw 的 MAX 效应),
      这种溢价之后回落。C01 测过的是日内分钟收益的彩票形状(偏度、最大涨幅比波动),全部为负;
      日频右尾在 C01 里一次都没测过(G7 族匹配数为 0),机制上也不同:日频右尾是公众可见的涨停/大涨,
      日内分钟形状是公众看不见的微观结构。
    counterparty: >-
      追涨停、买「最近暴涨过」的散户;对手是卖出这类溢价的理性资金。
    prediction: >-
      这是一条证伪测试,预期结果是否:核心 v1–v3 与对照 v5(纯波动)相差不到 0.2,而且全部低于 0.3。
      依据是 C01 的两组负结果 —— 日内彩票形状的慢形式 cross_mean(day_skew(Ret), 60) = −0.05、
      div(day_max(Ret), day_std(Ret)) 的慢形式 +0.16、上下半幅比 −0.33;日内低波 train −0.51。
      若预期成立,W2 就可以把「分布形状」这一整类从候选里划掉,把 GP 预算全部留给 H1–H3。
      方向若为 −1 且核心 ≥ 0.7 而对照 < 0.3,则相反:日频彩票是真的,C01 的日内负结果不能外推。
    fails_if: >-
      核心 ≥ 0.7 且明显高于对照 v5 —— 那证伪测试本身被证伪,日频右尾是独立机制(但要先看 |ρ已知|:
      MAX 与波动、波动与成交额离散度都相关,很可能直接被拒);
      核心与对照 v5 都 ≥ 0.7 —— 那读到的是波动因子,不是彩票偏好,归入已知的低波族;
      残差 v4 < 0.3 —— 那它连独立于 H1 都做不到(大涨日本身就是盘中段收益的极值)。
  novelty: >-
      C01 的 G7 族(ts_max / ts_skew 作用在日收益上)匹配数为 0 —— 从未测过。与已知族的关系是本条最大的不确定性:
      右尾与波动相关,波动可能与成交额离散度相关,所以 |ρ已知| 可能 ≥ 0.5。预算只给 5 个变体,
      而且全部是浅结构,正因为它的预期收益低、信息价值在于「关掉一整类」。
  variants:
  - {id: v1,  role: core,     expr: "ts_max(log(div(day_last(Close), ts_delay(day_last(Close), 1))), 20)", predicts: "预期不过线(< 0.3),sign −1。过去 20 日的单日最大涨幅(MAX 效应的标准写法)。"}
  - {id: v2,  role: core,     expr: "div(ts_max(log(div(day_last(Close), ts_delay(day_last(Close), 1))), 20), ts_std(log(div(day_last(Close), ts_delay(day_last(Close), 1))), 20))", predicts: "预期不过线。最大涨幅比自身波动:去掉波动水平,只留右尾形状。若它过线而 v1 不过线,做功的是形状。"}
  - {id: v3,  role: core,     expr: "ts_skew(log(div(day_last(Close), ts_delay(day_last(Close), 1))), 40)", predicts: "预期不过线(C01 的日内偏度慢形式 −0.05)。40 日日收益偏度。"}
  - {id: v4,  role: ablation, expr: "cs_regres(ts_max(log(div(day_last(Close), ts_delay(day_last(Close), 1))), 20), cross_mean(log(div(day_last(Close), day_first(Open))), 30))", predicts: "预期 < 0.3。大涨日就是盘中段收益的极值,剔除 H1 后应什么都不剩。"}
