- id: H6_attention_shock
  hypothesis: 成交额相对自身长期水平突然放大的股票,被散户注意到并买高,随后跑输。
  thesis:
    mechanism: >-
      散户的买入决策受注意力约束(Barber–Odean):放量、上榜、上涨会把一只股票带进视野,
      引发集中的买单,把价格推到基本面之上,之后几周回落。关键是「相对自身」而不是「绝对量大」:
      绝对成交额是规模的代理(已知族),而 5 日对 60 日的比值把水平约掉,只留下冲击。
    counterparty: >-
      被注意力吸引、在放量后追入的散户;对手是在冲击中卖出、等注意力消退后买回的资金。
    prediction: >-
      方向 sign = −1。核心 v1 / v2 的 score 0.0–0.7,是本轮最可能不过线的一条,所以只给 6 个变体。
      带方向的 v2(只在放量同时上涨时为正)应 ≥ 不带方向的 v1,因为注意力冲击的机制要求价格被买高。
      对照 v6(波动冲击而非成交额冲击)|score| < 0.3:若波动冲击一样好,读到的不是注意力。
      残差 v5 ≥ 0.4 才算独立。换手是这一条的主要风险:5 日腿变化快,换手可能到 0.05–0.10,
      按 0.756 × 换手 的成本口径,毛收益要有 4–8%/年才可能剩下正分。
      【总领不同意「最可能被 ρ 拒」】C01 head cross_scale(mul(signedpower(day_std(Volume)), day_first(Volume)), 241)
      (cross_scale(x, d) = x / 窗口内 x 之和,即「今天的量相对自身一年」)选 −1、+2.05、ρ已知 只有 +0.32 ——
      相对自身的量冲击并不落回已知族。所以更可能的结局是 v1 过线(A 股异常换手率的先验也支持 −1)、
      ρ已知 0.1–0.35,但与这个 C01 head 高度相关、不算新。v3 现在就是专门读这一点的残差。
    fails_if: >-
      |ρ已知| ≥ 0.5 被直接拒 —— 那这一族即便只用比值也落回成交额的水平与离散度;
      换手 > 0.06 把净分压到负 —— 那注意力冲击在这个成本口径下不可做;
      v3(对 C01 那个 241 日 head 做截面残差)< 0.4 —— 那即便 v1 过线也只是 C01 head 的近亲,终局不算新,W2 不为它设计种群;
      核心在 train 上选出 sign = +1(做多放量者)—— 那是成交量动量 / 信息到达,而不是注意力溢价回落,本假设即否;
      v6(波动冲击)与核心同样好 —— 读到的是量价同步的波动冲击,不是注意力。
  novelty: >-
      只用比值,不用水平:Amt 的量纲在 div 里被约掉,这是与已知族(成交额的水平与离散度)唯一的区别,
      也是全部风险所在。原料与 H1–H5 不同(H1–H3/H5 是收益到账的时段与权重,H4 是价量同步性,这里是成交额自身的时间变化)。
      之所以仍值得 6 个变体:C01 从未测过短窗冲击的比值形式(G6 族 58 条读数里全是 cross_scale / cross_zscore
      作用在 Amt / Volume 水平上的装饰形式,44 条过 0.7 但基本都被 ρ 拒),比值形式是一块干净的空白。
      【总领】不完全是空白:cross_scale(·, 241) 本身就是「今天 / 一年之和」的比值,上面那个 C01 head 正是比值形式且没被拒,
      所以本假设的新颖性要靠 v3 的残差读出来,不能靠写法不同来主张。
