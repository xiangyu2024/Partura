- id: H4_intraday_price_volume_corr
  hypothesis: 日内价格与成交量正相关的股票(放量时在涨)随后跑输;负相关的(放量时在跌、有人承接)跑赢。
  thesis:
    mechanism: >-
      日内价量正相关说明价格上行是靠买方不断提高报价换来的 —— 买压与价格同向,是典型的追涨资金在推;
      这种推动没有信息支撑,之后回落。负相关则说明下跌中有大额承接,是知情或价值资金在接货,之后修复。
      这个读数是无量纲的(相关系数),与成交额的绝对水平无关,所以与已知族在结构上完全不同。
    counterparty: >-
      追涨的散户与动量型资金(在放量上涨时买入,支付了全部价格冲击);
      对手是在放量下跌时承接的知情资金与做市方。
    prediction: >-
      方向 sign = −1。C01 完全没有干净读数,这一条基本靠先验(A 股高频价量相关因子),
      所以预期区间宽:核心 v1 / v2 的 score 在 −0.3 到 1.0 之间,中位猜测 0.4–0.7,换手 0.02–0.04。
      对照 v10(|Ret| 与 Volume 的相关 = 量跟着波动走的机械关系,无方向)|score| < 0.3。
      残差 v8 / v9 ≥ 0.4:价量相关与当天涨跌机械相关(上涨日自然呈正相关),必须剔除盘中段收益才算独立读数。
      v7(量对 3 分钟前的收益)若与 v1 同量级,说明是「量跟价走」;若明显更弱,说明是同步的推动。
    fails_if: >-
      残差 v8 / v9 < 0.3 —— 那 day_corr(Close, Volume) 只是盘中收益符号的粗化版,是 H1 换脸;
      v10(无方向的量-波动相关)与核心同样好 —— 那读到的是量与波动的机械关系,不是方向性的追涨;
      核心的 |ρ已知| ≥ 0.5 —— 相关系数虽无量纲,但在 A 股可能与规模/流动性同构,这条路就关死;
      核心 train 为负而 valid 很漂亮 —— 按 C01 的教训(train 2018–2021 是绑定约束)一律按失败处理,不许用 valid 挑变体;
      核心在 train 上选出 sign = +1(做多放量时在涨的票)—— 追涨推动的机制陈述反了,本假设即否。
      【总领】首分钟(开盘集合竞价)的 Volume 是全天的离群点,day_corr(Close, Volume) 有很大一块就是「开盘价相对全天均价的位置」,
      也就是当天盘中涨跌的反号 —— 所以 v8 / v9 的残差不是锦上添花,是本假设成立与否的唯一判据。
  novelty: >-
      C01 里 day_corr 出现 34 次、10 条过 0.7,但全部 |ρ已知| ≥ 0.5 —— 因为它们都被流动性水平装饰过
      (day_wmean(Amt, Volume)、day_first(Amt)、day_wstd(Amt, ·) 之类),没有一条是干净的价量相关读数,
      也没有一条命中 48 个 head。本假设把装饰全部去掉,只留相关系数本身的慢平均,原料与 H1–H3 都不同
      (H1–H3 用的是「收益到账的时段/权重」,这里用的是价与量的同步性)。
  variants:
  - {id: v1,  role: core,     expr: "cross_mean(day_corr(Close, Volume), 30)", predicts: "sign −1,score −0.3 到 1.0(中位猜 0.4–0.7)。日内价格路径与成交量的相关,30 日平均。"}
  - {id: v2,  role: core,     expr: "cross_mean(day_corr(Ret, Volume), 30)", predicts: "同向,可能弱于 v1:用分钟收益而不是价格水平,去掉了日内趋势成分,更接近纯粹的「放量时的方向」。"}
  - {id: v3,  role: ablation, expr: "cross_mean(day_corr(Close, Volume), 15)", predicts: "弱于 v1,换手更高。窗口曲线的短端。"}
  - {id: v4,  role: ablation, expr: "cross_mean(day_corr(Close, Volume), 60)", predicts: "与 v1 相当,换手最低。若 60 最好,说明这是慢变的股票属性而非短期状态。"}
  - {id: v5,  role: ablation, expr: "cross_stddev(day_corr(Close, Volume), 30)", predicts: "不过线或弱(0–0.4)。价量相关的不稳定性,是「状态变化」而非方向,单独读用来判断 v6 的叠加有没有道理。"}
  - {id: v6,  role: ablation, expr: "add(cs_rank(cross_mean(day_corr(Close, Volume), 30)), cs_rank(cross_stddev(day_corr(Close, Volume), 30)))", predicts: "若 v5 有独立信息则 ≥ v1,否则 ≈ v1。两个秩的等权合成,检验「水平 + 稳定性」是否互补。"}
  - {id: v7,  role: ablation, expr: "cross_mean(day_corr(in_delay(Ret, 3), Volume), 30)", predicts: "弱于 v2。量对 3 分钟前收益的相关:若仍与 v2 同量级,说明量跟着价走(追涨);若明显更弱,说明推动是同步的。"}
  - {id: v8,  role: ablation, expr: "cs_regres(cross_mean(day_corr(Close, Volume), 30), cross_mean(log(div(day_last(Close), day_first(Open))), 30))", predicts: "≥ 0.4。必读:价量相关与当天涨跌机械相关,残差是唯一能证明它独立于 H1 的办法。"}
  - {id: v9,  role: ablation, expr: "cs_regres(cross_mean(day_corr(Ret, Volume), 30), cross_mean(log(div(day_last(Close), day_first(Open))), 30))", predicts: "≥ 0.4。v2 的残差;v8 与 v9 中较强的那个才是可以当种子的写法。"}
  - {id: v10, role: control,  expr: "cross_mean(day_corr(abs_(Ret), Volume), 30)", predicts: "不过线,|score| < 0.3。量与波动幅度的相关:同样的原料、去掉方向,是众所皆知的机械正相关。若它过线,核心读到的不是追涨。"}

