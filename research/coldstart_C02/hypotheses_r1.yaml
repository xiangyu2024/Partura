- id: H2_overnight_vs_intraday
  hypothesis: 收益在隔夜段到账的股票会延续,在盘中段到账的会反转;两段之差比任何一段单独都强。
  thesis:
    mechanism: >-
      隔夜段没有连续交易,价格只能由集合竞价一次性消化信息和机构的隔夜委托,所以隔夜那一跳偏向「信息」,
      在之后几周延续;盘中段由连续的流动性需求推动,偏向「噪音」,随后回吐(即 H1)。
      两类收益的来源不同,所以「谁的收益在隔夜到账」本身就是一个带方向的股票特征,
      而「隔夜减盘中」把两个相反的机制叠起来,信噪比应高于任一段。
    counterparty: >-
      隔夜腿上亏的是不愿承担隔夜风险、在收盘前卖出的日内交易者 —— 他们把隔夜的信息溢价让给了持仓过夜的人;
      盘中腿上亏的仍是追价的短线资金(同 H1)。
    prediction: >-
      ts_mean(O, ·) 方向 sign = +1(做多隔夜收益长期更高的一端),O − I 的 sign = +1。
      核心 v1–v3 的 score 落在 0.4–0.9,换手 0.02–0.04;v2(两段之差)应 ≥ v1 与 H1/v1 中较好的那个。
      关键读数是 v9:对 cross_mean(I, 30) 做截面残差后仍 ≥ 0.4,才说明隔夜腿是独立的第二个机制。
      v6 与 v7 对照还顺带回答 C01 悬着的问题:若 v6(day_first(Ret))贴近 v1(隔夜),则 Ret 的第一分钟含隔夜跳;
      若 v6 贴近 v7(第一分钟的开到收),则不含。C01 的日频原式 sub(mul(2, day_first(Ret)), day_sum(Ret))
      选了 +1、毛 +9.9%/年、换手 0.145、净分 −0.40,慢形式 v3 应把换手压到 0.03 量级而保留方向。
    fails_if: >-
      v9 残差 < 0.3 —— 那 H2 只是 H1 换了一张脸,本轮不该为它设计种群;
      v1 的 train 上选出的方向是 −1 而不是 +1 —— 那隔夜段也在反转,tug-of-war 的先验在 A 股纯多头口径下不成立;
      【总领先验】这一条更可能发生:A 股市场层面隔夜为负、盘中为正(C01 beliefs B8,Qiao & Dam 2020,T+1),
      横截面上长期靠隔夜到账的票更像开盘追价的散户关注度,公开研究多报为反转而非延续。若 v1 选 −1,
      v2(O − I)是两条同向反转腿相减,会互相抵消;那时「两段合并」的正确读数是 H1/v10(D ≈ O + I),不是 v2。
      C01 的日频读数也只说明 v2 选 +1 时做功的是 −I:sub(div(day_first(Open), ts_delay(day_last(Close), 1)),
      div(day_last(Close), day_first(Open))) 选 +1、train −1.11(换手 0.12)—— 所以 v9 是唯一能定案的那一条;
      v11(无方向的跳空大小)与核心同样好 —— 那读到的是隔夜风险溢价/波动,不是方向性延续;
      v3 的慢形式 score < 0.3 而 v1 过线 —— 那 C01 那条日频原式的毛收益来自首分钟的微观结构,平滑后不剩东西。
      还要留意标签:进场是次日开盘 15 分钟 VWAP,t→t+1 那一跳隔夜不在标签里,所以这里押的是
      「隔夜型股票的持续性」而不是「赚下一个隔夜」;若核心全部落在 0.2–0.4,最可能就是这层损耗。
  novelty: >-
      原料是「收益到账的时段」,表达式里没有 Amt / Volume,C01 实测同族 ρ已知 为 −0.007(日频原式),
      预期 |ρ已知| < 0.2。C01 的 G2 族(day_first(Ret) / ts_delay(day_last(Close)))一共只有 8 条读数、
      没有一条过线、也没有一条命中 48 个 head —— 这一族在 C01 里完全没被慢形式检验过,是真正的空白。
      与 H1 的区别由 v9 的截面残差来证明,而不是靠叙述。
  variants:
  - {id: v1,  role: core,     expr: "ts_mean(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 30)", predicts: "过线,sign +1,score 0.4–0.9。隔夜腿本身,30 日平均。"}
  - {id: v2,  role: core,     expr: "sub(ts_mean(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 30), ts_mean(log(div(day_last(Close), day_first(Open))), 30))", predicts: "过线且 ≥ v1,sign +1。两段之差:两个相反机制叠加,应是本假设最强的写法。"}
  - {id: v3,  role: core,     expr: "cross_mean(sub(mul(2, day_first(Ret)), day_sum(Ret)), 30)", predicts: "过线,sign +1,score 0.4–0.8,换手降到 ≈ 0.03(C01 日频版 0.145)。C01 原式的慢形式,是对 C01 被成本杀死那条的直接改进。"}
  - {id: v4,  role: ablation, expr: "ts_mean(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 20)", predicts: "与 v1 相当或略弱,换手更高。用来画窗口曲线。"}
  - {id: v5,  role: ablation, expr: "ts_mean(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 50)", predicts: "与 v1 相当或更好,换手最低。若 50 明显最好,说明隔夜倾向是慢变的股票属性而不是短期信息。"}
  - {id: v6,  role: ablation, expr: "cross_mean(day_first(Ret), 30)", predicts: "若贴近 v1,则 Ret 的第一分钟含隔夜跳(C01 悬着的问题就此回答);若贴近 v7,则不含。"}
  - {id: v7,  role: ablation, expr: "cross_mean(log(div(day_first(Close), day_first(Open))), 30)", predicts: "弱于 v1。只有第一分钟的开到收,不含隔夜,是 v6 的另一半参照。"}
  - {id: v8,  role: ablation, expr: "sub(ts_mean(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 50), ts_mean(log(div(day_last(Close), day_first(Open))), 50))", predicts: "与 v2 相当或更好(两腿的最优窗口都偏长),换手最低。"}
  - {id: v9,  role: ablation, expr: "cs_regres(ts_mean(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 30), cross_mean(log(div(day_last(Close), day_first(Open))), 30))", predicts: "≥ 0.4 则 H2 独立于 H1;< 0.3 则 H2 就是 H1。本假设最重要的一条读数。"}
  - {id: v10, role: ablation, expr: "cs_regres(cross_mean(sub(mul(2, day_first(Ret)), day_sum(Ret)), 30), cross_mean(log(div(day_last(Close), day_first(Open))), 30))", predicts: "≥ 0.4。C01 那条日频原式慢化后,剔除盘中腿还剩多少 —— 决定 W2 要不要把它当种子。"}
  - {id: v11, role: control,  expr: "ts_mean(abs_(log(div(day_first(Open), ts_delay(day_last(Close), 1)))), 30)", predicts: "不过线,|score| < 0.3。无方向的跳空大小:同样的原料、去掉方向,用来排除「隔夜波动溢价」这一解释。"}

