  - type: E
    core: 'day_centroid(Amt)'
    hypothesis: >-
      核心 day_centroid(Amt) 是当天成交额沿 241 根分钟棒的重心(0 = 全在开盘,1 = 全在收盘),回答的是钱在一天的什么时候成交。
      库里 6 个 head 全部是这座矿的「水平」读法:cross_mean(day_centroid(Amt), 5 或 20) 再按 LogFloatShares 或名义价分桶、
      尾盘 30 分钟占比、day_argmax(Amt) 的 20 日均值与 40 日标准差;它们读的都是一只票的重心位置在横截面上的高低(早盘成交的票做多)。
      按 GP 库禁令(日度秩 |ρ| ≥ 0.7 或同骨架),重心水平的任何写法(换平滑窗口、换分桶轴、换聚合方式)几乎都会被拒,继续深挖水平没有产出空间,
      所以本任务把外围放在「耦合」上:cross_corr(day_centroid(Amt), X, d) 是这只票自己最近 d 天里,成交的时点与另一个日度序列 X 同升同降的程度。
      皮尔逊相关对重心做仿射变换不变,数学上丢掉了重心的水平,所以与水平型 head 在构造上不重叠,它回答的是另一个问题:这只票的早盘或尾盘成交是被什么驱动的。
      具体分六路,全部原样含核心。
      (1) 隔夜信息:X 取隔夜缺口 day_first(Open) / 前一日收盘 - 1(窗口 30、120 日),取前一日的重心对今天缺口(ts_delay 1 日,没有前视),
      以及缺口耦合减去日内收益耦合(隔夜与日内两类信息的拆分);早盘成交在好消息高开日偏早、坏消息低开日偏晚,说明早盘成交是事件型的信息成交,
      对应 Admati 与 Pfleiderer 1988 的信息交易集中在开盘,以及 Berkman 等 2012 的隔夜价差与开盘买入。
      (2) 价格漂移:X 取当日收盘到收盘收益、开盘到收盘收益、前一日收益、5 日与 20 日价格比,问钱的时点是否随价格走势同向。
      (3) 活跃度:X 取 log(day_sum(Amt))(120 日)和 day_std(Ret)(60 日),成交时点由当日活跃度还是由波动驱动。
      (4) 与价格运动时点同步:X 取 day_centroid(Ret)(|Ret| 的重心),钱是否追着价格波动走。
      (5) 与全市场同步:X 取 cs_mean(day_centroid(Amt))(当日全市场平均重心,只用当天截面),同步高说明是机械的指数 / 被动型成交,不同步说明是个股自己的特异成交。
      (6) 日内分布形状:X 取 day_kurt(Amt)、day_gini(Amt)(成交集中度)和 day_signed_ratio(Ret, Amt)(上涨分钟的成交占比减下跌分钟的成交占比),问成交的时点和成交的集中度、方向是否绑在一起。
      为什么和库里已有的不同:相关系数在 [-1, 1],对重心水平不敏感,与水平型 head 的横截面秩只会通过「重心更不稳的票相关更噪」这类弱途径相关;
      与 5 个控制的关系也只能通过窗口内的共同波动进入,不是流动性 / 波动 / 市值 / 20 日反转 / 已知族的换写。
      为什么样本外还会在:耦合系数反映的是这只票的交易者构成(事件型的散户与消息交易者,对机械的指数与算法成交)和信息到达方式,这些变化缓慢;
      窗口 30 到 120 日把单日噪声平均掉;最坏的情形是它只是水平型信号的弱化版,那样会被库禁令拒绝或在新尺子下得不到分,不会伪装成新 head。
      我另读了其他种子第 2 轮快照里的样本内读数(规则 5 允许),其中核心为 day_centroid(Amt) 的耦合型写法在别处的样本内是强的,这不当作本种子的证据,只用来选了「耦合」这条路;
      本任务的具体伙伴序列和窗口与那些种子的写法并不相同。
      数学上:cross_corr 在窗口内重心或伙伴序列为常数时给缺失;缺口与收益的分母是前一日或当日开盘的后复权价,恒为正;log(day_sum(Amt)) 在停牌日是缺失;
      day_centroid(Ret) 在 |Ret| 全为 0 的日(一字板)是缺失;cs_mean 只用当天截面;ts_delay 只取过去;没有除以近零的量,没有前视。
