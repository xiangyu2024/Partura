R:
  - head: 'cs_last_high40(cross_mean(cross_mean(day_centroid(Amt), 5), 5), LogFloatShares)'
    why: >-
      score +0.64 在六个 head 里最低,train +0.64 是约束项(valid +1.47)。烂的部件是最外层的 cs_last_high40:它是字典序的「分段」写法,
      只把 LogFloatShares 最高的 40% 作为一个整体处理,段内的重心不再比较;而同一个内层 cross_mean(cross_mean(day_centroid(Amt), 5), 5)
      在共性表里含它的 4 个候选均值 +1.00(对 -1.19,p 0.0006),按 LogFloatShares 做 cs_bucket_zscore 的邻居
      cs_bucket_zscore(cross_mean(day_centroid(Amt), 5), LogFloatShares) 拆解里自身 score 是 +1.17。所以换成 cs_bucket_zscore(同桶 z 分数),
      或者换桶的轴,或者干脆去掉分桶。
    variants:
      - 'cs_bucket_zscore(cross_mean(cross_mean(day_centroid(Amt), 5), 5), LogFloatShares)'
      - 'cs_bucket_zscore(cross_mean(cross_mean(day_centroid(Amt), 5), 5), sub(sub(LogFloatCap, LogFloatShares), LogFloatShares))'
      - 'cross_mean(cross_mean(day_centroid(Amt), 5), 5)'
  - head: 'cs_bucket_rank(cross_mean(day_argmax(Amt), 20), day_max(Close))'
    why: >-
      score +0.69,train +0.69 约束(valid +1.42)。烂的部件猜在分桶轴 day_max(Close):它是当日最高价,是一个随行情涨跌每天都在变的价格水平,
      桶本身每天换成员,不是稳定的结构;同族里表现最好的分桶轴是 LogFloatShares(r2 N 位的 top 5 里 cs_bucket_zscore 配 LogFloatShares 的 3 个均 ≥ +1.5)。
      并且 cs_bucket_rank 只留桶内百分位,丢掉桶内的离散程度,cs_bucket_zscore 保留。所以换轴、换 rank 为 zscore,并给一个无分桶的对照。
    variants:
      - 'cs_bucket_rank(cross_mean(day_argmax(Amt), 20), LogFloatShares)'
      - 'cs_bucket_zscore(cross_mean(day_argmax(Amt), 20), LogFloatShares)'
      - 'cross_mean(day_argmax(Amt), 20)'
  - head: 'ts_stddev(signedpower(day_argmax(Amt)), 40)'
    why: >-
      score +0.82 但窗口很窄:拆解里 ts_stddev 窗口改 20 日得 +0.05、改 80 日得 -0.48(valid 是约束项),只有 30 到 40 日附近站得住;去掉 signedpower 是 -0.47。
      烂的部件是「单一窗口的标准差」:它对出峰位置的稳定性只看一段,所以尝试把窗口两端平均(30 与 50 的标准差相加)、
      再套一层 20 日平滑,以及像其他 head 一样按 LogFloatShares 做同桶 z 分数。
    variants:
      - 'cs_bucket_zscore(ts_stddev(signedpower(day_argmax(Amt)), 40), LogFloatShares)'
      - 'add(ts_stddev(signedpower(day_argmax(Amt)), 30), ts_stddev(signedpower(day_argmax(Amt)), 50))'
      - 'cross_mean(ts_stddev(signedpower(day_argmax(Amt)), 40), 20)'
  - head: 'cs_bucket_zscore(cross_mean(div(cs_bucket_zscore(cross_mean(day_centroid(Amt), 5), LogFloatShares), day_sum(Amt)), 20), LogFloatShares)'
    why: >-
      score +1.09。拆解显示烂的部件是 div(..., day_sum(Amt)):把分桶后的 z 分数除以当日成交额,量纲不统一(z 分数可正可负、成交额是水平),
      去掉它的两个变体在拆解里已经比原 head 高(+1.49、+1.30,增益 +0.40 与 +0.21),直接收两个。
    variants:
      - 'cs_bucket_zscore(cross_mean(cs_bucket_zscore(cross_mean(day_centroid(Amt), 5), LogFloatShares), 20), LogFloatShares)'
      - 'cs_bucket_zscore(div(cs_bucket_zscore(cross_mean(day_centroid(Amt), 5), LogFloatShares), day_sum(Amt)), LogFloatShares)'
  - head: 'cs_bucket_zscore(cross_mean(div(day_sum(in_slice(Amt, 211, 240)), day_sum(Amt)), 20), LogFloatShares)'
    why: >-
      score +1.56(train +1.78,valid +1.56)。拆解里分桶轴 LogFloatShares 的必要性很强(去掉分桶的 knockout 是 -0.17),
