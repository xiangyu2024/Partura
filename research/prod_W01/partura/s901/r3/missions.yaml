  - type: N
    hypothesis: >-
      想法:不看「什么时候成交」,看「成交与价格怎样耦合」。库里 6 个 head 全部是成交时点的水平,这个位刻意避开时点量(种子里没有 day_centroid、day_argmax、in_slice 的时点占比),
      改读逐股的量价耦合系数:一只票自己最近 60 到 241 天里,两个日度序列(成交额、收益、波动、隔夜缺口、日内收益)同升同降的程度。
      皮尔逊相关无量纲、有界、丢掉两个序列各自的水平,是一个换手低、与流动性 / 波动 / 市值 / 反转的水平暴露很弱的慢特质。
      五个子机制,每个种子是其中一个选择。
      (1) 信息型还是流动性型成交:Llorente、Michaely、Saar 与 Wang 2002 指出,成交额伴随的价格变动在信息型交易的票上延续、在对冲 / 流动性型交易的票上反转;
      cross_corr(log(day_sum(Amt)), 日收益, d) 与昨日成交额对今日收益的 cross_corr(ts_delay(log(day_sum(Amt)), 1), 日收益, d)(只用过去,没有前视)是这个区分的逐股指纹,
      Gervais、Kaniel 与 Mingelgrin 2001 的高成交量溢价是同一条线上的横截面版本。窗口取 60、120、241 日。
      (2) 杠杆与反杠杆:cross_corr(日收益, day_std(Ret), 60) 为负是常规的杠杆效应(跌时波动升),为正是投机 / 彩票型(涨时波动升);
      cross_corr(log(day_sum(Amt)), day_std(Ret), 60) 是成交额与波动的耦合,本批共性表里 day_var(High) 的 7 个候选均值 -0.36 对 -1.20(p 0.047),说明波动的结构里有信息。
      (3) 缺口被抹平还是延续:cross_corr(隔夜缺口, 日内收益, 60) 为负说明高开会被日内回吐(追开盘的散户被反向交易),为正说明信息延续;
      Lou、Polk 与 Skouras 2019 把隔夜与日内收益拆给两类投资者,Berkman 等 2012 讲开盘买入的成本;
      cross_corr(昨日分钟资金方向 day_signed_ratio(Ret, Amt), 今日缺口, 60) 与 cross_corr(day_signed_ratio(Ret, Amt), 日内收益, 60) 问资金方向是否被价格确认。
      (4) 与市场同步的程度:cross_corr(日收益, cs_mean(日收益), 120) 是逐股的市场相关,低的票是特质型。
      (5) 分钟层面:cross_mean(day_corr(Ret, Amt), 60) 是每天分钟收益与分钟成交额相关的 60 日平均,cross_corr(day_sum(Amt), day_wmean(Ret, Amt), 60) 是成交额与资金加权收益的日度耦合。
      此外 cross_autocorr(日收益, 60, 1) 是 Lo 与 MacKinlay 式的逐股日收益一阶自相关(同样是耦合系数,只是伙伴序列是自己滞后一日)。
      其中日收益 = day_last(Close) / ts_delay(day_last(Close), 1) - 1,缺口 = day_first(Open) / ts_delay(day_last(Close), 1) - 1,日内收益 = day_last(Close) / day_first(Open) - 1。
      与库的差别:库里没有一个 head 含相关系数,也没有一个读收益,全部是成交额的时点量。与 5 个控制:耦合系数不含任何序列的水平,和流动性 / 市值几乎无关;
      与 20 日反转控制(20 日收益的秩)只通过收益序列的共同波动进入;与波动控制中等相关是可以预期的,新尺子会去掉线性、平方和三次暴露。
      为什么样本外还会在:耦合是交易者构成(信息交易者对流动性交易者)与信息到达方式的结果,这类结构变化缓慢;窗口 60 到 241 日。
      但我明确的预期是这一位多半没有 head:60 日窗口里相关系数的抽样噪声约 0.13,横截面离散里很大一部分是噪声,换手会被 15 bp 扣成负夏普;
      它的价值是回答「与时点无关的慢耦合能不能在这把尺子上不亏」,并且把第三个位从时点矿上挪开。
      数学上:相关系数在窗口内任一序列为常数时给缺失;分母是前一日收盘 / 当日开盘的后复权价,恒为正;log(day_sum(Amt)) 在停牌日缺失;ts_delay 只取过去;
      cs_mean 只用当天截面;day_corr 在分钟数不足时缺失;没有除以近零的量,没有前视。
    inspired_by: >-
      本批共性表:day_wmean(Ret, Amt)(13 个,-0.65 对 -1.19,p 0.025)与 sub(day_wmean(Ret, Amt), day_mean(Ret))(8 个,+0.59,p 0.036)说明成交与方向的关系里有信息;
      day_var(High)(7 个,-0.36 对 -1.20,p 0.047)说明波动的结构有信息;第 1 轮 N 位把方向做成 120 日平均,train 约 0、valid 约 +1,水平型的方向读法不稳,
      第 3 轮改用耦合系数(去水平)重读同一个量价关系
