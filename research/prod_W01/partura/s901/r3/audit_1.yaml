slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。库里 6 个 head 全部是 day_centroid(Amt) 的水平读法(cross_mean 后接分桶 z 分数,或尾盘占比、argmax 的统计),库里没有任何 head 含相关系数。本位 16 个种子都是 cross_corr(day_centroid(Amt), X, d),即同一只票的时点重心与另一序列的滚动相关,与 head 不是同一个统计量。相关度表中,16 个种子与 6 个 head 的原始 |ρ| 最大为第 15 号 0.54(与 head 1,且与 liq、known 同为 0.54),其余在 0.04 到 0.35 之间;与 5 个控制的原始 |ρ| 除第 15 号外都在 0.3 以下。第 15 号(gini 耦合)是本位最接近水平或流动性换皮的种子,但 0.54 不是同一个度量,不划,PI 应知道。核心 day_centroid(Amt) 与 5 个控制的 |ρ| 为 0.18、0.16、0.13、0.19、0.07,远低于 0.8。合理度 4。逐个核对算子:day_centroid 对 |Amt| 取分钟时间重心,值域 [0,1],零成交日为缺失;cross_corr 走 rolling_pair_reduce,窗口左侧补 NaN,只用过去与当日的值;day_first 与 ts_delay(day_last(Close),1) 构成的缺口分母是昨日后复权收盘,恒为正;cs_mean 只用当天截面;day_kurt、day_gini、day_signed_ratio 都有界。没有前视,没有禁用算子。两处事实问题记给 PI(不挡):(一)假设文字写「cross_corr 在窗口内为常数时给缺失」,实现其实给 0。我用合成序列核对过:全缺失窗口与常数窗口都返回 0,恰好两个有效对返回 ±1,三个有效对是高方差的小样本值。本位的常数窗口几乎不出现,影响小。(二)新上市或长停复牌后的前 d 天有效对很少,相关系数会取极端值。按 A 股上市节奏估计,这类票约占截面的百分之一到两个点(未实测),不是主导结果,按 §4 不挡;PI 应核实引擎是否有最小有效对数的掩码。另外默认 lead-in 为 60 行(partura/runner.py 的 warmup 默认值),第 2 号(120 日窗口)在训练段前几十天是部分窗口,也不是主导。不划的理由:第 1 号与第 2 号是同一对序列只换窗口(30 与 120),控制 |ρ| 向量的最大差为 0.10(rev),超过 0.05 的重复线;第 6 与 16 号、第 7 与 8 号的控制向量接近(最大差 0.02 到 0.03),但序列分别是日内收益与买卖压、滞后一日收益与五日价格比,不是同一个度量。如果它有 alpha,最可能来自:成交时点与隔夜缺口的耦合(第 1 到 4 号)反映的事件型信息交易集中在开盘;与市场重心的耦合(第 13 号)反映的被动或指数型成交;以及日内成交形状(第 14 到 16 号)反映的交易者构成。另:核心 day_centroid(Amt) 的 E 位在本种子是第一次(第 1 轮核心为 day_last(Close),第 2 轮为 day_argmax(Amt))。但 903 第 2 轮、903 第 3 轮、905 第 2 轮与 908 第 1 轮都以 day_centroid(Amt) 作 E 核心(906 第 2 轮用 cross_mean(day_centroid(Amt), 20)),且同样的 cross_corr 外围已在 903、905、906、908 的第 3 轮计划里出现。若「每个核心整个实验至多 2 个 E 位」中的实验指整个 PROD W01,本位已超上限;若按种子计,则没有超。这不在 §3 的通过条件里,我不据此判不通过,请总领确认口径。另:本位外围是否与已见过的含该核心的候选相同,需对照 loc.md 的共性表,按任务说明我没有读那部分,未核对。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。库里没有任何 head 含相关系数或收益序列。相关度表中 13 个种子与 6 个 head 的原始 |ρ| 最大为第 4 号的 0.24(与 head 1),其余在 0.21 以下。与 5 个控制的原始 |ρ| 最大是第 9 号的 liq 0.40、第 11 号的 vol 0.34 与 known 0.34、第 4 号的 known 0.35 与 liq 0.33、第 10 号的 known 0.34 与 liq 0.31,没有任何一个达到 0.8。第 2、5、6、7、8、12、13 号与控制的 |ρ| 都在 0.2 以下,是低相关的慢耦合。第 4、9、10、11 号与流动性或已知族有中等相关,按机制看它们是各自的度量(流动性与波动的共同变化、买卖压与价格的确认、相对市场的同步、分钟量价相关),不是控制的换写。合理度 4。逐个核对:log(day_sum(Amt)) 在 |x| 不超过 1e-9 时给缺失(零成交日);day_signed_ratio 与 day_wmean 分母为零时为缺失;cs_mean 只用当天截面;cross_autocorr(x, d, 1) 实现为 cross_corr(x[1:], x[:-1], d),只用昨日值,没有前视;day_corr 在分钟数不足 2 时为缺失,但分钟收益整日不变(一字板)时返回 0 而不是缺失,第 11 号受影响,这是缺失被填成 0 的定义偏差,在 60 日均值里只占少数天,不是主导;第 12 号的 day_sum(Amt) 是成交额水平的 Pearson,个股相关由少数量级极大的日子主导,是噪声来源,不是数学问题;第 3 号的 241 日窗口在训练段前若干日为部分窗口,与 a 位注记相同;常数窗口给 0、两个有效对给 ±1 的行为也同 a 位。第 1 号与第 3 号是同一对序列只换窗口(60 与 241),控制 |ρ| 的最大差为 0.10(rev 与 size),超过 0.05 的重复线,不划。第 6、8、9 号的隔夜、日内与买卖压是三个不同的量,不划。如果它有 alpha,最可能来自成交量与价格运动的耦合状态:信息交易与流动性交易比例的慢变化(第 1 到 4 号,对应 Llorente 等人的符号),隔夜与日内收益的分配差异(第 6、8、9 号,对应 Lou 等人与 Berkman 等人讲的开盘买入成本),以及市场 beta 型的慢特质(第 10 号)。'
R:
  - head: 'cs_last_high40(cross_mean(cross_mean(day_centroid(Amt), 5), 5), LogFloatShares)'
    soundness: 4
    reasons: '合理度 4。逐个核对:cross_mean 与 day_centroid 没有问题。cs_last_high40 即 _lexi(y, x, 0.6, 1.0, -1.0):LogFloatShares 前 40% 的票整体平移 -1,band 内部仍按 y 的全截面百分位排序,所以「段内的重心不再比较」这句理由不对,段内比较是保留的。真正的效果是股本最大的 40% 永远排在所有其他票之下,是一个按股本的阶跃。5 个控制的秩多项式(线性、平方、三次)去不掉这种阶跃,所以「分段写法有问题」的诊断本身成立,变体 1 与 2 改用同桶 z 分数是合理的修法。变体 3 去掉分桶,相关度表中它与 head 1 的原始 |ρ| 为 0.76,与变体 1、2 相同量级,都与库里的 head 1 高度重合,按收录规则只能作替换候选,不能作新 head,这是事实不是数学问题。变体 2 的桶键 sub(sub(LogFloatCap, LogFloatShares), LogFloatShares) 是 log 名义价减 log 股本,送转除权日股本与名义价同时跳(流通市值连续),会有换桶的小噪声,不挡。三个变体的已知族 |ρ| 为 0.36、0.37、0.39,满足 < 0.5。如果它有 alpha,最可能来自同一股本桶内,早盘成交重心的相对高低,即持有人构成,而不是股本本身。'
  - head: 'cs_bucket_rank(cross_mean(day_argmax(Amt), 20), day_max(Close))'
    soundness: 4
    reasons: '合理度 4。day_argmax 对全缺失行返回缺失,对全零行返回 0(取第一个),停牌存储为缺失时没有问题;cross_mean 跳过缺失;cs_bucket_rank 的桶内百分位加 1e-4 的全截面百分位,无除以零。诊断成立:day_max(Close) 是当日最高价水平,随行情每天变,桶成员每天换。变体 1、2 改按 LogFloatShares 分桶,相关度表中与原 head 的原始 |ρ| 为 0.96(即替换),已知族 |ρ| 为 0.48,满足 < 0.5。变体 3(无分桶对照)门槛失败:distinct 0.466(20 日均值的整数峰值并列严重),已知族 |ρ| 为 0.50,不满足 < 0.5,不会被收录或替换。整数并列靠列序打破,按 §4 不是挡的理由,这里只记注释。如果它有 alpha,最可能来自成交峰值时点的持有人结构:开盘棒对应隔夜与盘前挂单,收盘段对应被动与收盘定价需求;按股本分桶后剩下的是同规模内的时点差异。'
  - head: 'ts_stddev(signedpower(day_argmax(Amt)), 40)'
    soundness: 4
    reasons: '合理度 4。signedpower 默认指数为 2,对 0 到 240 的整数峰值是单调的平方,不改变排序的结构;ts_stddev 按日、跳过缺失;变体 2 的 add 是两个标准差之和,与平均排序等价,无问题;变体 3 是 20 日均值的 40 日标准差,无除法。30 到 50 日两端平均作为稳健化是合理的。诊断「单一窗口只看一段」成立。三个变体与原 head 的原始 |ρ| 为 0.88 到 0.96(替换),已知族 |ρ| 为 0.24 到 0.32,满足 < 0.5。一个机制混杂点记给 PI:一字板票的成交常集中在开盘一棒,argmax 接近 0,会把锁板票推向早出峰一端;这是机制混杂而不是数学问题(同 901 第 2 轮 a 位注记)。如果它有 alpha,最可能来自成交峰值时点的稳定度,即知情或机构成交的时点在一段时间内是否一致。'
  - head: 'cs_bucket_zscore(cross_mean(div(cs_bucket_zscore(cross_mean(day_centroid(Amt), 5), LogFloatShares), day_sum(Amt)), 20), LogFloatShares)'
    soundness: 3
    reasons: '合理度 3。没有除以精确零的问题(day_sum 在停牌时为缺失,有成交的日子为正)。但原 head 的分母 day_sum(Amt) 是日成交额水平,跨票跨度很大,薄成交票的 1/Amt 尾巴很厚;在股本分桶内,这些票的 z 分数会拉大桶内标准差,压缩同桶其他票的 z,于是跨桶排序取决于各桶薄成交票的多少。这是尺度问题,不是除以精确零,按 §3 不挡,但它与「div 是烂部件」的诊断一致。变体 1 去掉 div 而保留 20 日平滑,是对的修法;相关度表中它与 head 1 的原始 |ρ| 为 0.96,几乎是 head 1 的重写(known 0.49,仍 < 0.5),所以它会成为对 head 1 的替换而非新 head,PI 需知道。变体 2 去掉的是 20 日 cross_mean 而保留了 div(·, day_sum(Amt)),与该组理由(去掉 div)不符:它没有修掉被诊断的部件,反而去掉了平滑,残留的 1/Amt 尾巴不再被平均。这是规格写错,不是数学问题,但应删去或改写。变体 2 与库内最像的 head(head 1)的原始 |ρ| 为 0.56,已知族 |ρ| 为 0.29。如果它有 alpha,最可能来自同股本内的早盘重心相对高低,去掉 div 后剩下的部分。'
  - head: 'cs_bucket_zscore(cross_mean(div(day_sum(in_slice(Amt, 211, 240)), day_sum(Amt)), 20), LogFloatShares)'
    soundness: 4
    reasons: '合理度 4。in_slice(Amt, 211, 240) 取第 211 到第 240 共 30 根分钟棒,即 241 根网格的尾盘 30 分钟(与 head 2 同一定义);分子是分母的子集,比值在 [0,1],没有爆点;日成交额为零时为缺失。变体 1 的分桶键 sub(sub(LogFloatCap, LogFloatShares), LogFloatShares) 与 head 1 相同,送转除权日会有一次性换桶;变体 2 的 25 日平滑是诊断中要求的试验,没有问题。相关度表中变体 1 与变体 2 与原 head(head 2)的原始 |ρ| 为 0.98 与 0.95,即替换;已知族 |ρ| 为 0.43 与 0.41,满足 < 0.5。机制清楚:同股本内尾盘成交占比的高低,反映尾盘定价与收盘集合竞价相关的持有人结构。如果它有 alpha,最可能来自尾盘集中成交与收盘前的价格冲击(对应收盘定价需求)。'
summary: 'a 位通过(创新 4、合理 4,16 个种子全部保留,核心与控制的 |ρ| 最大 0.19);b 位通过(创新 4、合理 4,13 个种子全部保留);R 五组合理度为 4、4、4、3、4,其中第 4 组的第 2 个变体规格与理由不符(保留了 div 而去掉了平滑),建议删去;记给 PI 的注记包括 cross_corr 常数窗口给 0 而非缺失、上市与复牌后的小样本极端值需核实掩码,以及 day_centroid(Amt) 的 E 位在其他种子已多次使用,「整个实验」的口径需总领确认。'
