    reasons: '快照 0 个 head。15 个种子与 5 个控制的 |ρ| 最高为 seed 13 的 liq 0.761（未到 0.8 线），其次 seed 2 的 known 0.586 与 liq 0.582，seed 15 的 rev 0.551，其余多在 0.4 以下。创新度 4：这些是 20 到 120 日平均的日内统计，信息来源（分钟级买卖压、时段成交分布、分钟收益形状）与日级控制（水平、波动、反转、市值、已知族）不同，表里大部分是中低相关。没给 5 的原因：核心机制多数是已知的日内异象改成慢特质（隔夜与日内的 tug-of-war、开盘买入、高成交量收益、日内形态），新在慢平均与组合，不是新来源。合理度 4：大多数种子的算子与机制对得上。seed 1、15 的 day_signed_ratio 是成交额加权的涨跌分钟占比（界 [−1,1]）；seed 5、6 是放量分钟的收益（wmean 减 mean、成交量前 10% 分钟的平均）；seed 7–10 是隔夜、日内、末 30 分钟、首 30 分钟的时段拆解；seed 12 的 day_skew 是分钟收益 z 分数的三次方均值，理论上界约 ±15（n=241 时 (n−2)/√(n−1)），没有爆点；seed 14 是日对数收益上、下半标准差之差除以之和，界 [−1,1]；算子内的除法分母为零时都给 NaN。没有前视。以下四处是算子层面的偏差，不是 §4 的数学问题，记给 PI：(一) seed 3 的 cross_corr(day_sum(Volume), day_last(Close), 40) 算的是价格水平与成交量水平的 40 日共趋势，不是理由里说的量价同步；算子也没有最小样本数，窗口里只剩两三个有效日（比如停牌后复牌）时相关会退化为 ±1。(二) seed 11 的 day_autocorr 分母是 sqrt(var·var + 1e-8)，地板是绝对值。分钟收益 σ 约 5e-4 的高价低波股票分母被放大约 2 倍，自相关被压向 0，排序部分按价格与波动走；vol 控制的 |ρ| 只有 0.029，影响不大，保留。(三) seed 4 中 day_corr 在 Ret 整日不变（涨跌停锁定、停牌）时返回 0 而不是 NaN，这些日子被 cs_rank 填成中性秩，锁板多的股票会被拉向中间。(四) seed 13 的 day_gini 把零成交分钟当作有限值计入，所以它主要测的是不成交分钟的多少，这很可能是它与 liq 的 0.761 的来源；它是表里最接近换写法的一个，未到 0.8，保留并标注。如果它有 alpha，最可能来自：分钟级买压与时段成交分布的慢特质（隔夜与日内的 tug-of-war、高成交量分钟的收益、开盘与尾盘的交易结构），而不是价格水平或控制的线性部分。N 位过，满足「3 轮里至少 1 个 N 位通过」的条件。'
