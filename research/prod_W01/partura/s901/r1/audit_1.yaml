    reasons: '快照 0 个 head，查重只能对 5 个控制。核心 day_last(Close) 与各控制的 |ρ|：liq 0.46、vol 0.01、rev 0.09、known 0.42、size 0.42，均 <0.8，E 位核心条件过。核心的来源（共性表）与外围是否与已见候选重复，按指令我没有读 loc.md 共性表和 loc.json，未核对，请 PI 自查。创新度 3：核心不是任何控制的换写法，但水平类特征本身是老的（价格水平、规模、52 周高点），与 size、liq 有 0.42–0.46 的中度重叠；新的部分只在拆解上：log(day_last(Close)) − (LogFloatCap − LogFloatShares) 是累计复权因子的对数，seed 3 与 size 的 |ρ| 0.448、与 liq 0.146，不是控制。合理度 4：逐个核对了 cs_bucket_rank、cross_max(241)、cross_rank、ts_delay、cross_zscore、cs_flip_by_state 的源码定义，分母都是正的后复权价或正的 cross_max，没有除以近零的量；没有前视（只用当日收盘与过去数据，只要 label 是次日收益，cs_flip_by_state 用的当日市场状态就不算前视，请 PI 确认 label 时点）。三处要记下：(一) seed 12、13、14 的 cs_flip_by_state 在表里 |ρ| 多在 0.1 以下（最大 0.122），这不是独立性证据：同一核心的原始 ρ 与 liq 为 0.459，而状态翻转让每天的符号交替，若 |ρ| 是按日平均的日度秩相关，符号会相互抵消。这三个种子的新颖度只能按机制评。(二) seed 8 cross_rank(day_last(Close),120) 与 seed 11 的 ts_delay 版门槛标为废品（distinct 0.095、coverage 0.89）。我不把它们当数学问题：seed 8 是 120 日时序秩，截面并列多，§4 明确并列靠列序打破不是问题；seed 11 的 11% 缺失来自 120 日滞后与上市初期，不主导结果。两者保留，PI 应知道门槛标记。(三) seed 3 的 LogFloatCap 与 LogFloatShares 必须是同日同价口径，否则分解里会混入日内噪声；这点我无法从可读源码确认。划掉 seed 6：cs_rank(adj) − cs_rank(nominal) 是 seed 3 的复权因子在秩空间的重写，控制 |ρ| 向量几乎一样（seed 3/6：liq 0.146/0.144、vol 0.005/0.053、rev 0.015/0.011、known 0.158/0.160、size 0.448/0.430），重复。划掉 seed 15：cross_zscore(P,60) 是 seed 9 的 60 日对数偏离除以价格波动，控制 |ρ| 向量几乎相同（seed 9/15：liq 0.177/0.168、vol 0.299/0.291、rev 0.776/0.755、known 0.207/0.192、size 0.126/0.083），重复。seed 9 与 15 都是对 20 日反转 |ρ| 0.76–0.78 的换写法，但没到 0.8 的自动线，留 seed 9。如果它有 alpha，最可能来自：后复权价里累计分红送转的强度（A 股高送转、派现的公司特征），以及 52 周高点与长期价格位置的锚定（George-Hwang 2004），其次是长期反转。'
