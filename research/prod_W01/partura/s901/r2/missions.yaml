slots:
  - type: E
    core: 'day_argmax(Amt)'
    hypothesis: >-
      核心 day_argmax(Amt) 是当天成交额最大的那一分钟在 241 根分钟棒里的位置(0 到 240,取不到时为缺失),回答的问题是钱最集中在哪一刻出现。
      它是本种子第 1、2 批共性表里唯一均值为正的子树:296 个已评分候选里含它的 4 个均值 +0.32,不含的 -1.42(差 +1.74,p 0.0004);
      紧随其后的是 day_argmax(Volume)(9 个,-0.64 对 -1.42,p 0.004),说明读数的是成交的时点,而不是某个价格形状。
      机制:一天里成交额的峰值落在开盘那一棒(隔夜信息与散户盘前挂单、Barber 与 Odean 2008 的注意力买入集中在开盘)、尾盘那一棒(指数与被动资金、基金的收盘定价需求)
      还是盘中某处,取决于这只票的持有人结构,这是几个月不变的慢指纹(Admati 与 Pfleiderer 1988 的日内成交量模式;Heston、Korajczyk、Sadka 2010 的日内半小时周期)。
      问题是单日的 argmax 噪声极大,而且是离散整数,直接用等于没有试过它。本任务因此把外围放在五种机制各不相同的处理上,全部原样含核心,
      外围不用 M 在含该核心的候选里已经见过的写法(我读不到那 4 个候选的外围,若有重合,机械采样器会按 c05_periphery_seen 拒绝)。
      (1)日聚合方式:cross_mean(20)、半衰期 15 日的 cross_ema、cross_med(中位数,对偶发的峰值错位稳健)、cross_tail_mean_q75(最晚的四分之一天的均值)。
      (2)频率化:is_lt(day_argmax(Amt), 15) 与 is_gt(day_argmax(Amt), 225) 取 30 日均值,即最近 30 天里峰值落在前 15 分钟或后 15 分钟的天数占比,有界在 0 到 1,不再是一个被偶发盘中峰值拉动的平均位置。
      (3)相对自己:cross_zscore(.,60) 与短窗(10 日)减长窗(60 日),问的是这只票最近的出峰时点是否偏离它自己的常态;cross_stddev(.,30) 问出峰时点是否稳定(事件驱动的票是不稳定的)。
      (4)与同日别的时点错配:峰值分钟减最高价所在分钟 day_argmax(High)、减成交量峰值所在分钟 day_argmax(Volume)、减成交额重心 day_centroid(Amt) 乘 240,问钱最集中的一刻是否也是价格走到极值的一刻(高潮买入或高潮卖出),这是核心单独看不到的。
      (5)分桶内比较:cs_bucket_rank(.,LogFloatCap) 与按已知族 cross_mean(day_std(Amt),30) 的十分位分桶,在同规模、同成交波动的票之间比出峰时点,去掉出峰时点本身与规模、流动性的重叠。
      与库的差别:库里没有 head(0 个),所以对照物只有 5 个控制;出峰时点是日内时点量,不是价格、波动、流动性、20 日反转、市值或已知族的函数(第 1 轮相关表里 day_centroid(Amt) 的 20 到 60 日平均与流动性、已知族的 |ρ| 约 0.58,到不了 0.8,而本任务的频率版与分桶版更低)。
      为什么样本外还会在:持有人结构不随一两个季度换手,峰值时点是这种结构的结果;最坏的情形是它只是风格暴露,那样新尺子去掉的线性、平方、三次项之外还剩多少是实验要回答的问题。
      已知风险:停牌日若 Amt 取 0 而不是缺失,argmax 会返回 0(开盘棒),把停牌多的票推向早出峰一端,我无法在本机核对;频率版与均值版都会受到它的影响。
      数学上:所有种子只含有界或整数量(位置 0 到 240、0 到 1 的频率、z 分数),没有除以近零的量;cross_zscore 的分母是 60 日标准差加 EPS,出峰位置常年不变的票会被推到爆点(种子 7 已知),
      其余种子没有这个风险;没有前视,全部只用当天及以前的数据。
