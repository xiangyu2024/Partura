  - type: N
    hypothesis: >-
      想法:日内成交的时点指纹(质心、开盘一棒的占比、尾盘 30 分钟的占比、成交额随时间的倾斜)与持有人结构的几个结构变量纠缠在一起,
      而 5 个控制里没有一个是结构变量:LogFloatShares(流通股本,等于规模减对数名义价)、LogTotalCap 减 LogFloatCap(非流通市值占比,即限售与大股东持股)、ListAge(上市年限)、LogFloatCap 减 LogFloatShares(对数名义价)。
      所以裸的时点统计里有一部分只是在读这些结构变量,新尺子的多项式去不掉它们;把每个时点统计放到同结构十分位里做 z 分数(cs_bucket_zscore),只留下同类里比同类更早或更晚成交的部分,
      这才是相同结构下持有人构成不同的信号。
      受这一批两处现象启发。其一,第 1 批共性表里 sub(LogFloatCap, LogFloatShares) 含它的 10 个均值 -0.84 对 -1.41(p 0.04),本种子第 1 轮 E 位里最好的 5 个全部含 LogFloatShares,说明名义价与股本轴上有信息而且没有被控制吃掉。
      其二,本批日内量里最突出的两类是 day_argmax(Amt)(+1.74)与 day_wmean(Ret, Amt)(+0.74),前者是时点,后者是钱流向的方向。
      我另读了其他种子第 2 轮快照(规则 5 允许),其中时点类统计在分桶或回归掉股本之后排名更高;这是别处的样本内读数,不当作本种子的证据。
      每个种子都是同一件事的一个选择:先选时点统计,再选结构轴,统一写成 cs_bucket_zscore(统计, 结构轴)。
      时点统计:20 日平均的成交额质心 day_centroid(Amt);开盘棒占全天成交额 day_first(Amt) 除以 day_sum(Amt)(第 0 根在 A 股钟面上带着开盘集合竞价,未在本机核对);
      尾盘 30 分钟占比 in_slice(Amt, 211, 240);成交额对时间的 Pearson 倾斜 day_corr(in_index(Amt), Amt),比质心对单分钟尖峰稳健;
      成交额质心减成交量质心(价格加权的时点差);质心的 30 日标准差(时点不稳定,事件驱动);day_gini(Amt)(成交是否集中在少数分钟);
      重分钟的方向 day_wmean(Ret, Amt) 减 day_mean(Ret)(第 1 轮是 120 日平均,train 约 0 而 valid 约 +1,这里改成 40 日并放进同类内);尾盘 30 分钟的净买入占比 day_signed_ratio。
      与库的差别:库里没有 head;5 个控制都不是结构变量,统计本身也不是价格、波动、流动性、20 日反转、市值或已知族的函数。
      第 1 轮的 N 位只做了裸的 120 日平均,没有一个放进同结构里比较,结构轴没有被碰过。
      为什么样本外还会在:持有人构成(散户占比、被动资金、限售股东)与上市年限变化缓慢;同类内比较去掉的是结构轴上随风格轮换的那一段,留下的是同类里持有人更偏向散户或机构的相对读数。
      最坏的情形是结构变量的暴露本来就是信号,去掉它之后什么也不剩,那样这个位的结果会清楚地告诉第 3 轮不要再做结构分桶。
      数学上:cs_bucket_zscore 在桶内除以桶内总体标准差加 EPS,桶内几乎常数时会放大噪声,ListAge 在新股占多数的日子里分桶有并列,并列靠列序打破,携带板块信息,属规则 4 列出的非问题;
      day_first(Amt) 与 day_sum(Amt) 在算子内分母为 0 给缺失,没有除以近零的量;in_slice 的下标是 0 到 240 之内;cross_stddev 对停牌日只用有限的天。
      没有前视。
