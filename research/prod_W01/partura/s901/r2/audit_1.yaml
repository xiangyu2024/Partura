    reasons: '创新度 4。库里 0 个 head（corr_1.json 的 heads=0），查重只能对 5 个控制。核心 day_argmax(Amt) 与各控制的原始 |ρ| 最大 0.178（known），不是任何控制的换写，它是成交额峰值所在的分钟位置，控制里没有时点量。多数外围种子与 liq、known 的原始 |ρ| 在 0.4 到 0.6 之间（1 号 0.50、2 号 0.59、3 号 0.54、5 号 0.56、10 号 0.48、15 号 0.49），这是峰值时点与成交水平的共同成分；但新尺子去掉的是这些控制的线性、平方、三次暴露，剩下的残差是时点本身，所以不判 1。最干净的是 7 号 cross_zscore(·,60) 与 8 号 短减长窗，控制 |ρ| 都在 0.18 以下；11 号 argmax(Amt) 减 argmax(Volume) 对所有控制都在 0.01 以下。合理度 4。逐个核对算子：day_argmax 对全行缺失返回 NaN，其余为 0 到 240 的整数；cross_mean、cross_ema、cross_med 跳过缺失日；cross_tail_mean_q75 是最近 40 日里值不低于 75% 分位那些天的均值，对峰值时点而言就是「最晚的四分之一天」，描述没错；is_lt(·,15) 与 is_gt(·,225) 分别对应前 15 根与后 15 根（226 到 240）；cross_zscore 对常数窗口置 0，没有爆点；cs_bucket_rank 只用桶内百分位；本轮种子没有 ts_rank、cross_rank、in_rank_rolling，所以 nanrank_last 的问题不适用；回测是 t 收盘决定、吃 t 到 t+1 的收益，没有前视。划掉 16 号：与 14 号是同一统计量（20 日均值，换成半衰期 15 的 EMA）、同一分桶（已知族），控制 |ρ| 差不超过 0.05（14 号 liq 0.011、vol 0.177、rev 0.105、known 0.008、size 0.124；16 号 0.024、0.156、0.060、0.010、0.144），属于重复。1 号与 2 号也是同一序列的两种平滑，但控制 |ρ| 差到 0.09，不到重复线，放行，记作冗余注记。注记（不划）：(一) is_lt 与 is_gt 对缺失返回假再转整数，所以缺失日记 0 而不是缺失，5、6、15 号的 30 日频率在停牌与次新票上被压低，成为「有交易天数」的代理。按 §4 只在结果主要由缺失填充决定时才算定义坏掉；我读不到分钟数据，无法核对缺失占比，故不划，PI 应核实。(二) 9 号 cross_stddev 对只有 1 个有效日的窗口返回 0，影响限于上市首日与长停复牌首日，不是主要结果。(三) 停牌日在存储层约定为 null（calculate.py 的说明），argmax 应为缺失而不是 0；分钟立方体本身我没有核对。若一字板或锁板日的成交只落在开盘一棒，argmax 接近 0，会把锁板票推向早出峰一端，这是机制混杂而不是数学问题。(四) 整数峰值的截面大量并列，1、3、4、5、6、10、11 号与核心的门槛标为废品（distinct 低于 0.5），按 §4 列序打破不是挡的理由，放行。如果它有 alpha，最可能来自成交额峰值时点的持有人结构差异（开盘棒对应隔夜与散户盘前挂单，尾盘对应被动与收盘定价需求），而不是流动性或已知族的水平。'
