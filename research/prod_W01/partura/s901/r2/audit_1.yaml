    reasons: '创新度 4。库里 0 个 head，查重只对 5 个控制。这一位的 16 个种子都是分钟层面的时点或方向统计（20 日成交额质心、开盘棒占比、尾盘 30 分钟占比、成交额对时间的相关、成交集中度、加权收益、尾盘净买入占比），再统一用 cs_bucket_zscore 放进结构轴的同类里比较，控制里没有这类量。与 5 个控制的原始 |ρ| 最大为 0.643（4 号 day_corr 对 liq）；14 号 cs_bucket_zscore(cross_mean(day_gini(Amt),20), LogFloatShares) 对 liq 为 0.771，是最接近 0.8 自动划线的一个，它的集中度有相当部分就是流动性本身，是这一位最像换皮的种子，但没有达到自动划线，且 gini 不是流动性的换写，故放行。分桶变体：质心族 1、5、8、10 号（分别按 LogFloatShares、非流通市值比、ListAge、名义价分桶）的控制 |ρ| 两两差不超过 0.04；尾盘占比族 7 号与 9 号（按非流通市值比与 ListAge）几乎相同。分桶轴不同，同类内的排序不同，不算换写，所以不划；但 PI 应知道，这一位实际是少数几个时点信号的几个切面，第 3 轮若再分桶，不要加同统计量的同类变体。合理度 4。逐个核对算子：day_centroid 是 [0,1] 的成交额重心，零成交为缺失；day_first 取的是第一个非缺失棒，不一定是 09:30 棒，若开盘棒缺失会取后面的棒，集合竞价是否在第 0 根，我在本机没有核对；in_slice(·,211,240) 取 211 到 240 共 30 根，即最后 30 分钟，正确；div(first, sum) 与 div(尾盘和, 全天和) 的分子不超过分母、成交额非负，所以值在 0 到 1，分母为零得缺失，没有除以近零的量；day_corr 有界，样本少于 2 时为缺失，它对单笔尖峰的敏感度与质心相近，PI 说它比质心稳健的理由偏强，但不构成挡的理由；day_signed_ratio 在 [-1,1]，day_wmean 在全零权重时为缺失；cross_stddev 对只有 1 个有效日的窗口返回 0（同 a 位注记），影响限于上市或复牌首日；cs_bucket_zscore 的分母是桶内标准差加 1e-9，桶内几乎常数时 z 可能被放大，但这些统计量在桶内有足够的离散，我没有看到爆点的机制。没有前视，没有使用 nanrank_last。没有任何种子的 |ρ| 达到 0.8，也没有数学问题，所以不划。如果它有 alpha，最可能来自同股本或同名义价的票之间，成交在日内更早或更晚发生所反映的持有人构成差异（散户占比、限售与大股东结构）；其中 14 号若有效，更可能是流动性的残差，而不是结构。'
