    hypothesis: '想法:在「冷落的大票」这一本书(head 4,方向 +1)上,按一根与「冷」正交的慢变量再切一层 40% 的限定 / 沉底,看哪一根轴能把它变得更干净。(1)现象:核心 = head 4 `cs_first_low20(cross_mean(LogFloatCap, 60), cross_mean(day_sum(Amt), 60))`(+1.34,train +1.34 / valid +2.50,方向 +1,半衰期 0)。多头端 = 60 日成交额最低 20% 的尾部里按 60 日市值从大到小排的一端,即「成交额很低而市值相对不低」的被冷落的大票。拆解事实:敲掉 60 日平滑 −0.63(日度标记逐日翻转,成本吃光),窗口 30 / 120 不敏感,所以是一个慢状态;第 2 轮 R 把标记换成换手率(TRV)后只剩 +0.36,说明来源是成交额水平与市值的交叉,不是换手率。同一轮 R 里,在这本书上再沉底一层 20% 的次新(ListAge)升到 +1.42(train +1.42 / valid +3.30),沉底 10 日平滑的复权价格低尾是 +1.24(与原 head 的日度秩 |ρ| 只有 0.39),说明这本书能再切、切完分数仍在 1.2 以上,且切的轴不同,选出的名字就不同。(2)本位的做法:核心原样固定,外围只加一层 40% 宽的 `cs_first_low40 / cs_first_high40 / cs_last_low40 / cs_last_high40`(把某根轴的最低 / 最高 40% 整体抬到最前或沉到最底,其余按核心的秩排),轴取 10 类、核心从没用过的慢变量:60 日波动 VOL60(低波 = 防御型,「冷 + 低波」是红利 / 国企式低估值票的画像)、名义价格 NOMP = sub(LogFloatCap, LogFloatShares)(低价)、60 日涨幅(近期输家 / 赢家)、限售比例 sub(LogTotalCap, LogFloatCap)(解禁压力)、60 日流通股本变化 ts_delta(LogFloatShares, 60)(刚解禁 / 增发)、流通股本水平、60 日偏度、成交额对自身 241 日均值的衰减(注意力在褪去)、分钟报价冻结比例 day_flat_ratio(薄报价);另有一个两层 40% 交集(低波 ∩ 低价)。为什么是 40% 不是 20%:二层 20% 与核心的日度秩 |ρ| 在 0.8–0.9(第 2 轮 R 里沉底 20% 次新实测 0.82),会被库禁令挡掉;40% 的层只改动核心排序的一部分,|ρ| 在 0.3–0.7,极性取「抬到最前的那组与核心多头端相反」的一侧更容易落在 0.7 以下,所以对波动、价格、涨幅两个极性都放了种子。(3)与库里已有的不同:这个核心此前没有做过 E,R 里只试过沉底 20% 的次新与价格两个外围,40% 宽的限定 / 沉底和下面这些轴都没有被任何候选用过;种子的算子骨架(含窗口)互不相同,也不等于任何 head 的骨架。轴里除 VOL60 与成交额衰减分别与波动、流动性两个控制同族外,其余都不是 5 个控制之一(控制是流动性、波动、20 日反转、已知族、市值);VOL60 在这里只充当 40% 台阶的指示量,台阶不在控制的低阶多项式里,切完之后的书与 head 4 的差别是「条件化」,不是换写法。(4)数学上没有问题:窗口 ≤ 60 日(只有「注意力褪去」一个种子用 241 日 cross_mean,它是 nanmean,不会缺失,库里 head 用 241 日窗口已经验证过覆盖率);不含除法;log 只作用在成交额的均值上(正数);`ts_delta(LogFloatShares, 60)` 大多数名字恒为 0(并列块),_lexi 的整块规则使沉底的带只含真正变化了的那一小块,窄于 40% 是设计;无前视(日频叶子与收盘前量价,标签 t+1 开盘 VWAP 起算);不含 ts_spearman 与 nt_*。(5)为什么样本外还会在:冷落公司溢价(neglected-firm effect)与流动性溢价是跨市场、跨时期记录的异常,不依赖某一年的行情;被冷落的大票叠上低波、低价、非次新,就是 A 股「低估值红利型」的典型画像,其定价修复由估值与现金回报驱动,而不是由 2022–2023 的微盘行情驱动。风险:valid 约为 train 的两倍,train(2018–2021)一侧是约束,本位正是要看哪一根轴能把 train 抬高。'
