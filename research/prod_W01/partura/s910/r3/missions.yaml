    hypothesis: '想法:给「小市值里排掉一类死尾」这个已验证的写法补两类库里还没有的死尾数据:股本结构随时间的变化(解禁、增发、转股)与分钟级报价质量(薄报价、冻结、极值),并让 GP 在它们的组合上长。(1)现象:本组 22 个 head 里,方向 −1 的绝大多数是「小市值 + 排掉一类死尾」:次新(ListAge)、低价(day_last(High))、低成交量(day_sum(Volume))、限售比例高(sub(LogTotalCap, LogFloatCap),第 2 轮冒出的新一族,3 个 head,最好 +1.50 = sub(sub(LogTotalCap, LogFloatCap), LogFloatCap))。限售比例这一族来自此前没人用过的股本结构叶子,说明股权结构是还没挖干净的数据源;但至今用的都是它的水平(静态),没有人用它随时间的变化,也没有人用分钟级的报价质量。(2)本位把死尾扩到这两类,骨架沿用库内成功的 `cs_first_high20 / cs_first_low20(LogFloatCap, 尾部变量)` 单层(方向由评估选:−1 = 排除尾部后取最小市值,+1 = 取尾部里市值最大的一端),并用 ListAge 外层(第 1 轮 R 已验证能把 train 从 +0.63 抬到 +1.42 的补丁)做四个两层种子。尾部变量:(A)供给冲击:ts_delta(LogFloatShares, 60) 与 20 日版本(流通股本增加 = 解禁 / 增发 / 转股,价格无关,因为股本是对数股数)、ts_delta(sub(LogTotalCap, LogFloatCap), 60) 的最低尾(限售比例下降 = 刚解禁)、ts_delta(add(sub(LogTotalCap, LogFloatCap), LogFloatShares), 60) = 总股本的 60 日增长(净发行 net issuance);(B)报价质量:cross_mean(day_flat_ratio(Close), 60)(分钟报价不动的比例 = 薄报价 / 封板)、cross_mean(day_zero_ratio(Ret), 60)(收益恰好为 0 的分钟占比)、cross_mean(day_gini(Amt), 60)(一天里成交额集中在少数分钟 = 一笔单子就能推动价格);(C)极值:cross_max(ts_delta(log(day_last(Close)), 1), 20)(20 日内最大单日涨幅 = MAX 彩票效应)、cross_mean(day_skew(Ret), 60);(D)复合:ΔS 与 flat 的 cs_rank 之和,取最高 20%(多种死尾的并集)。(3)与库里已有的不同:库里的尾部变量只有:市值、成交额(流动性)、复权价格、次新、限售比例水平、名义价格;这里的尾部变量全部是新的信息源(随时间的股本变化、分钟级报价),不是已有尾部的换写法;算子骨架(含窗口 60 / 20 / 1)互不相同,也不等于任何 head 的骨架(已逐个核对)。独立于市值的尾部会使输出与市值秩的 |ρ| 约 0.58,集中在小市值的尾部更低,低于 0.8 的自动划掉线;ListAge 外层的两层种子预计与第 1 轮的次新类 head 有 0.5–0.7 的相关,是预期内的。(4)数学上没有问题:窗口 ≤ 60 日(不用 120 日以上的回看:第 1 轮 120 日回看的两个种子因覆盖率 0.89 被划掉);不含除法;ts_delta(…, 1) 对停牌后复牌的第一天给 NaN(停牌日的收盘价缺失),所以 MAX 不会读到跨停牌的大缺口;股本差分在大多数名字上恒为 0(并列块),_lexi 整块规则使带只含真正变化了的那一小块,窄于 20% 是设计,不是缺陷;cs_rank 之和在并列处按平均秩,无数值伪影;无前视(日频叶子与收盘前量价,标签 t+1 开盘 VWAP 起算);不含 ts_spearman 与 nt_*。(5)为什么样本外还会在:增发 / 净发行异常(net issuance anomaly)与解禁的负超额收益是跨国、跨时期记录的现象,而且被制度日历(IPO 锁定期、定增 12–36 个月)驱动,不依赖某一段行情;薄报价与 MAX 彩票是机制性的流动性 / 操纵风险与散户偏好,不依赖 2022–2023 的微盘行情。风险:这些尾部变量的有效性未经检验(本位就是检验),若尾部与市值无关,单层种子的 train 一侧会像第 1 轮 R 里「名义价格尾」那样偏弱,这也是 ListAge 外层种子存在的原因。'
