  hypothesis: 想法:『冷落(低换手率)尾』的系统铺开。(1)现象(快照里已有 5 个成交额类 head 的证据):head 4 `cs_first_low20(cross_mean(LogFloatCap, 60), cross_mean(day_sum(Amt), 60))`(+1.34,train +1.34 / valid +2.50,方向 +1,半衰期 0)是库里除 H1 之外分数最高、且与市值带不同的结构;拆解:敲掉 cross_mean(day_sum(Amt), 60) 外面的 60 日平滑后 −0.63(日度成交额的标记逐日翻转,成本吃光),敲掉市值那一支的 60 日平滑不变(+1.34),窗口 30 / 120 不变(+1.33 / +1.28),把 Amt 换成 Volume 仍有 +1.10(valid +2.97);head 6 `cs_first_low20(cross_mean(day_sum(Amt), 60), cross_mean(day_sum(Amt), 60))`(+0.83)、head 9(+0.72)同属 60 日成交额最低 20% 的尾部。(2)读法(推断,尚未单独验证):成交额最低 20% 的尾部里按市值从大到小排,多头端 = 成交额很低而市值相对不低的名字 = 换手率(成交额 / 流通市值,或成交量 / 流通股数)最低的一批『被冷落』的股票。所以 head 4 抓的很可能是换手率尾部,而不是成交额水平本身;成交额是 5 个控制之一(其秩的一次 / 二次 / 三次项被去掉),换手率不是,台阶形状(尾部)也不是低阶多项式,残差里还留着。(3)本位的做法:把标记变量从『成交额』换成真正的换手率。TRV = sub(log(cross_mean(day_sum(Volume), 60)), LogFloatShares)(60 日平均成交量 / 流通股数的对数,即换手率;LogFloatShares 是日频叶子,不用除法,避开除以近零的爆点);TRA = sub(log(cross_mean(day_sum(Amt), 60)), LogFloatCap)(成交额 / 流通市值)。cs_first_low20 / low40 用 _lexi 把尾部整体 +1 抬到最前,其余按 y 的秩排;方向由评估自己选(+1 = 取尾部里 y 最高的一端,−1 = 排除尾部、取其余里 y 最低的一端)。铺开的维度:尾部宽度(20% / 40%)与端点(最低端『冷落』、最高端『热门』);排序变量 y(市值、名义价格 = LogFloatCap − LogFloatShares、取负的 60 日波动、取负的 60 日涨幅);带形(cs_first_low20(TR, TR) 取尾部相邻的一带、cs_last_low10(neg(TR), TR) 沉底最低 10% 再取邻带,对应 H1 / head 5 在市值上的做法);分层(cs_bucket_rank 在换手率十分位里排市值、在市值十分位里排 −换手率,对应 head 5 / head 8 的分层写法);窗口 20 日版本;与 ListAge、名义价格两层叠加(对应 head 3 的『排除死尾』),与 40% 低波动的两层交集。(4)与库里已有的不同:库里的标记集合是『成交额最低 20%』(head 4 / 6 / 9),这里是『换手率最低 20%』。成交额低的名字大多是小市值,换手率低的名字是『相对自己的体量没人交易』,两个集合只部分重叠(推断:差别主要在市值中段),所以选出的名字不同;种子的算子骨架(cs_first_low20(DF, sub(log(cross_mean(day_sum(F))@60), DF)) 等)与库里任一 head 的骨架都不同,也不含 head 4 的『cross_mean(市值, 60)』外壳。与控制:换手率不是 5 个控制之一,尾部 / 带形的秩与流动性控制的相关预计 0.4 以下(与自身变量的 20% 台阶 |ρ| = |1 − 6a(1 − a)| = 0.04),预计没有一个种子达到 0.8。(5)数学上没有问题:全部窗口 ≤ 60 日(第 1 轮 120 日回看的两个种子因覆盖率只有 0.89 被划掉,这里不再用),无前视(日频叶子与收盘前后复权的量价,标签 t+1 开盘 VWAP 起算);log 对非正数返回 NaN,只有连续停牌 60 日的名字会缺失,不会出 ±inf;不用除法;不含 ts_spearman 与 nt_*。(6)为什么样本外还会在:冷落(低换手 / 低关注)溢价是跨市场、跨时期记录的异常(流动性溢价与注意力假说),不依赖某一年的行情;慢变量,换手低,成本不会爆。风险:head 4 的 valid 是 train 的近两倍(2022–2023『冷落大票』行情),如果它的 train 来自成交额水平而不是换手率,这一位的种子会在 train 一侧被 min(train, valid) 筛掉,这也是这一位要检验的:换手率尾部是不是比成交额尾部更干净的来源。
