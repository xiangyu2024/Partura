  hypothesis: 核心:head 1 整体(H1,score +1.85,train +1.85 / valid +2.58)。H1 的多头端(方向 −1,取最低输出)是市值 20–30% 分位的一带,即『剔掉壳尾之后的下一档小市值』;它的外壳(cross_fangzheng、ts_quantile(…,1))被敲掉后分数不变,所以可动的只有外围。这一带并不干净:次新股、近期停牌过的、高波动/高偏度的彩票型股票、近 60 日收盘贴近涨停的、近 60 日有极端日涨幅的、近 60 日涨跌幅处在两端的,都是 H1 这一带里的『子集』;新尺子只洗掉 5 个控制的秩的线性/U/S 暴露,洗不到带内的子集。这次的外围写法:cs_first_high40 / cs_first_low40(H1, X)——把 X 标记的那 40% 整体 +1 抬到最上面,H1 的多头端(最低输出)自动排除它们,带内其余名字的次序不变;两层叠加(例如先排除次新、再排除高偏度,或同时排除 60 日涨幅的两端、或先排除次新再排除不流动)形成一串排除。X 一律是慢变量(ListAge、60 日有效交易日数、60 日波动 / 偏度 / 最大日涨幅 / 涨停贴近度 / 涨幅、10 日平均的成交额异常度、20 日净买入占比),因为 H1 的价值来自低换手,逐日翻转的标记会把 15bp 成本吃回去。与快照里已见过的写法的区别:快照里含 H1 的候选只有它自己,没有任何外壳;这里的外围算子集合是 {cs_first_*、cross_mean、day_skew / day_std / day_at_max_ratio、ts_max、ts_delta、cross_valid_count、ListAge …},完全不同。与库里已有 head 的区别:用合成截面模拟(rank(H1) + 1[X 标记] 再取秩):标记比例 40% 时 |ρ(种子, H1)| ≈ 0.50–0.54,两层叠加(20%+40% 或 20%+20%)≈ 0.34–0.45,而标记比例 ≤20% 会升到 0.68–0.9,所以单层一律用 40%,ListAge 与 cross_valid_count 这类并列饱和、标记比例很小的变量只放在两层叠加里;选出的名字因此确实不同(被排除的那 40% 不再进多头)。H1 与 head 2 的台阶不同,模拟 |ρ| 约 0.1;H1 与市值秩的相关约 0.04,所以核心不是控制的换写。为什么样本外还会在:带本身来自 IPO 审核制下的壳价值(制度性);被标记的几类(次新、停牌、彩票型、两端极端涨跌)是文献里反复被记录为低回报或高风险的名字,排除它们只改善多头端的夏普,不依赖 2022 年行情;标记用的变量是慢变量,换手不会因此爆。
