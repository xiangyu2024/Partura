  hypothesis: 想法:『台阶(step)泄漏』的系统扫描。(1)现象(批 1):两个 head 都是 cs_first_low20(y, x) 这种字典序算子——x 的最低 20% 整体加 1 抬到最上面,其余按 y 的秩排。head 1 里 y≈x≈LogFloatCap(外壳 cross_fangzheng / ts_quantile(…,1) 敲掉后分数不变,+1.82 / +1.85);共性表里 9 个入选子树全含 LogFloatCap,而这几个子树(平滑过的纯市值)单独当信号的充分性得分是 −4.8 到 −5.0(train −3.3 到 −3.6)。读法:信息不在『市值水平』里而在『台阶』里——新尺子只去掉 5 个控制的秩的一次/二次/三次多项式暴露,一个台阶(锯齿状的秩)不是低阶多项式,残差里还留着它,长腿落在台阶紧邻的一带(按构造推断:head 1 方向 −1、取最低输出,多头端落在市值 20–30% 分位)。(2)机制:A 股小市值溢价是真的,但最小的一档被壳价值(IPO 管制)和 ST/退市风险污染(Liu, Stambaugh, Yuan 2019《Size and value in China》为此把最小 30% 剔除),所以多头最好落在『剔掉壳尾之后的下一档』;台阶的作用就是把壳尾搬离多头端、把长腿定位在紧邻的一档。台阶没有理由恰好在 20%,也不必只放在市值上。(3)算子怎么实现:当 y = x = LogFloatCap 时,cs_first_high* 与 cs_last_low* 恒等于市值秩本身(没有台阶),只有 cs_first_low20/40 与 cs_last_high05/10/20/40 是非平凡台阶;把 y 换成 neg(LogFloatCap) 后,cs_last_low05/10 变成切点 5% / 10% 的台阶。A 组(台阶位置):cs_last_low05 / cs_last_low10(neg(cap), cap) 放 5%、10% 切点,cs_first_low40(cap, cap) 放 40%,cs_last_high40(cap, cap) 放 60%,另有一个 40% 与 10% 的两台阶叠加;台阶两侧(最高端 / 最低端)都是多头候选,方向由评估自己选。B 组:同一招用到其它控制变量的『慢变』版本(60 日成交额、60 日波动、120 日动量、复权价格水平)——这些控制被去掉的只是平滑部分,台阶部分去不掉;必须取慢变量,否则残差逐日翻转,15bp 成本吃光(批 1 里含 Amt / High / Low 一类快变子树的候选均值 −1.3 左右、不含市值子树的候选均值 −0.5 到 −0.8,我推断是这个原因,尚未单独验证)。C 组:台阶变量与排序变量分开(head 2 的做法),但台阶换成慢变量并把被标记的 40% 整体抬到最上面:60 日成交额最低 40%(不流动)、60 日波动最高 40%、60 日偏度最高 40%、60 日内收在日内最高点的贴近度最高 40%(涨停贴近)、120 日涨幅最低 40%,排序仍用 LogFloatCap;前三个标记(不流动、高波动、涨停贴近)集中在小市值,使多头端落在『小市值里流动、低波动、不贴涨停的那部分』。(4)与库里已有的不同:同一个 y=x=cap 的锯齿秩 s_a = r − 1[r>a],两个切点 a、b 之间的日度秩相关由 0.0833 − a(1−a)/2 − b(1−b)/2 + (1−max(a,b)) − (1−a)(1−b) 除以 0.0833 给出,与 head 1(a=20%)的 |ρ|:切点 10% 约 0.46、5% 约 0.24、40% 约 0.04、60% 约 0.44;与市值控制 |ρ| = |1−6a(1−a)|,切点 5% 约 0.72、10% 约 0.46、40% 约 0.44、60% 约 0.44,都 <0.8(合成截面模拟已核对);与 head 2 更低。C 组是 rank(cap) + 1[x 的 40%] 型,用合成截面模拟:标记集中在小市值时与市值控制的 |ρ| 约 0.05–0.2,标记与市值无关时约 0.4–0.5,与 head 1 的 |ρ| <0.1,与 head 2 <0.4(标记比例过小才会逼近市值本身,所以统一用 40%)。它们不是 head 1 / head 2 换写法:台阶位置不同、台阶变量不同,选出的是不同的一带。(5)样本外为什么还会在:台阶是机械结构,切点不是用样本内路径拟合出来的;壳尾污染是制度性的(IPO 审核制)而不是某段行情的偶然;全用慢变量,换手低,成本不是问题;如果只是 2022 年微盘股行情的副产品,这些书在 train 段会偏弱,min(train, valid) 的评分会把它们筛掉。最可能撑住的是 A 组的 5% / 10% 切点和 C 组的『不流动 40% 标记』。
