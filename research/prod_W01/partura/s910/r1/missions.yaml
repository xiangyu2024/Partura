  why: head 2 = cs_first_low20(LogFloatCap, day_last(High)),score +0.63(train +0.63 / valid +1.95),是库里最弱的 head,弱在 train 一侧。拆解依据:(i)把 High 换成 Low 分数不变(+0.62 / +1.91),所以『哪个价格字段』不是来源,来源是价格水平台阶(复权价格最低 20% 的名字被搬到最上面)与市值排序;day_last(High) 只取最后一分钟的 High,是个逐日噪声版的价格水平,标记集合会逐日轻微翻转,这是烂部件之一;(ii)排序用的 LogFloatCap 是逐日值,而共性表里 ts_quantile_q75(LogFloatCap, 10)(均值差 +2.13,p 0.005,9 个候选)和 cross_fangzheng(LogFloatCap, 3)(+1.82,p 0.008,4 个候选)这类带平滑的市值子树的候选平均分明显更高,说明平滑后的排序更稳;(iii)台阶宽度 20% 与再叠一层排除(次新)没有试过。变体都是替换这三处部件:平滑排序变量、平滑或延长价格标记变量、改台阶宽度、换排序变量、加一层 ListAge 排除。全部是 head 2 的小改,没有数学问题:价格为后复权正值,无除法;ListAge 与 cross_valid_count 是有界整数。
