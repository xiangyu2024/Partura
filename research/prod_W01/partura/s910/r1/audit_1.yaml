    struck_seeds: [8, 11]
    reasons: '相关度表:14 个种子对两个 head 的原始 |ρ| 最大 0.46(a1 对 H1),对 5 个控制最大 0.72(a2 对市值,低于 0.8 的自动划掉线)。残差 |ρ| 对 H1/H2 除 a2(0.41 对 H1)与 a3(0.48 对 H1)外都在 0.3 以下,a4、a6、a7、a10、a12、a13 均在 0.03 以下,所以选出的是不同的一带,不是同一个东西换写法,创新度不给 1。但机制就是 H1/H2 已有的 cs_first 台阶(ops_ext.py 的 _lexi:最低 20%/40% 的 x 整体 +1 到最前,切点由 tie block 决定),这里换的只是切点(5/10/40/60%)和台阶变量(市值、60 日成交额、60 日波动、120 日涨幅、价格、60 日偏度、涨停贴近),没有新机制,所以只给 3。a1–a5(市值台阶)与 a6、a7、a10、a12(流动性/波动控制的 60 日慢变量台阶)在「低相关不等于新」的意义上是控制变量的台阶写法,但 H1 本身就是同类台阶且已被库接受,我不按重复划掉,这是创新度上不到 4 的原因。合理度 4:算子已逐个核对(以 H1 为例,方向 -1 取最低输出时,多头端是切点上方的一带;cs_last_low10(neg(cap),cap) 是最低 10% 沉底、其余按 -cap 排序),没有数学问题:标签是 t+1 开盘 VWAP 起算,无前视;day_signed_ratio 的分母有夹紧、cross_zscore 有 EPS 与常数守卫;distinct 全为 1.0,面板不是常数;台阶的非多项式部分不在 15 列残差里,所以机制成立。弱点:40%、60% 切点(a3、a4、a14)的机制没交代,但不是数学问题,保留。如果它有 alpha,最可能来自:(1) 市值最小 5–10% 的壳尾移出多头端之后,残差里留下的台阶效应(a1、a2、a5);(2) 低流动性尾部(a6、a10)的非线性流动性溢价,而不是流动性水平本身;其余切点变体若有 alpha,也最可能只是 H1 同类台阶的别的切点版本。划掉 8 与 11:120 日回看的 ts_delta 在样本起始段系统性算不出,覆盖率 0.89(其余多为 0.999),属于 §4 的定义坏掉,与流水线门槛「废品」一致。'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '核心 H1 整体在 13 个种子里逐字出现(已核对)。创新度 3:不是换皮。每个种子对 H1 的原始 |ρ| 在 0.36–0.53,残差 |ρ| 在 0.22–0.43(最低 b13 0.225,最高 b9 0.431),没有一个触发 0.7 的库禁令,也没有残差与 H1 基本相同的种子。外围 X 用的是 H1 没有的变量:ListAge、60 日有效天数、60 日涨跌两端、60 日偏度/波动/涨停贴近、成交额异常度、20 日净买入。但它仍是 H1 的 20–30% 市值带减去被标记的名字,没有新机制,所以只给 3。b1(60 日波动,对波动控制 |ρ| 0.60)与 b9(60 日成交额,对流动性控制 0.63、对已知族 0.61)与控制最接近,但都低于 0.8;核心对每个控制的 |ρ| 最大 0.18,满足 E 位条件。合理度 4:算子已核对。cs_first_high40(core, X) 保持 H1 的排序,只把 X 最高 40% 整体抬到最前,方向 -1 时这些名字退出多头端。b11 展开三层(cs_first_low20 / cs_first_high20 / cs_first_low20 作用在同一个 60 日收益上)后,等价于「剔除 60 日涨跌两端」。外围只用秩,不依赖 skew 或 z 的数值大小,无前视。机制:彩票型 / MAX 效应(b1–b4、b13)、次新与复牌(b10、b12)、过去赢家和输家(b5、b6、b11)、异常成交与净买入(b7、b8、b9)。b2 的 day_skew 在平盘日为 NaN、薄股上噪声大,这是估计问题,不是 bug,不划。没有数学问题,也没有重复,不划。如果它有 alpha,最可能来自 H1 长端内部几类已知异常被剔除后的纯化(彩票型、次新、两端极端涨跌、异常换手),而不是 H1 的市值台阶本身。'
R:
