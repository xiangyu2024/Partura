    reasons: 'R 组只评合理度。原 head 2 的 12 个变体只换三处部件:价格标记(High 换成 Close、Vwap、60 日最低价、10 日分位或 20 日均值)、排序键(市值换成 10 日分位、3 日 mean+std、LogFloatShares、LogTotalCap)、台阶宽度(40%),以及再叠一层 ListAge 排除。逐个核对:没有除法;cs_first 的台阶只用秩;ListAge 的老股并列块(启动日已在生命周期内的股票共享哨兵值)由 _rank_block 处理,不会进台阶;cross_min 与 ts_quantile_q75 都是有界的时间窗运算;无前视;面板 distinct 全为 1.0。机制是长期价格水平最低 20% 的名字(累计收益低、低价股,A 股里常是 ST 或退市风险)先出多头端,再在剩下的名字中取小市值,是清楚的台阶机制。规则 §4 明确后复权价格排序不是问题,因此不据此扣分。注意:9 个变体对原 head 的 ρ 在 0.93–1.00(残差同量级),属于替换类而非收录类,应由 R 替换规则处理,不影响合理度。合理度 4。'
