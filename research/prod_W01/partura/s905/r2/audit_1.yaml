slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [14, 15]
    reasons: |
      【位 a：E 深挖，核心 day_centroid(Amt)】
      新颖度 4。库里只有两个 head，核心是 pow_2_5(cross_mean(c,3)) 的子树（E 位的设计），所以新意只能看外围。外围多数是真正的新构造：分段优先（1–3）、两腿合成（4、5）、按涨跌方向条件化的时点（6、7）、价量时点之差（8）、时间序列的极值与尾部统计（10–12）、短长偏离（13）、低流动性剔除（16）。raw |ρ| 对两个 head 最高为 0.55（种子 1，对 cross_zscore 头），都低于 0.7 的库禁令线；与控制的 |ρ| 最高为 0.62（种子 8，对 rev），都低于 0.8。残差 |ρ| 对 pow head 在 0.69–0.86 的（1、3、4、5、9、16）说明其中一部分仍是重心水平，这是扣分的依据之一，但还不到换写法。
      合理度 4。逐个核对算子，没有 §4 的数学问题：day_centroid（ops_ext.py 155 行）是 [0,1] 的时间加权平均，总量为 0 时输出 NaN，小分母不会爆点；cs_first_low20 / cs_last_low10 走 _lexi（ops_ext.py 339 行），不丢股票，只把 x 落在最低 20% / 10%（整块并列）的票整体推到顶 / 底，y 缺失为 NaN 而不是 0，所以不触发 nanrank_last 的已知缺陷（本位也没有 ts_rank / cross_rank / in_rank_rolling）；cs_rank（common.py rank）对非有限值输出 NaN；cs_regres（nd_cs.py 254 行）按 valid mask 逐日截面回归；ts_min、cross_mean、cross_tail_mean_q25、cross_stddev 都是 rolling_windows 因果窗口（common.py 433 行，左补 NaN）；day_flat_run_max（ops_ext.py 415 行）输出的是最长平坦段除以有限分钟数，在 [0,1]，所以种子 9 的 c − flat 量纲一致（不是分钟数，这一点已核对）。
      E 位检查：核心对 liq / vol / rev / known / size 的 |ρ| 为 0.181 / 0.156 / 0.126 / 0.194 / 0.066，都小于 0.8；16 个候选都原样含 day_centroid(Amt)；外围与 loc.json 里已见的含该核心候选（cross_mean 平滑、pow_2_5、cross_zscore 等几类）没有重合。
      分种子的「如果有 alpha，最可能来自哪里」：
      1 年轻段（ListAge 最低 20%）内按重心排序：新股阶段散户主导的早盘 / 尾盘时点差异。残差 0.75 对 pow head，需要 valid 检验它是否只是 head 在年轻段的重复。
      2 低名义价段内按重心排序：低价股彩票需求下的交易时点。P = sub(LogFloatCap, LogFloatShares) 作为名义价的前提未从代码验证（round 1 已提），只影响机制解释，不影响表达式的合法性。
      3 小市值段内按重心排序：小盘股的时点结构，也可能只是规模台阶的残留（size |ρ| 0.54，三次多项式去不干净，是 PI 已承认的风险，不是挡的理由）。
      4 rank(c30) − rank(gini30)：日内成交集中与摊开两种结构的差异。注意 gini 本身与 liq 的 |ρ| 为 0.83（见位 b 种子 12），这一腿带流动性暴露，残差化会去掉大部分。
      5 开盘份额与重心之差的秩：开盘信息交易者份额中独立于重心的部分。
      6 上涨分钟成交额的重心减全体重心：追涨买盘在日内的时点。分子只来自少数上涨分钟的票噪声较大，但值域有界。
      7 下跌分钟版本：下跌中恐慌卖出的时点。与 6 互补，两者的相对符号 PI 可以再查。
      8 c(Amt) − c(Volume)：日内价格路径与成交时点的交互。它与 20 日反转控制的 |ρ| 为 0.62，PI 笔记里「控制列都很低」的说法与表不符（8 的 rev 0.62；9 的 liq / vol / known 为 0.43 / 0.42 / 0.47），大部分可能是反转的换皮，残差化后会缩水。
      10 40 日内最早的重心：偶发开盘集中事件后的漂移。它是极值统计、窗口短，对单日事件敏感。
      11 60 日内最低四分之一重心的均值：「开盘集中日」的持续性。vol 控制 0.49，残差化后要看。
      12 40 日重心的时间标准差：事件驱动日多（信息不稳定）的票。注意 cross_stddev 的 nanstd_last（common.py）在只有 1 个有效日的窗口里得到 0，这些票（新上市首日、长停复牌首日）会被排到截面底端。受影响的票很少，不挡，请 PI 知悉。
      13 5 日重心均值减 60 日均值：时点的短期偏离（去水平的漂移）。raw |ρ| 对 pow head 为 0.64，接近 0.7 的库禁令线。
      16 剔除 20 日成交额最低 10% 后按重心排序：中高流动性段内的时点信号。残差 0.77 对 pow head，差别主要在最低流动性尾部。
      划掉的种子：
      14 cs_bucket_zscore(cross_mean(c,40), cross_mean(day_std(Amt),30))：与本轮 R 1 变体 8（cs_bucket_zscore(cross_mean(c,20), cross_mean(day_std(Amt),30))）骨架与外围完全相同，只差窗口 40 / 20，残差对 pow head 0.81。它是同轮 R 变体的 GP 起点，E 位的外围不得与同轮已评过的含核心候选相同，按重复划掉。
      15 cs_regres(cs_regres(cross_mean(c,30), LogFloatShares), cs_rank(cross_mean(day_std(Amt),30)))：与本轮 R 1 变体 7 同骨架同外围，只差窗口 30 / 20，残差对 pow head 0.83。按重复划掉。
      不划但请 PI 知悉：9 的残差对 pow head 为 0.86，只比裸核心（0.98）低一点。raw |ρ| 0.50、控制 |ρ| 最高 0.47，§3 只挡数学问题与重复，所以放行；但这一位在残差尺子上很接近 head。
      定义依赖（位 a 的 5 与位 b 的 3、5、9 共用）：day_first / day_last 取第一 / 最后一个非 NaN 列，如果 09:30 或 15:00 那一列缺失，会退化为相邻分钟。表里没有这两列的覆盖率，请 PI 核对。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [12]
    reasons: |
      【位 b：N 新想法，成交额曲线的分段】
      新颖度 4。14 个种子都不是重心的单调改写：分段份额（1、6、7、8）、开盘 / 收盘集合竞价份额（3、5、9）、与重心正交的残差（2、4）、尾盘净买入与尾盘收益（13、14）、股本中性化（11）、尾盘份额的 240 日 z-score（10）。raw |ρ| 对两个 head 最高的是 10（对 cross_zscore 头 0.68，离 0.7 的库禁令线很近，novelty 略降）；与控制的 |ρ| 除 12 外都在 0.52 以下（9 的 known 0.52、1 的 liq 0.46）。
      合理度 4。没有数学问题：
      - in_slice（dt_in.py 324 行）对 DT 张量 (D, M) 做闭区间列切片，分钟轴在最后，与 day_* 的 -1 轴一致；211–240 是 30 列。
      - 份额 = day_sum(段) / day_sum(全天)，分子是分母的子集，值域 [0,1]，分母为 0 时 NaN。
      - day_signed_ratio（ops_ext.py 122 行）与 day_gini（136 行）有界；14 的尾盘收益是同一天 14:31 与 15:00 收盘价之比，与复权口径无关。
      - 10 的 cross_zscore(·,240) 的前 240 天是扩张窗（rolling_windows 左补 NaN），只影响 2018 年段，不主导。
      - 列切片与 PI 的网格约定一致（列 0 = 09:30 集合竞价，1–120 = 09:31–11:30，121–240 = 13:01–15:00）：1–30 = 09:31–10:00，91–150 = 11:01–11:30 与 13:01–13:30，181–210 = 14:01–14:30，211–240 = 14:31–15:00。
      分种子的「如果有 alpha，最可能来自哪里」：
      1 尾盘 30 分钟份额：尾盘被动 / 散户追涨的流量。
      2 尾盘份额对重心取残差：尾盘中独立于重心的部分。
      3 开盘集合竞价份额：开盘信息交易者的参与。
      4 开盘份额对重心取残差：开盘中独立于重心的部分（残差对 pow head 0.67，说明正交化是对 c20 做的，head 是 c3）。
      5 收盘集合竞价份额：指数 / ETF 等收盘被动流量。
      6 开盘后 30 分钟份额：早盘机构拆单与隔夜消息的消化（残差对 pow head 0.70，偏高）。
      7 午前后低活跃段份额：参与者稀疏时段的成交结构。
      8 14:01–14:30 份额：午后前段的机构执行。
      9 开盘在两个集合竞价中的相对份额：开盘与收盘集合竞价参与者的相对结构（与位 a 的 5 共用此项）。
      10 尾盘份额的 240 日 z-score：尾盘参与者结构的慢变化（去水平的冲击）。
      11 尾盘份额对 LogFloatShares 取残差：与股本无关的尾盘份额部分。
      13 尾盘净买入比例：尾盘净买压。
      14 尾盘 14:31→15:00 收益：尾盘拉升或反转的强度。它与同日尾盘数据同源，交易须按 t+1 执行（与所有 head 的约定一致）。
      划掉的种子：
      12 cross_mean(day_gini(Amt),30)：与 liq 控制 |ρ| 0.826（≥ 0.8，自动规则同样会划），与 known 0.74。gini 是日内成交集中度，对成交稀疏的票高，本质上就是流动性代理，属于「几乎就是这个控制」。
      不划但请 PI 核对：1 与 11 的控制列接近（liq 0.46 / 0.41，known 0.46 / 0.40），11 只是对 LogFloatShares 取残差。表里没有种子间 |ρ|，不能确证重复，保留；请 PI 算 1 与 11 的种子间相关，若很高则只留一个。3 与 6 都是开盘强度的份额，控制列也接近，但机制不同（集合竞价 vs 开盘后 30 分钟），保留。
      定义依赖：3、5、9 用 day_first / day_last，见位 a 的说明。
R:
  - head: 'pow_2_5(cross_mean(day_centroid(Amt), 3))'
    soundness: 4
    reasons: |
      合理度 4。诊断（3 日窗口为烂部件）与各变体都数学正常：窗口变体 10 / 14 日是普通因果滚动均值；cs_regres 逐日截面 OLS（nd_cs.py 254 行，只有 var > EPS 时才取 beta，否则 beta 为 0）；cs_bucket_zscore 在 x 的十分位内做 z-score（ops_ext.py 482 行），没有爆点。pow_2_5 是单调变换，对截面秩无影响，所以各变体实际只改了窗口与残差化。
      注意：变体 5（cs_regres(c20, LogFloatShares)）的 known |ρ| 为 0.51，超过 §2 收录 / 替换要求的 0.5，按规则不能直接替换或收录，PI 请知悉。
  - head: 'cross_zscore(cross_mean(day_centroid(Amt), 20), 120)'
    soundness: 4
    reasons: |
      合理度 4。各变体（240 / 360 / 480 基线，内层 10 / 40 日，半去水平，与 known 残差的秩合成，cs_regres 上的 z-score）数学正常，没有 §4 的问题。
      注意：rolling_windows 左补 NaN，窗口未满时是扩张窗，所以变体 2（360）和 3（480）的训练前段（2018–2019 年，约占 train 的三分之一到一半）是扩张窗标准化。这不是主导（2022 年起的有效段不受影响），§4 不挡，但它会改变 train 分数，PI 解读 train 分数时需要知道。变体 1–3、8 与 head 的 raw |ρ| 为 0.86–0.92，是替换候选而不是新 head。
summary: 'a 位（E，核心 day_centroid(Amt)）划掉与同轮 R 变体骨架相同的 14、15 两个重复后剩 14 个；b 位（N）自动划掉 12（liq |ρ| 0.826）后剩 13 个；两位的新颖度与合理度均为 4，未见 §4 的数学问题；两组 R 的合理度均为 4。'
