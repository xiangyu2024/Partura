    【和库里已有的不同】库里两个 head 都是"同一个重心的平滑或去水平":3 日均值的幂变换、20 日均值的 120 日 z-score。这里没有一个是重心水平的单调改写:(a)
    改变截面入选集合,(b) 加一条独立的腿,(c) 度量的是方向 / 价格 / 稀疏度与时点的交互,(d) 换聚合的统计量,(e) 是在截面里把暴露减掉。


    【样本外为什么还会在】参与者结构(机构执行 vs 散户追涨)是制度性的:T+1、涨跌停、散户占比高、不能卖空、尾盘集合竞价(2018-08 起)都是长期存在的;信号是慢变量,换手低,成本不是障碍。样本内两段(train
