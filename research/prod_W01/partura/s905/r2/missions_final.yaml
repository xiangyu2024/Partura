R:
- head: pow_2_5(cross_mean(day_centroid(Amt), 3))
  why: 烂部件是 3 日这个窗口(pow_2_5 是单调变换,对截面秩无影响,不是问题)。样本内同一个量的窗口拆解:日度 0.41、2 日 0.69、3 日
    0.80、6 日 0.85、20 日 1.34(train 1.72 / valid 1.34),分数随窗口单调上升,说明信号是慢特质,3 日窗里混着大量日度噪声(也是
    valid 0.80 远低于 train 1.48 的来源)。20 日以上与已知族的 |ρ| 超过 0.5(20 日 0.51,6 日 0.36,3 日 0.28),所以(1)取
    10 / 14 日,留在 0.5 之内;(2)窗口取 20 / 30 日但先对已知族 cross_mean(day_std(Amt), 30) 的秩取截面残差;(3)对流通股本
    LogFloatShares(名义股价的代理,M 第 1 批富集过,与重心有暴露)取残差,以及(1)(2)(3)的叠加。(2)(3) 按构造让 |ρ_known|
    很低;残差会降低与原 head 的相关,但原 head 与其 20 日均值的相关在 0.8 以上,要求的 0.5 足够。
