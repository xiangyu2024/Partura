- type: N
  inspired_by: 本种子第 1 轮 N 位 b 的两个 head 与 M 第 1–2 批的富集同指一个现象:日内成交额的时点分布(day_centroid(Amt
    / Volume) 含它的候选均值 +0.09 对 -1.24,p 0.0003);样本内拆解显示起作用的是个股长期稳定的时点水平(20 日均值 1.34
    > 3 日 0.80 > 日度 0.41,短基线 z-score 反而掉到 0.09–0.66)。重心是整条日内成交曲线的一阶矩,这一位问:曲线的哪一段在带信息。
  hypothesis: '【现象】重心 day_centroid(Amt) 是成交额日内分布的一个数字摘要,把"开盘集合竞价重、午后平淡、尾盘重"的 U 形曲线压成一阶矩。它长期稳定(个股特质)、20
    日均值的样本内分数 1.34,但是它没有告诉我们是曲线的哪一段在起作用:开盘集合竞价那一分钟(第 0 列)、开盘后 30 分钟、午间低谷、下午前段、最后 30
    分钟、收盘集合竞价(最后一列)是由不同的参与者主导的。


    【想法】把曲线拆成互不重叠的段,每一段取占全天成交额的份额(分子分母同量纲、取值在 [0,1],不随成交额水平变),再做 20 日均值得到个股的稳定特质,看哪一段与未来收益有关、方向如何:

    1 尾盘最后 30 分钟(列 211–240)份额;2 开盘集合竞价(列 0)份额;3 收盘集合竞价(最后一列)份额;4 开盘后 30 分钟(列 1–30);5
    午间低谷(列 91–150,11:00–11:30 与 13:01–13:30);6 下午前段(列 181–210,14:01–14:30);7 开盘 /(开盘
    + 收盘)两个集合竞价的相对份额;8 尾盘份额的 240 日 z-score(去水平版,看冲击还是水平);9 全天成交集中度 day_gini。再加三条不是份额的腿,检验尾盘到底是谁在交易:尾盘
    30 分钟成交额加权的净买入比例 day_signed_ratio(Ret, Amt)(尾盘是追涨买入还是卖出)、尾盘 30 分钟收益(尾盘拉升的强度)。

    与重心有重叠的段(尾盘、开盘集合竞价),另外各给一个"对 cross_mean(day_centroid(Amt), 20) 取残差"的版本 cs_regres(段份额,
    重心),|ρ| 对两个 head 必然很低,专门回答"这一段是否有重心之外的信息";以及对 LogFloatShares 取残差的版本(流通股本与名义股价相关,是
    M 第 1 批富集过的一族,样本内读数不稳,先去掉它的暴露)。


    【机制】开盘集合竞价承接隔夜消息与机构指令(信息交易),尾盘集中包含散户追涨、尾盘拉升与被动资金;集合竞价份额本身还是"谁在场"的标志。预期方向:开盘份额高、尾盘份额低的股票更好,与重心的方向一致,但不同的段对重心有不同的贡献,分开读能分出哪一段是真正的来源,也让组合比单一重心多一条独立的腿(Cushing
    & Madhavan 2000:收盘附近的交易与收益;Barber & Odean 2008:散户的注意力驱动买入;Bogousslavsky 2021:日内与隔夜收益的横截面)。


    【算子怎样实现】份额 = div(day_sum(in_slice(Amt, a, b)), day_sum(Amt)),集合竞价份额 = div(day_first(Amt),
    day_sum(Amt)) 与 div(day_last(Amt), day_sum(Amt)),都在 [0,1],分母是全天成交额(停牌日整日缺失而不是
    0,不产生爆点)。尾盘收益 = day_last(in_slice(Close, 211, 240)) / day_first(in_slice(Close,
    211, 240)) - 1(同一天内的比值,与复权口径无关)。全部走 cross_mean 20 日(慢变量,换手低)。残差版用 cs_regres(y,
    x)(逐日截面 OLS 残差)。


    【和库里已有的不同】库里 head 是整条曲线的一阶矩;这里是曲线的分段份额(不同的矩)、净买入方向和尾盘收益。份额与重心的相关是部分的,不是同一个量;残差版则在定义上与重心正交。


    【样本外为什么还会在】份额是参与者结构的特质,制度性原因(T+1、不能卖空、收盘集合竞价规则)长期不变;窗口 20 日,换手低。样本内如果某一段只在 train
    或只在 valid 有分数,min(train, valid) 会让它过不了线,不会混过去。'
