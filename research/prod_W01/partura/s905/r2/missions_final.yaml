  why: 烂部件是 cross_zscore 的 120 日基线。样本内拆解:不做 z-score 的 cross_mean(day_centroid(Amt),
    20) 自身是 1.34,加上 120 日 z-score 变成 0.66,基线缩到 60 日是 0.09,放到 240 日是 0.90,对日度值直接 z-score
    是 -1.16;也就是越把个股自己的长期水平减干净越差。信号是水平,z-score 把水平减掉了,只留下它的缓慢漂移。但整体不做 z-score 的水平版与已知族
    |ρ| 0.51 过不了线,所以不能整个拿掉:(1)把基线拉长到 240 / 360 / 480 日(已知 240 日是 0.90),保留"去掉大部分与已知族共享的水平"的好处,同时多留一些水平;(2)内层窗口
    10 / 40 日;(3)半去水平 sub(m20, 0.5 x m240);(4)z-score 与"对已知族取残差的水平"的秩合成(两条腿一条保留漂移一条保留水平);(5)先对流通股本取残差再
    z-score。
