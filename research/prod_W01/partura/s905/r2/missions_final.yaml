    vs 尾盘追涨"的区分度最大;风险是分段本身给了一个台阶形的规模 / 年龄暴露,三次多项式控制去不干净,所以三个都放进去让 train / valid 分开说话,不假定它一定会在。

    (b) 与第二条腿的秩合成:sub(rank(重心 30 日均值), rank(day_gini 的 30 日均值))(day_gini 是全天成交集中度,在
    [0,1] 内,不随成交额水平变);开盘集合竞价相对份额 day_first(Amt)/(day_first+day_last) 与重心的合成(开盘信息 vs
    收盘被动流量)。两条腿各占一半,与单独重心的 |ρ| 应降到 0.7 以下。

    (c) 带方向、带价格的时点:上涨分钟的成交额重心减全体重心(买盘追涨发生在日内何时),下跌分钟版本;Amt 与 Volume 的重心之差(Amt = 价
