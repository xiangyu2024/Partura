    |ρ| 都很低)。

    (d) 不同的聚合:ts_min(典型"最早"的日子)、cross_tail_mean_q25、cross_stddev(时点不稳定 = 事件驱动日多)、5
    日对 60 日的比。

    (e) 先去掉与流通股本(名义股价代理)和已知族 cross_mean(day_std(Amt), 30) 的暴露再用:cs_bucket_zscore(…,
