slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |
      【位 a：E 深挖，核心 day_centroid(Amt)；本实验第 2 个 E 位（第 1 个在 r2）】
      核对只用了 corr_1.json、loc 的 train / valid 数和源码，没有计算 2023-08-08 之后的任何数。

      新颖度 4。9 个 head 里没有一个含 cross_corr 或 cross_reg*（loc.md 的 heads 表；loc.json 里 cross_corr 出现 0 次），所以「重心与隔夜跳空的滚动相关」这一层是新的，外围也不与已见候选重合。原始 |ρ| 对 head 最高 0.50（种子 11，对 cross_tail_mean_q25(c,60)），残差最高 0.38（种子 4、11）；对 5 个控制最高 0.26（种子 11 对 known），远低于 0.8。不给 5 的理由：核心 c 本身与 cross_tail / cs_regres 族共享（核心残差 |ρ| 0.92），种子 11 有机械成分（见下）。
      核心对五个控制的 |ρ| 为 liq 0.18、vol 0.16、rev 0.13、known 0.19、size 0.07，均 < 0.8。

      合理度 4。逐个算子核对：
      - cross_corr = rolling_pair_reduce(…, "corr")（dt_cross.py:193；common.py:621–640），因果滚动，无前视。G = div(day_open(Open), cross_delay(day_close(Close),1))：day_open 是 day_first 的别名（dt_day.py:129），即 09:30 已知的开盘价除以前一日收盘。c 在收盘后形成，信号 t 日收盘后算、t+1 执行，与所有 head 的约定一致。
      - 没有 §4 数学问题：|corr| 由分母 sqrt(var_x·var_y)+EPS 约束在 1 以内，不会爆点；窗口内方差为 0 时返回 0 而不是 NaN；没有 ts_rank / cross_rank / in_rank_rolling，不踩 nanrank_last；cs_rank 只出现在种子 13 的外层，是截面轴（nd_cs.py:84），不在已知缺陷范围内。
      - 定义提醒一（不挡，请 PI 核对）：「前 60 日是热身期，缺失而不是填充」与代码不符。rolling_windows 左补 NaN（common.py:433），但 rolling_pair_reduce 不要求最少有效日（count 只 clamp 到 1）。所以热身期以及刚上市、刚复牌的票是部分窗口相关：有效日为 2 时恒为 ±1，为 1 时为 0。|corr| 的上界仍是 1，但这些票会在截面两端聚集。PI 写的「约 7%」我没法核对，请 PI 给出 count<20 的截面占比，并看它们是否集中在一端（与 ListAge 相关）。
      - 定义提醒二（不挡，r2 已提出，仍未答复）：day_first 取第一个非 NaN 分钟（dt_day.py:129；common.py:467），只有 09:30 那一列有值时才等于集合竞价。coverage 0.998–0.999 说明表达式几乎总有定义，但 col 0 的覆盖率没有报告。
      - 机械成分（种子 11）：c = (1−s)·c_rest，其中 s 为第一分钟成交额占全天的比例（它在 c 的分子里权重为 0）。所以 corr(c, s) 的符号机械地为负，它量的是 s 的个股波动相对 c_rest 波动的大小，而不是「时点前移」。按 §3 不挡（不是同一个东西，只是部分机械重合），但它的 alpha 来源应归到集合竞价份额的稳定性。

      分种子（|ρ| 为 原始 / 残差；「如果有 alpha」一句）：
      1 cross_corr(c, G, 60)：0.29 / 0.22。隔夜消息与日内成交时点的 60 日耦合。如果有 alpha，最可能来自参与者结构（机构、知情占比）决定的跳空反应。
      2 同 1，窗口 40：0.22 / 0.15。与 1 同骨架只差窗口，PI 若只要一个可删 2、3；审计不划（family (1) 明写了 40/60/120 的探索）。alpha 来源同 1，噪声更大。
      3 同 1，窗口 120：0.27 / 0.18。慢版本，换手更低，alpha 来源同 1。
      4 cross_corr(c, |G−1|, 60)：0.46 / 0.38。跳空幅度（消息冲击强度）与时点的关系。如果有 alpha，来自大冲击日的交易时点是否前移。
      5 cross_corr(c, G 滞后一日, 60)：0.25 / 0.18。消息反应的延迟消化。如果有 alpha，来自隔夜消息在次日的延续。
      6 cross_corr(c, log 成交额日环比, 60)：0.37 / 0.35。放量日的时点结构；liq 控制 0.10，较干净。如果有 alpha，来自放量的性质（信息 vs 流动性）。
      7 cross_corr(c, cross_delay(day_sum(Ret),1), 60)：0.23 / 0.11。前一日涨跌后的时点变化（追涨或恐慌）。与 rev 控制 0.12 可能部分重合，残差后已降到 0.11。
      8 cross_corr(c, G − C/O, 60)：0.11 / 0.11，五个控制全部 ≤0.07。隔夜项减日内项，与 head 和控制基本正交，是本位最独立的一条。如果有 alpha，来自隔夜与日内信息结构的个股差异。
      9 cross_corr(c, day_signed_ratio(Ret,Amt), 60)：0.25 / 0.21。同日净买压的时点。如果有 alpha，来自买压集中在开盘还是尾盘。
      10 cross_corr(c, day_wmean(Ret,Amt), 60)：0.32 / 0.26。成交额加权收益与时点。如果有 alpha，来自「钱经历的收益」与交易时点的关系。
      11 cross_corr(c, div(day_first, day_sum), 60)：0.50 / 0.37（本位最高）。机械项见上；如果有 alpha，只能来自竞价份额的个股波动。
      12 cross_corr(c(Amt)−c(Volume), G, 60)：0.13 / 0.10。成交价的日内漂移与隔夜跳空的耦合。如果有 alpha，来自价格路径与隔夜消息的交互。
      13 cs_rank(种子 1) + cs_rank(cross_corr(c, log(day_sum(Amt)), 60))：0.43 / 0.36。两项秩和，即跳空耦合与成交额水平耦合的合成。distinct 0.80 偏低（秩和并列较多），不挡。
      14 cross_mean(cross_corr(c,G,40),20)：0.25 / 0.19。种子 2 的 20 日平滑，换手更低，alpha 来源同 2。

      划掉的种子：无。没有数学问题；没有与 head 或控制 |ρ| ≥ 0.7 / 0.8 的种子（自动规则不触发）；2、3 与 1 的窗口重复按 family (1) 的设计保留；14 是平滑版，不是重复。
      请 PI 知悉：种子 1、2、3、14 同骨架，13 含 1；种子间 |ρ| 表里没有，请 PI 算出后决定是否留一个。

