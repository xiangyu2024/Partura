  hypothesis: |-
    【现象】库里 9 个 head 里 8 个是同一种东西:成交额日内重心 day_centroid(Amt) 或尾盘份额的"水平"(20-240 日均值、去水平、q25 分位、对流通股本取残差)加上"剔除最年轻 20%"(cs_first_low20(., ListAge))的筛选。水平族在这个种子里已经被库禁令占满:任何再加一道 ListAge 筛选的候选,与已有的筛选型 head 共享同一块"最年轻 20% 沉底"的结构,日度秩 |ρ| 先天就在 0.66 以上;任何再加平滑的水平候选,与 3 日 / 20 日 / 30 日均值 head 的 |ρ| 在 0.8 以上。所以这一位不再动"水平",只动"重心和什么东西一起动"。
    另一个种子的定位表(同数据、同尺子,只含 train / valid 数)里,把重心和隔夜跳空 G = day_open(Open) / cross_delay(day_close(Close), 1) 做 60 日滚动相关 cross_corr(day_centroid(Amt), G, 60),分数是 train 1.45 / valid 2.40(方向 -1),它与该种子里的重心水平 head 的日度秩 |ρ| 只有 0.1-0.25。同一个表里把 G 换成"同日 close / 前一日 close"符号翻转,说明起作用的是隔夜消息这个冲击而不是任意价格量。本种子尚未试过任何"耦合"型候选。

    【机制】A 股 T+1、有涨跌停、开盘有集合竞价:隔夜消息只能在 09:30 的集合竞价和之后的连续竞价里被消化。一只票的钱在日内什么时候成交(重心),在跳空大的日子是否提前(大幅高开 / 低开日,知情的、机构的订单挤在集合竞价和开盘后,重心前移),决定于谁在交易它:知情 / 机构参与者占比高的票,重心对跳空的反应敏感,相关为负且稳定;散户追涨型的票,重心与跳空的关系弱或为正。这是个股内部、两个日度序列的 60 日 Pearson 相关(取值 [-1, 1],无量纲),量的是"参与者结构对隔夜消息的反应方式",是慢变量(窗口 60 日),换手低。因为是个股内相关,深沪两市收盘集合竞价规则不同造成的重心水平差被抵消(水平差在相关里不出现)。

    【算子怎样实现】G = div(day_open(Open), cross_delay(day_close(Close), 1)):第 t 日第一个有效分钟的开盘价除以第 t-1 日最后一个有效分钟的收盘价,09:30 就已知。重心 day_centroid(Amt) 是第 t 日全天的量,在收盘后才算完,信号在 t 日收盘后形成、不含 t 日之后的任何数据,没有前视。cross_corr(x, y, d) 是过去 d 个交易日(含当日)的滚动相关。种子分七族:(1) G 的窗口 40 / 60 / 120;(2) 被耦合的量换成 |G-1|(跳空的大小而非方向)、滞后一日的 G(消息反应是否延续);(3) 换成别的"冲击"——成交额的日环比对数、前一日收益、减去日内收益的隔夜项;(4) 换成同日的净买入比例 day_signed_ratio(Ret, Amt)、成交额加权分钟收益 day_wmean(Ret, Amt)(价格压力方向);(5) 换成集合竞价分钟的成交额占比;(6) 重心换成 Amt 重心减 Volume 重心(成交价的日内漂移)再对 G 做相关;(7) 两条耦合的秩相加、耦合的 20 日平滑。每个种子原样含 day_centroid(Amt)。

    【和库里已有的不同】库里全是水平型(重心 / 尾盘份额的均值与分位,再加 ListAge 沉底);这里是两个序列的相关,看的是"关系"而不是"水平",在另一个种子里与水平型 head 的 |ρ| 在 0.1-0.25,所以不会触发库禁令;"外围"(cross_corr 加 G)也与本种子已见过的含该核心的外围(cross_mean 平滑、ListAge 筛选、z-score、分位、对流通股本取残差)完全不同。

    【数值与陷阱】cross_corr 在窗口内方差为 0 时返回约 0(分母加了 EPS),不会出现除以近零的爆点;窗口内只有很少有效日(刚复牌的票)时相关可能是假的 ±1,这样的票占比约 7%,在秩上只落在两端,不是系统性的前视或定义坏掉。前 60 日是热身期,缺失而不是填充。

    【样本外为什么还会在】T+1、涨跌停、集合竞价规则和散户占比高、不能卖空,都是制度性的、长期不变的;信号是个股内相关(慢变量,60 日窗口);另一个种子里这一族 valid 分数高于 train(1.45 -> 2.40),没有符号翻转;如果在本种子里只是 train 的拟合,min(train, valid) 会直接把它挡在门外。
