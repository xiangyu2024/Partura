- type: N
  inspired_by: 本种子 r2 的相关度表与 M 第 1-3 批:所有含重心 / 尾盘份额的 head 都是水平型,互相 |ρ| 高,第 3 批的唯一非重心 head(M3,+1 方向)来自"极端分钟的位置 day_argmin(Ret) 与成交额加权收益的波动"这类二阶 / 时点结构;同时另外三个种子(903、908、911)的 r2 / r3 定位表(只含 train / valid 数)里,"集合竞价分钟成交额 day_first(Amt) 与当日成交额形态量的 60 日滚动相关 / 回归"反复出现且分数 1.2-2.1,与重心水平 head 的 |ρ| 只有 0.1-0.3。
  hypothesis: |-
    【现象】本种子 9 个 head 全是水平型(8 个是重心 / 尾盘份额,1 个是极端分钟位置的回归残差);水平型被库禁令占满。要找新 head 必须换"形式",不换"主题"也行:主题仍是"一天里谁在什么时候交易",形式改成个股内部的滚动相关 / 回归。M 第 3 批里非重心的那个 head(day_argmin(Ret) 的 50 日位置对成交额加权收益波动做回归残差)说明时点型的二阶量也有信息。其他种子(903、908、911,同数据同尺子,只含 train / valid 数)的定位表里,"集合竞价分钟的成交额 day_first(Amt) 与当日成交额形态量(峰度 day_kurt、极端分钟比 day_es_ratio_hi、偏度)的 60 日滚动相关"得到 train / valid 都在 1.2-2.1 的 head(valid 一般不低于 train),且与重心水平 head 的日度秩 |ρ| 在 0.1-0.3。

    【机制】day_first(Amt) 是 09:30 集合竞价那一分钟的成交额,承接隔夜消息、基金申赎、机构调仓指令(知情 / 机构参与者)。day_kurt(Amt) / day_es_ratio_hi 度量当天成交额是否集中在少数几分钟("尖峰日")。两者的 60 日相关回答:这只票的"尖峰日"是不是由开盘集合竞价带起来的?相关为正且稳定 = 放量主要由隔夜信息 / 机构订单在开盘集中释放(信息驱动、持仓者结构偏机构);相关弱或为负 = 尖峰来自盘中散户追涨、涨停尝试(情绪驱动)。因为是个股内部的相关,交易所规则和流动性的水平差被抵消,换手低(窗口 60 日)。

    【算子怎样实现】cross_corr(x, y, d) 是过去 d 个交易日的滚动 Pearson 相关;cross_reg_fvalue(x, y, d) 是 y 对 x 滚动回归的 F 值(无量纲,>= 0);day_first(Amt) 为当日第一个有效分钟(09:30)的成交额,day_last(Amt) 为最后一个有效分钟(15:00)。种子分五族:(1) 竞价分钟 vs 形态量:峰度、极端分钟比(Amt / Volume)、偏度、集中度;(2) 竞价分钟占比(对全天成交额)vs 隔夜跳空 G = day_open(Open) / cross_delay(day_close(Close), 1)、vs 前一日成交额;(3) 竞价分钟 vs 盘中价格量:日内波动 day_std(Ret)、净买入比例 day_signed_ratio(Ret, Amt);(4) 把"开盘"换成"收盘分钟"和"尾盘 30 分钟份额",检验是不是只有开盘那一端有信息,并给出开盘端减收盘端的差;(5) 窗口 60 与 120 日。全部是当日及以前的数据,信号在收盘后形成,没有前视。

    【和库里已有的不同】库里没有任何一个 head 用到 day_first(Amt),也没有任何一个用到 cross_corr / cross_reg_*;所有 head 是水平 / 分位 / 筛选。这里是"关系"型信号,取值范围固定(相关 [-1, 1]、F 值非负),与重心水平族在另外几个种子里的 |ρ| 为 0.1-0.3。

    【数值与陷阱】day_first(Amt) 在停牌日整日缺失(不是 0);cross_corr 方差为 0 时返回约 0,不会有除以近零的爆点;day_es_ratio_hi 在分位数接近 0 时为缺失(已在算子里处理),覆盖率略低;刚复牌、窗口内有效日很少的票相关可能是假的 ±1,占比约 7%,只落在秩的两端。day_first(Amt) 本身是 day_kurt(Amt) 采样的一个分钟,两者有机械关联,但不同股票的相关水平、稳定性不同,这正是被度量的东西。前 60 日是热身期,缺失而不是填充。

    【样本外为什么还会在】集合竞价制度、T+1、涨跌停、散户占比高、机构调仓集中在开盘,是长期制度性的;信号是个股内的 60 日相关(慢变量);其他种子的同族 head valid 分数不低于 train,没有出现符号翻转;在本种子里如果只是 train 拟合,min(train, valid) 会挡掉它。
