slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [3, 4, 12, 13, 14, 16]
    reasons: |
      创新度 3。核心 C = div(day_sum(in_slice(Amt,211,240)), day_sum(Amt))(尾盘 30 分钟在当天成交额中的份额)是 H1 = cross_mean(C,20) 的子树,潜变量不新。
      16 个种子都是对 C 的不同读法:极端日(种子 1 cross_max 与 H1 原始 |ρ| 0.69;种子 2 cross_min 与 H4 为 0.54)、分位数(种子 3、4,与 H1 为 0.84 / 0.82)、
      相对自身历史的偏离(种子 6、7 = cross_zscore 240 / 120,与 H1 为 0.62 / 0.57)、与其他日内量的耦合(种子 8–11,cross_corr,与任何 head 的 |ρ| 为 0.20–0.36)。
      耦合与自身历史偏离是新的构造,但度量的仍是 C 的时间结构,所以不给 4。
      核心 C 之前没有 E 位(r1 的 E 位核心是 day_centroid(Amt)),本轮是 C 的第 1 个 E 位,未超过每核心 2 个的上限。外围与已见候选没有重复。
      核心与各控制的原始 |ρ| 最大 0.16(表 slot a core 行),低于 0.8。

      合理度 4。逐个算子核对:in_slice(x,a,b) = x[:, a:b+1],第 211..240 列在 241 列之内;C 的分子是分母的子集,所以 C ∈ [0,1],
      分母为 0 时分子也为 0,得 NaN,没有近零分母。cross_max / cross_min / cross_mean 用 nanmax_last / nanmin_last / nanmean_last,
      cross_quantile_q75 与 cross_tail_mean_q75 用 nanquantile,全缺失为 NaN,没有 nanrank_last 的「缺失返回 0」问题。cross_zscore 有 sd > 1e-6·scale 保护;
      cross_semistd_pos 只对 x>0 取对数变化,零份额日被跳过。cs_regres(Y,X) 是逐日截面 OLS 带截距。ListAge 对开窗时已在册的股票取 10000+t
      (dailyfields._list_age),同日同值。覆盖率 0.997–0.999,distinct 不低于 0.996,面板非常数。
      需要记下、但不作挡的理由:
      (i) cross_corr(种子 8–11)经 rolling_pair_reduce 实现,分母为 sqrt(var_x·var_y)+1e-9:窗口内一条腿常数或有效对不足 2 时输出 0,不是 NaN。
      方案写的「无定义,不会伪造数值」与代码不符。覆盖面小(distinct 1.0 说明 0 的并列块可忽略),但 PI 应改口。小样本(新股的有效对只有 3–5 个)时相关系数近似噪声:
      合成检验(独立正态)中 n=3 时 |r|≥0.9 的概率约 0.29,n=5 约 0.04,n=10 为 0。
      (ii) 种子 5 cross_semistd_pos 对份额的对数变化取平方。合成检验中,30 日份额在 0.05–0.15 之间时半方差约 0.29;若其中一日份额为 1e-4 再反弹,
      同一统计量升到约 1.29。若薄股票的份额下尾常见,这一种子的排序会由少数跳变日决定。控制 liq 的原始 |ρ| 只有 0.13,说明不完全是流动性本身,
      所以不挡,但 PI 应先看 C 的下尾。
      (iii) 种子 8、9 的耦合有机械成分:收盘 bar 同时进入 C 与 es 比率(或 skew)的分子,收盘 bar 大的日子两条腿同时抬高。方案应把这一点写进机制。
      (iv) 种子 15 = ts_quantile_q75(cs_regres(ListAge, C), 20),与库里 H3 是同一个 ListAge 残差结构(H3 原始 |ρ| 为 0.42,库里分数 +1.02)。
      它的排序主要由「老股 vs 新股」与每天回归斜率的符号决定;r1 审计已提示过这一符号问题,同样适用。库里已接受同一构造,所以不挡。
      (v) 方案的预期与表不符:种子 3、4、16 预计 0.5–0.7 或 0.7,实际为 0.84 / 0.82 / 0.94;种子 6、7 预计低于 0.3,实际为 0.62 / 0.57。
      这支持下面的划掉。

      划掉:种子 3、4、12、13、14、16 与 H1 或 H6 的日度秩 |ρ| 为 0.84 / 0.82 / 0.96 / 0.93 / 0.92 / 0.94(≥0.7,与自动划掉规则一致)。
      3、4 是对同一份额的分位数换写,12、13 是 H1 的分桶 z-score 换皮,14 是 H6 的换皮,16 是 H1 减开盘份额的同一条线。都与库里某个 head 度量同一个东西,记为重复。
      剩 10 个(1、2、5、6、7、8、9、10、11、15),≥4。种子 6 与 7 只差窗口(240 与 120),属于近似重复,但不是同一表达式,不划。

      如果它有 alpha,最可能来自:收盘 30 分钟份额在 20–30 日内的极端日,以及它相对自身历史的偏离(尾盘被动流量、指数/ETF 申赎与情绪化追涨集中的日子),
      而不是 20 日平均水平本身。
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: []
    reasons: |
      创新度 4。种子 1–11 是 60 日滚动相关(耦合)构造,库里没有 cross_corr 型 head;库里 head 与这 11 个种子的原始 |ρ| 为 0.11–0.41(表 slot b 行),
      不是换写。种子 12–14 是开盘份额 60 日均值的水平读法,是 H1(收盘份额水平)的镜像,与 H1 的原始 |ρ| 为 0.55(种子 12)与 0.40(种子 14),
      作为对照保留,不拉低创新度。

      合理度 3。算子链都能对上:day_first 取第一个非缺失值(通常是第 0 列),day_last 取最后一个非缺失值(第 240 列);day_skew 是 mean(z³),
      |z| ≤ sqrt(n−1),所以 |skew| 不超过约 15.5,不会爆点;day_kurt 的上界约 240;day_gini 的补零与排序写法正确;day_centroid 以 |x| 加权,总额为 0 时为 NaN;
      cs_bucket_demean 按 LogFloatCap 分十分位,桶内 n≥2 才输出。没有前视,覆盖 0.999,distinct 1.0。降到 3 的理由:
      (i) 方案说「cross_corr 在某一腿常数时无定义」,代码输出 0,与 a 位 (i) 是同一个问题。
      (ii) 方案说 day_es_ratio_hi「没有任何近零分母」,代码只在 |q95| ≤ 1e-8 元时返回 NaN。合成检验:一天中 230 分钟各 100 元、11 分钟各 1e6 元,
      es 比率为 1e4;这类薄股票日会把种子 1、3、4、5 的 60 日相关拉到极端。我无法在不读数据的前提下判断这类日在截面上是否常见,所以不挡,
      但 PI 必须先看 es 比率的分布。
      (iii) 机械耦合:种子 1、4、5 中开盘或收盘 bar 进入 es 的分子,大 bar 的日子两条腿同时抬高;种子 7 中开盘 bar 只进入 centroid 的分母,
      两者机械负相关;种子 3 的 X/Y 形式(X = first/es、Y = es)在 X 与 Y 独立时相关也为负,排序主要由 es 的时间波动决定。方案对这几个的机制描述不完整。
      (iv) 种子 1–11 的 60 日相关在新股(有效对只有几个)上输出近似噪声(合成检验 n=5 时 |r|≥0.5 的概率约 0.39)。新股不多,但会落在极端。
      (v) 种子 8、13 的 known 族原始 |ρ| 为 0.48、0.50,种子 12 为 0.49(liq 0.48),接近 0.5 的不合格阈值。残差化后应当下降,但 PI 应确认。
      (vi) 方案引用的 Admati–Pfleiderer(1988)与 Heston–Korajczyk–Sadka(2010)讲的是时间集中与日内收益模式的持续,不是开盘参与与尖峰形状的横截面耦合,引用对不上。
      以上是说明与检验要求,不是数学错误,也不是度量同一个东西,所以不挡。种子之间没有明显重复(种子 1 与 4 只差一次总额归一化,另一条腿不同),不划。

      如果它有 alpha,最可能来自:开盘集合竞价参与与全天成交尖峰形状在 60 日内的同步性,即投资者构成(机构与知情资金在开盘集中、散户与事件资金在尖峰集中)
      在两端的协同,而不是收盘份额的水平。
R:
  - head: 'cross_mean(div(day_sum(in_slice(Amt, 211, 240)), day_sum(Amt)), 20)'
    soundness: 4
    reasons: |
      合理度 4。8 个变体都是合法算子链:in_slice(·,a,b) = x[:, a:b+1];211..239 去掉收盘 bar,196..240 与 181..240 拉长尾部窗口,226..240 缩短;
      cross_ema(·,15) 半衰期 15 日,缺失日被跳过;Volume 版的分子分母同口径。cross_mean 为 nanmean,窗口 30 以内热身影响小。
      与 H1 的原始 |ρ| 为 0.89–0.98,所以替换只会是同一排序上的微调。窗口曲线 10/15/20/40 不单调(+1.53 / +1.19 / +1.81 / +1.31),
      说明 20 日的分数有选择噪声。变体只在样本内挑选,替换判据要求 +0.1,这是合理的,但 PI 应明白这是对样本内噪声的挑选,而不是机制的证明。放行。
  - head: 'sub(sub(day_centroid(Ret), day_centroid(Volume)), day_centroid(Volume))'
    soundness: 3
    reasons: |
      合理度 3。算子都正确(sub / mul 为线性,cross_mean(·,5) 因果)。问题在检验的信息量:
      变体 1(第二条腿 Volume 重心换成 Amt 重心)与 H5 的原始秩相关为 1.00(表 R 2 variant 1)。Amt 与 Volume 的重心之差的量级约 1e-3(这是 r1 方案的估计,这里未验证),
      与排序的截面散布相比很小,排序上完全相同,这是空检验。变体 2、3(权重 3 与 1.5)与 H5 的 |ρ| 为 0.99,权重在 1.5–3 之间对排序几乎不敏感,替换判据很难触发。
      变体 4(5 日平均)与库里 head 的原始最大 |ρ| 为 0.59(H2),残差最大 0.97。机制(价格波动时点减成交量时点)清楚,但变体检验偏弱。建议删去变体 1。放行。
  - head: 'cs_regres(cs_bucket_zscore(cross_mean(day_centroid(Amt), 20), LogFloatShares), LogFloatShares)'
    soundness: 4
    reasons: |
      合理度 4。cs_bucket_zscore 与 cs_regres(·, LogFloatShares) 的链条正确;窗口 25 / 30 与 Volume 版都是 cross_mean,热身无问题。
      与 H2 的原始 |ρ| 为 0.92–0.96。变体 4 去掉了外层 cs_regres,与 why 里「外层不动」的描述不符,但数学上正确,是对外层线性尺寸残差的检验。放行。
summary: '两位都按规则处理:E 位(核心 C)创新 3、合理 4,划掉 3、4、12、13、14、16(与 H1 或 H6 的日度秩 |ρ| 为 0.82–0.96,属换皮)后剩 10 个;N 位创新 4、合理 3,不划种子;R1、R3 合理 4,R2 合理 3(变体 1 与 H5 秩相同,属空检验),全部放行。'
