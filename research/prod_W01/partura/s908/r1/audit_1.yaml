attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: |
      创新度 3。核心 day_centroid(Amt) 是 head1（ts_quantile_q75(cs_regres(ListAge, pow_3(day_centroid(Amt))), 10)）的子树，潜变量并不新。
      但 14 个种子都不是 head1 的换写：corr_1.json 中与 head1 的原始 |ρ| 为 0.03–0.29（核心本身 0.16），残差 |ρ| 为 0.02–0.40；
      head1 的外围（ts_quantile_q75、pow_3、ListAge 作被解释变量）一个都没有用。种子 1–4（对 centroid 做 cross_mean / cross_ema / cross_med / cross_quantile_q25）
      与 liq、known 的原始 |ρ| 在 0.38–0.55 之间（种子 2：liq 0.52、known 0.55；种子 3：liq 0.52、known 0.54），按表的说明接近「控制换写」；
      但做 15 列控制残差后，它们与 head1 的残差 |ρ| 仍有 0.35–0.40，所以不是控制本身，放行。种子 5（cross_zscore）与种子 6（短窗减长窗）
      与 head1 的原始 |ρ| 只有 0.08 与 0.20，是最不同的两个。创新度不给 4：整个位的信号仍是同一个 centroid 潜变量，新的只是估计量与去混杂的方向。
      自动划掉规则：无种子触发（与 head 的原始 |ρ| 最大 0.29；与控制的最大值 0.55 低于 0.8）；核心与各控制的 |ρ| 最大 0.194，低于 0.8。
      如果它有 alpha，最可能来自：早盘（含 09:30 集合竞价，即第 0 列）成交重的股票，是信息先被知情与机构资金消化；尾盘集中的股票，是指数申赎与收盘被动流量，次日回吐。
      时间轴估计量与 cross_zscore 这类证伪种子，能分开是水平还是变化在起作用。

      合理度 4。逐个算子核对：day_centroid 为 sum(t·|x|)/sum(|x|)/(T−1)，sum 为 0 时返回 NaN（ops_ext.py 的 _day 与 tot>0 掩码）；
      cross_* 经 rolling_windows 左填 NaN 的因果滚动，day_* 只用当天分钟，没有前视。种子 1–14 的 coverage 不低于 0.997，distinct 不低于 0.998，面板不是常数。
      需要记下、但不作为挡的理由：(i) 种子 7–10 用 ListAge 作分桶键或回归变量。ListAge 对开窗时已在册的股票取同一哨兵 10000+t
      （dailyfields.py 的 LIST_AGE_SENTINEL，注释写明数据无法说明它们何时上市）。这一块在 _pct_rank 里按列序稳定排序后切成桶，
      所以方案说的「同类股票互比」对老股并不成立，实际是按列序切开的板块式分组。列序携带板块信息，§4 允许，所以不挡，但方案对 (b) 的描述不准。
      (ii) 种子 14（Amt 重心减 Volume 重心）在价格整天不动的锁板日，差值在精确算术下为零，只剩舍入噪声。方案说的「量级 1e-3 远大于 1e-7」对有趋势的日子成立，
      对锁板日不成立；占比小，不主导，不挡。(iii) 种子 6 的 60 日均值有 59 日的部分窗口热身，影响小。
  - slot: b
    novelty: 3
    soundness: 3
    struck_seeds: [1, 5, 11]
    reasons: |
      创新度 3。N 位的潜变量是「活动在一天里的时间位置」，与 head1 核心相同；方案自己也说「重心只是它的一个估计量」，所以只是部分新。
      但测量与 head1 不同：未划掉的种子与 head1 的原始 |ρ| 为 0.01–0.24，残差 |ρ| 为 0.03–0.35；价格变动时点（|Ret| 重心，种子 3、4、12）、
      买卖分向的量时点（种子 9）、开盘与收盘占比（种子 6、7、14）、日内走势的线性度（种子 13）都不在库里。
      与控制的关系：种子 10（liq 0.69、known 0.67）与种子 11（liq 0.73、known 0.72）接近控制。种子 11 因下面的算子问题划掉；
      种子 10 未达 0.8、也不是重复，留下，但它在秩空间里大体是流动性的另一种写法（日度 liq |ρ| 为 0.32，20 日均值后升到 0.69），残差化后会大部分被吸收。
      种子 14 与 size 的原始 |ρ| 为 0.37，是收盘集中于大盘股（指数与收盘流量）的已知现象，不算控制重复。
      自动划掉规则：无种子触发（与 head 的原始 |ρ| 最大 0.24；与控制的最大值 0.73，低于 0.8）。
      划掉种子 1、5、11。day_topw_mean（ops_ext.py）取 |w| 的 90% 分位作阈值 thr，并保留所有 |w| ≥ thr 的分钟（注释写明 ties included）。
      一个股票日里 ≥90% 分钟的权重为 0 时 thr = 0，全部分钟入选，输出恰为全天平均时间 0.5。我按同一公式在 numpy 中复现：
      95% 分钟为 0 的随机日输出 0.5000（入选 241 格）；只有第 230 格一笔大额、第 10 格一笔小额、其余为 0 的日子输出 0.5000，
      而按方案语义应接近 0.96；80% 为 0 的日子输出 0.537，没有塌。|Ret| 有量化并列时，入选集从 10% 扩大到 241 格中的 169 格（约 70%）。
      corr_1.json 佐证：种子 1 的 distinct 为 0.68，种子 5 为 0.80，其余种子在 0.998 以上。种子 11 是 cross_ema 作用在同一序列上，
      平滑后 distinct 回到 1.0，但它与 liq 的 |ρ| 为 0.73、与 known 为 0.72，说明它度量的是薄股票（薄股票的日值聚在 0.5，平滑后仍聚在一起）。
      方案假设 (1) 说它「不被分散在全天的小成交稀释」，但在薄股票日它恰好重新引入了这种稀释。这属于 §4 的「面板几乎是常数 / 定义坏掉」，是数学问题，故划掉。
      合理度 3。划掉后剩下的 11 个种子算子链是对的：day_corr 对常数序列返回 0（EPS 分母，不是 NaN），种子 13 因此在收盘不动的日子有一个 0 值的小并列块
      （distinct 0.998，可忽略）；day_centroid(Ret) 在全零收益日为 NaN（coverage 0.997）；in_half(·, False) 返回后半场 120 列，重心按下午尺度归一，与方案 (3) 一致。
      降到 3 而不是 4 的理由：Heston-Korajczyk-Sadka (2010) 支持的是同一日内时段收益模式的持续，不是成交量时间重心的预测力，引用对不上；
      种子 10、12、14 分别是种子 2、4、7 的 cross_mean 平滑，有冗余但不是重复；种子 9 的机制只有「买盘偏晚、卖盘偏早」一句，需要方案补充。
      如果它有 alpha，最可能来自：机构与知情资金的成交集中在开盘与大波动分钟，散户、指数与收盘流量集中在尾盘，这种时间结构由交易制度决定，而不是某一段行情。
R:
  - head: 'ts_quantile_q75(cs_regres(ListAge, pow_3(day_centroid(Amt))), 10)'
    soundness: 3
    reasons: |
      合理度 3。变体只改窗口（20–50）、Amt 换 Volume、去掉 pow_3、q75 换成 q50 或 ts_mean，算子链都正确：cs_regres 是逐日截面 OLS 带截距，
      ts_quantile、ts_mean 因果滚动，没有 §4 的前视、数值伪影或热身主导问题。corr_1.json：与 head1 的原始 |ρ| 为 0.64–0.80，残差为 0.81–0.95，
      控制的 |ρ| 都不高于 0.21。
      需要 PI 注意、但不构成挡的理由：ListAge 对开窗时已在册的股票取同一哨兵 10000+t（dailyfields.py 的 _list_age 与 LIST_AGE_SENTINEL），
      这一块所有股票的 Y 值相同。我用同样结构做了合成检验（未读数据）：这一块的残差总在开窗后上市股票之上（三种情形都成立）；
      块内排序只由 centroid³ 决定，其方向是当日「老股 centroid³ 均值减新股均值」的符号。符号翻转时，块内残差与 centroid 的相关从 −0.99 变为 +0.99。
      所以 head1 的方向是逐日的截面符号，不是固定的经济方向：若真实数据里这个符号多数天数稳定，head1 就是「开窗前上市、按 centroid 排序」的信号；
      若经常翻转，它的一部分是日级别效应。R 的 why 把可疑点归在窗口、Amt 与 pow_3 上，但哨兵回归这一部件没有任何变体触及。
      建议在采纳窗口结果之前，先统计两种符号的天数占比。这是 head 本身的解释问题，不是变体的数学错误，所以给 3。
      如果它有 alpha，最可能来自：开窗前上市股票中成交重心偏早（或偏晚）的那一部分；拉长窗口只是对同一日信号做更多平滑。
  - head: 'cs_bucket_zscore(day_quantile_q25(High), day_wmean(Open, Amt))'
    soundness: 3
    reasons: |
      合理度 3。变体（cs_bucket_rank、cs_bucket_demean、Volume 加权的分桶键、day_mean(Open)、High 的 q75、day_median(High)）的算子链正确：
      cs_bucket_* 按十分位分组，组内 n≥2 才输出；day_wmean 在权重和为 0 时返回 NaN。没有 §4 的问题。两点需要说明：
      (i) 变体几乎与 head2 同一排序，原始 |ρ| 为 0.85–1.00（变体 3、6 为 0.998，变体 5 为 0.995），所以它们只能当作对 head2 的替换写法，不会形成新 head；
      (ii) head2 的 y（High 的 25% 分位）与分桶键（Open 的 Amt 加权均价）按定义都近似是股价水平，所以 head2 实质是「在同一价格层内比较价格高低」。
      这一点没有任何变体检验。不挡，合理度 3；它的经济机制（价格层内的相对价位，可能与最小变动价位或价格水平效应有关）方案没有说清。
      如果它有 alpha，最可能来自：同一价格层内价格水平的相对位置。
summary: "两位都通过：E 位创新 3、合理 4，14 个种子全部保留；N 位创新 3、合理 3，划掉种子 1、5、11（day_topw_mean 在薄股票上塌成 0.5）后剩 11 个；R1 与 R2 合理度均为 3 放行，但 R1 未触及 ListAge 哨兵部件，R2 与 head2 近乎同一排序。"
