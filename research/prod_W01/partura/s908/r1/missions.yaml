R:
  - head: 'ts_quantile_q75(cs_regres(ListAge, pow_3(day_centroid(Amt))), 10)'
    why: >-
      拆解给出三处可疑:窗口(5 / 10 / 20 = +0.51 / +0.75 / +0.90,单调,10 偏短,20 已是 +0.15 的增益);
      Amt(换成 Volume 为 +0.82,更高);pow_3(去掉后 +0.66,必要性仅 +0.09,不是核心);
      ts_quantile_q75 这个估计量本身没被消融过。变体把有效的改动叠在一起并继续拉长窗口,
      再单独试去掉 pow_3、换中位数 / 均值估计量;全部保持 cs_regres(ListAge, centroid) 不动。
    variants:
      - 'ts_quantile_q75(cs_regres(ListAge, pow_3(day_centroid(Amt))), 20)'
      - 'ts_quantile_q75(cs_regres(ListAge, pow_3(day_centroid(Volume))), 20)'
      - 'ts_quantile_q75(cs_regres(ListAge, pow_3(day_centroid(Volume))), 30)'
      - 'ts_quantile_q75(cs_regres(ListAge, pow_3(day_centroid(Volume))), 40)'
      - 'ts_quantile_q75(cs_regres(ListAge, day_centroid(Volume)), 20)'
      - 'ts_quantile_q50(cs_regres(ListAge, pow_3(day_centroid(Volume))), 20)'
      - 'ts_mean(cs_regres(ListAge, pow_3(day_centroid(Volume))), 20)'
      - 'ts_quantile_q75(cs_regres(ListAge, pow_3(day_centroid(Volume))), 50)'
  - head: 'cs_bucket_zscore(day_quantile_q25(High), day_wmean(Open, Amt))'
    why: >-
      拆解里两个子树单独都很差(-1.35 / -1.33),组合才有 +0.58;High->Low、Open->Close 各自只降到 +0.49,
      说明水平量与分桶量两个叶子都不是烂的。没被检验的是外层的选择:桶内 z-score(受最高价格桶的重尾支配)
      对桶内秩 / 去均值,分桶量的权重(Amt 对 Volume 对等权),以及 q25 这个分位。
      变体只改这些选择,其余结构不动。
