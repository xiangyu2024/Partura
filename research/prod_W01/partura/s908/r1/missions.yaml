slots:
  - type: E
    core: 'day_centroid(Amt)'
    hypothesis: >-
      核心 day_centroid(Amt) = 当天成交额在 241 格分钟轴上的重心 sum(t*|Amt|)/sum(|Amt|)/(T-1)
      (0 = 全部成交在开盘集合竞价,1 = 全部在收盘;定义见 ops_ext.py 的 docstring)。
      证据(只来自 M 第 1 批 + 本组定位,train/valid):含它的已评分候选 26/86,均分 -0.25 对不含的 -1.51(p 约 0);
      单独用它(方向 = 早盘成交重者做多,半衰期 20)train +1.05 / valid +0.41,只差 valid 一点没到 0.5;
      head1 把它与 ListAge 做回归残差后取 10 日 q75 到 +0.75;拆解里 q75 窗口 5 / 10 / 20 = +0.51 / +0.75 / +0.90
      (越平滑越好),Amt 换成 Volume 为 +0.82。
      机制:重心早 = 信息(隔夜消息、竞价缺口)在开盘被先行资金(机构执行、知情者)消化完;重心晚 = 尾盘追涨、
      尾盘拉升和收盘附近的指数 / ETF 申赎流量,这些成交是被动或情绪化的,次日回吐。
      它是股票层面慢变的交易风格(半衰期 20 最好、窗口越长越好),所以值得做的外围工作有三件:
      (a) 把它估得更准(时间轴上换不同的平滑 / 稳健分位 / 下尾估计量);
      (b) 去掉它与别的股票属性的混杂;
      (c) 分清是'水平'还是'变化'在起作用。
      已见外围 = ts_quantile_q75 套 cs_regres(ListAge, .) 套 pow_3。注意 dailyfields.py 里 ListAge 对 2018-01-02 已上市的全部股票取
      10000 + 天数(一个并列块),只有此后的新股才是真实上市天数,所以 head1 的实质是'老股 vs 次新股分组,老股内部按 centroid^3 排序',
      ListAge 在那里当被解释变量 Y。本组 14 个种子一个都不用 ts_quantile_q75 / pow_3 / ListAge 作 Y:
      时间轴估计量用 cross_mean / cross_ema / cross_med / cross_quantile_q25;去混杂方向相反(centroid 作 Y 对 ListAge 回归,或在
      ListAge / 流通股本 / 价格水平的十分位桶内做 cs_bucket_zscore,即同类股票互比,而不是把 ListAge 排在前面);
      cross_zscore 与'短窗减长窗'是证伪用的:若水平才是 alpha,去掉水平的写法应当明显变差;
      另外三个把买入分钟(Ret>0)与卖出分钟(Ret<0)的成交额重心拆开,或用 Amt 与 Volume 重心之差
      (= 以成交量加权的日内价格趋势,按 Cov(时间, 价格)/均价 估计量级约 1e-3,远大于 float32 舍入的 1e-7,不是数值伪影)。
      为什么样本外还在:早 / 晚成交的差别来自谁在交易(知情 / 机构 vs 情绪 / 被动流量),这是市场结构而非某一段行情;
      train 与 valid 里它独立站得住(+1.05 / +0.41);新尺子已经去掉了流动性、波动、反转、已知族与市值的线性 / U 形 / S 形暴露,
      而定位里 centroid 单独与已知族的日度秩相关只有约 -0.19。预计与 head1 的 |ρ| 在 0.3-0.65,不会被库禁令一刀切掉。
