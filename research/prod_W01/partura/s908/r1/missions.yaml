  - type: N
    hypothesis: >-
      新 idea:被奖励的潜变量是'一天里的活动落在什么时候'(日内时间结构),重心只是它的一个估计量;
      用其他估计量、其他被加权的量、以及买卖方向,检验这个结构本身,而不依赖 day_centroid(Amt) 这一种写法。
      机制与实现:
      (1) 爆发时点 day_topw_mean(in_index(Amt), Amt) = 成交额最大的 10% 分钟的平均时间位置,
      只看大单式爆发何时发生,不被分散在全天的小成交稀释(重心会被分散量压向 0.5);
      day_corr(in_index(Amt), Amt) = 时间与成交额的皮尔逊相关,即'后重 / 前重'的方向性度量,量纲与重心不同。
      (2) 价格发现时点 day_centroid(Ret) = |Ret| 的重心,即价格波动发生在早还是晚;
      与 Volume 重心之差 = 价格动在没有量时(尾盘薄成交拉动)还是有量时(开盘吸收);
      day_topw_mean(in_index(Amt), Ret) = 涨跌幅最大的 10% 分钟出现在什么时间。
      (3) 参与度:开盘 30 分钟成交额占比、最后 30 分钟占比(in_slice 取 0..30 与 211..240 格),
      以及下午半场内部的重心(in_half(., False),只看 13:00 后是否向收盘加速)。
      (4) 买卖方向的时间差:上涨分钟成交量重心 - 下跌分钟成交量重心,= 买盘集中在晚、卖盘集中在早的程度;
      day_corr(in_index(Close), Close) = 日内价格路径对时间的线性度。
      (5) 其中几个加了跨日平滑 / 对自身历史标准化,因为已知这个结构慢变。
      与已见的差别:head1 = ListAge 残差 + centroid^3 + q75;head2 = 价格十分位桶内 z-score。
      本组没有一个种子带 ListAge、pow_3 或桶标准化,也不含 day_centroid(Amt);
      量纲上是比例 / 相关 / 位置,不是价格或额的水平,所以与流动性、市值控制的秩相关预计很低。
      为什么样本外还在:机构与知情资金倾向在开盘和大波动时段集中成交,散户情绪流倾向在尾盘和冲高时段,
      这种'谁在何时交易'的结构由制度(涨跌停、T+1、收盘集合竞价、指数申赎)决定,不依赖某一年的风格;
      Heston-Korajczyk-Sadka(2010)已记录日内同一时段的截面收益模式会持续数周,时间位置本身带信息。
    literature:
      - source: 'Heston, Korajczyk, Sadka, Intraday Patterns in the Cross-Section of Stock Returns, Journal of Finance'
        year: 2010
    inspired_by: >-
      第 1 批:含 day_centroid(Amt) 的候选 26/86,均分 -0.25 对 -1.51,p 约 0,是批里最强的富集;
      head1 以它为核心,Volume 版比 Amt 版更好(+0.82 对 +0.75),窗口越长越好;
      启发:被奖励的更可能是'活动的时间位置'这个潜变量,重心只是其中一种估计。
