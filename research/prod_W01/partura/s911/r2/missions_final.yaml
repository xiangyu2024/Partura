  hypothesis: 核心 P = ts_quantile_q75(day_close(Low), 10) 是后复权价格水平(收盘分钟的 Low 取 10 日
    75 分位),它在截面上的排序约等于 「基期以来的累计收益 + 起始名义价位」,是换手极低的慢变量;但它单独不赚钱(拆解里 P 自身 sufficiency
    为 train -1.30 / valid -0.44)。 已有两个 head 是独立发现的同一个骨架:M2 的 div(cs_last_low20(A,
    P), A) 与 Pr1b 的 ts_quantile_q25(cs_last_low20(neg(day_quantile_q75(Volume)), day_last(Close)),
    10),即 cs_last_low20(某个成交量量, 价格水平):价格水平最低的 20% 整体压到最低(秩 -1),其余按成交量量排。 两个关键观察:(1)
    同一批里连成交量都不用、y 换成纯价格 neg(day_quantile_q75(Low)) 的兄弟 ts_quantile_q25(cs_last_low20(neg(day_quantile_q75(Low)),
    day_last(Open)), 5) 也有 train +0.22 / valid +2.04, 说明起作用的是 P 分位上的「断点」,不是成交量;(2)
    当 y 本身也是价格(如上面那个兄弟)时,函数 秩(y) - 1[P 在最低 20%] 是价格秩上的锯齿:在 20% 分位两侧各有一个端点,最低值落在 P
    秩刚好低于 20% 的名字, 最高值落在刚好高于 20% 的名字,P 的两个极端(最低价、最高价)反而落在中间,所以它读的是价格水平的非单调 / 带状暴露(第二个十分位附近);这是我对两个
    head 的一个推断,不是已测结论,本位的种子就是为了直接检验它。 新尺子只去掉对流动性、波动、20 日反转、已知族、市值的线性 / U / S 形暴露,P
    不在控制里,三次多项式也拟合不了 20% 处的断点,所以这个暴露能活下来。 本位只做三件事,全部保持 P 原样在内:(a) 把带状 / 断点直接写出来,不借助任何成交量:neg(abs_(sub(cs_rank(P),
    c))) 取 c = 0.15 / 0.25 / 0.35(V 形,最高处就是 P 秩在 c 附近的十分位), 锯齿 cs_last_low{10,20,40}(neg(P),
    P) 在不同断点位置的版本,以及 cross_ema 平滑版;(b) 把成交量那一腿换成「与水平无关的」日内集中度 H = day_wmean(Amt, Amt)
    / day_sum(Amt)(Herfindahl, 不是流动性控制,也不是已有 head 里按 1/A 重排的写法),用 cs_bucket_rank(·,
    P) 在价格十分位内排名、乘积符号翻转 mul(sub(cs_rank(P), 0.2), cs_rank(H))、select_where 分组翻转三种方式,
    检验「成交量腿在价格最低 20% 内外方向相反」这个交互;(c) 对照与迁移:cs_last_low20(H, P) 把 head 1 锯齿骨架里的成交量腿换成无水平的
    H;用 P 做垃圾屏 cs_last_low20(y, P) 去掉最低价格组,y 取 20 日反转 / 低波动, 以及 P 的带状在市值十分位内排名 cs_bucket_rank(·,
    LogFloatCap)(看带状是不是市值的代理)和 10 日 vs 120 日价格水平之差(慢动量)。 与库里已有 head 的区别:已有 head 都以成交量量为排序主体(M2
    还除以它,令非 G 组按 1/A 倒排),这里种子要么完全没有成交量,要么用无水平的集中度,与 head 的秩相关应明显低于 0.7(见相关度表); 外围(abs_
    / sub 常数 / 锯齿 neg(P) / 分桶 / select_where / mul 交互)与快照里含 P 的 15 个候选的写法(cs_last_low20(A
    族, P) 及其包装)都不同。 样本外还会在的理由:低价 / 长期累计跌幅大的股票是 A 股散户彩票偏好与垃圾股定价的制度性集中地,带状的两侧(最差十分位含
    ST 与退市风险,第二个十分位是「便宜但没坏」) 的定价差异来自投资者结构与退市制度(2020 年底起面值退市规则收紧了价格左尾),不依赖某一年的风格。风险:三个
    head 的 valid 都明显高于 train(valid +2.3 到 +3.2,train +0.8 到 +1.2), 说明 2022 年之后这个暴露更强,样本外可能更接近
    valid 而不是 train;所以放了多个断点位置和平滑版本,看哪个在 train 上也站得住。
