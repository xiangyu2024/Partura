    +1.45 / valid +3.34),比原 head 的 +1.19 高 0.27,train 是瓶颈(原 train +1.19、valid +3.16);
    拆解里 P 的窗口(5 / 20)和 Low->High 都是 +1.14 到 +1.17,不敏感,所以这些不动。 变体:Amt 化本身(已测);Amt 化后再动
    train 薄弱处的三个参数:断点大小(cs_last_low10 / low40)、分母幂(原 2.5 -> 3, 拆解里幂降到 1 时 train 从
    +1.19 掉到 +0.69,valid 掉到 -0.50,方向是越大越好,两点外推)、P 换成 ts_quantile_q75(day_close(Open),
