- type: N
  hypothesis: '开盘 / 收盘集合竞价参与度的慢变量。机制:A 股一天的成交由三类流组成:开盘第一分钟(通常含集合竞价撮合量,隔夜信息与挂单的集中撮合)、盘中连续竞价(散户与高频主导)、
    收盘最后一分钟(基准价 / 指数基金 / 机构收盘价成交)。一只股票每天把多大份额的成交额放在开盘分钟、多大份额放在收盘分钟,反映的是机构 / 信息交易者与散户在它身上的构成,
    是结构性的、变化很慢的性质,与总成交额的水平(流动性控制)和按分钟的波动无关。算子实现:O = day_first(Amt) / day_sum(Amt)(开盘分钟份额)、
    C = day_last(Amt) / day_sum(Amt)(收盘分钟份额)、H = day_wmean(Amt, Amt) / day_sum(Amt)(整天成交额在分钟间的集中度,Herfindahl),分母是当天总额所以三个量都是
    0 到 1 的份额, 与水平无关;再用 60 日 cross_mean / cross_med / cross_ema / cross_stddev 累积成慢变量(换手远低于单日量),并给出
    O 与 C 的差和比、对数比(抗收盘分钟成交极小的爆点)、 在流动性十分位内排名(cs_bucket_rank 对 cross_mean(day_sum(Amt),
    60))、在市值十分位内去均值、10 日与 60 日的偏离(开盘份额突然抬升 = 事件)、O 与当日总额的 60 日相关等写法。 还放了一个对照种子 cross_mean(day_at_max_ratio(Close),
    60)(当日收盘价被钉在最高价的时间份额,涨停锁定接近 1),用来判断 head 3 的真实来源: head 3 里 day_first(Volume) /
    前一日 day_last(Volume) 在 60 日均值里被「收盘分钟成交极小」的日子主导(比值可以到几十至几百,这是估计,未实测),这既可能是开盘 /
    收盘的构成差异,也可能只是涨跌停封板日的计数, 两类种子一起评估即可区分。为什么是新的:库里的 head 3 用的是「首分钟股数 / 前一日末分钟股数」的比值再取
    60 日均值(重尾,由极端日决定),这里全部用当日总额做分母的有界份额, 与 head 3 的秩相关应明显低于 0.7;共性表里没有任何含 day_first(Amt)、day_last(Amt)
    或 day_sum(Amt) 做分母的子树,日内形状量(day_centroid(Volume) 等)出现过 7 到 12 次但没有富集, 这里不是单日形状,而是
    60 日累积的份额。灵感:第 1 批 Pr1b 里我的隔夜 / 日内收益种子 94 个全部 ≤ -0.13,而 GP 把其中一个把 Open 换成 Volume
    之后变成 head 3(score +0.82), 说明有信息的是首末分钟的成交量,不是首末分钟的价格。样本外还会在的理由:集合竞价制度、T+1、基准价成交与机构占比都是制度性的,份额的横截面差异是慢变量,不依赖某一年的行情;
    风险是沪深两所的收盘撮合安排不同且历史上有过变化,C 在交易所之间可能不可比,所以放了在市值 / 流动性分桶内的写法,并且不依赖 C 单独成立。'
