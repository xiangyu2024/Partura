  core: cross_scale(LogFloatCap, 241)
  hypothesis: 核心 cross_scale(LogFloatCap, 241) = LogFloatCap_t / (过去 241 个交易日 LogFloatCap
    之和,缺失日不计)。它实际度量的是两件事, 并且都是「相对自己历史」的慢变量:(1) 上市不满 241 个交易日的股票,分母只有上市以来的几天,值约等于 1/上市天数,所以截面上「越新越靠前」,
    这是一个按股票自身上市天数算出来的上市龄通道(次新股),不是样本起点的数值热身问题,样本起点的热身只影响 2018 年最初几周; (2) 上市满 241 天的股票,值
    ≈ (1/241)×(现在的对数流通市值 / 一年均值),即一年尺度的市值漂移(价格趋势加解禁带来的流通股本扩张),变得很慢。 快照里含该核心的 7 个候选平均
    -0.06,不含的平均 -1.56,p = 0.0001,是 98 个候选里最清楚的一个富集,说明新尺子下真正起作用的是这个慢通道,而不是日内统计量。 这一轮外围要试的是:核心排出来的头部既包含次新股也包含大幅涨过的老股,里面混着买不到
    / 追不得的名字,所以外围只做「把核心排出的头部洗干净、并给它配一个独立的第二条线索」, 用的都是 M 的候选里没有出现过的算子家族:(a) 上市天数 ListAge
    与连板冻结(day_flat_ratio、day_at_max_ratio)的排除屏 select_where / cs_last_*, 剔除上市头 15
    日的连续一字板和近几日被封死的名字;(b) 在流动性十分位或市值十分位内部排(cs_bucket_rank),让头部成分不再被某一档独占; (c) 把核心的秩与一个独立线索的秩相加减:低波动、金额加权的上涨分钟占比(day_signed_ratio)、近
    20 日涨停停留时长(day_at_max_ratio)、总股本 / 流通股本之比 LogTotalCap - LogFloatCap(限售股占比,即未来解禁供给压力);
    (d) 带状态的写法 cs_flip_by_state:次新股溢价在市场活跃期与冷清期方向不同。这些外围与 M 见过的写法不同:共性表(出现 ≥ 5 次的子树)里与该核心同现的都是
    day_* 日内统计量与 cross_scale 的随机组合,没有 ListAge、select_where 屏、cs_last_* 排除屏、cs_bucket_rank
    分桶、限售占比这类写法。 样本外还会在的理由:新股上市后流通盘小、研究覆盖少、散户炒新,以及限售股解禁的日历是制度性的、每年重复的供给冲击,这条通道靠制度而不是靠某一年的行情;
    主要风险是 2023 年全面注册制带来新股定价与首日涨幅的变化,所以外围里放了与上市龄无关的第二条线索和限售占比,避免全押在上市龄上。
