- type: N
  hypothesis: 隔夜 vs 日内收益的「客户群」分解:把一天的收益拆成 隔夜 ON = day_first(Open) / 前一日 day_last(Close)
    - 1 与 日内 ID = day_last(Close) / day_first(Open) - 1, 在 60 到 120 个交易日上累积(cross_mean
    / cross_ema / cross_med)。机制:A 股隔夜(集合竞价加夜间消息)主要反映机构与信息交易者的持仓调整, 日内主要是散户的追涨杀跌与随后的回吐(T+1、涨跌停、散户占成交额约六到八成),所以「收益主要来在隔夜」的股票持续有机构需求,
    「收益主要来在日内」的股票是被散户情绪抬起来、之后回吐(Lou-Polk-Skouras 2019 的 tug of war 在美股成立,A 股的客户结构更极端)。
    这个划分和五个控制度量的东西不同:20 日反转与波动、金额波动族度量的是总收益的大小和方向,而不是同一份收益在一天里的哪一段发生; 去掉对控制的线性 / U
    / S 形暴露后仍剩下「同样总收益,来源不同」这一维。算子怎样实现:ON 与 ID 只用 Open、Close 两个日频聚合, cross_delay(day_last(Close),
    1) 取前收,前视不存在(开盘价与前收都在当日收盘前已知);除法只用价格(不近零),并且在 cross_mean 之后,单日跳变被 60 日窗口摊薄; 变体里还放了只看符号的版本
    is_gt(ON, 0)(对涨停一字板的巨大隔夜跳空不敏感)、中位数版本 cross_med、下尾均值 cross_tail_mean_q25(ON, 60)(坏消息跳空是否被压住)、
    跳空与日内之间的 cross_corr(跳空被日内回补的程度)、以及对市值十分位去均值的 cs_bucket_demean。 为什么是新的:共性表(出现 ≥
    5 次的子树)里没有含 day_first(Open) 或前收的子树,日内统计量 day_centroid(Volume)、day_pos_ratio(Volume)、day_wstd(Low,
    Open) 出现了 7 到 12 次却都没有显著富集(均值差 +0.28、+0.10、-0.79,p 均 > 0.1), 我的解读是单日、日内形状的统计量在
    15 bp 成本下输给了换手(不是没有信息);这里换成 60 日以上累积的慢变量,同样的日内信息只留下客户群那一维,换手只有日度统计量的几分之一。 样本外还会在的理由:T+1、涨跌停、个人投资者占比、集合竞价制度没有变,客户群的构成是结构性的,不依赖于某一年的风格;
    风险是隔夜与日内两个分量的符号在不同行情下可能换向、以及大幅跳空事件主导均值,所以放了符号版本和中位数 / 分位版本。
  inspired_by: 第 1 批:日内形状统计量(day_centroid(Volume)、day_pos_ratio(Volume)、day_wstd(Low,
    Open))在 7 到 12 个候选里出现却全部不富集, 而显著富集(p < 0.05)的两个子树 cross_scale(LogFloatCap, 241)、abs_(LogFloatShares)
    都是慢变量(换手低),cross_scale(day_wstd(Low, Open), 241) 也偏高(+0.95,p 0.12)——我的解读是在 15
    bp 下损失的主要是换手; 于是取一条日度 Open / Close 里 M 还没碰过的新信息(隔夜 vs 日内),做成 60 日以上的慢变量。
