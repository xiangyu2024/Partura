    reasons: >-
      创新: 库为空; 13 个种子对五个控制的 |ρ| 最大为 0.53 (b11 对 rev), 其余最大为 0.51 (b10 对 vol), 没有一个与控制是同一个东西。这一位的信息是日内拆分: 隔夜 ON = day_first(Open) / 前一日 day_last(Close) - 1, 日内 ID = day_last(Close) / day_first(Open) - 1, 在 60 到 120 日上取均值或中位数, 不是 20 日反转或波动族的换写。它与 PI 引用的隔夜与日内收益差异文献同向, 但在本库里是新的, 创新给 4。合理度给 4: 定义正确, day_first 取当日第一个有效分钟 (common.py 的 first_valid_last), 前收与当日开盘在信号时点前都可得; 信号 t 只用 t 收盘前数据, 回测为 t 到 t+1 (backtest/engine.py), 无前视; 只做价格比, 无近零除法; b9 的分母 std + 0.002 有下界, 不爆点。瑕疵但不挡: (i) IPO 首日 ON 为 NaN (无前收), 而 is_gt (common.py 第 248 行) 把 NaN 变成 0, 所以 b5、b6 的涨日占比把上市首日计为跌日; engine/engine.py 只在非交易日把输出改回 NaN, 所以这是上市后约 60 日内的小幅向下偏差, 不是主要结果, 不划。(ii) b4 的中位数落在价格 tick 网格上 (distinct 0.375), b5 与 b6 是 1/60 与 1/90 步长的量化 (distinct 0.035 与 0.082), pipeline 的 c05_locate 门槛 (coverage 不小于 0.9 且 distinct 不小于 0.5) 判为废品; 但 §4 明确写明列序并列不得据此挡, §3 也只允许数学问题与重复划掉, 所以不划, 仅给 PI 注记。(iii) b13 的 cross_corr 对只有 2 个有效配对的股票给出恰好 ±1 (common.py 的 rolling_pair_reduce 没有最少样本数), 只影响上市最初几日的股票, 不主导截面。b2、b3、b11 是 ON 减 ID 在不同窗口上的平均, 不是同一个量, 不算明显重复, 不划。如果它有 alpha, 最可能来自机构在隔夜调仓与散户在日内追涨回吐之间的客户结构差异, 即收益主要来自隔夜的股票有持续机构需求这一支。
