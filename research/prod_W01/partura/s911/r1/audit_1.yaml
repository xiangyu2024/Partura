    reasons: >-
      库为空: loc.md 的 heads 为 0 个, corr_1 所有行的 head |ρ| 都是 0.00, 库禁令在本轮不起作用; 创新度只能按与五个控制的重合和机制判。核心对五个控制的 |ρ| (corr_1.json 核心行): liq 0.28, vol 0.29, rev 0.26, known 0.29, size 0.005, 都远低于 0.8, 也不是同一个东西。算子层面 cross_scale 是 x / nansum(窗口含今日的 241 日) (AlphaCube dt_cross.py 与 common.py 的 scale_last_ratio): 对次新股即 1 / 上市交易日数 (次新通道); 对满一年的股票即 (1/241) 乘以 X_t 与其一年均值之比 (一年尺度的市值相对趋势)。这两支都不在五个控制里, 所以创新给 4 而不是 3; 不给 5, 是因为一年趋势那一支与库外的经典 12 个月趋势族邻近。合理度给 4: 定义干净, 分母是正的对数市值之和 (LogFloatCap 为对数流通市值, 1e9 到 1e13 元对应 21 到 30), 不会近零除, EPS 分支不触发; 无前视 (信号只用 t 收盘前数据, 回测为 t 到 t+1, backtest/engine.py); 机制清楚。PI 需要核对但不构成数学问题的两点: (i) 若立方体从 2018-01-02 起始, 241 日窗口的前缀由 NaN 截断, 整个 2018 年都在热身, 不只是 PI 写的最初几周 (审计员读不到立方体起点, 无法确认); (ii) 分母只数有限日, 若停牌日的 LogFloatCap 为 NaN, 停牌多的股票会被系统性抬高。逐个种子: 1 select_where(is_lt(ListAge,15), -1, 核心) 把上市不满 15 个交易日的股票压到底部 (common.py 的 select_where 即 torch.where), 相当于纯多头头部剔除次新股头 15 日, 控制 |ρ| 最大 0.28, 通过。2、3 cs_last_high10 把 x 的最高 10% 整个并列块压到底部 (ops_ext.py 的 _lexi), x 分别是 3 日平均冻结比例与 2 日最大的贴顶分钟占比, 对应连板一字与封死, 通过; 注意若顶部同值块超过 10%, 该日屏不生效, 这是设计限制而非数学问题。4、5、14 cs_bucket_rank 在市值或流动性十分位内排序, 4 的 size |ρ| 为 0.00, 5 的 liq |ρ| 为 0.031, 14 是 1 与 4 的组合, 通过。7 核心的秩减去 20 日分钟波动的秩, vol |ρ| 0.588 低于 0.8, 通过。8 核心的秩加上 20 日 day_signed_ratio(Ret,Amt) 的秩, rev |ρ| 0.55 低于 0.8, 通过。9 LogTotalCap 减 LogFloatCap 即对数 (总股本/流通股本), 两个市值用同一天价格, 价格抵消, 即限售占比, size |ρ| 0.307, 通过。10 cs_regres 的 OLS 残差实现正确 (nd_cs.py), 但回归的是原始金额水平, 尾部杠杆使残差的秩与 liq |ρ| 从核心的 0.28 升到 0.555; 这是中度相关加拟合方式的问题, 按规则不挡, 放行; 机制是剔除流动性线性部分后的残差。11 cs_flip_by_state 的状态是当日市场金额均值在近 241 日中的分位 (只用当日收盘前数据), 控制 |ρ| 都不超过 0.092, 通过; 机制是次新溢价在市场活跃期与冷清期方向相反。12 cs_last_low10 把流动性最低的 10% 压底, liq |ρ| 0.459, 通过。13 核心的秩减去 20 日贴顶分钟占比的秩 (近期涨停停留时长), rev |ρ| 0.055, 通过。6 划掉: cross_ema(核心, 10) 是核心本身的 10 日 EMA。核心对已上市股票是 241 日慢变量 (相对一年均值的对数市值), 截面散布远大于单日噪声, 平滑后秩序几乎不变; 次新股的 1/k 本来就在顶端。它没有实现 PI 说明的任何外围 (a) 到 (d), 按明显度量同一个东西划掉。注意: 核心与种子 6 的 |ρ| 不在 corr_1 表里, 这是依据算子语义的推断, PI 可以核对。如果它有 alpha, 最可能来自次新股上市初期的定价偏差与散户炒新 (1/上市日数那一支), 其次是一年尺度的市值相对趋势。
  - slot: b
