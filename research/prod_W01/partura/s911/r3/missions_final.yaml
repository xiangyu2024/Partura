    日 cross_corr 再被这些极端值支配(规则 §4 的除以近零量)。依据:拆解里 knockout 外层 div 得 cross_corr(day_first(Amt),
    ES, 60) 的 train +1.88 / valid +2.22,比原 head 的 +1.47 高 +0.41(原 head 的内层相关单独做 sufficiency
