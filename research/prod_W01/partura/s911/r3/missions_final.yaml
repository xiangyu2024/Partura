  core: day_es_ratio_hi(Amt)
  hypothesis: 核心 ES = day_es_ratio_hi(Amt):一天 241 个分钟成交额里,高于当日 95% 分位的那些分钟的均值除以该分位,是无量纲的右尾形状(接近
    1 = 没有尖峰,越大 = 尖峰越极端)。分子分母同量纲,所以它与流动性 / 市值 / 金额波动这三个水平型控制应当几乎正交(未实测,相关度表会给出)。ES
    单日版不赚钱(拆解里 sufficiency 为 train -3.81 / valid -5.40,换手吃光了),它的价值全在第 2 轮 Pr2b 里作为「耦合」的
    Y 腿:含它的 7 个候选平均 +0.97、不含的平均 -0.98(p 0.000,共性表第一名);head cross_corr(div(day_first(Amt),
    ES), ES, 60) 是 train +1.80 / valid +1.79,train 与 valid 持平(13 个 head 里其余多数是 valid
    远高于 train,价格水平族尤其如此);拆解把外层 div 拿掉得到 cross_corr(day_first(Amt), ES, 60) 的 train
    +1.88 / valid +2.22,说明起作用的是「60 日窗口里,首分钟(含开盘集合竞价撮合)成交额大的日子,是否也是全天成交额尖峰最极端的日子」这个相关本身;窗口
    30 时 train 掉到 +0.37、窗口 120 时 valid 掉到 +0.69,60 在两头之间。我的读法有两层,而且要诚实地分开:(1) 部分耦合是机械的——首分钟一旦很大就落在
    ES 的尖峰集合里,所以 corr(首分钟额, ES) 在读「开盘竞价在全天尖峰里的权重」,也就是开盘端成交的结构性集中程度(机构 / 信息交易者挂单集中在竞价,散户分散在盘中),它是股票的慢性质,不是每天的随机事件;(2)
    另一部分是真耦合——尖峰是否由开盘信息驱动。两层都有机制,但库里所有可见的含 ES 候选(前五名与 head)的 X 腿都是 day_first(Amt)
    的某种写法,没人试过把 X 腿换掉,所以没法分辨 alpha 究竟住在机械重叠里还是真耦合里。本位的任务就是保持 ES 原样做 Y 腿,只换外围,让数据分辨:(a)
    X 换成日内时序另一端和重心:收盘分钟额 day_last(Amt)(深市有收盘集合竞价、沪市没有,所以顺带检验交易所差异)、收盘份额、时间重心 day_centroid(Amt)、全天总额
    day_sum(Amt);(b) X 换成不机械落在尖峰集合里的价格端信息代理:隔夜跳空绝对值、日内收益绝对值、分钟收益波动 day_std(Ret)、净买入压力
    day_signed_ratio(Ret, Amt)、分钟收益绝对值的右尾形状 day_es_ratio_hi(abs_(Ret))、Volume 口径的
    ES;(c) 滞后版 cross_corr(day_first(Amt), cross_delay(ES, 1), 60) 与 cross_corr(cross_delay(day_first(Amt),
    1), ES, 60):如果开盘集中是慢性质,隔一天的耦合应当几乎一样强,如果是当日事件则会消失;(d) 估计量与组合:回归系数 cross_regbeta、开盘端减收盘端的耦合差、耦合减去
    ES 自身的 60 日水平(cs_rank 之差)、以及 cross_mean(ES, 60) 水平版作对照,检验是耦合还是水平。这些外围与快照里已见写法的差别:已见的都是
    cross_corr(div(day_first(Amt), ·), ·, 60) 一型,X 腿全是首分钟额;这里 X 腿是别的量,外围算子集合(abs_
    / sub / div(Close, Open) / cross_delay / cross_regbeta / cs_rank / day_std 等)与已见候选都不同;与库里
    13 个 head 的秩相关,首分钟额 X 腿的(如 cross_regbeta 那条)可能偏高,其余应明显低于 0.7(相关度表)。样本外还会在的理由:开盘集合竞价的制度、T+1
    与涨跌停下机构 / 散户的成交构成、两所收盘安排都是制度性的,一只股票成交时间结构的集中度是慢变量(60 日窗口两天之间只换 1/60 的样本,换手很低,15
    bp 吃不掉);相关系数无量纲有界,不依赖某一年的市场水平。风险:valid(2022 年后)比 train 强是这批 head 的普遍形态,本核心的 head
    恰好持平,说明它受风格影响小;但价格端 X 腿大概率无效——第 1 轮 N 位 99 个评分里 94 个 ≤ -0.13,我写的隔夜 / 日内价格种子(含价格对价格的
    cross_corr)全部在其中——所以这一类放的是检验而不是押注。
