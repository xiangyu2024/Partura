- type: N
  hypothesis: 成交日类型学:一只股票的成交日分哪几种,在 60 日里各占多大比重、与价格怎么联动。第 2 轮 Pr2b 的 N 位在开盘端发现了一整族:60
    日滚动 cross_corr(首分钟成交额(或其占全天份额), 全天成交额的形状 / 总额),8 个 head、14 个过线,最好的两个 train 与 valid
    都很接近(+1.80 / +1.79、+1.47 / +1.61),不像价格水平族那样靠 valid 撑分。我对这一族的解释是,相关系数把「开盘竞价承载了多少全天成交」做成了无量纲、有界、变化很慢的股票性质(每天只换
    1/60 的样本)。本位把这个思路对称地推广到三个还没人碰过的方向,每个方向都用 Amt 口径或价格口径的已有算子实现:(1) 收盘端镜像:cross_corr(day_last(Amt),
    day_skew(Amt), 60)、cross_corr(L, day_sum(Amt), 60)(L = day_last(Amt)/day_sum(Amt)
    是收盘分钟份额,O 是 day_first(Amt)/day_sum(Amt) 开盘分钟份额),以及开盘端耦合减收盘端耦合的差;据我所知深市有 14:57
    起的收盘集合竞价、沪市没有,所以收盘端是否像开盘端一样有信息是真问题,第 2 轮的水平版里 O - C 只有 +0.63,说明 C 腿有东西但弱;(2) 时间维:cross_corr(day_first(Amt),
    day_centroid(Amt), 60)、cross_corr(day_sum(Amt), day_centroid(Amt), 60)——大额开盘是否把全天成交重心前移、放量日是早放量还是晚放量;day_centroid
    是成交额在 241 分钟上的质心(0 = 全在开盘,1 = 全在收盘),与首分钟额、总额的水平无关;再加上形状量 day_gini(Amt)、day_zero_ratio(Amt)(零成交分钟占比,薄盘度)作为
    Y 腿,这两个与 ES / skew 的相关度应低于尖峰族内部的相关度;(3) 量价耦合:开盘份额 O 与隔夜跳空 / 日内收益 / 跳空绝对值的相关(跳空
    = day_first(Open) / 前收 - 1,日内收益 = day_last(Close) / day_first(Open) - 1,前收 = cross_delay(day_last(Close),
    1)),收盘份额与日内收益的相关,开盘份额与净买入压力 day_signed_ratio(Ret, Amt) 的相关,开盘份额与前一日收盘份额的滞后相关(未成交的订单是否顺延到次日开盘,T+1
    制度下有意义),放量与日收益的相关 cross_corr(RT, AV, 60)(RT = day_last(Close) / 前收 - 1),以及 Llorente-Michaely-Saar-Wang(2002)的「量价动态」:收益对前一日
    收益 × 异常成交量 的 60 日相关(投机性成交带动动量、对冲性成交带动反转),AV = 当日总额 / 20 日均额。算子怎么实现:所有价格量都只用 day_first(Open)、day_last(Close)
    与 cross_delay(day_last(Close), 1) 三个当日收盘前已知的量,前视不存在;所有被相关的量都是比值或份额,没有近零分母(份额的分母是全天总额,AV
    的分母是 20 日均额);cross_corr 在窗口内缺失时对子集取相关,停牌日不会制造伪值。为什么和库里 13 个 head 不同:库里的 cross_corr
    head 全是首分钟额对(ES / skew / sum)的耦合,这里的 Y 腿是重心、基尼、零成交占比、收益、异常成交量,X 腿含收盘份额与价格量,与首分钟额
    + 尖峰族的秩相关应低于 0.7(相关度表可验证)。为什么样本外还会在:这些是集合竞价制度、T+1、涨跌停和两所收盘安排下的成交构成性质,不是某年的行情;LMSW
    的机制(信息不对称越大,量越能预测收益延续)来自 2002 年的美股文献,A 股散户占比更高,我推断这条机制不会更弱(这是推断,未测)。诚实的风险:第 1
    轮 N 位 99 个评分里 94 个 ≤ -0.13,我写的隔夜 / 日内价格种子(含价格对价格的 cross_corr(ON, ID, 120))全部在其中,所以纯价格耦合大概率死,本位的赌注在「量
    × 量」与「量 × 价」的混合;若价格腿的种子全部低于 0,而收盘端 / 重心种子活着,说明信息在成交时间结构里而不是在价格里。
