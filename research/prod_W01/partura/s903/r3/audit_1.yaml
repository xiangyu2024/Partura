      创新度 4。核心 G = div(day_open(Open), cross_delay(day_close(Close), 1)) 本身不是 head,但它是 H2(cross_corr(day_centroid(Amt), G, 60))及其 H5、H7 的共同子树,库里已经有 G 参与的耦合。本位的外围不是 H2 的换写,而是换了被耦合的对象:开盘分钟成交额占比、尾盘占比、最大成交额分钟、log 日成交额、冻结与锁板、收盘到收盘的价格反应、G 自己的自相关、日内区间、前 30 分钟收益、G 的对数均值差。表里按规则划掉的 2 号(与 H2 的日度秩 |ρ| 0.78)与 4 号(0.72)不计入审计员的划掉。放行的 12 个与库里 head 的原始 |ρ| 最高为 0.69(1 号对 H2),其余 ≤ 0.48(7 号对 log 成交额 head);残差最高的是 1 号 0.67、5 号 0.66,其余 ≤ 0.36;五个控制的原始 |ρ| 除 15 号的 vol 0.33 外都在 0.25 以下。1 号(开盘分钟占比)与 5 号(最大成交额分钟)与 H2 的时点统计量是近亲,但不是同一个统计量,且 0.69 与 0.67 都低于系统的 0.7 门槛,所以不划。核心 G 与五个控制的 |ρ| 为 0.03/0.08/0.02/0.04/0.04(liq/vol/rev/known/size),满足 E 位条件。按 round 1 与 round 2 的 E 核心记录核对,G 没有在本种子当过 E 核心,符合每核心至多 2 个 E 位。
      合理度 4。逐个算子核对:day_first 取第一个有效分钟,即 09:30 那根,含开盘集合竞价(dt_day.py:129;F103 的版式核对);day_sum 只在整日全 NaN 时为 NaN(common.py:391);day_centroid 在 tot=0 时为 NaN(ops_ext.py:155);day_argmax 忽略 NaN(dt_day.py:169);cross_autocorr_s1 即 cross_autocorr(x,60,1)(catalog.py:164);cross_delay 是按日行移位,前一日为 NaN 时当日 G 也为 NaN(dt_cross.py:150),所以 PI 的已知风险「复牌首日的跳空是多日收益」在这个立方体里不成立,前提是停牌日在立方体里是 NaN 行,PI 请核对停牌掩码的形式;is_gt 把 NaN 变成 0(common.py:248),这是 14 号出问题的地方。全部窗口为 60 日;没有 ts_rank、cross_rank、in_rank_rolling,所以 nanrank_last 的 §4 问题不触发;没有 nt_* 与 ts_spearman;没有前视(G 只用昨收与今开,其余是 t 日收盘后的全日量,只要奖励用的是 t+1 收益,审计员没有逐行核对 books.py)。两处 PI 要知道、但不构成挡的理由:(a) Pearson 对涨跌停日敏感,一字板上 G 为 1.10 量级,60 日相关在有涨停的票上由少数几天决定,这与对 H2 的批评是同一个;PI 已在 notebook 中承认;相关有界,截面上不会爆,所以不是 §4 的数学问题。(b) 沪市 2018-08-20 才引入收盘集合竞价(F103 H9),之后 15:00 那根记入竞价成交;F103 H17 也说明成交峰值常落在 9:31 或 15:00 的制度性分钟。5 号 argmax 对沪市票在 2018 年下半年可能从盘中峰跳到 15:00 那根,与 G 的 60 日相关在窗口跨过该日的票上会带上板块阶跃。PI 应看 2018 年分板块的截面。外围是否与 M 已见的、含 G 的候选相同,审计员只比较了 heads 表(指令如此),这一条 PI 要自己核对。
      放行的 12 个,各一句「如果它有 alpha,最可能来自哪里」:1 号 开盘集合竞价占比与 G:消息越大开盘涌入越多,即消息驱动的开盘参与。3 号 午后连续竞价质心与 G:隔夜消息与午后机构执行节奏的同步。5 号 最大成交额分钟与 G:大跳空日的峰值在开盘还是尾盘,即事件日资金集中在哪一端。6 号 log 日成交额与 G:大隔夜消息是否伴随放量,即量对消息的反应强度。7 号 log 日成交额与 |G-1|:消息强度与放量的同步,即信息驱动交易(Foster and Viswanathan 1993)。8 号 零收益分钟占比与 G:跳空日是否更容易封死,即封板概率与跳空方向的关系。9 号 收盘价钉在日内最高的分钟占比与 G:高开后钉在最高点的频率,即封板与高开的关系。10 号 收盘/开盘与 G:隔夜与日内的拉锯(Lou, Polk and Skouras 2019),隔夜涨、日内回吐的票。11 号 前 30 分钟收益与 G:跳空后早盘是延续还是回补。12 号 日内区间与 |G-1|:消息强度与日内波动的同步。13 号 G 的一阶自相关:隔夜冲击的持续性,新闻聚集或反应滞后。15 号 平均对数隔夜收益减平均对数日内收益:隔夜与日内收益的长期分配,偏向隔夜获利的票。
      通过:创新 4 ≥ 3,合理 4 ≥ 3,划完剩 12 个 ≥ 4;核心与每个控制的 |ρ| < 0.8。
