      合理度 4。逐个核对:day_centroid 是 |x| 的时间重心,归一到 [0,1],tot=0 时为 NaN(ops_ext.py:155),所以 8 号的 day_centroid(Ret) 没有除以近零的 Ret 之和。Ret 的第一根恒为 0(F106 第 A 节,100% 股票-日),8 号的 |Ret| 重心不含隔夜跳空。9 号 day_hurst 在 S < 1e-9 时为 NaN(dt_day.py:252),R/S 只用同日路径。4、5 号的 zero_ratio 是 x == 0 的分钟占比(ops_ext.py:273);5 号因 Ret 首根为 0,占比下限是 1/241,不是常数。4 号的 distinct 为 0.98,说明它在大多数票的 60 日窗口里不是常数;cross_corr 对常数窗口返回 0 而不是 NaN(common.py:621 到 640,cov/(sqrt(var*var)+EPS)),这一效应没有主导 4 号。7 号 signed_ratio 的 Ret = 0 分钟计入分母(ops_ext.py:122),是定义,不是问题。1 号 es_ratio_hi 在分位接近 0 时为 NaN(ops_ext.py:665),2 号 skew 在 241 个分钟上有界,3 号 gini 有界(ops_ext.py:136),都没有爆点。14 号 cs_mean 是当天全市场同一个值,对每只票的 60 日相关给出的是质心对市场放量的 beta,数学上没有问题。没有前视,没有 nanrank_last、ts_rank、cross_rank,没有 nt_* 与 ts_spearman。两项风险:(a) 核心质心在沪市 2018-08-20 有制度阶跃(F103 H9),相关类种子只在窗口跨过那天时受影响,PI 应分段看 2018 年下半年;(b) Pearson 对涨跌停日仍敏感,12 号的前一日收盘/开盘在一字板上为 1。两项都不是数学问题,不挡。
      放行的 12 个,各一句「如果它有 alpha,最可能来自哪里」:1 号 大额成交分布形态与质心:大单扎在开盘还是尾盘。2 号 成交额偏度与质心:偏度主要由开盘竞价那一根决定,alpha 更可能是开盘竞价占比的稳定性,即个股的参与者结构。3 号 成交额基尼与质心:成交是否集中在少数分钟,以及集中在早盘还是尾盘,与流动性同步但未到 0.8。4 号 零成交分钟占比与质心:稀薄成交的票的交易时点是否偏早,即低流动性的时点结构。5 号 零收益分钟占比与质心:封板日的成交是早封还是晚封,冻结状态对交易时点的影响。7 号 净买入压力与质心:开盘集中的日子是涨日还是跌日,资金推动方向与节奏是否同步。8 号 |收益| 的重心与成交的重心:价格变动的时点是否与成交同步,即价格对资金的反应速度。9 号 日内路径的 Hurst 与质心:趋势日的资金是早来还是晚来。10 号 大成交分钟的平均收益与质心:大单时段的收益方向与交易时点,即大单的价格影响。11 号 前一日对数成交额与今日质心:T+1 的放量延续与次日进场节奏。12 号 前一日收盘/开盘与今日质心:前一日日内涨跌后今日是更早还是更晚进场,即 T+1 的追涨或回吐。14 号 质心对全市场平均对数成交额的相关:对市场放量的 beta,可能是指数或 ETF 相关资金的时点。
      通过:创新 4 ≥ 3,合理 4 ≥ 3,划完剩 12 个 ≥ 4;核心与每个控制的 |ρ| < 0.8。
R:
  - head: 'cross_corr(day_centroid(Amt), div(day_open(Open), cross_delay(day_close(Close), 1)), 60)'
    soundness: 4
    reasons: |-
      合理度 4。六个变体的算子都核对过:cs_demean 是当天截面均值的扣除(nd_cs.py:114),cs_rank 是当天截面秩且保留 NaN(common.py:320),cs_winsor 是当天截面 1% / 99% 分位夹逼(ops_ext.py:260),in_slice(Amt,1,239) 去掉 09:30 与 15:00 两根竞价后,质心在切片内重新归一(dt_in.py:324;ops_ext.py:155)。无前视,无除以近零。变体 1、2 去掉的是全市场隔夜大涨的共同成分,机制清楚;变体 3、4 的秩写法确实绕开了 Pearson 的涨跌停支配,是对的修法;变体 6 去掉竞价点,是一个有用的检验,它也不受沪市 2018 年收盘竞价阶跃的影响(F103 H9)。两点要注意:(a) 变体 5 的 cs_winsor 在涨停票超过 1% 的日子里,99% 分位就是涨停价,夹逼不改变它们;表里它与原 head 的 |ρ| 为 0.98,是换皮而非修正。(b) 同一天并列的涨停票在 cs_rank 里按列序打破(common.py:320 的稳定排序),这是 §4 允许的板块信息,不挡,但秩里有一个列序成分,PI 应知道。
  - head: 'sub(cross_ema(day_centroid(Amt), 5), cross_ema(day_centroid(Amt), 60))'
    soundness: 3
    reasons: |-
      合理度 3。算子核对:cross_ema 是因果的、跳过缺失日的指数平均,半衰期即参数(ops_ext.py:172);sub 是短减长,即质心相对自身长期水平的偏离。三个变体的写法没有数学问题。扣分的理由不是 §4,而是机制:两条 EMA 之差对任何水平台阶都有瞬时响应(短 EMA 先跳、长 EMA 慢),它本身就是台阶探测器。沪市在 2018-08-20 引入收盘集合竞价(F103 H9),之后 15:00 那根含竞价成交,质心对沪市票是一个制度台阶;这段时间里差值对沪市票系统性为正,截面排序上就成了板块效应。变体 2、3 把长腿放到 120 与 90 天,这段板块效应会持续更久。这与 PI 写的「参与者结构变化」不是一回事。PI 应看 2018 年下半年分板块的截面均值;若成立,R2 的 train 分数会被抬高。这不是挡的理由,给 3。
  - head: 'cross_corr(day_centroid(Amt), log(day_sum(Amt)), 60)'
    soundness: 4
    reasons: |-
      合理度 4。算子核对:cs_demean 去掉当天全市场的 log 成交额与质心的共同部分(nd_cs.py:114),cs_rank(day_sum) 与取 log 后的截面秩等价。三个变体与原 head 的日度秩 |ρ| 为 0.83 到 0.93(表),是预期的换皮,不构成问题。机制清楚:个股的交易时点与个股的量在相对市场的意义下如何同步,去掉全市场放量日(行情日)的共同部分,这一步是对的。两点要注意:(a) 原 head 的 train 为 1.19、valid 为 0.73,train 高于 valid,与沪市 2018-08-20 的收盘竞价阶跃时段重合(F103 H9);这只是推测,未验证。cs_demean 不去掉分板块的阶跃,三个变体对此没有修正。(b) 质心阶跃通常不明显改变当日总成交额,所以它对相关的影响比对 R2 小。不挡,给 4。
  - head: 'div(day_autocorr_n1(in_decay_linear_rolling(Close, 30)), day_centroid(Amt))'
    soundness: 3
    reasons: |-
      合理度 3。算子核对:in_decay_linear_rolling 是分钟轴上的线性衰减滚动均值(dt_in.py:414);day_autocorr_n1 即 day_autocorr(·,1)(catalog.py:168);cross_mean 是 nanmean(dt_cross.py:223);cs_regres(nd_cs.py:254)与 cs_rank 都没有问题。三个变体的分母用 30 日或 20 日均值,修掉了原 head 中单日质心接近 0 的爆点(那是 §4 的数值伪影),这一点是对的。扣分的是:(a) 分子的截面秩几乎不动,表里原 head 与 day_centroid(Amt) 的日度秩 |ρ| 为 0.98,这个 head 实际上就是 1/质心,分子不带信息;R 的理由「分子分母都放慢」对结果没有贡献。(b) 变体 2 与库里 cs_regres(cs_rank(cross_mean(day_centroid(Amt),20)), cs_rank(cross_mean(day_std(Amt),30))) 的原始日度秩 |ρ| 为 0.98、残差 0.997(corr_1.json),变体 1、3 为 0.84 到 0.86;替换后库里会有两个近乎相同的 head。这不是数学问题,机制(开盘集中的票的参与者结构)说得通,但 R 的论述没有说出分子的作用。给 3。
summary: '种子 903 第 3 轮审计。a 位创新 4、合理 4,表划 2、4 号(与 H2 的 |ρ| 为 0.78、0.72),审计员划 14 号(is_gt 把停牌或缺失日当成 0,distinct 0.018,面板几乎是常数),余 12 个,通过。b 位创新 4、合理 4,表划 6、13 号(与 H6 的 |ρ| 为 0.71、0.93),审计员不划,余 12 个,通过。R1(H2 的 6 个变体)合理 4;R2(EMA 差)合理 3,台阶响应与 2018 年沪市收盘竞价阶跃有关;R3(质心对 log 成交额)合理 4;R4(autocorr 除以质心)合理 3,分子几乎常数,变体 2 与库里的 cs_regres 质心 head 日度秩 |ρ| 为 0.98。没有前视,没有 nanrank_last、nt_*、ts_spearman。PI 需核对:2018 年沪市收盘竞价阶跃、涨跌停日对 Pearson 的支配、外围是否与 M 已见候选相同(审计员只比对了 heads)。'
