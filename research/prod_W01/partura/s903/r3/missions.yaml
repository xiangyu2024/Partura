R:
- head: cross_corr(day_centroid(Amt), div(day_open(Open), cross_delay(day_close(Close), 1)), 60)
  why: |-
    烂的部件是两条腿的「原始值」。Pearson 相关对离群点敏感:跳空比 G 的分布里有涨跌停(+-10% / 20%)和停牌复牌的多日收益,在 60 日窗口里几个这样的日子就能定下相关的符号;
    而且 G 和质心里都有全市场共同的日度成分(大盘隔夜大涨的那天所有票一起高开、一起提前成交),这部分对每只票的相关贡献的是同一个市场相关,不是个股特性。
    依据:拆解里窗口 30 / 60 / 120 = +0.99 / +1.45 / +0.96(估计噪声限制,60 日已是三个里最好的);把隔夜换成日内涨幅翻成 -1.18(个股隔夜消息是关键,大盘隔夜是共同成分);
    train +1.45 低于 valid +2.40(推测:train 段更长,离群日更多地稀释了估计,未验证)。
    变体 1:两腿都按当天截面去均值(个股相对市场的时点与个股相对市场的跳空);2:只去 G 的市场均值;3:两腿都取当天截面秩(Spearman 式,离群点只算一个名次);
    4:只把 G 取秩;5:G 在当天截面 1% / 99% 缩尾;6:质心只含连续竞价(去掉 09:30 与 15:00 两个竞价点,检验 H2 对两个竞价点是否有依赖)。
    这些都保持「质心 vs 隔夜冲击」不变,与原 head 日度秩预期 >= 0.6,是替换而不是新 head。
