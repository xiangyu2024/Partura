- type: E
  core: day_centroid(Amt)
  hypothesis: |-
    核心 day_centroid(Amt) = 当天成交额在分钟轴上的质心(0 = 全在 09:30 竞价,1 = 全在 15:00),本种子唯一站得住的 alpha 来源,这是它的第 2 个(也是最后一个)E 位。
    上一轮 E 的结果(5 个 head,是我预测概率的两倍以上)教会的事:赢的不是质心的水平或离散度,而是质心与「当天别的量」的 60 日时间序列相关:
    质心 vs 隔夜跳空 G(H2 +1.45,H5 +0.92,H7 +0.71)、质心 vs log 日成交额(H6 +0.73);质心 vs 日内收益和、vs 全市场平均质心、cross_stddev、
    cross_semistd_neg、cross_autocorr_s1 都没有成 head。它们共同的特点是「个股内部的相关」,把交易所 / 板块 / 市值带来的水平差抵消,
    因此深沪收盘集合竞价的制度差(水平型 head 的最大隐患)不进入这一族。

    已见过的被耦合量(Z)只有两类:价格冲击型(G 及其变体)和成交额水平(log 日成交额)。本轮把 Z 换成「当天成交额分布自己的形态与状态」,
    六族,都是 60 日相关(换手低):
    (1) 形态:day_es_ratio_hi(Amt)(右尾:高于 95% 分位的分钟均值 / 该分位)、day_skew(Amt)、day_gini(Amt)(有界、不被单个分钟支配)。
        成交额扎堆的日子(算法单 / 事件日)是扎在开盘还是扎在尾盘?质心与扎堆程度的相关为负 = 扎堆发生在开盘(散户 / 注意力 / 抢板),为正 = 扎在尾盘(机构、
        收盘集合竞价);60 日相关把「这只票的扎堆通常在哪一端」估成一个数,同样的度量在水平上是看不出来的。
    (2) 稀薄与冻结:day_zero_ratio(Amt)(零成交分钟占比)、day_zero_ratio(Ret)(零收益分钟占比,涨跌停锁死时接近 1)。锁板日成交几乎全在锁板前,质心偏早;
        质心与冻结占比的相关刻画「这只票的冻结日是早封板还是晚封板」。
    (3) 价格行为:全日 High/Low 范围、day_signed_ratio(Ret, Amt)(上涨分钟的成交额占比减下跌分钟的)、day_centroid(Ret)(价格变动的质心;钱与价格变动是否同步)、
        day_hurst(Ret)(日内价格的持续性,共性表里 day_hurst(Ret) 富集 +1.43,p 0.019,含它的 4 个候选均值 +0.37 对 -1.06)、day_topw_mean(Ret, Volume)(最重的 10% 分钟的平均收益)。
    (4) 滞后(前一日的量对今日时点):cross_delay(log 成交额, 1)、cross_delay(close/open, 1)。T+1 制度下前一日的放量 / 日内大涨之后,今天的资金是更早还是更晚进场,
        是个股特有的「追」的习惯;上一轮的耦合都是同日的,没有滞后项。
    (5) 去掉全市场共同部分:cs_demean(log 日成交额) 与全市场平均 log 成交额(cs_mean)。H6 把个股量与质心的相关做成了 head,但全市场放量日(行情日)里所有票的
        成交额和质心一起动,这部分与个股特性无关;去掉后的相关度量个股自己对量的反应,另一端是质心对全市场量的 beta。

    和库不同:库里含质心的 head 要么是水平(慢均值、EMA 差、午后质心、Volume 质心的中位数),要么耦合到价格冲击或成交额水平;这里被耦合的是成交额分布的形态、冻结状态、价格行为、
    滞后量。预期对 H2 / H6 的日度秩 |ρ| 在 0.1-0.5(上轮同族种子对 head 的最大 |ρ| 都 <= 0.25),对五个控制 < 0.4。
    样本外为什么在:参与者结构决定「扎堆发生在哪一端」,是持续的个股特征;60 日窗口 + 个股内部相关 -> 低换手、不依赖水平差;耦合型 head(H2 / H5 / H6 / H7)在 train 与 valid 都 >= +0.71。
    已知风险:day_skew / day_es_ratio_hi 与质心在开盘集合竞价那一分钟上有机械关系(开盘大单让质心偏早、让偏度偏大),相关为负可能主要是「开盘集合竞价占比的稳定性」,
    这仍是个股特性,但与 H2 的信息有重叠;day_es_ratio_hi 在分位接近 0 时给 NaN;day_hurst 在 Ret 全 0 时没有定义。
