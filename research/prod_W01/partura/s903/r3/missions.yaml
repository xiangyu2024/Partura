  core: div(day_open(Open), cross_delay(day_close(Close), 1))
  hypothesis: |-
    核心 G = div(day_open(Open), cross_delay(day_close(Close), 1)) = 今天第一个开盘价 / 昨天收盘价(后复权),即「隔夜跳空比」:
    收盘后到次日开盘之间到达的消息造成的价格冲击。它在今天 09:30 就已知(分母是昨天收盘),没有前视。
    G 是库里 H2 cross_corr(day_centroid(Amt), G, 60)(+1.45,train +1.45 / valid +2.40)、H5(+0.92 / +2.66)、H7(+0.71)的共同子树,
    也是机械核心卡第 32 条(富集 +0.75,p 0.035,含它的候选 11 个)。本种子第一次拿 G 当核心(E 位 0 次)。

    已读到的事实(都在 train + valid 内):
    (1) 这一族的赢家全是「日内成交时点」与「隔夜消息冲击」的 60 日时间序列相关,而不是 G 或质心的水平:G 单独 -3.94,质心单独 +0.41,合起来 +1.45。
    (2) 起作用的是隔夜消息,不是日内涨跌:把 cross_delay(day_close(Close),1) 去掉(隔夜跳空换成日内涨幅 open/close)分数从 +1.45 翻到 -1.18
        (train -0.59 / valid -1.18);Amt 换 Volume、Open 换 Close 都保持 +1.44 / +1.37;窗口 30 / 60 / 120 = +0.99 / +1.45 / +0.96。
    (3) 它是个股内部的时间序列相关(每只票自己减自己的均值),所以深市 15:00 含收盘集合竞价、沪市没有造成的「水平」制度差在相关里被抵消,
        不是交易所哑变量;水平族(H1)做不到这一点。另一个事实:H2 / H5 / 一条 +0.74 的 open/open 变体都是 valid 高于 train(1.45 -> 2.40,0.92 -> 2.66,0.74 -> 1.83)。
    (4) 被 G 耦合的一侧「对消息做出反应的是什么」,整个种子只试过质心(含 Volume 质心互换、Open 换 Close 互换);log 成交额在 H6 里是与质心耦合的,
        没有与 G 耦合过;日内收益和(day_sum(Ret))也只与质心耦合过,没有成 head,说明不是随便什么日度量都行。G 固定,本轮把「被耦合的对象」整体换掉。

    机制读法:隔夜好消息到达后,这只票的投资者怎么反应,是一个持续的个股特征(参与者结构):注意力驱动的散户在开盘集中涌入(开盘集合竞价占比高、
    成交额放大、冲击后涨停锁死),机构分批执行、尾盘集合竞价参与。Berkman 等(2012)记录了高注意力股票在开盘的买盘压力;Barber and Odean(2008)记录了
    个人投资者对注意力事件的买入;Lou, Polk and Skouras(2019)把隔夜与日内收益分开。60 日的相关把这种反应函数估成每只票的一个数。

    外围(都是 60 日窗口,换手低,15 bp 扛得住),六族:
    (1) 另一种时点度量(替代质心):开盘集合竞价分钟成交额占比 div(day_first(Amt), day_sum(Amt))、尾盘 30 分钟占比 day_sum(in_slice(Amt,211,240))/day_sum(Amt)、
        只含午后连续竞价的质心 day_centroid(in_slice(Amt,121,239))(质心 H11 单独是 head)、只含上午的质心、最大成交额分钟 day_argmax(Amt)。
        这五个与 H2 的度量对象相近,预期有 1-3 个对 H2 的日度秩 |ρ| >= 0.7 被表划掉,保留的就是真的换了写法的。
    (2) 活动量对冲击的反应:log 日成交额与 G、与 |G-1|(消息强度)的相关。放量日是不是冲击日(信息驱动 vs 噪声驱动,Foster and Viswanathan 1993)。
    (3) 冻结 / 锁板对冲击的反应:day_zero_ratio(Ret)(零收益分钟占比)、day_at_max_ratio(Close)(收盘价钉在当天最高的分钟占比)与 G 的相关:
        正相关 = 向上跳空的日子越容易封死涨停。库里的 head 全是时点,没有一个读「封板」本身;共性表里 day_flat_ratio(Vwap) 的富集 +0.56(p 0.13,弱)、
        ts_autocorr_s1(day_flat_ratio(Vwap),5) +0.96(p 0.028),冻结状态在 M 的候选里有一点分,这是本族唯一的样本内依据。
    (4) 价格反应:全日 close/open 与 G 的相关、前 30 分钟收益和与 G 的相关(跳空后延续还是回补)。
    (5) G 自己的二阶:cross_autocorr_s1(G,60)(隔夜冲击的持续性)、cross_mean(is_gt(G,1.04),60)(大幅高开的频率,事件型,注意力 / 博彩偏好)、
        隔夜累计收益减日内累计收益(Lou, Polk and Skouras 的拉锯,慢版)。
    (6) 范围与冲击:全日 High/Low 范围与 |G-1| 的相关(波动对消息强度的反应)。

    和库不同:库里所有含 G 的 head 的另一侧都是质心(或 Volume 质心的互换)。这里被耦合的对象是成交额占比、成交额水平、冻结 / 锁板、价格反应,
    只有 (1) 族与 H2 的度量对象相近。预期 (2)-(6) 对任一 head 的日度秩 |ρ| 在 0.1-0.5,对五个控制 < 0.4(相关统计本身是个股内部的二阶量,
    不带流动性 / 波动 / 市值的水平);新尺子的 15 列残差还会去掉线性、U 形、S 形暴露。
    样本外为什么在:(a) 参与者结构(谁在开盘涌入)比风格轮动稳定;(b) 时间序列相关把水平差(交易所、板块、市值)抵消;(c) 同族的耦合型 head(H2 / H5 / H6 / H7)在 train 与 valid
    都 >= +0.71,而且 H2 / H5 / H7 是 valid > train,不是单个时期的产物。已知风险:Pearson 相关被涨跌停跳空日支配(+-10% / 20% 的一天在 60 日窗口里是 20-30 倍标准差),
    停牌复牌后第一天的「跳空」是多日收益;day_zero_ratio 等在流动性极好的票上接近常数(相关为 NaN,这些票排在中间);一字板日 close/open = 1,
    在 (4) 族里把相关拉向 0。
