- type: N
  hypothesis: '新想法:一只股票的成交"在一天里什么时候发生"是一个持续的个股特征,反映谁在交易它。 机制:日内成交量的时间分布由参与者类型决定(Admati
    & Pfleiderer 1988); 散户的反应式买卖集中在开盘,机构的执行与指数 / ETF 申赎偏向尾盘,隔夜收益与日内收益之间的拉锯(Lou, Polk
    & Skouras 2019; Bogousslavsky 2021)正是这两类人的足迹。五个控制(流动性、波动、20 日反转、day_std(Amt) 一族、市值)都不含"时间"这一维:
    day_std(Amt) 把分钟打乱后只看分散度,day_centroid 保留了先后顺序。 实现:day_centroid(Amt / Volume /
    Ret) 给每天的质心(0 = 全在开盘,1 = 全在收盘); cross_mean(., 20-120) 把它平滑成慢信号,cross_zscore 或"短均值减长均值"只取相对自己历史的偏离,这样去掉了不同交易所尾盘集合竞价制度造成的水平差;
    in_slice 取开盘后 30 分钟 / 尾盘 30 分钟的成交额占全天比例及其差; day_corr(in_index(Amt), Amt) 给另一种加权的"后置程度";
    sub(day_centroid(Amt), day_centroid(Ret)) 看钱比价格走得早还是晚; 隔夜对数收益(log(day_open(Open))
    减前一天 log(day_close(Close)))与日内对数收益的 60 日均值之差,是同一件事在价格上的写法。 和库不同:库里唯一的 head 是价格水平的截面形状,而这些是日内时间轴上的统计量,预期与
    head 的日度秩相关 < 0.2,与五个控制 < 0.3; 它们也不是 head 那个 5% 排除屏的变体,而是把质心本身当信号。 样本外为什么还在:参与者结构(谁在开盘交易、谁在尾盘交易)比风格轮动稳定;20-120
    天平均使换手低; 只取偏离时不依赖交易所制度的水平差。已知风险:早盘停牌的股票缺失分钟使质心偏后,平均后被稀释,且 head 的屏已处理这种极端情形。'
