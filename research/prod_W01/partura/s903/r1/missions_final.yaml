  why: 两个部件值得换。部件 1,屏变量 sqrt(day_centroid(Open)):sqrt 对排序是空操作(拆解里把它换成 day_centroid(Open),分数
    +0.63 -> +0.63,必要性 -0.00), 所以结构其实是 cs_last_high05(核心, day_centroid(Open));而这个屏本身不小(只留抬尾核心
    0.29 / 0.85,加上屏变成 0.63 / 1.13), 问题是它用价格路径的质心去间接代理"当天交易状态异常"(推断:价格质心主要由哪些分钟缺失决定,早盘停牌或晚开的股票质心偏晚),
    屏的宽度(5%)与屏的对象都没被试过;同一批里 centroid(Amt) 版本也出现在最好的一组候选里,说明屏的对象是"异常交易状态"而不是 Open 本身。
    变体直接测量这些状态:冻结报价 day_flat_ratio、涨跌停锁死 day_at_max_ratio / day_at_min_ratio、零收益分钟
    day_zero_ratio、次新 cross_age、成交量质心,并试 10% / 20% 宽度与两端同时屏。 部件 2,抬尾部 cs_mask_top_replace_mean_neg(day_open(Open)):它把最低
    10% 抬到当日"均值", 而重尾价格水平的均值落在哪个分位是不固定的、每天不同(拆解显示去掉它方向翻转,必要性 +1.84,所以它是载体,但块落在哪、多宽从未被试过)。
    变体先对价格取 log / sqrt / pow_2 / winsor 再抬(改变块的落点),连抬两次(块变宽),或改抬高端。
