- type: E
  core: day_open(Open)
  hypothesis: '核心 day_open(Open) = 每天第一个有效开盘价(后复权尺度),它在股票之间的排序约等于从基期起的累计收益。 第 1 批里含它的候选
    76/117(均值 -0.27 对 -1.35,p 0.000),唯一的 head 读的是它的"截面水平": 最低 10% 抬到当日均值,再排除 day_centroid(Open)
    最高的 5%。消融显示单独的水平(sufficiency -1.35,方向 -1)是输的, 抬尾部之后才赢,所以真正有用的是水平在截面上的某种形状,而不是价格自己的时间序列。
    已见过的 76 个候选都只在同一天的截面上读这个叶子,没有一个读它自己的历史。 同一个后复权价格还能读出三件事: (a) 离自己 1 年新高/新低有多远(52
    周高点锚定,George & Hwang 2004); (b) 6/12 个月趋势、跳过最近一个月的动量及其加速度(Jegadeesh & Titman 1993);
    (c) 长周期动量与反转随市场状态翻向(Cooper, Gutierrez & Hameed 2004)。 实现:cross_rank / cross_zscore
    / cross_max / cross_min / cross_mean / cross_delay 在 60-241 天窗口里读核心(慢信号,15 bp
    扛得住); cs_flip_by_state 用核心自己的 60/120 天涨幅的市场均值做状态,让"位置"信号在两种市场里取相反符号; cs_first_high20
    / cs_last_low20 把已见的"抬尾部水平"当入场门槛,门内/门外再按时间序列位置排; cs_bucket_rank 把时间序列位置放进水平十分位内重新排名(与水平正交);
    混合种子里时间序列位置的权重是水平的 2 倍(预期日度秩相关 0.3-0.5,低于库禁令 0.7)。 和已有的不同:这些种子的排序是"相对自己的历史",与截面水平的日度秩相关预期
    0.1-0.4; 库禁令(|rho| >= 0.7)会拒绝一切只是重塑水平的候选,所以 GP 在核心外面只能去长时间序列 / 状态 / 门槛这类结构, 和已见的
    {cs_mask_top_replace_mean_neg, cs_last_high05, pow_3, day_centroid, cross_valid_count}
    这套外围明显不同。 样本外为什么还在:锚定与动量的行为机制(对近期高点的参照、反应不足)在 2004 年前后的美国样本里就有, 与本样本无关,是独立于这份数据的先验;窗口
    >= 60 天,换手低;新尺子已去掉对流动性、波动、20 日反转、Amt 族、市值的线性 / U 形 / S 形暴露, 剩下的是"位置"而不是风格。已知风险:A
    股的 12-1 动量历史上偏反转,方向由评估自己挑;所有窗口都 >= 60 天以避开 20 日反转控制。'
