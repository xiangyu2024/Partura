    struck_seeds: [5]
    reasons: '创新度 4。相关度表里 head 的原始 |ρ| 在 16 个种子上为 0.00–0.59,残差 |ρ| 为 0.00–0.66。残差最高的是种子 16(0.66)、13(0.44)、14(0.43)、12(0.34),它们在组合里携带了 head 的截面水平,但都不是同一个东西,所以不判 1。种子 1、2、5 与 20 日反转控制的 |ρ| 为 0.51–0.61,按 corr_1.md 的标注属于控制成分偏重;但它们度量的是价格在自身 120/241 日窗口中的位置,不是反转本身,残差化后仍有分离。种子 3、4(价格与 1 年最高/最低价之比,George and Hwang 锚定)、7–9(12-1 动量及其加速度)的残差 |ρ| 不超过 0.03,是库里没有的东西。核心 day_open(Open) 的五个控制 |ρ| 为 liq 0.46、vol 0.01、rev 0.09、known 0.42、size 0.42,都低于 0.8,满足 E 位条件。合理度 4。机制清楚,算子逐个核对过:种子 7 的 cross_delay(·,20)/cross_delay(·,241) 确实是跳过最近一个月的 11 个月收益;种子 9 是两段 60 日对数收益之差,即加速度;cs_flip_by_state 的符号按市场状态在 241 日内的分位是否高于 0.5 切换,与 ops_ext.py 的 docstring 一致(种子 10、11);cs_bucket_rank 在价格水平的十分位内重排,与水平正交(种子 15)。div 本身没有零保护,但分母是 52 周最高价或最低价,远离零;奖励按截面秩,单只股票的爆点不会支配截面。没有前视,只用 t 日开盘价与历史。后复权价格按规则 §4 不作为挡的理由。不划的情形:门槛列标为废品的种子 1、2、7、8、9 均放行。种子 1、2 的 distinct 为 0.20 与 0.09,来自 cross_rank 的 241/120 档时序秩造成的并列(约 242/121 个水平),§4 明确允许列序打破并列,不是数值伪影。种子 7、8、9 的 coverage 为 0.78–0.89,来自 cross_delay 的 241/120 天热身 NaN,奖励在其余日上计算,不是主要由热身期决定;但 PI 应知道种子 7 在数据开头约 241 个交易日、种子 8、9 约 120 个交易日没有信号。划掉的种子 5:cross_zscore(day_open(Open),120) 与种子 2 的 cross_rank(day_open(Open),120) 字段和窗口相同,五个控制 |ρ| 为 0.28/0.36/0.60/0.30/0.13 对 0.26/0.35/0.61/0.28/0.12,差值不超过 0.02,是同一个价格位置因子换了写法。如果它有 alpha,最可能来自 52 周高点锚定与中期动量的反应不足(种子 3、4、7),而不是 day_open 截面水平与门槛之间的交互。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [3, 9]
    reasons: '创新度 4。14 个种子与 head 的原始 |ρ| 为 0.00–0.29,残差 |ρ| 为 0.00–0.11,符合 N 位「与 head 秩相关低于 0.2、残差不同」的预期。成交时间统计与库里唯一的水平 head 不是同一个东西。但种子 1、2、3、8、9、10 与流动性控制的 |ρ| 为 0.48–0.73,与已知族 cross_mean(day_std(Amt),30) 的 |ρ| 为 0.51–0.70,按 corr_1.md 的标注属于控制成分偏重;成交时间分布与成交额水平不是同一个量,残差化后剩下的部分需要实验证实,不判 1。种子 4、5、6、11、12、13、14 与流动性、已知族的 |ρ| 在 0.00–0.35 之间,较干净。合理度 4。参与者结构的机制清楚(Admati and Pfleiderer 1988;Lou, Polk and Skouras 2019;Bogousslavsky 2021 为真实文献)。算子核对:day_centroid 是 sum(t·|x|)/sum(|x|)/(T-1),零成交分钟的权重为 0,所以停牌不会形成缺失偏差;in_slice 与 day_sum 的比例落在 [0,1],分母为 0 时得 0/0 = NaN,不产生爆点。有三条问题但不构成数学问题:(1) 种子 11、12 用 day_centroid(Ret),算子取绝对收益,量的是波动的时点,而不是价格走得早还是晚,机制说明与算子不符,量本身仍有定义,不挡;(2) 种子 10 的 day_corr(in_index(Amt),Amt) 是 Pearson,一根尾盘集合竞价分钟就能支配整日相关,实际接近收盘竞价占比;(3) 种子 14 的说法「是同一件事在价格上的写法」不成立,隔夜与日内收益之差是价格信息,与成交时间分布不同。in_slice(Amt,211,239) 只含 29 根分钟,比「尾盘 30 分钟」少一根,不影响判断。前视:books.py 的目标是下一日标签(mean next-day excess),t 日全日成交在收盘后才知道,用于 t+1 进场不构成前视;若奖励实际用同日收益,全部 N 位都有前视,需要 PI 确认。划掉的种子 3:cross_mean(day_centroid(Volume),120) 与种子 1 的 cross_mean(day_centroid(Amt),60) 结构相同,只是字段与窗口不同;成交额与成交量的日内质心只差价格加权,而价格日内变动小,控制谱 liq 0.56/0.56、known 0.57/0.56、size 0.14/0.13、rev 0.05/0.02、vol 0.39/0.33,判为同一个因子。划掉的种子 9:尾盘占比与早盘占比的 60 日均值之差,与种子 1 字段和窗口都相同,五个控制 |ρ| 的差不超过 0.02(0.56/0.39/0.05/0.57/0.12 对 0.56/0.39/0.05/0.57/0.14),head 相关 0.12 对 0.13,判为同一个成交时间分布因子。注意:corr_1.md 没有种子两两之间的 |ρ|,这两条重复判断是按控制谱和构造做的推断,PI 若有两两数据可以复核。如果它有 alpha,最可能来自日内成交的时间分布(开盘的散户与尾盘的机构、指数申赎的时点),最强的候选是种子 4 那种相对自身历史的偏离(zscore),以及隔夜与日内的拉锯(种子 13、14)。'
R:
  - head: 'cs_last_high05(cs_mask_top_replace_mean_neg(day_open(Open)), sqrt(day_centroid(Open)))'
    soundness: 4
    reasons: '合理度 4。16 个变体的算子逐个核对过:cs_mask_top_replace_mean_neg(x) = -cs_mask_top_replace_mean(-x),即把最低 10% 替换为当日均值,与描述一致;cs_last_high05 是按整块并列计算的 5% 带(ops_ext.py 的 _lexi),sqrt 对屏是单调空操作,与 why 中的说法一致;day_flat_ratio、day_zero_ratio、day_at_max_ratio、day_at_min_ratio 对缺失分钟不计入分母,不会被缺失分钟拖累;cross_age 对首日已有数据的股票给 10000 的基数,不会把老股误判为次新;pow_2 对后复权价格不溢出;所有变体都没有除零,也没有前视。机制清楚:用直接的交易状态度量取代 centroid 屏,是对 head 的正确检验。需要 PI 注意的三点,都不构成数学问题,不扣分:(1) why 说 centroid 是当天交易状态异常的代理,这依赖 Open 在停牌分钟是 NaN 还是前向填充。day_flat_ratio 的文档写停牌报价 never moved,暗示停牌分钟有值(前向填充),此时价格加权的质心量的是日内价格趋势(晚涨),而不是交易状态;若是 NaN,它又成了缺失分钟的探测器,属于 §4 的定义问题。变体本身不依赖这个前提,但变体 15 仍用绝对时间的 day_centroid(Volume),与这个问题相同。(2) 变体 10–13 的 5% 带在大面积涨停或跌停的日子里,若并列块整块超过 5%,_lexi 不取该块,当日屏会失效(ops_ext.py 文档写明这是有意的),变体 12、13(at_max / at_min)在涨跌停潮日尤其要检查。(3) 变体 3、4、5 与 head 的原始 |ρ| 为 0.98、0.98、1.00(corr_1.md),在秩上几乎没有改变,是设计上的冗余,不是 R 组的合理性问题。如果它有 alpha,最可能来自把屏的对象从价格路径的质心换成直接的停牌、涨跌停和次新状态。'
summary: 'PROD W01 种子 903 第 1 轮审计:a 位与 b 位均通过(a 创新 4、合理 4,划 5;b 创新 4、合理 4,划 3、9),R 组合理 4。没有触发 §4 的前视、数值伪影或定义坏掉。PI 需注意:门槛列标为废品的种子 1、2、7、8、9 按规则放行(种子 7 数据开头约 241 日、种子 8、9 约 120 日无信号);R 组 why 的前提依赖 Open 在停牌分钟的填充方式;R 变体 3、4、5 与 head 的秩几乎相同。'
