slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [8, 15]
    reasons: '创新度 4。表按规则划掉的 7、9、12、13 不计入审计员的划掉(与 H1 或 H3 的原始 |ρ| 为 0.72–0.91)。放行的 10 个种子与库里 head 的原始 |ρ| 都不超过 0.45(6 号对 H3 为 0.453,其余 ≤0.25),残差最高的 6 号为 0.36、14 号为 0.25,其余 ≤0.2;五个控制的原始 |ρ| 都不超过 0.36(最高为 1 号的 size 0.358 与 2 号的 vol 0.358),没有一个接近 0.8。它们研究的是 centroid 的离散度、与量 / 收益 / 跳空 / 市场节奏的耦合、EMA 偏离、下半离散、状态翻转与持续性,与库里三个 head(H1 的水平、H2 的开盘截面、H3 的 autocorr 比值)不是同一个东西。核心 day_centroid(Amt) 与五个控制的 |ρ| 为 0.18/0.16/0.13/0.19/0.07,满足 E 位条件;它是 H1 与 H3 的子树;16 个候选都原样包含它;核心与 round 1 的 E 位(核心 day_open(Open))不同。外围是否与 M 的 346 个含该核心的候选相同,审计员只对 heads 做了比较(指令只要求 heads 表),这一点请 PI 自己核对。
合理度 4。逐个核对算子:cross_stddev 是窗口内标准差(nanstd_last);cs_regres 是截面 OLS 残差;cross_corr 与 cross_autocorr_s1 是 60 日滚动相关;cross_ema 因果、跳过缺失日;cross_tail_mean_q25 / q75 取窗口分位尾部的均值;cross_semistd_neg 对 x>0 的 log 变化取下半平方;cs_flip_by_state 的状态来自市场均值在 241 日内的分位;全部是 trailing 写法,无前视。唯一要注意的是 10 号的 log 变化对接近 0 的质心敏感(质心接近 0 的日子是成交几乎全在 09:30 竞价分钟),但奖励先做截面秩,单日爆点只改变该票的名次,不会支配截面,不构成 §4 的数值伪影;PI 可在 train 上看它的名次分布。
划掉 8 号:与 1 号的字段(day_centroid(Amt))和窗口(60)相同,都是 60 日离散度(标准差与分位尾部均值之差);五个控制的原始 |ρ| 差分别为 0.022 / 0.009 / 0.001 / 0.022 / 0.000(liq / vol / rev / known / size),与 round 1 划掉 3、9 号的标准相同。corr_1.md 没有种子两两之间的 |ρ|,这是按控制谱与构造做的推断。
划掉 15 号:它是 H1 的两个部件(centroid 30 日均值与 flat run 30 日均值)各取截面秩后等权相减;表里它对 H1 的残差 |ρ| 为 0.798(原始 0.637),度量的是同一个东西,只换了写法。
放行的 10 个,各一句「如果它有 alpha,最可能来自哪里」:1 号 cross_stddev:习惯性时点(算法单、定时执行)与事件驱动时点的离散差异。2 号 cs_regres 去掉已知族后的 cross_stddev:离散度中不被成交额分散度解释的部分,来源同 1 号。3 号 与 log 日成交额的相关:放量日成交是前置(开盘集中)还是后置(尾盘),量价与时点的同步结构。4 号 与日收益的相关:涨的日子交易是否后置,尾盘资金的方向是否次日延续。5 号 与隔夜跳空比的相关:跳空日交易是否前置,即消息驱动的时点特征。6 号 EMA(5) 减 EMA(60):近期交易时点相对自身历史的偏移,即参与者结构的变化。10 号 下半离散(日变化):时点的突变与下行尾部。11 号 与市场平均质心的相关:对全市场交易节奏的 beta,可能是指数或 ETF 相关资金的时点。14 号 cs_flip_by_state:行情冷热时质心溢价是否反号,即散户开盘集中在热市是否为反向指标。16 号 cross_autocorr_s1:交易时点的日间持续性,即习惯性执行的票。
通过:创新 4 ≥ 3,合理 4 ≥ 3,划完剩 10 个 ≥ 4。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4。表按规则划掉的 2、3、4 号(与 H1 的原始 |ρ| 为 0.89、0.86、0.98)不计入审计员的划掉。放行的 11 个与库里 head 的原始 |ρ| 最高为 0.64(5 号对 H1 为 0.637,8 号对 H1 为 0.624),残差最高 0.49(5 号),其余 ≤0.46;五个控制的原始 |ρ| 都在 0.43 以下(最高为 6 号的 size 0.43、8 号的 known 0.43),符合 N 位「与五个控制 < 0.5」的预期。它们读的是日内时段、收益符号分割、价格路径和量价同步,与 H1 的全日水平、H2 的开盘截面、H3 的 autocorr 比值都不同。
合理度 4。算子核对:in_slice(x, a, b) 是 x[:, a:b+1] 的列切片,day_centroid 在切片上重新归一化到 [0,1],所以 5、6、7 号的切片质心是切片内的相对位置,与写法一致;is_gt / is_lt 返回 0/1 整数,NaN 比较为假即权重为 0,乘 Amt 后零权重分钟不进质心;day_centroid 在 tot=0 时给 NaN;day_argmax / day_argmin 忽略 NaN、并列取第一个;day_wmean、day_corr、day_mean 的分母都有保护。前视:特征用的是 t 日全日分钟数据,books.py 的文档写的目标是次日超额收益,t 日收盘后可用,不构成前视(若奖励实际用同日收益,则全部 N 位都有前视,需 PI 确认)。以下几点 PI 要注意,但都不构成 §4 的问题:(a) 14 号 day_corr 在 Ret 整日常数(一字板)时返回 0 而不是 NaN,这些日子把 30 日均值拉向 0;(b) 9、10 号的 argmax 并列,distinct 为 0.53、0.56,约半数截面由列序打破,§4 明确允许,但它们的 alpha 可能部分是板块而非个股时点;(c) 11 号的早盘切片含 index 0(09:30 竞价分钟),若 Ret[0] 含隔夜跳空,早盘收益就混入了隔夜收益,与「日内」的写法不符,需 PI 确认 Ret 的定义;(d) 13 号与 14 号代数同源:day_wmean(Ret, Amt) − day_mean(Ret) = cov(Amt, Ret) / mean(Amt),而 day_corr = cov / (σ_Amt · σ_Ret),所以 13 号 = 14 号 × CV(Amt) · σ(Ret)(逐日)。两者五个控制的 |ρ| 差为 liq 0.039、vol 0.106、rev 0.053、known 0.010、size 0.057,不属于审计员的重复标准,所以都放行,但 PI 应预期两者相关偏高。
划掉:无。
放行的 11 个,各一句「如果它有 alpha,最可能来自哪里」:1 号 上涨分钟的质心减下跌分钟的质心:尾盘抢筹(上涨分钟的钱更晚)的方向,次日延续或回吐。5 号 早盘切片质心:早盘资金节奏,散户开盘集中还是机构执行。6 号 午后切片质心:午后机构执行与尾盘集合竞价参与者的节奏。7 号 午后质心减早盘质心:两段之间的节奏切换。8 号 开盘前三分钟成交占比:开盘竞价与抢跑的信息集中度。9 号 最高价时点减最低价时点(30 日均值):日内路径形状(先低后高或先高后低)的延续或反转。10 号 最高价时点的 60 日均值:早盘冲高后回落与尾盘创高两类票的日内动量差。11 号 午后收益减早盘收益:日内动量与反转(Gao et al. 2018、Lou et al. 2019)的时段划分。12 号 尾盘 30 分钟收益:14:30 到 15:00 的资金推动与次日延续。13 号 货币加权收益减时间加权收益:放量分钟的涨跌方向,即资金是在涨时还是跌时入场。14 号 分钟额与收益的相关:放量与涨跌同步的程度,即追涨杀跌资金与不随价格变化的资金的比例。
通过:创新 4 ≥ 3,合理 4 ≥ 3,划完剩 11 个 ≥ 4。'
R:
  - head: 'cross_mean(sub(day_centroid(Amt), day_flat_run_max(Amt)), 30)'
    soundness: 3
    reasons: '合理度 3。扣分的原因不是 §4 的数学问题(表达式都算得出,无前视、无爆点、无定义问题),而是部分变体的符号与理由相反。1、4、5 号(cs_regres 中性化)做法正确:原始 |ρ_known| 为 0.053 / 0.043 / 0.057,与 H1 的 |ρ| 为 0.78–0.88,过门后就是替换。2 号(减 0.4 倍已知族秩)与 3 号(减 0.8 倍)的原始 |ρ_known| 为 0.755 与 0.853,比原式更高,而不是「压到 0 附近」。由表反推,centroid 30 日均值的秩与已知族秩约为 -0.5 的相关;减去已知族秩是放大暴露,要压低须用加号或 cs_regres。这两个变体的 liq 也高达 0.73 与 0.83,实际变成了流动性信号。6–10 号(flat run 权重 0.5 倍与 2 倍、窗口 40 与 22、EMA 20)的机制与算子没有问题,只是它们本来就不是中性化。R 组保留,但 PI 应删掉或修正 2、3 号的符号;「把 |ρ_known| 压到 0 附近」只对 1、4、5 号成立。'
  - head: 'div(day_autocorr_n1(in_decay_linear_rolling(Close, 30)), day_centroid(Amt))'
    soundness: 4
    reasons: '合理度 4。分子与分母都放慢的思路正确,算子也没有问题。分母是日度质心,一字板或竞价主导的日子质心接近 0,除出来的值会是爆点;但奖励先做截面秩,爆点只改变该票的名次,不会支配截面,不构成 §4 的数值伪影。30 / 60 日均值与半衰期 20 的 EMA 比单日值更少落在 0 附近,无前视,也无缺失值填充的问题。变体 5 的截面秩差与 R1 的 1 号一样正确。规划层面的一点(不是数学问题,不扣分):六个变体的原始 |ρ_known| 为 0.57 / 0.60 / 0.56 / 0.56 / 0.62 / 0.58,全部超过 R 的已知族门(<0.5),按 §2 不能替换或收录;变体 1–6 都没有对已知族做中性化,PI 若要本组有产出,需要在分母里也做 cs_regres 式的中性化。'
summary: 'PROD W01 种子 903 第 2 轮审计:a 位创新 4、合理 4,表划 7、9、12、13,审计员划 8、15,余 10 个,通过;b 位创新 4、合理 4,表划 2、3、4,审计员不划,余 11 个,通过。R1(H1 的 10 个变体)合理 3:2、3 号的符号与理由相反,原始 |ρ_known| 为 0.755 与 0.853 而不是压低;R2(H3 的 6 个变体)合理 4,但六个变体的原始 |ρ_known| 都在 0.56–0.62,过不了 R 的已知族门。没有触发 §4 的前视或数值伪影。PI 需注意:R1 的 2、3 号符号;R2 的已知族门;b 位 9、10 号的列序并列;14 号 day_corr 的一字板零填充;11 号 Ret[0] 的定义;13 与 14 号代数同源;a 位 10 号对近零质心的 log 敏感(不构成 §4 问题)。'
