    拆解读出的事实:单日值 day_centroid(Amt) 只有 +0.41(train +1.05 / valid +0.41);30 日均值 cross_mean(day_centroid(Amt),
    30) 是 +1.72(train +1.72 / valid +1.83),比 head 还高 0.38(flat_run_max 的必要性 -0.38);
    head 的窗口 15 / 30 / 60 = 1.00 / 1.34 / 0.76。读法:alpha 是一个慢特征(这只票习惯在一天的什么时候成交),日度值的噪声主要被
    15 bp 换手成本吃掉;flat_run_max 的作用不是 alpha,而是把与已知族 cross_mean(day_std(Amt), 30) 的 |ρ|
    压到 0.5 以下 (第 1 轮相关度表里 cross_mean(day_centroid(Amt), 60) 对 known 是 0.57、对 liq 是
    0.56)。

    已见过的含该核心的写法全是水平:各种窗口的均值 / zscore、与 Volume 或 Ret 的质心作差、被 autocorr 除。库禁令(日度秩 |ρ|
    >= 0.7)会拒绝 一切再平滑、再加减一个零件的水平变体,所以本轮外围去读质心的动态和条件,六族: (1) 变异度:cross_stddev(质心, 60)、cross_tail_mean_q75
    减 q25、cross_semistd_neg、cross_autocorr_s1。 习惯性时点(算法单、机构定时执行)和事件驱动时点(消息、散户)是两类票,均值读不出差别,离散度能。
    (2) 耦合:cross_corr(质心, log(day_sum(Amt)) / day_sum(Ret) / 隔夜跳空 div(day_open(Open),
    昨收) / cs_mean(质心), 60)。 放量日是前置还是后置、上涨日是否后置(尾盘买入)、跳空日是否前置(消息)、对全市场交易节奏的 beta;读的是质心与别的日度量的共动,不是质心的水平。
    (3) 惊奇:cross_ema 短减长(5 对 60)、cross_madz(质心, 60)。相对自己的历史偏早 / 偏晚,天然去掉深沪尾盘集合竞价制度
    (深市 15:00 点含收盘集合竞价,沪市没有)造成的水平差。 (4) 中性化:cs_bucket_rank(质心 30 日均值, 已知族) 在已知族十分位内重排;cs_bucket_rank(质心
    30 日均值, 最后一分钟成交占比的 30 日均值) 在深沪集合竞价差的代理变量十分位内重排,直接回答 head 的 alpha 是不是深沪哑变量; cs_regres(秩,
    已知族秩) 去掉 cross_stddev 对已知族的暴露,绕开 |ρ_known| < 0.5 的门。 (5) 状态:cs_flip_by_state(质心
    30 日均值, day_sum(Amt)),全市场放量 / 缩量时质心溢价是否反号(行情热的时候散户的开盘集中可能是反向指标)。 (6) 等权秩差:sub(cs_rank(质心均值),
    cs_rank(flat_run_max 均值))。head 里的 sub 是数值差,flat run 只在稀薄票上才有量级; 秩差让两者等权,是对 head
    的 flat-run 部件权重的另一端。

    和已有的不同:库里所有含质心的东西读的是它的水平;本轮 (1)(2)(3)(5) 读的是它随时间的离散、共动、偏离和随状态的符号,日度秩与 head 1 的
    |ρ| 预期 0.1–0.5;(4)(6) 保留水平,预期 0.6–0.8,可能被表划掉 1–3 个。与五个控制:(1)(2) 的 liq / known
    预期 0.3–0.6, 新尺子的 15 列残差去掉线性、U 形、S 形部分,剩下的是时点习惯本身。样本外为什么在:谁在什么时候交易(参与者结构)比风格轮动稳定,
    动态统计不依赖交易所制度的水平差;窗口 >= 30 天,换手低。已知风险:cross_stddev 一类在稀薄票上估计噪声大,和流动性高度相关, 残差后可能只剩噪声;cs_flip_by_state
    在状态翻转日会有换手冲击。'
