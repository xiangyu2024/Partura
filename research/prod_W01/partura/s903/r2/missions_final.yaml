- type: N
  hypothesis: '新想法:head 里的 day_centroid(Amt) 把一天所有分钟(含 09:30 开盘竞价点和 15:00 收盘点)压成一个数。压平之后至少混了三件不该混的事,
    本轮把它拆开,每一件在库里都没有:

    (a) 买卖方向。成交额按分钟收益符号分开:day_centroid(mul(Amt, is_gt(Ret, 0))) 是上涨分钟的钱的质心,is_lt 是下跌分钟的钱的质心,
    及两者之差。is_gt / is_lt 给 0/1,乘 Amt 后 day_centroid 以绝对值为权重,零权重分钟不进质心;Ret = 0 的分钟两边都不进。
    上涨分钟的钱比下跌分钟的钱更晚 = 价格越到尾盘越涨(尾盘抢筹);反之 = 早盘冲高后被卖。这是日内动量(Gao, Han, Li and Zhou 2018)的另一种读法,
    A 股 T+1 下尾盘抢筹的次日走向(回吐还是延续)是方向性的、可被残差后的长多书读到的。

    (b) 时段与竞价。in_slice(x, a, b) 取分钟 a 到 b(含两端;0 = 09:30 竞价,1–120 = 上午连续,121–240 =
    下午,240 = 15:00 点, 深市该点含收盘集合竞价,沪市没有)。in_slice(Amt, 1, 239) 的质心同时去掉两个竞价点;上午质心 1–120、下午质心
    121–239 分别读上下午内部的节奏; 下午减上午;开盘 3 分钟成交占比。head 的质心里混着深沪制度差:若连续竞价质心保住大部分分数,说明时点信息是真的;
    若丢光,说明 head 主要是深沪哑变量。这个答案对第 3 轮是关键信息。

    (c) 价格路径。day_argmax(High) 与 day_argmin(Low) 是当天最高价 / 最低价出现的分钟,两者之差是日内路径形状(先低后高
    vs 先高后低); 下午分钟收益和减上午;最后 30 分钟收益和;day_wmean(Ret, Amt) 减 day_mean(Ret) = 钱加权收益减时间加权收益(钱是在涨的时候还是跌的时候放量);
    day_corr(Amt, Ret) = 分钟额与分钟收益的同步性。

    统一做成 30 日(个别 60 日)均值:上一轮事实是 30 日均值比单日值高 1.3 分,日度值被换手成本吃掉,所以只放慢特征。

    和库不同:库里 head 1 / head 3 用的是汇总到全天的质心(及无成交停顿)。这里每个种子要么只读一部分分钟(时段)、要么按收益符号读(方向)、
    要么读价格的时点(路径),预期与 head 1 的日度秩 |ρ| 在 0.1–0.5(整段连续质心和单边质心例外,可能 0.6–0.85,会被表划掉), 与五个控制
    < 0.5(路径类与 20 日反转可能 0.3)。样本外为什么在:Heston, Korajczyk and Sadka 2010 在美国样本里记录了截面收益的日内时点模式,
    机制(谁在开盘、谁在尾盘、买方还是卖方在推价格)是参与者结构,不依赖这份数据;只放 30 日以上的慢特征,换手低,15 bp 扛得住。 已知风险:Ret =
    0 的分钟(低价股一个 tick 不动)占比大时,单边质心用的是子集;argmax 并列取第一个,一字板票的最高点时点是封板那一分钟。'
