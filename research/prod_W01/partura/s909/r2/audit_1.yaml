attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: |
      核心 C1 = cs_first_high20(mul(day_first(Volume),1), day_quantile(inv(Vwap)))。逐算子核对:day_first 取当天第一个有效分钟的成交量(第 0 列为集合竞价,缺列时退到首个连续竞价分钟,是测量小毛病,按 §4 不挡);day_quantile(inv(Vwap)) 是当天 1/Vwap 的分钟中位数,截面最高 20% 即后复权价最低的 20%(用后复权价不挡);cs_first_high20 的实现与注释一致(整块并列决定 band,band 内外都按 Volume 的 rank 排序,band 整体抬到最前)。无前视(当日数据只用于次日收益)、无除零(inv 只作用于价格)、面板不是常数(覆盖 0.998–0.999,distinct 0.87–1.0)。
      核心与 5 个控制的原始 |ρ| 最大 0.26(known),低于 0.8,过 E 位控制门槛。核心本身是 head 1、head 2 的共同骨架(head 2 原始 |ρ| 0.70,head 1 残差 |ρ| 0.89),所以外围必须靠结构拉开。
      15 个种子的原始 |ρ| 与各 head 最大值为 0.29–0.68,均低于 0.7;与控制的最大 |ρ| 为 0.65(种子 8 对 vol),低于 0.8。没有自动划掉项。
      逐个看:(1) 种子 1、2、3、15 保留了核心在全市场的排序(10 日平滑;块内按市值或波动分桶;与反转秩相减),对 head 1 的残差 |ρ| 为 0.86–0.89,在奖励空间里与 head 1 很接近。但原始 |ρ| 只有 0.62–0.68,结构也不是 head 1 的两层 abs-min 闸门,按 §3 只挡数学问题与明显度量同一个东西的原则放行,不划。这四个是最可能复制 head 1 的种子,PI 应有预期。(2) 种子 7、13、14 对 head 1 的残差为 0.81–0.83,理由同上,放行。(3) 种子 6、7、11 的闸门是 20 日平均的 abs-min,与 head 1 的 1 日 abs-min 闸门同类但被平滑,原始 |ρ| 0.44–0.51,放行。(4) 种子 5、8、12 对 head 1 的残差只有 0.56–0.61,是最不同的段;种子 8 的 vol 暴露 0.65 低于 0.8 门槛,放行。(5) 种子 4、9、10 的残差 0.67–0.77,原始 |ρ| 0.52–0.58,放行。
      创新度 3:核心是现有骨架,但 15 个外围中约一半(4、5、6、8、9、10、11、12)与 head 的残差相关在 0.56–0.77,是真实的组合,不是同一个东西换写法;其余几个与 head 1 高度重合,拉低到 3 而不是 4。
      合理度 4:机制清楚(长期输家 × 开盘集合竞价参与度)。需记录的测量混杂:Volume 是股数口径,低价段内股数与 1/价格机械相关,段内排序部分是价格信息。这正是 R 1 变体 1(Amt)要检验的,不挡。
      如果它有 alpha,最可能来自:长周期输家(De Bondt-Thaler 一脉)中,开盘集合竞价参与度(股数口径)高或低的那一端的后续收益;其次是 1/价格与集合竞价量的交互。
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [4, 6, 12]
    reasons: |
      核心 C2 = day_wmean(is_lt(in_index(Amt),0.125),Amt)。逐算子核对:in_index 给有限分钟输出 t/240(241 格,第 0 列为集合竞价);is_lt(·,0.125) 取 t<30,即集合竞价加开盘后 29 分钟(NaN 变为 0,但 day_wmean 中按 Amt 的 NaN 排除);day_wmean 的分母是当日有效 Amt 之和,所以 C2 是 [0,1] 内的成交额占比,停牌日 NaN,不会除近零。无前视,无爆点。
      核心与 5 个控制的原始 |ρ| 最大 0.18,过门槛。结构上需记录一点:§2 要求核心是 head 的子树,逐字不成立(head 4 写作 cross_mean(day_wmean(is_lt(in_index(is_lt(in_index(Amt),0.125)),0.125),Amt),30),中间嵌套了 in_index 与 is_lt)。但对 0/1 掩码再做 in_index 后 is_lt 是恒等变换,且 NaN 分钟在 day_wmean 中同样被排除,所以 head 4 在语义上就是 cross_mean(C2,30)。§3 的通过条件不含此项,不挡;核心卡应注明它是语义相等的子树。
      13 个种子的原始 |ρ| 与 head 的最大值为 0.06–0.83,与控制的最大 |ρ| 为 0.73(种子 3 对 size),低于 0.8。自动划掉(确定性规则,原始 |ρ| ≥ 0.7 对 head 4):种子 4(0.77)、6(0.80)、12(0.83)。这三条与表格规则一致,若流水线已自动划掉,此处是同一批。
      逐个看:(1) 种子 3,cs_first_low40(C2,LogFloatCap),size 暴露 0.73,与 head 4 的残差为 0.77,是 head 4 限制在最小 40% 市值段内的版本;原始 |ρ| 只有 0.55,是分段检验,放行。(2) 种子 5 对 head 4 的残差 0.68、原始 0.40,放行。(3) 种子 1、2、10、11、13 的原始 |ρ| 为 0.33–0.64、残差 0.28–0.63,放行。(4) 种子 7、8、9 与所有 head 的残差 |ρ| 只有 0.03–0.10,是真正的新方向(隔夜 / 日内方向加权、10 日与 60 日的差);种子 8 的 rev 暴露 0.51,但这不是划掉的理由。
      创新度 3:核心就是 head 4 的变量。一批是对它的分段与重排(1–6、12),一批是真正新的方向与动态版本(7–11、13);前一批占多数,所以给 3 而不是 4。
      合理度 4:机制清楚。散户限价单集中在集合竞价与开盘后几分钟,算法单把成交摊到全天,所以开盘占比的持续成分反映投资者构成与执行方式(Admati-Pfleiderer 1988;Barber-Odean 2008)。方向版本的机制(Berkman 等 2012;Lou-Polk-Skouras 2019)也说得通。
      如果它有 alpha,最可能来自:开盘 30 分钟成交额集中度的 30 日持续成分(投资者构成的代理),在不同的分段(小市值、暴跌倾向高、新股屏)或方向(隔夜 / 日内)上收益不同。
R:
  - head: cs_last_high40(abs_(day_min(Ret)), cs_last_high40(abs_(day_min(Ret)), cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap)))))
    soundness: 4
    reasons: |
      拆解:原 head 的每一层都是必要的,变体的骨架不变,逐算子可实现。变体 1 把集合竞价量由股数换成金额(Amt),变体 2 在此基础上把 Vwap 换成 Close;这检验 PI 的说法:股数口径的集合竞价量在低价段内机械放大,是 head 1 的测量混杂,该理由成立。变体 3、4 只改 40% 与 20% 的切分,变体 5 把 1 分钟 Ret 换成 5 分钟 in_pct(Close,5)(前 5 分钟为 NaN,day_min 忽略它),变体 6 用 20 日均值平滑 abs-min,数学上都无误。无前视,无除零。
      设计注记(不扣分):PI 写"所有变体只改一处",但变体 2 同时改了 Amt 与 Close,变体 3–6 全部带着 Amt 替换。因此变体 3–6 对原 head 的比较不是单一部件的效应,读结果时应以变体 1(只换 Amt)为基线。
      对原 head 的残差 |ρ| 变体 1、2 为 0.82,变体 5 为 0.75,变体 3、4、6 为 0.62–0.69;与原 head 相近是预期的。如果它有 alpha,最可能来自:按金额计的开盘参与度与长期输家的交互(变体 1、2),或更稳健的 5 分钟尺度跌幅(变体 5)。
  - head: cross_mean(day_wmean(is_lt(in_index(is_lt(in_index(Amt), 0.125)), 0.125), Amt), 30)
    soundness: 4
    reasons: |
      拆解:nested 写法中 in_index(is_lt(in_index(Amt),0.125)) 对 0/1 掩码是恒等变换,所以 head 4 与 cross_mean(C2,30) 完全相同,这是写法冗余,不是数学问题。阈值变体 1–4 数学正确:t/240 < 阈值 分别等价于约 15、60 个分钟列(0.0625、0.25),只剩第 0 列(0.004,即集合竞价),以及第 0–2 列(0.0125),与 PI 的描述一致。
      变体 5(C2 减去集合竞价占比)只删掉第 0 列,与原 head 的原始 |ρ| 高达 0.99,是几乎完全重复的变体;R 组只评合理度,不因此扣分,但它不会带来新信息。变体 6 的 cross_ema(C2,20) 是因果的半衰期 20 日指数平均,定义无误。变体 3(只含集合竞价占比)与原 head 的 |ρ| 为 0.63,是真正的分解检验。变体 1、2、4、6 与原 head 的 |ρ| 为 0.78–0.95,是小改动。
      无前视;分母为当日 Amt 之和,停牌日 NaN,不会除近零。如果它有 alpha,最可能来自开盘 30 分钟成交额集中度的持续成分;变体 3 的结果会说明这个成分来自集合竞价那一列,还是来自开盘后的连续竞价。
summary: a 位与 b 位通过(a:创新 3、合理 4、无划掉;b:创新 3、合理 4、自动划掉 4、6、12);R 1 与 R 2 合理度各为 4;未发现 §4 的前视、数值伪影或定义问题。PI 注意两点:(1) a 位的 1、2、3、7、13、14、15 对 head 1 的残差 |ρ| 为 0.81–0.89,可能复制 head 1,这里没有划掉,只是记录;(2) R 1 的变体 3–6 与 2 并非只改一处(都带着 Amt 替换),对照应以变体 1 为基线。
