  hypothesis: '核心 C1 = cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap)))。逐个算子读:day_first(Volume)
    是当天第一个有效分钟的成交量,V2 立方体第 0 列是 09:30 开盘集合竞价,所以它就是『开盘集合竞价的成交股数』(该列缺失时退到首个连续竞价分钟,是测量上的小毛病,不是数学问题);day_quantile(inv(Vwap))
    是当天各分钟 1/Vwap 的中位数,价格字段是后复权价,它的截面高位 20% 不是『名义低价股』,而是后复权价最低的 20% ——自基期以来累计收益最差的长期输家(长周期的反转
    / 动量排序,5 个控制里的 20 日反转管不到);cs_first_high20(y, x) = rank(y) + 1(x 处在截面最高 20% 的整块并列内),也就是把这批长期输家整体抬到全市场最前面,段内再按集合竞价成交量排序,其余股票按同一个成交量排序排在后面。合起来的意思是『长期输家里,开盘集合竞价参与度最高(或最低)的那些』。


    证据:这个核心是 M 第 2 批 3 个 head 里 2 个的共同子树(第 3 个 head 把 Volume 换成常数 1);拆解里它自身得分 +0.85(train
    +0.85 / valid +2.44);head 1 里把它换成别的东西得 -2.43(必要性 +3.5);Volume→Amt 与 Vwap→Close
    两个替换都保持分数(+1.22 / +1.10),说明信息在『长期输家 × 开盘参与度』这个结构里,不在某个具体字段上。


    库里三个 head 在核心外面做的事情是同一类:把核心当『闸门』,再叠一个『当天的排序变量』——head 1 套两层 cs_last_high40(abs_(day_min(Ret)),
    ·),head 2 套 cs_last_high40(day_quantile(inv(Vwap)), ·),head 3 把 Volume 换成常数。cs_last_high40
    把核心最高 40%(长期输家 ∪ 集合竞价量最大的非输家)整体压到最后,取多头书的方向后,书是这 40% 段内按另一个当日变量排序的头部或尾部。这类『整块闸门』的排序对核心本身高度相关,任何再套一层同样闸门的写法都会被库禁令(日度秩
    |ρ| ≥ 0.7)拒掉,所以本位的 15 个种子改变的是别的东西,分五类:

    (a) 时间维度:cross_mean(C1, 10),用 10 日平均的『段位 + 参与度』代替单日值,把一天里集合竞价量的噪声和分位线上的进出抹掉。

    (b) 同伴内中性:cs_bucket_rank(C1, LogFloatCap) 与 cs_bucket_rank(C1, 30 日波动),在同规模 /
    同波动十分位内比较核心,书不再集中在某个规模或波动的角落(新尺子只去掉对控制的线性、U 形、S 形暴露,不去掉『段内』结构)。

    (c) 反过来用核心:库里的 head 把 C1 当闸门;这里把 C1 当『排序变量』,闸门换成一个 20–30 日的慢变量 X:cs_first_high20(C1,
    X) = rank(C1) + 1(X 处在截面最高 20%),cs_first_low20 / cs_first_low40 取最低 20% / 40%。方向取
    +1 时多头书是『X 段 ∩ 长期输家 ∩ 集合竞价量大』(取 −1 时是它的反面,方向由 train 选),与库里 head 的组成不同。X 取:OS30(第二条线索,开盘
    30 分钟成交额占比的 30 日均值,= head 4 的 cross_mean(C2, 30))、20 日平均的『最坏分钟跌幅』(持续的暴跌倾向,head
    1 用的是当日值)、30 日波动(取低波 40% 段)、成交额加权买卖压力 day_signed_ratio(Ret, Amt) 的 20 日平均、20 日平均的隔夜跳空;对
    OS30 与暴跌倾向各放高段、低段两个方向,因为全局符号只能整体翻转,翻不出『只取低 X 段』。

    (d) 排除屏:cs_last_high20(C1, 20 日暴跌倾向)、cs_last_high20(C1, 20 日报价冻结占比 day_zero_ratio(Ret))、cs_last_low20(C1,
    ListAge),即不让暴跌倾向最高的 20%、报价冻结最多的 20%、上市最晚的 20% 进书。

    (e) 连续混合:rank(C1) + 0.5 × rank(OS30)、rank(C1) - 0.5 × rank(20 日暴跌倾向),不是整段抬升,而是把第二个变量按半个权重掺进来。

    种子里所有整块抬升 / 压底的宽度都 ≥ 20%:按独立假设粗算,20% 的整块位移会把排序对未位移版本的日度秩相关降到约 0.59(10% 约 0.69,贴着
    0.7 的库禁令),所以不做 10% 的屏。


    为什么样本外还会在:核心里的两个量都是市场结构性的——长期输家(后复权价最低)与开盘集合竞价参与度(散户的限价单集中在集合竞价,A 股散户占比高),前者是
    De Bondt-Thaler 一脉的长周期反转,后者在 Lee-Swaminathan 2000 的『过去收益 × 成交量』交互里被当作情绪 / 关注度度量;它们不依赖某一年的行情。需要诚实交代的一点:库里
    4 个 head 的 valid 都是 train 的 2 到 4 倍(+1.10/+2.41,+0.99/+2.76,+0.66/+2.11,+0.58/+1.51),分数取两者较差的,所以
    train(2018–2021,含 2018 年的单边下跌)是紧约束。因此 (d) 里的三个排除屏被放进来——它们去掉的是最容易在下跌市里出大亏损的名字(暴跌倾向高、报价冻结、新股),目的是抬
    train 的下端,而不是 valid;这是推断,没有数据证实。'
