- type: E
  core: day_wmean(is_lt(in_index(Amt), 0.125), Amt)
  hypothesis: '核心 C2 = day_wmean(is_lt(in_index(Amt), 0.125), Amt)。逐个算子读:in_index(Amt)
    给每个有成交额的分钟位置 t/240,is_lt(·, 0.125) 标出 t < 30 的分钟(第 0 列的开盘集合竞价加开盘后 29 分钟),day_wmean(·,
    Amt) 用 Amt 加权,所以 C2 = 当天成交额里落在开盘 30 分钟的份额(0 到 1,有界,分母是全天成交额,停牌日为 NaN,不会除近零)。库里的
    head 4 只做了一件事:cross_mean(C2, 30)(+0.58,valid +1.51;窗口 15 日 +0.52、60 日 +0.47,单日值只有
    +0.13,说明信号是 30 日左右的持续成分,不是某一天的事)。下文 OS30 = cross_mean(C2, 30)。


    为什么我认为这是一条值得深挖的线:本种子里两次独立的命中都落在『开盘时段』——M 第 2 批 3 个 head 的共同核心读的是开盘集合竞价成交量,Nb 的
    head 读的是开盘 30 分钟成交额占比,两者都用到了第 0 列。机制假设(未经数据证实):散户的限价单集中在集合竞价与开盘后的几分钟,机构的算法单(VWAP
    / TWAP)把成交摊到全天,所以一只股票 30 日平均的开盘占比越高,越像是散户 / 消息驱动的持仓结构,越低越像机构算法在做;Admati-Pfleiderer
    1988 给出自主选择交易时点的交易者在开盘与收盘扎堆的理论,Barber-Odean 2008 说明散户买入集中在引起注意的股票上。


    head 4 与任何只换平滑核的外围(cross_ema、cross_med、别的窗口)日度秩相关都会 ≥ 0.7,会被库禁令拒绝;所以本位的 13 个种子都改变排序结构,而不是改平滑,分五类:

    (a) 段内排序:cs_first_high20(OS30, 后复权价倒数) 把长期输家(后复权价最低 20%)整体抬到最前、段内按开盘占比排;cs_first_low40(OS30,
    同一量) 取相反的长期赢家段;cs_first_low40(OS30, LogFloatCap) 取最小 40% 的小票段;cs_first_high40(OS30,
    20 日暴跌倾向) 取暴跌倾向最高 40% 的段;cs_first_high40(OS30, 20 日平均开盘集合竞价量) 取集合竞价量最大的 40% 段(把两条线索接起来,但不带
    C1 的价格段)。

    (b) 排除屏:cs_last_high20(OS30, 暴跌倾向)、cs_last_low20(OS30, ListAge),即不让暴跌倾向最高 20%、上市最晚
    20% 的股票进书。

    (c) 带方向的版本:head 4 里 C2 是没有符号的占比;cross_mean(mul(C2, 开盘跳空), 30) 与 cross_mean(mul(C2,
    日内收益), 30) 把它变成『开盘集中度加权的隔夜方向 / 日内方向』,日内收益 = Close 末值 / Open 首值 - 1,隔夜跳空 = Open
    首值 / 昨收 - 1,价格是后复权价,除权日连续,分母不是近零量。对应 Berkman 等 2012(高关注度股票隔夜上涨、开盘后回落)与 Lou-Polk-Skouras
    2019(隔夜与日内是两类持续的资金)。

    (d) 动态:cross_mean(C2, 10) - cross_mean(C2, 60)(近期相对长期的开盘占比加速),cross_ema(cross_zscore(C2,
    60), 10)(相对自己历史的异常开盘占比,cross_zscore 的 sd 用相对阈值,常数窗口记 0),cross_stddev(C2, 30)(开盘占比的波动:事件驱动
    vs 稳定,与水平的秩相关预计只有 0.3-0.5)。

    (e) 两头占比:cs_first_high20(OS30, 30 日平均的收盘前 30 分钟成交额占比),即开盘与收盘都集中的股票(盘中冷清)。

    整块抬升 / 压底的宽度都 ≥ 20%(按独立假设粗算,20% 的整块位移把排序对未位移版本的日度秩相关降到约 0.59,10% 约 0.69,贴着 0.7
    的库禁令)。


    为什么样本外还会在:开盘集中度是持续的结构特征(30 日平均才有信号),机制由投资者构成和执行方式决定,不依赖某一年的行情;分段与带方向的版本检验的是『这个特征在哪类股票上、对哪种方向的开盘行为有效』,检验失败也会很干净地告诉我们它只是
    head 4 的一个整体水平效应。诚实交代:head 4 的 valid 是 train 的 2.6 倍,train 是紧约束;排除屏(b)与暴跌倾向段(a)优先于别的分段,因为它们针对的是下跌市里的大亏损。'
