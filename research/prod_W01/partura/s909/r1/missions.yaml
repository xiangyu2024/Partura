  - type: N
    hypothesis: |-
      机制(lottery 偏好 / 收益分布形状):A 股散户占比高、融券受限、有涨跌停,投资者对"彩票型"收益形状(右尾厚、正偏度、偶发的大幅上冲)出价过高(Kumar 2009;Boyer-Mitton-Vorkink 2010 预期特质偏度;Bali-Cakici-Whitelaw 2011 MAX;Amaya 等 2015 已实现偏度)。所以在波动水平相同的股票里,分布形状越像彩票未来收益越低;形状最不像彩票(偏度低、右尾薄、下行半偏差占比高、很少被封涨停)的股票未来收益更高。本位是纯多头,只拿"最不像彩票"的那一端。形状是股票的持续性特质,30 到 60 个交易日平均就稳定,所以信号变化慢、日换手低,15 bp 成本吃不掉它。
      算子怎样实现:先在每一天的分钟数据里量形状,再用 cross_mean 在 30-60 日上平均。分钟层:5/10/15 分钟涨幅 in_pct(Close, d) 或 in_pct(Vwap, d)(用滚动涨幅而不是 1 分钟 Ret,避开买卖价差跳动与首根集合竞价;另放 1 个直接用 1 分钟 Ret 的 day_skew 作对照)的 day_skew、day_kurt;右尾与左尾 day_es_ratio_hi/lo 之差(尾部形状);day_max+day_min(上冲与下探的不对称,对大量零收益的分钟稳健);day_max 对 day_std 的比(用 60 日均值之比,避免逐日除近零);day_pos_ratio(上涨窗口占比,不看幅度:负偏股票是"小涨多、大跌少");day_gini(波动是否集中在少数几个窗口)。日线层:ts_skew;ts_max/ts_std;上行与下行半偏差 cross_semistd_pos/neg 的对称化比 (pos-neg)/(pos+neg)(分母只在两者同为 0 时为 0,此时是 NaN,不会逐日爆点)与它们的秩差;涨停/跌停"钉死"时间占比之差 day_at_max_ratio - day_at_min_ratio(A 股最极端的彩票事件)。
      与库和控制的区别:库里目前没有 head。5 个控制全是水平量(成交额水平、波动水平、20 日总收益反转、Amt 日内离散度、市值),本组全是尺度无关的形状量(偏度、峰度、比值、占比),不是另一种写法的波动或成交额。残差化还会去掉形状里与波动、反转的线性、U 形、S 形耦合,留下"同样波动下更像不像彩票"。
      样本外为什么还在:彩票偏好来自市场结构(散户主导、卖空受限、涨跌停制度),不依赖某一年的行情;形状用长窗口平均,估计噪声小;方向和半衰期只在 train 上选,valid 只复核。信号慢,换手低,成本对它不是致命的。
    inspired_by: |-
      M 第 1 批:90 个已评分候选整体均值约 -1.14,0 个 head;含 neg(LogFloatShares) 子树的 27 个候选均值 -0.60,其余 63 个 -1.38。静态日频字段(换手几乎为 0)明显好于其余,提示主要失败模式是 15 bp 成本对高换手信号的拖累,而不是没有横截面信息。共性表里只有 LogFloatShares 一族富集,没有任何分钟收益形状类的子树。所以本位全用 30-60 日平均的慢变量,度量分钟层面的收益形状。
