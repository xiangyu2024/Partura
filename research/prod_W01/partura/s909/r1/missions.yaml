    hypothesis: |-
      机制(时段结构 / clientele):一天里的收益和成交额落在哪个时段,反映是谁在交易:隔夜与开盘集合竞价承载消息和机构的预先挂单,盘中是散户噪声与流动性交易,尾盘是调仓和被动资金。Lou-Polk-Skouras 2019 的 tug of war 显示,个股的隔夜收益与日内收益各有持续的 clientele 结构,且能在月到季度尺度上预测横截面;Berkman 等 2012 发现高关注度股票隔夜上涨、开盘后回落,开盘买入有隐性成本,说明隔夜与日内是两类不同的资金。总收益 = 隔夜 + 日内,20 日反转控制只看二者之和,而本位看的是二者的差异与"钱在什么时候、往哪个方向交易"。
      算子怎样实现:隔夜收益 day_first(Open)/ts_delay(day_last(Close),1)-1(Open 的第 0 列是 09:30 集合竞价,Close 是后复权价格,除权日连续),日内收益 day_last(Close)/day_first(Open)-1,各做 60 日 cross_mean(慢的 cross_ema 版本半衰期 30-60 日),或二者的秩差 / 比值差;收盘相对成交均价的"尾盘推拉" day_last(Close)/day_wmean(Close,Volume)(VWAP 用成交量加权平均价),最后 30 分钟涨幅(in_delay(Close,30) 取 30 分钟前的收盘价);成交额在一天里的重心 day_centroid(Amt),尾盘 30 分钟与开盘 30 分钟成交额占比 day_wmean(is_gt(in_index(Amt),0.875),Amt) 与 is_lt(...,0.125);价格相对时间的相关 day_corr(in_index(Close),Close)(盘中是涨势还是回落);放量方向配对:day_signed_ratio(in_pct(Close,5),Amt)(按成交额加权的上涨占比减下跌占比)、day_wmean(Ret,Amt)-day_mean(Ret)(成交额加权收益减等权收益)、day_topw_mean(in_pct(Close,1),Volume)(最放量 10% 分钟的平均涨幅)、day_corr(Amt,in_pct(Close,5)),以及开源证券"聪明钱"式的 Q 值:按 |分钟涨幅|/sqrt(成交量) 选出最"聪明"的分钟,取这些分钟的 Vwap 均值除以全天 VWAP;全部用 cross_mean 在 60 日上平均。
      与库和控制的区别:库里目前没有 head。5 个控制是水平量(成交额水平、波动水平、20 日总收益反转、Amt 日内离散度、市值),本组是"时间分解"和"方向与放量的配对",对象不同:总收益被拆成隔夜、日内、尾盘三段,成交额只看分布在一天里的位置而不是水平,分钟方向只看谁在放量时买卖。残差化后线性、U 形、S 形的水平暴露已被去掉。
      样本外为什么还在:clientele(谁在隔夜、谁在盘中、谁在尾盘交易)是持续的结构,A 股散户占比高,日内模式在年度尺度上稳定;60 日平均把噪声压下去,信号慢、换手低、成本不致命;方向与半衰期只在 train 选,valid 复核。
    inspired_by: |-
      M 第 1 批:90 个已评分候选整体均值约 -1.14,0 个 head;含 neg(LogFloatShares) 子树的 27 个候选均值 -0.60,其余 63 个 -1.38。静态字段(换手几乎为 0)好于其余,提示成本拖累是主要失败模式,慢变量占优。共性表里没有出现任何按交易时段拆分(隔夜 / 日内 / 尾盘)或按分钟方向与放量配对的子树,这一块还没有被试过。所以本位用 60 日平均的时段结构量。
