    reasons: '创新度 4。库里 0 个 head（corr_1.json 的 heads=0），所以只能和五个控制比。留下的 14 个种子都是分钟收益形状量（day_skew、day_kurt、尾部形状、max 对 std、gini、正收益占比），加上日线的 ts_skew 与半方差不对称；与五个控制的 |ρ| 大多在 0.01 到 0.48 之间。种子 1、2、3 是同一假设的参数版本（5 分钟收盘、15 分钟收盘、10 分钟 Vwap），表达式不同，不算重复。换写法风险两处，都放行：种子 10（cs_rank 的半方差差）与 rev 的 |ρ| 为 0.61，超过表里 0.5 的标记，但它是两个半方差秩之差，不是 20 日反转本身，规则的自动划线是 0.8，故保留并记录；种子 9 与 rev 为 0.40。种子 12、13 与 liq 为 0.39 与 0.45，是成交稀疏带来的混杂（零变动分钟被计入「非上涨」），不是同一个东西。合理度 4。机制清楚：A 股散户占比高、卖空受限、有涨跌停，彩票型收益形状被高估，形状越像彩票未来收益越低，纯多头只取另一端（Kumar 2009、Bali 等 2011 一脉）。逐个核对算子：in_pct 基数为 0 处给 NaN；day_skew 与 day_kurt 在全冻结日为 NaN，峰度有界；ts_skew 尺度不变且有界；cross_semistd 两侧同为 0 时为 NaN，比值在 [-1,1]；rolling_windows 因果，没有前视；没有用到禁用算子。划掉 5 和 6，理由是数学问题（§4 数值伪影）：day_es_ratio_hi 的分母是当日 95% 分位数，保护阈值 1e-8 比一个最小价位档的 in_pct（约 1e-4 量级）小四个数量级。一天里几乎全是 0、上行 5 分钟只有寥寥几次时，插值后的分位数落在 0 与最小正档之间，分母只剩 1e-5 量级，比值可以冲到百量级，60 日平均后该股直接顶到截面顶端，与 ops_ext 注释里「分位数近零则 NaN」的意图不符。种子 6 的 es_lo 在涨停锁死、下行窗口寥寥时有镜像问题。出现频率要 PI 用数据核，本审计员读不到数据。其余不划：种子 4 的峰度在一两次非零变动的日子饱和到约 n/2 到 n，是 kurtosis 的已知性质（ops_ext 的 day_flat_run_max 注释也记了），有界，但会把冻住的日子顶上去，PI 应知道；它与 liq 只有 0.049，不像是换成了流动性。种子 15 门槛判废品（distinct 0.487，截面近半并列，常见情形是日内最高价只出现一两分钟，信号是离散计数）。按 §4，并列靠列序打破不是挡的理由，所以不划，但请 PI 知悉这一位的分辨率很低。剩 14 个，远高于 4。如果它有 alpha，最可能来自涨跌停与彩票偏好带来的右尾、左尾形状差；它是 30 到 60 日的慢变量，换手低，15 bp 成本不致命。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [16]
    reasons: '创新度 4。库里 0 个 head，与控制比：本位的核心（隔夜、日内、尾盘的时段分解，放量方向配对）与五个控制的 |ρ| 大多在 0.01 到 0.4 之间，例如种子 2 与 rev 为 0.35，种子 11 与 vol 为 0.36、known 为 0.33。换写法风险两处，都放行：种子 6（成交额重心）与 liq 0.56、known 0.57，种子 7（尾盘 30 分钟成交占比）与 liq 0.56、known 0.54，超过表里 0.5 的标记。但它们度量的是成交额在日内的时间位置，不是成交额水平，也不是日内离散度，不判为同一个东西。合理度 4。机制清楚：隔夜与日内是两类资金和信息（Lou、Polk、Skouras 2019 的 tug of war，Berkman 等 2012 的开盘买入隐性成本），尾盘与开盘的成交占比反映谁在交易。逐个核对：day_first 取首个有效值、day_last 取末个有效值；in_delay(Close,30) 正确右移，所以种子 9 是尾盘 30 分钟涨幅；is_gt、is_lt 对 NaN 给 0，但 day_wmean 按 Amt 的有限性剔除，所以种子 7、8 是有效分钟内的成交占比，没有填充偏差；cross_ema 的半衰期定义与块递推核对过，因果；day_wmean、day_signed_ratio 的分母有 clamp 并以 >0 判断给 NaN，有界；day_corr 在全平盘日返回 0 而非 NaN，是中性填充，只影响冻结日，不足以支配截面，不划；没有前视（所有用到当日分钟的量都在收盘后可得，且窗口因果）。划掉 16，理由是重复：它与种子 1 输入相同、窗口量级相同，只把 cross_mean 换成 cross_ema，两者几乎是同一个赌注。GP 的库禁令按算子骨架判（cross_ema 与 cross_mean 骨架不同），抓不到这种重复，所以在这里划。两点记录、不划：种子 13 在成交量为 0 的分钟占比超过 90% 的股票上，阈值为 0，全部分钟入选，退化为全天均值；种子 14 的 |ret|/sqrt(Volume) 在 Volume=0 且 ret≠0 时为 inf，若数据里出现这种分钟会整批入选，我看不到数据，无法判断是否出现。如果它有 alpha，最可能来自隔夜与日内承担的不同信息与资金（消息和机构的隔夜挂单对散户的盘中交易），以及尾盘与放量分钟的成交方向；都是慢变量，换手低。剩 15 个，远高于 4。'
