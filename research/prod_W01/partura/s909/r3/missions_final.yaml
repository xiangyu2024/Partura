  hypothesis: "核心 C1 = cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap)))。逐个算子读:day_first(Volume)\
    \ 是当天第一个有效分钟的成交量,立方体第 0 列是 09:30 集合竞价,所以它就是开盘集合竞价的成交股数(该列缺失时退到首个连续竞价分钟,是测量上的小毛病,不是数学问题);mul(·,\
    \ 1) 乘 1,不起作用;day_quantile(inv(Vwap)) 是当天各分钟 1/Vwap 的中位数,价格字段是后复权价,所以它在截面上的最高\
    \ 20% 是后复权价最低的 20%(自基期以来累计收益最差、或起点价低的长期输家);cs_first_high20(y, x) = rank(y) + 1(x\
    \ 处在截面最高 20% 的整块并列内),也就是把这 20% 整体抬到全市场最前面,段内、段外都按集合竞价成交量排序。十分位多头书因此取自『后复权价最低的\
    \ 20% 里,集合竞价量最大的那一半』。\n\n位置与证据:库里 10 个 head 有 7 个逐字含 C1(M 第 2 批 1 个、第 2 轮 Pr2a\
    \ 6 个),另有 head 3(把 Volume 换成 Amt)和 head 8(把 Volume 换成常数 1)是它的变体;拆解里 C1 单独 +0.85(train\
    \ +0.85 / valid +2.44),Volume→Amt 和 Vwap→Close 互换都保持分数(+1.0 到 +1.2),只留价格(不带集合竞价量)是\
    \ -1.35,所以信息在『低价段 × 集合竞价参与度』这个结构里。这是 C1 的第二个也是最后一个 E 位(第 2 轮已用过一次)。\n\n本位和第 2\
    \ 轮不同的三点:\n(1) 库禁令的几何。库里 8 个 head 共享同一块 20% 的低价整块;两个输出共享这块、段内排序又互相独立时,日度秩相关本来就约\
    \ 0.66,段内稍有正相关就越过 0.7。所以在低价块里再换一种排序、或再套低价块的写法,基本都会被库禁令拒绝。本位反过来做:把 C1 当排序变量,放进一个与低价块『独立』的第二块整块闸门\
    \ X 里,cs_first_high20(C1, X) = rank(C1) + 1(X 在最高 20%)。按独立假设粗算,这样的输出与只含低价块的 head\
    \ 的日度秩相关约 0.34–0.59,远低于 0.7,GP 才有空间长出新 head;宽度为 40% 的版本(种子 13–15)更低(约 0.3–0.5)。\n\
    (2) 闸门全部换新。第 2 轮用过的闸门(20 日隔夜跳空、5 日收益、OS30、20 日暴跌倾向、20 日报价冻结占比、ListAge 屏、日波动、金额加权买卖压力)一个都不用。新闸门每个都有自己的机制:\n\
    \  · 异常成交量 ABNV = cross_mean(cross_zscore(day_sum(Volume), 60), 5) 的最高 20%(种子\
    \ 2、9、15):近 5 日成交量相对自己 60 日的异常程度,Gervais-Kaniel-Mingelgrin 2001 的 high-volume\
    \ return premium(突然被关注的股票随后有超额收益)。cross_zscore 在窗口近似常数时记 0,没有除近零。\n  · 异常集合竞价量\
    \ ABNA(同样做法,读 day_first(Volume),种子 3、10):核心读集合竞价量的『水平』,这里读它相对自己 60 日的『冲击』,是时间序列上的关注冲击,与水平的相关是中等的。\n\
    \  · 接近 60 日高点 NH60 = day_last(Close) / ts_max(day_last(Close), 60) 的最高 20% /\
    \ 40%(种子 4、11、14):比值在 (0, 1],分母是正的价格,不会除近零;George-Hwang 2004 的 52 周高点锚定效应的短窗口版。\n\
    \  · 持续的盘中走弱 ID40 = 40 日平均的(收盘 / 开盘 - 1)的最低 20%(种子 5、12):Lou-Polk-Skouras 2019\
    \ 的『隔夜收益持续、盘中收益反转』,盘中持续弱的股票是隔夜强的股票的另一面,但它与第 2 轮的 20 日隔夜跳空闸门只是部分重叠(整块重叠估计约一半),不是同一个闸门。\n\
    \  · 隔夜减盘中的 60 日差 TUG = cross_mean(隔夜跳空, 60) - cross_mean(盘中收益, 60) 的最高 20%(种子\
    \ 6):同一篇文献的『拔河』量,既不是单独的隔夜也不是总收益,与 20 日跳空闸门的整块重叠估计 0.5–0.6。\n  · 限售比 FF = LogTotalCap\
    \ - LogFloatCap(≥ 0,总股本对流通股本的对数比)的最高 20% / 40%(种子 7、13):流通盘占总股本比例低 = 大股东控盘、可流通筹码稀缺的股票。全流通的股票\
    \ FF = 0,是最低端的并列块,最高端应是连续分布,整块不会被并列吃掉(整块按整个并列块算,即使变窄也只会更窄)。\n  · 名义价 NP = LogFloatCap\
    \ - LogFloatShares 的最低 20%(种子 8):LogFloatShares = LogFloatCap - log(名义价),所以 NP\
    \ 是对数名义价;Kumar 2009 / Birru-Wang 2016 的『低价股=彩票型需求』。C1 里的价格轴是后复权价,即累计收益轴,不是名义价轴,二者相关但不同,这个种子检验信息在哪条价格轴上。\n\
    (3) 种子 1 是裸核心 C1。它在拆解里单独 +0.85,但不在 heads 里(拆解的评估不进库;如果它曾作为候选被评估过,多半是因与 head 4\
    \ = ListAge 屏 + C1 的日度秩相关 ≥ 0.7 被库禁令挡掉,若是这样相关度表会把它划掉,这个种子就只是一次便宜的核对)。种子 9–12 不是整块抬升,而是\
    \ rank(C1) 加(或减)半个权重的上述变量,输出与 rank(C1) 的相关约 0.89,与 head 的相关取决于 head 对 C1 的改动幅度。\n\
    \n为什么样本外还会在:核心里的两个量是市场结构性的——长期输家(后复权价最低)和开盘集合竞价参与度(A 股散户占比高,限价单集中在集合竞价),前者是 De\
    \ Bondt-Thaler 一脉的长周期反转与低价彩票需求,后者在 Lee-Swaminathan 2000 的『过去收益 × 成交量』交互里是情绪 /\
    \ 关注度度量,都不依赖某一年的行情。新闸门都是 20–60 日的慢变量,换手不会被 15 bp 成本吃掉,各自有跨市场的文献,不是为这一段样本挑的。需要诚实交代的:库里\
    \ 10 个 head 的 valid 都是 train 的 1 到 4 倍,分数取较差者,train(2018–2021)是紧约束,2022–2023 对这类段更友好,是推断没有数据;闸门若本身与收益无关,输出只是把\
    \ C1 的书缩到一块随机的 20% 里,分数会往下掉,所以预计一半以上的种子过不了 0.5。"
