- type: N
  hypothesis: "想法:库里的 C1 家族(10 个 head 里 7 个逐字含 C1,另有 2 个是它的变体)把两件事绑在一起——『后复权价最低的 20%\
    \ 整块』和『集合竞价的成交股数』。本位要拆开它们:信息到底在哪条价格轴上(后复权价 = 累计收益轴;名义价 = 彩票型需求轴;后复权价最高的一端),在哪种『参与度』上(股数水平、相对自己历史的异常、带方向的压力),以及去掉低价整块之后是否还在。种子都不含\
    \ C1 本身;除种子 10 外也都不共享后复权价最低 20% 那一块(种子 10 保留了这一块,但排序变量换成了异常冲击),按独立假设粗算,与库里 head\
    \ 的日度秩相关多数在 0.3–0.5,低于库禁令的 0.7。\n\n依据(都来自本批现象):(i) 三个符号为 -1 的 head(head 5、6、10)按公式手算的读法(没有数据证实):head\
    \ 5 的多头是『低价块 ∪ 集合竞价量最大的非低价股』里后复权价最高的一端,head 6、10 的多头是低价块之外集合竞价量最低、且不在各自闸门里的股票;而符号\
    \ +1 的 head 取低价端的高集合竞价量。同一个变量在价格轴的两头都出现过,所以价格轴的『高价一端』也值得试(种子 4、5);(ii) Volume→Amt、Vwap→Close\
    \ 互换不掉分,说明不是某个具体字段;(iii) 去掉集合竞价量只留价格段是 -1.35,至于价格中性的金额口径水平,我的推断是它会被流动性控制吃掉(同一价格十分位内,股数排序\
    \ ≈ 金额排序,即流动性排序),所以本位的参与度只以『股数』或『相对自己历史』的形式出现,不做价格中性;(iv) 开盘占比单列的集合竞价(0.004)弱于开盘\
    \ 30 分钟(0.125),说明连续竞价的前 30 分钟也有内容。\n\n种子分四组,每个算子的读法:\n A 组(换价格轴,种子 1–5):cs_first_low20(y,\
    \ x) = rank(y) + 1(x 处在截面最低 20% 的整块内)。种子 1、2 用 NP = LogFloatCap - LogFloatShares(对数名义价)的最低\
    \ 20% / 40%,按集合竞价股数排序;种子 3 把排序变量换成『集合竞价股数的截面秩 - 流通股本的截面秩』(集合竞价的换手率型度量);种子 4、5\
    \ 用 day_quantile(inv(Vwap)) 的最低 20% / 40%,即后复权价最高的一端(长期赢家)。\n B 组(规模中性的股数水平,种子\
    \ 6、7):cs_bucket_rank(y, x) = y 在 x 同一十分位内的百分位秩,x = LogFloatCap。同一市值十分位内,股数大 =\
    \ 名义价低,这里保留名义价信息,只去掉规模;种子 7 先做 20 日平均,是慢版本。\n C 组(相对自己历史的异常,种子 8–11):cross_zscore(x,\
    \ 60) = (今日 - 60 日均值) / (60 日标准差 + EPS),窗口近似常数时记 0,没有除近零;再做 5 日平均(cross_mean)。种子\
    \ 8 读集合竞价股数;种子 9 读集合竞价量占全天量的比例(div(day_first(Volume), day_sum(Volume)),分母 ≥ 分子\
    \ > 0 或双 NaN,没有爆点);种子 10 把异常集合竞价量放进后复权价最低 20% 整块内排序,种子 11 放进名义价最低 20% 整块内排序。这一组不依赖『水平』,与流动性控制的相关应当低。\n\
    \ D 组(去掉低价块,换成别的段 / 带方向,种子 12–16):种子 12 = 按集合竞价股数排序、闸门是 40 日平均隔夜跳空的最高 20%(持续的隔夜正跳空,Lou-Polk-Skouras\
    \ 2019);种子 13 = cross_mean(rank(集合竞价量) × (rank(隔夜跳空) - 0.5), 40),带方向的集合竞价压力(秩的乘积,有界,不含除法);种子\
    \ 14、15 用 FF = LogTotalCap - LogFloatCap(总股本对流通股本的对数比)的最高 20% 当闸门(流通比最低 = 控盘、可流通筹码稀缺);种子\
    \ 16 = 规模中性的股数水平 + 0.5 × 异常集合竞价量的截面秩。\n\n为什么样本外还会在:假设的机制是『集合竞价股数大 = 散户限价单集中的关注度』,A\
    \ 股散户占成交的大头,集合竞价是散户最集中的时点(Barber-Odean 2008:散户买入集中在引起注意的股票上);不同组检验的是这个关注度和哪条价格轴、哪种形式结合,而不是某一年的风格。若全部失败,说明\
    \ C1 家族的信息是后复权价低价块 × 股数水平的特有结构,而不是普适的『开盘关注度』——这本身就是清楚的结论。需要诚实交代:每个种子单独过 0.5 的概率都不高(我估计\
    \ 10–15%);这个位的价值在于把信息归到某条轴上。"
