  reasons: 创新度 4。16 个种子与 10 个 head 的原始 |ρ| 最大 0.68（种子 12，最像 head 2 的隔夜闸门加 C1），其余 ≤ 0.62。8（ABNA，0.31）、9（异常集合竞价占比，0.25）、13（带方向的集合竞价压力，0.24）、3（0.33）、11（0.35）与所有 head 的残差只有 0.10–0.29，是真正的新方向。与控制的原始 |ρ|：4、5 与 liq / known 为 0.63–0.66，股数口径的集合竞价量在高价段里几乎就是流动性，这是伪装，但没到 0.8 的自动划线，残差后的信号要看 corr_1 的残差列。12 残差 0.75，与 head 2 接近，但放行。1 与 2、4 与 5 是窗口或带宽的参数版本（r1 的 1–3 也是这样放行的）；6 与 16 只差一个 0.5×ABNA 的加项，控制的 profile 不同（liq 0.36 对 0.27），不是同一个东西，不划。合理度 4。各组机制清楚：集合竞价股数与开盘 30 分钟的关注冲击（Barber-Odean 一类）、名义价的彩票需求（Kumar 2009，Birru-Wang 2016）、隔夜跳空的持续性（Lou-Polk-Skouras 2019）。逐算子核对：NP = LogFloatCap − LogFloatShares，FloatCap 取 circulating_market_value、FloatShares 取 circulating_capital（AlphaCube scripts/build_daily_fields.py 文件头），两者相除是当日的名义价，不是后复权价；cs_first_low20、cs_first_high20、cs_bucket_rank 的实现与注释一致（整块并列进带，十分位内各自均匀）；cross_zscore 有界；div(day_first(Volume), day_sum(Volume)) 的分子不超过分母，分母为 0 时双 NaN，不爆点；13 的 cs_rank 乘积有界；全部没有前视。覆盖率 0.998–0.999，distinct ≥ 0.998，面板不退化。两点不挡但要 PI 注意：（i）股数口径的排序变量在同一个价格段里与名义价机械相关（股数 ∝ 金额/价格），1–7、10、12、14–16 的排序里有名义价成分，解读时要把「关注」与「低价」分开，R3 的 Amt 版本是检验；（ii）day_first(Volume) 的第 0 列若在训练段某个时期系统性缺失，那一段 b 位的全部种子实际读的是 09:31 连续竞价量，PI 应核一下训练段第 0 列的缺失比例。如果它有 alpha，最可能来自开盘集合竞价与开盘 30 分钟的关注冲击（ABNA 与异常占比，即 8–11）与名义价彩票需求（1–3）的交互；都是 20–60 日的慢变量，换手低，15 bp 成本不致命。
R:
- head: cs_last_low20(cs_first_high20(mul(day_first(Volume), 1), cs_first_high20(cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap))), cross_mean(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), 20))), ListAge)
  soundness: 4
  reasons: 合理度 4。只改窗口（20→40、60）和 v3、v4 去掉外层一层 C1。隔夜跳空 open/ts_delay(day_last(Close),1) 的分母是昨收（正价格，不除近零）。ListAge 屏是秩屏（cs_last_low20 把整块推到底部），哨兵值 10000 只让窗口起点前上市的股票并列成一块，不改变秩屏的结果；屏掉的是窗口内上市的股票（窗口内新股超过 20% 的日子，屏的是其中最新的 20%）。无前视，无 §4 问题。残差 |ρ| 与原 head 0.73–0.91，符合去烂部件的意图。
- head: add(cs_first_high20(cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap))), cross_mean(sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1), 20)), mul(cs_rank(cross_quantile_q75(day_wmean(is_lt(in_index(Amt), 0.125), Vwap), 30)), 0.5))
  soundness: 3
  reasons: 合理度 3（不是数学问题，但机制描述与算子不符）。day_wmean(x,w) = Σx·|w| / Σ|w|（ops_ext.py 的定义），这里 x 是 0/1 的开盘 30 分钟掩码、w 是 Vwap，所以 0.5×rank 里的那一项是 Vwap 加权的时间份额，近似 0.124 × （开盘 30 分钟均价 / 全天均价），是价格路径量，不是「开盘 30 分钟时间份额」。PI 的 why 与计划都写成时间份额，应改称价格路径；或把权重改成 Amt（成交额的时间分布）再检验。窗口 40 / 60 与 ListAge 屏本身无问题。
- head: cs_last_low20(cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap))), ListAge)
  soundness: 4
  reasons: 合理度 4。Amt 版本（day_first(Amt)）去掉股数随名义价的机械变化，与 PI 的 why 一致；40% 屏是 ListAge 秩屏的带宽，逻辑同 R1。分母只有价格，无前视，无 §4 问题。原始 |ρ| 0.96–0.99，与 head 4 几乎是同一个东西；能否替换由分数决定，与合理度无关。
- head: cs_first_high20(cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap))), cross_mean(sub(div(day_first(Close), ts_delay(day_last(Close), 5)), 1), 20))
  soundness: 4
  reasons: 合理度 4。cross_mean(day_first(Close)/ts_delay(day_last(Close),5) − 1, 40)：分母是 5 个交易日前的收盘价（正价格），分子是当日 09:30 价，都在收盘前可得；窗口 20→40 只是换一个长度。无 §4 问题。
- head: cs_first_high20(cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap))), cross_mean(sub(div(day_first(Open), ts_delay(day_last(Volume), 1)), 1), 20))
  soundness: 3
  reasons: 合理度 3。分母 ts_delay(day_last(Volume),1) 是昨日最后一个有效分钟的股数，div 没有保护（common.py 的 div 直接 torch.divide），成交股数为 0 时得 +inf；cs 函数（_lexi）把 inf 当缺失，而 cross_mean 只要窗口里有一个 inf，整个窗口的股票就退出截面。候选覆盖率 0.957，其他候选在 0.99 以上，即约 4% 的截面-日因此缺失。单位也不一致（元 ÷ 股），PI 的 why 承认它「主要是收盘量的倒数」。这不是算出错误的数，但属于 §4「除以近零的量」的风险：1/股数 是厚尾，40 日均值可能被单日稀薄成交支配。是否真的支配截面，需要 PI 用训练段数据核（缺失集中在哪些股票；40 日均值的截面前 1% 是否来自单日爆点）。核实前不挡；若核出支配，应判 1 并删组。
- head: cs_first_high20(cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap))), cross_mean(sub(div(day_first(Close), ts_delay(ListAge, 1)), 1), 20))
  soundness: 1
  reasons: 合理度 1（数学问题，删组）。ts_delay(ListAge,1) 在上市后第二个交易日为 0（ListAge 在首个生命周期日为 0，dailyfields.py 的 _list_age），div(close, 0) 得 +inf，闸门对这些新股缺失 40 天（候选覆盖率 0.987 与之相符）。更根本的是哨兵值：窗口开始前已上市的股票 ListAge = 10000 + t（LIST_AGE_SENTINEL），它们的闸门约为 close/10000，新股的闸门约为 close/年龄，两者量级差 10² 到 10⁴ 倍。老股与新股在闸门里的先后顺序由哨兵常数 10000 决定（改哨兵值会改变两类股票的相对顺序），而除以很小的年龄又让闸门被上市初期的股票支配。这是 §4「结果主要由哨兵填充值与近零分母决定」。R 组的「窗口 20 随手写」修不了它。另外，库里 head 10 带着同一个闸门（+0.55，valid +0.80），它的分数更可能来自「把最近上市的股票排出多头」，不是它声称的集合竞价机制；PI 解读 head 10 时应改写。
- head: cross_mean(day_wmean(is_lt(in_index(is_lt(in_index(Amt), 0.125)), 0.125), Amt), 30)
  soundness: 4
  reasons: 合理度 4。阈值 0.1875（45 分钟）与 Volume 权重两个版本：day_wmean 按 |w| 加权，分母在有效分钟上非零，结果在 [0,1]；is_lt 把 NaN 分钟记 0（与 head 9 相同）。无前视，无 §4 问题。原始 |ρ| 0.97，与 head 9 是同一表达式的阈值变体，能否替换由分数决定。
- head: cs_last_high40(day_quantile(inv(Vwap)), cs_first_high20(mul(day_first(Volume), 1), day_quantile(inv(Vwap))))
  soundness: 4
  reasons: 合理度 4。cs_last_high40 的闸门 x 是 C1 的输出（秩值，在 (0,2] 内），top 40% 整块推到底部，与 _lexi 的实现一致；y = day_quantile(inv(Vwap)) 是价格的倒数，Vwap 为正，无近零；Volume→Amt 只改闸门内的排序量，Amt 是金额，没有分母问题。head 5 的多头读法（低价块 ∪ 集合竞价量最大的非低价股中后复权价最高的一端）与 _lexi 的推导一致。无前视。
summary: 种子 909 第 3 轮审计：a 位通过（创新 3、合理 4，表格自动划掉 9 个后余 6 个），b 位通过（创新 4、合理 4，16 个全留），R 组 8 个中删 R6（head 10 窗口变体：新股除以 ListAge 近零且哨兵值 10000 决定闸门，数学问题）；R5（head 6）合理度 3 保留，需 PI 核收盘分钟量的分布，R2（head 1）机制描述与算子不符但不挡。
