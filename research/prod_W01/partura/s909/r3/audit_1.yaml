  reasons: 创新度 3。核心 C1 = cs_first_high20(mul(day_first(Volume),1), day_quantile(inv(Vwap))) 已逐字出现在 7 个 head 里（head 1、2、4、5、6、7、10），所以新东西只能来自外围。原始 |ρ| ≥ 0.7 的 9 个种子（1、2、3、4、8、9、10、11、12）按表格规则自动划掉，这里一并列出（与 r2 的做法一致）：1 是裸核心（0.88，最像 head 4 即 C1 加 ListAge 屏）；8–12 最像 head 4（0.77–0.82）；2–4 最像某个 C1 闸门类 head（0.71）。余下 5、6、7、13、14、15，共 6 个（≥ 4）。其中 13（FF 高 40%）残差 |ρ| 0.37、原始 0.39，是真的新；7（FF 高 20%，残差 0.57）和 5（ID40 低 20%，残差 0.65）是新闸门；6（TUG，残差 0.71，最像 head 1，两者都用隔夜闸门）、14（NH60 高 40%，残差 0.69）、15（ABNV 高 40%，残差 0.72）在奖励空间里与 head 接近。不是同一个东西，但也谈不上真正新，所以给 3，不给 4。合理度 4。逐算子核对：day_quantile(inv(Vwap)) 的截面高 20% 即后复权价最低的 20%（ops_ext.py 的 _lexi：整块并列、带宽不超过 20%，与注释一致）；day_first(Volume) 在第 0 列是 09:30 集合竞价股数，缺列时退到首个连续竞价分钟，是测量小毛病，不挡；闸门全是当日收盘后可得或更早的量，无前视；NH60 的分母是正价格的 60 日最高收盘，不除近零；ABNV 的 cross_zscore 是 (x−均值)/(标准差+EPS)，|z| ≤ √59、常数窗口记 0，不爆点；FF = LogTotalCap − LogFloatCap = log(总股本/流通股本)，同一价格下相减，与价格无关。覆盖率 0.998–0.999，distinct 0.87–1.0，面板不退化。核心与五个控制的原始 |ρ| 最大 0.26（known），过 E 位门槛 0.8。计划文字需 PI 修正（不构成挡理由）：写的是「最高 20%（种子 2、9、15）」「20%/40%（种子 4、11、14）」「最低 20%（种子 5、12）」，但 9、11 是 rank 线性组合（×0.5），12 是 rank 相减，15 与 14 是 40% 带宽。如果它有 alpha，最可能来自后复权价低的长期输家里、按开盘集合竞价股数排序的交互；换手低的 FF（流通比）与 NH60 闸门是最可能带来不同收益来源的两个。
