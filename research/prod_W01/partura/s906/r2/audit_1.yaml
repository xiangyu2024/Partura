attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [2, 4, 5]
    reasons: '核心 C20 = cross_mean(day_centroid(Amt),20) 是 head 3(cs_first_high40(W, C20))与 head 4 的子树,核心资格过;核心与五个控制的 |ρ| 为 liq 0.48、vol 0.42、rev 0.19、known 0.51、size 0.13,都低于 0.8。核心自身与 head 3 的原始 |ρ| 为 0.71:head 3 就是 C20 在 W 带里的重排,所以外围必须真正换掉 W。自动划掉 2、4、5:与 head 3 的原始 |ρ| 分别为 0.712、0.706、0.704,按 §3 确定性规则划掉(2、4 是 cs_bucket_rank(C20, 市值 / 股本) 的同一写法,5 是它的 cs_regres 版本)。逐个:1、3 为 cs_bucket_rank(C20, 已知族 / 日波动),在同等已知族十分位内排序,算子无误;与 head 的原始 |ρ| 0.63 / 0.63、残差 0.66 / 0.66,与控制最大 0.31(1 的 vol)、0.39(3 的 known)。6、7 都是 C20 减去自身 120 日历史(6 再除以个股自身的 120 日标准差),只差一个逐股正数的缩放,排序有差异但属同一想法;按只挡明显同一度量的原则放行两个,PI 应当当一个想法读;前 120 天为部分窗口热身期,约占训练段 12%,不是主导;7 的首日全为 0 由列序打破,§4 不算问题。8、9 为 cs_first_low20 / cs_last_low20(C20, ListAge)。核对了 dailyfields._list_age:老股 ListAge 是同值的 10000 加日数,_rank_block 把它当整块,不进带,与 PI 的说明一致;但带的实际大小是 min(2018 年后上市的名字数, 20%),样本早期(估计 2018 至 2020 年)远不到 20%,「最晚的 20%」只在后期成立,这是定义上的时变,不是数学问题;与 head 的原始 |ρ| 0.58 / 0.61,与控制最大 0.40 / 0.44(known)。10、11 为 cs_first_high20 / cs_last_high20(C20, LogTotalCap − LogFloatCap),带为限售比例最高 20%;无限售名字的 log 差应恰为 0,成一整块,带里就是限售名字;与 head 的 |ρ| 0.47 / 0.49,与 size 的 |ρ| 0.38 / 0.21。12、13、14 为秩差(秩 C20 − 秩 RetC)、(秩开盘占比 − 秩 C20)、(秩 C20 − 秩 gini),算子无误;与 head 的 |ρ| 0.33 / 0.61 / 0.44;12 与 N 位 5 同源,按 PI 的 D 组设计只在 E 位保留这一条写法。15 为 cs_last_low20(C20, cs_first_low20(LFC, LFC)),核对嵌套:内层把市值最小 20% 推到顶,外层的带因此取到的是市值秩 20%–40%,与 PI 的说明一致;与 head 1 的原始 |ρ| 0.49(残差 0.56)。16 为 cs_first_high20(cs_first_low20(LFC, LFC), C20),带为 C20 最高 20%,是 head 3 的市值版(带宽 20%);与 head 1 的原始 |ρ| 0.66、残差 0.48,控制最大 0.19,低于 0.7,不自动划掉。创新度 4:外围的带变量(ListAge、限售比例、市值 20%–40%、十分位内排序、秩差)都不在库里。合理度 4:机制清楚,算子逐个核对无误;没有触及 §4 已知的 nanrank_last(本位不用 ts_rank、cross_rank、in_rank_rolling;cs_rank 是普通排名,不经过 nanrank_last);停牌日叶子在引擎里被掩为缺失(engine 的 _mask_cube,apply_mask 默认开),所以 day_centroid 在停牌日是缺失而不是 0。划完还剩 13 个。如果它有 alpha,最可能来自:C20 的权重在第 240 根(15:00,t/240 = 1)最大,它主要读的是尾盘集合竞价的成交份额与日内成交重心,即持有人结构(机构尾盘调仓与散户早盘);带变量(次新股、限售比例、市值 20%–40%)决定哪一类票的时点信号被采用。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: 'N 位 14 个种子。与库里 13 个 head 的原始 |ρ| 最大为 0.66(种子 8),其余多在 0.6 以下;与五个控制的 |ρ| 最大为 0.685(种子 8 的 liq)与 0.636(种子 7 的 liq),都未到 0.8,无自动划掉。逐个:1(开盘集合竞价占比的 20 日均值):div 有界于 [0,1],0/0 为缺失;与 head 的 |ρ| 0.35,最近的是以 day_first 水平为部件的 sigmoid head,份额与水平不是同一个量。注意 day_first 取的是第一个非缺失值,若某票某日 09:30 缺失就会取 09:31 那根,这是数据定义上要核对的点,不是挡的理由。2(14:31–15:00 占比):in_slice(Amt,211,240) 是闭区间,恰为 30 根,对应 14:31–15:00;与核心最接近(末段权重最大),与含重心的 head 的 |ρ| 0.54;PI 应把它与 C20 的结果放在一起读。3(09:31–10:00 占比):in_slice(Amt,1,30) 正确;与 head 3 的 |ρ| 0.62(head 3 含 C20),是早盘时点的一个坐标。4(13:01–13:30 占比):in_slice(Amt,121,150) 正确;与所有 head 的 |ρ| 都在 0.26 以下,最干净。5(RetC − AmtC 的 20 日均值,未秩化):与 E 位 12 的概念相同(那边是对两个成分取秩);按重复可以划,但它是 N 位,而 E 位已保留这一概念,所以这里放行,PI 不要把两者当成两个独立结果。6(Amt 加权的时间标准差):是时点的二阶矩,与重心不同;与 head 的 |ρ| 0.18,与控制最大 0.29。7(|t−0.5| 与 Amt 的相关,U 形):Pearson 对端点的大分钟敏感(09:30 集合竞价与 15:00 的 |t−0.5| 都是 0.5),实际读的是两端的份额,与 1、2 有重叠;与 liq 0.64、known 0.62,残差后与 head 的 |ρ| 0.21。8(t 与 Amt 的相关,后置程度):数学上 corr(t,Amt) = (C_d − 0.5)/(0.2887 × CV_d),即当日重心偏离乘以日内成交额变异系数的倒数,是 C20 的同一时点信息加了日度权重;PI 自己写「与重心近似,作为对照」。按只挡明显同一度量的原则不划,但它的结果应当当作 C20 的变体读,不计入 N 位的独立发现;与 liq 0.685、known 0.674。9(day_es_ratio_hi(Amt)):分母是当日 95% 分位数,护栏只有 1e-8 的绝对值。薄股的部分日子 95% 分位数可能只有几手的金额,而前 5% 分钟的均值是大单,比值可以到 1e2–1e4;20 日均值后按截面秩进入排序,薄股的大单日会被顶到前端。这是可能的数值伪影,但我不能在不计算的情况下确认它是否主导截面,按放行原则放行;请 PI 在提交前核对训练段该变量的尾部分布。与 liq 0.52,残差后与 head 的 |ρ| 0.16。10、11(开盘占比、尾段占比按已知族十分位内排序):中性化后的同一坐标,算子正确;已知族的 |ρ| 为 0.007 与 0.008。12(秩开盘占比 − 秩尾段占比):两个 N 坐标的相对位置;与 head 的 |ρ| 0.53,与 known 0.52、liq 0.48。13(5 日开盘占比相对自身 120 日的 z 分数):cross_zscore 的护栏有效(sd 过小记 0);整 120 日一字板的票记 0,是真实状态而不是伪影;与 head 的 |ρ| 0.08。14(RetC − C20 在流通市值十分位内排序):与 5 同源但去掉了市值暴露,算子正确;与 head 的 |ρ| 0.38。创新度 4:库里 13 个 head 没有一个是占比、时段切片、时点差、离散度或 U 形;这些坐标与 C20 的相关靠 2、8 解释。合理度 4:机制清楚(持有人结构、竞价与尾盘调仓),算子无数学问题。如果它有 alpha,最可能来自尾段与开盘集合竞价的成交份额(散户早盘 / 机构尾盘)以及日内成交的分散程度;9 的 alpha 若存在,更可能来自薄股的大单结构,而不是份额本身。划完还剩 14 个。'
R:
  - head: 'cs_first_low20(LogFloatCap, LogFloatCap)'
    soundness: 4
    reasons: 'v1 cs_first_low20(LogFloatCap, LogTotalCap) 把带换成总市值;v2 两个槽都换成总市值;v3 排序用总市值、带用流通市值;v4 把带平滑成 20 日均值。四个都是合法的截面算子组合。换总市值的理由(壳价值与总市值相关)清楚;v4 的理由成立(LogFloatCap 每天随价格变,带边界上的名字天天进出)。需要注意:head 1 的多头腿(取值最低的十分位)在结构上就是流通市值秩 20%–30% 这一档(最小 20% 被推到顶),所以它的 alpha 很可能是一个台阶,多项式残差化去不掉台阶;变体只是换带的位置或换变量,没有去掉台阶。原始 |ρ| 与 head 1:v1 0.24、v2 0.31、v3 0.93、v4 0.92。合理度 4。如果它有 alpha,最可能来自市值 20%–30% 档的台阶,或限售股结构(总市值与流通市值之差)。'
  - head: 'cs_last_low05(cs_first_low20(day_last(Vwap), day_last(Vwap)), day_centroid(Amt))'
    soundness: 4
    reasons: 'v1 与 v2 把单日重心换成 5 日 / 20 日均值作带;v3 与 v4 把带宽放宽到 10% / 20% 并用 20 日均值。理由清楚:单日重心是噪声,平滑后的重心是持续的个股特征;算子正确,无数学问题。注意 v1、v2 与 head 的原始 |ρ| 为 0.88 / 0.85(残差 0.98 / 0.95),是替换候选而不是新结构,按规则会替换原 head。合理度 4。如果它有 alpha,最可能来自持续的时点结构(成交偏早盘或偏尾盘的个股属性),与 C20 同源。'
  - head: 'cs_first_low20(LogFloatCap, day_sum(Low))'
    soundness: 4
    reasons: 'v1 与 v2 把 day_sum(Low) 换成 20 日 / 5 日均值,去掉单日价位噪声;算子正确。v3 把后复权价位换成名义价位 sub(LogFloatCap, LogFloatShares)(流通市值 / 流通股本即未复权价)。核对了数据构建说明:它给出 000001.SZ 在 2026-09-16 流通市值 / 流通股本约为 11.70 元,即名义价位,所以 v3 的带确实与后复权价不在同一空间,理由成立。原始 |ρ| 与 head:v1 0.97、v2 0.99、v3 0.56(v3 与 head 的相关最低,是最有区分度的一个)。合理度 4。如果它有 alpha,最可能来自名义价位的散户低价偏好(v3),或后复权价里的分红送转史(v1、v2 的差别所在)。'
  - head: 'sigmoid(cs_first_low20(cs_first_low20(cross_mean(day_first(Amt), 20), cs_first_low20(day_last(Vwap), day_last(Vwap))), day_last(Vwap)))'
    soundness: 4
    reasons: 'sigmoid 是单调变换,对排序无作用。核对了 head 的结构:外层带是 day_last(Vwap) 的原始价位,内层带是 W(价位最低 20%),内层排序变量是 cross_mean(day_first(Amt),20) 的成交额水平。v1 把水平换成开盘占比 div(day_first(Amt), day_sum(Amt))(有界;水平与流动性同向变化,理由成立),保留 sigmoid 与外层带;v2 去掉 sigmoid 与外层原始价位带,只留 W 与开盘占比,与 why 的描述一致。原始 |ρ| 与 head:v1 0.92、v2 0.74。合理度 4。如果它有 alpha,最可能来自低价位带里开盘竞价的成交份额,而不是成交额的水平。'
  - head: 'cs_last_low20(cross_mean(day_gini(Amt), 20), cs_first_low20(day_last(Vwap), day_last(Vwap)))'
    soundness: 3
    reasons: 'v1 把 gini 的窗口从 20 日拉到 60 日,机制(信号慢而噪)与算子都清楚,合理。v2 把 Amt 换成 Volume,理由写的是「检验这条是不是 Amt 的金额量纲污染」,但 day_gini 是按总和归一的尺度不变量,金额与成交量的差别只来自日内价格的微小变化;表中原始 |ρ| 与 head 为 1.00,这个变体的排序几乎与 head 相同,测不出它声称要测的东西。变体本身没有数学问题,只是测试依据不成立,所以打 3 分。原始 |ρ| 与 head:v1 0.97、v2 1.00。如果它有 alpha,最可能来自日内成交的分散程度(成交集中在少数分钟的票)。'
  - head: 'cs_first_low20(cross_mean(day_signed_ratio(Ret, Amt), 20), cs_first_low20(day_last(Vwap), day_last(Vwap)))'
    soundness: 4
    reasons: 'day_signed_ratio(Ret, Amt) 在 [−1, 1] 内有界,分母只计 Amt 的绝对值,无爆点;把 20 日均值拉到 60 日的理由(订单流失衡窗口太短、信号慢而噪)清楚,算子正确。原始 |ρ| 与 head 为 0.83。合理度 4。如果它有 alpha,最可能来自日内买卖压力的持续性(变体只改窗口,不改结构)。'
summary: 'a 位通过:按 §3 确定性规则自动划掉 2、4、5(与 head 3 的原始 |ρ| 在 0.70 以上),余 13 个;b 位通过,未划(5 与 E 位 12 同源、8 与核心 C20 的时点信息相同、9 的薄股尾部风险,都作为注意点写在理由里);R 六组全部通过,R5 合理度 3(v2 的依据不成立,day_gini 尺度不变,表中与 head 的 |ρ| 为 1.00)。全部判断只用 2023-08-07 及以前的读数与代码,没有计算任何 2023-08-08 之后的数。'
