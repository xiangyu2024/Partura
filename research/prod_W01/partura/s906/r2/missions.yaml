  - type: N
    hypothesis: |
      背景(第 1、2 批):(1) 共性表里 day_centroid(Amt) 是最强的单一子树(含它的 26 个候选均分 +0.84,不含 -0.84),C20 = cross_mean(day_centroid(Amt),20) 单独 +1.34(train +1.72 / valid +1.34);(2) 本批三个次级 head 读的也是 Amt 的日内分布而不是水平:day_gini(Amt)(集中度)、day_first(Amt)(开盘集合竞价那一根)、day_signed_ratio(Ret, Amt)(成交额按涨跌方向的分配);(3) 它们全都被塞在价位窗口 W 或市值窗口里,没人单独检验过"一天里钱在什么时候成交"这件事除了重心之外还有几个独立的坐标,也没人在去掉规模带的条件下检验。

      N 要回答:重心只是日内成交额分布的一个数,分布还有哪些坐标带信息、不靠规模 / 价位带也站得住?候选坐标(全部是比例或形状,量纲无关;逐日算,再取 20 日均值,使其成为持有人结构的慢变特征,取排名后进场):
       1 开盘集合竞价占比 div(day_first(Amt), day_sum(Amt))(第 0 根格是 09:30 集合竞价;隔夜信息、竞价挂单、一字板);
       2 尾盘 30 分钟占比 in_slice(Amt, 211, 240)(14:31 ~ 15:00;机构收盘前调仓 / 基准跟踪 / 收盘价管理);
       3 早盘连续竞价前 30 分钟占比 in_slice(Amt, 1, 30)(竞价之后的第一段,隔夜信息的再定价);
       4 午后开盘 30 分钟占比 in_slice(Amt, 121, 150)(13:01 ~ 13:30;午间消息的再定价);
       5 价格在哪里动与钱在哪里成交的时点差 day_centroid(Ret) - day_centroid(Amt)(day_centroid 取绝对值,Ret 的重心 = 价格变动集中在一天的哪一段;两者错开 = 钱在没有价格发现的时段成交);
       6 成交时间的离散度 day_wstd(in_index(Amt), Amt)(成交是集中在一个时段还是摊开);
       7 U 形程度 day_corr(|t - 0.5|, Amt)(成交集中在两端还是中段);
       8 后置程度 day_corr(t, Amt)(成交额随时间的线性趋势,与重心近似,作为对照);
       9 突发度 day_es_ratio_hi(Amt)(最高 5% 分钟的均值 / 该分位数;为空的日子是缺失而不是 1e4);
       10、11 开盘占比与尾盘占比各自在已知族 cross_mean(day_std(Amt),30) 的十分位内取排名(去掉与已知族 / 流动性的共同变化);
       12 开盘占比 - 尾盘占比的排名差(前置 vs 后置);
       13 开盘占比的 5 日均值相对自己 120 日的 z 分数("这一周比自己常态更集中在开盘");
       14 种子 5 的时点差在流通市值十分位内取排名。

      算子怎么实现:占比用 div(day_sum(in_slice(Amt, a, b)), day_sum(Amt)),分子是分母的一部分所以在 [0,1] 内有界,不会出现除以近零造成的爆点(分母为 0 时 0/0 = 缺失);in_index 给出分钟在一天里的位置 t/(T-1);day_corr、day_wstd 都有 EPS 保护;所有 day_* 只用当天已收盘的分钟,cross_mean 是向后窗口,t 日收盘后已知,t+1 进场,没有前视。

      与库里已有的不同:库里 13 个 head 里读 Amt 日内分布的只有 day_centroid(作为 W 嵌套的内层)、day_gini、day_first(Amt) 的水平和 day_signed_ratio,没有一个是占比、没有 in_slice 分段、没有时点差、没有 U 形 / 离散度;而且都在价位 / 市值带里。N 的种子里没有带。这些统计与 5 个控制:占比与分布形状量纲无关,不是金额水平(流动性 / 已知族是金额的 std,与它们有一部分相关但不是同一个量),10、11 与 14 又显式在十分位内去掉了它们。

      为什么样本外还会在:持有人结构(散户 / 机构、竞价挂单、尾盘调仓)是慢变的个股属性;同一个性质(时点)在 C20 里已经在 train 与 valid 都成立,并且 train 更强;同批的 903、905、907、908、911 号种子各自独立地在自己的样本内找到了开盘占比 / 尾盘占比 / 重心类的 head(如 908 的尾 30 分钟占比 20 日均值 +1.81,911 的以开盘占比为部件的 head +0.6 ~ +1.8),我拿它们当作"这条来源在不同随机种子里重现"的证据,不是拿它们的数当本种子的分数;20 日均值后取排名,换手低。方向(早盘多还是尾盘多做多)由评估在 train 上自选。风险:一字板日开盘占比接近 1(真实状态,不是数值伪影),20 日均值与排名限制了它的权重;尾盘最后几分钟的撮合规则在样本内没有变。
