  - type: E
    core: 'cross_mean(day_centroid(Amt), 20)'
    hypothesis: |
      【核心 C20】cross_mean(day_centroid(Amt), 20):过去 20 个交易日里"成交额在一天中的重心"的均值(day_centroid = sum(t·|Amt_t|)/sum(|Amt_t|)/(T-1),0 = 全部成交在第 0 根(09:30 集合竞价),1 = 全部在收盘;立方体 241 根分钟格,第 0 根是集合竞价)。

      证据(全部是样本内):(1) 本轮拆解里 C20 单独就是 +1.34(train +1.72 / valid +1.34),远高于含它的价位窗口 W 单独的 +0.41,并且 train 高于 valid——带类 head 的 valid 都比 train 高 0.8 ~ 2.5(像是 2022-23 行情的红利),C20 不是这样,它在 train 的 2018-2021 里更强。(2) 共性表:含 day_centroid(Amt) 的 26 个候选均分 +0.84(不含 -0.84),含 C20 的 15 个 +0.97(p 0.000);head cs_first_high40(W, C20) 的敲除里,把 C20 换成未平滑的当日重心分数从 +1.50 掉到 +0.56;Amt→Volume 互换分数不变(+1.46),窗口 10 / 40 日都在 +1.25 ~ +1.28,说明吃的是"时点"这个性质而不是某个参数。(3) 本组所有含 20 日重心的 head(1.62、1.50、1.30)方向都是 -1:多头 = 重心低 = 成交偏早盘 / 集合竞价的名字。(4) 同批其他种子(903、905、907、908 各自独立)在自己的样本内也长出了以 day_centroid 为核心的 head,说明这是立方体里一条比较普遍的来源,不是本种子的偶然。

      本位要问的:C20 离开价位窗口 W 之后还站不站得住?第 1 轮的 16 个 E 种子全部把 C20 放在 W 的里面或外面(W 是 cs_first_low20(day_last(Vwap), day_last(Vwap))),快照里含 C20 的候选外围全是"cs_first/last_* 与 W 的嵌套"。这一位的种子一律不带 W,外围换成下面几类(都是库里没有的写法):

      A 十分位内取排名 cs_bucket_rank(C20, X)(种子 1 ~ 4,X = 已知族 cross_mean(day_std(Amt),30) / 市值 / 波动 / 流通股本),种子 5 是 908 号种子样本内的 head 写法 cs_regres(cs_bucket_zscore(C20, 流通股本), 流通股本)。实现的机制:裸 C20 与流动性、已知族有一部分共同变化(我只能用第 1 轮相关表里种子 10 / 11 两行倒推,它们只差带的符号,倒推出 C20 与流动性 / 已知族的 |ρ| 在 0.25 ~ 0.55 之间,没有实测),并且很可能与 head cs_first_high40(W, C20) 的 |ρ| 在 0.5 ~ 0.7;在 X 的十分位内取排名,把对 X 的暴露精确去掉,留下的是"同等规模 / 同等流动性的票里,谁更偏早盘成交",这是"时点"信息本身。
      B 对自身历史归一(种子 6、7):cross_zscore(C20, 120) 与 C20 减去 120 日均值。去掉的是每只票长期的"投资者构成"水平(机构票偏尾盘、散户票偏早盘是个稳定的截面差),留下的是"这一个月比自己的常态更偏早盘"的变化。
      C 结构分隔(种子 8 ~ 11):cs_first/last_low20(C20, ListAge) 把上市最晚的约 20%(2018 年以后上市的次新股;样本起点已上市的老股 ListAge 并列同值,整块不进带,所以带里只有真正的新股;次新股的成交时点被上市初期的炒作支配)整块推出多头腿或整块拉进多头腿;cs_first/last_high20(C20, LogTotalCap − LogFloatCap) 对"总市值 / 流通市值"最高 20% 的限售股占比高的名字做同样的处理。两个分隔变量都不是 5 个控制之一,也不在库里。
      D 第二个时点统计(种子 12 ~ 14):钱在哪里成交减去价格在哪里动(day_centroid(Ret) 是 |分钟收益| 的重心)的排名差;开盘集合竞价占比 div(day_first(Amt), day_sum(Amt)) 的 20 日均值与 C20 的排名差(两个独立噪声的早盘度量合成);C20 与成交集中度 day_gini(Amt) 的排名差(907 号种子样本内的结构)。
      E 规模带 × C20(种子 15、16):本种子最强的 head 是 cs_first_low20(LogFloatCap, LogFloatCap)(+1.80),它的带是流通市值最小的 20%,而 C20 一直只配过价位带;这两条是把 C20 放进市值带里(种子 15 在市值 20% ~ 40% 的名字里按 C20 取最低;种子 16 是 head cs_first_high40(W, C20) 的市值版,带宽从 40% 改成 20%:两者共享 "C20 最高那一块被推到最前"这一部分,40% 时日度秩相关我估计会越过 0.7 的库禁线)。这是 E 里最像"把已知的成功换个变量"的一组,我预期它们分最高,但与现有 head 相关也最高,所以只放 2 个。

      为什么和以前不一样:A ~ D 没有一个含价位窗口 W;A、B 去掉的是 C20 对流动性 / 已知族 / 规模的暴露,不是在 C20 外面再套一层 cs_first/last 带;C 的分隔变量(ListAge、总市值与流通市值之差)库里没有;D 的第二个统计库里没有。与 5 个控制:A 的输出在 X 的每个十分位内均匀分布,与 X 的相关接近 0;B 的 z 分数对截面水平中性。

      为什么样本外还会在:成交时点反映的是持有人结构(散户 / 机构,集合竞价 / 连续竞价)与信息到达时点,是慢变的个股属性,20 日均值后只取排名,换手低,15 bp 成本吃不掉(在 head 里它们都选了半衰期 5);C20 在 train 与 valid 都显著为正且 train 更强,不依赖 valid 段的小盘行情;交易所的撮合时段规则在样本内没变。方向 -1(低重心做多)由评估在 train 上自选,我不预设。
