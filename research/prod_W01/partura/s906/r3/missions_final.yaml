    个读 Vwap 价位,0 个含 cross_corr / cross_reg_* / cross_autocorr / cross_stddev。(2) 31
    个 head 的 valid 平均比 train 高 0.86(最大 +2.6,集中在带 / 阶跃类),是 2022–23 行情的红利嫌疑;重心类里 C20
    本身 train +1.72 / valid +1.34 不依赖它,但一阶写法被库禁令占满。(3) 同批其他种子在各自的样本内独立地长出同一类二阶 head,且
    train ≈ valid:908 号种子 cross_reg_fvalue(day_first(Amt), day_es_ratio_hi(Volume),
    60) +2.10(train +2.14 / valid +2.10)、cross_corr(day_first(Amt), day_kurt(Amt),
