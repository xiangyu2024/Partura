    机制:day_first(Amt) 是第 0 根格(09:30 集合竞价)的成交额,隔夜信息由挂单者一次性撮合;day_es_ratio_hi / day_kurt
    / day_skew / day_gini 刻画当天其余分钟的成交是不是被少数几根大单分钟支配(爆发)。逐股 60 日滚动相关(或回归 F 值)问的是:这只票开盘撮合额大的日子,全天是不是也跟着爆发。协动强
    = 成交由信息事件驱动(竞价建仓之后继续分批进场的知情交易,Easley-O''Hara 的知情交易概率渠道;信息被缓慢吸收,价格随后继续漂移),协动弱 =
    竞价额主要是例行挂单(被动 / 习惯性挂单)与全天结构无关。它是两个量的相关系数:量纲无关,与金额水平(流动性、已知族 cross_mean(day_std(Amt),30))没有线性关系,新尺子去掉的是对
    5 个控制的线性 / U 形 / S 形暴露,去不掉这个"协动"。


    算子怎样实现:种子 1–11 是 908 / 911 号种子样本内的 head 与其拆解里的同构写法(cross_corr 与 cross_reg_fvalue,峰度
    / 偏度 / es_ratio / gini 做伴侣,Amt 与 Volume 各一条做对照);种子 12 是 911 号种子的另一条思路(开盘量对前一日最后一分钟量的比例的
    60 日均值,+0.97,train +0.97 / valid +2.57,方向 +1);种子 13–16 是我加的:同一协动换伴侣(峰度的 F 值、日波动),以及把本组最可靠的一个修饰——最新上市
    20% 整块排除(ListAge;本组 C20 外加这一层 +1.34 → +1.80,最佳 head 的必要性 +1.02;905、909、910、912
    号种子的 head 里也都出现)——用在协动上(cs_last_low20 把这些名字推到多头腿之外;方向 +1 时 cs_last_low,方向 −1 时才用
    cs_first_low)。所有 day_* 只用当日已收盘的分钟,cross_delay 只取过去,t 日收盘后已知,t+1 进场,没有前视。


    数学上要核对的点,我自己先列出来:(a) cross_corr 有界;cross_reg_fvalue 在相关接近 ±1 时可以很大,但进场前取截面排名,极端值只是排到端点,不会支配截面;(b)
    day_es_ratio_hi 的分母是当日 95% 分位数、护栏只有 1e-8,极薄的票可能有个别爆点天,Pearson 对它敏感——所以 11 条里 es_ratio
    做伴侣的有 6 条,另 5 条用峰度 / 偏度 / gini(没有分位数分母),这些上也成立才说明不是除以近零的伪影;(c) day_first 取当日第一个非缺失值,个别票个别日
    09:30 缺失会取到 09:31 那根,这样的天很少,也不是 0;(d) 前 60 个交易日是部分窗口(约占 train 的 6%),不填充。


