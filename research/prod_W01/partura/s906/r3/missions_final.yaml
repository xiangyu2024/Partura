  hypothesis: '【一句话】本种子 31 个 head 全是一阶写法(日内量的水平或均值,外面套带 / 阶跃 / 排除),二阶量——同一只票的两个日内描述量在最近
    60 个交易日里怎样协动——一个也没有;N 位把"开盘集合竞价额 × 当日成交结构"的 60 日协动放进来。


