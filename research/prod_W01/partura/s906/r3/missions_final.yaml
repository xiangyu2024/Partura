  hypothesis: '【核心 day_centroid(Amt)】= sum(t·|Amt_t|)/sum(|Amt_t|)/(T−1):一天里成交额的重心(0
    = 全部在 09:30 集合竞价,1 = 全部在收盘)。


    证据(全部是样本内):(1) 共性表里含它的 136 个候选均值 +0.61,不含 −0.95(均值差 +1.56,p 0.000);(2) 本轮快照 31
    个 head 里 21 个读它,其中 15 个含 20 日均值 C20 = cross_mean(day_centroid(Amt), 20);C20 单独
    +1.34(train +1.72 / valid +1.34),最好的 head 是 C20 外加 ListAge 排除与高 C20 排除(+2.36,train
    +2.36 / valid +2.38);(3) 这 31 个 head 没有一个含 cross_corr / cross_reg_* / cross_autocorr
    / cross_stddev(我在三轮的 loc.md 里 grep 过):全是一阶写法,即日度量的水平或 20 日均值,外面套带、阶跃或排除。


    一阶这条路上,同一核心的外围已经被前两轮取得很满(第 2 轮 C20 的 E 位 47 个过线、13 个入 head;价位窗口 W 的 E 位 28 个过线、7
    个入 head),再套一层"C20 外面的带"的边际收益由库禁令(与任一 head 日度秩相关 ≥ 0.7 即拒绝)来裁,基本不会再有新的 head。本位于是不碰一阶:核心留在里面,外围换成二阶,问的是重心的"协动结构"——同一只票最近
    60 个交易日里,日内成交时点与另一个日度量怎样一起变。


    二阶的几组(都读 day_centroid(Amt) 本身,不取均值):

    (A) 重心 × 隔夜跳空 div(day_first(Open), cross_delay(day_last(Close), 1)) 的 60 日相关或回归
    F 值(种子 1、2、9、14;种子 3 换成跳空绝对值):隔夜信息到达之后,这只票的成交是在开盘就完成(重心低)还是拖到午后 / 尾盘,取决于持有人构成与对新信息的反应方式(处置效应:盈利方马上兑现、亏损方迟迟不卖;追涨型散户在竞价和开盘后立即进场)。相关的符号和强弱是慢变的持有人结构,不是某一天的事件。

    (B) 重心 × 当日成交的爆发度 / 峰度 / 波动 / 成交额规模(种子 4、5、7、15):重心偏离常态的日子是不是也是爆发日——知情交易分批进场(Easley-O''Hara)还是例行成交。

    (C) 重心 × 开盘集合竞价额(种子 6),重心 × Ret 的重心(种子 8:钱在哪里成交 vs 价格在哪里动,60 日同步程度)。

    (D) 重心自身的持续性与稳定性(种子 10 cross_autocorr(...,60,1)、种子 11 cross_stddev(...,60)):"总在同一时段成交"的票(机构程序化
    / 固定习惯)与时点飘忽的票。

    (E) 近期偏离常态(种子 12:5 日与 60 日 EMA 之差,二阶里最接近一阶的一条)和一阶写法一条(种子 13)。


    算子怎样实现它:cross_corr / cross_reg_fvalue / cross_autocorr 都是逐股的 60 日滚动,[−1,1] 内有界或
    F 值(取排名后进场),量纲无关,与金额水平(流动性、已知族 cross_mean(day_std(Amt),30))没有线性关系;所有 day_* 只用当日已收盘的分钟,cross_delay
    只取过去,t 日收盘后已知,t+1 进场,没有前视。前 60 个交易日是部分窗口(约占 train 的 6%),不填充,缺失就是缺失。day_es_ratio_hi
    的分母是当日 95% 分位数、护栏只有 1e-8,极薄的票可能出现个别爆点天(Pearson 对它敏感):所以爆发度这一组同时放了峰度(种子 7)和 gini(在
    N 位),这两个没有分位数分母;如果信号在它们上也在,就不是除以近零造成的伪影。


    已知的样本内读数(同批其他种子的 loc.md;表达式相同则分数相同,不是对本种子的拟合):种子 1 = 903 号种子 +1.45(train +1.45
    / valid +2.40,方向 −1);种子 2 +0.92(+0.92 / +2.66);种子 4 = 908 号种子 +0.80(+0.80 / +1.72);种子
    5 +0.73(train +1.19 / valid +0.73);种子 6 = 908 号 +1.20(+1.20 / +1.77);种子 12 = 903
    号 +0.96(+0.96 / +1.05);种子 13 = 905 号 +2.25(train +2.41 / valid +2.25),它是一阶写法(把
    day_flat_run_max(Amt) 从重心里减掉、30 日均值、最新上市的 20% 整块推出多头腿),放进来是为了看一阶写法能不能过库禁令,过不了会被相关度表划掉。其余(3、7、8、9、10、11、14、15)是同一结构换伴侣
    / 换形式,我没有读数。


    为什么和以前不一样:前两轮这个核心的外围全是 cs_first_* / cs_last_* / cs_bucket_* 的"带"与 cross_mean;本位外围是时间序列的二阶矩(协动、持续性、稳定性),快照里没有一个这样的节点;与
    5 个控制:协动与持续性是相关系数 / 自相关,不是金额水平;与现有 head:一阶均值与二阶协动是不同的量,日度秩相关预计偏低(相关度表会给实数,≥ 0.7
    的种子会被划掉)。


    为什么样本外还会在:持有人结构(散户 / 机构、竞价挂单习惯)是慢变的个股属性,60 日协动再取排名,换手低,15 bp 成本吃不掉;已知读数里 train
    与 valid 都是正的,方向 −1 的几条 valid 高于 train(这个特征和本组带类 head 一样,是 2022–23 红利的嫌疑),所以我不押某一条,押的是"二阶协动里有独立于一阶重心的信息"。交易所竞价与连续竞价规则在样本内没有变。方向由评估在
    train 上自选。

