    vs 开盘冲动的散户);(d) 隔夜跳空的 20 日均值。算子实现三种:① 排除:cs_first_high20 / cs_first_low20(W, Z)
    把 Z 的极端 20% 推到多头腿的反方向,W 的窗口不变、只踢掉 Z 极端的名字;② 段内重排:cs_last_low20(Z, W) 与 cs_first_low20(Z,
    W) 以 W 取值最低的 20%(价位 20–40%)为段、段内按 Z 排,两个方向都放进去,让评估在 train 上自选;③ 规模中性:cs_bucket_rank(W,
    LogFloatCap 或 20 日成交额) 在市值 / 流动性十分位内取 W 的分位,检验窗口是否独立于规模与流动性。

    为什么和以前不一样:快照里已见的写法(head 与共性表里含价位核心的子树)外围都是同一个 cs_first_low20 的同构嵌套 / pow_2 包裹(只换
