    为什么样本外还会在:价位带与彩票偏好都是慢变的行为渠道;所有 Z 都是 20 日均值后只取排名(个别爆点、偏度的极端值不会支配截面),换手低,15bp 成本吃不掉;窗口位置沿用
    head 已选的 20–30%,没有为 train 另调常数。'
