  hypothesis: '背景(第 1 批):head 的信息在股票的「价位」,不在日内细节(Vwap→Close、High→Low 互换分数不变;含 day_last(Vwap)
    的候选均分 +0.13,不含的 −1.13)。但后复权价位 = 名义股价 × 累计复权因子,是两个很不同的东西,而 5 个控制里只有市值(LogFloatCap)一个相关量,这两条渠道都没被去掉:

    渠道 A,名义股价 Nom = LogFloatCap − LogFloatShares = log(流通市值 / 流通股本)(立方体日频字段,当天已知):散户的「名义价格错觉
    / 低价偏好 / 彩票偏好」(Birru-Wang 2016;Kumar 2009)与最小报价单位的渠道;

    渠道 B,累计复权因子 F = log(day_last(Vwap)) − Nom:后复权价与名义价之比,等于历史分红送转的累积——分红 / 送转史长的公司是现金流型、股东回报型,是慢变的质量代理,控制里没有。

    算子怎么实现:对 Nom、F 与后复权价位先取日度排名,再用 head 已验证有效的「推一档到最前 / 最后」算子(cs_first_low20、cs_last_low10
    / 20,多头腿落在取值最低的一端)、绝对距离窗口 abs_(sub(cs_rank(x), c))、cs_bucket_rank(F 在名义价位十分位内的分位
    = 对名义价位中性的 F;反之亦然)取各自的带通形态与单调形态;另有几个交叉门(用名义价位最低 20% 当门、段内按后复权价排,或反之;head 的 20%–30%
    窗口里再按 Nom 或 F 排除 / 排序),直接回答「head 的窗口到底是名义价位窗口、分红史窗口,还是两者的交点」。

    与库里已有的不同:head 与共性表里的子树只读 Vwap / High 的价位(及价位的嵌套),没有读 LogFloatCap / LogFloatShares
    的,也没有把后复权价与名义价分开的;与控制不同:Nom 只含价位、市值还含股本,二者的排名相关我预计在 0.3–0.5(没有实测),F 与市值的相关更低,都应远低于
    0.8;控制的线性 / U 形 / S 形暴露去不掉 Nom 或 F 的带通形态。

    数学性:全部是正数的对数差与排名,没有除法、没有近零分母;F 用到的后复权价只含当日及以前的分红送转(后复权 = 以过去为基准向后累乘,规则文件的口径),不含未来信息;停牌日
    day_last 为 NaN,排名里自动缺失。

    为什么样本外还会在:名义价位与分红史都是慢变量,排名几乎不动、换手极低;低价偏好与分红 / 质量偏好是行为与基本面渠道,不依赖 train 区间特有的价格形态。可证伪的预测:若
    head 的窗口是名义价位效应,则 Nom 的窗口种子应接近或超过 head 而 F 种子无信号;若是分红史效应则相反;若交叉门最好,则窗口是两者的交点。'
