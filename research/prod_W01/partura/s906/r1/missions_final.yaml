    30%–50%——三者在 train 与 valid 都为正,所以信息是「偏低价位并排除最低一档」这一整片、不是单个尖峰,而且尾部排序经新尺子的残差回归会改变分数(同一条多头腿,+0.32
    对 +0.72)。W 与 head 的日度秩相关约 0.4(合成截面),不是 head 的改写。(2) 含 day_last(Vwap) 的 47 个候选均分
    +0.13,不含的 −1.13;含 W 的 8 个候选均分 +0.49。

    这个位要试的外围 = 「在这一档里再去垃圾、并检验窗口是否只是规模的影子」。价位 20%–40% 这一档约 1000 只,里面仍混着:(a) 彩票型投机(20
    日平均的分钟最大涨幅 MAX、分钟收益偏度;散户追涨后均值回归,Bali-Cakici-Whitelaw 2011);(b) 被持续砸盘或持续承接的名字(订单流失衡
