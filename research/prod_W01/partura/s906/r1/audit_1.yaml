    reasons: '核心 W = cs_first_low20(day_last(Vwap), day_last(Vwap)) 不是 head 的字面子树(head 最内层的 x 是 day_quantile(High)),是同一算子换了 x 的写法;它是否在共性表里我没有核对(按要求没读共性表),请流水线确认核心资格。相关度表:W 与 head 原始 |ρ| 0.41、残差 0.40;五个控制里最大 0.27(size),过核心门槛。16 个种子与 head 的原始 |ρ| 在 0.26–0.59 之间,无 ≥0.7;与控制的 |ρ| 最大 0.70(seed 9 的 liq),无 ≥0.8,无自动划掉。算子核对:W 作第 1 参数(排序)时,seed 1、3、7、16 是按 W 排序、把 Z 的极端 20% 推到排序的一端;seed 14、15 是 W 在规模 / 成交额十分位内的秩。W 作第 2 参数(带)时,带的 x 百分位 ≤0.2 对应价位秩 20%–40%(非带股票的 x 百分位 = 价位秩减 0.2),与假设写的 20–40% 一致。同一 Z 的 first/last 两个变体(5/6、8/9、10/11、12/13)多头腿集合不同(一个在带内按 Z 排,一个在带外按 Z 排),没有十分位集合完全重合的种子。Z 的算子:day_max、day_skew 取 20 日均值;day_signed_ratio、day_gini、day_centroid 在单日内是有界或尺度无关量,Amt 未复权不影响日内形状;gap 的开盘与前收盘同为后复权空间;cross_mean 是因果窗口,label 约定为 t 收盘后已知、t+1 进场,没有同日前视。风险点(不划,记为待补测):day_skew 内部除以当日标准差,近冻结日(一笔成交)的 z 三次方约 15,20 日均值里一天就加 0.75,这是 §4 数值伪影的形式;但 seed 3、4 的 liq |ρ| 为 0.14、0.21,没有证据显示它主导截面,按放行原则放行。逐种子机制:1–2 彩票偏好(MAX,Bali-Cakici-Whitelaw 2011);3–4 偏度彩票;5–7 订单流失衡;8–9、16 成交集中度(seed 9 与 liq 0.70、known 0.64 重叠较大,未过线);10–11 成交时点重心;12–13 隔夜跳空;14–15 规模与流动性中性化的检验。创新度 4:外围变量与 head 及五个控制不是同一个度量,残差层面与 head 的 |ρ| 为 0.28–0.58(共享 W 的部分),不是换皮。合理度 4。如果它有 alpha,最可能来自价位带内的彩票偏好、订单流与成交时点,而不是 W 的价位信息本身。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [2, 3, 7]
    reasons: 'N 位是新想法,不是核心。与 head 的原始 |ρ| 在 0.00–0.39 之间(seed 13 最大,0.39;seed 1、2、3、4、5、6、7、8、11、12 都不超过 0.05),无 ≥0.7。与五个控制的 |ρ| 最大 0.49(seed 11 的 size),无 ≥0.8,无自动划掉。创新度 4:Nom = LogFloatCap − LogFloatShares,按字段定义是流通市值与流通股数之比,即未复权的名义价(AlphaCube 的 build 脚本注释:000001.SZ 在 2026-09-16 约 11.70 元/股),与 head 用的后复权价不在同一空间;Nom 与 size |ρ| 仅 0.02,不是市值换皮。与 liq 的 |ρ| 为 0.28–0.32(seed 2、3、4),是名义价与成交额的常见相关,残差化已去掉线性与多项式部分。F = log(后复权 Vwap) − Nom 是累计复权因子,与 size |ρ| 0.45(seed 5),未到 0.5 的换皮线。算子核对:全部是对数差、秩与有界的截面算子,没有除以近零的分母;cs_bucket_rank 的十分位内秩有界;cross_mean 因果;F 的后复权价只用到 t 日及以前,符合规则 §4 对后复权的口径。重复检查(这些种子都只是同一个秩的函数,十分位集合与数据分布无关,是精确比较):seed 1 的低十分位是 Nom 秩 20%–30%;seed 2 与 seed 3 的低十分位也是 Nom 秩 20%–30%(同一批股票);seed 2 与 seed 3 的高十分位是 Nom 秩最高 10%,与 seed 4 的高十分位相同;seed 7 的高十分位是 F 秩最低 10%,与 seed 5 的低十分位相同。按重复划掉 2、3、7;保留 1、4、5、6。残差化前各种子的秩值不同,残差十分位会有小扰动,但主要仍是同一批股票。待核实(不划,PI 需先核对):circulating_market_value 的价格基准是当日收盘还是前收盘;若是前收盘,Nom 只滞后一天,但 F 会混入当日收益,seed 5、6、11、12、14 都用了 F。混杂提醒:F 的截面可能主要是上市年龄(若后复权基期是上市日,老股累计事件多),而 ListAge 不在五个控制里。合理度 4:机制清楚,名义价位错觉与低价偏好(Birru-Wang 2016、Kumar 2009);F 的机制是送转与分红史。如果它有 alpha,最可能来自名义价位的散户低价偏好;其次是累计送转史(股东回报或高送转效应);也可能只是上市年龄的代理。'
R:
  - head: 'pow_2(cs_first_low20(cs_first_low20(cs_first_low20(day_last(Vwap), day_quantile(High)), day_quantile(High)), cs_first_low20(cs_first_low20(cs_first_low20(day_last(Vwap), day_quantile(High)), day_quantile(High)), cs_first_low20(cs_first_low20(day_last(Vwap), day_quantile(High)), day_quantile(High)))))'
    soundness: 4
    reasons: 'R 组的 head 是 pow_2 包着的 cs_first_low20 嵌套。pow_2 在正值域上单调,对秩不起作用。16 个变体都是有效的截面算子组合,没有除以近零的分母、没有前视、没有溢出。窗口核对:abs_(cs_rank(P), c) 的 c=0.12–0.45 是对称 V 形,低十分位落在 P 秩 c 附近;cs_last_low10 与 cs_last_low20 以 W 作带时,带是 P 秩 20%–30%(variant 8–13,10% 带)、20%–40%(variant 14)、40%–60%(variant 15,cs_first_low40 作 x);variant 16 把 P 做 5 日平滑后同时作序与带。这些都与 why 中的描述一致。why 有一处不准:(c) 说 head 的窗口边缘由最后一分钟 Vwap 定义,实际上 head 最内层的带 x 是 day_quantile(High)(分钟最高价的日中位数),外层的带 x 是内层输出的复合分布。P 与 day_quantile(High) 的截面秩应当接近(未测),所以变体的含义基本成立;但 variant 16 的平滑只作用在 P 上,没有作用在 head 的带变量上,解读 R 结果时要注意。另外 variant 10、12 与 size |ρ| 0.91、与 liq 0.89 / known 0.87 几乎就是控制变量本身;这不是合理度问题(R 只评合理度),但按 PI 自己的收录条件(known 须小于 0.5)它们不能收录,只能当候选评估。同一 head 上取 16 个变体中的最好者,PI 应按选择偏差来看 score ≥ head+0.1 的门槛。合理度 4。如果它有 alpha,最可能来自价位带的窗口位置与对称性,而不是 pow_2 或嵌套深度。'
