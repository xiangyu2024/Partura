slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [2, 4]
    reasons: >-
      库为空(快照 0 个 head),创新度只能与 5 个控制比。种子 1、3、5–11 与五个控制的最大 |ρ| 为 0.492(种子 10 与市值),没有一个达到 0.5 的换写线;名义价(种子 1)与流动性 0.319、已知族 0.265 中度相关,F(种子 3)与市值 0.448,按 §4 这些中度相关不是挡的理由。名义价、分红送转累计 F、自由流通比三个量在控制里都没有对应物,计 4 而非 5,因为名义价的低价效应与分红历史是中国市场已知的异象。
      数学逐个核对:保留的种子里没有以成交量为分母的 div,分母都是 FloatCap/FloatShares 或分桶变量;day_last 取最后一个非 NaN、cs_bucket_rank 按市值十分位分桶且并列用全局秩打破(不靠列序);没有 ts_spearman 与 nt_*;后复权收盘(种子 5、6、10 的 day_last(Close))在 §4 明确不是问题。F 的截面不是常数:种子 3 与市值 0.448、与流动性 0.146 的非零相关说明 FloatCap 是未复权的,若它是后复权的,F 会塌成 1 的常数面板,这一点请 PI 在数据层核对。FloatShares 与 TotalCap 若是事后回填的股本则构成前视,相关度表核对不了,请 PI 确认它们是当日已知的股本。种子 5 按 §4 保留(它是名义价与 F 的乘积,与种子 1、3 都不同)。种子 6、10、11 是 1/3/7 的秩组合或分桶,不是重复。
      划掉 2:cross_mean(day_sum(Amt)/day_sum(Volume), 20) 与种子 1 是同一个名义价格,只差 20 日平滑;控制轮廓除 20 日反转(0.034 对 0.084)外在 0.01 以内一致(流动性 0.318 对 0.319、已知族 0.263 对 0.265),属重复。划掉 4:它与种子 3 都是同一个 A(t),即后复权价除以未复权价(一个用收盘,一个用成交量加权 VWAP),控制轮廓在三位小数内相同(流动性 0.145 对 0.146、已知族 0.157 对 0.158、市值 0.449 对 0.448),属重复。种子 8 的控制轮廓与种子 1 相差 0.04–0.05,是分桶后的不同排序,保留。
      如果它有 alpha,最可能来自:A 股低价股的彩票型偏好与 1 元面值、退市规则造成的价位效应(P);以及分红送转累计与自由流通比反映的控股和解禁结构、长期持有人构成(F、流通比)。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [2]
    reasons: >-
      库为空,创新度只能与 5 个控制比。种子 1、3–12 与流动性的 |ρ| 最大为 0.535(种子 1,centroid),与已知族最大为 0.564(同一种子);按 corr_1.md 的 ≥0.5 提示,这两个与种子 10(es_ratio_hi,流动性 0.517)要读作换写的理由在于分散度。但 centroid 是成交时间重心、es_ratio_hi 是右尾形状,不是成交量级;中度相关不是同一个度量,本轮不计换写。种子 7(买卖压力的成交额加权上涨净占比)与 20 日反转 0.431 最接近换写,但仍低于 0.5,而且它用的是成交额加权的方向计数,不是收益本身。时间形状、价位粗糙度、量价耦合在控制里没有对应物,计 4。
      划掉 2:cross_mean(day_gini(Volume), 30) 与流动性控制的 |ρ| = 0.827,≥ 0.8,按确定性规则自动划掉;Gini 本身就是「成交集中在几分钟」的稀疏度,与流动性是同一个读数,与已知族 0.737 也接近。
      数学逐个核对:centroid、day_wmean、day_signed_ratio、day_gini、day_distinct_ratio、day_es_ratio_hi 都有分母或样本数守卫,总量为 0 或分钟不足时输出 NaN;es_ratio_hi 的 q95 在 241 格的完整日上是整数位次(0.95 × 240 = 228),零分母走 NaN 守卫;day_first 与 day_sum 在总量为 0 时得 NaN,不会产生 inf;没有禁用算子。
      需要 PI 核对但不挡的三件事:(1) day_first 取的是第一个非 NaN 分钟,不一定是 09:30 那一格。若无成交分钟为 NaN,种子 3 对薄票就是第一笔成交的份额,是定义与假设的错位,不是数学坏掉,保留。(2) day_corr 在一方为常数时输出 0(cov/(0+EPS)),不是 NaN。种子 5、6 在涨跌停锁定日会被拉向 0,这是有偏的零填充,保留并提醒;若无成交分钟用前向填充,种子 4、6 在薄票上会被填充机械驱动,与流动性控制重叠,也保留。(3) 种子 9 偏度在薄票上由少数跳变决定,单笔跳变时量级约 ±15(241 分钟的样本上界),是有界的极端值而不是除以零;它正是彩票假设的直接读数,保留,PI 应看它的残差而不是原值。种子 12 用到 gini,但其自身与任何控制的 |ρ| 都不到 0.8,保留。
      如果它有 alpha,最可能来自:日内成交时点与形状反映的投资者构成(开盘与尾盘集中的机构拆单,对散户的开盘与脉冲成交),以及价位粗糙与量价耦合反映的追涨杀跌;这些和成交量级是不同的轴。
