  - type: N
    hypothesis: >-
      静态账本特征:V2 立方体里 Open/High/Low/Close/Vwap 是后复权价,而 Amt、Volume、FloatCap、FloatShares 是未复权的原始量。
      这个「价格空间错位」让三个静态量可以直接读出来,而五个控制(流动性、波动、20 日反转、成交额离散度、市值,全是金额/收益/市值的排名)没有一个单独携带它们:
      (1) 名义股价 P = FloatCap/FloatShares(账本版,等于 LogFloatCap 减 LogFloatShares),或 day_sum(Amt)/day_sum(Volume)(成交版,未复权日 VWAP);
      (2) 复权因子 F = 后复权收盘价 / 名义价格 = 上市以来累计的分红送转倍数(只在除权日才跳变,跨票从 2.5 倍到上百倍;
      成交版用 day_wmean(Vwap, Volume)(复权的成交量加权均价)除以未复权日 VWAP,账本版用 day_last(Close) 除以 FloatCap/FloatShares);
      (3) 自由流通比 = LogFloatCap 减 LogTotalCap(限售股/大股东控盘程度)。
      另有两个组合:F 与 P 的秩之差(老牌高分红但股价不高的票)、在同市值十分位内的 P 与 F(cs_bucket_rank 对 LogFloatCap,去掉规模内的交互)。
      机制:P 携带 A 股散户对低价股的彩票型偏好、1 元面值退市规则与相对 tick 价差,是持久的投资者构成信息;
      F 是长期分红送转的累计,代表成熟、有可分配盈利的公司,且只在除权日才变;自由流通比携带控盘/国资/解禁压力。
      这些量的秩极持久,每天换手近零,15bp 成本几乎吃不到它们,而 M 第 1 批里的快变量(日内当天量)被成本吃光。
      和库不同:库里还没有 head,与之最近的现象是 day_std(Volume)(原始股数)那一族好 0.99,而 Volume 与 Amt 之差正是名义价格 P,
      五个控制都用金额,市值虽然等于 P 乘股数,但对市值的线性、U 形、S 形暴露被去掉后,剩下的恰是同市值下价与股数的分工(cs_bucket_rank 的种子直接读它);这里把 P、F、流通比分开、干净地读出来,而不是让它们混在 day_std(Volume) 的量级(流动性)里。
      样本外为什么还会在:三者都是制度/账本性质(面值退市、除权规则、股改遗留的限售结构、分红历史),不是某一年的风格暴露,
      且持续时间比 12 到 24 个月的风格轮动长;方向由训练期选定,若只是风格则验证期会翻转,这是被检验的内容。
    inspired_by: >-
      M 第 1 批:含 day_std(Volume) 的 53 个候选均值比不含的好 0.99(p<0.001),而 Volume 与 Amt 之差就是名义股价,五个控制不含它;
      另有 day_var(in_skew_full/in_mean_full(Open/Volume)) 一簇共 49+9+6+4 个候选,它们对日内常数求方差,只剩浮点噪声与并列(列序),
      却比其余候选好约 0.9 个夏普 —— 说明这一批里名次主要由换手成本决定,需要秩持久的真实特征。
