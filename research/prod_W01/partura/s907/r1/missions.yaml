  - type: N
    hypothesis: >-
      成交时刻与形态指纹:同样多的成交额,在一天里什么时候、以多大的突发性成交,指向边际交易者是谁
      (散户追涨杀跌与彩票型脉冲,还是机构按 VWAP 或尾盘拆单)。五个控制度量的都是「成交多少」(金额水平、金额离散度、波动、市值),
      这里全部改用无量纲、有界的日内形状量,再用 cross_mean 做 30 日平滑成「习性」(一只票的交易习惯跨月很稳定,所以秩持久、换手低):
      day_centroid(Volume)=成交量重心(0 开盘到 1 收盘);day_gini(Volume)=成交的集中度(Gini,0 到 1);
      div(day_first(Volume), day_sum(Volume))=开盘集合竞价(09:30 那一格)占全天成交的份额;
      day_distinct_ratio(Close)=一天访问过多少个不同价位(低价股在一档 tick 上价位粗糙,是 tick 约束的读数);
      day_corr(Close, Volume)=价量相关(放量时价格在涨还是在跌);day_corr(Volume, abs_(Ret))=量与波动的耦合;
      day_signed_ratio(Ret, Amt)=按成交额加权的上涨净占比;sub(div(day_wmean(Close, Volume), day_mean(Close)), 1)=成交量加权价相对时间加权价(钱是在高位还是低位成交);
      day_skew(Ret)=日内收益偏度(彩票特征);day_es_ratio_hi(Volume)=成交量右尾形状;
      以及重心的短长窗差(10 日对 60 日,时刻习惯在漂移)和重心与 Gini 的秩之差。
      机制:散户为主的票成交集中在开盘与脉冲分钟、价格粘在 tick 上、量价追涨耦合;机构为主的票成交摊在全天、跟随 VWAP。
      两类持有人的预期收益与被忽视程度不同,且习性稳定;这与流动性/波动/市值是不同的轴(它们只管数量,形状量是比值)。
      和库不同:库里没有 head;M 第 1 批没有给这些形状量任何非噪声证据,这里是它们的第一次直接检验,且全部用 30 日平滑把快变量变成慢变量。
      样本外为什么还会在:投资者构成(散户对机构)是结构性的、不依赖某一年的风格;若它只是 2018 到 2021 的某种风格,方向在训练期选定后验证期会翻转,
      分数取两段较差者,这正是检验。除 Gini 与价位粗糙度可能与流动性相关外,其余形状量与已知族的相关预期很低。
    inspired_by: >-
      M 第 1 批:day_var(in_skew_full/in_mean_full(Open/Volume)) 一簇(共 68 个候选)对日内常数求方差,等于只剩浮点噪声与并列,
      却比其余候选好约 0.9 个夏普,说明名次主要被换手成本决定;另外含 day_std(Volume) 的 53 个候选好 0.99,但它是金额族(流动性)的近亲,
      会被已知族与控制吃掉,因此改用与数量无关的日内形状比值,并用 cross_mean 平滑到 30 日。
