- type: N
  hypothesis: >-
    【新 idea】把「一天里的钱什么时候成交、价格什么时候走」按时段拆开读,并去掉两个竞价格,回答库里 5 个 head 都没回答的两个问题:(1) 成交重心的 alpha 是全天形状,还是只在某一段(开盘、午间、尾盘);
    (2) 它是不是交易所制度的哑变量(15:00 那格在深市含收盘集合竞价、沪市没有;立方体的列序又带交易所)。库里所有含重心的 head 读的都是「含两个竞价格的全天重心」的 30 日均值,没有一个只读一段、也没有一个去掉竞价格,
    更没有把价格一侧(隔夜 vs 日内)与成交一侧放在一起。

    【算子怎么实现】全部用 in_slice(x, a, b)(含两端;0 = 09:30 竞价,1–120 上午连续,121–240 下午,240 = 15:00 点),再 day_sum / day_centroid / day_signed_ratio 压成日度值,最后 cross_mean 做 20–30 日平滑(只放慢变量:本种子的事实是单日重心 +0.44、30 日均值 +1.73)。
    五组:
    (a) 时段占比:尾盘 30 分钟(211–240)占全天成交量的份额;去掉收盘格的尾盘份额 in_slice(211,239) / in_slice(1,239);连续竞价前 30 分钟(1–30)份额;午间(61–180)份额;收盘格(day_last)占全天的份额。
    (b) 无竞价重心:in_slice(Volume, 1, 239) 的重心;上午内部重心(1–120);下午内部重心(121–239)。若 C 的 alpha 是交易所哑变量,这几个应当明显塌掉;若保住,时点信息是真的。
    (c) 波动相对成交的时点:sub(day_centroid(Ret), day_centroid(Volume))(day_centroid 取 |x| 的质量中心,所以 day_centroid(Ret) = 波动的重心):价格在成交之前还是之后动。
    (d) 尾盘资金流:最后 30 分钟的 day_signed_ratio(Ret, Amt)(上涨分钟的成交额占比减下跌分钟的)与最后 30 分钟的收益和(尾盘抢筹 / 砸盘的习惯)。
    (e) 隔夜 vs 日内:隔夜跳空 div(day_first(Open), cross_delay(day_last(Close), 1)) - 1 的 30 日均值与中位数、日内收益 div(day_last(Close), day_first(Open)) - 1 的 30 日均值、以及两者的秩差(Lou-Polk-Skouras 的拔河)。
    价格是后复权的(规则明确这不是问题:除权日 Open 与前收盘同口径复权,比值就是真实的跳空);第 t 日的 Open 与第 t-1 日的 Close 都是 t 日收盘前已知。

    【机制】不同参与者在一天的不同时段交易:散户与事件驱动的资金集中在开盘与脉冲分钟,机构的 VWAP / 收盘拆单摊在后半场与尾盘;隔夜与日内的收益也归属不同的客户群(隔夜 = 散户的开盘冲击,日内 = 机构的逆向),
    它们的预期收益与被关注程度不同,且习惯稳定,所以 30 日均值的秩持久、换手低,15bp 吃不掉。这些量全是无量纲的比值或位置,不是「成交多少」,和五个控制(金额 / 波动 / 收益 / 市值)不是同一根轴。

    【和库不同】库里 head 全部是全天含竞价的重心(及其与 gini / hurst 的组合);本组每个种子要么只读一段(a)(d),要么去掉竞价(b),要么把价格一侧放进来(c)(e)。
    预期它们与 head 1 的日度秩 |ρ| 在 0.3–0.7 之间(无竞价重心、上午 / 下午内部重心可能 >= 0.7,会被表划掉),价格一侧的 |ρ| 更低。

    【为什么样本外还会在】参与者结构(谁在什么时段交易)不依赖某一年的风格;只放 20–30 日以上的慢特征;方向由 train 选,valid 是第二道检验(分数取两段较差者)。
    已知风险:(i) 收盘格与尾盘占比若主要是交易所哑变量,会与 C 同样地依赖制度而不是行为(种子 3 是它的直接读数);(ii) 隔夜跳空均值会被长期停牌后复牌的大跳空支配,所以另放一个中位数版;
    (iii) day_signed_ratio 在薄票上噪声大,与流动性相关,残差后可能只剩噪声。
