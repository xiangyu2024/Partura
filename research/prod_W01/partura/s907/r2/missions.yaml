- type: E
  core: 'cross_mean(day_centroid(Volume), 30)'
  hypothesis: >-
    【核心】C = cross_mean(day_centroid(Volume), 30):一只票过去 30 个交易日里「成交量的重心」的均值(0 = 全部成交在 09:30 开盘竞价,1 = 全部在 15:00;立方体是 241 格:09:30 竞价 + 240 根分钟)。
    它是慢变的交易习性:低 C = 成交前置(隔夜信息在开盘被吸收、散户开盘集中),高 C = 成交后置(机构按 VWAP 拆单、尾盘)。五个控制都是金额 / 波动 / 收益 / 市值的水平,没有一个读「什么时候成交」。

    【本种子的证据,全是 train / valid】(1) 本组 Pr1b_Nb 的 5 个 head 全含 C:+1.57 / +0.99 / +0.92 / +0.78 / +0.73,方向 -1(多头 = 低重心),半衰期 5;
    共性表里含 cs_rank(C) 的 21 个候选均分 +0.56 对 -1.03(p 0.000),含 day_centroid(Volume) 的 28 个 +0.38 对 -1.05。
    (2) 拆解:cs_rank(C) 单独 +1.73(train +1.73 / valid +1.88);单日值 day_centroid(Volume) 只有 +0.44(train +1.09 / valid +0.44),所以增益来自 30 日平滑(日度值的噪声被 15bp 换手吃掉);
    窗口 15 / 60 的 valid 是 +0.89 / +0.70(30 在峰上,单峰可能含噪声,所以核心固定在 30 日均值而不改窗口);Volume 换 Amt +1.55,不是单位的伪影。
    (3) head 里的另一半不是 alpha:cross_mean(day_gini(Volume), 30) 单独 -2.02(train -2.02 / valid -1.96),必要性只有 +0.27;head 4 里的 ts_hurst(ts_autocorr_s1(day_argmax(Vwap), ·), ·) 单独 -3.53,去掉它分数 +0.99 -> +1.90(必要性 -0.92)。
    也就是:C 的秩是源头,已见写法的外围都是「在 cs_rank(C) 里减一个别的水平量 / 噪声」。
    (4) 另一条独立来源:M 第 2 批的 4 个 head(+1.43 / +0.99 / +0.73 / +0.72)全是 cs_first_low40(LogFloatShares 的变体, day_std(Volume)) 一族,即「day_std(Volume) 最低 40% 的票整块推到最前,其余按流通股本排」,
    把 Volume 换成 Amt 分数塌到 -2.49,说明读的是股数而不是金额。这给了 C 一组现成的、与它无关的门变量。

    【为什么外围要换成这样】库禁令是日度秩 |ρ| >= 0.7:任何「cs_rank(C) 加减一个小东西」都与 head 1 的 |ρ| 在 0.9 以上,会被整批拒绝,那样的深挖没有产出。要想既保住 C 又不被拒,外围必须改变「选哪些票进多头腿」的几何,
    而不是再改一遍排序。三类外围(都是 head 与共性表里没有出现过的写法):
    (A) 门 / 筛:cs_first_low40 / cs_first_low20 / cs_first_high40(C, X) 把 X 最低(或最高)的一档整块推到最前,其余按 C 排,多头腿(最低端)变成「在 X 不极端的票里取最低 C」。
    X 取 LogFloatShares、day_std(Volume)(M2 的门)、LogFloatCap(去微盘)、day_last(Vwap)(后复权价位)、已知族 cross_mean(day_std(Amt),30)、20 日成交额。同一个门取高端与低端各放一个(种子 1 与 16、2 与 15),让评估告诉我 C 的收益住在哪一半。
    若 X 与 C 无关,40% 的门使 |ρ(门后信号, rank(C))| 约 0.51,20% 的门约 0.59(按秩的方差算的期望值,不是实测),落在 0.7 以下。
    (B) 反过来用 C 当门(种子 7、8):cs_first_high40(排序量, C) 把高重心的 40% 整块推到最前,多头腿只在低重心的 60% 里按排序量取,排序量取 LogFloatShares 与 M2 的整个子树。
    (C) 带:cs_first_low20(C, C) 把重心最低的 20%(推断:这一档里有连续一字板的涨停锁死、新股连板,这些票既难买进,重心又会被机械地压到接近 0;本轮没有直接看数据)推到最前,多头腿落在 C 的 20%–30% 分位带上。
    这不是 C 的单调改写:它与 rank(C) 的日度秩相关按公式约 0.04(实测由相关度表给)。若 C 的收益是单调的,这一带应当比最低一带稍差但更稳;若最低一档是伪影,这一带反而更好。
    (D) 乘积(种子 9、10):mul(cs_rank(C), cs_rank(M2 的子树或 LogFloatShares)) 的最低十分位 = 两个量都低的票(合取),两个独立秩的乘积与每一个的日度秩相关按公式约 0.65,低于 0.7。

    【和已见写法的区别】已见的含 C 的候选外围只有:cs_rank(·) 外面减 cross_mean(day_gini) / 减 cs_rank(ts_hurst 的嵌套) / 再套一层 cross_mean(·, 30) / 减 cs_rank(cross_mean(day_gini(Amt)))。
    它们是同一个几何(秩的线性组合),本轮没有一个种子是 C 的线性组合。

    【为什么样本外还会在】C 是参与者结构的慢变量,不是某年的风格:train 与 valid 都是 +1.7 以上、方向一致(不需要靠挑方向);门变量 LogFloatShares / LogFloatCap / day_std(Volume) / 价位是静态或极慢的,
    门在日度上几乎不引入换手。已知风险我写在这里:(i) 15:00 那格在深市含收盘集合竞价、沪市没有,C 的水平里可能带着交易所哑变量,N 位用「去掉两个竞价格」的重心 / 尾盘占比去直接检验;
    (ii) 门使多头腿换了人群,单个种子的分数可能掉到 0.5 以下;(iii) 带(种子 6)依赖分位点的位置,20% 是随手取的整数档(cs_first_low20 算子自带),没有按 train 调过。
