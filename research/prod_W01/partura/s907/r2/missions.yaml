- head: 'sub(cs_rank(cross_mean(day_centroid(Volume), 30)), cross_mean(day_gini(Volume), 30))'
  why: >-
    烂部件是 cross_mean(day_gini(Volume), 30):它单独 -2.02(train -2.02 / valid -1.96),在 head 里的必要性只有 +0.27(去掉它换成日度 gini 仍有 +1.30),而 cs_rank(cross_mean(day_centroid(Volume), 30)) 单独是 +1.73(train +1.73 / valid +1.88),比 head 高 0.17。
    拆解表里 rho_known(与已知族 cross_mean(day_std(Amt),30) 的相关):cs_rank(C) 是 -0.56,把日度 gini 当搭档的敲除变体是 -0.37,Volume 换 Amt 是 -0.38 —— 推断:gini 一项的真实作用是把对已知族的暴露压到 0.5 以下(过 R 与 head 的门),不是 alpha(推断,没有直接看到 head 自己的 rho_known)。
    所以不换重心,换补丁:用对已知族的显式中性化代替 gini。新尺子本来就去掉了对已知族秩的线性 / 平方 / 三次暴露,所以中性化只改 |ρ_known|,不应丢分。变体 1:在秩上回归掉已知族的残差;变体 2–3:秩加 0.4 / 0.56 倍已知族秩
    (rank(C) 与已知族秩的 ρ 约 -0.56,加 0.56 倍使协方差为 0);变体 4:Amt 版的回归残差(稳健性,Amt 版 head 为 +1.55);变体 5:回归掉 gini 的 30 日均值而不是已知族(检验 gini 的线性部分有没有用);
    变体 6:用半衰期 20 的 cross_ema 代替 30 日硬窗口再回归掉已知族(旧值渐隐而不是掉出窗口;窗口 15 / 60 的 valid 是 +0.89 / +0.70,硬窗口的边缘效应可能是噪声的来源)。
