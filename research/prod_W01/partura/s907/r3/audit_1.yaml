attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [10, 12]
    reasons: |-
      创新度 3。核心 Z = cross_zscore(cs_mask_top_replace_mean_neg(day_first(Volume)), 30) 已经是 M3 两个 Volume 版 head 的子树（+1.46 的两层 cross_max 链，+1.24 的四层链），核心本身不新。外围 14 个种子的新处只在统计量：cross_max 换成 cross_min、cross_med、cross_mean、尾部均值、超阈值的 z 之和、二阶矩、range。相关度表里，未划掉的种子对库里任一 head 的原始 |ρ| 为 0.15–0.47；只有种子 11（0.655，对 M3 四层链）与 13（0.675，对 centroid head）接近 0.7 但未过。对 5 个控制的最大 |ρ| 为 0.51（种子 11 对 known）。这些都是同一核心的同一类统计量换读法，没有新的信息来源，所以给 3 而不是 4。
      合理度 3。逐个核对算子，没有 §4 的数学问题：cross_zscore 用总体标准差，窗口内 |z| ≤ √(n−1) ≤ 5.4，代码另有窗口近常数置 0 的保护，因此没有除以近零的爆点；day_first 取第一个有效格；cross_max / cross_min / cross_med / cross_tail_mean_q75 / cross_ema / cross_sum / is_gt 的 NaN 处理都正确。但核心里的 mask 需要点明：cs_mask_top_replace_mean_neg 把每天截面上最薄的 10% 的开盘量换成全截面均值（代码里 row_means 是所有有效票的均值，右偏分布下这个值通常远高于薄票自己的水平）。所以薄票当天的值被抬高，z 通常是较大的正数（上界 5.4）。计划的机制写的是「开盘放量 = 关注事件」，算子实际读的还包括「开盘极端稀薄」（停牌复牌、封板开盘、零成交日）。两者的 alpha 来源不同。计划自述去掉 mask 后仍有 +0.96，说明放量那一部分是真的，但 mask 带来的那部分（自述约 +0.5）的来源是另一回事，计划里没有分开。这不是数学问题，按 §3 放行，但请 PI 在结论里把两者分开。
      划掉的 10 与 12 是表里 |ρ| ≥ 0.7 的自动划掉（10 对 M3 四层链 0.815；12 对 Pr2a 的 cs_first_low40(cs_first_low20(...)) 0.730）。其余 12 个种子没有手动划掉的理由：没有完全相同的种子，没有控制 ≥ 0.8 的种子，也没有数学问题。种子 13 是 Z 记忆的排名与 centroid 排名的乘积，两个成分都是库里已有的，最像两个 head 的合成，新度有限，但不构成划掉的理由。
      如果它有 alpha，最可能来自：(i) 开盘集合竞价放量后的关注漂移（Gervais–Kaniel–Mingelgrin 的高量收益溢价），即计划写的机制；(ii) 更可能的是 mask 给出的开盘极端稀薄事件（停牌复牌、封板）在 30–90 日上的记忆。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      创新度 4。库里 17 个 head 中读「相对自己的反常」的只有 M3 的三个，且只用 09:30 一格。读其他时段（开盘后 30 格、尾盘 29 格、收盘格、午间）的成交量反常记忆、读尾盘占比与开盘占比反常的记忆、以及与市场的共同运动（种子 14、15），库里都没有。表里 15 个种子对库里任一 head 的原始 |ρ| 为 0.10–0.44，对 5 个控制的最大 |ρ| 为 0.36（种子 14 对 known），都不到 0.8。种子 2、7 与 M3 的 |ρ| 为 0.44、0.41，是同一个开盘信息的时段读法或份额读法，不是换写，所以给 4 而不是 5。
      合理度 4。逐个核对算子：in_slice 是闭区间切片（dt_in.py 中 x[:, a:b+1]），211–239 是第 211 到 239 格，即 14:31–14:59 的 29 格，第 240 格（15:00）由 day_last 单独读，两者不重叠，与计划描述一致。day_sum 对全缺失返回 NaN、对部分缺失做 nansum，停牌票不会变成 0。cross_zscore 有界（同上）。cross_corr 的 rolling_pair_reduce 沿日轴（axis=0）做 60 日滚动相关，cs_mean 把截面均值铺回每只票，实现的是「与市场同涨同放」。没有 ts_rank / cross_rank / in_rank_rolling，没有 nanrank 陷阱，没有 ts_spearman 与 nt_*。这一批没有 mask，§4 的 mask 问题不适用。前视：按 AlphaCube 回测引擎的 T→T+1 约定（src/alphacube/backtest/engine.py：t 日收盘定仓，收益为 t→t+1），所有读数在 t 日收盘时可得，不是前视。但若要求收盘前成交，14:31 以后的量和第 240 格都不可得，计划要说清口径。
      需 PI 核对但不挡：(a) 第 240 格（15:00）是否含收盘集合竞价，以及沪市收盘集合竞价的起始日（我记得是 2018 年 8 月前后，未核对）。若起始日在训练段内，种子 4 的 day_last 与 3、10、13 的 211–239 段会在起始日前后出现板块级的整体跳变，30 日窗口内全部沪市票同向。这是板块信息，按 §4 不挡，但请 PI 看一下 2018 年 8 月前后的截面。(b) 种子 5 的 61–180 格是 10:31–14:00，标成「午间」不准确，不影响数学。(c) 种子 12、13 的 cross_min 取的是「最冷的一次」，其极端值可能主要来自一字板、停牌复牌等极薄或零成交的日子（分布未核对）。若是这样，alpha 来源应是那些事件，而不是计划写的「关注撤退」。
      如果它有 alpha，最可能来自：不同参与者的时段偏好（开盘的散户脉冲、尾盘的机构基准拆单）在 30–90 日上的慢记忆；以及种子 14、15 的共同运动（指数与被动资金主导的票随市场同涨同放，与 Morck–Yeung–Yu 的同步性一致）。
R:
  - head: 'cross_mean(div(day_sum(in_slice(Volume, 211, 239)), day_sum(in_slice(Volume, 1, 239))), 20)'
    soundness: 4
    reasons: |-
      合理度 4。这是 Pr2b_Nb 的 head（train +1.95 / valid +1.79，两段同向）。七个变体逐个对应计划点名的可疑部件：分母含开盘后 30 格（变体 2、3 换分母，变体 7 做差）、窗口末端（变体 1 截到 236，检验 14:57 起的收盘竞价）、尾段长度（变体 4、5、6）。算子核对：in_slice 闭区间，分子分母口径一致，div 为比值，cross_mean 为 20 日均值，没有 mask，没有 nanrank 陷阱。分子和分母都不含第 240 格（15:00），所以这个 head 本来就排除了收盘格。变体 1 的原始 |ρ| 为 0.986、残差 0.978，几乎是同一个东西，作为检验可以，但不会给出新信息。变体 7 与 liq、known 的 |ρ| 为 0.48、0.51，接近控制的写法，替换时要看残差。
      如果它有 alpha，最可能来自：尾盘参与者结构的稳定习惯（尾段拆单与基准交易占比低的票，相对于开盘集中、散户占比高的票），是慢变量，换手低。
  - head: 'cross_max(cross_max(cross_zscore(cs_mask_top_replace_mean_neg(day_first(Volume)), 30), 30), 30)'
    soundness: 3
    reasons: |-
      合理度 3。M3 的 +1.46 head（两层 cross_max 加 30 日 z）。四个变体分别把 z 的窗口换成 60、把单格换成开盘 30 格和 5 格的和、把水平换成占全天的份额。算子语义都对，没有爆点（z 有界）。变体的动机（单格噪声大，改成多格和份额）说得通。但四个变体都保留了 mask，slot a 理由里那段「mask 把薄票抬到均值、计划的放量里混进开盘极薄事件」的问题在这里同样存在，变体 4 的份额定义下薄票的份额也会被抬起。这不是数学问题，放行。
      如果它有 alpha，最可能来自：开盘集中度的关注记忆（变体 2、3 的多格读数对应更宽的放量）；但 mask 带来的部分更可能是开盘极薄事件的记忆，两者要分开。
  - head: 'signedpower(cs_first_low40(LogFloatShares, day_std(Volume)))'
    soundness: 3
    reasons: |-
      合理度 3。M2 的 +1.43 head（库里另有一条带 abs_ 的版本，LogFloatShares 为正，两者相同）。四个变体把门 day_std(Volume) 换成 5 日、20 日、60 日均值与半衰期 10 日的 EMA，动机是减少门在 40% 分位线附近的日间进出（换手）。算子核对：cs_first_low40 的 _lexi 带与 +1 的平移正确，门变量为连续量，没有并列；cross_mean / cross_ema 的 NaN 处理正确。
      需要说明的一点：按表里「方向 -1」的约定（与尾盘占比 head 的「多头 = 占比低」相同），多头腿取表达式的低端，即 day_std 最高的 60% 里流通股本最小的票；day_std 最低的 40% 整块在空头侧。计划的「day_std 最低 40% 推到最前」只描述了表达式的形状，没有给出为什么低日内成交离散度应该做空、为什么高离散度里的小盘应该做多的机制。计划自述门单独的 valid 为 -1.87（样本内），所以这个 head 的分数主要来自门外的流通股本排序，机制没有说清。这不是数学问题，放行。变体与原 head 的残差相关为 0.84–0.97，变体基本是同一个信号的平滑版，替换的信息增益有限，请 PI 知道。
      如果它有 alpha，最可能来自：低日内成交离散度的票（筹码稳定、通常偏大）与小流通股本之间的截面分层；或者只是 day_std 对流动性的代理。变体与 liq、vol 的原始 |ρ| 为 0.30–0.39，与 known 为 0.39–0.44，都不到 0.8。
summary: 'a 通过（创新 3、合理 3，自动划掉 10、12，剩 12 个）；b 通过（创新 4、合理 4，无划掉，剩 15 个）；R 三组全部保留（R1 合理 4，R2 合理 3，R3 合理 3）。无前视，无 ts_spearman 与 nt_*，无 nanrank 陷阱，无 cross_zscore 爆点。需 PI 核对：mask 把薄票事件混进放量记忆（slot a、R2），沪市收盘集合竞价起始日与第 240 格（slot b），R3 多头腿的方向与机制。评分只用训练段与验证段内的数（相关度表与 heads 表），没有计算任何 2023-08-08 之后的数。'
