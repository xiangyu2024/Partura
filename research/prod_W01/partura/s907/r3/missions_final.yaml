  hypothesis: '【核心】Z = cross_zscore(cs_mask_top_replace_mean_neg(day_first(Volume)),
    30)。day_first(Volume) 是每天第一个有效格(09:30 格,含开盘集合竞价撮合量)的成交量;cs_mask_top_replace_mean_neg
    把当天截面上最低 10% 的值换成截面均值(每天一次,只动最薄的票);cross_zscore(·, 30) 把它换成「相对这只票自己过去 30 个交易日」的标准化,跨票的水平差(流动性、市值)被去掉,只剩「今天的开盘成交量对这只票是不是反常」。

    【本种子的证据,全是 train / valid】M 第 3 批的 3 个 head 都是 Z 外面套 cross_max 的链:cross_max×3 为
    +1.46(train +1.46 / valid +1.78,方向 +1,半衰期 5)、×5 为 +1.24 / +1.34、带 q25(Amt) 的变体
    +0.92 / +2.26。拆解:去掉 cross_zscore 掉到 +0.34(必要性 +1.12);去掉 cs_mask_top_replace_mean_neg
    为 +0.96(必要性 +0.49);末层 cross_max 窗口 @15 为 +0.74、@60 为 +1.25(@30 是 +1.46,不是单调,窗口不要当成可以调的旋钮);Volume
    换 Amt +0.95。Z 本身(当天值)的充分性是 -2.29(train),所以收益不在当天的反常,而在「过去一两个季度里出现过反常」的记忆。共性表:含
    Z 的 10 个候选均分 +0.43 对不含的 -1.02(p 0.001),含 cross_max(Z, 30) 的 6 个 +1.03 对 -1.02(p
    0.0002)。

    【为什么外围换成这样】已见的含 Z 的外围全是同一件事:把 Z 的最大值取一遍又一遍(cross_max 套 2、3、5 层,窗口 15 / 30 / 60)。那是一个统计量(窗口内最大
    z),库禁令 |ρ| >= 0.7 会拒绝它的一切窗口改写,所以本轮不动窗口,换「记忆的统计量」,回答:记忆里重要的是 (a) 最大的一次(已知)、(b)
    反常的总量(cross_sum(mul(is_gt(Z, 阈值), Z)) 是超过阈值的 z 之和,连续值,不是次数)、(c) 上四分位的平均强度(cross_tail_mean_q75)、(d)
    每个月都有的下限(cross_min(cross_max(Z, 30), 90) 和 cross_med(cross_max(Z, 30), 90):不是一次性的尖峰,而是反复出现)、(e)
    持续多日的反常(先 5 日平滑再取最大)、(f) 反常的反面(cross_min(Z):最冷的一次,即断崖式缩量)、(g) 平均与二阶矩(cross_ema、cross_mean(pow_2(Z)))。每个种子对应其中一种,预期与
    M3 的三个 head 的 |ρ| 在 0.3–0.7(取最大值的几个会更高,可能被表划掉)。另有 3 个种子把 Z 的记忆和库里独立的来源拼起来:cs_first_high40(·,
    day_std(Volume)) 用 M2 的活跃度门(day_std(Volume) 最高 40% 里取 Z 记忆最强的票)、cs_first_low40(·,
    LogFloatShares) 取小流通股本、乘积用 C 的反向秩(开盘集中 × 有过开盘反常)。注意避免整数并列:所有种子都是连续值(次数型的统计量改写成「超过阈值的
    z 之和」),以免被截面并列门槛挡掉。

    【机制】开盘集合竞价是隔夜信息(公告、消息、榜单)被散户和游资集中消化的时刻;一只票 09:30 格成交量远超它自己的惯常水平,是「有人突然在关注它」的事件(水平差已被
    z 去掉)。事件之后的关注 / 资金接力(post-event attention drift)持续数周到数月,所以 60–90 日的事件记忆比单日反常稳,也是慢变量,换手低,15bp
    吃得下。五个控制读的是水平(金额、波动、市值)和 20 日反转,不读「相对自己的反常的记忆」。

    【为什么样本外还会在】关注事件的后续效应来自散户 / 游资的参与结构,不是某一年的风格;3 个 head 的 train 与 valid 同向且 valid
    不低于 train(+1.46 / +1.78,+1.24 / +1.34,+0.92 / +2.26),不靠挑方向。已知风险(都来自读代码):(i) cs_mask_top_replace_mean_neg
