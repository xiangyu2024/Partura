    mask 仍有 +0.96,说明放量本身是真的;(ii) day_first 取第一个有效格,09:30 格缺失会落到 09:31 格,口径略有混杂;(iii)
    长期停牌后复牌的第一天对 30 日历史是巨大 z,会把后面 60–90 日的秩推高(cross_zscore 在窗口有效天数 <2 时给 NaN,所以不会由填充决定,但复牌放量会进来);(iv)
    valid 区间(2022-01 ~ 2023-08)是小盘 / 散户风格强的阶段,valid 不低于 train 不能证明跨风格稳健。'
