  - type: N
    hypothesis: |-
      主题:有效的是「协动」,不是「水平」。把这一批的证据放在一起读。
      (1)库里 7 个 head 的核心全是两个日频统计量在 50 到 241 日窗口里的协动:C = corr(市值水平, 日内最高价方差的重尾暴增量, 241)(M3 的 3 个 head 同族,第三名把第一项换成滞后的分钟成交额不同取值占比);H = regbeta(成交量集中度 gini, VWAP 峰度, 50)(及它的 3 个混合)。
      (2)把这些 head 拆开的单腿几乎全垮:Z 单独 -1.09 / -0.57,day_var(High) 单独 -1.30 / -0.45,H 的两半分别 -2.76 与 -3.38(score,第 2 轮笔记)。
      (3)前两轮我写的一阶、水平型种子(隔夜缺口 / 日内漂移的慢 EMA、重分钟收益的慢 z 值、封板频率的水平)最好只有 +0.29,没有一个过线;重分钟收益的慢 z 值只在混合里当伙伴才有用。
      猜想(未验证):新尺子对 5 个控制(流动性、波动、20 日反转、已知族、市值)取线性 + 二次 + 三次的日度残差,一阶的慢水平量大多是这几个控制的非线性函数(波动水平、成交额水平、价格水平),被残差化掉;两个统计量的协动是二阶量,对任何一条腿的水平近似正交,残差化之后还在。本位按这个猜想造种子,并放一组一阶对照来检验它。
      A 组,杂交:把两个已验证家族的原料互换,看「协动」这个形式能否迁移。(1)cross_corr(LogFloatCap, 暴增量, 241),暴增量 = 原始峰度 day_kurt(Vwap)+3 的 1.5 次幂、30 日衰减、再平方:C 的状态腿 + H 的尾部腿;(2)cross_corr(LogFloatCap, 30 日衰减的 day_gini(Volume), 241):状态腿 + 成交量集中度;(3)cross_corr(LogFloatCap, ts_regbeta(day_gini(Volume), day_kurt(Vwap), 50), 241):H 的斜率序列与市值路径的协动(二阶的二阶);(4)cross_corr(cross_ema(day_distinct_ratio(Close), 30), 暴增量, 241):价格网格粗细(价位的无量纲代理)作状态腿,M3 第三名的思路换成 Close 与 Ret。
      B 组,去掉价格量纲:M3 的暴增量 Z 带着价格水平的 6 次方(day_var(High) 是价格平方单位,后复权价格的排序约等于累计收益),我并不知道 head 的 alpha 来自「协动」还是来自「价格水平的幂次」。pow_3(day_std(Ret)) 与 pow_1_5(day_var(·)) 是同一个幂次,但 Ret 是比值,没有价格量纲。种子的状态腿分别用 LogFloatCap、log(后复权收盘价)、20 日 EMA 的日内收益(动量状态)、ListAge(时间,即暴增在窗口里是否上升)。判读:LogFloatCap / log 价这两个若 ≥ 0.5,说明是协动;若塌而 A 组活,说明 C 里的价格幂次是关键;若全塌,说明 C 读的是价格水平本身(长期反转 / 低价效应)。
      C 组,带符号的日频协动:ts_corr(day_sum(Ret), day_std(Ret), 120)(当天涨跌与当天分钟波动,杠杆效应的个股版);ts_corr(day_kurt(Vwap), day_sum(Ret), 120)(价格尖峰出现在上涨日还是下跌日);ts_corr(day_gini(Volume), day_sum(Ret), 120)(成交量集中在涨日还是跌日);以及 gini(Volume) 的 30 日衰减与暴增量的 241 日相关(慢对慢)。第 2 轮 N 的 centroid / signed_ratio 配对没有进前 5,说明配对不能随便选;这里的配对用 H 的两条腿(gini、kurt)加有符号的收益,是 H 在「方向」上的补集。
      D 组,一阶对照(我预测都 < 0.3,用来检验上面的猜想):12-1 动量 sub(log(ts_delay(day_last(Close), 20)), log(ts_delay(day_last(Close), 240)))(跳过 20 日反转),离 52 周高点的对数距离(George-Hwang 2004),资本利得悬置(Grinblatt-Han 2005,按成交量加权的 241 日均价作参照价;Volume 是未复权股数、Close 是后复权价,窗口 241 日内送转造成的权重失真很小),上行 / 下行半离差之比 (pos - neg) / (pos + neg)(Patton-Sheppard 2015)。若其中任何一个 ≥ 0.5,猜想就错了一半:一阶量里还有活的。
      与库里不同的原因:库里 7 个 head 的原料是日内最高价方差 + 市值水平、分钟成交量集中度 + VWAP 峰度、重分钟收益 / 成交额的慢 z 值;A 组是这些原料的新配对(预计与 C 或 H 的日度秩相关 0.3 到 0.6,相关度表给真实数),B、C 组换了原料或去掉了价格量纲,D 组是日频后复权价格的比值,与它们预计 0.2 到 0.5。与控制的关系:协动量对波动 / 流动性 / 市值的水平近似正交,这是整个猜想的内容;D 组与 20 日反转有一定相关,尺子已去掉其线性 / U 形 / S 形暴露。
      数学检查:全部是当日收盘后已知的量,无前视;day_kurt 是超额峰度,值域下界 -2,+3 后为正,才能做 1.5 次幂;日内全天价格不动(封板 / 停牌)的日子峰度为 NaN 或落在下界,成对窗口的统计会跳过 NaN;pow_3(day_std(Ret)) 非负;log 只作用在正的后复权收盘价;D 组里的除法分母(窗口均值、两个半离差之和)在停牌 / 常数窗口为 0 时给 NaN 或 inf,由评分流水线的覆盖率 / 并列门槛处理,不会产生系统性的爆点;所有输出是连续值(不用 ts_argmax 这类只有 241 个取值的离散量);窗口热身期只占样本开头的零头。
      为什么样本外还会在:协动型特质由交易这只票的参与者结构决定(散户 / 机构、涨跌停与 T+1 制度),不依赖某一年的行情;全部是 60 到 241 日的慢变量,换手低,扣 15 bp 之后能剩;如果种子与 C 或 H 度量的其实是同一件事,相关度表会直接划掉,留下来的就是新的。
