    hypothesis: |-
      核心 C = M3 第 3 批第一名 head 整体:cross_corr(LogFloatCap, pow_2(ts_decay_linear(pow_1_5(day_var(High)), 30)), 241),score +1.27(train +1.46 / valid +1.27,sign +1,hl 0)。
      读法:Z = pow_2(ts_decay_linear(pow_1_5(day_var(High)), 30)) 是「日内最高价方差^1.5」做 30 日线性衰减再平方,极端重尾,窗口里基本由最近几次日内振幅暴增主导;cross_corr(LogFloatCap, Z, 241) 是一年窗口里市值水平与这个暴增量的相关,重尾下约等于「这只票最大的几次振幅暴增发生时,它的市值在一年区间里处于什么位置」。
      证据全部来自本组定位表:Z 单独 -1.09 / -0.57,day_var(High) 单独 -1.30 / -0.45,所以 alpha 在耦合而不在波动水平;窗口 120 塌(train +0.09 / valid -0.32)、482 活(+0.51 / +1.10);High 换 Low 仍 +1.16;拿掉 pow_2 / pow_1_5 仍有 +0.99 / +0.77,不是某个幂次的偶然。
      M3 在这一族里已经有 3 个 head(C、双层 pow_2_5 版、X 换成滞后分钟成交额离散度的一个),彼此的日度秩相关都在 0.7 以下(否则库禁令不会放行),但 GP 的库禁令(日度秩 |ρ| ≥ 0.7,或骨架相同)把 C 周围的近邻和小修饰全部封死。所以本位不动 C 的内部,也不再往这一族里加近邻,回答另一个问题:C 能不能和库里原料完全不同、且已在 train 与 valid 同时过线的信号做「与」。
      外围是什么:乘法或取小的秩组合,而不是加权和。快照里见过的外围是 Pr2a(核心为 H)的加权和 add(mul(rank(H), 0.35), mul(rank(伙伴), 0.65))和一个 H 与伙伴的两腿乘积(+0.83,没有成为 head),没有任何含 C 的组合。为什么不用加权和:若两条腿互相独立,等权秩和与每条腿的秩相关 = 1/sqrt(2) = 0.707,恰在禁令线 0.7 之上;C 与 H 都是库里的 head,任何加权和至少与其中一个 ≥ 0.7(两个比重的平方和为 1),必被拒绝。mul(cs_rank(a), cs_rank(b)) 对独立的两条腿与每条腿的相关约 0.655,取小 2*min(rank a, rank b) 约 0.61,三腿乘积约 0.49;以上是独立假设下的解析值,不是测量,相关度表会给出真实数。这就是外围要换成「与」的原因:它是库里 head 的非线性交互,不在任何一个已有 head 的线性邻域里。
      三类种子。(1)两腿乘积 / 取小:C 配 H = ts_regbeta(day_gini(Volume), day_kurt(Vwap), 50)(分钟成交量集中度与 VWAP 峰度的 50 日耦合,train +0.97 / valid +0.92,原料是分钟成交量与成交额加权价,与 C 的日内最高价方差 + 流通市值完全不同);C 配三条已知伙伴 —— P1 = 重分钟(成交额最大 10%)收益的 60 日 z 值再 EMA(train +0.12 / valid +1.04)、Psr = 上涨分钟成交额占比净值的慢 z 值(-0.44 / +0.56)、PAA = 重分钟成交额的慢 z 值;以及价位项 P2(隔夜缺口减 |价位项| 的 60 日均值,+0.29 / +0.65)、P3(价位项取反,-0.01 / +0.73)。这些伙伴都是「valid 强、train 弱」,C 的 train 强,乘积的 train 靠 C 撑、valid 两者都强。伙伴与库里 Pr2a 三个 head 里的伙伴是同一类,但乘积对该 head 的相关约 0.655 * 0.88 = 0.58,不触线。(2)三腿:mul(mul(C, H), P1) 与线性三腿 0.36 C + 0.34 H + 0.30 P(P2 或 P3,与库里所有 head 都不同源),各腿比重都不超过 0.36,与每条腿的相关约 0.6。(3)分段:cs_first_high20(C, H) 只在 H 最强的 20% 里按 C 排序,cs_first_high20(H, C) 反过来;让「与」以段内排序的形式出现,与每条腿的秩相关约 0.5 到 0.56。
      数学检查:每条腿都过 cs_rank(0, 1],缺失保持缺失,乘积 / 取小没有除法,不会有近零分母的爆点;覆盖率取最小腿的覆盖(H 0.998,C 受 241 日窗口热身限制,热身期只占训练段开头),没有用到当天收盘之后的数据。C 内部的浮点行为(Z 的量级、窗口方差)已经被评分流水线实际算过并给出 +1.27,本位不改它。
      为什么样本外还会在:两个祖先各自在 train 与 valid 都过线(C 1.46 / 1.27,H 0.97 / 0.92),原料互不相干(日内最高价方差 + 流通市值水平 vs 分钟成交量集中度 + VWAP 峰度),「与」要求两个独立证据同时成立,单个祖先在某一年的偶然高点不够;全部是 50 到 241 日的慢变量,秩乘积换手低,扣 15 bp 之后还能剩。风险:C 与 H 若本身有 0.4 以上的相关,乘积对祖先的相关会越过 0.7,被相关度表划掉;乘积的头部比单腿更集中(前 10% 要两条腿同时靠前),净夏普有更大的波动。
