- type: N
  hypothesis: '把「收盘到收盘」收益拆成两段并读它们的慢变量:隔夜缺口 G = log(今日首分钟 Open / 昨日 Close)(集合竞价与隔夜消息的一次性定价,机构
    / 信息驱动), 和日内漂移 I = log(今日 Close / 今日首分钟 Open)(连续竞价,散户 / 噪声驱动)。制度上 A 股隔夜不能交易、T+1、涨跌停,隔夜信息只能在开盘一次定价,
    日内则是散户博弈,这种分工不依赖某一年的行情。文献背景:Lou-Polk-Skouras(2019)「隔夜 vs 日内」两段收益各自有持续性且方向相反; Berkman
    等(2012)隔夜收益里的注意力效应。 算子实现:G = log(div(day_first(Open), ts_delay(day_last(Close),
    1))),I = log(div(day_last(Close), day_first(Open))),都是只用当日收盘后已知的量、 不含常数、不除以近零量的日频序列;停牌
    / 首日 NaN 不填充;涨停一字板的极端缺口用 sign 或 cs_winsor 抑制,避免一两个爆点支配截面。 种子分四组: (a)慢水平:cross_ema(G,
    60 / 241)、cross_ema(I, 60)、两段之差 G - I(「谁在拉锯」); (b)稳健版:cross_mean(cs_winsor(G),
    60)、cross_mean(sign(G), 60)(上跳缺口比例 - 下跳缺口比例)、sign(G) - sign(I); (c)联动 / 接力:ts_corr(G,
    I, 50)、sign(G) * sign(I) 的 60 日均值、方向对齐的日内收益 sign(G) * I:读的是缺口之后日内是继续还是回补, 即隔夜信息的真假与散户对缺口的反应,它是个股的行为习性而不是收益水平;
    (d)标度 / 异常:G 除以 60 日波动、cross_zscore(G, 60)、快慢 EMA 之差、缺口的下四分之一尾部均值(隔夜暴跌风险)。 与库里不同的原因:快照里没有任何
    head,共性表里与本想法最近的只有 cross_ema(day_sum(Ret), 241) 一族(只含日内那一半,不含缺口,也不含两半的对立与联动);
    缺口一半和它与日内的关系整批 124 个候选没有出现。它与 20 日反转控制只是部分相关(一个是 60 日以上的慢分量,一个是总收益), 与波动 / 流动性
    / 市值控制的度量对象不同,新尺子再把对它们的线性、U 形、S 形暴露去掉。 为什么样本外还在:慢变量(60 - 241 日)换手低,15 bp 之后能剩;sign
    型度量对厚尾稳健;机制来自市场微观结构的分工,不是某一年的行情。'
