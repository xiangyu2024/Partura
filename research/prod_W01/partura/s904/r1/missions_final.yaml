  hypothesis: '核心 H = day_topw_mean(Ret, Amt):每天成交额最大的约 10% 分钟(约 24 个;A 股集中在开盘几分钟、收盘几分钟和消息脉冲)里的
    平均分钟收益,即「钱真正成交的时候价格在往哪走」,是大资金净推动方向(吸筹 / 派发、追涨 / 杀跌)的日内读数。它既不是日收益, 也不是波动或成交额水平,度量对象与
    20 日反转、流动性、波动、市值四个控制不同。 快照共性表里含 H 的候选有 56 个且明显更好(均值差 +0.65,p=0.0015),但表里反复出现的外围几乎都是同一类:
    ts_reg_tvalue(H, ListAge, 30)(H 与时间下标的相关,即 H 的变化趋势)、abs_ / pow_05 变换、ts_sum(·,
    40)。它们做的全是 H 的时间序列 形状;从表里看不到把 H 当作「持续存在的水平」、对波动或自身历史做标度、与当天整体方向对照、改读分布尾部、或把 H
    与日收益的联动当对象。 这一轮外围刻意全换: (1)水平 + 长半衰期平滑 cross_ema / cross_mean(30 / 60 / 241 日):压掉日噪声(15
    bp 成本下换手是第一杀手),留下个股长期稳定的大单方向; (2)标度:除以慢波动 cross_mean(day_std(Ret), 60) 或当日资金加权波动
    day_wstd(Ret, Amt),变成「单位波动的大单推动」, 避免高波动股的数值大小主导排序;cross_zscore 读「相对自己的历史」; (3)对照整天:H
    - day_mean(Ret)(重分钟比平均分钟多走了多少)、H * sign(day_sum(Ret))(大单方向与当天方向一致 / 背离)、H - day_wmean(Ret,
    Amt); (4)分布形状:cross_tail_mean_q25 / q75(H 最差 / 最好四分之一天的均值)、ts_rank; (5)联动:ts_corr(H,
    day_sum(Ret), 50) 及其滞后一天版本,读的是重分钟方向对当天 / 次日收益的传导强度(类似价格冲击,衡量大单的信息含量而非方向); (6)条件化:cs_bucket_rank
    在同一波动十分位内排名;cs_flip_by_state 用慢市场状态(cross_ema(day_sum(Ret), 60) 的全市场均值相对近 241
    日中位数) 决定方向,承载「大单方向在上涨 / 下跌市里含义不同」。 数学上无前视(只用当日收盘后已知的整日分钟序列);分母用 60 日平均波动或资金加权波动,不会除以近零;停牌
    / 缺失日保持 NaN 不填充。 为什么样本外还在:大单方向由机构拆单、散户跟风以及 T+1、涨跌停这类制度性约束决定,不是某一年的行情;慢平滑版换手低,扣
    15 bp 之后还剩得下; 标度版和波动控制近似正交,新尺子去掉控制的非线性暴露之后留下的是「方向」而不是「波动大小」。'
