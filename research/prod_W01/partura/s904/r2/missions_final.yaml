- type: N
  hypothesis: 涨跌停「封板足迹」(lock-event footprint)是一个慢变的个股特质。A 股有 10% / 20% / 5% 的涨跌幅限制加
    T+1,一部分票反复出现触板后价格被钉死在日内极值的日子 (涨停封板:价格冲到极值后水平推到收盘;一字板:整天一个价),这是游资 / 题材交易的足迹,个股的封板频率和强度很稳定,50
    天的窗口就够读出来。 线索来自本批唯一的 head H = ts_regbeta(day_gini(Volume), day_kurt(Vwap), 50)
    的消融:两半单独崩(-2.76 / -3.38),只有 50 天耦合有效;Volume 换成 Amt 不变; Vwap 换成 Close 时 train 掉到
    +0.32 而 valid 仍有 +1.02;窗口 25 崩、50 和 100 活。封板日恰好让 gini(Volume)(量堆在触板前的几分钟,之后几乎没有量)和
    kurt(Vwap)(路径先动后被钉死,形成一个尖峰)同时极端,所以 50 天的协方差很可能由少数封板日主导。这是猜想,不是已验证的机制;本位就是检验它,并给下一轮留对照。
    算子怎样实现:day_at_max_ratio(Close) 是一天里价格停在当日最高价的分钟占比(封板读近 1,普通日约 1/240),day_at_min_ratio
    是对应的最低价(跌停封板), day_flat_run_max(Close) 是最长的一段静止分钟占比,day_flat_ratio(Vwap) 是静止分钟占比;它们都是比例、无量纲,不依赖价格水平;停牌与不足两根有效分钟的日子是
    NaN,不填充。 种子分三组。 (a)直接度量封板:at_max 的 50 日均值与半衰期 30 的 EMA,at_max 与 at_min 的双边和、方向差,最长静止段的均值,上四分位日的均值(强度而不是频率),
    以及用 cs_last_low05(..., ListAge) 剔除最次新 5% 的版本(新股连续一字板是已知的混杂)。 (b)耦合:保留 H 的形式,把
    y 位的 kurt(Vwap) 换成明确的封板度量(at_max / at_min / 最长静止段 / flat_ratio),x 位仍是 gini;以及
    ts_corr 的无尺度版。若它们与 H 一样有效,说明 H 的内容就是封板。 (c)对照组:不含任何封板量的耦合 —— day_centroid(Amt)(成交的时间重心,gini
    / kurt 这类与顺序无关的统计丢掉的信息)对 day_sum(Ret) 与 day_signed_ratio(Ret, Amt) 的斜率 / 相关, gini
    对 AR(1) 系数的 t 值,以及 H 的残差版 ts_regres 的 EMA。若(c)和(b)同样好而(a)很差,说明 H 的耦合形式可以迁移到别的变量对,而不是封板。
    与库里不同的原因:库里只有 H;(a)组不含 gini 也不含 kurt,度量的是事件的频率而不是两个分布统计量的协动;(b)(c)的 y 位不是 kurt(Vwap),算子骨架与
    H 不同, 与 H 的相关由相关度表给出,>= 0.7 的会被划掉。数学上:全部只用当日收盘后已知的分钟序列,无前视;窗口均值的分母是有效天数,不会除近零量;
    比例量在 [0, 1] 内,没有爆点;ts_regbeta 在 x 方差 <= 1e-9 时给 NaN。 为什么样本外还会在:涨跌停幅度和 T+1 是制度,不是某一年的行情,事件型足迹由参与者结构决定;窗口
    50-60 日的慢变量秩 EMA 换手低,扣 15 bp 后还剩得下。
