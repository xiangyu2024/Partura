attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [5, 12, 13, 15]
    reasons: |-
      核心 H 是快照里唯一的 head。核心与五个控制的原始 |ρ| 为 liq 0.28、vol 0.19、rev 0.02、known 0.31、size 0.03，都 < 0.8，E 位条件满足。
      划掉规则：12（与 H 的原始 |ρ| 0.825）、13（0.99）、15（0.71）按规则自动划掉（head |ρ| ≥ 0.7）。5 与 1 只差权重（0.30/0.70 对 0.35/0.65），两式是同一组合 0.3x·秩H + 0.7x·秩P1，相互秩相关由构造接近 0.99，属重复，划 5 留 1。
      创新度 3：核心本身不新。加法型（1–5）与 H 的原始 |ρ| 为 0.38–0.57、残差 |ρ| 为 0.34–0.52，确实掺进了 P1/P2/P3 的新信息。乘法型（6–8）与 H 的 |ρ| 为 0.67–0.68、残差 0.61–0.67，离 H 很近。分段型（9、10、11、16）残差与 H 的 |ρ| 为 0.81–0.86，实质是 H 在某一段里的排序，只改了书的构成；14 的残差为 0.59。综合给 3：不是换皮，但也谈不上真正新的机制。
      合理度 4：逐个算子核对。cs_rank 只看截面、取值在 (0,1]、NaN 保持 NaN；cs_first_*（经 _lexi）对 x 缺失的票给 NaN，并列按整块处理；cross_zscore 在常数窗口给 0 而不放大；cross_ema 跳过缺失日而不填 0；全部用的是当日收盘后已知的整日分钟量，无前视。
      P3 = log(|z|/Open)：算子 log 取绝对值（common.py:211），稳健 z 的符号被丢掉，P3 是对截面中位价的 V 形，不是单调价位项，与 PI 笔记的描述一致。P2 把隔夜对数缺口（量级约 ±0.1）与 |z|/Open（随价格反比）直接相加，低价票由价位项主导；PI 笔记也承认 P2 的分数来自价位项。这两点不属于 §4 的问题，但请 PI 知悉。
      未核实、因此不据此挡的两点：（一）12、13 是 ListAge 门控的 H，与 H 的 |ρ| 为 0.83 和 0.99，说明 H 的排序与上市年龄的分段高度相关（表中是绝对值，方向未标）。上市年龄不在 5 个控制里，ruler 不会去掉它；PI 自己在 N 位里指出次新一字板是已知混杂，所以 H 的 alpha 可能有一部分是次新效应。（二）day_kurt(Vwap) 在 Vwap 全天常数（封板或停牌）的日子里，C._kurt 给出 0/0 即 NaN，若浮点残差非零则恒为 −2（下界）。若这类日子在 H 的 50 日窗口里占比大，H 的一部分会是数值伪影。PI 应先计数这类日子。
      如果它有 alpha，最可能来自：1 = P1 的慢重分钟方向信号（与 H 互补）；2 = P2 里的价位项而非缺口；3 = P3 的 V 形价位效应（取反）；4 = P1 或 P2 的 valid 强信号被 H 的稳定性托住；6、7、8 = H 与 P1、P2、(1−P3) 同时为正的交集；9、10、11 = H 只在小盘、大盘、最大盘 20% 段内排序；14 = 低波动段内的 H；16 = 低成交额离散度段内的 H。
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: [1, 3, 4, 5, 7]
    reasons: |-
      核心无（N 位）。自动划掉：无。没有 head 的原始 |ρ| ≥ 0.7，也没有控制的 |ρ| ≥ 0.8；最大的 head |ρ| 为 0.27，最大的控制 |ρ| 为 0.40。
      划掉 1、3、4、5：它们是 day_at_max_ratio、day_at_min_ratio、day_flat_run_max 的 50 或 60 日简单平均。这些日值在普通日有一个固定基线（at_max 约 1/240），简单平均后大量票得到完全相同的值。distinct 为 0.317、0.383、0.468、0.385，门槛推断在 0.47–0.57 之间（0.468 废品，0.565 过）。截面排序在并列块内由列序决定，属于 §4 的「面板几乎是常数」。同一序列的 cross_ema 版（2）distinct 为 0.998，说明问题出在窗口简单平均的离散化，不在序列本身。
      划掉 7：它的 y 就是 1 的表达式，cs_last_low05 输出序数秩，所以 gate 显示的 distinct 是 1.0，掩盖了同一个并列问题。
      6 的 distinct 为 0.565，只过门槛；q75 落在基线上时尾均值会退化接近全样本均值，有部分同样的并列。保留但标记。
      创新度 4：库里唯一的 head 与本位所有种子的原始 |ρ| 都 ≤ 0.27，与控制的最大 |ρ| 为 0.40；封板与静止状态和 H 的度量对象不同，不是换写法。
      合理度 3：机制（封板的慢频率与强度，以及它与量集中、成交重心的耦合）说得清，算子按 docstring 实现，无前视，ts_regbeta 的 var 有 1e-9 保护。但有一个前提未核实，我不把它当成数学问题挡：PI 笔记假定停牌日为 NaN。仓库里的证据互相冲突：ops_ext.py 的 day_flat_ratio 注释写「停牌或封板全天报价不动，读 1.0」（即有限值）；research/alpha_distillation/B01_batch_summary.md 写「封板、停牌、无收盘成交的分钟收益恰好为 0」（有限值）；F109_erm_mag_gap_5m_tsm20.md 写「停牌日 Ret 全 NaN」。若停牌日是有限的平盘值，则 day_at_max_ratio(Close) 在停牌日读 1，at_min 也读 1，(a)(b) 组会把停牌当成封板，而停牌的票不可交易（PI 笔记也担心成交可得性）。请在跑之前核对停牌日的 Close 是 NaN 还是平盘。
      如果它有 alpha，最可能来自：2 = 封板频率的慢水平；6 = 封板强度（最强四分之一天的均值）；8 与 10 = 封板与量集中的斜率或相关（同一对变量，接近重复，但表里没有它们之间的相关，暂不划）；9 = 长静止段与量集中的耦合；11 = 跌停一侧与金额集中的耦合；12 = 冻结 VWAP 比例与量集中的耦合；13 = 成交时间重心对日收益的斜率；14 = 成交重心与净买入压力的相关；15 = 量集中与分钟收益 AR(1) 的 t 值，最可能是 tick 网格上的买卖反弹（价位量化），不是封板；16 = H 的残差慢版，alpha 来自 kurt 中与 gini 无关的部分。
R:
  - head: 'ts_regbeta(day_gini(Volume), day_kurt(Vwap), 50)'
    soundness: 4
    reasons: |-
      16 个变体中，多数是窗口 40–150、两窗口求和、先 EMA 的参数改写；其余是 x 或 y 的替换（Amt 版 gini、Close 版 kurt、skew 替换 kurt）和诊断（ts_corr、ts_reg_tvalue）。没有数学问题：窗口与 EMA 结构正常，ts_regbeta 的 var 有 EPS 保护，cs 层最终有界。
      依据「烂部件是单一的 50 日窗口」来自样本内的窗口敏感性（loc.json 的 ablation：窗口 25 为 +0.04，50 为 train +0.97 / valid +0.92，100 为 train +0.54 / valid +1.52），这是合理的。依据「beta 小方差日很吵」偏弱，因为 cs_rank 已把 beta 幅度压到 (0,1]，变体的收益只能来自窗口选择本身。变体是参数扫描，不完全是「去掉或替换坏部件」，但作为检验有意义。
      如果变体有 alpha，最可能来自：60–90 日窗口的降噪（更平滑的 cov/var）；两窗口求和的稳健化；诊断型（corr、t 值、skew）若有 alpha，说明 alpha 与尺度无关、来自共动本身。
summary: 'slot a 通过（创新 3、合理 4，划掉 5、12、13、15，剩 12）；slot b 通过（创新 4、合理 3，划掉 1、3、4、5、7，剩 11）；R 合理度 4。两处需 PI 在跑之前核对：停牌日 Close 是 NaN 还是平盘（影响 b 位的封板度量）；ListAge 与 H 的截面重合，以及 kurt(Vwap) 在常数日的取值（影响核心 H 本身）。审计只用样本内数据与仓库文件，未计算 2023-08-08 之后的任何读数。'
