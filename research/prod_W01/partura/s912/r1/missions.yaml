      - 'cs_first_high40(LimitWidth, ts_var(sqrt(day_durbin_watson(Vwap)), 10))'
      - 'cs_first_high40(neg(BoardCode), ts_var(sqrt(day_durbin_watson(Vwap)), 10))'
