R:
  - head: 'cs_first_high40(ts_var(day_durbin_watson(Vwap), 1), ts_var(sqrt(day_durbin_watson(Vwap)), 10))'
    why: >-
      烂部件 = 第一个参数 ts_var(day_durbin_watson(Vwap), 1):窗口为 1 的方差恒等于 0(DW 缺失的格子也是 0),整张面板是常数,loc 拆解里它自己作为子树也被标成 门槛废品。
      它在 head 里唯一的作用是让 cs_first_high40 的并列全部按股票列序打破(列序对应交易所与板块)。依据:把它换成 DW 本身,train 从 +0.58 掉到 -1.75(必要性 +2.33),
      说明 head 的收益来自 列序对应的板块排序,而不是这个量的数值。变体把隐含的列序键换成显式的 BoardCode / LimitWidth / ListAge(这些键内部的并列仍按列序打破),
      并成对地改 门槛窗口(5 / 20)、门槛宽度(40% 改 20%)、去 sqrt、Vwap 换 Close,以及把板块顺序反过来作为对照,看 head 的收益究竟来自 板块偏好 还是 vol-of-vol 门槛。
    variants:
