  - type: N
    hypothesis: >-
      新想法:把一天的价格形成拆成 隔夜(集合竞价 + 夜间消息,Open 相对前收)与 盘中(连续竞价,Close 相对 Open)两段,看这两段收益的 方向分歧 和 衔接方式。
      机制:A 股 T+1,连续竞价时段由散户 / 噪声交易主导,集合竞价与隔夜缺口更多反映机构与消息;Lou, Polk, Skouras (2019, JFE) 记录到隔夜与盘中的收益各自有持续性、
      且方向相反(拔河),French and Roll (1986) 也指出盘中单位时间方差远高于非交易时段(噪声交易)。我们只用 Open / Close 两个现成字段,不用分钟路径。
      算子实现:隔夜 Ov = log(day_first(Open)) - log(ts_delay(day_last(Close), 1)),盘中 Id = log(day_last(Close)) - log(day_first(Open))(用后复权价格,Ov 与 Id 相加是日对数收益);
      (a) 水平:ts_mean(Ov, 20)、隔夜减盘中的 20 / 40 日均值差,以及先 cs_rank 再 ts_mean 的稳健版本(新股涨停连板会让原始对数收益在截面上出现极端值,先取 rank 就限制了影响);
      (b) 衔接:ts_corr(Ov, Id, 40) 与 ts_regbeta(Ov, Id, 40)(隔夜缺口是否在盘中被回补:负 = 缺口被噪声交易者过度推高后回落,正 = 缺口被延续),
      以及 sign(Ov) x (盘中截面 rank - 0.5) 的 20 日均值(今天的缺口方向 与 盘中相对表现 是否同向,无除法、无窗口退化),另有 昨日盘中 与 今日缺口 的同类版本;
      (c) 形状:ts_skew(Ov, 40),以及 方差落在 隔夜 还是 盘中 的 rank 差 sub(cs_rank(ts_std(Ov, 20)), cs_rank(ts_std(Id, 20)))(盘中方差占比高 = 噪声交易活跃);
      (d) 两个带 ListAge 的变体,把最新上市的名字按两个方向推出排序,避开新股首日 / 连板造成的伪极端。
      与库里的 head 和 5 个控制不同:head 是 日内分钟 Vwap 路径的 vol-of-vol 门槛 x 列序,控制是流动性 / 波动 / 20 日反转 / 成交额波动 / 市值;
      这里的信号是 日内两段收益的 差与衔接,与 20 日总收益(反转控制)只在 Ov + Id 的和上重叠,差与衔接不在其中;不含任何分钟级算子。
      样本外还应在的理由:T+1 与散户主导连续竞价是制度结构,机构 / 散户在两个时段的参与比重不依赖某段行情;ts_corr / ts_regbeta 变体在上市或复牌后的前 40 日窗口不满,
      那一小部分股日由少数点决定,ListAge 变体和 EMA 平滑会削弱它,其余变体没有这个问题。
      如果有 alpha,最可能来自 隔夜(机构 / 消息)收益的持续性与盘中(噪声)收益的反转,表现为 Ov - Id 的差或缺口回补 / 延续倾向。
    inspired_by: >-
      第 1 批唯一的 head(cs_first_high40(ts_var(day_durbin_watson(Vwap), 1), ts_var(sqrt(day_durbin_watson(Vwap)), 10)))里,信息只来自 日内成交价路径粗糙度(DW)的跨日不稳定性
      这一个 噪声 / 不确定性 的度量;112 个已评分候选里凡含 sqrt(day_durbin_watson(Vwap)) 的均值差 +1.44,而含 day_var(Open)、day_sum(Open) 这类价格水平量的候选均值差为负(-0.29、-0.40)。
      也就是 这一批显示 盘中 噪声交易 的状态比价格水平更有信息。隔夜 / 盘中拆分是用现成 Open / Close 字段把 盘中噪声 与 隔夜信息 分开、且和该 head 不共享任何分钟路径算子的最便宜的另一个切口。
