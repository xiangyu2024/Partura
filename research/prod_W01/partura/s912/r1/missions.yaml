  - type: E
    core: 'ts_var(sqrt(day_durbin_watson(Vwap)), 10)'
    hypothesis: >-
      核心 C = ts_var(sqrt(day_durbin_watson(Vwap)), 10) 是 vol-of-vol。机制与算子:day_durbin_watson 在价格水平上(不去均值)定义为 sum(minute diff^2) / sum(x^2),
      对 Vwap 就是 分钟 Vwap 变动的均方 / 价格^2,即当日日内已实现方差的无量纲版本;sqrt 之后是日内已实现波动率 rv_t;
      ts_var(rv, 10) 是 rv 在最近 10 个交易日里的方差,度量 波动率本身有多不稳定 (对风险大小的不确定性)。
      文献口径:Baltussen, van Bekkum, van der Grient (2018, JFQA) 记录到 vol-of-vol 高的股票未来收益更低;A 股散户偏好彩票型、事件驱动型股票,会把这个方向放大。
      它是股票的持续性特征(事件驱动 / 机制切换型 vs 平稳型),不依赖某一段行情,所以样本外还应在。
      和库里 head 的区别:这批唯一的 head 是 cs_first_high40(ts_var(DW,1), C),它只把 C 当成 40% 分位的门槛;门槛的排序键 ts_var(day_durbin_watson(Vwap), 1) 窗口为 1,方差恒为 0,
      整张面板是常数,所有并列都按股票列序(交易所 / 板块)打破。loc 拆解里把这个常数键换成 DW 本身,train 从 +0.58 掉到 -1.75,说明 head 的内容是 门槛 x 板块列序,
      并不是 vol-of-vol 的连续排序。本轮 E 把 C 当连续信号来试,外围全部不是 分位门槛 + 常数键:
      (1) 去掉水平效应,问 同样波动水平下谁更不稳定:cs_bucket_rank(C, 10 日平均 rv)、sub(cs_rank(C), cs_rank(10 日平均 rv)),
      以及在市值 / 成交额 / 20 日对数涨幅的 decile 内排序(三个 cs_bucket_rank);
      (2) 看自身历史:C 相对 10 日前的 rank 变化、C 相对 40 日窗口方差的 rank 差、ts_rank(C, 60),即 不确定性在上升还是回落;
      (3) 用 Low 路径的同构量做 rank 差,看 成交价路径 与 低点路径 的 vol-of-vol 分歧;
      (4) 把 head 里靠列序隐含的板块显式化:add(cs_rank(C), BoardCode) 做 板块优先、板块内按 C 排序;cs_last_low10 / cs_first_low20 配 ListAge 按两个方向排除最新上市的名字。
      这些都是连续 rank 构造,和 head 的日度秩相关度预期明显低于 0.7;分母里没有任何除法,避免近零量的爆点。
      如果有 alpha,最可能来自:同一波动水平下稳定的名字被低估、不稳定的名字被高估(风险不确定性溢价),以及 BoardCode / ListAge 带来的板块与新股结构。
