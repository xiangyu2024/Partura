  hypothesis: 核心 K = day_centroid(Volume):一天成交量沿 241 根分钟轴的重心(0 = 全在 09:30 开盘集合竞价那一根,1
    = 全在收盘那一根),即成交量按时间的加权位置。它是有界、量纲无关的形状量,不吃流动性 / 市值 / 波动这类水平控制(预计与五个控制的日度秩 |ρ| 都
    < 0.4)。样本内依据(只用 train / valid):定位共性表里含 K 的 7 个已评分候选均值差 +1.73(含者 +0.44,不含 -1.29,p
    < 0.001),且它们都不在 head 里,所以 K 单独就在 0.4 到 0.5 附近、train 与 valid 同号(含 K 的候选没有一个出现在
    head 里);含 day_first(Volume)、day_quantile(Amt)、day_argmax(Volume) 的候选在富集表里也靠前。也就是说,日内成交量的时间形态这一族
    M 一直在碰,但只把它当并列键 / 门槛用(共性表里见到的只有 cs_demean(K) 这一层包装),从没有被认真平滑、筛选、复合。上一轮 N 位里同族的开盘竞价份额
    AUC = day_first(Volume) / day_sum(Volume) 的 60 日均值已是近线信号(train +0.35 / valid +1.35,符号
    +,hl 5);K 在机械上是 '早盘份额的反面加尾盘份额',所以本轮 E 位要回答它的内容是什么:(i) 个股的稳定交易者结构,(ii) 深沪两市收盘撮合机制不同带来的交易所成分,还是
    (iii) 事件噪声。机制:成交量的日内分布由谁在交易决定(Admati and Pfleiderer 1988, RFS 的日内成交与价格变化理论;Heston,
    Korajczyk and Sadka 2010, JF 的日内截面规律):以收盘价 / VWAP 为基准的机构与被动资金集中在尾盘,散户与消息交易集中在开盘和上午。重心靠后
    = 参与者偏机构,靠前 = 偏散户和消息驱动;A 股 T+1 与涨跌停下,散户集中的名字被过度关注、长期溢价较低(与 Lou, Polk and Skouras
    2019, JFE 的隔夜 / 盘中参与者分工同一逻辑)。这是个股慢变的结构特征,所以种子用 40 / 120 日均值、短期对长期的偏离、以及 K 的 40
    日标准差(= 交易者结构的不稳定;角色类比库里 C 一族的 vol-of-vol,取 ListAge 排除新股,符号 -1)。算子怎样实现:全部种子原样含
    K。外围与已见过的写法的不同:共性表里 M 只见到 cs_demean(K) 单层、无平滑无筛子;这里 (a) ts_mean 慢窗口、短对长偏离、ts_std;(b)
    与库里 C 一族同类的排除筛子,ListAge 与价格水平 log(day_last(Close)),符号未知所以 cs_last_*(符号 +)和 cs_first_*(符号
    -)两个方向都写,另有 C20 + ListAge 的复合(把高 vol-of-vol 的 40% 推出多头腿);(c) 交易所检验:最后一根 bar 的含义随交易所与制度而变(深沪两市的收盘撮合机制不同),K
    里混有交易所成分,cs_bucket_rank(·, BoardCode) 把排序放进 BoardCode 十分位桶内(桶 = 某板块里按列序的一段,即同板块内部比较,不是严格的交易所中性,但足以检验成分),若
    bucket 版本明显弱于原版,说明主要是交易所成分;(d) 与别的统计复合:K 与 AUC 的秩差(两者符号相反、若信息重合则秩差只是翻倍,若独立则相加)、K
    与日收益的 60 日相关(尾盘集中成交的日子是不是上涨日 = 尾盘净买入)、金额重心减股数重心(= 价格在放量时段是否更高,即日内价格重心漂移,不用收益率)。与库里
    head 的区别:6 个 head 读的是 Vwap 路径粗糙度的 vol-of-vol(C 一族,5 个)与隔夜缺口偏度(1 个),没有任何一个读 Volume
    的日内分布;预期与 head 的日度秩 |ρ| 只来自筛子重叠(0.2 到 0.5)。样本外还会在的理由:参与者结构(机构基准交易 vs 散户与消息)和撮合制度是慢变的制度性特征,不依赖某段行情的波动或风格;形状量对水平类控制近似正交。已知风险:K
    内含交易所成分,撮合制度若发生变化会改变其含义;上市 / 复牌后窗口不满,所以大部分种子带 ListAge 筛子;day_centroid 在停牌日是缺失而不是
    0,ts_mean 吞掉缺失;ts_corr 在窗口只有 1 到 2 个点时退化为 0 / ±1,占比小。
