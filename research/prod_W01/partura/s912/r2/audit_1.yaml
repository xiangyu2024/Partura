  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [8, 11]
    reasons: '相关度表:核心 Ov = log(day_first(Open)) - log(ts_delay(day_last(Close),1)) 对 6 个 head 的原始 |ρ| 最大 0.088(cs_bucket_rank(C10, 动量十分位) 一族),残差 0.103;对 5 个控制 liq 0.033、vol 0.084、rev 0.019、known 0.042、size 0.041,E 位的核心条件满足。快照里只有 H6 = ts_skew(Ov,40) 读 Ov。没有用 ts_spearman 或 nt_*。逐个种子:#8 sub(cs_rank(ts_max(Ov,60)), cs_rank(neg(ts_min(Ov,60)))) 是 60 日隔夜缺口上下极值的秩差,即尾部不对称,与 H6 原始 |ρ| 0.671(未到 0.7 线)但残差 0.816,度量的是同一个尾部不对称;按「残差 ≥0.8 即几乎同一信号」的口径(与控制的 0.8 线同一尺度)划掉,理由是重复。#11 cs_last_high20(ts_skew(Ov,40), C10) 就是 H6 加一个 C10 排除筛子,与 H6 原始 0.624、残差 0.803,同样按重复划掉。其余放行:#1、#2 为 cs_rank(Ov) 的 60/120 日峰度,最像 head 为 H3(原始 0.287 / 0.316),残差 0.24 / 0.28;#3 为 250 日偏度加 ListAge 筛子,与 H6 原始 0.308、残差 0.352,250 日窗口在 2018 年前一年为部分窗口(热身),占比不主导;#5、#6 为 rank 空间的偏度,与全部 head 原始 |ρ| 约 0.09 与 0.10;#4 为 ts_corr(Ov, cs_mean(Ov), 60),隔夜缺口与市场隔夜缺口的同步度,与各 head 原始 |ρ| 不超过 0.28,与 size 0.25;#7 为正缺口份额,数学上等于 (1 + Σ Ov / Σ|Ov|)/2,与 H6 原始 0.361、残差 0.415,与 size 0.23,值域有界、无爆点;#9 为隔夜缺口自相关,#10 为隔夜与滞后一日盘中的相关,与 head 原始 |ρ| 均在 0.13 以下;#12 为 H6 加 C10 的 40% 排除筛子,原始 0.654 最像 H5、残差 0.628,保留;#13 为 H6 加 C20 低端前置,原始 0.645 最像 H6、残差 0.718,低于 0.8,保留(PI 应知道它是 H6 加 C 筛子);#14 为隔夜偏度减 1.5 倍盘中偏度的秩差,与 H6 原始 0.548、残差 0.546,盘中分量是新信息。创新度 4:#1、#2、#4、#7、#9、#10、#14 的峰度、同步、自相关、盘中信息是 head 没有的;保留的 H6 偏度换窗口、换空间、加筛子的几个不给 5。合理度 4:逐个算子核对。Ov 只用当日开盘与前一日收盘,无前视;含当日收盘的 Id 只在 #14 出现,而 daily.py 的 forward_returns 是 close(t) 到 close(t+1),与库内 heads 用全天 Vwap 的约定相同。cs_rank 是 NaN 安全的 rank(无效格为 NaN),不像 nanrank_last 那样补 0,#1、#2、#5、#6 不受 §4 已知算子行为影响。ts_skew、ts_kurt 在 std 或方差不超过 EPS 时返回 NaN,无 0 填充。ts_corr 在常数窗口返回 0(cov/(0+EPS)),IPO 两点窗口为 ±1,属退化窗口、占比小,不构成挡的理由。cs_rank(Ov) 的列序并列按 §4 不是问题。如果它有 alpha,最可能来自:集合竞价加夜间消息造成的隔夜跳跃带尾部不对称,T+1 与涨跌停让这种跳跃分几天被吸收,于是偏度、同步度与缺口自相关给出信号(#4、#9、#10 最直接),而不是 Ov 的水平。'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [10]
    reasons: '相关度表:16 个种子对 6 个 head 的原始 |ρ| 最大 0.455(#3,与 H2 的 ListAge 一族),残差都在 0.30 以下(最大 #9 为 0.296);对控制 liq、vol、rev、known、size 的 |ρ| 除 #10 外都在 0.52 以下,最高是 #8 的 known 0.511 与 #14 的 rev 0.469。逐个种子:#10 ts_mean(day_gini(Amt),20) 与 liq 控制 |ρ| 0.833,达到 0.8 的自动划掉线;它同时与 known 0.747、size 0.522 相关,是成交额集中度这个水平量的代理,按规则划掉(确定性规则)。其余放行:#1–#7 为开盘竞价份额 AUC = day_first(Volume) / (day_sum(Volume)+1) 的均值、差、波动与 ListAge 筛子,原始 |ρ| 0.09–0.46、残差 0.02–0.26,库内 head 从不读 Volume。day_first 取第一个非缺失分钟,minute_grid.py 的注释写明 bar 0 是 09:30 集合竞价 bar,所以分子确实是竞价量;PI 写的「09:15 到 09:25 撮合」与代码的 09:30 bar 表述不一致,不影响机制。#8、#9 为日内成交额重心 day_centroid(Amt) 的均值与波动,有界;#8 与 known 0.511 偏高,但重心是时间位置、known 是金额离散度,不是同一个量。#11–#13 为个股与等权市场日收益的 60 日相关及 ListAge 筛子,与各控制都在 0.36 以下。#14 为收盘相对全天 VWAP 的 log 差的 20 日均值,与 rev 0.469,未到 0.5。#15 为 AUC 与同步度的秩差,#16 为 AUC 与隔夜缺口绝对值的相关。创新度 4:Volume 与 Amt 的日内分布在 6 个 head 中从未出现,与控制的最高 |ρ| 0.51 且不是同一个量。合理度 4:逐个算子核对。AUC 分子不超过分母,值域在 [0,1],+1 对股数量级可忽略,无爆点;day_centroid、day_gini 有界;ts_corr 常数窗返回 0 而不是缺失,上市头两日为 ±1,属退化窗口;没有前视(日内汇总在收盘后可得,与 forward_returns 的 close(t) 到 close(t+1) 约定一致)。两处不构成挡的理由但 PI 需知:(a) day_first 若某股某日 bar 0 缺失会静默换成 09:31 的量,这是数据定义问题,建议核对 bar 0 的覆盖率;(b) 上市或复牌后前 20 日的 AUC 与相关窗口不满。如果它有 alpha,最可能来自:竞价参与高、与市场同步低的名字信息交易占比高而被低估;反向则是高同步、尾盘集中的名字是被动调仓流,长期有溢价。符号由 pipeline 按 train 选。'
R:
  - head: 'cs_first_low20(cs_first_low20(ts_var(sqrt(day_durbin_watson(Vwap)), 10), log(day_last(Close))), ListAge)'
    soundness: 4
    reasons: '合理度 4。诊断正确:nanstd_last 在窗口只有 0 或 1 个有效值时返回 0 而不是缺失(common.py 里 count 取 clamp(min=1),平方和为 0),所以 C10 在短窗口里被压到最低端,这正是 PI 说的「窗口太短」;窗口从 10 改到 20、30、40 增加有效点数,减少这种小样本偏差,变体 1、2、3 是单变量替换,可算。变体 4 的第三层 LogFloatCap 筛子与 size 控制原始 |ρ| 0.58,等于用一个控制变量做筛子,奖励的残差会去掉其非线性暴露,机制说得通,增量要看残差。变体 5 的 Low 路径 DW 可算。变体与原 head 的原始 |ρ| 在 0.82 到 0.92 之间,它们只能是替换候选,不能收录为新 head。'
  - head: 'cs_first_low20(ts_var(sqrt(ts_var(sqrt(day_durbin_watson(Vwap)), 10)), 10), ListAge)'
    soundness: 4
    reasons: '合理度 4。窗口与筛子的变体都可算,无前视、无除法。诊断属实但不完整:H2 是 ts_var 套 ts_var 的两层结构,内层 nanstd_last 对全缺失窗口同样返回 0,所以 10 日连续一字板的非新股格子,内层为 0 并作为有效值进入外层。PI 没有写到这一点,但它只出现在长连续缺失窗口里,占比小;变体 2 把窗口拉到 20 会让这类格子更少。变体 1 与 H1 的原始 |ρ| 0.80,变体 2 与 H2 的原始 |ρ| 0.61,按替换规则可以替换,不能收录。'
  - head: 'cs_first_high40(BoardCode, ts_var(sqrt(day_durbin_watson(Vwap)), 20))'
    soundness: 3
    reasons: '合理度 3。数学上无问题,但 PI 的两个说法与实现不符。(a) cs_first_high40 的长腿由 ops_ext.py 的 _lexi 决定,它按整个并列块(_rank_block)进入 (0.6, 1] 带,只有整块落在带内的板块代码才进入长腿,所以 H3 的驱动是板块代码块本身,而不是「列序靠前的主板股」,这个诊断要改。(b) 变体用的 cs_bucket_rank(C20, BoardCode) 对 BoardCode 按序数十分位切桶,_pct_rank 用列序打破并列;BoardCode 只有 4 个取值,十分位切在板块内部,每个桶是「某板块中的一段列序」,所以「板块中性」并不成立,而且这与 H3 自己的整块规则不一致。(c) 实测:变体与 H4 原始 |ρ| 0.817、与 H2 0.810、与原 head H3 只有 0.644(残差与 H2 0.796、与 H4 0.784)。它实际是 H2、H4 的 ListAge 一族换了分桶,PI 预计的「与原 head 相关较低、可收录为新 head」不成立,库禁令的 0.7 线也不允许收录。机制本身(低 vol-of-vol 且非新股)说得清,所以不挡。'
  - head: 'cs_bucket_rank(ts_var(sqrt(day_durbin_watson(Vwap)), 10), ts_delta(log(day_quantile(Close)), 40))'
    soundness: 4
    reasons: '合理度 4。无数学问题:分桶键是连续的 40 日价格动量,没有并列问题,桶内秩均匀,长腿不会被动量推动。PI 对 nanstd_last 的诊断正确:count 为 1 时 C 返回 0,上市头几日的格子被压到最低,套 ListAge 是对的。变体 1 的 cs_first_low20(·, ListAge) 把它几乎变成 H4(原始 |ρ| 0.93、残差 0.91),只能当替换候选;变体 2 与 H1 的原始 |ρ| 0.88,也是 H1 的那一套双筛子。'
  - head: 'ts_skew(sub(log(day_first(Open)), log(ts_delay(day_last(Close), 1))), 40)'
    soundness: 4
    reasons: '合理度 4。变体都可算,无前视。PI 的诊断属实:nanskew_last 没有最小样本数(1 个点时 std 为 0 返回 NaN,2 个点时偏度为 0,3 个点起才有值),上市或复牌后前 40 日的偏度由少数缺口决定,所以 valid 弱于 train 的现象有可能来自热身。cs_last_low10(·, ListAge)、价格筛子与稳定波动筛子都是对这一点的合理处理。变体 5 ts_skew(cs_rank(Ov), 40) 是真正的换空间(与 H6 原始 |ρ| 0.10),去掉全市场共同跳空的说法成立。需 PI 更正而不影响打分的两点:变体 4(窗口 60)与 H6 原始 0.747、残差 0.904,是同一信号的换窗口,只能当替换候选;变体 6 与 H6 的相关未进前三(低于 0.6),但与 H3 原始 0.712,超过库禁令 0.7 线,不能收录。'
summary: 'slot a 划掉 #8、#11(与 H6 的残差 0.82、0.80,按重复划掉)后剩 12 个,创新 4、合理 4,通过;slot b 划掉 #10(与 liq 控制 0.833,自动划掉)后剩 15 个,创新 4、合理 4,通过;R 五组合理度依次 4、4、3、4、4,R3 的两处说法与实现不符。'
