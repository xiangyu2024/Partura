  hypothesis: 核心 Ov = log(day_first(Open)) - log(ts_delay(day_last(Close), 1)),即隔夜缺口:day_first(Open) 是 09:30 第 0 根集合竞价 bar 的开盘价,ts_delay(day_last(Close), 1) 在前一日停牌时为缺失,所以复牌缺口自动不进入。库里唯一读它的 head 是 ts_skew(Ov, 40)(sign +1,hl 20,train +1.12 / valid +0.56)。第 1 轮 N 位里 Ov 的均值、与盘中 Id 的差、ts_corr / ts_regbeta 衔接、方差占比等水平类或衔接类种子全部没过线(该任务偏度以外的候选最好只有 +0.15),只有偏度过线,所以信息在 '隔夜缺口分布的不对称(偶发的大幅正向跳空,对常态的小幅负向)' 这个形状上,而不在水平上。机制:隔夜缺口是集合竞价与夜间消息(机构、公告、海外)的定价,正向大缺口 = 消息驱动的跳跃;A 股 T+1 加涨跌停让消息要几天才吸收完(漂移),所以跳跃的不对称会延续(Lou, Polk, Skouras 2019, JFE 隔夜与盘中的拔河;偏度与截面收益见 Boyer, Mitton, Vorkink 2010, RFS 与 Amaya, Christoffersen, Jacobs, Vasquez 2015, JFE)。形状量纲无关,所以对流动性、波动、市值这类水平控制近似正交。本轮要回答两件事:(1) 内容是 '缺口不对称' 这个一般性质,还是只有 40 日原始偏度这一个写法;(2) 这个 head 的 valid(0.56)弱于 train(1.12),与库里 C 一族相反(C 一族 valid 1.0 到 2.7、train 0.6 到 1.1),能不能用 C 一族的稳定波动筛子补上 valid。种子分四组,每个都原样含核心 Ov:(a) 换矩、换窗口、换空间:秩空间的偏度与峰度 ts_skew(cs_rank(Ov), 60/120)、ts_kurt(cs_rank(Ov), 60/120)(秩空间去掉了全市场共同的隔夜跳空,只留个股相对形状;不用原始 ts_kurt,因为它的 EPS=1e-9 加在 var^2 上,缺口标准差 0.5% 时分母被抬高约 2.6 倍,低波动股的峰度被系统性压低,排序成了波动的函数;秩序列方差约 0.08,不受影响),慢窗口 ts_skew(Ov, 250)(换手低,15 bp 成本下更友好;外面套 cs_last_low10(·, ListAge),因为 nanskew_last 没有最小样本数,上市不足一年的名字窗口不满);(b) 不对称的另外两种度量:正向缺口占全部缺口幅度的份额 sum(Ov * 1[Ov>0]) / (sum|Ov| + 1e-4)(外面套 cs_last_low10(·, ListAge),因为新股连续一字涨停时 Ov 全正,份额贴 1),以及上下极值幅度的秩差 rank(ts_max(Ov, 60)) - rank(-ts_min(Ov, 60))(用秩差而不用比值,避免连板时分母趋零);(c) 缺口的时序结构与同步度:ts_corr(Ov, cs_mean(Ov), 60)(个股隔夜缺口跟全市场隔夜缺口的同步度,低 = 隔夜消息是公司特有的)、ts_corr(Ov, ts_delay(Ov, 1), 60)(缺口自相关 = 隔夜信息是否连续消化)和 ts_corr(Ov, ts_delay(Id, 1), 60)(今天的缺口是否在回补昨天的盘中走势,盘中以噪声交易为主时应偏负);(d) 与稳定波动筛子复合:cs_last_high20 / cs_last_high40(skew, C) 把 C = ts_var(sqrt(day_durbin_watson(Vwap)), 10) 最高的 20% / 40% 推到底端、其余按偏度排;cs_first_low20(skew, C20) 把 C20 最低的 20% 放到顶端;以及 session 差 rank(skew(Ov)) - 1.5 * rank(skew(Id)),Id = log(day_last(Close)) - log(day_first(Open))(隔夜偏度为正向有信息,盘中偏度是散户的彩票偏好,Barberis and Huang 2008, AER 的累积前景理论下应为反向,权重取 1.5 是为了让它和 ts_skew(Ov, 40) 本身的相关度落在 0.7 以内)。与库里 head 的区别:库里 6 个 head 有 5 个是 DW(Vwap) 日内路径粗糙度的 vol-of-vol(C)加 ListAge / 价格水平 / BoardCode / 动量十分位的筛子,唯一的另类就是 40 日偏度本身;这里每个种子的排序键或是另一个矩、另一个窗口、另一个统计量(份额、极值、自相关),或是被 C 重排 20% 到 40% 名字的偏度,预期与 6 个 head 的日度秩相关都在 0.7 以内(合成 cube 上的结构相关:秩偏度 60 日 0.46、250 日 0.44、极值秩差 0.58、复合 0.52 到 0.69,只说明结构,不含真实数据的内容)。样本外还会在的理由:隔夜(集合竞价、机构与消息)和盘中(连续竞价、散户)的参与者结构是 T+1 与涨跌停下的制度性特征,不依赖某一段行情的风格;形状指标不吃板块、波动的轮动(C 一族 valid 远高于 train 里可能含的 2022 到 2023 年主板 / 低波动风格,偏度 head 恰好相反,二者并存是自然对冲)。已知风险:窗口不满的新股、复牌后的前几十日由少数几个缺口决定,份额与 250 日种子已加 ListAge 筛子,其余让 GP 自己学。
