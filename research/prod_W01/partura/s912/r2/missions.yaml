- type: N
  hypothesis: 新 idea:用 '日内时钟上的成交足迹' 与 '个股对市场的同步度' 度量知情交易 vs 噪声交易的强度。机制:集合竞价(第 0 根 bar,09:15 到 09:25 撮合)是隔夜消息与机构挂单集中的时刻,连续竞价时段以散户为主,日内成交量形态由知情者与流动性交易者的时间选择决定(Admati and Pfleiderer 1988, RFS;Easley, Kiefer, O'Hara, Paperman 1996, JF 的 PIN 思路);个股收益对市场的同步度低,说明公司特有信息被定价得多(Morck, Yeung, Yu 2000, JFE;Jin and Myers 2006, JFE;中国样本见 Gul, Kim, Qiu 2010, JFE)。把一天的成交量分布压成几个量纲无关(份额、重心、基尼系数、相关系数)的数,5 个控制(流动性、波动、20 日反转、成交额日内波动、市值)都是水平量,吃不掉它们。算子实现:(a) 开盘竞价份额 AUC = day_first(Volume) / (day_sum(Volume) + 1) 的 20 / 60 日均值,以及短期相对长期的变化 ts_mean(AUC, 20) - ts_mean(AUC, 120)、ts_mean(AUC, 5) - ts_mean(AUC, 60)(竞价参与异常上升 = 新信息到达),及其 20 日波动 ts_std(AUC, 20)(+1 保证分母不为零,Volume 以股为单位,可忽略);(b) 成交额的时间重心 day_centroid(Amt) 与集中度 day_gini(Amt) 的 20 日均值,以及重心的 20 日波动(重心后移或集中在少数分钟 = 噪声或调仓流);(c) 同步度 ts_corr(日对数收益, cs_mean(日对数收益), 60),日对数收益 = ts_delta(log(day_last(Close)), 1),cs_mean 是当日截面均值 = 等权市场收益,没有除法;(d) 收盘强度 log(day_last(Close)) - log(day_wmean(Vwap, Volume)) 的 20 日均值(收盘价相对全天成交加权价的位置,度量尾盘的净买入);(e) 复合与交互:rank(AUC 均值) - rank(同步度)(竞价参与高且同步度低 = 信息驱动),ts_corr(AUC, |Ov|, 60)(大缺口日是否伴随高竞价参与)。AUC 均值与同步度各给了两个方向的 ListAge 筛子(cs_last_low10 与 cs_first_low20),因为我不知道符号:上市头几个交易日的竞价份额可能异常,同步度窗口不满(ts_corr 在 1 个点时返回 0,2 个点时恰为 ±1),流水线按 train 夏普在 ±1 里选符号,保留与之配套的那个方向。不用最后一根 bar 的份额:深沪两市的收盘撮合机制不同(深市有收盘集合竞价,沪市在样本期内是连续竞价),最后一根 bar 的含义随交易所与制度而变,不是同一个量。与库里不同:6 个 head 读的是 Vwap 分钟路径的粗糙度(DW)的 vol-of-vol、隔夜缺口的偏度、价格水平与上市年龄筛子;这里读的是 Volume / Amt 在一天分钟轴上的分布(day_first、day_centroid、day_gini)与个股对市场日收益的相关,这些输入没有出现在任何 head 里。样本外还会在的理由:集合竞价与连续竞价的参与者分工、T+1 与涨跌停下的信息消化节奏是制度结构,份额与重心是比例量,不依赖某段行情的波动或风格。如果有 alpha,最可能来自:竞价份额高、同步度低的名字(信息交易者占比高)被低估;或相反方向——高同步度、尾盘成交集中的名字是被动调仓流,长期有溢价。
  inspired_by: (1) 第 1 轮 N 位的唯一 head ts_skew(Ov, 40):隔夜(开盘集合竞价相对前收)的形状有内容,盘中的均值、差与衔接都没有;(2) M 的 404 个已评分候选里含 day_quantile(Amt)(成交额在日内分钟上的分位)的 6 个候选均值差 +0.98(含 -0.20,不含 -1.18,p 0.013),含 day_argmax(Volume)(成交量峰值位置)的也高于不含者,说明成交量在日内的形态有信息,但 M 只把它们当并列键或门槛用,从没把竞价份额、重心这种比例量当主排序键。
