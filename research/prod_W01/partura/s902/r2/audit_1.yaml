slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [5, 10, 11, 12]
    reasons: |-
      创新度 4。快照 0 个 head,库内没有可比对象。核心 div(day_first(Amt), day_sum(Amt)) 对 5 个控制的日度秩 |ρ| 为 liq 0.25、vol 0.18、rev 0.14、known 0.28、size 0.09(corr_1.json 同值),未触 0.8 线,也不是任何控制换了写法:它是有界份额(分子分母同为 Amt,不含流动性水平,也不含分钟 Amt 的离散度)。核心在 loc.md 里可以找到(grep 计 9 处),满足「定位输出共性表子树」的来源要求。给 4 不给 5,因为它在 M 与第 1 轮的候选里已经出现过,E 位的新意主要在外围。

      划掉 10、11:cs_first_low40(y, x) 与 cs_first_high40 是 _lexi 的阶跃(ops_ext.py:357-375),输出 = rank(y) + 1{x 在最低 40%}。若 C 与市值独立,这个阶跃与均匀排名的秩相关理论值约为 -0.72,与表中 size 0.72 一致(a11 是对称的 +0.72)。也就是说截面结构几乎全部来自市值阶跃,C 只在段内排序。取残差只去掉市值的 rank、rank²、rank³(规则 §1),阶跃项留在残差里,实际是把市值分段换了写法。它没有触 0.8 自动线,这一划是按 §3「明显在度量同一个东西」的判断。

      划掉 5:与 4 重复。同一基 cross_mean(C, 30),同为 cs_bucket_rank,只换分组变量(LogFloatCap 换成 ListAge)。五个控制 |ρ| 的差都在 0.034 以内(liq 0.307/0.292、vol 0.358/0.367、rev 0.080/0.079、known 0.389/0.373、size 0.002/0.036),与第 1 轮被判重复的 a10/a2 量级相同。这是推断,没有直接算二者的日度秩 ρ。

      划掉 12:与 6 重复。同一基 C 的 40 日中心水平:cross_med(C, 40) 与 cross_mean(cs_rank(C), 40),只换了聚合方式与截面预变换。五个控制 |ρ| 的差在 0.034 以内(liq 0.577/0.607、vol 0.329/0.332、rev 0.022/0.022、known 0.611/0.645、size 0.178/0.202)。同样是推断。

      保留的近邻:a2 与 a3 的控制谱系最大差 0.06,是两种不同构造(时间 z 分数 vs 两个均值之差),保留。

      合理度 4。逐个核对算子(AlphaCube 源码 + partura/ops_ext.py):day_first / day_last 取当日第一 / 最后有效值(dt_day.py:129-134),day_sum 为当日和;C 因 Amt 非负有界于 [0,1],分母为零时输出 NaN 而非 inf,没有爆点。cross_ema 因果、跳过缺失日(ops_ext.py:172);cross_zscore 对常数窗口有保护、|z| 有界(ops_ext.py:208-236);cross_tail_mean_q75、cross_med、cross_stddev 都是滚动窗口统计,只用过去与当天(ops_ext.py:300-322,dt_cross.py)。cs_rank 走 common.rank,缺失返回 NaN(common.py:320-341),不走 nanrank_last,所以没有 §4 的「缺失当 0」问题。cs_bucket_rank、cs_bucket_demean 都有缺失保护。无前视:所有信号只用到当日收盘前可得的数据(gap 用当日开盘价与前收)。覆盖率 >= 0.998。

      需要标注、不挡的点:
      (i) 9 号:is_gt0 即 (x > 0).int()(common.py:248),缺失与非高开日都记为 0,乘 C 后 cross_mean 对所有天取平均。实际量是 (1/40)Σ C·1{高开} − (1/40)Σ C·1{低开},是概率加权,不是 PI 假设里的「高开日条件均值之差」,结果会被高开 / 低开的频率差放大。覆盖率正常,不是缺失值支配,所以不算「定义坏掉」,但它没有实现所写的机制,PI 应知悉。
      (ii) 15 号:cs_last_high10 把当日高开最极端的 10% 排到底部(ops_ext.py:391),给「高开频率」加了一个负权重,不纯粹是「排除机械成分」。
      (iii) 核心假设「第 0 根 = 09:30 集合竞价」,我在能检索到的仓库代码与文档里(检索「集合竞价」「09:30」「auction」)没有查到这一约定。若第 0 根其实是第一分钟连续竞价,信号仍有定义,但机制故事要改。
      (iv) day_first 在第 0 根缺失时退化为第一个有效分钟,小盘股会混入不同含义。PI 已写明,不挡。
      (v) 外围与「已见过的含该核心候选」是否重复,本轮文件里只有共性表摘要,无法完整枚举,留给流水线去重。

      如果它有 alpha,最可能来自:开盘那一刻的成交份额刻画的持有人结构(提前下单的机构 / 游资占比)的慢变化,在小市值段内影响未来的截面收益。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      创新度 4。快照 0 个 head。15 个种子对 5 个控制的最高 |ρ| 是 0.57(b6 对 known)、0.56(b5 对 known)、0.55(b6 对 liq),都是时段成交份额、成交重心、带符号占比这类写法,与流动性水平、波动、20 日反转、Amt 离散度族不是同一个东西。与流动性有 0.5 左右的中度相关,但未到 0.8,残差会去掉它的平滑暴露。第 1 轮的 b 位因为约三分之一的式子重写了 20 日反转而给 3;这一位只有 b8(rev 0.38)和 b10(rev 0.29)与反转有较明显重合,不构成三分之一,所以给 4。

      合理度 4。逐个核对算子:in_slice 是闭区间 x[:, start:end+1](dt_in.py:324),211-240 为最后 30 根、1-30 为开盘后 30 根、236-240 为最后 5 根,与 241 网格一致。day_centroid 在所选根数上归一到 [0,1](ops_ext.py:155)。day_signed_ratio 有界于 [-1,1],分母为零时屏蔽(ops_ext.py:122)。in_pct 前 d 根为 NaN,所以 day_first(in_pct(Close, 30)) 取到第 30 根的 30 分钟收益(ops_ext.py:40)。9-11 号的分钟收益只取 1..30 与 211..240,避开了第 0 根(可能跨日)。13 号 cross_zscore(·, 120) 有常数窗口保护、|z| 有界。14 号 cs_bucket_rank 有缺失保护。15 号的 cs_rank 缺失为 NaN,不是 0。覆盖率 >= 0.998,无前视。

      不挡但标注:
      (i) b1、b14 的「最后一根」与尾盘段在深市含 14:57-15:00 的收盘集合竞价、沪市主板是连续竞价(PI 已写)。这是横截面的板块差异,不是数学问题。
      (ii) 15 号与 2 号是同一序列只换了包装(cs_rank + cross_ema 对 cross_mean),控制谱系最大差 0.059(size)。它比第 1 轮判重复的那一对(最大差 0.034)差距大,保留。
      (iii) 5、6、12 号的控制谱系几乎相同(最大差 0.045),但基序列不同(成交重心、尾 30 分钟份额减首 30 分钟份额、首 5 分钟份额减尾 5 分钟份额),不算重复,保留。

      如果它有 alpha,最可能来自:成交在日内各时段的构成(尾盘机构调仓段与开盘后散户段的份额差)反映的持有人结构慢变化,以及由此带来的交易节奏差异。
