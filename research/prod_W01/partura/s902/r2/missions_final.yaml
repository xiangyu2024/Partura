  hypothesis: '核心:集合竞价(第 0 根,09:30 标签)成交额占全天成交额的比例 div(day_first(Amt), day_sum(Amt)),有界在
    [0,1]、不带量纲(不是 Amt 的水平,也不是分钟 Amt 的离散度)。

    证据(全部是样本内):它是 M 两批 + 本种子第 1 轮能看到的候选里,train 与 valid 都为正、且 valid 很高的一个簇。共性表里含它的候选
    13 个,均值差 +1.02(p 0.001);第 1 轮 Pr1a 里它的 15 / 20 / 30 日平滑写法拿到 score +0.21 / +0.14
    / +0.15,拆开是 train +0.11~+0.21、valid +1.19~+1.45 —— 符号一致,但 train 只有 0.1~0.2,是 score
    = min(train, valid) 里卡住的那一边;改平滑窗口(15、20、30、再叠 30)train 都停在 0.1~0.2,所以限制不在换手成本(平滑越慢成本越低,train
    没变),而在 train 段里这个量的截面排序里混了不属于 alpha 的成分。

    alpha 的来源假设:09:25 的集合竞价是一天里唯一把隔夜信息(公告、外盘、政策)和提前下好的单(基金申赎、程序化、游资竞价抢筹)在同一个价格上撮合的时刻,
    其余时间是散户盯盘追涨杀跌的连续竞价。一只股票的"成交有多大比例是在竞价里完成的"是一个缓慢变化的持有人结构 / 关注度特征,竞价占比高 = 成交由提前下单者(机构
    / 游资)主导, 占比低 = 由盘中情绪主导;前者的定价更接近信息,后者容易被日内情绪推过头、之后回吐。这是一个慢特征(换手低,15 bp 不吃光)。

    本轮要试的外围处理(与第 1 轮见过的"cross_mean 叠 cross_mean"完全不同,共 16 个种子,八类写法):(1) 换聚合方式:cross_ema(半衰期而不是窗口)、cross_med(中位数,忽略一字板日的爆发)、cross_tail_mean_q75(只看自己占比最高那几天的均值)、cross_stddev(占比的稳定性:稳定的机构式参与
    vs 突发的游资式参与);(2) 相对自己的历史:cross_zscore(C, 60) 再平均、以及 20 日均值减 120 日均值(竞价参与度是在升还是在降),去掉
    train 里不是 alpha 的"这只股票一贯的竞价占比水平"(板块、上市年龄、做市结构造成的永久差异);(3) 同类内比较:cs_bucket_rank
    / cs_bucket_demean 在 LogFloatCap 十分位内、ListAge 十分位内、以及 20 日成交额(流动性)十分位内排名(5 个控制已经去掉了对市值的线性
    / 二次 / 三次暴露,但没有去掉"在同市值股票里的相对竞价占比"这种交互);(4) 条件在方向上:C 在高开日的均值减 C 在低开日的均值(竞价里放量的方向
    —— 带符号的竞价压力);(5) 筛选:cs_first_low40 / cs_first_high40 把前 40% 小市值 / 大市值股票里的竞价占比排在前面(只在一个市值段里做);(6)
    排除机械成分:cs_last_high10(C, 当日高开幅度) 把当日高开最极端的 10%(涨停开盘的一字板,竞价占比机械地高 / 低)排到最后再平均;(7)
    日度排名后再平均 cross_mean(cs_rank(C), 40),不让个别爆发日支配;(8) 与收盘集合竞价占比做差(开盘 vs 收盘的成交构成)。

    和库里已有的为什么不同:库里目前没有 head(0 个),所以不会和 head 重复。对 5 个控制:C 是比例,不含 Amt 水平(流动性控制),不含 Amt
    的分钟离散度(已知族 cross_mean(day_std(Amt), 30) 是水平 × 离散度,C 是第 0 根的份额);对市值只以同类内排名的形式使用。外围与"已见过的含该核心的候选"不同:已见过的全是
    cross_mean 套 cross_mean(15/20/30),本轮没有一个种子只是换窗口。

    样本外为什么还会在:机制来自 A 股的撮合制度(集合竞价 + 连续竞价 + T+1 + 散户为主的连续竞价),这在 2018~2023 没有变;同一个符号在
    train 与 valid 都是正的;外围里相对自己历史、同类内排名、排除一字板这几类写法,目的正是去掉 train 里随时间变的结构性成分(2020-08
    创业板改 20% 涨跌幅、2021 年风格极端),而不是调参。

    已知风险:日内第 0 根若当天没有成交(Amt 缺失),day_first 取到第一根有效值,这时 C 退化为开盘第一分钟占比,仍有定义;C 本身有界,不会除零爆点(day_sum(Amt)
    为 0 的停牌日已被掩码)。'
