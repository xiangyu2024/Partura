- type: N
  hypothesis: '机制:一天里的成交"在什么时间段完成"与各时间段的买卖压力 —— 按参与者类型拆开成交构成。第 1 轮和 M 两批里唯一在 train
    与 valid 都为正的簇是"第 0 根(集合竞价)占全天成交额的比例"(E 位在深挖),它说明新尺子下留得下来的信息是成交在日内时间轴上的构成(一个比例、有界、不带量纲),而不是任何量的水平。这个位把同一个视角推广到其他时间段:A
    股 09:30 开盘集合竞价之后的前 30 分钟(隔夜信息被连续竞价消化)、中间 120 分钟(盘中散户的主要时段、午前午后的沉闷期)、最后 30 分钟(机构
    / 基金的调仓、指数基金与 ETF 申赎、被动资金和"尾盘抢筹"集中的时段;创业板 / 科创板与深市有收盘集合竞价,沪市主板是连续竞价到 15:00)。文献依据:Heston-Korajczyk-Sadka
    (2010) 发现个股收益在日内的半小时周期性、说明参与者的日内交易节奏是稳定的个股特征;Gao-Han-Li-Zhou (2018) 的日内动量:开盘半小时收益预测最后半小时收益,尾盘是机构调仓和知情交易的时段;Cushing-Madhavan
    (2000) 说明尾盘成交里机构占比高。

    算子怎样实现(15 个种子,骨架互不相同,四组):(1) 构成份额:最后一根(收盘)占全天成交额的比例 div(day_last(Amt), day_sum(Amt))、最后
    30 分钟份额 div(day_sum(in_slice(Amt, 211, 240)), day_sum(Amt))、开盘后 30 分钟份额(in_slice(Amt,
    1, 30),不含第 0 根集合竞价)、中间段份额(in_slice(Amt, 61, 180));都用 cross_mean / cross_ema 取
    30-40 日的慢均值,不放进水平;(2) 构成的形状:去掉集合竞价和最后一根之后的成交额重心 day_centroid(in_slice(Amt, 1,
    239))(成交是前重还是后重)、最后 30 分钟份额减开盘后 30 分钟份额、前 5 分钟份额减最后 5 分钟份额(开收盘强度对比);(3) 分段的买卖压力:day_signed_ratio(Ret,
    Amt) 只在最后 30 分钟 / 开盘后 30 分钟内取(分段的净买入占比,有界在 [-1,1]),以及两者之差(尾盘净买入 - 早盘净买入:早盘卖、尾盘买的分歧);分段收益
    day_last(in_pct(Close, 30)) 与 day_first(in_pct(Close, 30))(最后半小时与开盘半小时的收益,即日内动量的两端);(4)
    相对性写法:自己历史 cross_zscore(份额的 5 日均值, 120)(尾盘份额相对自己长期水平的异常)、市值十分位内排名 cs_bucket_rank(·,
    LogFloatCap)、日度排名后再平均 cs_rank。

    和库里已有的为什么不同:库里目前没有 head(0 个),不存在重复问题。对 5 个控制:全部是份额、比例、带符号占比或收益,不含 Amt / Volume
    的水平(流动性控制)、不含分钟 Amt 的标准差(已知族 cross_mean(day_std(Amt), 30) 受第 0 根和最后一根的巨大成交额支配,是"水平
    × 离散度",份额则去掉了水平);分段收益不是 20 日反转(只覆盖一个半小时,且均值取的是日内收益而不是累计收益);全程不含 ts_rank / cross_rank
    / in_rank_rolling(避开缺失日返回 0 的已知行为),也没有除以近零量:份额分母是全天成交额(停牌日已掩码),分段买卖压力分母是该段成交额,有界。与
    E 位不同:E 位只用第 0 根的份额、保留核心的家族,这个位不含该核心,看的是别的时间段。

    样本外为什么还会在:机制来自交易制度(T+1、涨跌停、散户为主的连续竞价、机构在尾盘调仓),而不是某一段行情的风格;份额是持有人结构的慢特征(30-40 日窗口换手低);相对自己历史和同类内排名这两类写法是针对
    train / valid 之间的结构性变化(2020-08 创业板改 20% 涨跌幅;2022 年之后北向与机构占比变化)。已知风险:最后一根在沪深两市的含义不同(深市是
    14:57~15:00 的收盘集合竞价,沪市主板是连续竞价),这是个横截面的板块差异,可能让收盘份额主要在区分交易所 —— 用市值十分位内排名和日度排名两种写法部分缓解,但不能消除;若
    in_slice 的分钟下标与数据网格有 1 根偏差,只会让份额窗口平移一分钟,不影响定义。'
