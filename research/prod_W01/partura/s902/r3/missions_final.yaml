- type: N
  hypothesis: '机制:当日信息被吸收的时间结构。把一天的成交看作三个钟:成交钟(钱在哪个时段成交:C 竞价份额、F 开盘后 30 分钟份额、L 尾盘
    30 分钟份额)、方向钟(净买入占比 day_signed_ratio(Ret, Amt) 在哪个时段为正)、价格钟(日高 / 日低在哪个分钟创出)。本种子现有
    head 全在第一个钟的「份额」读数上,而且每个份额都带着本股票固定的结构常数(流动性斜率:L 的慢 EMA 对已知族 ρ ≈ -0.47;交易所:深市最后一根含收盘集合竞价,沪市主板没有)。本位在三个方向上读「份额之外」的信息:(1)
    合成与残差——「早完成」指数(C、F、早盘净买入的慢均值秩之和减 L 的慢均值秩)、尾盘份额扣掉早盘份额后的残差:各份额单独是 head,但各自的特异噪声(交易所、流动性斜率)在加总里相互抵消一部分,对任一单个
    head 的日度秩相关预期 0.5-0.7(仍在库禁令 0.7 之下);(2) 带方向的份额——份额乘以该段的净买入占比(F×早盘净买入、L×尾盘净买入):同样
    20% 的尾盘成交,是被动卖出还是尾盘抢筹,含义相反,水平份额把两者混在一起;(3) 对冲击的反应与日内持续性——份额与 log 成交额 / |日收益| /
    缺口的 60 天共动(放量日多出来的成交落在开盘还是尾盘),早盘净买入与其后全天净买入的 60 天相关(早盘的方向是被机构全天执行延续,还是被日内交易者当天反手),以及价格钟与成交钟的同步度
    cross_corr(day_centroid(Ret), day_centroid(Volume), 60)(|分钟收益| 的重心与成交量重心是否同步:价格在成交集中的时段动,还是成交与价格错开)、日高
    - 日低时点(价格钟)和成交集中度 day_gini(Volume)(另两条轴的探针,先验较弱,各 1-2 个)。


    算子怎样实现:份额 L = div(day_sum(in_slice(Amt, 211, 240)), day_sum(Amt))、F = 同式的 in_slice(Amt,
    1, 30)、C = div(day_first(Amt), day_sum(Amt));S1 = day_signed_ratio(in_slice(Ret,
    1, 30), in_slice(Amt, 1, 30))、S9 = 同式的 211-240;合成 = sub(add(add(cs_rank(cross_mean(C,
    30)), cs_rank(cross_mean(F, 30))), cs_rank(cross_mean(S1, 30))), cs_rank(cross_mean(L,
    30)));残差 = cs_regres(cs_rank(cross_mean(L, 30)), cs_rank(cross_mean(F, 30)));带方向份额
    = cross_ema(mul(F, S1), 30)(或 cross_mean 40)与 cross_mean(mul(L, S9), 40) 及其差;共动
    = cross_corr / cross_regbeta(份额, log(day_sum(Amt)) 或 cs_winsor 后的 |日收益| / 缺口,
    60);持续性 = cross_corr(S1, 31-240 分钟净买入占比, 60)。所有分钟段只用当日已发生的数据;缺口 = 当日开盘价 / 昨收 -
    1,当日收盘后才可知,无前视;份额的分母是全天成交额(停牌日已掩码),共动用 60 天窗口、相关系数有 EPS 保护;不含 ts_rank / cross_rank
    / in_rank_rolling。


    和库里已有的为什么不同:库里 5 个 head 是单一份额的慢均值 / EMA / 十分位去均值 / ts_max;本位没有一个种子是它们的窗口改动,骨架全不相同。合成与残差:对每个单个
    head 预期 |ρ| 0.5-0.7(由 4 个成分平均、各占 1/4,而不是其中一个);带方向份额:乘上符号变量后,截面排序由 S1 / S9 的符号和大小决定,对份额水平的日度秩相关预期
    < 0.4;共动与持续性:相关系数对水平不变,预期 < 0.4。对 5 个控制:份额类 ρ 与流动性、已知族约 0.4-0.5,共动类 < 0.2,均低于
    0.8 自动线。


    样本外为什么还会在:(i) 开盘集合竞价与尾盘的参与者构成来自交易制度(T+1、涨跌停、散户连续竞价、机构开盘 / 收盘调仓),2018-2023 没变;(ii)
    份额 / 共动 / 持续性都是持有人结构的慢特征(30-60 天窗口,日度重叠);(iii) 合成的目的是把单个份额里随交易所 / 板块 / 流动性变化的特异成分平均掉,留下共同的「提前完成」成分;(iv)
    带方向份额与共动类对固定常数不变。已知风险:L 与 log 成交额的共动里有分母的机械成分(总额大 → 份额小),但「放量时尾盘份额跟着变多少」本身就是目标量,不是缺失值或爆点;合成类种子可能对某个
    head 的 |ρ| 贴近 0.7,由相关度表处理。'
