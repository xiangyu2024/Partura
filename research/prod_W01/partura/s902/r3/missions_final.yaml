  hypothesis: '核心:day_centroid(Volume)(一天里成交量的重心,按 241 根分钟归一到 [0,1],0 = 全在开盘、1 = 全在收盘)。


    样本内证据(只用 train / valid):(1) 共性表里含它的候选 22 个,均值 +0.44,不含的 -1.08(p < 0.001),核心卡第
    3 行;但 abs_、pow_1_5、cs_scale 这几个包装是单调变换,等于同一个信号,所以有效样本远小于 22,它说明的是「这个量的水平形态已经在
    +0.44 附近,差一点过 0.5」。(2) 本种子现有 5 个 head 里 4 个是同一条轴:日内成交时点——尾盘 30 分钟份额 L(方向 -1,score
    +1.23,train +2.21 / valid +1.23)、竞价份额 C(+0.89 / +0.56,方向 +1)、开盘后 30 分钟份额 F(+0.59,+1)、开盘
    30 分钟净买入占比(+0.62,+1);符号一致:成交越前置越好、越后置越差。质心恰好是这几个份额的线性组合(大致 0.44·L - 0.43·F - 0.5·C),所以它的水平(慢均值
    / 慢 EMA)与 head 1 的日度秩相关很可能 ≥ 0.7,会被库禁令拒掉。本位因此故意不放水平形态(只放 2 个换了「分组」写法的水平版作对照),放的是「质心随时间怎么变、和什么一起变」。


    机制:质心不只是一个静态的持有人结构特征,它在每只股票身上对新闻和冲击的反应速度不同。T+1、涨跌停、不能做空的 A 股里,好消息日(高开)买盘是开盘就抢(成交前置)还是被动追涨(成交后置),放量日多出来的成交落在开盘还是尾盘,都是「谁在交易」的指纹:前置
    = 提前挂单的机构 / 程序化 / 知情方,后置 = 盘中情绪和尾盘被动资金。这些「共动」统计量对股票的任何固定常数都不变——特别是深市有收盘集合竞价(最后一根含
    14:57-15:00 的大额成交)、沪市主板没有,使 L 和质心的水平里带着交易所哑变量;相关系数、短减长、桶内去均值不带这个常数。这是本位最重要的稳健性设计:如果
    head 1 的 alpha 主要是交易所哑变量,这些写法就不会出分;出了分就是时点信息本身。


    算子怎样实现(16 个种子,骨架互不相同,六组):(a) 与冲击共动(60 天滚动相关 / 回归):cross_corr(质心, 隔夜缺口 / 日内收益 /
    日收益 / log 成交量),cross_regbeta(|缺口| → 质心);缺口 = 当日开盘价 / 昨收 - 1,收益均经 cs_winsor 去掉新股首日等爆点,当日收盘后才可知,无前视。(b)
    变化:cross_ema(质心, 5) - cross_ema(质心, 60)(短减长)、cross_madz(cross_mean(质心, 10), 120)(相对自己历史)、cross_stddev(质心,
    60)、质心的一阶自相关(习惯是否稳定)。(c) 价格时钟 vs 成交时钟:day_centroid(Ret)(|分钟收益| 的重心)减质心,以及 day_centroid(Amt)
    减质心(= 用成交量加权的日内价格漂移)。(d) 正交化:cs_regres 把质心的慢均值秩对 L 的慢均值秩回归取残差(质心里 L 解释不了的部分,即开盘段
    / 午间段的成交);质心与 day_gini(Volume)(成交集中度)的秩差。(e) 对照:BoardCode 桶内去均值(列序 = 交易所 / 板块块,去掉交易所哑变量)、流动性十分位内排名、cs_rank
    后慢 EMA。


    和库里已有的为什么不同:库里 5 个 head 全是「份额的慢均值 / 慢 EMA / 十分位去均值 / ts_max」,即水平。本位的主体(a)(b)(c)是相关、差分、离散度、双时钟差,对水平几乎不相关(预期对
    head 的 |ρ| 在 0.1-0.5);(d) 的残差对 L 的日度秩相关由构造接近 0。没有一个种子是 head 的窗口改动;对 5 个控制:质心是形状量,不含
    Amt / Volume 的水平,对流动性、波动的相关预期 < 0.4,60 天相关再进一步去水平。


    样本外为什么还会在:(i) 机制来自交易制度(T+1、涨跌停、散户为主的连续竞价、机构在开盘集合竞价和尾盘调仓),不是某段行情的风格;(ii) 共动与变化量对股票固定的常数(交易所、板块、上市年龄造成的永久差)不变,所以不会随
    2022 年之后的板块轮动变号;(iii) 60 天滚动窗口天然是慢信号(日度重叠 59/60),成本 15 bp 吃不掉;(iv) 同一个想法的邻居(质心与冲击共动、短减长)在本批之外的独立搜索里也独立地出现过较高的
    train 与 valid 同号分数——这是样本内的旁证,不是对本种子的检验。已知风险:相关系数 60 点的标准误约 0.13,个别股票的估计很噪;方向由评估自己选;若冲击变量(缺口)被涨跌停日支配,相关会被少数日子决定,已用
    cs_winsor 缓解。'
