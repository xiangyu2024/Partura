attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [9, 13, 16]
    reasons: |-
      创新度 4。核心 day_centroid(Volume) 对快照 5 个 head 的日度秩最大 |ρ| = 0.28(最像 F 的 30 日均值),残差 0.42;对 5 个控制 liq 0.18、vol 0.16、rev 0.13、known 0.20、size 0.07,远低于 0.8 线,核心本身过门槛。它不是任何 head 的换写,但与库里的份额同轴:段内量均匀分布的近似下,centroid ≈ 0.50 - 0.50*C - 0.44*F + 0.44*L + 中段(31–210 根)的时点残差(按 ops_ext.py:155 的定义核对,与 PI 写的 0.44L - 0.43F - 0.5C 一致)。库里 heads 只读 C、F、L 三段,不读 31–210 根的时点结构,所以核心的新信息主要来自中段。候选主体是质心与冲击的 60 日共动(1–5)、慢变化(6、7)、自相关(15)与双时钟差(12)。第 1–7、12、15 号对 5 个 head 的最大日度秩 |ρ| 都在 0.31 以下(第 12 号只有 0.07);第 8、10、11 号(0.49、0.47、0.54)与第 14 号(0.69)离库最近,保留但标明贴近 0.7 线。给 4 不给 5:核心本身是三个已有份额的线性组合加中段信息,新意主要在候选的动力学写法上。

      划掉 9、13、16。三个都是 head 4(F 的 30 日均值)的换皮,且超过 0.7 库禁令线,确定性步骤也会划:
      - 9 号 cs_regres(cs_rank(质心 30 日均值), cs_rank(L 30 日均值)):对 head 4 的日度秩 |ρ| = 0.85。与 L 正交的目标达到了,但残差近似等于质心扣掉 L 之后剩下的 -0.44F - 0.5C 部分,因此与 F 高度共线。PI 只预期了对 L 的正交,没预见到对 F 的共线。
      - 13 号 cross_mean(cs_bucket_demean(质心, BoardCode), 40):对 head 4 的 |ρ| = 0.81,并且对 liq 0.54、known 0.56。分桶去均值没有去掉份额水平。另外,cs_bucket_demean 的分桶(ops_ext.py:458 _buckets 取 BoardCode 排名的十分位,并列按列序打破)不是「每个交易所一桶」,而是把板块按列序切成块;§4 不把列序打破算作问题,这里只把它记为 PI 文字与实现的偏差。
      - 16 号 cross_ema(cs_rank(质心), 20):对 head 4 的 |ρ| = 0.80,对 known 0.59、liq 0.58。就是质心秩的 EMA。
      划完剩 13 个(≥ 4)。E 位核心对每个控制的 |ρ| 都 < 0.8,通过。

      无数学问题。质心用 |x| 加权、在 T-1 上归一到 [0,1]、总量为 0 时掩码(ops_ext.py:155)。cross_corr 与 cross_regbeta 的分母带 EPS(common.py:43,rolling_pair_reduce 与 rolling_ols),方差为零时给 0 或 NaN,不爆点。cs_regres、cs_winsor、cs_bucket_* 都是截面操作,不引入前视;冲击量只用到 t 日收盘后可得的数据,收益按次日起算(AlphaCube 的标签约定),无前视。每个外围都原样包含 day_centroid(Volume)(第 12 号是 day_centroid(Amt) - day_centroid(Volume))。该核心不同于 r2 的 E 核心 div(day_first(Amt), day_sum(Amt)),本轮首次作为 E 核心使用。

      不挡但需要 PI 核对:
      (a) 第 8 号的 day_centroid(Ret) 包含第 0 根。仓库里没有找到真实分钟 Ret 第 0 根的定义(src/alphacube/synthetic.py:127 的合成数据是段内 close/open - 1)。若真实数据第 0 根的 Ret 含隔夜缺口,|Ret| 的质心在跳空日会被第 0 根拉向 0,第 8 号(以及 slot b 第 16 号)会带上 |缺口| 的成分。这不是本审计能确认的数学问题,交 PI 核对。
      (b) 第 5 号 cross_regbeta(|缺口|, 质心, 60) 的斜率可能被单个跳空日主导。rolling_ols 只挡 var_x ≤ EPS,没有最少有效点数门槛,上市不久的股票窗口点数少,存在热身期风险;没有除零或爆点,不挡。
      (c) 第 14 号是唯一对流动性做了分桶去斜率的写法(liq 0.08,而 16 号为 0.58),留着。

      如果它有 alpha,最可能来自:成交时点结构的慢变化与冲击的共动,即放量日多出来的成交落在开盘还是尾盘、质心随时间是否稳定、质心与隔夜缺口 / 日内收益 / 日收益的 60 日共动。这是「谁在什么时点交易」的持有人结构指纹;其次是库里没读的中段 31–210 根时点结构。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [1, 2, 3, 5, 15]
    reasons: |-
      创新度 4。快照 5 个 head 全是 L、F、C 份额或 S1 方向的慢均值、EMA、十分位去均值与 ts_max 这类水平写法。留下的 11 个候选(4、6、7、8、9、10、11、12、13、14、16)对 5 个 head 的日度秩 |ρ| 最大为 0.60(第 6 号,对 head 3)、0.40(第 16 号)、0.32(第 8 号),其余都在 0.27 以下;对 5 个控制的最大为 0.30(第 9 号对 known)。它们读的是份额与冲击的 60 日共动(7、9、10、11、12)、带符号的份额(4、6)、份额的日内持续性(13)、价格钟与成交钟的同步(16)和日高 / 日低时点(14),都是库里没有的读法。给 4。

      划掉 1、2、3、5、15:
      - 1 号 sub(add(add(cs_rank(C), cs_rank(F)), cs_rank(S1)), cs_rank(L)),均为 30 日均值:对 head 4(F 的 30 日均值)的 |ρ| = 0.77,残差 0.67,超过 0.7 库禁令线。PI 预期的「合成稀释单个 head、|ρ| 在 0.5–0.7」没有实现,它仍是 head 4 的换皮。
      - 2 号 是 1 号去掉 C、窗口改 40 的同类写法:对 head 1(L 的 EMA)的 |ρ| = 0.72,超过 0.7 线。与 1 号重复。
      - 3 号 cs_regres(cs_rank(L 30 日均值), cs_rank(F 30 日均值)):对 head 1 的 |ρ| = 0.87。OLS 残差与 L 的相关近似为 sqrt(1-R^2),即 F 只解释了 L 秩方差的约四分之一,残差几乎就是 L。PI 预期的「0.5–0.7」偏低,它是 head 1 的换皮。
      - 5 号 cross_ema(F × S1, 30):对 head 3(cs_rank(S1 的 30 日均值) 的 EMA)的 |ρ| = 0.80。基本是 S1 的排序乘上 F 的水平,是 head 3 的换皮。
      - 15 号 cross_mean(day_gini(Volume), 40):对 liq 控制的 |ρ| = 0.82(≥ 0.8 线),对 known 0.73、size 0.53。day_gini 是成交集中度,与流动性水平几乎是同一个量。
      划完剩 11 个(≥ 4)。

      无数学问题。核对算子:in_slice 是闭区间 x[:, start:end+1](dt_in.py:324),211–240 为最后 30 根、1–30 为开盘后 30 根,与 241 根网格一致。day_signed_ratio 有界于 [-1, 1],分母 den > 0 掩码(ops_ext.py:122)。day_gini 排序后把缺失放到末尾再置 0,Gini 公式正确(ops_ext.py:136)。cross_regbeta(x, y) 是 y 对 x 的斜率(rolling_ols,common.py;var_x ≤ EPS 时输出 NaN),所以第 8 号是 F 对 log 成交额的斜率,第 12 号是 L 对 |ret| 的斜率,与 PI 的表述一致。cs_rank 走 common.rank,缺失为 NaN,不走 nanrank_last,没有 §4 的「缺失当 0」问题。候选中没有 ts_rank / cross_rank / in_rank_rolling / nt_* / ts_spearman。无前视:份额、方向与冲击都是 t 日收盘后可得的数据,收益按次日起算。

      不挡但需要标注:
      (a) 9、10、11 号的冲击(缺口、收益)只做了截面 1%/99% winsor(cs_winsor),60 日时间序列里单日涨跌停或跳空仍可能主导共动相关;12 号的斜率也有同样的杠杆点问题。PI 已写。
      (b) 4、6 号的 L 分子含第 240 根(深市收盘集合竞价),深市票的份额系统性偏高。这是交易所偏移,不是数学问题,PI 已说明。
      (c) 16 号的 |Ret| 质心同样依赖第 0 根 Ret 的定义(见 slot a 第 8 号的说明)。

      如果它有 alpha,最可能来自:成交的时间结构与方向、冲击的配合。放量日多出来的成交落在开盘还是尾盘、早盘净买入是否被全天延续、尾盘抢筹与被动卖出在同样的份额下含义相反。这是持有人结构(机构开盘 / 尾盘调仓 vs 散户连续竞价)的慢特征。
R:
  - head: 'cross_ema(cs_rank(div(day_sum(in_slice(Amt, 211, 240)), day_sum(Amt))), 20)'
    soundness: 4
    reasons: |-
      合理度 4。8 个变体都是定义明确的算子组合:cs_regres 残差(带 var > EPS 守卫)、cs_bucket_demean / cs_bucket_zscore(分桶去均值或 z 分数,zscore 带 EPS)、换成 Volume 的份额、去掉第 240 根后的份额(分母只取 0–239)、半衰期 10。分母 day_sum(Amt) 停牌已掩码,份额有界,没有数学问题。机制清楚:保留份额的大小信息,同时把流动性斜率显式投影掉,对应 PI 的拆解(去掉 cs_rank 升到 +1.74,但对 known ρ = -0.54)。标注、不挡:
      (i) 变体 1、2、7 只对 known 取残差,深市收盘集合竞价那一根带来的交易所偏移(第 240 根在分子里)不在 known 里,仍留在残差中;只有变体 6 直接去掉这一根。
      (ii) 变体 5(cs_bucket_demean(·, BoardCode))与 slot a 第 13 号是同一个分桶问题(十分位 + 列序),不是每个交易所一桶。变体 5 对原 head 的 |ρ| 为 0.95、对 known 0.53,按 R 规则不满足 known < 0.5 的条件,由流水线决定。
      如果它有 alpha,最可能来自:去掉流动性斜率后,尾盘份额的水平本身(尾盘抢筹或停滞的持有人信号)。
  - head: 'cross_mean(cs_bucket_demean(div(day_first(Amt), day_sum(Amt)), LogFloatCap), 60)'
    soundness: 4
    reasons: |-
      合理度 4。4 个变体的算子都定义明确:cross_ema 半衰期 30 代替矩形 60;按 20 日成交额分桶去均值;cs_bucket_zscore(带 EPS 守卫);对市值秩的 cs_regres 残差。C 是 [0,1] 的份额,分母停牌掩码,没有爆点。依据是样本内证据(窗口 30/60/120 的 train 为 +0.32/+0.89/+0.43,非单调),不是测试段数字。注意:变体 4 对市值秩的线性残差与 reward 已有的市值控制重叠,只是冗余,不是问题。如果它有 alpha,最可能来自:同市值段内集合竞价成交占比的慢变化,即提前下单的机构 / 游资参与度,而不是市值本身。
  - head: 'cross_mean(div(day_sum(in_slice(Amt, 1, 30)), day_sum(Amt)), 30)'
    soundness: 4
    reasons: |-
      合理度 4。3 个变体(cs_rank 后 EMA 20、按市值分桶去均值 30 日、对已知族慢均值秩的线性残差后 EMA 20)都是明确的算子组合,没有数学问题;F 份额有界于 [0,1],分母已掩码。cs_regres 的 Y 是 F 的原始份额(不是秩),F 的截面右尾会让截面回归对少数票敏感,但它是截面回归,不产生爆点,不挡。机制清楚:开盘后 30 分钟的成交份额反映早盘参与者结构。依据是样本内的必要性拆解(train 卡住的一边 +0.59,valid +1.52)。如果它有 alpha,最可能来自:同流动性、同已知族水平下,开盘后半小时成交份额的慢变化。
  - head: 'cross_ema(cs_rank(cross_mean(day_signed_ratio(in_slice(Ret, 1, 30), in_slice(Amt, 1, 30)), 30)), 20)'
    soundness: 4
    reasons: |-
      合理度 4。唯一变体把开盘窗口从第 1–30 根放宽到第 1–60 根(in_slice(·, 1, 60)),其余结构不变。day_signed_ratio 有界于 [-1, 1],分母 den > 0 掩码;cs_rank 走 NaN 安全的 common.rank。PI 的衰减事实(窗口 20 → 10 降到 +0.50、20 → 40 降到 +0.19)是样本内证据。机制:信息被吸收的时间如果超过 30 分钟,开盘后早盘净买入方向的延续(机构分批执行)会在更长窗口里体现。如果它有 alpha,最可能来自:早盘方向的持续性,而不是 30 分钟内的瞬时冲击。
summary: 'a 位（E 深挖，核心 day_centroid(Volume)）通过：划 9、13、16（均为 head 4 的换皮），余 13；b 位（N）通过：划 1、2、3、5、15（head 4、head 1、head 1、head 3 的换皮，以及流动性代理），余 11；R 四组合理度均为 4，全部保留。'
