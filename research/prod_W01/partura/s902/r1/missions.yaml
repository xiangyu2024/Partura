- type: N
  hypothesis: |-
    机制:隔夜—日内分离。A 股是 T+1、有涨跌停、没有盘后交易的市场:隔夜收益 G = Open_t / Close_{t-1} - 1 (Open_t 是 09:30 集合竞价成交价,即 day_first(Open))累积了收盘后到开盘前的全部公开信息、公告和集合竞价里的订单;日内收益 I = Close_t / Open_t - 1 则几乎全部来自连续竞价,那里以散户为主(追涨杀跌、T+1 约束下的日内回吐)。两段收益的持续性并不相同:Lou-Polk-Skouras (2019) 在美股发现过去的隔夜收益预测未来的隔夜收益、过去的日内收益预测未来的日内收益("tug of war"),而二者之和(即总收益)几乎没有预测力;French-Roll (1986) 则说明闭市期间的方差主要来自信息到达、开市期间的方差有一部分是交易噪声。所以 alpha 的来源假设是:不是"涨过多少",而是"这些涨幅是在谁定价的时段里完成的"。

    算子怎样实现:G = sub(div(day_first(Open), ts_delay(day_last(Close), 1)), 1),I = sub(div(day_last(Close), day_first(Open)), 1),都是日频;随后全部用 cross_*(沿天轴)做 40-60 天的慢窗口聚合。15 个种子分五组,每组一个不同的统计量,骨架互不相同:(1) 水平:G 的均值、G-I 的均值(窗口 40/60,含 cs_winsor、中位数 cross_med、EMA 半衰期 20 三种稳健写法);(2) 频率:G>0 的天数占比减去 I>0 的天数占比(有界,不受一字涨停日支配);(3) 交互:sign(G)*I 的均值及其除以 |I| 之和的标准化形式(日内是在延续还是在回吐隔夜缺口),cross_corr(G, I, 60);(4) 比例:隔夜带符号位移占总位移的比例,rank(std(G)) - rank(std(I))(French-Roll 的信息到达份额),G 的左尾均值;(5) 其他:集合竞价那一根的成交额占全天比例 day_first(Amt)/day_sum(Amt),G 按 LimitWidth 标准化(涨停幅度 10%/20% 不同板块的缺口可比),以及在 LogFloatCap 十分位内去均值的写法。

    和库里已有的为什么不同:库里目前没有任何 head(第 1 批 77 个候选 0 个达到 0.5,共性表为空),所以不存在与 head 重复的问题。对 5 个控制:G-I、频率差、交互项、比例都是"两段收益的差或带符号交互",总收益(= G + I,即 20 日反转控制的主成分)在 G-I 里被抵消、在交互与比例里根本不出现,所以对 20 日反转控制是近乎正交的构造;没有任何一个用到 Amt 的水平或日内 Amt 离散度(已知族);全部是收益率比或有界统计量,不带股价或市值的量纲;波动率只以排名差或有界比例的形式进入。

    样本外为什么还会在:机制来自制度而不是风格——T+1、无盘后交易、集合竞价规则和散户为主的连续竞价在 2022-2023 都没有变;种子用 40-60 天窗口,换手低,扣 15 bp 后不容易被成本吃掉;winsor、频率、中位数、LimitWidth 标准化这些写法专门针对 2020-08 创业板改 20% 涨跌幅、一字涨停日把 G 推到极值这类会随年份变化的结构性偏差。已知风险:一字涨停日 G = +10%、I = 0,会让 G-I 的水平版被"热门股"支配,因此特意放了稳健版;集合竞价那一根是否总有成交额取决于数据,若缺失 day_first 会取到第 1 根,该种子退化为开盘第 1 分钟占比,但仍然有定义。
