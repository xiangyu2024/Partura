- type: N
  hypothesis: |-
    机制:成交量条件下的价格变动 —— 区分"信息驱动的价格变动"和"流动性 / 噪声驱动的价格变动"。信息交易者的价格变动通常伴随较小的成交量并且持续,噪声交易者(散户追涨杀跌、情绪、对冲需求)造成的价格变动往往放量并随后回吐 (Campbell-Grossman-Wang 1993; Llorente-Michaely-Saar-Wang 2002: 高成交量日的收益在信息不对称小的股票上反转、在信息不对称大的股票上延续;Gervais-Kaniel-Mingelgrin 2001: 高成交量溢价)。总收益只是两类变动之和,所以把它按成交量拆开之后,"差"这一部分与 20 日反转控制天然正交,alpha 的来源假设是"这个月的涨跌里有多少是缩量完成的"。

    算子怎样实现(16 个种子,骨架互不相同,分三个尺度):(1) 日频 ts_* 层,ret_1d / vol_1d / amt_1d 为内置日频宏:按自身 20/60 天成交量的 ts_rank 分放量日 / 缩量日,放量日收益和减缩量日收益和(`greater` / `less` 做掩码)、只取放量日、只取缩量日;连续版:成交量加权均值减等权均值 (= cov(V,R)/mean V)、ts_corr(ret, vol)、Llorente 交互项 corr(R_t, R_{t-1} * 相对成交量_{t-1})、带符号的异常成交量 (OBV 式);(2) 分钟层:全天成交量最大的 10% 分钟的平均收益 day_topw_mean(Ret, Volume) 及其减去全天均值;"聪明钱"式的价格冲击:按 |Ret|/sqrt(Volume)(单位成交量引起的价格变动,Kyle lambda 的分钟代理)最大的 10% 分钟的 Vwap 除以全天 VWAP;收盘价相对全天 VWAP;分钟 corr(Close, Volume);(3) 资金流向与价格的分歧:day_signed_ratio(Ret, Amt)(上涨分钟成交额占比减下跌分钟占比)的 40 天均值;当日资金流向排名减当日收益排名的 20 天均值(净买入压力大但价格没怎么涨 = 吸筹);前一天的资金流向对当天收益的 60 天相关;另有第 (1) 组连续版按 LogFloatCap 十分位去均值的写法。

    和库里已有的为什么不同:库里没有任何 head(第 1 批 77 个候选无一达到 0.5),不存在重复。对 5 个控制:这些统计量是"条件收益之差"、相关系数、比率,不含 Amt 的水平或离散度(已知族),也不含 Volume 或 Amt 的水平(流动性控制);波动率只以排名、相关系数、有界比例的形式进入;总收益被差分掉(20 日反转);市值只作为十分位内去均值的包装出现。分钟层用到的 day_topw_mean、day_signed_ratio 是 Partura 扩展算子(见 partura/ops_ext.py 的定义),把'重度分钟''净买入压力'直接写成一个节点。

    样本外为什么还会在:A 股成交仍以散户为主这一结构在 2018-2023 没有变,信息交易与噪声交易的区分不会因为 2022 年的行情切换而消失;种子主要是 20-60 天窗口的慢信号,日频种子对"相对于自身历史"的成交量排名做条件,所以不依赖整个市场的成交量水平(2022-2023 市场成交量大幅变化)。已知风险:分钟层种子读取的是第 0 根(集合竞价)的大成交量,很可能让重度分钟里几乎总包含开盘那根;放量日掩码用 ts_rank 的阈值,窗口内成交量并列时阈值附近有少量并列。
