  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [10]
    reasons: |-
      创新度 4。快照 0 个 head,库内没有可比对象;相关度表里 15 个式子对 5 个控制的 |ρ| 最高是 a15 的 vol 0.51(known 0.41、liq 0.39),其余多在 0.4 以下,没有哪个式子是某个控制换了写法。未触 0.8 自动划掉线;已知族 |ρ| 最高 0.41,未触 0.5 不合格线。两段收益 G(隔夜)与 I(日内)的拆分是控制里没有的结构,rev 只以 0.15–0.36 的 |ρ| 进入(a12 为 0.36,a2 为 0.29)。
      合理度 4。逐个核对算子:G = day_first(Open)/ts_delay(day_last(Close),1)-1 与 I = day_last(Close)/day_first(Open)-1 都在复权价空间内(Open、Close 同一复权),比值与差不跨空间。cross_* 沿天轴做因果滚动窗口(common.py rolling_windows 左填充 NaN),ts_delay 只向后看,无前视。cross_ema 因果(partura/ops_ext.py);cs_winsor 逐日截面 1%/99% 截尾;cross_tail_mean_q25 是 60 日下四分位的条件均值;cross_med、cross_stddev、cross_corr 都是滚动统计。a8 的 LimitWidth 由 tradability.board_limit 给出 0.10/0.20/0.30,不为零,不会除以零。注意数据缺陷而非数学问题:ST 股没有标 5%,它们的 G/LimitWidth 被放大约 2 倍,不挡。a4 是 is_gt0 的 60 日频率差,相关度表标为「废品」(distinct 0.063,只有约 121 个水平,1/60 步长),十分位归属主要由列序打破。§4 明确说列序打破不是挡的理由,面板也不是常数,所以放行,但分组信息很粗,请 PI 知悉。
      放行的其他要点:a12(cross_ema 半衰期 20 作用在 G-I 上)与 a2(cross_mean 40 作用在 G-I 上)用的是同一日序列,只换核函数,rev 相关 0.36 对 0.29,有差别,保留。a15 与 vol 相关 0.51 是本位最高,但它是左尾条件均值、只看向下的隔夜跳空,不是波动率本身,保留。a2、a3、a12、a14 都是 G-I 的均值、截尾、EMA、中位数变体,位内冗余较高,供 PI 参考,但按 §3 不划。
      假设中有一处叙述不对:它说 G-I 抵消了总收益。实际上 G-I = R-2I,仍含总收益(a2 的 rev |ρ| 0.29 印证)。这只是叙述问题,残差步骤会去掉 rev 的非线性暴露,不构成挡的理由。
      划掉 a10:它是 a2 外面再套一层 cs_bucket_demean(·, LogFloatCap)。a2 与市值的 |ρ| 只有 0.038,按市值十分位去均值几乎不改变截面排序。两者控制相关几乎一样(liq 0.215 对 0.24,vol 0.345 对 0.331,rev 0.289 对 0.28,known 0.237 对 0.26,size 0.038 对 0.004),判为同一信号换写法,即重复。这是推断,没有直接算二者的日度秩 ρ。
      如果它有 alpha,最可能来自:隔夜跳空的分布形态(均值、下尾、频率、中位数)反映的信息到达与开盘定价,与日内连续竞价被散户主导的部分之间的差异。
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: [9, 11, 12]
    reasons: |-
      创新度 3。快照 0 个 head。控制相关上,b7 对 rev 0.61、b8 对 rev 0.58、b4 对 rev 0.50、b1 对 rev 0.46 有明显重合(b7 与 b8 是同一分钟层结构的两个版本);b2 对 vol 0.39、known 0.36 略高;其余大多在 0.3 以下。成交量条件化的收益和分钟层事件统计是控制里没有的构造,但有约三分之一的式子在相当程度上重写了 20 日反转,所以给 3,不给 4。
      合理度 4(对剩余种子)。逐个核对算子:ts_rank 默认 pct=True,返回 [0,1] 分位(nd_ts.py),阈值 0.5、0.3、0.8 有意义。greater/less 是 (x>y).float()(catalog.py),NaN 当 0,不产生 NaN,也不偷看未来。ts_delay 只向后。b6 的 Vrel = vol/ts_mean(vol,20)-1 中 ts_mean 包含当天,故 Vrel 上界为 19,不会爆点,b13 同理。b7、b8、b14 的分钟算子 day_topw_mean、day_signed_ratio、day_corr 都排除了非有限值(ops_ext.py、dt_day.py),inf 与 NaN 的分钟权重不进入选择。b14 的 day_corr(Close, Volume) 在同一天内对常数缩放不变,复权因子在当天内是常数,不受影响。b5 的 ts_corr 与 b16 的滞后相关都是有界量。
      划掉 b9 与 b11(定义坏掉,属于 §4 数学问题)。两式的分子是复权价(分钟 Vwap 或 day_last(Close)),分母却是 day_sum(Amt)/day_sum(Volume),即原始成交额除以原始量。partura 的 daily.py 注释写明:这个存储里价格字段是后复权的,Amt 与 Volume 是原始的,Amt/Volume 的中位数只有 0.108×Close;项目自己因此改用 Vwap 按 Volume 加权来算日 VWAP。所以两式算出的是「复权价/原始 VWAP」,量级约 8,结果主要由每只股票的累计复权因子(分红送转历史)决定,而不是假设里的「收盘相对全天 VWAP」。这能解释为什么两式的控制相关几乎一模一样(liq 0.146 对 0.146,size 0.449 对 0.449,size |ρ| 很高),也与市值的系统性相关相符(推断)。§4 的后复权豁免只针对复权价本身的截面排序,不覆盖与原始量相除的情况。
      划掉 b12:它是 b4 外面再套一层 cs_bucket_demean(·, LogFloatCap)。b4 与市值 |ρ| 只有 0.02,控制相关几乎相同(liq 0.135 对 0.12,vol 0.229 对 0.222,rev 0.498 对 0.483,known 0.147 对 0.132,size 0.02 对 0.021),判为重复。
      其余 13 个放行。供 PI 参考两点:(i) 假设写「总收益被差分掉」,但 b4、b7、b8 与 rev 相关在 0.5-0.6,这些式子实际保留了一部分 20 日收益。(ii) 分钟 Ret 的第一根是否跨日(含隔夜缺口)我在代码里找不到定义。若跨日,top-volume 集合会把集合竞价那根的隔夜缺口带进来,与 a 位的 G 重叠。这一点我无法核实。
      如果它有 alpha,最可能来自:成交量条件下的收益分离(放量日与缩量日收益之差、分钟内高成交量段的收益),也就是信息交易与噪声交易在同一个月里被分开后的持续性差异。
