attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [1, 2, 3, 4, 5, 7, 9, 10, 11]
    reasons: >-
      创新度 4:本位把库里分数最高的 head1(+1.34,来源 c08s803Pr2a_Ea)原样锁定为核心,外围三类关系——
      cs_regres(核心, head2)、按 LogFloatCap/流动性分位数加权、按全市场波动状态(而非成交额状态)翻转——此前两轮都没有
      试过(round 2 的 E 位核心是更简单的 head2,外围只用过自身历史差分、Volume 回归、价格/上市年龄分桶、窗口平滑、
      按成交额状态翻转五类,见 r2/audit_record.json 的 seeds_all);核心本身升级为 head1 后同一套配方作用在它身上
      也是全新的候选树,不是换皮。相关度表显示相当一部分外围与 head1 本身的 |ρ| 不低,但这恰恰是"对核心取残差、被回归
      掉的东西解释力弱,残差必然还原回核心"的数学必然结果(见合理度),不是因为种子在重复测同一个东西才被打低分——
      是诚实的诊断,只是诊断完了之后这些候选本身没法再被当作新候选去评估(见下)。
      合理度 4(12 个种子逐个核对 + 数学检查):sqrt 在这套算子语言里是 sqrt(abs(x))(operators/common.py:206);
      cs_mask_top_replace_mean 按行用 rank 决定替换哪些值、用行均值替换,对正标量乘法齐次,ts_decay_linear 是线性
      加权平均(operators/nd_ts.py:222)——两者结合,mul(5,·) 在新尺子"先转排名"之后不可能改变最终分数,round 2
      loc.json 把"去掉二次掩码"必要性测成 ≈0 正是这条数学性质的体现,不是可疑现象;cs_regres 的 beta 只在
      var>EPS 时计算、否则给 0(nd_cs.py:274),不会爆点;cs_bucket_demean 对 n<2 的桶给 NaN、分母 clamp
      (nd_cs.py:cs_bucket_demean);day_zero_ratio 分母 clamp(min=1)(ops_ext.py:282),cross_valid_count
      是计数不涉及除法(ops_ext.py:289);add/sub 都是逐元素线性运算。12 个种子没有一个出现 §4 的前视、数值伪影或
      定义坏掉。核心与 5 个控制的 |ρ|(0.46/0.30/0.14/0.46/0.19)都 < 0.8,满足 E 位对核心的要求。
      但本位不能通过:§3 的确定性条款——"与某个 head 的日度秩 |ρ| ≥ 0.7" 或 "与某个控制的 |ρ| ≥ 0.8" 的种子自动
      划掉——逐一核对 corr_1.json 后:种子 1(vs head1 本身 ρ=0.964)、2(0.844)、3(0.995)、7(0.868)、
      9(0.974)、10(0.986)、11(0.962)都与 head1 的日度秩相关 ≥ 0.7,会被 GP 库禁令直接拒绝;种子 4 与 size
      控制 |ρ|=1.000、种子 5 与 liq 控制 |ρ|=0.988(与 known 控制 0.976)——mul(核心, cs_rank(X)) 这种写法
      最终的截面排序被 X 的单调排序完全主导,结果几乎就是控制本身,同样自动划掉。划完只剩种子 6(按波动状态翻转)、
      8(自身历史差分)、12(与买压相加)3 个,< 4 个的门槛,不满足 §3 的通过条件。
    revise: >-
      种子 1/2/3/7/9/11(cs_regres(核心, head2/Volume链路/净买压20日/量价相关20日/day_zero_ratio)连同
      种子 9 的 bucket_demean 变体)都是"对核心取残差去看某个弱相关信号能解释多少"这类诊断——按定义,如果被回归掉的
      东西解释力弱,残差就必然留在与 head1 ≥0.7 相关的区域,会被库禁令自动拒绝,这是这类写法的数学必然性而不是偶然
      失手,没有办法靠换个写法修好。这几条诊断本身的问题,相关度表（本次审计用到的 corr_1.json）已经把数字摆出来了,
      不需要再占用 GP 的 96 次付费评估去验证一遍,可以直接作为文字分析写进分析文档,把这 6 个评估名额换成真正围绕
      核心长外围、此前三轮都没试过的结构(例如:核心与新字段的非线性交互 mul/div 而非回归残差;分段/条件信号,比如
      只在核心排名前后 30% 的股票里重新加权;核心在不同再平衡频率下的稳定性)。种子 4、5 的 mul(核心, cs_rank(X))
      应改成不会让协变量的单调排序直接决定最终排序的写法——例如先把 X 分桶,只在桶内对核心做 cs_bucket_demean 或
      桶内重新排名,再跨桶比较,而不是用全局 cs_rank(X) 去乘。换完之后要让划线后剩余种子数 ≥ 4,才能通过。
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: >-
      创新度 4:day_quantile_q25(Ret) 是本轮定位表共性表(loc.md)第 11 行给出的子树——均值差 +1.46、p=0.007、
      出现在 4 个候选里——是库里两个 head(都是 day_centroid(Amt) 家族,刻画"钱什么时候到")之外,本轮快照第一次给出
      骨架完全不同(统计量家族=分位数、字段=Ret 而非 Amt)的经验证据。相关度表显示它与两个 head 的最大 |ρ| 只有
      0.228(残差后 0.031),与 5 个控制里最高的是 liq=0.42、known=0.407,都在"换个写法"的 0.5 门槛之下。
      种子 8(cs_regres(seed2, cross_mean(day_skew(Ret),20)))直接检验了最直接的重复嫌疑——"是不是 round 1
      Na 位已经交过、没做出 head 的 day_skew 的另一种写法"——给出可检验的残差而不是空口说不同,这本身是加分项。
      合理度 4(12 个种子 + 数学检查):day_quantile_q25(Ret) 在算子层是 day_quantile(Ret, 0.25) 的别名
      (src/alphacube/operators/dt_day.py:151,alphacube/catalog.py 里注册 "day_quantile_q25" ->
      "day_quantile" 固定 q=0.25),底层是 torch.nanquantile,有限输入必有限输出;day_median、
      day_quantile_q75 是同一算子家族;cs_regres 的方差护栏(见上,nd_cs.py:274)保证了种子 1/5/8/10 的回归
      残差不会爆点;没有一个种子直接写裸的 div(day_quantile_q25(Ret), day_std(Ret))(round 1 analysis.md
      点名的"除以会过零的量"那个陷阱),全部通过 cs_regres 取残差,这正是本位主动避开那个陷阱的证据;
      cs_bucket_demean 的名义价格分桶写法与 round 2 已验证的一致,ListAge 是日频叶子不参与除法;窗口 5/20/60
      都 ≤ 60,不落在热身期主导区间。
      值得记一笔但不构成拦截理由:corr_1.json 里 slot b core 这一行 gate=false、distinct=0.498(低于流水线
      自己的 0.5 门槛,表上标"废品")。读 partura/diagnose.py:136 的 distinct_fraction 实现与文档字符串——
      它测的是"十分位账本的归属,在取值并列的那些名字之间,是不是靠股票列序决定"——这正是规则 §4 明确列为"不是问题、
      不得据此挡"的那一类(并列靠列序打破,列序携带板块信息),不是数值伪影或定义坏掉;而且这个并列只出现在没有经过
      任何变换的裸核心上,本位实际评估的 12 个种子没有一个直接吃裸核心,全部先经过 cs_regres 或 cross_mean(·,20)/
      (·,60) 聚合,对应种子在 corr_1.json 里的 distinct 都回升到 0.95~1.00,说明这是单日快照上的离散效应,经时间
      平均或残差化之后就消失了,不会污染任何真正被评估的候选。
      如果它有 alpha,最可能来自哪里:个股"日内能跌多深"这件事本身的持续异质性,可能来自杠杆/强平/止损盘结构在某些
      股票上更容易触发连锁下探——这是个股的慢变属性而不是某一段行情的偶然产物(Amaya 2015 的已实现偏度、
      Bollerslev-Li-Zhao 2020 的上/下行波动分开定价、Ang-Chen-Xing 2006 的下行风险独立维度,三篇都支持"下尾
      形状、剥掉规模和位置之后"这件事携带独立信息);种子 1/5 的规模残差化和种子 4 的位置去中心化把"只是波动大"和
      "只是普遍下跌"两种混淆去掉之后,剩下的才是这个来源。
      划线:12 个种子与两个 head 的最大 |ρ| 都 ≤ 0.37(种子 6 最高),与 5 个控制的 |ρ| 都 < 0.65 且没有一个
      ≥ 0.8,无一需要自动划掉;核心与 5 个控制的 |ρ| 也都 < 0.8,满足 E 位对核心的要求。通过。
    revise: '—'
R:
  - head: 'cross_mean(sqrt(cs_mask_top_replace_mean(mul(5, ts_decay_linear(sqrt(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt))))), 5)))), 15)'
    soundness: 4
    reasons: >-
      变体把"先衰减、再做第二次掩码"换成"先做第二次掩码、再衰减",逐个算子核对过展开式——两边唯一的区别就是
      ts_decay_linear 和外层那次 cs_mask_top_replace_mean 的先后顺序,其余算子(内层掩码、两次 sqrt、mul(5,·)、
      最外层 cross_mean(·,15))完全一致,确实是本轮 loc.json 的 11 次拆解(sufficiency/knockout/swap/window
      四种)唯一没覆盖的一个维度:现有拆解只测过"去掉第二次掩码"(必要性 ≈0.00),没测过"换一种顺序后它还是不是
      废料"。原 head 必要性测试显示去掉衰减这一层有实质影响(+0.31),而去掉第二次掩码几乎无影响(+0.00)——这个
      "≈0" 本身可能只是因为掩码操作的对象已经被 5 日衰减抹平了异常值;变体直接把掩码挪到衰减之前,面对更原始、更尖的
      分布,是对"第二次掩码到底是不是废料"这个结论的真实证伪,而不是重复测同一件事。相关度表显示变体与原 head1 的
      |ρ|=0.90(残差后 0.87),在"替换候选需要与原 head 的 ρ≥0.5"这条线之上,属于能直接比较的同族变体。合理。
  - head: 'neg(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt)))))'
    soundness: 4
    reasons: >-
      round 2 的 R 已经测过"裁另一侧"和"先裁一侧再裁对侧"两种组合(R_prev.json:score −0.37 与 −0.18,
      都远低于原 head2 的 +0.56),本变体是第三种、此前没测过的组合:同一侧连续套用 cs_mask_top_replace_mean
      两次,中间不插入任何其他算子。逐个算子核对——变体是
      neg(cs_mask_top_replace_mean(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt)))))),
      与原 head2 相比只多了一次 cs_mask_top_replace_mean 的重复调用,算子本身对正标量乘法齐次、对任意有限输入
      恒有限,不会引入除法或开方,没有数学问题。这个检验能把本轮 head1(+1.34)新增的两个部件——"中间插入衰减"
      与"第二次掩码"——的贡献拆开看:如果连续同侧两次掩码本身已经比单次掩码好,说明"多裁一轮极值"这个动作本身在
      起作用;如果和单次掩码几乎没差别,说明 head1 真正起作用的是衰减而不是第二次掩码。相关度表给出变体与原 head2
      的 |ρ|=0.83(残差后 0.91),满足"替换候选需要与原 head 的 ρ≥0.5"。合理,是 E 位种子 1 的廉价互补检验。
summary: >-
  slot a 的 idea 和机制都站得住(创新度 4、合理度 4),但按 §3 的确定性划线规则逐一核对相关度表后,12 个种子里
  9 个因为与 head1 本身 |ρ|≥0.7 或与控制 |ρ|≥0.8 被自动划掉,只剩 3 个 < 4 的门槛,不通过,需要把"对弱相关量
  取残差"的诊断型种子换成真正能活下来的新结构、把两个坍缩成控制本身的加权种子改写;slot b(day_quantile_q25
  (Ret))创新度 4、合理度 4,全部 12 个种子都没有被自动划掉,核心的"废品"标记经核实是规则 §4 明确排除的"并列靠
  列序打破"而非数值问题,通过;两个 R 变体都是此前轮次没覆盖的组合,合理度都是 4。
