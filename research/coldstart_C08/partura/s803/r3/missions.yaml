R:
  - head: cross_mean(sqrt(cs_mask_top_replace_mean(mul(5, ts_decay_linear(sqrt(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt))))), 5)))), 15)
    why: >-
      本轮 loc.json 自带的 11 次拆解只测过"去掉某一层"(sufficiency/knockout/swap/window),没有测过"交换两层的
      顺序"。目前的顺序是:先对 day_centroid 取第一次掩码替换均值并开方,再做 5 日线性衰减,再乘 5、做第二次掩码
      替换均值、开方,最后 15 日滚动平均——衰减在先,第二次掩码在后。拆解表给出的数字是:单独去掉衰减这一层,
      必要性 +0.31(有实质影响);单独去掉第二次掩码这一层,必要性 ≈0.00(几乎无影响)。但第二次掩码必要性≈0
      很可能是因为它操作的对象(衰减之后的信号)已经被 5 日平均抹掉了尖锐的异常值,掩码自然没什么可裁;如果把顺序
      换成"先做第二次掩码、再衰减",这次掩码面对的是衰减之前更原始、更尖的异常值,必要性未必还是 0——这是"第二次
      掩码到底是不是废料"这件事唯一还没有被两种顺序都测过的维度,直接评估拿到真实数字,好过继续沿用"必要性≈0所以
      它是废料"这个只在一种顺序下成立的结论。
    variants:
      - cross_mean(sqrt(ts_decay_linear(cs_mask_top_replace_mean(mul(5, sqrt(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt))))))), 5)), 15)
  - head: neg(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt)))))
    why: >-
      round 2 的 R 已经测过"换成裁另一侧"和"裁完一次后再裁对侧"两种,都比原 head 差很多(R_prev.json:score
      −0.37 与 −0.18,远低于原 head 的 +0.56)。但还有一种组合没测过:**同一侧再裁一次**——不换侧,就是把
      cs_mask_top_replace_mean 对同一个量连续套两次,中间不插入任何其他运算。本轮的 head1(+1.34)恰好也是在
      第一次掩码和第二次掩码之间插入了 5 日线性衰减才变强的;如果"连续同侧两次掩码、不插入衰减"本身就已经比单次
      掩码好,说明是"多裁一轮极值"这个动作本身在起作用;如果和单次掩码几乎没有差别(或更差),说明 head1 真正起
      作用的是中间那层衰减,不是第二次掩码本身——这能把 head1 新增的两个部件(衰减、二次掩码)的贡献拆开看,是
      E 位种子 1(cs_regres(head1, head2))的一个廉价互补检验。
    variants:
      - neg(cs_mask_top_replace_mean(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt))))))
