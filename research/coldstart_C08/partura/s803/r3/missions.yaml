      (可能来自杠杆/强平/止损盘结构的异质性),这个效应就不依赖样本内的具体时间窗口。
      数学检查:cs_regres 的 beta 只在 var>EPS 时计算否则给 0,day_std(Ret) 在少数完全横盘/涨跌停锁死的日子恰好
      为 0 也不会造成除零(cs_regres 内部用方差做分母、不是直接做比值,方差为 0 时直接给 beta=0,不会爆点——这正是
      本位专门避开"用 div 去除一个会过零的量"这个 round 1 analysis.md §2.2 点名的陷阱的原因,没有在任何种子里写
      div(day_quantile_q25(Ret), day_std(Ret)) 这种裸比值);day_median(Ret)、day_quantile_q75(Ret) 与核心本身
      都是同一个排序统计量家族,输入有限则输出必定有限,没有新的除法或开方;cs_bucket_demean 的两个分桶变量同
      round 2 已验证的写法(div(day_sum(Amt), day_sum(Volume)) 的分母在停牌日整日 NaN 被有效性位掩掉不是 0/0;
      ListAge 是日频叶子不参与除法);所有窗口(5/20/60)都 ≤60,不落在热身期主导的区间;没有用到 t 日收盘后才知道
      的信息。
