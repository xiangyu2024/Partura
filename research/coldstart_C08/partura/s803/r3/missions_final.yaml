- head: cross_mean(sqrt(cs_mask_top_replace_mean(mul(5, ts_decay_linear(sqrt(cs_mask_top_replace_mean(mul(5,
    neg(day_centroid(Amt))))), 5)))), 15)
  why: 本轮 loc.json 自带的 11 次拆解只测过"去掉某一层"(sufficiency/knockout/swap/window),没有测过"交换两层的
    顺序"。目前的顺序是:先对 day_centroid 取第一次掩码替换均值并开方,再做 5 日线性衰减,再乘 5、做第二次掩码 替换均值、开方,最后 15
    日滚动平均——衰减在先,第二次掩码在后。拆解表给出的数字是:单独去掉衰减这一层, 必要性 +0.31(有实质影响);单独去掉第二次掩码这一层,必要性 ≈0.00(几乎无影响)。但第二次掩码必要性≈0
    很可能是因为它操作的对象(衰减之后的信号)已经被 5 日平均抹掉了尖锐的异常值,掩码自然没什么可裁;如果把顺序 换成"先做第二次掩码、再衰减",这次掩码面对的是衰减之前更原始、更尖的异常值,必要性未必还是
    0——这是"第二次 掩码到底是不是废料"这件事唯一还没有被两种顺序都测过的维度,直接评估拿到真实数字,好过继续沿用"必要性≈0所以 它是废料"这个只在一种顺序下成立的结论。
