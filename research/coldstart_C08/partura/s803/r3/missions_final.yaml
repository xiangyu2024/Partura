- head: neg(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt)))))
  why: round 2 的 R 已经测过"换成裁另一侧"和"裁完一次后再裁对侧"两种,都比原 head 差很多(R_prev.json:score −0.37
    与 −0.18,远低于原 head 的 +0.56)。但还有一种组合没测过:**同一侧再裁一次**——不换侧,就是把 cs_mask_top_replace_mean
    对同一个量连续套两次,中间不插入任何其他运算。本轮的 head1(+1.34)恰好也是在 第一次掩码和第二次掩码之间插入了 5 日线性衰减才变强的;如果"连续同侧两次掩码、不插入衰减"本身就已经比单次
    掩码好,说明是"多裁一轮极值"这个动作本身在起作用;如果和单次掩码几乎没有差别(或更差),说明 head1 真正起 作用的是中间那层衰减,不是第二次掩码本身——这能把
    head1 新增的两个部件(衰减、二次掩码)的贡献拆开看,是 E 位种子 1(cs_regres(head1, head2))的一个廉价互补检验。
