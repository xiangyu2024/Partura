R:
- head: neg(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt)))))
  why: 拆解表的 knockout 行已经测过:换掉内层 neg(必要性 0.93,方向决定一切)和去掉外层 mul(5,·)(必要性 0.003,可有可无,
    score 从 0.5594 变 0.5564)。但 loc.md 自带的 6 次付费评估只测了"裁剪当前这侧尾部 vs 不裁剪",没有测过"裁另一侧 尾部"或"两侧都裁"。当前裁掉的是
    −5×day_centroid(Amt) 的最高 10%,也就是原始 day_centroid(Amt) 最低的 10%—— 资金几乎全部压在开盘一两分钟的那批股票,猜测是集合竞价撮合机制或单笔大额委托的机械印记;完全没检验过另一个极端——
    day_centroid(Amt) 最高的 10%(资金几乎全部挤在收盘前,可能是尾盘涨停封板、临收盘脉冲单或盘后消息前的尾盘抢筹)是否 同样该裁、或者该不该反过来裁。两个变体分别测"换一侧裁"和"两侧都裁"。
  variants:
  - neg(cs_mask_top_replace_mean_neg(mul(5, neg(day_centroid(Amt)))))
  - neg(cs_mask_top_replace_mean_neg(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt))))))
