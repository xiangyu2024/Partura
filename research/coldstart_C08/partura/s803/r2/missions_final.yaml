  core: cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt))))
  hypothesis: '机制:核心回答的是"这一天的资金几点钟到",不是"有多少资金"。day_centroid(Amt)∈[0,1] 是以成交额为权重的分钟位置重心,
    0=全部在开盘、1=全部在收盘;cs_mask_top_replace_mean 把 5×(−重心) 的截面最高 10%(=重心最低、即资金最早到的那一档股票)
    按日替换成当日截面均值。round 2 loc.md 的拆解已经给出数字:单独用 neg(day_centroid(Amt)) 当因子 score 只有 +0.41
    (train 1.05 valid 0.41);加上这道"裁掉最极端早盘集中股"之后升到 +0.56(train 0.97 valid 0.56);knockout
    显示 裁剪方向的必要性高达 0.93(裁反了直接变成 −0.37),而 mul(5,·) 这个缩放常数必要性只有 0.003(可有可无,大概是 GP 变异留下的废料);swap
    Amt→Volume 后几乎不掉分(+0.51),说明读的是"资金/股数到达的时点"这件事本身,不是 Amt 这个字段 的特有量纲。把这些数字拼起来,最合理的解释是:大部分股票的"早盘集中度"是一个连续、有信息的横截面变量——越早集中,越像
    知情/机构资金在信息不对称刚结束时下单(Admati & Pfleiderer 1988 的理论预测知情交易集中在信息最不对称的时段,随意型/ 流动性驱动的交易在日内分布更均匀;Foster
    & Viswanathan 1990 把这个预测推广到日间维度,知情程度随个股与时间系统性变化); 但分布最极端的那 10%(几乎全部成交压在开盘集合竞价的一两分钟)另有成因——大概率是单笔大额授信盘/集合竞价撮合机制本身的
    机械印记(Barclay & Warner 1993 的"隐蔽交易"证据:知情交易者偏好中等规模、分散到若干分钟完成的委托,而不是一次性在 开盘打满;一次性全压开盘更像机制性建仓而非策略性知情交易),把这批"假早盘"替换成当天均值,相当于把机制噪声从策略信号里
    摘掉,这正是 sufficiency/knockout 数字组合出的那条线。 算子怎样实现(围绕固定核心长外围,核心原样照抄,不碰核心本身): 1) "相对自身习惯的意外":sub(核心,
    cross_mean(核心,60)) 与 sub(核心, cross_mean(核心,20))——同一只股票平时的早盘 集中度是持续的个股习惯(换手慢),只有"今天比平时更早"才是新鲜事件,这是与现有
    head(读水平)结构不同的处理; 2) "钞票 vs 股数,谁更早":cs_regres(核心, 用 Volume 重跑同一套核心)——把"钞票到达的时点"里能被"股数到达的时点"
    解释掉的部分去掉,剩下的近似"平均每笔的金额有多早到",比单纯 swap 字段更贴近"谁在交易"; 3) "早盘资金是否也伴随早盘的意外波动":用 day_corr(in_index(Amt),
    abs_(Ret)) 做"波动是否也前置"的独立量,与核心 相加,或对核心取回归残差,检验知情交易的时点标记是否在"钱"与"信息冲击"两条线上一致; 4)
    "买压时点版本":对核心做 cs_regres,去掉 20 日净买压 day_signed_ratio(Ret,Amt) 能解释的部分,把"何时"与 "谁净买入多少"两件事分开;
    5) 两个代理自检:cs_bucket_demean(核心, div(day_sum(Amt), day_sum(Volume)))——用当日"实际成交额/实际成交股数"
    这个未经复权调整的真实名义价格分桶去均值(round 1 审计员 audit_1.yaml 对另一位的"不挡但请留意"里给出的具体构造), 直接排除名义价格/最小变动价位的混淆;cs_bucket_demean(核心,
    ListAge)——排除次新股的混淆(本环境的多头书没有剔除 次新股,round 1 analysis.md 专门点出这条);再留一条 sub(核心, 上面按名义价分桶去均值的版本)当诊断:如果这一项本身
    接近原始分数,说明核心更多是价格水平的代理,如果很小,说明核心的信息主要在桶内; 6) 窗口敏感性:cross_mean(核心,5)、cross_mean(核心,10)——核心本身没有任何多日平滑(全靠打分器自己的
    EMA hl=20),显式叠一层滚动平均,检验信号在更短或更长的持续窗口上是否更稳; 7) 市场状态翻转:cs_flip_by_state(核心, day_sum(Amt))——全市场成交清淡时,"早盘资金集中"的含义可能不同(清淡市场
    开盘的那几分钟更容易被少数大单支配,而不是知情资金的系统性选择),检验信号是否只在成交活跃状态下有效。 为什么和库里已有的不同:库里唯一的 head 就是这个核心本身(来自
    c08s803Pr1b_Nb);本位所有外围都是"核心 + 一个全新的 算子关系"(自身历史差分、与另一字段的回归残差、与名义价格/上市年龄分桶去均值、市场状态翻转、窗口平滑),没有一个只是
    把 neg/mul 这类单调包装换一下——那种写法已经在快照里出现过(就是 head 本身)。 为什么样本外还会在:知情交易在信息不对称刚打开时集中下单,是关于"谁在交易"的持续性市场结构特征,不依赖某一段行情;
    A 股 T+1、融券受限意味着这批"早盘知情货"不能被及时反向交易打掉,价格要几天才消化完,这和我们 15bp 成本、半衰期 5/20 的尺子吻合。用自身历史差分、去掉名义价格和上市年龄的那几个变体,专门是为了把"这其实只是价格水平或次新股代理"的那部分
    风险剔出去——如果样本外仍有效,更可能是真实的时点结构而不是代理。 数学检查:day_centroid 的 ok=isfinite 掩码把无效分钟置 0,按
    tot>0 判定有效性,不会 0/0;cs_mask_top_replace_mean 用 integer_rank>(count−n_top) 做掩码,count
    由 mask.sum 得到、n_top=ceil(count*0.1),不会除以 0;cs_regres 的 beta 只在 var>EPS 时计算,否则给
    0,不会爆点;cs_bucket_demean 的分桶变量 div(day_sum(Amt), day_sum(Volume)) 分母 在有成交分钟的日子严格大于
    0(停牌日 Volume 整日 NaN,day_sum 返回 NaN,被 _day 的有效性位掩掉,不是 0/0 爆点); ListAge 是日频叶子,不参与任何除法;day_corr
    分母带 EPS;新增窗口(5/10/20/60)全部 ≤60,热身期不主导;没有用到 t 日收盘后才知道的信息。'
