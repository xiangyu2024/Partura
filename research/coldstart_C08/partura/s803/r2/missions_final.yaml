- type: N
  hypothesis: 机制:分钟收益的弹性——价格被推开之后能不能弹回来。做市商/限价盘承接单边订单流会在买卖价之间来回跳(Roll 1984 的隐含 价差模型:lag-1
    自相关为负,幅度与有效价差正相关),这个"弹跳"的强弱是流动性的一个无量纲标记。它的水平(某只股票平时 弹跳多大)几乎就是这只股票平时有多活跃/多大,属于流动性水平和市值,这两者已经是控制;但它的冲击——某几天比平时明显
    更弹、价格路径的不同价位数骤降、日内从趋势变成均值回归——是流动性的一次性收紧,按 Amihud & Mendelson 1986 的流动性 定价逻辑和 Pastor
    & Stambaugh 2003 对流动性冲击(不是流动性水平)定价的证据,冲击之后流动性溢价会在随后几天修复, 这是一个关于"水平的跳变"而不是"水平"的持续性事件。
    算子怎样实现:(1) 弹跳强度 day_autocorr_n1(Ret)(lag-1 自相关,[-1,1] 有界,分母带 EPS);(2) 同一机制的 OLS
    版本 day_ar1_coefficient(Ret)(分母 var_x>1e-8 才算);(3) 做市商报价密度的代理 day_distinct_ratio(Close)(当天走过的
    不同价位数 / 分钟数,partura/ops_ext.py 自己的文档写明它在低价股上会因为最小变动价位变粗,这是本位专门要控制的那个 混淆);(4) 第三个独立视角
    day_hurst(Ret)(R/S 法,<0.5 代表均值回归/弹性占优,S≥1e-9 才给值);(5) 每个诊断量都取 sub(cross_mean(·,5),
    cross_mean(·,60)),用"最近 5 日均值 − 最近 60 日均值"把持续性的"这只股票平时弹不弹"这个 水平成分从两边相减抵消掉,只留"最近是不是比平时更弹/更冻/更均值回归"这个冲击;(6)
    对冲击版本再做一次 cs_bucket_demean,分桶变量是 div(day_sum(Amt), day_sum(Volume))——当日总成交额/总成交股数,是没有经过后复权调整
    的当天真实名义价(Close/Vwap 等价格字段都是后复权价,排序约等于累计收益,不是名义价;round 1 审计员 audit_1.yaml 对另一位的建议正是用这个量构造名义价代理),直接排掉价位粗细造成的混淆,这是本族(round
    1 analysis.md 称为"族 C") 专门标注过、也是三个诊断量里最大的代理风险;(7) 用 cs_regres 把弹跳冲击里能被"走过的价位数"冲击解释掉的部分去掉,
    留下更干净的"价格路径弹性冲击",排除"这只是今天走的价位少"这个更机械的解释;(8) 保留一个不做差分的水平版本 cross_mean(day_autocorr_n1(Ret),20)
    当自检对照——如果这个版本因为与流动性控制 |ρ|≥0.8 被自动划掉而差分版本留下, 恰好证明差分确实把水平成分滤掉了。 为什么和库里已有的不同:库里唯一的
    head 读的是"资金几点钟到"(时点,一阶的"何时");控制 2 (cross_mean(day_std(Ret),20))是波动的大小,已知族(cross_mean(day_std(Amt),30))是成交额日内离散度的大小,都是
    "有多大/多散"的水平量,对它们做单调缩放不改变自相关系数、Hurst 指数或 distinct_ratio(它们本来就是无量纲的);本位 再用短窗减长窗的差分把持续性的流动性水平也抹掉,剩下的是"价格微观结构比平时更紧还是更松"这件事本身在时间上的跳变,
    这是五个控制和现有 head 都没有覆盖的维度。round 1 的两个 N 位分别做了分钟收益分布的三阶/不对称(彩票偏好)与量价的 同期/领先滞后相关(Llorente),本位是分钟收益序列本身的一阶时间结构(弹性/均值回归),三者在数学上互不嵌套。
    为什么样本外还会在:流动性冲击后的修复是流动性提供者对单边订单流的一次性定价行为,只要市场里流动性供给仍然有限 (A 股的 T+1、融券受限意味着流动性提供者不能靠卖空迅速对冲单边压力,冲击消化得比没有这些限制的市场更慢),这个修复
    窗口就会存在,不依赖某一段具体行情;15bp 成本 + 半衰期 5/20 的尺子正好匹配"冲击后几天修复"这种持续性,而不是当天 就结束的噪声。 一个诚实的提醒:round
    1 notebook 原计划"族 A(时点)机制应该最强",但实际把 head 做出来的恰恰是 round 1 没有选用、 而是 GP 自己随机长出来的时点族;本位选的"弹性冲击"在本轮
    loc.json 的 enrichment 表里没有任何经验证据支持(完全没 出现 ar1/autocorr/hurst/distinct_ratio 任何子树),是纯粹的先验机制推理——round
    1 的教训提醒要谨慎,所以刻意把 "自身历史差分""名义价格分桶""去掉价位数冲击能解释的部分"这三层自检都写进种子里,而不是只交一个裸的自相关水平。 数学检查:day_autocorr_n1
    用 pair_mask 配对、分母 sqrt(var_t*var_lag+1e-8),价格整天不动时直接 NaN 而不是爆点; day_ar1_coefficient
    的 phi 只在 var_x>1e-8 时计算,否则 NaN;day_hurst 要求 S≥1e-9 才给值,R/S 不会除以 0; day_distinct_ratio
    的分母是 n.clamp(min=1),count≤1 时整行给 NaN;cs_bucket_demean 的分桶变量同 E 位, day_sum(Volume)
    在停牌日整日 NaN 被有效性位掩掉,不是 0/0;cs_regres 的 beta 只在 var>EPS 时非零;所有窗口 (5/10/20/60)≤60,不落在热身期主导的区间;没有用到
    t 日收盘后的信息。
