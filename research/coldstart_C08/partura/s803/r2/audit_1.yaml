attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 2, 4, 5, 6, 7, 8, 9]
    reasons: >-
      核心 cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt)))) 与五个控制的 |ρ| 全部 <0.2
      (liq 0.18 / vol 0.11 / rev 0.07 / known 0.18 / size 0.09),满足 E 位"核心与每个控制 |ρ|<0.8"
      的附加要求。12 个种子里 seed1/2/4/5/6/7/8 与库里唯一 head 的原始秩 |ρ| 分别是
      0.93/0.90/0.99/0.99/0.95/0.97/0.99,全部 ≥0.7,按 §3 确定性规则自动划掉——这正是 GP 库禁令本来就会拒绝
      的候选,不是审计员的主观判断。看一下它们的构造就知道为什么:sub(核心,cross_mean(核心,60/20))、
      cs_bucket_demean(核心,名义价/ListAge)、cs_regres(核心,day_corr(in_index(Amt),abs_(Ret)) 相关量)、
      add(核心,同上)都只是在"核心自身的截面结构"上做了一个幅度很小的修正(60/20 日均值差、按名义价或上市
      年龄的桶内去均值、去掉一个解释力有限的外部量),核心的量级和排序结构仍然主导结果,所以修正后还是高度
      相关于 head 本身——这是本位外围设计的一个系统性弱点,真正能把相关度打下来的只有 seed3(cs_regres 用
      Volume 版核心去解释 Amt 版核心,ρ_head 原始 0.08、残差 0.03,见证"钞票到达时点"里大部分信息其实能被
      "股数到达时点"解释掉)和 seed12(cs_flip_by_state 按市场成交状态翻转,ρ_head 原始 0.21、残差 0.28)。
      seed9 = sub(核心, cs_bucket_demean(核心, div(day_sum(Amt),day_sum(Volume)))) 代数上恒等于
      "核心在当天名义价分桶里的桶内均值"本身(cs_bucket_demean(y,x) 定义就是 y 减去 y 在 x 所在桶的均值,
      两者相减自然剩下那个桶均值),一天只有 10 个桶、几千只股票共享这 10 个数,这正是 §4"数值伪影:面板几乎
      是常数"——相关度表自己也用 gate=false、distinct=0.003 标出了这一条(其余 11 个种子 distinct 普遍
      ≥0.79,核心本身 0.90),划掉。划完还剩 4 个种子(3/10/11/12),刚好压线过"≥4 个种子"的门槛。
      需要特别提醒:seed10=cross_mean(核心,5)、seed11=cross_mean(核心,10) 原始 ρ_head 只有 0.50/0.40,
      没有踩 0.7 的自动线,但残差 ρ_head 高达 0.96/0.93——打分器本身就会对候选做半衰期 0/5/20 的 EMA,这两个
      种子只是在核心上又叠一层简单滑动平均,真正算出残差纯多头分数后基本就是 head 自己,是"head 换皮"的边界
      情况。没有踩 §4 的数学红线也没到 0.7/0.8 的自动线,按"只挡数学问题和明显重复"的原则这次不单独划掉,
      但 PI 应该知道:本位真正"新增的、独立的"探索其实只剩 seed3 和 seed12 两条,离下限很近,建议后续这类
      核心主导型 E 位多准备几条"结构性改变排序"的外围(回归残差、非线性分桶、翻转一类)备用,而不是单纯的
      窗口平滑或小幅修正。
      合理度:机制(Admati-Pfleiderer 知情交易集中在信息不对称最大时段,配合 Barclay-Warner 的隐蔽交易证据
      把"整段压在开盘"的极端尾部单独处理)讲得通,每个外围算子都逐一核对过源码——cs_mask_top_replace_mean
      的 top_mask 用 integer_rank>(count-n_top)、n_top=ceil(count*0.1),count=0 时 top_mask 全假,
      不会除 0;cs_regres 的 beta 只在 var>EPS 时非零;cs_bucket_demean 按 div(day_sum(Amt),day_sum(Volume))
      分桶,停牌日 Volume 整日 NaN 时 day_sum 的实现(_sum: isfinite(x).any() 为假则整行 NaN)直接返回 NaN,
      不是 0/0;day_corr 分母带 +EPS;新增窗口 5/10/20/60 全部 ≤60,热身期占比很小。除 seed9 这一个代数上
      必然退化的特例外没有发现别的数学问题。
      如果这个位有 alpha,最可能来自 seed3(把"钞票到达时点"里能被"股数到达时点"解释掉的部分去掉,剩下的更
      接近"平均每笔金额多大/多早到",是更贴近"谁在交易"的代理)和 seed12(早盘集中度的信息含量可能只在市场
      整体成交活跃时才站得住,清淡市场开盘的集中更可能是缺乏对手盘的机械结果,而不是知情交易的系统选择)。
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: >-
      12 个种子与库里唯一 head 的原始秩 |ρ| 全部 ≤0.10(最高是 seed12 的 0.10),与五个控制的 |ρ| 全部
      <0.52(最高是 seed3/seed6 的 0.51,对应 20 日反转;其余大多 <0.3),没有一个触及 §3 自动划掉的
      0.7/0.8 红线,12 个种子全部保留,也没有发现别的数学或重复问题。loc.json 的 enrichment 表核对后确认:
      M 两批候选里完全没有出现 day_autocorr_n1/day_ar1_coefficient/day_hurst/day_distinct_ratio 任何
      子树——是空白而不是试过无效,所以"日内收益一阶时间结构(弹性/均值回归)"相对现有 head(读"钞票几点到")
      和五个控制(流动性水平、波动水平、20 日反转、成交额日内离散度水平、市值)确实是没被覆盖过的维度,给 4
      (真正新的维度,不是某个 head 或控制换了写法)。
      合理度:核心机制是 Roll (1984) 的隐含价差弹跳,四个诊断量逐一核对过源码——day_autocorr_n1 用
      pair_mask 配对、分母 sqrt(var_t*var_lag+1e-8) 不会除 0;day_ar1_coefficient 的 phi 只在
      var_x>1e-8 时给值;day_hurst 要求 S≥1e-9;day_q_stat_std 的 max_lag 被 clamp 到 ≤T-1,循环是固定
      步数的拟合循环不是逐窗口循环;day_distinct_ratio 分母 n.clamp(min=1)。用"5 日均 − 60 日均"把"这只
      股票平时弹不弹"的持续性水平成分抵消掉只留冲击,构造本身没问题,窗口全部 ≤60。
      一点诚实的提醒:round 1 的教训(族 A 按先验判断"应该最强",结果真正成 head 的是 GP 自己随机长出的、
      round 1 没选用的时点族)在这里有重演的风险——loc.json 的 enrichment 表对本位四个诊断量完全没有经验
      支持,是纯先验机制推理;但这不是 §4 定义的数学问题,样本外站不站得住不能作为挡的理由。另外 PI 自己设的
      自检假设("cross_mean(day_autocorr_n1(Ret),20) 应该因为与 liq 控制 |ρ|≥0.8 被自动划掉"对应 seed7)
      没有发生——实测 liq 只有 0.38,seed7 仍正常保留,这个自检没有按 PI 预想的方式给出证据,提醒 PI 这条
      自检本身的证据力比预想弱,但不影响本位通过。
      如果这个位有 alpha,最可能来自"短窗减长窗"之后剩下的那部分——价格微观结构最近是不是比平时更紧或更
      松的一次性跳变,而不是这只股票平时弹不弹的水平;A 股 T+1、融券受限意味着流动性提供者不能靠做空对冲
      单边压力,这类冲击的修复会比没有这些限制的市场慢,正好落在 15bp 成本和 5/20 半衰期的尺子能接住的区间。
    revise: '—'
R:
  - head: 'neg(cs_mask_top_replace_mean(mul(5, neg(day_centroid(Amt)))))'
    soundness: 4
    reasons: >-
      直接对应 loc.md"拆解(6 次评估)"里留下的空白:knockout 只测过把内层 neg(day_centroid(Amt)) 的方向
      换掉(必要性 0.93,score 从 +0.56 掉到 -0.37)和去掉外层 mul(5,·)(必要性 0.003),从未测过"换成裁剪
      day_centroid(Amt) 最高的 10%(资金压在收盘前,可能是涨停封板或尾盘脉冲单)"或"两侧都裁"。两个变体
      都用已经存在、经源码核对正确实现"裁下尾"语义的 cs_mask_top_replace_mean_neg(x) = -cs_mask_top_replace_mean(-x,...)
      (negate-flip-negate,掩码构造与核心本身共享同一套 ceil(count*0.1)/integer_rank 逻辑,不会除 0)
      精确实现这两个新假设:variant1 把裁剪整段换成"只裁收盘前集中的那一侧"(mul(5,neg(centroid)) 的最低
      10% 对应 day_centroid 最高的 10%),variant2 在保留核心原有开盘端裁剪的基础上再叠一层收盘端裁剪
      (两侧都裁)。相关度表显示两个变体与现有 head 的原始 ρ 分别是 0.76/0.92(残差 0.84/0.95)、与已知族
      的 ρ 分别 0.16/0.16,都在 R 规则"与已知族 |ρ|<0.5"的候选区间内,高相关于原 head 正是"替换"路径所
      期待的(只改了一个具体部件),数学上没有引入新风险。
      如果它有 alpha,最可能来自对两种不同机械印记(开盘集合竞价大额单 vs 收盘前涨停封板/尾盘脉冲单)做
      不对称处理之后,把"机制噪声"从"知情交易时点信号"里摘得更干净。
summary: >-
  两个任务位都通过:E 位(slot a)12 个种子划掉 8 个——7 个因与现有唯一 head 的原始秩 |ρ|≥0.7 被 §3
  确定性规则自动挡掉(本质是外围只对核心做了小幅修正、核心结构仍主导),另 1 个(seed9)因代数上恒等于
  当日名义价分桶均值、面板几乎是常数被挡掉,划完刚好剩 4 个压线过线,其中 seed10/11 残差 ρ 高达
  0.93-0.96 属于"head 换皮"边界情况但未踩自动线,未划但已提醒 PI;N 位(slot b)12 个种子全部保留,
  与 head 和五个控制的相关度全线很低,是 loc.json 确认过的真正空白维度;R 组合理度 4,两个变体直接填
  loc.md 自己留出的"knockout 只测过一侧裁剪"的空白,构造复用已核对过的掩码算子,无新数学风险。
