    reasons: '创新度:快照 0 个 head;种子与控制的最大 |ρ| 为 rev 0.58(种子 3)、0.56(种子 11)、0.53(种子 2),liq / known 0.43(种子 6),都远低于 0.8,且反转的线性 / U / S 形暴露在奖励里会被去掉,不算重复;量与价的联合关系(同期相关、先后次序、按涨跌切分成交额)不在 5 个单变量控制里,相对本库是新东西;量价相关性在 A 股实务里是成熟族,给 4。
      合理度,逐个算子核对:day_corr = cov / (sqrt(var_x·var_y) + 1e−9),价格整天不动时 cov = 0,结果为 0 而不是爆点;in_delay(Ret, 1) 在分钟轴上第 1 分钟给 NaN,不跨日拿昨天尾盘;in_logchg(Volume, 1) 遇零成交分钟给 NaN;day_signed_ratio(Ret, Amt) 是 tick 规则的成交额净占比,有界于 [−1, 1];in_zscore_expand 只用当天至今的分钟、且含当前分钟,所以 |z| ≤ √(n − 1),不会除以零,零波动段 z = 0、sigmoid = 0.5,BVC 份额有界;day_skew(mul(Ret, Amt)) 有界于约 √n;cross_corr 走 rolling_pair_reduce,有 EPS 保护,day_mean(Ret) 的 20 日方差 ~1e−8 乘 day_sum(Amt) 的方差 ~1e16,远大于 EPS;cs_flip_by_state 的 241 日状态在训练期前几个月按不足窗口的历史分位判定,仍是因果的,只影响一小段,不是热身期决定结果。无前视;coverage 0.999。
      划掉种子 9:cross_stddev(day_corr(Close, Volume), 20) 与已知族 cross_mean(day_std(Amt), 30) 的 |ρ| = 0.50、与流动性 0.50,正落在 §1「与已知族 |ρ| ≥ 0.5 判为不合格」的线上;机制上,20 日里日度相关系数的离散主要是估计噪声,噪声随有效分钟数(零成交、价格不动的分钟越多越少)下降而变大,所以它度量的基本是成交稀疏程度,即流动性 / 已知族的换写法,按重复划掉。种子 10(5 日减 60 日的变化)保留了「耦合不稳定」的想法,且与所有控制 |ρ| ≤ 0.14。
      不挡、但请留意:(i) 分钟成交量是 U 形,开盘与尾盘集合竞价那两根最大,day_corr(Close, Volume) 很大程度上读的是「开盘价、收盘价相对当日均价的高低」(价格路径是 U 形还是倒 U 形),不完全是「谁在交易」;种子 2–5 用收益而非价格水平,受此影响小,是更贴近假设的写法。(ii) 种子 14 在全市场层面整天翻转整本书,状态在中位数附近来回时,半衰期 0 的书换手很高,15 bp 成本下要靠半衰期 5 / 20 的 EMA 吸收。
      如果它有 alpha,最可能来自:成交集中在日内低价位 / 下跌分钟(承接型、提供流动性)的股票被暂时压低、随后修复,纯多头书持有的正是这一侧;追涨型成交(价格领先成交量)的股票随后回吐,则只能通过不持有它们间接体现。'
    revise: '—'
