    reasons: '创新度:loc.md 里快照 0 个 head,只能与 5 个控制比。种子 1–11 与控制的最大 |ρ| 是 rev 0.49(种子 2 RSJ 0.488、种子 10 收盘位置 0.491),其余 ≤ 0.42(种子 5 峰度对 size 0.42),没有一个是控制的换写法;分钟收益分布的三阶 / 符号不对称确实不在 5 个控制里(20 日反转是一阶,波动与已知族 cross_mean(day_std(Amt), 30) 是二阶水平,市值是规模),相对本库是新东西;但已实现偏度在文献里是成熟因子,给 4 不给 5。
      合理度,逐个算子核对:day_skew = mean(((x − m) / std)^3),div 不加 EPS,整天一价时 0/0 = NaN,cross_mean 用 nanmean 跳过,不爆点,样本偏度本身有界于约 √n ≈ 15;day_kurt 同理(锁死日 NaN);day_signed_ratio(Ret, mul(Ret, Ret)) = Σ sign(r)·r² / Σ r²,恰好就是 Bollerslev 等的 RSJ,有界于 [−1, 1];div(day_max(Ret), sub(day_max(Ret), day_min(Ret))) 与 (High − Close)/(High − Low) 有界,分母为 0 时分子也为 0,得 NaN;ts_skew 用 m3 / (std³ + 1e−9),日收益 std ~ 0.02 时 std³ ~ 1e−5,EPS 不会把它压成常数;Close 是后复权价,div(day_last(Close), ts_delay(…, 1)) 不受除权缺口影响;所有窗口 ≤ 60,只用 t 日分钟、t+1 交易,无前视;coverage 0.997–0.999、distinct ≥ 0.998,没有系统性算不出。
      划掉种子 12:sub(cross_semistd_pos(day_last(Close), 20), cross_semistd_neg(…, 20)) 与 20 日反转 |ρ| = 0.87 ≥ 0.8,按 §3 自动划掉(相关度表的「门槛」列只查 head,所以写着「过」);机制上 20 日上 / 下半偏差之差本来就是累计收益的变形。
      不挡、但请留意:(i) 种子 11 用 day_last(Close) 分价格十分位做 cs_bucket_demean,而 Close 是后复权价(§4),排序约等于「基期以来累计收益 × 名义价」,不是名义价,所以它消不干净最小变动价位造成的机械偏度,「真来源 vs 价格代理」的对照偏弱;要做这个对照,名义价可用 sub(LogFloatCap, LogFloatShares) 或 div(day_sum(Amt), day_sum(Volume))(成交量未复权时)。(ii) 种子 6 的 day_es_ratio_hi / lo 只在 |分位数| ≤ 1e−8 时置 NaN;有缺失分钟时 nanquantile 会在 0 与 1 个 tick 之间插值出零点几个 tick 的分位数,稀疏低价股的个别日子比值可到 20 倍,20 日 cross_mean 会被这一天拉动;但两端对称、与 liq / size 的 |ρ| 只有 0.02 / 0.10,奖励又去掉了控制的 U 形暴露,够不上「爆点支配截面」,不划;若 GP 后代被它主导,可换成 cross_med。(iii) 种子 4 的 in_logchg(Close, 5) 是逐分钟重叠的 5 分钟变化,不是不重叠的 5 分钟采样,有效样本约 48;种子 3 的 in_logchg(Vwap, 1) 只去掉了第 1 分钟本身,第 2 分钟的变化仍以含集合竞价的第 1 根均价为基。这些都不是数学问题。
      如果它有 alpha,最可能来自:散户的彩票偏好加上融券受限、T+1,让日内右偏 / 上跳主导的股票被高估;纯多头书只能持有其反面(左偏、下跳主导、被冷落的股票),所以样本外预期弱于多空文献值,但来源是行为性的,不依赖某段行情。'
    revise: '—'
