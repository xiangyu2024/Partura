  按严格标准两个 N 位都过。a(偏度 / 彩票):创新度 3、合理度 4,划掉 5、10、11,剩 8 个种子;b(量价对齐):创新度 3、合理度 3,划掉 12、13,剩 11 个种子。
  库是空的,两个位用的都是文献里成熟的机制(高频偏度与 RSJ、CPV 量价相关),所以创新度只到 3。
  主要扣分点:a 的价格分桶用了后复权价,没有实现计划声明的价位离散对照;b 的文献映射不准(Llorente、Gao、BVC 的写法)。没有 R 组。
