# 旁听的严格审计员(rules_strict.md),只打分、不拦截;打的是 missions_final.yaml 里实际要跑的计划。
# 种子序号按 missions_final.yaml 的顺序(1 起)。相关度表 corr_1.md 是按草稿算的:
# 草稿 slot a 的 seed 12(rev 0.87)与 slot b 的 seed 9(cross_stddev)已不在定稿里,所以定稿 b9..b13 = 表里 b10..b14。
slots:
  - slot: a
    type: N
    novelty: 3
    soundness: 4
    struck_seeds: [5, 10, 11]
    reasons: >-
      创新度 3:loc.md 里库为空(0 个 head),能比的只有 5 个控制。输入是分钟 / 日收益,与波动、20 日反转两个控制属于同一类输入;
      机制是三阶矩 / 符号不对称,与控制(一阶反转、二阶波动与成交额离散度、水平量)不同,按严格标准是「同一类输入但机制不同」= 3。
      已实现偏度(Amaya et al. 2015)、RSJ(Bollerslev, Li & Zhao 2020)、MAX(Bali et al. 2011)在文献和 A 股「高频偏度」实践里都是成熟因子,
      所以给不到 4/5。相关度表:与控制的最大 |ρ| 是 seed2 和 seed10 的 rev 0.49、seed5 的 size 0.42,其余都 ≤ 0.34,不是控制换个写法。
      合理度 4:机制(概率加权的彩票偏好,加上融券受限、T+1)清楚。核心种子 1、2、3、4、7、9 逐个核对过算子,确实实现了它:
      common._skew 用 torch.divide、没有 EPS,日方差为 0 时给 NaN,值有界于约 √241≈15.5,不会爆点;
      day_signed_ratio(Ret, mul(Ret,Ret)) = Σ Ret²·sign(Ret)/Σ Ret²,正好是 (RS+−RS−)/RV;
      in_logchg(Close,5) 是逐分钟重叠的 5 分钟对数收益,不是计划里说的「5 分钟采样」,但边际分布就是 5 分钟收益,偏度照样能用;
      ts_skew 的 EPS=1e-9 相对日收益 std³≈1e-5 可以忽略;后复权价的日比值跨除权日连续。窗口 20 和 5/60 都合理。
      有 2023-08-08 之前的直接文献证据(Amaya 2015、Bollerslev 2020),所以给 4。不给 5 有两个原因:一是样本外理由(行为偏好、T+1、融券受限)
      是通用说法;二是分钟收益偏度在 A 股还受最小变动价位离散和近封板日影响(一天只剩一两笔跳动时 skew≈±√n),
      奖励的 5 个控制里没有名义价格,这份计划没能可靠区分「真来源」和「价格代理」——本来负责这个对照的 seed11 没有实现它(见下)。
      划掉的种子:
      5 cross_mean(day_kurt(Ret),20):四阶、对称,和本位自己说的「每个种子都是无量纲的三阶或符号不对称量」不符。ops_ext 里 day_flat_ratio 的文档
      写明峰度在冻结盘口上饱和:一天只剩一笔非零分钟收益时,超额峰度约等于 n−5≈236,而正常日只有个位数到十几,
      所以 20 日均值主要读「近 20 日有没有接近封板的日子 / 价格离散程度」,涨停和跌停不分(表里 size 0.42 也指向这一点),不是彩票偏好。
      10 (High−Close)/(High−Low) 的 20 日均值:这是收盘在日内区间里的位置(Williams %R、CLV),属于日内一阶的位置量,表里 rev 0.49;
      计划引用的 Abdi & Ranaldo (2017) 是用收盘价相对高低中点来估计买卖价差的方法,既不预测收益,也不是彩票证据。不符合本位 idea。
      11 cs_bucket_demean(…, day_last(Close)):立方体的 High/Low/Close 是后复权价(AlphaCube tradability.py 的文档写明「后复权」),
      按 day_last(Close) 分十分位并不是按名义价格分组,而后复权价的截面排序约等于自某个基期以来的累计收益(rules §4)。
      所以它没有实现计划声明的「消掉低价股被最小变动价位离散化造成的机械偏度」,计划想要的「真来源 vs 价格代理」对照也读不出来:
      机制说得通,但算子没有实现它。
      剩下 8 个:1、2、3、4、6、7、8、9。两个弱项提醒,不划:seed6 的 ES/分位数比在离散价位下基本是按 tick 计数,超过 95% 分位的只有约 12 个分钟;
      当天分钟数不足 241 时,nanquantile 的线性插值可能让分位数落在 0 和 1 tick 之间,比值随之放大;
      相关度表里它与 5 个控制的 |ρ| 全部 ≤ 0.10,看起来像噪声。seed8 每天只用两笔极值分钟,最大值往往是开盘 bar 或触板的那一分钟。
    revise: >-
      —(按严格标准通过)。若要改进:seed11 的分桶变量换成名义价格的代理(例如 Volume 未复权时用 day_sum(Amt)/day_sum(Volume));
      seed5(峰度)和 seed10(收盘位置)移到别的位,或者另写一个「跳跃 / 封板」位。
    alpha_source: >-
      散户在融券受限、T+1 的条件下买入正偏的股票(分钟级向上跳动多、触过涨停),把价格推高,之后回落;
      纯多头书持有的是另一端:偏度低、方差主要来自向下跳动、被压低之后修复的股票。
  - slot: b
    type: N
    novelty: 3
    soundness: 3
    struck_seeds: [12, 13]
    reasons: >-
      创新度 3:库为空。输入是成交量 / 成交额加收益 / 价格。这些字段分别是流动性控制、已知族 cross_mean(day_std(Amt),30) 以及波动、反转控制的输入;
      新的东西是两者的联合排列和先后次序,5 个控制都不含,所以算「同一类输入但机制不同」= 3。
      日内分钟价量相关的 20 日均值、标准差与趋势就是 A 股熟知的 CPV 量价相关性因子(东吴证券,2020);
      日频的 −corr(价格, 成交量) 是 Kakushadze (2016) 的 Alpha#6。所以给不到 4/5。
      相关度表:b3 rev 0.58、b10 rev 0.56、b2 rev 0.53 偏高,但都低于 0.8;b6 的 liq 和 known 都是 0.43。
      合理度 3:机制(追涨型成交 vs 承接型成交)清楚。核心种子 1、2、3、5、7、9、10 的算子实现了它:day_corr 的分母带 EPS,价格整天不动时给 0 而不是爆点;
      cross_corr 对后复权价格的尺度不变;窗口合理。不给 4,原因是计划给的文献没有直接支持这些预测量:
      Llorente et al. (2002) 用的是 R_{t+1} 对 V_t·R_t 的回归系数,b8 算的是同期的 corr(日内平均收益, 日成交额),两者不是同一个量;
      De Long et al. (1990) 只是理论;Gao et al. (2018) 是市场层面的时间序列结论(开盘半小时收益预测尾盘半小时),推不出截面信号在缩量市要反号;
      b11 的 sigmoid(in_zscore_expand(Ret)) 先减掉了当天至今的平均收益,和 Easley 等人的 BVC(Φ(ΔP/σ),不去均值)不同,
      在强势日里,收益为正但低于当日均值的分钟会被记成卖方。真正直接的 A 股证据(CPV)计划里没有引用。另有 2 个种子的机制有问题(见下)。
      划掉的种子:
      12 cross_mean(day_skew(mul(Ret,Amt)),20):开盘那一分钟(以及收盘集合竞价那一分钟)的成交额是平均分钟的数倍以上,收益通常也最大,
      所以 |Ret·Amt| 的三阶矩被这一两个点主导。这个量实际读的是「开盘 / 收盘 bar 收益的符号」,不是全天资金流的不对称,机制不清。
      13 cs_flip_by_state(cross_mean(day_corr(Close,Volume),20), day_sum(Amt)):本位假说没有给出任何理由说明量价耦合在缩量市会反向;
      算子文档自己就把它定位为一个检验(反号版明显更差,说明信号只在一种状态有效),不是机制;所引的 Gao et al. 也不支持截面反号。
      状态切换那天,整本多头书要从一端翻到另一端,在 15bp 成本下代价很高;241 日窗口的前段是在不足窗口上判定状态(第一天必然判为 HIGH)。机制不清。
      剩下 11 个。两个弱项提醒,不划:b6 corr(|Ret|, Volume) 没有方向,读的是成交量与波动的耦合,和「追涨 vs 承接」只是间接相关;
      b3(反馈交易,预期反转)和 b4(量领先价,预期延续)的预期方向相反,同一位里同时放两种论证可以,方向由 GP 自己选。
    revise: >-
      —(按严格标准通过)。若要改进:把 b8 换成真正的 Llorente 交互项,例如次日收益对 V·R 的滚动回归系数(只能用 t 日及以前的数据);
      BVC 去掉去均值,改用 Ret 除以当天至今的标准差;补上 CPV 的文献出处。
    alpha_source: >-
      成交集中在日内高价或上涨分钟(价格先动、成交量跟上)的股票,是正反馈追涨留下的暂时高估,之后几天回吐;
      成交集中在低价或下跌分钟、被流动性提供者承接的股票,之后修复。奖励已残差掉 20 日反转的线性、U 形与 S 形暴露,
      剩下的是「谁在交易」在个股上留下的持续印记。
