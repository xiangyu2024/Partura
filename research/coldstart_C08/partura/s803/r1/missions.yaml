slots:
  - type: N
    hypothesis: '机制:彩票偏好 / 偏度溢价。在散户占比高的 A 股,投资者愿意为「收益靠少数几次向上跳动实现」的股票(日内分钟收益右偏、上行跳跃占已实现方差的比例高)多付价格,这类股票随后跑输;方差主要来自下行跳动的股票则被压低、随后跑赢。这是分布的「形状」,不是分布的「位置」(反转)或「宽度」(波动)。
      算子怎样实现:每天用当天 241 根分钟收益量分布的不对称,再用 cross_mean(·, 20) 或 5 日减 60 日把它变成持续数日的个股属性(15 bp 成本下只有名次持续的信号才可能留下来)。
      具体写法:(1) 三阶矩 day_skew(Ret);(2) 相对符号跳跃变差 day_signed_ratio(Ret, mul(Ret, Ret)) = (上行半方差 − 下行半方差) / 已实现方差,有界于 [−1, 1];
      (3) 同一偏度换价格路径与采样频率:day_skew(in_logchg(Vwap, 1))(均价路径,滤掉买卖价弹跳、剔除集合竞价那一分钟)与 day_skew(in_logchg(Close, 5))(5 分钟采样);
      (4) 跳跃强度 day_kurt(Ret);(5) 尾部形状之差 sub(day_es_ratio_hi(Ret), day_es_ratio_lo(Ret))(右尾超额 / 分位数 减 左尾,分位数近零时给 NaN 不爆点);
      (6) 上行极值占日内极值区间的比例 div(day_max(Ret), sub(day_max(Ret), day_min(Ret)))(分钟级 MAX 对 MIN);
      (7) 收盘在当日高低区间中的位置 (High − Close) / (High − Low);(8) 换时间尺度:20 日日收益偏度 ts_skew 与日度上 / 下半偏差之差;
      (9) sub(5 日均偏度, 60 日均偏度) 看新近获得的彩票性;(10) cs_bucket_demean(·, day_last(Close)) 在价格十分位内去均值,消掉低价股分钟收益被最小变动价位离散化造成的机械偏度——这一版与不去均值的版本对照,本身就是「真来源 vs 价格代理」的检验。
      为什么和已有的不同:库里目前没有任何 head;五个控制里,20 日反转是一阶矩,波动、成交额水平、成交额日内离散度是二阶量 / 水平,市值是规模。这里每个种子都是无量纲的三阶或符号不对称量:skew、RSJ 与尾部比都把波动的尺度除掉了,对波动做单调放缩不改变它们;控制的线性、U 形、S 形暴露被去掉之后,剩下的正是分布形状。
      为什么样本外还会在:来源是行为性的概率加权偏好,不依赖某段行情;A 股融券受限、T+1,高估无法被及时套利;信号是 20 日平均的个股结构属性,名次持续,换手低。
      数学检查:无前视(只用 t 日收盘前的分钟,t+1 早盘才交易);skew / kurt 在锁死日方差为 0 时给 NaN 而不是爆点;RSJ、max/(max − min)、收盘位置都有界;除法的分母只有整天一价时为 0(此时是 0/0 = NaN);所有窗口 ≤ 60 日,热身期不主导。'
