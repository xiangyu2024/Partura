  - type: N
    hypothesis: '机制:量与价怎样对齐,揭示是谁在交易。同样多的成交,可以集中在日内价格高位 / 上涨的分钟(追涨、正反馈交易:价格先动、成交量跟上),也可以集中在价格低位 / 下跌的分钟(承接、提供流动性)。按 Llorente et al. (2002),投机 / 信息驱动的成交伴随收益延续,对冲 / 流动性驱动的成交伴随反转;在散户占比高的 A 股,前一类主要是正反馈追涨(De Long et al. 1990),留下暂时性高估、之后几天回吐;后一类被压低、之后修复。
      算子怎样实现:(1) 日内量价相关 day_corr(Close, Volume)(成交是否集中在当天的高价位)与 day_corr(Ret, Volume)(上涨分钟是否放量);
      (2) 领先-滞后两个方向分开:day_corr(in_delay(Ret, 1), Volume) = 上一分钟的价格变动是否引来这一分钟的成交(反馈交易);day_corr(Ret, in_delay(Volume, 1)) = 上一分钟的放量是否领先这一分钟的价格(知情交易);day_corr(in_logchg(Volume, 1), Ret) = 量的加速是否伴随上涨;
      (3) day_corr(abs_(Ret), Volume):成交量是否跟着信息(大幅波动)走;
      (4) 无逐笔数据的订单失衡代理,两种分类对照:tick 规则 day_signed_ratio(Ret, Amt)(上涨分钟成交额占比 − 下跌分钟占比)与批量成交分类 day_wmean(sigmoid(in_zscore_expand(Ret)), Amt)(每分钟按当日至今标准化的收益给出连续的「买方发起」概率,再按成交额加权;in_zscore_expand 只用当天至今的分钟,因果);
      (5) 资金流的不对称 day_skew(mul(Ret, Amt));(6) 日间尺度:cross_corr(day_last(Close), day_sum(Volume), 20) 与 cross_corr(day_mean(Ret), day_sum(Amt), 20)(Llorente 的「量 × 收益」交互在 20 日上的版本);
      (7) 耦合的不稳定 cross_stddev(day_corr(Close, Volume), 20) 与 5 日减 60 日的变化;(8) cs_flip_by_state(·, day_sum(Amt)):市场整体放量与缩量时方向是否相反(Gao et al. 2018 发现量能状态改变日内收益的可预测性)。
      为什么和已有的不同:库里目前没有任何 head;全部种子是相关系数、有界比例或偏度,成交额的量纲在分母里约掉,不读成交额的水平或日内离散度(流动性控制与已知族),也不读波动水平或累计收益(波动与反转控制);它读的是量与价的对齐方式与先后次序,这是五个控制都不含的信息。它可能与 20 日反转同向,但反转的线性 / U / S 形暴露在奖励里已经去掉,剩下的只能来自对齐方式本身。
      为什么样本外还会在:投资者结构(散户追涨、T+1、融券受限)是缓慢变化的,量价对齐方式是这种结构在个股上的持续印记;20 日平均让名次持续,换手低。
      数学检查:无前视;day_corr 在价格整天不动时给 0 而不是爆点;signed_ratio 与 BVC 份额有界;in_delay 只用同一天更早的分钟;cs_flip_by_state 的市场状态用 241 日滚动中位数,训练期最初约 180 日是在不足窗口上判定状态,只影响一小段的状态判定,不决定结果;其余窗口 ≤ 60。'
    inspired_by: 'M 第 1 批无 head、共性表为空,所以从奖励口径的空地出发:五个控制都是单一变量的水平 / 离散度(成交额、波动、累计收益、市值),没有一个描述成交量与价格变动的联合关系。文献:Llorente, Michaely, Saar & Wang (2002) 的量-收益动态关系;De Long et al. (1990) 的正反馈交易;Lee & Ready (1991) 的 tick 规则;Easley, López de Prado & O''Hara (2012) 的批量成交分类;Gao, Han, Li & Zhou (2018) 的量能状态。'
