    (alphacube/operators/dt_day.py:228,分母带 EPS,全天价格锁死、方差为 0 时给 0 而不是爆点),恒在 [-1,1]。
    它度量的是「当天的成交是集中在价格被推高的时刻,还是价格被压低的时刻」——与第 1 批唯一稳定的核心 day_centroid(Volume) (成交发生在一天的什么钟表时间)是完全不同的输入:一个看成交相对价格路径的位置,一个看成交相对钟表时间的位置,
    两者在新尺子下的日度排名不会是同一个信号。 【为什么是 alpha 来源】本轮定位里,这个核心自身的富集效应是 +0.77(loc.md 共性表),而且 GP
    在完全独立的演化里 从空白种群里找到了全库目前分数最高的 head(+1.18,cross_max(add(add(5, cross_mean(day_corr(Ret,
    Volume), 3)), cross_mean(day_corr(Ret, Volume), 3)), 60),train +1.18、valid +1.59)。拆解已经把这条
    head 打开过:外层 add(5, X)+X 的加倍包装对分数贡献为 0(knockout 后分数不变,必要性 -0.00),真正的骨架只是 cross_max(cross_mean(day_corr(Ret,
    Volume), 3), 60);去掉内层 cross_mean(.,3)、只用单日值,分数从 1.18 掉到 0.54(必要性 +0.64),说明「先把单日噪声平均
    3 天」是必要的;cross_max 的窗口从 60 换成 30/120 都更差 (0.79/1.00),说明 60 天本身也不是随手选的。但 GP 自己只走出了这一条「均值
    + 滚动最大值」的外围,没有告诉我们 均值和最大值这两步各自对应什么机制、量价共动这件事本身更可靠的维度是方向还是幅度、是整体还是分钟符号、是水平还是 按信息量加权。这次
    E 位要把这些维度分开测。 【这次的外围,机制各不相同】 (1) 频率 vs 幅度:cross_mean(is_gt0(核), 60) 统计过去 60 天里「量价正相关」的天数占比,
    cross_mean(is_lt0(核), 60) 统计负相关天数占比,两者之差是方向一致性(regime 的频率),不是 GP 已经验证过的 「幅度的均值」——同样是
    60 天窗口,但度量的对象完全不同:一只股票可能大多数天小幅正相关、偶尔单日深度负相关 (均值被少数日子带偏),也可能稳定地弱负相关(频率度量更准)。这一组回答「alpha
    在频率里还是在幅度里」。 (2) 意外 / 极值:sub(cross_max(核, 60), cross_mean(核, 60)) 是「最近 60 天里最像追涨的那一天,相对这只股票
    自己的正常水平」,sub(cross_min(核, 60), cross_mean(核, 60)) 是镜像的「最像承接的那一天」。GP 已经验证了 cross_max
    套在 cross_mean(.,3) 外面有贡献,但没有验证 cross_max 本身相对这只股票自己的基线是不是超额的—— 这是用「相对自身历史的异常」框架(Gervais-Kaniel-Mingelgrin),但用在量价共动的极值上,而不是成交量水平上,是新的。
    (3) 迁移与稳定性:sub(cross_mean(核, 5), cross_mean(核, 60)) 是「量价共动 regime 最近有没有在换」(知情
    / 流动性 交易占比切换,Llorente 等人的框架本身就是占比会变),与第 1 批对 day_centroid 做的「习惯迁移」是同一个统计手法, 但这里换的是
    regime(谁在主导交易),不是习惯(交易发生在几点),机制不同。cross_stddev(核, 60) 是这个 regime 本身稳不稳(程序化 / 被动资金每天的量价关系模式稳定,注意力驱动的游资今天追涨明天割肉)。
    (4) 分钟方向的不对称贡献:sub(核, day_corr(mul(Ret, is_gt0(Ret)), Volume)) 和 sub(核, day_corr(mul(Ret,
    is_lt0(Ret)), Volume)) 把全天的相关系数拆成「主要来自上涨分钟」还是「主要来自下跌 分钟」两部分(两项都原样把核心 day_corr(Ret,
    Volume) 写在 sub 的第一个操作数里)。Chen-Hong-Stein 的机制是 放量下跌比放量上涨携带更多关于未来的信息(信息不对称在下跌侧更强);GP
    和第 1 轮 N 位都只测过对称的整体相关系数, 没有测过这种按分钟符号的不对称分解。 (5) 按信息量加权:mul(核, day_std(Ret)) 用当天分钟收益的标准差给相关系数加权——Avramov-Chordia-Goyal
    的思路是 交易活动对收益的影响在信息量大的日子更强,一个大幅波动日里的量价相关系数比几乎不动的日子里同样的相关系数更可信, 数值上也不会被近零方差日子里被
    EPS 拉向 0 的那部分放大噪声。cross_mean(mul(...), 20) 是它的 20 日平滑版。 (6) 必要性基线(复核 GP 自己的结构,不额外花成本去猜):cross_mean(核,
    3) 单独测「只做 3 日均值、不套 60 日滚动 最大值」离 1.18 还差多少;cross_max(cross_mean(核, 3), 30) 测在没有
    add(5,...) 冗余包装的干净写法下,窗口 60 换成 30 是不是仍然更差。这两条是把「哪一步真正起作用」钉死,不是新机制。 【为什么和以前不同】GP
    自己的演化只给出一条「3 日均值 + 60 日滚动最大值」的外围路径(窗口、字段替换都是同一个外围 骨架下的近亲);第 1 轮 N 位测的是 Close 版、30
    日均值版、秩相关版、VWAP/TWAP、领先版、板块分组——全部是 「整体对称相关系数,换一个平滑窗口或字段」。这里的 5 组外围没有一个是「同一个相关系数再换平滑窗口或字段」:
    频率(1)换的是统计量本身(计数,不是求和);极值(2)换的是参照点(自身历史的极值,不是自身历史的均值); 迁移和稳定性(3)换的是被测对象(regime
    切换 / regime 稳定性,不是水平);不对称分解(4)换的是输入(先按分钟 符号筛选,是非线性操作,不是线性平滑);信息量加权(5)换的是组合方式(与同一天另一个有界统计量做乘法交互,
    不是单变量平滑)。 【为什么样本外还会在】核心是 Pearson 相关系数,有界、量纲无关、无参数;外围只用计数比例、自身历史的 max/min/mean、短长均值差、方差、分钟符号筛选、与同日另一个有界统计量的乘法交互——都不是拟合参数,不会因为某个
    具体数值阈值在 2023 年后漂移而失效。机制上,量价共动背后追涨盘的事后回吐、信息不对称在下跌侧更强、被动资金的 稳定执行模式,都由 A 股散户占比高、T+1、机构被动化程度这些结构性事实决定,不依赖某一段具体行情。
    【已知的测量注意事项,不构成数学问题】Ret 的第 0 格(开盘集合竞价)是隔夜跳空收益而不是分钟收益,这是核心本身和 GP 已评估过的全部版本共享的性质,不是这次新引入的问题;mul(Ret,
    is_gt0(Ret)) / mul(Ret, is_lt0(Ret)) 这类按 分钟符号筛选,在少数单边行情日(全天无下跌分钟或无上涨分钟)会让被筛掉的一侧全天为
    0,day_corr 的 EPS 保护让 这类日子的相关系数落在 0 附近而不是爆点,不是除以近零的伪影。'
