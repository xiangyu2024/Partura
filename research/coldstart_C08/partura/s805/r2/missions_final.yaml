  hypothesis: 【新 idea:不用相关系数,用「成交额的方向性失衡」直接度量当天的净买卖压力】主算子是 Partura 自己的扩展算子 day_signed_ratio(Ret,
    Amt)(partura/ops_ext.py:122):sum(|Amt_t| * sign(Ret_t)) / sum(|Amt_t|),恒在 [-1,1]——当天成交额里,发生在上涨分钟的比例减去发生在下跌分钟的比例,用分钟收益的符号替代没有的逐笔买卖方向标签。
    这个算子在本轮 M 的两批、以及本组前两个任务位的 heads / 共性表 / 核心卡里都没有出现过,库里完全是空白。 【机制】这是经典的「订单失衡预测收益」机制(Chordia-Subrahmanyam):当天的净买压直接反映谁在主动吃单——A
    股 散户追涨杀跌,净买压过高往往是短期过度买入,T+1 使其当天不能离场,压力在之后几天回吐;净买压持续偏负则是耐心 资金在吸纳。这与本轮 E 位测的 day_corr(Ret,
    Volume)(线性共动程度,对称,不区分买卖哪一侧的权重更大)是不同的 统计量:相关系数回答「价格和成交量是否同步变化」,day_signed_ratio
    回答「这些成交额有多大比例站在哪一侧」—— 数学上不是同一个量的两种写法(协方差为 0 时失衡比例可以非 0,反之亦然,两者的充分统计量不同)。 【算子怎样实现】
    (1) 水平与平滑:day_signed_ratio(Ret, Amt) 原始日值;cross_mean(...,20)、cross_mean(...,60)
    是持续净买压 (个股自己「习惯的买卖侵略性」,不是单日噪声)。 (2) 用量(份数)替代用钱(金额)做权重:day_signed_ratio(Ret, Volume)
    不按成交金额、只按成交股数加权, cross_mean(...,20) 是它的平滑版。Easley-O'Hara 的机制是大额交易比小额交易携带更多信息,用
    Amt(金额)自然给 大单更大权重,用 Volume(股数)则对低价股的大单和高价股的小单一视同仁;两者相减 sub(day_signed_ratio(Ret,
    Amt), day_signed_ratio(Ret, Volume)) 单独拎出「价格 / 单笔金额加权」这一块贡献—— 如果上涨分钟里的单笔交易金额系统性更大(不只是股数更多),这一项为正。
    (3) 稳定性:cross_stddev(day_signed_ratio(Ret, Amt), 20) 度量买卖侵略性是不是每天都差不多(程序化 / 机构
    执行稳定)还是忽买忽卖(游资风格)。 (4) 迁移:sub(cross_mean(day_signed_ratio(Ret, Amt), 5), cross_mean(day_signed_ratio(Ret,
    Amt), 60)) 度量 买卖压力最近是不是在切换方向(资金结构正在变),持续性与均值回复的节奏(Chordia-Roll-Subrahmanyam)。
    (5) 制度分组:cs_bucket_rank(day_signed_ratio(Ret, Amt), BoardCode)、 cs_bucket_rank(day_signed_ratio(Ret,
    Amt), ListAge) 把板块涨跌停制度、新股炒作这些离散状态(不在 5 个控制里) 的机械差异扣掉,剩下的才是个股自己的买卖压力。 (6) 时段分解:day_signed_ratio(in_half(Ret,
    True), in_half(Amt, True))(dt_in.py:311 的 in_half,V2 口径下 前半是第 1-120 格、上午连续竞价,后半是第
    121-240 格、含收盘集合竞价)只用上午的成交算净买压, day_signed_ratio(in_half(Ret, False), in_half(Amt,
    False)) 只用下午;两者之差是「上午的买卖侵略性减下午的」—— 呼应第 1 轮笔记里「散户在开盘后追隔夜消息、机构把执行放到尾盘」的结构性假设,但这次直接度量「谁在侵略性地吃单」
    而不是「成交发生在几点」,是对同一个结构性假设的另一个独立验证角度,和 E 位测的量价共动也是不同的输入。 已知口径注意事项:in_half 的后半段包含收盘集合竞价那一列,前半段不含开盘集合竞价那一列,两段不是严格对称的
    120/120 分钟窗口,这是算子自己文档写明的边界归属选择,不是数值伪影;该算子在本环境里能正常解析与求值 (姊妹种子的检查角色已确认过)。 【为什么和库里已有的不同】核心算子
    day_signed_ratio 在整个库(M 两批 + 本组两轮任务)里从未出现过;机制 (分配失衡 vs 共动系数)和输入(用分钟符号筛选权重求和,不是用两个序列的协方差归一化)都和
    E 位、和第 1 轮 N 位 的 day_corr 家族不同;也和第 1 批唯一稳定的 day_centroid(钟表时间上的位置)不同——这里完全不看「什么时候」,
    只看「钱往哪一侧去」。 【为什么样本外还会在】day_signed_ratio 恒在 [-1,1],分母在成交额全天为 0 时判 NaN,不是爆点;外围只用均值、
    标准差、短长差分、板块 / 上市年龄分组、时段切片,都不是拟合参数,不会在 2023 年后系统性漂移。机制上依赖的是 散户占比、T+1、机构执行习惯这些结构性事实,不依赖某一段具体行情的方向。
