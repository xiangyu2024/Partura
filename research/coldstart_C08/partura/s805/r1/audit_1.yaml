slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [1, 2, 13]
    reasons: '【放行】E 位，核心 day_centroid(Volume) 是定位输出核心卡第 1 条（共性表均值差 +2.74），与 5 个控制的 |ρ| 最大 0.195（known），远低于 0.8；本实验第一次用这个核心；14 个种子都原样含核心。快照里 0 个 head，库禁令此时为空，所以与 head 的 |ρ| 全为 0 不提供信息，创新度只能对控制和 M 已试过的写法看。
      【算子逐个核对】day_centroid（ops_ext.py）对 |x| 取重心，缺失格权重 0、时间轴固定按 241 格 /(T-1) 标定，全天零量才 NaN，PI 说法正确；delete_open_close 在 241 格时置空第 0、1 列和最后 3 列，所以种子 7/8 的两项同尺度，差值 = 两端被删格的量占比 ×（被删格重心 - 连续段重心），有界、无爆点；cross_zscore 窗口含当天、对常数窗口有保护；cross_madz 要求至少 d/2 个有效日且 MAD>0（覆盖 0.972，正常）；is_gt0(NaN)=0，种子 9/10 全天无上涨分钟时为 NaN（覆盖 0.997）。没有前视、没有除近零、没有热身期主导。
      【划掉的种子，理由是重复】种子 1（cross_med 30）、2（cross_med 60）、13（分组后的 cross_med 30）与已知族 cross_mean(day_std(Amt),30) 的日度秩 |ρ| 分别为 0.538 / 0.558 / 0.526，与 liq 为 0.52 / 0.556 / 0.507：§1 规定与已知族 |ρ|≥0.5 直接判不合格，即在奖励自己的定义下它们就是已知族（核心单日只有 0.195，拉长中位数后留下的「习惯水平」大半是流动性），评估必然浪费。
      【创新度 3 的理由】它不是任何 head 或控制的换写法（保留种子与控制最大 |ρ| 0.434），但度量的仍是 M 自己找到的「成交在钟表时间上的位置」，种子 3-6（zscore / madz / 短减长 / 滚动标准差）和 12、14（分组排名）是通用的时间序列与截面再标准化；真正加进新信息的是 7-11：竞价倾斜、上涨分钟的成交时点、|Ret| 时点与成交时点之差，这一半是实质性改进的尝试，但整体够不上全新的轴，所以给 3。
      【合理度 4 的理由】机制清楚：成交时点反映客户群（早盘散户注意力 vs 尾盘与收盘竞价的机构 / 指数执行），且 M 的 29 个含核候选两段都稳；外围都短、无拟合参数。小问题（不扣到 3 以下）：(i) 种子 11 的 abs_ 是多余的，day_centroid 内部已取绝对值，day_centroid(abs_(Ret)) 与 day_centroid(Ret) 是同一个量；(ii) 种子 12/13 的 cs_bucket_rank(·, BoardCode)：BoardCode 只有 4 个取值（主板 / 科创 / 创业 / 北交），_pct_rank 用稳定排序按列序打破并列，所以十分位其实是「先板块后代码号」的连续代码段，主板被切成约 6 段（大致把沪、深主板与不同上市年代分开），边界段会跨板，不是 PI 说的「同一板块内排名」；按 §4 这不是问题，而且把沪深分开对 2018-08 沪市才有收盘集合竞价这件事反而有用，只是说明要改准；(iii) 种子 12 与 14 的外围算子集合都是 {cs_bucket_rank}（只差叶子 BoardCode / ListAge），若「外围」按算子集合判重，后评估的那个会被当成已见过而拒绝，建议把其中一个换成算子集合不同的写法（例如 cs_bucket_rank(cross_zscore(day_centroid(Volume), 30), ListAge)）；(iv) 种子 8 与已知族 |ρ| 0.434，离 0.5 不远，GP 在它上面再拉长窗口的后代可能越线。
      【如果它有 alpha，最可能来自哪里】来自收盘竞价 / 尾盘成交占比所代表的机构与指数资金参与度（种子 7/8 单独拎出竞价成分，最可能是主要来源），以及成交时点相对自身历史的异常（种子 3-5）所对应的事件日（调仓、消息）之后的漂移或回吐。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [11]
    reasons: '【放行】N 位，12 个种子（≤16，未超初代一半）。主算子 day_corr（AlphaCube dt_day.py）：NaN 感知，cov / (sqrt(var_x·var_y) + 1e-9)，有界在 [-1,1]；价格全天不动时 cov=0、结果为 0 而不是爆点，PI 说法正确。in_slice(x,1,237) 保留第 1..237 列，两边对齐，去掉第 0 列开盘竞价和最后 3 列；in_delta / in_delay 都沿分钟轴、只用同一天更早的分钟，种子 10 是「第 t-5 分钟的量」对「t-5 到 t 的价格变化」的相关，确实是量领先价，无前视；day_wmean 只用两者都有限的分钟，day_mean 是 nanmean，Close 恒正，VWAP/TWAP 不会除近零。没有数学问题。
      【划掉的种子，理由是重复】种子 11 cross_stddev(day_corr(Close,Volume),30) 与已知族 |ρ| 0.548、与 liq 0.547：日度相关系数的波动主要是估计噪声（有效成交笔数少的票每天的相关系数更跳），它度量的是流动性，按 §1 与已知族 |ρ|≥0.5 判不合格。
      【创新度 4 的理由】日内量价配对（成交落在价格路径的高处还是低处）是一条与 M 第 1 批（钟表时间上的成交位置）和 5 个控制都不同的轴：保留种子与控制的 |ρ| 最大是种子 9 与 rev 的 0.393，其余均值版 ≤0.28，单日版 ≤0.09；库里没有 head。它在 A 股卖方文献里是已发表的量价相关类因子（日内分钟价格与成交量相关的均值），对文献不新，但对本库与控制是新的，所以给 4 不给 5。
      【合理度 4 的理由】机制清楚且有出处：Campbell-Grossman-Wang 的流动性需求回吐 + 散户追涨与 T+1，预期高量价相关之后偏弱；种子都是相关系数 / 均值，没有拟合参数。小问题（不扣到 3 以下）：(i) 种子 4 用 in_rank 自拼秩相关，没有用被禁的 ts_spearman，合规；但 common.rank 用稳定排序按分钟序打破并列，价格在 tick 网格上大量并列，尤其涨跌停封板的一段时间价格恒定，那一段 in_rank(Close) 就等于时间顺序，相关系数里会混进「封板期间成交量随时间怎么走」的成分（原始版在全天不动时给 0，秩版给的是量与时间的秩相关）；对大多数股票日这部分方差只占几个百分点，不主导截面，但对常触板的票是系统性的，PI 说的「不让一两根放量 K 线支配」成立，这一点要知道；(ii) 种子 3 day_corr(Close, Amt) 与种子 2 几乎是同一个量（日内价格只动百分之几，Amt≈Volume×常数），两者骨架也相同，算是浪费一次评估，不划；(iii) 种子 7/8 的 VWAP/TWAP 在 float32 里贴着 1，信号只在 1e-3 量级，30 日均值后不同值占比 0.914（单日 0.968），有少量并列靠列序打破，量化误差约 1e-7，远小于信号，不是伪影主导，按 §4 不挡；(iv) 种子 9 day_corr(Ret, Volume) 与 rev 0.393、vol 0.326，偏向当日方向，属于同一 idea 的方向版，可以留。
      【如果它有 alpha，最可能来自哪里】来自给流动性需求的补偿：成交集中在当天价格高处（散户追涨，T+1 当天出不去）的票随后几天回吐，成交集中在价格低处（有耐心的承接盘、VWAP 执行）的票随后偏强；30 日均值版（种子 2/4/6/12）把单日噪声平均掉，最可能是主要来源，种子 10 的「量领先价」若有效则来自知情成交。'
    revise: '—'
