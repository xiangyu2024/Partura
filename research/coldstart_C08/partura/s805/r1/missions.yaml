slots:
  - type: E
    core: 'day_centroid(Volume)'
    hypothesis: >-
      【核心是什么】day_centroid(Volume) = 当天 241 个分钟格上成交量的重心 sum(t*|V_t|)/sum(|V_t|),t 按 0..1 标定
      (第 0 格是 09:30 开盘竞价,最后几格含收盘竞价)。0 = 成交全在开盘,1 = 全在收盘。它是「成交发生在一天的什么时候」,
      正是 day_std / day_kurt / day_gini 这类无序统计量扔掉的信息。输出恒在 [0,1]、对成交量的任意正数缩放不变(拆股、股本变化都不影响),
      只有全天零成交(停牌)才是 NaN,没有窗口、没有热身期,只用当天收盘前已知的分钟数据(收盘竞价在收盘时已知),无前视。
      【为什么是 alpha 来源】成交时点反映的是「谁在交易」:A 股散户在开盘后追隔夜消息与关注度,机构 / 指数基金 / 算法执行集中在尾盘与收盘竞价
      (Admati-Pfleiderer 的策略性聚集;Lou-Polk-Skouras 的不同客户群在不同时段交易)。M 第 1 批 62 个候选里,
      只有含这个子树的 29 个在 train 与 valid 两段都稳(其余 33 个均值为负,典型的 train 拟合、valid 翻号),
      但这 29 个的外围全是根上的保序包装 pow_2_5 / pow_1_5 / 双层 pow_2_5,在「先截面排名再 EMA」的尺子下与裸核逐日排名完全相同,
      于是 29 次评估买到的是同一个实验,分数挤在约 0.44,离 0.5 只差一点。它的优点是「稳」不是「强」。
      【这次的外围,机制各不相同,没有一个是保序一元包装】
      (1) 习惯 vs 事件拆分:cross_med(核,30/60) 取个股自己 1–3 个月的中位成交时点 —— 中位数把指数调仓日、消息日这类收盘竞价暴增的少数日子
      直接忽略,留下客户群结构决定的「习惯时点」,而且换手低、扣 15bp 后更划算;反过来 cross_zscore(核,30) / cross_madz(核,60)
      只留「今天相对自己历史的异常时点」(Gervais-Kaniel-Mingelgrin 用相对自身历史而非水平的做法),
      sub(cross_mean(核,5), cross_mean(核,60)) 是成交时点在几周内的迁移(资金结构在变),cross_stddev(核,30) 是时点的规律性
      (程序化 / 指数资金每天形态稳定,注意力驱动的散户成交形态忽早忽晚)。这一组同时回答「alpha 在水平里还是在偏离里」。
      (2) 竞价倾斜:sub(核, day_centroid(delete_open_close(Volume)))。delete_open_close 只把开盘两格和最后三格置为缺失,
      day_centroid 把缺失当权重 0 而时间轴仍按完整 241 格标定,所以两项同尺度,差值精确等于「两端竞价把重心拉向收盘还是开盘」的量,
      有界在 [-1,1]。它把核心里的竞价成分单独拎出来:收盘竞价是机构与指数资金的集中去处。
      (3) 给无方向的重心补方向:sub(day_centroid(mul(Volume, is_gt0(Ret))), 核) = 上涨分钟的成交重心减全部成交重心,
      为正说明买方成交来得比总成交晚(尾盘吸筹),为负说明上涨成交集中在早盘(追涨)。核心用 |V| 不含方向,这一项加了方向。
      两项都在 [0,1],差有界;全天没有上涨分钟时为缺失,不是爆点。
      (4) 时点错配:sub(day_centroid(abs_(Ret)), 核) = 价格波动的重心减成交的重心:有量无价(被动 / 流动性成交)与有价无量(信息)分开。
      (5) 制度分组:cs_bucket_rank(核, BoardCode / ListAge) 在同一板块 / 同一上市年龄十分位内排名。板块决定竞价规则与涨跌幅
      (创业板 2020-08 涨跌幅放宽,沪市 2018-08 才有收盘集合竞价),新股的日内成交形态也机械性地不同;
      这些离散状态不在 5 个控制里,残差去不掉,分组后剩下的才是个股自己的时点信息。
      【为什么和以前不同】以前见过的含核候选外围只有根上的 pow_*,它们对 [0,1] 内的值严格单调,排名后与裸核是同一个信号;
      这里每个外围都引入了新的信息(跨日的中位数 / 标准化 / 迁移 / 规律性、竞价格的同尺度剔除、分钟收益方向、分钟波动时点、板块与上市年龄分组),
      没有一个是保序变换。外围都很短(核心之外 1–4 个算子,日窗口只用 5/10/30/60),不给 GP 长深树、在 train 上过拟合的空间。
      【为什么样本外还会在】机制来自 A 股的结构:散户占成交大头且在开盘集中反应隔夜信息、T+1 让追涨者当天无法离场、
      机构与指数资金为降低冲击把执行放到尾盘与收盘竞价 —— 这些在 2023 年后不变。核心有界、尺度无关、无参数,
      外围只用中位数 / 标准化 / 差分 / 分组这类不拟合参数的处理,样本外不会因数值或参数漂移失效。
    literature:
      - {title: 'A Theory of Intraday Patterns: Volume and Price Variability', authors: 'Anat R. Admati, Paul Pfleiderer', year: '1988', url: 'https://www.gsb.stanford.edu/faculty-research/working-papers/theory-intraday-trading-patterns-volume-price-variability', treatment: '日内成交在时间上的聚集是知情与流动性交易者策略选择的结果:用成交重心度量这种时点,并把开盘 / 收盘两端(竞价)单独拆出来看'}
      - {title: 'The High-Volume Return Premium', authors: 'Simon Gervais, Ron Kaniel, Dan Mingelgrin', year: '2001', url: 'https://sites.duke.edu/sgervais/?p=64', treatment: '成交量特征用相对个股自身近期历史的异常度而不是截面水平:对应 cross_zscore / cross_madz / 短减长均值这组外围'}
      - {title: 'A Tug of War: Overnight versus Intraday Expected Returns', authors: 'Dong Lou, Christopher Polk, Spyros Skouras', year: '2019', url: 'https://personal.lse.ac.uk/polk/research/TugOfWar.pdf', treatment: '不同客户群(机构 vs 个人)在一天的不同时段交易,alpha 集中在特定时段:把成交时点当成客户群结构的度量,并按收益方向拆分时点'}
      - {title: 'Effectiveness of price limits: Evidence from China''s ChiNext market', authors: 'Bao Qi', year: '2023-06', url: 'https://ideas.repec.org/a/plo/pone00/0287548.html', treatment: '涨跌幅 / 板块制度改变日内交易动态:在 BoardCode 与 ListAge 的十分位内对时点排名,把制度带来的机械差异扣掉'}
