  - type: N
    hypothesis: >-
      【新 idea:成交落在当天价格路径的什么位置】把第 1 批里唯一稳定的那条轴(成交在「钟表时间」上的位置)换成「价格路径」上的位置:
      当天的成交是集中在价格的高处还是低处、是跟着价格走还是逆着价格走。主算子是 day_corr(Close, Volume) —— 当天 241 个分钟的
      收盘价与成交量的相关系数,在 [-1,1]。为正 = 价格越高的时刻成交越多(追涨、量随价走);为负 = 成交集中在价格低处(逢低承接)。
      【机制】Campbell-Grossman-Wang:伴随大成交量的价格变动若来自非信息性的流动性需求,之后会反转;A 股散户占成交大头、
      注意力驱动,盘中追涨的成交集中在当天价格高处,而 T+1 使这些买入当天无法离场,买压在之后几天回吐。相反,
      成交集中在价格低处(机构的 VWAP / 被动执行、价值型买家逢低吸纳)是有耐心的承接盘。Llorente-Michaely-Saar-Wang:
      量价的动态关系取决于知情交易与对冲 / 流动性交易的占比 —— 量价共动的方式本身就是在度量这个占比。所以预期高相关 → 未来偏弱,
      低(负)相关 → 未来偏强(方向留给 train 自己选)。
      【算子怎样实现】(a) 原始的日内量价相关 day_corr(Close, Volume) 及其 30 日均值(把单日噪声平均掉,得到个股稳定的量价共动习惯);
      (b) 换成金额 Amt;(c) 先在日内对价格与成交量各自排名再求相关 day_corr(in_rank(Close), in_rank(Volume)) —— 秩相关,
      不让一两根放量 K 线(尤其竞价格)支配相关系数,这里用 in_rank + day_corr 自己拼,不用 ts_spearman;
      (d) 用 in_slice(…,1,237) 去掉开盘竞价格与收盘竞价窗口,只看连续竞价时段;(e) VWAP / TWAP = div(day_wmean(Close,Volume), day_mean(Close)):
      成交是否以高于当天时间均价的价格成交,同一个想法的「价位」写法;(f) 方向版 day_corr(Ret, Volume):成交是否集中在上涨分钟;
      (g) 领先版 day_corr(in_delta(Close,5), in_delay(Volume,5)):5 分钟前的成交量与其后 5 分钟的价格变化的相关 —— 成交是否领先价格(知情成交);
      (h) 量价相关的 30 日波动、按 BoardCode 分组的版本。
      【为什么和库里已有的不同】库里还没有任何 head;5 个控制是流动性、波动、20 日反转、成交额日内离散度族、流通市值,
      都只看「量多大、价动多少」,不看量与价在日内怎样配对。第 1 批的核心 day_centroid(Volume) 看的是成交在钟表时间上的位置,
      与价格路径无关;这里看的是成交相对价格路径的位置,输入(Close 与 Volume 的配对)和机制(追涨 vs 承接)都不同。
      【数值与定义】day_corr 分母带 EPS,有界在 [-1,1];价格全天不动(一字板、停牌复牌)时方差为 0,相关系数为 0 而不是爆点,
      只是少数锁死股票落在中间值;Close 恒为正,VWAP / TWAP 不会除以近零;所有量只用当天收盘前已知的分钟数据,
      日窗口最长 30,热身期远短于 train。
      【为什么样本外还会在】它依赖的是 A 股的制度与参与者结构(散户主导、T+1、涨跌停),而不是某一段行情;追涨盘的事后回吐
      是流动性需求的补偿,只要散户占比与 T+1 不变就会持续。构造只有相关系数与均值,没有拟合参数。
    inspired_by: >-
      M 第 1 批:62 个候选里唯一在 train 与 valid 都稳的是有序的日内统计量 day_centroid(Volume)(成交在钟表时间上的位置),
      无序的日内统计量全部两段翻号 —— 说明「成交在一天里怎样排布」比「成交分布的形状」更可靠;于是把轴从钟表时间换成价格路径。
      文献:Campbell-Grossman-Wang 1993、Llorente-Michaely-Saar-Wang 2002、Admati-Pfleiderer 1988。
