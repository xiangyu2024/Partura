attempt: 1
slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: [1, 3]
    reasons: |-
      核心 day_corr(Ret, Volume) 是本组第 2 轮已用过的 E 核心,这是第 2 次用(达到「每个核心至多 2 个 E 位」的上限,不再违规)。
      种子 1(cross_tail_mean_q75(cross_mean(core,3),60))与种子 3(cross_tail_mean_q75(core,60))按相关度表(corr_1.json)
      的原始 |ρ| 分别是 0.792 和 0.712,最像的都是库里当前分数最高的 head
      `cross_max(add(add(5, cross_mean(day_corr(Ret, Volume), 3)), cross_mean(day_corr(Ret, Volume), 3)), 60)`——
      按 add(5,x)+x=2x+5 是 x 的单调增函数,这个表达式在骨架上就是 cross_max(cross_mean(core,3),60) 的单调变换,
      与 missions.yaml 自己说的「全库目前分数最高的 head(+1.18)」是同一个东西。两个种子的原始 |ρ| 均 ≥ 0.7,
      按 §3 的确定性规则自动划掉(GP 库禁令本来就会拒绝这类候选)。划掉后说明 PI 自己提的问题(1)——
      「稳健尾部均值在 60 日窗口下是否等价于单点极值」——相关度表已经用数据给出了答案:在同一个窗口长度上两者确实太像,
      分不开谁更稳健,不是挡的理由,但 PI 下一轮不必再把 q75 的 60 日版本当作独立候选看。
      种子 2(q25,0.611)、种子 4(q25 裸核心,0.439)低于 0.7 阈值,保留。
      划完还剩 9 个种子(≥4),位通过。
      剩下的三组机制互不相同、且都与库里 5 个 head、5 个控制明显区分(corr_1.json 的 max_head 均 ≤0.53,残差同量级):
      (a) cs_flip_by_state(cross_mean(core,3), day_std(Ret)/day_sum(Volume))——核对 ops_ext.py 源码(行 561-576):
      state 用的是当天全市场横截面均值(_market_series)相对其自身滚动 241 日分位(_trailing_rank)的高低,
      不是任何个股自己当天的值,也不是未来信息,和 Llorente et al. (2002) 的「知情/流动性交易占比随状态切换」机制对应得上,
      算子确实实现了「按全市场状态翻转符号」而不是按个股自身历史切,是此前(第 2 轮「迁移」种子切的是个股自己的历史水平)
      没测过的参照系。(b) mul(core, day_centroid(Volume)) 及其变体——两条轴此前只单独测过,相乘产生的是和两者分别的
      单调变换都不同的新量(seed 10 cross_mean(mul(...),20) 的 max_head=0.53、rev 控制=0.49,都在阈值下,
      §4 明确「与某个控制中度相关」不是问题)。(c) cs_bucket_rank 按 BoardCode/ListAge 分组——核对源码(行 239-256),
      是去掉板块/上市年龄离散差异后的组内百分位,种子 5/6 与任何 head、控制的 |ρ| 都 ≤0.31,确认是新的处理。
      E 位附加要求(核心与每个控制 |ρ|<0.8)满足:corr_1.json「slot a core」行 controls 最大值仅 0.131(rev)。
      没发现 §4 的前视/数值伪影/定义坏掉:cross_tail_mean_q75/q25 对有效天数<2 给 NaN(非爆点),
      cs_flip_by_state 的状态变量当天不可知时给 NaN(非用两次同一天信息)。文献(Llorente et al. 2002、
      Barclay-Warner 1993)与算子实现的机制吻合。如果这组有 alpha,最可能来自 (a) 全市场状态切换时知情/流动性交易占比
      真实变化、(b) 量价共动集中在尾盘股票上更像机构策略性建仓;这两条都是结构性解释,不依赖某段具体行情。
    revise: "—"
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: |-
      新 idea(上午/下午收益是继续还是反转)与库里 5 个 head 测的东西都不同:day_centroid 测成交发生在几点、
      day_corr(Ret,Volume) 测同一时刻量价是否同步、ts_skew(day_corr(Volume,Vwap)) 测量价相关系数的时序偏度,
      都不是「两个不相交时段各自收益均值之间的方向关系」。相关度表(corr_1.json)确认:10 个种子的 max_head 全部
      ≤0.32,残差同量级,没有一个接近 0.7 的自动划掉线,不划任何种子。
      核对 ops_ext.py/dt_in.py 的 in_half 源码(dt_in.py 行 311-320):V2(N=241)时 front=x[:,1:121]、
      back=x[:,121:241]——front 从索引 1 开始,正好不含索引 0(文档写明「列 0 是 09:30 集合竞价」),
      back 含到最后一列。也就是说 front 实际上不含开盘集合竞价,back 才可能含收盘集合竞价,
      和 hypothesis 里「前半含开盘集合竞价、不含收盘集合竞价,后半反过来」正好说反了。这是 PI 对算子边界归属的
      描述性错误(大概率是从第 2 轮同一个算子的描述原样带过来的),但按 §4,这不属于前视/数值伪影/定义坏掉
      任何一类——算子本身的计算是确定的、良定义的,第 2 轮已经用过同一个算子且产出过 head,不构成挡的理由,
      只建议 PI 下一轮把这句话改过来,不影响本轮通过。
      算子逐一核对无误:mul 直接实现「同向为正、反向为负」;cross_corr(AM,PM,60) 的 rolling_pair_reduce 是真正的
      皮尔逊相关(先各自标准化),和 mul 不是同一个充分统计量,与 hypothesis 的区分一致;
      div(day_sum(in_half(Amt,False)), day_sum(Amt)) 由于分子是分母的一个子集之和(PM 金额 ≤ 全天金额,
      两者同为非负),比值恒在 [0,1],不会出现除以近零的爆点(common.py 的 div 本身没有 EPS 保护,
      但这里的结构保证了不会退化,day_sum 在整天缺失时按 common._sum 的 nansum+isfinite 判定返回 NaN
      而不是 0,0/0 或 NaN/NaN 都是 NaN,不是 inf)。
      种子 8(cross_mean(AM,20),rev 控制 |ρ|=0.667)与种子 10(magnitude 版,vol 控制 |ρ|=0.674、
      known 控制 |ρ|=0.474)与某个控制中度相关,但均 <0.8,且 hypothesis 明确把这两个列为「必要性基线」/
      「排除项」而非发现候选本身(用来检验「两段关系」是否比单段水平或纯幅度聚集多出信息),
      §4 明确「与某个控制中度相关」不是问题,不划。
      文献(Gao-Han-Li-Zhou 2018 日内动量、Feng-Seasholes 2005 中国散户处置效应、Admati-Pfleiderer 1988
      策略性分批交易)与两条对立机制假设对应得上,方向没有预设,留给 train 选,是清楚且可检验的机制。
      如果这组有 alpha,最可能来自 A 股散户占比高带来的日内处置效应反转、或机构尾盘分批建仓带来的日内延续,
      两者在不同股票上的相对强度差异。
    revise: "—"
R:
  - head: 'sub(cross_min(day_corr(Ret, Ret), 60), cross_mean(day_corr(Ret, Volume), 60))'
    soundness: 4
    reasons: |-
      loc.md「拆解」表(14 次评估)已经直接证实:把 cross_min(day_corr(Ret,Ret),*) 的窗口从 60 换成 120,
      分数从原 head 的 +0.54 跳到 +0.87(train),增益 +0.33,是该表里四个改动(swap Volume->Amt +0.02、
      window 60->30 反而更差 -0.08、window 60->120 +0.33)中最大的一个,定位到「烂的部件是 cross_min 的
      窗口太短(60 天)」,不是 sub 结构或 Volume 字段——这个结论本身不是本轮新提的,是已经跑出来的数据。
      本轮的 5 个变体只是在这一个已证实方向的两边各探一步(90/150/180)看是否单调或回落,
      外加把两个已分别证实的小增益(窗口 120、字段 Amt)叠加测一次,是对同一个烂部件做进一步的边界刻画,
      不是引入新的、未经验证的改动。相关度表(corr_1.json)确认这 5 个变体确实是原 head 的渐变扰动而不是
      另一个信号:variant2(窗口 120/Volume)与原 head 本身的 max_head=0.879,variant1/3/4(90/150/180)
      分别是 0.934/0.836/0.802,随窗口偏离 120 越远相关度越低,方向符合「单参数渐变」的预期;
      variant5(窗口 120、字段换 Amt)与原 head 的 max_head 同为 0.879,与 variant2 几乎一致,
      符合「同一个窗口,只换字段」的预期。核对算子源码:cross_min/cross_mean 是标准的 rolling_reduce,
      day_corr 的分母带 EPS 保护(dt_day.py day_corr),窗口加长到 150/180 不会引入新的边界问题(仍远小于
      train 的样本长度)。没有发现 §4 的数学问题。如果 90/150/180 里有比 120 更好的,
      最可能的机制是「量价瞬时相关系数的历史最小值」需要更长(或更短)的回看期才能把偶然的单日极端值
      平均掉到合适的程度;Amt 叠加版本如果进一步提升,说明「字段选 Amt 而不是 Volume」与「窗口拉长到 120」
      是两个可独立叠加的小增益,不是同一个来源。
summary: '两位均通过:a(创新度4/合理度4)划掉种子1、3(与库里 +1.18 head 结构性重合,|ρ|≥0.7 自动划);b(创新度4/合理度4)不划任何种子,顺带指出 in_half 的集合竞价归属描述写反了(非数学问题,建议 PI 下轮改正);R 变体(窗口 90-180 与 Amt 换字段)合理度4,是对已证实增益方向的边界刻画,非新臆测。'
