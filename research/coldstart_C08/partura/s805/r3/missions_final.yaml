  hypothesis: 【新 idea:日内上午与下午收益是「继续」还是「反转」,不是成交量或量价配对】把一天切成两段(ops_ext.py/dt_in.py
    的 in_half,V2 口径:前半含开盘集合竞价、不含收盘集合竞价,后半反过来,与第 2 轮 N 位用过的同一个算子),分别取各段的分钟收益均值 day_mean(in_half(Ret,
    True))(上午)与 day_mean(in_half(Ret, False))(下午),度量两者是同向(继续,日内动量)还是反向(反转)。这与本组已确认的两条轴都不同:day_centroid(Volume)
    看的是「成交发生在几点」,day_corr(Ret, Volume) 看的是「同一时刻价格和成交量是否同步变化」,这里看的是「同一天两个不相交时段的收益方向关系」——输入(两个时段各自的收益均值)和被测对象(continuation
    vs reversal,不是共动强度或成交时点分布)都不是这两条轴的子集或单调变换,数学上也不是同一个充分统计量(两条轴都可以为 0 的同时这里的继续/反转测度可以非
    0,反之亦然)。 【机制】Gao-Han-Li-Zhou 的「日内动量」:一天前段的收益对后段收益有正向预测力,机制是信息沿着一天逐步扩散、动量交易者跟随趋势进场。但
    A 股散户占比高、处置效应强(Feng-Seasholes 对中国投资者的直接证据:赢家仓位系统性地更早获利了结),如果上午的上涨主要是散户追涨造成的,午后更可能是获利了结/散户出货,体现为反转;如果上午的上涨是机构逐步建仓造成的(Admati-Pfleiderer
    的策略性分批交易),午后更可能延续。两种机制在不同股票上可能都存在且强度不同,这次不预设哪个占优,方向留给 train 自己选。 【算子怎样实现】(1)同日继续/反转的直接度量:mul(day_mean(in_half(Ret,
    True)), day_mean(in_half(Ret, False))) 为正表示上午下午同向(继续),为负表示反向(反转);这是单日值,噪声大,只做诊断基线。(2)持续的个股风格:cross_mean(上面的
    mul, 20) 与 cross_mean(..., 60),把单日噪声平均成「这只股票近期习惯继续还是习惯反转」这件更稳定的事,而不是某一天的偶然结果。(3)风格一致性而非共同幅度:cross_corr(day_mean(in_half(Ret,
    True)), day_mean(in_half(Ret, False)), 60) 直接在日轴上对两个时段的收益序列求相关系数,而不是逐日乘积再平均——剥掉了「某一天两段都特别大」这种单日幅度对结果的支配,只剩「两段的方向是否倾向于一起变」这个更干净的统计量,和
    (1)(2) 是不同的充分统计量(相关系数先各自标准化,乘积没有)。(4)用午后成交额占比加权:mul(mul(day_mean(in_half(Ret,
    True)), day_mean(in_half(Ret, False))), div(day_sum(in_half(Amt, False)), day_sum(Amt)))
    用「当天有多大比例的成交额发生在下午」给继续/反转信号加权——如果延续或反转主要发生在下午成交本来就活跃的那些天,说明背后真的有资金在交易这件事,不是下午安静无量时的随机噪声(Barclay-Warner:知情交易按成交量占比而不是绝对规模衡量更准)。(5)制度分组:cs_bucket_rank(cross_mean(上面的
    mul, 20), BoardCode)、cs_bucket_rank(cross_mean(上面的 mul, 20), ListAge)——板块的涨跌停规则与集合竞价制度、新股上市初期的日内交易形态都会机械影响上午/下午收益的关系,这些离散状态不在
    5 个控制里,分组后剩下的才是个股自己的继续/反转倾向。(6)必要性基线:cross_mean(day_mean(in_half(Ret, True)),
    20) 与 cross_mean(day_mean(in_half(Ret, False)), 20) 单独测「只看上午(或只看下午)收益的持续性」,不涉及两段的关系——如果这两个基线本身就能打到
