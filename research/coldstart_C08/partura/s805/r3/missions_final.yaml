    train 决定,不是预设的。 【已知的测量注意事项,不构成数学问题】in_half 的前后两段不是严格对称的 120/120 分钟(前段含开盘集合竞价、不含收盘集合竞价,后段相反),这是算子自己文档写明的边界归属选择,和第
