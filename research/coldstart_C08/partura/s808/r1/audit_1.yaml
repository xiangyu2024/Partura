  reasons: '创新度=5:库里4个head和5个控制(liq/vol/rev/known=cross_mean(day_std(Amt),30)/size)全部是『某个加权或不加权日内量的水平』,本位核心构造是跨两个水平量取秩差或相关系数(量加权日内波动vs等权日内波动之差sub(cs_rank(day_wstd(Ret,Volume)),cs_rank(day_std(Ret)));|收益|与成交量的日内相关day_corr(abs_(Ret),Volume)),按构造正交于『水平』这一维,库内和控制里都没有任何『差』或『相关系数』类的统计量,是真正独立的一个轴,而不是现有信号的延伸。inspired_by段落给出的证据站得住:把Volume换成Amt后head几乎不变(ρ 0.9997),说明现有head载荷的是『加权』这个动作本身,『加权-不加权的差』自然是下一层问题。机制对应Clark(1973)成交量作为信息到达的随机时钟、Admati-Pfleiderer(1988)知情/流动性交易集中于同一厚时段、Llorente-Michaely-Saar-Wang(2002)量-收益动态随信息交易占比分化,文献贴切。相关度表确认:与库内head最大|ρ|只有0.57(seed5,cs_bucket_rank(ts_mean(day_wstd(Ret,Volume),120),ts_mean(day_std(Ret),120))),与控制最大|ρ|是0.571(seed11对liq)/0.552(对known),均远低于0.7/0.8的自动划掉线,不是任何head或控制的换皮。


    合理度=4:12个种子逐个核对算子源码——day_wstd/day_std(AlphaCube dt_day.py)、day_corr(cov/(sqrt(var_x*var_y)+EPS),方差为0时corr=0而不是起点,与假设文本『锁死日方差为0时分母带EPS,输出0』一致)、day_topw_mean(abs_(Ret),Volume)(torch.nanquantile取0.9分位做掩码,k.clamp(min=1)防止除零,partura/ops_ext.py)、in_delay(Volume,1)(result[:,1:]=x[:,:-1],是向后lag不是前视)都是NaN安全且有界,没有§4的三类数学问题。cross_ema内部用float64防止金额量级输入的早期溢出bug,但这里喂给它的是已经界在[-1,1]的day_corr,不受影响(seed8 cross_ema(day_corr(...),40))。窗口40–120天,相对train+valid的总样本不被热身期主导。'
