  reasons: 创新度=4(非5):库里4个head(loc.md)的外围共性只是『对同一条序列(day_wstd/day_wmean)套更长窗口的ts_max』(loc.md『共性』表前5行全是ts_max/day_wstd/day_wmean的子树,没有第二个统计量)。本位核心day_wmean(Ret,Volume)就是+0.99那个head的子树(ts_max(ts_max(day_wmean(Ret,Volume),50),50)=ts_max(x,99)),13个种子没有一个是单纯换窗口的ts_max(那属于GP外围去重会拒绝的已见外围),而是各自把第二个统计量接到核心上——上下行秩相加/分位数/条件均值(seed1-3)、无量纲ts_skew及其按LogFloatCap分桶版(seed4、5)、同波动十分位内比较(seed6)、与cs_demean(day_wstd)极值的秩差(seed7)、与等权漂移的秩差即订单流成分(seed8、9)、ts_argmax时机(seed10、11)、单独的下行极值(seed12、13)——把『彩票/MAX效应』里的上行不对称从波动水平里剥出来,库里确实没有先例,Bali-Cakici-Whitelaw(2011)的MAX/MIN并列检验、Amaya et al.(2015)的无标度已实现偏度、Nartea-Kong-Wu(2017)的A股MAX与特质波动并存证据分别对应②③④,引用贴切。打4分而非5分,是因为底层仍是同一条day_wmean序列,是在已识别的MAX效应paradigm内做实质性拆解,不是换一个独立信息源。
