      - {title: 'Dynamic Volume-Return Relation of Individual Stocks', authors: 'Llorente, G.; Michaely, R.; Saar, G.; Wang, J.', year: '2002', url: 'https://doi.org/10.1093/rfs/15.4.1005', treatment: '个股的量-收益关系随信息交易比重而异 -> 用日内 |收益|-成交量相关度作为信息交易比重的横截面代理'}
