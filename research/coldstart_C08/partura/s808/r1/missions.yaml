R:
  - head: 'ts_max(ts_max(cs_demean(day_wstd(Ret, Volume)), 10), 50)'
    why: '内层窗口 10 是烂部件。嵌套运行最大值精确等于 ts_max(x, a+b-1),这个 head 的实际窗口是 59,正落在平台边缘:同一序列 W=34/50 为负分,W 在 99–148 一律约 +1.0;它的 valid 只有 0.68,是全库最弱的一段。把外层 50 换成 100(实际窗口 109)在拆解里已测得 1.066(+0.385),ρ_head 0.695。'
    variants:
      - 'ts_max(ts_max(cs_demean(day_wstd(Ret, Volume)), 10), 100)'
  - head: 'ts_max(ts_max(cs_normalize(day_wstd(Ret, Ret)), 50), 50)'
    why: 'cs_normalize 是烂部件:knockout 必要性 -0.15(去掉后 0.79,valid 2.47,ρ_head 0.93)。奖励本身先转截面秩,在取时序最大值之前再除以当天截面标准差,只是把每天的尺度换成噪声。变体:去掉 cs_normalize(已测 +0.152);去掉后把窗口推到 head1 所在平台(148);用 cs_rank 代替 cs_normalize(先转秩再取最大值,不受截面重尾与当日离散度影响)。'
    variants:
      - 'ts_max(ts_max(day_wstd(Ret, Ret), 50), 50)'
      - 'ts_max(day_wstd(Ret, Ret), 148)'
      - 'ts_max(cs_rank(day_wstd(Ret, Ret)), 99)'
  - head: 'ts_max(ts_max(day_wmean(Ret, Volume), 50), 50)'
    why: 'Volume 这个权重不是载荷部件:换成 Amt 后 ρ_head 0.9997、score +0.106,按金额加权更贴近「钱实际经历的收益」。另两个变体是判别式:等权 day_mean(Ret) 检验量加权本身贡献多少;day_topw_mean(Ret, Volume)(最重 10% 分钟的平均收益)检验 alpha 是否集中在放量分钟。'
    variants:
      - 'ts_max(ts_max(day_wmean(Ret, Amt), 50), 50)'
      - 'ts_max(day_mean(Ret), 99)'
      - 'ts_max(day_topw_mean(Ret, Volume), 99)'
  - head: 'ts_max(ts_max(ts_max(cs_demean(day_wstd(Ret, Volume)), 50), 50), 50)'
    why: '三层 ts_max 等价于 ts_max(x, 148);148 这个取值是 train 挑出来的(valid 的峰在 99–109)。更要紧的是还分不清哪个部件在载荷:运行最大值是阶梯函数、换手极低,而裸 day_wstd(Ret, Volume) 是 -3.47,所以「尾部极值」「慢速波动水平 + 低换手」「上市年龄(历史短的股票取最大值的样本少,最大值系统性偏小)」「涨跌幅宽度(20% 板块日内波动机械地大)」四种解释缠在一起。变体逐个判别:ts_mean 换 ts_max(水平 vs 尾部);cross_tail_mean_q75 与 ts_quantile 0.9(单日 vs 尾部一堆天);day_std 换 day_wstd(量加权 vs 等权);cs_rank 换 cs_demean(先转秩再取最大值);cs_bucket_demean(…, LimitWidth)(板块);cs_bucket_rank(…, ListAge)(上市年龄);ts_argmax(时机 vs 幅度)。'
