  - type: N
    hypothesis: '新想法:日内「价格变动」与「成交量」的耦合度 —— 同一天的方差是发生在放量的分钟(量时钟)还是发生在冷清的分钟(日历时钟)。
      机制:混合分布假说里成交量是信息到达的随机时钟(Clark 1973;Ané-Geman 2000);Admati-Pfleiderer 1988 证明知情交易与流动性交易会集中在同一批厚时段,所以「价格在有量时动」对应信息驱动的交易,「价格在没量时动」对应薄盘噪声与流动性不足;Llorente-Michaely-Saar-Wang 2002 显示个股的量-收益动态正是按信息交易所占比重分化的。耦合度因此是「这只股票的价格由谁、以什么方式在推动」的代理,而不是「它有多波动」。
      算子实现(全部是无标度量):(a) sub(cs_rank(day_wstd(Ret, Volume)), cs_rank(day_std(Ret))) —— 量加权分钟波动与等权分钟波动的截面秩差,两项共有的波动水平被减掉,只留「波动集中在放量分钟」的程度;(b) day_corr(abs_(Ret), Volume) —— 分钟 |收益| 与分钟成交量的日内相关,天然有界在 [-1, 1],锁死日方差为 0 时分母带 EPS,输出 0 而不是爆点;(c) day_topw_mean(abs_(Ret), Volume) 与 day_mean(abs_(Ret)) 的秩差 —— 最重 10% 分钟的平均 |收益| 相对全天平均,即放量分钟的单位价格冲击;(d) day_corr(abs_(Ret), in_delay(Volume, 1)) —— 上一分钟的量是否领先这一分钟的波动;(e) cs_bucket_rank 版 —— 在等权波动或 30 日成交额的同一十分位里比量加权波动 / 耦合度,非参数地剥掉水平。日度值再接 40–120 日的 ts_mean / cross_ema(半衰期 40)/ 上下尾条件均值 / ts_max,输出变化慢、换手低。
      为什么与库和控制不同:库里 4 个 head 都是某一个加权日内量的「水平」的长窗口最大值;5 个控制(20 日等权波动、30 日成交额、20 日反转、市值、成交额离散度)也全是水平量。耦合度是秩差或相关系数,按构造与波动水平、流动性水平近似正交,正是控制集结构性缺失的那一维(Padungsaksawasdi-Daigler 2018:量加权已实现波动与普通已实现波动只弱相关、持续性也不同;Giot-Laurent-Petitjean 2010:交易活跃度只与连续方差相关、与跳跃无关,所以耦合度也区分了「连续的信息流」与「孤立的跳」)。
      方向交给奖励:若耦合度代表信息交易比重,高耦合对应信息风险溢价(正向);若代表散户追涨时的集中放量,高耦合对应过度定价后的低收益(负向)。
      为什么样本外还在:它来自交易机制(谁在什么时候交易)而不是某一段行情,在 A 股集合竞价 + 连续竞价的制度下稳定存在;使用 60–120 日平滑量,不靠某一个窗口或某一天。'
    inspired_by: '第 1 批的三族 head 原料全是加权的日内量 —— day_wstd(Ret, Volume)、day_wmean(Ret, Volume),以及按 |收益| 加权的 day_wstd(Ret, Ret);而 vol 控制用的是等权的 day_std(Ret)。把 Volume 换成 Amt 分数几乎不变(ρ_head 0.9997),说明载荷的是「加权」这个动作而不是用哪个量加权。本位问:加权与不加权之间的差、即价格变动与成交量的耦合本身,是不是一个独立的信息源。文献见下。'
