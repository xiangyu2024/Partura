  - type: E
    core: 'day_wmean(Ret, Volume)'
    hypothesis: '核心 day_wmean(Ret, Volume) 是按成交量加权的分钟收益均值(源码:sum(Ret*|Volume|)/sum(|Volume|),权重和为 0 时 NaN),等于「当天平均分钟收益 + 分钟成交量与分钟收益的协方差项」,即当天的钱实际经历的涨跌。它是库里 head ts_max(ts_max(day_wmean(Ret, Volume), 50), 50) 的子树;嵌套的运行最大值精确等于一个更宽的窗口,那个 head 就是 ts_max(day_wmean(Ret, Volume), 99):近 5 个月里资金加权涨得最猛的那一天,方向 -1,是日内、量加权版的 MAX / 彩票效应(Bali-Cakici-Whitelaw 2011;A 股上 Nartea-Kong-Wu 2017 证实 MAX 效应存在且与特质波动并存)。核心单独上场 -2.49、50 日最大值 -1.51、99 日最大值 +0.99,alpha 全在长窗口的极值那一层。
      问题在于:单日最大值同时混着两样东西 —— (i) 波动水平(高波动股票的最大值天然大),(ii) 上行不对称(彩票性)。新尺子只去掉 20 日等权波动,99 日尺度的波动水平仍可能是那个 head 的主要来源。本位的外围全部用来把 (ii) 从 (i) 里剥出来,这件事库里没有任何 head 做过:
      ① 上行极值与下行极值的秩相加:add(cs_rank(ts_max(x, 99)), cs_rank(ts_min(x, 99))),及 5%/95% 分位版(ts_quantile)、上/下四分位条件均值版(cross_tail_mean_q75 / q25)。波动水平在两个秩里方向相反、相加时抵消,剩下的是「最猛上冲」相对「最狠下跌」的不对称;分位与条件均值版不依赖单独一天,更稳。
      ② 时序偏度 ts_skew(x, 120):无标度,直接度量彩票性(Amaya 等 2015 的已实现偏度、Boyer-Mitton-Vorkink 2010 的预期特质偏度),并给一个在市值十分位内排名的版本 cs_bucket_rank(…, LogFloatCap),因为偏度与小市值天然相关。
      ③ cs_bucket_rank(ts_max(x, 99), ts_mean(day_wstd(Ret, Volume), 99)):在同一个 99 日量加权波动十分位里比 MAX,非参数地拿掉波动水平。
      ④ sub(cs_rank(ts_max(x, 99)), cs_rank(ts_max(cs_demean(day_wstd(Ret, Volume)), 99))):极端日是「单边上冲」还是「只是波动大」。
      ⑤ 量价时机分量:sub(cs_rank(x), cs_rank(day_mean(Ret))) 是每天量加权漂移与等权漂移的截面秩差,抹掉当天的整体涨跌,只留「涨在放量分钟、跌在缩量分钟」这一订单流成分(Chordia-Subrahmanyam 2004:订单不平衡当期同向、滞后反转);取它的 99 日最大值与 60 日均值。
      ⑥ 时机:ts_argmax(x, 120) 是离最猛那天过去了多久(注意力冲击的衰减),以及「幅度秩 − 时机秩」。
      另有两个只看下行的种子(ts_min、下四分位条件均值),检验下行极值单独是否有信息。
      与库里不同:库里 4 个 head 的外围只有「单一序列的长窗口 ts_max」,本位没有一个种子是换窗口的 ts_max(这个外围已见过,GP 也会按外围去重拒绝);每个种子都引入了第二个统计量(下行极值、偏度、波动水平、等权漂移、时机),按构造与 head 的秩相关应明显低于 0.7。
      为什么样本外还在:彩票偏好与注意力驱动的过度定价是行为性的,在 A 股散户主导的结构下长期存在;这些量多数是秩差或无标度统计量,不依赖某一窗口的挑选;窗口 60–148 日,输出变化慢、换手低,15 bp 成本下不是靠运气。'
