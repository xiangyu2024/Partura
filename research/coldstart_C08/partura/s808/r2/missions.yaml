  hypothesis: 核心 day_wstd(Ret, Volume) 是按分钟成交量加权的日内已实现波动(源码:sqrt(sum(|Volume|*(Ret-m)^2)/sum(|Volume|)),m=day_wmean(Ret,Volume)),是库里当前最强的 head(+1.2567,`ts_max(ts_max(ts_max(cs_demean(day_wstd(Ret, Volume)), 50), 50), 50)` ≡ `ts_max(cs_demean(day_wstd(Ret, Volume)), 148)`)与另一个 head(+1.0659,`ts_max(ts_max(cs_demean(day_wstd(Ret, Volume)), 10), 100)` ≡ 同一条序列窗口 109)共同的子树,也是本轮定位输出共性表效应最大的原子(核心卡第 11 项,均值差 +1.1118,24 个候选含它),本轮是它第一次被交给 GP 单独开一个 E 位(此前只在 R 里被人工拆解)。 第 1 轮用 R 对这条序列做了 8 个判别式,已经钉死三件事(R_prev.json):① 把 ts_max 换成 ts_mean / cross_tail_mean_q75 / ts_quantile(0.9) 全部崩到 -2.57 / -0.17 / -2.16,证实 alpha 来自『单日尾部』而不是『波动水平』——是某一天出了事,不是这只股票一直这么躅;② cs_bucket_demean(…, LimitWidth) 版 1.3276,比原 head 还高,排除了板块 / 涨跌幅宽度是主要来源;③ cs_bucket_rank(…, ListAge) 版降到 0.7569(valid 从 1.79 掉到 0.76,降幅接近 0.5),上市年龄 / 停牌混淆没被排除,仍是悬案,本轮会在 R 位再测一次更干净的版本。 本位要回答的问题是:『出事的那一天』除了振幅大,还有没有别的、可独立验证的行为特征——如果有,支持『真的是一次信息冲击 / 彩票事件』;如果没有,支持『纯粹是单变量尾部统计量凑巧选中、脆弱』。 外围引入两个本轮定位输出才首次显著、库里和 R 都从未用过的原子:① day_centroid(Volume)(当天成交量的分钟级时间重心,0 = 全在开盘,1 = 全在收盘;本轮核心卡第 10 项,效应 +1.2622,12 个候选含它)——Admati-Pfleiderer (1988) 的理论预测知情交易与流动性交易集中在同一批厚时段,一次真正的信息冲击日,成交量的日内时间分布应偏离这只股票平时的形状,而单纯『窗口凑巧选中最大值』不会改变成交量的时间结构;② day_cov(Open, Ret)(当天分钟价格水平与分钟收益的协同方向;本轮唯二新 head 之一的组成部件,核心卡第 19 项,效应 +0.862,12 个候选含它)——协同为正近似『追涨』(价格已走高、收益仍为正),为负近似『逢低买入』(价格走低、收益反而更正),对应 Llorente-Michaely-Saar-Wang (2002)『个股量价动态按信息交易比重分化』的框架;③ cross_autocorr_s1(day_wstd(Ret, Volume), d)(该序列自身滞后一阶的日度自相关,库和 R 都没测过『这条序列是不是会自己重复』)——Giot-Laurent-Petitjean (2010)『交易活跃度只关联连续方差、不关联跳跃』与 Barndorff-Nielsen-Shephard (2004) 把已实现波动拆成连续项与跳跃项的框架一起说明:真正的『跳』在统计上应接近孤立事件、自相关低;如果核心序列滞后自相关很高,说明『尾部』其实是一段持续偏高的 regime,仍可能是『慢速波动水平』的某种残留;自相关低则支持孤立跳跃 / 彩票事件解释。 算子实现:种子 1-5 用当天 cs_rank 差 / 和(sub/add)直接构造『同一天』的联合信号(不经过任何窗口,只问『今天振幅排名』与『今天成交量时点排名』或『今天价格-收益协同排名』是否同时出现在两端),再取 148 日最大值 / 最小值;种子 6-7、12 把核心的 148 日尾部统计量或核心本身的持续性单独抽出来,用 cs_rank 差去掉持续性对尾部排名的贡献;种子 8-9、11 用 cs_bucket_rank 把『这只股票习惯性的成交时点 / 习惯性的趋势-反转风格 / 波动持续性』当成分桶变量,在同一桶内比尾部强度,非参数地剥掉这层『风格』混淆;种子 10、13 是不经过 bucket 的秩差版本,互相印证。 与库和 R 已见过的写法的区别:这条序列目前的 2 个 head、以及 R 轮 1 对它做的 8 个判别式,外围全部是『对同一条序列的归一化方式(cs_demean/cs_normalize/cs_rank/cs_robust_z/不归一化)』『取跨日极值的方式(ts_max/ts_mean/ts_med/argmax/quantile(0.9)/tail_mean)』『按一个静态字段分桶(LimitWidth/ListAge)』三选一,本质都是单变量序列换一种挤法;本位 13 个种子没有一个属于这三类,全部引入一个结构不同、本轮才被标为显著的第二统计量(时点、协同方向、自相关),和核心做同日或跨日联合,库里目前完全没有这种组合方式。 为什么样本外还会在:彩票偏好与注意力驱动的过度定价是慢变量,不依赖某一段行情;新增的三个判别维度都是无量纲或有界的秩差 / 相关系数类统计量,不靠挑某一个窗口常数吃饭,而是在问『这次尾部事件像不像一次真信息冲击』,联合判别式历史上被反复验证比单一水平统计量更稳健(Bali-Cakici-Whitelaw 2011;Amaya et al. 2015);窗口仍在已验证有效的 60-148 日平台上,没有引入新的未验证窗口自由度。
