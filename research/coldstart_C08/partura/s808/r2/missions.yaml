  - ts_max(cs_rank(day_wmean(Ret, Amt)), 99)
- head: cross_regbeta(day_cov(Open, Ret), day_wmean(Vwap, High), 241)
  why: 该 head(+1.303881)目前是全库最高分,但两条腿 day_cov(Open,Ret) 和 day_wmean(Vwap,High) 都是跨股票绝对尺度不可比的量(协方差随股价水平的平方量级变化,VWAP 本身就是价格水平),如果两条腿里有共同的『今天大盘整体如何』成分,每只股票的 241 日回归就可能部分在吸收一个共同的市场因子而不是纯粹的个股特质;这是 N 位要系统探索的问题,在 R 位先用两个最小改动直接测一遍。
  variants:
  - cross_regbeta(day_cov(Open, Ret), cs_demean(day_wmean(Vwap, High)), 241)
  - cross_regbeta(cs_demean(day_cov(Open, Ret)), day_wmean(Vwap, High), 241)
