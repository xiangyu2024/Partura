- type: N
  hypothesis: 新想法:个股『日内趋势-反转风格』是不是一个稳定的个股特质,这个特质本身(不是某一天的读数)能不能预测横截面收益。 直接灵感来自上一轮 N 位(c08s808Pr1b_Nb)GP 自己长出来、完全不在我们种子设想之内的那条新 head——目前全库最高分(+1.303881):`cross_regbeta(day_cov(Open, Ret), day_wmean(Vwap, High), 241)`。 拆开看:day_cov(Open, Ret) 是当天分钟『价格水平』(Open,逐分钟更新,近似当天累计走势)与『分钟收益』的协方差——为正说明这一天的收益更多出现在价格已经走高之后(追涨 / 动量延续),为负说明收益更多出现在价格走低之后(逢低买入 / 日内反转);day_wmean(Vwap, High) 是用每分钟 |High|(该分钟的振幅)给 Vwap 加权的均值,偏向这只股票当天波动最大的那些分钟的价格水平。cross_regbeta(X, Y, 241) 对每只股票单独做『过去约一年(241 个交易日)X 对 Y 的时间序列回归』取斜率——这不是某一天的信号,是『这只股票历史上,它的趋势 / 反转风格是否和它高波动时段的价格水平同向变化』这一件慢变量,接近个股自己的一个『行为类 beta』。loc.md 的拆解显示两个子部件单独上场都是负分(-1.79 / -1.34),alpha 完全来自『回归关系』本身;train(1.36)与 valid(1.30)非常接近,不像库里其它靠窗口选出来的 head 那样 valid 远高于 train,是一个支持『不是训练期运气』的信号。 机制(文献支持『个股有稳定的日内行为风格、要长窗口才估得准』这个大方向):Heston-Korajczyk-Sadka (2010) 直接证明个股自己的日内收益模式(哪半小时涨、哪半小时跌)在数周到数月内持续存在、且不被已知因子解释,支持把这类日内行为当作『个股特质、要长窗口才能可靠估计』而不是日频信号;Llorente-Michaely-Saar-Wang (2002)(上一轮已用过,这次换个角度:延续还是反转本身是个股的持续性格,随这只股票历史上信息交易占比不同而持续分化,不是偶然);Gao-Han-Li-Zhou (2018) 在美股证实日内价格路径的形状(最后半小时 vs 全天)本身携带可预测信息,支持『日内价格路径的形状』值得单独建模。 算子怎么实现它:把这个意外发现升级成一个结构化的族,而不是只守着那一个随机长出来的具体写法——① 换 X 腿(『今天的协同方向』用什么量):day_cov(Open,Ret) 原版、day_cov(High,Ret)(用振幅上限替代开盘价,检验是否必须用 Open)、day_corr(Open,Ret)(有界的相关系数版,去掉协方差天然随股价水平变化的尺度依赖,检验『协同方向』还是『协同的原始尺度』在起作用)、以及跨家族借用 day_wstd(Ret,Volume)(E 位核心,必须测的交叉验证:这个回归关系是不是只是在用另一种方式重新发现尾部波动);② 换 Y 腿(『哪些时段的价格水平』):day_wmean(Vwap,High) 原版、day_wmean(Close,High)(拆解里 swap Vwap->Close 已测到 1.33,略好于原版)、day_wmean(Vwap,Volume)(换成按成交量而不是振幅加权,检验是『高波动时段』还是『高成交时段』在起作用)、day_topw_mean(Close,High)(只看振幅最大的 10% 分钟,事件化版本)、day_wmean(High,Volume);③ 换窗口:120/180/361(241 与 482 已在拆解里测过,分别 0.46 与 0.70,都不如 241;本位补中间两个窗口,检验『一年』是否真是那个尺度还是241 本身也是 train 挑出来的);④ 换统计量种类:cross_regres(残差,检验『今天偏离历史回归关系多少』这个瞬时量是否比『历史回归关系本身』这个慢变量更有信息——如果残差版更好,说明这其实是个日频均值回复信号,不是个股特质)、cross_reg_tvalue(把斜率除以标准误,检验『统计显著性』是否比『斜率大小』更稳健,对估计样本少的新股是天然的收缩)、cross_regalpha(截距项,和斜率完全不同的信息维度,作为对照)。 与库里已有的不同:现在库里 8 个 head 没有一个用 cross_regbeta/regres/reg_tvalue/regalpha 这一族的『个股自身历史回归系数』,全部是『单一序列的跨日变换 / 极值 / 自相关』,或者就是这条意外跑出来的 head 本身;5 个控制(流动性、波动、20 日反转、已知族、市值)全部是水平或比值类统计量,没有任何『回归关系』类的度量,也没有任何『个股历史上两种日内行为是否联动』的度量,结构上是全新的一类统计量,不是现有任何 head 或控制换个写法。 为什么样本外还会在:cross_regbeta 用的是跨越约半年到一年半的回归窗口,天然是慢变量、换手率低,不依赖某一天或某一段行情;上一轮那条意外发现本身 train/valid 高度一致(1.36 vs 1.30),不是『valid 恰好配合』型的过拟合特征;其机制(个股有持续性的日内交易风格——由知情交易比重、投资者结构、流动性供给方式决定)是微观结构层面的慢变量,不会随某一段市场情绪改变,文献(Heston-Korajczyk-Sadka 2010;Llorente et al. 2002)显示这类个股特质本身能持续数周到数月。
