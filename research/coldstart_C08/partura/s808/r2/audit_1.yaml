  reasons: '机制成立:cs_demean(x)=x-cs_mean(x)(AlphaCube-steering/.../operators/nd_cs.py:114-115),是逐日减去当天全市场均值的纯算术运算,不除以任何量;如果某一天出现一字涨跌停的巨幅wstd离群值,会把当天cs_mean拉偏,让当天所有其他股票的demean值系统性偏移——why文本这个担心有源码支持,是真实的数值风险(没有爆点/下溢,只是均值被单点拖动,不是严格意义的§4数值伪影,但方向是对的)。cs_winsor(x)在当日1%/99%分位裁剪(partura/ops_ext.py:260-267,NaN保持NaN)是标准修复,变体1/2分别测『demean前裁剪』『demean后裁剪』,互为对照,设计合理。变体3把R_prev.json里没排除干净的『ListAge混淆』换成cross_valid_count(day_last(Close),241)(partura/ops_ext.py:288-297,源码注释写明就是为了做动态上市年龄/停牌代理),配cs_bucket_demean(y,x)(ops_ext.py:463-478,按x十分位减桶内均值,桶内n≥2才赋值,否则NaN,NaN安全)——比上一轮的静态ListAge分桶更干净地回应了R_prev.json留下的悬案,机制清楚。'
