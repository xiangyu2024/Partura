  - type: N
    hypothesis: >-
      新 idea:『成交量分布形状』作为算法/机构交易占比的代理。day_gini(Volume) 是当天分钟成交量的基尼系数(0 = 全天均匀,→1 = 集中在少数几分钟,有界、无量纲,源码里专门避免了除近零爆点),
      day_es_ratio_hi(Volume) 是 95% 分位以上分钟的均值除以该分位(右尾形状,分位为零的日子记缺失而不是爆点)。VWAP/TWAP 拆单的机构资金把量摊平(低基尼),
      散户与事件驱动的资金是脉冲式的(高基尼 / 高尾比);个股的这种形状是慢变的交易者结构特质,时间序列平均后接近一个『持股人结构』变量。
      灵感来自本种子前三批 M 的现象:库里的 head 大量依赖 day_centroid(Volume)(成交时点)和 day_wstd(Ret, Volume)(量加权波动),说明分钟成交量的『分布』携带截面信息,
      但时点只是分布的一阶矩,形状(集中度、尾部、峰值位置)库里从未出现。算子实现:种子用 ts_mean/ts_std 把日度形状变成慢变量,
      并分别用 cs_bucket_rank 对市值/换手分桶去混淆、用 ts_corr/ts_regbeta 看形状与量加权收益的联动(脉冲日是否伴随同向收益)、用 cross_autocorr_s1 看形状是否稳定。
      与库的不同:库里没有任何以 day_gini / day_es_ratio / day_at_max_ratio 作原子的 head 或候选;与控制的差别:流动性控制是成交额水平的排名,基尼是尺度无关的形状。
      为什么样本外还会在:持股人结构与交易方式(机构拆单 vs 散户脉冲)变化缓慢,且 A 股散户占比高、脉冲式交易带来的短期过度定价/彩票偏好是长期存在的行为现象,不依赖某段行情。
