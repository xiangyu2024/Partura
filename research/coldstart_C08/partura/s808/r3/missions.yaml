    core: 'ts_mean(day_centroid(Volume), 20)'
    hypothesis: >-
      核心是『20 日平均的成交量日内时间重心』:day_centroid(Volume) 是当天分钟成交量在 0(开盘)~1(收盘)上的质心,ts_mean 20 日平滑后是个股习惯性的成交时点。
      本种子的定位显示 cs_rank(ts_mean(day_centroid(Volume),20)) 单独就有 +1.28(train +1.75 / valid +1.28),且在 head +0.83 里是必要部件(去掉后 -0.09),
      同时它出现在 30 个候选里,是共性表里最稳的原子之一;它在库里目前只被当作『另一个量的秩差的减项』(sub(cs_rank(wstd-kurt), cs_rank(核心)))或 cross_tail_mean 的输入,
      从没被拿来做时间序列层面的处理。机制:成交重心偏后(尾盘集中)的股票由机构收盘定价/指数调仓/尾盘拆单主导,偏前的由散户开盘情绪与隔夜消息主导,
      这是个股的执行结构特质,慢变、不依赖行情(Admati-Pfleiderer 1988 的日内成交分布理论)。本轮的外围全部换成库里没有的『对核心做二阶处理』:
      (1)重心的漂移(20 日 减 120 日,种子 5)和不稳定度(ts_std,种子 3;自相关,种子 4;ts_rank,种子 12),问的是『习惯』的变化而不是水平;
      (2)用分桶把核心放进别的字段里比较(LogFloatShares 分桶、day_distinct_ratio 分桶,种子 1、8)——和已知的 cs_rank 减法完全不同的去混淆方式;
      (3)与长窗口回归链路结合(种子 6、11:对 Open-Ret 协同或波动做 beta,借用本种子唯一两个独立 head 的 cross_regbeta 骨架),(4)尾部统计与时序相关(种子 7、9)。
      已见过的含该核心的外围只有 cs_rank 单包、sub/add 与 cs_rank 的两腿组合、ts_max 包装,上述写法均不在其中。
      为什么样本外还会在:成交时点结构由市场微结构(集合竞价、尾盘指数/基金调仓习惯、散户占比)决定,是慢变量;且本核心 train/valid 同号(+1.75/+1.28),不靠单一窗口常数。
