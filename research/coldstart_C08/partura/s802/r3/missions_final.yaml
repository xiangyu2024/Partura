- type: E
  core: day_quantile_q25(Close)
  hypothesis: '核心 = day_quantile_q25(Close),本轮定位共性表第 1 行(均值差 +1.32,p=0.000,11/514
    个已评分候选含它),机械核心卡第 12 项。本实验对它的第 1 次、也是本种子仅剩的一次 E 机会(第 3 轮是最后一轮)——一个和前两轮核心(day_mean(in_delta(Volume,30))、day_centroid(Volume))完全不同维度的信号:前两者都是"当日成交量在
    241 根分钟上怎么分布"(时点类,字段是 Volume/Amt),这一个是"当日 Close 价格分布的下四分位数"(水平类,字段是 Close),是本种子迄今第一个不建立在成交量日内分布之上的核心。


    定义:day_quantile(x, 0.25) 取当日 241 根分钟 Close 的下四分位数(torch.nanquantile,已读 AlphaCube
    源码 alphacube/operators/dt_day.py)。同一天内复权因子是常数,这个值本质上是当日价格水平的一个稳健代理(比 day_last(Close)
    更不受尾盘单笔极端报价影响)。按天在全市场截面上排序,约等于规则 §4 明确认可的"复权价格的截面排序 ≈ 自某基期以来的累计收益,是长周期动量/反转信号"——但这不是它唯一的信息来源:不同股票的名义股价水平同时还携带了与累计收益无关的信息,即历史上选择的面值
    / 是否拆股 / 配股,这正是"名义股价错觉"(nominal price illusion)文献研究的对象。


    机制(借用的是文献的机制,不是对具体数值结论的直接复现):Birru & Wang(2016)发现名义股价本身(不只是它背后代表的基本面)系统性影响投资者行为——同一家公司,股价名义水平更低时,投资者倾向把它当作"更便宜、上涨空间更大"对待;Kumar(2009)发现这类低名义价、高波动的"彩票型"股票存在持续的超额彩票需求,并伴随随后偏低的风险调整收益。两篇文献共同支持的机制是:day_quantile_q25(Close)
    作为名义价格水平的代理,其截面排序里除了长期动量/反转那部分,还叠加了一层"名义价格错觉 / 彩票偏好"驱动的、不随某一段行情变化的行为性定价偏差。


    但名义价格和两个明显的混淆变量机械相关,外围的任务是把它们分开:


    (1) 和分钟级价格网格粗糙度的分歧。day_distinct_ratio(Close)(ops_ext.py,已读源码,文档原文:"on a price:
    how many price levels the day visited -- coarse for low-priced stocks on a one-tick
    grid")直接测的就是"当日 Close 访问过多少个不同价位、除以分钟数"。同样的最小报价单位(如 0.01 元)下,股价越低,相对跳动的绝对价位格数越少,价格网格天生更粗——这是一个纯机械的分母效应(Harris,
    1994,最小报价单位系统性放大低价股的相对买卖价差 / 报价粒度),和"名义价格错觉"这种行为性机制不是一回事,但两者高度共线。mul(core, day_distinct_ratio(Close))
    直接测两者的乘积交互;cs_regres(core, day_distinct_ratio(Close)) 去掉网格粗糙度能解释的那部分,剩下更纯粹的"价格水平本身"效应;cs_regres(day_distinct_ratio(Close),
    core) 做反方向正交化,检验网格粗糙度里有没有不能用价格水平解释的部分(比如停牌/半停牌造成的粗糙,而非单纯低价造成的粗糙)。


    (2) 和市值的分歧(名义股价 ≠ 市值:同样市值下股本越大则每股价格越低,两者机械相关但不是一回事)。cs_regres(core, LogFloatCap)
    去掉市值能解释的那部分名义价格;再叠加 (1) 的网格正交化,cs_regres(mul(core, day_distinct_ratio(Close)),
    LogFloatCap) 与双层正交化版本 cs_regres(cs_regres(core, day_distinct_ratio(Close)), LogFloatCap),检验"名义价格效应"在同时去掉网格粗糙度和市值之后是否仍然存在——如果仍然存在,更接近行为性的价格错觉,而不是机械的规模/粒度效应。


    (3) 变化而非水平:cross_mean(·, 20) / cross_delta(·, 5) 的持续性 / regime 版本,测的是这个价格网格交互是稳定特征,还是最近才出现(比如最近连续缩量导致网格变粗)。


    样本外还会在的理由:名义价格错觉/彩票偏好是投资者认知层面的行为模式,不依赖某一段行情的强弱;报价单位(tick size)是交易所规则,长期稳定。数学上:day_distinct_ratio
    要求至少两根有效分钟(n > 1)才有定义,没有除零;day_quantile 用 torch.nanquantile,对缺失值安全;cs_regres 内部方差分母有
    EPS 保护;10 个种子里没有一个用裸 div()。


    诚实的风险披露:核心本身的截面排序大概率带有相当一部分长期动量/反转色彩(规则 §4 已说明这不算问题,但也不是全新现象),审计更可能把创新度打在"快照里确实没人直接用
    Close 的分位数做核心"这一点上,而不是"机制闻所未闻"。这也是本种子两轮 E 位里第一次完全脱离 Volume/Amt 字段的尝试;如果 0 个 head
    产出,最可能的原因是行为性价格错觉在扣 15bp 成本、残差化市值/反转/流动性控制之后信息量不够,而不是设计判断错误。受什么启发:round2 的 E 位(核心
    day_centroid(Volume))在我们完全没有设计这个方向的情况下,GP 自由生长出的 3 个 head 里有 2 个用到了 day_zero_ratio(Close)/day_centroid(Volume)
    的交互(score +0.83、+0.81,见 loc.md 共性表第 15、18 行),说明 Close 价格分布这条线索已经被 GP 自己摸到、证明过有信息量——这轮把它从"GP
    偶然撞上"升级为"PI 主动设计的核心",用更直接的操作(分位数本身,而不是停滞比例)正面触碰同一层信息。'
