R:
- head: day_mean(in_delta(Volume, 30))
  why: head 恒等于 (最后 30 分钟成交股数和 − 最前 30 分钟成交股数和)/211。三个部件有证据是可疑的:(1) 窗口:valid 腿随窗口单调下降(d=15
    1.34、30 0.98、60 0.52),train 腿在 30 最高,两端各被一条腿卡住 → 测 3/5/10 与无量纲的 15;(2) 尺度:原始股数差没有除以任何量,截面两尾被高成交量的票占据,对流动性排名的多项式残差化去不掉这种异方差;Volume→Amt
    已证明金额口径会推向控制(ρ_known 越过 0.5),所以只试股数口径的尺度化(当日量、自身 20 日均量、流通股 = 换手率口径);(3) 端块的构成:望远镜相消后只剩两端块,每块都把一个集合竞价分钟和
    29 个连续竞价分钟混在一起,而文献把竞价份额与连续竞价份额当两个量,且上交所 2018-08-20 起有收盘集合竞价(train 内部的制度断点)→ 测只用竞价、只用连续竞价、只用开盘侧、只用收盘侧、上下午半天口径;(4)
    day_mean 的望远镜性质让中间 181 分钟作废 → 用 day_median 换掉,测中间段是否有同样的信息。不放 Amt 版、day_sum 版(与
    day_mean 只差常数)、窗口 241(全 NaN)。
