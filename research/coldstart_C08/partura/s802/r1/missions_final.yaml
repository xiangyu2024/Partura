- type: E
  core: day_mean(in_delta(Volume, 30))
  hypothesis: '核心 C = day_mean(in_delta(Volume, 30))。in_delta 在分钟轴上做 30 分钟差(前 30 分钟为
    NaN),day_mean 是 nanmean,所以和式精确望远镜相消:C ≡ (最后 30 分钟成交股数之和 − 最前 30 分钟成交股数之和)/211,中间
    181 分钟完全没用上(已用 numpy 对 d=5/15/30/60 验证)。库里唯一的 head 就是它本身(sign −1,半衰期 20,train
    0.69 / valid 0.98):做多「开盘端重、收盘端轻」的票。窗口 15/30/60 都 ≥ 0.5,换成成交金额 Amt 掉到 −0.81 并越过与已知族
    0.5 的线 → 它是关于成交时点结构(谁在开盘交易、谁在收盘交易)的信号,不是流动性水平。

    外围刻意不做「除以一个日频标量」(C/当日量、C/流通股、按量分桶标准化):截面排名口径下 C 的排序主要由 sign(C) 决定,我做的数值模拟里 C 与
    C/V 的秩相关约 0.85,库禁令会直接拒掉;这类纯尺度化放在本计划的 R 里直接评估,不占 GP。E 只做四类改变信号性质、无法被提进核心内部的外围:

    (1) 时点画像的持续性(无量纲)。cross_ema(sign(C), 10) = 近期「收盘端重」天数的指数加权净占比;div(cross_mean(C,20),
    cross_stddev(C,20)) = 倾斜的 20 日信息比。机制:head 在半衰期 20 上胜出,说明 alpha 在慢变的「成交时点画像」——收盘端重的票由以收盘价为基准的机构流
    / 尾盘资金主导,开盘端重的票由消化隔夜信息的交易主导;扔掉幅度、只留一致性,去掉的是单日噪声和成交量量级。

    (2) 相对自身历史的异常时点。cross_zscore(C,20)、cross_delta(C,5)、ts_regres(day_sum(Volume),
    C, 20)(本股 20 日内当日成交量水平解释不了的倾斜)、cross_regbeta(day_sum(Volume), C, 20)(本股放量时多出来的量落在开盘还是收盘,量纲抵消)、mul(C,
    cross_zscore(day_sum(Volume),20))(异常放量日的倾斜)。机制:文献里异常成交量有差值型与比值型两种定义(关注度、意见分歧);这里把「异常」从量的大小移到量的时点——隔夜新闻引起的放量集中在开盘,指数调整
    / 机构建仓引起的放量集中在收盘,两者对后续收益的含义不同。

    (3) 用价格给时点定性。mul(C, sign(day_sum(Ret)))、cross_mean(mul(C, sign(day_sum(Ret))),
    20)、cross_corr(C, day_sum(Ret), 20)、C × 开盘跳空 (day_first(Open)/前收 − 1)、C 与最后 30
    分钟收益 day_sum(in_slice(Ret,211,240)) 的秩中心化乘积。机制:Llorente 等——量伴随收益时,知情交易导致延续、流动性
    / 对冲交易导致反转;Boyarchenko 等——尾盘带方向的买卖失衡之后回吐。收盘端重 + 当日上涨 = 尾盘买压(拉升),收盘端重 + 下跌 = 尾盘抛压,开盘端重
    + 跳空 = 隔夜信息被关注度驱动的资金在开盘消化;原 head 把这些方向相反的情形混在一起。

    (4) 把集合竞价与连续竞价拆开。cs_regres(C, day_mean(in_delta(Volume, 5))) = 30 分钟倾斜里不能被「以两端集合竞价为主的
    5 分钟倾斜」截面解释的部分,即连续竞价阶段的时点倾斜。机制:Givry(AMF)指出收盘集合竞价份额与最后 30 分钟连续竞价份额是两个走势不同的量;Han
    等(2022)显示上交所 2018-08 引入收盘集合竞价后,成交从尾盘连续竞价挪进了集合竞价。

    与以前不同:快照里含该核心的候选外围只见过 neg / neg∘neg(等于没加),共现材料是 day_last(Amt)、cs_robust_z、cs_median、cs_stddev_full、sigmoid(LimitWidth)、day_flat_run_max(Vwap)
    这类截面标准化与旗标;没有任何候选做过时间序列持续性 / 异常化、价格定性或竞价拆分。每个种子的外围算子集合互不相同。

    样本外还会在的理由:成交时点由投资者结构与交易制度决定(机构以收盘价为基准、散户集中在开盘),是慢变量;全部外围都是无量纲、秩或相关口径,不依赖成交量水平,不会因市场整体放量缩量而漂移;(3)(4)
    有文献给出的方向性机制,不是纯拟合。数学上:只用当日 15:00 及以前的数据;分母只有 cross_stddev(C,20)(20 日内 C 恒为 0 的极薄票为
    NaN,不是爆点)与前收价(恒正);sign 的离散性被 cross_ema 的几何权重化开,不会掉进 distinct 门槛。'
