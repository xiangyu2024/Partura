- type: N
  hypothesis: '量价耦合:成交量是跟着价格上涨来的还是跟着下跌来的,放量的那几分钟价格走得多猛。快照里唯一的 head 只看量在什么时候来(两端块差,无符号),对价格完全无视;而量的信息含量取决于它与收益的耦合方式——Llorente
    等(2001):知情交易驱动的量伴随收益延续,对冲 / 流动性驱动的量伴随反转,区分二者的正是量与收益的协动;Barber & Odean(2008):引起关注的放量时刻是散户集中净买入的时刻,随后收益偏低;Gervais
    等(2001):异常放量改变可见度,带来之后的收益差异。所以「量伴随什么样的价格变化」是独立于「量在什么时候」的另一维信息。

    算子实现(全部是日内分钟级、全部无量纲): (a) 方向耦合:day_corr(Ret, Volume);day_corr(Close, Volume)(放量时价格处在日内高位还是低位);day_corr(Ret,
    in_delta(Volume,1))(量增的那一分钟是涨还是跌);day_signed_ratio(Ret, Volume)(上涨分钟成交占比 − 下跌分钟成交占比,不需要逐笔数据的净买压);sub(day_wmean(Ret,
    Volume), day_mean(Ret))(量加权分钟收益 − 等权分钟收益:重的分钟是否偏涨)。 (b) 先后关系:day_corr(Ret, in_delay(Volume,1))(量领先价:知情压力),day_corr(in_delay(Ret,1),
    Volume)(价领先量:追涨杀跌 / 关注度跟随)。 (c) 放量时刻的价格行为:in_zscore_rolling(Volume,30) 把每分钟的量相对此前
    30 分钟标准化(去掉日内 U 型的机械成分);day_topw_mean(Ret, 它) = 放量最突出的 10% 分钟的平均收益;div(day_topw_mean(abs(Ret),
    它), day_mean(abs(Ret))) = 放量时刻的波动是当日平常分钟的几倍(对关注度冲击的过度反应,除以当日平均绝对分钟收益切断与波动水平的联系);day_topw_mean(Ret,
    Volume) = 当日最重的 10% 分钟(主要在开盘与收盘)的收益,即 head 的价格那一面。day_corr(abs(Ret), Volume) =
    信息到达(量与价格变动同步)的强度。 (d) 持续性:cross_mean(day_corr(Close, Volume), 20)、cross_mean(day_signed_ratio(Ret,
    Volume), 20):平均掉单日噪声,得到本股的量价耦合画像(深交所的 A 股资金流向研究报告:分钟级资金流向有中期反转)。

    与库里已有的不同:库里只有无符号、只看两端的成交时点;这里全部是带符号或相对波动的量价协动,没有一项用到「量在开盘还是收盘」,也没有成交量水平(全是相关系数、占比、比值),与流动性
    / 规模控制在构造上无关。

    样本外还会在的理由:它度量的是谁在交易(关注度驱动的散户 vs 知情 / 机构),不是某段行情;A 股散户占比高、关注度驱动的放量追涨是制度与投资者结构决定的;(d)
    的 20 日均值是慢变量,换手低,扣 15bp 后更稳。数学上:只用当日分钟数据,无前视(首分钟若含隔夜跳空,9:30 已知);一字板日分钟收益全为 0 时
    day_corr 为 0 的少量并列,不影响 distinct;唯一的除法分母是当日平均绝对分钟收益,与分子同单位,比值有上界(约 241/24),不会爆点。'
