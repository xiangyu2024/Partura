slots:
  - slot: a
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度:不是 head 的换皮。13 个种子与唯一的 head day_mean(in_delta(Volume, 30)) 的原始 |ρ| 在 0.02–0.61 之间,最高的是种子 3 cross_zscore 和种子 13 cs_regres(都是 0.61,< 0.7);残差 |ρ| 除种子 13(0.69)外都 ≤ 0.57。种子 7–12 用当日收益方向、开盘跳空、尾盘 30 分钟收益、异常放量给时点倾斜定性,原始 |ρ| ≤ 0.13、残差 ≤ 0.37,是库里没有的维度,属于实质性的扩展,给 4。核心与控制的最大 |ρ| 是 0.43(known),< 0.8,满足 E 位条件;13 个种子都原样含核心,外围算子集合两两不同,也不同于 M 见过的 neg / neg∘neg。

      合理度:逐个核对了算子。in_delta 把前 30 列置 NaN,day_mean 是 nanmean,所以 C ≡ (第 211–240 列之和 − 第 0–29 列之和)/211 成立。ts_regres(V, C, 20) 和 cross_regbeta(V, C, 20) 都走 rolling_ols(x, y),即 y ~ x,分别是 C 对当日量回归的残差和斜率,与计划一致;斜率的量纲抵消。cs_regres(Y, X) 是 C30 对 C5 的截面残差,方向对。in_slice 两端都是闭区间,(211, 240) 正好是最后 30 列(含 15:00 那一列)。cross_ema 的 d 是半衰期,cross_zscore 的窗口含当天。没有前视:只用当日 15:00 以前的数据和前一日收盘。没有落进 §4 的问题,所以不划种子。

      有几处要知道,但都不构成挡的理由:(i) 种子 2 的 cross_stddev 是总体标准差,div 不设防;20 日窗口里只有 1 个有效日时(复牌首日、上市首日、样本第一天)分母为 0,得 ±inf。只是零星格子,不支配截面。(ii) 种子 1、2 与已知族的原始 |ρ| 是 0.56 / 0.50,与流动性是 0.57 / 0.53。离 0.8 还远,不划;但它们原样就站在「与已知族 ≥ 0.5 不合格」那条线上,只有当 GP 从它们往外长、把这部分甩掉时才有用。(iii) R 变体 11(去掉两端竞价列)与 head 的 ρ 是 0.99,说明 head 的排序几乎不来自竞价列。所以种子 13 实际去掉的是两端各 5 分钟的块,而不是「集合竞价」;另外 cs_regres 在原始股数上做 OLS,β 由成交量最大的那些票决定。如果想要更干净的拆分,可以先做尺度化或取秩,再求残差。(iv) 种子 4、5、7、8、9、11、13 保留了股数量纲,截面两尾由高成交量的票占据。head 本身就是这样,这不是数学问题。

      如果它有 alpha,最可能来自用价格方向给时点倾斜定性(种子 8–12:收盘端重同时上涨 = 尾盘买压,同时下跌 = 尾盘抛压,之后回吐);其次来自时点画像里的慢变成分(种子 1–3)。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度:库里唯一的 head 是不带符号的成交时点(两端块之差),而这里度量的是另一件事。13 个种子与 head 的原始 |ρ| ≤ 0.25(最高的是种子 9),残差 |ρ| ≤ 0.31。与 5 个控制都 < 0.8,只有种子 13 cross_mean(day_signed_ratio(Ret, Volume), 20) 与 20 日反转是 0.56:20 日的带符号成交占比天然与 20 日收益相关,中度相关不是挡的理由。量价协动这一整个维度库里没有,给 4。不给 5,是因为 day_corr(Close, Volume) 及其 20 日均值、日内量价相关这一类在 A 股是成熟的公开构造。

      合理度:逐个核对了算子。day_corr 要求 count ≥ 2,分母加了 EPS,收益全为 0 的日子得 0 而不是爆点。day_signed_ratio 在 [−1, 1] 内。day_wmean(Ret, Volume) − day_mean(Ret) 恰好等于 cov(Ret, V)/mean(V),无量纲,但带有日内波动的量级。in_delay 只在当日的分钟轴上平移,没有前视。种子 9 的比值上界约为 241/24;分母为 0 时分子也为 0,得 NaN 而不是爆点(覆盖率 0.997)。没有落进 §4 的问题,所以不划种子。

      有两处与描述不完全一致,但都不是数学问题:(i) day_topw_mean 按 |w| 取前 10%,所以种子 8、9 选中的是 |z| 最大的分钟,其中也包括异常缩量的分钟,而不只是「放量最突出」的。成交量右偏,选中的多数仍是放量分钟;如果只想要放量,可以把权重换成 z 的正部,例如 add(z, abs(z))。(ii) in_zscore_rolling 的窗口在开盘后前 29 分钟不满,而且含 09:30 竞价那一列,所以早盘的 z 被压低;第 1 列的 z 恒为 ±1。另外,第 0 列(09:30 竞价)和第 240 列(15:00)成交最重,如果 Ret 的第 0 列含隔夜跳空,种子 1、10 有一部分是在度量跳空方向。这在 9:30 已知,不是前视。

      如果它有 alpha,最可能来自关注度驱动的「放量追涨」:日内价格处在高位、上涨分钟伴随放量的票(散户净买入)随后偏弱。20 日均值版(种子 12、13)更稳,换手也更低。'
    revise: '—'
R:
  - head: 'day_mean(in_delta(Volume, 30))'
    soundness: 4
    reasons: '整组是在直接检验 head 的各个部件,机制清楚:窗口(3/5/10);尺度化(除以当日量、20 日均量、流通股,以去掉 head 两尾被高成交量的票占据的异方差);竞价列与连续竞价分开;开盘侧与收盘侧分开;上午与下午;中位数代替均值。逐个核对:in_slice 是闭区间,(0, 29) 与 (211, 240) 各 30 列。in_half 的前半是第 1–120 列,后半是第 121–240 列,所以变体 15 的后半含收盘那一列,前半却不含开盘竞价列;口径不对称,但不算错。各个除法的分母都是当日或 20 日的成交量,为 0 时分子也为 0,得 NaN,不是爆点。

      真正有问题的只有变体 16 day_median(in_delta(Volume, 30)):distinct 0.089,相关度表已判为废品。分钟量差的中位数大量落在同一个值上,面板几乎全是并列,属于 §4 的「面板几乎是常数」,应删掉、不评估。

      另外几点提醒:变体 11 与 head 的 ρ 是 0.99,几乎是同一个东西,只有在 score 高出 0.1 时才会替换,无害。变体 7 用的 FloatShares 不在规则列出的 6 个日频叶子里;引擎把它当作存储字段解析,信息与 LogFloatShares 相同,这是规则口径问题,不是数学问题。变体 9、14 用到的 15:00 那一列,在上交所 2018-08-20 前后含义不同(此前没有收盘集合竞价),train 内部有一个制度断点。

      如果它有改进,最可能来自尺度化去掉成交量水平(变体 4–7、12),或来自开盘侧 / 收盘侧份额(变体 8–10、13、14;其中变体 9 与 head 的 ρ 只有 0.23,过关的话会作为新 head 收录)。'
summary: '两个任务位都通过:E 位(head 核心外围的持续性、异常化、价格定性、竞价拆分)创新度 4、合理度 4;N 位(日内量价协动)创新度 4、合理度 4。逐个核对算子,没有数学问题,两个位都不划种子,各剩 13 个。R 组合理度 4,其中变体 16(day_median,distinct 0.089,已判废品)应删掉。'
