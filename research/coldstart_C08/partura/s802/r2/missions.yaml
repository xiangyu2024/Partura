    core: day_centroid(Volume)
    hypothesis: |-
      核心 = day_centroid(Volume)(本轮快照共性表第 8 行,均值差 +1.81,p=0.000,54/302 个已评分候选含它,是本轮证据最强、最干净的一个原子子树;机械核心卡第 8 项)。

      定义(照 Partura 算子源码 ops_ext.py:155 day_centroid,已读源码):centroid = Σ_t t·|Volume_t| / Σ_t |Volume_t| / (T-1),t 是当日从 0 到 T-1 的分钟序号(T=241,09:30 集合竞价 + 240 根),取值在 [0,1],0=全部成交在开盘那一刻,1=全部成交在收盘那一刻,0.5=对称。它是当日成交量沿分钟轴分布的一阶矩——一个数概括"这一天的量整体偏向开盘端还是收盘端"。源码里分母已 clamp(min=1e-30),不是我们自己加的保护。

      和第 1 轮核心的关系与区别:第 1 轮核心 day_mean(in_delta(Volume, 30)) 经代数验证恒等于(最后 30 分钟成交股数和 − 最前 30 分钟成交股数和)/211,只用了头尾两个 30 分钟块,中间 181 分钟被精确相消丢掉(第 1 轮 analysis.md §1.1 已证)。day_centroid 用的是全部 241 根分钟线的加权,任何一根分钟的成交量变化都会牵动它,包括第 1 轮核心完全看不到的中间段——这是两个核心在构造上真实、可验证的不同,不是同一个量换了写法。本轮共性表里 day_centroid(Volume) 单独出现在 54/302 个候选里,比第 1 轮唯一的 head 本身证据还强,而且是本轮 M 第 2 批里绝大多数高分 head(12 个里 8 个)共用的底层材料——但 M 自己在它外面长出的全部是 cross_quantile_q25(···, 241) → ts_argmin(···, 20) → cs_first_high40(···) 这一整套"截面滚动分位数 + 时序找极值位置 + 条件排序"的复杂机械,从未有任何候选在它外面做过标准化、与其他字段比较、或与价格条件化这类"改变信号性质"的操作。这正是深挖该做、而且现在竞争最少的空当。

      本轮外围四类,刻意不碰 M 已经用到饱和的 cross_quantile_q25/ts_argmin/cs_first_high40 组合(骨架会直接撞库禁令,也不是新信息):

      (1)份额口径 vs 金额口径的分歧。核心本身是按股数(份额)算的时点,还没有任何候选拿它和同一个算子在金额口径下的结果比较过。sub(day_centroid(Volume), day_centroid(Amt)):同一天,按股数算的"量在什么时候来"和按金额算的"钱在什么时候来"如果不一致,说明大额(或高价)交易和小额(或低价)交易发生的时间点不同步——Easley & O'Hara(1987)的做市商模型里交易规模本身携带信息(知情交易者偏好更大的单子,做市商据此定价),所以"份额时点"和"金额时点"的背离是在检测"大单和散单在日内是否错位发生",这是和核心本身测的"量整体偏向哪一端"完全不同的维度。cross_mean(·, 20) 是它的 20 日持续版本(区分结构性错位和单日噪声);cs_regres(·, ·) 是去掉两者截面上惯常共同变动部分之后的当日残差。

      (2)和日内集中度交互。day_gini(Volume) 在本轮全部 302 个候选里从未出现过,是全新的组合算子:它刻画当日成交有多"扎堆"(0=全天均匀,→1=几分钟内全部成交)。mul(day_centroid(Volume), day_gini(Volume)) 区分"晚且扎堆"(临近收盘的一次大宗冲击)和"晚但分散"(全天逐步往后移、持续的尾盘资金流)——这两种情形不该是同一回事:前者更像事件驱动的一次性冲击,后者更像制度性、慢变的"谁在交易"画像。cs_regres(·, ·) 是去掉典型共同变动后的残差,cross_mean(·, 20) 是 20 日持续版本。

      (3)惯常水平 vs 当日异常(标准的 trait-vs-transient 分解,但施加在一个全新核心上,检验的是"交易时点结构"本身是不是一个慢变、持久的股票特征)。cross_mean(·, 20)、cross_zscore(·, 20)、cross_delta(·, 5):哪些股票习惯性偏开盘端 / 偏收盘端(可能和股东结构、散户 / 机构占比有关——机构执行常以收盘价为基准,散户集中在消化隔夜信息的开盘),哪些只是今天偶然偏离自己的历史基线,哪些正在经历时点结构的迁移。Heston, Korajczyk & Sadka(2010)发现日内固定半小时分段的收益存在跨天的自相关持续性,支持"日内时点结构里存在跨天可持续的部分、值得单独萃取"这个大方向(该文献测的是收益分段自相关,不是成交量重心,这里是机制上的借用,不是对这个具体构造的直接验证)。

      (4)用"昨天"而不是"今天"的价格方向做条件化——和第 1 轮 E 位、N 位里反复用的"今天收益符号 × 核心"或"核心与今天收益的相关系数"是不同的提问方式,这里问的是领先—滞后关系,不是同期关系。mul(day_centroid(Volume), sign(ts_delay(day_sum(Ret), 1))):昨天收出的方向,是否系统性地决定了今天的量往哪个方向偏。Boyarchenko, Larsen & Whelan(2020)发现美股尾盘带方向的成交失衡之后出现隔夜反转,机制是做市商吸收尾盘失衡后把库存转移给隔夜其他投资者——这预测的是"昨天尾盘失衡的方向"领先影响"今天的交易时点结构",和同期条件化问的是不同的因果方向。cross_mean(·, 20) 是它的持续版本。

      样本外还会在的理由:四类外围全部是无量纲的差、残差、持续均值或条件乘积,不依赖随市场整体放量缩量漂移的量级水平;(1)(2)把"时点"这同一个底层事实拆成了相互独立的切面(份额 vs 金额、位置 vs 集中度),对应的是交易者结构(谁在交易、单子多大、多集中)这类慢变的制度 / 投资者结构性质,不是某一段行情的拟合;(4)有文献给出明确的领先—滞后方向预期,不是单纯堆砌条件化。数学上:day_centroid、day_gini 的分母在源码里都已 clamp 保护;11 个种子里没有一个用裸的 div() 做分母,cross_zscore 是框架自带、文档里写明对近乎常数窗口有 EPS 保护的算子,不会把近零分母的爆点带进截面。
