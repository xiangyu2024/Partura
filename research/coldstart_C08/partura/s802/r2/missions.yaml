  - type: N
    hypothesis: |-
      新 idea:A 股限售股解禁 / 股份供给冲击,是一个和"量在什么时候来"完全不同维度的结构性信号——不看成交怎么分布,看的是可交易股本本身什么时候、为什么突然变多。

      机制:A 股 IPO 与再融资都有法定限售期(控股股东 / 实控人通常 36 个月,其他发行前股东、战略配售、定增参与方多为 6—36 个月不等)。限售期到期当天,一批此前不可交易的股份一次性计入流通股本,LogFloatShares(流通股数的对数,六个日频字段叶子之一)在那一天跳升,此前此后基本走平——这是一个离散事件,不是连续漂移。经典的供给冲击 / 价格压力理论(Scholes 1972:个股需求曲线不是完全水平的,大额、突然的供给增加如果不能被完全的替代效应吸收,会压低价格)预测这类事件应对价格有负面影响;Field & Hanka(2001)在美股 IPO 解禁样本上实测到解禁后成交量永久性 +40%、解禁日前后三天 −1.5% 的异常收益;刘娥平、唐舜(2014,《财经研究》)在 A 股限售股解禁样本上用期权定价模型刻画"可交易性折扣"并提出"可交易性价值转移"假说,发现累计异常收益在解禁前持续下行、解禁后略有回升,且新增流通股占比越高、套利风险越大、股东减持意愿越强,负面影响越大——这给了"流通股数突然跳升"一个方向明确、且专门在 A 股市场验证过的机制,不是凭空猜测。

      受什么启发:本轮共性表 / 机械核心卡第 19 项 ts_argmin(cross_quantile_q25(LogFloatShares, 241), 40)(均值差 +0.87,p=0.060,15/302 个候选含它)是整个共性表里唯一一个不建立在 Volume/Amt 任何形式之上的条目,指向限售股解禁这条和本轮 E 位、第 1 轮两个位完全不相关的独立机制。但这一项本身只回答了"过去 40 天里,241 天滚动 25 分位数的最低点出现在第几天前"——是一个相当绕的时点代理,没有直接量出"跳了多少"或"跳得多不寻常"。本轮把这条线索拆成四类更直接、机制分得更清楚的构造,全部围绕 LogFloatShares,不碰任何 Volume/Amt(与本轮 E 位、第 1 轮两个位在字段上完全不重叠),也不把 liq/known/size 五个控制本身当信号用(唯一例外是第 (3) 类里把 LogFloatCap 当回归自变量去正交化,不是把控制包装成信号):

      (1)跳的发生与幅度,直接测(比 argmin 式的间接时点代理直接得多):cross_delta(LogFloatShares, 5)——周度跳变,专门捕捉解禁当天本身(非解禁日应恒为 0 或接近 0,离散事件会在这里形成孤立尖峰);cross_delta(LogFloatShares, 20)——月度累计跳变,覆盖"最近一个月内发生过解禁、价格压力窗口大概还没完全消化"这个区间;sub(LogFloatShares, cross_quantile_q25(LogFloatShares, 241))——当前股本高出自己过去一年低位基准多少,是跳升的累积超调幅度,和核心卡第 19 项问的是同一现象的另一个切面(幅度而非时点),互补而非重复。

      (2)跳变本身的标准化与频率(区分"真正异常的一次性解禁"和"持续性的小额增发 / 期权行权"):cross_zscore(cross_delta(LogFloatShares, 20), 241)——这次月度跳变相对该股自己历史跳变波动率有多异常,用框架自带、带 EPS 保护的 cross_zscore,而不是裸除以 cross_stddev,避免长期不解禁的股票 241 天窗口里跳变标准差恰好为 0 造成的除零爆点;cross_mean(is_gt0(cross_delta(LogFloatShares, 1)), 20)——过去 20 天里有多少天股本在涨,测频率而非幅度,专门挑出"分批解禁 / 持续小额增发"这种和单次大额解禁不同的供给节奏;cross_mean(cross_delta(LogFloatShares, 5), 60)——60 天平滑版本,捕捉需要多个交易日才完全登记到位的解禁(过户、工商变更等行政环节的时滞)。

      (3)相对规模正交化(排除"大公司解禁规模天然也大"这种和市值相关的机械关系):cs_regres(cross_delta(LogFloatShares, 20), LogFloatCap)——去掉市值对跳变幅度的典型截面解释力之后,剩下的"对这个规模的公司来说不寻常的跳变"。

      (4)自身节奏之外的加速与互补读数:sub(cross_delta(LogFloatShares, 20), cross_mean(cross_delta(LogFloatShares, 20), 241))——这一个月的股本增长速度相对这只股票自己过去一年的平均增长节奏是不是明显加快了,把"本来就在稳定扩股"和"突然来了一波解禁"分开;cross_zscore(LogFloatShares, 241)——水平的标准化位置;ts_argmax(abs(cross_delta(LogFloatShares, 1)), 120)——过去 120 天里最大单日跳变发生在多少天前,用更长窗口交叉验证核心卡 argmin 式时点线索的稳健性。

      和库里已有东西的区别:库里现在 12 个 head 全部建立在 Volume/Amt 的日内分布或水平之上,没有任何一个用到六个日频叶子字段里除 LimitWidth(已被第 1 轮判定为板块信息、不该用)之外的任何一个。这里的信号来源(法定限售期到期这个离散的制度事件)和成交时点、量价耦合这两条已经试过的路线在经济机制上完全独立。

      样本外还会在的理由:限售期是法律规定的固定期限,不会因为市场整体行情好坏而改变,是制度性、可预先排期的事件,不依赖任何需要持续重新学习的市场状态;文献(Field & Hanka 2001、刘娥平 & 唐舜 2014)在美股和 A 股两个市场、不同年代的样本上都观测到方向一致的效应,不是某一段特定市场环境的产物。数学上:LogFloatShares 是取对数后的非负日频字段,内部没有裸除法——(3)类用 cs_regres 做正交化,(2)类用 cross_zscore 而非裸 div,已避开近零分母风险;is_gt0 返回有界的 0/1,cross_mean of that 有界在 [0,1];cross_delta/sub 都是线性差,不会因分母近零产生爆点。

      诚实的风险披露:核心卡第 19 项本身 p=0.060、只有 15/302 个候选覆盖,证据强度明显弱于本轮 E 位核心(p=0.000,54/302),是本轮两个位里证据基础最薄的一个,也是本轮最可能重演第 1 轮 N 位"审计通过、但 0 个 head"结局的位。与第 1 轮 N 位不同的是,这次信号来源是离散的公司行为事件而不是连续的量价统计量——如果确实无效,更可能是解禁压力已经被扣 15bp 成本和五个慢速控制(尤其是 20/30 日流动性、市值均值)吸收掉了大半,而不是机制本身有问题。
