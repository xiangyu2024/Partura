slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [2, 6, 11]
    reasons: |
      【创新度 3】库里 0 个 head。核心 day_durbin_watson(Volume) 自身与 liq 0.68、known 0.66(相关度表 slot a core),水平上大半是流动性 / 已知族。
      本位的外围把这个水平拿掉:cross_zscore / cross_ema 做股内时序异常,cs_bucket_rank 在 day_gini 或 20 日 Amt 十分位内排序,再加上与 signed_ratio、Ret、日成交量的交互。
      保留的种子与 5 个控制的 |ρ| 大多 ≤ 0.36(seed 1、3、4、7、9、10),seed 5 的 vol 是 0.47,seed 8 的 rev 是 0.50。
      这属于「同一个输入(分钟成交量的 DW)、不同机制」,够 3,不到 4。M 第 1 批含该核心的外围只有 pow_* 单调包装和 cross_cov(·, ts_med(·,30)),本位没有重复。
      【合理度 3】逐个核对算子:
      (1) dt_day.day_durbin_watson 的分母是 Σx²,没有去均值,所以 DW ≈ 2(1−ρ₁)·CV²/(1+CV²) 的推导成立。它有界、分母有 1e-8 守卫,常数行为 NaN,没有数值问题。
      (2) ops_ext.cross_zscore 有「常数窗口记 0」的保护;cs_bucket_rank 确实是十分位内的百分位,再加 1e-4 × 全体秩打破并列,做到了 PI 说的交互中性化。
      不到 4 的原因:
      (i) 原始分钟 Volume 里,开盘集合竞价那一根(以及深市一直有、沪市 2018-08 起才有的收盘竞价)在 Σx² 里占大头。涨跌停锁死日只有一根孤立的量,DW ≈ 2。所以 DW 的水平和日间变化有相当一部分是「竞价量占比」与涨跌停 / 事件日,不只是拆单持续性对注意力零散。本位没有像 N 位那样用 in_madz 去掉确定性 U 形,只有 seed 4、5 的 gini 分桶部分控制了集中度。
      (ii) 引用的文献都是类比,不是「成交零散度预测收益」的直接证据:Lillo–Mike–Farmer 讲的是订单符号的长记忆,不是成交量序列的 DW;Gervais 等讲的是异常成交量的水平;MSCI 讲的是估值 z 分数。
      (iii) M 批的富集(含核心者均值 −0.91,不含者 −1.67,两者都为负)来自 DW 的水平,而 (a) 类种子恰好去掉了这个水平,这条 train 证据不能迁移到它们身上。
      保留种子里的小毛病:
      - seed 9、10 是 20 天的滚动相关,标准误约 0.22,截面上噪声大。
      - seed 10 用按股数计的 day_sum(Volume),送转股前后会跳,换成 Amt 更干净。
      - seed 8 的秩主要由 signed_ratio × DW 水平决定(rev 0.50),读到的是「零散日的净买入」,不是「零散的爆发本身是买还是卖」。不过在 E 位必须原样含核心的约束下,这已经是能写出的方向交互。
      【划掉】
      - 2 cross_madz(DW, 60):和 seed 1 是同一个想法,只换成稳健估计量。DW 有界、不重尾,madz 相对 zscore 几乎不改变排序;两者对 5 个控制的画像几乎一样(0.07/0.14/0.32/0.09/0.05 对 0.01/0.13/0.32/0.04/0.03)。换皮。
      - 6 cs_bucket_rank(cross_zscore(DW, 60), ListAge):给出的理由(次新股薄成交在 DW 上界堆积)作用在水平上,而输入已经是股内 z 分数,水平已经去掉。控制画像和 seed 1 几乎相同(0.07/0.14/0.30/0.09/0.04),分桶带来的增量机制说不清,实质是 seed 1 的换皮。
      - 11 cross_stddev(DW, 20):与 liq 0.55、known 0.47。薄成交股的日间 DW 波动天然更大,所以它主要是流动性的另一种写法;「粗糙度分布」为什么能预测收益没有说清。
      划完剩 8 个种子。
    alpha_source: 如果有 alpha,最可能来自这里:有的股票成交以孤立尖峰的形式到达(散户 / 注意力驱动、涨跌停锁死、事件日),与它自身的历史比、或与同流动性 / 同集中度档的股票比显得异常,这类股票随后跑输或反转;多头书挑出的则是成交平稳、持续的(机构拆单)股票。seed 1、3 有一部分很可能来自事件日(涨跌停、消息)之后的反转。
    revise: —
  - slot: b
    novelty: 3
    soundness: 3
    struck_seeds: [1, 12, 15]
    reasons: |
      【创新度 3】库里没有 head,最接近的是 20 日反转控制。15 个种子里有 8 个与 rev 的 |ρ| 在 0.45–0.58 之间(seed 1、2、4、6、7、8、12、15)。
      本位本质上是把收益按分钟成交量拆分或加权:同一类输入(收益)上的新机制,区分哪部分收益来自流动性需求。
      这符合「同一类输入但机制不同,并且说得出为什么」;只有 seed 3、13(分桶)和 seed 9、10、11、14 与所有控制的 |ρ| ≤ 0.25。
      量价相关(corr(Close, Volume)、VWAP 偏离)在 A 股量价因子文献里是老题目,够不上 5;相对控制而言输入也不是全新的,所以给 3 不给 4。
      【合理度 3】机制本身清楚,CGW 1993 和 Llorente 等 2002 是 2023 年以前的文献证据,但它们讲的都是日频成交量冲击,搬到分钟级「爆发分钟」只是假设。
      Admati–Pfleiderer 1988 同样预测知情交易者会挤进成交厚的时段,所以爆发分钟的收益是反转还是延续,理论上并没有定下来。GP 会自己选方向,这一点不致命,但机制的方向说不清。
      逐个核对算子:
      - in_madz 用滚动中位数 / MAD 加相对 eps;前 29 分钟为 NaN,MAD = 0 处为空,数值上安全。
      - day_topw_mean 按 |w| 取前 10%,所以 in_madz 为负(异常安静)的分钟也可能入选;成交量右偏,入选的大多仍是爆发分钟。
      - div(day_wmean(Close, Volume), day_mean(Close)) 的分母是价格,不存在近零问题。
      - cs_bucket_rank 正确实现了「给定 20 日收益,看收益的构成」(seed 3、13)。
      问题:直接用原始 Volume 的种子(6、8、9、10、11、15),其加权或相关会被开盘集合竞价那一根和收盘竞价主导,而这正是 hypothesis 自己说要用 in_madz 避开的 U 形。
      另外没有 train 证据:M 第 1 批没有任何把 Ret 和 Volume 放进同一个算子的候选。所以给 3。
      【划掉】
      - 1 cross_mean(day_topw_mean(Ret, in_madz(Volume, 30)), 20):和 seed 2 几乎是同一个量。爆发分钟平均收益的量级远大于全天分钟平均收益,减掉 day_mean 几乎不改变排序;两者的控制画像为 0.25/0.29/0.51/0.27/0.11 对 0.25/0.27/0.46/0.26/0.12。保留更贴本位 idea 的 seed 2,划掉与反转重叠更多的 seed 1。
      - 12 cross_mean(day_signed_ratio(Ret, Amt), 20):hypothesis 第 (5) 条的机制是「给定价格变动下」的净买入(即被吸收),那是 seed 13;不加条件的版本与 rev 0.56,主要是带符号的收益代理,不符合本位 idea。
      - 15 sub(cross_mean(day_topw_mean(Ret, Volume), 20), …):按原始量取前 10% 分钟,在日内 U 形下取到的主要是开盘和尾盘(集合竞价)那几十分钟,量的是开收盘时段的收益。这与 hypothesis 用 in_madz 避开 U 形的设计相矛盾;它与 rev 0.57,而且是 seed 2 把 in_madz 换成原始量的版本。
      保留 seed 6(rev 0.53)和 seed 8(rev 0.58):前者是同期量价相关,后者是先后关系,机制有别,seed 8 也没有更干净的同类种子;但预计它们的原始形态有一部分是反转。
      划完剩 12 个种子。
    alpha_source: 如果有 alpha,最可能来自流动性供给的补偿:在异常放量分钟里实现的价格压力(散户注意力集中下单)在之后几天回吐,而且在控制 20 日总收益后仍然存在(seed 3、13 这两个分桶版本);另一个来源是「放了很多买量,价格却没涨」的吸收信号。其中一部分会是更干净的短期反转。
