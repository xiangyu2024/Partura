  core: day_durbin_watson(Volume)
  hypothesis: 【核心在量什么】本库的 day_durbin_watson 分母是 Σx² 而不是去均值的平方和(dt_day.py 源码),所以对分钟成交量它近似
    2(1−ρ₁)·CV²/(1+CV²):一阶自相关低、且分钟量离散度高时取大值。高 = 成交量一根一根孤立地蹦(零散、不协调、注意力驱动的下单); 低 =
    平滑、持续的成交流(大单被拆成小单在一天里匀速执行,Lillo–Mike–Farmer 的拆单机制)。它是 M 第 1 批 95 个候选里唯一过多重检验的子树
    (含它的 46 个候选均值比不含的高 0.76,单边 p≈0.0002)。 【已见过的外围,本位全部避开】含该核心的 46 个候选只有两类外围:(1) 根部单调包装
    pow_2_5 / pow_05 / pow_3 —— 在先排名的奖励下与裸核心是同一个秩信号; (2) cross_cov(·, ts_med(某个日内统计量,
    30), 15/60) —— 与一条 30 日中位数做 15 日协方差,第二条腿在窗内近乎常数,窗口 15→60 效应归零,而且这层平均拉低了表现。 没有一个外围做过股内时序归一化、分桶内排序、或带收益方向。
    【这次试的外围与机制】(a) 股内时序归一化:cross_zscore / cross_madz / ts_rank(60–120 日)以及「近一周 EMA
    相对半年」——把持久的截面水平 (它和流动性、上市状态、板块纠缠,很可能是本批 train/valid 方向不稳、候选均值 −1.30 的原因)换成「这只股票的成交流最近变得异常零散/平滑」,即交易者构成的变化
    (MSCI 2021 股内 vs 截面对照;Gervais 等 2001 相对自身历史的异常成交)。 (b) 分桶内排序 cs_bucket_rank:在分钟量
    Gini 十分位内排 DW → 固定集中度/CV,只留下「顺序 / 持续性」那一半(把核心的两半分开); 在 ListAge 十分位内排 → 去掉次新股薄成交在
    DW≈2 上界的堆积(Wan 等 2015);在 20 日成交额十分位内排 → 多头十分位从每个流动性档等量取票, 这是残差尺子的多项式回归做不到的交互中性化,也压低了冷门票带来的成本。
    (c) 方向:DW 乘净买入成交占比(day_signed_ratio)的 20 日均值、DW 与当日收益 / 当日成交量的 20 日滚动相关——零散的爆发是在买还是在卖、
    是否伴随放量(Llorente 等 2002:成交特征与收益方向的交互区分信息交易与流动性交易)。 (d) 20 日内粗糙度的分布:上尾均值、波动、30 日稳健中位数(唯一一个此前没套过
    ts_med 的强部件)。 【为什么样本外还会在】订单如何被切分、谁在交易是慢变的微观结构属性,不是价格模式;(a)(b) 去掉的正是控制集只能按多项式去掉、去不掉交互的那部分水平混杂,
    而这部分混杂最可能随市场风格切换,是 train/valid 不一致的来源;所有种子都是有界量(DW∈(0,2]、z 分数、桶内分位、相关系数),没有裸除法和爆点。
