- type: N
  hypothesis: '【机制】成交量最集中的那些分钟,价格朝哪边走,决定这段收益之后是反转还是延续。Campbell–Grossman–Wang(1993):非信息交易者的买卖压力要由做市方/对手方承接,
    需要补偿,所以伴随大成交量的价格变动随后反转;Llorente 等(2002):信息交易推动的变动延续,对冲/流动性交易推动的反转;Admati–Pfleiderer(1988):
    可自由择时的流动性交易者会把单子集中到成交厚的时段。把这套逻辑放到日内分钟上:一只股票过去 20 天的收益里,有多少是在「放量爆发的分钟」里实现的、 有多少是在平静分钟里实现的
    —— 爆发分钟的那部分以流动性需求为主,预期反转;平静分钟的那部分更接近信息,预期延续。 【算子怎么实现】(1) 爆发分钟的收益:day_topw_mean(Ret,
    in_madz(Volume, 30)) = 当天「成交量相对前 30 分钟最反常」的 10% 分钟的平均收益 (in_madz 用滚动中位数和 MAD 定义爆发,前
    30 分钟为空,所以开盘集合竞价与日内 U 形不会被当成爆发);减去 day_mean(Ret) 得到「爆发分钟相对全天」的倾斜; 再用 cs_bucket_rank
    在 20 日平均分钟收益的十分位内排序,显式地做到「给定总收益,看它的构成」。(2) 量加权减等权的分钟收益 sub(day_wmean(Ret, Volume),
    day_mean(Ret)) ≈ 分钟收益与分钟成交量的协方差 / 平均量;day_corr(Ret, Volume) 及其对 in_madz 爆发度的版本。
    (3) 先后关系:day_corr(in_delay(Ret, 1), Volume) = 量是否追着上一分钟的涨跌来(追涨杀跌的注意力交易);day_corr(Ret,
    in_delay(Volume, 1)) = 放量之后价格往哪走。 (4) 价位口径:VWAP/TWAP = div(day_wmean(Close, Volume),
    day_mean(Close)) 与 day_corr(Close, Volume) —— 钱是在当天的高价位还是低价位成交的。 (5) 净买入占比 day_signed_ratio(Ret,
    Amt) 在给定价格变动下的排序(放了很多买量价格却没涨 = 被吸收)。全部取 20 日(一个取 60 日)平均,一个做「近一周相对 60 日」的 z 分数。
    【为什么和库里 / 控制不同】库里还没有 head;M 第 1 批 95 个候选只分别量了成交量形状(DW、偏度、开盘量)和价格路径(Vwap 的 AR1),
    没有一个把分钟收益和分钟成交量放进同一个算子。5 个控制里:20 日反转控的是总收益,而这里量的是总收益在放量分钟与平静分钟之间的「分配」—— 按构造与总收益正交的那一部分(cs_bucket_rank
    种子把这点写死);已知族 cross_mean(day_std(Amt), 30) 与流动性、波动都是无方向的水平量,这里全部带方向。 【为什么样本外还会在】它是流动性供给的补偿,来源是
    A 股以散户为主、注意力驱动的下单结构,这一结构在 2018–2023 没有变; 信号是 20 日聚合、取值有界(相关系数、分钟收益均值、价格比),换手低、扣
    15bp 后仍可交易,没有除以近零量的地方(Close>0;in_madz 的分母带相对 eps 且 MAD=0 处为空)。'
  inspired_by: M 第 1 批:唯一显著的子树是成交量的爆发性 day_durbin_watson(Volume)(46/95 个候选含它),但整批没有一个候选问过「爆发的那几分钟价格往哪走」;机制来自
    Campbell–Grossman–Wang 1993 与 Llorente 等 2002 的成交量–收益自相关文献
