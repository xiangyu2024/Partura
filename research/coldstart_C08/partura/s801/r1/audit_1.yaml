    reasons: '快照里 0 个 head;M 第 1 批的共性子树(DW(Volume)、day_skew(Volume)、day_first(Volume)、day_ar1_coefficient(Vwap)、pow_3(LogFloatShares))都只量成交量形状或价格路径,没有把分钟收益和分钟成交量放进同一个算子,本位填的正是这块空白。相关度表:15 个种子与 liq / vol / known / size 的 |ρ| 全部 ≤ 0.45;与 20 日反转在 0.46–0.58 的有种子 1、2、4、6、7、8、12、15(这些都是 20 日聚合的带方向收益量,与总收益中度相关是预期内的,新尺子会去掉线性 / U 形 / S 形暴露,规则 §4 明确不据此挡);而按构造把总收益固定住的种子 3、13 降到 rev 0.058 / 0.142,种子 9、10、11、14 与所有控制都 ≤ 0.22。「在给定总收益下,看它在放量爆发分钟与平静分钟之间怎么分配」是新的东西,给 4;其中 day_corr(Ret, Volume)、day_corr(Close, Volume)、VWAP/TWAP 是文献里常见的量价相关形式,但库和控制里都没有,不算重复。逐个核对算子:in_madz(Volume, 30) 窗口含当前分钟,需满 30 个有限值,所以每天前 29 分钟为空,分母 1.4826·MAD + 1e-6·|med|、MAD=0 置空,分钟量是整数手,MAD>0 时不存在近零分母;day_topw_mean 取 |w| 最大的 10% 分钟(含并列);day_wmean 用 |w| 加权、Σw=0 置空;day_corr 分母 sqrt(varx·vary)+1e-9,涨跌停封死时 Ret 恒 0 → cov=0 → 输出 0,不爆;in_delay 只在日内平移,第一分钟置空,不跨日;div(day_wmean(Close,Volume), day_mean(Close)) 的分母是价格 > 0;cs_bucket_rank 在 20 日平均分钟收益十分位内排,确实把总收益写死。没有前视(都是当天分钟数据,收盘可得),没有数值伪影,覆盖率 0.999,distinct ≥ 0.91,不划种子。小提醒(不挡):(i) day_topw_mean 对权重取绝对值,所以 in_madz 版本选的是「最反常」而不只是「放量」的分钟;对成交量,负的 madz 下界约为 −med/(1.4826·MAD)(一般 −1.5 到 −3),正的爆发可到两位数,前 10% 基本都是放量爆发,只在平静窗里会混进少量异常缩量分钟,想严格只要爆发可以把权重先截到非负;(ii) 种子 15 用原始 Volume 取前 10%,会被开盘集合竞价 / 尾盘的确定性 U 形主导(PI 自己也提了),它和种子 1、2 量的是不同的东西;(iii) in_madz 前 29 分钟为空,开盘半小时的价格发现被整段排除在「爆发」之外,这是设计选择。【如果它有 alpha,最可能来自哪里】流动性供给的补偿:伴随放量爆发实现的那部分收益是散户 / 注意力型的流动性需求推出来的,随后反转;在平静分钟里实现的那部分更接近信息,延续(Campbell–Grossman–Wang 1993、Llorente 等 2002);在给定总收益的十分位内看这种构成,剥离了 20 日反转本身。'
