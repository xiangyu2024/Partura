    reasons: '【核心】day_durbin_watson(Volume) 在机械核心卡第 2 位(46/95 个候选含它,p 0.0002),是合法的 E 核心;核心与 5 个控制的 |ρ| 最大为 liq 0.675、known 0.657,都 < 0.8,E 位门槛过。逐个核对源码:dt_day.py 的 day_durbin_watson 分子 Σ(Δx)²、分母 Σx²(不去均值),所以 PI 写的 ≈2(1−ρ₁)·CV²/(1+CV²) 成立;对非负的分钟量有 (a−b)² ≤ a²+b²,值域确实在 [0,2],常数行置 NaN,没有近零分母。快照里 0 个 head,所以与 head 的原始/残差 |ρ| 全是 0,创新度只能对控制和 M 已见过的外围比:M 里含该核心的候选外围只有 pow_* 单调包装和 cross_cov(·, ts_med(…,30), 15/60),本位的外围(cross_zscore / cross_madz 股内标准化、cs_bucket_rank 在 day_gini / ListAge / 成交额十分位内排、与 day_mean(Ret)、day_sum(Volume) 的 20 日 cross_corr、与 day_signed_ratio 相乘)一个都没出现过;相关度表也显示它们把核心从流动性 / 已知族的邻域里拉了出来:种子 1、2、9 与 liq / known 都 ≤ 0.09,种子 10 ≤ 0.04,种子 6、12、13 ≤ 0.27,而裸核心是 0.66–0.68。把「截面水平」换成「这只股票自己的成交流变得异常零散 / 平滑」,以及在 Gini 十分位内只留 ρ₁ 那一半,是实质性不同的量,给 4。算子与机制吻合:cross_zscore 含当天、带常数窗保护;cross_madz 分母带相对 eps 且 MAD=0 置空;cs_bucket_rank 十分位内百分位加 1e-4 全局秩打破并列;cross_ema 半衰期 5 再对 120 日 z 分数,就是「近一周相对半年」。窗口 20/60/120 合理,覆盖率 ≥ 0.97,没有前视(全是当天收盘可得的分钟量)。【划掉的种子】3 ts_rank(·,120):pct 秩只有约 120 档,distinct 0.098 < 0.5,门槛判废品,ac_plugin 对 distinct < 0.5 直接给 fit = −inf,是个永远不能繁殖的死种子(数值:面板离散成少数几档)。5 ts_med(·,30):与 liq 0.882、known 0.841,自动划掉,就是流动性 / 已知族换个写法。14 cross_tail_mean_q75(·,20):与 liq 0.851,自动划掉(known 0.799 也几乎到线)。8 cs_bucket_rank(core, ListAge):与 known 0.643 ≥ 0.5,新尺子把它判为不合格,控制画像(liq 0.66 / known 0.64)与裸核心(0.675 / 0.657)几乎一样,ListAge 十分位内重排基本是空操作,属于与已知族重复。【留下但提醒】种子 9 的控制画像与种子 1 几乎完全相同(0.068/0.141/0.304/0.089/0.037 对 0.067/0.144/0.318/0.089/0.048),ListAge 分桶对 z 分数版本几乎不起作用,两个种子大概率高度相关,算重复占位但不是对 head / 控制的重复,不划;种子 15 cross_stddev 与 liq 0.545、known 0.474,离已知族的 0.5 线很近,GP 从它长出的后代容易被判不合格;种子 11 本质是 day_signed_ratio 的 20 日均值按 DW 加权(rev 0.496),与 b 位种子 12 是同一个方向信号。划完剩 11 个种子(≥ 4)。【如果它有 alpha,最可能来自哪里】一只股票的成交流相对自身历史突然变零散(孤立的注意力型成交)或变平滑(大单拆分、匀速执行)标志着交易者构成的变化——机构建仓 / 出货的开始或结束;Gini 十分位内的版本则直接度量拆单持续性(机构参与度),在固定集中度后不再是流动性水平。'
