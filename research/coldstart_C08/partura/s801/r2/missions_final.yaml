- type: E
  core: ts_med(LimitWidth, 50)
  hypothesis: '【核心在量什么】LimitWidth 是逐日频的静态叶子字段(涨跌幅限制的宽度:主板 10%、创业板/科创板 20%、ST/风险警示股
    5%、新股上市前几日通常不设限),ts_med(LimitWidth, 50) 是它过去 50 个交易日的稳健中位数——把单日记录噪声/过渡日抹掉,留一个「这只股票最近一直处在哪个监管/风险分层」的慢变状态变量。它是本轮共性表里支持面最大的几个
    LimitWidth 衍生子树之一(本身:含它的 30 个候选均值 −0.61,不含 −1.30,效应 +0.69,p=0.0004;同一簇里 cs_last_high20(LimitWidth,
    ts_med(LimitWidth,50)) 效应 +1.24 是本轮共性表第一名,pow_1_5(LimitWidth) 效应 +0.75、n=34,cross_semistd_pos(LimitWidth,60)
    效应 +0.93)。第 1 轮 95 个候选里完全没有 LimitWidth 的任何形式,是本轮才第一次出现的子树家族。

    【已经见过的外围,本位要避开】到目前为止,库里和共性表里 LimitWidth 只被 GP 自己用过两种外围:pow_1_5 的单调包装(在先排名的奖励下跟裸
    LimitWidth 是同一个秩信号)、以及 cs_last_high20 / cross_semistd_pos 这类直接在 LimitWidth 自己水平上做的筛选或半方差。本位要避开「还是在问
    LimitWidth 的静态水平」,改成问「最近有没有发生监管分层的变化」,以及「去掉 board 本身的台阶之后,风险警示这一下还剩多少」。

    【这次试的外围与机制】(a) 分层变化探测:sub(ts_med(LimitWidth,50), cross_mean(LimitWidth,250)) 与
    cross_zscore(ts_med(LimitWidth,50), 250)——对绝大多数股票,过去 50 天和过去 250 天的中位数几乎相等(board
    / ST 身份一年里基本不变),这两个量只在「最近发生了限宽变化」(新披星戴帽、摘星脱帽、或注册制改革带来的限宽调整)的那一小部分股票上明显偏离 0,真正测的是「状态刚刚变化」这个事件本身,不是静态所属哪个板块。(b)
    板块内中性化:cs_bucket_rank(ts_med(LimitWidth,50), BoardCode)——LimitWidth 几乎由板块决定,在
    BoardCode 分桶内重新排序,剩下的几乎只是「同板块内被打上风险警示的那一小撮」,把板块本身的流动性/成长性差异(控制集的多项式回归去不掉这种离散台阶)过滤掉,只留风险分层这一件事。(c)
    流动性交互中性化:cs_bucket_rank(…, cross_mean(day_sum(Amt),20))、cs_bucket_rank(…, cross_stddev(day_sum(Amt),20))——同第
    1 轮对 DW 验证过有效的手法,这次用在一个完全不同的核心上,去掉跟成交规模及其波动的交互,而不只是线性暴露;cs_last_low10(…, cross_mean(day_sum(Amt),20))
    额外排除最不流动的 10% 尾部,避免这部分名字的执行成本主导多头书。(d) 排除掉下跌刚发生的那一段:cs_last_low10(ts_med(LimitWidth,50),
    cross_mean(day_mean(Ret),20))——担心「先砸出跌停→再被打风险警示」这条因果链本身就是 20 日反转的另一种写法,这个筛选把最近
    20 日平均收益最低的 10% 直接排除,剩下的更接近「已经在这个分层待了一段时间」而不是「刚砸出来的那一下」;cross_corr(ts_med(LimitWidth,50),
    day_mean(Ret), 60) 则直接把这层相关记录下来,供后续核对。(e) 带方向:cross_mean(mul(ts_med(LimitWidth,50),
    day_signed_ratio(Ret,Amt)), 20) 及其 board 中性版——彩票类/壳资源炒作的特征是追涨而不是抄底(Kumar 2009、Bali–Cakici–Whitelaw
    2011 的彩票偏好理论预测散户会为潜在暴涨尾部支付溢价、随后跑输),这里问的是「长期处在窄限宽/风险警示分层的股票,最近净买入越多,后续是不是跑输得更多」,跟
    (a)(b)(c) 的「分层本身」是不同机制(交互 vs 水平)。

    【为什么和库里 / 控制不同】5 个控制(流动性、波动、20 日反转、已知族 cross_mean(day_std(Amt),30)、市值 LogFloatCap)里没有任何一个是板块/监管分层变量,库里的唯一
    head 完全没有用到 LimitWidth。(a)(b) 问的是分层变化和去掉 board 台阶后的风险标签,(c) 是交互中性化,(d) 是因果排除,(e)
    带方向——这些跟「LimitWidth 的静态截面水平」(GP 自己已经试过的外围)是不同的机制。

    【为什么样本外还会在】板块/ST 分层规则本身在 2018–2023 基本没变(创业板 2020 年注册制改革的限宽调整是 (a) 要专门捕捉的那类事件,不是要回避的例外);彩票类资产跑输是在多个市场反复验证过的现象(Kumar
    2009 用美股个股做横截面排序,Bali–Cakici–Whitelaw 2011 用 MAX 排序做组合),机制是结构性的散户风险偏好,不是某一段时间的价格模式;Wan
    等(2015)记录的中国涨跌停触发动态本身就随板块限宽不同而系统性不同,支持限宽是一个真实的制度分层变量而非噪声。所有种子都是分桶分位 / 相关系数 / 有界差值,LimitWidth
    本身是离散的几档正数,ts_med / cross_mean 对它取值不会趋零,没有除以近零量的地方。'
