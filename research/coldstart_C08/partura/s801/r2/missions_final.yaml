- type: E
  core: day_centroid(Volume)
  hypothesis: '【核心在量什么】day_centroid(x) = Σ t·|x_t| / Σ|x_t| / (T−1),分钟成交量在一天里的「重心时刻」,0=全在开盘、1=全在收盘、0.5=对称;源码(ops_ext.day_centroid)先取绝对值再按分钟序号加权平均,是把
    day_gini / day_skew 这类「量有多集中」的统计量完全丢掉、只留「量集中在几点」这一件事的变量。它是本轮 317 个候选里支持面最广的子树之一(含它的
    35 个候选均值 −0.19,不含的 −1.37,效应 +1.17,p≈0),第 1 轮 95 个候选里完全没有出现过,是本轮 M 第 2 批才带出来的新子树。它也已经是本组第
    1 轮找到的唯一 head 的一部分:`cs_last_low05(day_centroid(Volume), cross_corr(day_durbin_watson(Volume),
    day_sum(Volume), 20))`;拆解表的 sufficiency 测试显示单独留它、把 head 其余部分换成裸形式,score 就有 +0.44(train
    +1.09 valid +0.44),已经离及格线很近,且它与已知族的残差相关只有 −0.19(拆解表 rho_known 列),不是流动性或市值的化身。

    【已经见过的外围,本位要避开】在已发现的 head 里,day_centroid(Volume) 只被用过两种处理:(a) 作为 cs_last_low05(y=它,x=cross_corr(DW,
    day_sum(Volume), 20)) 的被排序变量,筛选变量跟它本身无关,只是借另一个量做排除;(b) 整个筛选结果再去跟 div(day_topw_mean(High,
    Open), DW) 做 50 日 ts_corr。这两种都没有碰过股内时间归一化、跟价格路径的同步性比较、以及板块/新股的分桶中性化,本位全部避开这两种已见过的外围。

    【这次试的外围与机制】(a) 股内时序归一化:cross_zscore / cross_madz / ts_rank(60–120 日)——不问「这只股票的量集中在几点」的截面水平(那很可能跟涨跌停规则、是否有收盘集合竞价这类慢变的制度属性绑在一起),只问「相对它自己最近的历史,今天的集中点是不是反常地提前或推迟」,换手结构(交易者构成)的变化比绝对时刻更可能是慢变暴露之外的信息(复用第
    1 轮对 DW 验证过有效的「股内 z 分数」处理,这次用在一个完全不同的核心上)。(b) 持续性/不稳定性:cross_mean(20 日)把重心时刻打平成「最近惯常的样子」,cross_stddev(20
    日)量「这段时间内重心本身跳不跳」——长期稳定在某处(机构/被动盘的规律执行)与跳来跳去(散户追涨杀跌、事件驱动)是两件不同的事,原始单日取值分不开它们。(c)
    与价格路径的同步性:day_centroid 对任何输入都先取绝对值,所以 day_centroid(Ret) 就是「当天 |分钟收益| 的重心」——哪个时间段价格动得最猛;sub(day_centroid(Volume),
    day_centroid(Ret)) 与 cross_corr(两者, 20) 问的是成交量堆积的时间点和价格真正动起来的时间点是否对得上:对得上(差小/相关高)更像知情交易在价格变动的同时下单,对不上(量在波动小的时段堆积)更像被动/到点执行的流动性盘(Admati–Pfleiderer
    1988 的框架正是预测知情交易与可择时的流动性交易在日内分布上不同)。这是本组第一次把「量的时刻」和「价格动的时刻」放进同一个表达式——M 两批候选和已发现的
    head 都只处理过量本身的形状或量与价格水平的关系,没有处理过时点。(d) 制度性混杂的中性化:cs_bucket_rank(…, ListAge) 去掉新股上市初期(常无涨跌幅限制、巨量换手)对重心的机械扭曲;cs_bucket_rank(…,
    BoardCode) 去掉 2020 年后科创板/创业板引入收盘集合竞价、而主板长期没有这项机制带来的板块台阶——这种台阶是离散的,残差尺子对控制的线性/二次/三次回归去不掉。(e)
    带方向:乘上 day_signed_ratio(Ret, Amt)(净买入占比)、与 day_mean(Ret) 的滚动相关,问量堆积时点偏晚/偏早的股票,净买入方向和近期收益方向是什么。

    【为什么和库里 / 控制不同】库里目前只有 1 个 head,它用 day_centroid(Volume) 做排除筛选的输入,没有把它当独立信号去做股内归一化或跟价格时点配对;5
    个控制(流动性、波动、20 日反转、已知族、市值)全部是跨日或水平统计量,没有一个是「一天之内什么时候」这个时间维度的量,拆解表给出的 rho_known
    = −0.19 印证了这点不是控制的化身。

    【为什么样本外还会在】日内交易时段的制度安排(集合竞价规则、涨跌停板分布)和不同类型投资者的下单时点偏好(机构被动盘匀速执行 vs 散户尾盘追涨)是慢变的市场微结构属性,不是某个瞬时的量价相关性,2018–2023
    没有发生过交易时段规则的大范围变化(科创板 2020 年引入收盘集合竞价是本位特意用 BoardCode 分桶处理的那次例外,不是要回避而是要显式控制);所有种子都是有界量(day_centroid∈[0,1]、z
    分数、相关系数、分桶分位),没有裸除法,不会有数值爆点。'
