    reasons: '【核心】day_centroid(Volume) 是本轮机械核心卡第 3 位(317 个候选里 35 个含它,p 0.000,loc.md 均值差 +1.17),合法 E 核心;与 5 个控制最大 |ρ| = known 0.195(liq .181 / vol .156 / rev .13 / size .066),远低于 E 位 0.8 门槛。源码核对:ops_ext.day_centroid = Σt·|x_t| / Σ|x_t| / (T−1)(ops_ext.py:155),与 PI 公式一致;分母 tot.clamp(min=1e-30) 且仅在 tot>0 时输出,零成交日置 NaN 而不是爆点,没有前视(全部分钟数据当天收盘后可得)。拆解表(loc.json ablation)sufficiency 测得 rho_known=-0.1946(四舍五入 -0.19),与 PI 引用一致;score +0.44(train +1.09 valid +0.44)属实。快照里唯一的 head 只把 day_centroid(Volume) 用作 cs_last_low05 的排序键(排除用途),从未把它本身当信号做股内归一化、持续性/跳变、或与 day_centroid(Ret) 配对——本位 14 个种子没有一个重复这两种已见外围,创新度给 4。

      逐个算子核对:cross_zscore / cross_madz(dt_cross.py / ops_ext.py)窗口 60 / 120,分母有相对 eps(scale*1e-6)保护近常数窗口,不会在近零标准差时爆点;ts_rank(day_centroid(Volume), 120)(种子 3)distinct=0.098(corr_1.json),< 0.5 的 ac_plugin 门槛,fit 直接记 -inf——这不是本核心特有的问题:ts_rank(x, d) 每天的输出被限制在至多 d 个离散档(该股自己窗口内的名次 / d),全市场 5220 只股票共享同一组至多 d 个档,distinct_fraction 的上限 ≈ d / 5220,d=120 时 ≈ 0.023(实测 0.098 同量级),d 要 ≥ 2610(十年以上窗口)才可能过 0.5 门槛——ts_rank 作为终端算子在本环境下对任何现实窗口几乎永远过不了门槛,这是结构性限制,和 r1 审计中 day_durbin_watson(Volume) 核心下 ts_rank(·,120) distinct=0.098 的死种子是同一机制(两次独立验证),划掉,理由是数学问题(数值伪影 / 系统性算不出),不是机制错误。cs_bucket_rank(ops_ext.py:239)十分位内排序 + 1e-4 全局秩破并列,ListAge / BoardCode 分桶没有前视;day_signed_ratio(Ret, Amt) 分母 clamp(min=1e-30) 有界;sub / cross_corr(dt_cross.py rolling_pair_reduce)用 EPS 护近零方差,day_centroid 本身是 [0,1] 有界量,相减 / 相关都不会爆点。其余 13 个种子 distinct 全部 ≥ 0.9、coverage ≥ 0.94,没有发现其他数学问题;seed4 known=0.512、seed12 rev=0.551 都只是在 0.5 附近、远低于 0.8 自动阈值,属于 §4 明确不得据此挡的"中度相关"。

      合理度给 4:机制(对齐 day_centroid(Volume) 与 day_centroid(Ret) 测知情 / 被动交易的日内时点差异)有 Admati-Pfleiderer(1988)理论支撑,算子确实分别实现了"相对自身历史的反常度"(zscore / madz)、"持续 vs 跳动"(mean / stddev)、"量价时点同步"(sub / corr)三条独立机制,窗口 20 / 60 / 120 合理,除种子 3 外没有陷阱。【如果它有 alpha,最可能来自哪里】知情交易偏向在价格真正移动的分钟下单,被动 / 到点执行盘则按固定时段匀速交易(Admati–Pfleiderer 1988),day_centroid(Volume) 与 day_centroid(Ret) 的日内对齐程度、以及这个对齐模式本身是稳定重复还是经常跳变,分辨的是交易者构成而不是任何水平性的量 / 价 / 反转 / 市值信息。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: [1, 2, 7]
    reasons: '【核心】ts_med(LimitWidth, 50) 是本轮机械核心卡第 11 位(317 个候选里 30 个含它,p 0.000,loc.md 均值差 +0.69),合法 E 核心;库里唯一的 head 完全不含 LimitWidth,与 5 个控制:liq .097 / vol .177 / known .076 / size .197 均 < 0.8,rev 列是 NaN(corr_1.json)——这不是违反门槛,而是裸核心在绝大多数交易日截面方差 ≈ 0,Pearson 相关的 0/0 导致未定义,不是隐藏的高相关(见下)。

      【源码核对发现的事实问题,影响合理度评分】PI 写 LimitWidth 是"涨跌幅限制的宽度:主板 10%、创业板/科创板 20%、ST/风险警示股 5%、新股上市前几日通常不设限",但 AlphaCube-steering/src/alphacube/dailyfields.py:242-248 的 derive() 对 LimitWidth 直接返回 tradability.board_limit(symbols, dates) 的转置,board_limit(tradability.py:18-30)只按股票代码前缀和日期给三个值:主板(含未匹配到任何规则的其余前缀)0.10、688/689 与 2020-08-24 起的 300/301/302(创业板注册制后)0.20、4/8/92(北交所)0.30;函数自己的注释写明"ST(5%)立方体里没有标记,靠 limit_locks 的"一字"规则兜住"——LimitWidth 里根本没有 ST/风险警示这一档,也没有新股不设限这一档,ST 股票就是普通主板的 0.10。这实质性地削弱了机制 (a) 和 (e):(a) 把 sub(ts_med(core,50), cross_mean(core,250)) / cross_zscore(core,250) 说成一般性的"监管分层变化探测",但按真实字段,单只股票唯一可能经历的"变化"几乎只有创业板 2020-08-24 注册制那一次性改革(同一天影响整批 300/301/302 前缀股票,不是分散在各自时间点的个股事件);过了这次改革后约 250 个交易日(约 2021 年中),这两个表达式对全市场所有股票恒为 0,在样本的 valid 段(2022-01~2023-08)永远是常数 0——这正是 corr_1.json 里种子 1(distinct 0.004)、种子 2(distinct 0.0)gate=false、被划掉的根本原因,划掉的理由仍然是数学问题(面板几乎是常数,ac_plugin distinct<0.5 → fit=-inf)。种子 7 cross_corr(ts_med(core,50), day_mean(Ret), 60)(dt_cross.py rolling_pair_reduce: corr=cov/(sqrt(var_x*var_y)+EPS))在 core 的 60 日窗口方差 ≈ 0 的绝大多数股票上,分子分母同时趋零,被 EPS 兜住不炸但结果塌缩成 0,distinct=0.008,同一类数值伪影,划掉。(e) 把带方向的 mul(core, day_signed_ratio(Ret,Amt)) 跟 Kumar(2009) / Bali-Cakici-Whitelaw(2011) 的彩票型 / ST 跑输文献挂钩,但这两篇讲的是风险警示 / 高 MAX 股票,而 LimitWidth 里没有 ST 标记,种子 9/10 实际测的是"主板(含 ST) vs 创业板/科创板/北交所"的板块净买入方向差异,不是风险分层——文献引用和机制描述跟真实数据定义不匹配,属于叙事层面的问题,不是 §4 数学问题,所以不单独划掉种子 9/10(它们 distinct=1.0 / 0.995,known .092 / .093、rev .554 / .549 都远低于 0.8 自动阈值,§4 明确中度相关不得据此挡),但要在合理度上扣分。

      机制 (b)(c)(d) 算子核对没有问题,确实做到了声称的事:cs_bucket_rank(core, BoardCode)(种子 6)靠 _pct_rank 的稳定排序把近常数的 y 强行铺成全分布(ops_ext.py:239 注释:十分位内重复用整体秩 ×1e-4 破并列),gate 通过、distinct=1.0,但由于 LimitWidth 在主板 / 科创板 / 北交所三个板内恰好是常数(板内方差=0),这三个板贡献的其实是纯并列破序(信息量为 0,只有创业板那一档因 2020-08-24 前后 0.10/0.20 两级才携带真实信息),比 PI 声称的"把板块流动性/成长性差异过滤掉只留风险分层"窄得多,但 known 相关只有 0.01,确认它测的不是任何控制的化身,不划;cs_bucket_rank(…, cross_mean/cross_stddev(day_sum(Amt),20))(种子 4/5)把 liq 压到 0.001/0.005,中性化确实起效;cs_last_low10(core, cross_mean(day_mean(Ret),20))(种子 8)排除最近 20 日收益最差 10%,把"先砸出跌停再戴帽"的反转因果链隔开,rev 压到 0.227,低于种子 9/10 的 0.55,设计合理。划完 slot b 还剩 8 个种子(≥ 4,过线)。

      合理度给 3(不是 4):没有未处理的 §4 数学问题(3 个死种子已划,理由是数值伪影,不是机制本身错),但核心字段的描述性错误实质性地削弱了这个 E 位里最吸引人的两条叙事(a 的"监管分层变化"其实是单一历史事件、且在 valid 段恒为 0;e 的"ST 彩票偏好"文献和真实字段不对应),机制讲得通但讲的不是 PI 写的那个机制,扣到 3。创新度给 4:LimitWidth 是本组迄今从未进库的全新字段,5 个控制和唯一的 head 都不碰板块 / 监管维度,就算砍掉 ST 叙事,"板块结构 + 创业板改革时点 + 方向交互"仍是真正新的东西。【如果它有 alpha,最可能来自哪里】不是 ST/风险警示的彩票偏好(字段里没有这个信息),更可能来自 (i) 创业板 2020-08-24 注册制改革前后那一次性的流动性 / 定价机制切换在改革后一段时间内的滞后影响(种子 1/2 虽已划掉,但 cs_bucket_rank 版本种子 3 仍能在创业板桶内捕捉这个二分状态),以及 (ii) 板块结构(主板/科创板/创业板/北交所)本身对应不同的投资者群体构成和资金属性,与当月净买入方向(day_signed_ratio)交互,测的是"哪个板块正在被更多情绪化 / 讯号驱动的资金追涨",一个和已知的流动性、波动、反转、市值控制都不重叠的横截面维度。'
    revise: '—'
