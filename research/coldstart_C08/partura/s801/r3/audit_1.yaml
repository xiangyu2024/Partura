    reasons: 'N位把一天拆成隔夜(day_open(Open)/cross_delay(day_close(Close),1))和日内(day_close(Close)/day_open(Open))两段,库里6个head和5个控制都没碰过Open/Close跳空结构,是本组前两轮完全没试过的维度,机制有Lou-Polk-Skouras(2019)、Berkman等(2012)支撑。源码核对:day_open/day_close是day_first/day_last的别名(dt_day.py:138-148,当天第一/最后一个非NaN值);cross_delay(x,1)把x整体下移1天,后面的天看见更早的值(dt_cross.py:150-157,`res[d:]=x[:-d]`),没有用到未来信息;两个比值分母都是严格>0的价格,coverage 0.998-0.999、distinct 0.972-1.000,没有发现数值伪影。

      10个种子里2个被§3确定性规则自动划掉:种子2(日内收益比20日均值,cross_mean(div(Close,Open),20))与控制rev(20日反转)的原始|ρ|=0.815≥0.8,几乎是反转控制换个写法——对多数股票,日内close/open比值的20日均值已经携带了日收益的大部分变动,与累计反转信号高度重合;种子8(隔夜比×净买入方向的20日均值)与head cross_mean(mul(ts_med(mul(ts_med(LimitWidth,50),...),day_signed_ratio(Ret,Amt))),20)(LimitWidth核,score+0.77)的原始|ρ|=0.719≥0.7,两者共享的day_signed_ratio(Ret,Amt)子树把两个本来完全不同核心的表达式拉到了同一个秩信号。划完剩8个(1,3,4,5,6,7,9,10),远超≥4门槛。

      其余种子控制相关度都明显低于0.8自动阈值(种子3的rev=0.53最高,其次是已划掉的种子8外种子4的rev=0.485),§4明确"与某个控制中度相关"不是问题,不据此挡;与已知族(known列)全部≤0.17。机制核对:差值版(种子3)、分桶版(种子4/5)和种子2的问题不同,因为它们或者做减法剥离共同部分,或者用cs_bucket_rank显式固定住20日总收益再看构成,相关度表验证了这点(种子3 rev降到0.53,种子4/5分桶后rev 0.485/0.10);自相关版(种子6)、带方向交互(种子7/9... 实际为7/8中种子7留用)、波动分解(种子9/10)都是前两轮没试过的新组合。创新度4,合理度4:T+1、不能做空、涨跌停结构下,隔夜缺口更可能携带机构消化隔夜信息后的真实判断,日内连续竞价更容易被追涨杀跌污染,这是制度性、慢变的结构,2018-2023没有发生改变本身的事件。如果它有alpha,最可能来自哪里:隔夜(集合竞价、信息消化)与日内(连续竞价、情绪化跟风)两段订单流的构成系统性不同,划掉的种子2正好证明了哪一种写法会退化成反转控制的化身,保留的种子已经避开了这一点。'
