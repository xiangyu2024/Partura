    soundness: 5
    reasons: '替换候选针对head cs_bucket_rank(cross_mean(abs_(day_centroid(Volume)),20), cross_mean(ts_kurt(day_min(Ret),5),20))(score+1.50/valid+1.63),依据是loc.json本轮唯一标出的拆解gain:knockout ts_kurt(day_min(Ret),5)换成裸day_min(Ret)后score升到+1.67/valid+1.68,必要性-0.17(负数即"去掉它反而更好"),超过§2"变体score≥原head+0.1"的门槛。源码核对:day_centroid内部已对输入取abs(ops_ext.py:160 `x=_f(x).abs()`),外层再套abs_()是恒等运算,与拆解表"abs_必要性=0.00"完全吻合,PI的写法准确,这确实不是机制的一部分而是GP bloat。

      10个变体是围绕这个发现的系统扫描,没有重复:variant1正是locate报告的那个knockout(day_min窗口20);2/3只改day_min窗口(10/40);4/5只改外层cross_mean(abs_centroid)窗口(10/40);6把Volume换Amt;7把裸day_min换成ts_med(day_min,5)(换一种稳健平滑而不是kurt);8把外层窗口缩到5;9/10分别换成day_max(Ret)和振幅sub(day_max,day_min),对称检验这个发现是否只对"最差分钟"成立。相关度表确认(这是§2规则本身的门槛,不是我的判断范围,但核对过数值都在门槛内):10个变体与原head原始|ρ|0.78-0.96(≥0.5,满足"替换"条件)、与已知族|ρ|0.42-0.50(<0.5,满足去同质化条件);coverage/distinct全部健康(0.995-0.996/0.999),没有除零或退化定义风险。合理度5:机制不是假设出来的,是locate自己用确定性ablation直接测出来的增益,变体扫描的方向(窗口、字段、对称尾部、换统计量)覆盖了这个发现最自然的几个推广,没有发现问题。'
