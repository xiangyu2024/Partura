    reasons: '核心day_centroid(Volume)是本组第2次(round2 slot a起)用作E核心,触及§2"每个核心整个实验至多2个E位"的上限,这是PI下一轮不能再用它的提示,不影响本次通过。核心与5控制最大|ρ|=known 0.195(liq .181/vol .156/rev .13/size .066),远低于E位0.8门槛。源码核对:day_centroid(ops_ext.py:155-166)输出在[0,1],分母clamp(min=1e-30)且仅tot>0时输出;day_min/day_max(dt_day.py:nanmin_last/nanmax_last)、ts_kurt/ts_skew(operators/nd_ts.py→common.py:nankurt_last/nanskew_last,var>EPS才算,否则记NaN,不会被零方差爆点支配)、day_argmin(dt_day.py:178-184,0-based原始分钟序号,NaN安全、不取abs不聚合)、cross_corr/cross_stddev(dt_cross.py:rolling_pair_reduce/nanstd_last)全部有EPS/clamp保护,没有除以近零量的地方;coverage全部0.998-0.999、distinct 0.885-1.000(corr_1.json),没有r1/r2审计里出现过的ts_rank式distinct<0.5死种子或LimitWidth式近常数面板问题。

      10个种子里4个被§3确定性规则自动划掉(与某个head日度秩原始|ρ|≥0.7):种子1(ts_skew(day_min(Ret),10)版,max_head=0.948)、种子2(ts_kurt(day_max(Ret),5)版,=0.939)、种子3(振幅版,=0.964)——三者都和本轮head cs_bucket_rank(cross_mean(abs_(day_centroid(Volume)),20), cross_mean(ts_kurt(day_min(Ret),5),20))(score+1.50/valid+1.63)几乎是同一个秩信号,只是换了被排序的尾部统计量或方向,是该head的换皮;种子5(mul(sub(centroid,0.5), cross_mean(ts_kurt(...),20)),=0.709)与head sub(day_centroid(Volume),day_centroid(Ret))(+0.63)同一量级重合。划完剩6个(4,6,7,8,9,10),≥4门槛过。

      剩余种子逐个核对机制与算子是否吻合:种子4/7/8的cross_corr就是两条20日序列的滚动相关(dt_cross.py:193);种子4比较centroid(Volume)原始日值与ts_kurt(day_min(Ret),10)的平滑值(混了两种时间尺度,不是数学问题);种子7比较两种权重(Volume/Amt)算出的时点;种子8比较连续量[0,1]与离散分钟序号(Pearson相关对尺度不变,没问题);种子6是两个独立统计量相乘(不稳定性×尾部持续度),没有除零风险;种子9(三重交互,max_head=0.677,最像LimitWidth头部而不是本轮+1.50头部,是因为两者都含day_signed_ratio(Ret,Amt)这个共享子树,不是机制重复——round2 slot a种子11已验证"centroid×signed_ratio"两因子交互,本种子是在其上新加ts_kurt尾部门控,外围骨架和round2那个不同,不算换皮),在阈值内,保留;种子10(z分数+慢窗kurt,max_head=0.656)低于0.7自动线,但与head cross_zscore(cross_mean(day_centroid(Volume),5),120)的残差|ρ|达0.736(corr_1.json),提示残差化后这个种子的交易信号和已有一个z分数类head重叠不小,留但提示GP从它长出的子代要留意是否只是换皮。创新度4:四类外围(直接相关、带符号交互、跨字段时点比较、相对历史z分数)没有一个重复round1/round2已见过的外围骨架,round3第一次把尾部统计量day_min/day_max和day_centroid放进同一个表达式。合理度4:机制清楚(恐慌性抛售在时间上的聚集程度与放量时点的关系),引用Chen-Hong-Stein 2001、Easley等2012的类比合理,算子逐个核对无数学问题。如果它有alpha,最可能来自哪里:当天最差(或最好、振幅最大)那一分钟的尖峭/持续程度,与成交量日内堆积时点之间的协同,代理恐慌性/注意力驱动下单在时间上聚集的程度,不是流动性、波动或市值水平(核心与控制|ρ|全部≤0.22)。'
