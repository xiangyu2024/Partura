    cross_mean 水平)接到尾部分桶上,窗口也换成 20 日(比 GP 用的 5 日更慢),检验这个机制是否在「相对自身历史异常」的口径下依然成立,而不仅是本轮
    GP 随机搜索刚好撞中的那一个具体窗口组合。


    【为什么和库里 / 控制不同】5 个控制(流动性、波动、20 日反转、已知族、市值)里没有一个是「日内什么时候」或「单分钟尾部有多尖/持续多久」的量;库里
