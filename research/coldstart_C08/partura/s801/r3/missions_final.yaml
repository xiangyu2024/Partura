    个种子换了统计量(skew/振幅/最好分钟)、换了关系形式(直接相关、带符号交互、不稳定性交互)、换了跨字段比较对象(Amt 的时点、day_argmin
    的原始位置)、换了归一化口径(z 分数代替水平),没有一个和现有 6 个 head 的骨架重合。


    【为什么样本外还会在】单根分钟的极端尖峭及其持续性,反映的是信息事件触发的瞬时抛售压力有没有被散户的注意力持续追踪(Chen, Hong, Stein 2001
    用成交量和收益的条件偏度预测收益崩溃;Easley, López de Prado, O''Hara 2012 的流动性毒性概念是同一类「知情/恐慌性下单在时间上聚集」的度量),这是交易行为/信息到达结构的属性,不是某一段时间特有的价格模式,2018–2023
