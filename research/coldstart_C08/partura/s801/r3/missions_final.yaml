  why: '拆解表(本轮 loc.json ablation,35 次评估之一)对「ts_kurt(day_min(Ret),5)」做 knockout(换成裸
    day_min(Ret))后,score 从原 head 的 +1.50 升到 +1.67(train +1.50→+1.67,valid +1.63→+1.68),必要性
    −0.17(负数即「去掉它反而更好」);这是 locate 自己标出的唯一一条 R 候选(loc.json r_candidates,增益 +0.17 >
    门槛 +0.10)。同一张表里,另一侧的 knockout(去掉外层 cross_mean(…,20) 换成裸 abs_(day_centroid(Volume)))必要性
    +0.81(显著变差);而 knockout「abs_」本身必要性恰好是 0.00——因为 day_centroid 的实现本身已经对输入取绝对值(ops_ext.day_centroid:
    x=_f(x).abs()),输出已经非负,外面再套一层 abs_() 在数学上是恒等操作,是 GP bloat 不是机制的一部分。合起来看,这个 head
    里真正必要的部分只有「day_centroid(Volume) 20 日平滑后,在『单日最差分钟收益』20 日平滑分位内排序」,ts_kurt 这层非线性包装没有在帮忙。'
