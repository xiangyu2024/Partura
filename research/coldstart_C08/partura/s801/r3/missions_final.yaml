- type: N
  hypothesis: '【机制】A 股个股的日收益可以拆成两段:隔夜(昨日收盘到今日开盘,交易所休市,新信息只能在开盘集合竞价里第一次定价)和日内(今日开盘到收盘,连续竞价,订单流持续处理信息、情绪化资金跟风)。成熟市场的证据(Lou,
    Polk, Skouras 2019《A Tug of War》发现隔夜收益延续、日内收益反转;Berkman, Koch, Tuttle, Zhang 2012
    发现隔夜跳空主要由注意力驱动的资金在开盘后被日内交易纠正/淡化)说明这两段的可预测性方向通常相反,但本组前两轮的所有种子都在用「一天」这个单位(day_mean/day_sum/day_centroid
    等),从没有把一天切成隔夜和日内两段分别处理。A 股 T+1、无法做空、涨跌停限制下,隔夜缺口更可能携带机构/大户隔夜消化信息后的真实判断(日内无法马上反向交易出清),日内连续竞价段更容易被散户追涨杀跌污染,这个机制预期比成熟市场更强。


    【算子怎么实现】隔夜收益比:div(day_open(Open), cross_delay(day_close(Close), 1))(今天开盘价 / 昨天收盘价,用
    cross_delay 在日轴上取前一天的 day_close,不跨分钟轴,没有用到当天收盘后才知道的信息);日内收益比:div(day_close(Close),
    day_open(Open))(今天收盘价 / 今天开盘价)。两者各自做 20 日 cross_mean 得到持续的「隔夜偏向」和「日内偏向」水平;sub
    把二者相减,直接给出偏向差;cs_bucket_rank(…, cross_mean(day_mean(Ret),20)) 版本延续本组第 1 轮 N 位验证过最干净的「给定
    20 日总收益看构成」手法:给定总收益不变,这部分主要是隔夜贡献的股票,和主要是日内贡献的股票,后续表现是否不同。cross_autocorr(隔夜收益比,
    20, 1) 是隔夜缺口本身日对日的持续性(习惯性跳空 vs 偶发);mul(隔夜收益比, day_signed_ratio(Ret,Amt)) 和它的 20
    日均值问跳空之后,当天净买入方向是顺着缺口追(延续)还是反着缺口买(淡化/对冲);最后用 sub(cross_stddev(隔夜收益比,20), cross_stddev(日内收益比,20))
    问这只股票 20 日里的波动主要来自「休市时消化信息」还是「开市时交易出来」,并对 cross_mean(day_sum(Amt),20)(换手规模)做 cs_bucket_rank
    中性化,避免薄成交股的隔夜缺口噪声主导多头书。


    【为什么和库里 / 控制不同】5 个控制里的 20 日反转是用总收益算的,没有拆成隔夜 / 日内两段;已知族、流动性、波动、市值都不含「开盘 / 收盘」这个切分点。库里现有
    6 个 head 全部基于分钟级成交量形状(day_centroid/DW)或静态板块字段(LimitWidth),没有一个用到 Open/Close 两个价格字段的日间跳空结构。


    【为什么样本外还会在】隔夜与日内收益可预测性方向不同,是交易时段结构(休市 vs 连续竞价)决定的,不是某个样本期特有的价格模式,2018–2023 没有发生改变;A
    股的 T+1 和涨跌停结构是本样本期内稳定存在的制度环境,不是会漂移的东西。所有种子都是价格比值(分母是收盘价或开盘价,严格 > 0)、它们的差,或有界的相关系数/符号交互,没有除以近零量的地方。'
