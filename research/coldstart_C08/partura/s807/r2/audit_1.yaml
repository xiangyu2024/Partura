    保留种子逐个核对算子:种子 1/5(`cross_semistd_pos`)、种子 6(`cross_semistd_neg`,60 日)与 ops_ext.py:748-779 的 `_semistd` 一致——对恒正的 day_std(Ret) 取逐日 log 变化率,按方向平方后在窗口里取均值再开方,`ok=(x>0)&(prev>0)` 且 n≥3 才给值,day_std(Ret) 偶尔为 0(一字板日)时直接跳过而不是出爆点;种子 3(`sub`)、种子 4(`div`)是两者的净值与比值,是两种独立的实现互相校验,不是同一个意思换皮——种子 4 的分母(semistd_neg)理论上可能在某只股票 120 天里从未出现「波动下降日」而为 0,但相关度表里该种子 gate 是「过」、coverage 与同组其它种子相当,说明样本里没有出现这种退化。种子 7/8(`cross_autocorr`)按 dt_cross.py:198 是 `cross_corr(x[shift:], x[:-shift], d)`,窗口内 1 日滞后自相关,走 `rolling_pair_reduce`(NaN-safe,分母 `sqrt(var_x*var_y)+EPS`);种子 8 多一层 `log(day_std(Ret))`,log 在 |x|≤EPS 时返回 NaN 而不是 -inf(common.py:207),day_std(Ret)=0 的一字板日被正确跳过。种子 10 `cross_zscore(cross_stddev(log(day_std(Ret)),60),240)`——ops_ext.py:208 的 `cross_zscore` 显式 `ok=torch.isfinite(w)`,比标准 nanmean/nanstd 多一层 inf 过滤。种子 13 `cross_regres(cross_mean(day_std(Ret),20), cross_stddev(log(day_std(Ret)),120), 120)`——dt_cross.py:309 的 `rolling_ols(x,y,d)` 拟合 `y~α+βx`,第一个参数是自变量,与计划所述一致;用波动水平(控制同款的 20 日均值)回归「波动的离散」取残差,直接检验二阶量是不是水平控制的非线性影子,不是只靠相关度表猜——残差与 size/known 的 |ρ| 都在 0.14以下,支持这确实是正交的新量。全部核心/外围只用当日及以前的分钟与日频字段,无前视;120/240 日部分窗口热身占比不超过约 12%,不是「主要由热身期决定」。


