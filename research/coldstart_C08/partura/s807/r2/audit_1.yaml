    划掉 {2,3,4,5,6,8,9,10} 共 8 个后剩 5 个种子(1,7,11,12,13),≥4,通过。


    保留种子核对:种子 1(未加窗原始比值)与种子 7(`cross_zscore` 包的版本)gate 都是「过」,coverage 0.959-0.960——同样的 q25=0 缺口,种子 1 没有窗口把它摊开(单日缺失单日丢,不传染邻居),种子 7 的 `cross_zscore`(ops_ext.py:208)显式 `ok=torch.isfinite(w)`,窗口里的坏天被正确剔除而不是传染,本地复现同一个 `cross_zscore` 在 95% 干净/5% 污染窗口下覆盖率 71.9%(远高于裸 `cross_mean` 的 0-5.4%),方向一致。种子 11/12(`day_gini(Amt)`/`day_gini(Volume)`,ops_ext.py:136)按 docstring 就是专门为了不在清淡日爆掉设计的(0-1 有界,恒正输入取绝对值 + isfinite 掩码,缺失分钟排序置末再按 0 填充计算),与 liq 控制 |ρ|=0.797/0.798,刚好卡在 0.8 阈值之下——这是经验结果不是数学问题,但说明「分钟成交分布的集中度」这个新维度在这批数据里和流动性水平高度共线,novelty 判断时已把这一点计入。种子 13 `cs_rank(ListAge)`——与全部 head、全部控制的 |ρ| 都在 0.08-0.14,loc.md 的 enrichment/core_cards 表(21 条)里确认 ListAge 一次没出现过,是真的新叶子。


