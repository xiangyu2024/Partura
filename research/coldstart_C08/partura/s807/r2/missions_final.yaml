- type: N
  hypothesis: '灵感来自这一批本身的一个空白,和一个从未被用过的叶子。空白:`day_quantile_q75(Volume)` 是 345 个归档候选里出现次数最多的子树(66
    次,r2/loc.json core_cards 第 8 位),但 round 1 的结构解剖核实过——它在全部归档历史里只当过 `cross_regbeta`
    的自变量(r1/analysis.md §1.4/§1.5),从没有人把「一天里成交量 75 分位和 25 分位的比值」本身当成一个特征评估过。这个比值衡量的是日内成交的突发/集中程度:如果一天的成交在少数几分钟里爆发式出现(开盘、收盘、消息冲击),q75/q25
    的比值会大;如果一天里的成交比较均匀,比值接近 1。从未被用过的叶子:`ListAge`(规则 §1 列出的 6 个日频叶子之一)在 345 个候选、6 个
    head、core_cards、enrichment 表里一次都没出现过。


    机制:Admati & Pfleiderer (1988) 的理论模型说,知情交易者的订单会引出有辨别力的流动性交易者选择在特定时段集中交易来隐藏自己——不同股票日内交易节奏本身的形状(平均而言有多突发)反映了这只股票平常的交易者构成(消息/知情交易主导,还是流动性驱动的均匀换手)。Kaniel、Saar、Titman
    (2008) 发现个人投资者的交易模式与随后收益之间存在系统性的关系,说明交易节奏的形状不是中性的噪音。


    这与 round 1 的 N 位(Chordia 式活跃度 CV,跨天比较成交总量)和本轮的 E 位(波动的波动,跨天比较波动)是同一个「厌恶不确定性/交易结构」大叙事的第三个变种,但度量的截面维度完全不同——前两者都是「日与日之间」某个日频统计量的离散,这里是单日内部、分钟与分钟之间成交量分布的形状,不做跨天比较,是全新的维度;构造上也与流动性控制
    `cross_mean(day_sum(Amt), 30)`(日成交金额的水平)正交(一个是形状,一个是总量)。


    算子实现:`div(day_quantile_q75(Amt), day_quantile_q25(Amt))` 与成交股数版 `div(day_quantile_q75(Volume),
    day_quantile_q25(Volume))`(排除价格水平);`day_gini(Amt)` / `day_gini(Volume)`(partura/ops_ext.py:136,日内
    Gini 系数,是比分位数比值更标准的集中度估计量,两种构造互相校验,不是同一个意思换皮)。单日原始值噪声很大(F14 的换手成本论证),主力种子取 60/120
    日 `cross_mean` 慢化;再给一个 `log` 压缩版(呼应本轮 E 位已经验证过的「压缩右尾有用」这条经验)、一个 `cross_stddev`(集中度本身随时间是否稳定,是这个特征的二阶版本)、一个
    `cross_zscore`(相对自己历史的异常集中度)。


    最后三个种子是针对 `ListAge` 的稳健性检验:`cs_bucket_demean(·, ListAge)` 把这条慢变量按挂牌年龄十分位去均值,检验这是不是单纯「次新股刚上市交易更活跃/更集中」的机械效应——Zhang,
    X.F. (2006) 把挂牌时长列为信息不确定性的代理变量之一(与分析师覆盖、波动率并列),信息不确定性越高的公司,特征对收益的预测力通常越强;如果去掉按年龄分组后的均值仍留着大部分分数,说明这不是新股噪音的人工产物。`cs_rank(ListAge)`
    单独测试纯挂牌时长本身有没有解释力,把「年龄」和「年龄条件下的交易节奏」两件事分开看。`cs_bucket_demean(·, BoardCode)` 与
    `cs_bucket_zscore(·, LogFloatCap)` 同样检验板块/规模构成效应,与本轮 E 位用同一套工具,互为印证。


    为什么样本外还会在:Admati-Pfleiderer 的知情/流动性交易混合是市场微观结构的结构性特征,不随样本期消失;Amihud & Mendelson
    (1986) 说明持续性的交易特征(不是一次性事件)本身可以被定价,这里主力种子全部取 60-120 日慢化,换手低;信息不确定性溢价(Zhang 2006)在
    A 股这种个人投资者主导、分析师覆盖不均的市场里理应更强,而不是样本期特有的现象。'
