- type: E
  core: day_std(Ret)
  hypothesis: '核心 `day_std(Ret)`(分钟收益算出的日内已实现波动)是本种子目前唯一通过样本外检验的 N 位 head 的根:`cross_stddev(log(log(log(day_std(Ret)))),
    120)`(score 0.84、train 0.84、valid 1.63、sign -1,src c08s807Pr1b_Nb,r2/loc.json
    heads[3])。共性表(r2/loc.json enrichment)里 `log(log(log(day_std(Ret))))` 均值差全表最高(+1.99,p
    0.000,6/345);它的四条 sufficiency 行——day_std(Ret) 本身与它的 1/2/3 层 log——score 几乎逐位相同(-3.9354
    / -3.7969 / -3.7936 / -3.7936,r2/loc.json ablation[2])。这正是奖励「先按日排名再 EMA,任何单调变换同分」规则的直接验证:log
    的层数本身不是机制,核心真正的身份就是裸的 `day_std(Ret)`;层数只是外围(cross_stddev 这个非单调统计量)对分布右尾的压缩程度,是外围参数而不是核心内容。所以这次把核心退回最浅的
    `day_std(Ret)`,把「压缩多少层」也交给外围去探索,而不是预先锁死在 3 层。


    r2/loc.md 本轮的拆解已经把 cross_stddev 的窗口(60/120/240)、log 层数(1-4 层)、再包一层 cross_tail_mean_q75
    这三类外围用尽(全部已见过,必须避开)。本轮四类外围各实现一个未被试过的机制:


    (1) 非对称的「波动的波动」——round 1 只度量了波动离散的幅度,没问过它是不是对称的。`cross_semistd_neg` / `cross_semistd_pos`(partura/ops_ext.py:765,773;对取值恒正的
    x 取逐日 log 变化率,只把负/正的一半取均方根)把「波动骤降」和「波动骤升」分开。Patton & Sheppard (2015) 发现正、负波动跳跃对未来波动的持续性贡献并不对称;机制上,如果「会不会突然爆出一次大波动」比「波动本身摆动多大」更能解释定价差,净不对称(sub)或尺度无关的比值(div)应该比对称的
    cross_stddev 更干净。


    (2) 波动序列自身的记忆结构——与「离散度」正交的新维度。`cross_autocorr`(AlphaCube dt_cross.py:198,窗口内 1
    日滞后自相关)和 `cross_hurst`(dt_cross.py:443)度量的是「我的波动有多可预测 / 记忆多长」,不是「摆动多大」:同样 cross_stddev=0.9
    的两只股票,可能一只是规律地来回摆(高自相关、高 Hurst),一只是随机地来回摆(低自相关、低 Hurst),奖励的线性/平方/三次方残差化区分不了这两种,但这里能。Corsi
    (2009) 的 HAR-RV 模型本身就建立在已实现波动有长记忆结构之上。


    (3) 动态版:现在是不是比「我自己平时」更不稳定。`cross_zscore(cross_stddev(log(day_std(Ret)), 60), 240)`
    把「最近 60 天的波动不稳定程度」相对这只股票自己过去 240 天的不稳定水平打分——round 1 的 60/120/240 只是换了平滑长度,度量的始终是不稳定的水平;这里度量的是不稳定的变化/冲击,是状态转换变量,机制更接近「风险重新定价」而不是「风险水平溢价」。


    (4) 用真分组字段中性化,检验 0.84 分是不是规模/板块的构成效应。`cs_bucket_demean(·, BoardCode)`、`cs_bucket_zscore(·,
    LogFloatCap)` 直接包在已验证的完整 head 外面(核心 `day_std(Ret)` 仍原样嵌在最深处),直接检验这个新 head 是否只是「小盘股
    / 某些板块本来就更不稳定」——round 1 的 R-C 发现按真板块分桶通常让分数小幅下降而不塌(r1/analysis.md §1.3),这里验证同一规律对这个新
    head 是否成立。再用 `cross_regres`(dt_cross.py:309,`y~alpha+beta*x` 的残差,第一个参数是自变量)把「不稳定」相对「自己历史上的波动水平」做时序回归取残差,直接检验它是不是波动控制
    `cross_mean(day_std(Ret), 20)` 的非线性影子,而不是靠相关度表猜。


    为什么和控制不同:5 个控制里的波动控制是 `cross_mean(day_std(Ret), 20)`——日频波动的水平(20 日均值);本位全部种子度量的是这个水平在时间上的稳定性、对称性或记忆结构,是二阶统计量,奖励的残差化(线性、平方、三次方)去不掉二阶量的横截面差异,这与
    round 1 用 `ts_var(LogFloatCap, 20)`(市值水平的方差,而控制是市值水平本身)拿到novelty 4 是同一个论证结构。为什么样本外还会在:Baltussen、van
    Bekkum、van der Grient (2018) 的「未知的未知」是对「风险的不确定性」本身定价的行为偏差,不随窗口选择消失;French、Schwert、Stambaugh
    (1987) 的波动反馈机制说明波动的动态(不只是水平)本身携带定价信息;全部种子窗口在 60-240 日,换手很低,15bp 成本吃不掉。'
