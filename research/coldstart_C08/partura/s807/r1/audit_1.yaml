    struck_seeds: []
    reasons: '相关度表:14 个种子与 head 的日度秩 |ρ| 最大 0.17(种子 13、14),残差 ≤ 0.14;与控制最大 0.37(种子 12 对 size),对 liq(cross_mean(day_sum(Amt), 30))和 known(cross_mean(day_std(Amt), 30))都 ≤ 0.23 —— 5 个控制都是水平量,这里是尺度无关的跨日变异系数,不是同一个量;库里 3 个 head 全是 cross_regbeta(day_quantile_q75(Volume), ·),没有显式的跨日活跃度 / 波动不稳定性 → 创新度 4(Chordia 等的成交变异是已发表的异象,对本库是新的,但不算全新机制,不给 5)。算子逐个核对:种子 1、2、11 的 div(cross_stddev, cross_mean) 是非负量的变异系数,总体 std 下有界于 √(n−1),无近零爆点,整窗停牌为 NaN;种子 3–6、9、12、13 都是 log 后的 cross_stddev,尺度无关,log 在日成交额或 q75 分钟成交额为 0(一字板、停牌)时给 NaN 并被 nan 规约跳过;种子 4 的 log(day_sum(Amt)) − LogFloatCap 就是 log 换手率(单位差只是常数偏移,排名不变);种子 7、8 的 log 差 ≥ 0,_tail_mean 在少于 2 个有效日时给 NaN,下尾均值只在整窗几乎无成交时才趋近 0;种子 9 的 cross_delta 跨停牌缺口为 NaN;种子 10 的 cross_zscore 有常数窗口保护,|z| ≤ √19;种子 13 的 cs_bucket_zscore 按 LogFloatCap 的真十分位(连续量,没有列序并列问题),分母加了 EPS;种子 14 两个 cs_rank 相加,distinct 0.82 是秩和并列,不是常数面板。全部是当日及以前的日频 / 分钟数据,无前视,coverage ≥ 0.998;120 日窗的部分窗口热身约占 train 的 12%,不是主导。种子 1/2、5/6 只差窗口,彼此相近,但不是 head 或控制的重复,保留。非阻挡的提醒:上市不满半年的次新股,成交额从上市起单调衰减,跨日变异天然很高,且窗口不完整;解禁、公告等事件股也落在高变异一端。5 个控制里没有上市年龄,如果方向挑成做多平稳端,结果可能有一部分是系统性回避次新股(ListAge 暴露),这不是数学问题。如果它有 alpha,最可能来自:注意力驱动的成交突发让散户集中买入,价格被推高后回落,而成交与波动都平稳、无人关注的一端被低估;外加次新股与事件股在高变异一端的负漂移。'
    revise: '—'
R:
  - head: 'cross_regbeta(day_quantile_q75(Volume), cs_bucket_demean(add(cs_median(ts_var(LogFloatCap, 50)), ts_var(LogFloatCap, 20)), LimitWidth), 30)'
    soundness: 4
    reasons: '这是 head 3(+0.52)。核对:cs_median(ts_var(LogFloatCap, 50)) 每天是一个截面常数,cs_bucket_demean 按 x(LimitWidth)的十分位减去 y 的桶均值,常数加项被精确抹掉;拆解里把它换成另一个常数 cs_median(LogFloatCap) 分数几乎不变(+0.51 对 +0.52),印证它是死重。外层 cross_regbeta 按 rolling_ols 是 y ~ α + βx,β = cov / var(x),只在 var(x) > 1e-9 时计算;X 是分钟成交额 q75,var 远大于门槛,不会出爆点,β 量级约 1e-10 以上,float32 下不下溢。6 个变体:v1 是拆解里已测过的 Volume→Amt(+0.59,与原 head ρ 0.92,走替换);v2 去掉死常数、窗口 60;v3 让 var50 真正参与、窗口 60;v4、v5 用 cross_corr、cross_reg_tvalue 检验分数来自协动还是 regbeta 的 1/sd(X) 尺度;v6 改按 LogFloatCap 的真十分位分桶。每个变体都实现了 why 里说的改动,无前视、无定义问题。v2–v6 与原 head 的 ρ 只有 0.34–0.50,多数会走「收录」分支,与库里其他 head 最高 0.42,低于 0.7。如果它有 alpha,最可能来自:regbeta 的截面排序主要由 1/sd(分钟成交额 q75) 决定,也就是「成交活跃度跨日平稳」的一端,再叠加桶内去均值后低频方差与成交协动的符号;Amt 去掉了后复权价格水平与按手取整对 Volume 的污染。'
  - head: 'cross_regbeta(day_quantile_q75(Volume), cs_bucket_demean(add(cs_median(day_pos_ratio(Open)), ts_var(LogFloatCap, 30)), LimitWidth), 30)'
    soundness: 4
    reasons: '这是 head 2(+0.79)。核对:day_pos_ratio 返回当日有限分钟里 x > 0 的比例,Open 是后复权价、恒正,所以恒等于 1,cs_median 后仍是常数,被桶内去均值精确抹掉(拆解里 knockout 和 Open→Close 两种改法分数都逐位不变)。v1 是拆解里已测过的窗口 30→60(+0.23);v2 去掉死常数、改用 BoardCode 分桶、窗口 60;v3 改按 LogFloatCap 分桶;v4 换成 LogTotalCap,检验流通股本跳跃(解禁)是不是来源,这一条对 E 位核心的解读也有用;v5 把 ts_var 窗口改为 40;v6 换 cross_corr 外层做尺度对照。全部是同一机器上的单点或少点改动,无前视;β 有 var(x) > 1e-9 保护,无近零除法。一处理由不准(不挡):BoardCode 只有 4 个取值(主板 0 / 科创 1 / 创业 2 / 北交 3),_buckets 用稳定 argsort 的百分位排名切十分位,约六成的主板股票仍按列序(代码段 000 / 002 / 600 / 603 等)切成约 6 个桶,所以 v2 并没有变成「真板块」分桶,只是比 LimitWidth(2020-08 前主板与创业板同为 0.10)少切一些;按 §4,列序携带板块与上市批次信息,不是数学问题。各变体与原 head 的 ρ 为 0.36–0.49,多数会走「收录」分支,与 head 3 最高 0.35。如果它有 alpha,最可能来自:与 R1 相同的「成交活跃度跨日平稳」(1/sd(X))成分,外加 30 日水平方差里的解禁 / 流通股本扩张事件。'
summary: '两个任务位都放行(E 位以 ts_var(LogFloatCap, 20) 为核心、外围全部换新;N 位做成交与波动的跨日不稳定性),创新度 4、合理度 4,不划种子;两组 R 合理度 4。附非阻挡提醒:核心的高端主要是解禁类流通股本跳跃,BoardCode 分桶对主板仍按列序切,N 位有次新股暴露,这些都不是数学问题。'
