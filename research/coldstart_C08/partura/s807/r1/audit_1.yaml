    struck_seeds: []
    reasons: '相关度表:14 个种子与 3 个 head 的日度秩 |ρ| 最大 0.30(种子 14 对 head 3,残差 0.33),其余 ≤ 0.14;与 5 个控制最大 0.51(种子 11 对 liq 0.50、known 0.49),全部低于自动划线 0.7 / 0.8,coverage ≥ 0.997。核心 ts_var(LogFloatCap, 20) 与控制最大 0.51(vol),满足 E 位 < 0.8;它是 head 1、head 3 的子树,也在共性表里;14 个种子都原样含核心。外围整个换掉(没有 cross_regbeta / day_quantile_q75 / LimitWidth / cs_median / day_pos_ratio),而库里唯一的机器是 cross_regbeta(day_quantile_q75(Volume), ·);这些种子度量的是方差比(种子 1–4)、长窗低频方差(5–7、11、12)、方差相对自身历史的变化(8–10)、单位换手的方差(13)、方差与成交额的尺度无关协动(14),库里与 5 个控制里都没有同一个量 → 创新度 4。慢化种子 5–7 与 vol 控制 0.40–0.48:那是 20 日分钟波动,这里是 120 日的日间水平方差(含漂移与股本跳跃),不是同一个量。算子逐个核对:ts_var 是 ND 按日滚动的总体方差(nanstd_last 的平方);log 只在输入 |x| ≤ 1e-9 时给 NaN,停牌期 LogFloatCap 不变时方差为 0 → NaN 而不是 −∞;cross_regres(x, y, d) 按 rolling_ols 是 y ~ α + βx 在最后一天的残差,所以种子 3 确实是 log 核心对 log 日内方差回归的残差,方向与计划所述一致;cross_zscore 有常数窗口保护,|z| ≤ √(n−1);种子 10 的 div 是非负量的变异系数,总体 std 下有界于 √(n−1)(60 日约 7.7),不出爆点;种子 4 的 log(div(day_last(Close), day_first(Open))) 是开盘到收盘的 log 收益,一字板日为 0(log 的保护作用在输入 1 上,不会误判),20 日几乎全是一字板时 sd 很小、log 差很大,但只涉及极少数新股,奖励先做截面排名,不会支配截面;种子 11 的 cs_bucket_rank 按 LogFloatCap 的真十分位(连续量)。无前视:LogFloatCap 用当日收盘价与当日流通股本。热身:120 日外层 + 20 日核心约 140 个交易日部分窗口,占 train 约 14%,不是「主要由热身期决定」。非阻挡的提醒:(1) log 流通市值的水平方差里,解禁这类流通股本跳跃 J 在窗口里贡献 J²·p(1−p)(p 为跳跃后所占比例),J 在 0.2–0.7 时可达 0.01–0.12,是正常 2–3e-3 量级的数倍到数十倍,所以核心的高端、以及种子 1–4「方差比」的高端,主要是近 20 日有流通股本变动的股票,不是 Lo-MacKinlay 意义上的日间自相关;这不是数学问题,反而可能就是 alpha 的一部分(R2 的 LogTotalCap 变体正好能检验)。(2) 种子 12 的 BoardCode 只有 4 个值(主板 / 科创 / 创业 / 北交),_buckets 用稳定 argsort 的百分位排名切十分位,约六成的主板股票仍按列序(代码段)切成约 6 个桶,不是计划说的「真板块」;按 §4 不算问题,只是理由写得不准。(3) 种子 8 与 9 都是「核心相对自身 120 日」的位置(z 分数 vs log 比),彼此相近,但不是 head 或控制的重复,保留。如果它有 alpha,最可能来自:长窗日间 / 隔夜特质波动里日内波动解释不了的那一截(A 股散户彩票偏好下的低波动溢价),以及流通股本扩张(解禁)之后的供给压力与负漂移;慢化种子换手低,15 bp 成本吃不掉。'
    revise: '—'
