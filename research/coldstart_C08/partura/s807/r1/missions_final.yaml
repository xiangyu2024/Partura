- type: E
  core: ts_var(LogFloatCap, 20)
  hypothesis: 核心 ts_var(LogFloatCap, 20) 是快照里唯一「拿掉就塌」的部件:head 2 把 ts_var(LogFloatCap,
    30) 换成裸 LogFloatCap,0.79 → −0.55;head 1 去掉含它的 ts_regbeta(...),0.91 → −1.99;共性表里它出现在
    48/114 个候选中,均值差 +0.75,p 0.0005(loc.md)。它度量的是 log 流通市值「水平」在 20 日内的方差,不是收益方差;对近似随机游走,它
    ≈ 日频收益方差 × d/6 + (窗口内漂移)²/12 + 流通股本跳跃²。5 个控制里,波动控制是分钟内收益波动 cross_mean(day_std(Ret),
    20),反转控制的排名平方 / 三次方吸收了 |20 日漂移| 的 U 形,市值控制是水平 —— 所以核心里能留下来的是日间 / 隔夜那一截低频方差(以及股本事件)。快照只用过它一种机器:外层
    cross_regbeta(day_quantile_q75(Volume 或 Amt), ·, 15–482),内层 cs_bucket_demean(·,
    LimitWidth) 或 ts_regbeta(·, cs_mean(day_median(Close)), 5),外加恒等的 add(cs_median(...),
    ·)。这次的外围整个换掉:没有一个种子含 cross_regbeta、day_quantile_q75、LimitWidth、cs_median 或 day_pos_ratio。四类外围各实现一个机制:(1)
    方差比 / 方差分解(Lo-MacKinlay 方差比、Yang-Zhang 隔夜与日内分解):log(核心) 减去 log(20 日分钟收益方差均值),或减去
    2·log(开盘到收盘日收益的 20 日标准差),把「低频方差相对于日内方差多出来的部分」(隔夜跳空、日间自相关)显式剥出来;另有每只股票自己的 120 日时序回归残差版
    cross_regres(log 日内方差, log 核心, 120),即今天的低频方差比这只股票平时由日内方差所预期的多多少。(2) 慢化:120 日均值、60
    日中位数、120 日上尾均值。单个 20 点窗口的水平方差围绕其期望的变异系数约 0.9(布朗桥路径方差是 χ² 的加权和,首项占六成),核心单独当因子得
    −2.71 主要是换手成本;长窗统计把它变成换手很低的「持久低频波动」。(3) 相对自身历史:cross_zscore(核心, 120)、log(核心 /
    自身 120 日均值)、核心在 60 日内的变异系数(vol-of-vol):度量方差的变化而不是水平。(4) 同类相对与价格冲击:规模十分位桶内排名(60
    日平滑)、板块桶内 z 分数(以真板块 BoardCode / 规模 LogFloatCap 代替只有 2–3 个取值、靠列序切片的 LimitWidth),以及
    log(核心) − log(换手率) 的 60 日均值,即 Amihud 式「单位换手对应的价格变动」;再加一个尺度无关的量-波协动 cross_corr(核心,
    log 日成交额, 60)(混合分布假说:信息流同时驱动成交与波动),对照快照里被 1/sd(自变量) 尺度污染的 regbeta。全部是当日及以前的日频数据,无前视;比值一律写成
    log 差,log 对 |x| ≤ 1e-9 返回 NaN,避免近零除法爆点。为什么样本外还会在:低波动 / 低频方差溢价在 A 股被归于散户的彩票偏好,且对估计窗口(1
    个月到 5 年)不敏感(Blitz 2021);方差比的成分(隔夜信息到达、日间自相关)是股票价格形成方式的慢变量;所有种子在 60–120 日尺度上平滑或取统计量,换手低,15
    bp 成本吃不掉。
