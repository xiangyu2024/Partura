- type: N
  hypothesis: 交易活跃度的跨日不稳定性(volume-of-volume),以及风险本身的不稳定性(vol-of-vol),是被高估的特征,稳定的一端有正的超额收益。Chordia、Subrahmanyam、Anshuman(2001)发现:控制了活跃度水平之后,换手率
    / 成交额的变异系数越高,未来收益越低。机制:在散户主导的市场里,成交突发对应注意力冲击,注意力驱动的净买入把价格推高、随后回落(Barber-Odean
    2008);成交平稳、无人关注的股票被低估。Baltussen 等(2018)对波动的波动给出同方向的结果(风险的不确定性被高估)。算子实现:日成交额在 60
    / 120 日上的变异系数 cross_stddev / cross_mean;log 成交额、log 换手率(log 日成交额 − LogFloatCap)的时序标准差;日内
    q75 分钟成交额取 log 后的时序标准差;60 日峰值 / 中位数、120 日上尾均值 / 下尾均值(都写成 log 差,log 对近零返回 NaN,避免除以近零);log
    成交额日变化的标准差;相对自身 20 日的异常成交强度 |cross_zscore| 的 60 日均值;风险一侧用 5 日分钟波动在 60 日内的变异系数、log
    日内波动的 120 日标准差;再给一个规模十分位桶内 z 分数版(去掉小盘股机械性更不稳定的那部分)和一个活跃度与波动两种不稳定性的排名合成。与已有东西的不同:5
    个控制全是水平量(30 日成交额均值、30 日日内成交额标准差均值、20 日分钟波动、市值、20 日反转),这里全部是尺度无关的跨日变异;快照里的 head
    都是 cross_regbeta(day_quantile_q75(Volume), Y, d) = corr × sd(Y)/sd(X),其截面排序被 sd(X)
    主导,而 sd(X) 的截面差异跨 3–4 个数量级、本质是成交量的水平,不是变异系数。为什么样本外还会在:注意力 / 彩票偏好是 A 股散户结构带来的行为偏差,不随样本期消失;Chordia
    等用的是 1960–90 年代美股,对 2018 年以后的 A 股本身就是样本外;全部信号用 60–120 日窗口,换手很低。方向由 train 挑:Chordia
    预测做多稳定端;若短窗的异常成交(Gervais、Kaniel、Mingelgrin 2001 的高成交量溢价,可见度假说)占上风,方向会相反 —— 两种都是有名字的机制。
  inspired_by: 第 1 批的 3 个 head 都是 cross_regbeta(day_quantile_q75(Volume), Y, d):beta
    = corr × sd(Y)/sd(X),截面排序被 1/sd(X) 主导;Volume→Amt 互换让两个 +1 方向的 head 变好(+0.59、+0.04),说明外层的活成分是成交活跃度的离散程度而不是协动,但在
