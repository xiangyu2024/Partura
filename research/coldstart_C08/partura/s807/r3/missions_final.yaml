  hypothesis: '核心同第 2 轮,仍为 day_std(Ret)(分钟收益算出的日内已实现波动)——这是它在本实验里最后一次可用的 E 位(规则 §2:每个核心至多
    2 个 E 位)。再挖它而不是换一个全新核心,首先是因为它已经产出了本种子迄今样本外最强、最稳的发现(cross_stddev(log(log(log(day_std(Ret)))),
    120),score 0.84、valid 1.63,本轮 loc.md heads[5]);但更重要的是一个本轮核对 ops_ext.py 源码才发现的、第
    2 轮笔记完全没抓住的机制:第 2 轮 GP 没有选中我设计的任何一个外围(semistd/autocorr/hurst/zscore/regres 一个都没进最佳
    5),而是自己用 cs_last_high05(y, x) 拼出了全场最高分 +0.88(valid 1.83,heads[4])和 +0.62(heads[7])。cs_last_high05
    的源码文档写得很直白:''Rank of y with every stock in the HIGHEST 5% of x placed BELOW every
    other stock'' —— 它不是把 day_std(Ret) 当『信号』去和另一个量比较协动或对称性,而是把 day_std(Ret) 当一个**排除筛**:当天波动最高的
    5% 股票,无论另一个因子 y(这里是 pow_2_5(pow_2_5(LogFloatShares)) 的 cross_zscore)给它们多高的分,都被强行按到多头书的最底部,永远进不了多头。也就是说,这个核心真正贡献分数的身份,可能根本不是『波动水平的信号』,而是『用极端波动把最不可靠的名字从多头里筛掉』这件事本身——这是因子投资里一个很常见但和『波动溢价』完全不同的叙事(先选股、再用风险指标做排除性清洗)。第
    2 轮我们把核心反复问『它自己的时间序列形状像不像波动的波动』,却从没问过『它配合另一个因子做排除筛,效果如何』。


    本轮外围分三条,全部是第 2、3 轮都没碰过的写法:


    (1) **把排除筛结构嫁接到第 1 轮已验证的市值方差线上**(直接回应上面这条新认识,而不是空想一个新机制):y 换成第 1 轮核心 ts_var(LogFloatCap,
    20) 的 120 日自身历史 z 分数 cross_zscore(ts_var(LogFloatCap, 20), 120)(这个子树本身从未以当前写法被评估过,LogFloatShares
    已经在本核心的现有 head 里用过,换成市值方差线是避免периphery重复的关键),x 仍是 day_std(Ret)。四个方向分开测:cs_last_high05(排除最高
    5% 波动)、cs_last_low05(反过来排除最低 5% 波动,检验是不是方向搞反了——如果『排除』本身不是机制,排除哪一头应该效果相近或更差)、cs_last_high10(更宽的排除带,5%
    太窄还是刚好)、cs_first_high40(换成『加分』而不是『排除』,即最高 40% 波动的名字被排到 y 排序的最前面而不是最后面——检验 heads[4]/[7]
    的分数到底是『排除高波动有害』还是『任何对高波动分段的特殊处理』都加分)。


    (2) **杠杆效应/非对称波动响应**(Christie 1982、Bekaert & Wu 2000 对 Black 1976 提出的杠杆效应做的系统横截面检验):用
    cross_regbeta(x, y, d) 的 y~alpha+beta·x 构造,y = day_std(Ret)(核心,因变量原样嵌入),x = 昨日收益
    cross_delay(day_mean(Ret), 1)(严格用 t-1 的冲击解释 t 日往后 d 天窗口里『波动对收益冲击的平均响应斜率』,不是同期相关,避免同日环内循环),以及用成交额加权的净买卖压力
    day_signed_ratio(Ret, Amt) 代替简单收益作为冲击的第二种刻度。这与第 2 轮的『非对称』(semistd_pos/neg,对 day_std(Ret)
    自己的变化量取正负半边)完全不是同一件事:semistd 问『波动变大和变小是否对称』,这里问『波动对*收益方向*的响应是否对称』——这才是文献里『杠杆效应』的本来定义,算子集合(cross_regbeta/cross_delay/day_mean/day_signed_ratio)在这个核心的任何一轮里都没出现过。


    (3) **区间法波动与收益法波动的缺口**(Parkinson 1980 的极值法方差估计量;Alizadeh, Brandt & Diebold 2002
    系统比较区间估计量与收益估计量的差异):用当日分钟最高价、最低价构造 Parkinson 式区间波动 sub(log(day_max(High)), log(day_min(Low)))(同一天内触达过的最高与最低价,取
    log 差),与核心 day_std(Ret)(逐分钟收益算出的已实现波动)对照——两者理论上都在估计同一只股票同一天的真实波动,但区间法对买卖价差造成的微结构噪声更不敏感,收益法则把跳空、瞬时报价跳动都计入;二者的
    log 差(sub(sub(log(day_max(High)), log(day_min(Low))), log(day_std(Ret))))衡量『当日价格路径的极值跨度相对已实现波动多出来的部分』,慢化到
    60–120 日后是和第 2 轮『波动的波动』完全不同的截面特征(第 2 轮全部是 day_std(Ret) 对自己历史的统计量;这里是 day_std(Ret)
    相对另一个独立估计量的缺口)。再给一个 cross_regres(log(day_std(Ret)), 区间波动, 120) 的时序回归残差版,直接检验『今天的区间跨度,相对这只股票历史上区间~已实现波动的平均关系,多出或少了多少』是否比简单
    log 差更干净。


    机制 (1) 与机制 (2) 各给一个按板块 BoardCode 分桶去均值的稳健性检验,检验是不是板块交易机制(连续竞价规则、涨跌停带宽)的构成效应。


    为什么和控制不同:5 个控制里的波动控制是 20 日已实现波动的水平 cross_mean(day_std(Ret), 20);本位的三条机制分别是『用波动做排除筛而非信号』『波动对收益方向的响应斜率』『两种独立波动估计量之间的缺口』,全部是二阶/交叉/结构性的量,不是波动水平本身,奖励的残差化去不掉这类结构,这与第
    2 轮论证(cross_stddev(log(day_std(Ret)),120) 不是波动控制的影子)是同一个论证套在新的外围上。为什么样本外还会在:杠杆效应是股票市场里重复验证最多次的截面规律之一,从
    1976 年至今在几乎所有市场、所有样本期都稳定存在,不依赖估计窗口;区间法和收益法波动估计量的缺口反映的是报价机制和交易频率这类慢变量,不是某个样本期的特有噪声;用风险指标做排除性清洗是因子投资里长期存在的稳健性做法,不是对某段历史的过拟合;全部种子窗口
    60–120 日(或滚动回归/排除筛本身自带长窗),换手低。'
