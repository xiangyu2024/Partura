  hypothesis: '灵感来自两处三轮里从未被真正用过的材料:(1) LimitWidth(涨跌停带宽)这个日频叶子,546 个历史候选、8 个 head、共性表、核心卡里,从来只被当成
    cs_bucket_demean/cs_bucket_zscore 的『分桶字段』,没有人把『这只股票是不是真的被这个带宽锁死过』当一个独立特征算过;(2)
    ops_ext.py 里的 day_at_max_ratio / day_at_min_ratio(当日有多少比例的分钟,价格停在当天的最高/最低点——对涨停/跌停后连续竞价冻结的股票,这个值会很高)和
    day_flat_ratio(报价连续两分钟不变的比例,docstring 自己写的用途就是''frozen book'' state),三轮、546 个候选、全部
    enrichment/core_cards 里一次都没出现过(day_pos_ratio、day_quantile、day_median、day_gini、day_centroid
    都已经用过)。


    机制:A 股的涨跌停板制度(主板 ±10%,创业板/科创板 ±20%,少数风险警示股 ±5%,这正是 LimitWidth 字段记录的内容)决定了,一只股票当天冲向价格带的一侧并封住、全天交易被锁死在那个价位附近时,留下的分钟数据会出现大量『同一个价格』的分钟——day_at_max_ratio(Close)/day_at_min_ratio(Close)
    直接量化『这只股票今天封板封了多久』。Seasholes & Wu (2007) 发现上交所个股触及涨跌停当天之后,存在可预测的价格行为(触及涨停带来注意力冲击,随后有可预测的价格反应);Kim
    & Rhee (1997) 在东京证交所的涨跌停研究里发现涨跌停本身会延迟价格发现、带来跨日的波动溢出;Kumar (2009) 的『彩票偏好』框架(本种子低波动/偏度那条线已经在用)直接预测散户会追逐『容易封板、高弹性』的股票,这类追涨行为本身是可预测的、带超额收益含义的交易者结构;Barber
    & Odean (2008) 的注意力驱动买入在涨停这个最极端的注意力事件上应该最强。


    这与第 1 轮 N 位(成交 CV,问『活跃度在天与天之间多不稳定』)和第 2 轮 N 位(日内 q75/q25 成交比值、Gini,问『单日内分钟与分钟之间成交分布的形状』)是同一个『厌恶不确定性
    / 关注度驱动』大叙事的第三个变种,但截面维度完全不同——前两者都是『某个统计量在时间或分钟上有多离散』,这里是『价格有多频繁被行政性地锁死在制度边界上』,是交易制度决定的现象,不是统计分布决定的;与
    5 个控制(流动性水平、波动水平、20 日反转、已知族、市值)构造上也不同:控制衡量的都是『正常交易状态下』的统计量,封板期间分钟数据近似退化(同一价格反复出现),这条特征专门刻画『多久处于非正常交易状态』。


    算子实现:day_at_max_ratio(Close)/day_at_min_ratio(Close) 在 60/120 日上用 cross_mean 慢化(单日原始值噪声大,第
    1 轮的换手论证同样适用);两者的净差 sub(...) 衡量『追涨封板 vs 杀跌封板』的不对称强度;day_flat_ratio(Close) 作一个更宽的『报价冻结』对照(不限定在极值,也包含流动性枯竭型的停滞,检验是不是单纯『不活跃』而不是『真的封板』);按涨跌停带宽
    LimitWidth 分桶去均值,把『主板 ±10% 本来就比创业板 ±20% 更容易封住』这个机制性差异去掉,剩下的是『给定自己板块带宽后,封板倾向是否异常』;按规模
    LogFloatCap 分桶 z 分数做第二个构成效应检验(小盘股本来就更容易封板);cross_zscore(·, 240) 给一个『相对自己历史』的动态版(这只股票最近是不是比它自己平时更容易封板,呼应第
    2 轮 E 位的『动态』思路,但用在一个全新的底层量上);最后用 High 代替 Close 重复一遍 day_at_max_ratio 作稳健性检验(封板股票的Close
    本身可能就等于涨停价,但 High 能捕捉『盘中触及过涨停但最后没封住』的情形,二者若分数相近说明『真正封住』和『盘中摸到过』的信息量接近,若明显不同说明『封住多久』比『摸到没摸到』更重要)。


    为什么样本外还会在:涨跌停板制度是交易所规则,制度性的、不随样本期变化;Seasholes & Wu、Kim & Rhee 的发现都是基于制度结构本身(不是某段时期特有的流动性或监管环境);彩票偏好(Kumar
    2009)被广泛证实是散户结构性的、长期存在的认知偏差,不会随窗口选择消失;主力种子全部60–120 日慢化,换手低。'
