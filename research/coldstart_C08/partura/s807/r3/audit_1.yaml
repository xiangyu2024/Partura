    soundness: 5
    reasons: '核对 loc.md 拆解表:knockout 外层 `pow_2_5`(只留 `pow_2_5(LogFloatShares)`)分数 0.878→0.83,necessity
      仅 +0.05,与 why 描述一致,确认外层幂变换几乎是死重;window 行 `cross_zscore@241->120` 分数 0.878→1.47(增益
      +0.59),也与 why 一致。5 个变体把「去掉死重的幂变换层(1 层/0 层)」与「窗口 120/90/60」分开和叠加测试,方向清楚、没有重复设计。corr_1.json
      显示这 5 个变体与原 head 本身的 |ρ| 在 0.67–0.85(窗口差得最多的那个最低),正是 R 组「替换路径」(ρ≥0.5)该有的相关度结构,不是和库里其它
      head 撞车。没有发现数学问题。'
  - head: 'cs_last_high05(cross_zscore(cross_zscore(cross_zscore(pow_2_5(pow_2_5(LogFloatShares)), 241), 241), 241), day_std(Ret))'
    soundness: 5
    reasons: '该 head 与上一条 +0.88 的 head 共享同一个 `pow_2_5(pow_2_5(LogFloatShares))` 子树,只是外层多套了两层
      `cross_zscore(241)`;直接对比 loc.md heads 表两行(+0.88→+0.62)可见多套两层 z-score 是负贡献,这是可以直接核验的事实,不是编造的「necessity」。3
      个变体分别测「单层 z-score 在窗口 120 下是否还保留+0.59 的窗口增益」「2 层嵌套在窗口 241/120 下的分数」,系统地定位退化梯度在哪一步最陡,方法干净。corr_1.json
      显示这 3 个变体与原 head 的 |ρ| 在 0.32–0.79,同样符合替换路径该有的相关度结构。没有发现数学问题。'
