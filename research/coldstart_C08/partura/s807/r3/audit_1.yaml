    struck_seeds: [4, 5]
    reasons: '核心 `day_std(Ret)` 是本种子第 2 次用作 E 核心(第 1 次是 r2),符合 §2「每个核心至多 2 个 E 位」的上限,本轮之后不能再用。核心自身与
      5 个控制的 |ρ| 都 < 0.8(最高是 vol 0.722,corr_1.json「slot a core」),满足 E 位的额外门槛。

      本位三条机制,核对 ops_ext.py / dt_cross.py 源码后,算子组合与假说描述一致、核心均原样嵌入:
      (1) `cross_regbeta(x, y, d)` 在 common.py:643 `rolling_ols` 里确实是 `y~alpha+beta*x`,种子 1-3、11
      把 y=`day_std(Ret)`(核心原样)、x=滞后 1 日的 `day_mean(Ret)` 或 `day_signed_ratio(Ret, Amt)`,是标准的「用 t-1
      冲击解释 t 日波动响应斜率」杠杆效应构造,没有用到 t 日之后的信息,不是前视;
      (2) `day_max(High)`/`day_min(Low)` 构造 Parkinson 区间波动,`sub(sub(log(day_max(High)), log(day_min(Low))),
      log(day_std(Ret)))` 字面就是区间法减收益法的 log 差,种子 6 的 `cross_regres(log(day_std(Ret)),
      区间波动, 120)` 按 rolling_ols(x=log(day_std(Ret)), y=区间波动) 取残差,与假说「今天的区间跨度相对自己历史上区间~已实现波动关系多出多少」一致;
      (3) `cs_last_high05/low05/high10/cs_first_high40` 的 docstring(ops_ext.py:369-411)与假说逐一对应
      ——高 05/10 排除、低 05 反向排除、first_high40 变「加分」——种子 7-10 把 y 换成第 1 轮核心的 120 日自身 z 分数
      `cross_zscore(ts_var(LogFloatCap, 20), 120)`,是对 heads[4]/[7](GP 自己拼出的 cs_last_high05 排除筛,+0.88/+0.62)这个机制能不能换一个
      y 仍然成立的直接检验,算子骨架(ts_var 对比 pow_2_5∘pow_2_5)与库里的 head 不同,不是换皮。
      相关度表(corr_1.md/json)显示全部种子与 8 个 head 的原始 |ρ| 都 < 0.42,大多 < 0.2,残差更低,不是任何 head
      或控制的影子——除了种子 4、5。

      种子 4(`cross_mean(sub(sub(log(day_max(High)), log(day_min(Low))), log(day_std(Ret))), 60)`)与 vol
      控制(`cross_mean(day_std(Ret), 20)`)的原始 |ρ| = 0.872,触发 §3 自动划线(≥0.8);种子 5 是同一构造、窗口
      120,|ρ| = 0.796,严格说没过 0.8 这条线,但和种子 4 是完全同一个公式换窗口、同一种失败模式——简单的 log 差没能把波动水平那部分减掉,这条
      seed 本质上还是在量「波动水平」,和假说里「这类结构奖励的残差化去不掉」的论证对不上,按「重复」单独划掉。改成时序回归残差的种子 6 在同一个机制上
      |ρ| 降到 0.059,证明问题出在「简单减法」这步实现,不是机制本身不合理,所以种子 6 保留。划完还剩 10 个种子,远高于 ≥4 的门槛。

      如果这位有 alpha:(1)(3) 杠杆效应与排除筛泛化,最可能来自 A 股下跌后次日波动的不对称放大、以及「用极端波动把最不可靠名字筛出多头」这个排除性清洗机制本身,不依赖
      LogFloatShares 这一个特定 y;(2) 区间法 vs 收益法波动缺口(种子 6),最可能来自买卖价差/跳价造成的微结构噪声,与简单波动水平正交的那部分。'
    revise: '通过。建议 PI 在定稿时去掉种子 4、5(与 vol 控制几乎是同一个量),只保留回归残差版种子 6 代表这条机制;其余 10 个种子不用改。'
