    reasons: '逐条核对了 loc.md 的 8 个 head、「共性」表(20 条)与「机械核心卡」(29 条):`day_at_max_ratio`、`day_at_min_ratio`、`day_flat_ratio`
      三个算子在这 3 轮、546 个候选里一次都没出现过;`LimitWidth` 只在 `cs_median(LimitWidth)`/`signedpower(cs_median(LimitWidth))`(核心卡第
      22、25 位)里出现过,那是「市场当天的典型带宽」这个横截面常数(cs_median 对每只股票取的是同一个全市场当日值),不是本位「这只股票自己有没有被锁住」的逐股特征,两者不是同一个东西;也不是第
      1 轮(跨天成交 CV)、第 2 轮(日内 q75/q25、Gini)两个 N 位的换皮——那两个度量的都是「某统计量在时间或分钟上有多离散」,这里是「价格被涨跌停带宽行政性锁死的频率」,维度不同。

      核对 ops_ext.py 源码:`day_at_max_ratio`/`day_at_min_ratio`(580-603 行)按「等于当日最大/最小值的分钟占比」实现,`day_flat_ratio`(82-94
      行)按「与前一分钟相同的占比」实现,都有 n>1 / 分母 clamp 保护,没有除以近零或溢出风险;`cs_bucket_demean`/`cs_bucket_zscore`(463-496
      行)按 x 的十分位分桶,bucket 字段用 `LimitWidth`(种子 6、7)和 `LogFloatCap`(种子 10)分开检验,和假说描述一致。全部种子都是当日分钟数据的当日聚合,与已有的
      `day_std(Ret)` 等 day_* 算子同样的时序对齐,没有前视问题。相关度表(corr_1.md/json)显示与 8 个 head 的原始 |ρ| 全部 ≤
      0.27,与 5 个控制的原始 |ρ| 最高是种子 8(`day_flat_ratio@60`)的 liq 0.62、known 0.55,都明显低于 0.8 的自动划线,且这个相关恰恰印证了假说——日内报价冻结本来就该和流动性/成交波动相关,残差列(0.26)显示控制掉之后还剩不少。

      corr_1.json 里种子 1、3、4、5、12 的 `gate` 标 False(`distinct` 在 0.28–0.49 之间,即当天名字之间同值打平较多)。我核对了这正是
      diagnose.py `distinct_fraction` 文档自己写的场景——「级数少、靠符号顺序打破平局」;而 rules.md §4 明确把「并列靠股票列序打破」排除在数学问题之外(列序携带板块
      / 交易所信息)。涨跌停锁死本身就应该让大多数正常交易日的 `day_at_max_ratio(Close)` 聚在 1/n 附近,这是机制本身决定的,不是数值伪影,所以我没有据此划掉;列出来供
      PI 参考,不作为划线理由。没有找到真正符合 §4(前视 / 数值伪影 / 定义坏掉)的问题,12 个种子全部保留。

      如果这位有 alpha:最可能来自涨跌停触及后的注意力冲击与散户彩票偏好(追涨易封板的名字),使「最近多久被行政性锁死」这个慢变量携带与已有波动
      / 流动性控制不同轴的、可预测的横截面信息。'
