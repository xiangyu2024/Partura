  hypothesis: 本位在本组自己上一轮(r2)N 位产出、并被 GP 机械嫁接成本轮分数第二高新 head(+1.12,c08s806Pr2b_Nb)的结构上继续问一个新问题。那个 head 的形状是 cross_mean(mask(O>0) * ATT * |O| * O, 20)(O = 隔夜收益 log(day_first(Open)/cross_delay(day_last(Close),1)),ATT = 开盘第一分钟成交额占比),O>0 时 |O|*O = O²,所以它只在『隔夜上涨、且被开盘关注度确认』的日子上取非零的正值,sign=+1(多头=这类日子多的股票)。这意味着『被开盘关注度确认的隔夜跳跃』更像是会持续的真实信息事件,而不是传统 MAX/隔夜情绪文献里『跳得越高越该做空』的反转故事——呼应 Blume、Easley 与 O'Hara(1994)『放量确认的价格变动更可信』这个一般性论点。loc.md 的拆解证明 is_gt(O,0) 这个符号门是必要的(敲掉后从 +1.12 掉到 -0.21,必要性 +1.34),但这个 head 以及它全部的拆解候选(knockout/sufficiency/swap/window)都只测过『上涨被确认』这一侧,从未给出『下跌被确认』的镜像,也没有问过这个效应是不是对称。本位要问:隔夜『下跌』且被开盘关注度确认的日子,后续是继续走弱(与上涨侧同号的继续性,支持『关注度确认的方向都会续』这个统一机制),还是走强(反转,支持『坏消息更快被消化/短期修正』,或 An、Huang 与 Li(2022)已经证明的中国市场隔夜异象本身的不对称性—— 他们发现隔夜收益只在前一交易时段下跌之后才显著为负,归因于散户的有限注意力)。算子实现:n1 把已证实结构里的 is_gt 换成 is_lt,其余子树原样保留(mask(O<0)*ATT*|O|*O;|O|*O 在 O<0 时取负值,是该结构严格的符号镜像,不是重新设计的新形状);n2 把『符号』和『大小』拆开,用 mask(O<0)*ATT*O²(pow_2 代替 abs_*O,只问『被确认的下跌有多猛』,不带方向信息,和 n1 对比可以把『方向』与『大小』的贡献分开);n3 = 上涨侧的 mask(O>0)*ATT*O² 减 n2,是不带方向信息的净不对称(直接回答『确认的上涨能量』与『确认的下跌能量』哪个更强、强多少,呼应 r2 N 位对称 O²/I² 做过的上/下行能量差,但这里乘的是 ATT 而不是日内收益的平方);n4 是不分方向的总体交互 mul(ATT, pow_2(O))(去掉符号门,检验『按方向分 mask』是不是必要的,一个必要性诊断——如果 n4 的分数和 n1/原 head 的均值接近,说明符号门没有贡献,信息全在大小里);n5 = cross_corr(ATT, |O|, 20),把『当天的交互』换成『这只股票一贯有多强的关注度-跳空绑定』这个特质(trait,而不是某些具体日子的事件能量,是全新的统计量家族);n6/n7 把『乘以跳空大小』换成『只看确认侧(跌/涨各自)开盘关注度的水平本身』,不带大小权重,检验信息是不是只在于『那天有没有大量资金在开盘确认方向』而不是『跳了多大』;n8 = cross_corr(ATT, 昨日日内收益, 20),换一个全新的滞后维度——问『今天开盘的关注度』和『昨天收盘前的走势』是否存在稳定的跨日关系,这是本组三轮任务里都没问过的提前量(lead-lag,而不是同一天内的交互);n9/n10 把『乘以跳空大小』换成『乘以当天整体分钟波动 day_std(Ret)』,检验这种确认效应是不是关于隔夜跳空本身,还是关于那天整体信息量/波动有多大(day_std(Ret) 不含方向信息,只把隔夜的符号筛选保留、权重换成更宽的信息代理)。为什么和库里已有的不一样:库里两个对称二次型 head(+0.67、+0.60)和这次的新 head(+1.12)全部只问『隔夜整体水平』或『隔夜与日内之比』或『上涨侧单独的确认能量』;本组 r2 的 N 位已经问过对称 O²/I² 的上/下行能量分解,但从没有一颗种子把开盘关注度 ATT 按方向拆开,也没有一颗种子问过关注度与跳空的滞后关系或特质绑定,这些都是全新的轴。为什么样本外还会在:T+1、做空限制与散户主导的注意力分布,使『开盘关注度确认的方向性隔夜跳空』是制度性的、可持续的现象,不依赖某一段行情;An、Huang 与 Li(2022)已经证明中国市场隔夜异象的不对称并非噪声,是样本期内稳定存在的结构性特征。
