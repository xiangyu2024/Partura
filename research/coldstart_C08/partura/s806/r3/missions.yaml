  core: div(day_first(Amt), day_sum(Amt))
  hypothesis: 核心 ATT = div(day_first(Amt), day_sum(Amt)) = 开盘第一分钟成交额占全天成交额的比例,取值在 [0,1](零成交日为 NaN)。它是本轮快照里新 head(+1.12,c08s806Pr2b_Nb,本组 r2 自己 N 位机械嫁接出来的、本轮分数第二高的 head)里承重的原子之一:loc.md 的拆解表明把这个比例从该 head 的子树里敲掉,整条链从 +1.12 掉到 -1.04(sufficiency,子树本身)乃至 -4.31(把它整段去掉只剩符号和两个log 项的链);R 候选表也显示把它旁边重复的 log(O) 因子精简掉(去掉多余的一次符号项,或去掉多余的一次大小项)各带来 +0.14 的增益——说明『开盘第一分钟到底占了多大份额』这件事本身在那条链里是必要且稳健的承重件。但它至今只在『与隔夜跳空 O 相乘』这一种用法下被测过(r1 的 N 位单独测过 cross_mean(ATT,20),分数不高、没有进 heads;r1/r2 的全部任务里 ATT 都只出现在 ATT*|O|*O 这一种交互形式里),从未单独当 E 核心深挖它自己的结构。本位问:这个比例本身(不跟任何跳空量交互)作为『当天的信息/关注度有多少集中在集合竞价这一个最早的时点上』的代理,是不是单独就携带跨日可持续的信息,还是只有在跟隔夜跳空的符号/大小交互时才有意义——这是把已证实有效的联合结构拆开做的一次干净的归因实验,是对已有发现的补充验证,不是重复。机制:Admati 与 Pfleiderer(1988)的理论是知情交易者与可以自由选择交易时点的流动性交易者,会在均衡里把交易聚集到彼此能互相掩护的时段;中国集合竞价阶段由高度散户化、注意力驱动的隔夜订单主导,前一晚消息(隔夜新闻、公告、北美夜盘联动)在开盘第一分钟释放得有多集中,衡量的是『这只股票有多少当天信息选择在最早的时点就动手』,是一个和 day_centroid(Amt) 不同粒度的问题:day_centroid 回答的是『全天交易发生在什么时候』这个连续的质心,ATT 回答的是分布最极端的一个点——开盘那一分钟——占了多大份额。Heston、Korajczyk 与 Sadka(2010)证明美股日内收益在固定钟表时刻上有约 40 个交易日的持续周期;ATT 是这个钟表轴上信息最密集的单点读数,如果类似的钟表周期在中国市场也存在,一只股票『惯常在开盘就用掉多少注意力』应该是一个稳定的跨日特征,而不是单日噪声。Lou、Polk 与 Skouras(2019)的隔夜/日内客户群拔河框架意味着,开盘瞬间到底被谁主导(提前下单的知情资金,还是扎堆的噪声/流动性需求),决定了隔夜这一段对该股票的信息含量;ATT 本身的水平和稳定性,是这个客户群构成的直接代理,不需要先知道隔夜方向就能问。Blume、Easley 与 O'Hara(1994)证明成交量本身携带信息、能改善价格发现;开盘量占比把这个一般性论点收窄成『信息在哪个时点被交易消化』的具体读数,为乘以日内波动的交互种子提供依据。算子实现,刻意避开本组历史上对 ATT 用过的唯一外围(裸的 cross_mean 平滑,以及『乘以 O 或 |O|』的交互):(1) 换统计量家族——cross_ema(半衰期 10、40,连续记忆而不是硬窗口均值)、cross_tail_mean_q75/q25(开盘关注度偏高/偏低那条尾部各自的条件均值,而不是典型水平)、cross_stddev 与 cross_madz(这只股票的开盘关注度本身有多不稳定/今天比自己的历史惊讶多少,而不是水平);(2) cross_delta(把『一贯的开盘关注习惯』和『最近的迁移』分开,这个变化检测器此前只用在 day_centroid 上,这里是第一次用在 ATT 上);(3) 一个不含任何隔夜量的交互——乘以 day_std(Ret)(问开盘关注度是不是在当天整体信息量/波动更大的日子里更强,直接检验 Admati-Pfleiderer『信息越值钱聚集越明显』这条预测,而且不经过隔夜跳空这个中介);(4) 两个中性化诊断——cs_bucket_rank 按 cross_mean(day_sum(Amt),30)(成交额水平,不是已知族 cross_mean(day_std(Amt),30) 那个波动量)分桶,检验 ATT 是不是薄股票的流动性水平伪影;按 ListAge 分桶,检验是不是上市时间短的名字机械地把早盘占比推高;(5) 一个共动检验——cross_corr(ATT, day_centroid(sub(High,Low)), 20),问『开盘吃掉多少成交额』与『当天的振幅发生在什么时候』是否对齐,是 r2 里 day_centroid(Amt) 与 day_centroid(sub(High,Low)) 共动检验的姊妹问题,但主体换成了分布的极端点而不是整体质心;(6) 一个排除诊断——cs_last_low05 用 cross_valid_count 筛掉近期上市/复牌的名字。为什么样本外还会在:中国散户主导的集合竞价制度、T+1 以及隔夜信息习惯性在开盘瞬间释放,在样本期内是结构性的、没有变化的客户群与微观结构特征,不依赖某一段行情;ATT 是一个份额量,数值上安全(分子不超过分母,零成交日给 NaN 不给 inf,与 day_centroid 已经核过的边界情形同构),去掉波动水平后与 5 个控制都不是同一个量(集中在哪个时点,不是波动、流动性水平、反转或市值本身)。
