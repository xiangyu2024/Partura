    reasons: '【库与门槛】快照里 0 个 head(loc.md),不存在与某个 head 重复;核心 day_max(Ret) 是机械核心卡第 5 张(共性表均值差 +0.86),与 5 个控制最大 |ρ| 是 vol 0.48 < 0.8,E 位核心门槛过;14 颗种子都原样含 day_max(Ret),没有一颗与控制 |ρ| ≥ 0.8,没有自动划掉的。本核心第一次占 E 位。【创新度 4】M 第 1 批里含这个核心的候选,外围只有 {cross_product(·,3), cross_max(·,30), abs_}:取的是波动水平的极值,外加 cross_product 把 NaN 当 1 的膨胀通道。本位的外围是实质性的改进:当日内标准化 Z = (day_max − day_mean)/day_std(Lee–Mykland 型跳跃统计量)、上跳减下跳 (max + min − 2·mean)/std、多日 cross_ema / cross_tail_mean_q75 / cross_max 聚合,以及按 vol 或零收益占比分桶 / 屏蔽。相关度表佐证波动水平确实被拿掉了:Z 系种子(1–5、8–10)与 vol 的 |ρ| 从核心的 0.48 降到 0.05–0.17,与 known 都 ≤ 0.20。不给 5:核心本身和 MAX 族是 M 已经在挖的同一方向。【合理度 4,逐算子核对】day_std 是总体标准差(common._stddev:nanmean 平方后开方),所以 Z ≤ √(n−1) = √240 ≈ 15.49(Samuelson 不等式);全零的封死日是 0/0 = NaN,只有一个非零分钟的日子正好打到上限,都不会爆。cross_ema 的 a = 1 − 0.5^(1/d) 是半衰期,非有限值的权重被丢掉,不当 0。cross_tail_mean_q75 是窗口里 ≥ 75% 分位的均值,n ≥ 2。cs_bucket_rank 在 x 的十分位内给 y 排秩,另加 1e-4 × 全局秩破并列。cs_last_high10 / low05 / low10 按整块并列推到底部。seed 12 是同一组有限日上 Σw·max / Σw·std,不会因为某一天 std 小而爆。seed 14 里 cross_max(cross_product(·,3),30) 恰好跨 32 天,与 cross_valid_count(day_last(Close),32) 对齐:窗口里缺过一天的名字(新股、复牌,通常远少于 10%,能整块落进带内)被推到底部,剩下的乘积里没有 NaN→1 膨胀;它与 seed 13 的控制画像几乎相同(vol 0.60 对 0.58),说明筛选生效了。窗口 5–20 日合理,没有前视,没有禁用算子。【非数学顾虑,不挡】低价股的 tick 离散使 Z ≈ 1/√(非零分钟占比),Z 有一部分在量离散度;seed 8 / 9 正是为此而设,保留。如果 bar 0(09:30 集合竞价)的 Ret 含隔夜跳空,跳空日的 day_max(Ret) 就是跳空本身,会与 b 位的 O 部分重叠。13、14 是 PI 自己标明的诊断种子,与 vol 0.58 / 0.60(中度相关,不是挡的理由),量的是水平而不是形状,方向和本位假设相反;但都原样含核心、没有数学问题,保留给 GP 去比。【划掉 6:数学问题】cross_madz(day_max(Ret), 60) 的分母是 60 日 MAD(下限只有 1e-6·|median|)。低价、低波的票(例如 3–5 元的大行和低价小盘)多数日子 day_max(Ret) 恰好是 1 tick / 价格;只要超过一半的日子落在 1 tick 上,MAD 就只剩价格漂移造成的 1 tick 值之间的微小差异(约 1e-4 量级)。这时一个 2 tick 的日子,或者 day_max = 0 的封死日,会给出 |z| ≈ 20–50,而正常的票在 ±5 以内;cross_ema(·,5) 再把它拖几周。这是 §4 的「除以近零的量造成的爆点」,而且正好落在多头书所在的尾部。修法:cross_ema(cross_zscore(day_max(Ret), 60), 5)(含今天的 z 有界于 √(n−1),且 cross_zscore 自带相对离散度保护),或者把 madz 用在 Z 上(Z 是连续的,不按 tick 量化)。【划掉 11:重复】与 liq 的 |ρ| = 0.63,与已知族 cross_mean(day_std(Amt),30) 的 |ρ| = 0.55 ≥ 0.5。按 §1,它本身就会被判不合格,基本是在量流动性 / 已知族:不活跃的票,一分钟拿走全天振幅的份额高。另外,PI 说的「有界在 [0, 约 1]」只在 bar 0 的 Ret 不含隔夜跳空时成立。若含,近一字的跳空涨停日分母 log(High/Low) ≈ 1 tick,会给出约 100 的值;全一字日 log(1) = 0 → inf,被 cross_ema 跳过,这一点不是问题。【如果有 alpha】最可能来自散户对日内正跳跃 / 右尾的博彩需求,在 T+1 与涨跌停下更强,造成高估;去掉波动水平之后,体现为标准化跳跃的持续性,以及上跳相对下跳的不对称。应做多 Z 低、不对称为负的一侧。'
