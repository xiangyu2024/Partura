    reasons: '【库与门槛】快照里 0 个 head。M 第 1 批的 115 个候选全部是交易时段内部的分钟统计,共性表的 16 个子树没有一个碰到 day_first(Open) 相对前一日 day_last(Close) 的跳空。11 颗种子与 5 个控制都 < 0.8,与 known 都 < 0.5,没有自动划掉的。【创新度 5】控制里的 rev 是两段之和 O + I,本位量的是两段之差、两段之间的关系和隔夜份额,是库与控制都没有触及的信息源:集合竞价 vs 连续竞价。相关度表:O 水平类种子(1、2、11)与 5 个控制都 ≤ 0.19;6、7、8、9 都 ≤ 0.23;3、10 与 vol / known 在 0.34–0.40。seed 4 / 5(O − I)与 rev 是 0.53 / 0.45:I 的方差大于 O,所以 O − I ≈ −I,有一部分是反转,但远不到 0.8,也不是同一个量。【合理度 4,逐算子核对】O = log(day_first(Open) / cross_delay(day_last(Close), 1)):cross_delay 把前一交易日的值下移(dt_cross.cross_delay),是因果的;前一日停牌或上市首日为 NaN,不会把多日收益当成隔夜;价格是后复权,除权日的比值连续;log 是 log|x|,比值约 1,安全。I = log(day_last(Close) / day_first(Open))。cross_corr = cov / (√(var_x·var_y) + 1e-9),有界于 [−1, 1]。seed 8 的 ΣO² / (ΣO² + ΣI²) 在 [0, 1]。seed 9 / 10 的 day_first(Amt) / day_sum(Amt) 在 [0, 1],全零成交日是 0/0 = NaN。没有 cross_shift,没有 ts_spearman / nt_*。窗口 5–20 日合理。【小毛病,不划】(i) cross_corr 不设最少样本数:窗口里只有 1 对时返回 0,有 2 对时正好 ±1。新股上市头几天和长停后复牌的票(约 1% 的名字)会落在 6、7 的两端;可以在外面加 cs_last_low05(·, cross_valid_count(day_last(Close), 20)),交给 GP。(ii) seed 11 的分母 cross_ema(day_std(Ret), 10):对整段历史都是一字板的新股可能精确为 0(→ inf,被 isfinite 掩掉);开板后几周内是很小的有限值,所以值很大。PI 说的「带完整记忆,不会变成 0」对这些名字不成立。但它们在 1、2、3 里本来就因为 O ≈ log 1.1 排在顶端,除法没有制造新的伪影。(iii) O 的右尾被一字涨停跳空和新股连板占据,这些票次日常常买不进;这是状态,不是数学问题。【如果有 alpha】最可能来自集合竞价里注意力驱动的散户需求:T+1 下开盘买入当天卖不掉,开盘价被推高,随后在连续竞价里被机构修正。持续正隔夜、负日内的票跑输。去掉 20 日反转(两段之和)之后,剩下的是收益在两段之间怎么分配。'
