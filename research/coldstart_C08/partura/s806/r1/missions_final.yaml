- type: N
  hypothesis: 隔夜与日内的拔河。把每天的收益拆成两段:隔夜段 O = log(div(day_first(Open), cross_delay(day_last(Close),
    1)))(今日开盘相对前一日收盘;cross_delay 取前一日,因果),日内段 I = log(div(day_last(Close), day_first(Open)))。机制:隔夜段的价格由集合竞价决定,参与者以注意力驱动的散户为主。A
    股 T+1 下,开盘买入的人当天不能卖出,情绪性需求集中体现在开盘跳空上,随后在连续竞价里被机构与流动性提供者部分修正。持续的正隔夜收益是个股情绪的代理:Aboody
    等(2018)发现隔夜收益短期持续,更长的期限上隔夜收益高的股票跑输、低的跑赢;Lou、Polk 与 Skouras(2019)发现两段收益由不同的客户群推动,在横截面上各自持续而彼此拉扯。算子实现:cross_mean
    / cross_ema / cross_tail_mean_q75 度量 O 的持续水平与尖峰(注意力冲击);sub(O, I) 度量拔河的价差;cross_corr(O,
    I, 20) 度量连续竞价是否系统性地回吐开盘跳空(负相关 = 开盘价被噪声交易推离、盘中被纠正);cross_corr(前一日 I, 今日 O, 20)
    度量下一次开盘是延续还是反向前一个交易时段;隔夜平方和占两段平方和之比度量价格发现发生在竞价还是盘中;第一分钟成交额占全天的比例 div(day_first(Amt),
    day_sum(Amt)) 是开盘注意力的直接代理,也用它给跳空加权;最后是 O 的 EMA 除以日内分钟波动的 EMA,即以盘中噪声为单位的跳空。数值上都是安全的:相关系数有界;比值的分母要么是同一窗口里的平方和(分子不超过分母),要么是带完整记忆的
    EMA(不会因为连续封板变成 0);复牌日前一日收盘缺失,O 为 NaN,不会把多日收益当成隔夜;不用 cross_shift,没有前视。为什么和库里不同:第
    1 批 M 的候选全部是交易时段内部的分钟统计(day_max(Ret)、day_close(Vwap)、day_std(Low)、day_cov(High,
    Ret)),共性表里没有任何子树碰到开盘竞价跳空。控制里的 20 日反转是两段之和,本位度量的是两段之差与两段之间的关系,与和近似正交;它也不是波动、流动性、市值或成交额波动。为什么样本外还在:T+1、集合竞价制度与散户主导的开盘注意力在样本期之后都没有改变;机制来自交易制度与客户群结构,不是某段行情。
  inspired_by: 第 1 批:115 个已评分候选全部是交易时段内部的分钟统计,唯一承重的是日轴上的慢聚合(cross_max(·, 30)),开盘竞价跳空这一段收益没有任何子树碰到;文献
