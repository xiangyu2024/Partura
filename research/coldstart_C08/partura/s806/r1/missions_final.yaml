- type: E
  core: day_max(Ret)
  hypothesis: 核心 day_max(Ret) = 当天最大的一分钟涨幅(Ret 是分钟 bar 收益),是日内正向跳跃 / 博彩型收益的载体。它的水平值大半就是波动(控制
    vol = cross_mean(day_std(Ret), 20)),新尺子会把这部分连同 U 形、S 形暴露一起残差掉。第 1 批共性表里,含这个核心的子树只出现了一摞外围
    {cross_product(·,3), cross_max(·,30), abs_}:在取波动水平的极值;而且 cross_product 把缺失日当乘法单位元
    1(窗口里每个停牌日把乘积放大约 1/x ≈ 200 倍),把全天没有上涨分钟的封死日变成精确 0,数值通道与信息混在一起,全部负分。本位的外围与之完全不同,分四层实现「跳跃形状」而不是「波动水平」:(1)
    当天内部先标准化成跳跃统计量 Z = div(sub(day_max(Ret), day_mean(Ret)), day_std(Ret)),即最大分钟收益偏离当日均值多少个当日标准差(Lee
    与 Mykland 2008 的检验统计量:单分钟收益除以本地波动)。总体标准差下 Z ≤ √(n−1) ≈ 15.5,有界;封死日与只有一分钟的日子是 0/0
    = NaN,不是爆点。除掉波动水平之后剩下的是右尾的形状。(2) 沿日轴用 cross_ema(半衰期 5 / 10)、cross_tail_mean_q75(20
    日里最高四分之一的均值,约等于文献的 MAX(5))、cross_max(20)(文献的 MAX(1))聚合,度量跳跃的频率与持续性,而不是某一天的极值;EMA
    会跳过非有限值。(3) 用 Z 减去对称的下跳统计量 div(sub(day_mean(Ret), day_min(Ret)), day_std(Ret)),得到有符号跳跃:上跳相对下跳的不对称(文献:只有正向特质跳跃被定价)。(4)
    显式处理两个状态:cs_bucket_rank 在 vol 控制的十分位内、或在零收益分钟占比(tick 离散 / 封死)的十分位内排序,去掉低价股 tick
    离散对 Z 的机械影响;cs_last_high10 用 cross_max(day_zero_ratio(Ret), 15) 把封死最多的一档踢出多头书,cs_last_low05
    用 cross_valid_count(day_last(Close), 120) 把近期上市 / 复牌的一档踢出,把旧写法藏在 0 与 NaN→1 里的两个通道拆开。另有一个
    Z 的变体换了分母,用日内对数振幅 log(day_max(High)/day_min(Low)):一分钟拿走了全天振幅的多少,有界在 [0, 约 1]。还有两颗诊断种子,用来给旧写法的来源定价:cross_max(day_max(Ret),
    30)(去掉 NaN→1 膨胀、保留捞尾),以及原链 cross_max(cross_product(day_max(Ret), 3), 30) 外面套上缺失日筛选。机制:A
    股散户占比高,T+1 与涨跌停下博彩偏好更强;日内正跳跃多、右尾肥的股票被高估,随后跑输(Bali、Cakici 与 Whitelaw 2011;Lee 2023
    发现 MAX 效应主要由正向特质跳跃驱动;Amaya 与 Vasquez 2011 用日内数据证实跳跃本身定价)。Wan 2018 指出在中国特质波动会吞掉
    MAX:所以这里先除掉波动,只留形状。和以前不同:旧写法量的是波动水平的极值与数值通道,本位量的是标准化后的尾部形状与它的持续性,并把状态通道显式拆出。为什么样本外还在:来源是投资者偏好加上套利限制(做空约束、T+1),是制度性的;标准化后它与
    5 个控制都不是同一个量;多日平滑压低换手,15 bp 成本下更扛得住(Novy-Marx 与 Velikov:低换手的异象扣成本后才留得住)。
