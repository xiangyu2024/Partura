    is_gt(O, 0) 当 0/1 掩码乘进 O*O(隔夜自身的平方)或 O*I(两个 head 分子项的核心,隔夜与日内的协方差核)里,再在 20 日窗口里
    cross_mean。这里刻意不用真正的条件均值(即不除以窗口内满足符号条件的天数):20 天窗口内某个符号的天数可能很少甚至 0,除以它会制造规则 §4
    点名的“除以近零的量”数值伪影;未归一化的窗口总和除以固定的 20,是有界、连续、不会因窗口内天数变化而跳变的近似,代价是把“条件发生的频率”也混进了水平里——这是刻意的工程选择,不是数值缺陷。n1=cross_mean(mask(O<0)*O*O,20)与
    n2=cross_mean(mask(O>0)*O*O,20)分别是隔夜下跌和隔夜上涨各自贡献的平方能量,n3=n1-n2 是净不对称(更负 = 下跌隔夜的波动系统性地大于上涨隔夜);n4、n5
    把同样的掩码乘进 O*I,n6=n4-n5 问的是“隔夜下跌后日内把它往回拉”这件事和“隔夜上涨后日内把它往回拉”这件事强度是否一样——这是两个 head
    的对称二次型完全没问过的问题。An、Huang 与 Li(2022)发现中国市场的隔夜异象恰好不对称:隔夜收益只在前一个交易时段是下跌之后才显著为负,在上涨之后不显著,他们把它归因于散户的有限注意力;本位的掩码种子是把这类不对称结构直接写成算子,维度上做了区分——他们按前一日日内收益的方向分条件,这里按当天隔夜收益自己的方向分条件,检验的是同一类不对称机制在“拔河的哪一段先出现符号”这个更细的切面上是否依然存在。Ang、Chen
    与 Xing(2006)证明下跌方向的波动单独定价、不能被上涨方向的波动替代,是支持把 O 的平方拆成上行/下行两半分别检验、而不是只看对称方差的第二条依据。(2)
