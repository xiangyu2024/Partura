slots:
- type: E
  core: day_centroid(Amt)
  hypothesis: day_centroid(Amt) = 当天成交额 |Amt| 沿分钟轴的质心,缩放到 [0, 1]:sum(t*|Amt_t|)/sum(|Amt_t|)/(T-1);0
    = 全部成交发生在开盘,1 = 全部发生在收盘,0.5 = 对称。它度量的是“这只股票的交易活跃度这一天最集中出现在什么钟表时刻”,一个与成交量方向无关、与成交量水平无关的纯时间配置量,本轮快照里分数最高的
    head(+1.35)就建在它之上。为什么它可能是 alpha 来源:(1) Admati 与 Pfleiderer(1988)给出理论基础——知情交易者与可自由选择时点的流动性交易者在均衡中会把交易聚集到某些时段彼此掩护,聚集的时点因股票携带的私有信息强度、流动性交易者构成的不同而系统地不同,且信息越值钱聚集越明显;(2)
    Heston、Korajczyk 与 Sadka(2010)用美股分钟数据证明,日内收益在固定的钟表时刻上存在持续约 40 个交易日的系统性周期,且不被规模、beta、指数成分解释。把两条放在一起:一只股票的交易通常落在哪个钟表时刻,决定了它更多暴露在这个周期的哪一段上,也携带着“这只股票的信息通常在哪个时段被定价”这层结构性信息。本轮共性表给出的拆解(loc.md)显示这个核心单独(“子树本身”)已经
    +0.41,把 Amt 换成 Volume 仍有 +1.26,把 ts_quantile_q50 的窗口从 20 改成 10 或 40 仍有 +1.03 /
    +1.12——换字段、换窗口都不伤它,说明它是一个稳健的结构,而不是某个窗口长度的偶然拟合,值得专门开一个 E 位深挖。外围怎么实现、和已经见过的写法有什么不同:快照里对这个核心试过的全部外围只有三类——ts_quantile_q50
    的窗口{10, 20, 40}、字段互换 Amt->Volume、以及 head 本身——全部是“同一个统计量(trailing 中位数)、只换参数或字段”。本位的
    12 颗种子刻意避开这三类,换成四个新的方向:(a) 换统计量家族——cross_ema(连续指数记忆,老的极端日是衰减掉而不是出窗口就消失)、cross_tail_mean_q75
    / q25(只取“偏成交偏向收盘”或“偏成交偏向开盘”那条尾部的条件均值,把“典型水平”和“偶尔的极端日”分开)、cross_stddev / cross_madz(度量这个时点偏好本身在日度之间有多不稳定/今天比过去正常水平惊讶多少,而不是它的水平);(b)
    交互——除以 day_gini(Amt)(当天成交在分钟之间整体有多集中,和“集中在什么时候”是两件独立的事,用这个比值问“时点信号在成交本身很零散还是很扎堆的日子里是不是不一样”)、乘以
    day_std(Ret)(问聚集时点的信息量是不是在高波动/有信息的日子更强,直接对应 Admati-Pfleiderer 的预测);(c) 共动——与 day_centroid(sub(High,
    Low))(用高低价差构造的“当天波动发生在什么时候”)做 cross_corr,这里核心只出现在相关的一侧、不是整条树,问的是“成交发生的时点”与“价格波动发生的时点”是否对齐,这是一个此前完全没人问过的、独立于核心水平的新轴;(d)
    变化——对 cross_ema 后的水平再取 cross_delta,把“这只股票一贯的交易时点习惯”和“最近发生的时点迁移”分开(后者可能标记了持股结构/指数纳入等事件);外加两颗诊断种子:在我们自己的流动性-波动控制(cross_mean(day_std(Amt),
    30))十分位内做 cs_bucket_rank(新尺子的残差只去到三次方,去不掉这种和另一个变量的桶内交互),以及用 cross_valid_count
    筛掉近期上市/复牌的名字(第 1 轮解剖发现过这类名字会在幼稚的聚合里制造数值伪影,这里专门对这个新核心重新检验一次)。为什么样本外还会在:机制绑定在三个结构性事实上——中国的
    T+1 与有限的日内做空,使“知情/非知情资金在日内选择什么时候动手”本身是市场微观结构的常态,不是某个行情阶段;收盘集合竞价制度(样本期内全市场统一、没有变过)机械地把跟踪指数净值的被动/基准化资金拉向收盘,这是制度性的客户群效应;Heston-Korajczyk-Sadka
    自己的证据是这类钟表周期不被规模、beta 或指数成分解释、且每次能维持约 40 个交易日,是反复出现的微观结构规律而不是会被套利掉的短期错误定价。并且 5
    个控制(流动性、波动、20 日反转、成交额波动族、市值)里没有任何一个是“交易发生在哪个时刻”,三次残差去不掉这个方向的暴露。
