    把它当作“隔夜冲击被消化得多快”的互补维度,分别用 cross_ema 和 cross_mean 平滑;n9=cross_mean(|O|*DW(Ret),20)用隔夜冲击的大小给价格发现速度加权,只在跳空较大的日子上看“日内价格发现是更快还是更慢”,这是这一批与之前各轮都没有出现过的算子(day_autocorr、day_durbin_watson
    在本组历史任务里从未被用过)。(3) 注意力代理的新用法。div(day_first(Amt), day_sum(Amt))(开盘第一分钟成交额占全天的比例)第
    1 轮已经单独当过信号(分数不高,没有进入这批 heads);本位不再把它当独立信号,而是与隔夜冲击的大小交互(n10=cross_mean(开盘占比*|O|,20),问开盘涌入的注意力是不是集中在隔夜跳空更大的那些日子)或者直接与日内收益做相关(n11=cross_corr(开盘占比,I,20),问“开盘有多少注意力”这件事本身与“日内怎么走”是否存在稳定的跨日关系)——这是把第
    1 轮已经评估过的一个水平量,换成交互/相关的全新用法,外围与之前完全不同。为什么和库里已有的不一样:库里的两个 head 以及我们第 1 轮的全部种子,全部是对称的二次型(O*O、I*I
    或它们的比);没有任何一个用符号掩码、上行/下行能量分解,也没有任何一个用分钟级序列相关(day_autocorr / day_durbin_watson)或把开盘注意力与冲击大小交互。为什么样本外还会在:不对称隔夜效应背后的机制——损失厌恶、恐慌性情绪、散户主导、T+1
    与做空限制使负面消息只能在隔夜“发泄”、次日盘中才部分修正——是中国市场在样本期内没有变过的制度与投资者结构特征;买卖价差造成的分钟级自相关反映的是最小报价单位与做市商价差这类微观结构常数,同样是结构性的,不随某一段行情改变。
