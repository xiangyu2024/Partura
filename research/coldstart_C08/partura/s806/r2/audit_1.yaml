  reasons: 【库与门槛】快照里 3 个 head(loc.md):+1.35 `ts_quantile_q50(day_centroid(Amt), 20)`,以及本组自己第 1 轮 N 位产出的 +0.67 / +0.60(隔夜/日内二次型比值)。核心 day_centroid(Amt) 既是 +1.35 head 的子树,也是定位输出机械核心卡第 1 张(均值差 +1.77,p 0.000);与 5 个控制最大 |ρ| = 0.194(known),< 0.8,E 位核心门槛过。本核心是本实验第 1 次占 E 位(≤2 的限额未用满)。【确定性划掉,相关度表原始 |ρ|,与库禁令同一个量】种子 1 `cross_ema(day_centroid(Amt), 10)`:与 +1.35 head 原始 |ρ| = 0.88 ≥ 0.7,自动划掉。种子 2 `cross_ema(day_centroid(Amt), 40)`:原始 |ρ| = 0.758 ≥ 0.7,自动划掉。种子 8 `cross_mean(mul(day_centroid(Amt), day_std(Ret)), 20)`:与 vol 控制 |ρ| = 0.957 ≥ 0.8,自动划掉。种子 12 `cs_last_low10(cross_ema(day_centroid(Amt), 20), cross_valid_count(day_last(Close), 120))`:原始 |ρ| = 0.748 ≥ 0.7,自动划掉。【判断划掉:重复,§1 已知族不合格线】种子 7 `cross_mean(div(day_centroid(Amt), day_gini(Amt)), 20)`:与 known 控制 |ρ| = 0.571 ≥ 0.5(§1 的不合格线本身),与 liq 的 |ρ| = 0.666 也高;机制上 day_gini(Amt) 对不活跃票系统性更高(成交越零散集中度越高),除以它会把『什么时候交易』重新变成『活不活跃』的函数——这不是写法偶然,是构造本身把流动性重新引入了分子;即使 GP 后续变异,这个起点已经越过已知族不合格线,判重复划掉(参照 r1 对称情形:liq 0.63 / known 0.55 时已被判重复划掉,本处的 0.666 / 0.571 更高)。【创新度 4】PI 称外围刻意避开『窗口 {10,20,40} / 字段互换 Amt->Volume / head 本身』这三类,换成 cross_ema、tail_mean、stddev/madz、交互(除以 gini、乘 day_std(Ret))、共动(与振幅时点的 corr)以及 delta;但相关度表戳穿了这个论证的一半——『cross_ema 是新统计量家族』站不住:它对一个本身持久(sticky)的日度特征做平滑,数值上和被避开的 trailing median 几乎是同一件事(0.88 / 0.758),是 novelty=1 的『换个写法』,这正是种子 1、2 被划掉的原因,它们没有给这个位加分。真正站得住的新方向是:种子 9 `cross_corr(day_centroid(Amt), day_centroid(sub(High, Low)), 20)`——核心只出现在 corr 的一侧,问『交易发生的时点』与『振幅发生的时点』是否对齐,库和共性表里都没有任何子树问过这个,是干净的新轴;种子 3、4(tail_mean_q75/q25,|ρ| 0.686 / 0.661,仍 < 0.7)问的是条件尾均值而非典型水平,是不同的统计量;种子 5、6(stddev / madz,与 head 只有 0.20 / 0.09)问的是『时点偏好本身有多不稳定』而非水平,是真正新的维度;种子 10(delta,0.481)把『一贯习惯』和『最近迁移』分开,是 head 的高通滤波,也是新的;诊断种子 11(cs_bucket_rank 按 known 控制分桶,与 known 的 |ρ| 只有 0.01,证明分桶确实把 known 暴露去掉了)设计干净。12 颗里 4 颗(1、2、8、12)被确定性划掉、1 颗(7)因重复划掉,剩下的 7 颗里仍有三个互相独立、真正没被问过的新轴(尾部形状、时点稳定性、与振幅时点共动),够得上『真正新』,但批次本身对其中近一半种子的新颖性论证是错的,不给 5。【合理度 4,逐算子核对保留的 7 颗】`day_centroid`(ops_ext.py)是 |x| 的加权质心 / (T-1) 缩放到 [0,1],分母 `clamp(min=1e-30)`、全零日判空,有界安全。`day_gini` 同样对 `tot`、`n` 做了 clamp / 判空保护。`cross_tail_mean_q25/q75`(`_tail_mean`)要求 `n>=2` 且按分位定义选出的天数恒 >=1,没有除以近零量的风险。`cross_stddev` 是 `nanstd_last`,输入本身有界 [0,1],不会爆。`cross_madz` 有双重保护(`mad>0` 且 `n*2>=d` 才输出,否则 NaN):专门核对了它是否会像 r1 被划掉的 `cross_madz(day_max(Ret),60)` 一样踩『量化造成的近零 MAD』——结论是机制不同:day_max(Ret) 的病理是『同一个价格 tick 值在很多天上精确重复』(近零但非零的 MAD,偏离时给出 20-50 的 z);day_centroid 对应的极端场景(只在开盘一两分钟交易的票)是『用哪几分钟』对随机扰动敏感,制造的是噪声(抬高 MAD)而非假性恒定(压低 MAD),真正的全零 / 停牌日本身是 NaN 不参与窗口;相关度表上种子 6 与所有 head / 控制的 |ρ| 都 ≤ 0.11,没有被某类股票的数值伪影支配的迹象,保留。`cross_corr`(`rolling_pair_reduce`)由 Cauchy-Schwarz 保证 |corr|<=1(cov² <= var_x*var_y,EPS 只在两者都接近 0 时防 0/0,不会制造超界值),有界安全。`cross_delta` 是纯差值,输入 `cross_ema(day_centroid,20)` 有界 [0,1] 且 `cross_ema` 用 float64 分块求和、源码注释里明确处理过历史上的 float32 溢出 bug,安全。`cs_bucket_rank` 按 x 十分位分桶、桶内百分位排、用 1e-4*全局秩破并列,没有除零。没有前视(全部窗口算子都是 causal rolling),没有禁用算子(`ts_spearman` / `nt_*` 均未出现)。【如果有 alpha】最可能来自知情 / 非知情资金在日内选择交易时点这件事本身携带结构性信息(Admati-Pfleiderer 的时点聚集,Heston-Korajczyk-Sadka 的钟表周期),在去掉波动水平后体现为交易时点尾部形状的持续性、它与股票自身零散度的交互,以及与振幅发生时点是否对齐这个全新的协同轴。
