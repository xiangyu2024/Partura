    reasons: '【创新度 4】快照里 0 个 head,库是空的,所以只看与控制是否同一个东西:核心 ts_var(LogFloatShares, 10) 与 5 个控制的 |ρ| 全部 ≤ 0.05(liq 0.05 / vol 0.02 / rev 0.00 / known 0.04 / size 0.03);14 个种子与控制的最大 |ρ| 是 seed 6 对 rev 0.45,其余 ≤ 0.43,没有任何一个 ≥ 0.8,也没有 ≥ 0.5 的。「把近期流通股本发生变动(解禁、增发、送转)的名字移出多头书」这个维度,流动性、波动、20 日反转、成交额离散、市值都不度量它,是库里与控制里都没有的东西。扣分处:书的主体排序来自 y(sub(LogFloatShares, LogFloatCap) = −log 名义股价;5|10|20 对 60 日量比;股数换手率),这些是已知异象,核心只改动 5%–20% 的名字,所以给 4 不给 5。\n【合理度 3】(1)数学上干净,并且 PI 正确识别并修掉了一个 §4 伪影:LogFloatShares 是 float64 取 log 再转 float32,股数不变时逐日逐位相同;nanstd_last 先 nanmean 再求平方偏差,值约 20 的常数窗口均值舍入后偏一个 ulp(约 1.9e-6),平方约 3.6e-12,与 PI 报告的一致,裸核心确实按浮点位把股票分块(corr 表裸核心 distinct 0.049、门槛判废品)。is_gt 返回 int,mul(core, is_gt(core, 1e-8)) 让无事件名字精确为 0;sign(ts_delta(LogFloatShares, 10)) 对不变名字是 x−x = 0 精确为 0。核对 ops_ext._lexi:band 要求整块的 bl > lo,精确为 0 的大块(占九成以上)的 bl 接近 0,永远进不了 high band,band 就是事件名字,与 PI 描述一致;cs_first_low20 的 low band 只装负值块(股本减少)。所有种子 coverage 0.999、distinct 1.0、无前视(股数与成交量当天收盘前已知)、量比分母窗口包含分子窗口。没有可划的数学问题。\n(2)但算子组合只在一个方向上实现了假说:steer.reward 在 train 上对 sign ∈ {+1, −1} 取优。cs_last_high* 只在 sign = +1 时把事件名字挤出多头书;sign = −1 时这些名字整体排到多头书最前。cs_last_high10 的 band 至多 10%,正好一个十分位,而 ts_max(·, 40~60) 把事件记忆拉到约 50–70 天,事件名字很可能超过 10%,于是 sign = −1 时多头书几乎就是「最近两三个月流通股变动最大的那批」,与 Field & Hanka 的方向相反;seed 7 的 cs_last_high20 在 sign = −1 时整本书都是事件名字。A 股的异常放量与高换手通常是低者为多(sign = −1),所以量比 / 换手类 y 的 9 个种子(3, 4, 5, 6, 7, 9, 11, 13, 14)很可能在做假说的反面;只有 −log 名义价那 5 个(1, 2, 8, 10, 12)方向不确定。\n(3)var 随 (Δlog 股数)² 增长,股数又未按拆股调整,所以送转(10 送 10 = log 2)与大额首发解禁一起排在 band 最上面;送转不改变持有人结构,不是供给冲击。Pontiff & Woodgate 的股本扩张用的是拆股调整后的股数,sub(LogFloatShares, cross_ema(LogFloatShares, 241))(seed 8)混进了送转,也把解禁这种重分类当成发行。\n(4)E 位钉住的是裸核心,阈值 is_gt(·, 1e-8) 在外围,GP 变异可能把它丢掉,让舍入伪影在 cs_rank / mul 之类位置复活(放在 cs_last_* 的 x 位时影响小,因为残差块的 bl 远低于 band)。\n(5)seed 10 与 seed 1、seed 14 与 seed 3 只在极少数股本减少的名字上不同,5 个控制相关逐位相同,近乎重复;外围算子集合不同、给 GP 提供了 sign∘ts_delta 这块积木,不划。\n【如果它有 alpha,最可能来自】主要来自 y 本身(低名义价、异常放量、高换手背后的散户彩票偏好与注意力高估);在奖励选 sign = +1 时,核心另外贡献一小块增量:把解禁、增发后几周持续出货的名字移出多头书。\n【建议(不影响通过)】给预期低者为多的 y 换成反向写法,让任何方向下事件名字都在多头书外:例如 cs_last_high10(neg(div(cross_mean(day_sum(Volume), 5), cross_mean(day_sum(Volume), 60))), core′) 或 sub(LogFloatShares, log(cross_mean(day_sum(Volume), 20))) 作 y;或者对这些 y 改用 cs_first_high20(y, core′),让事件名字在 sign = −1 时落到最下面。−log 名义价两个方向各放一半。'
