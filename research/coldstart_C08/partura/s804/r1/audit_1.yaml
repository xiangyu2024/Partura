    reasons: '【创新度 4】库是空的;14 个种子与控制的最大 |ρ| 是 seed 4(|G| 的 20 日均值)对 vol 0.61、seed 5(mean G − mean I)对 rev 0.53,其余 ≤ 0.38,都 < 0.8,不自动划。隔夜(昨收→今开)与日内的拆分是 M 第 1 批共性表里 12 个子树都没有碰到的维度(全是 day_pos_ratio、day_gini 之类日内统计或日频叶子);5 个控制里,20 日反转约等于 G 与 I 之和,波动是日内分钟收益的标准差,不含隔夜段,本位用的是 G 本身、G − I、cross_corr(G, I)、隔夜份额和开盘分钟成交份额 F,这些都不是控制的另一种写法。seed 4 是隔夜波动,与 vol 0.61,对 vol 取三次多项式残差后剩下的是「隔夜波动超出日内波动的部分」,与 seed 10 同义;seed 5 在代数上 = 2·mean(G) − ret20/20,对 rev 取残差后约等于 seed 1。两者都是中度相关,不是同一个东西,不划。文献里这个异象是已知的,但在本库与控制里是新的,所以给 4 不给 5。\n【合理度 4】逐个算子核对:day_first(Open) / day_last(Close) 取当天第一 / 最后一个有效分钟;ts_delay 是 nd 算子,在 (D, S) 面板上沿交易日滞后一天,所以 G = log(今开 / 昨收)、I = log(今收 / 今开),都在当天收盘前已知,无前视。log 实现是 log|x|,|x| ≤ 1e-9 时给 NaN,所以 seed 10 在 std = 0 时(例如新股一字板 I ≡ 0)给 NaN 不给 inf,PI 的说明属实。cross_corr 是总体协方差 / (sqrt(vx·vy) + 1e-9),有界于 [−1, 1],I ≡ 0 时给 0,不会爆。seed 11 与 F 都是分母包含分子的份额,有界于 [0, 1]。corr 表 coverage 0.997–0.999、distinct ≥ 0.999。小问题,不构成数学问题:cross_corr 没有最少样本数,复牌或新上市只有 2–3 个有效日时给 ±1 的噪声,只涉及少数名字、不支配截面;F 的含义取决于首根分钟是否含集合竞价成交的数据约定,G 不受影响;seed 1/2/3 是同一个量换窗口,seed 7/8 也是。\n【如果它有 alpha,最可能来自】T+1 下以散户为主的注意力需求在开盘集合竞价集中买入受关注的股票,把隔夜价格抬高,日内连续交易者再纠正回来;评分标签从 T+1 开盘后的 VWAP 起算,正好落在「日内纠正」那一段。所以过去隔夜强、日内弱(G − I 高、corr(G, I) 负)的名字之后跑输(Lou-Polk-Skouras 的拉锯,Aboody 等的隔夜情绪反转,Qiao-Dam 的 T+1 隔夜之谜)。方向由奖励在 train 上选,本位每个种子都是单一连续量,没有 slot a 那种方向依赖。'
    revise: '—'
