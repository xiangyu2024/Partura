  - type: N
    hypothesis: '【新 idea:隔夜与日内的拉锯(T+1 下的开盘集合竞价需求)】A 股是 T+1:开盘买入的人当天不能卖。隔夜积累的订单在 9:15–9:25 的集合竞价里一次性撮合,这部分需求以注意力驱动的散户为主;日内连续交易的需求方结构不同。所以一只股票的价格在「隔夜」与「日内」两段里由两类人定:隔夜段反映注意力与情绪,日内段反映连续交易者的纠正。持续靠隔夜跳高、又在日内被吐回的股票是被注意力需求抬高的,之后跑输;隔夜段解释了价格变动的多大份额,是这只股票价格被「竞价情绪」主导的程度(Berkman et al. 2012:受关注的股票在开盘被个人投资者买高、日内回落;Aboody et al. 2018:隔夜收益是个股情绪的度量,之后反转;Lou, Polk & Skouras 2019:隔夜与日内两类客户的拉锯;Qiao & Dam 2020:T+1 规则使中国股票的隔夜收益系统性偏离)。【算子怎么实现】隔夜对数收益 G = log(div(day_first(Open), ts_delay(day_last(Close), 1))),日内对数收益 I = log(div(day_last(Close), day_first(Open)));开盘第一分钟(含集合竞价成交)占全天成交额的份额 F = div(day_first(Amt), day_sum(Amt)) 度量竞价参与强度。种子在 20/60 日窗口上取:G 的均值与 EMA(隔夜情绪的累积)、|G| 的均值(竞价带来的信息/注意力冲击)、G 均值减 I 均值(拉锯的价差)、cross_corr(G, I)(日内是否系统性回补隔夜跳空)、mean(sign(G)×I)(带方向的回补幅度)、log(std G) − log(std I)(价格波动有多少来自隔夜)、|G|/(|G|+|I|) 的均值(隔夜占的绝对位移份额)、F 的均值、G×F 的均值(以竞价参与加权的跳空)、cross_corr(G, F)(跳空是否伴随竞价放量)。【为什么和库里已有的不同】库里还没有 head;M 第 1 批的共性表 12 个子树全部是日内统计量或日频叶子,没有一个跨越「昨收—今开」这条边界。5 个控制里,20 日反转是收盘到收盘的总收益(= G 与 I 之和),本位的种子是 G 与 I 的差、比、相关和份额,G 与 I 以相反或正交的权重进入;波动控制是日内分钟收益的标准差,不含隔夜段;流动性与成交额离散控制的是成交额水平,F 是无量纲的时间分布份额。【为什么样本外还在】T+1 与开盘集合竞价是制度性的,样本期内外都不变;散户在 A 股成交中的占比长期很高;机制是不同客户在不同时段定价,不是某段行情里挖出来的形状。评分标签从 T+1 开盘后的 VWAP 起算,正好落在「日内纠正」那一段。【数学说明】全部输入在当天收盘前已知,无前视;后复权价格使除权日不产生假跳空;唯一的除法是 F(分母包含分子,只可能 0/0 = NaN)和 |G|/(|G|+|I|)(同理),标准差比写成两个 log 之差(标准差为 0 时 log 给 NaN 而不是 inf);cross_corr 的分母自带 EPS。在合成立方体上实测 14 个种子 coverage 0.98–0.99、distinct = 1、无 inf。'
    inspired_by: 'M 第 1 批:共性表里反复出现的子树都是日内统计量(day_pos_ratio(Open)、day_gini(High))或日频叶子,没有任何子树跨越昨收到今开的隔夜边界;文献:Berkman et al. 2012、Lou, Polk & Skouras 2019、Qiao & Dam 2020'
