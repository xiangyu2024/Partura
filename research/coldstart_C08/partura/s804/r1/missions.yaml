    hypothesis: '【alpha 来源】流通股数(LogFloatShares)只在股本事件日跳变:限售股解禁(IPO/定增锁定期满)、送转股除权、可转债转股、回购注销。核心 = 过去 10 个交易日流通股数对数的方差,大于 0 即「最近 10 天新增(或减少)了可交易的供给」。解禁与增发把一批成本极低的新卖家放进流通盘,他们在之后几周持续出货,价格在事件后几周承压(Field & Hanka 2001:解禁日前后显著负超额收益、成交量放大约 40%;Pontiff & Woodgate 2008:股本扩张后横截面收益更低)。这是一个供给冲击,与 5 个控制(流动性水平、波动、20 日反转、成交额离散、市值)都不是同一个东西:市值控制的是股数×价格的水平,不是股数的变化。【这次的外围处理,三件事】(1)重要性阈值 mul(core, is_gt(core, 1e-8)):我在引擎上实测,股数不变的 10 日窗口在 float32 下并不精确为 0,约一半股票得到 3.6e-12 的舍入残差,所以裸核心实际上是按浮点位把股票分成两半(数值伪影);1e-8 比残差高约 2700 倍,又低于最小的有经济意义的事件(窗口边缘约 0.03% 的流通股变化),阈值之后无事件的名字精确为 0、有事件的名字保留事件大小。带符号的写法 mul(core, sign(ts_delta(LogFloatShares, 10))) 对不变的名字同样精确为 0(x-x=0),并把扩张(正)与回购注销(负)分开。(2)把它放在 cs_last_high05/10/20 的筛位(x 位):这些算子按「整块并列」取 band,精确为 0 的大块永远进不了 band,于是 band 恰好是事件最大的那批名字,它们被压到多头书之外,其余名字按 y 排序;cs_first_low20 再把回购注销(负值块)放到最前。用 ts_max(·, 20~60)/ts_mean(·, 30) 把「最近 10 天有事件」延长成「最近一到三个月有事件」,对应解禁后持续数周的卖压。(3)y 位放与供给/持有人结构相关的慢变量:−log 名义股价 sub(LogFloatShares, LogFloatCap)、以股数计的异常成交量 div(cross_mean(day_sum(Volume), 5|10|20), cross_mean(day_sum(Volume), 60))、以股数计的换手率 sub(log(cross_mean(day_sum(Volume), 20)), LogFloatShares);并叠第二道筛:一年流通股扩张 sub(LogFloatShares, cross_ema(LogFloatShares, 241)) 与待解禁存量 sub(LogTotalCap, LogFloatCap) 的最高 10%/20%。以股数计的 y 在送转除权后会机械跳变(10 送 10 后成交量按股数翻倍、名义股价减半),核心的事件筛正好把这段被股本变动污染的窗口拿掉,这是核心和外围之间的具体分工。【和以前的不同】快照里含这个核心的候选只有 5 个,用的是裸核心(未阈值化,因此是舍入残差主导);本位每个种子都用阈值化或带符号的核心,并且都放在整块筛位上,外围算子集合(is_gt 阈值、sign∘ts_delta、cs_last_*/cs_first_low20、ts_max/ts_mean 记忆窗)与快照里见过的写法不同。【给审计的数学说明】核心单独当根会被门槛判为废品(绝大多数格子精确为 0,distinct 很低),这是并列块而不是缺陷;本位所有种子的输出都是 y 的序数秩加筛位移,distinct = 1,在合成立方体上实测 coverage 0.99、无 inf。没有前视:LogFloatShares 与成交量都是当天收盘前已知。没有除以近零:成交量比的分母窗口包含分子窗口,只可能是 0/0 = NaN。【为什么样本外还在】解禁、定增锁定期、送转是监管制度规定的、每年反复出现的事件;机制是「低成本持有人获得卖出权后出货」,不依赖某段行情;而股本变动对股数计量的机械污染是会计恒等式,永远成立。'
