    authors: Chris Adcock; C. Ye; S. Yin; Dalu Zhang
    year: '2019'
    url: https://ideas.repec.org/a/taf/tjorxx/v70y2019i10p1709-1719.html
    treatment: 2004–2018 年沪深 A 股样本,涨停后延迟价格发现在两市场都不能被拒绝;借用为:延续机制在中国 A 股、长样本期上的直接证据
