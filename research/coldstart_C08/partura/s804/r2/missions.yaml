  core: sub(ts_var(ts_mean(day_distinct_ratio(Vwap), 20), 10), LogFloatCap)
  hypothesis: '【核心】`sub(ts_var(ts_mean(day_distinct_ratio(Vwap), 20), 10), LogFloatCap)`——本轮定位共性表排名第一的子树(均值差 +2.24,p 0.000,374 个已评分候选里 6 个含它),同时是 head a(score +1.33)自身分解出的必要性最高的部件:loc.md 的 knockout 测试把 head a 的 y 位从「sub(ts_var(ts_mean(day_distinct_ratio(Vwap),20),10), LogFloatCap)」降级成裸的「ts_var(ts_mean(day_distinct_ratio(Vwap),20),10)」(去掉 −LogFloatCap 这一步),score 从 +1.33 掉到 +0.50,必要性 +0.83——是整条 head 里必要性最大的一步,比核心①ts_var(LogFloatShares,10)自己在round1的任何一次knockout都更集中。

    【机制】day_distinct_ratio(Vwap) = 当天分钟 VWAP「不同取值数/分钟数」:0 代表整天一个价(停牌、一字板封死),1 代表每分钟都变。Harris (1991) 证明价格离散度/聚集随价位和波动升高、随市值和成交频率降低——这正是公式里 −LogFloatCap 在做的事:把 day_distinct_ratio 里纯粹因为「公司规模大小」带来的那部分剪掉,剩下的是「这只股票最近价格发现变粗/变细得有多剧烈,扣掉它本来的规模水平」。ts_mean(·,20) 把日度比率平滑成「最近一个月的正常颗粒度」,ts_var(·,10) 再测这把尺子在最近 10 天里有没有突然跳动——这是一个二阶量(「安静程度」本身有没有变),不是一阶的「安静不安静」。候选触发源之一:涨跌停封板当天分钟成交冻结,distinct_ratio 骤降,Seasholes & Wu (2007) 发现上海涨停当天放量、是强烈的注意力事件,带来之后一两天可预测的净买入;另一个可能触发源是换手结构的突然切换(不只是封板)。两类事件都会让「颗粒度」在短窗口内跳变,之后几天价格继续吸收或回吐,这是本位想抓的东西。

    【外围怎么实现,和已见过的不同】库里含这个子树的 6 个候选(本轮共性表)清一色是 round1 head a 自己那套写法:两层 cs_last_high*(10%、20%)+ float-shares-var 的 ts_max(·,60) 筛 + free-float 缺口 sub(LogTotalCap,LogFloatCap) 当第二层筛,而且两层筛都是单一方向的 cs_last_high*。本位全部种子换一套筛变量——ListAge(上市以来交易日数,整个种子迄今没人用过)、cross_mean(day_zero_ratio(Ret),20)(零收益频率,round1 文献员已经给Lesmond-Ogden-Trzcinka 1999 的 LOT 度量背书,但从没真正当种子用过)、cross_valid_count(day_last(Close),60)(近期有效交易天数,抓停牌倾向)——并且对每个筛变量都配一对 cs_last_high*/cs_first_high* 与 cs_last_low*/cs_first_low* 镜像种子:直接吸收 round1 审计对位 a 的意见(cs_last_high* 只在 reward 选 sign=+1 时才把筛中的名字排出多头书,sign=−1 时反而排进去,round1 的量比/换手类 y 很可能撞上这条),本位不赌单一方向,让初始种群本身就覆盖两种极性,哪一种在 train 上一致由 reward 自己选。另外两个种子把核心重新在 Close 场上算一遍(ts_var(ts_mean(day_distinct_ratio(Close), 20), 10)),与 Vwap 版本相减或联合筛选,检验效应不是 Vwap 这一个字段的偶然伪影,而是「价格离散度」这个统计量本身的效应;还有一个种子把核心本身再做一次 ts_mean(·,10) 平滑,检验抓的是「最近持续不稳定」还是「单日跳变」。

    【为什么和控制不是一回事】5 个控制里,流动性看成交额水平、波动看分钟收益标准差、20 日反转看收益累计、已知族看成交额的 30 日标准差、市值直接是对数市值——没有一个度量「价格离散度这把尺子本身最近有没有突然变过」,这是关于「测量工具的稳定性」的二阶统计量,控制组全是一阶水平量。

    【为什么样本外还会在】涨跌停制度、集合竞价规则、以及价格发现在停牌/封板时被机械打断,都是监管结构性事实,训练段和验证段都适用,不依赖某一段行情;Harris (1991) 的离散度-市值关系是跨市场、跨时期稳健的横截面规律。

    【给审计的数学说明】核心单独当 y 时(loc.md 的 sufficiency 测试)score −5.07:这个二阶量裸分布很脏(多数股票常年「正常」,只有少数时段跳变,长尾),不能直接当 y,必须配合筛位——这是 loc.md 自己给出的证据,不是臆测,也解释了为什么本位种子全部走「筛」而不是「裸排」。全部种子只用 sub / ts_var / ts_mean / day_distinct_ratio / cs_last_high05|10|20 / cs_last_low05|10|20 / cs_first_high20 / cs_first_low20 / cross_valid_count / cross_mean / day_zero_ratio / day_last 和已经验证过 coverage/distinct 正常的算子,没有新的除以近零分母,没有 ts_spearman / nt_*。'
