- type: N
  hypothesis: '【新 idea:涨跌停边界的「贴版强度」】A 股主板日内涨跌幅限制 ±10%(北交所 ±30%,科创板、2020-08-24 后创业板 ±20%)是一条会机械打断当天价格发现的边界条件。两条互补、方向相容的机制通道:(1) 封板本身是最直接的注意力事件——Seasholes & Wu (2007) 在上海市场发现涨停当天伴随放量和新闻曝光,个人投资者在之后一两天集中买入该股,带来可预测的次日买压;(2) 价格发现被制度性推迟——Kim & Rhee (1997,东京)、Wong, Liu & Zeng (2009,上海逐笔数据)、Adcock, Ye, Yin & Zhang (2019,沪深 A 股 2004–2018 年截断 GARCH) 都发现涨停后价格发现延迟、信息要往后几天才能完全吸收,是「继续朝同一方向走」的延续效应;Wong 等同时发现跌停端的模式不同——跌停后出现反转而不是延续,与缩量、价差走阔同时出现,更像恐慌出清后的回补。两条通道预测的方向相容:最近贴过涨停板(延续)和最近贴过跌停板(反转回补)都预期之后偏正收益,不是互相抵消的两件事。

    【算子怎么实现】日收益 ret = log(day_last(Close)/ts_delay(day_last(Close),1))(与 round1 N 位 G 的写法一致,当天收盘前已知);用该股当天自己的涨跌停带宽 LimitWidth(主板 0.10、科创板/注册制后创业板 0.20、北交所 0.30 的日频叶子字段,本种子迄今所有任务没人用过)归一成 rtl = |ret|/LimitWidth——一个跨板块可比的「今天用掉了自己允许摆动空间的几成」,带符号版本 sgn_rtl = sign(ret)×rtl(+1 贴涨停,−1 贴跌停)。在 20/60 日窗口上取:rtl 的均值(不分方向的「最近多常贴边」)、sgn_rtl 的均值(带方向的净贴边压力)、用 is_gt(sgn_rtl,0.85)/is_lt(sgn_rtl,−0.85) 做出逐日涨停/跌停哑变量后取窗口均值(频率)、取窗口最大值(「最近有没有至少贴过一次」)、sgn_rtl 的窗口标准差(贴边方向本身的动荡程度)。另外两个种子用不依赖 LimitWidth 的算子做交叉验证:day_flat_run_max(Close)——算子文档本身写的就是「封在涨跌停一整天」的直接度量;cross_corr(rtl, 相对成交额)——检验贴边是放量造成的还是缩量硬跳,因为 LimitWidth 对 ST 股(真实限幅 5%)不单独打标、仍按主板 0.10 处理,贴边比例在 ST 股上会被稀释,minute 级的「冻结」算子不依赖这个字段,可以互相印证。

    【为什么和库里已有的不同】LimitWidth 这个日频叶子字段,整个种子迄今没有任何 head、核心卡或共性表条目用过;5 个控制里,波动是分钟收益标准差(不区分是不是贴着监管边界),20 日反转是收益累计水平,都不是「今天的移动相对自己监管允许空间的占比」这个无量纲比率;本位和本轮位 a(day_distinct_ratio 核心)关心的是同一类边界现象的两种独立测法——位 a 是「价格发现变粗这件事本身」的间接代理(分钟级纹理),本位是用监管公开的带宽字段直接量出「贴边强度」,两者算子、字段几乎不重叠(一个不碰 LimitWidth,一个几乎全靠它),相关度表会给出两者到底有多独立。

    【为什么样本外还会在】涨跌停幅度是交易所规则写进制度的,训练段和验证段都适用,不随某一段行情变化;个人投资者是 A 股成交的长期主力,注意力驱动的开盘/封板买入行为是结构性的,不是某个牛熊阶段的特例。

    【数学说明】LimitWidth 恒为正(0.10/0.20/0.30),rtl 的分母不会在零附近,没有除以近零的问题;ret 在停牌或缺分钟数据的日子上是 NaN,照常传播、不产生 inf;sgn_rtl 的值域理论上接近 [−1,1](对数收益和算术限幅有一点近似误差,偶尔略超出 1,是刻度不完全对齐,不是伪影,不影响横截面排序);is_gt/is_lt 的阈值 0.85 是归一化之后的固定常数,不是对原始收益开的任意刀;没有用到 2023-08-08 之后的任何数字,没有前视(LimitWidth、Close 都在当天收盘前确定)。'
