  - type: E
    core: day_kurt(Ret)
    hypothesis: |-
      【核心】`day_kurt(Ret)`——本轮核心卡第12名(均值差+0.95,p 0.000,530个已评分候选里19个含它),逐字取自定位输出的共性表/核心卡列表,合法。这是分钟收益Ret在单日内的超额峰度(第4阶标准矩减3,源码`_kurt`:`mean((x-mean)^4) / mean(var)^2 - 3`),衡量“今天的分钟收益分布有多肥尾”——少数分钟出现远超常态的跳动、其余分钟波澜不惊,峰度就高;分布接近正态,峰度接近0。这个核心没有在任何已有head、任何控制里出现过,也不是任何已有head的子树。

      【机制与文献】A股个人投资者占比长期很高,且多数股票事实上难以卖空(融券门槛高、标的有限)。Chen, Ding & Zhao (2019-10,《Applied Economics》)用高频数据在中国股市构造“已实现峰度”,报告一个“已实现峰度之谜”:简单的风险补偿理论预测高峰度(肥尾)股票未来收益应该更高(投资者厌恶尾部风险,要求补偿),但中国市场高频数据的结果恰好相反——高峰度股票之后跑输;作者用双重排序和横截面回归证明散户的彩票偏好是关键机制:效应在散户持股比例更高、不可卖空的股票上更强,在彩票偏好强的时期更显著。这与round1文献员已给审计背书的Bali-Cakici-Whitelaw MAX效应、Birru & Wang名义股价幻觉是同一条“散户追逐近期异常走势,之后均值回归式跑输”的机制家族,但测的是分布形状(肥尾),不是单日最大收益或股价水平,是独立的维度。方法论上借用Amaya, Christoffersen, Jacobs & Vasquez (2015,《Journal of Financial Economics》)用日内高频数据构造已实现偏度/峰度、再检验下一期横截面收益的框架——他们在周频上聚合日度已实现矩,本位把同一思路下沉到日频再做窗口化,比他们的颗粒度更细。

      【为什么和控制不是一回事】5个控制里,波动控制是`cross_mean(day_std(Ret), 20)`——分钟收益的二阶矩(标准差)。峰度是标准化的四阶矩,两只股票可以有完全相同的方差、却有截然不同的尾部形状(一个连续温和波动,一个绝大多数时间纹丝不动、偶尔一笔巨震)。残差口径已经扣掉对波动秩及其平方、三次方的线性/U形/S形暴露,峰度作为四阶形状统计量不是波动的单调函数,独立信息大概率留存。20日反转是收益水平的累计,已知族是成交额离散度,市值是对数市值——都不度量“分钟收益分布的形状”。

      【外围怎么实现,和已见过的不同】530个候选里含这个核心的19个,共性表能反推出的写法、以及c08s804Pr2a_I0_open_search(round2位a审计失败后转的普通GP,初始种群继承了这个核心)实际跑出的最优结果,全部是单日取值上的纯截面重整:`sigmoid`/`sigmoid(sigmoid(·))`包装,或`cs_mask_top_replace_mean_neg`截尾,没有一个做过跨日的时间窗口聚合。本位全部种子改用nd,ts族算子(`ts_mean`/`ts_max`/`ts_stddev`/`ts_rank`)在5–60日窗口上聚合day_kurt(Ret),把“单日峰度”这个噪声不小的统计量(基于约240个分钟收益估计的四阶矩,单日估计误差大,一次孤立的极端新闻事件就能把当天峰度推得很高)变成“最近持续的肥尾程度”或“肥尾程度本身有没有变得不稳定”——后者(`ts_stddev(ts_mean(day_kurt(Ret), 5), 20)`)是本轮第2轮笔记更新里“二阶量比一阶量更可能有alpha”这条结论的直接延伸:把同一个“测一测这把尺子本身是否在变”的逻辑用在一个全新核心上做复验,而不是只在day_distinct_ratio这一个核心上反复挖。另外用`sub(day_kurt(Ret), mul(day_skew(Ret), day_skew(Ret)))`粗略剔除偏度对峰度的机械贡献(Pearson不等式:超额峰度≥偏度²−2,分布越偏,峰度越容易被动抬高),把“两侧对称的肥尾”和“单侧被偏度带起来的肥尾”分开,这个组合也没人试过。两个筛选位种子(ListAge、cross_valid_count)排除新股/频繁停牌名字——它们单日分钟收益样本量小或结构异常,四阶矩估计本身不稳,这是在清理估计噪声,不是在挑数据。LimitWidth筛选位种子检验效应是否集中在某类涨跌幅带宽的板块。

      【一个要坦白说明的交叉混淆,不影响合理度】封板当天如果先冻结后打开,分钟收益会呈现“绝大多数分钟≈0、少数分钟跳变”的形态,这本身也会机械推高当天峰度——round2位b(LimitWidth贴版强度)测的部分现象可能和这里有重叠。但这不是§4里的数学问题(没有一条覆盖“两个机制可能部分重叠”),而是需要样本外证据才能分清的经验问题;即使重叠,两条渠道(连续跳跃/尾部风险的彩票偏好定价,以及涨跌停贴版的注意力效应)预测的方向是一致的,不是互相矛盾、必须二选一才能解释清楚的情况。

      【为什么样本外还会在】A股个人投资者长期占比高、融券门槛高、T+1使得冲高当天无法立即卖出,这些是贯穿训练段和验证段的制度性事实,不是某段行情的特例;Chen, Ding & Zhao的“已实现峰度之谜”样本跨越多年中国市场数据,并显式与散户持股比例、卖空约束这些结构性变量挂钩,不是某一年行情特有的形状。

      【数学说明】day_kurt(Ret)是已经在引擎里大量跑过的既有算子(coverage/distinct在已归档的530个候选里正常,round2转成普通GP后又独立跑了几十次,没有被引擎的数值哨兵拒绝过)。`_kurt`内部的除法在整天分钟收益方差精确为0时(停牌/一字板全天冻结)给NaN而不是inf(分子mean(x^4)此时同样精确为0,0/0=NaN),NaN按coverage门槛正常过滤,不会以爆炸数值支配截面;而且score和审计的相关度表都是先转横截面秩再比较,单只股票的数值大小本身不影响排序意义上的信息。没有前视:Ret在当天收盘前已知。ts_mean/ts_max/ts_stddev/ts_rank都是项目里已反复验证的nd,ts滚动算子;ListAge、cross_valid_count、LimitWidth都是前两轮已验证过coverage/distinct正常的筛选变量。
