    hypothesis: |-
      【核心,与上一轮的关系】`ts_var(ts_mean(day_distinct_ratio(Vwap), 20), 10)`——本轮共性表第2名(均值差+1.40,p 0.000,530个已评分候选里13个含它),逐字取自核心卡列表,合法。它是上一轮(第2轮)位a核心`sub(ts_var(ts_mean(day_distinct_ratio(Vwap), 20), 10), LogFloatCap)`去掉外层“减LogFloatCap”之后剩下的部分。上一轮这个位被判创新度1、合理度1,退回重写:审计算出的corr表显示那个核心与市值控制LogFloatCap的原始秩|ρ|=1.00——不是接近1,是完全重合,原因是把一个几乎处处为0、只在罕见长尾时刻跳动的二阶量,和一个连续展布好几个量级的市值变量直接相减,输出的排序几乎完全听市值的,等于市值控制换了个写法混进了y位。审计给出的两条修复路径,第一条是“不要让LogFloatCap直接参与y位的相减——把它挪到筛选位(x position)”。本轮严格按这条路径重做:核心保持“纯粒度不稳定性”的原始形式,y位完全不再和LogFloatCap做任何算术组合;本位种子里如果要用到市值或自由流通信息,只通过cs_last_high*/cs_first_*的筛选位(x位)接入——那是按分块归属(tie block)排除的排序操作,不是数值运算,不会出现量级压制的问题。

      【机制】day_distinct_ratio(Vwap)是当天分钟VWAP“不同取值数/有效分钟数”的比值:数值越低说明价格发现越粗(停牌、封板、或低价股在最小价格变动单位上的天然粗糙)。ts_mean(·,20)把这个日度比率平滑成“最近一个月的正常颗粒度水平”,ts_var(·,10)再测这把尺子本身在最近10天里有没有突然跳动——这是一个二阶量(“安静程度”有没有变),不是一阶的“安静不安静”。两个候选触发源:(1)涨跌停封板当天分钟成交冻结,distinct_ratio骤降,Seasholes & Wu (2007)发现上海涨停当天放量、是强烈的注意力事件,带来之后一两天可预测的净买入;(2)Harris (1991)证明价格离散度随价位和波动升高、随市值和成交频率降低,所以颗粒度的“正常水平”本身随规模变化——但本位测的不是水平,是水平的不稳定性,和规模是两件不同的事:一只大盘股的颗粒度常年很高很稳定,ts_var依然很小;只有颗粒度真的发生过跳变,ts_var才会大。

      【外围怎么实现,和已见过的不同】共性表里含这个子树的13个候选,文本拿不到,但可以反推至少6个就是上一轮那个失败核心(多了一层“减LogFloatCap”)的严格超集,其余写法未知。本位种子全部不做算术减LogFloatCap:用cs_last_high10/20、cs_last_low10/20、cs_first_high20、cs_first_low20做筛选位,筛选变量覆盖四类——ListAge(上市年龄,排除新股颗粒度本身噪声大的名字)、cross_valid_count(近期有效交易天数,排除频繁停牌名字)、LogFloatCap与sub(LogTotalCap, LogFloatCap)(市值与自由流通缺口,按审计的建议放在筛选位而非算术位)、cross_mean(day_zero_ratio(Ret), 20)(零收益频率,round1文献员已给Lesmond-Ogden-Trzcinka 1999背书)、LimitWidth(涨跌幅带宽,检验效应是否集中在某类监管板块的价格网格上)。另外两个种子做交叉验证:换到Close字段重新算一遍再相减,检验效应是不是Vwap成交量加权特有、还是颗粒度这个统计量本身的效应;以及在核心外再加一层ts_mean(·,5)短窗平滑,检验抓的是“单日跳变”还是“最近持续不稳定”。

      【为什么和控制不是一回事】5个控制里,流动性看成交额水平、波动看分钟收益标准差、20日反转看收益累计水平、已知族看成交额的30日标准差、市值直接是对数市值——没有一个度量“颗粒度这把尺子本身最近有没有突然变过”。本轮种子把市值/自由流通信息严格限制在排序安全的筛选位,不参与任何数值运算,核心本身与市值的关系只能通过筛选体现,不会再出现上一轮|ρ|=1.00那种算术支配。

      【为什么样本外还会在】涨跌停制度、集合竞价规则、以及价格发现在停牌/封板时被机械打断,都是监管结构性事实,训练段和验证段都适用,不依赖某一段行情;Harris (1991)的离散度-市值-价位关系是跨市场、跨时期稳健的横截面规律。

      【给审计的数学说明】核心不含任何新的除法;day_distinct_ratio、ts_mean、ts_var都是项目里已经大量使用、coverage/distinct正常的算子(round1/round2的corr表已反复验证)。核心裸排是废品(loc.md对近亲核心的sufficiency测试给出-5.07,这是并列块分布导致,不是前视/数值伪影/定义坏掉,§4明确这类“嵌套深、裸排差”不是问题),所以本位所有种子都配了筛选位或额外时间平滑,没有裸排种子。cs_last_*/cs_first_*的筛选位用整块(tie block)逻辑按分块归属排除,不受核心本身数值尺度影响,不会重演上一轮的问题。没有前视:Vwap、Close在当天收盘前已知;没有除以近零的新分母。
