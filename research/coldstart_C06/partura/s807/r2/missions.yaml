  hypothesis: 日收益拆成两段,看一只股票的收益长期「在哪一段发生」。隔夜段 ON = log(今开/昨收) = log(div(day_first(Open), ts_delay(day_last(Close), 1)))(day_first(Open) 是 09:30 集合竞价 bar 的开盘价;价格字段是后复权的,跨除权日连续),日内段 ID = log(今收/今开) = log(div(day_last(Close),
    day_first(Open))),两段之和就是当日对数总收益。机制:两段由不同的人定价 —— 隔夜段是开盘集合竞价里积累了一夜的订单(散户、注意力驱动的买单集中在开盘;A 股 T+1 下开盘买入者当天不能卖,隔夜段还要补偿这个持有约束),日内段是连续竞价里套利者与机构的交易。收益长期偏在哪一段,刻画的是这只股票的投资者结构(clientele),是持续数月到数年的公司特征:Lou–Polk–Skouras
    2019 发现两段各自的持续性能延续数年、跨段反转;Berkman 等 2012 与 Akbas 等 2022 发现「隔夜被推高、日内被套利者打回」的模式预测后续收益;A 股上 T+1 让两段之间出现强反转(白颢睿等 2020),中国的异象更多在隔夜段赚钱(Lin–Chang–Chou 2023)。算子实现:(1) 两腿之差 sub(cross_mean(ON, d), cross_mean(ID,
    d)),d = 20/60/120/241 —— 奖励的 20 日反转控制就是总收益 ON+ID,取差在构造上把总收益那一维拿掉,只留下「归属」;(2) 单腿 cross_mean(ON, 60/241) 与 cross_mean(ID, 120),窗口都长于反转控制的 20 日;(3) 无量纲版:差 ÷ (mean|ON| + mean|ID|),把波动尺度除掉,不让它变成波动的非线性函数(陷阱
    3);(4) cs_regres(mean ON, mean ID):隔夜段里不能被日内段线性解释的部分;(5) 跨段反转强度:cross_corr(ON, ID, 60/120) 与 cross_regbeta(ON, ID, 60)(当天日内对开盘跳空的回补斜率)—— 这是 Akbas 等「隔夜涨、日内跌」频率的连续版本;不用计数版,因为 20/60 日的计数只有 21/61 个取值,过不了
    distinct ≥ 0.5 的门槛,也不用 is_gt0 / sign 这类平凡布尔。方向:文献两边都有,不预设,由奖励在 train 上定;先验是 ON − ID 取 −1(开盘注意力推高、日内被打回的股票后续回吐),跨段相关越负(日内回补越彻底)后续越好。为什么和库里不同:库里 8 个 head 全是日内分钟收益的二阶量(W = Σr|r|/Σ|r| 的凸化;day_durbin_watson(High)
    实为日内已实现方差及其凸化;它的 60 日标准差)或股本规模;本位第一次用 Open 字段和跨日(昨收→今开)结构,测的是一阶收益在时钟上的归属,不是幅度,预计与所有 head 的日度秩 |ρ| < 0.3;与 5 个控制 < 0.5(20 日差值版与反转控制的相关可能偏高,其余窗口更长)。为什么样本外还会在:T+1、开盘集合竞价、散户主导与卖空约束是 A 股的制度特征,不随样本期改变;LPS
    记录的分化持续数年;信号是 60–241 日的慢变量,换手低,15 bp 吃不掉;没有凸变换、没有在 train 上挑的幂次。先说清的风险:一字板日开盘价等于涨跌停价,ON 被截断、ID = 0,这是真实值不是缺失;单腿 ON 与波动有一定负相关(高风险股隔夜折价更深),所以放了无量纲版和相关系数版作对冲。
