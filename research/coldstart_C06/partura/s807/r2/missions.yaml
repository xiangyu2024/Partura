- type: N
  hypothesis: |-
    可交易股本的净供给:过去一年里公司还给股东多少(派现、回购注销),又向市场新增了多少可交易股份(解禁、增发)。这就是 Boudoukh–Michaely–Richardson–Roberts 2007 的净派现收益率(派现 + 回购 − 发行),符号取反就是 Daniel–Titman 2006 的复合发行。预期方向 −1:多头是净派现最高、没有新增供给的一端。

    恒等式(审计已核对):价格字段后复权,LogFloatCap = log(流通股数 × 未复权价),所以 x_F = sub(LogFloatCap, log(day_last(Close))) = log 流通股数 − log 累计复权因子 + 常数。价格和送转都精确抵消:送转时股数 ×k、复权因子 ×k。派现让 x 下降约 D/P(按除息日价格),解禁、增发让 x 上升。x_T 把 LogFloatCap 换成 LogTotalCap,是总股本口径:定增在发行日计入,流通口径要到解禁日才计入。

    第 2 稿改的是实现(第 1 稿 10 个种子在相关度表里全是门槛废品),机制不变:
    (1) 覆盖率。不再用 d ≥ 60 的 ts_delta(它要求恰好 d 行之前有值),改成逐日差分的 NaN 安全累积 ts_sum(ts_delta(x, 1), 241)。ts_delta(x, 1) 只要求前一行有值;ts_sum 是 nansum,左侧用 NaN 填充,只有 241 天全缺才是 NaN,所以训练开头和新股只累积已有的日子,覆盖率应与叶子本身相当(预计 ≥ 0.97)。没有缺失时,望远镜求和恰好等于 x_t − x_{t−240};停牌跨过事件日会丢掉那一次事件,可以接受。
    (2) distinct。删掉 60 / 120 日版本,所有种子的累积窗口都是 241 日,覆盖一个完整的分红季。一年里没有任何公司行为的股票,值只是两个端点的 float32 舍入差:x 在 15–25 的量级,ulp 是 2^-20 ~ 2^-19(1e-6 ~ 2e-6),差值只落在 ±几个 ulp 的格点上,这一块每天最多贡献十几个不同的值。每天有 3500–4700 只股票有值,这一块对 distinct 的贡献 < 0.5%,所以 distinct ≥ 0.5 只能来自真有事件的股票,舍入噪声凑不出门槛。第 1 稿 60 日版 distinct 0.334、覆盖率 0.942 是旁证:非事件股精确抵消,落成并列。
    |值| < 1e-4 的比例我这里算不出来(PI 不跑服务器,本机没有数据),先给先验。稳态约 0.2–0.3,即一年里既没派现、股本也没变的股票(2017–2021 年度实施现金分红的 A 股公司约占七成,这是公开年度统计的约数,未在本数据上核实;另有解禁、高管锁定股调整、增发)。有两个时段会升到 0.4–0.6:每年 6–7 月,今年除息日晚于去年那一天的派现股,窗口里暂时一次除息也没有;训练开头约 4 个月,窗口里只有 2017 年 10–12 月的 60 天预热,很少有除息。新相关度表的「门槛」列会验证 distinct。
    (3) 纯多头腿,直说。方向 −1 的多头十分位是过去一年净派现收益率最高的股票。对绝大多数成员来说,它就是按除息日价格计的过去 12 个月股息率,加上少量回购注销,且同期没有新增供给。它和股息率 / 价值风格只差两点:(a) 发行和解禁记负,高股息但同期有大额解禁或定增的股票进不了多头;(b) 派现按除息日价格计,不随当前价格变。我不声称它和股息率是两回事。这一位检验的就是:净派现收益率这条多头腿,在 5 个控制中性化以后能不能过线。Boudoukh 等 2007 发现,净派现收益率比股息率含有更多关于预期收益的截面信息,这是把发行一并计入的理由。
    它不是控制变量的非线性重写(陷阱 3):它的变化只来自公司行为(复权因子与股本),不来自价格、波动、成交额或市值。高股息股偏低波动,这一部分会被线性中性化去掉,残差里留下的是同一波动水平内派现的高低。方向 +1 的多头腿(新增供给最多)与文献相反,奖励若在 train 上选了 +1,应当视为可疑。
    (4) 锁仓比例水平项 sub(LogTotalCap, LogFloatCap) 与 head 8 的 |ρ| 是 0.42,只在一个种子里出现(与总股本口径的发行相加:仍被锁住的未来供给 + 已发生的净发行)。
    (5) cs_regres(流通口径, 总股本口径):派现对两个口径的影响相同,在残差里基本抵消,剩下的是流通股相对总股本的变化,即解禁(正)与定增尚未解禁(负)。

    为什么和库里不同:库里没有 head 用到公司行为。head 8 ts_sum(LogFloatShares, 30) 是股本的水平,对 LogFloatCap 中性化以后约是 −log 价格(第 1 稿 R3 变体 1 与它的残差 |ρ| 是 0.85);本位取的是价格与送转都精确抵消以后的变化。第 1 稿 241 日版与 head 的原始 |ρ| 是 0.08–0.26,与 5 个控制 ≤ 0.21;新写法在没有缺失的地方与它逐点相同,预计不变。

    为什么样本外还会在:派现与限售解禁的时间表是制度性的,不随样本期改变。净发行 / 净派现异象在美股发表之后仍然稳健(Pontiff–Woodgate 2008 在 1970 年后的样本里,它的显著性超过规模、账面市值比和动量)。变量一年只变几次,换手极低,15 bp 可以忽略。没有凸变换,也没有在 train 上挑的参数。

    风险:(i) 发行异象的主力在发行方(空头腿),纯多头吃不到;多头腿能不能过线,目前没有 train 上的证据。train 里 2019–2020 年的成长行情对高派现不利,score 取 train 与 valid 中较差的一个,可能卡在这里。(ii) 训练开头约 4 个月窗口不满、并列多,这段时间多头书有一部分成员由控制的投影决定。(iii) 6–7 月的空档让部分派现股的值暂时归零再回来,带来少量换手;放了 20 / 60 日均值版对冲。(iv) LogTotalCap 含 H / B 股,只影响水平项,不影响变化项(H 股增发除外)。不用 LimitWidth / BoardCode。
