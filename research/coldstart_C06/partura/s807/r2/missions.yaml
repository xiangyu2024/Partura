- head: ts_sum(pow_2_5(ts_sum(pow_3(day_durbin_watson(High)), 1)), 1)
  why: 两个部件可疑。(1) 数值:float32 的最小非规格数是 1.4e-45。day_durbin_watson(High) 的分母不去均值,约等于每分钟收益平方的均值(日内已实现方差,1e-6 ~ 2e-5),DW^7.5 在 1e-44 量级,约一半股票直接下溢为 0 —— 定位输出量到 distinct 从 pow_3 那一层的 0.9996 掉到 head 的 0.5523(擦着
    0.5 的门槛),其它所有表达式都在 0.997 以上;方向 −1 的纯多头书买的正是这个并列块,块内残差的排序完全由 5 个控制决定。变体 1 乘 1000.0:(1000·DW)^7.5 = 1000^7.5 · DW^7.5 是正常数倍,EMA 是线性的、z 秩对正仿射不变,数学上与 head 逐日同秩,唯一的差别是不再下溢 —— 分数差很多就说明 head 的分数是数值假象;更高则应替换掉这个并列的版本。(2)
    字段:DW(High) 是没声明的已实现方差;定位输出的凸度阶梯 e = 1 / 2.5 / 3 / 7.5 给出 −1.17 / +0.72 / +0.96 / +1.78,而四者每天的截面秩完全相同(非负量上的幂只改 EMA 怎么混合日子),增益全在 train(valid 从 e = 2.5 起饱和在 +2.4 ~ +2.7)—— 陷阱 1 的形状。变体 2 把叶子换成奖励自己声明的波动度量
    day_std(Ret),同一条凸化阶梯(0.002^7.5 ≈ 1e-20,不下溢)。它若同样高分,head 1 就是低波动多头腿换了字段;它若胜出替换 head 1,换进库的仍是同一个机制、只是不再下溢,不新增陷阱(诊断用途)。
  variants:
  - ts_sum(pow_2_5(ts_sum(pow_3(mul(day_durbin_watson(High), 1000.0)), 1)), 1)
  - ts_sum(pow_2_5(ts_sum(pow_3(day_std(Ret)), 1)), 1)
- head: ts_sum(cross_stddev(day_durbin_watson(High), 60), 1)
  why: cross_stddev(DW(High), 60) 必要性 +2.28(去掉它退回原始 DW 是 −1.18),但没有去尺度:已实现方差近似乘性,60 日标准差 ≈ c × 60 日均值,秩上与波动水平高度重合,分不清它是「风险的不确定性」(vol-of-vol;文献里的独立证据用的是隐含波动的波动,不能直接套过来)还是 RV 水平的又一个非线性写法(陷阱 3)。变体 3 换成变异系数
    std/mean(去尺度的 vol-of-vol);变体 4 是同一个变异系数套在奖励声明的波动度量 day_std(Ret) 上;变体 5 是未去尺度的 day_std(Ret) 版空对照。外层 ts_sum(·, 1) 是恒等算子,保留只为让「只动 cross_stddev 这一个部件」一目了然。3/4 若仍 ≥ head + 0.1,应以去尺度版替换(更不依赖波动水平);3/4 塌而 5
    保住,head 4 就是波动水平。
  variants:
  - ts_sum(div(cross_stddev(day_durbin_watson(High), 60), cross_mean(day_durbin_watson(High), 60)), 1)
  - ts_sum(div(cross_stddev(day_std(Ret), 60), cross_mean(day_std(Ret), 60)), 1)
  - ts_sum(cross_stddev(day_std(Ret), 60), 1)
- head: ts_mean(pow_2(mul(pow_2(day_wmean(Ret, Ret)), day_var(Ret))), 30)
  why: 部件 mul(·, day_var(Ret)) 可疑:必要性 +0.17,它就是把波动本身乘回去,等于手动加回中性化要去掉的东西(陷阱 3)。r1 对同一个 W 核心的直接评估里,四种去尺度写法全部塌掉(RSJ⁴ +0.18、(W/σ)⁴ +0.17、路径效率⁴ −0.71、波动十分位内 −0.75),但这个 head 上还没有严格对照。变体只把 mul 换成 div、其余一字不动:若掉到
    +0.5 以下,这个部件的贡献就是波动尺度;若反而 ≥ head + 0.1,应以不含波动乘数的版本替换。
  variants:
  - ts_mean(pow_2(div(pow_2(day_wmean(Ret, Ret)), day_var(Ret))), 30)
