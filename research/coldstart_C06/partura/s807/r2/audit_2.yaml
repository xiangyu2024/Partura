    soundness: 4
    struck_seeds: [1]
    reasons: '本位的计划与 14 个种子与第 1 次一字未改,corr_2 的 slot a 各行与 corr_1 逐列相同,所以分数与第 1 次一致。创新度 4:快照 8 个 head(loc.md)全是日内分钟收益的二阶量,即 W = day_wmean(Ret, Ret) 的凸化 5 个、day_durbin_watson(High) 的凸化与 60 日标准差 2 个,另有股本水平 ts_sum(LogFloatShares, 30)。本位第一次用 day_first(Open) 和跨日(昨收→今开)结构,测的是一阶收益落在哪一段。表里种子与 head 的原始 |ρ| 是 0.10–0.33,其中 10 个 < 0.3;种子 2 / 3 / 7 的 0.31–0.33 都是对 ts_sum(cross_stddev(day_durbin_watson(High), 60), 1)。残差 |ρ| ≤ 0.16,覆盖率 0.998–0.999,distinct ≥ 0.999。文献里已有(LPS 2019、Akbas 等 2022),所以不给 5。合理度 4:算子核对沿用第 1 次 —— day_first(Open) 是 09:30 竞价 bar 的开盘价;价格后复权;ts_delay 平移一行;cross_corr / cross_regbeta 走 NaN 安全的 rolling_pair_reduce / rolling_ols(y ~ alpha + beta·x,即 ID 对 ON 的斜率);cs_regres 是逐日截面 OLS 残差(nd_cs.py)。2023-08 前有 A 股与美股文献,train 上没有证据,不给 5。两处更正,都不阻断:(1) 计划里「取差在构造上把总收益那一维拿掉」仍未改。cov(ON−ID, ON+ID) = var(ON) − var(ID),20 日差值版与反转控制 0.53 就是反例;60–241 日的差值版(2–4、8、9)带着同窗口的中长期总收益。(2) 我第 1 次说 cs_regres 版(10、11)剥掉了总收益,这句收回。种子 10 与单腿 ON(种子 5)各列几乎相同:head 0.235 / 0.235,残差 0.133 / 0.132,liq 0.047 / 0.042,vol 0.139 / 0.130,size 0.167 / 0.174。OLS 残差去掉的只是 ON 方差里 corr² 那一份,说明两腿 60 日均值的截面相关很弱,它实质上就是 ON 腿。真正与总收益正交的是相关系数 / 斜率版 12–14(rev ≤ 0.024)。划掉种子 1:与反转控制 |ρ| 0.528 ≥ 0.5,表规则同样会划。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '创新度 4:库里没有任何 head 用到公司行为。head 8 ts_sum(LogFloatShares, 30) 是股本水平,对 LogFloatCap 中性化后约为 −log 价格。本位取的是 x = LogFloatCap(或 LogTotalCap)− log(day_last(Close)) = log 股数 − log 累计复权因子 + 常数 的 241 日变化:价格与送转抵消,只剩派现(约 −D/P)、回购注销与发行 / 解禁。表(corr_2):种子 1–7 与 head 的原始 |ρ| 是 0.19–0.21,残差 ≤ 0.17,与 5 个控制都 ≤ 0.20;种子 8 带锁仓比例水平,对 head 8 原始 0.53、残差 0.21,size 0.42。净派现与复合发行在文献里已有(Boudoukh 等 2007、Daniel–Titman 2006),所以不给 5。

      合理度 4:第 1 次的意见逐条落实了,是实质修改,不是换说法。(1) 门槛:8 个种子全部「过」,覆盖率 0.998,distinct 0.715–0.917;第 1 稿是 0.786–0.942 / 0.334–0.924,全部废品。(2) 实现:ts_delta(x, 1) 只要求前一行有值;ts_sum 用 nansum_last(common.py),窗口里全是 NaN 时才给 NaN,所以覆盖率是真的,不是把空窗口当 0。没有缺失时,241 项望远镜和等于 x_t − x_{t−241}(计划写 t−240,差一行,无关紧要)。(3) distinct 的来源:PI 没算出 |值| < 1e-4 的比例,但表给了等价的旁证 —— distinct 随事件频率走。60 日版 0.334,低于 241 日版;流通口径多了解禁事件,0.823 高于总股本口径的 0.715。如果靠 float32 舍入凑数,distinct 应接近 1,且与口径无关。无事件股的值是 2^-19 的小整数倍,形成 20–30% 的并列块,落在 0 附近、分布的中间。方向 −1 的多头十分位是最负的一端(派现最高),碰不到并列块,所以书不依赖控制的投影排序。(4) 纯多头腿已经直说:就是按除息日价格计的过去一年股息率,扣掉同期发行。Boudoukh 等 2007 按净派现收益率分组,是多头一侧在 2023-08 之前的文献证据,所以给 4。不给 5:A 股上这条多头腿在 5 个控制中性化以后的证据没有。PI 引的 A 股文献(刘娥平–唐舜、Wang–Xu)讲的是解禁的空头腿和流通比例的水平,train 上也没有证据。

      种子层面的问题(不划,写清楚):种子 7 cs_regres(流通口径, 总股本口径) 与种子 1 在表上逐列几乎相同:0.193 / 0.194,残差 0.161 / 0.162,各控制差 ≤ 0.005。这说明截面 OLS 斜率接近 0,大概率被总股本口径里大额定增、H 股这类离群值压平。所以它没有实现假设 (5) 里「解禁减去未解禁的定增」,实质上是种子 1 的复本。种子 8 是 add(锁仓比例水平, 总股本口径变化):水平项的截面离散比变化项大一到两个量级,整体排序由锁仓比例决定;只有在锁仓比例恰为 0 的全流通块里才由派现排序。方向 −1 的多头正好落在这块里(全流通、派现高),所以它在多头端仍然属于本位的想法,保留。

      评估后须核对的风险:(a) 时点对齐。送转与配股如果在数据商那里股本变动日与复权因子变动日错开(上交所的送转新增股份常在除权日的次日上市;配股新股要在除权后一到两周才上市),x 在终点会出现一天(配股为数天)的负尖刺,幅度是 −log(1+送转比例):10 送 10 就是 −0.69,远大于任何股息率,方向 −1 时会直接进多头书。20 / 60 日均值版会把它摊成 20 / 60 天的约 −0.035 / −0.012,反而更持久。建议看一眼多头书里是否集中出现当天除权的送转股。(b) 241 个交易日略短于一年(约 243–245 天),每年在同一时间除息的股票会有几天归零、再回来;PI 已列为风险 (iii)。(c) GP 后代如果把种子包进基于 _pct_rank 的 cs_* 算子(ops_ext.py 的 _pct_rank 用 stable argsort,并列按列序打破),20–30% 的并列块会变成一条列序斜坡,即 §4 陷阱 2。并列块在分布中间,对多头十分位影响有限,但要留意。'
    revise: '—'
R:
  - head: 'ts_sum(pow_2_5(ts_sum(pow_3(day_durbin_watson(High)), 1)), 1)'
    soundness: 3
    reasons: '变体 1 的依据扎实,与第 1 次相同。day_durbin_watson 的分母不去均值(dt_day.py),DW(High) 约为每分钟收益平方的均值,在 1e-6–2e-5 之间,DW^7.5 落进 float32 的非规格数区甚至下溢为 0。loc.md 的拆解里,distinct 从 pow_3 那一层的 0.9996 掉到 head 的 0.5523;外层窗口 1→2 让并列变少,score 从 +1.78 升到 +1.90。乘 1000 以后,截面秩在数学上与 head 相同(表:原始 0.999、残差 1.00、distinct 1.0),是干净的单部件对照。变体 2 的内容没改,只加了一句「不新增陷阱」:第 1 次我建议删掉它,PI 换了说法,没换内容。不过这句话有一半是对的 —— 与 head 同秩的变体 1 对波动控制已经是 0.68,变体 2 是 0.72,head 1 本身就是陷阱 1 的形状。变体 2 如果替换 head 1,库里陷阱形状的 head 数量不变,只是把隐式的写法换成显式的。下行有界,只花 1 次评估,所以整组仍给 3;仍建议删掉变体 2,诊断用不着走替换通道。'
  - head: 'ts_sum(cross_stddev(day_durbin_watson(High), 60), 1)'
    soundness: 3
    reasons: '变体 1 / 2 用变异系数 std / mean 去尺度:cross_stddev 与 cross_mean 是同一个 60 日窗口、NaN 安全的滚动,分母为正。表里它们与 head 4 的原始 |ρ| 是 0.72 / 0.74、残差 0.83 / 0.76,与波动控制降到 0.09 / 0.18,说明 head 4 里有一块与波动水平无关的 vol-of-vol,这个对照设计得好;胜出时换进库的是更不依赖波动水平的版本。变体 3(未去尺度的 cross_stddev(day_std(Ret), 60))内容没改:与波动控制 0.56、与 head 4 原始 0.93,胜出就会把一个明写的波动非线性函数换进库。但 head 4 本身(已实现方差的 60 日标准差,在乘性尺度下约为 c × RV 水平)已经是同一个形状,下行有界。外层 ts_sum(·, 1) 是恒等算子。整组给 3,仍建议删掉变体 3。'
  - head: 'ts_mean(pow_2(mul(pow_2(day_wmean(Ret, Ret)), day_var(Ret))), 30)'
    soundness: 3
    reasons: 'mul(pow_2(W), day_var(Ret)) 再取 pow_2,约等于 σ⁸Z⁴,把波动控制的高次幂乘了回去,是 §4 陷阱 1 / 3 的形状。loc.md 的拆解里这个 mul 的必要性只有 +0.17(去掉后 +1.32,head +1.49)。变体只把 mul 换成 div,其余一字不动,得到 ts_mean((W/σ)⁴, 30):无量纲,是严格的单部件对照;day_var = day_std² 与 W 用的是同一天、同一组分钟。表里它与 head 2 的原始 |ρ| 是 0.79、残差 0.86,与波动控制 0.27。按计划自述,r1 同一个核心的去尺度写法都塌过,这次大概率也到不了 head + 0.1,主要是诊断用途。但依据清楚,只花 1 次评估,给 3。'
summary: 'a 位(隔夜 / 日内收益归属,N)与 b 位(净派现 / 净发行,N,第 2 稿)都通过,创新 4、合理 4。b 位按第 1 次的意见改了实现,8 个种子全部过门槛,一个都不划;但种子 7 实为种子 1 的复本,送转日的时点对齐须在评估后核对。a 位只划掉与反转控制 0.53 的种子 1。R1 / R2 / R3 都给 3 通过;R1 变体 2 和 R2 变体 3 只换了说法、内容没改,仍建议删掉。'
