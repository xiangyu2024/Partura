    K 线做的批量成交分类(BVC 的硬分类版):每分钟的成交额按该分钟收益的符号记为买方或卖方发起。算子实现:(a) 日级 abs_(day_signed_ratio(Ret,
    Amt)) = |上涨分钟成交额占比 − 下跌分钟成交额占比|,有界在 [0,1],不含波动尺度;(b) 桶级,更贴近 Easley–López de Prado–O’Hara
