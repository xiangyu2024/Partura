    日),以及 cross_zscore(cross_mean(·, 5), 60)「相对本股历史的异常失衡」;(d) 失衡方向的不稳定性 cross_stddev(day_signed_ratio(Ret,
    Amt), 20):一个月里买卖方向来回翻 = 意见分歧;(e) 成交最重的 10% 分钟的收益相对当日波动 |day_topw_mean(Ret, Amt)|
    / day_std(Ret):重仓分钟的价格冲击;(f) 资金与价格的背离 |day_signed_ratio(Ret, Amt) − day_signed_ratio(Ret,
    Ret)|:钱偏在一边而价格没跟着走(被吸收的流量)。VPIN 机械地与流动性相关(成交稀的股票失衡噪声大),所以有 3 个种子在 20 日成交额十分位内排序(cs_bucket_rank),非线性地去掉流动性(已知陷阱
