  core: pow_2(day_wmean(Ret, Ret))
  hypothesis: 核心 W² = pow_2(day_wmean(Ret, Ret)),其中 W = Σr|r| / Σ|r| = (RS⁺ − RS⁻)
    / Σ|r|:上行与下行已实现半方差之差,除以日内路径长度(r 为分钟收益)。快照的拆解给出:带符号的 W 单独 score −0.19,折叠成 W² 是
    +0.89(内层 pow_2 的必要性 +1.08),head W⁴ 是 +1.18 —— 信息在「日内单边程度的幅度」,不在方向。但 W 有量纲:随机游走下
    W ≈ σ·√峰度/√N·Z + 漂移项,所以 W² 同时混着三样东西:日内波动尺度 σ²、分钟收益的厚尾/跳跃、真正的单边程度。已见过的外围(外层 pow_2、inv、ts_cov
    / day_var / day_median 的组合)没有一个把这三样分开。外层 pow_2 尤其可疑:W² ≥ 0 且 t↦t² 在 [0,∞) 单调,W⁴
    与 W² 在每一天的截面秩完全相同,它带来的 +0.29 全部来自 hl=20 的 EMA 被拉向月内最极端的那一天,而且 train +0.29 / valid
    −0.31;凸化正是已知陷阱 1、3 把波动尾部带回奖励的方式。本位的外围做三件以前没做过的事:(1) 非线性地去掉波动尺度 —— 同日除以 RV 型分母:div(W²,
    pow_2(day_wmean(abs_(Ret), Ret))) 中 day_wmean(abs_(Ret), Ret) = Σr²/Σ|r|,所以这个比值恰好是
    Bollerslev–Li–Zhao 的相对符号跳跃 RSJ = (RS⁺ − RS⁻)/RV 的平方,无量纲、有界;或者在 20 日波动十分位内排序 cs_bucket_rank(·,
    cross_mean(day_std(Ret), 20)),把线性秩中性化去不掉的凸波动部分在每个十分位里清零。(2) 把月度聚合显式化,并分开「典型日」与「尾部日」:cross_med
    / cross_mean / cross_tail_mean_q75 / cross_quantile_q75 / cross_max,窗口 20 = head
    被选中的半衰期;以及 cross_zscore(cross_mean(·, 5), 60)「这一周的单边程度相对本股过去三个月是否异常」(冲击而非水平,持久的波动水平被减掉)。这些替代了隐式的凸化
    EMA,让纯多头十分位书不依赖少数极端日。(3) 按涨跌停幅度归一化(Hung–Yang 2018 对有涨跌停市场 MAX 的处理):LimitWidth
    决定一天单边最多能走多远,20% 板的 W² 不能和 10% 板直接比,除以 LimitWidth² 后再在波动十分位内比较。种子全部是 20 日以上的聚合或十分位内秩,所以预计与
    head 的日度秩 |ρ| 远低于 0.7(日度 W² 的截面秩大部分是 χ² 型的当日噪声,月度聚合与它只共享持久部分),与波动控制的 |ρ| 也远低于
    0.5。为什么样本外还会在:单边、跳跃式的日内走势吸引注意力与彩票型需求,在卖空受限、散户主导、有涨跌停的 A 股难以被套利(Bali–Cakici–Whitelaw
    2011 的 MAX;Nartea–Kong–Wu 2017 证明 A 股的 MAX 与特质波动率并存、互不吸收,所以必须显式去掉波动才能看清 MAX 型信息);去掉波动尺度与凸化之后留下的部分不再依赖只在
    train 上选出的幂次,如果它仍然有效,它就是结构性的而不是参数性的;如果它失效,说明 head 主要是非线性波动,这一点本身也决定第 2 轮该不该继续深挖这个核心。
