R:
- head: pow_2(pow_2(day_wmean(Ret, Ret)))
  why: 三个部件可疑,每个变体只动其中一个(或明确写出动了两个)。(1) 外层 pow_2:W² ≥ 0 且 t↦t² 在 [0,∞) 单调,所以 W⁴ 与
    W² 在每一天的截面秩完全相同,外层 pow_2 不带任何当日截面信息;它的 +0.29(W² +0.89 → W⁴ +1.18)全部来自 hl=20 的
    EMA 被拉向月内最极端的一天,而且 train +0.29 / valid −0.31(W² 的 valid +1.66 高于 head 的 +1.35),方向与半衰期又都只按
    train 选 —— 典型的凸化在 train 上过拟合,也是已知陷阱 1 的形状。变体 1–5 把它换成显式的 20 日聚合(cross_max / cross_quantile_q75
    / cross_tail_mean_q75 / cross_med)或更不凸的 pow_1_5。(2) W 里的波动尺度:随机游走下 W ≈ σ·√峰度/√N·Z
    + 漂移,W⁴ 因而含 σ⁴,是波动的非线性函数,线性中性化去不掉(陷阱 3)。变体 6–9 换成无量纲的写法:除以 day_wmean(abs_(Ret),
    Ret) = Σr²/Σ|r|(得到相对符号跳跃 RSJ = (RS⁺ − RS⁻)/RV)或 day_std(Ret),换成路径效率 day_signed_ratio(Ret,
    Ret) = Σr/Σ|r|,或在 20 日波动十分位内排序;若它们都明显变差,说明 head 的分数主要来自波动尺度。(3) 自加权 |r|:定位工具的字段替换表不含
    Ret,这个部件从没被测过;变体 10–11 换成成交额加权、以及不加权(day_mean)。
  variants:
  - cross_max(pow_2(day_wmean(Ret, Ret)), 20)
  - cross_quantile_q75(pow_2(day_wmean(Ret, Ret)), 20)
  - cross_tail_mean_q75(pow_2(day_wmean(Ret, Ret)), 20)
  - cross_med(pow_2(day_wmean(Ret, Ret)), 20)
  - pow_1_5(pow_2(day_wmean(Ret, Ret)))
  - pow_2(pow_2(div(day_wmean(Ret, Ret), day_wmean(abs_(Ret), Ret))))
  - pow_2(pow_2(div(day_wmean(Ret, Ret), day_std(Ret))))
  - pow_2(pow_2(day_signed_ratio(Ret, Ret)))
  - cs_bucket_rank(pow_2(pow_2(day_wmean(Ret, Ret))), cross_mean(day_std(Ret), 20))
  - pow_2(pow_2(day_wmean(Ret, Amt)))
  - pow_2(pow_2(day_mean(Ret)))
