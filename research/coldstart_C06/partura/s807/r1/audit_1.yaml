  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [10, 11]
    reasons: '创新度 3:外围做的事与该核心已见过的外围(外层 pow_2、inv、ts_cov / day_var / day_median 组合)不同,且说得出为什么。逐个核对源码:ops_ext.day_wmean 用 |w| 加权,所以 day_wmean(abs_(Ret), Ret) = Σr²/Σ|r|,div(W², 它的平方) 恰为 (Σr|r|/Σr²)² = RSJ²,有界于 [0,1]、无量纲;cs_bucket_rank 在 20 日波动十分位内取秩,分组变量正是奖励里的波动控制 cross_mean(day_std(Ret), 20),表中 seeds 6–11 的 vol 列都是 0.01;显式的 20 日 cross_mean / cross_med / cross_tail_mean_q75 / cross_max 取代奖励对原始 W⁴ 做 EMA 时「被月内极端日拉动」。相关度表支持这一拆分是实质性的:R 变体 9(head 在波动十分位内取秩)原始 |ρ| 0.97 而残差只有 0.21,cross_med 残差 0.35,cross_max 残差 0.91 —— head 的交易信号主要是 EMA 记住的极端日,分开「典型日 / 尾部日」有意义。输入仍是同一个 Ret、同一个核心,所以不到 4。种子与 head 的原始 |ρ| 0.20–0.36,控制最高 0.36(seed 4 的 size),无机械划掉;核心与 5 个控制 |ρ| ≤ 0.22,满足 E 位要求。合理度 3:机制清楚,算子实现了它,窗口 5 / 20 / 60 合理。不给 4 的原因:(i) 文献(Bollerslev–Li–Zhao 的 RSJ、Amaya 等的已实现偏度)支持的都是带符号的量,而本位用平方后的幅度;定位输出里带符号的 W 单独 −0.19,文献结论在这里并不迁移;W² 的 +0.89 / +1.66 是未去尺度的核心的证据,本位要检验的正是去掉波动后还剩不剩,所以对外围本身没有现成证据。(ii) 随机游走零假设下 RSJ ≈ √(峰度/N_eff)·Z,RSJ² 约正比于 1/(当天价格动过的分钟数),会相当程度读成日内零收益分钟占比(大 tick 低价股、一字或近一字板),这是流动性的非线性函数(陷阱 3 的形状),liq 列 0.18 反映不出来;只有 seed 4(成交额十分位内排序)处理了它,GP 往下长时值得留意。划掉 10、11:LimitWidth 在源码 tradability.board_limit 里只是板块 × 日期的哑变量(主板 0.10,科创板与 2020-08-24 起的创业板 0.20,北交所 0.30),除以 LimitWidth² 在每个波动十分位里把 20% 板的值相对主板整体除以 4,秩按板块系统性平移,实现的是板块倾斜而非「相对涨跌停的单边程度」,并在 train 内因创业板 2020-08-24 换档制造结构断点;Hung–Yang 的归一化针对的是被日涨跌停直接截断的日收益 MAX,分钟收益自加权的 W 不被日限幅直接截断,且波动十分位已对齐尺度,再除一次是重复归一化。seed 12 保留但注意:W² 未去尺度,对自身 60 日历史 z 化只减掉持久的波动水平,本周波动上升仍会直接抬高它(rev 列 0.22),它读的更多是波动冲击;seed 13 是它的干净版本。划完剩 11 个种子。'
    revise: '—'
  - slot: b
    novelty: 3
    soundness: 3
    struck_seeds: [3, 4, 5, 12]
    reasons: '创新度 3:被测的量确实换了 —— 源码 day_signed_ratio(x, y) = Σ|y|·sign(x)/Σ|y|,零收益分钟只进分母,所以 abs_(day_signed_ratio(Ret, Amt)) 是成交额在涨 / 跌分钟之间的失衡幅度,不含收益幅度;与唯一 head 的原始 |ρ| 0.08–0.20、残差 0.01–0.14,是另一个信号。不给 4:结构上它就是核心 day_wmean(Ret, Ret) 把 x 换成 sign(Ret)、权重换成 Amt(day_signed_ratio(x, y) ≡ day_wmean(sign(x), y)),再取 abs_(与 pow_2 同秩);PI 自己也写明是把同一个「单边」从价格路径换到资金流通道,输入只换了一半(Ret 仍在,只留符号),按 §3 属于「同一类输入、机制不同」。seed 8(重仓分钟的价格冲击)、seed 9(失衡方向的月内不稳定)是另外的子想法,一个位里放了 (a)–(f) 六个子想法偏散,作为种群原料可以接受。合理度 3:机制清楚(订单流失衡 / 知情交易),算子实现了它的分钟 K 线近似 —— 按分钟收益符号硬分类,用重叠的 15 / 30 分钟时间窗代替等成交量桶(in_sum_rolling 是 rolling_windows 左补 NaN 后的 nansum,开盘头 29 分钟是不满窗的部分和),属于已声明的近似;窗口 15 / 20 / 30 / 60 常规;对流动性的机械相关有意识地用 cs_bucket_rank 在 20 日成交额十分位内处理(seeds 6、7、10 的 liq 列 0.01–0.03)。不给 4:文献支持的是别的对象 —— VPIN(2012)预测的是短期波动与流动性崩溃,不是截面收益溢价;PIN(2002)给的是正溢价;Chen 等(2022)的聪明钱是另一种构造;本位不承诺方向,train 上也没有证据。划掉 5:表中 liq 0.51、known 0.53,机械划掉(与已知族 ≥ 0.5 还会直接判不合格)。划掉 3、4:它们是 seed 5 的单日版,原始 liq / known 0.28–0.33,但 20 日平均后升到 0.51 / 0.53,说明持久部分就是流动性 —— 每个时间窗里成交越稀,|失衡| 的抽样噪声越大(约 ∝ 1/√笔数);奖励自己会在若干半衰期(最长 20)里挑 EMA,选到长半衰期就退回 seed 5,属于陷阱 3(流动性的非线性函数);它们的干净版本是 seed 7。划掉 12:20 日平均的「两个噪声比值之差的绝对值」主要量的是估计噪声的大小,liq 0.45、known 0.40、size 0.42 三个控制同时贴近 0.5,是同一个陷阱 3 的形状;而且 abs_ 把「钱在买、价在跌」和「钱在卖、价在涨」混在一起,没有实现「被吸收的流量」需要的方向。剩下 8 个种子(1、2、6、7、8、9、10、11),控制 |ρ| 最高 0.34。'
    revise: '—'
R:
  - head: 'pow_2(pow_2(day_wmean(Ret, Ret)))'
    soundness: 3
    reasons: '部件 (1) 外层 pow_2 的「烂」有可核对的依据:W² ≥ 0 上 t↦t² 单调,表中核心与 head 原始 |ρ| = 1.00、pow_1_5 变体也是 1.00,当日截面秩完全相同;奖励先对原始值做 EMA 再取 z 秩(steer.reward 里 bk.smoothed(raw, hl) 之后才 neutral_residual),所以 W⁴ 比 W² 多出的只是 EMA 被月内极端日拉动;定位输出 W² train +0.89 / valid +1.66,head +1.18 / +1.35,外层 pow_2 的增益只在 train(+0.29),valid 反而 −0.31,是只按 train 选出来的凸化,符合陷阱 1 的形状。部件 (2) 波动尺度:理论依据成立(W ∝ σ),变体 6、7、9 的 vol 列 0.01,确实把它去掉了,是有判别力的检验;但 RSJ⁴、(W/std)⁴ 与 head 的原始 |ρ| 0.94 / 0.95,说明逐日截面上 σ 尺度并不主导 W 的排序,这个部件「烂」目前只有理论依据。部件 (3) 自加权 |r|:「从没测过」不是它烂的依据。只给 3 的原因是一部分替换件会把要去掉的东西带回来:变体 1(cross_max)、3(cross_tail_mean_q75)与 head 的残差 |ρ| 0.91 / 0.90,只是把「追极端日」从隐式写成显式,并没有去掉 (1) 里判为烂的那部分;变体 1–4 对未去尺度的 W² 做 20 日聚合后,与波动控制的原始 |ρ| 升到 0.52 / 0.60 / 0.57 / 0.55(≥ 0.5,控制变量的非线性重写,陷阱 3),而 R 的替换规则只查已知族不查波动,它们若凭非线性波动胜出会把一个波动代理换进库;变体 11 pow_2(pow_2(day_mean(Ret))) 约等于当日收益的四次方,本身就是对波动型量的凸化(陷阱 1)。有判别力、值得评的是 5、6、7、9,以及 2、4 作为分位数 / 中位数聚合的对照;1、3、11 的结果即使胜出也应按陷阱 1 / 3 存疑。'
summary: 'a 位 3/3、b 位 3/3、R 组 3,均过线:a 位划掉按板块哑变量缩放的 10、11(剩 11 个),b 位划掉实为流动性非线性函数的 3、4、5、12(剩 8 个);R 组对外层 pow_2 的诊断有 train/valid 依据,但变体 1、3、11 会把极端日与凸化波动带回来。'
