    novelty: 3
    soundness: 4
    struck_seeds: [3, 8, 10, 13]
    reasons: '【这一稿改了什么】a 位第 1 次审计已通过,PI 没有改:corr_1.md 与 corr_2.md 逐行比较,只有 R3 那一行变了,a 位 15 个种子与第 1 次完全相同。下面是我重新核对后的判断,结论与第 1 次一致。【创新度 3】输入和库里 head `ts_sum(cross_stddev(day_std(Ret), 60), 1)` 相同,都是 day_std(Ret)。但这里做的是去尺度:CV = std/mean、log 差分、上 / 下半标准差、减当日截面均值。这些都会改变截面排序,不是换窗口、换字段或单调变换。证据:保留的种子与波动控制只有 0.00–0.30(该 head 自身是 0.56,PI 引 r2 表);与该 head 原始 0.38–0.64、残差 0.37–0.62。这是说得出理由的实质改进,把波动水平拿掉了,所以给 3。不给 4 有两个原因:输入相同;除种子 11(0.30)外,每个种子都与某个 head 的 |ρ| > 0.3。「低相关不等于新」在这里有一处要说明。为压 σ̂ 抽样噪声而先做 5 日平均的写法(种子 3、8)与该 head 是 0.74 / 0.73;日频 Δlog σ 种子(2、4、5)离 head 的距离是 0.54–0.62,其中一部分就是 σ̂ 的噪声。旁证有两条:种子 1、9、12 第二像的是 W² × var 那个 head(0.60–0.62);种子 5 最像 `ts_sum(LogFloatShares, 30)`(0.54 / 残差 0.47),那个 head 中性化后约等于 −log 价格,也就是最小价位离散。【合理度 4】这一稿重新核对了算子。(1) common.py 的 log 在 |x| ≤ EPS = 1e-9 时返回 NaN,nanstd_last 会跳过 NaN,所以全天封死的一字板日 day_std(Ret) = 0 会变成缺失,不会变成 −inf。真正的污染只来自部分封板日:σ 在 1e-5 量级时 log σ ≈ −11.5,而常态约 −6,一天就会主导 60 日的 Δlog σ 离散度。(2) ops_ext 的 _semistd 要求 x_t 与 x_{t−1} 都 > 0,所以 0 值日被排除;但部分封板后的那一天 log(x_t/x_{t−1}) 约为 5,会压过 60 日 RMS(种子 6、7 同样受影响)。(3) div(cross_stddev, cross_mean) 是 CV;cs_bucket_rank 先在十分位内排秩,再加 1e-4 倍全局秩,输入都不是常数,所以陷阱 2 不适用。(4) 没有 pow_*、signedpower、day_durbin_watson,陷阱 1 不适用;与 5 个控制最大 0.42(市值,种子 7),都 < 0.5。窗口 20 / 60 是常规值。证据有两条:Baltussen 等 2018;r2 R 组对 60 日 CV 的直接评估,train 1.04 / valid 1.11,与已知族 0.085(PI 引用,第 1 次审计已核对)。不给 5:已实现 σ̂ 的 vol-of-vol 与隐含波动的「对风险的不确定」不是同一个量;上面那条封板污染路径 PI 仍未处理;与市值普遍有 0.28–0.42,本位没有市值或价格十分位的对冲。【划掉】3、8 是表规则(与上面那个 head 0.74 / 0.73,≥ 0.7,GP 库禁令也会拒)。10 `cross_autocorr(log(day_std(Ret)), 60, 1)`:恒等式 var(Δlog σ) = 2·var(log σ)·(1 − ρ₁) 只是把离散度拆成两半,没有给 ρ₁ 自己一个定价机制。随机波动模型里,ρ₁ 偏低主要说明 σ̂ 的测量噪声占比高(薄交易)。表里它与流动性 0.30、与已知族 0.29,是本位最高的两项;60 日 lag-1 自相关的标准误约 0.13。它是流动性或估计噪声的代理,不是本位的 idea。13 `cross_mean(div(day_std(in_stddev_rolling(Ret, 30)), day_mean(in_stddev_rolling(Ret, 30))), 20)`:量的是当日日内波动的形态(开盘尖峰、跳跃聚集),不是跨日的风险不确定。rolling_windows 左侧补 NaN,每天开盘前 29 分钟是 1–29 个点的小样本 std,机械成分会进入 CV。表里它最像 `ts_sum(LogFloatShares, 30)`(原始 0.57 / 残差 0.58),也就是价格档位。划完剩 11 个:1、2、4、5、6、7、9、11、12、14、15。【建议,不影响通过】第 1 次的两条建议 PI 都没有采纳:加价格十分位对冲 cs_bucket_rank(·, sub(LogFloatCap, LogFloatShares));log 类以 cross_med 版为主写法。两条仍然建议。'
    revise: '—'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '【这一稿改了什么】b 位第 1 次已通过,种子与相关度表都没有变,结论与第 1 次一致。【创新度 3】输入是跨日的日成交量 / 成交额,机制是交易活跃度的变异性(CSA 2001)。库里 14 个 cross_regbeta head 用的是当日分钟级的 day_std(Volume)、尾盘 in_sum_rolling(Volume, k)、day_distinct_ratio(Volume),做 10–15 日回归斜率;已知族是日内离散度的水平。两者的机制都不同。表里 cross_regbeta 族没有一个是任何 b 位种子最像的 head。按标准只够 3、不够 4:与所有 head 的 |ρ| < 0.3 的只有种子 7、9、14(0.26 / 0.14 / 0.13),种子 6 正好 0.30;主体种子 1、2、5、12 与 vol-of-vol head `ts_sum(cross_stddev(day_std(Ret), 60), 1)` 是 0.47 / 0.51 / 0.56 / 0.52(残差 0.42–0.47)。混合分布假说下量与波动都由信息流驱动,这一块与库重叠。输入属于同一类(Volume),机制不同,所以是 3。【合理度 4】算子核对:CV 写法正确;cross_semistd_pos / neg(day_sum(Volume), 60) 是日对数变化的上 / 下半 RMS,要求 x_t、x_{t−1} 都 > 0,零成交日自动排除;cs_regres 是 nd_cs.py 里的逐日截面 OLS 残差,var ≤ EPS 时 β 取 0;cs_bucket_rank 同 a 位。没有凸变换,也没有常数进 cs_*,陷阱 1、2 不适用。与 5 个控制最大 0.32(市值,种子 4、11),流动性不超过 0.25;十分位版(12、13)把对应控制压到 0.00 / 0.01,陷阱 3 有对冲。窗口 20 / 60 / 120 是常规值。证据是 CSA 2001(控制成交水平后仍为负)与 Pereira–Zhang 2010,都在 2023-08-08 之前;本数据上还没有 train 证据,所以不给 5。以下风险都不是陷阱,不划:(a) Volume 是股数口径,送转让成交股数按比例跳升,CV、Δlog V、semistd_pos 会被这一次公司行为抬高(PI 写了「股本不变时」的前提,但没处理;Amt 口径的 2、12 不受影响);(b) 新股开板前后成交量衰减,60 / 120 日 CV 偏大,与上市年龄相关,可用 ListAge 对冲;(c) 种子 10 与反转 0.31、与波动 0.29,因为成交脉冲常伴随大涨大跌。'
    revise: '—'
R:
  - head: 'cross_regbeta(day_std(Volume), cs_mask_top_replace_mean_neg(cs_robust_z(day_distinct_ratio(Volume))), 15)'
    soundness: 3
    reasons: '本组没有改,结论同第 1 次。common.py 的 rolling_ols 给 β = cov/var_x(y ~ α + βx,x 是第一个参数),唯一的保护是 var_x > 1e-9。x = day_std(Volume) 以股数计,y 是掩码后的 robust-z,有界。所以 |β| ∝ 1/σ_x,符号由 corr 定,β 的截面秩是成交规模与 corr 符号的交互,线性中性化去不掉,这条论证成立。两个变体都是单部件:变体 1 只换成 cross_corr(与 head 0.73,≥ 0.5,走替换通道);变体 2 只换 x 的字段(与 head 0.90,与已知族 0.30)。依据偏弱有两处,第 1 次已指出,PI 未改。一是「同骨架方向一半 +1、一半 −1,所以方向没被识别」:heads 表里方向 +1 的 7 个 y 腿都是 inv(cs_demean(·)),方向 −1 的 7 个都是掩码或 robust-z,inv 在极点两侧把顺序翻了过来,方向的分裂由 y 腿就能解释。二是 loc 里两腿一起换 Volume→Amt 的结果混进了 y 腿的变化,PI 已在文中自认这不是单部件。没有 knockout 直接把 1/σ_x 单独量出来,所以给 3,不给 4。'
  - head: 'cross_regbeta(day_last(in_sum_rolling(Volume, 10)), inv(cs_demean(day_distinct_ratio(in_sum_rolling(Volume, 10)))), 10)'
    soundness: 4
    reasons: '本组没有改。common.py 的 inv 就是 1/x,没有保护;cs_demean 之后,贴近当日均值的股票 y 会爆掉。loc 里 day_distinct_ratio(in_sum_rolling(Volume, 10)) 的 distinct 是 0.032,是格点量。去掉 inv 得 +0.09,去掉 cs_demean 得 +0.10,两者都塌,这是 train 上的直接证据:分数依赖 1/(d − 当日均值) 这个爆炸项。所以这个部件是烂的,依据够 4。三个变体各动一个部件:变体 2 换 cross_corr(与 head 0.80),变体 3 只换 x 的字段(0.97)。要提醒的是变体 1:cs_winsor 截到 1% / 99%,与 head 的日度秩 |ρ| 是 0.997。原因是 y 的重尾里第 99 百分位本身仍是很大的爆炸值,而饱和在 1.0 的大多数股票 y = 1/(1 − m_t) 是同一条序列,截断碰不到它们。所以这个变体几乎必然与 head 同分,「低 ≥ 0.5」的判据大概率不会触发,也不能替换(需要 +0.1)。它基本是一次信息量很低的评估,不能拿它的「没塌」去证明极点是真信号。如果想让它有区分力,应当换成在极点附近有界的写法,例如 cs_rank 或 tanh 型压缩代替 inv;这只是建议,不影响通过。'
  - head: 'cross_regbeta(cs_normalize(day_std(Volume)), cs_mask_top_replace_mean_neg(cs_mask_top_replace_mean_neg(cs_robust_z(day_distinct_ratio(Volume)))), 15)'
    soundness: 3
    reasons: '【PI 是否按第 1 次意见改了】改了,而且改的是内容,不只是说法。上一稿两腿一起换成 Amt,y 腿的 day_distinct_ratio(Amt) 读的是另一件事(零成交分钟占比),与原 head 只有 0.21。这一稿照审计意见只换 x 腿的字段,y 腿一字不动。PI 自己更正了上一稿「必然 ≥ 0.5」的错误,还事先说定:与原 head < 0.5 就删掉本组。新相关度表给变体与原 head 原始 0.754、残差 0.789,≥ 0.5,前提成立,走的是替换通道,库里 head 个数不变;与已知族 0.13、流动性 0.10、市值 0.01。【核对】(1) Amt = 价格 × 成交量,分钟间价格只差几个百分点,day_std(Amt) ≈ 当日价格 × day_std(Volume),成立。(2) nd_cs.py 的 cs_normalize 是逐日线性 z-score,(x − 截面均值)/截面标准差(ddof = 1),去不掉个股自己的尺度,成立。(3) rolling_ols 给 β = cov/var_x,所以 |β| ∝ 1/σ_x;股数口径下 σ_x ∝ 成交额尺度 / 价格,|β| 里乘着名义价格。与库里 `cs_mask_top_replace_mean_neg(cs_mask_top_replace_mean_neg(day_quantile(Open)))`、`ts_sum(LogFloatShares, 30)` 是同一条价格线,机制说得通。(4) 单部件:双层掩码与 1/σ_x 都没动。(5) 判据:+1.194 = 原 head 1.09 + 0.1 的替换门槛,写对了。【为什么只给 3】第一,没有 train 证据说明价格这一块是烂的。PI 自己承认,train 1.89 / valid 1.09 与去掉 cs_normalize 后的 1.94 / 0.77 只说明 x 的尺度在承重,不说明是价格那一块。第二,PI 预期与原 head 0.80–0.92,实际 0.75,原因在 cs_normalize。z 值 = (a_i,t − m_t)/s_t,截面右偏,多数股票的 a_i,t 远小于 m_t,它们 15 日的 σ_x 有一个全市场共同的下限 σ(m_t/s_t)。所以 |β| ∝ 1/L_i 只对成交尺度较大的股票成立;对小股票,换字段改变的是哪些股票落在这个下限里,而不是乘上 P_i。Volume 截面与 Amt 截面的形状不同,m_t、s_t 也一起变了。因此判据「≤ +0.79 ⟹ 至少 0.3 来自价格项」只是近似,结果要读成「股数口径 x(含价格与截面形状)承重」。第三,本轮是 3 轮里的最后一轮,判据里「下一轮把同族股数口径 x 一并当烂部件处理」没有下一轮可以执行,这一支只能作为结论记录。第四,若变体胜出替换,新 head 的 |β| 里剩下的尺度正是成交额尺度,即已知族 `cross_mean(day_std(Amt), 30)` 那个量,和 corr 符号的交互。这正是 PI 在 R1 组攻击的 1/σ_x 极点;与已知族的线性 |ρ|(0.13)看不出这种交互。所以「赢了库不会变坏」只对「去掉价格」成立,对 1/σ_x 不成立,替换后的 head 仍要等 R1 变体 1(cross_corr)的结果来判断。机制清楚、算子实现了它、窗口没动,够 3;没有 train 或文献证据直接指向价格这一块,不给 4。'
  - head: 'ts_sum(cross_stddev(day_std(Ret), 60), 1)'
    soundness: 4
    reasons: '本组没有改。乘性近似 std_60(σ) ≈ mean_60(σ)·CV_60(σ) 成立。这个 head 与波动控制 0.56(PI 引 r2 表),是波动水平的非线性函数(陷阱 3),这个部件是烂的。依据在 train 上:r2 R 组直接评估的 60 日 CV 是 +1.04(1.04 / 1.11),与已知族 0.085,去掉尺度后大部分分数还在。两个变体只改 cross_stddev 的输入,cross_stddev 与恒等的 ts_sum(·, 1) 都不动,是单部件。表上的效果:变体 1 / 2 与 head 都是 0.83(≥ 0.5,走替换通道),与波动控制从 0.56 降到 0.19 / 0.26,说明 log 与 cs_demean 确实拿掉了尺度。要注意两点。一是变体第二像的是 W² 族 `ts_mean(pow_2(day_wmean(Ret, Ret)), 50)`(0.62 / 0.67),比 head 本身更靠近 W² 族。二是 log 在 |x| ≤ 1e-9 时返回 NaN,全封日被跳过;部分封板日 log σ ≈ −11.5,会抬高 60 日标准差,变体对此比 head 敏感。所以变体若掉分,先怀疑封板日,再下「去尺度没用」的结论。'
  - head: 'cs_mask_top_replace_mean_neg(cs_mask_top_replace_mean_neg(day_quantile(Open)))'
    soundness: 3
    reasons: '本组没有改。nd_cs.py:cs_mask_top_replace_mean_neg = −cs_mask_top_replace_mean(−x),把每天最低 10% 的值换成当日均值,非单调;叠两层,就是把最低约 20% 搬到均值附近。dt_day 的 day_quantile 默认 q = 0.5,即分钟开盘价的日中位数,也就是后复权价格水平。单层 +0.44、双层 +0.93、三层 +0.70(三层 valid 掉到 0.70)这个阶梯是 train 上的旁证,保序的极值处理不会这样。变体只去掉两层掩码,是单部件,1 次评估。扣分的地方:「被 LogFloatCap 控制推回多头腿」没有证据;变体与 head 只有 0.40,不能替换,只能在 ≥ 1.03 时作为新 head 收录;而裸价格与流动性 0.46、与已知族 0.42、与市值 0.42,接近控制的换写,真被收录反而不好。作为诊断可以接受。'
summary: '只有 R3 被重写,而且按第 1 次意见改了内容:只换 x 腿字段,与原 head 0.75,走替换通道,合理度 3,通过。a 位 3/4(划掉 3、8、10、13,剩 11)、b 位 3/4(不划,剩 14)、R1(3)、R2(4)、R4(4)、R5(3)都没有改,维持通过。'
