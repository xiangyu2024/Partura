    hypothesis: '交易活跃度本身的不稳定(对流动性的不确定)预测收益,方向预期 −1:日成交量 / 成交额在几十个交易日里相对它自己的均值起伏越大,后续越差。
      文献:Chordia–Subrahmanyam–Anshuman 2001 发现成交额与换手率的**变异性**(标准差与变异系数)与预期收益显著负相关,控制规模、账面市值比、动量与成交**水平**之后仍在;
      Pereira–Zhang 2010 对价格冲击型流动性的波动给出同号的证据,并给了一个理性解释(能择时交易的投资者从流动性的起伏里得到期权价值,所以要求的回报更低)。
      A 股还有一条投机机制:Mei–Scheinkman–Xiong 2009 用 A / B 股溢价表明 A 股的换手主要是投机性的、在卖空受限下抬高价格;Barber–Odean 2008 表明散户的买入集中在吸引注意力的股票上
      (异常成交、极端收益)。成交脉冲频繁的股票反复成为注意力买入的对象而被高估,融券受限又让空头腿难以套利。
      算子实现:变异系数 div(cross_stddev(day_sum(Volume), d), cross_mean(day_sum(Volume), d)),d = 20 / 60 / 120 —— 流通股本在窗口里不变时,股数口径与换手率的变异系数恒等
      (分子分母同除股本),成交额口径 day_sum(Amt) 对应 CSA 的美元成交额变异系数;对数口径 cross_stddev(log(day_sum(Volume)), 60);冲击口径 cross_stddev / cross_mean(abs_(ts_delta(log(day_sum(Volume)), 1)), 60);
      按方向拆开 cross_semistd_pos / neg(day_sum(Volume), 60)(ops_ext 原子:日对数变化的上 / 下半标准差)—— 上半是「成交脉冲」(注意力),下半是「成交枯竭」;
      脉冲与典型日之比 div(cross_max(day_sum(Volume), 20), cross_med(day_sum(Volume), 60));以及 Pereira–Zhang 口径的价格冲击型流动性 div(day_std(Ret), day_sum(Amt))
      (每单位成交额对应的波动,Amihud 比率的日内版)的 60 日变异系数。
      三条对冲写在种子里:(i) 在 30 日成交额十分位内、在 LogFloatCap 十分位内排变异系数(cs_bucket_rank)—— Liu 2006 的零成交度量要按换手水平调整,这里用十分位内排序非线性地去掉
      流动性与市值的水平(陷阱 3);(ii) cs_regres 把成交量的 60 日变异系数对 σ 的 60 日变异系数取逐日截面残差 —— 混合分布假说下量与波动同受信息流驱动,两者相关,
      这一条只留「量在大起大落而波动没有」的部分,与本轮另一个位(风险的不确定)分开。
      为什么和库不同:库里成交量的信息只出现在 14 个 cross_regbeta head 里,用的是**当日**分钟成交量的离散度 day_std(Volume) 或尾盘 k 分钟成交量的**水平**,
      与离散网格量 day_distinct_ratio(Volume) 做 10–15 日回归,同一骨架里方向一半 +1、一半 −1;已知族 cross_mean(day_std(Amt), 30) 也是日内离散度的水平。
      本位第一次用**跨日**、**无量纲**的成交变异性,而且不经过回归斜率 cov/var(x) 的 1/var(x) 极点。
      定位里那一族的拆解(cs_normalize 去掉 x 的绝对尺度,从 0.77 升到 1.09;两条腿单独都不是因子)提示它读到的一部分可能就是「x 的跨日变异性」,本位用干净的写法直接量它。
      为什么样本外还会在:CSA 2001 是控制成交水平之后仍成立、二十多年前就发表的结果,不是在本数据上挖出来的;A 股的散户投机与融券约束是制度性的;
      纯多头十分位买的是成交稳定的股票,超额来自全体里被注意力推高的名字;种子只用 20 / 60 / 120 日常规窗口,没有幂次、没有凸变换。
      风险:小盘股成交更脉冲,变异系数与流动性 / 市值可能有 0.3–0.5 的负相关(所以有十分位内版本);成交脉冲常与价格大幅变动同时出现,与 20 日反转控制可能有 0.2–0.3 的相关;
      2018-01 至 2018-02 的 120 日窗口不满,只用到预热期以来的天数(NaN 安全的滚动)。'
