  - type: N
    hypothesis: '「风险本身有多不确定」(vol-of-vol,对风险的不确定)是一个独立于波动水平的定价量:日波动 σ 相对它自己的起伏越大的股票,后续越差(方向预期 −1)。
      机制与文献:Baltussen 等 2018 用个股隐含波动率的月度标准差度量「对风险的不确定」,高组比低组每年跑输约 8%,独立于约 20 个波动类效应,而且在卖空约束最松的分组里最弱、不显著
      —— 读法是高不确定的股票被高估、空头腿受限的错误定价。A 股没有个股期权,本位改用分钟数据的已实现波动 day_std(Ret)。
      与库里已有结构的关系(这是本位要解决的核心问题):库里的 head `ts_sum(cross_stddev(day_std(Ret), 60), 1)` 是同一输入的**未去尺度**写法。乘性尺度下
      std_60(σ) ≈ mean_60(σ) × CV_60(σ),所以它的截面秩有很大一块就是波动水平 —— r2 的相关度表里它与波动控制的日度秩 |ρ| 是 0.56,是波动的非线性函数(规则 §4 陷阱 3),
      是 r2 R 组用一个明写波动的空对照替换进库的。r2 R 组同时直接评估过去尺度那一半:`ts_sum(div(cross_stddev(day_std(Ret), 60), cross_mean(day_std(Ret), 60)), 1)`
      score +1.04(train 1.04 / valid 1.11),与波动控制 0.18、与已知族 0.085;同组用 day_durbin_watson(High)(方差尺度)算的变异系数是 −0.30 ——
      信息在 σ 的**相对**起伏里,不在方差尺度的尖刺里。这是本种子到现在唯一一个去掉波动尺度后 train 与 valid 都 ≥ 1.0 的量。但 60 日 CV 与上面那个 head 同分子、同窗口,
      日度秩 |ρ| 大概率 ≥ 0.7,会被库禁令挡掉,所以种子里**不放** 60 日水平的变异系数,改用那个 head 在构造上给不出的四种写法:
      (1) 对数波动的冲击,即随机波动模型里的 ξ:cross_stddev(ts_delta(log(day_std(Ret)), 1), 60),稳健版 cross_mean / cross_med(abs_(ts_delta(log(day_std(Ret)), 1)), 60),
      以及先取 5 日均值、再取 5 日对数变化的周频版 cross_stddev(ts_delta(log(cross_mean(day_std(Ret), 5)), 5), 60)。log 让它无量纲(Andersen 等 2003:对数已实现波动近似正态,
      是做离散度的自然尺度);差分去掉 head 里占大头的慢变水平与趋势;周频版按 Barndorff-Nielsen–Shephard 2002 关于已实现方差测量误差的结果,先聚合再差分,压掉 σ̂ 自身的抽样噪声。
      (2) 按符号拆开:cross_semistd_pos / cross_semistd_neg(day_std(Ret), 60) 是 ops_ext 里现成的原子,恰好等于「σ 的日对数变化的上 / 下半标准差」,
      把「风险突然跳高」与「风险突然消失」分开(Bollerslev–Li–Zhao 2020 对收益做的好 / 坏半方差拆分,搬到波动本身)。
      (3) 短窗与其他估计量的变异系数:day_std(Ret) 的 20 日 CV、日内振幅 log(day_max(High)/day_min(Low)) 的 20 日 CV、成交额加权波动 day_wstd(Ret, Amt) 的 20 日 CV,
      以及 cs_demean(log(day_std(Ret))) 的 20 日标准差 —— 先减去当日全市场的平均对数波动,拿掉所有股票共有的波动起伏,只剩个股自己的风险不确定。
      (4) 持续性与日内口径:cross_autocorr(log(day_std(Ret)), 60, 1) —— 恒等式 var(Δlog σ) = 2·var(log σ)·(1 − ρ₁) 说明 (1) 混合了离散度与持续性,这一条把持续性那一半单独交给 GP;
      日内 30 分钟滚动波动 in_stddev_rolling(Ret, 30) 的当日变异系数的 20 日均值(当日内部的 vol-of-vol,当日量而不是 60 日时序量)。
      另有两条非线性对冲:cs_bucket_rank 在 20 日波动十分位内排 20 日 CV —— 把波动水平按十分位清零(陷阱 1/3);在 30 日成交额十分位内排 Δlog σ 的离散度
      —— 薄交易股的 σ̂ 抽样噪声大,不能让奖励把「流动性的非线性函数」当成新信息(陷阱 3)。
      为什么和库不同:库里 24 个 head 是波动水平的凸尾(6 个,W 与 DW 的高次幂)、未去尺度的波动离散度(1 个,上面那个)、成交量离散度的回归斜率(14 个 cross_regbeta)、
      价格 / 股本水平(3 个);没有一个是无量纲的风险不确定性,也没有一个用到 σ 的对数变化、符号拆分或自相关。没有凸变换,没有 pow_*,不用 day_durbin_watson。
      为什么样本外还会在:(a) 机制是高不确定股票被高估 + 空头腿受限,A 股的融券约束是制度性的,不随样本期变化;纯多头十分位买的是风险稳定的股票,它们相对全体等权的超额,来自全体里那些被高估的名字;
      (b) 去尺度之后不再吃低波动的多头腿,不靠在 train 上挑出来的凸度 —— 现成证据是 60 日 CV 的 valid 1.11 ≥ train 1.04;(c) 种子只用 5 / 20 / 60 日常规窗口,没有幂次和调过的常数。
      先说清的风险:Δlog σ 版里有一部分是 σ̂ 的抽样噪声,它随分钟收益的峰度与薄交易变大;若 GP 往那里长,会滑向 W² 族或流动性,所以放了成交额十分位内的版本。'
