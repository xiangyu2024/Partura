R:
  - head: 'cross_regbeta(day_std(Volume), cs_mask_top_replace_mean_neg(cs_robust_z(day_distinct_ratio(Volume))), 15)'
    why: '两个部件,每个变体只动一个。(1) cross_regbeta 的 1/σ_x:common.py 的 rolling_ols 给 β = cov/var(x) = corr·σ_y/σ_x,分母只有 > EPS 的保护。
      y 是掩码后的 robust-z,σ_y 有界;x = day_std(Volume) 的 15 日标准差 ∝ 成交量尺度,所以 |β| ∝ 1/流动性尺度,而 corr 两种符号都有 ⟹ β 的截面排序是流动性的非单调函数,
      线性中性化去不掉(陷阱 3)。旁证:同骨架 14 个 head 方向一半 +1、一半 −1(方向没有被识别);loc 拆解里 y 腿单独是门槛废品、x 腿单独与已知族 0.57 —— 分数只出现在比值里。
      Frazzini–Pedersen 2014 的标准做法是把 β 写成 ρ·σ_i/σ_m、两部分分开估计再收缩,不直接用未收缩的裸斜率做横截面特征。
      变体 1 只把 cross_regbeta 换成 cross_corr:共动的信息一字不改,只拿掉 σ_y/σ_x。判据:≥ +1.30 ⟹ 换进一个没有极点的写法;< +0.5 ⟹ 这一族的分数就是尺度。
      (2) x 用股数口径:Amt = Volume × 价格,σ(Volume) 里藏着名义价格(1/σ(Volume) ≈ 价格/σ(Amt)),与库里价格 / 股本水平的 head 同一条线。
      loc 拆解里两腿一起换 Volume→Amt,在三个同族 head 上是 1.199→0.989、1.215→0.638(方向还翻了)、1.094→1.371,不一致说明价格项在承重;那是两腿一起换,不是单部件。
      变体 2 只换 x 的字段,y 不动。'
