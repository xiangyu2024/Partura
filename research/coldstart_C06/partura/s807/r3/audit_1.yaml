slots:
  - slot: a
    novelty: 3
    soundness: 4
    struck_seeds: [3, 8, 10, 13]
    reasons: '【创新度 3】输入和库里 head `ts_sum(cross_stddev(day_std(Ret), 60), 1)` 一样都是 day_std(Ret),但做的是去尺度(CV、log 差分、上 / 下半标准差、减截面均值),不是改窗口、改字段或单调变换:CV = std/mean 会改变截面排序。相关度表里,保留下来的种子与该 head 原始 0.38–0.64、残差 0.37–0.62,与波动控制只有 0.00–0.30(PI 引 r2 表,该 head 自身是 0.56)。这是说得出理由的实质改进(拿掉波动水平),够 3。够不到 4:输入相同,而且除种子 11(0.30)外每个种子都与某个 head 的 |ρ| > 0.3。「低相关不等于新」要说清一点:PI 为压 σ̂ 抽样噪声准备的周频写法(种子 3、8,先做 5 日平均再差分)恰好被表划掉(对这个 head 0.743 / 0.733)。这说明日频 Δlog σ 种子离 head 的那段距离(0.60–0.62),有一部分就是 σ̂ 的抽样噪声。这部分噪声随分钟收益的峰度和最小价位变动而变大,表里也看得到:Δlog σ 类种子第二像的 head 是 W² 族的 `ts_mean(pow_2(day_wmean(Ret, Ret)), 50)`(0.54–0.64);种子 4、5、7 与 `ts_sum(LogFloatShares, 30)` 原始 0.55–0.57、残差 0.46–0.47,而按 r2 定稿的说法,这个 head 中性化后约等于 −log 价格。【合理度 4】逐个核对了算子:ops_ext 的 _semistd 就是 sqrt(mean(max 或 min(log(x_t/x_{t−1}), 0)²)),不去均值,要求 x_t、x_{t−1} 都 > 0,窗口内不少于 3 天,PI 的描述是对的;div(cross_stddev, cross_mean) 就是 CV;cs_demean 减的是当日截面均值;cs_bucket_rank 在十分位内排百分位,再加 1e-4 倍全局秩破并列,输入都不是常数,不会出列序斜坡(陷阱 2 不适用);没有 pow_*、signedpower、day_durbin_watson(陷阱 1 不适用);与 5 个控制最大 0.42(市值),陷阱 3 的线性部分不突出。窗口 20 / 60 是常规值。证据有两条:Baltussen 等 2018 的文献;r2 R 组对 60 日 CV 的直接评估,train 1.04 / valid 1.11,与已知族 0.085(R_prev.json)。不给 5 的理由:(a) 已实现 σ̂ 的 vol-of-vol 与隐含波动的「对风险的不确定」不是同一个量,σ̂ 噪声那一块在样本外怎么表现说不清;(b) 有一条没处理的污染路径:涨跌停封板日 day_std(Ret) 是 0 或接近 0。CV 类(1、12、14)会把 0 算进均值和标准差;log 类(2、4、6、7、9、15)在接近 0 时 log 是很大的负数,一次部分封板就能主导 60 日的 Δlog σ 离散度,把信号拉向「封板频率」;(c) 与市值普遍是 0.28–0.42,本位只有波动和成交额十分位两种对冲,没有市值或价格十分位。【划掉】3、8 是表规则:与 `ts_sum(cross_stddev(day_std(Ret), 60), 1)` 0.743 / 0.733,≥ 0.7,GP 库禁令也会拒。10 `cross_autocorr(log(day_std(Ret)), 60, 1)`:持续性不是「对风险的不确定」。恒等式只是把离散度拆成两半,并没有给 ρ₁ 本身一个定价机制。ρ₁ 低主要说明 log σ̂ 里独立噪声占比高(薄交易),表里它与流动性 0.30、与已知族 0.29,是本位最高的,实际上是流动性或估计噪声的代理;60 日 lag-1 自相关的标准误约 1/√60 ≈ 0.13,本身也很噪。13 `cross_mean(div(day_std(in_stddev_rolling(Ret, 30)), day_mean(in_stddev_rolling(Ret, 30))), 20)`:量的是日内波动的季节形态(开盘和午后开盘的尖峰)与跳跃聚集,不是跨日的风险不确定。实现上 rolling_windows 在左侧补 NaN,每天第 1 分钟的 30 分钟 std 恒为 0,前 29 分钟都是 1–29 个点的小样本 std,开盘段把机械成分带进了 CV。表里它对控制取残差后最像 `ts_sum(LogFloatShares, 30)`(残差 0.584,是本位最高的残差之一),其次是 `cross_mean(cs_winsor(pow_2(day_wmean(Ret, Ret))), 10)`(0.541),也就是控制之后剩下的是价格档位和跳跃,不是本位的 idea。划完剩 11 个(1、2、4、5、6、7、9、11、12、14、15)。【建议,不影响通过】给 Δlog σ 类加一条价格十分位对冲 cs_bucket_rank(·, sub(LogFloatCap, LogFloatShares)),也就是在名义价格的对数里分档,处理最小价位离散;log 类以 cross_med 版为主写法,抵抗封板日。'
    revise: '—'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '【创新度 3】输入是跨日的日成交量 / 成交额,机制是交易活跃度的变异性(CSA 2001)。库里 14 个 cross_regbeta head 用的是日内的 day_std(Volume)、尾盘 in_sum_rolling、day_distinct_ratio 做回归斜率,已知族是日内离散度的水平,机制都不同;相关度表里 cross_regbeta 族没有一个进入任何种子的前三。但与所有 head 的 |ρ| < 0.3 的只有种子 6、7、9、14(0.30 / 0.26 / 0.14 / 0.13)。主体种子 1、2、5、12 与 vol-of-vol head `ts_sum(cross_stddev(day_std(Ret), 60), 1)` 是 0.47 / 0.51 / 0.56 / 0.52(残差 0.42–0.47):混合分布假说下量与波动都由信息流驱动,这一块与库重叠。所以按标准是 3(同一类输入 Volume、机制不同),不是 4;Δlog V、semistd_neg、cs_regres 这几条单看达到了 4 的水平。【合理度 4】算子核对:CV 的写法正确;`cross_semistd_pos/neg(day_sum(Volume), 60)` 在 ops_ext 里就是日对数变化的上 / 下半 RMS,要求值 > 0,零成交日自动排除;cs_regres 是 nd_cs.py 里的逐日截面 OLS 残差;cs_bucket_rank 同 a 位;没有凸变换,也没有常数进 cs_*(陷阱 1、2 不适用);与 5 个控制最大 0.32(市值),流动性不超过 0.25,十分位版(12、13)把流动性 / 市值压到 0.00 / 0.01(陷阱 3 有对冲)。窗口 20 / 60 / 120 是常规值。证据:CSA 2001(控制成交水平后仍为负)和 Pereira–Zhang 2010,都在 2023-08-08 之前。本数据上还没有 train 的证据,所以不给 5。风险(都不是陷阱,不划):(a) Volume 是股数口径,窗口里有送转时成交股数按比例跳升,CV、Δlog V、semistd_pos 都会被这一次公司行为抬高。PI 写了「流通股本在窗口里不变时」这个前提,但没处理;Amt 口径(2、12)不受影响,GP 若偏向股数口径要留意;(b) 新股上市后成交量会衰减,开板日成交巨大,60 / 120 日 CV 因此很大,与上市年龄相关,可以用 ListAge 对冲;(c) 种子 10 与反转控制 0.31、与波动 0.29,因为成交脉冲常伴随大涨大跌。'
    revise: '—'
R:
  - head: 'cross_regbeta(day_std(Volume), cs_mask_top_replace_mean_neg(cs_robust_z(day_distinct_ratio(Volume))), 15)'
    soundness: 3
    reasons: '核对了 common.py 的 rolling_ols:beta = cov/var_x,唯一的保护是 var_x > 1e-9。x = day_std(Volume) 以股数计,它的 15 日 σ_x 随成交规模放大;y 是掩码后的 robust-z,有界。所以 |β| ∝ 1/σ_x、符号由 corr 定,β 的截面秩是流动性规模的非单调函数,线性中性化去不掉,这条论证成立。变体 1 只换成 cross_corr,是干净的单部件检验(与 head 0.73);变体 2 只换 x 的字段(与 head 0.90,与已知族 0.30),也是单部件。依据偏弱的地方有两处。一是「同骨架方向一半 +1、一半 −1,所以方向没被识别」不成立:heads 表里方向 +1 的 7 个 y 腿都是 inv(cs_demean(·)),方向 −1 的 7 个都是掩码或 robust-z,inv 在极点两侧把顺序翻了过来,方向的分裂由 y 腿就能解释。二是 loc 里两腿一起换 Volume→Amt 的结果,混进了 y 腿 distinct_ratio(Amt) 的变化(见 R3 组),不能当作价格单位的证据。另外没有一个 knockout 直接把 1/σ_x 单独拿出来。所以给 3。'
  - head: 'cross_regbeta(day_last(in_sum_rolling(Volume, 10)), inv(cs_demean(day_distinct_ratio(in_sum_rolling(Volume, 10)))), 10)'
    soundness: 4
    reasons: 'common.py 里 inv 就是 torch.divide(1.0, x),没有保护,cs_demean 之后贴近当日均值的股票 y 会爆掉。loc.json 里 day_distinct_ratio(in_sum_rolling(Volume, 10)) 的 distinct 是 0.0316,是格点量。去掉 inv 得 +0.089,去掉 cs_demean 得 +0.101,两者都塌,这是 train 上的直接证据:分数依赖 1/(d − 当日均值) 这个爆炸项。补一点:饱和在 1.0 的股票,y_t = 1/(1 − m_t) 是全市场同一条序列,对它们 β 就是 cov(x_i, 市场序列)/var(x_i),同样落在 1/σ_x 上,变体 2(换成 cross_corr)正好检验这一点。变体 1 的 cs_winsor 逐日截到 1% / 99%、保序,只动极点(与 head 0.997),判据写清楚了;变体 3 只换 x 的字段(0.97)。三个变体各动一个部件。'
  - head: 'cross_regbeta(cs_normalize(day_std(Volume)), cs_mask_top_replace_mean_neg(cs_mask_top_replace_mean_neg(cs_robust_z(day_distinct_ratio(Volume)))), 15)'
    soundness: 2
    reasons: '前提与事实不符。PI 写的是「与原 head 的 ρ 必然 ≥ 0.5,会触发替换,库里 head 的个数不变」;但 loc.json 的 swap 行给这个变体的 rho_head 是 0.0739,本轮相关度表给它与原 head 0.212(与整个库最大也只有 0.274)。所以它不会替换,而是在 score ≥ 1.194、与已知族 0.318 < 0.5、与库 < 0.7 都满足时作为新 head 收录:原 head 留在库里,库多出一个。原因在于两腿一起换了字段,而 y 腿从 day_distinct_ratio(Volume) 换成 day_distinct_ratio(Amt) 并不是「去掉价格单位」。Volume 是整手的格点,distinct 比例读的是分钟成交手数有多离散;Amt = 价格 × 成交量几乎处处不同,distinct 比例大多饱和在 1.0,只剩零成交分钟造成的重复,读的是另一件事(零成交分钟的占比)。如果某天过半股票饱和,cs_robust_z 的 MAD = 0,会退化成除以 EPS 的极点(这一点未核实,但变体的结构允许发生)。价格单位的论证只对 x 腿成立。这个变体还保留了 PI 在 R5 组里攻击的双层掩码、在 R1 组里攻击的 1/σ_x。实际效果是借 R 通道把 loc 里一个 train / valid 都已知更高的数收录进库,不是去掉烂部件。机制(x 腿里有价格)说得通,但算子改动没有实现它,所以给 2。要能通过:像 R1 变体 2 那样只换 x 腿,写成 cross_regbeta(cs_normalize(day_std(Amt)), cs_mask_top_replace_mean_neg(cs_mask_top_replace_mean_neg(cs_robust_z(day_distinct_ratio(Volume)))), 15),并在相关度表上确认它与原 head ≥ 0.5。'
  - head: 'ts_sum(cross_stddev(day_std(Ret), 60), 1)'
    soundness: 4
    reasons: 'std_60(σ) ≈ mean_60(σ) · CV_60(σ) 这个乘性近似成立。PI 引 r2 相关度表,这个 head 与波动控制是 0.56(≥ 0.5 就是控制换了个写法)。R_prev.json 里去尺度的 60 日 CV 是 +1.04(train 1.04 / valid 1.11),与已知族 0.085:去掉尺度后大部分分数还在,说明 head 里「波动水平」那一块是可以拿掉的部件,依据有 train 上的量。两个变体只改输入:加 log 让 std 近似 CV(与 head 0.83);再加 cs_demean 去掉全市场共同的波动起伏(0.83)。外层 ts_sum(·, 1) 和 cross_stddev 都不动,是单部件。注意一点:day_std(Ret) 在部分封板日接近 0,log 给出很大的负值,所以变体对封板日比 head 敏感(head 里这种日子只贡献约一个均值大小的偏差)。如果变体分数掉得多,先怀疑这一点,再下「去尺度没用」的结论。'
  - head: 'cs_mask_top_replace_mean_neg(cs_mask_top_replace_mean_neg(day_quantile(Open)))'
    soundness: 3
    reasons: '核对了 nd_cs.py:cs_mask_top_replace_mean_neg = −cs_mask_top_replace_mean(−x),把每天最低的 10% 换成当日均值,是非单调的;叠两层,就是把最低约 20% 的价格搬到均值附近。单层 +0.44、双层 +0.93、三层 +0.70(三层 train 1.01,valid 掉到 0.70)这个阶梯是 train 上的旁证,保序的极值处理不会这样。dt_day.py 里 day_quantile 默认 q = 0.5,变体就是分钟开盘价的日中位数,只去掉两层掩码,是单部件。扣分的地方:「被 LogFloatCap 控制推回多头腿」这一说没有证据;变体与 head 只有 0.40,按 R 规则它不能替换,只能在 ≥ 1.03 时作为新 head 收录,而裸价格与流动性 0.46、与已知族 0.42、与市值 0.42,接近控制的换写,真被收录反而不好。作为 1 次评估的诊断可以接受。'
summary: '两个 N 位都过:a 位 3/4,划掉 3、8、10、13,剩 11 个;b 位 3/4,一个不划,剩 14 个。R 组 R1、R2、R4、R5 过;R3 删掉,因为它「必然替换」的前提与相关度表矛盾(与原 head 0.21),而且两腿一起换字段没有实现价格单位的论证,合理度 2。'
