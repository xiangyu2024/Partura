      - 'mul(sub(1.0, cs_bucket_rank(sub(LogFloatCap, LogFloatShares), LogFloatCap)), cs_rank(cross_mean(day_skew(Ret), 20)))'
  - type: N
    hypothesis: '机制:日内量价动态。放量伴随的价格变动更可能是非信息性的流动性冲击,流动性提供者吸收之后会回吐;缩量的价格变动更可能来自知情交易,会延续。Campbell-Grossman-Wang 1993 的成交量—收益自相关模型:高成交量日的收益更容易反转。Llorente-Michaely-Saar-Wang 2002 把个股层面的这种关系和信息不对称联系起来:在 r(t+1) = c0 + c1·r(t) + c2·V(t)·r(t) 里,对冲型交易主导的股票 c2 为负(放量收益反转),投机或知情交易主导的 c2 为正(放量收益延续)。这里把这个日频模型搬到分钟:每天用 241 根分钟线度量「当天的价格变动有多少落在放量分钟上、放量分钟的收益之后是延续还是回吐」,再取 10–60 日均值,作为股票的特征。
      算子怎么实现:(1) day_corr(Ret, Volume),分钟收益与分钟成交量的相关;正值表示上涨分钟放量、下跌分钟缩量。(2) sub(day_wmean(Ret, Volume), day_mean(Ret)),成交量加权的分钟收益减等权的,等于分钟收益与相对成交量的协方差,也就是当日价格变动里由重成交分钟贡献的那部分。(3) sub(day_topw_mean(Ret, Volume), day_mean(Ret)),成交量最大的 10% 分钟的平均收益减全天平均。(4) day_corr(Ret, in_delay(mul(Ret, Volume), 1)),下一分钟收益与上一分钟「成交量 × 收益」的相关,就是 LMSW 回归里 c2 在分钟级的直接对应。(5) day_corr(abs_(Ret), Volume),成交量与价格波动的绑定程度,是信息型交易的强度。外层用 cross_mean / cross_ema 取 10、20、60 日;cs_bucket_rank 在市值或波动桶内排序的版本作对照,保证结果不是规模或波动的替身。方向交给 sign。
      为什么和以前不一样:快照第 1 批的共性表全是静态日频字段 LogFloatShares 的包装,没有任何分钟级量价联合结构进入。这里的输入是分钟 Ret 与 Volume 的日内联合分布,机制是流动性冲击的回吐,与名义价格、规模无关。和 5 个控制比:20 日反转控制的是收益的总量,这里度量的是收益在日内按成交量怎么分配,相关系数版本与收益总量近似无关;波动、流动性、成交额波动三个控制都是二阶矩或水平,而 day_corr 无量纲。预期这些种子与各控制的 |ρ| 都明显低于 0.5,与快照的 0 个 head 无从相关。
      为什么样本外还会在:放量收益的回吐是对提供流动性的补偿,只要市场里有大量非信息性交易者,它就存在;A 股成交的大头来自散户,这个前提在 2023 年后没有变。它不是会被一次性套利掉的定价错误。度量用相关系数和协方差,对样本外成交额整体水平的变化不敏感。20 日平均让信号换手适中,15bp 成本可以承受。'
    inspired_by: '文献:Campbell-Grossman-Wang 1993、Llorente-Michaely-Saar-Wang 2002 的成交量—收益动态。快照方面:第 1 批共性表里只有静态日频字段,分钟立方体的量价联合结构完全没被用到。'
