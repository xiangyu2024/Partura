      - {title: 'Dynamic Volume-Return Relation of Individual Stocks', authors: 'Llorente, G.; Michaely, R.; Saar, G.; Wang, J.', year: '2002', url: 'https://doi.org/10.1093/rfs/15.4.1005', treatment: 'r(t+1) 对 V(t)·r(t) 的交互系数度量放量收益是延续还是反转;这里搬到分钟级,写成 day_corr(Ret, in_delay(mul(Ret, Volume), 1))'}
