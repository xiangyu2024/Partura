      - {title: 'The January Anomaly: Effects of Low Share Price, Transaction Costs, and Bid-Ask Bias', authors: 'Bhardwaj, R.; Brooks, L.', year: '1992-06', url: 'https://ideas.repec.org/a/bla/jfinan/v47y1992i2p553-75.html', treatment: '低价效应与规模、价差、波动缠在一起:在波动、流动性桶内再排序,把这些替身隔开'}
