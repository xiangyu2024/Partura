  - type: N
    hypothesis: '机制:名义股价幻觉(低价股效应)。A 股交易以散户为主,投资者按「每股多少钱」而不是按市值判断贵贱,把低价股当成上涨空间更大、偏度更高的彩票;Birru-Wang 用拆股做的干净检验显示,名义价格一降,投资者对未来偏度的预期就跳升,而事后实际偏度反而下降。结果是低价股被系统性高估、高价股被低估。每股价格由送转、拆股这类公司行为维持,不由基本面决定(Weld 等 2009),所以它是一条与市值不同、变得很慢的横截面特征。
      算子怎么实现:本环境的价格字段是后复权的,名义价格只能从两个字段拼出来:sub(LogFloatCap, LogFloatShares) = log(流通市值 / 流通股本) = log(未复权股价);或者 div(day_sum(Amt), day_sum(Volume)),因为 Amt 与 Volume 是原始口径,两者之比是未复权均价。为了不让它变成市值的非线性重写(已知陷阱 3),主种子用 cs_bucket_rank(价格, LogFloatCap),也就是每天在流通市值十分位桶内对价格排序。输出在每个市值桶里都是均匀分布,top 十分位里各市值档占的份额相同,线性中性化挡不住的非线性规模暴露被直接拿掉;这就是 DGTW 1997 特征匹配基准的做法。cs_regres(价格, LogFloatCap) 是 OLS 残差版的对照。
      第二组种子先在市值桶内排序,再在波动(cross_mean(day_std(Ret), 20))、流动性(cross_mean(day_sum(Amt), 30))、上市年龄(ListAge)、总市值的十分位桶内再排一次,逐个隔开「低价 = 高波动 / 高价差 / 次新」这些已知替身(Bhardwaj-Brooks 1992 指出低价效应与价差、规模缠在一起)。
      第三组按 Birru-Wang 与 Bali-Cakici-Whitelaw 2011,把价格轴和彩票特征组合起来:彩票特征是 20 日日内分钟已实现偏度 cross_mean(day_skew(Ret), 20),以及 20 日最大日收益按涨跌停幅度 LimitWidth 归一。组合方式有秩相减和「低价 × 高偏度」交互两种。低价且高偏度、或接近涨停的股票,是幻觉最强的地方。方向不写死,交给奖励的 sign。
      为什么和以前不一样:快照第 1 批共性表的 7 行全是单字段 LogFloatShares 的单调包装或单字段窗口归约(inv / abs_ / log / pow_2 / ts_max / ts_decay_linear),这些写法在秩上等价,score 均值挤在 0.465–0.486,没有一个子树组合过两个字段。流通股本被市值控制中性化以后,能剩下的只有 −log 名义价格加上非线性的规模残差,两者混在一起。这里把价格显式写成两个字段之差,并在市值桶内排序,把价格轴和规模残差拆开。这是对那一簇的实质改进,能说清为什么:它去掉的正是那一簇里属于陷阱 3 的部分。主种子与市值控制的秩相关按构造约等于 0。
      为什么样本外还会在:来源是散户对每股价格的认知偏差,加上 A 股做空受限带来的套利限制,不是数据里的巧合。价格水平靠公司行为维持、变得极慢,信号换手低,15bp 成本吃不掉多少。桶内排序已经去掉规模的非线性部分,剩下的不是小盘溢价的另一种写法,所以不依赖规模风格在样本外是否延续。'
    inspired_by: '快照第 1 批的共性表:7 行全是 LogFloatShares 的单字段单调包装,score 均值卡在 0.465–0.486、差一点到 0.5,而且没有一个候选组合过两个字段。流通股本被市值中性化后剩下的是 −log 名义价格加非线性规模残差。文献:Birru-Wang「Nominal Price Illusion」、Weld 等「The Nominal Share Price Puzzle」。'
