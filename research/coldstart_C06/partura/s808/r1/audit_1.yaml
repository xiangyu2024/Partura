    soundness: 4
    struck_seeds: [2, 7, 9, 11]
    reasons: '创新度 3。快照里 0 个 head,相关度表对 head 的原始 / 残差全是 0.00,不能拿来证明新;能比的只有 M 第 1 批的存档。那一簇是 inv / abs_ / log / pow_2 / ts_max / ts_decay_linear 包装的 LogFloatShares,均值 0.465–0.486。奖励(steer.py 的 neutral_residual)先对信号做 z-rank,再对 z-rank 后的控制做线性残差。rank(-LogFloatShares) = rank(logP - LogFloatCap),所以那一簇的残差本来就是「给定市值的名义价格」。本位的主种子 1/3/4/8 是同一个量,输入并不新。新的有两点。(i) 用 cs_bucket_rank 做非参数的市值条件:ops_ext.py 里它在 LogFloatCap 的每个十分位内做 _pct_rank,桶内均匀分布;表上 seed 1 的 size 0.000、seed 5 的 vol 0.002、seed 6 的 liq 0.005 都证实了这一点,线性残差留下的非线性规模(陷阱 3)被拿掉了。(ii) 种子 10、12 把价格轴和 20 日分钟已实现偏度组合成「低价 × 彩票」,M 批次里没有这个机制。按 §3 算「对已有结构有实质性的改进,并说得出为什么」,给 3;输入和 M 那一簇相同,到不了 4。
      合理度 4。逐个算子核对过。dailyfields.py:LogFloatCap = log(FloatCap),LogFloatShares = log(FloatShares),两者相减就是 log 未复权股价。label.py 和 daily.py 都写明生产库的价格字段是后复权,Amt、Volume 是原始成交额和股数,所以 div(day_sum(Amt), day_sum(Volume)) 确实是未复权日均价;表上 seed 3 与 seed 1 的五个控制相关几乎逐位相同(0.274/0.056/0.088/0.224/0.000),也印证了这一点。cs_bucket_rank 实现的就是 DGTW 式桶内条件秩。day_last(Close) 是后复权收盘价,seed 11 的日收益跨除权日是连续的。机制清楚,算子实现了它;价格是慢变量,20 日均值的窗口合理。证据有两类:2023-08 以前的文献(Birru-Wang、Weld 等),以及 M 批次那一簇在 train 和 valid 上约 0.48 的分数,这就是这条价格轴在同一奖励下的样本内证据。所以给 4。不给 5 的原因:样本内分数分不清「名义价格幻觉」和 A 股低价股的壳价值 / 困境溢价;2020 年底退市新规(含面值退市)以后,极低价股的风险性质变了,方向在 train 和 valid 之间可能不一致,而 score 取两段中较差的那一段。
      划掉的种子。2:cs_regres(价格, LogFloatCap) 是原始值的 OLS 线性残差,奖励自己还会对 rank(LogFloatCap) 再做一次线性残差。它就是 M 那一簇换个写法,M 已经评过 14 次以上;它还留着本位说要去掉的非线性规模,和本位自己的主张相反。9:两步 OLS 去掉的 LogFloatCap 和波动本来就在奖励的 5 个控制里,效果和 2 相同。7:按 ListAge 分桶会掉进陷阱 2。dailyfields._list_age 给库首日前就已上市的股票一律记成 10000 + 已过天数,同一天里这些股票的值完全相同;_pct_rank 用稳定 argsort 按列序打破平手,所以多数股票的十分位是按股票代码顺序(板块 / 代码段)切的,不是按上市年龄,做不到「隔开次新」。表上它的 liq 0.33、size 0.20 都比 seed 1 高,也符合按代码段分桶的样子。11:20 日最大日收益 / LimitWidth 和波动控制的相关是 0.452。MAX 本身就是特质波动的单调替身(Bali 等自己就指出两者高度相关);取秩相减以后,多头腿是「高价 + 低 MAX」,正是陷阱 1 和陷阱 3 说的低波动多头腿从线性中性化的缝里漏回来。剩下 1/3/4/5/6/8/10/12,共 8 个。提醒一点:10 和 12 用的是分钟级偏度,它受相对最小价位影响;低价股的分钟收益更离散、零值更多,所以价格 × 偏度的交互里有一部分是 tick size 的机械效应。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: [1, 3, 7, 8, 9]
    reasons: '创新度 4。输入是分钟 Ret 与 Volume 的日内联合分布,机制是放量收益的回吐或延续(Campbell-Grossman-Wang 1993、Llorente 等 2002)。库里 0 个 head;M 第 1 批的共性表只有静态的 LogFloatShares,没有任何分钟量价结构。输入和机制都不同,和所有 head 的 |ρ| 都低于 0.3,所以给 4。不给 5:CGW、LMSW 本身,以及 A 股的分钟量价相关类因子,2023 年以前都已经有了。
      合理度给 3 而不是 4。机制清楚,10–60 日的窗口合理。算子都按计划说的工作:day_corr;day_wmean(用 |w| 加权,见 ops_ext.py);day_topw_mean(取成交量前 10% 的分钟);in_delay(日内移位,首分钟为 NaN)。扣分有三点。(i) 计划说「相关系数版本与收益总量近似无关」,并预期「与各控制的 |ρ| 都明显低于 0.5」,相关度表推翻了这个说法:day_corr(Ret, Volume) 的 20 日均值与 20 日反转的相关是 0.525,topw 版 0.575,夏普化版 0.51,市值桶内版 0.503,wmean 版 0.493。同期的量价相关主要是在复述这段时间的收益本身:成交量集中在大波动的分钟,日内漂移为正时大波动分钟多半是正收益。所以这四个种子是反转控制的换写法。(ii) CGW 和 LMSW 的结论是日频的;搬到分钟以后,成交量主要来自开盘集合竞价 bar 0(label.py 特意把它剔掉了)和尾盘集合竞价,加权类和相关类统计都会被这几根 bar 支配。Ret 在 bar 0 是否包含隔夜跳空,我从代码里确认不了;如果包含,wmean 和 corr 版本测到的其实是隔夜收益,那是另一个机制。(iii) seed 4 的 mul(Ret, Volume) 用的是原始股数,日内量级相差几个数量级,皮尔逊相关会被一两分钟决定。文献是日频的,分钟版本的证据不足以给 4。
      划掉的种子。1/3/8/9 与反转控制的相关 ≥ 0.5,表上会自动划掉,本审计同意,它们就是控制的换写法。7:cross_ema(day_corr(Ret, Amt), 10) 就是被划掉的 seed 1,只是把 Volume 换成 Amt、把 20 日均值换成半衰期 10 的 EMA,是同一个对象;表上 0.45 只因为窗口短了一点才没过线,算换皮。保留的种子:2(0.493,正是 CGW 所说「重成交分钟承载的那部分收益」的直接写法,和反转相关在意料之中,奖励会线性去掉这部分);4(LMSW c2 的分钟版,与各控制都 ≤ 0.2,是本位最干净的种子);5;6;10(|Ret| 与成交量的绑定,liq 0.432、known 0.426 偏高,机制是信息强度 / 价格冲击,勉强算在 LMSW 信息不对称那一侧);11;12。共 7 个。建议(不影响通过):在 GP 里用 in_slice 剔掉 bar 0 和尾盘集合竞价;成交量先取 in_rank 或除以日内均量,再进 mul 或 wmean。'
    revise: '—'
