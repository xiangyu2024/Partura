slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [2, 3, 8, 9, 13]
    reasons: '创新度 3:E 位比的是外围。快照里含该核心的外围只有 {}、{ts_max}、{ts_max, cs_bucket_zscore(按核心自己的 40 日峰值分桶)},都在放大同一核心的峰值;本位外围按外部特征(未复权日均价 div(day_sum(Amt), day_sum(Volume))、当日换手、分钟波动、零收益占比)再分桶去掉替身通道,再加水平 / 冲击分解和排除筛子,要做的事确实不同。相关度表只部分支持这一点:按价格配对的 1/5/6/7 与 head 原始最大 |ρ| 0.41–0.51(核心本身与 H2 0.826),残差前三里不再出现 H3/H5;冲击版 10/11 与所有 head 原始 ≤ 0.12、残差 ≤ 0.17。但按换手配对(2:原始 0.699,残差与 H3 0.814、H2 0.806;8:0.677,残差 0.799 / 0.797)、按波动配对(3、9:0.87)以及单纯取水平(R1 v8:0.912)基本还是 H2,说明「用水平、不用峰值」本身不产生新东西。同一输入、机制不同且说得出理由,给 3;多数留下的种子与 head 仍在 0.4–0.6,够不到 4。合理度 3:逐个核对算子。cs_bucket_zscore(y, x) 按 x 的 _pct_rank 分十分位,桶内做 (y−μ)/σ;未复权日均价作为相对 tick 的分桶变量成立;sub(cross_mean(·, 5), cross_mean(·, 60)) 和 cross_zscore(·, 60)(含当天的 60 日均值 / 标准差)确实写出了 Amihud 的冲击;cs_last_high10 / cs_last_low20 经 _lexi 把整块 tie 的头 10% / 尾 20% 降为 rank−1,确实是排除筛子。机制(Harris 1991 的三条通道;LOT / Amihud 的水平与冲击)清楚,20–60 日窗口合理。不给 4 的原因:(1) 嵌套 cs_bucket_zscore 的第二层按全市场的 B 十分位分桶,不是在市值桶内再分桶,所以不是 DGTW 的顺序配对,会部分抵消第一层的市值条件化:种子 4 的 size 从核心的 0.008 回到 0.398,2、8 回到 0.19。(2) 按价格配对后,波动暴露从核心的 0.188 升到 0.544(1)、0.536(7)、0.590(12):剥掉 tick 通道后,剩下的主要是波幅通道,正是陷阱 1/3 说的低波动多头腿;本位 GP 只看 score,会被往这条缝里拉,产出必须查 vol 暴露。(3) 13 的 cs_last_low20(…, LogFloatCap) 在市值上造了一个 20% 的阶梯,size 0.686,是陷阱 3 的直接构造;12 的 vol 0.59 继承自 1。(4) 10/11 与 20 日反转 0.477 / 0.458,贴着线;Amihud 的冲击本来就和同期收益相关,可以留,但要盯。(5)「配对后的离散度」这个合成量没有 train 证据,文献支持的是零收益频率和 Amihud 水平本身。划种子:2、8 的原始相关只是擦着 0.7 过去,残差与 H3、H2 ≥ 0.80,在奖励看来就是库里那一簇的换皮;3、9 按波动配对后与 H2 0.87,换皮;13 是陷阱 3。表另外划掉 1、7、12(vol ≥ 0.5)。剩 4、5、6、10、11 共 5 颗;核心与控制最大 0.396(liq)< 0.5。4 保留但有保留意见:与 H3、H5 原始 0.596,size 0.398;按零收益配对后剩下的「网格 × 波幅」在市值桶内就是名义价格,把这一位想剥掉的东西又拿了回来,它的诊断作用 R1 v4 已经覆盖。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [5, 6]
    reasons: '创新度 4:库里 6 个 head 只有两条轴:静态规模(H3/H4/H5/H6,LogFloatShares / LogFloatCap 的包装)和分钟价格的平手结构(H1/H2 的 day_distinct_ratio(Ret),H3 里的 day_flat_run_max)。本位读的是剔除集合竞价后 5 分钟收益的带符号三阶形状(day_skew),以及相对符号跳跃变差 (RV⁺−RV⁻)/RV,机制是彩票偏好 / 概率加权;输入和机制都不同。相关度表:划完剩下的 11 颗与所有 head 的原始 |ρ| ≤ 0.227(4 号),残差 ≤ 0.18,满足 4 分要求的 < 0.3。不给 5:Amaya 等 2015、Bollerslev 等 2020 就是这个机制。合理度 4:逐个核对算子。in_slice(x, a, b) 返回 x[:, a:b+1],在 241 根的网格上 1..237 是 09:31–14:57,去掉了带隔夜跳空的 bar 0 和尾盘集合竞价;in_pct(Close, 5) 是同一天内的 Close[t]/Close[t−5]−1,从 6 开始切,保证分母不是开盘集合竞价价;day_skew 是 nan 安全的总体偏度;div(day_sum(mul(r, abs_(r))), day_sum(mul(r, r))) 正好是 (RV⁺−RV⁻)/RV;cs_bucket_rank 在 x 的十分位内给 y 算百分位秩;cs_last_high10 把 20 日里贴着最低价最久的 10%(整块 tie)降为 rank−1,在 neg(偏度) 的写法下确实把跌停封板推出多头;ts_skew 作用在后复权日收益的比值上,平移不改变偏度。重叠的 5 分钟收益,其偏度近似是 5 分钟收益边际分布偏度的一致估计,回应了第 1 轮审计提的网格噪声问题;价格十分位内排序的 7 号又把 tick 通道隔开了一次。20 / 60 日均值、半衰期 10 的窗口合理。没有落进 §4:偏度无量纲,与 vol 最大 0.34;没有常数进 cs_*;不是规模、波动、流动性的函数。有 2023-08 之前的文献证据,给 4。不给 5:文献里溢价主要在空头腿(高偏度被高估),纯多头书只吃低偏度那一腿,PI 自己也把预期放得保守,说不清多头腿在样本外为什么还会在。划种子:5、6 是不带条件的 RSJ,它是按当天 RV 缩放的带符号收益和,取 20 日平均就是波动调整后的 20 日收益,与反转控制 0.590 / 0.487,是反转控制的非线性改写(和陷阱 3 同类);1 分钟的 6 号还受 PI 自己指出的网格噪声影响。按 20 日收益十分位排序的 9 号(rev 0.012)才是 RSJ 的干净写法,保留。4 号(1 分钟偏度)作为网格噪声的对照保留。剩 11 颗。'
    revise: '—'
R:
  - head: 'ts_max(ts_max(cs_bucket_zscore(day_distinct_ratio(Ret), LogFloatCap), 40), 40)'
    soundness: 3
    reasons: '可疑部件是只对 LogFloatCap 条件化的原子。8 个变体各只换一个部件,保留 ts_max∘ts_max 外壳,分数差可以归因;算子实现了所说的替换(1–5 再做一层或两层 z 化;6 的 neg(day_zero_ratio(Ret)) 只留停滞通道;7 的 day_distinct_ratio(Close) 只留访问过的价位数;8 把峰值换成 60 日水平)。依据是 Harris 1991 的三条通道,加上本轮相关度表的旁证:核心的残差与 H5、H3 分别有 0.828 / 0.764,说明 H2 有很大一块是名义价格 / 股本那一簇;按价格配对的 v1 与 H2 只剩 0.27,v5 与所有 head ≤ 0.32。但 PI 怀疑的换手、波动通道在 H2 里几乎不存在:v2 与 H2 0.805、v3 0.913,把它们配掉信号基本不变,这两颗涨 0.1 的机会小,主要是对照。v8 的依据是拆解里外层窗口 40→80 让 score 从 0.82 升到 0.86。风险:v1 的 vol 0.394,若 v1 / v5 作为新 head 收录,要先查它的分数是不是剥掉 tick 通道后露出来的低波动腿(陷阱 1)。不到 4:说这个部件烂,目前只有理论和相关度,没有 score 证据,PI 自己也写了零证据。'
  - head: 'ts_max(ts_max(cs_bucket_zscore(day_distinct_ratio(Ret), ts_max(cs_bucket_zscore(day_distinct_ratio(Ret), LogFloatCap), 40)), 40), 40)'
    soundness: 3
    reasons: '可疑部件是外层 cs_bucket_zscore 的 y 用了没有条件化的 day_distinct_ratio(Ret)。分桶变量 ts_max(cs_bucket_zscore(day_distinct_ratio(Ret), LogFloatCap), 40) 与市值无关,在桶内对生离散度做 z 化,会带回生离散度自带的规模 / 价格倾斜。这是陷阱 3 的机制,说得通。变体只把 y 换成 H2 里已有的市值 z 化子树,其余不动,算子实现了这个替换。旁证:loc 拆解里把分桶变量里的同一个子树换成生的 day_distinct_ratio(Ret),H1 从 +1.45 掉到 −0.73(必要性 +2.19),说明在这个结构里用生的离散度是有害的;本轮相关度表里变体与 H1 只有 0.54,说明 y 这一处确实承载了 H1 的很大一部分变化。只花 1 次评估;要到 +1.55 才能替换,机会不大,主要价值是诊断 H1 有多少来自规模倾斜。'
  - head: 'cross_mean(cross_quantile_q50(cross_tail_mean_q75(cross_quantile_q50(cross_mean(LogFloatShares, 15), 241), 15), 241), 15)'
    soundness: 1
    reasons: '被去掉的四层 cross_quantile_q50 / cross_tail_mean_q75 确实是烂部件,依据扎实:第 1 轮同一字段的裸 5 日均值 cross_sum(div(LogFloatShares, 5), 5) 得 +0.6046,高于 H5 的 +0.5662。但留下来要评估的 cross_mean(LogFloatShares, 15) 就是 §4 陷阱 3 点名的市值字段本身:与 size 控制的 |ρ| 0.779(≥ 0.5,按 §3 就是控制换个写法),与 H3 0.997、H5 0.978。PI 说它到不了 +0.67 的替换线,只用来读出它与 H3、H5 的 ρ;这一点相关度表已经读出来了(H3、H5 与裸股本水平是同一个东西),再花一次评估没有新信息。万一过线,结果是用一个更纯的陷阱 3 表达式替换 H5,库不会变好。真正该记下的是:H3、H5 本身就是股本水平,也就是规模的非线性改写。这不是 R 能修的,应写进笔记,不再在这条轴上花算力。'
summary: 'a(E,核心 cs_bucket_zscore(day_distinct_ratio(Ret), LogFloatCap))与 b(N,剔除集合竞价的 5 分钟已实现偏度 / RSJ)都放行:a 按价格配对和冲击的外围确实离开了 H2,但会露出波动通道,划掉换皮与陷阱后剩 5 颗;b 新而且算子实现正确,划掉两颗属于反转改写的 RSJ;R 组里 H2、H1 两组放行,H5 那组的裸股本变体是陷阱 3,而且它要做的诊断相关度表已经给出,不放行。'
