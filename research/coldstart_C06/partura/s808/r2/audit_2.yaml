  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [5, 6]
    reasons: '本位与第 1 次逐字相同,重新核对后分数与划法不变。
      创新度 4:库里 6 个 head 只有两条轴:静态规模(H3–H6,LogFloatShares / LogFloatCap 的包装)和分钟价格的平手结构(H1/H2 的 day_distinct_ratio(Ret),H3 里的 day_flat_run_max)。本位读的是剔除集合竞价后 5 分钟收益的带符号三阶形状(day_skew)与相对符号跳跃变差 (RV⁺−RV⁻)/RV,机制是彩票偏好 / 概率加权,输入与机制都不同。相关度表:留下的 11 颗与所有 head 原始 |ρ| ≤ 0.227(4 号,与 H3),残差 ≤ 0.18,满足 4 分的 < 0.3。第 1 轮名义价格位里 cross_mean(day_skew(Ret), 20) 只当过组合里的配角(1 分钟、含 bar 0),没有进共性表前 20,也没有成为 head,不构成「库里已有」。不给 5:Amaya 等 2015、Bollerslev 等 2020 就是这个机制。
      合理度 4:逐个核对算子。V2 网格 241 根,索引 1 = 09:31,in_slice(x, a, b) 返回 x[:, a:b+1],1..237 = 09:31–14:57,去掉带隔夜跳空的 bar 0 和尾盘集合竞价;in_pct(Close, 5) = Close[t]/Close[t−5]−1,前 5 根为 NaN,从 6 开始切保证分母不是开盘竞价价;day_skew 是 nan 安全的总体偏度(全天封板时 std=0 得 NaN,被 cross_mean 跳过);div(day_sum(mul(r, abs_(r))), day_sum(mul(r, r))) 正好是 (RV⁺−RV⁻)/RV;cs_bucket_rank 在 x 的十分位内算 y 的百分位秩(加 1e-4 全局秩破 tie);ts_delta(log(day_last(Close)), 20) 是后复权 20 日对数收益,按它的十分位排序(8、9)把与反转控制的重叠拿掉(rev 0.006 / 0.012);按 cross_mean(day_std(Ret), 20) 分桶(10)就是波动控制本身,vol 0.006;ts_skew 作用在日收益比值上,平移不改变偏度。重叠的 5 分钟收益,其样本偏度是 5 分钟收益边际偏度的一致估计,回应了网格噪声;7 号再在未复权价十分位内排一次。窗口 20 / 60 日、半衰期 10 合理。不落进 §4:偏度无量纲,与 vol 最大 0.34,不是规模、波动、流动性的函数,没有常数进 cs_*。有 2023-08 之前的文献证据,给 4。不给 5:文献里溢价主要在空头腿(高偏度被高估),纯多头书只吃低偏度一腿,说不清多头腿样本外为什么还在。
      一处实现偏差(不划):12 号的 cs_last_high10(neg(偏度), cross_mean(day_at_min_ratio(Close), 20)) 想推出的是跌停封板,但 20 日均值会把单日封板稀释成约 0.05,而低价、窄幅的票每天在最低价上停留的分钟占比本来就高(在两三个 tick 间来回),所以这 10% 主要是网格最粗的票,不是封板票(vol 从 1 号的 0.26 升到 0.34 也说明筛掉的是低波幅一端)。想筛事件应该用 cross_max(day_at_min_ratio(Close), 20) 或计数。它仍是偏度信号加一个筛子,不是陷阱,保留。
      划种子:5、6 是不带条件的 RSJ,按当天 RV 缩放的带符号收益和取 20 日均值,按构造就是波动调整后的 20 日收益,与反转控制 0.590 / 0.487,是反转控制的非线性改写(陷阱 3 同类);1 分钟的 6 号还带网格噪声。同一位里有按 20 日收益十分位排序的干净写法 9 号(rev 0.012),保留它。4 号(1 分钟偏度)作网格噪声对照保留。剩 11 颗。'
    revise: '—'
R:
  - head: 'ts_max(ts_max(cs_bucket_zscore(day_distinct_ratio(Ret), LogFloatCap), 40), 40)'
    soundness: 3
    reasons: '与第 1 次相同。可疑部件是只对 LogFloatCap 条件化的原子。8 个变体只换一处:1–5 在市值 z 化之后再按未复权均价 / 当日换手 / 分钟波动 / 零收益占比做一层或两层 z 化,6 换成只剩停滞通道的 neg(day_zero_ratio(Ret)),7 换成只剩访问价位数的 day_distinct_ratio(Close),8 把 ts_max∘ts_max 换成 60 日均值;外壳不动,分数差可以归因。依据是 Harris 1991 的三条通道,加上表里的旁证:核心的残差与 H5、H3 分别 0.828 / 0.764,说明这个原子在奖励眼里大半是名义价格 / 股本那一簇,与库里已有 head 重复;按价格配对的 v1 与 H2 只剩 0.267,v5 与所有 head ≤ 0.32。表也显示 PI 怀疑的换手、波动通道在 H2 里几乎没有分量:v2 与 H2 0.805、v3 0.913,配掉它们信号基本不变,这两颗主要是对照;v6 与 H2 0.963,说明 H2 本质上就是市值桶内的零收益频率峰值,若 v6 过线替换,库里留下的是一个更好解释的写法。风险:v1 的 vol 0.394,若 v1 / v5 以新 head 收录,要先查分数是不是剥掉 tick 通道后露出的低波动腿(陷阱 1)。不到 4:说这个部件烂,只有理论与相关度,没有 score 证据。'
  - head: 'ts_max(ts_max(cs_bucket_zscore(day_distinct_ratio(Ret), ts_max(cs_bucket_zscore(day_distinct_ratio(Ret), LogFloatCap), 40)), 40), 40)'
    soundness: 3
    reasons: '与第 1 次相同。可疑部件是外层 cs_bucket_zscore 的 y 用了没有条件化的 day_distinct_ratio(Ret):分桶变量与市值无关,桶内对生离散度 z 化会把它自带的规模 / 价格倾斜带回来,是陷阱 3 的机制,说得通。变体只把 y 换成 H2 里已有的市值 z 化子树,其余不动,算子实现了这个替换;变体 size 0.010,与 H1 0.539,说明 y 这一处承载了 H1 的很大一块变化。旁证要打折:loc 拆解里 H1 从 +1.45 掉到 −0.73 的那次,换掉的是分桶变量 x 里的条件化,不是 y,只能说明在这个结构里用生离散度有害,不能直接证明 y 这处是烂的。只花 1 次评估;要到 +1.55 才能替换,机会不大,主要价值是诊断 H1 有多少来自规模倾斜。'
summary: '本稿与第 1 次相比只按规则删了 H5 那组 R,两个位未改;重新核对后 a(E,市值 z 化离散度核心,按价格 / 换手配对与冲击外围)仍为 3/3 放行,但改正我第 1 次的不一致多划掉把名义价格拿回来的种子 4,剩 5、6、10、11 恰好 4 颗,产出须查 vol 与 rev 暴露;b(N,剔除竞价的 5 分钟已实现偏度 / RSJ)4/4 放行,划掉两颗反转改写的 RSJ;R 两组各 3 分放行。'
