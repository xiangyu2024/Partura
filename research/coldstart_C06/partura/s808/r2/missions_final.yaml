  hypothesis: 机制:日内收益分布的不对称,即彩票偏好。按 Barberis-Huang 2008 的概率加权,投资者高估小概率的大涨,愿意为正偏的股票付溢价;正偏股票因此被高估,事后收益低。A
    股散户占比高、融券难,这种高估套利不掉。Amaya 等 2015 用日内 5 分钟收益算已实现偏度,它预测下一期横截面收益,方向为负。Bollerslev-Li-Zhao
    2020 用上行与下行已实现半方差之差(相对符号跳跃变差 RSJ),得到同向且更稳的结果。负偏的一侧是日内急跌,对应急于卖出的一方付给流动性提供者的补偿;在纯多头书里,多头腿的来源在这一侧。文献里两腿都有贡献、空头腿更大,而本奖励只看多头腿,所以预期分数放得保守。
    算子怎么实现:先把收益里的开盘集合竞价 bar 0 和尾盘集合竞价剥掉。in_slice(Ret, 1, 237) 是 09:31–14:57 的 1 分钟收益;in_slice(in_pct(Close,
    5), 6, 237) 是同一时段的 5 分钟(重叠)收益,不含隔夜跳空。用 5 分钟,是因为本种子的轴 B 已经说明,这个立方体里的分钟统计被 0.01
    元网格支配:低价股的 1 分钟收益只取几个离散值,三阶矩会被网格噪声淹没(第 1 轮审计也指出过)。5 分钟加总把网格噪声压下去,这也是 Amaya 等用
    5 分钟收益的原因。(1) 偏度:day_skew(上面的收益),取 cross_mean 20 / 60 日或半衰期 10 的 cross_ema。(2)
    RSJ:div(day_sum(mul(r, abs_(r))), day_sum(mul(r, r))) = (RV⁺ − RV⁻)/RV,无量纲,取 20
    日均值。(3) 去替身的条件版,用 cs_bucket_rank 在四种十分位内排序:未复权均价十分位(去 tick 通道);20 日对数收益 ts_delta(log(day_last(Close)),
    20) 十分位(偏度和同期收益有机械重叠,去掉与 20 日反转控制共享的部分);分钟波动十分位;换手十分位(彩票需求随关注度变,隔开关注度)。(4) 封在跌停上会机械地制造负偏,而封板是另一种事件(Chen
    等 2019)。所以把 20 日里贴在日内最低价时间最长的 10% 推出多头:cs_last_high10(neg(偏度), cross_mean(day_at_min_ratio(Close),
    20)),按预期方向(sign +1 = 做多低偏度)写。(5) 日频对照:20 日日收益偏度 ts_skew(…, 20),即 Boyer-Mitton-Vorkink
    2010 的低频版本。除第 (4) 颗外,方向都交给奖励的 sign。 为什么和以前不一样:库里 6 个 head 只有两条轴。一条是静态规模(LogFloatShares
    / LogFloatCap 的包装与折叠);另一条是分钟价格的平手结构(day_distinct_ratio / day_flat_run_max),数的是收益值重复多少次、报价多久不动。偏度和
    RSJ 读的是非零变动的带符号三阶形状:零收益分钟只改变偏度的大小,不决定它的符号,平手结构决定不了它。第 1 轮两个位都没有拿分钟收益的带符号高阶矩当主信号;偏度只在名义价格那一位的组合里当过配角,用的还是含
    bar 0 的 1 分钟收益。预期与所有 head 的 |ρ| < 0.3,与 5 个控制的 |ρ| < 0.5:偏度无量纲,与波动、成交额的水平无关;与反转的重叠由收益十分位版本处理。具体以相关度表为准。
    为什么样本外还会在:来源是投资者偏好(概率加权)加卖空限制,不是数据里的巧合。Amaya 等的样本覆盖 1993–2013,对多种控制稳健;Bollerslev
    等的结果在 2010 年代仍成立。A 股的散户结构和融券难在 2023-08 之后没变。度量无量纲,对成交额整体水平的变化不敏感;20–60 日平均让换手适中。
