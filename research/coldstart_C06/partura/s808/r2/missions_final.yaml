  why: 可疑的部件是峰值里面那一层:原子 day_distinct_ratio(Ret) 只对 LogFloatCap 做了条件化。这个原子同时随价格网格变粗而降、随成交频率升高而升、随波动升高而升(Harris
    1991)。只按市值分桶,价格、换手、波动三条通道都原样留着;后两条是奖励的控制,奖励只线性去掉,而一个 [1/n, 1] 的饱和函数会把非线性部分漏回来(陷阱
    1/3 的饱和版)。23 次拆解一次也没换过字段或条件轴,这个问题目前零证据。变体保持 H2 的 ts_max∘ts_max 外壳不动,分数差只来自换掉的那个部件:1–4
    在市值 z 化之后再按未复权均价(相对 tick)/ 当日对数换手 / 当日分钟波动 / 零收益占比做第二层 z 化;5 连配价格和换手两层;6、7 把原子换成单通道的(neg(day_zero_ratio(Ret))
    只剩成交活跃度;day_distinct_ratio(Close) 是当天访问过的价位数,只剩网格 × 波幅);8 把 ts_max∘ts_max 换成 60
    日均值。ts_max 在这里是 distinct 闸门的开门器,没有经济含义(拆解:去掉它就没有分数);LOT / Amihud 定价的是平均水平,而 H2
    自己的窗口 40→80 分数从 0.82 升到 0.86,说明越接近水平越好。判读:1–3 若保住 ≥ 0.8,轴 B 是真来源,干净版可替换 H2;若都掉到
    0.3 以下,H2 是控制的改写,第 3 轮不再投它。
