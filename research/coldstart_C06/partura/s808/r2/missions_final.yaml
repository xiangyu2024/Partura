  hypothesis: '核心是「当天分钟收益取到多少个不同值」在同市值十分位里的 z 分(核心卡 #5;H1 里把它跳掉,必要性 +2.19)。机械上 day_distinct_ratio(Ret)
    是三条通道叠在一起的(Harris 1991):(i) 相对最小变动价位:未复权价越低,0.01 元网格越粗,收益值越容易重复;(ii) 成交活跃度:没成交的分钟收益恰为
    0,只占一个值;(iii) 日内波幅:以 tick 计的区间越宽,访问的价位越多。库里 H2 的 sign 是 −1,多头腿是同市值里最不离散的票,方向与
    LOT / FHT 一支一致:零收益和停滞报价度量的是交易成本,非流动性水平带溢价(Lesmond 等 1999;Amihud 2002)。问题在于核心只对市值做了条件化。通道
    (ii)(iii) 正好是奖励里流动性、波动两个控制管的东西,奖励只把它们线性去掉;而 day_distinct_ratio 是 [1/n, 1] 上的饱和函数,非线性的那部分会漏回来(规则
    §4 陷阱 1/3,只是凸变换换成了饱和变换)。通道 (i) 就是名义价格,第 1 轮已经测过:市值桶内价格秩的候选均值是 −0.29,在本奖励下不值钱。所以
    H2 现在的分数分不清是「交易成本溢价」,还是「低换手 / 低波动多头腿从线性中性化的缝里漏回来」。 外围做三件事。(1) 特征匹配,也就是 DGTW 1997
    的顺序配对:在核心外面再套一层 cs_bucket_zscore 或 cs_bucket_rank,分桶变量分别用未复权均价 div(day_sum(Amt),
    day_sum(Volume))(相对 tick,对应 Holden 2009 拆 tick 通道的做法;Amt、Volume 是原始口径,第 1 轮相关度表证实这条写法与
    size 的 ρ 为 0.000)、当日对数换手 sub(log(day_sum(Amt)), LogFloatCap)、当日分钟波动 day_std(Ret)、零收益分钟占比
    day_zero_ratio(Ret)。种子 5 连配价格和换手两层,种子 8、9 用 40 日水平分桶。配完剩下的是:同市值、同价格网格、同换手的同行里,谁的报价更停滞。这才是
    LOT 意义上的成本,不是控制的替身。按零收益占比配的那颗(种子 4)把停滞(零)和网格 × 波幅(非零值的重复)拆开,看溢价跟哪一半走。(2) 用水平,不用峰值:Amihud
    2002 定价的是预期非流动性,即一段时间的平均水平,所以聚合用 cross_mean / cross_ema / cross_quantile_q50(20–60
    日)。再按 Amihud 的「水平 vs 冲击」分解,用时间序列差分写冲击:sub(5 日均值, 60 日均值) 和 cross_zscore(5 日均值,
    60)。Amihud 的结论是两者符号相反,要分开估;这里不像 H1 那样按自己的 40 日峰值分桶。(3) 可交易性筛子:最停滞的票里混着封板、准停牌的票(day_flat_run_max
    的源码注释举的就是封板 240 分钟),它们的收益由事件决定。cs_last_high10(neg(水平), cross_mean(day_flat_run_max(Close),
    20)) 把 20 日最长不动段最长的 10% 推出多头;cs_last_low20(neg(水平), LogFloatCap) 按 Liu-Stambaugh-Yuan
    2019 的做法,把壳价值污染最重的最小市值 20% 推出多头。这两颗写在 neg 之后,按预期方向(sign +1 = 做多低离散)设计;奖励若选了反方向,被筛掉的票会进多头,这本身就是证伪。
    为什么和以前不一样:快照里含这个核心的候选,外围只有 {}、{ts_max}、{ts_max, cs_bucket_zscore} 三种。H2 取 79 日滚动峰值;H1
    按自己的 40 日峰值分十分位再 z 化;两者做的都是放大同一核心的峰值。没有一个候选按价格、换手、波动或零收益占比配过对,没有用过平均水平和时间序列差分,也没有筛子。本位外围用到的算子(div、day_sum、log、sub、day_std、day_zero_ratio、cross_mean、cross_ema、cross_quantile_q50、cross_zscore、cs_bucket_rank、cs_last_high10、cs_last_low20、neg、day_flat_run_max)与已有外围几乎不重合,要做的事也相反:已有外围在放大,这里在剥离替身。多了一层配对,与
    H2 的相关应当下降,具体以相关度表为准。核心已在市值十分位内 z 化,与 size 控制的相关按构造约为 0。 为什么样本外还会在:如果配完还在,它度量的是同等活跃度、同等价格网格下的报价停滞,也就是交易成本本身。交易成本溢价是持有难交易资产的补偿;A
    股 0.01 元 tick、T+1、散户主导这些制度在 2023-08 之后没有变,它不依赖一次性的定价错误。水平信号变得慢,20–60 日平均让换手低,15bp
    吃不掉多少。如果配完就没了,说明轴 B 是控制的饱和改写,第 3 轮就不再押它。'
