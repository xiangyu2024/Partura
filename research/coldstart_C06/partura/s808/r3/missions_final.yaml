- type: E
  core: day_kurt(Ret)
  hypothesis: 核心 day_kurt(Ret) 是当天 241 根分钟收益的超额峰度 m4/m2² − 3(alphacube/operators/common.py
    的 _kurt)。它无量纲:分母是二阶矩的平方,所以不是波动水平换个写法(陷阱 1 里 day_durbin_watson ≈ 已实现方差那条通道在这里不成立),读的是「当天的价格变动有多集中在少数几根
    bar 上」。它是 H3(+1.10)的真正载体,证据都在 loc.md:H3 四处 knockout 改的都是 kurt 以外的部件,必要性只有 +0.05
    / −0.02 / +0.07 / +0.07;kurt 以外那部分的各级子树单独评估 −1.55 / +0.24 / −1.09 / −1.77;H3 的另一项
    cross_mean(cs_last_low10(…), 241) 值域在 (−1, 1],而 kurt 的截面跨度是几到几十,所以 sub(X, kurt)
    的秩几乎就是 −kurt 的秩。共性表里 day_kurt(Ret) n_with 38、含 +0.84 / 不含 −0.71、均值差 +1.55、p 0.000,是全表样本量与显著性最硬的一行。方向:H3
    sign +1,多头是峰度最低、变动平摊在全天的票。这与 Amaya 等 2015 在美股上用周度 5 分钟矩得到的「峰度与下周收益弱正相关、不总显著」方向相反,必须如实说明。我们的解释是:A
    股里高集中度的日子主要来自三类东西 —— 一根 bar 支配全天的跳空、涨跌停与新闻冲击;报价停滞时少数几分钟承担全天变动;以及开盘集合竞价那一根 bar。第一类是吸引注意力的事件,个人投资者净买入、价格被推高、随后回吐(Barber-Odean
    2008;Seasholes-Wu 2007 在上交所涨停股上直接测到个人投资者的注意力买入与随后回落),这给「做多低集中度 = 不碰注意力事件股」一个方向一致的机制;第二类是停滞造成的测量假象(Bandi-Pirino-Renò
    2017 的 idle time:零收益分钟会系统性地扭曲高频矩);第三类本位不处理(见下)。外围现状:含这个核心的已有外围全部是「轴 B 的离散度树上挂一个
    kurt」—— H3 和 E 位档案前五名都是 sub(cross_mean(cs_last_low10 或 cs_flip_by_state(cs_bucket_zscore(day_distinct_ratio(Ret),
    …), …), …), day_kurt(Ret)),共性表第 4 行是把 kurt 当成离散度的分桶变量;没有一个候选把 kurt 本身当主语,也没有一个对它的混杂变量做过匹配或分解。本位外围做三件事。(1)
    混杂匹配(DGTW 1997 式的顺序特征配对:cs_bucket_zscore / cs_bucket_rank 在某个变量的全市场十分位内比较,不假设线性)。按零收益分钟占比
    day_zero_ratio(Ret)(当日,或 20 日均值)配:一个只取 0 与 ±1 tick 两种值的分钟收益,非零占比为 q 时峰度 ≈ 1/q
    − 3,纯属网格与停滞,配掉它才剩下真正的集中度。按分钟波动 day_std(Ret)(当日,或 20 日均值,后者就是波动控制本身)配:对应 Lee-Mykland
    2008「跳跃是相对局部波动而言的大收益」,同时正面检查陷阱 1/3(配完 vol 暴露应接近 0)。另按未复权均价 div(day_sum(Amt), day_sum(Volume))(相对
    tick)、当日换手 sub(log(day_sum(Amt)), LogFloatCap)(关注度)、市值 LogFloatCap 各配一颗,作为网格、关注度、规模三条替身通道的对照;市值那颗是陷阱
    3 的反面用法(条件化而不是线性残差)。配完剩下的是:同等停滞、同等波动的同行里,谁的变动更集中在少数 bar 上 —— 注意力事件那一部分。(2) 持续
    vs 偶发:sub(cross_tail_mean_q75(kurt, 20), cross_quantile_q50(kurt, 20)) 是 20 日里最集中那四分之一天的均值减去典型一天,读「事件」;中位数那一项读「持续的股票特征」(网格、停滞),两者各在
    20 日停滞十分位内再比一次。(3) 水平 vs 冲击(Amihud 2002 的分解):sub(cross_mean(kurt, 5), cross_mean(kurt,
    60)) 与 cross_zscore(cross_mean(kurt, 5), 60) 读「最近是否出现了异常集中的日子」,即新近的注意力事件,与持续水平分开估;再在停滞十分位内排序一次。窗口
    5 / 20 / 60 日:单日四阶矩极噪,Amaya 等也是先把日内矩按周聚合再排序。为什么种子里没有裸写法:H3 ≈ −kurt,cross_mean(day_kurt(Ret),
    20) 这类单调平滑与 H3 的日度秩相关很可能 ≥ 0.7,会被库禁令打掉,所以 16 颗种子每一颗都带匹配或分解;裸写法的分数交给本计划的 R(直接评估,不受库禁令)。本位刻意不碰第
    0 列(09:30 集合竞价)与时段切分,那是 b 位的输入;两个并行位之间不去重,所以在输入上人为分开。为什么样本外还会在:度量无量纲,跨波动环境稳定;如果它是注意力事件之后的回吐,来源是
    A 股个人投资者主导、涨跌停、T+1 这些 2023-08 之后没有变的制度,不是一次性的定价错误;20 日水平信号换手低,15 bp 吃不掉多少。反过来,如果按停滞配完信号就没了,说明
    H3 是停滞的测量假象,这一点对最终评估同样有用。
