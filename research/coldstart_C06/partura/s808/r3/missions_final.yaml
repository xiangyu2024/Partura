- type: N
  hypothesis: 机制:隔夜与日内两段收益之间的「拔河」。A 股的开盘价由 09:15–09:25 的开盘集合竞价决定,竞价里的委托主要来自收盘后到开盘前对消息与关注度作出反应的个人投资者;机构与套利者主要在连续竞价时段交易。Lou-Polk-Skouras
    2019 证明隔夜与日内两段收益由不同的投资者群体驱动、各自持续、经常符号相反。Akbas-Boehmer-Jiang-Koch 2022 进一步发现:一个月里「隔夜涨、日内跌」(负的日内反转)越频繁,也就是隔夜的噪声交易者与日内的套利者拉锯越激烈,之后数月收益越高
    —— 日内的套利者低估了隔夜好消息为真的概率、矫枉过正;这一溢价落在多头腿(拉锯激烈的票跑赢),正是纯多头书吃得到的一侧,与第 2 轮偏度那种「溢价主要在空头腿」的情形不同。Berkman
    等 2012 说明关注度驱动的开盘买入推高隔夜收益、日内回吐。A 股还有 T+1:当天开盘买入的人当天不能卖出,Qiao-Dam 2020 把 A 股隔夜收益平均为负归因于此,Bai
    2020 说明这种隔夜折价在截面上随波动与可交易性而变。算子怎么实现:ON = log(div(day_first(Open), ts_delay(day_last(Close),
    1))) 是 09:30 开盘价相对前一日收盘的隔夜对数收益;ID = log(div(day_last(Close), day_first(Open)))
    是当日开盘到收盘的对数收益;两者相加恰为当日对数收益。Open、Close 同为后复权价,除权日不会造成假跳空;停牌后复牌那天 ts_delay 取到 NaN,cross_corr
    / cross_mean 只用两者都有限的日子。(1) 负日内反转强度:cross_corr(add(ON, abs_(ON)), ID, 20 / 60),即「当天隔夜涨了多少(只取正的部分,2·max(ON,
    0))」与「当天日内收益」的 20 / 60 日滚动相关;越负,说明隔夜的涨幅越系统地在日内被吐回。这是 Akbas 等「月度负日内反转频率」的幅度加权、连续版(直接数天数只有
    21 个取值,过不了 distinct 闸门)。镜像的正日内反转 cross_corr(sub(ON, abs_(ON)), ID, 20)(隔夜跌的部分
    vs 日内收益)与两者之差各放一颗,因为 Akbas 等发现两者不对称。(2) 双向拉锯:cross_corr(ON, ID, 20 / 60),以及逐日的
    TW = div(mul(ON, ID), add(mul(ON, ON), mul(ID, ID))) ∈ [−0.5, 0.5](负值 = 两段反向,幅度相抵时最负)的
    20 / 60 日均值。相关系数与 TW 都无量纲,不随波动水平缩放。(3) 同样的 20 日总收益里有多少来自隔夜:cs_bucket_rank(cross_mean(ON,
    20), ts_delta(log(day_last(Close)), 20)),在 20 日收益十分位内排序;ts_delta(log(day_last(Close)),
    20) 恰为这 20 天 ON + ID 之和,所以这一颗按构造拿掉了与 20 日反转控制共享的部分,剩下的只是「同样的涨跌,是在竞价里还是在连续交易里完成的」(Lou-Polk-Skouras
    的群体划分);60 日版同理;另有一颗再在 20 日分钟波动十分位内排一次(Bai 2020:隔夜折价随波动而变)。(4) 去替身:负日内反转强度在 20
    日分钟波动十分位、20 日换手十分位(关注度,Berkman 等)、20 日收益十分位内各排一次。(5) 方差口径的对照一颗:ON² /(ON² + 09:31–14:57
    分钟收益平方和)的 20 日均值,即隔夜方差占比(Andersen-Bollerslev-Huang 2011 把隔夜方差当作独立于日内连续成分与跳跃成分的第三个成分)。方向交给奖励的
    sign;按 Akbas 等,预期负日内反转越强(相关越负)越该做多。为什么和以前不一样:库里 8 个 head 只有三条轴 —— 股本 / 市值的包装(5
    个)、日内分钟价格的离散与停滞(H1、H2)、日内分钟收益的四阶矩(H3);没有一个 head、也没有共性表里的任何子树用过「开盘价相对前一日收盘」这一段;第
    1 轮的分钟量价、第 2 轮的偏度读的都只是日内。拉锯类度量无量纲、对总收益不带方向,预期与所有 head 的 |ρ| < 0.3、与 5 个控制 < 0.5;带符号的隔夜收益只以收益十分位内排序的形式出现,不放未条件化的版本(它本身是
    20 日收益的一部分,会与反转控制相关),以相关度表为准。为什么样本外还会在:来源是两类投资者在两个时段的分工(集合竞价里的个人委托 vs 连续竞价里的机构)加上
    T+1,这是市场结构,2023-08 之后没有变;Akbas 等的效应在 1993–2017 的长样本里成立并持续数月;20–60 日窗口让信号慢、换手低,15
    bp 吃不掉多少;无量纲,对整体波动与成交额水平的变化不敏感。风险如实说明:A 股融券难,日内的「套利者」主要是持股者卖出,拉锯的方向可能与美股不同,所以方向不预设;一字涨停日
    ID = 0,不构成反转;涨停开盘后开板记为一次负日内反转,它本身就是注意力事件(Seasholes-Wu 2007 在上交所涨停上测到的注意力买入与这一机制同向)。
  inspired_by: 快照:485 个已评分候选、8 个 head 的输入全部是日内分钟序列或静态股本 / 市值,共性表前 20 行没有一个子树用到隔夜这一段;H3
    的载体 day_kurt(Ret) 所在的 241 根网格里,第 0 列是 09:30 开盘集合竞价,而竞价这一段承载的隔夜信息从没被单独当作信号。文献:Lou-Polk-Skouras
    2019、Akbas-Boehmer-Jiang-Koch 2022、Berkman 等 2012、Qiao-Dam 2020、Bai 2020、Andersen-Bollerslev-Huang
    2011。
