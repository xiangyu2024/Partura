    1](cs_last_low10 输出的是秩,再取 241 日均值),而 day_kurt 的截面跨度是几到几十,sub(X, kurt) 的秩几乎就是 −kurt
    的秩,X 只在峰度几乎相同的票之间破平手。所以 H3 的 +1.10 就是 −day_kurt(Ret) 的分数,而库里存的是一棵七层树,样本外多出来的只有过拟合的风险。每颗变体都去掉
    X,分三类。(a) 1–5 只用载体、只改聚合:单日;20 日均值(四阶矩单日极噪,Amaya 等 2015 也是先把日内矩按周聚合再排序);20 日中位数(不被单个跳空日支配);20
    日上四分位均值(只看最集中的那几天);20 日截面秩的均值(有多常处在高集中的一端,对峰度的重尾不敏感)。(b) 6–8 去掉 X 的同时剥掉载体里的集合竞价:V2
    网格第 0 列是 09:30 开盘集合竞价,in_slice(Ret, 1, 237) 是 09:31–14:57 的连续竞价,in_slice(Ret,
    1, 240) 只剥开盘竞价、保留收盘竞价。竞价那根 bar 承载整个隔夜的信息,它的平方收益按构造是分钟收益的几倍到几十倍,一根 bar 占当日方差的份额为
    s 时峰度约 241·s²,所以 day_kurt(Ret) 把「隔夜跳空的相对大小」和「日内变动的集中度」混在一个数里(Andersen-Bollerslev-Huang
    2011 把隔夜方差当作独立于日内连续与跳跃的第三个成分)。这一类是测量上的理由,没有分数证据,如实说明;它同时回答 H3 到底是哪一种东西。(c) 9–11
    用显式的条件化代替 X:X 本来就是在离散度、价格、换手的桶里取的秩,起的是条件化的作用,但被条件化的不是 kurt;这里换成对 kurt 最可能的三个混杂变量做十分位内
    z 化 —— 当日零收益占比(停滞的票少数几分钟承担全部变动,峰度机械地高)、20 日分钟波动(陷阱 1/3 的正面检查)、市值(陷阱 3 的正面检查)。
