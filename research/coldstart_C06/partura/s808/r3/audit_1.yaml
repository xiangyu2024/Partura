    reasons: '【创新度 4】输入是两段收益:隔夜段 day_first(Open) 相对 ts_delay(day_last(Close),1),以及开盘到收盘的日内段。8 个 head 和共性表前 20 行都没有用过它们;heads 只有三条轴:股本/市值包装、分钟离散/停滞、分钟四阶矩。机制是两段之间的拉锯:Akbas 等 2022 的负日内反转,Lou-Polk-Skouras 2019 的两类投资者,与所有 head 都不同。相关度表上种子 1–14 与 head 的原始 |ρ| 0.02–0.12、残差 ≤0.16,与控制 ≤0.19,满足 4 分「输入与机制都不同、与所有 head 的 |ρ|<0.3」。不给 5,因为机制在文献里有。【合理度 4】逐个算子核对:Open/Close 是后复权价(alphacube/label.py、tradability.py 的注释),所以 ON+ID 恰为当日对数收益,跨除权日连续。ts_delay 是逐日平移,停牌复牌那天取到 NaN。cross_corr 走 common.rolling_pair_reduce,只用两者都有限的日子。add(ON, abs_(ON))=2·max(ON,0)、sub(ON, abs_(ON))=2·min(ON,0),写法正确。TW 在 [−0.5,0.5] 内;ON=ID=0 的日子是 0/0=NaN,会被 cross_mean 的 nanmean 跳过。ts_delta(log(day_last(Close)),20) 恰为 20 日 ON+ID 之和,种子 12–14 在收益十分位内排序,表上 rev 0.00–0.04,证实去掉了反转。窗口 20/60 对应 Akbas 的月度频率与数月的持续期。文献证据都在 2023-08 之前:JFE 2019/2022、JFQA 2012,A 股 T+1 有 Qiao-Dam 2020。不给 5:A 股的方向没有测过(融券难,日内的「套利者」主要是持股者卖出);样本外的理由是通用的市场结构论述。要注意三点。(a) 开盘价噪声:竞价价相对有效价的偏离 e 以 +e 进 ON、以 −e 进 ID,会机械地造出两者的负相关;它在截面上随竞价深度变化,是流动性的替身。表上 liq 0.12–0.19、known 0.11–0.18,目前不大;种子 10 的换手分桶是对它的检查。(b) 20 日相关只有 20 个点,很噪,60 日版应当留着。(c) 一字板日 ID=0 而 ON 很大,在 2·max(ON,0) 里是高杠杆点。【划掉 15】隔夜方差占比 ON²/(ON²+Σr²) 不带符号,读的不是拉锯,而是方差分解。它是日内已实现方差(波动控制的同一个量)的饱和函数,正是陷阱 3 的形状。表上它是本位唯一一颗 liq 0.38、known 0.39、与 H3(kurt head)残差 0.43 的种子,其余各颗都 ≤0.19。留下 14 颗。'
