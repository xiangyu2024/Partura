R:
  - head: 'sub(cross_mean(cs_last_low10(cs_bucket_zscore(cs_bucket_zscore(cs_bucket_zscore(cs_bucket_zscore(day_distinct_ratio(Ret), LogFloatCap), div(day_sum(Amt), day_sum(Volume))), LogFloatCap), div(day_sum(Amt), sub(log(day_sum(Amt)), LogFloatCap))), sub(log(day_sum(Amt)), LogFloatCap)), 241), day_kurt(Ret))'
    soundness: 4
    reasons: '「X 是烂部件」这个判断有 train 证据,而且很硬。loc.md 的拆解里,X 内四处 knockout 的必要性是 +0.05/−0.02/+0.07/+0.07;X 单独评估 −1.55,它的子树 +0.24/−1.09/−1.77。量纲上,cs_last_low10 的输出是 _pct_rank 的秩 ±1,值在 (−1,1](ops_ext._lexi),241 日均值仍在这个范围,而 kurt 的截面跨度是几到几十。相关度表上 day_kurt(Ret) 与 H3 原始 0.994、残差 0.996。所以去掉 X 是对的,变体 1、9–11 是干净的替换候选(原始 0.91–0.99,会走「替换」)。有两处扣分,但不改结论。(a) 变体 6–8 的前提是开盘竞价那根 bar 支配峰度、峰度约 241·s²,被表否定:neg(day_kurt(in_slice(Ret,1,237))) 与 H3 0.99,控制画像与变体 1 完全相同;变体 8 与变体 2 也几乎完全相同(0.55 / 0.94,size 0.42)。说明 Ret 第 0 列并不承载隔夜跳空,这 3 次评估近乎重复。(b) 平滑版 2–5、8 与 H3 的原始 ρ 不超过 0.55–0.65(H3 不在它们的前三),其中变体 4 不超过 0.45。若它们 ≥+1.20,按 R 规则至少变体 4 会走「收录」而不是「替换」:库里会同时有 H3 和一个与 H3 交易信号残差 0.89 的孪生体,与本组「用载体替换七层树」的目的相反。'
  - head: 'ts_max(ts_max(cs_bucket_zscore(cs_bucket_zscore(day_distinct_ratio(Ret), LogFloatCap), day_zero_ratio(Ret)), 40), 40)'
    soundness: 3
    reasons: '怀疑的对象很清楚:第二层 cs_bucket_zscore(·, day_zero_ratio(Ret)) 按全市场的零收益十分位分桶,而零收益占比与规模相关,桶内 z 化会把规模倾斜带回来(陷阱 3)。PI 引的第 2 轮相关度表(size 0.01→0.34)按 §5 我不能读,无法独立核对。但本轮表上的变体 1(配完零收益之后再按 LogFloatCap 做一次十分位内 z 化)size 0.13、与原 head 原始 0.71,是对这个怀疑直接而干净的检验,分数过线就会走替换。分桶并列的论点在源码上成立:ops_ext._buckets 用 _pct_rank 的 stable argsort 序号秩,k/n 计数的并列块在十分位边界按股票列序切开。另两颗不服务于本组的问题。变体 2 换成 20 日均值后 size 升到 0.47、vol 0.22,恰恰是本组要排查的那种暴露在变大;它若因此分数更高而替换 H2,库会更偏向规模。变体 3 把载体字段从 Ret 换成 Close,并不是去掉被怀疑的部件;而且按 PI 自己的记录,老外壳上同一替换只得 +0.46(原来是 +0.82)。机制清楚,变体 1 实现了它,所以给 3;变体 2、3 拉不到 4。'
summary: 'a 位(E,day_kurt(Ret))创新 3 / 合理 3,划掉 8 颗(按奖励已中性化的控制去配、或没有实现「偶发」的种子,与 H3 交易信号残差 0.77–0.93),留下 1、2、3、8、13–16;最大风险是库禁令拦不住 kurt 的平滑孪生。b 位(N,隔夜/日内拉锯)创新 4 / 合理 4,只划掉方差占比种子 15。R1 合理 4(X 确实只是装饰,但 6–8 的竞价前提被表否定,平滑版可能走收录,成为 H3 的孪生)。R2 合理 3(只有变体 1 直接检验规模回流)。'
