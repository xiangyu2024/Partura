    struck_seeds: [4, 5, 6, 7, 9, 10, 11, 12]
    reasons: '【门槛】核心 day_kurt(Ret) 是 H3 的子树、也是核心卡第 10 条;与 5 个控制最大 |ρ| 是 size 0.26,低于 0.5;16 颗种子都原样含核心;相关度表没有一颗按规则划掉(原始最大 0.61,控制最大是种子 3 的 size 0.49,贴着门槛)。【创新度 3】这个核心已有的外围只有两类:一是 sub(离散度树, kurt)。H3 的 X 是 cs_last_low10 输出的秩(ops_ext._lexi,值在 (−1,1])再取 241 日均值,截面跨度远小于 kurt;表上核心与 H3 原始 0.994、残差 0.996,所以 H3 就是 −kurt。二是把 kurt 当离散度的分桶变量(共性表第 4 行)。把 kurt 本身当主语,做混杂匹配、持续/偶发拆分、水平/冲击拆分,是这个核心没有做过的事。但相关度表说,这些外围大多没有改变交易信号。裸的 20 日均值 neg(cross_mean(day_kurt(Ret),20))(R1 变体 2)与 H3 的残差是 0.94;种子 1–13 是 0.73–0.93,匹配只把它拉低 0.01–0.21。真正换了机制的只有水平/冲击三颗(14–16:原始 ≤0.35,残差 0.11–0.23),另外按未复权价配(种子 8)把与库里股本类 head 的残差重叠从约 0.5 降到 ≤0.23。所以是同一输入、部分外围换了机制,给 3,不给 4。要特别指出:PI 的前提「cross_mean(day_kurt(Ret),20) 这类平滑与 H3 的日度秩很可能 ≥0.7,会被库禁令打掉」与表不符。R1 变体 2 的原始最大只有 0.55,而且最像的是股本 head,H3 不在前三。库禁令拦不住 kurt 的平滑版,GP 在这个位里很容易长出一批与 H3 交易信号残差约 0.9、却能入库的孪生体。这是本位对样本外因子库最大的风险。【合理度 3】机制:我核对了 1/q−3 的推导。分钟收益只取 0 与 ±a、非零占比为 q 时,m2=qa²,m4=qa⁴,峰度等于 1/q−3,所以按零收益占比配是对的。common._kurt 等于去均值后的 mean(x⁴)/mean(x²)²−3,无量纲;核心 vol 0.01,也没有 signedpower、pow 这类凸变换,不落陷阱 1。窗口 5/20/60 合理。不给 4 的原因:train 证据(共性表 +1.55、p 0.000、n 38;H3 +1.10)属于核心,不属于这些外围;文献方向相反(Amaya 等是弱正);注意力文献解释的是高集中度那一端随后回吐,即空头腿,而纯多头书吃的是最低 kurt 的十分位,PI 没有说清多头腿为什么有超额。算子层面有三个弱点。(a) 日度 kurt 是重尾的:一根 bar 支配全天时可到约 n−3≈238。cs_bucket_zscore 的桶内 std 会被少数极端值撑大,最低 kurt 那一端的 z 值被压在 −μ/σ 附近,跨桶谁进多头十分位取决于该桶有没有极端值,而不是同行比较。日度版应当用 cs_bucket_rank(种子 3),或者先对 kurt 取秩。(b) 日度 day_zero_ratio 是 k/n 计数;ops_ext._buckets 用 stable argsort 的序号秩切十分位,边界上的并列块按股票列序分桶。种子 1、3 有这个问题,用 20 日均值的种子 2、13、16 没有。(c) 与 size 的关系:20 日水平的 kurt 与 size 0.42,与股本 head 残差约 0.5。这条重叠只有按价格配(种子 8)能去掉;按市值配(种子 10)的原始 size 是 0.01,残差却仍是 0.48,所以它走的是价格网格,不是市值。【划掉】4、5、6、7:波动匹配层。波动是奖励已经线性中性化的控制;kurt 的分母本来就是当日 m2²,Lee-Mykland 的「相对局部波动」已经在统计量里,再按 day_std 配是空操作。表上 5 的分桶变量就是波动控制本身,残差 0.93,与裸 20 日均值 0.94 无差;4、7 反而把 vol 从裸版的 0.15 抬到 0.18 / 0.21;6 等于 2 加一层空操作(残差同为 0.85),7 等于 1 加一层空操作。另外 4/5、6/7(以及 1/2)两两的外围算子集合相同。9:当日换手与流动性控制同族,核心 liq 只有 0.09;配完残差 0.91,liq 反而升到 0.29。10:市值是控制;配完与 H3 残差 0.91、与股本 head 残差 0.48,与裸版(0.94 / 0.50)无差;陷阱 3 担心的非线性市值成分在表上看不到。11、12:标称读「偶发」,但 sub(cross_tail_mean_q75, cross_quantile_q50) 对右偏的尺度族与水平成正比。表上它们与 H3 的残差(0.81 / 0.77)比读「持续」的种子 13(0.73)还高,没有实现拆分。想读「同等持续水平下的偶发」,应当写 cs_bucket_rank(cross_tail_mean_q75(day_kurt(Ret),20), cross_quantile_q50(day_kurt(Ret),20)),不要相减。留下 1、2、3、8、13、14、15、16 共 8 颗,覆盖停滞匹配、价格匹配、持续水平、水平/冲击四件事。'
    revise: '—'
