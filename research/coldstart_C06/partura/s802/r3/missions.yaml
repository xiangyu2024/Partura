  - type: N
    hypothesis: '【新 idea】隔夜段和日内段是两拨人在定价:同样的 20 日涨跌,来自隔夜(昨收 → 今日集合竞价)的那部分更多是关注度 / 情绪推动、更容易回吐;来自连续竞价段的那部分更多是信息。奖励里的 20 日反转控制对两段一视同仁(线性),「涨在哪一段」这份信息留在残差里。

      【输入为什么是新的】库里 29 个 head 全部是日内分钟统计量,没有一个用到 day_first / day_last / cross_delay。in_delta(dt_in.py)/ in_pct(ops_ext.py)第一列为 NaN,网格第一列是 09:30 集合竞价,所以现有 head 用到的分钟价格变化都不含隔夜跳空。定义 O = log(div(day_first(Open), cross_delay(day_last(Close), 1)))(隔夜),I = log(div(day_last(Close), day_first(Open)))(日内),O + I = 收盘到收盘的对数收益。价格是后复权的,跨日比值就是收益;源码里 log 是 log|x|,比值恒正,不受影响。

      【机制】(a) A 股 T+1,开盘有集合竞价。关注度驱动的买单集中在开盘(Berkman-Koch-Tuttle-Zhang 2012:高关注度股票隔夜涨、日内跌,在开盘买入有隐性成本);连续竞价段由能在当日反向交易的资金定价。Lou-Polk-Skouras(2019)发现两段收益由不同的客户群驱动,各自持续,符号常相反。(b) 所以在总涨跌相同的两只股票里,涨在隔夜的那只更像情绪,涨在日内的那只更像信息。(c) 我们不押 Akbas-Boehmer-Jiang-Koch(2022)原始的「拉锯强度」:Cheema-Chiah-Man(2022)在中国复现时发现,强度高的股票未来隔夜涨、日内跌,两段幅度相近、相互抵消,收盘到收盘不可预测;我们的书跨两段持有,所以主线是「控制了总涨跌之后的隔夜占比」(种子 1–4),拉锯强度只做两个对照(种子 8、9)。

      【算子怎样实现】
      种子 1–4:cs_regres(ts_sum(O, 20 / 60), 同窗口的收盘到收盘对数收益)。在总涨跌固定时,O 的残差与「隔夜减日内」的残差只差一个倍数(O − I = 2O − (O + I)),所以这就是拉锯差在总收益之外的那部分。回归对象是显式的收盘到收盘收益,不是 day_sum(Ret):如果 20 日反转控制只含日内段,对 day_sum(Ret) 回归会让隔夜段的普通反转从这道缝里漏进来,那只是控制换写法(陷阱 3 的同类)。种子 3 在残差上再平滑 20 日;种子 4 用 decay 权重,并对同权重的 O + I 回归。
      种子 5–7:ts_corr(O, I, 60 / 120) = 这只股票的跳空在当天被延续还是被抹掉(负 = 日内系统性地抹掉隔夜跳空,即拉锯);ts_corr(O, cross_delay(I, 1), 60) = 隔夜是否追随昨天日内的走势(散户追涨)。都是有界相关系数,不是收益水平。
      种子 8、9:把 Akbas 等的「负日内反转」做成连续量,ts_mean(mul(is_gt(O, 0), neg(I)), 20) = 高开那些天的日内跌幅均值(不用 0/1 频率,避免 21 档的大并列)。种子 8 对 20 日收盘到收盘收益取残差;种子 9 减去自己 120 日的常态,对应 Akbas 用的「相对自身历史的异常频率」。
      种子 10、11:集合竞价的有号成交占比 mul(sign(O), div(day_first(Volume), day_sum(Volume))) 的 20 日 decay,即开盘那一刻的订单流(竞价量占全天比例,按跳空方向记号);种子 11 对 20 日收益取残差。比例有界,不是成交量水平。
      种子 12:div(Σ|O|, Σ|O| + Σ|I|)(20 日)= 价格移动里发生在不交易时段的比例,也就是信息在收盘后到达的比例,尺度无关。

      【方向预期】种子 1–4 为 −1:做多 20 日涨跌主要来自日内的名字。种子 5、6 为 −1(按 Akbas,拉锯越强未来越好;中国的直接证据是零,所以我对它们把握最低)。其余交给奖励的符号扫描。

      【为什么和库里不同】输入(跨日价格、集合竞价)库里没有;机制(交易时段 = 客户群)与库里的订单流吸收、价格黏性、波动凸函数都不同。预期与所有 head 的 |ρ| < 0.3;残差版与 20 日反转控制的 |ρ| < 0.2。

      【为什么样本外还会在】T+1 和开盘集合竞价是制度,不随样本期变;散户仍是 A 股交易的主体。信号都是两段收益的残差、相关系数或比例,不依赖波动或成交额的水平,换手或波动整体换档时定义不变。风险如实写:Cheema 等(2022)对原始拉锯强度的中国证据是零;Qiu(2022)只证实两段之间存在持续与反转,没给出符号。所以这一位把握不高,但它是本种子唯一一条输入完全在库外的路。'
