    hypothesis: '【核心 K 是什么】K = ts_autocorr(day_signed_ratio(Ret, Volume), 60, 1):每只股票自己的日度净主动买入占比(1 分钟 tick rule,ops_ext.py:122,Σ|V|·sign(r) / Σ|V|,∈[−1, 1],尺度无关)在过去 60 天上的滞后 1 阶自相关。它是 head +1.62 的子树,也是定位机械核心卡第 14 条(均值差 +0.99,p 0.012,n = 10)。

      【它是条件化部件,不是因子;但它的贡献很大】loc.md 的拆解:同一类筛单独评分全是负的(ts_autocorr(cs_regres(day_wmean(Volume, Volume), day_sum(Ret)), 60, 1) −0.18;ts_autocorr(cs_regres(day_signed_ratio(Ret, Ret), day_sum(Ret)), 60, 1) −0.81;ts_autocorr(day_signed_ratio(Ret, Ret), 60, 1) −0.76)。但作为 cs_last_low20 的 x 时,它给同一个 y = ts_decay_linear(C, 40/30)(C = cs_regres(day_signed_ratio(Ret, Volume), day_sum(Ret));y 单独 train / valid 0.62 / 2.63、0.67 / 2.38)加了 train +1.28 / +0.99 / +0.82、valid +1.12 / +0.71 / +0.45(head +1.89 / +1.61 / +1.49),两个区间同向;敲掉自相关层(筛退回原始内层量)必要性 +0.72 / +0.34 / +0.77。第 2 轮 E 位的 10 个 head 在筛里用了 7 种不同的内层字段(成交集中度、裸订单流、效率比、涨分钟占比、可分类成交占比、Q 统计量、自相关的自相关),而 head +1.61 筛里那层 cs_regres(·, day_sum(Ret)) 必要性只有 +0.02。内层字段可以互换,起作用的是外层「这只股票自己的日度序列还有没有自相关」。

      【机制:可靠度筛】设某个日度统计量 x_t = s_t + e_t,s 是系数 φ 的 AR(1),e 是测量噪声,则 corr(x_t, x_{t−1}) = φ · var(s) / (var(s) + var(e)),字面上就是一个可靠度比,也就是 Black-Jensen-Scholes 意义上的测量误差衰减系数。分钟成交稀疏、零收益分钟多、报价冻结的股票,任何由它的分钟数据算出的日度量都被 e 主导,自相关 ≈ 0(Lesmond-Ogden-Trzcinka:零收益说明价格没有吸收信息)。所以订单流自相关低,是「这只股票的分钟统计量量不准」的通用标记,不是订单流特有的性质;把这批名字排出多头书,书就只在量得准的名字里按 y 挑。硬排除而不是连续收缩,也有 train 证据:同一个测量误差理由做成连续收缩 mul(C, w),在 head +1.62 上必要性只有 +0.08。

      【已见过的外围:全是 C 族】含这个核心的候选:head +1.62、+0.80,第 2 轮 top-5 的 +1.55、+1.54。外围算子集合 = {cs_last_low20, ts_decay_linear, cs_regres, day_signed_ratio, day_sum, mul, abs_, 嵌套的 ts_autocorr, 嵌套的 cs_last_low20},y 全是 ts_decay_linear(C, 30/40) 或它的加权版。没有人把它装在 C 以外的 y 上,也没有人用它做「挑选」。

      【这次的外围做什么:把筛搬到 C 以外、同样由分钟数据算出的预测量上,并把排除改成挑选】
      (1) S 族(种子 1–5)。S 是库里另一个稳的来源(7 个 head,最高 +1.39),由 day_flat_run_max(Vwap)(价格黏性)对 day_durbin_watson(Volume) 回归而来,两个都是分钟统计量,同样怕量不准。种子 1 用窗口 100、种子 2 用挑选、种子 3 用 40% 带,都是为了离窗口 200 的 S head 远一点。种子 4、5 把 ts_regbeta 换成 ts_corr:β = ρ·σ_y/σ_x,σ_x 小(黏性几乎不变)的名字 |β| 很大、sigmoid 饱和,top 由这个尺度决定;ts_corr 只留 ρ,有界不饱和。方向与 S head 一致(S head 做多 β 低的一端,neg(decay(ρ)) 同向)。
      (2) 聪明钱价格比 Q(种子 6–8、13)。Q = div(day_topw_mean(Vwap, div(in_pct(Close, 1), sqrt(Volume))), day_wmean(Vwap, Volume)):按 |r|/√V(单位√成交量的价格冲击)取冲击最大的 10% 分钟,看它们的平均成交价相对当日 VWAP。Barclay-Warner(1993):少数成交承担了大部分价格变动,知情交易者的单子单位成交量的冲击最大。Q > 1 = 冲击最大的成交出现在高价位(逢高出货)。in_pct 第一列为 NaN,集合竞价那一列自动不参与挑选;两个同日价格之比,尺度无关。方向预期做多低 Q(neg);种子 13 是不取 neg 的反向对照。
      (3) 价量相关 CPV(种子 9–12)。CPV = day_corr(in_slice(Close, 1, 240), in_slice(Volume, 1, 240)),只用连续竞价的 240 分钟:去掉 09:30 集合竞价那根巨量柱,否则相关系数会被「当日价格相对开盘价」主导,变成当日收益的代理。正 = 量随价涨(追涨),负 = 量落在价低处(承接)。方向预期做多低 CPV;种子 12 先对当日收益取截面残差。
      (4) 挑选而非排除(种子 2、5、8、11)。cs_first_high40(y, K) 把自相关最高的 40% 整块排到最前、在其中按 y 排序:多头书 = 最可靠的那 40% 里 y 最高的四分之一。库里 29 个 head 只会排除、从没挑选过。
      排除带用 10% / 20% / 40% 三档。cs_last_* / cs_first_* 都按整块并列进出(ops_ext.py 的 _lexi / _rank_block),输出保留 y 的序数秩,不会生成列序斜坡(陷阱 2);K 是连续的相关系数,不会因为整块装不进带而退化成恒等。

      【为什么和以前不一样,而且能证伪】以前的外围只回答「C 在可靠的名字上是不是更好」。这次回答「这个筛是不是对所有分钟统计量都成立的部件」,并且能把两种读法分开。读法甲(可靠度):筛在 S、Q、CPV 上也加分。读法乙:低可分类成交的名字上 cs_regres(C, day_sum(Ret)) 的残差约等于 −β·当日收益,筛只是把 C 里混进来的反转成分去掉;按这个读法,筛只对带 cs_regres(·, day_sum(Ret)) 这一步的 y 有用。种子 1–11、13 都不带这一步,只有种子 12 带,作对照。

      【陷阱核对】K 是有界相关系数,不是市值、波动、流动性的函数;不做凸变换;没有种子用 LogFloatShares、day_quantile(Open) 这类价格水平量,也没有 day_max(Volume) 这类带单位的量。真正的风险是被排掉的 20% 可能是一个流动性 / 小盘 segment:排除是阶跃函数,线性中性化去不掉。所以请看相关度表上 K 与 liq / size 的 |ρ|,以及各种子的控制列。本轮 R 组在 head +1.89 上用 5% / 10% 带宽直接检验这一点:如果增益随带宽单调上升,那就是在赌一个 segment。

      【为什么样本外还会在】(i) 分钟统计量量不准,是「在 1 分钟 bar 上算日度量」这个构造本身的机械性质:总有一批股票分钟成交稀疏、报价冻结,与样本期无关。(ii) 筛单独是负分,它不把某个风格的收益当信号,只改变 y 在谁身上被相信。(iii) 增益在 train(2018–2021)和 valid(2022–2023.8)这两段风格相反的区间里同向,不是在起约束的那一段上调出来的。(iv) 所有 y 都是尺度无关量(相关系数、比值、两价之比),换手或波动整体换档时定义不变。'
