  - head: 'inv(ts_decay_linear(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 200)), 40))'
    why: 'ts_regbeta 的斜率 β 带着一个与信号无关的选择尺度。β = ρ·σ_y/σ_x(common.py 的 ts_regbeta:β = cov / var_x),x = day_flat_run_max(Vwap) ∈ [0, 1](价格黏性),y = day_durbin_watson(Volume) 无量纲。σ_x 很小(黏性几乎不随时间变)的名字 |β| 很大,sigmoid 饱和在 0 或 1,于是 inv(decay(sigmoid(β))) 的顶端由 σ_y/σ_x 决定,而不是由两者的共动决定。ts_corr 恰好只留 ρ:有界、连续,sigmoid(ρ) ∈ [0.27, 0.73] 不饱和,inv 在这个区间单调、不跨 0。第 1 轮试过的 t 值替换回答不了这个问题:t = ρ√(n−2)/√(1−ρ²) 在 n = 50–200 时数值很大,sigmoid(t) 几乎是 ρ 在 0 处的阶跃,把 ρ 的大小也一起丢了;那次三个变体全崩(−0.27 / −0.77 / −0.62),分不清是「σ 尺度带着 alpha」还是「阶跃丢掉了 ρ 的大小」。另一条证据说明 S 族的分数对「饱和 / 曲率与线性中性化怎么相互作用」很敏感:pow_1_5(inv(sigmoid(β))) 与 inv(pow_1_5(inv(sigmoid(pow_1_5(inv(sigmoid(β))))))) 是同一个 β 的单调变换,第 2 轮相关度表里窗口 100 的这一对原始秩相关 1.00,分数却是 +0.89 对 +1.16;窗口 200 的这一对(都在本轮快照里)是 +0.93 对 +1.39。这正是本变体要拿掉的东西。变体 1 窗口 200;变体 2 窗口 100,用来排除「200 日的 ρ 已经退化成静态特征」。过线(≥ +1.40)走替换;崩到 +0.9 以下,说明 S 族的分数实质依赖 σ_y/σ_x 这个选择尺度。'
    variants:
      - 'inv(ts_decay_linear(sigmoid(ts_corr(day_flat_run_max(Vwap), day_durbin_watson(Volume), 200)), 40))'
      - 'inv(ts_decay_linear(sigmoid(ts_corr(day_flat_run_max(Vwap), day_durbin_watson(Volume), 100)), 40))'
  - head: 'cross_cov(day_max(Ret), day_cov(Ret, Ret), 30)'
    why: '协方差这一层是波动的凸函数(陷阱 1 / 3)。day_cov(Ret, Ret) 是当日分钟收益的方差 = 已实现方差(量级 σ²),day_max(Ret) 是当日最大分钟收益(量级 σ),cross_cov(·, ·, 30)(dt_cross.py)是 30 日时序协方差,量级 ~σ³。方向 −1 = 做多低的一端 = 做多低波动。奖励只对 20 日日内波动做线性中性化,σ³ 的凸部分去不掉;它和第 2 轮 DW 那条凸度阶梯(凸度越高分越高)是同一个签名。把 cross_cov 换成 cross_corr,两边的波动尺度都除掉,只留「极端分钟与当日方差是否共动」。崩 ⇒ 这棵 head 的分数来自波动的三次方;不崩 ⇒ 共动本身是信息。过线(≥ +1.00)时按规则替换或收录,都是用无凸度的版本换掉一个陷阱 head。'
    variants:
      - 'cross_corr(day_max(Ret), day_cov(Ret, Ret), 30)'
  - head: 'cross_cov(day_wmean(Ret, Ret), day_wmean(Ret, Ret), 5)'
    why: 'day_wmean(Ret, Ret) 里混着一个波动尺度。day_wmean(x, w) = Σx|w| / Σ|w|(ops_ext.py:109),所以 day_wmean(Ret, Ret) = Σ r|r| / Σ|r| = [Σ r|r| / Σ r²] × [Σ r² / Σ|r|]:前一项是有界的上下行不对称 RSJ = day_signed_ratio(Ret, mul(Ret, Ret)),后一项是量级 ~σ 的波动尺度。cross_cov(X, X, 5) 是 X 的 5 日方差,所以这棵 head ~ σ² × (RSJ 的波动),方向 −1 = 做多低波动。变体把 X 换成 RSJ,恰好拿掉 [Σ r² / Σ|r|] 这个因子,其他不动。第 2 轮 N 位用 RSJ 的整组种子最高只有 +0.28;若变体崩,说明 +0.67 全部来自那个波动尺度(陷阱 1 / 3)。过线(≥ +0.77)则替换或收录。'
    variants:
      - 'cross_cov(day_signed_ratio(Ret, mul(Ret, Ret)), day_signed_ratio(Ret, mul(Ret, Ret)), 5)'
  - head: 'cs_last_low20(ts_decay_linear(cs_regres(day_signed_ratio(Ret, Volume), day_sum(Ret)), 40), ts_autocorr(ts_autocorr(day_signed_ratio(Ret, Volume), 60, 1), 60, 1))'
    why: '外层那一层 ts_autocorr 是退化的。内层 ts_autocorr(·, 60, 1) 是 60 日滚动估计,相邻两天共享 59 个观测,这条序列的滞后 1 阶自相关对几乎所有股票都接近 1;于是筛的最低 20% 不再是「订单流不自相关」的名字,而是滚动估计跳得最厉害的名字(窗口里进出一个极端日、停牌复牌)。证据:同一个 y、同一个内层字段、只有一层自相关的写法 cs_last_low20(ts_decay_linear(C, 40), ts_autocorr(day_signed_ratio(Ret, Volume), 60, 1)) 第 2 轮已评过 +1.54(loc.md「本组之前各轮的任务」),兄弟 head 用单层自相关筛的是 +1.36 ~ +1.89,而这棵只有 +0.80。变体就是去掉多余的那一层,门槛 +0.90,同族 ρ 必 ≥ 0.5,走替换。代价如实写:替换后它与 head +1.62 的筛相同、y 相近,书会重叠;换来的是把一棵坏掉的 head 修好。'
    variants:
      - 'cs_last_low20(ts_decay_linear(cs_regres(day_signed_ratio(Ret, Volume), day_sum(Ret)), 40), ts_autocorr(day_signed_ratio(Ret, Volume), 60, 1))'
