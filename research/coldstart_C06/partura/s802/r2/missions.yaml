- head: inv(pow_1_5(inv(sigmoid(pow_1_5(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 100))))))))
  why: ts_regbeta 的窗口 100 是烂部件。本轮定位对这棵 head 本身的拆解:窗口 100 → 200,score +1.155 → +1.393(train 1.16 → 1.39,valid 1.66 → 2.42,两个区间同向);50 → 100 → 200 单调(+0.83 / +1.16 / +1.39)。机制:50–100 日的滚动斜率估计误差大,经过近似取符号的 sigmoid 后变成符号翻转,加长窗口降噪。变体就是拆解里测过的那一个,同族 ρ 必然 ≥ 0.5,走替换。不再往 400 推:窗口越长,斜率越接近一个不随时间变的个股常数(Lewellen-Nagel 2006 的方差分解),那是样本外风险,不是更多信息。
