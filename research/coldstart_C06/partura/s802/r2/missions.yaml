  why: 同一个烂部件:ts_regbeta 窗口 100。证据来自同一子树 sigmoid(ts_regbeta(…)) 的兄弟 head(100 → 200 +0.24,两区间同向),以及这棵 head 自己的上一步:第 1 轮 R 里它的窗口 50 版(去掉内层 inv 后)+0.961,窗口 100 版 +1.048。它自己这一步的增益比兄弟小,所以我对过 +0.1 的线只有一半把握。只换窗口,不动 decay 40:第 1 轮已测过「窗口 100 + decay 80」反而更低(两个降噪改动叠加是过度平滑)。
