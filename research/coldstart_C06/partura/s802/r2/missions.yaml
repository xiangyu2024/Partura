- type: N
  hypothesis: 【机制:跳跃不对称 / 偏度偏好】把一天的分钟价格变化 Δp 按方向拆成两部分已实现半方差:RV+ = Σ_{Δp>0} Δp²,RV− = Σ_{Δp<0} Δp²。相对有号跳跃 RSJ = (RV+ − RV−) / RV ∈ [−1, 1](Bollerslev-Li-Zhao 2020 的 good minus bad volatility,按 RV 归一化)。RSJ > 0:当天的大幅变动集中在上行(正偏,彩票型);RSJ < 0:大幅变动集中在下行。Barberis-Huang(2008)的概率加权:投资者高估小概率的大涨,所以正偏的股票被高估、负偏的被低估。Bollerslev 等按 RSJ 排序,低组未来收益显著高于高组,控制其他公司特征之后仍在;Amaya-Christoffersen-Jacobs-Vasquez(2015)用日内已实现偏度得到同方向的结论。A 股散户占成交大头、偏好彩票型股票(Li-Liu 2019 用 2011–2018 上证 A 股证实 MAX 效应存在)。事先方向:做多 RSJ 低的一端(大幅变动集中在下行、被彩票偏好冷落的股票)。【算子怎样实现】day_signed_ratio(x, y) = Σ|y|·sign(x) / Σ|y|(ops_ext.py:122)。取 x = in_delta(Close, 1)(同一天内相邻分钟收盘价之差;源码 dt_in.py:301 第一分钟为 NaN,所以天然不含隔夜跳空),y = mul(x, x),就逐字是 RSJ = Σ Δp²·sign(Δp) / Σ Δp²。后复权的价格尺度在同一只股票同一天里约掉,所以 RSJ 是尺度无关的比例;Δp = 0 的分钟两边都不进。RSJ 和当日涨跌同号,裸 RSJ 的 20 日均值会和 20 日反转控制重合(种子 1 是裸的基线,预计可能被相关度表划掉)。所以主要种子用三种办法去掉「方向」、只留「形状」:(a) cs_regres(RSJ, day_sum(Ret)) 逐日在截面上扣掉当日收益(种子 2、3、9);(b) sub(RSJ, ER),ER = day_signed_ratio(Δp, Δp) = ΣΔp / Σ|Δp| 是按 |Δp| 加权的方向(效率比),RSJ 按 Δp² 加权;两者之差 = 大幅变动比一般变动更偏向哪一边(种子
    4、5、6、8、10);(c) cs_regres(ts_mean(RSJ, 20), ts_sum(day_sum(Ret), 20)) 直接在 20 日尺度上扣掉 20 日收益(种子 7)。平滑用 ts_mean / ts_decay_linear,20–60 日(Bollerslev 等按周、Amaya 等按周到月;日度 RSJ 噪声大,需要平均)。稳健性:5 分钟价格变化 in_delta(Close, 5) 版(种子 8、9;Bollerslev 等用 5 分钟收益,降低买卖反弹噪声);分钟 Ret 版(种子 10);日内已实现偏度 day_skew(Ret) 版(种子 11,Amaya 等);再对订单流 OF = day_signed_ratio(Ret, Volume) 做一次截面残差的版本(种子 12、13),明确拿掉和库里订单流 head 共有的那部分。【为什么和库里不同】库里 16 个 head:7 个是价格钉住时长对成交量粗糙度的斜率(S 族),1 个日内成交量时点,1 个被吸收的订单流(按成交量加权的价格方向),1 个凸化的日内已实现方差(pow_2(pow_2_5(day_durbin_watson(High))),量的是最近波动的大小),4 个流通股本 × 成交筛,2 个价格水平的分桶改写。没有一个量过价格变动的不对称。RSJ 对上下行对称的放大缩小不变,只看大幅变动偏向哪一边,所以与波动的大小无关,不是波动控制的非线性重写(陷阱 1 / 3 要求的是波动大小的凸函数,这里是半方差之比)。它只用价格变化、不用成交量。与订单流 head 的区别在权重:OF 按成交量给方向加权(谁在主动成交),RSJ 按变动幅度的平方加权(大幅变动往哪边走)。预期与所有 head 的 |ρ| < 0.3。【为什么样本外还会在】(i) 偏度溢价来自偏好(概率加权),不是某段样本的统计巧合:美国(Bollerslev 等;Amaya 等)和中国(Li-Liu 2019 的 MAX 效应;Chao-Liu-Guo 2017 用中国 5 分钟数据在组合层面发现有号跳跃的风险溢价),不同市场、不同时期都有;(ii) A 股散户占成交大头、融券受限,被高估的正偏股票很难被套利掉。我们做的是被冷落的负偏一端(纯多头),不依赖做空;(iii) RSJ 是半方差之比,尺度无关,换手和波动整体换档时定义不变;只用日内相邻分钟的价格变化,不受隔夜跳空和停复牌的影响。
