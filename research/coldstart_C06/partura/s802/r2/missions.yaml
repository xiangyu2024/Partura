  why: 平滑核偏短。这棵 head 是第 1 轮 N 位的产出,同一核心外面的平滑长度与分数:decay 20 → +0.52(train 0.52 / valid 2.22),decay 40 → +0.62(train 0.62 / valid 2.63),decay 20 再 decay 40(支撑约 59 天)→ +0.89(train 0.89 / valid 1.85)。较差的那个区间一直是 train,而 train 随有效回看长度单调上升;valid 不单调,但始终远高于 train,不是瓶颈。机制:日度 tick rule 订单流噪声很大,拆单留下的单边流要在几周到一个季度上平均才显出来。上限有文献:Barber-Odean-Zhu(2009)发现不平衡在周到月尺度延续、在年尺度反转,所以只把支撑拉到约 80–100 天,不再往长走。两个变体:内层 40 外层 40(支撑约 79 天);内层 20 外层 80(支撑约 99 天)。事先登记:两个都过不了 +0.987,就说明约 60 天的核已经接近最优,第 3 轮不在更长平滑上花种子。
