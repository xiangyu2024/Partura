  hypothesis: 【核心 C 是什么】C = cs_regres(day_signed_ratio(Ret, Volume), day_sum(Ret))。day_signed_ratio(Ret, Volume) = Σ V·sign(r) / Σ V(源码 ops_ext.py:122;r=0 的分钟只进分母)= 按 1 分钟 tick rule 给成交量定方向的日度净主动买入占比;cs_regres(·, day_sum(Ret)) 逐日做截面回归,扣掉「当日价格走了多远」能解释的部分。剩下的是:主动成交站在一边、价格却没有相应走过去 —— 被对手方限价单吸收掉的订单流。第 1 轮 N 位产出了库里的 head ts_decay_linear(ts_decay_linear(C, 20), 40)(+0.89,train 0.89 / valid 1.85,方向 +1 = 做多被吸收的主动买入);C 外面只套一层 decay 20 / 40 就有 +0.52 / +0.62。第 1 轮相关度表里 ts_decay_linear(C, 20) 与 5 个控制:liq 0.01 / vol 0.05 / rev 0.13 / known 0.00 / size 0.24,与当时所有 head 的原始 |ρ| ≤ 0.04。方向 +1 与 Chordia-Subrahmanyam(2004:控制同期收益后,买方不平衡之后收益更高)以及 Jones-Shi-Zhang-Zhang(2019,A 股账户数据:大额账户与机构的净交易正向预测未来收益)一致。【已见过的外围】含 C 的候选,外围只有时间平滑:{ts_decay_linear}(+0.89 / +0.62 / +0.52),以及再套一次 cs_regres(·, day_sum(Ret)) 的 {ts_decay_linear, cs_regres, day_sum}(截面残差幂等,分数与单层逐位相等,等于没做)。从来没有外围引入过 C 以外的输入。【这次的外围做什么:处理 C 的测量误差】C 是 1 分钟 bar 上的 tick rule 估计量,误差很大,而且误差的大小在股票之间差很多。外围全部带进新输入,针对这一点:(1)哪些股票的 C 是 tick rule 根本定不了方向的(主线,种子 1–6)。分子只数价格变了的分钟,零收益分钟的成交量只进分母。w
    = day_signed_ratio(abs_(Ret), Volume) = Σ V·1[r≠0] / Σ V(sign(|r|) 在 r≠0 时为 1、r=0 时为 0),正好是 C 的分母里被 tick rule 定了方向的成交量占比。w 低,说明当天大部分成交没有方向、OF 由少数几分钟决定,C 的极端值多半是噪声。实现:cs_last_low20 / cs_last_low10(平滑后的 C, 同窗口的 w 均值)把这些名字排除出多头书(种子 1、2);mul(decay(C,20), ts_mean(w,20)) 与 ts_decay_linear(mul(C, w), 20) 按可靠度把估计值往 0 收缩,前者按股票、后者按天(种子 3、4;errors-in-variables 的标准处理,权重是 [0,1] 内的正数,不是两个有符号量相乘);day_zero_ratio(Ret)(零收益分钟数占比)和 day_gini(Volume)(成交集中在少数分钟)是同一件事按分钟数、按集中度的另两种量法(种子 5、6)。依据:tick / Lee-Ready 分类在成交稀疏、单子小的时候误判系统性更高(Odders-White 2000;Aktas-Kryzanowski 2014);在只有 bar 数据时 tick rule 识别主动方有误(Chakrabarty-Pascual-Shkilko 2015;Easley-López de Prado-O'Hara 2016)。这是方向误判,不是幅度偏差,线性中性化和截面残差都去不掉,只能按每只股票可被分类的程度去筛或收缩。(2)每只股票自己的噪声尺度(种子 7、8)。div(ts_mean(C,20), ts_std(C,60)) 是订单流的 t 值:均值相同,日间离散大的那只更不可信。种子 8 再叠加 (1) 的筛。(3)持续性 = 拆单的痕迹(种子 9、10)。Chordia-Subrahmanyam(2004)的机制是机构拆单使不平衡自相关;C 不自相关的股票,它的均值更像噪声。ts_autocorr(C, 60/120, 1) 只当排除筛(cs_last_low20 / cs_last_low40),不和 C 相乘(两个有符号量相乘会把四个象限塌成两端)。(4)两个次要检验,各 2 个种子。(a)
    吸收在价格上看不看得到(种子 11、12)。库里另一份信息 S = sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 100)):它的多头腿是 decay(S) 低,即价格钉得越久、成交量越平稳 = 一个价位被持续吃单。C 说谁是主动方,S 说有一堵挂单墙在吸收;两者同时成立,就是主动买单正在吃一堵卖墙。cs_first_low20 把处在这个状态的 20% 名字排到最前、在其中按 C 排序;cs_last_high40 把明显不在这个状态(斜率持续为正)的 40% 压到最后。这是一个条件双排序,不是把两个 head 相加。(b) 时间(种子 13、14)。sub(decay(C,20), ts_mean(C,120)) 扣掉每只股票自己 120 日的 OF 常态:价格离散、买卖反弹会让 tick rule 对某些股票有持久的偏差,这部分是微观结构的假象,不是资金流。sub(decay(C,10), decay(C,60)) 问的是「刚开始被吸收」给不给分。Barber-Odean-Zhu(2009)发现不平衡在周到月的尺度上延续、在年的尺度上反转。已知 C 越平滑越好(+0.52 → +0.62 → +0.89),所以我事先预期这两个种子弱于 (1)–(3),放进来是为了让结果能证伪「慢的部分才是信息」。【避开的陷阱】所有筛用 cs_last_* / cs_first_*:x 位按并列整块进出(ops_ext.py 的 _rank_block),不用会在并列块里按列序切桶的 cs_bucket_*。w、零收益占比、基尼都是有界的比例,不是成交额或换手的水平;不做任何凸变换;不用 day_max(Volume)(按股数计的峰量:M 的拆解里换成 Amt 后,所在 head 从 +1.29 崩到 −0.17,说明它带着价格水平)。w 低、零收益占比高的股票偏向低价股;排除它们只会把多头书从低价股那边推开,和低价股效应(陷阱 3)方向相反,不是借它涨分。S 只出现在种子 11、12 的筛位,从不直接被排序,所以 S 的饱和并列不会变成列序斜坡。【为什么和以前不一样】以前的外围全是 C 的时间平滑,只改变 EMA 里哪些天占权重,与 C 的秩相关接近 1。这里的外围要么改变多头十分位里装哪些股票(把
    10–40% 不可靠或不在吸收状态的名字整块排除),要么按可靠度或自身噪声改变每只股票的权重。新输入是 w、零收益占比、成交基尼、C 的自相关和 S 的状态。【为什么样本外还会在】(i) 测量误差来自「在 1 分钟 bar 上做 tick rule」这个构造本身,是机械的:只要用分钟数据算 OF,零收益分钟和成交集中就会让一部分股票的估计不可靠,与样本期无关,所以筛掉它们带来的提纯在样本外同样成立;(ii) 核心的 alpha 来自拆单与吸收(Kyle 1985;Chordia-Subrahmanyam 2004)。A 股机构 / 大户被动挂单、散户主动成交的结构没有变(Jones 等用 2016–2019 的账户数据确认大额账户净交易正向预测收益);(iii) 外围不引入任何波动、市值或流动性的水平,换手整体变化或波动换档时,筛的定义不变。
