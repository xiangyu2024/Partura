  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [1, 13]
    reasons: '【算子逐字核对】RSJ = day_signed_ratio(in_delta(Close, 1), mul(Δp, Δp)):ops_ext.py:122 计算 Σ|y|·sign(x) / Σ|y|,这里 y = Δp² ≥ 0,所以 RSJ = (RV+ − RV−) / RV。in_delta(dt_in.py:301)第一列为 NaN;网格第一列是 09:30 集合竞价,第一个差值是开盘后第一分钟减开盘价,不含隔夜。ER = day_signed_ratio(Δp, Δp) = ΣΔp / Σ|Δp|。所有变动等幅时 sub(RSJ, ER) = 0,只剩「大变动比一般变动更偏向哪一边」,实现了「去方向、留形状」。cs_regres(·, day_sum(Ret)) 的几个版本把 rev 压到 0.00–0.03,有效。【创新度 4】库里没有任何 head 量过价格变动的符号不对称。它和 pow_2(pow_2_5(day_durbin_watson(High))) 共用 Δp² 这一原料,但 RSJ 对波动大小不变:保留种子的 vol 在 0.03–0.21,与该 head 的原始 |ρ| 最高 0.29(种子 1)。与全部 head 的原始 |ρ| ≤ 0.32;保留种子里除 5、6(0.31、0.32)外都 < 0.3。不给 5:RSJ 就是 Bollerslev-Li-Zhao(2020)的原量,1 − 2·RV−/RV 也就是 A 股卖方早有的「下行波动占比」;种子 11 的日内已实现偏度同理。【合理度 4】机制(概率加权 / 彩票偏好)清楚,算子精确。20–60 日的平滑与文献里周到月的尺度一致,且有 2023-08-08 之前美国和中国的证据。没有落进陷阱 1 / 3:用的是半方差之比,尺度无关,不是方差大小的凸函数。种子 10 改用 Ret,控制相关和种子 4 几乎一样(0.23 / 0.20 / 0.26 对 0.23 / 0.18 / 0.25),说明竞价那一列没有把 Ret² 的权重带偏。【不给 5】(1) 文献证据集中在周度预测、多空两腿,而且主要来自被高估的正偏一端;纯多头做负偏一端,收益较弱。(2) 因子早已公开,样本外有拥挤风险。(3) 最小价位使低价股的 Δp 几乎都是 1 tick:这时 RSJ ≈ ER、sub ≈ 0,sub 族的极端值会集中在高价股,书里可能带价格水平的倾斜。这是方差上的差异、不是均值上的差异,相关度表看不出来,建议 PI 事后看多头书的价格分布。【划掉】1:裸 RSJ 与 20 日反转 |ρ| 0.49,离控制线只差 0.01,基本是控制换个写法(PI 也预期它被划);线性中性化去不掉 RSJ 对收益的有界非线性部分。13:cs_regres(sub(RSJ, ER), OF) 没有实现「拿掉与订单流 head 共有的部分」。sub 与当日收益 R 相关,对 OF 回归后的残差约等于 α·(R 对 OF 的残差),即「订单流解释不了的价格」,正是 C(价格解释不了的订单流)的反面。所以它与 C head 的 |ρ| 从同结构的种子 5 的 0.26 升到 0.45。要拿掉订单流部分,应对 C 本身回归,或同时对 OF 和 R 回归。剩 11 个种子。'
    revise: '—'
R:
  - head: 'inv(pow_1_5(inv(sigmoid(pow_1_5(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 100))))))))'
    soundness: 4
    reasons: '变体就是本轮定位对这棵 head 本身测过的窗口拆解:100 → 200,score +1.16 → +1.39,train 1.16 → 1.39、valid 1.66 → 2.42,两个区间同向;50 / 100 / 200 单调(+0.83 / +1.16 / +1.39),增益 +0.24,超过 +0.1。机制:50–100 日的时序斜率估计误差,经过近似取符号的 sigmoid 会变成符号翻转,加长窗口能降噪,与第 1 轮 R(50 → 100)方向一致。变体与原 head ρ 0.707 ≥ 0.5,走替换;与已知族 0.20,与 5 个控制 ≤ 0.22。风险:200 日的斜率更接近静态的个股特征;PI 明确不再往 400 推,合理。'
  - head: 'inv(ts_decay_linear(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 100)), 40))'
    soundness: 3
    reasons: '改的是同一子树 sigmoid(ts_regbeta(…)) 的窗口,机制同 R1,算子只改窗口。但证据是间接的,而且这棵 head 自己的谱系不利。同样是 50 → 100:兄弟 head 上 +0.33(0.83 → 1.16),这棵上只有 +0.087(0.961 → 1.048),说明外层的 decay 40 已经拿走了大部分降噪收益。按同样的比例推,兄弟 head 上 100 → 200 的 +0.24 到这里约 +0.06,过 +0.1 的把握低于 PI 说的一半。部件「可能偏短」说得通,只花 1 次评估,给 3。与原 head ρ 0.761,走替换。'
  - head: 'pow_1_5(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50))))'
    soundness: 3
    reasons: '窗口 50 确实较差,有直接测量:变体 1 就是 +1.16 head 的子树,定位里单独评过 +0.887(train 0.887 / valid 2.97);原 head +0.71(train 0.81 / valid 0.71),增益 +0.18。有两点让我不给 4。(1) 增益主要来自 valid(0.71 → 2.97),train 只涨 0.08;分数变高,是因为较差的区间从 valid 换成了 train。(2) 变体 1 与 +1.16 head 的 |ρ| 0.998、与 +1.05 head 0.885。替换的实际效果是把这棵 head 变成库里另一棵 head 的近副本;R 的替换不经过 0.7 的库禁令,所以它对库的样本外增量接近 0,还加重了 S 族的权重(16 个 head 里已有 7 个)。变体 2(窗口 200)与原 head 的 ρ 不在前三(< 0.553):若落到 0.5 以下会走收录,又会因为与 inv(ts_decay_linear(sigmoid(…, 100)), 40) 的 0.767 被拒。「部件烂」这一点成立,给 3。'
  - head: 'ts_decay_linear(ts_decay_linear(cs_regres(day_signed_ratio(Ret, Volume), day_sum(Ret)), 20), 40)'
    soundness: 3
    reasons: '机制清楚:日度 tick rule 订单流噪声大,拆单留下的单边流要在几周到一个季度上平均。只改平滑长度,算子实现了它;上限以 Barber-Odean-Zhu 的年度反转为依据,并事先登记了停止规则。【不给 4】(1) 证据只在 train:0.52 → 0.62 → 0.89,随有效回看长度单调上升;valid 在最后一步反向(2.63 → 1.85)。继续在起约束的 train 上调平滑长度,接近样本内调参,而时间上离样本外更近的 valid 偏好更短的核。(2) 相关度表显示平滑越长,与市值控制越相关:核心 0.08,decay(C, 20) 一类的种子 3、4 为 0.24,两个变体 0.33、0.36。慢成分有一部分在收敛成与市值相关的个股特征,线性中性化只去掉线性部分,这是陷阱 3 的方向;这也是 E 位种子 13 值得留着的理由。两个变体与原 head ρ 0.96、0.93,走替换。'
summary: 'a 位(E,对核心 C 按 tick rule 可分类程度筛 / 收缩)创新 3、合理 3,划掉 5、6、7、11、12、14 后剩 8 个种子,通过,但筛子带进了流动性载荷,要盯;b 位(N,相对有号跳跃 RSJ)创新 4、合理 4,划掉 1、13 后剩 11 个,通过;R 组 R1 4 分,R2、R3、R4 各 3 分,全部通过。'
