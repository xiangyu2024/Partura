    reasons: '核心 C = cs_regres(day_signed_ratio(Ret, Volume), day_sum(Ret)) 是 head ts_decay_linear(ts_decay_linear(C, 20), 40) 的子树,与 5 个控制的 |ρ| 最高 0.08(size),满足 E 位的核心条件。【创新度 3】这个核心已有的外围只有时间平滑:ts_decay_linear,以及一次幂等、等于没做的 cs_regres。本位的外围改做「按 tick rule 能定方向的程度去筛或收缩」,用的是同一类输入(分钟 Ret、Volume),机制不同,也不是改窗口。种子与 C head 的原始 |ρ| 在 0.40–0.69(残差 0.40–0.76),达不到 4 分要的 < 0.3。【算子逐个核对】day_signed_ratio(abs_(Ret), Volume) = Σ V·1[r≠0] / Σ V:ops_ext.py:122 里 sign(|r|) 在 r = 0 时为 0,正好是 C 的分母里被定了方向的成交量占比。_lexi / _rank_block 让并列按整块进出,ts_mean(w, 40) 是连续量,不会出现列序斜坡。mul(·, w) 里 w ∈ [0, 1] 且为正,不会把四个象限塌成两端。【机制描述要更正一处】C 的分子只含 r≠0 的分钟,所以 |C| ≤ w:低 w 的名字原始 C 被压向 0,不会是极端值。它们出问题是在 cs_regres 之后:残差约等于 −β·day_sum(Ret)(封板日最典型),是当日收益的反转代理,不是订单流。筛和收缩仍然对准了这些名字,算子实现了「去掉 C 不可靠的部分」,其中按天加权的种子 4 最直接。【合理度给 3 不给 4】(1) 文献(Odders-White 2000;Chakrabarty 等 2015)只说明误判存在,没有证据说筛掉之后因子更好。(2) 相关度表显示,筛子把控制载荷带了进来。liq / known / size:核心 0.02 / 0.02 / 0.08;种子 1 为 0.21 / 0.18 / 0.16;种子 8 为 0.23 / 0.20 / 0.18;种子 5 为 0.34 / 0.30 / 0.29;种子 6 为 0.41 / 0.36 / 0.43。w、零收益占比都是低价、不活跃股票的代理,台阶式排除就是流动性的非线性函数(陷阱 3),线性中性化去不掉。train(2019–2020 大票占优)与 valid(2022–2023 小票占优)的风格方向相反,而 score 由 train 约束,所以有借风格抬分的风险。收缩版的种子 3、4 和自相关筛 9、10 的 liq ≤ 0.01,是干净的。【划掉】5:day_zero_ratio(Ret) 就是 Lesmond-Ogden-Trzcinka 的零收益非流动性指标,控制载荷最高,而且和种子 1 的 w 量的是同一件事。6:cs_last_high*(·, day_gini(Volume)) 是 M 的两棵 head(+1.09、+1.03)现成的外围,day_gini(Volume) 自身 −3.67,在那里只当排除筛用;它测的是基尼筛本身的效果,不是 C 的可靠度,且 size 0.43、liq 0.41。7:均值除以标准差只是 C head 的换皮(原始 0.83、残差 0.87,表也会划)。11、12:把库里两棵 head(C 与 inv(decay(S, 40)))做条件双排序,是 head 拼接,不处理 C 的测量误差;12 与 S head 0.73,表也会划。14:decay10 − decay60 照搬了第 1 轮 S 位 sub(decay(S, 10), decay(S, 60)) 的外围,问的是时机而不是测量误差,而且与 train 上「越平滑越好」(0.52 → 0.62 → 0.89)相反。【保留 13】扣掉 120 日常态,对应「tick rule 的持久偏差」,属于测量偏差,还能证伪慢成分(见 R4:平滑越长 size 载荷越高)。剩 8 个种子:1、2、3、4、8、9、10、13。'
