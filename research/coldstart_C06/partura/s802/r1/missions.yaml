  core: sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50))
  hypothesis: 【核心 S 是什么】S = sigmoid(ts_regbeta(x=day_flat_run_max(Vwap), y=day_durbin_watson(Volume), 50)):过去 50 个交易日里,「当天分钟均价被钉在同一个值上的最长连续时长占比」对「当天分钟成交量的粗糙度 Σ(Δv)²/Σv²(尺度无关)」的时序 OLS 斜率,sigmoid 把斜率饱和成近似符号(定位输出:裸斜率 valid -0.14,加 sigmoid 后 +1.14;Vwap→Close 四棵 head 全部变差,说明钉住的是「有成交的价格」,不是没成交)。多头腿是斜率持续为负的股票:价格钉得越久,成交量反而越平稳 —— 连续、均匀地在同一个价位成交,即盘口在某一档被持续吸收(大额挂单 / 封板),而不是偶发的零星成交。S 单独 score +0.80,与已知族 rho -0.12。【已见过的外围】库里含 S 的 5 个 head 的外围只有 inv、pow_1_5、sigmoid、ts_decay_linear、再套一层 ts_regbeta(day_flat_run_max(Vwap), ·)—— 全部是 S 的一元单调变换或时间平滑,只改变 EMA 里哪些天占权重,没有引入任何第二个输入。【这次的外围做什么】补上 S 看不到的三件事,每件都用 S 以外的新输入实现:(A) 钉在哪里:钉在当天最高均价(买盘被吸收 / 涨停封板)还是最低均价(卖盘被吸收 / 跌停封板),用 day_at_max_ratio(Vwap) - day_at_min_ratio(Vwap) 在同一 50 日窗口的均值 P 表示(正常日两者都约 1/240,差约为 0;封板日接近 ±1)。实现方式是 mul(inv(ts_decay_linear(S, 40)), P):inv(decay(S)) 把 S 的多头腿(S 持续接近 0)放大,再乘有符号的 P,把这条腿按钉价方向劈成两半 —— 不能直接 mul(S, P),那样 S≈0 的多头腿乘完都是 0,会被挤到中间;另有 day_signed_ratio(in_delta(Vwap,1), Volume)(成交量加权的均价涨跌方向)作为方向的第二种量法。(B) 为什么钉住:低价股在 0.01 元最小价位上是机械性的钉住(一个价位就是很大的百分比),那不是盘口吸收。用 day_distinct_ratio(Vwap)(当天走过多少个不同的价格,网格粗的股票低)、day_flat_ratio(Vwap)、价格水平 day_last(Close) 做分桶去均值 / 截面残差 / 比值,把 S 的持续度和「同样网格粗细的股票」比,去掉机械钉住的那部分。(C) 何时进入:ts_delta(ts_decay_linear(S,20),20) 与 decay(S,10)-decay(S,60) 数的是「刚进入负斜率状态」而不是「一直在里面」,与已有的长平滑是相反的时间操作。【避开的陷阱】S 有约三分之一的并列(sigmoid 饱和),所以不把 S 直接送进任何基于 _pct_rank 的 cs_* / rank 算子(会变成列序斜坡,陷阱 2);分桶变量都是连续的 50 日均值或价格,不用 3 值的 LimitWidth / BoardCode 做桶(同样会按列序切桶);不对 DW 做凸变换(陷阱 1),不引入市值 / 波动 / 流动性的非线性函数(陷阱 3)—— day_distinct_ratio 与 day_at_max_ratio 是价格网格与钉价位置的计数,不是成交量水平。【为什么和以前不一样】已有外围全部是 S 的单调函数,与 S 的秩相关接近 1;这里的外围乘上有符号的第二输入或减去同类股票均值,会改变多头十分位里装的是哪些股票。【为什么样本外还会在】(A) 依据的是制度:A 股 10%/20% 涨跌停与 T+1 下,封板是大户有目的地在一个价位持续吃单(Chen 等 2019 用账户数据证明),涨停封板后价格延续、跌停封板后延续下跌,钉价方向本身就是信息,这是交易制度决定的,不随样本期变;(B) 依据的是价格离散性(Harris 1991):最小价位约束造成的钉住是纯机械的,剔除它之后剩下的才是盘口吸收,这一拆分越干净,越不依赖低价股效应这个会随注册制和退市改变的代理。
