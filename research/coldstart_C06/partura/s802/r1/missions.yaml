  why: '【第 1 次审计后重写】原先的 Volume→Amt 撤回:DW 对同一只股票同一天尺度不变,Amt 只多了日内价格的加权,变体与原 head 的 |ρ| 是 0.998;「四棵里三棵 Amt ≥ Volume」是我读错了拆解表(+1.14 那棵 1.14→1.11、+0.83 嵌套 pow 那棵 0.83→0.82、+0.73 那棵 0.73→0.74),+0.13 只来自 valid,是挑数字。【这次替换的部件】sigmoid 里的原始斜率 β,换成同一次滚动 OLS 给出的 t 值 ts_reg_tvalue(参数顺序与 ts_regbeta 相同,都是 y 对 x)。变体 1 只换内层(与其他 S 系 head 共用的那棵子树),变体 2 内外两层都换。【为什么原始 β 是烂的】β = ρ·σ_y/σ_x,而 sigmoid 的饱和点是按 β 的原始单位定的。所以一只股票的 S 是贴在 0/1 上还是处在线性段,取决于 σ_y/σ_x(成交量粗糙度的日间离散 ÷ 钉价时长的日间离散)这个与信号无关的尺度,而不是斜率的符号有多可靠。对这棵 head,这一点比对其他 S 系 head 更要紧:外层量的是过去 50 日 S 随钉价时长 x 同向还是反向变动;在整个窗口里都饱和的股票上 S 几乎不动,外层斜率约为 0,head 约为 0.5。也就是说,这棵 head 能「看到」哪些股票,是由 σ_y/σ_x 挑出来的。t = β/se = ρ·√(n−2)/√(1−ρ²),只取决于窗口内的相关和样本数,去掉了这个尺度;它表达的正是「斜率的符号有多可靠」,而定位输出说信息就在符号里(裸 β 的 valid −0.14,sigmoid(β) +1.14;+0.73 那棵 head 敲掉 sigmoid 后 +0.73→−0.07)。sigmoid(t) 只在 |t| 很大、也就是窗口内 |ρ| 接近 1 时才饱和,所以内层换成 t 值后,外层回归的 y 在几乎所有股票上都有正常的变动。【证据】(1) 相关度表里结构相同的一对:inv(ts_decay_linear(sigmoid(β),40)) 与 inv(ts_decay_linear(sigmoid(t),40)) 相比,distinct 0.84→1.00,与波动控制的 |ρ| 0.22→0.05,5 个控制都 ≤ 0.06。说明 sigmoid(β) 的饱和格局里带着一部分波动,属于陷阱 3 一类的非线性残留;这棵 head 本身与波动的 |ρ| 约 0.16(相关度表没有单列 head 本身,这里用与它 |ρ| 0.998 的 Amt 版那一行)。(2) 源码:tvalue 与 beta 出自同一次 rolling_ols,se = √(rss/(n−2)/Σdx²);y 在窗口里为常数时 β=0、rss=0,t = 0/(0+EPS) = 0,不会炸。(3) 同一行里,这棵 head 与其他 S 系 head 的 |ρ| 最高只有 0.28,它的信息在 S 的变动里而不在 S 的水平里,所以「谁的 S 会动」由一个无关尺度决定,对它的伤害最直接。【没有的证据】这棵 head 上没有直接测过这个替换;score 方面的依据只有上面的结构对照与「信息在符号」的定位结果。窗口不动:这棵 head 外层 50→25 是 −0.05,50→100 是 +0.47,50 已是最好的。若两个变体都掉分,说明这棵 head 的分数有一部分来自 σ_y/σ_x 的挑选,第 2 轮不再在它上面花 E 或 R。'
