- type: N
  hypothesis: 【机制】被吸收的订单流:成交量站在哪一边,和价格往哪一边走,是两件事。day_signed_ratio(Ret, Volume) = Σ V·sign(r) / Σ V,按分钟 tick rule 把成交量记为主动买(分钟收益为正)或主动卖(为负),是不需要逐笔数据的日度净主动买入占比(Lee-Ready 1991 的 tick test;Easley-López de Prado-O’Hara 2012 的 bulk volume classification 也是按 bar 的价格变化切成交量);day_signed_ratio(Ret, Ret) = Σ r / Σ|r|,是当天价格路径的净方向占路径总长度的比例(效率比)。两者之差 A = 净主动买入占比 - 价格净方向:成交量说「在买」而价格没涨(A > 0),说明主动买单被对面的限价单吸收了;A < 0 说明主动卖单被吸收、价格没跌。Kyle(1985)里知情交易者把订单拆开以隐藏信息,做市方 / 限价方吸收订单流;Chordia-Subrahmanyam(2004)发现个股订单不平衡有很强的自相关(拆单),并且在控制同期价格变化之后,滞后的不平衡仍能预测收益。在 A 股,主动下单的多是散户,而有信息的大资金常用限价单被动成交;所以我的事先预期是:被吸收的主动卖出(A 持续为负:卖压大而价格不跌)之后收益更高,多头做 A 低的那一端(奖励会扫正负号,方向由数据定,这里先写下预期)。【算子怎样实现】(1) 差值:sub(day_signed_ratio(Ret,Volume), day_signed_ratio(Ret,Ret)),按 10/20/40 日平均或线性衰减(拆单的执行期是几天到几周);(2) 逐股时序残差:ts_regres(价格方向或 day_sum(Ret), 订单流, 60) 取每只股票自己 60 日内「订单流里价格解释不了的部分」,不同股票的冲击系数不同,残差比差值更干净;(3) 截面残差:cs_regres(订单流, 价格方向 / 当日收益),把订单流对同日价格变化做截面回归后取残差,专门去掉和 20 日反转控制重合的那部分;(4) 拆单的持续性:ts_autocorr(订单流, 40, 1) 乘订单流均值;(5) 最重的 10% 分钟(day_topw_mean(sign(Ret), Volume))的方向与其余分钟方向之差,以及这些分钟的超额收益 —— 大块成交的方向与散单方向不一致时,更可能是大资金;(6) 换成 5 分钟价格变化做 tick rule 的版本,检验 1 分钟噪声。【为什么和库里不同】库里 6 个 head:5 个是价格钉住时长对成交量粗糙度的斜率 S 的单调变换,1 个是日内成交量第一小时对最后一小时的差;全部不含价格变化的方向。这里的输入是收益符号与成交量的联合,机制是订单流被吸收,预期与所有 head 的 |rho| < 0.3。订单流以符号为主、对成交量做了自身归一化,所以不是流动性、波动或市值的非线性重写;价格方向的部分被差值 / 残差扣掉,不是 20 日反转的换写法。【为什么样本外还会在】这是交易机制造成的,不是统计巧合:大资金必须拆单执行(冲击成本随单量上升),拆单在几天到几周内留下持续的、被吸收的单边订单流;只要 A 股的投资者结构仍是散户主动成交、机构被动挂单,这个痕迹就会存在。统计量是分钟成交量的占比与收益符号,不依赖成交量水平和波动水平,换手率整体变化或波动率换档时不会失效。
  inspired_by: 第 1 批:库里两份真实信息都是价格与成交量的日内联合形态(S:价格钉住时长 × 成交量粗糙度;day_mean(neg(in_delta(Volume,60))):成交量的日内时点),但没有一个 head 用到价格变化的方向与成交量的联合;文献里最成熟的这类量是订单不平衡(Chordia-Subrahmanyam 2004)
