- head: inv(ts_decay_linear(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50))), 40))
  why: 内层 inv 是烂的:定位拆解里敲掉它 score 从 +0.73 升到 +0.96(train 0.96 / valid 2.43),必要性 -0.23,rho_head 0.64、rho_known -0.16。机制上,S 的多头腿 S≈0,inv(S) 把这些天变成极大值,ts_decay_linear 被单个极端日主导,而不是数「最近有多少天处在这个状态」;去掉 inv 后 decay 才是在数天数(distinct 0.67→0.84)。同时 ts_regbeta 窗口 50 偏短(另一棵 head 上 50→25 崩到 +0.40,50→100 +0.32),50 日的斜率估计误差大(Vasicek 1973),所以给出窗口 100、decay 80、以及把斜率换成 t 值(用估计误差标准化,而不是靠 sigmoid 硬截断)的版本。
