slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [3, 4, 6, 7, 8, 9, 10, 11]
    reasons: '核心 S=sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50)) 与 5 个控制的 |ρ| 都小于 0.25(liq 0.07 / vol 0.24 / rev 0.02 / known 0.12 / size 0.05),满足 E 位条件;按源码,ts_regbeta(x,y,d) 是 y 对 x 的斜率,与假设写的一致。已有外围(inv、pow_1_5、sigmoid、ts_decay_linear、再套一层 ts_regbeta)都是 S 的单调变换或平滑。这次留下的外围做了两件新事。(A) 乘一个有符号的第二输入 P=ts_mean(day_at_max_ratio(Vwap)-day_at_min_ratio(Vwap),50),把 S 的多头腿按钉价位置劈成两半。核对算子:inv(ts_decay_linear(S,40)) 在多头腿(S≈0)上是很大的正值,在空头腿(S≈1)上约等于 1,乘 P 之后两端分别是「多头腿且 P>0」和「多头腿且 P<0」,确实实现了劈开;覆盖率 0.981,inv 没有大量产生 inf。(C) ts_delta 和长短 decay 之差衡量的是刚进入状态,而不是一直处在状态里,与已有外围的长平滑是相反的时间操作。相关度表:种子 1/2/5/14 与 head 的原始 |ρ| 在 0.04–0.26,种子 12/13 是 0.40/0.46(残差 0.28/0.29)。外围的新输入仍是同一类东西(分钟 Vwap 的钉价计数),只是机制不同,所以创新度 3,够不上 4。合理度 3:机制清楚,算子实现了它,窗口与 S 的 50 日对齐。不给 4 的原因是和文献的对应偏松:一字板(全天一个价)上 day_at_max_ratio 与 day_at_min_ratio 都等于 1,差是 0,而不是假设里说的 ±1;非涨跌停日上 P 量的是在日内高点和低点各停了多久,与 Chen 等(2019)的封板行为只部分重合。划掉的种子:3(与 head |ρ| 0.72,规则);4(无符号的 at_min 只放大缩小、不分方向,与 head 1 原始 0.69、残差 0.81,是换皮);6(0.77,规则;另外 P 在流动性好的股票上大量恰好为 0,cs_bucket_demean 的 _buckets 用稳定 argsort 把这一大块并列按列序切进不同的桶,与陷阱 2 同类);7(liq 0.59 / known 0.58,规则;day_distinct_ratio(Vwap) 数的是分钟 Vwap 有多少个不同的值,活跃分钟在多个价位成交,Vwap 落在价格网格之外,所以它主要反映成交活跃度而不是网格粗细,拿它做除数就是流动性的非线性函数,陷阱 3);8(0.73,规则,问题同 7);9 和 10(0.89,规则,换皮);11(0.91,规则;而且 Close 是后复权价,与真实价位差 2.5–113 倍,不是 Harris 所说的最小价位约束,机制没有实现)。因此 (B) 部分全部出局,剩下 1、2、5、12、13、14 共 6 个种子。附注两点。种子 2 的 day_signed_ratio(in_delta(Vwap,1),Volume) 里,钉住的分钟符号为 0、只进分母,所以它量的是没钉住的那部分成交往哪边走,而不是钉在哪里;它和 N 位 b 的订单流输入很接近,偏离了 (A) 的本意,但仍可作为方向的代理,所以保留。种子 5 先在日内乘 inv(S) 再做 decay,与 R 组 1 里 PI 自己指出的「decay 被 inv(S) 的单个极端日主导」是同一个问题;作为 GP 的起点保留。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [8, 9, 11, 12, 14]
    reasons: '输入是分钟收益符号和成交量的联合:订单流 OF=day_signed_ratio(Ret,Volume),效率比 ER=day_signed_ratio(Ret,Ret)=Σr/Σ|r|。库里 6 个 head(5 个 S 族,1 个成交量日内时点)都不含价格方向;这里的机制是订单流被对手方吸收。相关度表:留下的种子与所有 head 的原始 |ρ| ≤ 0.13,残差 ≤ 0.28(种子 10 对 day_mean(neg(in_delta(Volume,60))) 最高),所以创新度 4;订单不平衡在文献里已有(Chordia-Subrahmanyam 2004),给不到 5。核对算子:day_signed_ratio(x,y)=Σ|y|·sign(x)/Σ|y|,与假设所写一致。ts_regres(x,y,d) 取的是 y 对 x 做滚动 OLS 的残差(rolling_ols 的 y~α+βx),种子 4/5 的参数顺序正确,取出的确实是订单流里价格解释不了的部分;cs_regres(Y,X) 同理。窗口 10–60 日对应拆单的执行周期,合理。合理度 4:Chordia-Subrahmanyam(2004)发现控制同期收益之后,滞后的不平衡仍能预测收益,这是 2023 年以前的文献证据;差值、时序残差、截面残差做的正是这一步控制。不给 5 有两个原因。第一,引用的文献结论是买方不平衡之后收益更高(做多 A 高的一端),PI 事先的预期却是做多 A 低的一端(被吸收的卖压);两个方向都讲得出故事,说不死样本外为什么还会在。第二,1 分钟的 tick rule 很粗:零收益的分钟只进分母,低价股的 OF 会被压向 0,种子 1–3 与 size 的 |ρ| 在 0.24–0.34 也与此一致。划掉的种子:8(rev 0.56,规则;只有 OF、没扣价格方向,是反转的另一种写法);11(rev 0.57,规则);14(废品,distinct 0.048,ts_rank 在 60 日窗口里只有 60 个取值);9(ts_autocorr × ts_mean 是两个有符号的量相乘,「反持续 + 净卖」和「持续 + 净买」会落在同一端,没有实现「持续的单边订单流」);12(ts_corr(OF, day_sum(Ret), 40) 不在假设列出的 (1)–(6) 里,它量的是订单流与价格的耦合强度,丢掉了订单流的方向,而且 liq 0.39 / known 0.33,偏向流动性代理)。剩下 1、2、3、4、5、6、7、10、13 共 9 个种子。提醒两点。种子 6 的 rev 0.44 已接近门槛。分钟网格第 0 列是 09:30 集合竞价,如果这一列的 Ret 是隔夜跳空,ER=Σr/Σ|r| 会被它主导,A 里就混进了隔夜方向;GP 长出的候选需要留意这一点。'
    revise: '—'
R:
  - head: 'inv(ts_decay_linear(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50))), 40))'
    soundness: 4
    reasons: '内层的 inv 确实是烂的。S=sigmoid(β) 近似只取 0 和 1 两个值(核心 distinct 0.67),ts_decay_linear(S,40) 数的是处在 β>0 状态的加权天数;而 inv(S)=1+e^{-β} 在多头腿上跨越很多个数量级,decay(inv(S)) 就由窗口里 β 最负的那一天决定,不再是计数。拆解证据在两个区间方向一致:敲掉内层 inv 后,train 0.73→0.96,valid 1.38→2.43,distinct 0.67→0.84。变体 2/3 的窗口证据来自别的 head,较弱,但不会有害。变体 4 用 ts_reg_tvalue(β/se)代替 β,按估计误差做了标准化,相关度表上它与 5 个控制的 |ρ| ≤ 0.06,比 β 版本(vol 0.22)干净。注意:变体 1 与 head 1 的原始 |ρ| 是 1.00,因为 inv(pow_1_5(inv(S)))=S^1.5,head 1 其实就是 inv(decay(S^1.5,40));它与原 head 的 |ρ| 是 0.96。替换之后库里会有两棵几乎一样的 head,多样性并没有增加。'
  - head: 'inv(pow_1_5(inv(sigmoid(pow_1_5(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50))))))))'
    soundness: 4
    reasons: '「窗口 50 偏短」在本 head 上有直接证据,而且两个区间方向一致:ts_regbeta 50→100 时 train 0.83→1.16,valid 1.00→1.66;50→25 时 valid 掉到 0.40,随窗口单调。机制:50 日斜率的估计噪声大,经过近似取符号的 sigmoid 后变成符号翻转,加长窗口可以降低这种噪声。中段 pow_1_5 敲掉后 train 0.93、valid 1.38,两个区间都上升(必要性 -0.10);它只是单调函数外面再套单调函数,去掉是合理的。两处合并的变体 2 没有直接测过,但两个改动的方向一致。'
  - head: 'inv(ts_decay_linear(inv(pow_1_5(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50))))), 40))'
    soundness: 3
    reasons: '机制说得通(decay 越长,对状态天数的计数越细;斜率窗口越长,噪声越小),算子也实现了它,但「这两个窗口是烂的」证据偏弱。本 head 上 decay 取 20/40/80 时 score 是 1.11/1.14/1.24,+0.10 的增益只来自 train,valid 反而 2.70→2.62。ts_regbeta 用 100 的证据来自兄弟 head;另一棵嵌套 head 上外层窗口 50→100 反而从 0.83 掉到 0.47,虽然那是不同位置的窗口。decay 120 超出了测过的范围。所以给 3,不给 4。'
  - head: 'day_mean(neg(in_delta(Volume, 60)))'
    soundness: 4
    reasons: '诊断正确,我按源码核对过。in_delta(X,60) 沿分钟轴做差分,day_mean 在 181 个有值的分钟上取平均时逐项抵消,所以原 head =(前 60 分钟成交量 − 后 60 分钟成交量)/181,单位是股数(第 0 列是 09:30 集合竞价,两个版本都包含它)。这样截面排序的两端是「成交量水平高、且前重或后重」的股票,是时点方向乘流动性水平的交互,线性中性化去不掉,与陷阱 3 同类。in_scale(Volume)=v_t/Σv 把它换成当日成交占比,只留下时点形态,替换的部件正好针对这个问题。相关度表:各变体与原 head 的原始 |ρ| 在 0.69–0.80,残差却只有 0.40,说明对控制取残差之后,原 head 里有一大块和占比版不一样的东西,与「残差里还带着成交量水平」的说法一致。Amt 的占比与 Volume 的占比几乎相同(只多了日内价格加权);30 和 120 分钟两个尺度也合理。'
  - head: 'sigmoid(ts_regbeta(day_flat_run_max(Vwap), sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50)), 50))'
    soundness: 1
    reasons: '依据不成立。DW=Σ(Δx)²/Σx² 对同一只股票的同一天是尺度不变的(DW(c·x)=DW(x)),拆股和价格水平在 DW(Volume) 里本来就消掉了;换成 Amt 只多了日内价格路径(几个百分点)的加权。所以「对价格水平不同的股票更可比」这个机制并不存在,变体与原 head 的 |ρ| 是 1.00(0.998)。+0.13 的增益只来自 valid(0.83→0.96),train 反而从 1.09 降到 1.06。PI 说「四棵被拆的 head 里三棵 Amt ≥ Volume」,与拆解表不符:head 1 从 1.14 降到 1.11,head 2 从 0.83 降到 0.82,两棵都变差;head 4 从 0.73 到 0.74 基本持平;只有本 head 上升。这是在一个几乎一样的信号上挑 valid 的数字,属于数字游戏。'
summary: '两个任务位都通过:a(E,S 核心;创新度 3 / 合理度 3)划掉 3、4、6–11 后剩 6 个种子;b(N,订单流被吸收;创新度 4 / 合理度 4)划掉 8、9、11、12、14 后剩 9 个;R 组 1–4 通过,R 组 5(DW 的 Volume→Amt)合理度 1,删掉。'
