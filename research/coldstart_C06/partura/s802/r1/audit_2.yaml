    struck_seeds: [3, 4, 6, 7, 8, 9, 10, 11, 14]
    reasons: '本位与第 1 次审计时完全相同:核心、假设、14 个种子逐字未变,corr_2 里 slot a 各行与 corr_1 一致。所以第 1 次的判断仍成立,这里只补一处更正(种子 14)。核心 S=sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50)) 与 5 个控制的 |ρ| 都小于 0.25(liq 0.07 / vol 0.24 / rev 0.02 / known 0.12 / size 0.05),满足 E 位条件。按源码,ts_regbeta 经 rolling_ols 取 y~α+βx 的斜率,与假设写的一致。已有外围(inv、pow_1_5、sigmoid、ts_decay_linear、再套一层 ts_regbeta)都是 S 的单调变换或平滑。这次的外围做了两件新事。(A) 乘一个有符号的第二输入 P=ts_mean(day_at_max_ratio(Vwap)-day_at_min_ratio(Vwap),50)。inv(ts_decay_linear(S,40)) 恒为正、在多头腿上很大,乘 P 之后两端分别是「多头腿且 P>0」和「多头腿且 P<0」,确实实现了劈开(覆盖率 0.981)。(C) ts_delta 和长短 decay 之差衡量的是刚进入状态,与已有外围的长平滑是相反的时间操作。留下的种子与 head 的原始 |ρ| 在 0.20–0.46,残差 ≤ 0.29,与控制 ≤ 0.31。外围的新输入仍是同一类东西(分钟 Vwap 的钉价计数),只是机制不同,所以创新度 3。合理度 3:机制清楚,算子实现了它,窗口与 S 的 50 日对齐。不给 4,因为和 Chen 等(2019)的对应偏松:一字板上 at_max 与 at_min 都等于 1,差是 0 而不是 ±1;非涨跌停日上 P 量的是在日内高点和低点各停了多久。新提醒一点:inv=1/x,多头腿上 S≈e^β,inv(decay(S)) 随 |β| 指数增长、跨越很多数量级,所以每一端内部的排序主要由 |β| 的大小决定。而 |β| 的大小正是 PI 在 R 组 5 里指出的 σ_y/σ_x 无关尺度。E 位的核心不能改,但 GP 长出的候选如果排序被 inv 主导,需要留意。划掉的种子:3(与 head 0.72,规则);4(无符号的 at_min 只放大缩小、不分方向,原始 0.69、残差 0.81,是换皮);6(0.77,规则;另外 P 在流动性好的股票上大量恰好为 0,cs_bucket_demean 用稳定 argsort 把这块并列按列序切进不同的桶,与陷阱 2 同类);7(liq 0.59 / known 0.58,规则;day_distinct_ratio(Vwap) 主要反映成交活跃度,拿它做除数就是流动性的非线性函数,陷阱 3);8(0.73,规则,问题同 7);9 和 10(0.89,规则,换皮);11(0.91,规则;Close 是后复权价,不是 Harris 所说的最小价位约束)。14 是更正第 1 次审计的遗漏:ts_delta(ts_decay_linear(S,20),20) 和 P 都是以 0 为中心的有符号量,相乘之后,同一端装的是「刚进入多头状态且钉在低点」和「刚离开多头状态且钉在高点」两群股票,没有共同的理由。这和我在 b 位划掉种子 9 是同一个问题。它与所有 head、所有控制的 |ρ| 都 ≤ 0.07,也说明这个乘积接近噪声。剩下 1、2、5、12、13 共 5 个种子,仍 ≥ 4。附注两点。种子 2 的 day_signed_ratio(in_delta(Vwap,1),Volume) 量的是没钉住那部分成交往哪边走,偏离了 (A) 的本意,作为方向的代理保留。种子 5 先乘 inv(S) 再做 decay,会被单个极端日主导,作为 GP 的起点保留。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [8, 9, 11, 12, 14]
    reasons: '本位与第 1 次审计时完全相同(假设、14 个种子逐字未变,corr_2 里 slot b 各行与 corr_1 一致),判断不变。输入是分钟收益符号和成交量的联合:订单流 OF=day_signed_ratio(Ret,Volume),效率比 ER=day_signed_ratio(Ret,Ret)=Σr/Σ|r|。库里 6 个 head(5 个 S 族,1 个成交量日内时点)都不含价格方向;这里的机制是订单流被对手方吸收。相关度表:留下的种子与所有 head 的原始 |ρ| ≤ 0.13,残差 ≤ 0.28(种子 10 对 day_mean(neg(in_delta(Volume,60))) 最高),所以创新度 4;订单不平衡在文献里已有(Chordia-Subrahmanyam 2004),给不到 5。核对算子:day_signed_ratio(x,y)=Σ|y|·sign(x)/Σ|y|,零收益的分钟只进分母,与假设所写一致;ts_regres(x,y,d) 取 y 对 x 滚动 OLS 在窗口末端的残差,种子 4/5 的参数顺序正确,取出的确实是订单流里价格解释不了的部分;cs_regres 同理;day_topw_mean(sign(Ret),Volume) 是成交量最大的 10% 分钟里收益符号的平均,种子 10 实现了 (5);种子 13 只用 in_delta(Close,5) 的符号和自身比值,后复权的尺度在同一只股票同一天里消掉,不受影响。窗口 10–60 日对应拆单的执行周期,合理。合理度 4:Chordia-Subrahmanyam(2004)发现控制同期收益之后,滞后的不平衡仍能预测收益,这是 2023 年以前的文献证据;差值、时序残差、截面残差做的正是这一步控制。不给 5 有两个原因。第一,引用的文献结论是买方不平衡之后收益更高,PI 事先的预期却是做多 A 低的一端(被吸收的卖压);两个方向都讲得出故事,说不死样本外为什么还会在。第二,1 分钟的 tick rule 很粗,低价股的 OF 会被压向 0,种子 1–3 与 size 的 |ρ| 在 0.24–0.34 也与此一致。划掉的种子:8(rev 0.56,规则;只有 OF、没扣价格方向,是反转的另一种写法);11(rev 0.57,规则);14(废品,distinct 不过门槛,ts_rank 在 60 日窗口里只有 60 个取值);9(ts_autocorr × ts_mean 是两个有符号的量相乘,「反持续 + 净卖」和「持续 + 净买」落在同一端,没有实现「持续的单边订单流」);12(ts_corr(OF, day_sum(Ret), 40) 不在假设列出的 (1)–(6) 里,量的是订单流与价格的耦合强度,丢掉了订单流的方向,而且 liq 0.39 / known 0.33,偏向流动性代理)。剩下 1、2、3、4、5、6、7、10、13 共 9 个种子。提醒两点:种子 6 的 rev 0.44 已接近门槛;分钟网格第 0 列是 09:30 集合竞价,如果这一列的 Ret 是隔夜跳空,ER=Σr/Σ|r| 会被它主导,A 里就混进了隔夜方向,GP 长出的候选需要留意。'
    revise: '—'
R:
  - head: 'inv(ts_decay_linear(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50))), 40))'
    soundness: 4
    reasons: '与第 1 次相同,判断不变。内层的 inv 确实是烂的:S=sigmoid(β) 大量饱和(核心 distinct 0.67),ts_decay_linear(S,40) 数的是处在 β<0 状态的加权天数;而 inv(S)=1+e^{-β} 在多头腿上跨越很多个数量级,decay(inv(S)) 就由窗口里 β 最负的那一天决定,不再是计数。拆解证据在两个区间方向一致:敲掉内层 inv 后,train 0.73→0.96,valid 1.38→2.43,distinct 0.67→0.84。变体 2/3 的窗口证据来自别的 head,较弱,但不会有害。变体 4 用 ts_reg_tvalue 代替 β,相关度表上与 5 个控制的 |ρ| ≤ 0.06,比 β 版(vol 0.22)干净;它与 R 组 5 是同一个想法,两处的结果可以互相印证。注意:变体 1 与 head 1 的原始 |ρ| 是 1.00,因为 inv(pow_1_5(inv(S)))=S^1.5,head 1 其实就是 inv(decay(S^1.5,40));替换之后库里会有两棵几乎一样的 head,多样性并没有增加。'
  - head: 'inv(pow_1_5(inv(sigmoid(pow_1_5(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50))))))))'
    soundness: 4
    reasons: '与第 1 次相同,判断不变。「窗口 50 偏短」在本 head 上有直接证据,而且两个区间方向一致:ts_regbeta 50→100 时 train 0.83→1.16,valid 1.00→1.66;50→25 时 valid 掉到 0.40,随窗口单调。机制:50 日斜率的估计噪声大,经过近似取符号的 sigmoid 后变成符号翻转,加长窗口可以降低这种噪声。中段 pow_1_5 敲掉后 train 0.93、valid 1.38,两个区间都上升(必要性 -0.10);它只是单调函数外面再套单调函数,去掉是合理的。两处合并的变体 2 没有直接测过,但两个改动的方向一致。'
  - head: 'inv(ts_decay_linear(inv(pow_1_5(inv(sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50))))), 40))'
    soundness: 3
    reasons: '与第 1 次相同,判断不变。机制说得通(decay 越长,对状态天数的计数越细;斜率窗口越长,噪声越小),算子也实现了它,但「这两个窗口是烂的」证据偏弱。本 head 上 decay 取 20/40/80 时 score 是 1.11/1.14/1.24,+0.10 的增益只来自 train,valid 反而 2.70→2.62。ts_regbeta 用 100 的证据来自兄弟 head;嵌套的那棵 head 上外层窗口 50→100 反而从 0.83 掉到 0.47,虽然那是不同位置的窗口。decay 120 超出了测过的范围。所以给 3,不给 4。'
  - head: 'day_mean(neg(in_delta(Volume, 60)))'
    soundness: 4
    reasons: '与第 1 次相同,判断不变。诊断正确:in_delta(X,60) 沿分钟轴做差分,day_mean 取平均时逐项抵消,原 head =(前 60 分钟成交量 − 后 60 分钟成交量)/181,单位是股数。截面排序的两端是「成交量水平高、且前重或后重」的股票,是时点方向乘流动性水平的交互,线性中性化去不掉,与陷阱 3 同类。in_scale(Volume)=v_t/Σv 把它换成当日成交占比,只留下时点形态,替换的部件正好针对这个问题。相关度表:各变体与原 head 的原始 |ρ| 在 0.69–0.80,残差却只有 0.40,说明对控制取残差之后,原 head 里有一大块和占比版不一样的东西,与「残差里还带着成交量水平」的说法一致。Amt 占比与 Volume 占比几乎相同;30 和 120 分钟两个尺度也合理。'
  - head: 'sigmoid(ts_regbeta(day_flat_run_max(Vwap), sigmoid(ts_regbeta(day_flat_run_max(Vwap), day_durbin_watson(Volume), 50)), 50))'
    soundness: 3
    reasons: '这一组针对第 1 次的意见改了内容,不只是换了说法。Volume→Amt 撤回了;读错拆解表的地方也如实更正了(+1.14 那棵 1.14→1.11,嵌套 pow 那棵 0.83→0.82,+0.73 那棵 0.73→0.74)。新替换的部件是 sigmoid 里的原始斜率 β,换成同一次 rolling_ols 给出的 t 值。【源码核对】rolling_ols 里 se_beta=√(rss/(n−2)/Σdx²),tvalue=β/(se_beta+EPS),EPS=1e-9。代入 rss=Syy−Sxy²/Sxx,得 t=ρ√(n−2)/√(1−ρ²),对 x、y 的尺度都不变;参数顺序与 ts_regbeta 相同。y 在窗口里为常数时,β=0、rss=0、t=0,与 PI 说的一致。x 为常数时,β 与 t 都是 NaN,不会炸。【机制成立】β=ρ·σ_y/σ_x。x=day_flat_run_max(Vwap) 在 [0,1] 之间,流动性好的股票上 σ_x 很小,β 很容易大到让 sigmoid 在数值上恰好等于 1.0 而形成并列(核心 distinct 只有 0.67)。所以哪些股票被饱和、在外层回归里 S 不动,确实由 σ_y/σ_x 这个尺度挑出来。PI 对外层的推导按源码成立:整个窗口都饱和时 cov=0,外层斜率为 0,sigmoid(0)=0.5,这些股票被放在正中间。【相关度表的旁证,逐条核对属实】R 组 1 的变体 1 与变体 4 这一对:distinct 0.84→1.00,vol 0.22→0.05,5 个控制都 ≤ 0.06。本 head 用 corr_1 里与它 |ρ| 0.998 的 Amt 版代替:vol 0.16,与其他 S 系 head 最高 0.28。变体 1:distinct 0.90→0.96,vol 0.16→0.10,liq 0.00。没有落进 §4 的陷阱:t 值去掉的恰好是与控制相关的尺度,而不是在控制上做非线性变换。窗口沿用 50 有依据:外层 50→25 是 −0.05,50→100 是 +0.47。【给 3 不给 4 的原因】(1) 这个替换在本 head 上没有直接测过,R 组 1 的变体 4 也还没测,证据只有相关度的结构,PI 自己也写明了。(2)「信息在符号里」的定位证据(裸 β −0.14,sigmoid(β) +1.14,+0.73 那棵敲掉 sigmoid 后 −0.07)只说明 β 的原始量级有害,区分不了「近似取符号」和「t 值」哪个好。n=50 时 |ρ|<0.28 对应 |t|<2,sigmoid(t) 落在 0.12–0.88 之间,是 ρ 的平滑函数而不是符号,形状和原来不同,哪个更好要靠评估。(3) 变体 2 外层也换成 t 后,vol 是 0.17,并没有比原 head 的 0.16 更干净;「去掉波动残留」这条论据只对变体 1 成立。另外,变体 2 外层的 y=sigmoid(t_inner) 是重叠窗口造成的慢变序列,外层 t 只是外层滚动相关的单调变换,截面排序约等于 ts_corr(x, S, 50)。小影响一条:t 里含 √(n−2),停牌多、有效天数少的股票 |t| 被压小、向 0.5 靠拢,方向上符合「越不可靠越靠中间」,不是陷阱。两个变体与原 head 的 |ρ| 是 0.70 / 0.66,与 known 是 0.02 / 0.08;如果涨分,会走替换。PI 写明了两个变体都掉分时怎么处理(第 2 轮不再在这棵 head 上花 E 或 R),这是事先登记的可证伪结果,不是挑数字。'
summary: '两个任务位和 R 组 1–4 与第 1 次相同,判断不变:a(E,创新 3 / 合理 3)补划了种子 14(两个有符号量相乘混淆方向,与 b 位种子 9 同理),剩 5 个种子,通过;b(N,创新 4 / 合理 4)剩 9 个,通过。R 组 5 已按意见改成实质不同的 β→t 值替换,机制成立,算子按源码核对无误,但本 head 上没有直接证据,合理度 3,通过。'
