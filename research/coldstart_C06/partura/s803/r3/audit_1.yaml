R:
  - head: 'pow_2_5(sqrt(ts_reg_fvalue(day_std(Amt), day_centroid(Amt), 20)))'
    soundness: 3
    reasons: '源码核对成立:sqrt 是 sqrt(|x|),pow_2_5 是 pow_(x, 2.5),e > 1 时是普通幂,所以 head = F20^1.25;F = (n−2)c²/(1−c²) 只依赖 |c|,符号确实被扔掉了。变体 1、2 与 head 的日度秩是 1.00、0.998,截面排序完全相同,分数差只来自线性中性化怎样处理原始量级。F^1.25 在 |c| → 1 时尾巴极重,中性化回归会被少数股票支配,去掉凸包装有道理,也符合 §4 对凸变换的警惕。依据是 50 日同族的三个单调改写 1.51 / 1.49 / 1.56(sqrt 的必要性 +0.04),这是旁证,不是这个 head 本身的拆解。变体 3 找回符号,与 head 0.64 ≥ 0.5,可以走替换;它与时点水平 head cross_mean(sqrt(sqrt(day_centroid(Amt))), 20) 有 0.53,说明符号里有一部分是时点水平,若它胜出,要分清胜的是哪一份。变体 4 cross_stddev(day_centroid(Amt), 20) 其实是一个新因子,不是去部件;它也不是衰减公式里的量(衰减取决于噪声占总方差的份额,不是总标准差)。本轮 slot a 的表上,按 cross_stddev(day_centroid(Amt), 50) 分桶后 F 与 head 1 仍有 0.78,所以「这个量本身就带走大部分分数」不太可能;但作为收录测试(与所有 head ≤ 0.39,与控制 ≤ 0.27)无害。合理度 3。'
  - head: 'cs_mask_top_replace_mean(mul(0.5, neg(day_centroid(Amt))))'
    soundness: 2
    reasons: '机制说得通,但这组变体实现不了 PI 说的「替换」。按 §2,替换要求变体与原 head 的 ρ ≥ 0.5(与库禁令同一个日度秩量)。三个变体与这个单日 head 的原始 |ρ| 都不在各自的前三名里,即分别 < 0.272、0.284、0.284,不可能替换。变体 1、3 与 head 5 cross_mean(sqrt(sqrt(day_centroid(Amt))), 20) 是 0.837、0.872,也不能收录,这两次评估没有任何可能改变库;只有变体 2(0.662)能以 head 5 近亲的身份收录(残差 0.82)。
      所说的烂部件证据也不足。mul(0.5, ·) 是纯尺度,去掉它什么都不变。这个 head 自己与已知族只有 −0.19(第 2 轮定稿);−0.50 那份已知族暴露属于 20 日平滑后的形态(定位:cross_mean(sqrt(day_centroid(Amt)), 20) −0.5035,40 日 −0.5615),变体是先平滑造出这个问题,再分桶修掉它。cs_mask_top_replace_mean 把最早的 10% 并到当日均值,等于把多头书从最早的一档挪到第二档。在 head 5 的拆解里,单日 day_centroid(Amt) 是 −0.08,而这个 head 是 +0.86;两者半衰期不同,差距不能全算在这一步上,但至少不支持「它扔掉了信息」。
      改法:同样的想法应当对 head 5 做 R。三个变体与它 0.66–0.87,替换可以走通;它真正的烂部件就是与已知族约 −0.50 的暴露,变体就用这三个已知族十分位内排序 / 秩残差的版本。'
  - head: 'div(cross_max(ts_var(pow_2_5(cs_last_low40(day_q_stat_std(Volume), day_pos_ratio(Volume))), 50), 15), day_pos_ratio(Volume))'
    soundness: 2
    reasons: '诊断本身成立(源码核对):cs_last_low40(y, x) 对 x 最低 40% 的整段并列块输出 rank(y) − 1 ∈ (−1, 0],其余股票输出 rank(y);pow_2_5 = pow_(x, 2.5),e > 1 时走 torch.pow,负底数得 NaN。所以这一层是一道藏起来的样本删除,ts_var / cross_max 对 NaN 容忍,外层的 coverage 看不出来。
      但这组变体实现不了「替换」。三者与原 head 的日度秩 |ρ| 只有 0.27、0.25、0.24(残差 ≤ 0.42),都 < 0.5,按 §2 不能替换,只能作为新 head 收录;也就是说,这个藏着 NaN 筛选的 head 无论结果如何都会留在库里。变体 2、3 cross_mean(day_zero_ratio(Ret), 20 / 60) 与流动性控制 0.65、0.61,与已知族 0.58、0.54。按划种子的同一标准(与某个控制 ≥ 0.5 即控制换了写法),它们就是流动性的非线性重写(§4 陷阱 3);评估时也会因与已知族 |ρ| ≥ 0.5 被判不合格,万一过线收录,等于把流动性通道放进库里。变体 1 是诚实版,但定位里同骨架的 head 去掉 pow_2_5 后 rho_known 升到 +0.45;本表里变体 1 与流动性 0.43、已知族 0.40、市值 0.45,即使收录,也是一个贴着控制的密度量。
      改法:要替换,就得保留 head 的大部分排序(ρ ≥ 0.5),只把 NaN 筛选换成显式处理。例如 pow_2_5(add(cs_last_low40(day_q_stat_std(Volume), day_pos_ratio(Volume)), 1)):最低 40% 仍排在底部,但不被删掉,其余结构不动;先在表上看它与原 head 的 ρ。零收益比例那两颗删掉。'
  - head: 'div(cross_sum(day_sum(mul(mul(Ret, Ret), abs_(Ret))), 3), cross_sum(cross_quantile_q50(ListAge, 3), 20))'
    soundness: 3
    reasons: '量级那部分确实是烂部件。mul(mul(Ret, Ret), abs_(Ret)) = |r|³,是 σ 的 3 次齐次量;head 方向 −1,买的是低 Σ|r|³,也就是 §4 陷阱 1 的低波动多头腿。定位的奇偶对照(r|r| 版比 |r|³ 版低 0.47)支持「赚分的是量级」。除以 pow_1_5(Σr²) 是已实现高阶矩的标准归一化(pow_ 在 e > 1 时是普通幂,Σr² > 0,不会出 NaN);算子实现正确,3 日与 20 日窗口合理。
      但两个变体同时拿掉了 ListAge 分母,这一步没有依据,定位的数字还与之相反:分子单独 cross_sum(day_sum(|r|³), 3) 只有 +0.35,带上 ListAge 分母是 +1.53;cross_quantile_q50 换成 cross_sum 只是换了写法(必要性 +0.01),说明不了年龄分母没用。所以如果变体分数掉下来,分不清丢掉的是量级还是年龄带来的分数,「分数来自量级」的判决会归错因。
      变体本身落在峰度族里:与 day_kurt(Ret) 0.70、与 cross_mean((kurt+3)², 15) 0.63 / 0.83,残差 0.95 / 0.84。变体 2 与原 head 的 ρ < 0.49(不在前三名),又与峰度 head ≥ 0.7,既不能替换也不能收录,这一次评估改变不了库;只有变体 1 在与原 head ρ ≥ 0.5 时才可能替换。建议补一颗只去量级、保留年龄分母的变体:div(div(cross_sum(day_sum(mul(mul(Ret, Ret), abs_(Ret))), 3), pow_1_5(cross_sum(day_sum(mul(Ret, Ret)), 3))), cross_sum(cross_quantile_q50(ListAge, 3), 20)),这才是对陷阱那一部分的干净检验。合理度 3:要去掉的主要部件确实有病,替换件也对准了它。'
summary: '第 3 轮第 1 次审计:N 位(隔夜 / 日内拉锯)创新度 4、合理度 4,不划种子,通过;E 位(F 核心)创新度 3、合理度 3,但精度条件化的 8 颗和有符号的 3 颗在表上就是 head 1 的换皮,划掉后只剩安慰剂差分 3 颗,不足 4 颗,退回重写;R 组里 R1、R4 通过,R2(变体与原 head 的 ρ < 0.3,替换走不通)与 R3(替换走不通,且有 2 颗是流动性重写)不通过。'
