    reasons: '(1) 源码核对。rolling_ols 里 fvalue = ess/(mse+EPS),ess = tss − rss,mse = rss/(n−2),所以 F = (n−2)R²/(1−R²),对 x、y 对称、只依赖 |c|,PI 的代数成立。cs_rank 是 (0,1] 的序数秩,所以 mul(cs_rank(F), sign(c)) 对 c 单调,(iii) 的写法实现了「找回符号」。cs_bucket_rank(y, x) 在 x 的十分位内排 y,再加 1e-4 倍总体秩破并列;cs_regres(Y, X) 是 Y 对 X 的截面残差,参数顺序与 PI 的意图一致。没有凸变换,分桶变量连续,已知族只当条件变量,不落 §4 的三个陷阱。
