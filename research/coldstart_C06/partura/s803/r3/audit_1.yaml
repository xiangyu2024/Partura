      (3) 合理度 4。机制清楚,有 2023-08 之前美股与 A 股两个市场的文献(LPS 2019、Berkman 等 2012、Qiao & Dam 2020、An 等 2022);算子逐个实现了 PI 说的量;窗口 5/10/20/60 合理。不给 5 有两条原因:隔夜 / 日内拆分在 A 股业内早已广为人知,有拥挤衰减的风险;纯多头书只吃较弱的一端(PI 已承认)。
      另有三处实现细节,GP 跑的时候值得注意,但不构成划种子的理由:
      (i) 种子 1–3、8、10、11 用 div(day_last(Close), cross_delay(day_last(Close), d)) 作回归变量,这个量含复牌首日的跳空;而 cross_sum(O, d) 把那天的 O 当 NaN 跳过,两边口径不一致。窗口内复牌过的股票,残差会被跳空主导。改用日收益的 cross_sum(复牌首日同样是 NaN)或 cross_sum(add(O, I), d) 作回归变量,可以消掉这个不一致。
      (ii) 种子 11 的一字板门 is_gt0(day_std(Ret)) 依赖 Ret 第 0 分钟是否含隔夜跳空;本种子第 1 轮定稿里 PI 自己写过「Ret 首分钟可能含隔夜跳空」。如果含,一字板日的 day_std(Ret) > 0,这道门就是空操作,种子 11 约等于种子 1;表上两者与 head、与控制的相关几乎一样,与这个推测吻合。用 is_gt0(sub(day_max(High), day_min(Low))) 判断日内有没有价差更稳。
