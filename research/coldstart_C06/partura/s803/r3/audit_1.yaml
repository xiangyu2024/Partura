      (ii) 是这个位真正新的东西。种子 9 与 head 1 只有 0.35,种子 10、11 是 0.62、0.67,读的是「成交爆发与钱的时点联动、却不被价格移动时点联动解释的那一份」,对应 Admati & Pfleiderer 的流动性交易聚集,说得通。但「两个重心对精度的暴露相同」这个前提没验证:|Ret| 重心的噪声来自零收益分钟和 tick 网格,Amt 重心的噪声来自少数大单,来源不同。好在表已经表明精度不是主驱动,差分差掉的主要是两者共有的真实耦合,剩下的机制本身成立。
