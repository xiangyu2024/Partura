    revise: '本位只因划完剩 3 颗种子(不足 4 颗)不通过,创新度和合理度都够线。重写时:
      (a) 放弃 (i) 精度条件化这一支。表已经给出判决(0.75–0.81),这类种子和它们的后代都会被库禁令挡掉,不必再花种子位。如果仍想留一颗作对照,只用零收益比例或基尼这类稀薄度量,不用 cross_stddev(day_centroid(Amt), ·),它不是噪声份额。
