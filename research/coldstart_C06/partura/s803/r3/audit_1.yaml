    reasons: '(1) 源码核对。价格字段是后复权(alphacube/tradability.py、daily.py 都有注明),跨日比价不需要另外除权。day_first / day_last 取当日第一个 / 最后一个非 NaN 值,daily.py 里日频 Open 本身就定义为 day_first(Open),所以 O 就是「当日第一个有效开盘价 / 前一交易日最后收盘 − 1」。cross_delay 只是按交易日下移;停牌日整天 NaN 时,复牌首日的 O 为 NaN。cross_sum 用 nansum,整窗全是 NaN 才返回 NaN。cs_regres(Y, X) 是 Y 对 X 的截面 OLS 残差,(a) 的参数顺序正确。ts_corr 的方差项按样本数平均再加 EPS = 1e-9,日收益方差在 1e-4 量级,EPS 不起作用。全部种子都没有凸变换,没有截面不变量进 cs_*,分桶变量是连续的 20 日平均分钟波动,不落 §4 陷阱。与控制的相关最高是种子 4 对反转 0.38、种子 5 对反转 0.24(秩差里的 −rank(ΣI) 近似负的总收益),都 < 0.5。
