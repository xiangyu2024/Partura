  hypothesis: '新 idea:同样一段涨跌,有多少是在开盘集合竞价里完成的,有多少是在连续竞价里完成的(隔夜与日内的拉锯)。 定义(后复权价;源码 alphacube/tradability.py
    注明后复权价的比值跨除权日连续,跨日比价不用另外除权):隔夜 O = sub(div(day_first(Open), cross_delay(day_last(Close),
    1)), 1),前收到今开,第 0 根分钟线是 9:30 开盘集合竞价;日内 I = sub(div(day_last(Close), day_first(Open)),
    1)。(1+O)(1+I) = 日收益。停牌日没有分钟数据,复牌第一天的 cross_delay(day_last(Close), 1) 是 NaN,所以
    O 也是 NaN;cross_sum 对 NaN 容忍,复牌跳空(多日收益)被自动剔除。 机制:两段由不同的人定价。开盘竞价集中了被隔夜消息和关注度吸引的个人买单。Berkman,
    Koch, Tuttle & Zhang (2012) 显示高关注度股票隔夜涨、日内回吐,开盘价相对日内偏高,难估值、难套利的股票更强。Lou, Polk
    & Skouras (2019) 显示机构与个人分别主导日内与隔夜,两段的截面溢价方向相反。A 股更强:T+1 使开盘买入当天不能卖出,Qiao & Dam
    (2020) 证明 T+1 让隔夜段系统性折价,折价随波动增大;An, Huang & Li (2022) 发现 A 股隔夜异象不对称,只在前一日日内段下跌之后显著。
    算子实现: (a) 主因子:把总收益固定住,只看隔夜那一份。cs_regres(cs_rank(cross_sum(O, d)), cs_rank(div(day_last(Close),
    cross_delay(day_last(Close), d)))),d = 5 / 10 / 20。O + I 约等于总收益,所以这个残差就是负的日内残差,读的是「同样的
    d 日涨跌,有多少是竞价给的」。它与 20 日反转控制在构造上正交:控制是总收益,这里把总收益回归掉了。中性化吃不掉它,不是因为凸,而是因为它本来就在控制的零空间里。
    (b) LPS 的写法:sub(cs_rank(cross_sum(O, 20)), cs_rank(cross_sum(I, 20))),以及 5 日版;另留一颗裸的
    cross_sum(O, 20) 作对照。 (c) T+1 折价里的风险补偿部分与波动成正比(Qiao & Dam),在 20 日平均分钟波动 cross_mean(day_std(Ret),
    20) 的十分位内排序,把它和注意力部分分开。 (d) 不对称:cross_sum(mul(O, is_lt0(cross_delay(I, 1))), 20),只累计前一日日内段下跌之后的隔夜(An
    等 2022),另有对总收益的秩残差版。 (e) 一字板:当天所有分钟 Ret = 0,day_std(Ret) = 0,O 是一个买不进的跳空;mul(O,
    is_gt0(day_std(Ret))) 把这些天置 0,再做 (a)。 (f) 开盘价被连续竞价纠正的强度:ts_corr(O, I, 20 / 60),无量纲、有界,即竞价定的价被日内系统性回吐的程度。
    (g) 竞价占价格发现的份额:Σ|O| / (Σ|O| + Σ|I|),20 日,零次齐次。 为什么和库里不同:17 个 head 的输入全是单日之内的分钟分布(收益的高阶矩、零分钟、成交时点、DW),没有一个跨日比价,没有一个用到开盘价与前收。这组种子不对任何量做凸变换(陷阱
    1);不用 cs_* 处理截面不变的量,分桶变量是连续的 20 日平均波动(陷阱 2);不是市值、波动、成交额的非线性函数(陷阱 3)。is_lt0 / is_gt0
    只当条件门,累计量都是连续实数,过 distinct 门槛。 预期方向:多头 = 同样的涨跌里竞价份额小、价格在连续竞价里形成的股票;高隔夜份额那一端,是被开盘注意力抬高、随后回吐的。纯多头书只吃前一端。
    样本外为什么还在:机制来自制度和投资者结构(T+1、开盘集合竞价、个人投资者占成交多数),2023-08 之后都没有变。隔夜 / 日内拆分在美股(Lou 等
    2019、Berkman 等 2012)和 A 股(Qiao & Dam 2020、An 等 2022)两个市场、不同样本期都成立。它只用日频的开盘价与收盘价,没有分钟级的测量噪声,也不读薄股票的稀疏度,不会跟着换手状态漂移。'
