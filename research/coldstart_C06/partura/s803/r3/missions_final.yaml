  why: 烂部件:pow_2_5(sqrt(·)) 这层包装,以及 F 本身对 |相关| 的凸映射和被扔掉的符号。依据(源码 + 本机验算):ts_reg_fvalue
    = ess/(mse+EPS) = df·c²/(1−c²),c = ts_corr(x, y, d),相对误差 8e-7,且对 x、y 对称;所以 head
    = F^1.25,是对 |c| 的两层凸映射,方向信息在 c² 里丢了。依据(定位已付费):同一家族窗口 50 的三个单调改写(裸 / sqrt / sub(sqrt,
    重心))是 1.509 / 1.490 / 1.557,sqrt 的必要性 +0.04,包装不带信息。变体:(1) 裸 F20,去掉包装;(2) abs_(ts_corr(·,·,20)),诚实的有界
    |c|;(3) ts_corr(·,·,20),找回符号:爆发日的钱前移到开盘(负)还是后移到收盘(正);(4) cross_stddev(day_centroid(Amt),
    20),F 的衰减分母。若 head 的分数主要是重心测量噪声造成的 R² 衰减(本机合成面板:真实耦合处处相同时,F 与重心噪声的秩相关 −0.80;Gassen,
    Ashbaugh-Skaife & Veenman 2020 在同步性 R² 上的同一结论),这个量本身就应带走大部分分数,回归与包装都是绕路。(1)(2)
    若 ≥ head + 0.1,就用诚实版替换;(3) 明显高于 (2) 说明符号载有信息。
  variants:
  - ts_reg_fvalue(day_std(Amt), day_centroid(Amt), 20)
  - abs_(ts_corr(day_std(Amt), day_centroid(Amt), 20))
  - ts_corr(day_std(Amt), day_centroid(Amt), 20)
  - cross_stddev(day_centroid(Amt), 20)
- head: cross_mean(sqrt(sqrt(day_centroid(Amt))), 20)
  why: 第 1 次审计之后换了目标:上一稿对 cs_mask_top_replace_mean(mul(0.5, neg(day_centroid(Amt))))
    做 R,三个变体与它的日度秩 ρ 都 < 0.3,替换走不通;审计员指出同样的想法应当对这个 head(+1.28,train 1.28 / valid 1.40,方向
    −1,hl 5)做,它才是这三个变体的近亲。 烂部件:(1) 单日的 sqrt(sqrt(·)):定位里去掉外层 sqrt 的必要性只有 +0.03(cross_mean(sqrt(day_centroid(Amt)),
    20) = +1.25);单日 day_centroid(Amt) 是 −0.08,单日 sqrt(sqrt(重心)) 是 −0.65,分数全在 20 日平均里,不在单日的凹变换里。(2)
    平滑之后的时点水平贴着已知族:定位的 rho_known 随平滑单调上升,单日 −0.19,10 日 −0.41,20 日 cross_mean(sqrt(day_centroid(Amt)),
    20) −0.5035,Volume 版 −0.4995,40 日 −0.5615;这个 head 是恰好卡在 0.5 线内的写法。机制上,成交越集中在开盘几分钟,day_std(Amt)
    越大、重心越早,20 日平均后两者成了同一个慢变量。奖励只对已知族做线性中性化,剩下的非线性那份(§4 陷阱 3 的同一类问题)可能正在给这个 head 加分。
    变体:去掉 sqrt(sqrt(·)),只留 20 / 40 日平均重心,并在已知族 cross_mean(day_std(Amt), 30) 的十分位内排序(非线性地去掉已知族),或对已知族的秩取残差(在秩上线性、在水平上非线性)。上一稿的相关度表已经给了这三个表达式的数:与本
    head 的日度秩 |ρ| 是 0.84 / 0.66 / 0.87,全部 ≥ 0.5,替换走得通;与已知族 0.01 / 0.01 / 0.04;与 5
    个控制最大 0.32。 判决:若某个变体 ≥ +1.38(原 head + 0.1),时点水平这条通道就换成一个不靠已知族、不带死重变换的干净版本;若明显掉下来(<
    1.1),这个 head 的分数里有一份是已知族的非线性残余,给最终报告一个判决。分桶版与秩残差版的差,说明那份残余是不是只在十分位尺度上才看得到。
  variants:
  - cs_bucket_rank(cross_mean(day_centroid(Amt), 20), cross_mean(day_std(Amt), 30))
  - cs_bucket_rank(cross_mean(day_centroid(Amt), 40), cross_mean(day_std(Amt), 30))
  - cs_regres(cs_rank(cross_mean(day_centroid(Amt), 20)), cs_rank(cross_mean(day_std(Amt),
    30)))
- head: div(cross_max(ts_var(pow_2_5(cs_last_low40(day_q_stat_std(Volume), day_pos_ratio(Volume))),
    50), 15), day_pos_ratio(Volume))
  why: 烂部件:pow_2_5(cs_last_low40(·,·)) 这一层藏着的样本删除(上一稿审计员已按源码核对):cs_last_low40(y, x)
    对 x 最低 40% 的整段并列块输出 rank(y) − 1 ∈ (−1, 0],其余股票输出 rank(y);pow_2_5 走 torch.pow,负底数得
    NaN;ts_var / cross_max 对 NaN 容忍,外层 coverage 看不出来。所以 ts_var 只在这只股票不在最稀疏 40% 的那些天上算,删掉哪些天由交易密度决定。定位的旁证(同骨架、+1.44
    的 head):去掉 ts_var 后 coverage 0.8861,门槛废品;去掉 pow_2_5 后 valid 从 2.68 塌到 1.20,rho_known
    从 −0.18 翻到 +0.45。 第 1 次审计之后改了什么:上一稿三个变体与原 head 的 ρ 只有 0.24–0.27,替换走不通;零收益比例那两颗是流动性的非线性重写,删掉。原因也看清了:上一稿的诚实版只去掉
    pow_2_5,稀疏日的值变成 rank − 1,股票每进出一次最稀疏 40% 就跳 1,ts_var 读到的是切换频率,不再是原 head 的量。 变体只换掉筛子,其余结构一字不动:(1)
    审计员的写法 pow_2_5(add(cs_last_low40(·,·), 1)):最稀疏 40% 仍排在底部,但不被删掉。它保留了「切换就跳」的结构(稠密日
    (1, 5.66],稀疏日 (0, 1]),所以我预期它与原 head 的 ρ 也可能偏低,以表为准。(2) 把 cs_last_low40(y, x) 换成
    cs_rank(y):源码里 cs_last_low40 对其余股票输出的就是 y 的序数秩,所以从不落进最稀疏 40% 的股票上,这个变体与原 head
    逐点相同;差别只来自原来被删掉的那些天,而且值随 y 连续变化、不跳。它是离原 head 最近的诚实版,预期与原 head 的 ρ ≥ 0.5,可以走替换。
    判决:若 (2) ≥ 原 head + 0.1(+1.01),用不靠 NaN 删除的版本替换;若明显更低,这个 head 的分数(尤其 valid 2.82)有一份是
    NaN 筛选买来的,给最终报告一个判决。
  variants:
  - div(cross_max(ts_var(pow_2_5(add(cs_last_low40(day_q_stat_std(Volume), day_pos_ratio(Volume)),
    1)), 50), 15), day_pos_ratio(Volume))
  - div(cross_max(ts_var(pow_2_5(cs_rank(day_q_stat_std(Volume))), 50), 15), day_pos_ratio(Volume))
- head: div(cross_sum(day_sum(mul(mul(Ret, Ret), abs_(Ret))), 3), cross_sum(cross_quantile_q50(ListAge,
    3), 20))
  why: 烂部件:未归一化的分子 Σ|r|³ 与 ListAge 分母。依据(代数):mul(mul(Ret, Ret), abs_(Ret)) = |r|³,是
    σ 的 3 次齐次量。依据(定位已付费):同一骨架分子换成奇函数 r|r| 后从 +1.40 掉到 +0.93,偶的比奇的高 0.47,赚分的是量级;两个
    ListAge 子树 distinct 0.095 / 0.10,单独门槛废品,cross_quantile_q50 换成 cross_sum 必要性 +0.007,它只是粗分组缩放。本机:所有股票形状律相同、只有
    σ 不同时,Σ|r|³ 与 σ 的秩相关 +0.95,除以 RV^1.5 后 +0.01。所以 head 是 σ³ 按粗年龄组缩放,即陷阱 1 的低波动多头腿。变体把分母换成文献的标准归一化
    RV^{3/2}(Amaya 等 2015、Neuberger 2012 的已实现高阶矩定义),窗口 3 与 20,得到真正的形状量。若 ≥ 原 head
    + 0.1,用诚实版替换陷阱版;若 < 0.5,这个 head 的分数来自量级,给最终报告一个判决。
  variants:
  - div(cross_sum(day_sum(mul(mul(Ret, Ret), abs_(Ret))), 3), pow_1_5(cross_sum(day_sum(mul(Ret,
    Ret)), 3)))
  - div(cross_sum(day_sum(mul(mul(Ret, Ret), abs_(Ret))), 20), pow_1_5(cross_sum(day_sum(mul(Ret,
    Ret)), 20)))
