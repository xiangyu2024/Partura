    struck_seeds: [6, 7, 8, 9, 10, 11]
    reasons: '【相关度表】核心就是整个 head,与 day_kurt(Ret) 原始/残差都是 1.00,与 5 个控制最大 0.26(size),E 位核心条件满足。精确修正 c(种子 1)与 head 原始 0.89,减法版(种子 4)0.91,在 20 日零收益比例十分位内排序(种子 6)0.94,这三颗表上就会划掉(≥0.7)。这也说明稀疏度 n/k 只是 day_kurt(Ret) 截面排序里的次要成分:假设里说裸核心的排序「主要由交易稀疏度决定」,和表对不上;kurt 截面上的差别大部分已经是 c。剩下种子的原始 ρ 落到 0.42–0.51,是外层 cross_mean(·,20)/cross_ema(·,20) 平滑带来的,不是 c 修正带来的:只平滑、不做 c 修正的种子 7–10 也是 0.42–0.49。按 head 自己的半衰期 20 比交易信号残差:c 系种子 2/3/5/12 为 0.79/0.75/0.74/0.80,裸峰度分桶系种子 7–10 为 0.86/0.85/0.86/0.87。所以 c 修正对交易信号的改变是实在的,但幅度中等。【创新度 3】库里这个核心没有任何外围(loc 的共性表和拆解都是空的)。外围不是换窗口、换字段或做单调变换:乘 (1−day_zero_ratio(Ret)) 用的是 kurt+3=(n/k)·c 这条代数恒等式。我核对过 alphacube common._kurt:先去均值,用总体矩,再减 3;day_zero_ratio 与 day_kurt 用的是同一组有限分钟,n 相同,所以日内均值≈0 时这条恒等式是精确的。PI 的随机张量验算 (10.7+3)×48/241≈2.7 也对得上。这算「对已有结构有实质性的改进,并说得出为什么」。但机制仍是 head 自己的「一分钟收益尾部形状」,只是把它净化一下,够不上 4。【合理度 3】这些算子确实实现了修正。cs_winsor 先在截面 1%/99% 截尾,再做 cross_ema(半衰期 20),对单笔主导的日值是合理的;20 日窗口与 head 的 hl 20 一致;c 无量纲,控制 |ρ| 最大 0.29,没有凸变换,没落进陷阱 1/3。不给 4 的理由:前提的量级被表否定;文献方向不一致,Amaya 等(2015)报告的已实现峰度与下期收益是弱的正关系,和 head 的方向 −1 相反,只有 MAX 那篇支持这个方向;train 上也还没有 c 比裸峰度好的证据。【划掉】6–10 都是对裸 day_kurt(Ret) 做分桶排序:种子 6 原始 0.94,说明按稀疏度分桶对峰度近似恒等;7–10 只是靠外层 20 日平滑躲过库禁令的 head 平滑版(残差 0.85–0.87),属于换皮,也没有执行本位要做的「拿掉 n/k」。10 和 11 还有一个实现错误:day_last(Close) 不是 tick 网格粗细的代理。alphacube/label.py 和 daily.py 的注释写明,生产库的 Open/High/Low/Close/Vwap 都是后复权价,与真实成交价之间差一个 2.5–113 倍的个股因子。按它分桶,实际是按「上市以来累计复权收益 × 发行价」分桶,种子声称的 tick 控制并没有实现;去掉后种子 11 剩下的部分就是种子 2。表划 1、4、6,审计划 6–11,剩 2、3、5、12 共 4 颗。【风险,供 GP 之后参考】c 的下限 ≈1 正是「活跃分钟全是一个 tick」的粗 tick 股,多头腿(方向 −1 买低值)会往这里集中。剩下的种子里没有有效的 tick 控制。要控制的话,请用未复权的价位 div(day_sum(Amt), day_sum(Volume)),或 tick 相对一分钟波动的比值做分桶变量,不要用 day_last(Close)。'
    revise: '—'
  - slot: b
    novelty: 3
    soundness: 3
    struck_seeds: [6, 10]
    reasons: '【相关度表】种子 1–5(Close 上的 VR5/VR15、Vwap VR10、|log VR5−0.8047|、Vwap 一阶自相关)与流动性控制的 |ρ| 为 0.51–0.72(已知族 0.47–0.67),表上都会划掉。也就是说,在 train 上一分钟尺度的方差比和带符号的一阶自相关主要是流动性量(买卖价差反弹)。假设里说「5 个控制都不量序列相关」,在数据上不成立。剩下的 7–12 与 head 原始 |ρ| 最大 0.38(种子 7),其余 ≤0.33,控制最大 0.40。【创新度 3】VR、自相关、路径效率都依赖分钟顺序,day_kurt(Ret) 是排列不变量,拿不到这部分信息。输入同类(分钟收益/价格),机制不同,所以是 3。不到 4:输入同类,而且种子 7、9 与 head 交易信号的残差 ρ 为 0.56、0.55。【合理度 3】逐个核对了算子。day_std(in_pct(Close,q))/day_std(in_pct(Close,1)) 用重叠 q 分钟收益,随机游走下 ≈√q;0.8047=log√5 是对的(log 取 |x|)。sqrt 是 sqrt(|x|),sqrt(mul(241, sub(1, zr))) 正好抵掉路径效率在随机游走下 1/√k 的机械部分,所以种子 9 实际是「当日日内净收益 / 已实现波动尺度」,即日内趋势强度。day_autocorr 只用两端都有限的配对,Vwap 版确实只在成交分钟上算。单日 241 点的自相关很吵,所以 20 日均值或 EMA 是必要的,窗口合理。「定价低效 / 延迟」这个机制本身是清楚的。不到 4:Hou–Moskowitz 的价格延迟是周度、相对市场收益的滞后,和一分钟自相关不在一个尺度;一分钟的序列相关主要来自微观结构(反弹、tick 离散、VWAP 平均),表上 12 颗里 5 颗被流动性吸走,就是 train 上的反证据。【划掉】种子 6 abs_(day_autocorr(in_logchg(Vwap,1),1)) 有三个问题。第一,Vwap 是分钟内成交的平均价,相邻两个平均价之差天然带正的一阶自相关(Working 1960:连续成交时约 +0.25,一分钟只有一笔时为 0);薄股票则是负的价差反弹。取绝对值把这两头折到一起,对流动性是 U 形关系,线性中性化去不掉,这是陷阱 3。第二,|ρ̂| 有约 0.8/√(配对数) 的噪声底,配对数就是连续成交的分钟数,本身是稀疏度代理;PI 在路径效率上自己做了归一,在这里没做。第三,表上它与 vol 的 |ρ| 为 0.41。种子 10 想按 day_last(Close) 分桶去掉 tick 网格反弹,但 Close 是后复权价(见 a 位),没有实现这一步,表上 liq 仍为 0.36。表划 1–5,审计划 6、10,剩 7、8、9、11、12 共 5 颗。【提醒】种子 11 的 Vwap 一阶自相关同样带 Working 正偏差,按零收益比例分桶只能部分控制每分钟的成交笔数。种子 8 的五阶自相关不受 Working 效应影响,但它与所有 head 和控制的 |ρ| 都 ≤0.07,更像 20 日平均后的噪声,保留,但别指望它。种子 7 是 PI 自己说的含零分钟钟表时间对照版,与 head 0.38,带零质量成分,保留作对照。'
    revise: '—'
R:
  - head: 'day_kurt(Ret)'
    soundness: 3
    reasons: '【烂部件的依据成立的部分】根算子 day_kurt 对单笔打印无界:只有一笔非零的一天,值 ≈n−3≈238。四阶矩估计被最大值支配,是标准的稳健统计问题,book 的 EMA 对这种日值记住的是峰值。换成有界或分侧的 day_gini(in_logchg(Vwap,1)),或 day_es_ratio_hi/lo(源码:超过 95%/低于 5% 分位的条件均值除以该分位;分位≈0 的死日给 NaN,不是 1e4),说得通。把输入换成只含成交分钟的 in_logchg(Vwap,1)(与 head 原始 0.69),是对「零收益质量」最直接的检验。变体 1、5、6、7 都实现了各自声称要替换的部件。【不成立或浪费的部分】变体 2 day_kurt(in_pct(Close,1)) 与 head 原始和残差都是 1.00:「Ret 首分钟含隔夜跳空」被表否定,这个部件不烂,评估不可能 +0.1。变体 3 day_kurt(in_madz(Ret,30)) 被门槛判为废品:in_madz 在 30 分钟窗口里一半以上是零分钟时 MAD=0,返回 NaN;这正是 PI 自己诊断出的零质量,本可预见。变体 4 day_gini(Ret) 把零分钟按 |x|=0 算进 Gini,Gini 的下界就是零占比,等于把 PI 要剔除的零质量放大回来;表上它与流动性 0.67、与已知族 0.63,已知族 ≥0.5 按规则不合格,不可能替换或收录。另外,「零收益质量主导峰度排序」本身也与表不符(c 与 head 0.89)。所以给 3:主要的替换(根算子换稳健版、输入换成交分钟)有依据,算子也实现了;但 7 个变体里有 3 个是浪费,不到 4。'
summary: 'a 位(从峰度里代数地拿掉零收益稀疏度)与 b 位(日内分钟序列相关)都按 3/3 放行。a 位表划 1、4、6,审计划 6–11(裸峰度分桶的平滑换皮,以及用后复权 Close 冒充 tick 网格),剩 4 颗;b 位表划 1–5(流动性换写法),审计划 6(|自相关| 对流动性是 U 形)和 10(后复权价分桶),剩 5 颗。R 组 3 分放行,但 7 个变体中变体 2(≡head)、3(废品)、4(把零质量放大回来)是浪费。'
