    core: 'day_kurt(Ret)'
    hypothesis: '核心 day_kurt(Ret) 是 241 根一分钟收益的峰度(score +0.97,方向 -1,即多头买低峰度)。它对日内仿射变换不变、自己除掉了尺度,所以不是波动控制 cross_mean(day_std(Ret),20) 的另一种写法。但它混着两样东西。Ret 在 0 上有点质量(无成交、封板、价格没跨过一个 tick 的分钟都恰为 0)。设 n=241 分钟里只有 k 分钟非零,则代数上 kurt+3 = (n/k)·c,c 是活跃分钟自身的四阶矩比(正负一个 tick 来回跳约为 1,高斯约为 3,跳跃驱动的 >3)。随机张量验算(不碰数据):48 个活跃分钟的高斯日 kurt=10.7,高于 241 分钟全活跃的 t(4) 日 3.1;乘上活跃占比 (1-zero_ratio) 后分别是 2.7 与 6.1,形状的顺序就回来了。所以裸核心的截面排序主要由「交易稀疏度」n/k 决定,而 5 个控制里没有一个直接量它:成交额水平不等于有价格变化的分钟数,低价股 0.01 元的 tick 粗,成交额再大也有大量零分钟。本位要试的外围只做一件事:把稀疏度从核心里拆出去,让 GP 在剩下的「活跃分钟的尾部形状 c」上长。三种实现:(a) 精确的代数修正 mul(add(核心,3), sub(1, day_zero_ratio(Ret))),值就是 c;(b) 减法版 sub(add(核心,3), div(3, sub(1, day_zero_ratio(Ret)))) = (n/k)(c-3),即超出「同样稀疏度下高斯应有峰度」的部分;(c) 非参数版 cs_bucket_rank(核心或其 20 日均值, 稀疏度变量),只在稀疏度相同的十分位里比峰度,稀疏度变量用 20 日平均零收益比例、20 日平均最长静止段 day_flat_run_max,或价格水平 day_last(Close)(tick 网格的粗细)。另外 cs_winsor 先截尾再做 20 日 EMA,因为只有开盘一跳的一天 kurt 约为 +236,不截尾的 EMA 是峰值记忆而不是水平。c 的机制是:这只股票的价格是连续地被发现,还是靠少数几笔大单、消息或逼近涨跌停的跳跃完成;高 c 是彩票型、跳跃驱动的人群(散户偏好的 MAX 类股票),低 c 是连续定价。和以前不同:快照里只有裸核心,没有任何候选把零收益质量从峰度里代数地或分组地拿掉;外围用的 mul/add/sub/day_zero_ratio、cs_bucket_rank+稀疏度变量、cs_winsor 都不是平滑或单调改写。刻意避开的陷阱:不用 LimitWidth / BoardCode / 日度 day_zero_ratio 当分桶变量(取值只有 3–4 个或 k/241 个,_pct_rank 用列序拆并列,分桶会变成列序斜坡,陷阱 2);修正乘的是 [0,1] 的活跃占比,没有对任何波动量做凸变换(陷阱 1);c 无量纲,不是市值或流动性的非线性函数(陷阱 3),按成交额分桶那颗种子是在去掉流动性而不是加入它。样本外为什么还在:稀疏度和 tick 网格会随监管、价格水平和市场冷热漂移,这正是裸核心不稳的部分;拆掉之后剩下的 c 反映信息怎样到达这只股票,是慢变的股票特征(head 的半衰期 20 已在网格上边界),A 股散户对彩票型股票的偏好是结构性的。若这些种子大多因与核心 |rho|>=0.7 被划掉,或得分明显低于核心,也直接告诉我们核心主要是稀疏度代理。'
