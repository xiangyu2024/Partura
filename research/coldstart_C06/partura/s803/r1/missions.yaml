      - {title: 'Institutional Investors and the Informational Efficiency of Prices', authors: 'Ekkehart Boehmer, Eric K. Kelley', year: '2009', url: 'https://doi.org/10.1093/rfs/hhp028', treatment: '用日内收益的 |1-VR| 与 |自相关| 作为个股定价低效率度量;对应幅度版种子'}
      - {title: 'Liquidity and market efficiency', authors: 'Tarun Chordia, Richard Roll, Avanidhar Subrahmanyam', year: '2008', url: 'https://doi.org/10.1016/j.jfineco.2007.03.005', treatment: '短期(分钟级)收益可预测性随流动性变化;提醒我们要在流动性/稀疏度相同的组内比较序列相关'}
