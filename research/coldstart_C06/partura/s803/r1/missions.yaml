R:
  - head: 'day_kurt(Ret)'
    why: '两个部件各有一个具体可指的毛病。输入 Ret:在 0 上有点质量(无成交、封板、价格没跨 tick 的分钟恰为 0),代数上 kurt+3 = (241/k)·c,活跃分钟数 k 主导截面排序;随机张量验算:48 个活跃分钟的高斯日 kurt=10.7,高于全天活跃的 t(4) 日 3.1。另外 Ret 首分钟可能含隔夜跳空,一个观测就能主宰四阶矩(Blanc, Chicheportiche & Bouchaud 2014:隔夜段峰度远高于日内段)。根算子 day_kurt:对单个打印无界,只有开盘一跳的一天约为 +236;日内 U 型波动季节性本身就会通过方差混合造出峰度。替换件逐个对准这些毛病:in_logchg(Vwap,1)(Vwap 在无成交分钟为 NaN,只在成交分钟上算同一统计量);in_pct(Close,1)(日内重建,首分钟为 NaN,不含隔夜);in_madz(Ret,30)(按局部 30 分钟稳健尺度标准化,去掉 U 型季节性带来的混合峰度);day_gini(有界、尺度无关,不被单个打印支配);day_es_ratio_hi / lo(分侧的尾部条件均值比,薄日返回 NaN,对应双侧峰度里哪一侧在起作用)。'
    variants:
      - 'day_kurt(in_logchg(Vwap, 1))'
      - 'day_kurt(in_pct(Close, 1))'
      - 'day_kurt(in_madz(Ret, 30))'
      - 'day_gini(Ret)'
      - 'day_gini(in_logchg(Vwap, 1))'
      - 'day_es_ratio_hi(Ret)'
      - 'day_es_ratio_lo(Ret)'
