  - type: N
    hypothesis: '新 idea:日内价格效率,即一分钟收益的序列相关。机制:分钟收益的负自相关 / 方差比 VR<1 是暂时性价格压力被流动性提供者吸收后的回弹(Roll 1984 的买卖价差反弹);正自相关 / VR>1 是信息慢慢进入价格、或散户追涨杀跌造成的日内延续(价格延迟)。文献里价格延迟高的股票在截面上有显著溢价(Hou & Moskowitz 2005),短期收益可预测性随流动性变化(Chordia, Roll & Subrahmanyam 2008),|1-VR| 与 |自相关| 是标准的低效率度量(Boehmer & Kelley 2009)。算子实现:(1) 方差比 div(day_std(in_pct(Close, q)), day_std(in_pct(Close, 1))),q=5、15 分钟的重叠收益,随机游走下比值约为 sqrt(q),偏高=日内趋势,偏低=日内回复;Vwap 版 in_logchg(Vwap,10)/in_logchg(Vwap,1) 用成交均价,压掉最后一笔的反弹;(2) 一阶 / 五阶自相关 day_autocorr(in_logchg(Vwap, 1), n):Vwap 在无成交分钟为 NaN,day_autocorr 丢掉含 NaN 的配对,所以只在真正成交的分钟上算,不是零收益质量的产物;对照的钟表时间版 day_autocorr(in_pct(Close, 1), 1) 把零分钟也算进去;(3) 幅度版 abs_(sub(log(VR 比值), 0.8047))(0.8047 = log sqrt5,即随机游走基准)与 abs_(自相关),按 Boehmer & Kelley 量「偏离随机游走多远」而不管方向;(4) 路径效率 |当日净变动| / 当日路径总长 = div(abs_(day_sum(Ret)), day_sum(abs_(Ret))):随机游走下它约为 1/sqrt(k)(k=活跃分钟数),所以单独用就是稀疏度代理;种子里只用两种去掉这一机械部分的写法:乘 sqrt(241·(1-零收益比例)) 归一,或在 20 日平均零收益比例的十分位内排序。所有日度值都取 20 日均值或 EMA,因为 241 个点的单日自相关很吵。我的先验方向:多头 = 日内接近随机游走或轻度回复的股票,空掉的一端是日内强延续(羊群追涨,之后反转);但由 GP 决定符号。为什么和库里不同:库里唯一的 head day_kurt(Ret) 是分钟收益分布的排列不变统计量,把 241 分钟打乱顺序它的值不变,而本位所有种子都是顺序的函数(打乱后 VR、自相关、路径效率全变)。5 个控制都不量序列相关:波动控制是标准差水平,反转控制是 20 日累计收益(日度而非日内),流动性是成交额水平,已知族是成交额离散度。刻意避开的陷阱:不用 day_durbin_watson(其分母不去均值,约等于已实现方差,陷阱 1),不做任何凸变换,所有量都是无量纲比值或相关系数;tick 网格造成的机械反弹(低价股在两个相邻价位间来回跳,陷阱 3 的价格/流动性非线性)用 cs_bucket_rank 在价格十分位或零收益比例十分位内排序拿掉。样本外为什么还在:日内序列相关来自市场结构(T+1、散户占比高、涨跌停、tick 网格),这些在 2023 年之后都没有变;价格延迟/低效率溢价在多个市场、几十年的样本里都有记录,不是样本内挖出来的尖峰。'
    inspired_by: '第 1 批唯一的 head day_kurt(Ret) 能拿 +0.97,说明一分钟收益分布里有可交易的信息;但峰度是排列不变的,日内分钟的顺序信息库里还完全没人碰。文献:Lo & MacKinlay 1988 的方差比,Boehmer & Kelley 2009 用 |1-VR| 与 |自相关| 量低效率,Hou & Moskowitz 2005 的价格延迟溢价'
