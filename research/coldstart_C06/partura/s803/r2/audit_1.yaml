slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [1, 2, 8, 9]
    reasons: '创新度 3。核心 day_centroid(Amt) 已见过的外围只有 neg、mul(0.5,·)、cs_mask_top_replace_mean。按 loc.md 的拆解,裸 neg(day_centroid(Amt)) 只有 -0.08,head 5 的 +0.86 几乎全靠把最早的 10% 并到均值(去掉 mul(0.5) 不变,去掉 neg 掉到 -0.59)。本位三种参照里,只有 (ii) 是实打实的新东西。种子 4–7(上涨分钟成交额重心减全部成交额重心)与所有 head 的原始 |ρ| ≤ 0.16、残差 ≤ 0.27,与 5 个控制 ≤ 0.08;它把收益符号和时点联在一起,head 5 读不到。(i) 被相关度表否掉了:单日 cross_zscore(·,20) / cross_madz(·,60) 与 head 5 的原始 |ρ| 是 0.76 / 0.80。这说明日度重心的截面差异主要是每天的波动,不是计划里说的慢变「客户结构」,所以自比 z 值约等于水平本身。只有 5 日平均的种子 3 降到 0.35(近 5 日相对 60 日常态的时点变化),介于窗口改写和新东西之间。(iii) 与 head 5 正交,却和 day_kurt 族重叠:种子 8/9 与 day_kurt(Ret) 的残差 |ρ| 是 0.72,与 hurst−kurt head 是 0.63/0.64;种子 10/11 仍有 0.60/0.62。整体是「同一类输入、部分机制不同」,给 3。不到 4,因为种子 3、10、11、12 与 head 的原始 |ρ| 在 0.35–0.47,不满足全部 < 0.3。
      合理度 3。逐个核对了算子。day_centroid(ops_ext.py)先取 |x|,NaN 当 0 权重,全零返回 NaN。is_gt0 是 catalog 里的 is_gt(x,0),等于 (x>0).int(),Ret 为 0 或 NaN 的分钟权重为 0。所以 day_centroid(mul(Amt, is_gt0(Ret))) 确实是上涨分钟成交额的重心,(ii) 的实现与说法一致。它无量纲、没有凸变换,分桶变量是连续的 20 日平均成交额,三个陷阱都没落进去;10/20 日窗口用来压住薄股票上涨分钟少的噪声,合理。cs_regres 是逐日截面 OLS 残差(Y 对 X),cs_bucket_rank 用整体秩打破十桶并列,也都核对过。核心与 5 个控制的 |ρ| 最大 0.19 < 0.5,满足 E 位条件。
      扣分处有三点。第一,(i) 的前提(水平是慢变特征、z 值能把它差掉)被表格否定。第二,(iii) 的「价格延迟」解读,算子没有实现:day_centroid(Ret) 是 |Ret| 的重心,截面上主要由少数大幅移动的分钟落在什么时候决定,这正是峰度读的东西(残差 0.72);它和 Hou & Moskowitz 说的对市场信息的周度滞后反应不是一回事。第三,Comerton-Forde & Putnins (2011) 是识别收盘操纵的指标,Barber & Odean 讲的是净买入而不是时点,都不是这个量预测截面收益的直接证据,所以给 3 不给 4。另外提醒一个风险:封板日(停在涨跌停价、Ret=0 的分钟里成交很多)会把 (ii) 推到两端,纯多头端可能聚到封板股上。
      划掉的种子:1、2 与 head 5 原始 0.76/0.80,自比 z 值仍是水平,是 head 的换皮,表格也会划掉。8、9 是 cs_regres(day_centroid(Ret), ·),与 day_kurt(Ret) 残差 0.72、与 hurst−kurt head 0.63/0.64,本质上是峰度族换了一种读法,也没有实现所说的价格延迟。10、11 的残差 0.60/0.62 偏高,但原始 |ρ| ≤ 0.47,与控制都 < 0.3,保留观察。划完剩 8 颗(3、4、5、6、7、10、11、12)。'
    revise: '—'
  - slot: b
    novelty: 3
    soundness: 4
    struck_seeds: []
    reasons: '创新度 3。库里 6 个 head 读的,要么是分钟收益分布的偶阶形状或幅度,要么是成交额时点:day_kurt;(kurt+3)^2 的 15 日均;hurst−kurt;ts_skew(DW),它实为 σ^6 量级的三阶矩,见 R1;day_centroid(Amt)。RSJ = Σr|r| / Σr² 读的是方差的符号构成,收益取负时精确变号,机制确实不同。但输入同样是 Ret 的分钟分布,而且相关度表显示它并不像计划说的那样与偶函数正交:种子 1 与 day_kurt(Ret) 原始 0.22、残差 0.40;种子 4/8 与 head 6 原始 0.35/0.38。可能的原因是 A 股涨停封板日(一次上跳后全是零)同时给出高峰度和 RSJ≈+1,涨跌停的不对称让奇函数和偶函数相关。另外,已实现偏度和 RSJ 在文献里是成熟量(Amaya 等 2015;Bollerslev, Li & Zhao 2020)。所以给 3:同一类输入,机制不同。
      合理度 4。逐个核对了算子。day_sum 是 nansum(全 NaN 时返回 NaN)。mul(Ret, abs_(Ret)) 的日和 = RV+ − RV−,mul(Ret, Ret) 的日和 = RV。div 是普通除法,全零日 0/0 = NaN。实现与 BLZ (2020) 的定义逐项一致。cross_sum 对分子、分母分别求和的池化,正是论文按周聚合半方差的写法。源码里 sqrt 是 sqrt(|x|),1−zero_ratio 在 [0,1] 内;已实现偏度乘 sqrt(1−零比例) 的修正,在均值近似为 0 时代数正确。这个量零次齐次、有界,不对波动做凸变换(陷阱 1);零收益分钟对分子、分母的贡献都是 0,不是稀疏度的改写(陷阱 3);分桶变量是 20 日收益、5 日收益、20 日平均零收益比例、20 日平均成交额,都是连续量(陷阱 2)。窗口取 1/5/20 日,5 日对应论文的周度。文献证据在 2023-08-08 之前:BLZ (2020, JFQA) 在美股控制已知特征后 RSJ 截面预测显著;Amaya 等 (2015) 是已实现偏度。所以给 4。
      不给 5 的原因:样本外理由偏一般性。RSJ 与收益方向天然相关(20 日池化版与反转控制 0.41–0.43),5 日版本里有多少其实是 A 股的周度反转(不在 5 个控制里),说不清,只能靠种子 5/6 在收益十分位内排序来分辨。用 1 分钟收益时,粗 tick 股票的 RSJ 会退化成(上跳次数 − 下跳次数)/ 总次数,同样只靠种子 7 处理。
      不划种子:10 颗都实现了同一个 idea,没有落进陷阱,与 head 的原始 |ρ| ≤ 0.38,与控制 ≤ 0.43。'
    revise: '—'
R:
  - head: 'ts_skew(day_durbin_watson(Open), 50)'
    soundness: 4
    reasons: '烂部件的判断成立,我按源码独立核对过。alphacube/operators/common.py 的 nanskew_last 返回 m3/(std**3 + EPS),EPS = 1e-9,闸门是 std > EPS。day_durbin_watson 的分母 Σx² 不去均值,作用在分钟价格上就是每分钟的已实现方差,约 1e-6–1e-5。
      我在 scratchpad 里用 numpy 照抄 nanskew_last,在随机方差序列上验算(不碰数据):std 在 1e-7–2.5e-5 时,std³ ≤ 1.6e-14,输出与 1e9·m3 的相对误差中位数是 6e-9。也就是说 ts_skew 实际输出的是三阶中心矩,秩上载有方差水平(合成数据里与尺度的秩相关 0.57)。这正是 §4 陷阱 1 点名的 DW 加凸变换,线性中性化去不掉。拆解里 ts_skew(ts_skew(DW)) 是门槛废品,也和内层输出约 1e-9、撞上闸门一致。
      两个替换件都无量纲。log 版对尺度乘法不变:log 只是平移,偏度不变。比值版是 O(1) 量级,std³ 远大于 EPS。同一验算下,两者与尺度的秩相关都约为 0。替换是最小改动,Andersen 等 (2001) 关于对数已实现波动近似正态的结论支持取 log。
      提醒:log(DW) 会把封板、几乎不动的日子放到很长的左尾(DW 趋于 0,log 发散;DW=0 时 log 返回 NaN),所以 log 版的偏度可能主要读「近 50 日有没有封板日」;比值版没有这个问题。同一个缺陷也在 head 1 cross_autocorr_s1(ts_skew(ts_skew(DW))) 里,本组 R 没有碰它。'
  - head: 'cross_mean(mul(add(day_kurt(Ret), 3), add(day_kurt(Ret), 3)), 15)'
    soundness: 3
    reasons: '代数成立。_kurt 用总体矩再减 3,所以 kurt+3 = m4/m2² ≥ 1(Jensen),mul(x,x) 在每天的截面上严格单调,不改任何一天的秩。它唯一的作用,是让 cross_mean(·,15) 变成凸平均,被 15 天里峰度最高的那一天支配:一跳日 kurt 约 +236,平方后约 5.7e4。
      另有一点支持:第 1 轮已经知道 kurt+3 ≈ (n/k)·c,截面上由稀疏度主导,平方就是稀疏度的凸函数,而线性中性化对流动性只去掉线性部分,沾到陷阱 3 的边。四个变体把「均值 / 上尾均值 / 75% 分位 / 中位数」拆开,能回答 head 6 读的是尖峰还是水平,设计干净,不落陷阱(控制 ≤ 0.40)。
      不给 4:没有数据证据说明平方有害。另外 cross_mean(day_kurt,15) 和 cross_tail_mean_q75 与 head 6 原始 0.97/0.99,几乎是同一个排序,很难比原 head 高出 0.1;有信息量的主要是 q75(0.80)和 cross_med(与 head 6 0.70、与 hurst−kurt head 0.73)这两个。'
  - head: 'day_kurt(Ret)'
    soundness: 3
    reasons: '「共享部分是死重」这个判断有已付费的证据。计划里引用的第 1 轮 R:day_kurt(in_logchg(Vwap,1)) 与 head 秩相关 0.69–0.81,score 只有 +0.02(head +0.97)。所以把 head 在它上面的投影拿掉、看剩下的部分,是有依据的检验。变体 2 在秩空间做 cs_regres(cs_rank, cs_rank),做的正是这件事:cs_regres 的源码是逐日截面 OLS 残差,NaN 会被掩掉,也不会被两个重尾量的极端值支配。
      扣分:计划给的机制(Clark 1973 的成交时间对日历时间),算子没有实现。in_logchg(Vwap,1) 仍是日历分钟上的收益,只是丢掉了无成交分钟、改用分钟均价、去掉了第 0 分钟。所以两者的差主要是三样东西:零收益质量(稀疏度 n/k,第 1 轮 E 位已经用 (1−零比例) 做过);收盘价相对 VWAP 的反弹;开盘第一分钟。它不是「成交到达的突发程度」。而且粗 tick 低价股连续两分钟 VWAP 相同时也会给出 0,零质量并没有完全去掉。变体 1 把两个重尾的峰度直接相减,差值由当天任一边的极端值支配,比较粗糙。
      两个变体都便宜,不落陷阱(控制 ≤ 0.25),检验有价值。'
summary: '两个位都通过。E 位 day_centroid(Amt) 真正新的是上涨分钟成交额重心的偏移(种子 4–7);自比 z 值被表格证实是 head 5 的换皮,|Ret| 重心落进了峰度族,划掉 1、2、8、9。N 位 RSJ 的实现与 BLZ (2020) 一致、没有陷阱,不划种子。三组 R 都通过,R1 关于 EPS 的诊断经源码和数值验算属实。'
