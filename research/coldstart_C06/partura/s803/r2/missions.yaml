R:
  - head: 'ts_skew(day_durbin_watson(Open), 50)'
    why: '烂部件:ts_skew 的输入没有归一化,所以 ts_skew 实际没有在算偏度。
      依据(源码):alphacube/operators/common.py 的 nanskew_last 返回 m3/(std**3 + EPS),EPS = 1e-9 是绝对常数。day_durbin_watson(x) = sum(dx^2)/sum(x^2),分母不去均值;作用在分钟价格上约等于 day_std(Ret)^2,A 股约 1e-6 到 1e-5,其 50 日标准差同量级,std**3 约 1e-18,远小于 1e-9。所以 ts_skew 返回的是 1e9 乘以 50 日三阶中心矩,是 σ 的 6 次齐次量,规则 §4 陷阱 1 的凸性藏在了 EPS 里。随机张量验算:输入尺度 ≤ 1e-4 时,输出与 m3*1e9 四位有效数字相同。
      依据(定位):再套一层 ts_skew 的 coverage 只有 0.8708。nanskew_last 唯一返回 NaN 的地方就是 std > EPS 这道闸,它在 1e-9 量级上咬住,反证内层输出就在这个量级。
      替换件把输入变成无量纲:log(DW),即对数已实现方差,Andersen, Bollerslev, Diebold & Ebens (2001) 显示对数已实现波动近似正态,是这条文献线的标准处理;或者 DW 除以自己的 50 日均值。两者都让 ts_skew 真的算偏度。若分数仍 ≥ 原 head + 0.1,M 第 2 批这一族就是真的波动形状因子,用诚实版替换陷阱版;若掉到 0.5 以下,head 的分数来自凸性,下一轮不再在这一族上花 GP 位。'
    variants:
      - 'ts_skew(log(day_durbin_watson(Open)), 50)'
      - 'ts_skew(div(day_durbin_watson(Open), cross_mean(day_durbin_watson(Open), 50)), 50)'
  - head: 'cross_mean(mul(add(day_kurt(Ret), 3), add(day_kurt(Ret), 3)), 15)'
    why: '烂部件:mul(x, x),其中 x = add(day_kurt(Ret), 3)。
      依据(源码 + 代数):alphacube 的 _kurt 先去均值、用总体矩、再减 3,所以 kurt+3 = m4/m2^2 ≥ 1 > 0 恒成立。平方因此是严格单调变换,逐日截面秩与 day_kurt(Ret) 完全相同,不带任何新的排序信息。它唯一的作用,是让外面的 cross_mean(·,15) 变成凸平均,被 15 天里峰度最高的那一天主导(Jensen),也就是把「过去三周有没有一个尖峰日」藏在平方里。
      变体把这件事去掉或显式写出来:直接去掉平方,cross_mean(day_kurt(Ret),15);上四分之一尾部均值 cross_tail_mean_q75;75% 分位 cross_quantile_q75;中位数 cross_med 作为对照(典型水平,不看尖峰)。哪一条最好,就说明 head 6 读的是尖峰还是水平。显式写法若 ≥ 0.75,就按规则替换掉一个靠凸变换绕过库禁令的改写。'
    variants:
      - 'cross_mean(day_kurt(Ret), 15)'
      - 'cross_tail_mean_q75(day_kurt(Ret), 15)'
      - 'cross_quantile_q75(day_kurt(Ret), 15)'
      - 'cross_med(day_kurt(Ret), 15)'
  - head: 'day_kurt(Ret)'
    why: '烂部件:day_kurt(Ret) 里与成交时间峰度共享的那一部分。
      依据(第 1 轮 R,已付费):只在有成交的分钟上算同一统计量的 day_kurt(in_logchg(Vwap, 1)),与 head 的日度秩相关 0.69–0.81,score 却只有 +0.02(head +0.97);另一方面,把零收益质量放大的 day_gini(Ret) 落进了已知族(|ρ| 0.63)。所以 head 的分数集中在钟表时间峰度里「不被」成交时间峰度解释的那 20–30%,两者共享的部分是稀释信号的死重。
      机制:Clark (1973)、Westerfield (1977):日历时间收益的峰度 = 成交时间收益的峰度 + 成交时钟随机快慢造成的混合峰度。减去成交时间峰度,剩下的就是成交到达的突发程度。
      变体:直接相减;以及秩空间的截面残差 cs_regres(cs_rank(·), cs_rank(·))(两个峰度都重尾,在秩上回归不会被几个极端值支配)。'
    variants:
      - 'sub(day_kurt(Ret), day_kurt(in_logchg(Vwap, 1)))'
      - 'cs_regres(cs_rank(day_kurt(Ret)), cs_rank(day_kurt(in_logchg(Vwap, 1))))'
