  - type: N
    hypothesis: '新 idea:已实现方差的「符号构成」(good volatility 与 bad volatility)。
      机制:把当日分钟收益的平方和拆成上涨分钟与下跌分钟两半,RSJ = (RV+ - RV-)/RV = sum(r|r|)/sum(r^2),落在 [-1,1]。RSJ 高表示当日波动主要来自向上的移动,即彩票式的上跳;RSJ 低表示主要来自向下的移动。Bollerslev, Li & Zhao (2020) 用美股日内收益发现,按 RSJ 排序的组合之后的收益差异很大,高 RSJ 跑输,控制已知特征后仍显著。机制上有两条:偏好正偏度、做概率加权的投资者为上跳付高价(Barberis & Huang 2008);Patton & Sheppard (2015) 的坏波动更持久,下跌主导的波动之后要求更高补偿。A 股散户占比高、彩票偏好强,这两条在这里只会更强。方向先验:多头 = RSJ 最低(坏波动主导)的十分位,最后由 GP 定符号。
      算子实现:mul(Ret, abs_(Ret)) = r|r|,其日和 = RV+ - RV-;mul(Ret, Ret) 的日和 = RV;两者相除就是 RSJ。种子有以下几类。日度版与 5 日均值。5 日与 20 日的「池化」版 div(cross_sum(分子,d), cross_sum(分母,d)):与论文按周聚合半方差一致,让这段时间里方差最大的日子起主导,而不是每天的比值等权。成交额加权版 sum(Amt*r|r|)/sum(Amt*r^2):只看有真钱成交时价格往哪边动。对照用活跃分钟上的已实现偏度 mul(day_skew(Ret), sqrt(sub(1, day_zero_ratio(Ret)))),即 Amaya 等 (2015) 的 realized skewness。零收益分钟会把钟表时间的偏度放大 sqrt(n/k) 倍,乘 sqrt(1-零比例) 就还原成活跃分钟的偏度。随机张量验算(不碰数据):48 个活跃分钟时钟表偏度的截面标准差 1.07,修正后 0.47,比值 2.28,约等于 sqrt(241/48)=2.24。
      分桶版有四种。在 20 日收益十分位内排序,拿掉「RSJ 只是这段时间涨跌的另一种写法」。在 5 日收益十分位内排序,对应论文控制的周度反转。在 20 日平均零收益比例十分位内排序:薄股票只有几次移动时,日度 RSJ 纯抽样噪声就大(随机张量:高斯活跃分钟 k=240/120/48 时日度 RSJ 截面标准差 0.11/0.16/0.24);粗 tick 股票每次只跳一个 tick,r^2 都相等,RSJ 退化成上跳次数减下跳次数除以总次数。组内排序让这两类不能挤满十分位。最后一种在 20 日平均成交额十分位内排序。
      为什么和库里不同:库里 6 个 head 全是收益的「偶函数」。day_kurt、(kurt+3)^2、day_durbin_watson 与它的 ts_skew、hurst 减 kurt 的组合,把所有分钟收益取负号值都不变;day_centroid(Amt) 根本不读收益。RSJ 与已实现偏度是「奇函数」(本机验算:收益取负,RSJ 精确变号,day_kurt 不变)。在涨跌大致对称的截面上,奇函数与任何偶函数的秩相关期望为 0,所以它不会是任何 head 的改写。5 个控制里只有 20 日反转带符号,但它是日度累计收益,不是日内方差的符号构成;而且我们另有在收益十分位内排序的种子。
      刻意避开的陷阱:RSJ 是两个同为二次齐次的和之比,零次齐次、有界,不对任何波动量做凸变换(陷阱 1);零收益分钟对分子分母的贡献都是 0,所以它不是稀疏度或流动性的改写(陷阱 3);分桶变量都是连续量,不用 LimitWidth/BoardCode(陷阱 2);Close 是后复权价,只用它的 20 日、5 日比值当收益,不当价位。
      样本外为什么还在:(1) 机制是投资者偏好(正偏度和彩票偏好)与风险补偿(坏波动更持久),不是在样本内拟合出来的形状。(2) 证据来自另一个市场、另一段时间的日内数据,与我们的样本内完全不重叠;在我们这里也成立,就不是巧合。(3) 这个量无量纲,不随波动水平、tick 网格或成交额水平的漂移而漂移。'
