    core: 'day_centroid(Amt)'
    hypothesis: '核心 day_centroid(Amt) 是当日成交额在 241 根分钟上的时间重心。源码(partura/ops_ext.py):sum(t*|Amt_t|)/sum|Amt|/(T-1),落在 [0,1],0 = 全在开盘、1 = 全在收盘,对成交额的尺度完全不敏感。第 0 列是 9:30 开盘集合竞价;最后一列在深市全样本、沪市 2018-08-20 之后含收盘集合竞价。
      库里唯一用到它的 head 是 cs_mask_top_replace_mean(mul(0.5, neg(day_centroid(Amt))))(+0.86,valid +1.06,与已知族 -0.19)。它读的是时点的「水平」,即这只股票的钱习惯在一天里什么时候来。这是一个慢变的客户结构特征:开盘竞价占比高的是散户和隔夜消息型,尾盘和收盘竞价占比高的是机构和指数型。它再把最早的那 10%(停牌、极薄、开盘封板)并到均值。见过的外围只有 neg、mul(0.5,·)、cs_mask_top_replace_mean 三种。
      本位的外围只做一件事:不问时点的水平,而问时点相对某个参照偏了多少。三种参照,对应三个机制。
      (i) 相对自己的常态:cross_zscore(·,20)、cross_madz(·,60)、cross_mean(cross_zscore(·,60),5),量的是今天的钱比这只股票平时来得早还是晚。机制是注意力冲击。Barber & Odean (2008) 显示新闻、异常成交、极端收益会让个人投资者净买入。在 A 股,隔夜消息和关注度冲击表现为开盘竞价与头半小时的异常放量;T+1 下早盘追进去的钱当天卖不掉。所以「钱比平时早得多」是被注意力推高、随后回吐的一端,「比平时晚」对应机构执行与收盘竞价需求。水平因子做不到这一点:开盘竞价占比天生高的股票每天都早,但它的 z 值接近 0。
      (ii) 相对价格方向:sub(day_centroid(mul(Amt, is_gt0(Ret))), day_centroid(Amt)) 及其 10 日均值,另有下跌分钟版和按流动性十分位排序版。is_gt0(Ret) 是 0/1,Ret 为 0 或缺失的分钟权重为 0,所以前一项是「上涨分钟里成交的那部分钱」的时间重心,减去全部钱的重心。>0 表示推涨的钱集中在尾盘(尾盘拉升、收盘前抢筹);<0 表示推涨在早盘,午后是卖方。机制:尾盘集中的单向推价是收盘价操纵的典型指纹,Comerton-Forde & Putnins (2011) 用收盘前的价格冲击加次日回吐来度量它。我们用的是不需要逐笔数据的分钟版:上涨分钟的钱比整体晚多少。
      (iii) 相对价格移动的时点:cs_regres(day_centroid(Ret), day_centroid(Amt)),即当日截面上价格移动重心对成交额重心回归的残差;另有它的 10 日均值、同一天两个重心之差的 20 日均值,以及按流动性十分位排序的版本。注意 day_centroid 内部先取绝对值,所以 day_centroid(Ret) 是 |Ret| 的重心,即价格在什么时候动。残差 >0 表示价格的移动落在钱之后:钱先到、价后动,信息进入价格慢,是 Hou & Moskowitz (2005) 价格延迟在日内尺度上的版本。残差 <0 表示价先动、钱后跟:少数成交先完成定价,后面的钱是跟风。cs_regres 让这一项与核心本身在截面上线性正交,所以它不会是 head 的换皮。
      另有 1 颗 cs_bucket_rank(cross_stddev(day_centroid(Amt),20), 20 日平均成交额):在流动性相同的组内比时点的不稳定程度,即事件驱动的程度。
      为什么和以前不同:三种参照都把时点的水平差掉了。(i) 减去自己的均值;(ii) 是同一天两个重心之差;(iii) 的截面残差与核心正交。所以和 head 5 的相关只剩它们各自的机制部分。它们都不是平滑或单调改写。外围算子集合 {cross_zscore}、{cross_madz}、{sub, mul, is_gt0}、{cs_regres}、{cross_stddev, cs_bucket_rank} 与见过的三种都不同。种子里的 10/20 日均值只是为了压住单日重心的噪声(极薄股票上涨分钟只有几分钟),本身不是本位要做的事。
      刻意避开的陷阱:没有任何凸变换;所有量都是 [0,1] 内重心之差、z 值或截面残差,无量纲,与成交额水平无关(陷阱 1、3)。分桶变量是连续的 20 日平均成交额,没有大量并列(陷阱 2)。不用 Vwap,因为 Vwap 的 NaN 形态会把流动性带进来(第 1 轮表:Vwap 类日内统计量与流动性 0.69–0.72)。
      样本外为什么还在:(a) 交易所规则变化会整体搬移时点的水平,这正是水平因子的风险,例如沪市 2018-08-20 引入收盘集合竞价,Han 等 (2022) 记录了成交被推向收盘。本位三种对照都是同一只股票在同一天、或与自己近期之内的比较,规则对所有分钟的搬移在差里一阶抵消。(b) 注意力驱动的散户买入、尾盘推价、信息进入价格的快慢,都来自市场参与者结构(散户占比、T+1、涨跌停),2023 年之后没有变。(c) Admati & Pfleiderer (1988) 与 Heston, Korajczyk & Sadka (2010) 都显示日内时点是独立于成交量和波动水平的通道。我们利用的不是样本内的数值巧合。'
