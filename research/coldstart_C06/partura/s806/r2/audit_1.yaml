    novelty: 3
    soundness: 3
    struck_seeds: [4]
    reasons: '【创新度 3】快照里含核心 day_centroid(Amt) 的只有 head 4 `sqrt(ts_quantile_q50(day_centroid(Amt), 20))` 与 head 7(两层 cs_mask_top_replace_mean_neg 套三层 10 日 ts_quantile_q50),外围集合只有 {ts_quantile_q50, sqrt, cs_mask_top_replace_mean_neg},做的都是取「水平」再平滑或砍尾。本位外围做三件不同的事:(1) 与 |分钟收益| 的重心做差(源码里 day_centroid 先取 abs,day_centroid(Ret) 确实是 |Ret| 的时间重心);(2) 10 日减 50 日中位数的时点迁移及其标准化版;(3) cs_bucket_rank 在流动性 / 市值 / 自身水平十分位内取秩。相关度表支持「不是水平的换皮」:迁移类种子 8–12 与所有 head 原始 |ρ| 0.27–0.35、残差 0.26–0.35,known ≤ 0.05;种子 5(在自身 20 日水平十分位内取秩)降到 0.12。差值类 1–3 与 head 4 仍有原始 0.47–0.55、残差 0.47–0.52,即约一半仍是 head 4 的水平。输入仍是同一个核心,按 §3 是「同一类输入、机制不同」,给 3,不到 4。
      【合理度 3】逐个算子核对:day_centroid 按 t/(T−1) 归一到 [0,1];sub、ts_quantile_q50(rolling nanquantile)、ts_std、cross_zscore(自身 d 日窗口的 z)、cs_bucket_rank(按 _pct_rank 分十分位,桶内取秩,再加 1e-4 整体秩破平局)都实现了所述含义;分桶变量 cross_mean(day_sum(Amt), 30)、LogFloatCap、ts_quantile_q50(day_centroid(Amt), ·) 都是连续量,不触发陷阱 2;全位没有 signedpower / pow_* / mask,不触发陷阱 1;差值与迁移是有界无量纲量,控制列除种子 4 外都 ≤ 0.27,不是控制变量的非线性重写(陷阱 3)。窗口 10 / 20 / 50 合理。不给 4 的原因:train 证据只支持「水平」—— loc.json 拆解里裸日度值 −0.08、窗口 10→20→40 为 +0.98 / +1.21 / +1.22、ρ(known) −0.40 / −0.49 / −0.555,说明分数在持久水平里;(2) 的迁移恰好减掉持久部分,train 证据对它是不利的,GKM2001 / LMSW2002 讲的是成交量水平的异常与量价关系,搬到「时点」只是类比;(1) 的 AP1988 是理论,没有截面预测的实证。PI 事先写了证伪判据(与 head 4 |ρ| < 0.7 的候选都 < 0.3 则第 3 轮放弃),这点好。
      【划掉 4】`cs_bucket_rank(ts_quantile_q50(day_centroid(Amt), 10), ts_quantile_q50(day_centroid(Ret), 10))` 排的是 Amt 重心的 10 日水平本身,只是放在 |Ret| 重心十分位内比较,没有做外围宣称的「量与价的时点相比」:与 head 4 原始 0.68(贴着 0.7 禁令)、残差 0.71(全表除 R 外最高)、对 head 7 残差 0.65,就是 head 4 的 10 日窗口版(拆解里 +0.98)换皮。
      【要留意、不划】(i) 2018-08-20 沪市才有收盘集合竞价,沪市股票最后一根的成交额在 train 内跳升,种子 8–12 的「10 日减 50 日」在 2018-08 至 2018-10 前后会把「沪 vs 深」读成迁移,是交易所层面的结构断点,不是个股信息;(ii) 若第 0 根 Ret 含隔夜跳空,day_centroid(Ret) 有一部分读的是 |跳空| / Σ|分钟收益|,中位数压不掉这种系统性偏移;(iii) 迁移种子与 20 日反转控制 |ρ| 0.21–0.23,不到 0.5,但说明迁移里混有近期收益的成分;(iv) 种子 1 / 2 / 3 的分数会有一部分来自与 head 4 共享的水平(ρ ≈ 0.5),出结果时要用相关度去区分。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: []
    reasons: '【创新度 4】库里 8 个 head 没有一个用到涨 / 跌分钟的成交方向:head 4 / 7 是不带符号的时点水平,其余是市值、开盘价、成交额分位。相关度表 12 个种子与所有 head 原始 |ρ| ≤ 0.19(种子 3 对 head 4)、残差 ≤ 0.19,控制列 ≤ 0.25(种子 5 的 rev),输入与机制(早盘不平衡 = 信息、延续;尾盘不平衡 = T+1 流动性压力、回吐)都与 head 不同,且与所有 head |ρ| < 0.3,符合 §3 的 4。不给 5:分时段不平衡、滞后不平衡反转在文献里都已有(CS2004、ZWB2011)。与 r1 N 位的全天 day_signed_ratio 是同一类输入,但按时段拆开、预期两段符号相反,以及 (c) 买压与卖压的时间重心差,是说得出理由的实质改进,不是 r1 的重做。
      【合理度 3】逐个算子核对:in_index 给 t/(T−1)(Volume 为 NaN 处为 NaN);greater / less 是 catalog 里的 (x > y).float(),NaN 比较得 0,所以掩码外与缺失分钟权重都是 0;day_signed_ratio 先取 |y|,掩码外 y = 0,分子分母都不计,得到掩码内按 tick 规则的成交不平衡,∈ [−1, 1],与所述一致。greater(in_index, 0.0) 正好去掉第 0 根开盘竞价;< 0.5 与 > 0.5 之间漏掉第 120 根(11:30),无伤;> 0.875 是最后 30 根。分桶变量 cross_mean(day_std(Ret), 20)、cross_mean(day_sum(Ret), 20)、cross_mean(day_sum(Amt), 30) 都连续,不触发陷阱 2。全是有界比值,没有凸变换,不是控制变量的重写。窗口 5 / 20 合理。不给 4:这一族自己的 train 证据是中性的 —— r1 全天版最好 5 条 train −0.21…+0.12、valid +1.3…+2.3,「两段符号相反、权重随样本期变所以抵消」是事后解释,同样可能只是这一族在 2022–2023 才有效;文献分别支持「早盘不平衡主导日内价格发现」(ZWB2011,日内而非跨日截面)与「滞后不平衡反转」(CS2004,全天口径),都不直接支持「分时段、符号相反」的截面预测;LY2022 的标题是尾盘「动量」,用它推出尾盘净买入会回吐,方向先验不稳(方向交给奖励在 train 上定,不影响实现)。PI 写了可证伪的预测(拆开后 train 腿都 ≤ 0.2 则第 3 轮放弃),好。
      【不划,但实现上有一处不一致】(c) 类种子 9–12 的 day_centroid(mul(Volume, is_gt0(Ret))) / is_lt0 没有去掉第 0 根,和 (a)(b) 特意去掉开盘竞价的理由相矛盾:若第 0 根 Ret 含隔夜跳空,跳空方向 × 竞价大成交会落在 t = 0,把上涨或下跌一侧的重心直接拉向 0,这几条有一部分在读「跳空方向」。可以在 Volume 上再乘 greater(in_index(Volume), 0.0)。另外:in_index 子树在全满覆盖的股票上截面处处相同,GP 若把它的日度聚合(例如 day_mean(in_index(·)))喂给基于 _pct_rank 的 cs_* 算子,会落到陷阱 2 的列序斜坡上,复核结果时要盯这一类。'
    revise: '—'
R:
  - head: 'sqrt(ts_quantile_q50(day_centroid(Amt), 20))'
    soundness: 3
    reasons: '「sqrt 是烂部件」成立,但它是无用而不是有害:源码里 sqrt = torch.sqrt(torch.abs(x)),day_centroid ∈ [0,1]、ts_quantile_q50 输出恒正,所以对每日截面排序完全不变,拆解里去掉它是 +1.2061 vs 原 head +1.2227。替换的理由是陷阱 3:loc.json 拆解里 ρ(known) 随窗口 10 / 20 / 40 为 −0.40 / −0.49 / −0.555(PI 引用的数核对无误),这个水平离 0.5 的不合格线很近,多头腿可能带线性中性化去不掉的已知族 / 流动性暴露。v1 / v2 在已知族、流动性十分位内取秩,相关度表 known 0.01 / 0.04、liq 0.01 / 0.01,与原 head 0.84 / 0.86:在构造上拿掉了暴露、又保留了大半信号,无论升降都是有信息的检验。v3(LogFloatCap 分桶)与原 head 0.98、known 0.41、liq 0.39,几乎是恒等变换,既不可能 +0.1,也不服务于所述目的(把已知族暴露降到远低于 0.5),是一次浪费的评估,但不致命。没有任何证据表明分桶版会 ≥ 原 head + 0.1,所以给 3。'
  - head: 'cs_mask_top_replace_mean_neg(ts_quantile_q50(cs_mask_top_replace_mean_neg(ts_quantile_q50(ts_quantile_q50(day_centroid(Amt), 10), 10)), 10))'
    soundness: 4
    reasons: '源码核对:cs_mask_top_replace_mean_neg = −cs_mask_top_replace_mean(−x),把每日截面最低 ceil(10%) 的值换成截面均值。这个 head 方向 −1,多头十分位正是最低那 10%(成交最靠前的股票),外层 mask 恰好把它们挪到截面中间、赶出多头书;内层 mask 在最后一层 10 日中位数之前对每日最低 10% 做同样的事,把持续偏早的股票往中间拉。PI 的 (i) 成立。(ii)「并列块的残差在块内按控制拟合值反序」数学上对,但称为陷阱 3 的离散形式有些牵强,不作为依据。(iii) train 证据:同核心、无 mask 的 head 4 为 +1.22 vs 本 head +0.82;拆解里窗口 20→40 为 +1.21 / +1.22 持平,三层 10 日中位数(有效约 30 日)的窗口差解释不了 0.4 的差距;共性表里带 mask 的子树均值差 +1.19,低于不带 mask 的 +1.41 / +1.61,方向一致(有混杂,只作旁证)。变体设计好:两个都去、只去外层、只去内层,能分清是哪一个在伤分数;v4 针对 v1 的 known 0.47 逼近 0.5 不合格线,分桶后 known 0.01。代价要记下:v1 与 head 4 原始 0.86、残差 0.91,替换后库里多一个近重复项(R 的替换规则只看与原 head 的 ρ,不查与其他 head 的相关);v4 与 head 4 原始 0.70,冗余小一些。合理度 4。'
summary: '两个位都过:a(E,day_centroid(Amt) 外围做差值 / 迁移 / 分桶)创新 3、合理 3,划掉与 head 4 残差 0.71 的种子 4,剩 11;b(N,分时段量价不平衡)创新 4、合理 3,不划,剩 12,但 (c) 类种子没去掉第 0 根;R1(换掉死的 sqrt)合理 3,LogFloatCap 版近乎恒等;R2(去掉把方向 −1 多头腿挪走的两层 mask)合理 4。'
