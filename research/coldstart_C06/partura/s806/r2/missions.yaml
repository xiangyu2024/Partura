    core: 'day_centroid(Amt)'
    hypothesis: '【核心是什么】day_centroid(Amt) = Σ t·Amt_t / Σ Amt_t,t 是分钟位置归一化到 [0,1](0 = 全在开盘,1 = 全在收盘):一天的钱在什么时候成交。有界、尺度不变,不含价格或成交额的水平。M 第 2 批 head 4 `sqrt(ts_quantile_q50(day_centroid(Amt), 20))`(+1.22,train 1.22 / valid 1.34,方向 −1 = 做多成交偏早的股票)和 head 7 都是它的 10–20 日中位数水平;共性表里它是出现最多的有效子树(n 31,均值差 +1.41)。拆解表:裸日度值 −0.08,20 日中位数 +1.21,去掉中位数的必要性 +1.73,Amt→Volume 不变 —— alpha 在持久成分里,单日新息不值钱。
      【已见过的外围,以及它的问题】快照里含这个核心的写法只有 {ts_quantile_q50 平滑, sqrt, cs_mask_top_replace_mean_neg}:都是在「水平」上再平滑,或砍掉最低 10%。这个水平有一部分是已知族:拆解表里 ρ(已知族) 随窗口 10/20/40 日单调升到 0.40/0.49/0.56,越平均越像控制变量。再做水平版既会被库禁令拒掉(与 head 4 的 ρ ≥ 0.7),也没有新信息。
      【本位外围要做的事:不再取时点的水平,而是拿它和别的量比】
      (1) 量的时点 vs 价格位移的时点。day_centroid 内部取 |x|,所以 day_centroid(Ret) 是 |分钟收益| 的重心,即价格在一天里什么时候动。种子取两者 10 / 20 日中位数之差(或日度差的中位数)。差 > 0:钱比价格晚到,后段大成交几乎不动价格,对应深的流动性 / 被动 / T+1「收盘买、次日开盘卖」的流动性买盘(LY2022 把 A 股成交 U 形的收盘端归因于这种 T+1 安排)。差 < 0:价格比钱晚动,尾段价格在薄成交里被推动(无量拉抬或打压),收盘价噪声大,之后回吐。依据是 AP1988:知情交易推动价格,能择时的流动性交易者挤向厚市场时段。所以「量与价在时间上错开多少」区分的是两类交易者,不是交易了多少。另有两个非参数写法:在价格时点十分位内给量的时点取秩;在量的时点水平十分位内给差取秩。后者按构造与 head 4 的水平无关。
      (2) 时点的迁移。把 GKM2001「相对自身 50 日窗口」的新息构造搬到时点维度:10 日中位数减 50 日中位数;除以 50 日标准差的标准化版;cross_zscore(·, 50) 的 10 日均值;在 50 日水平的十分位内取秩(防止迁移只是极端水平的均值回复)。迁移向开盘,是由隔夜信息或注意力驱动的新参与者到来;迁移向收盘,是被动、收盘竞价或 T+1 流动性资金进入。LMSW2002:同样的成交,投机(信息)交易伴随延续,风险分担交易伴随反转。
      (3) 非线性剥离规模和流动性:cs_bucket_rank(·, cross_mean(day_sum(Amt), 30)) 与 cs_bucket_rank(·, LogFloatCap) 在流动性或市值的每个十分位内各自取秩,于是多头十分位里每个规模档占同样份额。线性中性化去不掉的非线性规模暴露(陷阱 3)由此在构造上拿掉(FNW2020 的非参数、分组条件化思路)。分桶变量都是连续量,不用 LimitWidth / BoardCode(大量并列会落到陷阱 2 的列序斜坡上)。全位不用凸变换,不用 mask。
      【已知的毛病】第 0 根 bar 是开盘集合竞价,最后一根含收盘竞价。竞价有大成交但只有一个价格,所以 (1) 的差一部分在读竞价占比,而竞价占比可能是规模的代理,(3) 的分桶版本就是为它设的。若第 0 根的 Ret 含隔夜跳空,|Ret| 的重心会被跳空幅度拉向 0,10 / 20 日中位数可以压掉单日跳空。
      【为什么样本外还会在】决定成交时点结构的是制度:T+1、开盘与收盘集合竞价、散户在开盘集中下单、被动资金在收盘成交,这些 2023-08-08 之后都没有变。差值与迁移都是有界的无量纲量,不随波动或成交额水平漂移。分桶版本保证收益不来自小市值或低流动性那一端的风格,那一端在不同年份会翻符号。被拿掉的「水平」,正是窗口越长越像已知族的那部分。
      【方向与判决】方向交给奖励在 train 上定。我的先验:(1) 取 +1,做多「价格早动、钱晚到」;(2) 取 −1,做多迁移向开盘。事先判决:本位所有与 head 4 日度秩 |ρ| < 0.7 的候选若都低于 0.3,就认定 day_centroid 族的分数只是水平本身(流动性 / 规模代理),第 3 轮不再碰它。'
