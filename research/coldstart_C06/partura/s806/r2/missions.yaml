    why: '烂部件是两个 cs_mask_top_replace_mean_neg。依据有三条。(i) 它把截面最低 10% 的值换成截面均值(nd_cs.py 的 negate-flip-negate)。这个 head 的方向是 −1,做多的正是重心最低、成交最靠前的那一档,mask 两次把它最想持有的股票挪到中间,赶出多头十分位。(ii) 被挪走的是一整块并列值,平均秩后块内残差的排序恰好是控制拟合值的反序,这是陷阱 3 的离散形式。(iii) 同一个核心、不带 mask 的 head 4 是 +1.22,比这个 head 的 +0.82 高 0.41。变体:两个都去掉、只去外层、只去内层,看是哪一个在伤分数。再加一个两个都去掉后在已知族十分位内取秩的版本:三层 10 日中位数的有效窗口约 30 日,按 0.40/0.49/0.56 的趋势,不剥离的话 |ρ(已知族)| 可能 ≥ 0.5,会被判不合格。代价:替换后它与 head 4 会高度相关,库里多一个近重复项;但多头腿被控制变量折叠的 head,比一个重复项更糟。'
