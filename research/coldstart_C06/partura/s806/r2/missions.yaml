R:
  - head: 'sqrt(ts_quantile_q50(day_centroid(Amt), 20))'
    why: '烂部件是根上的 sqrt。付费拆解:去掉它是 +1.2061,原 head 是 +1.2227,差 0.017。day_centroid ∈ [0,1] 恒正,sqrt 是单调变换,不改任何一天的截面排序,只通过 EMA 作用在变换后的值上留下一点残差,近乎死算子。它占着的位置留下一个真毛病:这个水平与已知族的 |ρ| 是 0.49,并随窗口 10/20/40 日单调升到 0.40/0.49/0.56,离不合格线只差一步,而且有一部分分数可能来自线性中性化去不掉的非线性流动性 / 规模暴露(陷阱 3)。变体把死的 sqrt 换成在已知族、流动性或市值十分位内取秩:每个十分位内输出均匀,多头十分位里每档占同样份额,非线性暴露在构造上拿掉,|ρ(已知族)| 应降到远低于 0.5。这三个变体同时是一次直接检验:若都 ≥ 原 head + 0.1 就替换;若都掉到 0.5 以下,说明这一族的分数就是那部分代理。'
