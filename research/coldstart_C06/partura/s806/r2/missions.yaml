  - type: N
    hypothesis: '【机制】A 股 T+1 下,同样的净买入压力出现在一天里不同的时段,含义相反。早盘:隔夜积累的信息在开盘后成交,早盘的买卖不平衡主导当天的价格发现(ZWB2011 的中国股票分时段证据),这部分是信息,方向应延续。尾盘:T+1 让「收盘买入、次日开盘卖出」成为流动性交易者的最优安排(LY2022),尾盘和收盘竞价的净买盘大量是流动性或噪声需求,造成临时价格压力,之后回吐(CS2004:同期不平衡与收益正相关,滞后不平衡与收益负相关,作者读作库存 / 价格压力的回复)。全天的量价不平衡把这两个符号相反的东西加在了一起。
      【r1 的现象】r1 N 位离过线最近的 5 条,全是全天 day_signed_ratio(Ret, Volume) 的 20 / 60 日均值:train ≈ 0,valid +1.3…+2.3(loc.md「本组之前各轮的任务」)。我的解释:两段的权重在 2018–2021 与 2022–2023 不同,全天加总后互相抵消。拆开以后,每一段的符号应在两段样本里都成立。这是本位要检验、也可以被证伪的预测:若拆开后各候选的 train 腿仍都 ≤ 0.2,这一族就是随样本期变的,第 3 轮放弃。
      【算子怎样实现】day_signed_ratio(Ret, mul(Volume, mask)) = 掩码内的分钟里,上涨分钟成交量占比减下跌分钟成交量占比,∈ [−1, 1](掩码外权重为 0,分子分母都不计)。掩码用 in_index(分钟位置 t/240)造:早盘连续竞价 mul(greater(in_index(Volume), 0.0), less(in_index(Volume), 0.5)),去掉第 0 根开盘集合竞价,免得隔夜跳空方向乘竞价量混进来;下午 greater(in_index(Volume), 0.5);最后 30 分钟(含收盘竞价)greater(in_index(Volume), 0.875)。三类写法:
      (a) 早盘减下午的不平衡差;
      (b) 尾盘不平衡,以及它相对全天不平衡的超额;
      (c) 不切时段的连续版「哪一侧在什么时候」:sub(day_centroid(mul(Volume, is_gt0(Ret))), day_centroid(mul(Volume, is_lt0(Ret)))) = 上涨分钟成交的时间重心减下跌分钟成交的时间重心,> 0 表示买压集中在后段、卖压在前段。
      多日处理用 5 / 20 日 cross_mean,因为 r1 的经验是只有平滑版本接近过线。另有三个分桶版:在 20 日波动、20 日收益或流动性的十分位内取秩,确保它不是波动、反转或流动性的非线性重写。全部是有界的无量纲比值,不含价格、成交额或波动的水平。
      【和库里已有的不同】库里 8 个 head 没有一个用到成交方向(涨 / 跌分钟)。head 4 / 7 的时点不带符号,head 1–3、5、6、8 是市值、价格水平或成交额水平。r1 的 N 位用的是全天不平衡、偏度和尾部;这里换成按时段拆开、两段预期符号相反的不平衡,以及买压与卖压的时点差。输入是同一类(量价方向),机制不同(早盘信息 vs T+1 流动性压力)。
      【已知的毛病】上交所 2018-08-20 起才有收盘集合竞价,train 头 8 个月沪市尾盘的成交构成不同。最后 30 分钟的掩码覆盖 30 根 bar,不只看最后一根,对此不太敏感。若 Ret 在零成交分钟为 0,这些分钟只进分母。
      【为什么样本外还会在】T+1、开盘与收盘集合竞价、以散户为主的尾盘追涨结构,2023-08-08 之后都没有变。这是交易制度造出来的时段不对称,不是某一段行情。比值有界,不随波动或成交额水平漂移。方向交给奖励在 train 上定;先验是:早盘减下午取 +1,尾盘或超额尾盘不平衡取 −1,买卖时点差取 −1。'
