  - type: N
    hypothesis: >-
      【机制】日内分钟收益分布的上下不对称 = 彩票性 / 注意力驱动的买盘。散户偏好小概率的大涨(概率加权,Barberis 与
      Huang 2008),会高估右尾重、上冲集中在放量分钟的股票,其后收益偏低。Amaya, Christoffersen, Jacobs, Vasquez
      (2015) 用日内高频收益算的已实现偏度对下一周截面收益有显著负预测,而已实现波动本身没有;Bali, Cakici,
      Whitelaw (2011) 的 MAX 效应是它的日频版本。A 股散户成交占比高、T+1、有涨跌停,这种需求更集中、更难被套利掉。
      【算子怎样实现】全部是尺度不变的比值,不含任何价格 / 波动 / 成交额水平,所以不是控制变量的非线性重写(避开 §4
      陷阱 1 与 3;正半方差只以「占比」出现,值域 [0, 1],不是方差本身):
      day_skew(Ret) 分钟收益偏度;div(day_sum(mul(is_gt0(Ret), mul(Ret, Ret))), day_sum(mul(Ret, Ret))) 正半方差
      占已实现方差的比例(Barndorff-Nielsen 等的已实现半方差,只取比值);day_es_ratio_hi(Ret) 右尾形状、
      sub(day_es_ratio_hi(Ret), day_es_ratio_lo(Ret)) 左右尾厚度差;div(add(day_max(Ret), day_min(Ret)), day_std(Ret))
      最大上跳与最大下跳的不对称;div(day_topw_mean(Ret, Volume), day_std(Ret)) 成交量最大的 10% 分钟里的标准化收益
      —— 注意力冲击来时价格往哪边跳;day_signed_ratio(Ret, Volume) 按 tick 规则的成交量不平衡,以及扣掉价格路径自身
      不平衡 day_signed_ratio(Ret, Ret) 之后的超额量不平衡(Narayan 等 2015 在中国日内数据上发现标准化订单不平衡有
      预测力)。多日处理:cross_mean 5 / 20 日(偏度类量在周频最强)、cross_max 20 日(MAX 型)、在 20 日波动十分位
      桶内取秩(确保它不是波动的代理)。
      【和库里已有的不同】本种子库里还没有 head;M 第 1 批唯一的血统 day_cov(价格, 收益) 只含二阶矩(已实现方差)
      和分钟顺序上的时点信息,85 个候选的富集子树里没有任何三阶矩 / 上下不对称 / 量价不对称的量。本位的输入是
      收益分布形状和成交量落在哪一侧,和分钟的先后顺序无关,与本轮 E 位(时点)也是两回事。
      【为什么样本外还会在】驱动它的是投资者偏好和 A 股交易制度(散户结构、T+1、涨跌停),不是某一段行情;这些量
      不随波动水平漂移,不会因为 2022 年后波动环境变化而翻符号。方向交给奖励在 train 上定,不写先验符号。
