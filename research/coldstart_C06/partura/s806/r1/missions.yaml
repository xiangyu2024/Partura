  - type: E
    core: 'day_cov(Vwap, Ret)'
    hypothesis: >-
      【核心是什么】day_cov(Vwap, Ret) 是 M 第 1 批 85 个已评分候选里出现最多(22 个)、也是唯一量纲自洽的日内部件
      (共性表其余各行都是它外面套 add(LimitWidth, ·) 的写法)。记分钟对数收益 w_i、累计 c_i、全天收益 R、
      已实现方差 Q = Σw_i²、路径偏离 δ = mean(c) − R/2,用恒等式 Σ c_i·w_i = (R² + Q)/2 可解析展开:
      day_cov(Vwap, Ret) ≈ (P̄/M)·(Q/2 − R·δ),P̄ 为当日分钟均价水平,M = 241。
      所以它是两样东西的混合:(a) P̄·Q/2 = 价格水平 × 当日已实现方差,这是量纲 / 波动代理,属于规则 §4 陷阱 3,
      线性中性化去不掉这个乘积项;(b) −R·δ = 当日行情是集中在尾盘(后置)还是早盘(前置):−R·δ > 0 表示
      无论涨跌,这一天的主要位移发生得晚。
      【为什么 (b) 可能是 alpha】A 股 T+1:尾盘才发生的大位移多由噪声 / 散户追涨杀跌推动,当天买入的人只能隔夜或
      次日盘中退出,价格压力在下一段被动回吐;早盘完成、午后横住的行情更像信息已被消化。Chu, Gu, Zhou (2019)
      在 A 股报告了日内段与隔夜段「同段延续、跨段反转」,并把跨段反转归因于 T+1 与噪声交易;Heston, Korajczyk,
      Sadka (2010) 说明日内时点本身携带可在截面上重复出现的收益模式。
      【已见过的外围,和这次的区别】快照里含该核心的写法只有:add 一个 LimitWidth(LimitWidth 板块间落差 0.10,比
      day_cov 整个截面的标准差大 2–3 个数量级,截面排序就是「先按板块、组内按 day_cov 破平局」的字典序,
      并借这个小扰动绕过 distinct 门槛)、add 两次 LimitWidth、在其上再套 ts_min(·, 20)、add 一份自己的副本 ——
      外围算子集合只有 {add} 与 {add, ts_min},全是在给核心加板块常数。本位的外围做的是相反的事:把 (a) 拿掉,
      只留 (b),且完全不用 LimitWidth、不用任何凸变换。
      (1) 无量纲化:除以 mul(day_mean(Vwap), day_var(Ret))(≈ P̄·Q/M),得到 ≈ 1/2 − R·δ/Q,即「趋势强度 × 后置
      程度」;或除以 mul(day_std(Vwap), day_std(Ret)),得到相关系数形式。两者都不随价格水平和波动水平缩放。
      (2) 条件化而不是线性中性化:cs_bucket_zscore / cs_bucket_rank 只在当日已实现方差、20 日波动或价格水平的
      同一十分位桶内比较,让残留的 Q 与 P̄ 暴露在桶内近乎常数 —— 这是对陷阱 3 的直接防御。桶变量都是连续量,
      不用 LimitWidth / BoardCode 分桶(它们大量并列,按 _pct_rank 的序号排名会落到陷阱 2 的列序斜坡上)。
      (3) 有符号版本:mul(sub(·, 0.5), sign(day_sum(Ret))) ≈ −|R|·δ/Q,即收盘相对全天时间均价的强弱,
      把尾盘拉升和尾盘杀跌分开(T+1 只锁住买方,两者不该对称)。
      (4) 多日处理:cross_mean 5 / 20 日、cross_decay_linear 10 日,压掉单日路径噪声(日内形状类量在周频上预测力
      最好);cross_zscore / ts_rank 20 日,取相对自身历史的新息,去掉个股持久水平(Flögel, Schlag, Zunft 的
      滚动标准化思路)。
      【为什么样本外还会在】驱动 (b) 的是 T+1、涨跌停与散户为主的成交结构,这些在 2023-08-08 之后没有改变;
      归一化之后的量不随波动环境漂移,而被拿掉的 P̄·Q 部分正是会随 2022 年前后波动环境翻符号的低波动风格暴露,
      这也是本血统在 min(train, valid) 下一直为负的原因之一。方向交给奖励在 train 上定,不写先验符号。
