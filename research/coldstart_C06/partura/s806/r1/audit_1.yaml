attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [3, 4, 5, 7, 9, 10, 12, 13, 14]
    reasons: >-
      【创新度 3】快照里 0 个 head,相关度表「与 head |ρ|」全是 0,不能当新颖的证据。按 E 位规则比外围:这个核心已有的外围只有
      {add LimitWidth}、{add, ts_min}(loc.md 共性表第 1–3、7 行),都是给核心叠板块常数、借字典序绕 distinct;本位的外围做的是
      量纲归一(除以 mul(day_mean(Vwap), day_var(Ret)) 或两个 day_std)、相对自身历史标准化(cross_zscore 20)、分桶条件化
      (cs_bucket_zscore / cs_bucket_rank)和带号版本,是对已有结构的实质改动,并用 Σc_i·w_i=(R²+Q)/2 的展开说了为什么。
      输入仍是同一个 day_cov(Vwap, Ret),到不了 4。
      【合理度 3】「全天主要位移发生得晚 → T+1 下被动回吐」说得通,−R·δ/Q 的符号也推对了(涨且晚、跌且晚都为正)。但展开式有一处
      实质错误:Vwap 是每根分钟 bar 内的成交均价,不是 bar 的收盘价(AlphaCube 自己的 synthetic.py 就是 amt=volume·(open+close)/2,
      即 bar 中点)。记 Vwap_i ≈ C_{i−1}+θ·(C_i−C_{i−1}),则 Σ(c_{i−1}+θ·w_i)·w_i = R²/2+(θ−½)·Q,所以
      day_cov(Vwap,Ret)·M/P̄ ≈ (θ−½)·Q − R·δ,不是 Q/2 − R·δ;PI 的式子只在 θ=1(VWAP=收盘价)时成立。θ 是 VWAP 在 bar 内的位置:
      每分钟成交笔数多的活跃股 ≈½,单笔成交、买卖价来回跳的冷门股趋近 1,是随股票持久不变的流动性/微观结构特征。于是除以 P̄·var
      之后剩下的是 (θ−½) − R·δ/Q,其中 (θ−½) 正是规则 §4 陷阱 3(流动性的非线性函数,线性中性化去不掉)。相关度表印证了这一点:
      单日比值与 liq 的 |ρ| 为 0.35(seed 1)/0.39(seed 2),5 日平均升到 0.52(seed 3),10 日衰减 0.63(seed 5),20 日平均
      0.73(seed 4,known 0.69)。时点项是日度噪声,越平均应越弱;实际是越平均越像流动性,说明平均出来的是持久的 θ。
      同理 seed 13/14 的 sub(·, 0.5) 减错了常数:活跃股 θ≈½ 时比值本身已 ≈ −R·δ/Q,减 0.5 再乘 sign(day_sum(Ret)) 会加上
      −(1−θ)·sign(R),量级 0.25–0.5,不小于时点项 |R|·δ/Q(典型 0.1–0.3),两个种子主要在读「今天/近 5 天涨跌的符号」
      (seed 14 的 rev 0.28 高于 seed 13 的 0.10,正是「数上涨天数」的样子),再叠上 sign(R)×流动性的交互项。
      留下的 1、2、6、8、11 在单日上仍以时点项为主(liq 0.26–0.39)。seed 6(cross_zscore 20)减掉了每只股票自己的 θ 水平,
      是最干净的实现(五个控制都 ≤0.03)。seed 11 以 day_mean(Vwap) 十分位分桶处理 P̄·(·),最高价格分位里 P̄ 跨一两个数量级,
      仍会主导桶内排序;seed 8 按 day_var(Ret) 十分位做 zscore,最高波动桶内 Q 仍差几倍,桶内 zscore 的两尾会被高 Q 股票占据。
      这两个保留,但不如 seed 1/6 干净。文献 Chu–Gu–Zhou 讲的是日内分段的动量/反转,不是「后置程度」这个量本身;
      M 第 1 批这条血统 22 个候选均值 −0.83,没有 train 上的正证据,所以给 3 不给 4。
      放行的同时提醒:GP 在核心外自由生长,cross_mean 一类外围会很快找到 θ 这条流动性捷径。known ≥0.5 的会被奖励判不合格,
      但 0.4–0.5 一带的会留下来,并在样本内看起来像新信息。
      【划掉】3、4、5、12:相关度表与 liq/known 的 |ρ| ≥0.5(确定性)。7:ts_rank(·,20) 是逐日窗口内的百分位,只有 ≤20 个取值,
      distinct 0.018,未过门槛(废品)。9、10:5 日平均的分桶版(liq 0.48/0.45),和 seed 3 同一个 θ 流动性问题,只是还没跨 0.5。
      13、14:减 0.5 的常数错误,主要读 sign(R),没有实现「后置程度」。剩 1、2、6、8、11,共 5 个。
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [3, 6, 13]
    reasons: >-
      【创新度 4】库里 0 个 head;M 第 1 批唯一的血统是 day_cov(Vwap/High, Ret)(二阶矩 + 分钟先后的时点)。本位的输入是分钟收益分布的
      三阶矩/尾部形状,以及成交量落在涨跌哪一侧;机制是彩票偏好/注意力买盘。输入和机制都不同,相关度表与 head 全为 0,与 a 位
      也没有共同子树。不给 5:日内已实现偏度(Amaya et al. 2015)、MAX(Bali et al. 2011)、已实现半方差都是文献里已有的机制。
      【合理度 4】机制清楚:概率加权偏好让正偏股票被高估,日内已实现偏度负向预测下周截面收益,有 2023-08-08 之前的文献证据。
      算子是直接实现:day_skew 是分钟收益 z³ 的均值(common._skew);div(day_sum(mul(is_gt0(Ret), Ret²)), day_sum(Ret²)) 是正半方差
      占已实现方差的比例,值域 [0,1];day_es_ratio_hi/lo 是尾部均值除以 95%/5% 分位数(尾部形状,无量纲,分位数≈0 时留空);
      (day_max+day_min)/day_std 无量纲;sub(day_signed_ratio(Ret,Volume), day_signed_ratio(Ret,Ret)) 中后一项 = ΣRet/Σ|Ret|
      (路径效率),相减后确实是「超出价格路径本身的量不平衡」。单日版本与 5 个控制的 |ρ| 全部 ≤0.14,不是陷阱 1/3 那种控制变量
      的非线性重写;5 日窗口对应文献的周频;seed 4 在 cross_mean(day_std(Ret),20) 十分位内取秩,正好是对波动控制的条件化。
      提醒(不影响放行):(i) 三个 day_signed_ratio 种子是订单流机制(Narayan et al.),和彩票偏好的预测方向不一定一致,算同一位里的
      第二个想法;(ii) day_topw_mean(Ret, Volume) 取成交量前 10% 的分钟,在 U 形成交量下这些分钟集中在开盘头几分钟和尾盘,
      读到的部分是开盘段收益,不全是「注意力冲击」;(iii) 241 格的第 0 根是 9:30 集合竞价,最后几根是收盘集合竞价。若这些 bar
      的 Ret 含隔夜跳空或竞价跳动,day_skew/day_max/day_min/es_ratio 会被一根 bar 主导,定稿前值得确认;(iv) 偏度的极值多是
      触板的日子(锁板后分钟收益为 0),创业板 2020-08 起改为 20% 涨跌幅,极值的含义随板块和时间变化。
      不给 5:样本外的理由只有「散户结构不变」,没有说清纯多头那条腿(低偏度/日内大跌的股票)扣 15bp 后为什么还在。
      【划掉】3:cross_max(day_skew(Ret),20) 是 20 天里偏度估计最大的那天,截面差异主要来自这个估计量的抽样离散度(薄交易、
      价格离散的股票更大),size 0.29、vol 0.19 是本位最高的;它不是 MAX 效应(MAX 是最大的日收益)。6:正半方差占比的 20 日
      均值约等于 20 日里上涨的比重,rev |ρ| 0.49 紧贴 0.5,是 20 日反转的非线性重写(与陷阱 3 同理)。13:day_signed_ratio(Ret,
      Volume) 单独用时主要是当天的涨跌方向(上涨日的成交自然多落在上涨分钟)。本位声称要的「超额量不平衡」是 seed 14,
      13 没有实现它。剩 12 个。
    revise: '—'
R: []
summary: 'a 位(E,day_cov(Vwap,Ret) 去量纲)创新 3 / 合理 3,划掉 9 个剩 5 个,通过:Vwap 是 bar 内均价,PI 展开式里的 ½ 实为随股票变化的 θ(流动性特征),所以平均类种子和减 0.5 的带号种子都划掉了;b 位(N,日内偏度/尾部与量价不对称)创新 4 / 合理 4,划掉 3、6、13 剩 12 个,通过;本轮没有 R 组。'
