R:
  - head: 'ts_quantile_q50(ts_quantile_q75(sub(day_centroid(Amt), day_centroid(Ret)), 20), 20)'
    soundness: 3
    reasons: '这一组与第 1 稿相同,相关度表三行也没有变,维持 3。说 q75 是烂部件有依据。loc.md 里 r2a 的付费结果:ts_quantile_q50(D, 20) +0.87、ts_quantile_q50(D, 30) +0.93、裸 D +0.90,两段都高于 head 12 的 +0.68。「上四分位 ≈ 中位数 + D 自身的日间离散度」的解释说得通。变体去掉 q75,在已知族 / 流动性 / 波动的十分位内取秩。cs_bucket_rank(ops_ext)在 x 的每个十分位内给 y 取秩,每个十分位内输出均匀,键是连续的控制量,算子实现了「按构造不带该控制的暴露」。保留意见不变:三个变体与 head 8 原始 0.85–0.89、残差 0.93–0.94,与 head 12 只有 0.68–0.71。一旦过 0.78 就走「替换」,库里会多一个 head 8 的近重复项。PI 拒交裸 ts_quantile_q50(D, 20) 的理由,对这三个变体同样成立。所以这组改进库的价值接近零,主要价值是诊断:D 在已知族十分位内还剩多少,这正是 E 位事先判决要的数。'
  - head: 'cs_first_low40(LogFloatShares, day_centroid(Amt))'
    soundness: 3
    reasons: '这一稿按审计意见改了内容,不是换了说法。(1) 第 1 稿的排序键是 ts_quantile_q50(day_centroid(Amt), 20 / 60),即成交重心的水平。这一稿 v1 / v2 换成在自身常态十分位内给今天的重心取秩,即我建议的第二种写法。v3 保留 _lexi 骨架,把带键与排序键都换成不带水平的量。相关度表给出了实质变化:第 1 稿 v1 与 head 9 / head 4 的残差为 0.74 / 0.66;这一稿三个变体残差最高的三个 head 里都没有 head 4 / head 9,即分别 < 0.22 / 0.22 / 0.21。最高残差:v1 是 head 7 的 0.33,v2 是 head 13 的 0.72,v3 是 head 13 的 0.29。控制 v1 ≤ 0.06,v2 ≤ 0.12,v3 ≤ 0.20(反转)。(2) PI 不交我建议的第一种写法,理由成立。设今天 = 常态 + 偏离:那种写法的排序键是 −偏离,常态只从带里进来;第 1 稿的 +常态排序键还和带的 −常态抵掉一部分,所以我那个写法的水平载荷只会更大。我收回那条建议。(3) 烂部件有依据。按 ops_ext._lexi,cs_first_low40(y, x) = rank(y) + 1{x 的整个并列块落在当日最低 40%};LogFloatShares 放在排序位上是陷阱 3 的离散形式。共性表里 pow_05 / pow_1_5 / abs_(LogFloatShares) 等五行都是它的单调重写。head 14 的 valid 0.58 < train 0.68。带键 day_centroid(Amt) 的水平被 r2 的 R 组判为已知族代理(在已知族十分位内 1.22 → 0.36)。(4) 算子核对:cs_bucket_rank 按 x 的 _pct_rank 分十档,档内给 y 取秩,再加 1e-4 倍全体秩打破并列,所以档内均匀,常态的水平被拿掉。ts_quantile(nd_ts)的窗口含当日,常态里含今天,偏离略被压小,不碍事。v3 的 cross_zscore 是逐只股票相对自身 20 日(含当日)的 z 分数,窗口近乎常数时记 0;两个键都是连续量,_lexi 的并列块规则不起作用。不用凸变换、mask、市值或板块键,不落 §4。只给 3、不给 4 的原因:(i) PI 预测「三个变体与原 head 都 < 0.5,走收录」,这个预测错了。相关度表里三个变体与 head 14 的原始 |ρ| 是 0.65 / 0.68 / 0.52,都 ≥ 0.5,过 0.68 就走「替换」。原因是 head 14 的日度秩主要由带 1{今天的重心落在最低 40%} 决定,三个变体仍然读今天的重心。后果不坏:把一个靠 LogFloatShares 排序的 head 换成不带水平的版本,正是 R 该做的;它们与其他 head 的原始 |ρ| ≤ 0.37。但这说明 PI 对变体与原 head 关系的推断没有对上表。(ii) v2 实际上是 head 13 的换皮。head 13 = cs_bucket_rank(sub(med10, med50), med50)。在 60 日常态的十分位内给今天的重心取秩,约等于给「今天 − 常态」取秩;经过书的 EMA,就近似 head 13 的 med10 − med50。所以两者原始只有 0.30(head 13 自己已经平滑过),残差却是 0.72。若 v2 替换 head 14,库里会多一个 head 13(+0.59)的近重复项。v1 / v2 也就不是 PI 说的「窗口有没有悬崖」的干净对照:两者读的东西不同,v1 与 head 13 的残差只有 0.31。(iii) 三个变体都没有 train 证据。最接近的平滑版本 head 13 只有 +0.59,低于 0.68 的门槛;r2 拆解里裸日度 c_A 是 −0.08。单日偏离换手高,扣 15 bp 后能否过线,PI 自己也列为最大的不确定。(iv) v3 的带键是未归一化的差值,日度重心嘈杂(成交稀)的股票在带里偏多;40% 的带够宽,流动性 0.07,影响有限。v3 两个参数都换了,实质是在 head 14 骨架上的新因子;它与 head 14 共用「今天偏早」那条带(0.52),所以仍算作 head 14 的变体。建议(不影响通过):v2 换成别的常态窗口,或者直接删掉,免得替换出 head 13 的近重复项。'
  - head: 'sub(sub(day_q_stat_std(pow_1_5(Ret)), cs_stddev_full(sqrt(day_q_stat_std(pow_1_5(Ret))))), cs_stddev_full(sqrt(day_q_stat_std(pow_1_5(Ret)))))'
    soundness: 3
    reasons: '这一组与第 1 稿相同,维持 3。三条依据都对过源码,都成立。(i) nd_cs.cs_stddev_full 是每日的截面常数,减掉它不改秩;loc.md 里 r2b 前 5 名只差这些壳,分数在 0.76–0.80。(ii) pow_1_5 映射到 pow_(x, 1.5),负底数的非整数幂是 NaN,下跌分钟全被删掉。(iii) day_q_stat_std 用整行长度 T = 241 作样本量,ρ_k 却只在有效配对上算,所以它主要读的是有效配对有多少。变体 1 day_q_stat_std(Ret) 直接去掉两个烂部件:与 head 11 原始 0.32,与所有 head 都 < 0.7,各控制 ≤ 0.13,是干净的检验。第 1 次审计建议把变体 2 / 3 之一改成在波动控制的十分位内取秩,这一稿没有采纳。这条不是通过的条件,所以不扣分,但问题还在:变体 2 / 3 与流动性已经几乎无关(0.04 / 0.00),真正的暴露是波动控制 0.57 / 0.56,分桶分错了轴。若由它们替换 head 11,库里的波动暴露不会比现在少。'
summary: '两个任务位与第 1 稿相同、分数不变:a(E,D 的时间对比外围)创新 3 / 合理 3,划掉 5、12 后留 11 个种子;b(N,隔夜与日内的拔河)创新 4 / 合理 4,划掉 8 后留 13 个。R 组三组都给 3、都通过:head 14 这组改了实质内容,三个变体都不再带成交重心的水平(与 head 4 / head 9 的残差 < 0.22),但与原 head 都 ≥ 0.5,会走替换而不是收录,其中 v2 与 head 13 的残差 0.72,是 head 13 的换皮;head 1 那组已撤回。'
