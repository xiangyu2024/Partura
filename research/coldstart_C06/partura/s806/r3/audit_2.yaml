    reasons: '本位在第 1 次审计时已通过,这一稿没有改:missions.yaml 里核心、假设与 13 个种子和第 1 稿逐字相同,corr_1.md 与 corr_2.md 的 diff 只落在 R 行。所以分数与划种沿用第 1 次审计,依据重述如下。创新度 3:核心 D = sub(day_centroid(Amt), day_centroid(Ret)) 已见过的外围,都是对 D 的水平做平滑或分桶(head 8、head 12、r2a 种子)。本位外围做的是时间维度上的对比:放量日与缩量日的条件均值差、按日内收益方向加权、相对自身 60 日常态的新息。输入相同,机制不同。相关度表:(1)(2) 两组(种子 1–4、6–9)与所有 head 的原始 |ρ| 为 0.05–0.30,残差 ≤ 0.30,最高是种子 4 对 head 13 的 0.30。(3) 组(种子 10、11、13)与 head 14 / head 7 的原始 |ρ| 为 0.48–0.51,与 head 13 的残差为 0.50–0.52。这一组就是 head 13 的迁移构造(在长窗口常态的十分位内给近期值取秩)换到 D 上,单看只值 2 分。本轮 R 组里 R 2 变体 2 与 head 13 的残差是 0.72,同一种构造换个输入就和 head 13 走在一起,也印证了这一点。所以整体给 3,不给 4。合理度 3:算子逐个核对过源码。greater / less 是 (x > y).float()(catalog._manual_greater),和 NaN 比较得 0,所以 mul(D, I) 在停牌日为 NaN、在非事件日为 0。cross_sum 是 nansum,cross_sum(I) 为 0 时得 0/0 = NaN,条件均值的写法对。cross_zscore(ops_ext)以自身窗口为基准,含当日,用总体标准差。cross_corr 是逐只股票的日度滚动相关(dt_cross.rolling_pair_reduce)。ts_quantile 的窗口含当日。日内收益 log(day_last(Close) / day_first(Open)) 用后复权价格,不依赖第 0 根 Ret 是否含隔夜跳空。窗口 20 / 40 / 60 合理。不用凸变换、mask,唯一的分桶键是 D 自己的 60 日中位数(连续量),不落 §4 陷阱 1–3。核心与 5 个控制的 |ρ| 都 ≤ 0.11,满足 E 位的要求。核心自身有 train 证据(loc.md:裸 D train 0.90 / valid 1.05),外围的三种对比没有。AP1988、GKM2001、LMSW2002 只支持「异常成交有信息」这个一般命题,不直接支持「量价错位在放量日会变」,所以不到 4。主要风险:r2 显示 c_A 的分数在持久水平里,消掉持久水平可能连 alpha 一起消掉。PI 的事先判决把它写成了可证伪的检验。划掉的两个:种子 5 是放量日 D 的 40 日条件水平,仍是对 D 的水平做平滑,与 head 12 原始 0.69(离库禁令 0.01)、残差 0.76,与 head 8 原始 0.65,是 head 12 的换皮,也违背本位「不取水平」的前提。种子 12 ts_rank(D, 60) 在相关度表里门槛为废品(distinct 0.067)。提示(不划):种子 8 用未归一化的日内收益乘 D 的偏离,与波动控制 0.22、与反转 0.25,是本位最高的;种子 6 只取符号,是更干净的写法。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [8]
    reasons: '本位在第 1 次审计时已通过,这一稿与第 1 稿逐字相同,相关度表本位各行也没有变,分数与划种沿用。创新度 4:库里 14 个 head 都是分钟剖面的形状、时点或市值形状。head 2 / 3 / 10 的 day_open(Open) 是价格水平,不是收益。没有一个 head 用到前收盘到开盘、开盘到收盘的分解。相关度表里 14 个种子与所有 head 的原始 |ρ| 最大 0.23(种子 7 对 head 11),残差最大 0.24(种子 10 对 head 11),全部 < 0.3。输入与机制都不同。拔河本身是 LPS2019 的已知结论,所以不到 5。合理度 4,逐个算子核对:ON = log(day_first(Open) / ts_delay(day_last(Close), 1))。day_first 取当日第一个有效分钟,即开盘集合竞价那一根。ts_delay(nd_ts)按交易日平移 1 位,前一日停牌时前收盘为 NaN,不会跨停牌拼接出假跳空。价格是后复权的,除权日连续。奖励已对 20 日反转做线性中性化;种子 4–6 在同窗口总收益的十分位内取秩,窗口对齐(20 个 ON 与 Close_t / Close_{t-20} 覆盖同一段),非参数地把反转拿干净。控制暴露最高是种子 7 / 14 与反转的 0.38 / 0.36:两段秩差里日内段的方差大,天然与总收益负相关。其次是种子 10 与流动性、已知族各 0.29。全部 < 0.5。不用凸变换、mask,分桶键都是连续量,不落 §4。有 2023-08 之前的 A 股文献(LCC2023、GHLX2019、BZ2020),所以给 4。不给 5 的原因有三条。(i) 标签按 label.py 默认是 open_vwap15:次日开盘 15 分钟 VWAP 进场,第一个隔夜段不在持有期里,「隔夜预测隔夜」那部分只能在之后几天兑现。(ii) 方向 PI 自己只有 55% 的把握。(iii) 若方向拟合成 +1,ON 均值最高的一档集中在开盘封涨停、连续跳空的股票上;label.py 的 buyable 默认是 False,这部分样本内收益可能买不进,5 日窗口的种子 3、6 最容易受影响。划掉的一个:种子 8 cross_mean(sign(ON), 20) 在相关度表里门槛为废品(distinct 0.016)。提示(不划):种子 11 cross_corr(ON, ID, 60) 有机械成分,开盘价的噪声以正号进 ON、以负号进 ID,会自己造出负相关(与流动性 0.18)。'
