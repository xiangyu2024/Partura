  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [5, 12]
    reasons: '创新度 3:核心 D = sub(day_centroid(Amt), day_centroid(Ret)) 已有的外围全是对 D 的水平做平滑或分桶(head 8、head 12、r2a 种子),本位外围做的是时间维度上的对比:放量日与缩量日的条件均值差、按日内收益方向加权、相对自身 60 日常态的新息。这是同一输入上的不同机制。相关度表支持这个判断:(1)(2) 两组(种子 1–4、6–9)与所有 head 的原始 |ρ| 在 0.05–0.30,残差 ≤ 0.30。(3) 组(种子 10、11、13)与 head 14 / head 7 的原始 |ρ| 为 0.48–0.51,与 head 13 的残差为 0.50–0.52。它们本质上是把 head 13 的迁移构造(c_A 的 10 日中位数减 50 日中位数,在 50 日水平十分位内取秩)换到 D 上,单看只值 2 分,所以整体给 3 而不是 4。合理度 3:逐个算子核对过源码。greater / less 是 (x>y).float(),和 NaN 比较得 0,所以 mul(D, I) 在停牌日为 NaN、在非事件日为 0;cross_sum 是 nansum,cross_sum(I) 为 0 时得 0/0 = NaN;条件均值的写法是对的。cross_zscore 含当日,用总体标准差;cross_corr 是逐只股票的日度滚动相关。ID = log(day_last(Close)/day_first(Open)),价格字段是后复权的,log 取 |x| 对正的比值没有影响。窗口 20 / 40 / 60 合理,40 日里只有十几个放量日的噪声问题 PI 已经说明。没有凸变换,没有 mask,cs_bucket_rank 的键是连续量,不落 §4 的陷阱 1–3;核心与 5 个控制的 |ρ| 都 ≤ 0.11。核心本身有 train 证据:裸 D 的 train 0.90 / valid 1.05(loc.md 本组 r2a 结果)。但外围这三种对比没有 train 证据。文献(AP1988、GKM2001、LMSW2002)只支持「异常成交有信息」这个一般命题,不直接支持「成交重心与价格重心的错位在放量日会变」,所以不到 4。主要风险:r2 已经显示 c_A 的分数在持久水平里(裸日度值不值钱),把持久水平消掉可能连 alpha 一起消掉。PI 的事先判决把这一点写成了可证伪的检验,这是好的。2018-08-20 沪市收盘集合竞价带来的台阶,会在约 3 个月里污染 (3) 组的 60 日新息,PI 已经说明,影响有限。划掉的两个:种子 5 是放量日 D 的 40 日条件水平,仍是对 D 水平做平滑。它与 head 12 的原始 |ρ| 为 0.69(离库禁令只差 0.01)、残差 0.76,与 head 8 为 0.65。这正是本位声称放弃的「取水平」那条路,算 head 12 的换皮。种子 12 ts_rank(D, 60) 在相关度表里门槛为废品:distinct 0.067,60 日窗口的秩只有 60 个取值,截面大量并列,进 GP 会被 distinct 门槛拒掉。另外两点提示:种子 8 用没有归一化的日内收益 ID 去乘 D 的偏离,截面离散度随个股日内波动放大,与波动控制 0.22、与反转 0.25,是本位最高的,没有划,但种子 6(只取符号)是更干净的写法。种子 13 与 head 13 的骨架只差字段与窗口,留下是因为相关只有 0.43–0.50。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [8]
    reasons: '创新度 4:库里 14 个 head 都是分钟剖面的形状或时点,或者市值形状。head 2 / 3 / 10 里的 day_open(Open) 是价格水平,不是收益。没有一个 head 用到「前收盘到开盘」与「开盘到收盘」的分解。本位的输入(日频开盘价对前收盘)和机制(两段客群的拔河)都不同。相关度表里 14 个种子与所有 head 的原始 |ρ| 最大 0.23(种子 7),残差最大 0.24(种子 10),全部 < 0.3。机制本身是 LPS2019 的已知结论,所以不到 5。合理度 4,逐个算子核对:ON = log(day_first(Open)/ts_delay(day_last(Close), 1))。day_first 取当日第一个有效分钟的开盘价,第 0 根即开盘集合竞价;ts_delay 是逐日滞后 1 天,前一日停牌时得 NaN,而不是跨停牌拼接,不会造出假跳空。价格字段是后复权的(label.py / daily.py 的注释确认),除权日连续;log 取 |x| 对正的比值没有影响。奖励已对 20 日反转做线性中性化,中性化后 ON 的 20 日均值剩下的正是「这段涨跌有多少来自隔夜」。种子 4–6 在同窗口总收益的十分位内取秩,非参数地把反转拿干净,窗口也对齐:20 个 ON 之和与 Close_t/Close_{t-20} 覆盖同一段。控制暴露都低。最高的是种子 7 / 14 与反转的 0.38 / 0.36:两段秩差里日内段方差大,天然与总收益负相关。其次是种子 10 与流动性、已知族各 0.29。全部 < 0.5。没有凸变换,没有 mask,分桶键都是连续量,不落 §4 的陷阱。有 2023-08 之前的 A 股文献证据(LCC2023、GHLX2019、BZ2020),所以给 4。不给 5 的原因有三条。(i) 奖励的标签按源码默认是 open_vwap15:次日 09:31–09:45 VWAP 进场,第一个隔夜段不在持有期里,文献里「隔夜预测隔夜」那部分只能在之后几天兑现。(ii) 方向 PI 自己只有 55% 把握。(iii) 若方向拟合成 +1,ON 均值最高的那一档会集中在开盘封涨停或连续跳空的股票上。label.py 记载过,普通标签会教组合去追这类买不进的票;若本实验的标签没有开 buyable,这部分样本内分数兑现不了,5 日窗口的种子 3、6 最容易受影响。划掉的一个:种子 8 cross_mean(sign(ON), 20) 在相关度表里门槛为废品:distinct 0.016,20 日符号均值只有 41 个取值。提示:种子 11 cross_corr(ON, ID, 60) 有机械成分。开盘价的噪声以正号进 ON、以负号进 ID,本身就会造出负相关,所以它部分读的是开盘集合竞价价格的噪声(与流动性 0.18)。没有划。'
    revise: '—'
R:
  - head: 'ts_quantile_q50(ts_quantile_q75(sub(day_centroid(Amt), day_centroid(Ret)), 20), 20)'
    soundness: 3
    reasons: '说 q75 是烂部件有依据。loc.md 里本组 r2a 的付费结果:同一个差值的单层平滑 ts_quantile_q50(D, 20) +0.87、ts_quantile_q50(D, 30) +0.93、裸 D +0.90,都高于 head 12 的 +0.68,两段都高。「q75 ≈ 中位数 + D 自身的日间离散度」这个解释也说得通。变体去掉 q75,并在已知族 / 流动性 / 波动的十分位内取秩。cs_bucket_rank 的键是连续的控制量,不落陷阱,算子实现了「按构造不带该控制的暴露」。保留意见:相关度表里三个变体与 head 8 的原始 |ρ| 为 0.88 / 0.89 / 0.85,残差 0.93–0.94。PI 拒交裸 ts_quantile_q50(D, 20) 的理由(与 head 8 太像),对这三个变体同样成立。它们与 head 12 只有 0.68–0.71,一旦分数过 0.78 就走「替换」:库里会多出一个 head 8 的近重复项,head 12 原先占住的那块禁区也会让给 GP。所以这一组在改进库这件事上价值接近零,主要价值是给 E 位的事先判决提供诊断(D 在已知族十分位内还剩多少)。按 R 的标准(部件是否真烂、依据是什么)给 3。'
  - head: 'cs_first_low40(LogFloatShares, day_centroid(Amt))'
    soundness: 2
    reasons: '前一半成立。按 ops_ext._lexi,cs_first_low40(y, x) = rank(y) + 1{x 落在当日最低 40%}。LogFloatShares 放在排序位上就是陷阱 3 的离散形式;共性表里 pow_05 / pow_1_5 / abs_(LogFloatShares) 等五行都是它的单调重写;head 14 的 valid 0.58 < train 0.68。说它烂有依据。问题出在替换的排序键。ts_quantile_q50(day_centroid(Amt), 20 / 60) 就是 head 4 / head 9 的输入,即成交重心的水平。PI 自己在 R1 里引用 r2 的 R 结果,已经把它判为已知族的非线性代理(在已知族十分位内 1.22 → 0.36)。把它放进排序位,等于把一个控制代理换成另一个控制代理。相关度表也说明算子组合没有实现「今天偏早、平时偏晚」:变体 1 的残差与 head 9 为 0.74、与 head 4 为 0.66,变体 2 与 head 9 为 0.62。也就是说平滑之后剩下的主要是成交重心的水平:带内示性函数经过 EMA 变成「近期偏早的天数占比」,本身也是水平,而不是今天相对平时的偏离。若方向拟合成 −1,多头恰好是「平时偏早」的股票,就是 head 4 的多头腿。机制说得通,但算子组合没有实现它,给 2。若要重做,排序键换成不带水平的偏离,例如 cs_first_low40(sub(ts_quantile_q50(day_centroid(Amt), 20), day_centroid(Amt)), day_centroid(Amt));或者直接在平时水平的十分位内给今天的重心取秩,即 cs_bucket_rank(day_centroid(Amt), ts_quantile_q50(day_centroid(Amt), 20))。先看它与 head 4 / head 9 的残差相关。'
  - head: 'sub(sub(day_q_stat_std(pow_1_5(Ret)), cs_stddev_full(sqrt(day_q_stat_std(pow_1_5(Ret))))), cs_stddev_full(sqrt(day_q_stat_std(pow_1_5(Ret)))))'
    soundness: 3
    reasons: '三条依据我都对过源码,都成立。(i) nd_cs.cs_stddev_full 逐日跨股票算样本标准差,再广播回原形,是每日的截面常数,减掉它不改秩;loc.md 里 r2b 前 5 名只差这些壳,分数在 0.76–0.80。(ii) catalog 把 pow_1_5 映射到 pow_(x, 1.5),e > 1 时走 torch.pow,负底数的非整数幂是 NaN,所有下跌分钟都被删掉。(iii) dt_day.day_q_stat_std 用整行长度 T = 241 算 Q = T(T+2)Σρ²/(T−k),而 ρ_k 只在有效配对上算;配对少时 ρ² 被抬高,所以它主要读的是有效配对有多少。变体 1 day_q_stat_std(Ret) 直接去掉这两个烂部件:与 head 11 原始 0.32,与所有 head < 0.7,各控制 ≤ 0.13。若分数过 0.90 就走收录,是一个干净的检验。保留意见:变体 2 / 3 仍保留 pow_1_5,只是在零收益占比 / 流动性的十分位内取秩。相关度表显示它们与流动性已经几乎无关(0.04 / 0.00),真正的暴露是波动控制 0.57 / 0.56(≥ 0.5,按种子规则就是控制变量换个写法);由此推得 head 11 本身也在 0.55 左右。所以这两个变体分桶分错了轴,若替换 head 11,库里的波动暴露不会比现在少。建议把其中一个改成在波动控制 cross_mean(day_std(Ret), 20) 的十分位内取秩。整体按「部件是否真烂」给 3。'
  - head: 'sqrt(cross_quantile_q25(cs_last_low40(LogFloatCap, day_quantile_q75(Amt)), 3))'
    soundness: 1
    reasons: '去掉的部件本身确实只是滞后。cross_quantile_q25(·, 3) 在 cs_last_low40 的离散秩上取 3 日下四分位,近似「近 3 天里任何一天在带内」。本轮 loc.md 里同骨架的 head 6 拆解给出:去掉它 1.13 → 1.23,两段都升(train 1.30 → 1.36,valid 1.13 → 1.23),与 PI 引的 head 1 的 r2 拆解方向一致。但变体 sqrt(cs_last_low40(LogFloatCap, day_quantile_q75(Amt))) 整体就是 §4 陷阱 3。按 ops_ext._lexi,cs_last_low40 = rank(LogFloatCap) − 1{q75(Amt) 落在最低 40%};sqrt 先取 |·|,把带内的 rank − 1 折成 sqrt(1 − rank),所以方向 +1 的多头同时拿到带内最小的市值和带外最大的市值。这是市值的 V 形非线性函数,线性中性化只去掉线性部分。loc.md 里 head 6 的拆解直接显示了分数从哪来:不折的 cs_last_low40(LogFloatCap, ·) 是 −0.37,套上 sqrt 折成 V 形后是 +1.23。PI 也承认「这个替换不会让它变干净」。替换后与原 head 的 ρ 为 0.90、残差 0.97,库的内容不变,只是把一个利用陷阱的 head 在样本内再抬高约 0.3,这是给陷阱 head 刷分。按 §3「利用了已知陷阱」给 1。若要对这个 head 做 R,烂部件应当是 LogFloatCap 这个排序键与 sqrt 的折叠(例如像 R2 那样把排序键换成非市值的量,或在 LogFloatCap 十分位内取秩),而不是 3 日下四分位。'
summary: '两个任务位都通过。a(E,D 的时间对比外围)创新 3 / 合理 3,划掉 5、12 后留 11 个种子;b(N,隔夜与日内的拔河)创新 4 / 合理 4,划掉 8 后留 13 个。R 组里 head 12(3)和 head 11(3)通过;head 14(2,替换键是另一个控制代理)和 head 1(1,变体仍是市值 V 形陷阱)不通过。'
