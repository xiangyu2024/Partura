      - 'cs_first_low40(cross_zscore(day_sum(Amt), 20), sub(day_centroid(Amt), ts_quantile_q50(day_centroid(Amt), 20)))'
  - head: 'sub(sub(day_q_stat_std(pow_1_5(Ret)), cs_stddev_full(sqrt(day_q_stat_std(pow_1_5(Ret))))), cs_stddev_full(sqrt(day_q_stat_std(pow_1_5(Ret)))))'
    why: |-
      【烂部件】pow_1_5,以及两个 cs_stddev_full 壳。

      【依据】
      (i) cs_stddev_full(X) 是每日截面常数:nd_cs.py 逐日跨股票算样本标准差,再广播回原形。所以减它不改任何一天的截面秩。r2b 的 26 个过线候选分数只差 0.758–0.800,这点差来自 EMA 对缺失日的处理。
      (ii) pow_1_5 = pow_(x, 1.5)。按 common.py,e > 1 时走 x**e,负底数的非整数幂是 NaN,所以所有下跌分钟被删掉。本机用 torch 执行确认过:pow_([-0.01, 0, 0.01], 1.5) = [nan, 0, 0.001]。
      (iii) day_q_stat_std 的 Q 统计量用整行长度 T = 241 作样本量,不是剔除 NaN 后实际的配对数。零自相关下 E[ρ̂²] ≈ 1/n_pairs,所以这个量主要读的是「非下跌分钟的连续配对有多少」,是薄交易 / 零收益 / 价格离散度的度量,不是日内收益的可预测性。

      【变体】
      (1) day_q_stat_std(Ret):保留全部分钟,读的是真正的日内收益自相关结构;
      (2) 在 20 日零收益分钟占比 cross_mean(day_zero_ratio(Ret), 20) 的十分位内取秩:若分数留下,它就不是零收益计数;
      (3) 在流动性十分位内取秩。

      【门槛】≥ 0.90 则替换为机制清楚、或按构造不带流动性 / 零收益暴露的版本。若 (1)(2) 都崩,确认它是计数伪影。
    variants:
      - 'day_q_stat_std(Ret)'
      - 'cs_bucket_rank(day_q_stat_std(pow_1_5(Ret)), cross_mean(day_zero_ratio(Ret), 20))'
      - 'cs_bucket_rank(day_q_stat_std(pow_1_5(Ret)), cross_mean(day_sum(Amt), 30))'
