  - type: N
    hypothesis: |-
      【机制:隔夜与日内的拔河】A 股每天的收益由两个价格形成过程拼成:
      - 隔夜段:上一交易日收盘到当日开盘集合竞价;
      - 日内段:开盘到收盘的连续竞价。
      两段的参与者不同。开盘集合竞价集中的是隔夜下单的散户,以及对隔夜消息的反应;连续竞价里机构执行的占比高。这就是 LPS2019 的客群解释:散户偏隔夜,机构偏日内;很多策略的收益在两段符号相反,即「拔河」。
      A 股的证据:
      - BZ2020:T+1 让当日买入者不能当日卖出,隔夜收益因此系统性为负;这个负偏在分歧大、散户多、流动性差的股票上更强。
      - LCC2023:中国市场异象的利润更多落在隔夜段。
      - GHLX2019:隔夜收益有动量,而且在负面冲击后更强。
      所以同样是 20 日涨跌,是隔夜涨的还是日内涨的,反映的是不同客群的需求,对之后收益的含义也不同。

      【算子怎样实现】
      - 隔夜收益 ON = log(day_first(Open) / ts_delay(day_last(Close), 1));日内收益 ID = log(day_last(Close) / day_first(Open))。价格是后复权的,除权日不会造出假跳空。
      - 奖励已经对 20 日反转 day_last(Close)/ts_delay(day_last(Close), 20) 做了线性中性化。中性化之后,ON 的 20 日均值剩下的正是「这 20 日的涨跌有多少来自隔夜」。
      种子:
      (a) ON 的 5 / 20 / 60 日均值;
      (b) 在同窗口总收益的十分位内给 ON 取秩(cs_bucket_rank),非参数地拿掉反转;
      (c) LPS2019 的标准做法:两段各自取截面秩再相减;
      (d) 符号计数 cross_mean(sign(ON), 20),对涨停开盘这类极端跳空稳健;
      (e) ON 的 20 日均值除以 20 日标准差,即隔夜需求的一致性;
      (f) GHLX2019 的不对称:只取负跳空部分的 20 日均值,在波动十分位内取秩;
      (g) cross_corr(ON, ID, 60):开盘跳空在随后的日内被系统性回吐(负)还是延续(正),即单只股票上拔河的强度;
      (h) 隔夜段占全部价格位移的比例 Σ|ON| / (Σ|ON| + Σ|ID|),以及它在波动十分位内的秩:价格发现发生在非交易时段还是交易时段;
      (i) 两段秩差在流动性十分位内取秩(BZ2020:负偏随流动性变)。

      【为什么和库里不同】
      - 库里 14 个 head 没有一个用到隔夜 / 日内分解,也没有一个用到 day_first(Open) 与前收盘之比。head 2 / 3 / 10 的 day_open(Open) 是价格水平,不是收益。
      - 输入(日频开盘价与收盘价)和机制(两段客群的拔河)都不同,预期与所有 head 的 |ρ| < 0.3。
      - 不用任何分钟级微观结构量,所以不落在本种子 GP 偏爱的薄交易 / 零收益 / 价格离散度那一类。

      【控制暴露】
      - ON 的 20 日均值与 20 日反转会有中等相关,因为两段之和就是总收益,预期 0.3–0.5。(b)(i) 两类分桶,以及 (c)(d)(g),按构造低得多。
      - |ON| 与 |ID| 都随波动变,所以 (h) 同时给了波动十分位内取秩的版本。
      - 全位不用凸变换、mask、市值或板块键(避开陷阱 1–3)。

      【为什么样本外还会在】
      - T+1、开盘集合竞价、散户占成交的高比例,是制度和投资者结构,2023-08-08 之后没有变。
      - LCC2023 的 A 股证据与 LPS2019 的美股证据,在不同市场、不同样本期各自成立,说明效应来自交易时段的客群划分,而不是某一段样本的巧合。
      - 方向由奖励在 train 上定。我的先验是 +1(做多涨幅更多来自隔夜、日内被卖的股票):日内回吐是机构对散户隔夜需求的暂时性压价,之后回补。把握约 55%。
