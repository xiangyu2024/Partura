R:
  - head: 'ts_quantile_q50(ts_quantile_q75(sub(day_centroid(Amt), day_centroid(Ret)), 20), 20)'
    why: |-
      【烂部件】内层的 ts_quantile_q75(·, 20)。它是 20 日上四分位,外面再套 20 日中位数,有效滞后约 30–40 日。

      【依据】
      - 同一个差值的单层平滑版本都比 head 12 好(r2a 已付费):裸 D +0.90、ts_quantile_q50(D, 20) +0.87、ts_quantile_q50(D, 30) +0.93,而 head 12 只有 +0.68。
      - 机制上,窗口上四分位 ≈ 中位数 + 0.67 倍窗口内的标准差。所以 q75 给每只股票加了一项「D 自身的日间离散度」。成交稀的股票成交重心更嘈杂,离散度更大,这就把一个流动性维度掺了进来。

      【变体】去掉 q75,只留单层 20 日中位数,同时在已知族 / 流动性 / 波动十分位内取秩。这样做有两个目的:
      (a) 这是唯一能回答「D 是不是成交重心水平那个已知族代理换了个方向」的实验。成交重心水平在已知族十分位内从 1.22 掉到 0.36。若 D 在已知族十分位内仍 ≥ 0.78,就把 head 12 替换成一个按构造不带已知族暴露的版本。波动十分位那一版针对的是 D 残存控制暴露里最大的一项(r2 相关度表里差值类种子与波动控制 0.23–0.27)。
      (b) 不提交裸的 ts_quantile_q50(D, 20)。它虽然 +0.87,是确定性替换,但与 head 8 太像:R 的替换规则只查与原 head 的相关,替换后库里会多一个近重复项。
      同理不提交 loc.json R 候选第 1 名(用 ts_quantile_q50(day_centroid(Amt), 20) 替换 head 8)。那个变体与 head 4 的秩完全相同(sqrt 对正量单调),而它拆掉的正是把已知族暴露从 0.49 降到 0.135 的差值结构。它的 +0.27 就是代理本身。

      【代价】分桶版本与 head 8 也可能相关在 0.7 以上,相关度表会给出。若是那样,这一组在改进库这件事上的价值是零,只剩诊断价值。
