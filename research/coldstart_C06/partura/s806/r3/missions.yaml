    hypothesis: |-
      【核心与额度】核心 D = sub(day_centroid(Amt), day_centroid(Ret)):钱在一天里的时间重心,减去 |分钟收益| 的时间重心。day_centroid 先取 |x|,再按 t/(T-1) 归一到 [0,1]。D 是 head 12 的子树,也是 head 8 的乘法同构:c_A·(1-c_R) 对 c_A 递增、对 c_R 递减,与差值同向。它还是共性表里的一行(+0.60,n 23)。这个核心此前用过 0 个 E 位。r2 的 E 位核心是 day_centroid(Amt),不是同一个子树。

      【为什么它是 alpha 的来源】
      - r2 付费证据:裸 D +0.90(train 0.90 / valid 1.05),是全库两段最接近的一条。Amt→Volume 互换后 0.93→0.98;窗口 10 / 20 / 40 为 0.68 / 0.93 / 0.84,没有悬崖。
      - head 8 与已知族的 |ρ| 是 0.135;成交重心的水平版是 0.493。
      - r2 的 R 组把成交重心的水平判成已知族的非线性重写:在已知族十分位内取秩,1.22 → 0.36;在流动性十分位内,→ 0.49。
      - 机制上这是必然的。已知族控制 cross_mean(day_std(Amt), 30) 是分钟成交额剖面的离散度,c_A 是同一条剖面的一阶矩,所以水平版注定和已知族同源。
      - D 把钱的时点和价格位移的时点相减,约掉了「剖面形状」这个公共成分,剩下的是量与价在时间上错开多少。依据 AP1988:知情交易推动价格,可择时的流动性交易挤到市场厚的时段,所以两者错开的程度区分的是谁在交易。
      - 拟合方向 -1:做多「钱早到、价格晚动」。

      【已见过的外围(全部)】
      - {}:裸 D;
      - {ts_quantile_q50 @10 / 20 / 30};
      - {ts_quantile_q75, ts_quantile_q50}:head 12;
      - 乘法同构加平滑:head 8;
      - 先平滑后相减;
      - 按自身水平 / 流动性 / 市值十分位分桶的 10 / 20 日中位数:r2 种子 5–7;
      - GP 自己加的一层线性 day_std(Ret) 减项。
      归纳:全部是「对 D 的水平做平滑或分桶」。这条路已经走到头:平滑后的 D 与 head 8 / head 12 的日度秩相关会到 0.7 以上,被库禁令拒掉。r2a 的第 3–5 名(0.87–0.93)就是这样没进库的。

      【本位外围做三件事,都不是取水平,都在时间维度上做对比,把每只股票持久的 D 水平消掉】
      (1) 事件条件化:错开只在有信息的日子才有含量。
          - greater(sub(day_sum(Amt), cross_mean(day_sum(Amt), 20)), 0.0) 标出成交额高于自身 20 日均值的日子,less(...) 标出低于的日子;
          - 用 cross_sum(mul(D, I), 40) / cross_sum(I, 40) 算 40 日内放量日与缩量日各自的 D 条件均值,再相减;
          - 强放量版:cross_zscore(day_sum(Amt), 20) > 1 的日子的 D 均值,减 60 日 D 均值;
          - 连续版:cross_corr(D, cross_zscore(day_sum(Amt), 20), 40);
          - 放量日 D 偏离自身 60 日常态的 20 日均值。
          依据 GKM2001:成交要看相对自身窗口的异常。依据 LMSW2002:同样的成交,信息交易伴随延续,风险分担交易伴随反转,所以要看的是放量那天的量价关系怎样变化,而不是水平。
          另放一条「只取放量日的 D 条件水平」(种子 5),它可能与 head 8 太像,交给相关度表裁决。
      (2) 方向条件化:同样是价格晚动,往上推和往下砸的含义相反。
          - 把 D 相对自身 60 日的偏离(cross_zscore,或减 ts_mean)乘以当天日内收益 log(day_last(Close) / day_first(Open)) 的符号或幅度,取 20 日均值;
          - cross_corr(D, 日内收益, 40)。
          读的是:这只股票的晚动通常发生在上涨日,还是下跌日(尾盘在薄量里被拉升或打压)。A 股尾盘有独立的价格行为:LY2022 发现 T+1 下最后一小时的收益可预测;CGZ2019 发现中国股票日内首尾时段的动量与反转。
          日内收益用开盘价与收盘价显式构造,不用 day_sum(Ret),所以不依赖第 0 根 Ret 是否含隔夜跳空。
          另有一条:按 |日内收益| 加权的 D 均值减等权均值,看错开在大波动日是否不同。
      (3) 相对自身常态的新息:
          - cross_zscore(D, 60);
          - ts_rank(D, 60);
          - 5 日均值减 60 日中位数;
          - 非参数版:在 60 日 D 中位数的十分位内,给 5 日 D 均值取秩(cs_bucket_rank)。
          迁移在 c_A 水平上试过(head 13,+0.59),在 D 上没试过。两者减掉的东西不同:前者减掉的是风格,后者减掉的是这只股票自己常态的错位。

      【为什么和库里不同】三件事都把持久水平消掉,所以按构造,与 head 4 / head 8 / head 12 的日度秩 |ρ| 应远低于 0.7。预期 ≤ 0.5,种子 5 除外;与 5 个控制的 |ρ| 预期 ≤ 0.3。
      本位不用凸变换,不用 mask,不用 cs_stddev_full;不以 LogFloat* / LimitWidth / BoardCode 作排序键或分桶键;唯一的分桶键是 D 自己的 60 日中位数,是连续量(避开陷阱 1–3)。

      【已知的毛病】
      (i) 2018-08-20 沪市启用收盘集合竞价,沪市股票的 c_A 在 train 里有一个台阶。(3) 的 60 日新息会在 2018-08 至 2018-11 把「沪 vs 深」读成新息,这只占 train 的约 6%。(1)(2) 是窗口内的对比:台阶在放量日与缩量日、上涨日与下跌日两边同时出现,相减后被消掉。
      (ii) 40 日窗口里放量日可能只有十几天,条件均值噪声大。所以用 40 / 60 日,不用 20 日。
      (iii) GP 只在核心外面长,很可能把平滑重新加回去。那样的候选会被库禁令拒掉,浪费一部分采样。

      【为什么样本外还会在】
      - 决定成交时点结构的是制度:T+1、开盘与收盘集合竞价、散户集中在开盘下单、被动资金在收盘成交。这些在 2023-08-08 之后都没有变。
      - D 和三种对比都是有界、无量纲的量,不随成交额和波动的水平漂移。
      - 三种外围都消掉了股票自身的持久水平,所以收益不来自那个窗口越长越像已知族的风格成分。

      【事先判决】本位所有与 head 8 / head 12 日度秩 |ρ| < 0.7 的候选,若都低于 0.3,说明 D 的分数只在持久水平里。再看 R 里 head 12 的三个分桶变体:若它们也都 < 0.5,本种子的成交时点族(水平与差值)整体判为已知族 / 流动性的重写。
