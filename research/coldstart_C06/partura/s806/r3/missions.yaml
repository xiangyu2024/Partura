  - head: 'cs_first_low40(LogFloatShares, day_centroid(Amt))'
    why: |-
      【烂部件】_lexi 的排序键 LogFloatShares。

      【依据】(与第 1 稿相同)
      - 按源码,cs_first_low40(y, x) = rank(y) + 1·{x 落在当日最低 40%},_lexi 只用两个参数的秩。方向 +1,所以多头是「当日成交偏早那 40% 里 LogFloatShares 最大的一档」。
      - LogFloatShares 与市值控制 LogFloatCap 只差一个 log 价格。放在排序位上,这就是陷阱 3 的离散形式:线性中性化只去掉 rank(LogFloatShares) 的线性部分,带内「最大那一档」这个非线性选择留了下来。
      - 共性表里 5 行 pow_* / abs_(LogFloatShares) 都是它的单调重写,秩完全相同,是 GP 在这个方向上拟合的痕迹。
      - head 14 是全库最弱的 head:0.58,valid 0.58 < train 0.68。

      【第 1 稿错在哪里】
      - 第 1 稿把排序键换成 ts_quantile_q50(day_centroid(Amt), 20 / 60)。这正是 head 4 / head 9 的输入,即成交重心的水平。r2 的 R 组已经把它判为已知族的非线性代理(在已知族十分位内 1.22 → 0.36)。所以第 1 稿等于把一个控制代理换成另一个控制代理。
      - 相关度表也这样显示:第 1 稿变体 1 与 head 9 / head 4 的残差为 0.74 / 0.66,变体 2 与 head 9 为 0.62。而两者与 head 4 / head 9 的原始 |ρ| 都 ≤ 0.26。原始低、残差高,说明控制拿掉之后剩下的主要是成交重心的水平。
      - 带键也有同样的问题。示性函数 1{今天的重心落在最低 40%} 本身是今天的水平;经过半衰期 20 的 EMA,它变成「近期偏早的天数占比」,仍然是水平。第 1 稿两个变体与原 head 的原始 |ρ| 都是 0.70,就来自这条共用的带。

      【为什么不交「只换排序键、保留原带」的写法】
      - 审计意见给的第一种改法是 cs_first_low40(sub(ts_quantile_q50(day_centroid(Amt), 20), day_centroid(Amt)), day_centroid(Amt))。我没有交。
      - 把输出拆开看:带 ≈ −(常态 + 偏离),排序键 = 常态 − 今天 = −偏离,常态的载荷只来自带。
      - 第 1 稿的排序键是 +常态,还和带的 −常态抵掉了一部分;残差仍有 0.74。这一写法把这部分抵消也拿掉了,水平载荷只会更大。
      - 所以本稿的原则是:带键与排序键都必须不带水平,否则不交。

      【本稿:替换进来的键都不带水平】
      (1) 在自己常态的十分位内,给今天的重心取秩:cs_bucket_rank(day_centroid(Amt), ts_quantile_q50(day_centroid(Amt), 20))。
          - 常态相同的股票互相比较。每个十分位内输出是均匀的,所以常态的水平按构造被拿掉,剩下今天相对常态的偏离。
          - 这是审计意见建议的第二种写法。
          - 机制:GKM2001 说异常成交要看相对自身的偏离,这里搬到时点维度上。开盘段出现异常集中的成交,说明隔夜消息或注意力在开盘时到来。
      (2) 同 (1),常态换成 60 日中位数:cs_bucket_rank(day_centroid(Amt), ts_quantile_q50(day_centroid(Amt), 60))。
          - 20 日中位数会被最近几天的异常日本身拉动,60 日常态更稳,偏离更「异常」。
          - (1)(2) 对照着看窗口是否有悬崖。
      (3) 保留 head 14 的 _lexi 骨架,把带键与排序键都换成不带水平的量:cs_first_low40(cross_zscore(day_sum(Amt), 20), sub(day_centroid(Amt), ts_quantile_q50(day_centroid(Amt), 20)))。
          - 带:今天的重心比自己 20 日中位数提前得最多的那 40%。
          - 带内排序:今天的成交额相对自身 20 日的 z 分数(cross_zscore 是逐只股票的时间序列 z 分数,源码 ops_ext.py)。
          - 方向为 +1 时,多头是「今天成交异常地早,而且异常地多」,即开盘段出现放量的集中成交。
          - z 分数用自身窗口标准化,按构造与成交额的水平(流动性控制)无关。

      【不用的东西】不用凸变换、mask、cs_stddev_full,也不用 LogFloat* / LimitWidth / BoardCode。带键、排序键、分桶键都是连续量,不落 §4 陷阱 1–3。

      【已知的毛病】
      - 2018-08-20 沪市启用收盘集合竞价,沪市股票的成交重心有一个台阶。「今天相对常态」会在之后 20 / 60 个交易日里把它读成偏离,约占 train 的 2% / 6%。
      - 单日偏离换手高。半衰期由评估在 train 上拟合,扣 15 bp 后能否过 0.68 是本组最大的不确定。

      【门槛与事先判决】
      - 需 ≥ 0.68 才进库。三个变体与原 head 预计都 < 0.5(不再共用那条带),走收录,要求与库里所有 head 的 |ρ| < 0.7。
      - 若相关度表显示它们与 head 4 / head 9 的残差 ≥ 0.5,说明拿掉常态之后仍不干净,这一组只剩诊断价值。
      - 若三个都 < 0.3,head 14 的 0.58 全在「LogFloatShares 排序 + 水平带」里,成交时点的单日偏离不带可交易的信息。
