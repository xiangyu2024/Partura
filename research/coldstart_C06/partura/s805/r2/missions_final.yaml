- type: N
  hypothesis: 【机制】日内量价共振:成交量是追着价格来的,还是价格跟着成交量走。Campbell-Grossman-Wang 1993:非信息性的买卖压力由风险厌恶的做市方吸收,
    伴随高成交量的价格变动随后反转;Llorente-Michaely-Saar-Wang 2002:投机(信息)交易带来的量价变动延续,对冲 / 流动性交易带来的反转;Karpoff
    1987 综述量价关系在上涨时更陡(不对称)。 日内版本:一只股票的成交若持续集中在当天的相对高价处(分钟收盘价与分钟成交量正相关,VWAP 高于等时加权均价),说明成交量是追着价格来的(A
    股散户追涨), 这部分推高是流动性需求而不是信息,随后数周回吐;成交集中在当天低价处(负相关)说明有资金在回落中承接,随后跑赢。**事先给定方向:共振类信号取
    −1(做多量价负相关)。** 第二个可证伪的切分是领先滞后:「上一分钟涨、这一分钟放量」corr(r_{t−1}, V_t) 是追涨,预测为负;「先放量、后上涨」corr(r_t,
    V_{t−1}) 是知情交易领先,预测为正;两者之差把追涨与知情分开。 【算子怎样实现】P = in_slice(Close, 1, 236),V = in_slice(Volume,
    1, 236),r = in_slice(Ret, 1, 236),同样只取 09:31–14:56 的连续竞价:第 0 列开盘竞价、第 237–240 列收盘竞价窗口的成交量是普通分钟的数倍,
    价格又恰好是开盘价与收盘价,不切掉的话 day_corr 由两个端点决定,退化成「收盘高于开盘吗」,即当日涨跌,与 20 日反转控制同源。 day_corr(P,
    V) 是逐日 Pearson;log(V) 版压低大单的杠杆,并让零成交分钟(log 0 为 NaN,day_corr 只用两边都有限的分钟)自动退出计算,锁板、停牌分钟因此不进;
    log(day_wmean(P, V) / day_mean(P)) 是同一机制的 VWAP 溢价写法;day_corr(r, V) 看放量分钟是上涨还是下跌;in_delay(·,
    1) 的两版是分钟级领先滞后,第三版取两者之差。 逐日值用 cross_mean(·, 20) 或 cross_ema(·, 10) 聚合成持续的量价形态并压低换手;两个分桶种子在同一流动性十分位、同一波动十分位内比较;下午段一版(第
    121–236 列)检验共振是否主要发生在午后。 全天版(含竞价格)是对照,预期更差。 【和库里已有的不同】库里的 head 是成交量对「时间」的重心(什么时候交易)与规模
    / 价格水平;本位是成交量对「价位」的共振与量价谁领先,价格路径是输入的一半。 上涨日与下跌日的 corr(P, V) 符号各异,20 日平均后与时点重心只剩「时点
    × 日内趋势」的交叉项,预计与 head +1.28 的日度秩 |ρ| < 0.3; 相关系数与对数比都无量纲,与流动性、波动、市值控制没有单调关系(不是
    §4-3),没有凸变换(不是 §4-1),没有截面常数(不是 §4-2); 只用价格在当天的相对位置而不用涨跌幅,与 20 日反转只通过日内趋势弱相关。第
    1 轮 N 是「按收益符号定号的成交时点差」,本位不看时点、看价位与领先滞后。 【为什么样本外还会在】散户占成交的大头、追涨、T+1 造成的流动性需求冲击是
    A 股的结构,2023-08 之后没有改变;做市方吸收压力再收回补偿是一般均衡机制,不是某段行情; 信号全是相关系数与对数比,不依赖某段时期的水平,切掉竞价格后也不受上交所
    2018 年收盘竞价改革影响。
  inspired_by: 第 1、2 批:本种子唯一被证实的来源是「成交量在时间上怎么分布」(head +1.28,做多成交偏早),第 1 轮 N 位最好的一条(+0.27)方向也是「早买晚卖」——
