  hypothesis: '【机制】日内收益分布的不对称:好波动与坏波动。A 股成交以散户为主,散户偏好彩票型(正偏)收益;Barberis-Huang 2008
    证明在累积前景理论的概率加权下,投资者高估正偏证券, 正偏证券的期望超额收益为负。一只股票过去 1–4 周的分钟收益若呈现「上涨靠少数大跳、下跌是平缓阴跌」(已实现偏度为正、相对符号跳跃变差
    RSJ = (RV⁺ − RV⁻)/RV 为正), 它就是彩票型,会被追捧、随后 1–4 周跑输;坏波动主导(负偏)的股票被过度回避,随后跑赢。Amaya
    等 2015 用日内数据构造周度已实现偏度,最低偏度十分位减最高十分位下一周约 19bp、t 约 3.7; Bollerslev-Li-Zhao 2020
    按归一化的「好减坏」半方差排序,下期收益差显著,控制其他特征后仍在。**事先给定方向:信号取 −1(做多低 RSJ / 低偏度)**;若 reward 选
    +1,本假设即被证伪。 【算子怎样实现】r = in_slice(Ret, 1, 236):只取连续竞价 09:31–14:56。第 0 列是 09:30
    开盘集合竞价(alphacube dt_in.in_half 的注释写明 V2 第 0 列是开盘竞价、两个连续竞价时段是第 1–120、121–240 列),
    第 237–240 列是 14:57–15:00 收盘集合竞价窗口(深市一直有,上交所 2018-08-20 起才有)。第 0 格的收益是隔夜跳空,第 240
    格是收盘竞价撮合,两格的 |r| 常是普通分钟的数倍: 不切掉的话 RV 被一两格主导,RSJ 退化成「跳空方向」或「收盘竞价方向」,还把上交所的制度跳变带进
    train。四种独立写法互相校验: (1) RSJ_day = day_signed_ratio(r, pow_2(r)) = Σ r²·sign(r) /
    Σ r²,恰好就是 (RV⁺ − RV⁻)/RV,在 [−1, 1]; (2) 已实现偏度 day_skew(r),逐日中心化的三阶标准矩; (3) 立方加权
    Σ |r|³·sign(r) / Σ |r|³(day_signed_ratio(r, mul(pow_2(r), abs_(r)))),只看大跳; (4)
    极值不对称 (max r − |min r|)/(max r + |min r|),日内版的 MAX 效应。 去漂移版先 in_demean(r) 减掉当日分钟均值,去掉「当天整体涨跌」对
    RSJ 的机械贡献,使它与 20 日反转控制分离(偏度本身已逐日中心化)。 聚合用 cross_ema(·, 5)(对应文献的周度窗口)与 cross_mean(·,
    20)(月度,换手更低,适配 15bp 成本)。两个分桶种子在同一波动十分位、同一流动性十分位内比较不对称性: 偏度与波动水平的交互是非线性的,分桶只在十分位内重排,不对波动做任何凸变换(不落
    §4-1)。上午段(第 1–120 列)与下午段(第 121–236 列)各一版,检验不对称在哪个时段产生。 两个全天版(含竞价格)是对照,预期明显更差;若反而更好,说明信息在竞价跳空里而不在日内分布里。
    【和库里已有的不同】库里 6 个 head 是成交量的日内时点(day_centroid 的平滑水平)和流通股本 / 价格水平;本位的输入是分钟收益的符号与幅度,不含成交量、规模或价格水平,机制是彩票偏好而不是交易时点。
    偏度与 RSJ 都是无量纲比值,不是波动的单调或凸函数(不是 §4-1),也不是市值、波动、流动性的非线性重写(不是 §4-3);没有截面常数进 cs_*(不是
    §4-2)。 第 1 轮的 N 是「按分钟收益符号给成交量定号的时点差」,本位完全不用成交量。预计与所有 head 的日度秩 |ρ| < 0.3,与 5 个控制
    < 0.4(最大的是 20 日反转,去漂移版更低)。 【为什么样本外还会在】驱动力是散户的彩票偏好加上套利限制(涨跌停、T+1、融券难),这些是 A 股的制度与投资者结构,2023-08
    之后没有改变; 信号全是标准化比值,不依赖某段时期的波动或价格水平;切掉竞价格后不受上交所 2018 年收盘竞价改革影响,train 与 valid 口径一致。'
  inspired_by: 文献:Amaya 等 2015 的周度已实现偏度、Bollerslev-Li-Zhao 2020 的好坏半方差。批次:第 1 轮 N
