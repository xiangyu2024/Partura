  why: 四类部件各有问题,依据都在 loc 的拆解与代码里。(1) 分桶键 cross_mean^3(day_sum(Amt), 30) 是代理:把整个分桶敲掉
    score 只变 +0.0024(1.2758 → 1.2734), 但与已知族的相关从 −0.21 回到 −0.55,这个 head 合格与否全靠一个流动性键顺手带走了已知族(两者都是
    Amt 量纲、高度相关)。Kim-Korajczyk-Neuhierl 2021 指出用相关代理做双重排序会给出误导结论, 应直接按要控制的量分桶。变体 1、2
    把键换成已知族 cross_mean(day_std(Amt), 30) 与波动控制;变体 3、4 换成落在多头腿上的两条非线性通道:冻结报价 / 锁板 (锁板日成交全在早盘,重心机械偏早,而
    long_neutral 不加不可交易掩码)用 cross_mean(day_flat_ratio(Close), 20),新股连板用 ListAge。 这四个直接替换键,对照基线是裸核
    cross_ema(day_centroid(Volume), 10) 的 +1.3132:分数保住即该通道不是来源,塌掉即这个 head 是该通道的改写。
    (2) 输入 Volume 的 241 格里有两个集合竞价格:第 0 列是 09:30 开盘竞价(alphacube dt_in.in_half 的注释),第
    237–240 列是 14:57–15:00 收盘竞价窗口(深市一直有,上交所 2018-08-20 才有,train 前约 8 个月沪市这几格是连续竞价)。
    重心里第 240 格权重为 1、第 0 格只进分母,两格成交是普通分钟的数倍,重心的截面差可能有相当部分只是「收盘竞价份额 − 开盘竞价份额」,并带着交易所的制度跳变。
    变体 5、6、7 用 in_slice 分别去掉开盘格、收盘窗口、两者;对所有股票统一切到 14:56,两个交易所、改革前后口径一致。 (3) 字段与窗口:Volume
    → Amt 已测 +1.3684(+0.093,差 0.007 到门槛);窗口 10 → 20 只掉 0.09 而 10 → 5 掉 0.78,信号是慢变量、EMA
    10 偏短。变体 8 = Amt + 20,变体 9 = Amt + 连续竞价 + 20。 (4) 平滑器:窗口减半掉 0.78 说明单日重心噪声大,一两笔大单就能把当天重心拉偏;变体
    10 用 20 日滚动中位数代替 EMA。 变体 11、12 是 (1)(2)(3) 的组合:连续竞价重心按已知族分桶,两处修正都成立时这是最干净的写法。外层保序的
    log 一律不动(它只挪 0.02–0.07),所以每个变体与原 head 的差都来自被换掉的那个部件。
