    novelty: 4
    soundness: 4
    struck_seeds: [8]
    reasons: '创新度:核心是连续竞价分钟价格与分钟成交量的日内共振 day_corr(P, V) 及其 VWAP/TWAP 写法,输入的一半是日内价格路径;库里 head 只用价格水平(首分钟 Open/High,后复权)和成交量的时间重心,没有一个看「量落在什么价位」。相关度表 12 个种子与 head 的原始 |ρ| 最大 0.22(种子 6,已被表划掉),核心种子 1–4、9–12 只有 0.04–0.09,残差 ≤ 0.17。Volume 与 +1.28、+0.51 两个 head 共用,但角色不同(对价格的相关,不是对时刻的重心),20 日平均后与时点重心几乎无关,按 §3 给 4;这就是 A 股卖方已发表的量价相关性(东吴金工 2020 的 CPV:分钟价与分钟量的日相关取 20 日均值,方向为负),不是 5。和本种子第 1 轮 N(按收益符号给成交量定号)比:核心不用收益符号,不重复;种子 5–8 的 day_corr(Ret, Volume) 与领先滞后才和第 1 轮同源。合理度:in_slice(·, 1, 236) = 第 1–236 列,竞价格确实切掉;day_corr = cov / (sqrt(var_x·var_y) + EPS),只用两边都有限的分钟,逐日尺度不变,后复权和成交量单位都不影响;log 对 |x| ≤ 1e-9 返回 NaN,种子 3 的零成交分钟确实退出计算,PI 的说法对;in_delay(·, 1) 在切片后的行内右移一格、首格 NaN,领先滞后写法正确;day_wmean 用 |w| 加权,log(VWAP/TWAP) ≈ cov(P,V)/(P̄·V̄) = corr × 价格日内变异系数 × 成交量变异系数,是同一机制,但幅度随日内波动线性放大(带号的一次方,不是凸变换,vol 列 0.16,不落 §4-1)。没有截面常数、没有控制量的非线性重写。CGW 1993、Llorente 2002 是日频量价动态,不直接是日内价位共振,但上面的 CPV 是 2023-08 之前的直接 A 股证据,给 4;样本外理由是结构性泛论,且该因子早已公开、可能拥挤,不给 5。窗口 20 日均值、EMA 半衰期 10 合理。问题:PI 说本位「只用价格在当天的相对位置,与 20 日反转只通过日内趋势弱相关」,对 Close 版成立(rev 0.13–0.19),对 Ret 版不成立——种子 5、6 与 20 日反转 0.53、0.58,按规则被相关度表划掉;种子 8 = 种子 6 − 种子 7,种子 7 与反转只有 0.02,差值的 0.49 几乎全来自已被划掉的种子 6,是同一个反转改写,我划掉。这样「追涨 vs 知情」那条可证伪的切分只剩种子 7 一个,GP 结果对它说明不了多少,这一半假设应视为基本失效。另提示:整天锁死时 var_x = 0,day_corr 返回 0 而不是 NaN,一字板日被当成「无共振」拉向 0,影响小。连同表划的 5、6,划完剩 9 个。'
    revise: '—'
R:
  - head: 'log(cs_bucket_rank(cross_ema(day_centroid(Volume), 10), cross_mean(cross_mean(cross_mean(day_sum(Amt), 30), 30), 30)))'
    soundness: 3
    reasons: '逐条对照 loc.json 的拆解。(1) 分桶键确是代理:敲掉整个 cs_bucket_rank 后 score 1.2734 对 1.2758(必要性 0.0024),而 rho_known 从 −0.21 回到 −0.55,即这个键对奖励没有贡献,作用只是让 head 过已知族门槛;直接按已知族分桶(变体 1、11、12,相关度表 known 0.01,与原 head 0.94/0.93/0.85)是把代理换成被代理的量,机制清楚、实现正确,这是本组站得住的部分。(2) Volume→Amt 有 +0.093 的 train/valid 证据。其余部件证据弱或相反:窗口 10→20 在拆解里是 1.2758→1.2208(掉 0.055,PI 写成 0.09),10 好于 5 和 20,「EMA 10 偏短」推不出来,变体 8、9、12 把 Amt 的 +0.093 与窗口 20 的 −0.055 叠在一起,很难过 +0.1;变体 5–7 去掉竞价格后与原 head 的日度秩 |ρ| 为 1.00/0.99/0.99,竞价格对截面排序几乎没有贡献,这个部件没有被证明是烂的,基本不可能 +0.1;变体 4 有两处问题——相关度表 known 0.53 ≥ 0.5,按 R 规则先天不能合格,而且 ListAge 对 2018-01-02 之前上市的股票都是 10000 加同一个天数(dailyfields._list_age 的哨兵),每天大部分股票在 ListAge 上是一个并列块,cs_bucket_rank 用 _pct_rank(稳定 argsort 的序数秩)切十分位,这个并列块会按股票列序被切进好几个十分位,正是 §4-2 的列序机制,测的不是「新股连板通道」而是按代码顺序分组,PI 应删掉这个变体;变体 3 的 day_flat_ratio 20 日均值是连续值,没有这个问题。外层 log 对 (0, 1] 的分桶秩保序、不改书,核对属实。整体:主替换(分桶键)有 train 证据、实现正确;约一半变体信息量很低或与证据相反,一个碰到 §4-2,给 3 而不是 4。'
  - head: 'cs_last_low20(cs_last_low20(sub(sub(day_pos_ratio(High), day_first(abs_(sub(-2, abs_(sub(-1, Open)))))), day_first(abs_(sub(-2, abs_(sub(-1, Open)))))), day_first(High)), ts_argmax(day_first(abs_(sub(-1, Open))), 1))'
    soundness: 3
    reasons: '被替换的部件确是死件,代码核对:ts_argmax(x, 1) 走 rolling_reduce + nanargmax_last,1 日窗口里 idx_from_end = 0,pct 返回 (0+1)/1 = 1.0,只在 Open 缺失时为 NaN,是截面常数(loc distinct 0.0003,过不了门槛);它作 cs_last_low20 的筛变量时,_lexi 用 _rank_block 按并列块定 band,整个截面是一个块,bh = 1 > 0.2,band 为空,外层只剩对内层的 _pct_rank,保序,确是空操作(_rank_block 处理了并列,所以这里没有 §4-2 的列序斜坡);另一个 head 上 Open→Close 只改这个常数、score 一位不差,也印证了。去掉它有确定依据。但这个变体不是「去掉」,而是把常数的参数 day_first(abs_(sub(-1, Open))) = 1 + 首分钟开盘价(后复权)变成一道新的「最低 20% 价格」筛:单纯去掉外层(即内层子树)loc 测得 0.8122,只比原 head 高 0.0007,+0.127 全部来自新加的这道筛,而内层已有 day_first(High) 这道几乎相同的筛,两道筛只在 20% 分位边界上因首分钟 High 与 Open 的差而不同,改的是书边缘的少数名字;而且增益只在 train(0.81→0.94),valid 反而略降(2.58→2.54),更像边界重排而不是更好的机制。PI 也如实说明仍是价格水平带书、不是新信息。好处是库里少一个含死常数的 head,骨架禁令不再锁住 ts_argmax(·, 1) 这个空结构;与原 head ρ 0.99、已知族 0.14,替换几乎不改变库的样本外表现,也没有引入 §4 的陷阱(筛变量是价格水平,不是 5 个控制之一,没有常数进 cs_*)。部件确烂、依据确定,替换是卫生性的,给 3。'
summary: '两个 N 位都通过:a(分钟收益分布不对称,创新 4、合理 4,划种子 2,剩 13)与 b(日内量价共振 CPV,创新 4、合理 4,我划种子 8,表划 5、6,剩 9);两组 R 合理度 3 保留,但 R1 的 ListAge 变体碰 §4-2 且已知族 0.53 不可能合格、窗口 20 与竞价切片变体缺证据,R2 的增益来自重复的价格筛而不是去掉死件。'
