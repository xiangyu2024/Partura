    reasons: '创新度:输入是连续竞价分钟收益的符号与幅度分布(RSJ、已实现偏度、立方加权符号比、日内极值不对称),库里 6 个 head 只用 Volume/Amt 的日内时间重心 day_centroid、LogFloatShares、首分钟 Open/High 的价格水平,没有一个碰收益分布的形状;相关度表 14 个种子与 head 的原始日度秩 |ρ| 最大 0.25(种子 9 对 +1.28 head),其余 0.13–0.24,残差最大 0.32(种子 8 午后版),机制(彩票偏好 / 好坏波动)与 head(成交时点、价格带)不同,按 §3 给 4;Amaya 2015、Bollerslev-Li-Zhao 2020 以及 A 股卖方的高频偏度、上下行波动率因子都做过,不是 5。合理度:逐个核对算子——in_slice(x, 1, 236) 是 x[:, 1:237],首尾都含,正好 09:31–14:56(第 0 列开盘竞价、第 237–240 列收盘竞价窗口确实切掉);pow_2 走 pow_ 的 e>1 分支,是普通平方;day_signed_ratio(r, pow_2(r)) = Σ r²·sign(r) / Σ r²,恰是 (RV⁺−RV⁻)/RV;mul(pow_2(r), abs_(r)) = |r|³;day_skew 是逐日 nanmean 中心化的三阶标准矩;in_demean = x 减行内 nanmean。全天锁死时 Σr² = 0,day_signed_ratio 返回 NaN,day_skew 的 div 是 0/0 也得 NaN,cross_ema 跳过 NaN 日,锁板日不会被当成 0。全部是零次齐次的比值,没有对波动水平做 pow / signedpower,不是 §4-1;分桶种子 10、11 只在波动十分位内重排(vol 列 0.01),不是 §4-3;没有截面常数进 cs_*,不是 §4-2。窗口 EMA 半衰期 5(文献的周度)与 20 日均值合理。有 2023-08 之前的直接文献证据,给 4;不给 5:A 股高频偏度类因子 2019–2023 年已被量化广泛使用,拥挤后样本外衰减的可能 PI 没讨论,「散户结构没变」不足以说明它还在。风险:不去均值的 RSJ 与 20 日反转的 |ρ| 在 0.38–0.49(种子 1、2、9、10、13),高于 PI 预计的 < 0.4;5 日 EMA 那段里有一部分是一周反转(不在 5 个控制里,线性中性化去不掉),去均值版(种子 3,rev 0.30)和偏度版(种子 4、5,0.25、0.28)才是这个假设的干净写法,GP 结果要按这两类读。划掉种子 2:20 日均值的 RSJ 与 20 日反转控制用同一个窗口,|ρ| 0.49 紧贴 0.5 门槛,线性中性化后剩下的主要是同一段 20 日收益路径的非线性部分(§4-3 同一个道理用在反转上),不是偏度信息;要 20 日版应写成 cross_mean(day_signed_ratio(in_demean(r), pow_2(in_demean(r))), 20)。种子 13、14(含竞价格的全天对照)与种子 1、4 的相关度剖面几乎一样(head 0.22/0.21 对 0.21/0.20,rev 0.42/0.24 对 0.42/0.25),作为事先声明的对照保留,但对 GP 多样性贡献很小。划完剩 13 个。'
    revise: '—'
