    日滞后均值」的十分位里按当前 241 日均值排序,排的是一个很小的差(约 15 天的增长);名义价格 15 天能动 ±10%,于是 Amt 版的排序里混进了一条名义价格的中期趋势,与要测的竞价成交增长无关。证据(loc.json
    拆解,已付费):Amt → Volume = +1.3163(train 1.3163 / valid 2.1036),比原 head +0.18,rho_known
    −0.2192,与原 head 的 ρ 只有 0.3272 ——价格那一截不但没帮忙,还把书换掉了大半。变体 1 即此;按规则 §2 它是「收录」(ρ <
    0.5),前提是与库里 head 都 < 0.7,相关度表会给。变体 2–4 检查同一个 head 里还有没有别的烂部件:变体 2(log):241 日算术均值被少数放量日(新闻、解禁、指数调整)主导,一次尖峰进出
    241 日窗口和 30 日滞后窗口时会制造机械的「增长」(Goyal-Wahal 2015 讲的滚动窗口回声);对 log(day_first(Volume))
    取均值 = 几何均值,尖峰不再主导,竞价量为 0 的日子 log 返回 NaN、被 nanmean 跳过。若信号是真的参与度增长,它应当不掉;若掉得多,原
