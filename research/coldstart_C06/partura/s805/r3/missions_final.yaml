  why: 脆的部件是矩偏度这个泛函。nanskew_last = m3 / σ³,50 个日度观测里 m3 由最大的一两个值决定,于是 ts_skew ≈「窗口里有没有一次极端值」,极值进窗
    / 出窗各造成一次跳变;拆解表的证据:窗口 50 → 25 塌到 −0.30(train 也只有 0.46),50 → 100 掉到 0.53 —— 一个随窗口翻号的泛函是脆的。替换成同一窗口上的尾均值稳健偏度
    ((T75 − M) − (M − T25)) / (T75 − T25)(T75 / T25 = 上 / 下四分之一约 13 天的均值,M = 中位数;Bali-Cakici-Whitelaw
    2011 用 MAX(2)–MAX(5) 代替单一最大值的同一思路)。若这个 head 的信息是分布形状,稳健版保住并且更稳(可能 ≥ +0.98 ⇒ 替换);若它塌,head
