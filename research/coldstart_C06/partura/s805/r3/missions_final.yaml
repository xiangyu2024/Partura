  hypothesis: 【机制】日内成交时点的「事件尾部」,不是时点的平均水平。库里已证明日内成交量重心的慢变水平有截面信息(head +1.28 = log(cs_bucket_rank(cross_ema(day_centroid(Volume),
    10), …)),方向 −1,做多成交偏早的股票),但上一轮 R 的直接评估给了两条线索:(i) 把分桶键换成已知族或波动之后只剩 0.52 / 0.46,水平本身的干净部分在发现门槛附近;(ii)
    把 cross_ema(·, 10) 换成 cross_med(·, 20) 掉 0.38(1.2758 → 0.8942),而 EMA 窗口 10 → 20
    只掉 0.055 ——中位数与均值的差别就是丢掉偶发的极端日,说明一部分信息在「少数几天成交时点异常」里。我们的读法:这些极端日是执行事件。(a) 极端偏晚的日子(成交压到尾盘):基准化
    / 被动资金与机构的收盘执行,Bogousslavsky-Muravyev 记录了收盘成交占比与被动 / ETF 持股相关、收盘有会回吐的机构价格压力 ⇒
    这类事件多的股票随后跑输,事先给定方向 −1;(b) 极端偏早的日子(成交压到开盘后):隔夜信息在开盘被知情方 / 机构消化(Qiu-Huang-Jiang
    2023:A 股机构集中在开盘与收盘交易,价格跟机构走)⇒ 早尾深的股票随后跑赢,事先给定方向 +1。两条合起来 = 股票自己 50 日时点分布的偏斜:右尾(偏晚事件)比左尾(偏早事件)重,方向
    −1。【算子怎样实现】c = day_centroid(in_slice(Volume, 1, 236)) = Σ t·|V_t| / Σ|V_t| / (T−1)
    ∈ [0, 1],只用 09:31–14:56 连续竞价分钟:第 0 列是 09:30 开盘集合竞价(alphacube dt_in.in_half 的注释),第
    237–240 列是 14:57–15:00 收盘竞价窗口(上交所 2018-08-20 才有),切掉后两个交易所、改革前后口径一致,集合竞价份额的日间波动不混进来(那是
    b 位的事;种子 4 是含竞价格的对照)。三类尾部写法互相校验:(1) 矩偏度 ts_skew(c, 50)(nanskew_last = m3 / σ³,对
    c 的平移与缩放不变,因此与重心水平、与成交量大小都无关);(2) 尾均值稳健偏度 ((T75 − M) − (M − T25)) / (T75 − T25),T75
    / T25 = cross_tail_mean_q75 / q25(50 日里上 / 下四分之一约 13 天的均值),M = cross_med,值在 (−1,
    1):尾部用约 13 天而不是 1 天定义(Bali-Cakici-Whitelaw 用 MAX(2)–MAX(5) 做稳健性的同一思路),专门回答「ts_skew
    ≈ 窗口里有没有一次极端值、极值进窗 / 出窗造成 50 天回声」这个担心;(3) 单侧尾深 (T75 − M) / σ 与 (M − T25) / σ(σ
    = cross_stddev(c, 50),零次齐次),分别对应 (a)(b),事先方向 −1 与 +1。另有 Amt 版、100 日版、Pearson 写法
    day_corr(in_index(V), V) 的偏度、ts_kurt(两侧尾部同时重,不定号)。三个条件化种子:在重心水平十分位内排(键 = cross_ema(day_centroid(Volume),
    10),直接把库里那个水平 head 拿掉,只留尾部);在已知族十分位内排(cross_mean(day_std(Amt), 30));在冻结报价十分位内排(cross_mean(day_flat_ratio(Close),
    20),连续值)。最后这个针对一个具体混杂:盘中涨停后封板的日子,成交集中在封板之前,重心机械偏早,早尾会挑出「最近有过涨停」的名字;按 20 日冻结比例分桶后这些名字被摊到各十分位,只占多头书的一小部分(上一轮
    R 用同一个键给重心水平 head 分桶,分数 1.2556 几乎不变,说明这把键本身不伤信号)。【和库里已有的不同】与 head +1.28 / +0.51(重心水平):同一输入,泛函不同(三阶
    / 尾部形状 vs 平滑均值),偏度对平移不变,按水平十分位分桶的种子与水平正交;与 M 第 3 批两个 ts_skew(·, 50) head:同一聚合,内层不同
    —— 那两个是成交量的日内离散度 day_wstd(Volume, Vwap)(本身 rho_known 0.57,是已知族的同量纲代理,单独 −1.56)和分钟量价相关;本位内层是「成交在什么时候」,对成交量整体缩放不变,与成交量大小、与价格都无关。预计与所有
    head 的日度秩 |ρ| < 0.3,与 5 个控制 < 0.3。不是 §4-1(没有对方差做凸变换,σ 只在分母里做尺度归一,结果有界);不是 §4-2(没有截面常数进
    cs_*,三个分桶键都是连续量,不用 ListAge);不是 §4-3(偏度与尾部比值是零次齐次的,不是市值、波动、流动性的函数)。【为什么样本外还会在】执行日历是制度与投资者结构决定的:指数调整与被动资金在收盘执行、隔夜信息在开盘消化、T+1
    下的日内节奏,2023-08 之后没有变;信号有界、尺度无关,不依赖某段行情的波动或价格水平;连续竞价切片让上交所 2018 年收盘竞价改革不进入信号;50
    日窗口对应约一个季度的执行事件,换手低,适配 15bp 成本。【可证伪】(a) 若最好的种子方向与上面相反(偏斜 +1、晚尾 +1),「收盘执行压力回吐」这条错;(b)
    若只有矩偏度过线、稳健偏度与单侧尾深全不过线,信号是单一极端日的回声,不是分布形状;(c) 若冻结报价分桶版明显差于不分桶版,早尾读的是涨停封板。
