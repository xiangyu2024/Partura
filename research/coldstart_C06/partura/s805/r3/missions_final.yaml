    把竞价格换成全天成交(若同样好,竞价那一格不特殊,信号是普通的放量,Gervais-Kaniel-Mingelgrin 的高成交量溢价);变体 4 换成份额(若它好而变体
    3 差,竞价参与度本身是独立的一维)。两者里较差的那一半就是原 head 里的噪声部分。不测窗口:拆解表里 train 在 120 / 241 / 482
