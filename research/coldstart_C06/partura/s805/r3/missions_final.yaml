- type: N
  hypothesis: 【机制】集合竞价的参与份额 —— 一只股票有多大比例的成交在开盘 / 收盘两次集合竞价里完成 —— 刻画的是它的投资者结构(谁在什么机制下交易),而不是它的流动性水平。(1)
    收盘竞价份额 k:美股证据(Bogousslavsky-Muravyev)是收盘竞价成交占比与被动 / ETF 持股强相关、与主动基金无关,收盘存在随后回吐的机构价格压力;A
    股 Qiu-Huang-Jiang 2023 记录机构集中在开盘与收盘交易。库内证据(第 2 轮 R 的直接评估):head +1.28(重心水平,方向 −1)只去掉
    14:57–15:00 四格掉 0.34(1.2758 → 0.9376),只去掉开盘格几乎不变(1.2658)—— 重心 head 里有一块就是「收盘那几格成交多
    ⇒ 跑输」。份额把这一块从重心的连续时点里单独拿出来,事先给定方向 −1。(2) 开盘竞价份额 o:开盘竞价是隔夜信息被定价的地方。库内 head +1.13(cs_bucket_rank(cross_mean(day_first(Amt),
    241), cross_mean(cross_mean(day_first(Amt), 241), 30)))证明开盘竞价成交这一维有信息(三个 knockout
    的必要性 +1.41 / +1.88 / +2.03),但它的三个水平层(day_first(Amt)、其 241 日均值、再 30 日平滑)与已知族的 |ρ|
    是 0.73–0.79,水平这条路被控制堵死,那个 head 只能测增长;份额 = 开盘竞价成交 / 全天成交,对成交量整体缩放零次齐次,消掉流动性水平。o
    的方向不预设,两种解释给出相反的号(知情方在竞价消化隔夜信息 ⇒ +1;散户在竞价追隔夜消息 ⇒ −1),用 o 与 k 是否同号来判:同号同量级 ⇒ 信息是「集合竞价
    vs 连续竞价」本身;异号 ⇒ 是开盘与收盘两类参与者。【算子怎样实现】o = div(day_first(Volume), day_sum(Volume))(day_first
    = 当日第一个非 NaN 分钟 = 第 0 列 09:30 开盘竞价);k = div(day_sum(in_slice(Volume, 237, 240)),
    day_sum(Volume))(in_slice 含首尾,第 237–240 列 = 14:57–15:00)。用 Volume 不用 Amt:生产库价格字段后复权、Amt
    与 Volume 是原始值;份额本来无量纲,用股数避免把分钟间的名义价格变动带进来(head +1.13 的拆解里 Amt → Volume 一换就是 +0.18,而且两本书的
    ρ 只有 0.33)。四组写法:(i) 水平:cross_mean(·, 20) 与 cross_med(·, 60)(中位数对少数一字板 / 新股连板日稳健
    —— 一字板日几乎全部成交在开盘竞价,o 接近 1);(ii) 开盘减收盘:cross_mean(sub(o, k), 20),以及 log(收盘竞价量 /
    开盘竞价量) 的 20 日均值(对数比对称、尺度无关;竞价量为 0 的日子 log 返回 NaN、被均值跳过);(iii) 份额的变化:sub(cross_mean(·,
    20), cross_mean(·, 120)),以及把 head +1.13 的「慢均值在其自身 30 日滞后均值的十分位内排序」结构搬到 o 上 ——log
    o 的增长 = 开盘竞价成交的增长 − 全天成交的增长,把 +1.13 里与一般放量(Gervais-Kaniel-Mingelgrin 的高成交量溢价)共有的那部分扣掉;变化版同时让上交所
    2018-08-20 收盘竞价改革造成的水平跳变在 120 日后自愈(Han-Zhao-Chen-Guo 2022:改革把成交从收盘连续竞价挪进了竞价前后,改革前沪市第
    237–240 列是连续竞价分钟);(iv) 条件化:在冻结报价十分位内排(cross_mean(day_flat_ratio(Close), 20),连续值,对付锁板)、在已知族十分位内排(cross_mean(day_std(Amt),
    30))、在流动性十分位内排(cross_mean(day_sum(Amt), 30))。刻意不用 ListAge 或 cross_valid_count(day_last(Close),
    241) 当分桶键:前者对 2018 年前上市的股票是同一个哨兵值,后者对上市满一年的股票都等于 241,两者都是大并列块,_pct_rank 的稳定 argsort
    会按列序把并列块切进几个十分位(§4-2)。【和库里已有的不同】与 head +1.13 / +0.63(开盘竞价成交额的慢速增长):同一类输入,机制不同
    —— 它们测竞价成交的绝对量在涨,本位测竞价在全天成交里的比重(谁在竞价里交易);水平版对成交量整体缩放不变,与 +1.13 的水平层(rho_known
    0.73–0.79)不是同一个量。与 head +1.28(重心):重心是连续的时刻加权,收盘竞价那四格在重心里权重为 1、与连续竞价分钟混在一起;份额把集合竞价这个离散的执行场所单独拿出来,并且同时看开盘一侧(重心里第
    0 格权重为 0,只进分母)。预计与所有 head 的日度秩 |ρ| < 0.5(收盘份额与 +1.28 最高),与 5 个控制 < 0.4(最可能是市值:指数成分
    / 被动持股集中在大盘股)。不是 §4-1(没有凸变换);不是 §4-2(没有截面常数进 cs_*,分桶键是连续量);对 §4-3 的风险(份额若只是市值的非线性函数)放了按流动性
    / 已知族分桶的对照,相关度表会给市值那一列。【为什么样本外还会在】被动 / 指数资金在收盘竞价执行、隔夜信息在开盘竞价定价,由交易制度与投资者结构决定,2023-08
    之后没有变;份额有界、零次齐次;2018-08-20 之后两个交易所的收盘制度一致,valid(2022-01 ~ 2023-08)整段在改革之后,score
    取 train 与 valid 的较差者,只靠改革前沪深分裂的书过不了 valid。【可证伪】(a) 若 k 的最好写法方向是 +1,「收盘执行压力回吐」错,head
    +1.28 切片掉的那 0.34 应读成收盘前几分钟的时点,而不是竞价份额;(b) 若只有水平版过线、变化版与条件化版全不过线,且水平版与流动性的 |ρ|
    偏高,它是流动性的非线性残余(§4-3);(c) 若冻结报价分桶版明显差于不分桶版,开盘份额读的是一字板。
