- head: day_kurt(in_slice(Ret, 1, 236))
  why: 怀疑的烂部件是峰度里的零收益点质量。_kurt(alphacube common.py)= mean(d⁴) / mean(d²)² − 3,尺度无关;但分钟收益里有大量恰好为
    0 的分钟(无成交、封板、停牌、低价股的最小价位):若一只股票有比例 p 的分钟收益为 0、其余近似正态,则峰度 = 3 / (1 − p) − 3,p =
    0.3 时 1.29、p = 0.6 时 4.5 —— 峰度对零点质量是一个机械的单调函数,也就是说这个 head 可能是「零收益分钟占比」= 非流动性 /
    冻结报价的非线性改写(§4-3;ops_ext.py 里 day_flat_ratio 的说明也写着峰度在冻结状态下饱和)。文献:Lesmond-Ogden-Trzcinka
    1999、Bekaert-Harvey-Lundblad 2007 把零收益占比当非流动性代理;Wang-Hudson-Rhodes-Zhang-Gregoriou
    2020 发现控制波动后峰度对五种流动性代理(含零收益占比)都显著。这个 head 是本组第 2 轮的产物,拆解表是空的(loc 的变体生成器对分钟层子树不生成变体),到现在没有一个诊断数字。变体
    1 去掉烂部件:div(r, is_gt0(abs_(r))) 在 r == 0 时是 0/0 = NaN、其余是 r/1 = r、NaN 仍是 NaN,_kurt
    用 nanmean,于是只对非零分钟算峰度 —— 若保住 ≥ +1.03,替换成这个更干净的写法。变体 2 是被代理的量本身 day_zero_ratio(r)(与第
    2 轮 R 第 1 项同一逻辑:直接评估被怀疑的通道);它若 rho_known ≥ 0.5 先天不能进库,花这一格是诊断:分数接近 +0.93 ⇒ 这个
    head 在最终交付里要标成流动性改写。变体 3 是不含零点质量的尾部形状 day_es_ratio_hi(r)(95% 分位以上的均值 / 该分位,分位接近
    0 的死日判 NaN 剔除),把「尾部形状」与「零点质量」分开。
