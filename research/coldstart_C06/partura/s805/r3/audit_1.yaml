    reasons: '【创新度 3】输入和 head +1.28 `log(cs_bucket_rank(cross_ema(day_centroid(Volume), 10), …))` 相同,都是日内成交重心;时间维的聚合 ts_skew(·, 50) 和 M 第 3 批两个 head `ts_skew(day_wstd(Volume, Vwap), 50)`、`ts_skew(day_corr(Volume, Vwap), 50)` 相同。新的地方在于把两者组合起来:看重心在 50 日里的分布形状(三阶矩、尾均值、单侧尾深),而不是重心的平滑水平。偏度不是水平的单调变换,所以不属于 2 分。相关度表支持它和库不同:原始 |ρ| 最大 0.15–0.27(最高是种子 10 对 ts_skew(day_wstd) 的 0.27),残差 0.13–0.28;除种子 9 外,与控制的 |ρ| 都 ≤ 0.19。不给 4,因为输入与 head +1.28 是同一个量(§3 的 4 分要求输入也不同)。【合理度 3】逐个核对了算子:in_slice(x, 1, 236) = x[:, 1:237] 是截断而不是置 NaN,所以 day_centroid 的 T = 236,t/(T−1) 在 09:31–14:56 上铺满 [0, 1](第 0 列是开盘竞价,见 dt_in.in_half 的注释);nanskew_last = m3/σ³,EPS = 1e-9,相对重心的 σ³(约 1e-5)可以忽略,对平移和缩放不变;_tail_mean 是窗口里 ≥ 75% 分位(或 ≤ 25% 分位)那约 13 天的均值,所以稳健偏度落在 [−1, 1],单侧尾深是零次齐次的。没有落进 §4:没有对方差做凸变换;三个分桶键都是连续量(distinct ≥ 0.992),不是截面常数;与流动性、波动、市值的 |ρ| ≤ 0.19。50 / 100 日窗口与 M 第 3 批的 head 一致,合理。证据是间接的:上一轮 R 里 cross_ema@10 → cross_med@20 掉了 0.38,说明极端日在水平 head 里按水平自己的方向起作用,这和单侧尾深种子 7 / 8 的事先方向一致,但没有直接检验「偏度」;关于成交时点分布偏度,也没有文献。弱点有三。(1) 机制 (a) 讲的是被动 / 指数资金的收盘执行(Bogousslavsky-Muravyev),这类执行主要发生在第 237–240 列的收盘竞价,而主力种子把这几列切掉了,只有种子 4 保留。所以 (a) 实际上只以「尾盘连续竞价偏晚」这种较弱的形式被实现,可证伪条件 (a) 检验的也是这个较弱的版本。(2) 种子 2(Amt)几乎就是种子 1:Amt = Volume × 原始价格,日内价格变化很小,两者的重心几乎相同;保留,但不增加多样性。(3) 种子 10 ts_kurt 用的是 m4,比 m3 更受单个极值主导,也没有事先方向;作为「事件频率」保留,但不能拿来做可证伪检验 (b)。【划掉种子 9】ts_skew(day_corr(in_index(V), V), 50):相关度表里 liq 0.46、known 0.45,远高于本位其他种子(≤ 0.19),贴近 0.5 线。它算的是时间序号与分钟成交量的 Pearson 相关,即成交量的日内线性趋势,由少数尖峰主导;它的日间抽样分布(因此 50 日偏度)随成交稀疏程度变化,也就是随流动性变化,属于 §4-3 的风险。它也不是「重心分布的尾部」,是另一个统计量,不符合本位的 idea。划掉后剩 12 个种子。'
    revise: '—'
  - slot: b
    novelty: 3
    soundness: 3
    struck_seeds: [2, 6, 10]
    reasons: '【创新度 3】份额是对库里已有那一类输入的新归一化:o 的分子 day_first(·) 就是 head +1.13 / +0.63(day_first(Amt) 的慢增长)的输入;k 的分子是第 237–240 列,上一轮 R 已显示 head +1.28 去掉这四格掉 0.34。机制不同:这里看集合竞价这个执行场所的参与份额,不是竞价成交额的增长,也不是按时刻加权的重心。除以 day_sum 消掉了全天成交的水平,也消掉了送转造成的股数跳变。相关度表:o 类种子与 head +0.63 的原始 |ρ| 在 0.47–0.52(种子 1 是 0.47,种子 8 是 0.52、残差 0.55),种子 5 与 +1.28 是 0.48;k 类种子 0.19–0.36。输入同类,而且多个 |ρ| ≥ 0.3,所以不到 4。【合理度 3】核对了算子:day_first 取当日第一个非 NaN 分钟,即第 0 列开盘竞价;in_slice(Volume, 237, 240) = x[:, 237:241],含首尾,正好是 14:57–15:00;common.log 在 |x| ≤ 1e-9 时返回 NaN。机制有文献(Bogousslavsky-Muravyev:收盘竞价份额与被动持股相关;Qiu-Huang-Jiang),也有样本内线索(head +1.28 去掉 237–240 掉 0.34;+1.13 的三个 knockout)。窗口 20 / 60 / 120 合理。风险有五条。(1) o 的持续水平是流动性 / 已知族的代理:种子 2 cross_med(o, 60) 的 liq 0.57、known 0.60,§4-3。(2) 一字板与新股连板日几乎全部成交在开盘竞价,o ≈ 1;20 日均值会被这些事件主导(种子 1 的 vol 0.38 就是这个迹象)。long_neutral 不加不可交易掩码,方向若选 +1 就可能买到封板的票。中位数和冻结报价分桶只能部分缓解。(3) k 的水平与市值相关 0.43 / 0.48(种子 3 / 4,种子 11 是 0.43),这是 k 最可能的 §4-3 通道(指数成分是市值的阶梯函数),但没有一个种子按 LogFloatCap 分桶;种子 12 / 14 按已知族 / 流动性分桶,对付的是更弱的相关(0.29 / 0.32)。(4) 关于改革的说法不准:k 的 sub(mean20, mean120) 并没有去掉上交所 2018-08-20 的跳变,只是把它挪了位置。改革后约 120 个交易日(约 2018-08 至 2019-02,在 train 里),每只沪市股票的 k 变化都会机械偏高,等于一个交易所哑变量;水平版的同类污染在 2018-01 至 2018-08。score 取 train 与 valid 的较差者,能防止靠这个伪信号成为发现,但 train 会带进噪声。(5) o 的方向没有事先给定(两种解释给出相反的号)。【划掉】种子 2:§4-3,liq 0.57 / known 0.60,相关度表本身也会划掉。种子 6:门槛废品,coverage 0.691。开盘竞价量为 0 的日子,div(收盘竞价量, 0) = inf,而 common.log 只把 |x| ≤ 1e-9 置 NaN,所以 log(inf) = inf;cross_mean 的 nanmean 不跳过 inf,会把它带进之后 20 天。计划里「竞价量为 0 的日子 log 返回 NaN」只对分子为 0 的情形成立。种子 10:它就是种子 2 再按冻结报价分桶;这把键针对的是封板,不是让种子 2 被划掉的流动性通道,结果仍是 liq 0.43 / known 0.47。按流动性分桶的 o 水平已有种子 13,那才是对的写法。划完剩 11 个种子。【建议,不影响通过】加一个 cs_bucket_rank(k, LogFloatCap);可证伪条件 (c) 的 o 侧,用种子 1 配 cs_bucket_rank(cross_mean(o, 20), cross_mean(day_flat_ratio(Close), 20)) 做成对照。'
    revise: '—'
R:
  - head: 'cs_bucket_rank(cross_mean(day_first(Amt), 241), cross_mean(cross_mean(day_first(Amt), 241), 30))'
    soundness: 3
    reasons: '变体 1 就是 loc 里已经付费的 Amt → Volume 交换:+1.32(train 1.32 / valid 2.10),原 head +1.13(1.13 / 2.48)。在起约束作用的 train 上超过 +0.1;rho_known −0.22;与原 head 的原始 |ρ| 0.38,也是与库里所有 head 的最大值。照 §2 会被收录。机制上,Amt = Volume × 原始价格,价格趋势混进了增长量,这说得通。但有一处不准:241 日均值与它的 30 日滞后均值之差,比较的是刚进窗口的日子(现在)和刚出窗口的日子(约一年前),所以混进来的是约一年的原始价格变化,不是 15 天。更要紧的是,换上的部件带进了另一种污染:Volume 是原始股数,送转 / 拆股在除权日让股数成交翻倍,而 Amt 不变。之后一年里 cross_mean(day_first(Volume), 241) 相对它的滞后均值会机械地「增长」,把送转后的股票排到前面;Amt 版本对此不变。两本书的 ρ 只有 0.33,与这个解释相容。变体 2(log 几何均值)和变体 3(day_sum(Volume))有同样的除权跳变,只有变体 4(日内份额)能消掉它,所以「变体 3 对变体 4」这个分解被送转混淆了。Amt 不能算干净的烂部件:替换实现了去掉价格,同时加进了除权事件,所以给 3,不给 4。建议加一个与送转无关的换手写法,例如在同一结构里用 sub(log(day_first(Volume)), LogFloatShares)(前提是 LogFloatShares 在除权日同步更新)。'
  - head: 'cs_bucket_rank(cross_mean(cross_mean(day_first(Amt), 20), 20), cross_mean(cross_mean(cross_mean(day_first(Amt), 20), 20), 30))'
    soundness: 3
    reasons: '两个变体与原 head 的 ρ 是 0.85 / 0.72(相关度表),走的是替换路径:需要 ≥ +0.73。理由是:在约 40 日三角均值对其 30 日滞后均值这个尺度上,Amt 的价格那一截是 1–2 个月的原始价格变化,与 20 日反转控制的窗口同一量级,线性中性化只去掉线性部分(§4-3 型的残余)。机制清楚,算子(只换字段、log 几何均值)实现了它。证据是从 241 日版借来的(+0.18),这个 head 自己没有付费数字。送转的除权跳变在这个尺度上同样存在(近 2 个月内送转的票),但这个尺度上成交量本身的变化相对价格更大,任一时点的送转股又很少,与 ρ 0.85 相容。'
  - head: 'day_kurt(in_slice(Ret, 1, 236))'
    soundness: 3
    reasons: '数学成立:若比例 p 的分钟收益为 0、其余近似正态,_kurt = nanmean(d⁴) / nanmean(d²)² − 3 = 3/(1−p) − 3。变体 1 的实现核对过:is_gt0 返回整数 0/1(NaN > 0 为假,得 0),于是非零分钟是 r/1 = r,零分钟是 0/0 = NaN,NaN 是 NaN/0 = NaN;_kurt 用 nanmean,所以确实只对非零分钟算峰度。但相关度表削弱了「这是烂部件」这个前提:day_zero_ratio 与 day_kurt head 的原始 |ρ| 低于 0.27(kurt head 不在它最像的前三个里,第三个是 0.269);变体 1 与原 head 的 ρ 是 0.89。零点质量只是小头,预计变体 1 的分数变化不大。变体 2 是门槛废品(distinct 0.054),liq 0.60 / known 0.55 也都 ≥ 0.5,拿不到可收录的分数,这一格是浪费;PI 想要的诊断,相关度表已经给了。变体 3 day_es_ratio_hi:分位接近 0 的死日返回 NaN,核对过;与原 head ρ 0.48,若更好可以收录。整体便宜、有信息量,机制清楚、实现正确,给 3。'
  - head: 'ts_skew(day_wstd(Volume, Vwap), 50)'
    soundness: 3
    reasons: '这个 head 自己有直接证据(loc 拆解):窗口 50 → 25 时 train 0.46 / valid −0.30,50 → 100 时 0.87 / 0.53。替换写法是同一内层、同一窗口上的尾均值稳健偏度(_tail_mean 与 cross_med 都核对过,值在 [−1, 1]),与原 head ρ 0.63,走替换路径。保留意见:窗口缩到 25 天时任何三阶泛函都会变噪,所以窗口敏感本身不能证明是矩偏度坏了,但稳健版正是回答这个问题的对照。内层 day_wstd(Volume, Vwap) 不动:Vwap 是分钟字段,日内几乎不变,这个内层约等于分钟成交量的标准差。'
  - head: 'ts_skew(day_corr(Volume, Vwap), 50)'
    soundness: 3
    reasons: '变体 1 是同样的稳健偏度替换,实现正确,与原 head ρ 0.71,走替换路径。但这个 head 自己没有拆解数字,「矩偏度是烂部件」完全是从兄弟 head 借来的。变体 2 cross_mean(day_corr(Volume, Vwap), 50) 不是去烂部件,而是在同一内层、同一窗口上检验「偏度这个泛函是否必要」。Vwap 是分钟级(后复权)价格,所以它约等于第 2 轮 b 位的种子 cross_mean(day_corr(Close, Volume), 20) 那一族,只是窗口改成 50;PI 已说明该位同类写法 0 个过线。所以先验偏弱,但它与所有 head 的 |ρ| ≤ 0.10,是受控、便宜的一格。机制清楚、算子实现了它,证据不足,给 3。'
summary: '两个 N 位(a:成交时点分布的尾部 / 偏度;b:集合竞价参与份额)都是创新度 3、合理度 3,通过:a 划掉种子 9(liq / known 0.46 / 0.45,Pearson 写法,§4-3 风险),b 划掉种子 2(liq / known 0.57 / 0.60)、6(log 遇 0 除得 inf,门槛废品)、10(仍是流动性代理);b 位需要留意 k 与市值的非线性关系(没有按市值分桶)和改革跳变只是被挪了位置;五个 R 组都是 3,其中 R1 换成 Volume 后带进了送转的除权跳变,R3 的前提被相关度表削弱,变体 2 是废品。'
