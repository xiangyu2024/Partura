    reasons: '【创新度 4】库里 0 个 head;第 1 批唯一富集的结构是不定号的 day_centroid(Volume)。本位按分钟收益符号把成交拆开,比较上涨成交与下跌成交的时点,用了四种写法:重心差、时刻加权净买压之差、最后 60 分钟净买压减全天、时刻与定号成交量的日内相关。输入多了 sign(Ret) 与时刻,机制是「买卖方向在日内什么时候发生」,而不是「成交在什么时候发生」。相关度表里 13 个种子与 5 个控制的 |rho| 全部不超过 0.18(多数不超过 0.05),与 20 日反转不超过 0.16,所以它不是反转或控制的改写。不给 5:日内分时段收益(上午 / 下午、隔夜 / 日内)与收盘价格压力在文献里都有,本位是它们的定号成交量版本。【合理度 3】逐个核对算子:is_gt0 / is_lt0 返回 0/1 整数,NaN 收益记 0,所以 mul(Volume, is_gt0(Ret)) 只留下上涨分钟的成交;收益为 0 的分钟(含锁板)两边都不进,锁板日的另一边为空,day_centroid 给 NaN,cross_mean 跳过,和假设的说法一致。is_gt0(in_index(Volume)) 恰好去掉第 0 格;is_gt0(sub(in_index(Volume),0.75)) 恰好是最后 60 分钟;day_signed_ratio 的分母包含零收益分钟。算子实现了所述的量,10-20 日聚合合理。不给 4,有四点:(i) 文献是相邻证据。Gao 等 2018 是市场层面的日内动量,Chordia-Roll-Subrahmanyam 2002 是市场订单失衡,Pastor-Stambaugh 2003 是流动性风险,都没有直接说个股定号时点差能预测截面收益。(ii) 机制内部有张力。所引的 Qiu-Huang-Jiang 说机构同时集中在开盘和收盘,假设却把早盘当作散户和隔夜消息,所以「晚减早」并不等于「机构减散户」;拿开收盘对午盘来比,更贴合这篇文献。(iii) 方向写成「或反过来」:迟到知情交易与收盘价格压力回吐预测的符号相反,reward 会在 train 上选号,这不算错,但可证伪性弱。(iv) 开盘和收盘集合竞价那两格的成交量是普通分钟的数倍,而第 0 格的符号其实是隔夜跳空。1、2、3、5、6、8 号都包含这两格,信号有相当一部分是「收盘竞价收益符号减隔夜跳空符号」的成交加权版。8 号的 day_corr 是 Pearson,t=0 与 t=1 两个端点上的大成交分钟杠杆最大,受影响最重。只有 4 号去掉了开盘格。建议 GP 种群里留一个同时去掉开盘格与收盘竞价格的版本,好分清信号来自连续竞价还是集合竞价。【划掉】12:与 a 位 8 号同一个问题。cs_last_high10 只在正方向上是排除屏;reward 对 sign 取 +1 和 -1 两个方向(steer.py 约 638 行),而本位假设自己就写了方向可能相反。一旦取 -1,被压到底的 10% 冻结名字就整体成为多头十分位,long_neutral 又不加不可交易掩码,书变成只买锁板、连板和停复牌名字的机械书。其余 12 个种子都符合本位 idea,相关度门槛全过,不划。'
