    reasons: '【创新度 3】核心 day_centroid(Volume) 在第 1 批 36 个含它的候选里平均 score 0.00(共性表 +0.00 / -2.01:富集只说明它比其他结构少亏,不说明它本身有 alpha)。已有外围可见的全是 pow_1_5 / pow_2_5 及其嵌套,在 [0,1] 上严格单增;reward(partura/steer.py 约 632-646 行)先 EMA 平滑、再 z-rank、再对 5 个控制做线性残差,所以这些外围和裸核几乎是同一本书。本位外围做三件不同的事:一是自身历史偏离(cross_zscore / cross_madz / EMA3 减 EMA40,种子 1、2、4、7、9);二是分桶条件化(cs_bucket_rank / cs_bucket_zscore);三是与定号净买压、异常成交量、尾分钟收益的交互(种子 10-14)。相对已有外围,这是同一输入上的不同机制,给 3。相关度表也支持「偏离写法确实离开了水平」:核心与控制最大 0.20(known),种子 1、7、12、14 与 5 个控制都不超过 0.10。不给 4,有两个原因:主体是通用的标准化 / 分桶工具套在同一输入上;库里 0 个 head,「与所有 head |rho|<0.3」在这里没有区分力。【合理度 3】我逐个核对了算子,三类机制都由算子实现。cross_zscore 窗口含当天,std 退化时给 0;cross_madz 要求至少 d/2 个有效天;cs_bucket_rank 取 x 十分位内的百分位,再加 1e-4 倍总秩破平;cs_flip_by_state 用 241 日中位数判状态,rank 居中。5-60 日窗口合理,在 15bp 成本下做平滑也合理。不给 4,因为所引文献只支撑相邻事实:Gervais 等 2001 讲的是成交量水平冲击,不是时点冲击;Bogousslavsky-Muravyev 讲的是收盘价格压力;Qiu-Huang-Jiang 2023-06 讲的是投资者的日内时点分工。没有一篇直接说时点偏离能预测截面收益,而 train 上唯一的证据是水平约等于 0。【保留但提醒】(i) 上交所 2018-08-20 引入收盘集合竞价,沪市重心水平随之跳升。把 cross_ema(...,10) 水平直接送进 cs_* 的种子(6、13)在 train 前约 8 个月带交易所倾斜;偏离类在 20-60 日后自愈。(ii) 6 号按流动性分桶后,与 vol 的 |rho| 从裸核的 0.16 升到 0.35,和 5 号是同一现象的弱版本。(iii) 13 号只靠一个市场变量的二值切换翻号。Admati-Pfleiderer 讲的是日内交易聚集,不是截面溢价随市场成交额反号,先验弱;而且状态在中位数附近来回时,整本书会整体翻转,换手跳升。【划掉】3:相关度表判为废品(distinct 0.097)。cross_rank(.,120) 只有约 120 个离散值,截面大量并列,十分位书要靠列序破平,接近 §4-2。5:按 LogFloatCap 分桶后,与 liq / vol / known 的 |rho| 从裸核的 0.18 / 0.16 / 0.20 升到 0.44 / 0.44 / 0.47(known 离不合格线 0.5 只差 0.03)。在同一市值十分位内比重心,排出来的主要是换手和波动,正是 §4-3 说的控制变量非线性重写,与本位「分桶去代理」的说法相反;GP 再往外长,很容易越过 0.5。8:cs_last_high10 只在正方向上是排除屏。reward 对 sign 取 +1 和 -1 两个方向,选 train 更好的那个(steer.py 约 638 行的 for sign in (1.0, -1.0))。_lexi 把被筛出的 10% 名字放在 (-1,0];反号后它们高于其他所有股票,恰好构成整个多头十分位。书就变成「只买 20 日平均报价最冻结的名字」(锁板、新股连板、停复牌前后),而 long_neutral 不加不可交易掩码,这是 GP 能利用的机械书。'
    revise: '—'
