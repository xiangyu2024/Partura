- type: E
  core: day_centroid(Volume)
  hypothesis: 核心 day_centroid(Volume) = 当天成交量沿分钟轴的重心(0 = 全在开盘,1 = 全在收盘),描述成交发生在日内什么时点,这是
    std / kurt / gini 等无序统计量全部丢掉的一维;它有界、无量纲、截面上高度持续,更像股票属性而不是信号。快照里含它的 36 个候选,看得见的外围几乎全是
    pow_1_5 / pow_2_5 及其嵌套:在 [0,1] 的非负输入上它们严格单增,而奖励先对信号逐日取秩再中性化,所以这些外围交易的是和裸核同一本书(含核心候选平均
    score 约 0.00,发现门槛 0.5)。一个没被定价的静态属性分数就该是 0,所以如果这一维里有东西,它在偏离与条件化里,不在水平里。本 E 位的外围只用打破秩等价的三类处理,每个种子的外围至少两种算子。(A)
    自身历史偏离:cross_zscore / cross_madz(稳健版)/ cross_rank / 短长 EMA 之差,把静态水平变成事件,即这只股票本周的成交比它自己过去
    20-120 天异常地偏晚或偏早。机制:A 股机构比散户更集中在开盘与收盘附近交易、全天价格跟随机构流(Qiu-Huang-Jiang 2023);收盘段成交与被动/机构资金及收盘价格压力相关(Bogousslavsky-Muravyev);成交活动相对自身近几周的异常变化携带关注度与信息,而水平不携带(Gervais-Kaniel-Mingelgrin
    2001 用的正是偏离而非水平)。偏离写法还顺带消掉上交所 2018-08-20 引入收盘集合竞价造成的重心水平跳变(Han 等 2022),窗口过后自身均值已更新,train
    内部的制度切换不会被当成信号。(B) 非线性条件化:cs_bucket_rank / cs_bucket_zscore 在同一市值十分位、同一流动性十分位、同一波动十分位内比较时点,cs_last_high10
    把报价长期冻结(停牌、锁板)的 10% 名字压到底。奖励对市值、流动性的中性化是线性的,而尾盘成交占比与被动持股、指数成分的关系是阶梯式非线性的(成分股门槛),分桶把这部分代理整个去掉,留下同类股票之间的时点差;剔除冻结报价是为了不让涨停锁板(成交全在早盘、重心机械偏小)冒充信号。(C)
    交互:时点偏离乘当日净买压 day_signed_ratio(Ret, Amt)、时点与净买压的 20 日滚动相关(晚盘放量的日子是在买还是在卖)、时点偏离乘异常成交量的截面秩(放量且放在尾盘)、时点偏离乘最后一分钟收益(收盘集合竞价的价格压力随后回吐),以及按全市场成交额状态翻转(Admati-Pfleiderer
    1988:知情与流动性交易的聚集随市场状态而变)。与已有外围的区别:已有的是秩保持的单调变换,信息量为零;这里每一类都改变截面排序,且三类各自对应一个可证伪的判断(偏离有效
    = 时点是事件;分桶后才有效 = 信号原被规模/流动性代理压住;交互有效 = 方向信息在尾盘)。为什么样本外还会在:驱动力是制度与结构性的,收盘集合竞价、指数与
    ETF 以收盘价为基准、机构与散户的日内时点分工,2023-08 之后都没有改变;偏离类与分桶类只用相对量,不依赖某段时期的水平;所有种子用 5-20 日均值或
    EMA 平滑以压低换手,适配扣 15bp 的纯多头十分位书。
