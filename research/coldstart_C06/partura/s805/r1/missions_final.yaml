- type: N
  hypothesis: 定号成交的日内时点不对称:尾盘在买、早盘在卖(或反过来)。机制:A 股机构比散户更集中在开盘与收盘附近交易,且全天价格跟随机构而非散户(Qiu-Huang-Jiang
    2023-06);临近收盘的成交含有迟到的知情交易(Gao-Han-Li-Zhou 2018 对日内动量的解释);用分钟收益的符号给成交量定号是买卖方向的标准日频代理(Chordia-Roll-Subrahmanyam
    2002 的订单失衡,Pastor-Stambaugh 2003 的收益定号成交量)。由此:一只股票上涨分钟的成交重心若持续晚于下跌分钟的成交重心,说明尾盘那部分更知情的资金在净买、早盘(隔夜消息驱动、散户为主)在净卖,尾盘资金的信息尚未完全进入价格,随后数日到数周有漂移;反之是尾盘派发。另有一条推断(非文献证实)的
    A 股增强:T+1 下当天买入不能当天卖,对未来几日有把握的买方在尾盘建仓所承担的日内风险最小。算子实现,四种独立写法互相校验:(1) sub(day_centroid(mul(Volume,
    is_gt0(Ret))), day_centroid(mul(Volume, is_lt0(Ret)))) = 上涨分钟成交重心减下跌分钟成交重心,在 [-1,1];其中一版再乘
    is_gt0(in_index(Volume)) 去掉第 0 格开盘集合竞价,因为那一格的收益符号是隔夜跳空,不是日内时点;另一版用 Amt。(2) day_signed_ratio(Ret,
    mul(Volume, in_index(Volume))) 减 day_signed_ratio(Ret, Volume):按时刻加权的净买压减不加权的净买压;以及按时刻加权减按
    1-时刻加权。(3) 最后 60 分钟(in_index > 0.75)的净买压减全天净买压。(4) day_corr(in_index(Volume),
    mul(Volume, sign(Ret))):定号成交量随时刻上升的趋势。每个日值用 10-20 日均值或 EMA 聚合成持续的吸筹/派发,并压低换手;另有几版做自身
    60 日偏离、市值分桶、波动分桶、剔除冻结报价、乘异常成交量截面秩(Gervais 等 2001:放量日信息更多)。与已有的东西不同:快照里没有 head;快照唯一富集的结构
    day_centroid(Volume) 是不定号的成交时点(什么时候交易),这里是定号成交的时点差(什么时候买、什么时候卖);不定号重心是上涨与下跌两个重心的成交加权平均,本位取的是两者之差,构造上与它近似正交。它也不是
    20 日反转的改写:只用分钟收益的符号,不用幅度,且是晚减早的差分,当天整体涨跌在差分里大部分相消。涨停锁板的分钟收益为 0,既不进上涨也不进下跌,锁板日的机械偏差因此大部分自动去掉;长期冻结的名字另由
    cs_last_high10 剔除。为什么样本外还会在:T+1、收盘集合竞价、机构与散户的日内分工都是制度与结构,2023-08 之后没有改变;信号全是相对量(差分、比值、自身偏离),不依赖某段时期的水平。
  inspired_by: 第 1 批:唯一不崩塌的结构是 day_centroid(Volume)(含它的 36 个候选平均 score 约 0,不含的约 -2),说明日内时点这一维截面结构稳定,但不定号的水平不赚钱;把时点定号(买的时点对卖的时点)是把这一维变成方向信息最直接的一步。文献:Qiu-Huang-Jiang
    2023-06(机构在开收盘交易、价格跟机构),Gao-Han-Li-Zhou 2018(尾盘迟到的知情交易)。
