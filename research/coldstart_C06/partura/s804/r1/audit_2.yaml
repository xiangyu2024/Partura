    soundness: 3
    reasons: '变体与第 1 次完全相同,上次通过,这次结论不变。变体 1 就是定位输出自己列出的 R 候选:跳掉 ts_decay_linear 后 +0.76 变成 +0.88,train(+0.75→+0.88)和 valid(+2.63→+2.81)同向上升。窗口从 40、20、10 到不平滑,score 依次是 +0.70、+0.75、+0.80、+0.88,单调,说明价格的 20 日线性衰减在这个 head 里确实拖后腿。机制上也说得通:用当前价格划「最便宜 20%」,比用滞后的价格更及时。其余部件的判断与源码一致。day_wstd 恒非负,abs_ 是恒等(必要性 +0.00)。_lexi 只用 x 的整块秩,pow_3 对正价格单调,去掉不改变结果。尾巴量级约 1e-7,而 cs_first_low20 输出相邻秩的间隔约 1/N≈2.5e-4,改变不了排序;只有尾巴为 NaN 的极少数停牌股、新股,会因为 sub 变成 NaN。不给 4,原因有两条。(1) 同一个 knockout 在 head +0.78 上只有 +0.02,在 head +0.65 上是 -0.06,所以「20 日平滑有害」并不普遍。(2) 两个 ρ≈0.96 的策略在 4 年 train 上的夏普差,标准误大约 0.1–0.14,+0.12 只有一个标准误左右。变体 2、3 和变体 1 的排序相同,相关度表里三行逐项一致(0.962 / 0.985 / 各控制列)。上次指出它们白占两次评估,这次没改。不影响通过,但建议换成有信息的变体,例如窗口 5 的 ts_decay_linear,或者把后复权价换成名义价的对数 sub(LogFloatCap, LogFloatShares)。'
summary: 'PI 这次只删掉了被否的 R2–R4,两个任务位和 R1 的表达式没有改动。a 位(彩票筛 × 后复权价核心)创新度 3、合理度 3,补划 3 个用分钟 day_es_ratio_hi 的种子(它在便宜段读的是价位粗细,会把核心自己的多头腿推走),剩 10 个,通过。b 位(隔夜情绪回吐)创新度 4、合理度 3,划掉两个废品和一个隔夜波动的换写,剩 9 个,通过。R1(去掉价格的 20 日平滑)合理度 3,通过。'
