    struck_seeds: [3, 11, 12]
    reasons: '【与第 1 次的关系】corr_1 与 corr_2 里核心和 13 个种子逐项相同,这一位 PI 没有改(上次通过,本来就不要求改)。假设里仍写「名义股价水平」「核心是真实的个股价格」,对上次指出的后复权问题没有回应。这次重新核对后分数不变,但补划 3 个种子,理由在最后。【创新度 3】这个核心已见过的外围只有一种:cs_first_low20(y, 核心)。y 取平滑的 LogFloatShares、abs_(day_wstd(Vwap, High)) 或 abs_(day_corr(Vwap, High)),外加约 1e-7 的 ts_var(day_gini(High)) 尾巴;head +0.91 是同一结构反过来用。本位外围换了输入,用的是收益分布形状:分钟偏度、日频 ts_skew、波动标准化的 MAX。机制也换了:排除型筛 cs_last_high20/10、价格十分位内的条件排序 cs_bucket_rank / cs_bucket_zscore、秩的乘积、两道筛。不给 4 的理由有三条。(a) 留下的种子里,1、2、4、5、6、7、9、10 与 head 的原始 |ρ| 在 0.32–0.39(最高是 seed 9 对 head +0.78 的 0.39),达不到 4 分要求的 < 0.3。(b)「低价里剔除高偏度」就是 Kumar(2009)对彩票股的定义。(c) seed 9 的骨架仍是 head 的 cs_first_lowXX(y, 核心),只换了带宽和 y。【合理度 3】对照源码核对过算子。ops_ext._lexi 里,cs_last_high20(y, x) 给 x 最高 20%(按整块并列)的票 rank(y)-1,这些票永远进不了多头书,其余保序。cs_bucket_rank 在 x 的十分位内取秩,再加 1e-4 倍的全局秩来破并列;cs_bucket_zscore 是桶内 z 分数。ts_skew、ts_max、ts_std 都是 nan 版滚动。日收益用后复权收盘价之比,跨除权日连续。20 日窗口对应 Bali 等一个月的 MAX。没有凸变换,也没有截面常数,不碰陷阱 1、2。到不了 4,原因有三。(1) 价格是后复权的:alphacube/label.py 记录 12 只样本股的复权因子在 2.5x–113x;daily.py 记录原始 Amt/Volume 的中位数只有后复权 Close 的 0.108。这里修正我上次的说法:后复权因子 ≥1,名义价 ≤ 后复权价,所以核心最便宜的一端名义价格也有上界、偏低,Kumar 的「低价彩票股」在多头腿上大体适用。但核心的排序主要由累计复权因子决定,也就是上市年限和送转分红史。因此 Green-Hwang 的「名义价格档位」(seed 6、7 的分桶依据)和 seed 10 的「面值退市」,算子都没有实现。要名义价格,应写 sub(LogFloatCap, LogFloatShares),即名义价的对数。(2) 便宜段的分钟 Ret 被最小价位 0.01 元主导。几元钱的票一跳就是 0.2%–0.5%,绝大多数分钟收益只有 0 和 ±1 跳。在这种分布上,day_skew 读到的是上跳数减下跳数,即日内漂移,不是彩票度。Amaya 等用 5 分钟收益,正是为了避开这种微观结构噪声。(3) 核心与 liq、known、size 的 |ρ| 分别是 0.46、0.42、0.42,便宜端是指示函数型的暴露。用到这个核心的 4 个 head,valid 夏普都是 train 的 2–4 倍,存在 §4 陷阱 3 意义上小市值非线性残留的风险,本位外围没有处理。外围本身在 train 上也还没有任何证据。【划掉 3、11、12】这三个种子的彩票量都是 ts_mean(day_es_ratio_hi(Ret), 20)。源码 _es_ratio 的定义是:95% 分位以上那些分钟的均值,除以 95% 分位本身;分位≈0、或没有分钟超过它时为 NaN。价位受限的票,95% 分位通常正好落在 1 跳上,超过它的只有 ≥2 跳的分钟,所以比值 ≥2;分位落在 0 和 1 跳之间插值时,比值还更大。价格连续的票,这个比值约 1.3–1.6(正态 1.25,拉普拉斯 1.43)。所以它在截面上的高端主要是名义价低、价位粗的票,度量的是最小价位相对价格的粗细,不是右尾形状。相关度表与此一致。同样是 20% 排除筛,用分钟偏度(seed 1)、日频偏度(seed 5)、标准化 MAX(seed 4)时,与 liq 的 |ρ| 是 0.36、0.35、0.33;用 es_ratio_hi(seed 3)时掉到 0.17,known 0.18。seed 11、12 的 liq 是 0.13、0.10,seed 12 的 size 只有 0.03。也就是说,这个筛子和核心的便宜维度同向,把核心自己的多头腿推到了底部,而不是在便宜段里挑出彩票股。这一点我上次没看出来,这次补划。其余 10 个保留:seed 4、5、13 用的是干净的日频彩票量;用分钟偏度的种子(1、2、6–10、13 的内层)有上面 (2) 的问题,但在价格连续的大部分股票上,它仍是已实现偏度,算子实现了这个位的意思。'
