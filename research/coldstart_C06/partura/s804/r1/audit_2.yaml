    reasons: '【与第 1 次的关系】12 个种子与第 1 次逐项相同,PI 没改(上次通过)。上次划掉的 7、8、11 还在计划里,这次照样划掉。【创新度 4】输入是隔夜跳空 log(day_first(Open) / ts_delay(day_last(Close), 1)),机制是开盘情绪溢价的回吐。库里 5 个 head 用的是后复权价格水平、流通股本、日内离散度和成交量的日内质心,没有一个碰隔夜段。相关度表:留下的 9 个种子与 head 的原始 |ρ| 不超过 0.12(seed 4),残差不超过 0.11;与 rev 是 0.03–0.23,与 vol 是 0.05–0.23,与 size 不超过 0.15,都离门槛很远。Berkman 2012、Aboody 2018、Lou-Polk-Skouras 2019 里已经有这个机制,所以不给 5。【合理度 3】算子核对如下。day_first / day_last 取当日第一个 / 最后一个非 NaN 分钟。价格是后复权的,alphacube/tradability.py 第 47 行注明后复权价之比跨除权日连续,送转、分红不会造出假跳空。停牌日的 day_last(Close) 是 NaN,所以复牌那天的 ON 也是 NaN;ts_mean、ts_med、ts_std 都是 nan 版,复牌的大跳空会被跳过,而不是被放大。10–40 日窗口适合看情绪回吐。对 20 日反转控制取残差后,剩下的大致是「隔夜减盘中」,也就是 LPS 的拉锯量。不给 4,原因有两条。(1) 证据都来自美股。A 股 T+1 下的方向,计划里既没有 A 股文献,也没有 train 上的证据;LPS 还显示隔夜收益本身有持续性,所以符号并不确定。(2) 一字板开盘的 ON 是 ±5/10/20%,比普通日大一个数量级。20 日均值里只要有一次一字跌停(折合均值约 -0.5%),大致就足以把这只票推进多头十分位,等于去接连续跌停的飞刀。seed 9、12 还乘上第一分钟成交量 / 日均分钟量;一字板当天开盘后几乎无量,这个比值更大,放大得更厉害。ts_med(seed 4,distinct 0.53,并列多但过了门槛)和均值 / 标准差(seed 6)更稳;GP 如果往 cs_winsor 或截断的方向长,应该保留下来。【划掉 7、8、11】seed 7(distinct 0.011)和 seed 11(distinct 0.037)在相关度表里的门槛是「废品」。seed 8 是 E[max(ON, 0)],这个半矩大致和隔夜波动成正比,与 vol 的 |ρ| 是 0.39,而本位其他种子只有 0.05–0.23。它的多头端就是隔夜波动最小的票,等于低波动异象从一个没被控制的波动量漏回来,和陷阱 1、3 是同一类。划完剩 9 个。'
