- type: N
  hypothesis: 【机制】A 股开盘集合竞价以散户为主,注意力驱动的买单集中在开盘:Berkman 等(2012)显示受关注的股票隔夜上涨、随后盘中回吐;
    Aboody 等(2018)显示隔夜收益是个股层面的散户情绪代理,隔夜收益高的股票随后跑输;Lou-Polk-Skouras(2019)显示收益在隔夜与盘中两段之间拉锯,
    隔夜段的持续溢价对应之后的反向。A 股的 T+1 让开盘买入的人当天不能卖出,开盘价里的情绪溢价不能当日被套利掉,会在之后几天到几周里回吐。 所以过去一段时间持续高开(累计隔夜收益高)的股票随后差,持续低开的随后好;纯多头书买后者。
    【算子怎么实现】隔夜对数收益 ON = log(div(day_first(Open), ts_delay(day_last(Close), 1)))(当日第一分钟开盘价
    / 上一交易日最后一分钟收盘价)。 种子取负后的 10-40 日均值、和、中位数、线性衰减;尺度无关的版本:ON 均值除以 ON 标准差、高开天数占比 ts_mean(is_gt0(ON),
    20)、只累计高开部分 mul(ON, is_gt0(ON)); 用集合竞价热度加权:ON 乘以第一分钟成交量相对当日均量 div(day_first(Volume),
    day_mean(Volume)); 以及相对自身基线的异常隔夜情绪:sub(ts_mean(ON, 50), ts_mean(ON, 5)) 与 ts_rank(ts_mean(ON,
    5), 50)。 【和库里已有的不同】5 个 head 都在价格水平 / 流通股本这一根轴上(外加一个日内成交质心),没有一个用到隔夜跳空; 20 日反转控制是收盘到收盘的总收益,隔夜段只占日收益方差的一小部分,且与当日盘中段负相关,所以
    ON 的累计与反转控制只部分相关; 种子刻意不用盘中收益本身(它和 20 日总收益高度相关),也不含任何波动或市值的凸变换,预期与所有 head 的 |rho|
    < 0.3。 【为什么样本外还会在】它依赖两条制度事实:散户在开盘集中下单、T+1;2023-08 之后两者都没变。情绪溢价的回吐是行为偏差, 在美股有多个年代的记录,不依赖本批
    head 可能吃到的那段小盘行情(本批 head 的 valid 夏普是 train 的 2-3 倍)。
  inspired_by: 本批唯一不在价格 / 市值轴上的信息是 head +0.58 的主项 -day_centroid(sqrt(Volume)),即开盘段的交易行为带信息;这里换成文献依据更强的开盘段读数(隔夜价格跳空,而不是成交量的时间位置)。文献:Berkman
    等 2012、Aboody 等 2018、Lou-Polk-Skouras 2019。
