- type: E
  core: ts_decay_linear(pow_3(day_mean(Open)), 20)
  hypothesis: 【核心是什么、为什么是 alpha】核心 ts_decay_linear(pow_3(day_mean(Open)), 20) 是名义股价水平(pow_3
    单调、20 日线性衰减只做平滑)。 定位输出的拆解说明它是本批 4 个 head 的 alpha 来源:把 cs_first_low20(y, 核心) 整段跳掉,head
    +0.76 掉到 -1.05、head +0.65 掉到 -2.78, 而被筛选的 y 单独都是负的(-1.06、-2.78);核心单独、高价在长端是 -1.15。也就是在
    LogFloatCap 线性中性化之后,低名义股价有正溢价, 且这个暴露是指示函数型的(线性市值控制拿不掉)。 【已见过的外围】只有一种:cs_first_low20(y,
    核心) 把最便宜 20% 硬顶到长端,y 是流通股本、以价格为单位的日内离散度 day_wstd 或 |day_corr|, 外加 1e-7 量级的 ts_var(day_gini(High),
    ·) 尾巴,以及 head +0.91 的符号翻转(把最便宜 20% 压下去,+0.91 反而高于顶上去的 +0.78)。 后者说明:最便宜的那一端里混着该避开的票。
    【本位要试的外围 = 彩票型需求筛子】Kumar(2009)把低价 + 高特质偏度定义为彩票股并显示散户集中持有;Birru & Wang(2016)显示投资者高估低价股的上行空间
    (把低价当成高偏度);Bali-Cakici-Whitelaw(2011)与 Amaya 等(2015)显示高 MAX / 高已实现偏度的股票随后收益低。
    所以低价溢价的多头腿被便宜段里的彩票股拖累:同样便宜,收益分布右偏、常有极端上冲的那些被高估。 【算子怎么实现】(1)连续的便宜度 neg(核心),再用排除型筛
    cs_last_high20 / cs_last_high10 把彩票度最高的 20% / 10% 压到底部、永远进不了多头书; 彩票度一律用尺度无关的量:分钟收益已实现偏度
    ts_mean(day_skew(Ret), 20)、右尾形状 ts_mean(day_es_ratio_hi(Ret), 20)、 以自身波动标准化的 MAX
    即 (20 日最大日收益 - 20 日均值) / 20 日标准差、日收益 20 日偏度 ts_skew; (2)价格十分位内的条件排序 cs_bucket_rank
    / cs_bucket_zscore(只和同价位的同伴比偏度;Green & Hwang(2009)显示价格档位本身是投资者的分类标签), 再与便宜度的截面秩相加或相乘;(3)两道筛:先去彩票,再用
    cs_last_low10 / cs_last_low05 去掉价格最低的 5%-10%(面值退市与壳投机集中的那一端), 对应 head +0.91 的证据。
    【和已有外围的不同】已有外围全是单个 cs_first_low20、y 都是规模或价格单位的量;没有一个用到收益分布的形状,没有排除型筛(cs_last_*)、
    没有分桶条件排序、没有两道筛或交互。彩票度量全部尺度无关(偏度、尾部形状、波动标准化的 MAX),不是波动或市值的单调重写,不碰陷阱 1、3; 核心是真实的个股价格,不是截面常数,不碰陷阱
    2。 【为什么样本外还会在】彩票偏好是散户主导市场里有跨国、跨年代记录的行为偏差;A 股散户成交占比高、涨跌停与 T+1 制度在 2023-08 之后没有变。
    这个筛子去掉的是便宜段里最投机的尾部,即使低价溢价本身随风格减弱,剔除彩票股仍是相对改进,而不依赖某一段小盘行情。
