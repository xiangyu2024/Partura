    reasons: '【创新度 3】这个核心已见过的外围只有一种:cs_first_low20(y, 核心),y 取平滑的 LogFloatShares、abs_(day_wstd(Vwap, High)) 或 abs_(day_corr(Vwap, High)),外加约 1e-7 的 ts_var(day_gini(High)) 尾巴,head +0.91 则是同一结构反过来压低。本位外围换了输入,用收益分布形状:分钟 day_skew(Ret) 的 20 日均值、day_es_ratio_hi、日频 ts_skew、波动标准化的 MAX。机制也换了:排除型筛 cs_last_high20/10、价格十分位内条件排序 cs_bucket_rank/zscore、秩的和与积、两道筛。对照 ops_ext._lexi 逐个核对过:cs_last_high20(y, x) 给 x 最高 20%(整块并列)的票 rank(y)-1,确实永远进不了多头书;cs_bucket_rank / cs_bucket_zscore 确实只在 x 的十分位内比较 y;嵌套时外层对内层输出重新取秩,保序。相关度表:13 个种子与 head 的原始 |ρ| 0.18–0.39,残差 0.22–0.44;控制最高 liq 0.43、known 0.43,没有一个触线;核心 liq 0.46、known 0.42、size 0.42,都在 0.5 以下。不给 4:8 个种子与某个 head 的 |ρ| 超过 0.3(最高是 seed 9 对 head +0.78 的 0.39),而且「低价里剔除高偏度」就是 Kumar(2009)对彩票股的定义。【合理度 3】机制清楚,算子实现了排除;20 日窗口对应 Bali 等一个月的 MAX;彩票度量都尺度无关,没有凸变换,也没有截面常数,不碰 §4 陷阱 1、2。以下三点让它到不了 4。(1) 价格字段是后复权的(alphacube/daily.py、label.py 与 partura/propose.py 的注释:生产库里 Open/High/Low/Close/Vwap 后复权,复权因子 2.5x–113x),所以核心 day_mean(Open) 不是名义价格,而约等于上市基准价乘以上市以来的累计总收益。Birru-Wang 的名义价格错觉、Green-Hwang 的价格档位、seed 10/11 的「面值退市」都建立在名义价格上,这一层算子没有实现(名义价格可以用 sub(LogFloatCap, LogFloatShares) 得到)。不过彩票筛本身(MAX、偏度效应)不依赖价格口径,所以只扣分、不判 2。(2) day_skew 与 day_es_ratio_hi 吃的是 1 分钟 Ret。名义价格 1–3 元的票一跳就是 0.3%–1%,分钟收益基本只有 0 和 ±1 跳;这种三点分布的偏度符号约等于「上跳数减下跳数」,读到的是日内漂移,不是彩票度,而这恰好发生在本位要筛的便宜段。日频的 ts_skew 和标准化 MAX(seed 4、5、13)没有这个问题。(3) 便宜端是指示函数型的暴露,与 size、liq 的相关是 0.42、0.46;用到这个核心的 4 个 head,valid 夏普都是 train 的 2–4 倍,和 2022–23 年的小微盘行情吻合,可能有 §4 陷阱 3 意义上小市值的非线性残留,本位外围没有处理。【种子】都符合本位的 idea,一个不划。seed 9 在结构上就是 head 的 cs_first_lowXX(y, 核心),只换了 y 和带宽;保留它,因为换进来的 y 正是本位的彩票量。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 3
    struck_seeds: [7, 8, 11]
    reasons: '【创新度 4】输入是隔夜跳空 day_first(Open)/ts_delay(day_last(Close), 1),机制是开盘情绪溢价的回吐,两样都不同于库里所有 head(那些 head 用的是后复权价格水平、流通股本、成交量的日内质心)。相关度表:留下的种子与 head 的原始 |ρ| 不超过 0.12,残差不超过 0.11;与 rev 0.03–0.23,与 vol 0.05–0.23,都远低于门槛。文献里已经有(Berkman 2012、Aboody 2018、Lou-Polk-Skouras 2019),所以不给 5。【合理度 3】ON 的写法是对的:价格后复权,alphacube/tradability.py 注明后复权价之比跨除权日连续,送转、分红不会造出假跳空;停牌后复牌那天 ts_delay 取到 NaN,ts_mean 用 nanmean 跳过。10–40 日窗口适合看情绪回吐;对 20 日反转控制取残差后,剩下的大致是「隔夜减盘中」,也就是 LPS 的拉锯量。不给 4,原因有两条。(1) 证据都来自美股,而且 LPS 显示隔夜收益本身有持续性:过去隔夜收益高,对之后收盘到收盘的总收益是什么符号并不确定。A 股 T+1 下的方向,计划里既没有 A 股文献,也没有 train 上的证据。(2) 封板开盘(一字板,±5/10/20%)的隔夜收益比普通日大一个数量级,20 日均值里只要一次一字跌停,就能把这只票推到多头端,等于在接飞刀。seed 9/12 再乘上开盘第一根成交量除以日均分钟量,封板日这个比值也偏大,放大得更厉害。GP 跑的时候要盯住这一点;ts_med(seed 4)、均值除以标准差(seed 6)、cs_winsor 这类写法更稳。seed 10 的 50 日项方向与主假设相反(它奖励长期高开的票),按「相对自身基线的异常」理解,保留。【划掉】seed 7(distinct 0.011)和 seed 11(distinct 0.037)在相关度表里是废品。seed 8 是隔夜收益正部分的均值 E[max(ON, 0)],这个半矩大致和隔夜波动成正比,与 vol 控制的 |ρ| 是 0.39,本位其他种子只有 0.05–0.23;它的多头端就是隔夜波动最小的票,等于低波动异象从一个没被控制的波动量漏回来,和 §4 陷阱 1、3 是同一类。划完剩 9 个。'
    revise: '—'
R:
  - head: 'sub(cs_first_low20(abs_(day_wstd(Vwap, High)), ts_decay_linear(pow_3(day_mean(Open)), 20)), ts_var(day_gini(High), 10))'
    soundness: 3
    reasons: '变体 1 就是定位输出自己列出的 R 候选:跳掉 ts_decay_linear 后 +0.76 变成 +0.88,train(+0.75→+0.88)和 valid(+2.63→+2.81)都升;窗口从 40、20、10 到不平滑依次是 +0.70、+0.75、+0.80、+0.88,单调。机制也说得通:用当前价格划「最便宜 20%」,比用 20 日加权的旧价格更及时。其余部件的判断与源码一致:day_wstd 是开方,恒非负,abs_ 是恒等,必要性 +0.00;_lexi 只用 x 的整块秩,pow_3 对正价格单调,所以去掉它不改变结果;尾巴约 1e-7,而输出相邻秩的间隔约 1/N≈2.5e-4,改变不了排序。不给 4:同一个 knockout 在 head +0.78 上只有 +0.02,在 head +0.65 上是 -0.06(去掉反而更差),所以「20 日平滑有害」并不普遍;两个 ρ≈0.96 的策略在 4 年 train 上的夏普差,标准误大约 0.1–0.14,+0.12 只有一个标准误左右。另外,变体 2、3 和变体 1 的排序完全相同(只差恒等的 abs_、单调的 pow_3 和量级 1e-7 的尾巴),白占两次评估。'
  - head: 'sub(cs_first_low20(sub(cross_ema(LogFloatShares, 241), ts_var(day_gini(High), 10)), ts_decay_linear(pow_3(day_mean(Open)), 20)), ts_var(day_gini(High), 10))'
    soundness: 2
    reasons: '要去掉的部件是装饰,不是烂部件,依据就在拆解表里:尾巴的必要性 -0.00;跳掉 ts_decay_linear 只有 +0.78→+0.80(+0.02);cross_ema 窗口 120/241/482 对应 +0.77/+0.78/+0.78,没有敏感性,去掉它大概率也一样。三个变体预期都在 +0.78–0.80,离替换线 +0.88 很远;而它们与原 head 的 |ρ| 是 0.97–0.99,也走不了收录那条路。所以按 R 的规则,这组注定什么都改变不了。「部件确实是装饰」这个判断没错,但去掉装饰实现不了 R 要的那 +0.1。'
  - head: 'sub(sub(sub(sub(ts_mean(abs_(neg(pow_1_5(cs_last_low10(day_wmean(Ret, Volume), ts_reg_tvalue(day_quantile(Volume), day_mean(Ret), 10))))), 30), ts_var(day_gini(High), 10)), ts_var(day_gini(High), 10)), day_centroid(sqrt(Volume))), day_centroid(sqrt(Volume)))'
    soundness: 2
    reasons: '读源码得到的几点是对的:abs_ 里的 neg 是恒等;尾巴约 1e-7;pow_ 在 e>1 时直接用 torch.pow(alphacube/operators/common.py),cs_last_low10 压到底部的那些 rank(y)-1 是负数,经过 pow_1_5 就成了 NaN,ts_mean 是 nanmean,会跳过这些天。但核心论断「A 项只是被部分遮掉的噪声,主项是 -2 × day_centroid」和相关度表对不上。只留质心的变体与 head 的原始 |ρ| 是 0.68,把 A、C 当作独立来估算,A - 2C 与 C 相关 0.68,意味着 A 占 head 方差的大约 54%(这和变体 4 的 0.96 也吻合)。更关键的是残差 |ρ|:变体 1–3 只有 0.24 左右。也就是说,扣掉 5 个控制、按 head 20 日半衰期交易之后,head 实际交易的主要是 A,不是质心。A 也不是噪声:它是 30 日内量加权分钟收益之秩的均值,很持续,与 vol、rev 的相关是 0.42、0.39(变体 4 的控制列)。这个 head 没被拆解过,手上没有任何「A 是烂的」证据。变体 4 还把 A 与 C 的权重从 1:2 悄悄改成了 1:1,这是没测过的重新加权,不是去掉烂部件。变体 1–3 实际上是在测一个新的单独信号(开盘段成交质心),应该放到 N 位,或者先把这个 head 拆解一遍。'
  - head: 'sub(sub(cross_ema(cross_ema(LogFloatShares, 241), 241), cs_first_low20(sub(cross_ema(cross_ema(LogFloatShares, 241), 241), ts_var(day_gini(High), 5)), ts_decay_linear(pow_3(day_mean(Open)), 20))), cs_first_low20(sub(cross_ema(cross_ema(LogFloatShares, 241), 241), ts_var(day_gini(High), 5)), ts_decay_linear(pow_3(day_mean(Open)), 20)))'
    soundness: 2
    reasons: '去掉的三样都是惰性部件,不是烂部件。尾巴的必要性 -0.00(+0.92 对 +0.91);外层 cross_ema 窗口改成 120、482 得到 +0.92、+0.93,对平滑不敏感;价格的 20 日衰减在这个 head 上没测过,在另外三个 head 上分别是 +0.12、+0.02、-0.06,不能挪过来当证据。所以变体预期在 +0.91–0.93 左右,到不了替换线 +1.01。另外,变体与 size 的 |ρ| 是 0.69:它是 LogFloatShares 减去两倍「带便宜位移的 LogFloatShares 之秩」,属于 §4 陷阱 3 点名的市值字段的非线性函数。这次清理一点没碰到这个问题。'
summary: 'a 位(彩票筛 × 后复权价格核心)两项各 3 分,通过:排除算子核对无误,但核心是后复权价,不是名义价格,分钟偏度在便宜段又被价位跳动主导;b 位(隔夜情绪回吐)创新度 4、合理度 3,划掉两个废品和一个波动换写,剩 9 个,通过;R 只有 R1(去掉价格的 20 日平滑,本 head 自己有 train 与 valid 证据)通过,R2、R4 去掉的是惰性装饰,到不了 +0.1;R3「A 项是噪声」与相关度表的残差矛盾。'
