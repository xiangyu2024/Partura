  - head: 'sub(cs_first_low20(abs_(day_wstd(Vwap, High)), pow_3(day_mean(Open))), ts_var(day_gini(High), 10))'
    soundness: 2
    reasons: '【这次改了什么】PI 按我第 1 次审计的意见改了内容,不只是换说法。只交 1 个变体,池变量不动,规模叶子之差不再出现。y 换成 div(day_wstd(Vwap, High), day_mean(Vwap)):ops_ext.day_wstd = sqrt(Σ|High|(Vwap − m)² / Σ|High|),day_mean 是 nanmean,Vwap > 0,所以这个比值确实是尺度无关的日内变异系数。PI 还事先写了判据。相关度表:与原 head 0.817,走替换,解决了上次第 (2) 条「借门槛收录」的问题;known 0.062;vol 0.278,低于 PI 自己定的 0.45。 【但 R 要回答的「换掉的部件是不是烂的」仍然没有依据,而且定位输出指向反面】(1)「y 主要读的是价格」(y 单独 -1.06 / -0.39,P 单独 -1.16 / -0.45)只说明 y 里有价格,不说明价格这一半有害。(2)「价格因子把多头书推向池子较贵的一端,与池子对着干」,与同一张拆解表矛盾。pow_3(day_mean(Open)) 的 sufficiency 自己选的是 sign -1,多头书就是中性化后最便宜的那个十分位,score -1.16、valid -0.45,本身是一本很差的多头书。原 head(sign +1)的多头书是池子里 y 较高的一半;价格因子恰好是把多头书挡在最便宜 10% 之外的那部分。拿掉它,相当一部分多头书会回到那个 -1.16 的十分位。「便宜好」只在 20% 这一整块上成立,块内并不是越便宜越好。(3) 变体在库里最像的不是自己的 head,而是 head +0.65:原始 0.858,残差 0.876,都高于与原 head 的 0.817 / 0.739。+0.65 做的也是在便宜池里按尺度无关的日内量排序。PI 自己引的反证也指向价格因子在出力:同一个平滑价格池下,尺度无关的 +0.65 比带价格单位的原版 +0.76 低 0.11。(4) PI 预计 +0.75 ~ +0.95,中心不高于原 head 的 +0.88。提出者自己不预期有增益,这是诊断实验,不是去烂部件,上次第 (1) 条的问题还在。即使过线:按 PI 用的同一个公式,ρ≈0.82 的两本书在 4 年 train 上夏普差的标准误约 sqrt(2×0.18/4) ≈ 0.3(PI 写的 0.10–0.14 对应的是 ρ≈0.96),+0.1 只有约 0.3 个标准误,过线基本是噪声。而过线的结果,是用一个与 head +0.65 相关 0.86 的东西替换 +0.88,库会变窄。(5) 次要的一点:分钟 Vwap 水平的日内变异系数主要读当日振幅和开盘到收盘的位移,是波动的代理。变体让它成为池内唯一的排序量,多头书就是最便宜 20% 里日内波动最大的一半,正是第 1 轮 a 位假设(Kumar 彩票股)说要避开的那一类。0.278 的 vol |ρ| 主要由池子的 +1 位移决定,量不到池内这一部分(陷阱 3 说的交互 / 非线性残留)。 【更正我自己】第 1 次审计里我把「先换成尺度无关的 y」写成了过关的第一步,这里更正:它可以当诊断,但 R 需要「部件是烂的」的依据。 【怎么改才能过】建议撤掉 R4,省下这次评估。如果坚持交,要给出价格因子有害的样本内依据(例如定位拆解里能说明池内最便宜的一半不比 10%–20% 那一半差的读数),方向论证不够。如果想检验「池内用尺度无关的量排序」本身,放到第 3 轮的 GP 位去做,以 head +0.65 为参照,不要走 R。'
summary: 'a(E,K 的外围)和 b(N,尾盘压力回吐)这一稿没改,维持 3/3 和 4/3,我划掉 a 的 1、2 和 b 的 8;R1–R3 维持 3;R4 按上次意见只把 y 换成尺度无关的量,内容确实改了,但「价格因子是烂部件」没有依据,拆解表(多头买最便宜十分位是 -1.16)和 head +0.65(ρ 0.86)都说明它在出力,给 2。'
