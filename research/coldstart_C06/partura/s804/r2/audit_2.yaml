    reasons: '【与上一稿比】本位在第 1 次审计已经通过,这一稿没有改(13 个种子逐字相同,相关度的数一致),维持原判。 【逐个核对算子】收盘偏离 log(div(day_last(Close), day_wmean(Vwap, Amt))):day_wmean = Σ Vwap·|Amt| / Σ|Amt|,复权因子在同一天内约掉,尺度无关。day_last(in_delay(Close, 30)) 在 241 根的网格上取第 210 根(14:30);in_index > 0.875 是第 211–240 根,即 14:31–15:00,这个常数由交易时段定,不是调参。都实现了假设里说的量。 【与库比】种子 1–9 与 14 个 head 的原始 |ρ| ≤ 0.13、残差 ≤ 0.07;成交时点种子 10–13 与 head +0.58 是 0.25–0.35。 【控制】CV 均值类种子(1、4、5、9)与 rev 0.40–0.46,< 0.5。它是日收益里的一个时段分量,不是控制的非线性重写。表格划掉 11(known 0.511)。 【我划掉 8】neg(ts_med(尾盘 30 分钟收益, 20)) 的 distinct 只有 0.578:约四成票并列在 0,读到的是价位粗、尾盘不动,不是收盘压力;并列块中性化以后,排序的只剩控制拟合值。均值版 7(distinct 0.999)保留。12 当对照保留(head +0.58 主项的 20 日均值,0.34);10 的 liq 0.46 / known 0.46 贴着门槛,保留。剩 11 个。 【创新度 4】输入和机制都不在库里,主体种子与所有 head 的 |ρ| < 0.13。不给 5:(vwap − close) 这类写法和收盘操纵的文献都早已有。 【合理度 3,不是 4】文献记录的主要是次日 / 隔夜的回吐,多周的截面可预测性是从 Coval-Stafford 类推来的,没有 train 证据。CV 还混着当天下午的趋势。上一轮同样是「日收益的一个时段分量取负再累计」的 N 位(隔夜跳空),种子没有一个入库,这类信号被 rev 控制吃掉的风险不小。'
