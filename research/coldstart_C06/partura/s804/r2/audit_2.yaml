    reasons: '【与上一稿比】本位在第 1 次审计已经通过,这一稿没有改:12 个种子与上次逐字相同,corr_2 的数与 corr_1 一致。核心 K = cross_stddev(day_skew(Ret), 60) 与控制的 |ρ| 最大是 size 0.41(liq 0.10 / vol 0.18 / rev 0.01 / known 0.06),< 0.5,满足 E 位的核心条件;12 个种子都原样含 K。表格划掉 3(与 K 0.96)、5(0.706)、9(0.85)、11(0.94)、12(0.95)。重新核对后维持原判。 【我划掉 1、2】div(K, cross_mean / cross_med(abs_(day_skew(Ret)), 60)) 没有实现 VOV。day_skew 本身已经标准化(common._skew 先除以当日 std),而且会变号;正态近似下 E|s| = σ·g(μ/σ),所以比值 σ / E|s| 只是 60 日偏度均值的 t 值的函数,把 K 自己的 σ 约掉了(与 K 只有 0.41)。abs_ 又把常年右偏和常年左偏折到同一端。Baltussen 等除以均值,是针对恒正的尺度量;这条理由对标准化过的偏度不成立。种子 8 把同一个比值当池子用(比值低 = 偏度符号稳定),池内按 neg(ts_mean(day_skew(Ret), 20)) 排,方向一致,保留。 【留下的 4、6、7、8、10】按 ops_ext._lexi 核对了 cs_first_low20 / cs_last_high20:按 x 的整块并列切带,带内 rank(y) 加 1 或减 1。实现的确实是「K 当门槛,池内按低已实现偏度 / 按自身波动标准化的 MAX 排」。窗口 10/20/60 与 K 的窗口证据一致(10/30/60 依次 +0.03/+0.12/+0.67)。与 K 的 |ρ| 0.48–0.65,与其它 head 最高 0.36;控制最大 size 0.29、vol 0.24、rev 0.20。没有凸变换,没有截面常数进 cs_*,也没有规模 / 波动 / 流动性的非线性函数。剩 5 个,够 4 个的下限。 【创新度 3】输入还是偏度这一类,机制是测量质量门槛加池内 Amaya 低偏度 / BCW 标准化 MAX,与裸 K 不同,也说得出为什么。留下的种子与 K 都 > 0.3,所以到不了 4。 【合理度 3,不是 4】门槛的前提是「K 低 = 偏度读数可信」,而价位离散的混淆方向正好相反;能区分两者的 11、12 被表格划掉了。文献支持只是类比(VOV 原文讲的是隐含波动的波动),也没有 train 上的证据。'
    revise: '—'
