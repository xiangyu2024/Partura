  hypothesis: 【现象】M 第 1 批的 head +0.58(sign +1,hl 20)里有两个相同的主项 -day_centroid(sqrt(Volume)),合起来是
    -2 倍成交量质心:多头书买成交集中在早段的票、避开成交压在尾盘的票;共性表里 day_centroid(sqrt(Volume)) 均值差 +0.93(p
    0.007)。这是快照里唯一与价格轴、偏度都无关的读数,但从没被单独测过,也没人说清楚为什么尾盘成交多是坏事。 【机制】尾盘(最后 30 分钟 + 收盘集合竞价)是非信息性价格压力最集中的时段。(a)
    资金流:Bogousslavsky & Muravyev 显示收盘竞价成交主要来自 ETF / 被动基金与机构调仓,对价格发现几乎没有贡献,收盘价相对中间价的偏离随后回吐;Coval
    & Stafford(2007)显示资金流驱动的被迫买卖造成持续数周到数月的价格压力,随后反转,给逆向提供流动性的一方赚钱。(b) 做收盘价与粉饰:Carhart
    等(2002)记录基金在季末尾盘抬价、随后回落;Hillion & Suominen(2004)、Comerton-Forde & Putniņš(2011)记录操纵者在尾盘集中成交、把收盘价推离当日成交均价,随后回吐。A
    股散户占比高,尾盘拉升 / 打压是常见手法,两个交易所都已用收盘集合竞价(深市 2006 年起,沪市 2018-08 起)。所以:一只票在过去 10–60
    天里反复收在当日成交均价之上、最后 30 分钟反复上涨、成交反复压在尾盘,说明它的价格被非信息性的尾盘需求持续抬高 → 随后跑输;反过来,反复在尾盘被压到均价下方的票是被资金流卖压压低的
    → 随后修复。纯多头书买后者(种子取负号)。 【为什么只用累计值】单日的收盘偏离大半在次日开盘前就回吐了(Bogousslavsky-Muravyev),而奖励的标签从次日
    09:31–09:45 的 VWAP 起算,单日值的回吐吃不到。种子全部用 10–60 日的累计 / 中位数,对应 Coval-Stafford 那种持续数周的资金流压力,回吐期落在持有期内。
    【算子怎么实现】收盘偏离 CV = log(div(day_last(Close), day_wmean(Vwap, Amt))):当日最后一分钟收盘价除以当日成交额加权的分钟均价(即当日
    VWAP);后复权因子在同一天内约掉,所以是尺度无关的。尾盘收益 = log(div(day_last(Close), day_last(in_delay(Close,
    30)))):收盘价除以 30 分钟前的价格,即 14:30 → 15:00。尾盘成交占比 = div(day_sum(mul(Amt, is_gt(in_index(Amt),
    0.875))), day_sum(Amt)):in_index 是分钟序号 / 240(第 0 根是 09:30 集合竞价),> 0.875 恰好是第 211–240
    根,即 14:31–15:00(含收盘竞价),这个常数由交易时段定出,不是调参。成交质心 day_centroid(Amt) 与 head 原样的 day_centroid(sqrt(Volume))(0
    = 全在开盘,1 = 全在收盘)。组合与稳健化:CV 乘尾盘成交占比(Comerton-Forde-Putniņš 的操纵指数同时看尾盘价格变动和尾盘成交集中);ts_med
    与「均值 / 标准差」版本限制单个涨跌停收盘的影响;CV 除以当日分钟收益标准差 day_std(Ret),把偏离换成「几个分钟波动」,去掉 |CV| 天然随波动放大、在多头十分位里堆高波动票的
    U 形暴露;质心的「近 5 日减 50 日基线」是相对自身历史的异常尾盘活跃(操纵指数用的也是相对自身历史的异常量)。 【和库里已有的不同】输入是日内时点(尾盘)上的价格偏离与成交分布,机制是资金流
    / 操纵压力的回吐。库里没有一个 head 用到收盘偏离或尾盘收益;只有 head +0.58 含成交质心,所以 4 个成交时点种子(尾盘成交占比、两个质心、质心相对自身基线的异常)是对这一现象的直接检验,其余
    9 个种子是带符号的价格偏离,预期与所有 head 的 |ρ| < 0.3。20 日反转控制是收盘到收盘的总收益,尾盘 30 分钟只占日收益方差的一小部分,所以
    CV 的累计与反转控制只部分相关;CV 是有符号的均值,不是波动或成交额的凸函数;不含市值、成交额水平、价格水平,不碰陷阱 1–3。 【为什么样本外还会在】它依赖的是制度和参与者结构:收盘集合竞价规则
    2018-08 以后两市一致,2023-08 之后没有改;被动基金 / ETF 的收盘调仓只会越来越多;A 股散户主导下的尾盘操纵是监管长期打击但持续存在的行为。资金流压力的回吐在美股有
    1980–2004 的长样本记录(Coval-Stafford),不依赖本种子 head 可能吃到的那段小盘 / 低价行情。
