  hypothesis: '【核心是什么、为什么是 alpha】核心 K = cross_stddev(day_skew(Ret), 60) 就是 head +0.67
    本身(第 1 轮 b 位里 GP 自己的随机树找到的;sign -1,hl 0):每天用当日约 240 个 1 分钟收益算一个偏度,再取过去 60 个交易日这个偏度的标准差;多头书买「日内收益分布形状在
    60 天里最稳定」的票。它是库里 14 个 head 中唯一不含后复权价 / 流通股本那根轴的,也是唯一 valid 与 train 接近的(+0.91 /
    +0.67,比值 1.36;其余 head 是 1.8–4 倍),并且从来没有被拆解过。旁证:兄弟表达式 cross_tail_mean_q75(day_skew(Ret),
    60) = +0.59;同一写法窗口 10 / 30 / 60 依次是 +0.03 / +0.12 / +0.67,所以被定价的是一个慢变量(持久的个股特征),不是短期的形状噪声。机制上它对应
    Baltussen, van Bekkum & van der Grient(2018)的「风险本身的不确定性」:他们把隐含波动率 20 日标准差除以同窗口均值(VOV),VOV
    高的股票随后每年跑输约 6–8%,与 20 多个已知预测变量正交,美、欧都在;K 是把同一个想法搬到分布形状上 —— 形状越不稳定,投资者越说不清这只票的风险,定价越容易偏高,随后收益低。
    【已见过的外围】含 K 的候选只有裸核心 K 本身,没有任何外围出现过。 【K 里混着的两样东西,本位外围要做的事】K 不只是「形状的时变」,还混着偏度估计量本身的抽样噪声:(i)
    分钟收益尾部越厚,单日样本偏度越不稳(一个跳点分钟就能把当日偏度推到 5 以上);(ii) 价格离散:第 1 轮审计指出几元的票分钟收益基本只有 0 与 ±1
    跳,三点分布的偏度读到的是上跳数减下跳数,在零附近小幅抖动,反而显得「稳定」。所以 K 低可能是「形状真稳定」,也可能只是「最小价位相对价格很粗」。外围分四类,每一类都有一个可证伪的预测:
    (1) 尺度归一,即 VOV 原式:div(K, cross_mean(abs_(day_skew(Ret)), 60)) 与 cross_med 版。Baltussen
    等原文除以同窗口均值的理由是「绝对变化随水平放大,不除就只是水平的代理」;偏度会变号,所以用 |偏度| 的 60 日均值 / 中位数当水平。这把「形状时变」与「偏度长期就大(价位粗、常年右偏)」分开。
    (2) 抽样噪声归一:div(K, sqrt(cross_mean(add(day_kurt(Ret), 3), 60))),day_kurt 是超额峰度,加
    3 后是原始峰度(≥1,恒正,开方无问题)。样本偏度的抽样方差随尾部变厚而上升,用同窗口平均峰度的平方根做分母,剩下的是超出尾部厚度能解释的那部分形状变化。若
    head 读的只是「分钟收益里没有跳点」,这一支会明显掉分 —— 这本身就是对 head 的一次拆解。 (3) 用 K 当测量质量门槛,在门槛内按 Amaya
    方向排序:cs_first_low20(neg(ts_mean(day_skew(Ret), 20)), K) 等。cs_first_low20(y, x)
    把 x 最低 20%(整块)顶到最上面、块内按 y 排。Amaya 等(2015)显示低已实现偏度 → 随后高收益(周度多空 t≈8.9),但他们刻意用 5
    分钟收益、剔除价格低于 5 美元的票,就是为了不让微观结构噪声污染偏度;我们的 1 分钟 day_skew 没法换频率,K 低 =「这只票的日偏度在 60
    天里前后一致、读数可信」,是同一个样本筛选的直接实现。池子方向与 K 本身的方向一致(K 低本来就好),期望 sign +1:多头书 = 稳定池里近 20
    / 60 日偏度最低的那一半。另有 cs_last_high20 版(只把最不稳定的 20% 压到底,其余按低偏度排)、VOV 当门槛的版本、秩乘积版,以及在稳定池里避开
    Bali-Cakici-Whitelaw(2011)彩票股的版本(日收益 20 日 MAX 先减均值再除以 20 日标准差,尺度无关,不是波动的单调重写)。
    (4) 价位 / 离散度对照:cs_bucket_rank(neg(K), sub(LogFloatCap, LogFloatShares)) 在名义价(两个日频叶子之差
    = 名义股价的对数)十分位内排 K;cs_bucket_rank(neg(K), cross_mean(day_zero_ratio(Ret), 60))
    在「零收益分钟占比」(价格离散 / 冻结程度)十分位内排 K。分桶只会把这两样东西去掉,不会利用它们。若 K 只是最小价位的粗细(r1 审计对 day_es_ratio_hi
    的同类批评),这两支会掉分;若不掉,说明读到的是形状稳定性本身。这两支与 K 的秩相关可能 ≥ 0.7 而被表格划掉,我接受,它们留不留不影响本位的种子数下限。
    【和库里已有的不同】库里 10 个 head 是后复权价的尾部区块,2 个是陷阱(+0.64 / +0.60),+0.58 是成交质心加一个 cs_last_low10
    项。本位种子都不含价格水平、流通股本、市值或成交额水平(名义价与零收益占比只出现在对照种子里当分桶变量);没有 signedpower / pow_ 一类凸变换(只有除法、作用在恒正峰度均值上的平方根、秩);没有截面常数进入
    cs_*。cs_first_low20 这种「池子 + 池内排序」的写法库里出现过,但这里池子由形状稳定性决定,池内排序量是已实现偏度或标准化 MAX,与价格轴无关。不碰规则
    §4 的陷阱 1–3。 【为什么样本外还会在】(a) K 是 60 日慢变量,窗口证据说明被定价的是持久特征,换手低,15bp 成本吃得少;(b) head
    的 valid/train 比是全库最低的,不依赖 2022–23 那段小盘 / 低价风格;(c) VOV 效应有跨市场、跨年代的记录,机制是对风险不确定性的定价,不依赖
    A 股某项制度;(d) 归一与门槛两类外围只去掉测量噪声,不引入新的风格暴露,所以即便 K 的溢价在样本外变弱,剩下的部分也更干净。'
