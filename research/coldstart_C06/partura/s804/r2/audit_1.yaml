    reasons: '【算子逐个核对】收盘偏离 log(div(day_last(Close), day_wmean(Vwap, Amt))):day_last 取当日最后一根有效分钟(15:00,含收盘竞价),day_wmean 是 Σ Vwap·|Amt| / Σ|Amt|,两者都要求有限,label.py 提到的 5.5% 有量无 Vwap 的分钟被同一个掩码去掉;Close 与 Vwap 同为后复权,比值尺度无关。尾盘收益:in_delay 只在分钟轴内平移(dt_in.py:266),day_last(in_delay(Close, 30)) 就是 14:30 的价。尾盘成交占比:in_index = t / (T − 1),241 根网格下 > 0.875 恰好是第 211–240 根 = 14:31–15:00,常数由时段定,不是调参。都实现了假设里说的量。 【与库比】种子 1–9 与 14 个 head 的原始 |ρ| ≤ 0.13、残差 ≤ 0.07,库里没有任何 head 用到收盘偏离或尾盘收益;成交时点种子 10–13 与 head +0.58 是 0.25–0.35(它本身含 day_centroid(sqrt(Volume)))。 【控制】CV 均值类(1、4、5、9)与 rev 0.40–0.46,低于 0.5;这是日收益的一个时段分量,不是控制的非线性重写,中性化后剩下的是「VWAP 到收盘这一段相对 20 日总收益」的部分,不落陷阱 3。 【我划掉 8】neg(ts_med(尾盘 30 分钟 log 收益, 20)) 的 distinct 只有 0.578:约四成票并列,几乎都在 0 —— 低价粗价位或尾盘不动的票,20 天里过半天数尾盘收益正好是 0,中位数就是 0。这个种子读到的是「尾盘价格常常不动」= 价位粗 / 冷清,不是收盘压力;并列块在线性中性化后只剩控制拟合值的负数在排序,等于在这一块里押控制的线性组合。均值版种子 7 的 distinct 0.999,留 7 就够了。 【表格会划 11】neg(ts_mean(day_centroid(Amt), 20)) 与已知族 0.511、liq 0.483、vol 0.421;成交额的日内分布形状本来就是已知族 cross_mean(day_std(Amt), 30) 那一类,我同意划掉。12 保留但只当对照:它就是 head +0.58 的主项加 20 日均值(|ρ| 0.34),vol 0.415 / known 0.358;10 的 liq 0.461、known 0.457、size 0.368 都贴着门槛,保留。 【创新度 4】输入(日内时点上的价格偏离与成交分布)和机制(收盘 / 尾盘非信息性压力的回吐)都不在库里,主体种子与所有 head 的 |ρ| < 0.13;不是 5,因为 (vwap − close) 这类写法在公开的量价因子里出现过,收盘操纵文献也有。 【合理度 3,不是 4】机制清楚,算子实现了,10–60 日窗口与「单日回吐在 t+1 开盘前就完成、标签从 t+1 09:31–09:45 VWAP 起算吃不到(label.py 文件头),所以只用累计值」的论证一致。到不了 4:所引文献(Hillion-Suominen、Carhart 等、Bogousslavsky-Muravyev)记录的主要是次日 / 隔夜回吐,多周的截面可预测性是从 Coval-Stafford 资金流压力类推来的,计划没给 train 证据;CV 也混着当天下午的趋势,不只是收盘竞价那一下,种子 7、9 更贴题。还要当真的一个风险:上一轮同样是「日收益的一个时段分量取负再累计」的 N 位(隔夜跳空),定稿 9 个种子,入库的 head 却全来自 GP 自己的随机树(cross_stddev(day_skew(Ret), 60) 等),这类信号在 rev 控制下被吃掉的可能不小。'
