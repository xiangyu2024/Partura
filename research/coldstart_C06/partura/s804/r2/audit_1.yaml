    soundness: 2
    reasons: '「后复权价 = 名义价 × 累计复权因子,拆开看哪一半是拖累」这个想法说得通,但两个变体没有实现这个拆分。y = abs_(day_wstd(Vwap, High)) 是以后复权价为单位的日内标准差(ops_ext.day_wstd:sqrt(Σ|w|(x − m)² / Σ|w|),x = Vwap),约等于后复权价 × 日内相对离散度。变体 1 把池子换成名义价最低 20% 以后,池内各票的后复权价随复权因子相差 2.5–113 倍(label.py 72–77 行),池内排序读的主要是复权因子 —— 要拿掉的那一半只是从池子挪进了排序;变体 2 反过来,池子是复权因子,池内排序约等于名义价 × 离散度。两个变体都没把一半单独拎出来,「其中一半单独 ≥ +0.98 就说明另一半是拖累」的推断不成立。另外:(1) 没有任何证据说原部件里有烂的一半,拆解表里整段区块变量的必要性是 +1.93,PI 自己也把它当诊断实验;(2) 两个变体与原 head 的 |ρ| 都 < 0.27(原 head 不在相关度前三),实际走的是「收录」,是两个新因子借 +0.98 的门槛进库,不是去烂部件;(3) 变体 1 的池变量 sub(LogFloatCap, LogFloatShares) 是两个规模叶子之差再取指示函数,正是陷阱 3 点名的写法,size |ρ| 0.28 不高,但只有在 y 尺度无关之后才看得出名义价是不是独立的东西。要过:先把 y 换成尺度无关的 div(day_wstd(Vwap, High), day_mean(Vwap)),单独确认这一步不掉分,再在那个版本上换池变量。'
summary: 'a(E,K 外围)3/3 通过,划掉没有实现 VOV 的 1、2,表格另划 5 个,剩 5 个;b(N,收盘 / 尾盘压力回吐)4/3 通过,划掉读价位粗细的 8,表格另划 11;R1–R3 去掉区块变量上的 ts_mean 给 3,R4 拆复权因子给 2:y 仍以后复权价为单位,拆分没有实现。'
