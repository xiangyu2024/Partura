    struck_seeds: [1, 2]
    reasons: '【门槛】核心 K = cross_stddev(day_skew(Ret), 60) 与 5 个控制的 |ρ| 最大是 size 0.41(liq 0.10 / vol 0.18 / rev 0.01 / known 0.06),< 0.5,E 位核心条件满足;K 是快照里的 head +0.67,含 K 的已见外围只有裸 K。12 个种子都原样含 K。 【表格自动划掉】3(与 K 0.96)、5(0.71)、9(0.85)、11(0.94)、12(0.95)。也就是说外围 (2) 峰度归一、(4) 名义价 / 零收益占比分桶两类全部塌回 K:除以 sqrt(平均原始峰度) 后秩几乎不变,说明 K 的截面差异不是尾部厚度带来的抽样噪声;而计划里唯一能检验「K 低 = 最小价位粗」这个混淆的种子 11、12 进不了 GP,本位内这条预测已无法证伪。 【我划掉 1、2】div(K, cross_mean / cross_med(abs_(day_skew(Ret)), 60)) 没有实现 VOV。day_skew 已是标准化量(common._skew 先除以当日 std 再取三次方均值),而且会变号;把一只票 60 天的日偏度序列整体乘一个常数,这个比值不变 —— σ 被精确约掉,比值只是 |60 日均偏度| / 偏度标准差 的单调函数(偏度均值 t 值的倒数)。均偏度在 0 附近的票,无论形状多不稳定,比值都约等于 1.25(正态下 σ / E|σZ| = √(π/2)),恰好抹掉 K 自己的信息;abs_ 又把常年右偏(Amaya:随后差)和常年左偏(Amaya:随后好)折进同一尾。Baltussen 等除以同窗口均值,针对的是恒正的尺度量(隐含波动),「绝对变化随水平放大」这条理由对标准化过的偏度不成立。种子 8 保留:同一个比值在那里当池子,低比值 = 偏度符号稳定可信,池内再按 neg(ts_mean(day_skew(Ret), 20)) 排,长端 = 偏度持续为负的票,方向一致,反而比「K 低」更贴近「读数可信」的本意。 【剩下的 4、6、7、8、10】cs_first_low20 / cs_last_high20 的实现核对过(ops_ext._lexi:按 x 的整块 tie 取最低 / 最高 20% 的带,带内 rank(y) 加减 1,输出无并列),确实是「K 当门槛、池内按低偏度 / 自身波动标准化的 MAX 排」;10 的 MAX = (ts_max − ts_mean) / ts_std,对日收益是尺度无关的尾部形状,不是波动的单调重写。窗口 10/20/60 与 K 的窗口证据(10/30/60 → +0.03/+0.12/+0.67)一致。与 K 的 |ρ| 0.48–0.65,与其它 head 最高 0.35(head +1.56 一族,含 ts_mean(day_skew(Ret), 20) 的那几个),残差 ≤ 0.56;控制最大 size 0.29、vol 0.24、rev 0.20。没有凸变换、没有截面常数进 cs_*、没有规模 / 波动 / 流动性的非线性函数,不碰 §4 陷阱 1–3。 【创新度 3】外围用的仍是偏度这一类输入(与 K 相同,也与 Cr1a 各 head 里的 ts_mean(day_skew(Ret), 20) 相同),机制是「测量质量门槛 + 池内 Amaya 低偏度 / BCW 标准化 MAX」,与裸 K 不同,也说得出为什么;到不了 4,幸存种子与 K 的 |ρ| 0.48–0.65 都 > 0.3。 【合理度 3,不是 4】门槛的前提「K 低 = 偏度读数可信」与 PI 自己提出的价位离散混淆方向相反(几元的票分钟收益近似三点分布,K 也低,恰好是 Amaya 用 5 分钟收益、剔除低价股要躲开的那类),能区分两者的 11、12 被表格划掉;文献支持是类比(VOV 原文是期权隐含波动的波动),计划里没有 train 上的证据。'
    revise: '—'
