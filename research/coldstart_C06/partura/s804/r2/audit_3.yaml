    reasons: '【与上一稿比】这一稿只删了 R4。a 位 12 个种子与上稿逐字相同:我把 corr_2.request.json 与 corr_3.request.json 逐项比了一遍,唯一的差别是 R4 那一行;corr_3 的数也与 corr_2 一致。重新逐项核对后维持原判。 【门槛】核心 K = cross_stddev(day_skew(Ret), 60)(dt_cross.cross_stddev:沿日轴滚动 60 天取 nanstd),与控制的 |ρ| 最大是 size 0.406(liq 0.10 / vol 0.18 / rev 0.01 / known 0.057),< 0.5;12 个种子都原样含 K。表格划掉 3(0.958)、5(0.706)、9(0.85)、11(0.945)、12(0.953)。 【我划掉 1、2】理由不变。common._skew 先除以当日标准差,day_skew 本来就是标准化过、会变号的量。div(K, cross_mean / cross_med(abs_(day_skew(Ret)), 60)) 在整列偏度乘一个常数时不变,σ 被约掉,比值只是 60 日偏度均值的 t 值倒数的单调函数,不是 VOV;abs_ 又把常年右偏(Amaya:随后差)和常年左偏(随后好)折到同一端。它们与 K 只有 0.405 / 0.41,恰好说明丢了 K 自己的信息。 【留下的 4、6、7、8、10】ops_ext._lexi 按 x 的整块并列切带,带内 _pct_rank(y) 加 1 或减 1,输出没有并列。实现的就是「K 当门槛,池内按 20 / 10 日低已实现偏度或按自身波动标准化的 MAX 排」;8 的池子是「偏度符号稳定」,池内排序方向一致。这几个与 K 是 0.479–0.646,与其它 head 最高 0.352(Cr1a 里含 ts_mean(day_skew(Ret), 20) 的那一族),残差 ≤ 0.556;控制最大 size 0.293、vol 0.236、rev 0.204。没有凸变换,没有截面常数进 cs_*,也没有规模 / 波动 / 流动性的非线性函数,不碰 §4。剩 5 个,够 4 个的下限。 【创新度 3】输入仍是偏度这一类(与 K 同类,也与 Cr1a 的偏度筛子同类),机制是「测量质量门槛 + 池内 Amaya 低偏度 / BCW 标准化 MAX」,与裸 K 不同,也说得出为什么。幸存种子与 K 都 > 0.3,到不了 4。 【合理度 3,不是 4】门槛的前提是「K 低 = 偏度读数可信」,而价位离散的混淆方向正好相反(几元的票分钟收益近似三点分布,K 也低)。能区分两者的 11、12 被表格划掉了,这个混淆在本位里没法证伪。文献支持只是类比(VOV 原文讲的是隐含波动的波动),也没有 train 上的证据。'
    revise: '—'
  - slot: b
    novelty: 4
