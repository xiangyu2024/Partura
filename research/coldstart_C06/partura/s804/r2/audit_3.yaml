    reasons: '与上一稿逐字相同。变体与 loc.md 拆解表里 knockout ts_mean(cs_last_high20(...), 20) 那一行逐字一致:+1.5578 → +1.6591,train +1.56 → +1.66 与 valid +2.26 → +2.82 同向;同一个手术在 head +1.22 上也再现了。只删一层,结构更简单,不是调参。corr_3:与原 head 0.725(表里最像的就是原 head,走替换),known 0.197,控制最大 size 0.382。 【更正我前两次审计里的一句】我照搬了 PI 的「ρ≈0.96、标准误 0.10–0.14、约 1 个标准误」。相关度表里变体与原 head 的日度秩 ρ 是 0.725(R2 是 0.688、R3 是 0.701),不是 0.96。如果两本书的收益相关也在这个量级,按我在 R4 上用过的同一个公式,标准误约 sqrt(2×0.275/4) ≈ 0.37,+0.10 只有约 0.3 个标准误。PI 的 0.96 在我能看的材料里找不到出处。这削弱了「部件是烂的」的统计力度,但没有改变方向:增益是实测的,train 与 valid 同向,在两个 head 的同一位置上方向一致。这和 R4 不同,R4 的方向证据是反的,提出者自己也不预期有增益。给 3 不给 4。另外,+1.6591 只比替换门槛 +1.6578 高 0.0013,过不过线在刀口上。'
