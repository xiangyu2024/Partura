    hypothesis: >-
      【第 1 次审计之后的重写:先认错】审计说得对。第一稿的主体 day_corr(div(Close, in_mean_rolling(Close, 30)), sqrt(Volume)) 在构造上就和当日方向耦合:
      分钟价高于自身 30 分钟均价,通常就是刚涨过;A 股上涨的分钟往往放量(量价齐升),所以它上涨日为正、下跌日为负,20 日均值约等于「带量的收益符号」的累计。
      表格上 rev 0.61–0.65,我写的 0.1–0.35 这条预测被否掉了。它和 head +0.58 的耦合也是同一个来源:按 _lexi 源码,那个 head 的第一项
      ts_mean(abs_(neg(pow_1_5(cs_last_low10(W, ·)))), 30) 对九成的股票(池外)等于 rank(W)^1.5 的 30 日均值,W = day_wmean(Ret, Volume)
      是成交量加权的分钟收益,正是「量价齐升有多强」这个量。Campbell-Grossman-Wang 1993、Llorente 等 2002 讲的「伴随成交量的收益会反转」,
      预言的就是这一块会和反转高度相关。所以本稿把它们引作**要剔除的混杂**,不再当 alpha 的来源。「库里没有一个 head 同时用分钟价格和分钟成交量」这句也收回。
      【idea 不变,只换实现】同样的日内涨跌之下,成交落在日内价格路径的哪里:是在价格已经涨上去之后放量(追涨、正反馈交易),
      还是在价格已经跌下来之后放量(承接、逆向的流动性提供)。成交时点族(head +1.39 / +1.30)只看成交落在时间轴的哪里;本位看它落在价格路径的哪里,
      而且在构造上与当日方向正交。
      【机制】(1) 注意力追高:Barber-Odean 2008,个人投资者是注意力冲击股票的净买方,在价格已经上涨、成交已经放大的时候买入;
      他们是付钱让价格上去的一方,不是信息方。(2) 正反馈交易:De Long-Shleifer-Summers-Waldmann 1990,跟着价格变动下单的交易者会让价格过度反应,
      随后回吐;A 股的 T+1 让当天追高的人当天卖不掉,卖空约束让套利者无法当天把价格压回去。(3) 反向的一端:Kaniel-Saar-Titman 2008,
      个人投资者在下跌后买入、为机构的需求提供流动性,被他们净买入的股票随后一个月有正的超额收益,而且这一点与过去收益、成交量效应是分开的。
      合起来的预测是:同样的涨跌下,成交反复落在「刚涨上去」位置的票随后跑输,反复落在「刚跌下来」位置的票随后跑赢。
      纯多头书买后者,所以种子全部取负,方向仍由 GP 自己选。
      【按审计的五点逐条改】
      (1) 主体在构造上与收益方向正交,用审计给的三种写法里的两种,并且叠在一起用:
      ② 位置先滞后一分钟:L = in_delay(div(Close, in_mean_rolling(Close, 30)), 1),即成交到来之前那一分钟的价格相对它自己 30 分钟均价的位置
      (in_mean_rolling 用左侧补 NaN 的 nanmean,前 29 分钟是扩张均值;in_delay 把第 0 分钟置 NaN,day_corr 会剔除)。
      基础量 B = day_corr(L, sqrt(Volume)),读的是「成交来的时候,价格是不是已经处在局部高位」,去掉「本分钟放量上涨本身造出局部高点」那一部分。
      但成交量自身有自相关,滞后只能去掉一部分,所以还要加下面这一步。
      ③ 按当日方向逐日分桶,之后再取 20 日均值:cs_bucket_rank(B, X) 是 B 在 X 同一十分位里的秩(ops_ext.cs_bucket_rank:在每个十分位内是 (0, 1] 上的均匀分布)。
      X 取两个:当日开盘到收盘的对数收益 log(div(day_last(Close), day_first(Open))),也就是当天的涨跌;以及 W = day_wmean(Ret, Volume),也就是审计点名的
      「带量的收益符号」本身。另有一个种子两层嵌套,先按当日涨跌分桶,再按 W 分桶。逐日分桶是对的那一步,因为混杂是逐日的(当天往哪边走);
      每天的桶内秩与当天的方向十分位正交,20 日的和也就与 20 天方向的和近似正交。20 日收益控制、head +0.58 的第一项,都是这种和。
      ① 审计给的第一种写法原样留一个:cs_bucket_rank(neg(ts_mean(B, 20)), div(day_last(Close), ts_delay(day_last(Close), 20))),
      分桶变量就是 rev 控制本身的表达式(十分位只看秩,和 20 日对数收益等价),rev 按构造≈0。
      (2) 正面处理 head +0.58 的 day_wmean(Ret, Volume):种子 2–6 直接按 W 逐日分桶。W 在每天的桶内被拿掉了,
      所以它们与那个 head 第一项(rank(W) 的 30 日均值)的相关,按构造应当很小;剩下的只有那个 head 的 -2C 项(成交质心)。
      可证伪的预测:种子 2–6 与 head +0.58 的残差 |ρ| < 0.4。≥ 0.5 就说明我把耦合的来源找错了。
      (3) 只用 20 日窗口,与 rev 控制同窗,是有意为之,不再拿 40 / 60 日去躲控制。第一稿的种子 4、7 以及两个未拆的对照(Close 原值、不加掩码的 12、13)都撤了。
      分钟尺度上有一个 in_mean_rolling(Close, 60) 的种子(6 号),它改的是「局部」的定义(30 分钟还是 60 分钟),不是日窗口。
      竞价掩码版(5 号)把开盘那一根和收盘集合竞价三根剔掉:M = div(mul(is_gt(in_index(Volume), 0.003), is_lt(in_index(Volume), 0.99)), 同式),
      在 241 根网格上恰好保留第 1–237 根,其余是 0/0 = NaN。
      (4) Kyle 冲击那一支撤掉。审计说得对:|Ret| / sqrt(Volume) 丢了方向,算子实现不了「知情方在低位买入」。换成审计建议的「按 sign(Ret) 分开」:
      F = sub(day_corr(L, mul(sqrt(Volume)·M, sign(Ret))), day_corr(L, mul(M, sign(Ret))))(种子 8;种子 9 是不加掩码的版本)。
      第一项是成交前的局部位置与带符号成交量(上涨分钟记 +sqrtV,下跌分钟记 -sqrtV)的相关。为正,表示涨上去之后放量买、跌下来之后放量卖(正反馈);
      为负,表示跌下来之后放量买、涨上去之后放量卖(逆向、承接)。第二项是同一个相关去掉成交量权重、只留分钟方向。减掉它,
      就扣掉了分钟收益自相关和买卖价弹跳(价位越粗弹跳越大,那是价位粗细和流动性的读数,陷阱 3 的同类),剩下的只是成交量的贡献。
      两项都是 [-1, 1] 里的相关系数,尺度无关。当天的方向只平移两边的均值,在相关里被去均值消掉,所以不需要再分桶。
      (5) 价位水平版(第一稿的 9、10)留下,但要处理混杂。日内价格水平与成交量的相关 ≈「日内趋势 × 成交前置还是后置」:上涨日成交后置,相关就为正。
      这正是本轮 E 位 ts_corr(C, 日内收益) 的日内版。处理办法照审计写的,逐日按 Z = mul(sub(day_centroid(sqrt(Volume)), 0.5), log(div(day_last(Close), day_first(Open))))
      分桶,Z 就是「成交后置程度 × 当日涨跌」,两个因子都以 0 为中心。种子 10 是 day_corr(Close, 掩码 sqrt 成交量);种子 11 是连续竞价 VWAP 相对 TWAP、
      除以 day_std(Ret)。11 号顺便改了审计指出的口径不一致:分母改成 day_mean(mul(Close, M)),和分子一样只取连续竞价的分钟。
      【相关度表的预测(全部可证伪)】
      - rev:种子 1–6 ≤ 0.25,种子 7 ≤ 0.05,种子 8–11 ≤ 0.2。种子 2–6 若 ≥ 0.3,说明逐日分桶没有去掉方向,本位仍是反转的换写。
      - 与所有 head 的原始 |ρ|:多数 < 0.3,全部 < 0.45。种子 1(只按当日涨跌分桶)和种子 7(只按 20 日收益分桶)没有拿掉 W,与 head +0.58 可能到 0.35–0.5。
      - liq / vol / known ≤ 0.4(第一稿主体是 0.21–0.33,其中一部分经由反转;分桶后应持平或更低),size ≤ 0.15。种子 8–9 的 liq ≤ 0.35:弹跳那一块已经扣掉了。
      【和库里已有的不同】成交时点族只看时间轴;价格轴族只看价格水平(后复权价的区块);偏度 / 峰度族只看收益分布的形状;
      head +0.58 的第一项是带量的收益符号,本位按构造把它剔掉了。本位读的是「同样的方向下,成交相对最近价格路径的位置」,库里没有这样的量。
      不对任何时段收益取均值,所以不是前两轮零产出的「把日收益的一个时段分量取负再累计」那个形状。
      【陷阱逐条】没有 signedpower / pow_ 一类凸变换。分桶变量逐股不同,不是截面常数。有一处平局要写明:全天封死的票价格不变,day_corr 的方差为 0,
      返回 0;它们的 W 也是 0,于是在桶内形成一小块平局,_pct_rank 用稳定排序按列序给秩。这类股票日只占很小一部分,再经 20 日均值稀释,
      不会构成列序斜坡,但我把它写在这里。没有市值、波动、流动性的非线性函数:day_std(Ret) 只在 11 号里当价格比值的尺度分母,当排序量用的始终是相关系数或桶内秩。
      【产出预测(诚实)】第一稿主体在样本内的拉力,多半来自它和反转的耦合;拿掉之后,我写的种子预计 +0.2 ~ +0.7,产出 head 的把握约 3 成,
      最可能的是种子 3–5(两层分桶)或种子 8(按方向拆开)。GP 自己那一半随机树另出 head 的把握约 4 成:前两轮 N 位的 head 都来自随机树。
      【为什么样本外还会在】依赖的是参与者结构和交易制度:A 股个人投资者的成交占比、T+1、卖空约束,2023-08 之后都没变。
      追涨与承接的行为在美股文献(Barber-Odean、Kaniel-Saar-Titman)里都有记录,不依赖本种子 head 可能吃到的 2022–23 小盘 / 低价行情。
      本位与反转、与 head +0.58 是按构造正交的,所以即使反转在样本外变弱,也不会把它一起带走。
