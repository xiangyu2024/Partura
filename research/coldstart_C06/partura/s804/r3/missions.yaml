    hypothesis: >-
      【核心是什么、为什么是 alpha】核心 C = day_centroid(sqrt(Volume)):当日 241 根分钟上 sqrt(成交量) 的时间质心,
      Σ t·|x| / Σ|x| / 240,0 = 全在开盘、1 = 全在收盘(ops_ext.day_centroid)。它是 head +1.39
      neg(ts_mean(neg(ts_mean(C, 10)), 20)) 唯一读字段的部件(ts_mean 线性、内层 neg 恒等,全式 = ±C 的约 30 日均值;sign -1
      ⇒ 多头书买成交最前置的十分位)。证据:(1) 同一构念的第二个独立测量 —— 最后 30 分钟成交额占比 —— 单独成了 head +1.30(sign +1
      ⇒ 买尾盘占比最低),方向一致,两者都在库里,彼此 |ρ| < 0.7;(2) 共性表里 C 是 n ≥ 20 的所有行中均值差最大的一行(+1.38,p 0.000,n = 23);
      (3) 字段互换不动(Volume→Amt:+1.39 → +1.36),窗口有内点但不是刀口(ts_mean 10/20/40 → +1.13/+1.39/+1.09),valid/train = 1.14,
      全库最低;(4) sqrt 承重:不开方的 day_centroid(Amt) 与已知族 0.511 被表格划掉,开方后 liq 0.32 / vol 0.41 / known 0.36 ——
      不开方时权重被开收盘集合竞价那几根巨量分钟独占,读到的是成交额的日内离散度(即已知族),开方后读到的才是成交在时段里铺得早还是晚。
      C 自己的当日读数只有 +0.06:alpha 全在 10–40 日的持续分量里,必须由外围造出来 —— 这正是 E 位要评的东西。
      【已见过的外围】含 C 的已评分候选只有一种写法:ts_mean(·, 10/20/40) 平滑 + neg(含 head +0.58 里的连减两次)。
      【本位外围:三个各自可证伪的机制检验,每一个都在 C 之外加一个以前没出现过的部件】
      (a) 机械前置的排除筛。涨跌停封板之后成交几乎停止,当日质心被机械地压向开盘 —— 这样的「前置」是一个事件,不是参与者结构。
      封板日本身另有一套交易行为(Chen-Gao-He-Jiang-Xiong 2017:大户在触涨停当天建仓、次日卖出,随后价格反转),与 C 的机制无关、样本外也不稳。
      实现:cs_last_high10 / cs_last_high20(y = neg(ts_mean(C, 20)), x = 冻结度),把近 20 日冻结最严重的 10–20% 压到最底、永远进不了多头书
      (_lexi 按 x 的整块 tie 取带,带宽至多 10% / 20%,不会因并列落进列序斜坡)。冻结度用 ts_max(·, 20) 而不用均值,因为一个封板日就足以把那 20 天的
      均值质心拉低:ts_max(day_flat_run_max(Close), 20)(最长连续不变分钟数 / 当日分钟数,封板 150 分钟 ≈ 0.6;价位粗的冷门票只有零散短游程,
      算子 docstring 正是为区分这两者而写)、ts_max(day_at_max_ratio(Close), 20)(收盘价等于日内最高的分钟占比,封涨停 ≈ 1,正常日 ≈ 1/240)、
      ts_max(day_at_min_ratio(Close), 20)(封跌停)。另有池子写法 cs_first_low20(neg(冻结度), ts_mean(C, 20)):最前置的 20% 里按冻结最少排。
      预测:若 C 读的是参与者结构,排除后分数在 neg(ts_mean(C, 20)) 的 +1.34 上下 0.1 以内;若掉 0.2 以上,C 有一部分在读封板事件,最终库里要这么标注。
      (b) 尾盘推价的检验:C 与当日日内收益的跨日相关 ts_corr(C, log(day_last(Close) / day_first(Open)), 40 / 60)。
      机制:尾盘集中成交把收盘价推离均衡价、随后回吐(Hillion-Suominen 2004;Comerton-Forde-Putniņš 2011 的收盘操纵指数正是同时看尾盘价格变动与尾盘成交集中),
      A 股的「尾盘拉升」是同一件事。如果「成交后置 = 差」是因为尾盘推价,那么该避开的应是「成交后置的日子恰好是上涨日」的票,即 ts_corr 高的票。
      种子:单独的 neg(ts_corr)、把 ts_corr 最高的 20% 当排除筛(其余按 neg(ts_mean(C, 20)) 排)、在最前置的 20% 池子里按 ts_corr 低排、以及与 (a) 的两道筛。
      这与第 2 轮 N 位的「收盘价相对 VWAP 的偏离」不是同一个形状:那里是对一个时段收益取多日均值(零产出),这里不对任何收益分量取均值,
      量的是成交时点与收益方向的跨日协动;日内收益取开盘到收盘、不含隔夜,对数比值尺度无关。预测:单独的 ts_corr 分数低(+0.1 ~ +0.5);
      排除筛版本若比 neg(ts_mean(C, 20)) 高 ≥ 0.05,支持尾盘推价这一机制。
      (c) 持久特征 vs 暂时变化:neg(ts_mean(cross_zscore(C, 120), 10))(近 10 日相对自身过去 120 日的标准分)、sub(cross_mean(C, 240), ts_mean(C, 10))
      (近 10 日比自己一年均值更前置多少)。Cremers-Mei(2007)把换手拆成持久的公司特定部分与暂时部分,这里对成交时点做同样的拆分。
      预测:「变化」这一半弱(< +0.4)—— 第 2 轮里不开方的「50 日减 5 日」版本控制相关几乎为零,却没进 88 个候选的前 5;若反而 ≥ +0.8,
      C 读的是事件(隔夜信息在开盘集中成交),而不是慢变的参与者结构。
      (d) 被动资金足迹:cs_first_low40(neg(ts_mean(C, 20)), ts_mean(收盘集合竞价成交额占比, 20)),占比 = day_sum(Amt · [in_index > 0.9875]) / day_sum(Amt),
      241 根网格上恰好是第 238–240 根(14:58–15:00;收盘竞价的撮合落在 15:00 那根,沪市 2018-08-20 起、深市更早)。Shen-Shi(2020)显示被动持股越高,
      成交越集中在收盘前;Bogousslavsky-Muravyev 显示收盘竞价量来自 ETF / 指数调仓。这个种子只在收盘竞价参与最少的 40% 里按前置度排:
      若 C 只是「被动资金占比低」的代理,池内就排不出东西。它与 head +1.39 的秩相关可能偏高、被表格划掉,我接受。
      【和库里已有的不同】库里含 C 的只有「平滑 + 取负」;本位外围全是新部件:冻结 / 封板排除筛、成交时点与收益方向的跨日协动、相对自身历史的标准化、收盘竞价足迹池。
      冻结度、ts_corr、竞价占比都不是市值 / 波动 / 流动性的函数;没有 signedpower / pow_ 一类凸变换,没有截面常数进 cs_*;
      LimitWidth / BoardCode 这类几乎全并列的叶子刻意不拿来分桶(会落进陷阱 2)。控制桶内排序(cs_bucket_rank(neg(ts_mean(C, 20)), 波动))这一检验
      我没有写进种子:它与 head +1.39 的秩相关约 0.85,表格必划、GP 的库禁令也会拒,放进来只是凑数。
      【为什么样本外还会在】(1) C 是慢变量,alpha 全在 10–40 日持续分量里,换手低,15bp 成本吃得少;(2) head 的 valid/train 1.14 是全库最低,不靠 2022–23 风格;
      (3) 外围 (a) 只去掉机械事件、(d) 只去掉被动资金足迹,剩下的部分比原 head 更干净,即使溢价变弱也是相对改进;(4) 涨跌停、T+1、收盘集合竞价制度在 2023-08 之后不变,
      参与者在日内的下单时点是慢变的市场结构。
      【风险,事先写明】两轮 E 位的共同现象是 GP 把控制叶子(LogFloatCap、day_quantile(Amt))嫁接进外围,本位种子没有这类叶子,但 GP 大概率仍会试;
      冻结度的排除筛可能带进流动性暴露(冷门票游程长),相关度表若 liq ≥ 0.5 会划掉那几个,剩下的仍够 4 个。
