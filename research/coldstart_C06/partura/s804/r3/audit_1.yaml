attempt: 1
slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [5]
    reasons: '【核心合规】C = day_centroid(sqrt(Volume)) 是 head +1.39 唯一读字段的部件,也是 head +0.58 里两次减去的项,并且在共性表里(n = 23,均值差 +1.38)。它与 5 个控制的 |ρ| 是 0.02–0.14,都 < 0.5;与 head 的最大原始 |ρ| 是 0.68(对 head +0.58,那个 head 在日度上由 −2C 主导),< 0.7。按 ops_ext.day_centroid 核对过:Σt|x| / Σ|x| / (T−1),sqrt 取的是 sqrt(|x|),和 PI 的描述一致。这个核心还没有用过 E 位。
      【创新度 3】这个核心已有的外围只有 ts_mean 平滑和 neg(head +0.58 里是 sub)。本位外围做三件以前没做过的事:(a) 封板 / 冻结事件的排除筛;(b) 成交时点与日内方向的跨日协动;(c) 持久部分与暂时部分的拆分。(a) 是对已有结构的实质改进,而且说得出原因。(b) 的单独版(种子 6、7)与所有 head 的 |ρ| ≤ 0.26、与控制 ≤ 0.21,输入和机制都是新的。不给 4:筛子型种子 1、3、4 与 head +1.39 的残差 |ρ| 是 0.63–0.68,本质是「head 加一道筛」;排除筛这种外围形状库里也有过(第 1 轮价格核心用的 cs_last_high*)。
      【合理度 3】算子逐个核对过。day_flat_run_max = 最长的连续相等分钟游程 / 有效分钟数;day_at_max_ratio / day_at_min_ratio = 收盘价等于当日最高 / 最低的分钟占比,封涨停或封跌停时接近 1。ts_max(·, 20) 取 20 日最大是对的:一个封板日就足以影响结果,取均值会把它稀释掉。cs_last_high10/20 走 _lexi,按 x 的整块并列取带,不会因为并列落进列序斜坡,避开了陷阱 2。ts_corr 是日轴上的 Pearson,尺度无关;log 是 log|x|,open-to-close 比值恒正,没有问题;cross_zscore 的窗口含当日。没有 signedpower / pow_ 这类凸变换,也没有截面常数进入 cs_*。窗口(20、40–60、120–240)都有理由。
      不给 4:外围本身没有 train 证据;文献(Chen 等 2017)只支持「封板日是另一类交易」这个前提,不支持「排除后成交时点因子更好」。
      保留意见三条。(i) day_flat_run_max 把封板和价位粗的冷门票混在一起(种子 1、2 的 liq 0.21 / 0.14),只有 day_at_max_ratio / day_at_min_ratio(种子 3、4)是事件专用的。PI 只写了「掉分」怎么判读,没写「涨分」怎么判读:如果只有 flat_run 版涨分、at_max / at_min 版不涨,那读到的是「去掉最不流动的那一截」的非线性流动性效应(陷阱 3 的同类),不是封板事件,结果要按这个读。另外,ops_ext 源码注释写明 20% 的带宽通常大于事件股的占比;种子 2 用 20% 带,与 head 的原始 |ρ| 从 10% 带的 0.53 掉到 0.32,多半误伤了非事件股。(ii) (b) 用 open-to-close 收益,只是尾盘推价的一个松代理:推价应该体现在尾盘收益和次日回吐上。60 个日度观测的相关系数,抽样标准误约 0.13;而 C 的单日读数几乎全是噪声(单日只有 +0.06),所以用 ts_corr 做排除筛或池内排序,大部分是在按噪声排。PI 定的「比 neg(ts_mean(C, 20)) 高 ≥ 0.05 就支持机制」,低于他第 2 轮自己写的约 0.1 的夏普差标准误,不能当机制证据。(iii) 种子 12 和第 2 轮已经测过、结果偏弱的「长均值减短均值」是同一个形状,只是开了方、换了窗口。作为诊断可以留,但别指望它产出。
      【划掉】种子 5:cs_first_low20(neg(冻结度), ts_mean(C, 20)) 不是排除筛,而是在最前置的 20% 池子里按冻结度做连续排序。对九成以上的非事件股,冻结度只是价位粗细和流动性的读数,所以多头书 = 池子里最流动的那一半。相关度表上它的 liq 0.41、known 0.40,是本位留下的种子里最高的,落在陷阱 3 的边上,也不符合 (a)「只挡掉机械事件」的 idea。表格另外划掉 8(与 head +1.39 原始 0.74)和 13(与尾盘占比 head 0.77),于是 (d) 被动资金池整支都没了。划完剩 10 个(1、2、3、4、6、7、9、10、11、12)。'
    revise: '—'
  - slot: b
    novelty: 2
    soundness: 2
    struck_seeds: [4, 7, 11, 12, 13]
    reasons: '【相关度表推翻了本位的核心预测】PI 预计主体种子(局部价位 × sqrt 成交量,加竞价掩码)与 rev 的 |ρ| 在 0.1–0.35。实际上种子 1、2、3、5、6、8 的 rev 是 0.61–0.65(种子 5 是 0.52),按控制 ≥ 0.5 被表格划掉。去掉竞价的 8 和不去的 1 几乎一样(0.645 对 0.647),说明与反转的耦合不是集合竞价带来的,而是在连续竞价里。原因在机制本身:分钟价格高于自身 30 分钟均价,通常就是刚涨过;A 股上涨的分钟往往放量(量价齐升),所以 day_corr(P / MA30, sqrtV) 在上涨日为正、下跌日为负,它的 20 日均值约等于「带量的收益符号」的累计,也就是 20 日反转的另一种写法。Campbell-Grossman-Wang 1993 和 Llorente 等 2002 讲的本来就是「伴随成交量的收益」会反转,即收益 × 成交量的交互;本位引的文献正好预言了它会和反转高度相关。所以「它不是任何收益分量的累计」这句不成立。
      【和库里的 head 也有关系】主体种子与 head +0.58 的原始 |ρ| 是 0.42–0.54,残差是 0.48–0.58。那个 head 的主项 cs_last_low10(day_wmean(Ret, Volume), …) 就是成交量加权的分钟收益,正是「价格变动 × 分钟成交量」的联合量。所以「库里没有一个 head 同时用分钟价格和分钟成交量」这句也不成立。
      【创新度 2】把成交投到价格轴上,这个方向相对成交时点族是新的;但算子实现出来的主体,是反转控制加 head +0.58 那一族的另一种写法。把窗口换成 40 / 60(种子 4、7),只是让它和 20 日控制对不齐:rev 从 0.6 以上降到 0.39 / 0.28,但 liq / vol / known 升到 0.38–0.45,与 head +0.58 的残差仍是 0.58 / 0.55。
      【合理度 2】机制(注意力追高、量价反转)在文献上说得通,但算子组合没有把它和收益反转分开;本位自己写的可证伪预测(rev 0.1–0.35)已经被表格否掉了。剩下的种子逐个看:9(收盘价水平 × 掩码成交量)和 10(连续竞价 VWAP / TWAP 再除以 day_std(Ret))都在 idea 内,与所有 head 和控制的 |ρ| ≤ 0.22。但它们没做第 (i) 步去趋势,仍然含有「日内趋势 × 连续竞价的 U 形成交」这一混杂,和 C × 日内方向同源,需要说明。10 的分母 day_mean(Close) 没加掩码,和分子口径不一致(小问题)。核对过的算子:is_gt / is_lt 返回 int;div(M, M) 走 torch.divide,整数 0/0 = NaN;day_corr 剔除 NaN 分钟;掩码 0.003 / 0.99 在 241 根网格上确实对应第 1–237 根。这部分 PI 写对了。
      【划掉】4、7:和被表格划掉的 1–3、5、6、8 是同一个量,只是窗口躲开了 20 日控制(见上),属于控制的换写法。11:|Ret| / sqrt(Volume) 丢掉了方向。冲击最大的分钟落在低价位,可能是知情方低位买入,也可能只是低位的一次急跌,所以算子没有实现「知情方在低位买入」;它的 rev 0.38 也说明它主要在读日内方向。12、13:PI 自己写明这两个是未拆的对照,读的是「当日涨跌 × 收盘竞价量是否大于开盘竞价量」这一混杂,不是本位的 idea。表格另外划掉 1、2、3、5、6、8。划完只剩 9、10 两个,不到 4 个。'
    revise: '重写时要做到五点。(1) 主体构造在构造上就和收益方向正交,并用相关度表证明 rev < 0.3。可选写法有三种。① 截面上按 20 日收益分桶取秩:cs_bucket_rank(<主体>, <20 日对数收益,例如 ts_sum(log(div(day_last(Close), ts_delay(day_last(Close), 1))), 20)>)。这是去掉反转,不是利用它的非线性部分。② 把同期耦合换成「成交到来时,价格已经处在局部高位」:用前一分钟的局部位置 in_delay(div(Close, in_mean_rolling(Close, 30)), 1) 和当期的 sqrt(Volume) 求相关,去掉「本分钟放量上涨本身造出局部高点」这个机械部分。③ 按当日方向分开:上涨日、下跌日各算一次,再取差或比,读的是「同样方向下,放量是不是更靠近局部高点」。(2) 正面处理 head +0.58 里的 day_wmean(Ret, Volume),给出与它的残差 |ρ| < 0.5。(3) 不要用 40 / 60 日窗口去躲 20 日控制;未拆的对照(Close 原值、不加掩码)不要当种子。(4) Kyle 冲击那一支改成带方向的版本,例如只取上涨分钟,或按 sign(Ret) 分开算冲击;否则它和 idea 无关。(5) 9、10 这类低相关的价位水平版本可以留,但要写明并处理「日内趋势 × 成交时点」这一混杂,例如在 C × 日内方向上分桶;否则它们读到的可能只是本轮 E 位 ts_corr(C, 日内收益) 的日内版。划完之后至少还要剩 4 个种子。'
R:
  - head: 'neg(ts_mean(neg(ts_mean(day_centroid(sqrt(Volume)), 10)), 20))'
    soundness: 2
    reasons: 'R 要回答的是「去掉或替换的部件是不是真的烂」。拆解表里这个 head 没有烂部件:C 是唯一读字段的部件;外层 20 日平滑的必要性是 +0.53,内层 ts_mean(·, 10) 是 +0.05,内层 neg 是恒等(0.00)。ts_mean 从 20 改到 40 掉到 +1.09,说明窗口有内点,不说明测量工具坏了。变体也没有去掉或修好任何部件,而是把库里另一个 head(尾盘占比,+1.30)按等权秩加进来。相关度表上,变体与 head +1.39 的原始 |ρ| 是 0.901,与尾盘占比 head 是 0.900(残差 0.897 / 0.889),它就是两个现有 head 的等权组合。即使分数过了 +1.491,增益也来自两个已在库里的 head 之间的分散化,库层面的合成本来就拿得到。替换规则只和原 head 比,所以替换之后库里会留下两只 ρ≈0.90 的 head。这正是库禁令(≥ 0.7)对任何 GP 候选都会拒绝的近重复,而 R 通道会把它放进来。另外,known 0.465 贴着 0.5 的不合格线,秩和的 distinct 只有 0.823(并列很多)。「用两件独立工具降低测量误差」这个想法本身说得通,但这不是去烂部件,给 2,本组不通过。'
summary: 'a 位(质心核心加封板排除筛、时点与方向协动、持久与暂时拆分)以 3/3 通过,划掉 5;b 位的局部价位 × 成交量被表格证明主要是 20 日反转和 head +0.58 的另一种写法(rev 0.61–0.65),创新 2、合理 2,划完只剩 2 个种子,退回重写;R 组是两个现有 head 的等权合并(与两者 ρ 都约 0.90),没有烂部件,合理 2,不通过。'
