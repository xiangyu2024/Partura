  - slot: b
    novelty: 3
    soundness: 3
    struck_seeds: [8, 9]
    reasons: '【这次改了内容,不只是换了说法】按第 1 次审计的五点逐条对照,每一点都有表格上的证据。
      (1) 与方向正交。先把局部位置滞后一分钟,再逐日用 cs_bucket_rank 分桶,最后取 20 日均值。按源码核对过:in_delay 把第 0 分钟置 NaN,day_corr 会剔除它;in_mean_rolling 是左侧补 NaN 的 nanmean;cs_bucket_rank 给的是 x 的十分位内 y 的百分位秩,另加 1e-4 × 全体秩来打破十个桶之间的并列。表格上,rev 从第一稿的 0.61–0.65 降到种子 1–6 的 0.01–0.24;两层分桶的 3–6 只有 0.01–0.04;按 20 日收益本身分桶的 7 是 0.01。PI 对 1–7 写的 rev 预测全部成立。
      (2) 与 head +0.58 的关系。种子 2–6 与它的残差 |ρ| 是 0.04–0.23,预测是 < 0.4,成立;原始 |ρ| ≤ 0.13。没有拿掉 W 的种子 1、7 也只有 0.21 / 0.26(原始)、0.17 / 0.28(残差)。第一稿是 0.42–0.54 / 0.48–0.58。
      (3) 窗口一律 20 日,40 / 60 日和未拆的对照都撤了。ts_med(种子 4)和 60 分钟的「局部」(种子 6)是同一个量的稳健性变体,不是在躲控制。
      (4) Kyle 冲击那一支撤了,换成按 sign(Ret) 拆开的 8、9。
      (5) 价位水平版 10、11 逐日按 Z = (C − 0.5) × 日内收益 分桶;11 的分母改成与分子同口径的掩码 TWAP。
      PI 还收回了第一稿里两句不成立的话,把 CGW 1993、Llorente 等 2002 改作要剔除的混杂,这是对的。
      【创新度 3】留下的 9 个种子,与所有 head 的原始 |ρ| 是 0.07–0.28,残差 ≤ 0.33,与 5 个控制都 ≤ 0.28,不是哪个 head 或控制的换写。它读的是:同样的当日方向下,成交落在价格路径的局部高位还是低位。成交时点族(+1.39 / +1.30)只看时间轴,W 是带量收益的平均,机制都不同。不给 4,两点理由:输入这一类并不新,head +0.58 的 W 与 M 的 day_wstd(Vwap, High)、day_corr(Vwap, High) 都已经在用分钟价格 × 分钟成交量;而且双层分桶把方向和 W 都拿掉之后,剩下的量本来就小(3–6 与一切都 ≤ 0.15),低相关本身不能证明有新信息。
      【合理度 3】算子实现了它说的那个可观测量:B 在当日方向的十分位内、W 的十分位内排序,读的正是「成交到来时,价格是不是已经处在局部高位」。20 日窗口与 rev 同窗,30 / 60 分钟作为「局部」也合理。没有凸变换;分桶变量逐股不同,不是截面常数。全天封死的票 B = 0(源码里 cov = 0,除以 EPS),在桶内形成一小块平局、按列序给秩,PI 已经写明;这类股票日占比小,又经 20 日均值稀释,不构成陷阱 2。11 号的 day_std(Ret) 只是带符号比值的尺度分母,表格 vol 0.03。
      不给 4,三点理由:
      (i) 没有 train 证据。Barber-Odean、De Long 等、KST 这些文献支持的是行为本身,不是这个量在截面上被定价。
      (ii) B 不带成交方向。价格刚涨上去之后放量,可能是追涨的买方,也可能是 KST 讲的「涨了就卖」的逆向散户卖方,这两种情况在 B 上同号。所以「正 = 追涨、负 = 承接」这个解读没有被识别,清楚的只是可观测量本身。唯一想识别方向的 8、9 被划掉了(见下)。
      (iii) 种子 10、11 的 rev 是 0.25 / 0.28,超过 PI 写的 ≤ 0.2;10 的 size 0.17 也超过了写的 0.15。Z 以 0.5 为中心,但 C 的截面中心未必在 0.5;而且这个混杂的大小大致取决于日内趋势有多线性,不是日内收益的幅度,所以 Z 只是一个粗控制,这两个种子还带着一部分方向。如果它们产出 head,要先看按 rev 分桶后的版本还在不在。
      【划掉】种子 8、9。PI 预测 liq ≤ 0.35,表格是 liq 0.57、known 0.54,表格本来也会划。原因在构造上:两个相关系数相减不是偏相关。设成交量与 (L, sign) 无关,则 corr(L, √V·s) ≈ corr(L, s) × E√V / √(E V),于是 F ≈ −(1 − E√V / √(E V)) × corr(L, s)。前一个因子是成交量的日内离散度,和已知族 cross_mean(day_std(Amt), 30) 是同一类;后一个是分钟级的弹跳,读的是价位粗细和流动性。两者相乘就是 liq 和 known 的读数,不是成交量对方向的贡献。以后若要识别方向,可以改成直接求相关:day_corr(mul(sub(L, 1), sign(Ret)), sqrt(Volume)),看放量的分钟是不是顺着成交前的局部位置走(正 = 顺着走,负 = 逆着成交)。这个写法对成交量的离散度是尺度无关的。
      其余 1–7、10、11 都在 idea 之内,不是陷阱,也不是 head 的换皮。划完剩 9 个。'
