    reasons: '【和第 1 次审的是同一份稿子】本位的核心、假设和 13 个种子与第 1 次逐字相同,我和 audit_record.json 的 seeds_all 逐个核对过。corr_2 里 a 位各行的数也与 corr_1 一致。所以沿用第 1 次的判断,不因为重审改分。
      【核心】C = day_centroid(sqrt(Volume)) 与 5 个控制的 |ρ| 是 0.02–0.14;与 head 的最大原始 |ρ| 是 0.68,对的是 head +0.58,那个 head 里有 −2C 这一项。0.68 < 0.7,E 位的核心条件满足。
      【创新度 3】这个核心已有的外围只有 ts_mean 平滑加 neg。本位外围做三件新事:
      (1) 封板 / 冻结的排除筛,种子 1–4;
      (2) 成交时点与日内方向的跨日协动 ts_corr,种子 6、7,与所有 head ≤ 0.26,与控制 ≤ 0.20;
      (3) 持久部分与暂时部分的拆分,种子 11、12。
      不给 4:筛子型的 1、3、4 与 head +1.39 的残差是 0.63–0.68,本质是「head 加一道筛」;排除筛这种外围形状,第 1 轮的价格核心已经用过。
      【合理度 3】算子核对过。day_flat_run_max、day_at_max_ratio、day_at_min_ratio 是冻结度;ts_max 取 20 日最大,一个封板日就够触发。cs_last_high10/20 经 _lexi 按 x 的整块并列取带,不会落进列序斜坡。没有凸变换,没有截面常数进 cs_*。不给 4:外围本身没有 train 证据。
      【保留意见,与第 1 次相同】
      (i) flat_run 把价位粗的冷门票也算进冻结度,只有 at_max / at_min(种子 3、4)专门对应封板事件。如果只有 flat_run 版涨分,读到的是「去掉最不流动的那一截」,要按陷阱 3 来读。20% 带宽的种子 2 多半误伤了非事件股。
      (ii) ts_corr 只有 60 个日度观测,标准误约 0.13;C 的单日读数又近乎噪声,所以拿它做筛子或池内排序,大半是在按噪声排。+0.05 的门槛低于夏普差的标准误,不能当机制证据。
      (iii) 种子 12 就是第 2 轮测过的「长均值减短均值」那个形状。
      【划掉】种子 5:它在池内按冻结度连续排序,对非事件股就等于按流动性排(liq 0.41、known 0.40),不符合「只挡掉机械事件」这个 idea。表格另外划掉 8(与 head +1.39 原始 0.74)和 13(与尾盘占比 head 0.77)。划完剩 10 个。'
