  - type: N
    hypothesis: '机制(隔夜与盘中的拉锯,tug of war):一段收益由两段组成 —— 隔夜段(前一日收盘到今天开盘集合竞价)与盘中段(开盘到收盘),两段由不同的人定价。隔夜与开盘竞价主要反映收盘后基于新闻与关注做出的散户决定,盘中主要是机构的连续执行。Lou-Polk-Skouras 2019:十几种经典异象的利润要么几乎全在隔夜、要么几乎全在盘中,而且两段之间反向拉锯;Berkman 等 2012:受关注的股票开盘被散户买高,随后在盘中回吐;A 股的 T+1 让开盘买入当天不能卖出,形成系统性的隔夜折价(Qiao-Dam 2020);Jiang-Luo-Ye 2023 发现 A 股的因子溢价也按隔夜 / 盘中分开兑现,归因于散户偏开盘、机构偏尾盘的客群。所以一只股票近期的收益「是在哪一段挣的」携带了「谁在推价格」的信息,而这正是奖励的 20 日反转控制看不到的:控制是两段之和。
      算子实现(r_on = log(day_first(Open) / ts_delay(day_last(Close), 1)),r_id = log(day_last(Close) / day_first(Open));价格是后复权的,两段用同一套复权,除权日不会凭空跳):
      (1) 隔夜漂移,先用自身波动去量纲:cross_mean(r_on, 20) 除以日收益 60 日标准差、cross_mean(r_on, 60) 除以隔夜收益 60 日标准差、cross_ema(r_on / 隔夜 60 日标准差, 10),以及短减长的异常隔夜 (5 日均值 − 60 日均值) / 隔夜 60 日标准差(Aboody 等 2018:隔夜收益是公司层面的情绪度量,短期持续、较长期反转)。
      (2) 按构造与反转控制正交:cs_bucket_rank(隔夜 20 / 60 日均值, 同期总收益 div(day_last(Close), ts_delay(day_last(Close), 20 / 60))) —— 在总收益相同的十分位里比较「隔夜段占了多少」;同样写法用于隔夜上跳 / 下跳天数之差。cs_bucket_rank 的第二个参数是逐股不同的总收益,不是截面常数(不碰陷阱 2)。
      (3) 逐股的拉锯强度:cross_corr(r_on, r_id, 60) 与 cross_regbeta(r_on, r_id, 60)(盘中把当天的跳空吃回多少);cross_corr(昨日 r_id, 今日 r_on, 60)(昨天盘中的走势被今天的隔夜反向修正多少)。
      (4) 价格发现发生在哪一段:20 日 Σ|r_on| / (Σ|r_on| + Σ|r_id|)、隔夜与盘中 60 日波动之比;开盘集合竞价成交额占全天的比例按跳空方向取符号后的 20 日均值(上跳空日是否伴随更多开盘竞价资金 —— 关注驱动的开盘需求,Berkman 等 2012)。
      全部是收益的比值、相关、秩或用自身波动标准化后的量:不含成交额、波动、市值的水平或幂(陷阱 1、3),不把截面常数喂给 cs_*(陷阱 2);带符号的收益均值都先除以自身波动(r1 审计员划掉过一个未去量纲的有符号收益种子)。与 20 日反转控制:族 (2) 按构造约为 0;族 (1) 只含隔夜一段,预计 0.2–0.45;族 (3)(4) 是两段之间的关系,预计 < 0.2。
      与库的区别:5 个 head 里没有一个读收益在时间上的切分。head +1.53 里唯一被读到的经济输入是开盘价的水平(定位里 High→Low 互换得分四位小数不变,Open→Close 才有变化),它只用「后复权开盘价是否在最高 10%」这一个标记;本位只用开盘价相对前收盘、相对收盘的比值,不用水平。资金流 head(+0.61)读的是日内分钟成交额的分布,不含隔夜。预计与所有 head 的 |ρ| < 0.3。
      方向交给奖励:美股隔夜为正、盘中反转,A 股隔夜平均为负(T+1 折价),本位不预设符号。
      样本外为什么还在:来源是制度与客群 —— T+1、开盘集合竞价、散户在收盘后做决定而机构在盘中执行,这些在样本期后没有改变;LPS 2019 报告这种拉锯在美国持续数十年、跨多个异象成立,Qiao-Dam 2020 与 Jiang-Luo-Ye 2023 在 A 股复现。已知风险:2018-08-20 上交所引入收盘集合竞价,沪市 day_last(Close) 的形成方式变了,隔夜段的起点在 train 早期有一次断点;60 日窗口与相对自身历史的写法会在两三个月内适应它。'
