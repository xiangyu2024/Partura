    core: 'div(sub(day_wmean(Ret, Amt), day_mean(Ret)), day_std(Ret))'
    hypothesis: '核心 X =(成交额加权的分钟收益 − 等权分钟收益)/ 日内分钟收益标准差:当天的钱更多落在上涨的分钟还是下跌的分钟(日内资金流倾斜),无量纲。它是本种子唯一一个部件全都干净的 head 的日度内核:cross_mean(cross_ema(X, 10), 15),train +0.61 / valid +2.61,方向 +1(延续);定位拆解里每个部件必要性都 > 0,Amt→Volume 只差 0.01,窗口 7 / 15 / 30 单峰。
      这个核心至今见过的外围只有纯时间平滑:cross_mean(X, 20)、cross_ema(X, 10 / 15)、cross_mean(cross_ema(X, 10), 7 / 15 / 30)、cross_ema(cross_mean(cross_ema(X, 10), 15), 10);外围算子集合只有 {cross_mean}、{cross_ema}、{cross_mean, cross_ema} 三种。它们读的都是倾斜的「水平」,而水平里混着两样东西:(i) 股票自身稳定的日内构成 —— 成交额的开收盘 U 形让开盘、尾盘分钟拿到大头权重(Admati-Pfleiderer 1988),一只股票若尾盘竞价占比长期偏高,X 就长期带着一个与信息无关的偏置(r1 审计员提出的竞争解释);(ii) 资金流里真正的信息。
      本位的外围全部离开纯平滑,改问「倾斜在什么时候、以什么方式偏离这只股票的常态」,共五族,每族对应一个机制:
      (1) 相对自身历史的异常倾斜(Gervais-Kaniel-Mingelgrin 2001 的口径:冲击按股票自己的常态定义):sub(cross_mean(X, 5), cross_mean(X, 60))、cross_mean(cross_zscore(X, 60), 10)、cross_ema(cross_rank(X, 60), 5)、(10 日均值 − 120 日均值)/ 120 日标准差。(i) 是慢变的股票属性,减掉自身长期水平就按构造扣掉了它的持久部分,剩下的是资金流的变化。
      (2) 跨日的「量加权 − 等权」:Σ(X·当日成交额)/Σ当日成交额 − mean(X)(20 日),以及 cross_mean(X·cross_zscore(当日成交额, 60), 20)。这是核心在分钟尺度上做的事在日尺度上再做一遍:放量日的倾斜是否比平常日更有分量(GKM 的高成交量日;Chordia-Roll-Subrahmanyam 2002 的大失衡日)。成交额只当股票内部跨日的权重,水平在分子分母里约掉,z 分数相对自身历史,不读流动性水平。
      (3) 逐股的「这只股票的资金流有没有信息」:cross_corr(cross_delay(X, 1), 日对数收益, 120) 是过去 120 天里昨天的倾斜与今天收益的相关。Llorente-Michaely-Saar-Wang 2002 发现量价交互的符号随信息交易与对冲交易在股票间变号,支持的是分类而不是单调排序;所以单独用它是信息交易强度的代理(Easley-Hvidkjaer 等 2002:信息交易概率被定价),乘上近 10 日倾斜则是「只在资金流历来有信息的股票上跟它的方向」。
      (4) 连续性与持续性:X 的一阶自相关(60 日)乘近 10 日倾斜 —— Chordia-Subrahmanyam 2004:机构拆单使失衡正自相关并正向预测收益;自相关为负的(流动性交易)乘积自动反号,对应 LMSW 的另一类。以及「正倾斜天数占比」与「平均倾斜」的截面秩之差:很多天小幅流入 vs 少数几天大幅流入(Da-Gurun-Warachka 2014 的连续信息被反应不足)。
      (5) 尾部与相对当日方向:cross_tail_mean_q25(X, 60) 及上下尾条件均值之和(最强的派发日与最强的吸筹日是否对称;卖空受限时坏消息扩散更慢,Hong-Lim-Stein 2000);cross_mean(X·sign(当日收益), 20)(钱是顺着当天的方向进的,还是逆着当天的方向在承接)。
      算子约束:外围全是差、比、秩、相关或相对自身历史的标准化;不对成交额或波动取幂(r1 b 位的教训:GP 会爬向成交量凸度,那是陷阱 1 / 3);不用 cs_state_rank,也不把任何截面常数喂给 cs_*(陷阱 2);cs_rank 只作用于逐股不同的量。核心与控制:未平滑的日度 X 与 20 日反转的秩相关应远低于 20 日平滑版(r1 相关度表里为 0.49)。种子刻意不含「只是换个平滑窗口」的写法:族 (1)(2)(3)(4) 是差分、协方差、相关与交互,预计与 head +0.61 的 |ρ| 明显低于 0.7,GP 的库禁令也会把只加长平滑的后代挡掉。
      方向不写死,交给奖励;已有 head 是 +1(延续),与 Chordia-Subrahmanyam 2004 以及 Jones-Shi-Zhang-Zhang 的 A 股证据(大户与机构的失衡正向预测未来 1–60 天收益,小散户相反)一致。
      样本外为什么还在:(a) 这个核心的 head 在 valid 上 +2.61,远高于 train 的 +0.61,不是在 train 上挑出来的;(b) 产生资金流可预测性的机构拆单、T+1 下散户集中在开收盘交易、卖空受限,这些制度与参与者结构在样本期后没有改变;(c) 本位的外围都是逐股的相对量(相对自身历史、逐股相关、跨日权重在股票内部约掉),不依赖某一时期的截面水平,也不依赖日内 U 形本身的形状 —— 2018-08 上交所引入收盘集合竞价改变了尾盘成交占比,族 (1) 按构造对这类水平漂移免疫。'
