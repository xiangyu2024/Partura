    why: 'head +0.61 有三个可疑部件,各换一次,再做两个组合。(a) 双重平滑 EMA(10) + 均值(15) 约等于 20–25 天的低通:定位里 cross_mean@15→7 得 +0.6526(+0.047),而 20 日平滑版与 20 日反转控制的秩相关 0.49(r1 相关度表),平滑越长越贴近反转控制、被中性化扣掉的越多;订单失衡的可预测期在文献里是日到周(Chordia-Subrahmanyam 2004;Chordia-Roll-Subrahmanyam 2005 的窗口随时间缩短),所以把 EMA 半衰期减半到 5、均值窗口取 7。(b) 分母 day_std(Ret) 是等权的分钟标准差:流动性差的股票有大量零成交、零收益的死分钟,把它压低,于是去量纲这一步部分在读流动性(陷阱 3 的方向);换成 day_wstd(Ret, Amt)(按成交额加权的标准差,死分钟不再稀释;ops_ext 的文档)。(c) 权重的开收盘 U 形:r1 审计员指出 day_wmean(Ret, Amt) − day_mean(Ret) 的截面差异可能大半是开盘 / 尾盘时段收益与盘中收益之差(时段构成),而不是资金流;in_slice(·, 31, 210) 只保留约 10:00–14:30 成交额近乎平坦的时段(第 0 列是 9:30 开盘竞价;去掉开盘竞价、前 30 分钟与最后 30 分钟,后者含深市收盘竞价),按构造去掉构成效应。切片版若保住或更好,(c) 的竞争解释被排除,并换上更干净的写法;若塌掉,这个 head 应改读成时段构成。五个变体都保留同一机制,与原 head 预计 ρ ≥ 0.5,高出 0.1 时走替换通道。'
