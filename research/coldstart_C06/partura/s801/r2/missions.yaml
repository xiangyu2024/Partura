  - head: 'cross_mean(div(day_sum(mul(mul(Ret, Ret), Ret)), mul(day_sum(pow_3(Volume)), day_sum(pow_3(Volume)))), 20)'
    why: '烂部件是分母 (Σ Volume³)²,依据全在定位输出里:(1) day_sum(pow_3(Volume)) 单独的 rho_known 0.58,平方后 0.52,按环境口径 ≥ 0.5 就是已知族;(2) 分数由凸度供给:分母一次方 +0.70,平方 +1.22,分子 Σr³ 单独 −0.35,剂量越高分越高,是陷阱 1 / 3 的指纹;(3) 数值上是坏的:(Σv³)² 的 coverage 0.9228(float32 溢出),swap Volume→Amt 直接 distinct 0.18 不过门。上一稿只把幂降到 2 / 3 / 5,分母仍是 1/V^k,多头仍落在成交股数最低的名字上,没有去掉这个部件;剂量反应在定位里也已经有两个点。所以那三个变体撤掉。
      这一稿把分母换成尺度无关的量,分子也一起改:Σr³ 本身 ∝ 日内波动的三次方,是波动的凸函数(陷阱 1),只换分母会把这一块留下。所以分子分母一起换成 Amaya-Christoffersen-Jacobs-Vasquez 2015 的已实现偏度 Σr³ / (Σr²)^1.5:在收益尺度上无量纲,而且有界(|Σr³| ≤ (Σr²)^1.5)。成交量只以两种不读水平的身份留下:
      (v1) 日内按成交额加权的已实现偏度 day_wmean(r³, Amt) / day_wmean(r², Amt)^1.5。day_wmean 是 Σ|w|·x / Σ|w|(ops_ext),成交额的水平在分子分母的每一项里都约掉,只剩「钱落在哪些分钟」。这是 GP 找到的「成交量」零件里唯一不读水平的含义:偏度是不是由有钱成交的分钟贡献的。
      (v2) 已实现偏度 × 当日成交额相对自身 60 日历史的 z 分数(Gervais-Kaniel-Mingelgrin 2001 的口径:成交冲击按股票自己的常态定义)。它检验「成交少的时候偏度更有分量」在股票内部是否成立;如果只在截面水平上成立,那就是陷阱 3。用成交额而不用股数,是因为股数在送转后永久跳升,自身历史的 z 分数会把送转后的一两个月都标成异常放量,成交额不受送转影响。用乘 z 分数而不用「÷ 相对成交量」,是因为一字板日的相对成交量趋近 0,除法会把信号变成锁板日指示器;而 60 日 z 分数有界(含当天时不超过约 7.7),偏度也有界,乘积没有离群放大。方向交给奖励。
      (v3) v1 与 v2 的组合:按成交额加权的已实现偏度 × 成交额的自身历史 z 分数。
      不加权、不交互的纯已实现偏度就是 r1 b 位的种子 6(x·sqrt(x) = x^1.5)。它不在定位列出的 r1 b 前 5 名里(第 5 名 +0.38),所以 score < +0.38,这里不再花一次评估,只作三个变体的下界参照。
      预测:三个变体都到不了 head + 0.1 = +1.32(把握 95%)。那样 head 留在库里,由库禁令挡住它的近邻;笔记把 +1.22 记成成交量水平凸度(陷阱 3)的产物,以后不在这一族开 E 位。三个变体与原 head 的 ρ 预计都 < 0.5,真高出 0.1 时走的是收录通道,条件照旧(与已知族 |ρ| < 0.5、与库里所有 head < 0.7)。这一组的用处是诚实地检验「去掉烂部件之后还剩什么」:v2 / v3 若明显高于 v1 和 +0.38 的下界,说明成交量这个零件在股票内部有含义(偏度 × 异常活跃),可以作为以后 N 位的输入;三个都在 0 附近,就说明 +1.22 全部来自成交量水平的凸度。'
