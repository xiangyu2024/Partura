slots:
  - slot: a
    novelty: 3
    soundness: 3
    struck_seeds: [11, 12]
    reasons: '【创新度 3】按 E 位口径,和这个核心已有的外围比。已见过的外围只有 cross_mean / cross_ema 的纯时间平滑,读的是倾斜的水平。本位的外围做的是别的事:相对自身历史的偏离(种子 1–4:sub(cross_mean 5, cross_mean 60)、cross_zscore 60、cross_rank 60、(10 日 − 120 日)/ 120 日标准差),跨日按成交额加权(5、6),逐股滞后相关和自相关加权(7、8、9),频次减幅度(10),按当日方向取号(13)。相关度表也说明它们不是 head 换皮:保留的种子与 head +0.61 的原始 |ρ| 在 0.02–0.27,残差 |ρ| 在 0.01–0.30。核心本身在 hl 20 下与这个 head 的残差 |ρ| 是 0.77,所以换皮的风险全在外围,而这些外围确实做了别的事。输入仍是同一个 X,按 §3 给 3,不给 4。
      【合理度 3】逐个核对了算子:cross_zscore / cross_rank 的窗口含当天、只用过去;cross_sum(X·day_sum(Amt), 20) / cross_sum(day_sum(Amt), 20) 里逐股成交额的水平确实在分子分母约掉;cross_corr(cross_delay(X, 1), 日对数收益, 120) 是因果的滞后相关;cross_autocorr_s1 = cross_autocorr(·, 60, 1);cs_rank 只作用在逐股不同的量上。窗口 5–120 合理;核心与 5 个控制的 |ρ| ≤ 0.13(E 位的条件满足)。
      不给 4 的理由有三条。(1) 代数上 X =(Σ(w/W)·r − r̄)/ sd(r),恒等于 day_corr(Ret, Amt) × 日内成交额变异系数 CV(Amt)。CV(Amt) 衡量日内成交有多「块状」,就是非流动性。凡是取 X 的幅度或尾部的外围,都会把它重新暴露出来:种子 11(下尾均值)与流动性 0.51、已知族 0.47、市值 0.43,这是陷阱 3 的证据;种子 13 cross_mean(X·sign(r), 20) 约等于 |X| 的均值,与市值已经 0.26。GP 往外长时可能沿这条路往上爬。(2) 族 (1)–(5) 的文献多是类比:GKM 讲的是成交量本身,不是资金流倾斜。逐股 120 日相关和 60 日自相关的抽样误差约 1/√120 ≈ 0.09 和 1/√60 ≈ 0.13,真值大概只有百分之几,所以种子 7、8、9 基本是噪声乘水平;它们与 head 的 |ρ| 只有 0.01–0.06,也反映了这一点。留着是因为它们符合本位的 idea,但先验偏弱。(3) PI 的样本外论据 (a) 不成立:score = min(train, valid),head 本来就是按 valid 选出来的,valid +2.61 不是留出证据。train 只有 +0.61;定位拆解里未平滑的 X 在 train 上取最好的方向和半衰期也只有 −2.36,这份信息在 train 上偏弱。
      【划掉】11:表里流动性 0.51,自动划掉;它本身也是陷阱 3,X 下尾的幅度 ∝ CV(Amt)。12:与 head +0.61 原始 0.80、残差 0.88;上下尾条件均值之和约等于 60 日稳健均值,就是 head 的水平平滑换了个写法。保留 1–10、13,共 11 个。
      【提醒】种子 10 的 cs_rank(cross_mean(sign(X), 20)) 只有 21 个取值,cs_rank 用稳定 argsort 按列序破平,带一点静态的列序斜坡。减去的 cs_rank(cross_mean(X, 20)) 是连续的,distinct 0.80 是真的,斜坡只占方差的百分之一左右,所以保留。另外种子 1–4 都是「短窗减长期水平」,四个近似重复,不影响通过。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [7, 8]
    reasons: '【创新度 4】5 个 head 没有一个读收益在时间上的切分。r_on = log(day_first(Open) / ts_delay(day_last(Close), 1)) 和 r_id = log(day_last(Close) / day_first(Open)) 是新输入;隔夜漂移、拉锯强度、价格发现发生在哪一段,是新机制。head +1.53 只用到 log(day_first(Open)) 的水平,而本位只用比值。相关度表:保留的种子与所有 head 的原始 |ρ| ≤ 0.18、残差 ≤ 0.15,与 5 个控制 ≤ 0.19;族 (2) 的 cs_bucket_rank 与 20 日反转只有 0.01–0.04,「按构造正交」成立。LPS 2019 等文献里已经有这个机制,所以不给 5。
      【合理度 4】逐个核对:价格是后复权的(AlphaCube tradability.py 注明),两段比值跨除权日连续;停牌后第一天 ts_delay 给 NaN,不会把多日跳空当成隔夜;rolling_ols 里 cross_regbeta(x, y) 是 y 对 x 的斜率,所以 cross_regbeta(r_on, r_id, 60) 确实是「盘中把当天的跳空吃回多少」;cs_bucket_rank(y, 20 / 60 日总收益) 的第二个参数逐股不同,不碰陷阱 2;带符号的隔夜均值都先除以自身波动;没有成交额、波动、市值的水平或幂。窗口 5 / 20 / 60 合理。文献都在 2023-08-08 之前,而且直接研究这个切分,包括 A 股(Qiao-Dam 2020、Jiang-Luo-Ye 2023-05),符合 4。
      不给 5 的理由:T+1、集合竞价、客群这些样本外论据说得通,但 A 股隔夜类因子在样本期内已广为人知,拥挤风险没有讨论。族 (3)(4)(cross_corr(r_on, r_id)、Σ|r_on| 占比、两段波动之比)还有一个竞争解释:开盘集合竞价价格里的暂时性噪声会机械地让 r_on 与 r_id 负相关、抬高隔夜波动的占比,这是 Roll 式的非流动性度量。种子 9–13 现在与流动性 0.10–0.18、已知族 0.11–0.17,还低,但 GP 往外长时要盯住陷阱 3。
      【划掉】8:相关度表判为废品,cross_mean(sign(r_on), 20) 只有约 41 个取值,distinct 0.016。7:同一个 41 档的量包进 cs_bucket_rank 之后 distinct 变成 0.994,但这完全来自破平:_pct_rank 用稳定 argsort 按列序破平,补的 1e-4·_pct_rank(y) 对同值也按列序排。于是每个十分位桶里,同值块内的名次就是股票的列序;真实取值约 41 × 10 档,distinct 本该在 0.08 上下。这正是陷阱 2「借列序斜坡通过 distinct 门槛」的样子。若想保留这个 idea,把频次写成连续量,例如 cross_mean(div(r_on, 隔夜 60 日标准差), 20) 或加一个连续项打破同值。保留 1–6、9–14,共 12 个。'
    revise: '—'
R:
  - head: 'cross_mean(cross_ema(div(sub(day_wmean(Ret, Amt), day_mean(Ret)), day_std(Ret)), 10), 15)'
    soundness: 3
    reasons: '三个部件各换一次,再做两个组合,实现都对。day_wstd(Ret, Amt) 是 ops_ext 里按 |Amt| 加权的总体标准差,死分钟的权重为 0。in_slice(x, 31, 210) 取第 31..210 分钟,含两端共 180 分钟,约 10:01–14:30;Ret 与 Amt 同样切片,day_wmean / day_mean / day_std 口径一致。
      (c) 依据清楚:它直接检验 r1 审计提出的时段构成竞争解释,结果两个方向都有信息(保住就排除这个解释,塌掉就改读成时段构成)。(a) 依据弱:定位里 cross_mean@15→7 只高 0.047,而且 reward 自己还会加 hl ≤ 20 的平滑;v1 与反转控制仍是 0.43,「缩短平滑就少被反转控制扣掉」在表里看不到。(b) 的论据被表反驳:换成 day_wstd 后,v2 与流动性 / 波动 / 已知族的 |ρ| 是 0.29 / 0.37 / 0.33,只改窗口的 v1 是 0.13 / 0.30 / 0.18。也就是说 wstd 版更像控制,不是更不像。切片版 v3 也升到 0.32 / 0.34 / 0.35。
      若 v2 / v4 / v3 靠高出 0.1 走替换,先看残差对流动性的非线性暴露(陷阱 3),再认它。五个变体与原 head 的原始 |ρ| 在 0.61–0.93,高出 0.1 时都走替换通道,不会凭空多出 head。整体给 3:机制清楚,算子实现了它,(c) 有价值,(a)(b) 的「烂」证据不足。'
  - head: 'cross_mean(div(day_sum(mul(mul(Ret, Ret), Ret)), mul(day_sum(pow_3(Volume)), day_sum(pow_3(Volume)))), 20)'
    soundness: 2
    reasons: '诊断是对的,loc.json 里的数都核对过:day_sum(pow_3(Volume)) 单独的 rho_known 0.58,平方后 0.52,coverage 0.9228(float32 溢出);分子 Σr³ 单独 −0.35;分母从一次方(+0.70)到平方(+1.22),分数随凸度上升。这是陷阱 3 的指纹,烂部件就是分母。
      但变体没有把它去掉。(Σv)²、(Σv^1.5)²、(Σv^2.5)² 仍是成交股数水平的幂放在分母,信号两端仍由 1/V^k 决定,多头仍集中在成交股数最低的名字上(v1 与市值 0.41、流动性 0.26),只是剂量更低。若某个变体高出 0.1,走替换通道换进库的仍是陷阱 3 的产物。作为诊断它也多余:剂量反应在定位里已有两个点(Σv³ → +0.70,(Σv³)² → +1.22),「以后不在这一族开 E 位」现在就能定,不必再花 3 次评估。
      要过,变体必须把分母换成尺度无关的量:例如 ACJV 的已实现偏度 div(day_sum(r³), pow_1_5(day_sum(r²)))(r1 b 位已有近似种子),按成交额加权的已实现偏度,或者用成交量相对自身历史的量(cross_zscore)代替水平。预计这些都达不到 head + 0.1,那样 head 留在库里,由库禁令挡住它的近邻;但只有这样才是对「去掉烂部件」的诚实检验。否则删掉这一组。'
summary: 'a 位(E,资金流倾斜核心的外围离开纯平滑)创新 3、合理 3,划掉 11 和 12 后留 11 个,通过;b 位(N,隔夜与盘中的拉锯)创新 4、合理 4,划掉 7 和 8 后留 12 个,通过;R 组里 +0.61 的平滑 / 分母 / 切片变体合理 3,通过;+1.22 的成交量幂分母降幂变体合理 2,不通过,因为变体保留了陷阱 3 的同一结构。'
