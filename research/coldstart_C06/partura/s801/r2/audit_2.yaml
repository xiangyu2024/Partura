    reasons: '【与上一稿的关系】a 位上一稿已通过,这一稿的核心、13 个种子与相关度表里 a 位的各行都和 corr_1 逐字相同(corr_1 与 corr_2 的差别只在 R 2 的三行),所以重新核对后结论不变。
      【创新度 3】按 E 位口径和这个核心已有的外围比。已见过的外围只有 cross_mean / cross_ema 的纯时间平滑(r1 a 位前 5 名与定位拆解都是这一类),读的是倾斜的水平。本位外围做的是另外几件事:相对自身历史的偏离(种子 1–4)、跨日按成交额加权与对异常成交额的协方差(5、6)、逐股滞后相关与自相关加权(7、8、9)、频次减幅度(10)、按当日方向取号(13)。相关度表支持它们不是 head 换皮:保留种子与 head +0.61 的原始 |ρ| 在 0.02–0.27,残差 |ρ| 在 0.01–0.30,与其余 4 个 head 都更低。不给 4:进入外围的仍是同一个 X,而且 11 个保留种子里有 4 个(1–4)是同一种「短窗减自身长期水平」,属于同一类输入换一种机制,按 §3 是 3。
      【合理度 3】逐个算子核对过:cross_zscore(ops_ext)与 cross_rank 的窗口含当天、只用过去;cross_sum(X·day_sum(Amt), 20) / cross_sum(day_sum(Amt), 20) 里逐股成交额水平在分子分母约掉;cross_corr(cross_delay(X, 1), 日对数收益, 120) 因果;cross_autocorr_s1 = cross_autocorr(·, 60, 1);cs_rank 只作用于逐股不同的量。窗口 5–120 合理;核心与 5 个控制的 |ρ| ≤ 0.13,满足 E 位条件。不给 4 的理由仍是三条:(1) 代数上 X = day_corr(Ret, Amt) × 日内成交额变异系数,后者是非流动性;取 X 幅度或尾部的外围会把它重新暴露出来,种子 11 的流动性 0.51、已知族 0.47、市值 0.43 就是证据,种子 13 与市值 0.26 也在这条路上,GP 往外长时可能沿它爬(陷阱 3)。(2) 文献多是类比(GKM 讲成交量本身,不是资金流倾斜);种子 7、8、9 的逐股 120 日相关与 60 日自相关抽样误差约 0.09 与 0.13,真值大概只有百分之几,先验偏弱。(3) 样本外论据 (a) 不成立:score 取 train 与 valid 的较差者,head 是看着 valid 选出来的,valid +2.61 不是留出证据;train 只有 +0.61,未平滑的 X 在 train 上 −2.36。
      【划掉】11:流动性 0.51,按规则自动划掉,本身也是陷阱 3(X 下尾幅度随日内成交额变异系数放大)。12:与 head +0.61 原始 0.80、残差 0.88,自动划掉;上下尾条件均值之和约等于 60 日稳健均值,就是 head 的水平平滑换写法。保留 1–10、13,共 11 个。
      【提醒】种子 10 的 cs_rank(cross_mean(sign(X), 20)) 只有约 41 个取值,_pct_rank 用稳定 argsort 按列序破平,带一条静态列序斜坡;因为减去的 cs_rank(cross_mean(X, 20)) 是连续的,distinct 0.80 是真的,斜坡只占方差约百分之一,所以保留(与 b 位种子 7 的处理不矛盾:那里整个量都是离散的,distinct 全靠斜坡)。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [7, 8]
    reasons: '【与上一稿的关系】b 位上一稿已通过,这一稿的假设与 14 个种子未改,相关度表各行与 corr_1 相同;重新核对后结论不变。
      【创新度 4】5 个 head 没有一个读收益在时间上的切分。r_on = log(day_first(Open) / ts_delay(day_last(Close), 1)) 与 r_id = log(day_last(Close) / day_first(Open)) 是新输入,隔夜漂移、拉锯强度、价格发现在哪一段是新机制。head +1.53 只用 log(day_first(Open)) 的水平(定位里 High→Low 得分不变,Open→Close 只差 0.05),本位只用比值。相关度表:保留种子与所有 head 的原始 |ρ| ≤ 0.18、残差 ≤ 0.15,与 5 个控制 ≤ 0.19;族 (2) 的 cs_bucket_rank 与 20 日反转只有 0.01–0.04,「按构造与反转控制正交」成立。LPS 2019、Berkman 等 2012 已有这个机制,所以不给 5。
      【合理度 4】逐个核对:价格后复权,两段比值跨除权日连续;停牌后第一天 ts_delay 为 NaN,不会把多日跳空当隔夜;cross_regbeta(x, y) 是 y 对 x 的斜率,所以 cross_regbeta(r_on, r_id, 60) 确实是盘中吃回多少跳空;cs_bucket_rank 的第二个参数是逐股不同的总收益,不碰陷阱 2;带符号的隔夜均值都先除以自身波动;没有成交额、波动、市值的水平或幂(种子 14 用的是开盘竞价成交额占全天的比例,水平约掉,流动性 0.03)。窗口 5 / 20 / 60 合理。文献在 2023-08-08 之前且直接研究这个切分,含 A 股(Qiao-Dam 2020、Jiang-Luo-Ye 2023-05),符合 4。不给 5:制度与客群的样本外论据说得通,但 A 股隔夜类因子在样本期内已广为人知,拥挤风险没有讨论;族 (3)(4)(种子 9–13)有一个竞争解释,开盘集合竞价价格里的暂时性噪声会机械地让 r_on 与 r_id 负相关、抬高隔夜波动占比,这是 Roll 式非流动性度量,现在与流动性 0.10–0.18、已知族 0.11–0.17 还低,GP 往外长时要盯住陷阱 3。
      【划掉】8:相关度表判为废品,cross_mean(sign(r_on), 20) 只有约 41 个取值。7:同一个 41 档的量包进 cs_bucket_rank 后 distinct 0.994,完全来自 _pct_rank 的稳定 argsort 按列序破平(补的 1e-4·_pct_rank(y) 对同值也按列序排),桶内同值块的名次就是股票列序,真实取值约 41 × 10 档;这是陷阱 2「借列序斜坡通过 distinct 门槛」。保留 1–6、9–14,共 12 个。'
