R:
  - head: 'inv(pow_3(pow_3(pow_3(LogFloatShares))))'
    why: '烂部件 1:三层 pow_3 与 inv 的包装。LogFloatShares 恒在约 16–27 之间,x>0 上 x^27 严格递增、1/x 严格递减,四个算子合起来是单调重参数化,日度截面秩与裸字段完全相同;奖励第一步就对(平滑后的)信号取秩,所以这四层在 hl=0 时不改变书。定位证据:三个充分性子树 + 一个敲除变体都在 +0.47 ~ +0.48,head 是 +0.5001,四层算子的必要性只有 +0.02,落在同一面板不同写法的离散带里;同时 x^27 在流通股最多的名字上约 2e38,离 float32 上限 3.4e38 只差不到一倍,任何加法兄弟都会被它压没,数值上是烂的。烂部件 2:叶子 LogFloatShares 是一个代理。LogFloatCap(控制之一)= LogFloatShares + log(名义股价),线性中性化扣掉流通市值后,这个 head 交易的残差主要是 −log(名义股价),即低价股;股本里与价格无关的部分只是噪声。变体:(a) 只去包装:LogFloatShares、inv(LogFloatShares);(b) 把「叶子 + 包装」换成被代理的量本身:sub(LogFloatCap, LogFloatShares)(按恒等式精确等于 log 名义收盘价)、log(day_last(Close))、二者的 20 日均值;(c) 把包装在 EMA 下唯一可能起作用的部分(时间上的凸性 ≈ 近 20 日浮股的 soft-min / soft-max)显式写出:cross_min / cross_max(LogFloatShares, 20),看它是不是装饰;(d) 把叶子换成股本结构而不是股本数量:sub(LogTotalCap, LogFloatCap) = log(总股本 / 流通股本),价格精确约掉。预期:(a)(c) 与 head 同分(包装是装饰);(b) 若高出 0.1 就用数值安全、含义直接的写法替换这个 head。'
    variants:
      - 'LogFloatShares'
      - 'inv(LogFloatShares)'
      - 'sub(LogFloatCap, LogFloatShares)'
      - 'log(day_last(Close))'
      - 'cross_mean(sub(LogFloatCap, LogFloatShares), 20)'
      - 'log(cross_mean(day_last(Close), 20))'
      - 'cross_min(LogFloatShares, 20)'
      - 'cross_max(LogFloatShares, 20)'
      - 'sub(LogTotalCap, LogFloatCap)'
