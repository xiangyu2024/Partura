slots:
  - type: N
    hypothesis: '机制(放量收益反转,Campbell-Grossman-Wang 1993;Llorente-Michaely-Saar-Wang 2002):伴随异常放量的价格变动更多是非信息性的流动性冲击(散户集中追涨杀跌、被迫交易),由逆向 / 做市资金吸收后会回吐;缩量下的价格变动更多来自信息,倾向延续。所以真正会反转的是「量加权的那部分收益」,不是整段 20 日收益。奖励的 20 日反转控制只线性扣掉等权的总收益;本位要的是它没有覆盖的交互项 cov(收益, 相对成交量) = 量加权收益 − 等权收益。
      算子实现:(1) 日尺度:在 20 / 40 / 60 日窗口里用 cross_corr、cross_regbeta、cross_mean(mul(...)) 算日对数收益(或开盘到收盘的日内收益)与成交额、或成交额相对自身 20 / 60 日的 z 分数(Gervais-Kaniel-Mingelgrin 2001 的异常放量口径,即「对这只股票自己而言异常」,不是成交额水平)的相关、斜率、协方差;协方差与斜率里的收益先除以自身 20 / 60 日波动做成无量纲。(2) 分钟尺度:同一个交互在日内复现 —— day_corr(Ret, Amt)、成交额加权与等权分钟收益之差 (day_wmean − day_mean)/day_std、最重 10% 分钟的平均收益相对全天均值 (day_topw_mean − day_mean)/day_std、净买入压力 day_signed_ratio 乘当日成交额 z 分数,再 20 日平均或 EMA。
      全部是相关系数或标准化后的无量纲量:不含成交额水平(避开流动性与已知族两个控制),不对波动做凸变换(陷阱 1),不含市值字段(陷阱 3),没有 cs_* 截面算子(陷阱 2)。与 20 日反转控制只有部分相关(估计 0.2–0.4,上涨期多伴随放量),线性中性化后剩下的正是交互项。
      与库的区别:库里唯一的 head 是静态的浮股 / 股价水平线(日度秩与 LogFloatShares 相同),不含任何收益或成交量的时间信息,预计与它 |ρ| < 0.1,输入和机制都不同。
      方向交给奖励,预期为负:收益与放量正相关(放量上涨、缩量下跌)的名字随后跑输;多头腿 = 放量下跌、缩量上涨的名字,即流动性提供的回报。
      样本外为什么还在:这是对流动性提供者的补偿,来源是 A 股散户占成交大头、T+1 与卖空受限导致的放量追涨杀跌,这些制度与参与者结构在样本期后没有改变;CGW 与 LMSW 在不同市场、不同年代都复现了「高量收益更易反转」;它和常规 20 日反转正交,不依赖一个已被广泛交易的线性反转。'
    inspired_by: 'M 第 1 批:90 个已评分候选里 28 个塌缩到同一条浮股水平线,库里只有一条静态水平轴,没有任何量价交互;文献 Campbell-Grossman-Wang 1993、Llorente 等 2002 的放量收益反转'
