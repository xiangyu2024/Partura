  - type: N
    hypothesis: '机制(彩票偏好 / 偏度定价):散户偏爱右偏(彩票型)的收益分布,愿为之支付溢价;卖空受限的 A 股里高偏度股票被持续高估、随后跑输,负偏、左尾更重的股票被低估。Amaya-Christoffersen-Jacobs-Vasquez 2015 用日内高频收益算已实现偏度,发现它显著负向预测下一周收益;Bollerslev-Li-Zhao 2020 的相对符号跳跃 RSJ = (上行已实现方差 − 下行已实现方差)/总已实现方差 同样负向;Boyer-Mitton-Vorkink 2010 用日收益的(预期)偏度。关键是偏度是三阶标准化矩,对波动的尺度不变,所以和奖励的波动控制不是同一个量(不同于 MAX 那种随波动放大的尾部指标)。
      算子实现:(1) day_skew 在 1 分钟 / 5 分钟对数收益(in_logchg(Close, 1/5),不含隔夜跳空)与 Ret 上逐日算已实现偏度,再 cross_mean / cross_med / cross_ema 平滑 20–60 日;(2) RSJ 写成 day_sum(Ret·|Ret|)/day_sum(Ret²);(3) ACJV 的偏度写成 day_sum(Ret³)/RV^1.5;(4) 尾部形状:day_es_ratio_hi 与左右尾之差;(5) 标准化的分钟 MAX:day_max(Ret)/day_std(Ret);(6) 日收益在 60 / 120 日上的偏度 ts_skew;(7) 当日振幅里位于开盘价之上的占比,作为日内上冲不对称的无量纲代理。
      全部是比值或标准化量:不对波动、成交额、市值做凸变换(陷阱 1、3),不用 cs_* 截面算子(陷阱 2)。与 20 日反转控制有部分正相关(上涨期偏度偏正),估计 0.2–0.4,线性中性化后扣掉。
      与库的区别:库里只有静态的浮股 / 股价水平线,这一族读的是收益分布的形状,预计与 head |ρ| < 0.15;也与第一个 N 位(量价交互)不是同一类输入。
      方向预期为负(多头腿 = 已实现偏度最低、左尾最重的名字)。
      样本外为什么还在:偏度溢价来自稳定的偏好(累积前景理论里对小概率大收益的过度加权),不是一次性的信息;A 股散户主导、卖空受限的套利限制在样本期后依旧;它在美股、多国样本、不同样本期都被复现;而且这里用的是尺度不变的形状量,不会因为波动环境切换而变成一个波动因子。'
    inspired_by: '库里唯一的 head 是低名义股价(低价股),文献里低价股效应与彩票偏好 / MAX 效应必须分开检验(Bali-Cakici-Whitelaw 2011);这里直接去买彩票偏好那条更一般的机制,用收益分布形状而不是价格水平'
