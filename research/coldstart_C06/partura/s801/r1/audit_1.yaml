    struck_seeds: [8]
    reasons: '创新度:库里只有一个 head inv(pow_3(pow_3(pow_3(LogFloatShares)))),方向 -1,即做多高 LogFloatShares;经 LogFloatCap 中性化后它是低名义股价(相关度表里 sub(LogFloatCap, LogFloatShares) 与它的残差 |ρ| 是 0.87),不含任何收益或成交的时间信息。本位 13 个种子与它的原始 |ρ| 全部 ≤ 0.08、残差 ≤ 0.15,与已知族 ≤ 0.24、与流动性 ≤ 0.23,不是 head 或控制换个写法。输入(日 / 分钟收益 × 成交额)与机制(放量收益的流动性回吐)库里都没有,按 §3 给 4;CGW、LMSW、Conrad-Hameed-Niden 1994 与 A 股量价相关因子都是成熟文献,所以不到 5。
      合理度:日尺度种子逐个核对过。cross_corr 是沿日轴的滚动 Pearson(dt_cross.py),窗口内去均值,所以用成交额水平也等价于相对窗口均值的放量;cross_regbeta 走 common.rolling_ols,是 y(除以 60 日波动的收益)对 x(成交额 60 日 z 分数)的斜率,符号与协方差一致;cross_zscore 含当天,对常数窗口置 0(ops_ext.py);价格字段是后复权、Amt 是原始值,跨除权日的日收益是连续的。机制清楚,算子实现了它,20 / 40 / 60 日窗口合理,给 3。
      不给 4 的原因:(1) CGW 的证据是放量日之后 1–2 天的条件反转,种子把 r×V 平均 20–60 天,文献真正支持的最近几天被 19–59 个过期日稀释;LMSW 的结论是交互项的符号随信息不对称在股票间变号(信息交易多的,放量收益延续),它支持的是分类,不是按 20 日 corr 单调排序。两者都不是这个截面排序的直接证据,也没有 train 证据。(2) 分钟尺度的种子 10、11 用当日分钟 Amt 加权,而分钟成交额有很强的开收盘 U 形,day_wmean − day_mean 的截面差异大半是开盘 / 尾盘时段收益减盘中收益,不是 GKM 意义上「相对自身历史的异常放量」;只有 13 用 cross_zscore(day_sum(Amt), 20) 做了日级去季节。(3) PI 估计与 20 日反转只相关 0.2–0.4,实测 13 个种子里 7 个在 0.45–0.54,线性秩中性化后留下的不只是交互项,还有反转的非线性残余。
      划掉 8:cross_mean(mul(r, sub(log(day_sum(Amt)), cross_mean(log(day_sum(Amt)), 60))), 20) 用的是没有除以波动的原始日收益,和本位自己写的「收益先除以自身 20 / 60 日波动做成无量纲」相反。它是有符号量、幅度正比于 σ,两端十分位都被高波动股占满,线性中性化去不掉(本位 vol |ρ| 最高的就是它,0.31),走的是陷阱 1 那种低波动从缝里漏回来的路子;它的标准化版本是 6。相关度表另外按规则划掉 6(rev 0.54)、9(0.53)、12(0.54);3 的 rev 是 0.498,贴着门槛。剩 1、2、3、4、5、7、10、11、13,共 9 个。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: [10, 11]
    reasons: '创新度:本位读的是收益分布的形状(三阶矩、上下行半方差的不对称、尾部形状),库里唯一的 head 是静态的股本 / 低名义股价水平。原始 |ρ| 0.01–0.33(5 为 0.31,8 为 0.33,其余 < 0.3);对控制取残差后,除 11 外都 ≤ 0.23,说明那 0.2–0.3 的原始相关大多经由市值传过来(size 列 0.19–0.30)。另外,head 是做多低价股,而 Kumar 2009 把低价列为彩票特征之一、预测低价股跑输,方向相反,所以本位不是 head 机制的另一种写法。输入与机制都不同,给 4;已实现偏度、RSJ、MAX 都是成熟文献,不到 5。
      合理度:逐个核对过。day_skew 是 common._skew 的有偏样本偏度,中心化,对尺度不变。6 的 Σr³/(Σr²)^1.5 是 ACJV 未中心化的已实现偏度,只差一个 sqrt(N),N≈241 近乎常数,截面秩等价。7、8 的 Σ r²·sign(r) / Σ r² 精确等于 BLZ 的 RSJ。12、13 的 ts_skew 用后复权收盘算日对数收益,跨除权日连续,是 BMV 一类的总偏度。9 的 day_es_ratio_hi − day_es_ratio_lo 是左右尾 ES / 分位比之差,即尾形的不对称,算偏度一类。这些都是无量纲量,不对波动、成交、市值做凸变换(陷阱 1、3),也没有 cs_*(陷阱 2)。机制清楚,算子实现了它,20 / 60 日平滑与文献的周到月频度量一致;再加上 2023-08-08 之前的直接文献证据(ACJV 2015、BLZ 2020、BMV 2010 正是拿这几个量做截面排序),给 4。
      不给 5:(1) 彩票溢价的文献主要报告多空价差,被高估的高偏度一腿是空头,纯多头书只拿得到低偏度一腿,而多头腿单独的强度文献里没有一致的证据;(2) A 股的分钟收益受涨跌停截尾、低价股最小价位离散的影响,已实现偏度有一部分读的是价格网格(1、2、4、5、6 与低价 head 的原始 |ρ| 在 0.21–0.31,就是这个迹象),样本外这部分会随价格结构漂移。3 的 in_logchg(Close, 5) 是逐分钟滑动的重叠 5 分钟收益,样本高度自相关,但仍是 5 分钟偏度的一致估计,保留。
      划掉 11:cross_mean(div(day_max(Ret), day_std(Ret)), 20) 与 head 的原始 |ρ| 0.55,取残差后仍有 0.53,是本位唯一残差相关过半的。241 个分钟收益的 max / std 是极值或峰度类的量,不是偏度;对低价股,它主要读的是最小价位(一跳就是很大的百分比,零收益分钟又压低 std),本质是 head 的换皮。划掉 10:cross_mean(day_es_ratio_hi(in_logchg(Close, 1)), 20) 只有右尾的 ES / 95% 分位比,是单侧尾厚,不是不对称;流动性差、价格低的名字,95% 分位就落在一跳上,这个比值读的是价位网格和流动性(本位 size 0.31、liq 0.25 都是最高),接近陷阱 3。它也就是 ops_ext 文档里说的手写 erm_* 那个量,不是彩票偏好的实现。14((High − Open) / (High − Low) 的 20 日均值)已被相关度表按 rev 0.54 划掉;它本身是日内价格在区间里的位置,跟着当日收益走,也不是分布形状。剩 1、2、3、4、5、6、7、8、9、12、13,共 11 个。'
    revise: '—'
R:
  - head: 'inv(pow_3(pow_3(pow_3(LogFloatShares))))'
    soundness: 3
    reasons: '要去的两个部件确实是烂的,而且有 train 证据。
      (1) 包装:奖励先对原值做 EMA(books.smoothed),再在 neutral_residual 里取 z 秩、对控制的 z 秩做投影,所以单调的 inv∘pow_27 只通过 EMA 起作用(时间上的幂平均,约等于近期最小股本的 soft-min)。定位拆解里三个充分性子树在 +0.47 ~ +0.48,敲除是 +0.4775,包装的必要性只有 +0.02。数值上,最大的几只 LogFloatShares 约 26.3–26.5,x^27 约 2e38–2.6e38,贴着 float32 上限;取 inv 后约 4e-39,已经是次正规数(LFS 大于约 25.4 的几只大行 / 石油股都会丢精度)。
      (2) 叶子:相关度表里 sub(LogFloatCap, LogFloatShares)(按恒等式就是 log 名义价)与 head 的残差 |ρ| 是 0.87,原始只有 0.58,证明中性化后 head 交易的就是低名义价。所以变体 3、5 正是「换成被代理的量本身」,机制清楚、实现正确,给 3。
      不给 4,下面几个问题 PI 要注意:(a) 变体 4、6 没有实现它声称的东西。立方体的价格字段是后复权的(alphacube 的 tradability.py、label.py、daily.py 都写明 price fields are back-adjusted),log(day_last(Close)) 是 log(名义价 × 累计复权因子);以上市首日为基准时,它等于 IPO 价 × 上市以来的累计总收益,不是名义股价。相关度表也对不上:它与 head 的残差 |ρ| 只有 0.30(恒等式版是 0.87),size 0.42、liq 0.46(恒等式版是 0.02、0.32)。更要紧的是它与 head 的原始 |ρ| 0.07 < 0.5,若高出 0.1,会被「收录」为新 head,而不是计划里说的「替换」,等于借 R 通道把一个和本 head 无关的长期累计收益 / 上市年龄量塞进库。(b) 变体 9 sub(LogTotalCap, LogFloatCap) = log(总股本 / 流通股本),是另一个量(限售与流通的比例),不是去掉 head 的烂部件。它与 head 的原始 |ρ| 0.53 ≥ 0.5,若高出 0.1 会走「替换」通道,用一个残差相关只有 0.27 的股本结构因子顶掉低价因子,不符合替换的本意;它该是 N 位的想法,不是 R。(c) 变体 1、2、7、8 与 head 的秩相关是 1.00,答案定位拆解已经给了(包装不起作用,分数 0.47–0.48 低于 head),不可能高出 0.1,只是重复诊断。若有重写机会,R 组只留 3、5(可以再加 sub(LogFloatCap, LogFloatShares) 的其它平滑窗口),删掉 4、6、9 和 1、2、7、8。'
summary: '两个 N 位都通过:a(放量收益交互)创新 4、合理 3,划 8;b(偏度 / 彩票)创新 4、合理 4,划 10、11。R 组合理度 3 通过,但变体 4、6 读的是后复权价而不是名义价,变体 9 不是去烂部件,有机会重写时应删掉。'
