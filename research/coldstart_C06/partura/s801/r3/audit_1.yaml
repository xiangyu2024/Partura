    struck_seeds: [2, 3, 5, 6, 7]
    reasons: '【合规】核心 day_corr(Ret, Amt) 是核心卡第 32 项,整个实验没有 E 位用过;与 5 个控制的 |ρ| 最大 0.13(rev),满足 E 位核心 < 0.5;13 个种子都原样含核心。【创新度 3】我按源码核对了 PI 的恒等式:ops_ext 的 day_wmean(x, w) = Σ|w|x / Σ|w|,Amt ≥ 0,所以 day_wmean(Ret, Amt) - day_mean(Ret) = cov(Amt, Ret) / mean(Amt),再除以 day_std(Ret) 得 X = K × CV(Amt)(只差一个 ddof 常数)。推导成立,「K 把 CV(Amt) 整除掉」是对 r2 X 族外围的实质性改进,原因也说得出(r2 的 X 外围一碰幅度就读到非流动性)。不给 4 有两条理由。一是输入仍是分钟量价协变:核心按 head 的半衰期 20 平滑后,与 head `cross_mean(cross_ema(div(sub(day_wmean(Ret, Amt), day_mean(Ret)), day_std(Ret)), 10), 15)` 的残差 |ρ| 是 0.69。二是第 (3)(4)(6)(7) 族(自相关加权、短减长 / z 分数、滞后相关、成交额 z 分数加权)就是 r2 a 位在 X 上用过的那套外围,换到了兄弟核心上;真正新的只有 (1) 的逐股时序残差和 (5) 的去全市场成分。【算子核对】cross_regres / regalpha / regbeta(x, y, d) 都是 y 对 x 的滚动 OLS(common.rolling_ols),种子 1 / 5 / 6 / 11 的方向写对了;cs_regres(Y, X) 是 Y 对 X 的截面残差,种子 2 写对了;cs_bucket_rank(y, x) 是 y 在 x 的十分位内部的秩,种子 3 / 4 写对了;cross_autocorr_s1 = cross_autocorr(x, d, 1);cross_zscore 的窗口含当天;day_corr 是整行 NaN 安全的皮尔逊相关,至少要 2 个有效点。种子 11 的 cs_mean(K) 只作逐股时序回归的自变量,不进 _pct_rank,不是陷阱 2。【划掉 2、3、5:读 K 水平的方向中性写法】相关度表推翻了第 (1)(2) 族的前提。PI 说 K 的平滑水平「有一半在读近期涨没涨」,可核心与 20 日反转只有 0.13。去掉方向之后,种子 2 / 3 与 head +0.61 的原始日度秩仍是 0.68 / 0.68,残差 0.72 / 0.74。种子 5(cross_regalpha,即扣掉方向后的 60 日 K 水平)原始 0.73(表也会划它),残差 0.80。这三个是 head +0.61 的水平换了个写法,子代只要稍加长平滑就会撞上 0.7 的库禁令,白耗评估。【划掉 6、7:等于 |K|】按 PI 自己的论证,K 与当天收益机械同号,所以 K × sign(日收益) ≈ |K|;cross_regbeta(sign(日收益), K, 60) ≈ (上涨日 K - 下跌日 K)/2,主要也是与方向对齐的 K 的幅度。这正是本位算子约束明令禁止的 |K|:稀疏股票的 K 由几分钟决定,幅度读到的是非流动性(陷阱 3)。表上的证据:核心与 liq / known 只有 0.02 / 0.03,种子 6 跳到 0.27 / 0.25,种子 7 跳到 0.24 / 0.24。【留下 8 个:1、4、8、9、10、11、12、13】与所有 head 的原始 |ρ| ≤ 0.28,与控制 ≤ 0.35;窗口(60 日回归 / 自相关,5–20 日平滑)合理。种子 1 和 11 取 10 日均值后,近似等于「近 10 日 K 减去 60 日拟合的截距」,与种子 9 / 10 同属短减长,不冲突。种子 4 的残差 0.64 是留下的里面最接近 head 的,属于边缘,保留。【合理度 3,不给 4】核心自身在 train 上的证据弱:含它的 16 个候选平均 -0.13;最好的 +0.44 是 cross_mean(div(cross_ema(K, 10), day_std(Ret)), 15),分数里还掺着 ÷day_std(Ret) 带来的反波动成分。所引文献(Karpoff、BEO、LMSW、Chordia-Subrahmanyam、GKM)支持的是日度成交量和订单失衡,不是分钟 ret–amt 相关在截面上的预测力。七族里有两族(第 (1) 族读水平的部分、第 (2) 族)没有实现它声称的东西。【提醒下游复核】库禁令看原始日度秩,奖励却按半衰期平滑:未平滑的 K 与 head +0.61 原始只有 0.08,平滑后残差就到了 0.69。GP 的产出如果只是 K 的短平滑水平,能过禁令,交易的却是 head +0.61;复核时按残差 |ρ| 判它不新。'
    revise: '—'
  - slot: b
    novelty: 4
    soundness: 4
    struck_seeds: []
    reasons: '【创新度 4】13 个 head 里没有一个用到 in_slice、day_centroid 或任何日内时点,最接近的也只是隔夜 vs 整个盘中(+0.76 / +0.65)。相关度表里 14 个种子与所有 head 的原始 |ρ| 都 < 0.3:最高的是种子 4 与 head +0.76 的 0.28,开盘段成交占比本来就和隔夜跳空的波动有关,说得通;残差 ≤ 0.20,与控制 ≤ 0.35。输入(时段切片的成交占比、成交重心、分段收益)和机制(时段客群与撮合方式)都不在库里。但时段结构在文献里早有(Admati-Pfleiderer 1988、Heston-Korajczyk-Sadka 2010、Bogousslavsky 2016),所以给 4 不给 5。【算子核对】in_slice(x, a, b) = x[:, a:b+1],含两端(dt_in.py)。V2 网格上 index 0 = 09:30 竞价,211–240 = 14:31–15:00,238–240 = 收盘竞价段,PI 的约定与 in_half 的注释一致。day_centroid = Σ t|x_t| / Σ|x_t| / (T-1),T 取切片后的长度,所以 in_slice(Ret, 1, 240) 上同样归一到 [0, 1]。成交占比是同一天的比值,成交额的水平约掉了。带符号的分段收益一律除以同段的 60 日标准差。cross_regbeta(隔夜收益, 开盘 30 根收益, 60) 是开盘 30 根对隔夜的斜率,方向写对了。cs_bucket_rank 的第二参数(30 日成交额、20 日收益)逐股不同,不碰陷阱 2;没有 pow / signedpower,不碰陷阱 1。【合理度 4】机制清楚,算子实现了它,窗口合理。2023-08 之前有截面文献:Berkman 等 2012(开盘的注意力买入随后回落)、Bogousslavsky 2016(收盘前机构交易造成的季节性)、HKS 2010(时段收益的截面延续)。train 上也有 PI 引用的本组 r2 R 组切片结果:head +0.61 只留中段后 train 掉到 -0.13,不过这只说明这一族的信息在一天的两端。【不给 5 的三处,复核时要留意】(i) 标签是 open_vwap15,在 t+1 日 09:31–09:45 的 VWAP 进场。Carhart 等 2002 式的「收盘抬价、次日开盘回吐」发生在进场之前,书拿不到;种子 5 / 13 / 14 如果只靠这一点,不会有分。(ii) 沪市 2018-08-20 引入收盘集合竞价后,沪市股票的尾盘成交占比和成交重心整体跳升。种子 1 / 3 / 12(以及 10)的 60 日自身 z 分数或偏离,在此后约 60 个交易日里会变成一个「沪 vs 深」的交易所哑变量。PI 只对种子 13 提到了这个断点。这段只占 train 约 6%,不致命,但要看产出是否集中在 2018Q3 得分。(iii) 种子 2 与波动控制的 0.35 是 14 个里最高的:成交重心的水平即使在同一流动性十分位内部,仍带着规模 / 波动的客群成分。种子 9 与 liq / known 是 0.21 / 0.21:开盘 30 根对隔夜跳空的回吞斜率,有一部分是竞价价格噪声的回复(Roll 式的非流动性)。这些都在门槛之下,不划。【不划种子】没有 head 的换皮,没有陷阱写法,每个种子都在时段这条轴上。'
    revise: '—'
R:
  - head: 'div(cross_stddev(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 10), cross_stddev(cross_stddev(log(div(day_last(Close), day_first(Open))), 60), 60))'
    soundness: 4
    reasons: '(a) 10 日窗口确实是烂部件,依据是定位里已付费的窗口阶梯:cross_stddev@5 / 10 / 20 = +0.52 / +0.76 / +0.93,单调上升;10 个样本的标准差相对误差 1/√20 ≈ 22%,这个论证也对。变体 1 正是定位给出的 +0.9312(增益 +0.17),与原 head 原始 0.88、残差 0.98,与已知族 0.13,走替换通道。变体 2(40 日)是有用的判别:阶梯继续上升,说明它读的是隔夜波动的水平。(b) 开盘竞价价格的暂时性噪声,是 r2 审计提出过的竞争解释(Roll 式非流动性,陷阱 3 的方向)。变体 3 / 4 是对它的直接检验,与原 head 原始 0.81 / 0.71,仍在替换通道,两段拼起来仍是收盘到收盘,口径一致。有一处保留:把 09:35–09:39 的 VWAP 均值当作隔夜一段的终点,会把开盘后 5–9 分钟这段最剧烈的连续竞价波动并进「隔夜」。所以变体 3 若塌掉,不能全归于竞价噪声;用更窄的终点(例如 bar 1–3)会更干净。'
  - head: 'div(cross_stddev(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 10), cross_stddev(log(div(day_last(Close), day_first(Open))), 60))'
    soundness: 3
    reasons: '窗口 10 → 20 的理由是从 +0.76 的窗口阶梯类推来的,+0.65 自己的阶梯没有测过。10 日标准差的抽样误差论证同样适用,只花 1 次评估,值得一试;变体与原 head 原始 0.72、残差 0.95,走替换通道没有问题。但 PI 说两个 head「是同一个东西」不对:分母一个是盘中收益的 60 日标准差(波动的水平),一个是它的 60 日标准差(波动的波动)。相关度表里 R1 变体 1 与 +0.65 只有 0.43,本组变体与 +0.76 只有 0.46,两者是不同的 head,不能借 +0.76 的阶梯当作 +0.65 的直接证据,所以给 3 不给 4。'
  - head: 'cross_mean(cross_ema(div(sub(day_wmean(Ret, Amt), day_mean(Ret)), day_std(Ret)), 10), 15)'
    soundness: 3
    reasons: '依据是 PI 引用的本组 r2 付费切片评估:只留 31–210 后 train 从 +0.61 掉到 -0.13,说明 train 上的信息不在中段,这是真证据。但同一变体的 valid 是 +2.15,所以「中段是烂部件、在稀释两端」只在 train 上成立;score 取两段中较差的,去掉中段可能换来 valid 下降。三个变体的写法都对:Ret 与 Amt 同样切片,day_wmean / day_mean / day_std 口径一致。两点保留。(i) 变体 1 与 2 只差 index 0 那一根,表上两者与原 head 是 0.525 / 0.529,各控制完全相同,说明竞价那一根几乎不改变 X;这次判别大概率给不出区别,算半个冗余的评估。(ii) 只有 30 根时,稀疏股票的 day_std 会被零收益分钟压低,X 的幅度会读到非流动性(r2 R 组 day_wstd 变体针对的就是这个问题);变体 1 / 2 与 liq / vol 是 0.10 / 0.17,目前还不高。变体 3 与原 head 只有 0.36,若过线,走的是收录而不是替换。'
summary: 'a 位(K 的 E 位):创新 3 / 合理 3,划掉读 K 水平的 2、3、5 和实际等于 |K| 的 6、7,留 8 个,通过;b 位(日内时段 N 位):创新 4 / 合理 4,不划,通过;三组 R 的合理度 4 / 3 / 3,全部通过。'
