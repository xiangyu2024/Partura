  - head: 'div(cross_stddev(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 10), cross_stddev(log(div(day_last(Close), day_first(Open))), 60))'
    why: |-
      head +0.65 就是 head +0.76 去掉分母外层 cross_stddev(·, 60) 的版本(定位里 +0.76 的这一敲除恰好得 +0.6474,必要性 +0.12),两个 head 是同一个东西。它的烂部件与 +0.76 相同:分子 10 日窗口落在单调上升的阶梯中段(+0.76 的阶梯 5 / 10 / 20 = +0.52 / +0.76 / +0.93),10 日标准差相对误差约 22%。变体把窗口改为 20,其余不动;≥ +0.75 且与原 head ρ ≥ 0.5 时替换,库里这一行换成噪声更小的写法。
