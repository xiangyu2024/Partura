R:
  - head: 'div(cross_stddev(log(div(day_first(Open), ts_delay(day_last(Close), 1))), 10), cross_stddev(cross_stddev(log(div(day_last(Close), day_first(Open))), 60), 60))'
    why: |-
      head +0.76(隔夜收益 10 日标准差 ÷ 盘中收益 60 日标准差的 60 日标准差)有两个可疑部件,各用定位输出里的证据。
      (a) 分子的 10 日窗口:定位窗口阶梯 cross_stddev@5 / 10 / 20 = +0.52 / +0.76 / +0.93,单调上升,10 日落在坡上而不是峰上;10 个日收益的样本标准差相对误差约 1/√(2·10) ≈ 22%,20 日约 16%,10 日窗口在给分子加噪声。变体 1 把窗口改为 20(定位已付费:score +0.9312,train +0.93 / valid +1.46,与原 head ρ 0.98,与已知族 -0.13),按规则走替换。变体 2 把窗口推到 40,是判别:阶梯继续上升 → 读到的是隔夜波动的水平(期限比),回落 → 10–20 日是真的时间尺度;它若也 ≥ 原 head + 0.1,同样走替换。
      (b) 开盘价本身:r2 审计意见给过竞争解释 —— 开盘集合竞价价格里有暂时性噪声,会机械地抬高隔夜收益的波动(Roll 1984 式的非流动性,陷阱 3);Amihud-Mendelson 1987 也报告开盘(竞价)收益离散度更大、一阶自相关更负。变体 3 把隔夜一段的终点从 day_first(Open) 换成 09:35–09:39 五根分钟 VWAP 的均值 day_mean(in_slice(Vwap, 5, 9)),绕开竞价;变体 4 把盘中一段的起点也换到同一点,两段仍然拼成收盘到收盘。二者都用 20 日窗口,与变体 1 直接对比:保住 → 隔夜信息是真的,并换成更干净的写法;塌掉 → 这个 head 主要是竞价噪声,写进报告。四个变体都保留「隔夜波动 ÷ 盘中波动」这一机制,与原 head 的 ρ 预计 ≥ 0.5。
