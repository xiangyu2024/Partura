  - head: 'cross_mean(cross_ema(div(sub(day_wmean(Ret, Amt), day_mean(Ret)), day_std(Ret)), 10), 15)'
    why: |-
      烂部件是中段 180 根分钟,依据是本组 r2 自己在 train 上的付费评估:把分钟窗口切成 in_slice(·, 31, 210)(只留中段)后 train 从 +0.61 塌到 -0.13(valid +2.15),换平滑或分母的四个变体 train 都在 +0.34 ~ +0.44 —— 中段对 train 分数没有贡献,反而在稀释两端。三个变体只保留一端,平滑 (10, 15) 不变,以便与原 head 直接比:变体 1 = 1–30(09:31–10:00,连续竞价的头半小时,不含竞价那一根);变体 2 = 0–30(再加上 09:30 开盘集合竞价那一根);变体 3 = 211–240(14:31–15:00,含收盘集合竞价)。变体 1 与 2 只差 index 0 那一根:若 2 明显高于 1,这个 head 在 train 上的信息来自竞价那一根(竞价成交额的大权重 × 那一根的收益),那它和隔夜一支是同一件事;若 3 最好,读法是尾盘的机构执行流。Ret 与 Amt 同样切片,day_wmean / day_mean / day_std 口径一致。与原 head 的 ρ 预计 0.5–0.7,高出 0.1 时走替换,换进来的是机制说得清的单一时段版本。
    variants:
      - 'cross_mean(cross_ema(div(sub(day_wmean(in_slice(Ret, 1, 30), in_slice(Amt, 1, 30)), day_mean(in_slice(Ret, 1, 30))), day_std(in_slice(Ret, 1, 30))), 10), 15)'
      - 'cross_mean(cross_ema(div(sub(day_wmean(in_slice(Ret, 0, 30), in_slice(Amt, 0, 30)), day_mean(in_slice(Ret, 0, 30))), day_std(in_slice(Ret, 0, 30))), 10), 15)'
      - 'cross_mean(cross_ema(div(sub(day_wmean(in_slice(Ret, 211, 240), in_slice(Amt, 211, 240)), day_mean(in_slice(Ret, 211, 240))), day_std(in_slice(Ret, 211, 240))), 10), 15)'
