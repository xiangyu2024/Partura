  - type: N
    hypothesis: |-
      【新 idea】A 股的交易日在时段上是结构化的:不同时段的成交由不同的参与者、不同的撮合机制产生。库里 13 个 head 没有一个用到「一天里的什么时候」—— 没有 in_slice、in_index、day_centroid;+0.76 / +0.65 只把一天切成「隔夜 vs 整个盘中」两段。本位把盘中再切到时段一级。
      分钟轴的约定(dt_in.in_half 的注释与 synthetic 的 V2 网格):index 0 = 09:30 开盘集合竞价那一根,1–120 = 上午 09:31–11:30,121–240 = 下午 13:01–15:00;211–240 = 14:31–15:00,238–240 = 14:58–15:00(收盘集合竞价段,深市一直如此,沪市自 2018-08-20 起)。in_slice(x, a, b) = x[:, a..b](含两端)。
      - 开盘段:隔夜信息的集中消化与散户的注意力驱动下单(Berkman 等 2012:散户在开盘集中买入,把开盘价推高,随后盘中回落;Barber-Odean 2008:个人投资者是注意力驱动的净买方)。
      - 尾盘段:机构执行、指数与基准相关的交易集中在收盘前(Bogousslavsky 2016:不频繁再平衡让收盘前的交易与收益呈日内季节性;Carhart-Kaniel-Musto-Reed 2002:收盘前抬价、次日回吐;Han-Zhao-Chen-Guo 2022:沪市引入收盘集合竞价后成交从连续竞价挤进竞价段,小盘股最明显)。
      - 中段成交稀、信息少(Admati-Pfleiderer 1988 的 U 形)。

      【train 上的直接证据(本组自己的付费评估)】r2 R 组把 head +0.61 的分钟窗口切到 31–210(去掉开盘 31 根、尾盘 30 根),train 从 +0.61 塌到 -0.13(valid +2.15),而只改平滑或分母的四个变体 train 都还在 +0.34 ~ +0.44。也就是说这一族的信息在 train 上几乎全部在一天的两端;一天的哪一段在交易,本身就是信号的一部分。

      【算子怎么实现,五族,全部无量纲,不读成交额或波动的水平】
      (1) 成交发生在什么时候:day_centroid(Amt) = Σ t·|Amt_t| / Σ|Amt_t| / (T-1) ∈ [0, 1](ops_ext),成交额的时间重心;尾盘 30 根、开盘 31 根(含竞价那一根)的成交额占全天比例 day_sum(in_slice(Amt, a, b)) / day_sum(Amt) ∈ [0, 1]。都取相对自身 60 日历史的偏离或 z 分数:异常地把成交挪到尾盘 = 机构在执行,挪到开盘 = 注意力。重心的水平只以 cs_bucket_rank(·, cross_mean(day_sum(Amt), 30)) 出现,即在同一流动性十分位内部比较:大盘股的收盘竞价占比天然更高,不这样做,水平就会读到规模 / 流动性(陷阱 3)。
      (2) 分时段收益相对同段自身波动:尾盘 30 根收益、开盘后 30 根收益(1–30,不含竞价那一根,免得读到隔夜跳空)、收盘竞价那几根(238–240)的 10 / 20 日均值除以同段 60 日标准差(t 值形式,无量纲)—— 尾盘抬价或打压、开盘注意力冲击、收盘竞价的价格压力会不会回吐。尾盘那一个再放一份 cs_bucket_rank(·, 20 日总收益),按构造与反转控制正交。
      (3) 时段之间的逐股关系(60 日):开盘 30 根收益与当天其余时间收益的相关、与尾盘 30 根收益的相关(Gao-Han-Li-Zhou 2018 的「首半小时预测末半小时」做到个股层面;Lou-Polk-Skouras 2019 的隔夜 / 盘中拉锯切到时段一级;Heston-Korajczyk-Sadka 2010 把一天切成半小时段研究截面延续),以及开盘 30 根收益对隔夜跳空的回归斜率 cross_regbeta(隔夜收益, 开盘 30 根收益, 60)(跳空在开盘半小时里被吃回多少;读的是方向,不是 +0.76 那样的波动比)。
      (4) 价格在什么时候动:day_centroid(in_slice(Ret, 1, 240))(|分钟收益| 的时间重心,去掉竞价那一根)的 60 日 z 分数 —— 信息是不是异常地集中在尾盘到达。
      (5) 两段的资金行为:尾盘 30 根与开盘 30 根的分钟量价相关之差(20 日均值);尾盘收益方向 × 尾盘成交占比的自身 z 分数(10 日均值)。

      【和库里已有的不同】输入(in_slice / day_centroid 切出的时段量)库里没有;机制(日内时段的客群与撮合方式)库里没有。+0.76 / +0.65 是隔夜 vs 全天盘中的波动比,+0.61 / +0.91 / +0.51 是全天的资金流倾斜,DW 族是全天的已实现方差。

      【为什么样本外还在】时段结构由交易所规则决定 —— 开盘 / 收盘集合竞价、T+1、午休 —— 2023-08-08 之后没有改变。沪市收盘竞价的制度断点(2018-08-20)在 train 内部,valid(2022-01 ~ 2023-08)完全在断点之后;score 取 train 与 valid 的较差者,能过线的东西必须在两种制度下都成立。占比与重心都相对自身历史(或在流动性十分位内部),不依赖某一时期的截面水平。散户开盘、机构尾盘是 A 股参与者结构的长期特征(Jiang-Luo-Ye 2023 用客群解释 A 股因子溢价在隔夜与盘中的差别)。方向不写死,交给奖励。

      【事先写明的失败模式,供复核】(i) GP 拿到 day_sum(in_slice(Amt, …)) 这个零件,可能往分段成交额的水平或幂上爬(r1 b 位就是这样离开指定的轴、长成 1/V⁶ 的),产出若是成交额水平 / 幂,按陷阱 3 判废;(ii) 分段收益是日收益的一部分,长平滑会读到反转,所以带符号的收益全部先除以同段自身波动,另放了按 20 日收益分桶的写法;(iii) 238–240 那几根在沪市 2018-08 之前是连续竞价,含它的种子在 train 前 8 个月含义不同,只放一个。
