  - type: E
    core: 'day_corr(Ret, Amt)'
    hypothesis: |-
      【核心是什么】K = day_corr(Ret, Amt):当天 241 根分钟 bar 上「分钟收益」与「分钟成交额」的皮尔逊相关,有界于 [-1, 1],没有量纲。K > 0 = 当天的钱落在上涨的分钟里,K < 0 = 落在下跌的分钟里。它是定位共性表 / 核心卡第 32 项(16 个已评分候选含它,含 / 不含的均值 -0.13 / -0.89,均值差 +0.76,p 0.027);它的 EMA(10) 是核心卡第 31 项(10 个候选,均值差 +0.94,p 0.028)。整个实验还没有任何 E 位用过它。

      【为什么是它,而不是库里已有的资金流倾斜】本种子三个资金流 head(+0.61、+0.91、+0.51)的日度内核都是 X = (day_wmean(Ret, Amt) - day_mean(Ret)) / day_std(Ret)。day_wmean(x, w) = Σ|w|x / Σ|w|(ops_ext),所以 Σ(w_i/W)r_i - r̄ = cov(w, r) / w̄,X = corr(Ret, Amt) × sd(Amt) / mean(Amt) = K × CV(Amt)(差一个 n/(n-1) 常数)。CV(Amt) 是日内成交额的变异系数,是非流动性;r2 审计意见已经指出「凡是取 X 幅度或尾部的外围都会把它重新暴露出来」,r2 a 位种子 11 与流动性 0.51 被划就是证据。K 把 CV(Amt) 按构造整除掉,只留下量价同期协变的方向,即价格冲击 / 知情交易不对称的那一半(Karpoff 1987 综述:成交量与价格变化的关系不对称;Blume-Easley-O'Hara 1994:成交量携带价格本身不含的、关于信号质量的信息)。

      【这个核心已经见过的外围,以及它们的问题】只有纯时间平滑:cross_mean(K, 20)(r1 相关度表里与 20 日反转 0.53,被划,没有评估过)、cross_ema(K, 10)(与反转 0.45)、cross_mean(div(cross_ema(K, 10), day_std(Ret)), 15)(r1 a 位第 4 名,train +0.44)。K 的平滑水平有一半是在读「近期涨没涨」:上涨日里放量的分钟本来就多是上涨的分钟,K 机械地与当日收益同号。奖励对 20 日反转做线性中性化,会把这一块连同一部分信号一起扣掉。所以本位的外围全部去问 K 里与当天价格方向无关的那部分、或 K 的动态,不再读 K 的水平。

      【外围做的事,七族】
      (1) 去方向的量价协变(承接 / 派发):下跌日里钱仍落在上涨的分钟 = 有人在承接,上涨日里钱落在下跌的分钟 = 有人在派发。三种互相独立的实现:逐股 60 日时间序列回归残差 cross_regres(日收益, K, 60) 的 10 日均值(cross_regres(x, y, d) 是 y 对 x 的滚动 OLS 在当天的残差,AlphaCube common.rolling_ols);逐日截面回归残差 cs_regres(K, 日收益) 的 20 日均值;K 的 20 日 / 5 日均值在同期 20 日 / 5 日总收益十分位内部的秩 cs_bucket_rank(·, 同期总收益)(第二个参数逐股不同,不碰陷阱 2;按构造与反转控制正交,r2 b 位同一写法与反转只有 0.01–0.04)。
      (2) 按方向分解的逐股回归:cross_regalpha(sign(日收益), K, 60) 是 K 对当日涨跌符号回归的截距,即扣掉方向之后这只股票的量价协变水平;cross_regbeta(sign(日收益), K, 60) 是斜率,约等于(上涨日平均 K - 下跌日平均 K)/ 2,即成交量是否「确认」价格方向(BEO 1994);cross_mean(K × sign(日收益), 20) 是同一个量的简单写法。
      (3) 持续性:近 10 日 K 均值乘 K 自己的 60 日一阶自相关(cross_autocorr_s1)。机构拆单使订单失衡正自相关并正向预测收益(Chordia-Subrahmanyam 2004);自相关为负(流动性交易为主)的股票,乘积自动反号。
      (4) 相对自身常态的异常:cross_zscore(K, 60) 的 5 日均值、5 日均值减 60 日均值(Gervais-Kaniel-Mingelgrin 2001 的口径:冲击按股票自己的常态定义),扣掉股票固有的、慢变的量价协变水平。
      (5) 去掉全市场共同成分:逐股 K 对当日全市场平均 K 的 60 日时间序列回归残差 cross_regres(cs_mean(K), K, 60) 的 10 日均值(Hasbrouck-Seppi 2001:订单流有共同因子,个股特有的那部分才是个股信息)。cs_mean 是逐日截面常数,只作为逐股时间序列回归的自变量,不进入任何 _pct_rank,不是陷阱 2 的用法。
      (6) 逐股的信息性:cross_corr(昨天的 K, 今天的隔夜收益, 60):这只股票盘中的量价协变能否领先于隔夜的重新定价(Llorente-Michaely-Saar-Wang 2002:量价关系按信息交易 / 对冲交易在股票之间分类)。
      (7) 异常放量日加权:cross_mean(K × cross_zscore(day_sum(Amt), 60), 20)。成交额只以相对自身 60 日历史的 z 分数出现(含当天时 |z| ≤ √59),不读截面水平(GKM 2001 的高成交量日)。

      【算子约束,也是复核产出的口径】不对成交额、波动取幂;不取 |K|、K 的尾部或 K 的滚动标准差(稀疏股票的 K 由少数几分钟决定,幅度与离散度会读到非流动性,陷阱 3);不用 log 作用于可正可负的量(源码里 log 是 log|x|,r2 的 +0.91 就建立在它上面);cs_* 只作用于逐股不同的量。

      【和库里已有的不同】13 个 head 里没有一个含 day_corr(Ret, Amt);三个资金流 head 都经由 X 含 CV(Amt),而且读的是 X 的平滑水平(+0.61)或「倾斜幅度 × 当日波动」的 120 日逐股耦合(+0.91 / +0.51);没有一个以当天的价格方向为条件,也没有一个去掉全市场共同成分。

      【为什么样本外还在】(a) K 是两条日内序列的相关系数,有界,对成交额和波动的水平不变;2018–2023 全市场成交额和波动的大幅漂移不进入信号,样本外的状态漂移同样不会。(b) 去方向的外围按构造不借反转溢价的分数:奖励里的反转控制和它没有可扣的线性部分,样本内的分数不来自控制的残余,也就不会在反转溢价变化时一起消失。(c) 承接 / 派发、拆单、T+1 与卖空受限下散户与机构的成交结构,在 2023-08-08 之后没有改变。方向不写死,交给奖励。

      【事先写明的失败模式】K 的水平本身弱(含它的候选平均 -0.13,平滑后最好 +0.44),这一位可能颗粒无收;第 (7) 族给了 GP day_sum(Amt) 这个零件,若产出长成成交额的水平或幂,按陷阱 3 判,不当发现。
