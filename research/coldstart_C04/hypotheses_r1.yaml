- id: H4_nominal_price_illusion
  hypothesis: >-
    同样市值下名义(未复权)股价高、也就是总股数少的股票随后跑赢;
    投资者高估低价股的上行偏度,为名义便宜多付钱。
  thesis:
    mechanism: >-
      谁跑赢:同样市值下名义股价高的股票 —— 多头腿是高价股,不是低价股。
      恒等式 RP = LogFloatCap − LogFloatShares = log(未复权收盘)(E1 的 E-n 实测它与直接对未复权价取对数的差在
      1e-6 量级,是两条 float32 量化路径的差,不是模型误差)。
      机制:名义价格幻觉 —— 投资者把低价股当作「便宜」和「有上行空间」,高估它的上行偏度并为此多付钱,
      于是低价股的预期收益被压低(Birru–Wang 2016;先验)。股价的名义水平在同等市值下只反映股数这一个会计选择,
      按理不该定价,所以它是一个纯粹的行为偏误度量。
      为什么它适合纯多头:做多端是高名义价格股,而幸存者偏差抬高的是低价一侧(库里 5207 只股票全部存续到末日、
      没有退市股),所以本卡在样本内的证据偏保守 —— 真实效应应当比读数更强,而不是更弱。
      名义价格的截面排序是慢变量(截面离散约 0.7 个对数单位,日变动约 0.03);但它不是「只在除权日跳变」—— 未复权价每天随收益变动,
      而且 C03 的 B2 实测 log(Close) 这类价格水平残差化后换手 0.055(对 20 日反转取残差把价格的日变动带了回来),
      所以本卡的成本优势有限(总领审定时改了原文「只在除权日跳变、换手最低」的说法)。
      在市值被线性中性化之后,「同市值下名义价格高」与「同市值下股数少」是同一个量(log 价 = log 市值 − log 股数),
      本轮没有能把名义价格幻觉与股本结构分开的第二种构造。
    counterparty: >-
      按「每股多少钱」而不是按市值判断贵贱的散户,以及偏好低价股彩票属性(小面值、高名义上行空间)的交易者:
      他们为低价股的名义便宜支付溢价,把收益让给愿意买高价股的一方。
    prediction: >-
      方向 +1。最关键的一条是字段口径核对:v6 与 v1 的 score、方向、换手几乎相同(|Δscore| < 0.1)的概率 80% ——
      v6 用分钟数据拼的未复权 VWAP(day_sum(Amt) / day_sum(Volume))做同一件事,不成立就说明 RP 不是未复权价,
      H1 / H2 / H3 的恒等式也要一起重判。
      v8(后复权价格水平)< v1 的概率 60%:C03 的直接检验里后复权价格水平中性化后是 −0.90,而未复权价从没测过。
      v9(刻度)被与已知族的 ρ 拒,或低于 core 的概率 70%(C03 测过同一条,ρ已知 = +0.57,被拒过一次)。
      至少一个 core ≥ 0.5 的概率 12%。
      换手(总领审定时改):按 C03 的 B2,残差书换手的下限约 0.03,价格水平类残差化后约 0.05,所以预期 v1 在 0.03–0.06、v11 略低;
      只有 v1 的换手 > 0.08 才说明读到的不是价格水平。
      v4 / v5(股数本身,未经市值中性化的原始写法)被与已知族的 |ρ| ≥ 0.5 拒的概率 40%:股数少 ≈ 流通盘小 ≈ 成交额小,
      而已知族做多的正是分钟成交额离散度低的股票;v1(同市值下的价格)不在这条线上。这条拒绝本身是读数。
    fails_if: >-
      (a) core 选 −1(做多低价股):与机制相反。而且做多低价股的多头腿同时吃幸存者偏差与粗刻度筛选两份红利,
      所以反向过线按统一判据 (c) 只记为发现,绝不能说成「发现了名义价格幻觉的反面」。
      (b) v9 ≥ core,或 core 被与已知族的 ρ 拒:读到的是价格刻度 / 一价日筛选(C01 的 day_distinct_ratio 一族),
      不是名义价格幻觉。
      (c) v6 与 v1 不一致(|Δscore| ≥ 0.1 或方向相反):字段口径有问题,RP 不是未复权价。
      例外(总领审定时加):若 Volume 的单位在板块之间不同(手 / 股),v6 会带一个按板块的常数偏移(log 100),
      那是分钟成交量的口径,不是市值字段的问题 —— 先查这一条,再判 RP。
      (d) v2 或 v10 比 v1 掉一半以上:读到的是非线性市值或波动暴露。
      (e) v4 / v5 远高于 v1(例如 v4 ≥ 0.5 而 v1 < 0.3):奖励对市值只做线性中性化,做功的是「股数 / 市值」排名的非线性部分,
      那更像小盘或股本结构,机制陈述要改写。v4 / v5 ≈ v1 是恒等式的预期(总领审定时改:原文「v4 / v5 ≥ v1 即判否」
      在市值中性化之后几乎必然触发,判不出任何东西)。
      (f) 本卡只有一个构造:v2 / v3 / v10 是 v1 的中性化孪生,v11 是窗口孪生,v6 是字段核对。按统一判据 (a),
      本卡即使过线也只能记「信号存在」,不能记「名义价格幻觉成立」(总领审定时加)。
  novelty: >-
      C01–C03 只有后复权价格,没有未复权价:C03 的直接检验测过 log(day_last(Close))(中性化后 −0.90),
      E2 在 6940 行去重存档里检索「用 Amt / Volume 拼未复权价」只命中 1 条(score −0.68,而且是包在分钟形状里的
