- id: H3_unlock_pressure_reversal
  hypothesis: >-
    近 60 个交易日流通股比例上升(限售股解禁)、而且股价已经跌下来的股票随后回补;
    解禁本身预期在空头腿,纯多头的利润只在「卖压已兑现 × 已下跌」这个交互项上。
  thesis:
    mechanism: >-
      谁跑赢:近 60 个交易日内流通股比例明显上升(解禁)、并且这段时间股价已经跌下来的股票 ——
      多头腿是「砸完了的解禁股」,不是解禁股本身。恒等式 FR = LogFloatCap − LogTotalCap = log(流通股 / 总股本):
      解禁使 FR 上升,定增与股权激励授予使它下降,送转不改变它(E1 的 E-j 实测:解禁股票给出 +log(1/0.6) 并在 60 日窗内保持、
      出窗归零;等比例变动的股票 ΔFR 恒为 0)。U60 = ΔFR + |ΔFR| 只留上升部分(×2),
      E1 的 E-k 实测它把下降一侧(定增)精确截成 0。
      核心是 U60 ×(−60 日收益):解禁带来的卖压是非信息性的(锁定期到期、流动性需求),
      压力兑现之后价格回补(Shleifer 1986 需求曲线向下;Field–Hanka 2001 解禁日前后的价格压力;
      Campbell–Grossman–Wang 1993 非信息交易引起的反转;全部是先验)。
      为什么必须是交互项:单看解禁,原始股东的持续减持多半占主导,利润在空头腿(v5 预期选 −1),
      纯多头口径拿不到;只有「已经跌下来」这个条件把卖压已兑现的那一端挑出来,利润才在多头腿。
      rev20 已在奖励的控制里被线性拿掉,而线性控制拿不走交互项。
    counterparty: >-
      解禁后急于减持的原始股东与定增方:他们的卖出不含关于基本面的新信息,只是锁定期到期与流动性需求,
      为换手付出价格折让;以及在解禁公告期跟随抛售的资金。收钱的是愿意在卖压兑现后承接并等几周的一方。
    prediction: >-
      方向 +1。v1 / v2 选 +1 的概率 65%;v5(解禁本身)选 −1 的概率 55%;v11(60 日反转)< v2 的概率 60%;
      v6 < v2 的概率 60%。至少一个 core ≥ 0.5 的概率 20%。
      门槛风险是本卡最可能的失败方式,要先读再读分数:任意 60 日窗口内有解禁的股票应远不到一半,
      而 ΔFR 对无事件股票在玩具数据上是精确 0(E1 的 E-j / E-k 噪声底都是 0,不是 1e-6 噪声),
      所以 v1 / v3 / v4 / v5 对多数股票可能精确为 0,离散度 < 0.5 而被直接检验判门槛废品
      (E1 Q6(ii):70% 为常数 → 离散度 0.301)。这个判废本身是读数:它说明 FR 的事件覆盖面,也说明
      GP 端(覆盖率只要 0.5、离散度同样要 0.5)会同样挡掉这一族,所以 W2 的种子要用带底座的写法。
      总领审定时加的保留:「精确 0」只在玩具数据的全流通股票上核过。真实库里 LogFloatCap 与 LogTotalCap 是两个各自舍入的 float32 对数
      (量级约 23,一个 ulp 约 1.9e-6),流通 < 总股本的股票的 FR 逐日带 ±1–2 个 ulp 的抖动;但这层抖动落在网格点上、是并列值,
      不产生不同取值(本地模拟:ΔFR(60) 离散度 0.001、U60×(−R60) 0.10、FR − 一年均值 0.10),所以 v1 / v3 / v5 / v9 仍很可能判废。
      例外是 v4:60 日内单日 ΔFR 的最大值对流通 < 总股本的股票几乎总是正的 1–2 个 ulp,乘上连续的 −R60 就各不相同(模拟 0.57),
      它很可能过门槛,而前十分位在解禁淡季由「抖动为正 × 60 日跌幅」的非事件股补齐 —— 等于在约一半非事件股里做 60 日反转,必须与 v11 一起读。
      所以本卡的消融一律改成与 v2 同一底座(0.04)的成对写法(v6、v7、v8、v10、v13,总领审定时改),都拿得到读数,
      而且每一条与 v2 只差一处;v14 也加了底座并升为 core,使得在无底座写法全被判废时,仍有两个「不同构造」的 core
      (v2:60 日窗口的累计解禁;v14:一年线性衰减的解禁记忆)可以按统一判据 (a) 判读。
      带常数底座的写法覆盖率与离散度都满;但 E1 的 E-l 实测底座把干净门控破坏成「所有股票每天都非零」的 0.04 ×(−R60),
      所以 v2 / v14 / v16 必须与 v11 一起读。
    fails_if: >-
      (a) core 选 −1(做多解禁后上涨的股票):与卖压回补相反,按统一判据 (c) 本假设即否。
      (b) v11 / v12 ≥ v2 的 70%:读到的是 60 / 30 日反转,底座吃掉了门控,v2 没有增量。
      (c) v6 ≥ v2:送转污染(LogFloatShares 的跳变含送转,FR 不含 —— E1 的 E-m 实测送转股票在 v6 的写法下非零)。
      (d) v5 选 +1 且 ≥ v1:那是「解禁本身利好」(例如被当作治理改善或流动性改善的信号),换了机制,
      不能记成卖压回补,要另立假设。
      (e) v15(流通比例水平)≥ core:读到的是股权结构这个结构性变量,不是解禁事件。
      (f) v10 ≥ v2:截正部没有必要,做功的是 ΔFR 的两侧而不是解禁 —— 那更像是「股本变动 × 反转」的混合,机制陈述要改写。
      (g) v13 与 v2 差别很大(|Δscore| ≥ 0.3):结果依赖 R60 这个特定的跌幅写法(60 日前那一天的取值),不稳。
  novelty: >-
      原料在 C01–C03 不存在。它不是反转的改写:R60 / R30 本身作为 v11 / v12 单独评估,
      核心是「事件 × 下跌」的乘积,而 C01–C03 的存档里没有任何以股本或流通比例为条件的交互项
      (E2 在 6940 行里检索到的交互全部是价量叶子之间的)。与已知族没有共同叶子。
      终局要核的残差重合风险:解禁股偏小盘、偏近年上市,所以与任何小盘 / 新股倾向的 head 可能重合;
      要特别说明的是本卡的多头腿是「有解禁事件且已下跌」的股票,幸存者偏差会抬高这一端(跌下来又没退市),
      所以 H3 的读数要按偏乐观处理 —— 这写在这里,终局判读时不许忘。
      本卡不做多极小市值、极低价或濒危股:截正部只挑解禁事件,不挑市值分位。
