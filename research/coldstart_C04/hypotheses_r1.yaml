# C04 第 1 轮假设(W1,主研写)。5 个假设,64 个变体 = B 组 64 次直接评估。
#
# 预算:B 组每种子的 GP 预算 = 192 − ⌈64/16⌉ = 188。49–64 个变体都只扣 4 次,所以写满 64。
# 本轮全部是 new,没有 improve 卡。
#
# ── 本轮押什么 ──────────────────────────────────────────────────────────────
# C04 真正新增的只有 6 个日频字段,其中能单独排序的只有三个 Log* 字段(另外三个是离散标签,见下)。
# C01–C03 的样本内先验说明两件事:价量这一侧的族要么已经用尽、要么到样本外留不住;
# 中性化之后真正卡住的是 train(2018–2021)这一段(c03 两组 2479 个存档候选里,score ≥ 0.3 的候选
# train < valid 的比例 A 组 89%、B 组 97%)。所以本轮押「用 Log* 字段的会计恒等式构造 GP 很难碰到的经济量」:
# H1–H4 的原料在 C01–C03 完全不存在;H5 不用新字段,是 GP 从没搜过的长周期结构(E2 在 6940 行存档里只命中 2 条)。
# 每条都写明多头腿是谁:奖励只交易残差排名最高的 10%,利润在空头腿的机制在这里一分也拿不到。
#
# ── 记号(YAML 里已全部展开,此处只为阅读;恒等式由 E1 在玩具数据上 float64 核过,股票 6 全程最大误差 3.6e-15)──
#   LP   = log(day_last(Close))                       后复权收盘的对数
#   P    = LP − LogTotalCap = log(复权因子) − log(总股本)。未复权价在两项里严格相消,
#                                                      所以 P 只在分红 / 送转 / 增发 / 回购注销当天跳变;
#                                                      送转同时抬高复权因子与股本,在 P 里抵消。
#                                                      ΔP = 股息率 − 净增发 = Daniel–Titman composite issuance 的相反数
#   PAY  = P − cross_mean(P, 241)                     线性衰减的「过去一年净派现」
#   FR   = LogFloatCap − LogTotalCap = log(流通 / 总股本)。解禁↑,定增与股权激励授予↓,送转不变
#   RP   = LogFloatCap − LogFloatShares = log(未复权收盘)
#   NS   = LogTotalCap − RP = log(总股本)
#   LA   = LP − RP = log(复权因子)(分红 + 送转)
#   dLP  = ts_delta(LP, 1)                            日对数收益
#   R60  = log(div(day_last(Close), cross_delay(day_last(Close), 60)))   60 日收益(R30 同理)
#   U60  = ΔFR(60) + |ΔFR(60)|                        只留流通比例上升的部分(×2);U30 同理
#   PRET = cross_sum(dLP, 241) − cross_sum(dLP, 15)   过去一年、跳过最近 15 天的累计收益
#   PN   = cross_mean(sign(dLP), 241)                 一年内上涨日占比(的符号均值)
#
# ── 判据(PLAN §2.2 / §3)──────────────────────────────────────────────────
#   奖励 long_neutral:原始面板 → 半衰期 0/5/20 平滑 → 截面 z 排名 → 每天对
#   [1, z(流动性 cross_mean(day_sum(Amt),30)), z(波动 cross_mean(day_std(Ret),20)),
#    z(20 日反转), z(已知族 cross_mean(day_std(Amt),30)), z(市值 LogFloatCap)]
#   做 OLS 取残差 → 十分位纯多头书 → 扣 15bp。score = min(train, valid);score ≥ 0.5 = 发现;
#   与已知族的 |ρ| ≥ 0.5 直接拒。年化成本 = 0.756 × 日换手。
#   valid 只有约 1.6 年、夏普标准误约 0.8,所以单条过 0.5 只是弱证据:每个机制都写了 3–5 个写法不同的 core。
#   统一的机制判据(写在这里,各卡的 fails_if 按它写):
#     (a) 至少 2 个「不同构造」的 core 在 train 上选出预期方向且 score > 0,其中至少 1 个 ≥ 0.5;
#         只差窗口、或只差去哪一种中性化的孪生,算 1 个构造;
#     (b) 该卡指定的对照与消融不推翻它(逐条见各卡 fails_if);
#     (c) 方向否决:任何 ≥ 0.5 的 core 选出相反方向,本假设即否。反向过线可以记为发现,但不能说成机制成立。
#
# ── 两个门槛不一样(E1 Q6 实测)───────────────────────────────────────────
#   直接检验:覆盖率 ≥ 0.9 且离散度 ≥ 0.5,不到就判门槛废品、没有分数;GP 端覆盖率只要 0.5。
#   所以:cross_delta / cross_delay 的 241 日窗口一律禁用(严格位移、前 d 天全 NaN,而 warmup 只有 60 天,
#   会让 train 头约 181 天与新股的第一年为 NaN、覆盖率约 0.8)。一年期的量全部写成 sub(x, cross_mean(x, 241)):
#   cross_mean / sum / max / min 用 nan 归约,窗口不满也出数(E1 Q1 实测,整窗全 NaN 才给 NaN)。60 及以下的严格位移可以用。
#   离散度门槛对噪声没有免疫力(E1 Q6:70% 为常数 → 离散度 0.301 判废;同一组叠加 1e-6 的噪声 → 离散度 1.00 过关)。
#   这对本轮关系很大:事件型信号在无事件股票上是「0 + 约 1.9e-6 的 float32 舍入噪声」(E1 第二部分实测的噪声底),
#   如果事件股不足 10%,前十分位剩下的名额由噪声决定、每天重排、白吃成本。所以每个事件型假设都带一条慢底座的 core。
#   ΔFR 例外:它对无事件股票是精确 0(E1 的 E-j / E-k 噪声底都是 0),所以 H3 的无底座写法会被离散度门槛判废,不是靠噪声过关。
#   (总领审定:上面「靠噪声过门槛」的前提在 float32 上不成立 —— 舍入噪声落在网格点上、是并列值,见下方「总领审定」第 0 条。)
#
# ── 三个离散字段的用法(E1 实测)─────────────────────────────────────────
#   ListAge、BoardCode、LimitWidth 单独排序过不了离散度门槛(ListAge:view 首日已上市的股票同一天全部等于同一个
#   10000+t,样本内占 65–97%;E1 Q6(i) 实测 65% 同值 → 离散度 0.351)。它们只能当门控(less(ListAge, 250))、
#   除数,或进 cs_regres(y, LimitWidth)(E1 Q5:自变量只取两类时 cs_regres 精确等于组内去均值,三档是跨 0.1/0.2/0.3 的线性拟合)。
#   不许进 cs_bucket_*:E1 Q4 实测 _pct_rank 用双 argsort、平局按列顺序拆开,同一类别会被切进不同的桶,
#   相邻的两个不同类别还会被混进同一个桶。LimitWidth 里没有 ST(只按代码前缀与日期取值,主板 10% / 双创 20% / 北交所 30%)。
#
# ── 自己定的硬规矩(C01–C03 假象的来源,逐条避开)──────────────────────
#   不用 cs_first_* / cs_last_* / cs_mask_*(C01 的 60 个低 ρ 通过者里 52 个是排名平移造出来的,未平移的孪生 ρ = +0.81);
#   不用 day_distinct_ratio / day_flat_ratio,day_zero_ratio 只能当 control(它们读的是一价日与粗刻度股;
#     C04 的未复权价给这类筛选开了新入口 —— 低价意味着相对刻度粗,所以 H4 必须带刻度对照);
#   LogFloatCap 的任何非线性变换不作核心:控制只去掉 z(rank(LogFloatCap)) 的线性部分,pow / abs / 分位翻转都会在残差里
#     留下小盘尾巴,而且会被幸存者偏差放大(库里 5207 只股票全部存续到末日、没有退市股);
#   任何做多极小市值、极低价、濒危股的核心一律不写(同一个幸存者偏差;train / valid / test 三段都会被系统性抬高);
#   Amt / Volume 的水平与离散度不作核心(已知族),换手率水平只作 control(它在对数空间约等于「流动性控制 − 市值控制」);
#   后复权价格水平不作核心(C03 直接检验里中性化后是 −0.90,只在 H4 当对照);
#   不用 ts_spearman / nt_* / ts_pearson;不用 NaN 截子宇宙(纯多头书的基准是「当天有信号且有标签的股票」的等权,
#     E1 Q7 核过:信号为 NaN 的股票同时退出持仓和基准,所以截子宇宙会改变基准,不许这样造分);
#   is_gt0 / is_lt0 返回 int32,喂给 cross_* 会在填 NaN 时直接报错(E1 Q2 原文 RuntimeError),跨日计数一律用 sign(·)(float32);
#   任何分母都不许可能为 0(div(x,0) = inf 会排到最前,div(0,0) = NaN;log(0) = NaN、log(−1) = 0,E1 Q3);
#   cross_* 窗口取 {3,5,10,15,30,60,241},ts_* 取 {1,5,10,20,30,40,50}。
#
# ── 执行交回(E1 / E2)改变了什么 ─────────────────────────────────────────
#   1. E1 第二部分证实 E-b(cross_sum(ts_delta(P,1),241))漏掉停牌期间的分红:停牌边界的两个单日差分都有一侧为 NaN,
#      被 nansum 跳过,玩具里对隐藏分红全程为 0;而 E-a(水平差)捕捉到了它。按总领的交回规则,H1 的主写法保持
#      水平差版(v1),逐日差分版留在消融(H1/v2)并注明。同一条也记在 H5:PRET 用的就是累计求和,
#      所以加了 H5/v7(水平差版动量,不丢停牌跳变、覆盖率满)作对照。
#   2. E1 的 E-k 实测 U60 对股票 5(定增,ΔFR < 0)精确截成 0,对股票 6(送转式的等比例变动)恒为 0 —— U60 的写法不改。
#   3. E1 的 E-l 实测常数底座把干净门控破坏成「所有股票每天都非零」的 0.04 ×(−R60):H3/v2 必须与 H3/v11 一起读,
#      并加了 H3/v16(底座 0.01)量出「多少分来自事件、多少来自反转」。
#   4. E1 Q4 证实离散标签被按列顺序拆桶:维持「三个离散字段不许进 cs_bucket_*」。
#   5. E1 Q6(iii) 证实 1e-6 的噪声就能让离散度从 0.301 跳到 1.00:无底座的事件型 core 保留,但 prediction 里一律写明
#      「预期换手偏高、前十分位在淡季由噪声占据」。
#   6. E2 的检索结果写进了 H5 的 novelty(长窗口价格路径在 C01–C03 的 6940 行去重存档里只命中 2 条,
#      score ≥ 0.5 的只有 1 条且方向 −1;跨日涨跌计数只命中 1 条且为负分),所以 H5 的新颖性不降级。
#
# ── 先验污染声明 ───────────────────────────────────────────────────────────
#   我知道 2023–2025 年 A 股的一些公开事实:红利风格 2022–2024 年强势;2024 年新规推动分红、回购并收紧退市;
#   微盘股 2024 年初大跌后又反弹。H1、H2 的选族可能受此影响。我给的理由是公开文献(Daniel–Titman 2006、
#   Pontiff–Woodgate 2008、Boudoukh 等 2007、Ikenberry 等 1995、Shleifer 1986、Field–Hanka 2001、
#   Campbell–Grossman–Wang 1993、Birru–Wang 2016、Da–Gurun–Warachka 2014),但不能证明没有被污染。
#   train(2018–2021)在红利风格之前,这正是约束腿;结论性判读要看前推段(2026 年起)的方向是否一致。
#
# ── 我的事先预测 ───────────────────────────────────────────────────────────
#   5 个假设里过线(任一 core ≥ 0.5)的中位数是 1,最可能是 H1,其次 H3;P(0 个过线) 约 40%。
#   全部压在 12–30%:C02、C03 的校准教训是「没测过的机制会过线」这类判断偏乐观。
#   三条可事后核对的校准读数:H1/v13(换手率水平)|score| < 0.3;H4/v6 ≈ H4/v1(|Δscore| < 0.1);H3/v5 选 −1。
#   另外预期 H3 的无底座 core(v1/v3/v4,以及 v5)多数被离散度门槛判废 —— 那个判废本身是读数,不是失败。

# ── 总领审定(W1 之后、直接检验之前;改了哪些、为什么)──────────────────────
#   审了四件事:经济学是否说得通、能否证伪、与已知族和 C01–C03 heads 是否预期低相关、对照能否把机制与代理分开。
#   五张卡都批准;改动只动写法与判读,不改假设本身。变体数仍是 64(H1 17 / H2 12 / H3 16 / H4 11 / H5 8),
#   新写法全部在严格文法(allow_general=False)下解析通过,c04_check 判 ADMISSIBLE。
#   0. 最要紧的一条:「1e-6 的噪声会把离散度抬到 1.00」(E1 Q6(iii))在本轮的真实算子上不成立。
#      离散度 = 每天「不同取值数 / 有值股票数」的中位数(partura/diagnose.py distinct_fraction)。Log* 字段入库是 float64 取对数再转 float32
#      (E1 的 toydata 注明与 dailyfields.py 一致),算子在 float32 上算,所以无事件股票的 P、FR、NS 及其差分不是连续噪声,
#      而是落在 1–5 个 float32 网格点上的并列值。本地模拟(3000 只、无事件、算子取自注册表;脚本在总领的 scratchpad,quant_sim*.py):
#      cross_delta(P,15) 离散度 0.002(67% 精确为 0)、cross_delta(P,3) 0.002、ΔFR(60) 0.001、U60×(−R60) 0.10、FR − 一年均值 0.10、
#      −min(Δlog 股数) 0.001;后复权价按 0.01 舍入后 cross_delta(P,15) 也只有 0.08。只有 cross_max(ΔFR,60)×(−R60)(0.57)、
#      FR 水平(0.59,取决于全流通股票占比)靠网格抖动过线。PAY(一年水平)能过门槛,是因为过去一年有派现的股票约占 0.6–0.7,不是因为噪声。
#      后果:原设计里 H2 的无底座写法(v1 / v2 / v4 / v5 / v6 / v7 / v9 / v12)淡季几乎全是并列值,很可能全部判废,只剩 v3 / v10
#      这一个构造有分数,统一判据 (a) 满足不了;H3 同理只剩 v2。
#      所以:H2 的 v4 换成第二个带底座的构造(30 日线性衰减 + PAY),v5 / v6 / v7 改成与 v3 同一底座、只差一处的写法;
#      H3 的 v6 / v7 / v8 / v10 / v13 改成与 v2 同一底座(0.04)、只差一处的成对写法,v14 加底座并升为 core。
#      无底座的机制写法(H1/v8、v10,H2/v1、v2、v9、v12,H3/v1、v3、v4、v5、v9)保留:它们的判废本身是读数
#      (H2/v12 判废 = P 在无事件股票上逐值不变 = 恒等式在 float32 精度上成立),每条的 predicts 都写了门槛预期。
#   1. 另外两处必然判废:H5/v5 的等权 sign 均值只取 k/241(模拟 0.02)→ 改 cross_decay_linear(0.75);
#      H5/v8(价格变动天数占比)等权 0.006、线性加权 0.24 → 换成波动调整动量(更要紧的代理);H3/v8 对 view 首日已上市的股票乘 0 → 加底座。
#   2. H4:原文「名义价格只在除权日跳变、换手 < 0.02」与 C03 的实测(价格水平残差化后换手 0.055)不符,改为 0.03–0.06;
#      原 fails_if (e)「v4 / v5 ≥ v1 即判否」在市值中性化后几乎必然触发(log 价 = log 市值 − log 股数),改成只认「远高于」;
#      加 (f):本卡只有一个构造,过线只能记信号存在;novelty 加 C03 的 602A 族(做多后复权价最高端,与本卡同向,残差重合风险最高)。
#   3. H1:mechanism 写明多头腿实际是高股息,与价值 / 行业 / 国企风格不可分;fails_if (b) 改为以 v17 为判据(v11 单独高不判否)。
#   4. H2/v12:旺季每 3 天有几个百分点的股票除息,改掉「几乎不可能有除息」;加了送转季尖峰(股本与复权因子入库日期不一致)这一种读法。
#   5. H1/v4、H4/v3:2020-08-24 之前创业板也是 10%,LimitWidth 在 train 的大半段只分出科创板。
#   读代码确认的两件事(都不改写法):long_neutral 奖励不使用 untradable 掩码(partura/steer.py:只有 long_tradable / long_bucket /
#   long_marginal 用),所以新股在书的股票池里,H1/v9、H4/v7 的 ListAge 门控有实际作用;方向与半衰期在 train 上挑、score = min(train, valid)。
#   给 W2 的含义:GP 端的离散度门槛同样是 0.5,所以任何以 cross_delta / ts_delta 作用在 Log* 差上的「纯事件」种子,
#   除非带连续底座,初代就会被门槛挡掉;GP 自己随机抽到的日频叶子也多半如此。
#
# ── 总领的事先预测(写在直接检验之前)────────────────────────────────────
#   「过线」= 任一变体 score ≥ 0.5 且未被相关度拒绝。P(64 个变体全部 < 0.5) ≈ 50%。
#   门槛:H2/v12 被离散度门槛判废 60%;H2/v1、v2 判废 70%;H3/v1、v3、v5 判废 75%;H1/v1 过门槛 85%;H5/v5、v8 过门槛 90%。
#   H1:任一 core 过线 25%,方向 +1(做多高派现)的条件概率 85%;过线的话 train 是约束腿(train < valid:85%),换手 0.025–0.045。
#       v11 与 v12 的分数接近(|Δ| < 0.2:70%,恒等式下两者只差 PAY)。
#   H2:任一 core 过线 15%,几乎只会经由带底座的 v3 / v4 / v10(即「H1 + 旺季加分」),而且与 H2/v8(= H1/v1)同进退;
#       v3 − v8 > 0.1(H2 对 H1 有增量)的概率 35%。
#   H3:任一变体过线 18%,方向 +1(做多「已跌下来」的一端);但最可能过线的是带底座的 v2 / v14 / v16 与对照 v11(60 日反转),
#       所以「过线而机制不成立(fails_if (b))」的概率高于「机制成立」(约 2 : 1)。
#   H4:任一 core 过线 10%;方向不定(+1 : −1 ≈ 55 : 45),train 与 valid 的风格相反(2019–2020 大盘高价、2022–2023 微盘低价),min 两头都难过。
#       v6 ≈ v1(|Δscore| < 0.1):75%;v4 / v5 至少一条被与已知族的 |ρ| 拒:40%。
#   H5:任一 core 过线 12%;若过线,方向 −1(做多一年输家、长期反转,且吃幸存者偏差)与 +1 约 55 : 45 —— 反向过线按统一判据 (c) 判否。
#   过线假设个数的中位数 0–1;最可能的单个读数是 H1 的 +1,其次是 H3 的反转成分。

hypotheses:

# ─────────────────────────────────────────────────────────────────────────────
- id: H1_net_payout
  hypothesis: >-
    过去一年净派现(现金分红 + 回购注销 − 增发)高的公司随后跑赢;
    信号用「后复权收盘 ÷ 总市值」这个会计恒等式构造,未复权价与送转都在两项里自动抵消。
  thesis:
    mechanism: >-
      谁跑赢:过去一年把现金还给股东(分红、回购注销)而且没有大额增发的公司 —— 多头腿是派现方,不是不派现方。
      恒等式 P = log(后复权收盘) − LogTotalCap = log(复权因子) − log(总股本):未复权价在两项里严格相消
      (E1 在玩具数据上 float64 核过,最大误差 3.6e-15),所以 P 只在分红、送转、增发、回购注销当天跳变;
      送转同时抬高复权因子和总股本,在 P 里抵消(E1 的 E-a:分红股票跳 +0.0303 ≈ +D/r,增发股票跳 −0.1814 ≈ −log1.2,
      送转股票不动,只有 1.9e-6 的噪声)。于是 ΔP = 股息率 − 净增发率,即 Daniel–Titman 2006 composite issuance 的相反数。
      机制:管理层在股价低估时回购、在高估时增发,市场对这个管理层私有信息反应不足
      (Daniel–Titman 2006、Pontiff–Woodgate 2008 的 net share issuance、Boudoukh 等 2007 的 net payout、
      Ikenberry 等 1995 的回购后漂移;全部是先验文献,不是本样本的证据)。
      文献里这一族的正 alpha 主要来自高派现组,也就是多头腿,这正是纯多头口径需要的。
      它是慢变量:年度事件 + 线性衰减,换手低、成本小,而且与五个控制变量都不是线性关系。
      不可识别项(总领审定时加,先写在前面):A 股的回购注销很少,PAY 的前十分位绝大多数是高股息率股,所以多头腿实际检验的是
      「派现方跑赢」;Daniel–Titman 的管理层择时那一半(增发方跑输)落在空头腿,本轮拿不到。高股息又与价值、行业(银行、煤炭、
      公用事业、交运)和国企属性高度重合,本轮没有估值、行业、所有制字段,所以 H1 过线只能记成「高派现多头腿」,
      不能记成择时机制成立,也不能与价值 / 行业轮动分开。
    counterparty: >-
      追逐增发、并购与扩张故事的投资者:他们为「把钱投回去」的公司多付钱,同时低估「把钱还出来」的公司,
      亏在管理层的回购 / 增发择时上。另一边是把高股息当作低成长代理、系统性回避派现股的成长型资金,
      以及在增发公告后接盘的跟随者。
    prediction: >-
      方向 +1(做多高净派现)。v1 选 +1 的概率 75%;至少一个 core ≥ 0.5 的概率 30%。
      构造内的可证伪比较:v1 > v5 且 v1 > v6 的概率 55%(送转只有在复权因子与股本合起来时才抵消,
