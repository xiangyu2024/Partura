- id: H2_exdiv_clientele
  hypothesis: >-
    刚除息、而且年度派现水平高的股票在除息后约 2–6 周跑赢;
    差别化股息税造成的短线客户群在登记日前卖出、除息后回补。
  thesis:
    mechanism: >-
      谁跑赢:刚刚除息、而且年度派现水平高的股票,窗口是除息后约 2–6 周 —— 多头腿是除息后的回补方。
      原料与 H1 相同(P = log(后复权收盘) − LogTotalCap),但读的是 15–30 日的变化而不是一年水平,
      所以这张卡检验的是另一件事:派现效应是长期定价(H1),还是除息前后的交易(H2)。
      机制:A 股差别化股息税按持股期计征(不足 1 个月 20%、1 个月至 1 年 10%、1 年以上免征),
      短线持有者因此有动机在登记日前卖出、除息后买回(税务客户群效应,Elton–Gruber 一脉;先验);
      叠加散户的「填权」行为。两者都在除息后形成买压,所以利润落在多头腿。
      因为 P 里不含未复权价,cross_delta(P, d) 不是收益,是纯事件量 —— 这既是它的干净处,也是它的门槛风险。
    counterparty: >-
      在登记日前为避税卖出的短线资金,以及在登记日前为拿股息买入、除息后立刻卖出的套息资金:
      前者把筹码在除息前让出、在除息后再买回(付两次冲击成本),后者在除息后集中卖出,
      两边都把除息后几周的收益让给了愿意在除息后持有的一方。
    prediction: >-
      方向 +1。v3 ≥ v1 的概率 65%:淡季里 cross_delta(P,15) 对绝大多数股票是 0 ± 1.9e-6 的噪声,
      PAY 底座把这一段的排序交给年度派现水平,消掉噪声换手。
      门槛(总领审定时改写):这层噪声是 float32 网格上的并列值,不是连续噪声。本地模拟(3000 只、无事件、按 E1 的入库方式:
      float64 取对数再转 float32,算子取自注册表)里 cross_delta(P, 15) 有 67% 精确为 0、其余落在 ±1–2 个 ulp 上,离散度 0.002;
      后复权价按 0.01 舍入时也只有 0.08。E1 Q6 的「1e-6 噪声 → 离散度 1.00」用的是连续噪声,不适用。
      所以无底座的 v1 / v2 / v9 / v12 淡季几乎全是并列值,按每天离散度的中位数,很可能被直接检验判门槛废品(70%);
      原 v4 / v5 / v6 / v7 已改成带底座的写法。只有供应商价格与分钟收盘口径不同、P 带真实抖动时,v1 才会靠抖动过门槛、再每天重排白吃成本。
