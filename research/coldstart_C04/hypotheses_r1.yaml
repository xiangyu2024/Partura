      做多的是低价端,而本卡做多高价端;未复权价与后复权价在长期上涨股上差别很大(复权因子累积),
      但横截面上两者正相关,所以 v1 与 C01 价格水平族的残差 |ρ| 可能偏高,而且可能是高度负相关。
      终局必须对 C01 的价格水平族与 104 族逐条量 |ρ|;≥ 0.7 就不算新,即使 score 过线。
      还有一族方向相同、更危险(总领审定时加):C03 A 组的 602A 族
      cs_mask_top_replace_mean_neg(cs_mask_top_replace_mean_neg(pow_2(day_close(Open))))(方向 +1,C03 奖励下 score 0.61–1.49)
      做多的就是后复权价最高的一端(该算子把最低的 10% 换成截面均值)。未复权价与后复权价同向,v1 与它的残差 |ρ| 可能接近 0.7。
      v8(后复权价格水平)给的是这一族在 C04 奖励下的尺子:v8 ≥ 0.5 时,v1 的任何过线都要先对 602A 族量 |ρ| 再谈新。
  variants:
  - {id: v1,  role: core,     expr: "cross_mean(sub(LogFloatCap, LogFloatShares), 60)", predicts: "过线则 sign +1,换手 0.03–0.06(总领审定时改了原文「< 0.02」:C03 实测价格水平残差化后约 0.05)。60 日平均未复权价的对数。本卡的基准读数。"}
  - {id: v2,  role: core,     expr: "cs_bucket_demean(cross_mean(sub(LogFloatCap, LogFloatShares), 60), LogFloatCap)", predicts: "与 v1 同号。规模十分位内去均值:名义价格与市值天然正相关,而市值只被线性中性化,这条拿掉非线性尾巴。它掉一半以上按 fails_if (d) 读。"}
  - {id: v3,  role: core,     expr: "cs_regres(cross_mean(sub(LogFloatCap, LogFloatShares), 60), LimitWidth)", predicts: "与 v1 同号。对 LimitWidth 做截面回归去板块:双创板的发行价与股本结构和主板不同,这条排除「只是双创 vs 主板」。2020-08-24 之前创业板也是 10%,train 的大半段这条只把科创板(2019-07 起)分出来。"}
