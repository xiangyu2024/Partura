- id: H5_frog_in_the_pan
  hypothesis: >-
    过去一年(跳过最近 15 个交易日)上涨、而且这段上涨由许多个小幅上涨日连续累积起来的股票随后跑赢;
    连续到达的小额信息不触发注意力,被逐步而不完全地定价。
  thesis:
    mechanism: >-
      谁跑赢:过去一年累计上涨(跳过最近 15 个交易日以避开短期反转)、而且这段上涨是由许多个小幅上涨日连续累积、
      不是由少数几个大跳变造成的股票 —— 多头腿是「连续慢涨」的那一端。
      机制:注意力有限 —— 单日幅度小的消息不触发投资者的关注与重新定价,信息被逐步而不完全地吸收,
      动量因此在「连续型」股票上更强、更持久(Da–Gurun–Warachka 2014 frog-in-the-pan;
      Hong–Stein 1999 的渐进信息扩散;先验)。反应不足型异象的利润在多头腿(上涨组继续涨),
      这正是本轮纯多头口径需要的;长期反转那一族的利润在空头腿,所以不写。
      PN 用 sign(日收益) 的一年均值度量上涨日占比:E1 Q2 实测 sign 返回 float32、NaN 输入输出 0,
      可以安全喂给 cross_mean;is_gt0 / is_lt0 返回 int32,喂给 cross_* 会在填 NaN 时直接报错,所以不用它们。
      但等权的 PN 只取 k/241 这类离散值,单独排序过不了离散度门槛(截面上最多几百个不同值);v1–v3 里它与动量排名相加,不受影响,
      单独出现的 v5 改用 cross_decay_linear(总领审定时改;v8 换成了波动调整动量)。
      它是五条里优先级最低的一条:不用新字段,新颖性只来自 GP 没搜过的长周期结构。
    counterparty: >-
      只对大幅、显著的价格与消息冲击作出反应的注意力有限的投资者:他们在连续小幅上涨的股票上定价不足,
      把收益让给愿意持有「没有故事」的慢牛股的一方;以及把连续小涨误读为「已经涨完」而提前卖出的交易者。
    prediction: >-
      方向 +1。core 选 +1 的概率 55%;v4 < v1 的概率 60%(连续性要加分,否则这只是一年动量);
      至少一个 core ≥ 0.5 的概率 12% —— 五条里最低。
      覆盖率:cross_sum 用 nan 归约、窗口不满也出数(E1 Q1 实测),所以 PRET 与 PN 的覆盖率满。
      但 E1 第二部分证明 cross_sum(ts_delta(·,1), 241) 会漏掉停牌期间的跳变(停牌边界的单日差分两侧有 NaN、
      被 nansum 跳过),所以 PRET 对长期停牌股低估累计收益;v7 用两端水平相减改写,是不丢停牌跳变的对照,
      v4 与 v7 的差额量出这个漏项有多大。
      v8(波动调整的一年动量)< v1 的概率 60%:若反过来,「连续性」的加分其实是波动缩放(平稳上涨 = 低波动的赢家),不是有限注意力(总领审定时把原 v8 换掉,原写法过不了离散度门槛)。
    fails_if: >-
      (a) core 选 −1:与反应不足相反(那是长期反转,利润在空头腿),按统一判据 (c) 本假设即否。
      (b) v4(纯动量)≥ v1:连续性没有加分,这只是一年动量,不是 frog-in-the-pan。
      (c) v6(60 日反转)≥ v1 的 70%:读到的是反转。
      (d) v8(波动调整动量)≥ v1:连续性项的加分可以由「收益 / 波动」解释,frog-in-the-pan 没有增量。
      (e) v7 与 v4 差别很大(|Δscore| ≥ 0.3):PRET 的停牌漏项是主导,所有读数要按 v7 重算,
      而且 W2 的种子要改用水平差版。
  novelty: >-
      不用新字段,新颖性来自结构。E2 对 C01–C03 的 6940 行去重存档做过正则检索:长窗口价格路径
      (20–241 日的位移 / 差分,以及 cross_sum(ts_delta(·)) 这种累计)只命中 2 条,score ≥ 0.5 的只有 1 条
      (C02 直接检验里的一条 20 日反转,score 0.65、方向 −1、ρ已知 +0.09);跨日涨跌计数(sign / is_gt0 / is_lt0)
      只命中 1 条,score −0.83。所以这个空间在 C01–C03 基本是空的,|ρ| 预期低。
      终局要核的残差重合风险两处:C01 的 ts_pearson 跨股票同步性族(那一族也吃趋势,score 1.4–2.0),
      以及任何以 day_sum(Ret) 为叶子的 head(C02 的 ts_pearson(day_sum(Ret),30) 一族 score 1.75)——
      后者是分钟收益的日度和在时间上的自相似,与一年累计收益不是同一个量,但都带趋势,必须逐条量 |ρ|。
