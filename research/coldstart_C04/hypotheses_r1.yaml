      换手:v1 ≤ 0.035 的概率 60%,v15 < v1。
      门槛:PAY 对无事件股票是 0 ± 1.9e-6 的噪声,但 A 股年度分红覆盖面大,真实事件股占比应远超 10%,
      所以 v1 的前十分位应由真实派现股而不是噪声占据。另一面(总领审定时加):这层噪声是 float32 网格上的并列值,
      不产生不同取值,所以 v1 的离散度 ≈ 过去一年有派现或股本事件的股票占比(约 0.6–0.7),能过 0.5 的门槛但余量不大(过门槛 85%)。
