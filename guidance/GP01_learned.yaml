pool:
- id: known_amt_dispersion
  expr: cross_mean(day_std(Amt), 30)
  sign: -1
  hl: 0
- id: known_xfrozen
  expr: cs_last_high20(neg(cross_mean(day_std(Amt), 30)), cross_max(day_zero_ratio(Ret), 15))
  sign: 1
  hl: 2
