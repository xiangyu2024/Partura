# 从 AlphaCube 的 GP 自己的存档里学到的先验(scripts/gp_archive_priors.py;2026-10-06)
# 规则(写在看任何 e7 结果之前):一个算子在全市场 3 个运行里「进前五分之一 ≤ 0.3 倍、进后五分之一 ≥ 1.1 倍」,并且在沪深300 的 4 个运行里也是「≤ 0.5 倍、≥ 0.9 倍」→ 降权。
# 只有降权,没有升权:全市场存档里的「好」算子大多是成交额一族(奖励在为流动性和垃圾票付钱),不拿来升权。
version: 1
batch: GP01_learned_from_gp_archives
evidence_base:
  runs:
  - gp_base_1
  - gp_hit_1
  - gp_long_1
  - gp_hs300_1
  - gp_hs300_2
  - gp_hs300_seed2
  - gp_hs300_seed3
  candidates: 4052
  note: 只用结束于 20230807 的运行;适应度是 AlphaCube 自己的(全市场三种 + 沪深300),在每个运行内取分位
reward: []
evaluation: []
priors:
- id: L_day_skew
  action: weight
  w: 0.25
  pattern: day_skew(_)
  why: GP 自己的存档里稳定垫底:全市场 3 个运行里含它的 70 个候选进前五分之一的是平均的 0.14 倍、进后五分之一的是 1.93 倍;沪深300 的 4 个运行里 173 个,0.03 / 0.92
