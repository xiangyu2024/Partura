- id: C2b_slow_to_market_news
  hypothesis: '今天的收益还在跟着昨天(以及前几天)全市场收益走的股票,即对全市场消息反应迟滞、被忽视的股票,随后跑赢;
    多头腿是迟滞最大的一端。迟滞用日收益对滞后一天到一周的等权市场收益的相关系数 / 回归系数度量。
    另有三种写法:对同时相关做截面残差、按板块回归、用开盘跳空对昨天市场收益的相关。'
  thesis:
    mechanism: '谁跑赢:价格对全市场消息反应慢、今天还在补昨天市场涨跌的股票 —— 多头腿是迟滞、被忽视的那一端。
      信息扩散有摩擦:关注少的股票里,把市场层面的消息并入价格的交易者少,价格要一到几天才追上。
      持有这类股票要承担更高的信息不确定与更差的风险分担,所以有溢价(Hou–Moskowitz 2005 的价格延迟,
      在规模与流动性之外仍定价;Merton 1987 的投资者认知假说;都是先验文献,不是本样本的证据)。
      奖励线性控制了流动性、市值、波动与 20 日反转,这些是延迟最主要的相关物,所以剩下的是控制之外的延迟。
      原料 cs_mean(日收益) 的滞后项在 C01–C03 的词表里可达,但 GP 要同时凑出截面均值、滞后、跨日相关三步。
      按深度说(主研本机核过):随机半代是 min_depth = 2、max_depth = 4,而种子 1 的骨架深度 7、种子 6 和 9 深度 9,随机树到不了这个深度。
      结构上也核过这条路通:cs_mean 是 ND 面算子,引擎把 (D, S) 面板交给它、按 expand_as 广播回原形(nd_cs.cs_mean),
      cross_* 原样透传形状,所以 cross_corr(个股日收益, ts_delay(cs_mean(日收益), 1), d) 读的确实是「个股对滞后市场」的跨日相关。
      它与 C01 / C02 的同步性 heads(ts_pearson,读的是同时相关)是两件事;种子 7 直接对同时相关做截面残差,把这一点从比较变成读数。
      A 股特有的竞争解释:涨跌停封板会让价格机械地滞后一天。种子 8 按板块回归,种子 10 用开盘跳空,用来分开这一点(见 fails_if)。'
    counterparty: '只盯热门股、不跟踪冷门股的注意力有限的投资者与被动交易者:他们不为冷门股承担信息不确定性,让出了这份溢价;
      另一边是愿意持有反应慢、关注少的股票并等待价格追上的资金。'
    prediction: '(1) 10 个种子里至少 1 个 score ≥ 0.5:10%。
      (2) 延迟写法的通过者选 +1(做多迟滞端):65%。
      (3) 对同时相关做截面残差的种子 7 保留种子 1 的 train 分数的 ≥ 70%:60%。按板块回归的种子 8 保留 ≥ 70%:65%。
      (4) 241 日写法换手 ≤ 0.03;全部种子 |ρ已知| < 0.3:85%。
      (5) 8 次运行合计至少 1 个新 head:20%。
      (6) 若有通过者,与 C01 / C02 的 ts_pearson heads 的残差 |ρ| < 0.5:75%。'
    fails_if: '(a) 通过者选 −1(做多反应最快的股票):与机制相反,按 W1 的统一判据 (c) 记为发现,不算机制。
      (b) 种子 1 过线,而对同时相关做截面残差的种子 7 ≤ 0,或者通过者与 C01 / C02 的 ts_pearson heads 残差 |ρ| ≥ 0.7:
