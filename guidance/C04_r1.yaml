      (c) 种子 8(按板块回归)比种子 1 掉一半以上:读到的是涨跌停幅度不同带来的机械滞后,不是信息扩散。
      (d) 只有滞后 1 天的写法过线,滞后 2 天(种子 3)、滞后 1–5 天(种子 4)、开盘跳空(种子 10)全部 ≤ 0:
        读到的是一天的非同步交易或封板,不是认知摩擦。
      (e) 通过者换手 > 0.05:相关系数的估计噪声在主导排序。
