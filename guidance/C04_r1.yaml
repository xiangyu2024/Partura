# C04 B 组第 1 轮指引(W2,总领)。依据:research/coldstart_C04/PLAN.md、hypotheses_r1.yaml、direct_r1.md / .json、prior_c04.md,
# 以及 C01 的样本内材料(beliefs_r3.md、episodes/c01*/evidence.json)。pool 原样抄自 guidance/C04_base.yaml。
#
# ── 直接检验读到了什么(详见 W2 总领的判读)────────────────────────────────────
#   64 个变体 0 个发现,最好的是 H4/v4 neg(LogFloatShares) +0.48(train 0.48 / valid 0.76,方向 −1)。
#   W1 押的五个机制在样本内都不成立:
#   - H1:派现方那一侧在 train 上就没有超额;
#   - H2:没有超出 H1 的增量;
#   - H3:读到的是 60 日反转的代理;
#   - H4:方向反了,唯一接近过线的是「同市值下股数多 = 名义低价」,即幸存者偏差 + 粗刻度的代理;
#   - H5:动量多头腿两段都是负的。
#   本轮能用的正面信息是四条事实:
#   1. P、FR、RP 三个恒等式在真实数据上成立(H2/v12 被门槛判废;H4/v6 −2.06 ≈ v1 −2.08);
#   2. 纯事件差分会被离散度门槛判废(H1/v5 v8 v10、H2/v1 v2 v9 v12、H3/v1 v3 v5);
#   3. 市值控制把价格水平杀掉(H4/v8 −1.17,H4/v1 −2.08);
#   4. 增发方 / 定增方是 valid 段很强的空头腿(H1/v1 −2.47、H3/v9 −2.52),纯多头拿不到。
#   所以本轮没有「已确认的写法」可以精修,种子全部是 new,不放 improve。
#
# ── 本轮押什么 ───────────────────────────────────────────────────────────────
#   两个 idea,701–708 给 C2a、709–716 给 C2b。两个机制互相独立,而且都不建在 W1 失败的原料上。
#   - C2a:以本板涨跌停幅度(LimitWidth)为尺子的日度彩票特征。多头腿是离涨停最远、上尾最薄的安静股。
#     「平稳」是 C03 在中性化奖励下样本内站得住的两个主题之一(另一个是分钟价量配对);这里把它搬到 C03 heads 没碰过的日度尺度上,
#     并且用到一个新字段。
#   - C2b:对全市场消息的反应迟滞(Hou–Moskowitz 2005 的价格延迟)。多头腿是迟滞、被忽视的股票。
#     原料是 cs_mean(日收益) 的滞后项,GP 几乎不会凑出来,与 C01/C02 的同时同步性 head(ts_pearson)是两件事。
#   不设 day_ops:C01 证明它会被装饰性地满足;而且 day_ops 也能匹配叶子名,一旦写上就会把随机半代逼成必须含 LimitWidth。
#
# ── 先验:省预算,不改奖励 ──────────────────────────────────────────────────
#   (1) C01–C03 head 族:在这些族里找到的东西,按 PLAN §3 不算新 head,所以禁掉或降权。
#       C01 / C02 族:排名平移、mask、同步性、刻度计数、价格单位离散度、价格路径形状、开盘竞价量、盘中段收益 I。
#       C03 族:分钟价量配对、成交量重心、日内波动的波动。
#   (2) C04 新字段:LogFloatCap / LogTotalCap / LogFloatShares 叶子降到 0.3。
#       依据是直接检验里以这三个字段为原料的 47 个有分变体全部 < 0.5;
#       唯一接近的 H4/v4 是 W1 事先登记、不许做核心的低价代理;纯事件差分则被门槛白白判废。
#       BoardCode / ListAge 叶子降到 0.4:它们单独排序会被离散度门槛判废。
#   (3) 白花评估的写法:常数包装、截面常数(根上的 cs_mean 等)、两层单调包装、价格字段改名的孪生。
#   全部权重 ≤ 1,所以 w_ref = 1。凡是会被折叠成算子权重的 weight 规则都带 unless: '__never__(_)',
#   让它只走 accept 这一道(否则对算子会被乘两次,对叶子无效)。
#
# ── 主研的本机核验(只核,不动种子顺序与先验 id)────────────────────────────
#   29 个种子逐个按运行自己的过滤器核过(gp.py 对 initial_population 的那一串):深度 6–9,全部 ≤ seed_max_depth = 9
#   (idea_search.py 传的就是 9);is_valid_root 全过;contains_lookahead 全无;所有算子都在 generator.specs 的词表里;
#   G.canonical 不改写任何一个种子(没有 rewrite 规则,simplify 也没动它们);同一 idea 内 Expression.key() 与 family_key 都无重复 ——
#   所以 gp.py 的 uniq 不会合并掉任何一个,29 个全部进初代。
#   种子不会被自己的先验筛掉:idea_search.py 的 guidance_accept 第一行就是 `if e in seeds_repr: return True`,
#   所以 C2a 种子 18 的 w = 0.3(C4P13 命中,它带 LogFloatCap / LogFloatShares)只影响它后代被提议的频率,不影响它本身入群。
#   31 条先验用 23 个代表树实测,逐条落在设计的权重上:LimitWidth 当除数 / cs_regres 自变量时 w = 1、放别处 0.4;
#   换窗口、换算子、去掉尺子的消融仍是 w = 1(邻域没有被自己的先验堵住);根上的裸动量 0.3、价格水平 ts_skew 0.2、差分上的 ts_skew 1.0;
#   同步性 / 刻度计数 / 价格离散度 / 价量配对 / 波动的波动 / 根上的 cs_ 聚合全部 0。
#   两处如实记下的近似:(1) 对数收益 ÷ 简单口径 LimitWidth 还剩约 8% 的板块依赖(写进 C2a 的 mechanism 与 fails_if (g));
#   (2) C2a 种子 6、7 与 C2b 种子 6、9 深度正好 9,顶在上限上,没有再加一层的余量。
#   cross_semistd_pos / neg 的入参必须是正的价格水平:算子内部自己取 log(x[t]/x[t−1])(ops_ext.py _semistd),
#   所以 C2a 种子 12 写 day_last(Close) 是对的 —— 日后不要「改进」成把日收益喂进去,那会走 clamp(min=1e-30) 变成垃圾。
#
# ── 总领复审(主研之后;批准,改了五处,种子顺序与编号、先验一律未动,只在 C2a 末尾加了种子 20)──────────
#   0. 另核一条主研没核的初代过滤:gp.py _seeded_population 按适应度挑种子时「同一骨架只要一个」(clustering.skeleton_key,
#      叶子名与常数值都折叠,窗口不折叠)。30 个种子按运行的同一条解析路径算 skeleton_key:C2a 20 个、C2b 10 个全部互不相同,
#      所以除了适应度非有限(门槛废品 / 相关度拒绝)的种子,全部进初代(seed_keep = int(48 × 0.5) = 24 ≥ 20)。
#   1. 更正 C2a mechanism 里「train 段几乎全是 10% 板,样本内可以忽略」:train = 2018-01-02 ~ 2021-12-31(idea_search.py START/SPLIT),
#      科创板 2019-07 起 20%、创业板 2020-08-24 起 20%(tradability.board_limit),train 的最后约三分之一和整个 valid 段里
#      约四分之一到三分之一的股票不是 10% 板。归一在样本内就起作用。
#   2. 由此补一条主研没写的风险:除以 LimitWidth 会让 20% / 30% 板的股票系统性显得「安静」(它们的日波动比主板高得远不到一倍),
#      方向 −1 的多头书因此超配创业板 / 科创板 / 北交所,而奖励的控制里没有板块。加 fails_if (h),改 prediction (3)。
#   3. 补上同一构造的样本内先验(prior_c04.md 的 C02 直接检验 H7_daily_max_lottery,奖励是不中性化的 long):
#      日收益 MAX 方向 −1 train −0.38 / valid +0.66、ρ已知 +0.43;MAX ÷ 自身波动 −0.67 / +0.21;日收益偏度 ts_skew(·, 40) +0.47 / +0.54。
#      所以 MAX 族的 |ρ已知| 预期约 0.4(改 prediction (5)),偏度这一支是证据最强的一支 —— 据此加种子 20:
#      cs_regres(ts_skew(日收益, 40), LimitWidth),即 C02 那条差 0.03 过线的偏度,按板块去均值(新字段的第二种用法)。角色 new。
#      另补 fails_if (i):负偏度端的多头书可能是「接飞刀」(被无退市股的幸存者偏差抬高),或刚开板的新股
#      (上市初期连续涨停让窗口内偏度机械地强负;C02 那条 +0.47 的读数里同样含着这一份)。
#   4. C2b 补 fails_if (f):cross_corr / cross_regbeta 没有最少样本数(operators/common.py rolling_pair_reduce 的 count 只 clamp 到 1),
#      上市头几天的相关是 ±1;long_neutral 奖励不用 untradable 掩码,新股在书里。这是能造出假延迟读数的小样本假象。
#   design_r1.md 写在这次复审之前(其中「19 个种子」「29 个种子」指加种子 20 之前);复审的理由与预测见 research/coldstart_C04/beliefs_r1.md。
version: 1
batch: C04_r1
evidence_base:
  direct: research/coldstart_C04/direct_r1.md
  hypotheses: research/coldstart_C04/hypotheses_r1.yaml
  prior: research/coldstart_C04/prior_c04.md
reward: []
evaluation: []
priors:
- id: C4P1_rank_shift_screens
  action: ban
  pattern: '{cs_first_high20|cs_first_high40|cs_first_low20|cs_first_low40|cs_last_high05|cs_last_high10|cs_last_high20|cs_last_high40|cs_last_low05|cs_last_low10|cs_last_low20|cs_last_low40}(_, _)'
  w: 0
  why: '排名平移筛选会把已知族洗成低 |ρ|:C01 的 60 个低 ρ 通过者里,52 个靠它或 mask,未平移的孪生 ρ +0.81。
    C01 的 heads 里 15 个以上含它,C03 A 组 603A / 605A / 608A / 614A 的 heads 也全靠它。在这里找到的东西不新,样本外也是换皮。'
  evidence:
  - 'research/coldstart_C01/beliefs_r3.md: B13'
  - 'research/coldstart_C04/prior_c04.md: C01 heads 中 cs_first_low20 / cs_last_low40 一族;C03 heads 中 cs_last_high40 / cs_first_high40 / cs_last_low40 一族'
- id: C4P2_mask_top_replace
  action: ban
  pattern: '{cs_mask_top_replace_mean|cs_mask_top_replace_mean_neg}(_)'
  w: 0
  why: '理由同 C4P1。它是 C01 104 族 head 的外壳(C01 heads 表里 13 个),也是 C03 602A 族的外壳(做多后复权价最高端,在 C04 的市值控制下就是市值)。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C01 heads 以 cs_mask_top_replace_mean_neg 开头的 13 个;C03 heads pow_2(day_close(Open)) 一族'
- id: C4P3_synchronicity
  action: ban
  pattern: 'ts_pearson(_, $w)'
  w: 0
  why: '跨股票同步性是 C01 / C02 的 head 族:C01 有 ts_pearson(day_sum(Close), 10) 一族,C02 有 ts_pearson(day_sum(Ret), 30) 一族。在这里找到的东西不新。
    C2b 押的是对滞后市场收益的反应,用 cross_corr / cross_regbeta 写,不经过 ts_pearson;这条禁令也防止 C2b 的后代漂回同时同步性。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C01 heads ts_pearson(day_sum(Close), 10) 等 4 个;C02 heads ts_pearson(day_sum(Ret), 30) 等 12 个'
- id: C4P4_tick_and_frozen_counts
  action: ban
  pattern: '{day_distinct_ratio|day_zero_ratio|day_flat_ratio|day_flat_run_max|day_pos_ratio}(_)'
  w: 0
  why: '报价刻度 / 一价分钟 / 涨跌分钟的计数。本轮 H4/v9 cross_mean(day_zero_ratio(Ret), 30) 以 ρ已知 −0.57 被拒;
    C03 的两条同类对照也都以 0.57 被拒。day_distinct_ratio 是 C01 104 族的签名。这一族只会白花付费评估。'
  evidence:
  - 'research/coldstart_C04/direct_r1.md: H4/v9 被相关度拒绝(ρ已知 −0.57)'
  - 'research/coldstart_C04/prior_c04.md: C03 直接检验 H5/v9、H3/v10 被拒;C01 heads 13 个含 day_distinct_ratio'
- id: C4P5_price_unit_dispersion
  action: ban
  pattern: '{day_std|day_var}(@price)'
  w: 0
  why: '价格叶子的日内离散度 = 名义股价 × 波动,是 C01 104 / 107 族的第二个核。只禁价格叶子,day_std(Ret) 不在内。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C01 heads inv(div(...day_std(Close)...)) 一族、cs_demean(...day_std(Open)...)'
- id: C4P6_price_path_shape
  action: ban
  pattern: '{day_kurt|day_skew|day_hurst|day_autocorr_n1}(@price)'
  w: 0
  why: '价格叶子的日内路径形状是 C01 的 head 族(306B 的 day_kurt(High)、305B 的 day_autocorr_n1(Vwap)),在这里找到的东西不新。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C01 heads ts_product(cross_quantile_q25(pow_2(day_kurt(High)), 30), 50)、ts_reg_tvalue(div(day_autocorr_n1(Vwap), ...))'
- id: C4P7_opening_auction_flow
  action: ban
  pattern: '{day_first|day_open}(@flow)'
  w: 0
  why: '开盘那一分钟的成交额 / 成交量是 C01 的 head 族(cs_first_low20(day_open(Amt), ·)),也是 C02 A 组 17 个 cross_regbeta(pow_1_5(day_first(Amt)), ·, 241) heads 的核。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C01 heads day_open(Amt) / day_first(Volume) 5 个;C02 heads pow_1_5(day_first(Amt)) 17 个'
- id: C4P8a_intraday_return_I
  action: ban
  pattern: 'div({day_last|day_close}(@price), {day_first|day_open}(@price))'
  w: 0
  why: '盘中段收益 I 是 C02 的 head 族(cross_ema(I, 30) 等);C03 的中性化奖励下它本身只有 −0.24。在这里找到的东西不新,也不赚钱。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C02 heads cross_ema(log(div(day_last(Close), day_first(Open))), 30) 等;C03 直接检验 H4/v12 −0.24'
- id: C4P8b_I_log_difference
  action: ban
  pattern: 'sub(log({day_last|day_close}(@price)), log({day_first|day_open}(@price)))'
  w: 0
  why: '与 C4P8a 是同一个量 I(两个 log 相减),C03 W2 记下的漏口。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C02 heads 的 I 族'
- id: C4P8c_I_minute_sum
  action: ban
  pattern: '{day_sum|day_mean}(Ret)'
  w: 0
  why: '第 0 分钟的 Ret 恒为 0,所以分钟收益的日内和 / 均值就是 I(差一个常数倍),也是 C02 heads ts_decay_linear(day_sum(Ret), 30)、
    ts_pearson(day_sum(Ret), 30) 的原料。只禁直接作用在 Ret 叶子上的写法;day_sum(pow_2(Ret)) 不在内。两个 idea 的日收益都用
    ts_delta(log(day_last(Close)), 1)(收盘到收盘,含隔夜),不经过它。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C02 heads ts_decay_linear(day_sum(Ret), 30) 0.78、ts_pearson(day_sum(Ret), 30) 1.75'
- id: C4P9a_constant_over_tree
  action: ban
  pattern: 'div($w, _)'
  unless: '__never__(_)'
  w: 0
  why: '常数 ÷ 子树 = 子树取倒数,截面排序相同或整体反转(方向由奖励选),白花一次付费评估。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C01 / C02 heads 中的常数包装'
- id: C4P9b_tree_over_constant
  action: ban
  pattern: 'div(_, $w)'
  unless: '__never__(_)'
  w: 0
  why: '子树 ÷ 常数 = 缩放,同 C4P9a。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C02 heads add(cs_first_high20(·), −5) 一类常数包装'
- id: C4P10_symmetric_style_folds
  action: ban
  pattern: '{abs_|pow_2}({cs_demean|cs_robust_z}(_))'
  w: 0
  why: '截面去均值后取绝对值或平方,得到的是离截面中心的距离。对风格变量(含 C04 新加的市值)来说,这就是线性中性化剔不掉的非线性风格:
    控制只去掉 z(rank(LogFloatCap)) 的线性部分(PLAN §4 局限 2)。找到它是风格漏口,不是机制。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C03 直接检验 H6/v8 abs_(cs_demean(cs_rank(cross_mean(day_sum(Amt), 30)))) train +0.31 / valid −0.05'
  - 'research/coldstart_C04/hypotheses_r1.yaml: 文件头「自己定的硬规矩」中 LogFloatCap 非线性变换一条'
- id: C4P11a_c03_volume_return_pairing
  action: ban
  pattern: '{day_corr|day_cov}(_, @flow)'
  w: 0
  why: '分钟收益与分钟成交量的配对是 C03 B 组 C2a 的 head 族(cross_ema(day_corr(Ret, Volume), 30) 等),day_corr(Low, Volume)、day_cov(Vwap, Amt)
    也在 C03 A 组的 heads 里。在这里找到的东西不新(PLAN §3:与 C01–C03 heads |ρ| < 0.7)。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C03 heads cross_ema(day_corr(Ret, Volume), 30)(5 个运行)、inv(sigmoid(ts_scale(day_corr(Low, Volume), 30)))、sigmoid(cs_first_high40(day_cov(Vwap, Amt), ·))'
- id: C4P11b_c03_volume_return_pairing_rev
  action: ban
  pattern: '{day_corr|day_cov}(@flow, _)'
  w: 0
  why: '同 C4P11a,参数顺序反过来的写法:C03 head cross_mean(day_corr(Volume, div(Ret, Volume)), 60) +1.43、day_cov(Amt, Amt)。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C03 heads cross_mean(day_corr(Volume, div(Ret, Volume)), 60)、cross_mean(day_corr(div(Ret, Volume), Volume), 241)'
- id: C4P11c_c03_return_pairing_any
  action: weight
  pattern: 'day_corr(Ret, _)'
  unless: '__never__(_)'
  w: 0.2
  why: 'C4P11a 的漏口:成交量藏在子树里,例如 C03 head cross_mean(day_corr(Ret, div(div(abs_(Ret), Volume), Volume)), 60)。只降权、不禁。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C03 heads cross_mean(day_corr(Ret, div(div(abs_(Ret), Volume), Volume)), 60)'
- id: C4P11d_c03_signed_impact
  action: weight
  pattern: 'day_signed_ratio(_, _)'
  unless: '__never__(_)'
  w: 0.2
  why: '冲击不对称占比是 C03 B 组 C2a 的另一支 head 族(cross_mean(day_signed_ratio(Ret, div(abs_(Ret), Volume)), 60) 出现在 7 个运行里)。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C03 heads cross_mean(day_signed_ratio(Ret, div(abs_(Ret), Volume)), 60)、cross_sum(cross_mean(day_signed_ratio(Ret, div(Ret, Volume)), 60), 30)'
- id: C4P11e_c03_volume_centroid
  action: weight
  pattern: 'day_centroid(_)'
  unless: '__never__(_)'
  w: 0.2
  why: '成交量在日内的时间重心是 C03 的 head 族:A 组 612A 的 ts_mean(pow_3(ts_mean(day_centroid(Volume), 10)), 10),B 组 602B 的 cross_ema(cross_ema(day_centroid(Volume), 3), 3)。
    C01 B12 也记过:含 centroid 的通过者全部带流动性叶子,是装饰。'
  evidence:
  - 'research/coldstart_C04/prior_c04.md: C03 heads 中 day_centroid(Volume) 一族 5 个'
  - 'research/coldstart_C01/beliefs_r3.md: B12'
- id: C4P11f_c03_vol_of_vol
  action: ban
  pattern: 'cross_stddev({day_std|day_var}(_), $w)'
  w: 0
  why: '日内波动在日与日之间的波动是 C03 B 组 C2b 的 head 族,例如 cross_stddev(day_std(Ret), 60),以及带 es_ratio / hurst / valid_count 分母的变体。
