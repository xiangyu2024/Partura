ideas:
- id: C2a_limit_scaled_lottery
  hypothesis: '日收益的上尾离本板涨停越近、越频繁的股票随后跑输;多头腿是日度走势离涨停最远、上尾最薄的安静股票。
    上尾用三类量刻画:近 1–3 个月的最大单日涨幅 ÷ 本板涨跌停幅度、接近涨停的天数、上尾三阶矩 / 上下半幅之比 / 连涨。
    本轮新字段 LimitWidth 当尺子:同样 9.8% 的涨幅,在主板是涨停,在 20% 板块不是。'
  thesis:
    mechanism: '谁跑赢:近 1–3 个月里没有接近涨停的大涨日、上尾相对本板涨跌停幅度最薄的股票 —— 多头腿是「最不像彩票」的那一端,不是彩票股本身。
      A 股散户的彩票需求集中在涨停附近:涨停是最显眼的注意力事件(涨停榜、打板、连板),投资者为「再来一个涨停」的小概率大涨多付钱
      (Bali–Cakici–Whitelaw 2011 的 MAX、Barberis–Huang 2008 的偏度偏好;都是先验文献,不是本样本的证据)。
      十分位多头书的基准是全体等权,被追捧的彩票股收益偏低、拉低了基准,多头腿取到的就是这个差额。所以即使文献把利润记在空头腿,
      这条机制在纯多头、相对等权的书里也有一份。
      涨跌停幅度随板块和日期而变:主板 10%;创业板 2020-08-24 起、科创板自开板起为 20%;北交所 30%。用 LimitWidth 归一之后,「离涨停多近」在不同板块之间可比。
      归一只做到这个程度(主研本机算的):ts_delta(log(·)) 是对数收益,而 dailyfields.derive 的 LimitWidth 是简单收益口径的 0.10 / 0.20 / 0.30,
      所以涨停那一天的比值按板块是 log(1.1)/0.1 = 0.953、log(1.2)/0.2 = 0.912、log(1.3)/0.3 = 0.875 —— 还剩约 8% 的板块依赖,
      种子 6、7 的 0.8 阈值因此在主板相当于「到涨停的 84%」、20% 板 88%、北交所 91%。(总领复审更正:这里原写「train 段几乎全是 10% 板,样本内可以忽略」,不对。
      train 是 2018-01-02 ~ 2021-12-31,科创板 2019-07 起、创业板 2020-08-24 起是 20%,train 的最后约三分之一与整个 valid 段里约四分之一到三分之一的股票不是 10% 板,
      所以这条残余在样本内就起作用,只是幅度小。)改用 log(1 + LimitWidth) 当分母能消掉它,但种子 6、7 已经顶在 seed_max_depth = 9 上,加一层就会被 gp.py 丢掉,所以本轮保留简单口径并记下。
      这是新字段的一种 GP 很难凑出来的用法:随机叶子要正好落在日收益的分母上。按深度说更硬(主研本机核过):随机半代按 min_depth = 2、max_depth = 4 生成,
      而核心骨架 cross_max(div(ts_delta(log(day_last(Close)), 1), LimitWidth), d) 深度 6,随机树到不了,这个邻域只能由种子带进去。
      奖励的控制里只有分钟波动水平(线性)和 20 日反转;上尾的形状不在控制里,包括相对自身波动的极值、相对涨停的位置、上下不对称、连涨。
      与 C03 的日内跳跃族(日内波动的波动、分钟峰度)不是一个尺度:这里全部是收盘到收盘的日收益。
      总领复审补的三条。
      (i) 板块倾斜:除以 LimitWidth 不只是换尺子。20% / 30% 板股票的日波动比主板高得远不到一倍,所以它们的 X 系统性偏小,
      方向 −1 的多头书会在 train 的后三分之一和整个 valid 段超配创业板 / 科创板 / 北交所;奖励的控制里没有板块,这份倾斜原样进分数。
      种子 14(原始 MAX 对 LimitWidth 做 cs_regres,即按板块去均值)是它的对照,见 fails_if (h)。
      (ii) 同一构造的样本内先验(prior_c04.md 的 C02 直接检验 H7_daily_max_lottery;那里的奖励是不中性化的 long,不是本轮的 long_neutral):
      日收益 MAX 方向 −1 train −0.38 / valid +0.66、ρ已知 +0.43;MAX ÷ 自身波动 −0.67 / +0.21;日收益偏度 ts_skew(·, 40) 方向 −1 +0.47 / +0.54(差 0.03 过线);
      日收益波动 −0.95,ρ已知 0.51 被拒。读法:不中性化时做多低 MAX 比做多低波动好约 0.6(train),MAX 里波动之外的那部分方向是对的;
      但 MAX 与已知族 ρ 约 0.4,贴着拒绝线;偏度离已知族远、最接近过线。C01 beliefs_r3 B15 的分钟偏度读数四条方向也全是「做多低偏度」(都离门槛远)。
      所以偏度 / 不对称这一支(种子 8–12、20)是证据最强的一支,种子 20 就是 C02 那条偏度按板块去均值。
      (iii) 多头腿的账:如果超额只来自「彩票股跑输」,十分位纯多头书只拿到约十分之一(彩票股在等权基准里只占一成)。
      能让安静股自己跑赢的是偏度偏好的均衡含义(Barberis–Huang:给定波动,正偏度股被高估、负偏度股被低估;先验),
      所以多头腿的论证在偏度写法上最干净,在 MAX 写法上最弱。'
    counterparty: '追涨停、打板、追连板的散户与短线资金,以及冲着涨停榜买入的注意力驱动型买家:他们为接近涨停的上尾付溢价,
      把期望收益让给持有日度走势平稳、从不上涨停榜的股票的一方。'
    prediction: '(1) 20 个种子里至少 1 个 score ≥ 0.5:22%。种子分数的中位数在 −0.3 到 +0.2 之间。
      (2) 方向:分数 > 0 的种子里 ≥ 80% 选 −1,即做多上尾最薄的一端;连涨种子 cross_autocorr_s1 也选 −1。
      (3)(总领复审改写)train 上种子 2(MAX / L,30 日)≥ 种子 14(按板块回归的原始 MAX,30 日):50%;
        valid 上种子 14 ≥ 种子 2:60%。valid 段约三分之一的股票不是 10% 板,X 的板块倾斜在那里最大。
        这一条带先验污染:我知道 2022–2023 年创业板 / 科创板整体弱于等权全市场。
      (4) 名义价格十分位内去均值(种子 18)保留种子 2 的 train 分数的 ≥ 70%:60%。
        波动十分位内去均值(种子 19)保留 ≥ 70%:55%。种子 19 分桶用的 cross_mean(day_std(Ret), 20) 与奖励里的波动控制是同一条表达式
        (主研核过 scripts/idea_search.py 的控制清单),所以它读到的正好是「线性控制剔不掉的那部分波动」,不是另一个波动代理。
      (5)(总领复审改写)换手 0.03–0.06,241 日写法 ≤ 0.035。MAX 类种子(1–7、13、14、16–19)|ρ已知| 在 0.25–0.48、
        偏度 / 不对称类(8–12、15、20)< 0.25:70%(依据 C02 H7:MAX ρ +0.43、偏度 +0.18)。
        8 次运行里至少 1 个 C2a 候选因 |ρ已知| ≥ 0.5 被拒(最可能是种子 3、16、17 的长窗口后代):60%。
      (6) 8 次运行合计至少 1 个新 head(score ≥ 0.5、|ρ已知| < 0.5、与 C01–C03 heads |ρ| < 0.7):32%。
        有的话,train 是约束腿(train < valid):75%;它落在偏度 / 不对称这一支(种子 8–12、20 及其后代):60%。
      (7) 种子 20 与种子 11 的分数差 |Δ| < 0.15:65%(偏度按股票自身标准化,板块均值差不大)。'
    fails_if: '(a) 通过者选 +1(做多彩票端):与机制相反。按 W1 的统一判据 (c),可以记为发现,不能说成机制成立。
      (b) 原始写法过线,而名义价格十分位内去均值的种子 18 及其后代 ≤ 0:读到的是低价 / 粗刻度 / 幸存者偏差,按 H4/v4 那一类处理,不算机制。
      (c) 原始写法过线,而波动十分位内去均值的种子 19 ≤ 0:读到的是非线性波动(控制只去掉线性部分)。
      (d) 通过者与 C03 日内跳跃 heads 的残差 |ρ| ≥ 0.7:不新。
      (e) LimitWidth 归一的写法都不比种子 11(原始日收益偏度)、种子 14(按板块回归的原始 MAX)好:
        新字段没有贡献,机制可能仍成立,但「C04 的增益来自新字段」这句话不能说。
