# C01 第 3 轮(最后一轮)的指引(research/coldstart_C01/PLAN.md §2.5)。只看本实验 B 臂自己的 15 次运行
# (R1 共用的 8 次 + R2 的 7 次;207B 两次都失败,按 PLAN §6 修订 2 记 0)、算子内核源码与 partura/ 的代码。
# 公开文献常识一律在文本里标「先验」。pool 原样照抄 C00_base.yaml,奖励 long 不动。
#
# 先接受 R2 的结论,不改故事:
#   - R2 的两个 idea 在样本内就失败了,而且主要是实现失误,不是机制被证伪。(1) ban 是按写法匹配的(@flow 只匹配
#     裸叶子),GP 一层包装就绕开(day_last(pow_1_5(Amt))、day_std(Amt) 根本没被禁);(2) must-contain 只查记号
#     在不在表达式里(idea_search.py 的 hood 判定),一个装饰性的 day_centroid(Ret) 就能满足;(3) 12 个机制种子
#     都是日频原始形式,换手 0.10–0.145,被 15bp 单边成本杀死(换手 ≥0.08 的 58 个候选只过线 2 个,中位分数 −0.66)。
#   - R2 的 2 个 head 是被 cs_first_low20 平移过的流动性(未平移孪生 |ρ| 0.91),不算 C2a 成立;C2b 按
#     beliefs_r2 §6 放弃(205–208 里 |ρ|<0.5 的通过者 0 个)。
#   - C2a 的机制本轮**不复测**:它自己写下的失效条件 (c) 触发了 —— 隔夜减日内的两种写法(Ret 首分钟版 −0.40、
#     价格比值版 −1.12)在 train 上都选了 +1,即做多「靠隔夜到账」的那一侧,与机制预测的方向相反。把成本
#     加回去只能说明毛收益可能为正,救不了方向。隔夜/日内的比值写法并没有被本轮任何先验禁掉(C3P6 的 unless
#     原样放过价格作分子的 div),305–308 的开放搜索仍然可以走到那里;本轮只是不为它花一张卡和 4 次运行。
#
# 这一轮改变做法:**按叶子和算子词表关掉已知族,不再按写法逐条堵**。
#   口径:|ρ| = max(|rho_pool|, |rho_known_traded|),缺失退 |rho_known|;「通过」= score ≥ 1。
#   15 次运行合计 1187 个存档候选、568 个通过者、20 个 head(与 digest_r3.md 逐字一致)。
#   下面 11 条先验在这 568 个通过者上的命中率是 **100%**,20 个 head 也全部命中。这不是误伤,是本实验到现在
#   为止的通过者**全部**落在四类东西里:流动性叶子(500 个通过者,其中 |ρ|<0.5 的只有 11 个 = 2.2%)、
#   nt_* 分钟×股票截面(163/8)、104 族的 day_distinct_ratio(90/33)、价格单位日内离散度 day_std|day_var(@price)
#   (104/38)。按 PLAN §3.1 的跨轮贪心去重,已经找到的那些 head 再找一次是零增量(beliefs_r2 B10),
#   所以把它们关掉按主判据不花代价。代价在别处,写明白:
#     (a) 量价交互类 idea 在 R3 全部出局;
#     (b) 幸存下来的 114 个已有候选里**一个通过者都没有**,最高分 +0.688 —— R3 是一次押在没搜过的空间上的
#         下注。如果 R3 回来是 0 个通过者,那就是「在这个奖励下,除了这四类之外没有东西」的答案,要如实记,
#         不许事后把它说成指引的问题或空间的问题二选一:两种可能性靠 sampling 计数和幸存候选的分数分布区分。
#
# 两条强制通道的机械事实(自己在本机实测过,不是推断):
#   - 算子名级的 ban 会被 Guidance.operator_weights() 折叠成按算子名的粗权重,经 ac_plugin.arm_hooks 传成
#     TypedTreeGenerator 的 op_weight;generator._pick_weighted 把权重 0 的算子**直接剔出抽样**(整个面都是 0
#     时那个面退出抽样)。实测:加上本文件的先验后,65 个可搜索 nt_* 算子全部权重 0、nt 面退出,3000 棵生成树里
#     含 nt_*、ts_spearman、day_distinct_ratio 的各 0.00%(对照臂同样 3000 棵里是 6.57% / 1.33% / 3.93%)。
#     所以 C3P2/C3P3/C3P4 是词表级的,不依赖 accept,207B 那种落盘事故在 R3 不可能重演。
#   - **叶子级的 ban 只走 accept 这一道**:叶子抽样(generator._leaf/_collapse_leaf)对 self.fields 做均匀抽取,
#     根本不读 op_weight,所以 C3P1 不改变提议分布(实测含流动性叶子的生成树 36.8% → 35.7%),它是在 accept
#     里逐棵拒掉。generate() 在 accept 连续失败 max_retries*4 = 64 次后会走 fallback,那里不再问 accept(只查
#     AlphaCube 自己的 banned_substructures,而 Partura 从不往那里写),理论上会漏出被禁的树。本规则集下实测
#     1500 次 generate:C3a 邻域每棵树平均 4.8 次提议(banned 61.4%、outside 17.6%、accepted 20.8%)、
#     I0 每棵 2.3 次(banned 55.5%、accepted 43.7%),**两者 fallback 都是 0 次,返回的树里被禁的 0 棵**
#     (因为干净树仍占三分之一以上)。这是本文件唯一的「软」禁令,预测里按 ≤2% 的漏网写。
#
# 种子分配(交给 scripts/c01_jobs.py 的那份):
#   [{"idea": "C3a_slow_lottery_shape", "seeds": [301, 302, 303, 304]},
#    {"idea": "I0_open_search",         "seeds": [305, 306, 307, 308]}]
#   第二个 idea 刻意是 C00 的开放搜索(无种子、无邻域),所以 305–308 的 B 臂 = 对照 + 本文件的先验。
#
# 总领审定(R3,写在开跑之前):批准主研的做法与两个 idea,改了三处,理由逐条写在规则的 why 里。
#   (1) 加 C3P10:把 R2 的 C2P6(加权价格水平 day_wmean/day_wstd/day_topw_mean(@price, _))带回来并补 day_cov(@price, _)。
#       草案没带它也没写理由,而幸存候选前 16 名里 5 个正是它挡的吸引子,另有 7 个以 day_cov(@price, _) 为核(C3P5 的孪生);
#       本机实测草案下 I0 新生成的树里 9.4% 落在这两类上,加上本条后 0%,代价是每棵树的提议数 2.35 → 2.56。
#   (2) 加 C3P11a / C3P11b:控制种子 7、8 的算子被 idea_search.py 的 IDEA_OPS 按 8 倍提权(种子算子自动并入),
#       卡里「后代不会繁殖」并不成立。这两条让控制种子只给一次参照读数(种子按 seeds_repr 放行、照常打分),
#       它们的子树不再进 C3a 的后代 —— 否则 C3a 可能读到的是零收益分钟(流动性)或慢波动,而不是彩票形状。
#   (3) C3a 的 hypothesis 更正一处事实:慢偏度测过一次(R2/206 的 ts_decay_linear 版本,+0.215,方向对)。
#   先验因此是 14 条(12 ban + 2 weight 0.2;主研的 11 条一字未改)。主研卡 cards_r3.md 未改,与本文件不一致处以本文件为准。
#   理由是 B 臂自己的证据:R1 的 18 个 head 全部来自开放搜索,R2 加了 must-contain 邻域之后只有 2 个、而且是
#   洗过的流动性;而 R2 的 outside 只占提议的 10–22%,说明邻域是被装饰性满足的。把一半算力押在「只有先验的
#   开放搜索」上,既是对冲,也是对本轮主要工具(先验)的一次干净 A/B —— 305–308 的 A 臂是同种子的纯对照。
version: 1
batch: C01_r3
evidence_base:
  digest: research/coldstart_C01/digest_r3.md
  episodes: c01r1s101..c01r1s108_I0_open_search, c01r2s201B..c01r2s208B (207B 失败,记 0)
reward: []
evaluation: []
priors:
- id: C3P1_no_flow_leaves
  action: ban
  pattern: '@flow'
  w: 0
  why: '把「量」这一侧整个关掉:表达式里任何位置出现 Amt 或 Volume 叶子就不提议。B 臂自己的读数是含流动性
    叶子的通过者 500 个、其中 |ρ|<0.5 的只有 11 个(2.2%),而不含它们的通过者 68 个里 49 个(72%)是低 ρ ——
    在这个奖励下「量」几乎只能生产已知族的改写。按写法逐条堵已经试过并失败(R2 的 C2P1–C2P4 被 day_std(Amt)、
    day_last(pow_1_5(Amt)) 一步变异绕开),所以改成按叶子。代价是量价交互类 idea 在 R3 全部出局,接受。
    可证伪:若这条对,R3 八次运行的通过者里含流动性叶子的 ≤2%(实测 1500 次 generate 漏网 0 次),而通过者里
    |ρ|<0.5 的占比 ≥50%(R1 21%、R2 1.4%);若 R3 的通过者里仍有 >20% 含流动性叶子,说明禁令被 generate 的
    fallback 绕开(叶子抽样不读 op_weight,只有 accept 一道),下一轮必须把禁令接到 banned_substructures 上。'
  evidence:
  - 'research/coldstart_C01/digest_r3.md: 叶子富集表 Amt lift 1.53(633 个候选里 464 个通过)、Volume 1.18,
    而 Ret 0.90、Open 0.78;通过者前 60 里 day_wstd(Amt, Amt) +2.28/ρ+0.78、day_wmean(Amt, Amt) +2.22/ρ+0.83
    都不是 head'
  - 'episodes/c01r1s101_I0_open_search/evidence.json: 77 个通过者、heads 0,主干是 day_sum(Volume) 与
    day_var(Low) 的膨胀链;episodes/c01r1s106_I0_open_search/evidence.json: 31 个通过者、heads 0'
  - 'episodes/c01r2s203B_C2a_when_the_return_arrives/evidence.json: 53 个通过者里绝大多数是
    day_last(in_max(mul(Amt, Amt))) 一族,裸写法 ρ+0.81;两个 head 都是它被 cs_first_low20 平移后的版本'
- id: C3P2a_nt_minute_cross_one_arg
  action: ban
  pattern: '{nt_cs_demean|nt_cs_mask_top_replace_mean|nt_cs_mask_top_replace_mean_neg|nt_cs_mean|nt_cs_median|nt_cs_normalize|nt_cs_quantile_q25|nt_cs_quantile_q50|nt_cs_quantile_q75|nt_cs_rank|nt_cs_robust_z|nt_cs_scale|nt_cs_stddev_full|nt_cs_sum|nt_cs_winsor}(_)'
  w: 0
  why: '环境约束,不是研究结论:分钟级跨股票截面算子与日内折叠混用时,引擎要把整块 (股票, 日, 分钟) 中间量
    落盘(每节点约 6.8 GB),R2 有一次运行因此写满数据盘、两次重跑都在第 1 代就死,C2b 另外两次跑了 3474 秒和
    9824 秒;R3 单任务上限 180 分钟,跑死或超时就是该种子记 0。研究上的代价也小:含 nt_* 的通过者 163 个里
    |ρ|<0.5 的只有 8 个。本条按调用元数分三条(a/b/c),是因为模式必须匹配调用形态,不是三条独立主张。
    可证伪:若这三条对,R3 八次运行的存档里含 nt_* 的候选是 0(走的是词表通道:operator_weights() 把 65 个
    可搜索 nt_* 算子的权重打到 0,_pick_weighted 把权重 0 的算子剔出抽样、nt 面整个退出),每次运行墙钟
    < 60 分钟,没有任务被磁盘守护或时限杀掉;若仍出现 nt_* 候选,说明我对 op_weight 通道的读法错了。'
  evidence:
  - 'research/coldstart_C01/digest_r3.md: 失败的运行表(c01r2s207B 退出码 143,磁盘守护「free 57G < 60G:
    spill 196G, killing」)与「秒」一列(205 → 3474、206 → 9824,C2a 四次是 764–1964)'
  - 'episodes/c01r2s205B_C2b_turnover_on_the_up_minutes/evidence.json: 存档 80 个候选里 98.8% 含 nt_ts_*,
    72 个通过者、heads 0;episodes/c01r2s206B_C2b_turnover_on_the_up_minutes/evidence.json: 12 个通过者、heads 0'
- id: C3P2b_nt_minute_cross_two_arg
  action: ban
  pattern: '{nt_cs_bucket_demean|nt_cs_bucket_rank|nt_cs_bucket_zscore|nt_cs_first_high20|nt_cs_first_high40|nt_cs_first_low20|nt_cs_first_low40|nt_cs_flip_by_state|nt_cs_last_high05|nt_cs_last_high10|nt_cs_last_high20|nt_cs_last_high40|nt_cs_last_low05|nt_cs_last_low10|nt_cs_last_low20|nt_cs_last_low40|nt_cs_regres|nt_cs_state_rank|nt_ts_argmax|nt_ts_argmin|nt_ts_autocorr_s1|nt_ts_decay_linear|nt_ts_delay|nt_ts_delta|nt_ts_hurst|nt_ts_kurt|nt_ts_max|nt_ts_mean|nt_ts_med|nt_ts_min|nt_ts_outlier_33|nt_ts_pearson|nt_ts_product|nt_ts_quantile_q25|nt_ts_quantile_q50|nt_ts_quantile_q75|nt_ts_rank|nt_ts_scale|nt_ts_shift|nt_ts_skew|nt_ts_spearman|nt_ts_std|nt_ts_stddev|nt_ts_sum|nt_ts_var}(_, _)'
  w: 0
  why: '同 C3P2a(带窗口的 nt_ts_* 和两操作数的 nt_cs_* 调用形态是 op(x, y))。这一条是三条里唯一碰到 head 的:
    它命中 R1 种子 105 的两个 head(day_median(nt_cs_last_high40(...))),但按 PLAN §3.1 跨轮去重,R3 再找到
    它们的孪生是零增量,而它们带来的运行成本是上面那三条环境事实。可证伪:若这条对,R3 存档里含 nt_ts_*/
    nt_cs_* 的候选为 0,而且 8 次运行没有一次超过 90 分钟;若有运行仍然因落盘被杀,说明慢的不只是 nt_ 这一族。'
  evidence:
  - 'research/coldstart_C01/digest_r3.md: 算子富集表里 nt_ts_quantile_q25 lift 2.09(21 个候选全部通过)、
    nt_ts_decay_linear 2.03、nt_cs_normalize 1.84 —— 这一族极容易过门槛,却只贡献 2 个 head(R1 种子 105)'
  - 'research/coldstart_C01/digest_r3.md: 「注意:分钟级跨股票截面算子(nt_cs_* / nt_ts_*)与日内折叠混用的
    表达式,引擎要把整块 (股票, 日, 分钟) 中间量落盘,每个节点约 6.8 GB,并且很慢;R2 有一次运行因此写满数据盘」'
- id: C3P2c_nt_minute_cross_three_arg
  action: ban
  pattern: '{nt_ts_corr|nt_ts_cov|nt_ts_reg_fvalue|nt_ts_reg_tvalue|nt_ts_regalpha|nt_ts_regbeta|nt_ts_regres}(_, _, _)'
  w: 0
  why: '同 C3P2a(成对滚动的 nt_ts_* 调用形态是 op(x, y, win))。本实验里它只命中 1 个候选、0 个通过者,写它
    是为了把 nt 面关干净 —— 留一个算子不禁,_pick_weighted 会按「存活算子的平均权重」给 nt 面重新分配质量,
    那一个算子就会被反复抽到。可证伪:若这条对,R3 存档里这七个算子出现 0 次;若出现,说明我对 op_weight 的
    面内归一读法错了。'
  evidence:
  - 'research/coldstart_C01/digest_r3.md: 1187 个候选里这七个算子合计出现 1 次,0 个通过者(算子富集表里
    出现 ≥3 次的名单里没有它们)'
- id: C3P3_ts_spearman_runtime
  action: ban
  pattern: ts_spearman(_, _)
  w: 0
  why: '也是环境约束:ts_spearman 的内核对股票维保留显式 Python 循环(5207 次),每次循环内部再算 (T, d, N−1)
    的张量,总计算量随股票数平方增长;本实验里唯一大量提议它的那次运行(种子 206)墙钟 9824 秒 ≈ 2.7 小时,
    是 B 臂最慢的一次,而 R3 的时限是 180 分钟。它的同构替身 ts_pearson 完全向量化(不取秩、用批量矩阵乘),
    在本实验里跑过而且便宜(种子 203 那次运行 841 秒,存档里有 ts_pearson(day_argmin(Open), 20) +0.64/|ρ|0.21/
    换手 0.030),所以这条只禁 ts_spearman、把 ts_pearson 留着 —— 「跨股票同期相关」这个读数并没有被关掉。
    可证伪:若这条对,R3 没有任何运行超过 90 分钟,而含 ts_pearson 的候选照常出现在存档里;若 R3 出现含
    ts_pearson 的高耗时运行,说明慢的不是秩计算而是这一族本身,下一轮要连 ts_pearson 一起禁。'
  evidence:
  - 'research/coldstart_C01/digest_r3.md: 种子 206 墙钟 9824 秒(B 臂最慢),它的存档与「没过线里分数最高的
    30 个」里大量是 sub(1, ts_spearman(day_skew(...), 50)) 一族;同一张表里种子 203 是 841 秒'
  - 'episodes/c01r2s206B_C2b_turnover_on_the_up_minutes/evidence.json: 含 ts_spearman 的候选 23 个,
    其中通过门槛的只有 1 个、|ρ|<0.5 的通过者 0 个'
- id: C3P4_distinct_ratio_family
  action: ban
  pattern: day_distinct_ratio(_)
  w: 0
  why: 'day_distinct_ratio 是 R1 种子 104 那一族的签名分子:它出现在 90 个通过者、13 个 head 里,占本实验
    20 个 head 的 65%。内核读的是「当天不同报价个数 ÷ 有效分钟数」,一价日恰好等于 1/241,本质是价格刻度
    粗细(低名义股价)的代理,不是一个机制。按 PLAN §3.1 的跨轮贪心去重,R3 再找到它的孪生只要分数低于 R1
    的 +2.72 就是零增量(beliefs_r2 B10),所以这条禁令按主判据不花代价、只省算力。可证伪:若这条对,R3 的
    通过者里没有一个的核是「某个分位或离散度 ÷ day_std」这种 104 族形状,而通过者总数不低于 R1 同种子水平的
    一半;若 R3 的通过者为 0、且幸存候选的最高分仍低于 +0.7,说明我连带关掉的不只是 104 族,R3 之后应改成降权。'
  evidence:
  - 'research/coldstart_C01/digest_r3.md: heads 表里 12/20 个 head 的核是
    cs_mask_top_replace_mean_neg(inv(div(day_distinct_ratio(Vwap), day_std(Close)^k))) 一族(全部来自种子 104),
    另有 cs_first_low20(day_distinct_ratio(Close), day_distinct_ratio(Close)) +1.02'
  - 'research/coldstart_C01/beliefs_r2.md: B10「跨轮去重是按 score 从高到低贪心…所以『再收割 104 族』最好的
    情况也是零增量」;B3 把这一族读成「低名义股价 × 价格单位日内离散度的内层分位带」'
- id: C3P5_price_unit_dispersion
  action: ban
  pattern: '{day_std|day_var}(@price)'
  w: 0
  why: '价格叶子的日内标准差/方差是「名义股价 × 日内波动」,量纲随股价走,是 pool(成交额离散度)的近亲而
    不是无量纲特征;它是 104/107 族的第二个核,出现在 104 个通过者、10 个 head 里,同样按跨轮去重是零增量。
    刻意只禁价格叶子:day_std(Ret) 是无量纲的已实现日内波动,本轮的种子要用它做归一化,不在禁令内。
    可证伪:若这条对,R3 的通过者里不再出现 cs_mask_*(day_std(@price)) 这一族,而 day_std(Ret) 作为分母照常
    出现在通过者里;若 R3 的通过者里一个含 day_std(Ret) 的都没有,说明我把归一化的路也一起堵了。'
  evidence:
