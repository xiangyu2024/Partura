ideas:
- id: C3a_slow_lottery_shape
  hypothesis: '一只票的分钟收益分布长期右偏、右尾长、极值相对自身波动大,说明它长期在满足散户的彩票需求 ——
    买家要的是「可能一把涨很多」的形状,愿意为这个形状让渡期望收益。把这个形状做成**慢变量**(日内形状逐日
    算完,再按 30–60 个交易日归并),它就是一个股票特征而不是一笔交易;做多形状最不像彩票的那一侧。R1/R2
    几乎没有在可存活的换手下测过这件事:B 臂里裸 day_skew(Ret) 的换手 0.0946、裸 day_es_ratio_hi(Ret) 的换手
    0.1004,年化成本拖累 7.2%/7.6%,两个都被成本拖成负分;而 cross_mean 在 1187 个候选里只出现过 1 次、
    cross_med 2 次、ts_mean 3 次 —— 「日内形状 + 慢归并」这个写法几乎是空白。(总领更正:慢形式**测过一次**,
    R2 种子 206 的 sub(1, ts_decay_linear(day_skew(Ret), 50)) +0.215(train +0.21 / valid +0.52,sign +1 即做多
    低慢偏度,方向对;换手 0.039、|ρ_known| 0.16、还原毛 train 年化 ≈+4.4%)。所以裸的慢偏度离门槛很远,本卡
    要过线靠的是右尾、极值÷自身波动、上下不对称那几支,或者 GP 把它们组合起来;种子 1 本身预期只有 0.1–0.5。)'
  thesis:
    mechanism: '先验(公开文献,置信中等):彩票型需求 —— 已实现偏度、日内 MAX、特质偏度在横截面上有负溢价,
      通常解释为投资者对小概率大赢的偏好与过度加权,A 股散户占比高、这类需求更强。本实验自己的证据只能说:
      B 臂测过这个形状的裸日频写法、方向选的是「做多低彩票形状」那一侧,但被成本杀死。机制读数全部是无量纲
      的形状量(偏度、峰度、尾均值÷分位、极值÷自身波动、上下半幅之比),不含价格水平、不含成交额,和 pool
      (成交额离散度)讲的不是一件事;慢归并(cross_mean/cross_ema/cross_med 30–60 天)既是为了把它变成特征、
      也是为了把换手压到 0.06 以下 —— 这是 R2 的教训,不是调参。竞争性先验:分钟收益的尾部形状会被价格刻度
      牵着走(低价股一个 tick 就是几十 bp,极值更大、零收益分钟更多),那是刻度代理不是彩票需求,所以种子里
      放了两个专门的控制读数(见 fails_if (d))。'
    counterparty: '另一边是买「形状」的散户与打板资金:他们盯的是这只票过去一段时间里经常出现的那种日内急拉,
      愿意在今天的价格上多付一点去换一个右偏的分布。他们亏的是期望收益 —— 为小概率大涨多付的那部分,长期由
      向这份需求派发的耐心资金收走。因为这是对「形状」的偏好而不是对「消息」的反应,它可以长期存在、不需要
      买家犯错一次就学会,这也是为什么它应该是个慢变量而不是一两天的事件。'
    prediction: '种子 301–304 这四次运行里:(1) 至少 1 个 head,其核含 day_skew / day_kurt / day_max /
      day_es_ratio_hi / day_es_ratio_lo 之一,并且这个 day_op 落在 cross_mean / cross_ema / cross_med / ts_mean
      之下(不是挂在不决定排名的那一支上 —— 这条要逐个 head 看表达式结构,R2 的 must-contain 就是被装饰性
      满足的);(2) 该 head 的方向是做多低彩票形状的一侧(在 cross_mean(day_skew(Ret), 60) 与
      cross_ema(day_es_ratio_hi(Ret), 30) 这类写法上 sign = −1);(3) 这四次运行通过者的换手中位数 ≤0.05,
      换手 >0.08 的通过者 0 个,hl 选到 20 的占多数;(4) 通过者的 |ρ| 中位数 <0.40,|ρ|≥0.5 的占比 <35%;
      (5) 含流动性叶子的通过者 ≤2%、含 nt_* 与 ts_spearman 的候选 0 个;(6) 至少 1 个通过者来自归一化或
      尾部不对称的写法(种子 3/4/6 的后代),不只是裸 day_skew/day_kurt 的慢均;(7) 两个控制种子
      (cross_mean(day_zero_ratio(Ret), 60) 读一价/刻度、cross_mean(day_std(Ret), 60) 读已实现波动)的 score
      都低于至少两个机制种子,且 cross_mean(day_std(Ret), 60) 的 |ρ| 明显高于机制种子;(8) sampling 计数:
      banned 占提议 55%–70%、outside 10%–25%、accepted ≥15%、scored ≥90;每次运行墙钟 <60 分钟。'
    fails_if: '(a) 4×192 次付费评估后邻域里 |ρ|<0.5 的通过者为 0 —— 这个形状在 2018–2023H1 的截面上没有溢价,
      或者慢归并把信息抹平了(用换手分布区分:若通过者换手普遍 <0.02 且分数普遍 <0.5,是抹平);
      (b) 通过者的 |ρ| 中位数 ≥0.5 —— 彩票形状只是波动/小盘的代理;
      (c) 搜索选到的方向是 +1(做多高彩票形状的一侧)—— 与机制相反,按失效论处,不许事后改故事说这是动量;
      (d) 过线的只有未归一的裸形式,而三支无量纲写法(day_max÷day_std、右尾减左尾、上下半幅之比)一个通过者
      都没有,或者控制种子 cross_mean(day_zero_ratio(Ret), 60) 的分数反而最高 —— 读到的是价格刻度粗细与
      一价日,不是彩票需求;
      (e) 只有 day_kurt(左右对称的厚尾)那一支过线而偏度、右尾那几支都不过线 —— 读到的是特质波动/尾部风险,
      不是「右偏」,这时 hypothesis 要改写成特质尾部风险,不算本卡成立;
      (f) 通过者的 idea day_op 都挂在不决定排名的那一支上(装饰性满足 must-contain)—— 邻域没起作用,机制
      没被测到,不算失效也不算成立,要按「这一轮白跑」记。'
  seeds:
  - cross_mean(day_skew(Ret), 60)
  - cross_ema(day_es_ratio_hi(Ret), 30)
  - cross_mean(div(day_max(Ret), day_std(Ret)), 30)
  - cross_mean(sub(day_es_ratio_hi(Ret), day_es_ratio_lo(Ret)), 60)
  - cross_med(day_kurt(Ret), 30)
  - cross_mean(div(sub(day_max(Ret), day_median(Ret)), sub(day_median(Ret), day_min(Ret))), 60)
  - cross_mean(day_zero_ratio(Ret), 60)
  - cross_mean(day_std(Ret), 60)
  grammar:
    day_ops: [day_skew, day_kurt, day_max, day_es_ratio_hi, day_es_ratio_lo]
    memory_ops: [cross_mean, cross_ema, cross_med, ts_mean]
    ops: [div, sub]
    leaves: [Ret]
    windows: [30, 60]
  reward: long
