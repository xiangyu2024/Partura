# Partura study F111_spearman_qclose  (挖掘 / #953)
# 这份文件只有 S0_baseline 是生成的。后面的阶段、变体、额外控制变量、探针,都要按**这棵树**来写。
factor_id: F111_spearman_qclose
title: "(读完这棵树之后,用一句话写它是什么)"
expression: "ts_spearman(day_quantile(Close), 10)"
baseline_id: v_base

# 用户表里公布的这一行(pick_single_factors 的口径);S0 要先把它复现出来
published: {sign: 1, hl: 10, ls: [2.62, 1.1], long: [0.164, 0.075], lib: "挖掘", name: "#953"}

label: {kind: open_vwap15, horizon: 1, buyable: true,
        verify_against: /root/autodl-tmp/AlphaCube/_bench/trainto/allfac_buyable/_target.npy}
cost_per_side: 0.0015
top_frac: 0.10
rank_by: long          # 半衰期按纯多头书选(用户实际能做的那本书);多空口径每个变体也都会算
horizons: [1, 2, 3, 5, 10, 20]
warmup: 60

# train + valid = 用户的训练段(utrain);holdout = 用户的测试段,只在最后读一次
splits:
  train:   ["20180102", "20211231"]
  valid:   ["20220101", "20230807"]
  utrain:  ["20180102", "20230807"]
  holdout: ["20230808", "20251231"]
  full:    ["20180102", "20251231"]
fit_split: train
user_split: utrain

# ---- 这一批共用的控制变量(都是日频、因果、只用到 t 日收盘)。按这棵树的嫌疑增删。
controls:
  ctl_amt:    "log(add(day_sum(Amt), 1))"                                  # 成交额水平
  ctl_price:  "log(day_last(Close))"                                       # 价格水平
  ctl_ivol:   "day_std(Ret)"                                               # 日内已实现波动
  ctl_range:  "div(sub(day_max(High), day_min(Low)), day_last(Close))"     # 日内振幅
  ctl_rev1:   "div(day_last(Close), ts_delay(day_last(Close), 1))"         # 当日收益(毛比值,秩等价)
  ctl_mom20:  "div(day_last(Close), ts_delay(day_last(Close), 20))"        # 20 日动量
  ctl_dvol20: "ts_stddev(div(day_last(Close), ts_delay(day_last(Close), 1)), 20)"   # 20 日日频波动
external_controls:
  ctl_cap:      /root/autodl-tmp/Partura/shared/log_float_cap.npy        # log 流通市值 —— 把"规模"和"成交活跃"分开
  ctl_turnrate: /root/autodl-tmp/Partura/shared/log_turnover_rate.npy    # log(成交额 / 流通市值)

# ---- 既往研究里确认过的家族,用来分辨"这是不是已知的东西换了个写法"
gates:
  known_amt_max9:    "cross_max(day_sum(Amt), 9)"          # F001:成交额水平 + 极值记忆
  known_stdamt_max9: "cross_max(day_std(Amt), 9)"          # F001 的蒸馏结果
  known_ivol_max9:   "cross_max(day_var(Ret), 9)"          # F001:日内波动 + 极值记忆
  known_stdamt_mean30: "cross_mean(day_std(Amt), 30)"      # B01 第一组里纯多头最好的两算子基准之一
corr_with: [ctl_amt, ctl_cap, ctl_turnrate, ctl_ivol, ctl_dvol20, ctl_price, ctl_rev1, ctl_mom20,
            known_amt_max9, known_stdamt_max9, known_ivol_max9, known_stdamt_mean30]
corr_ids: [v_base, m_mktcorr, s_pearson, l_mean, l_last, l_amt, t_tsrank,
           a_last_10, w_last_5, w_last_20, w_last_30, w_last_50, w_q_30, pl_last_10, p_last_30]   # R2

diagnostics:
  decay:      [v_base]
  by_year:    [v_base]
  neutralise: [v_base, m_mktcorr, t_tsrank, w_last_30, w_last_50]   # R1: 追加 m_mktcorr, t_tsrank；R2: 追加 w_last_30, w_last_50
  profile:    [v_base, m_mktcorr, t_tsrank, a_last_10, w_last_30, w_last_50]   # R1: 追加 m_mktcorr, t_tsrank；R2: 追加 a_last_10, w_last_30, w_last_50
  conditional:
    - {factor: v_base, gate: ctl_cap, buckets: 5}
    - {factor: v_base, gate: ctl_amt, buckets: 5}

stages:
  - id: S0_baseline
    question: "Partura 自己求值出来的原式,能不能复现用户表里公布的那一行?它的钱在多头腿还是空头腿?"
    variants:
      - {id: v_base, group: baseline, expr: "ts_spearman(day_quantile(Close), 10)", why: "原始表达式"}

  - id: S1_whatis
    question: "ts_spearman 的全市场两两配对平均,等价于什么更简单的东西?预测力的载体是价格路径、活跃度,还是实现细节?"
    variants:
      - {id: m_mktcorr, group: substitute,
         expr: "ts_corr(day_quantile(Close), cs_mean(day_quantile(Close)), 10)",
         why: "H1:把 O(N²) 两两配对换成「和一条市场路径做相关」。恒等式说截面序应该高度一致;若 rank 相关高且多头腿相当,配对结构就是多余的(提纯)"}
      - {id: s_pearson, group: substitute,
         expr: "ts_pearson(day_quantile(Close), 10)",
         why: "H6:同样的全市场配对结构,去掉窗口内的秩变换。秩让每只股票在市场路径上等权,Pearson 则让 10 天内价格波动大的股票主导;若 Pearson 同样好,秩就只是个实现选择"}
      - {id: l_mean, group: field,
         expr: "ts_spearman(day_mean(Close), 10)",
         why: "H3:分钟均价几乎不可能出现跨日完全并列,而日内中位价落在 tick 网格上会并列、并列按日期顺序发秩=人工上升斜坡。若与原式差异明显,原式有一部分预测力来自这个实现瑕疵"}
      - {id: l_last, group: ablate,
         expr: "ts_spearman(day_last(Close), 10)",
         why: "H7:删掉日内折叠这一步,直接用当天收盘价。若相当,日内中位价是多余的(更简单的等价写法)"}
      - {id: l_amt, group: field,
         expr: "ts_spearman(day_quantile(Amt), 10)",
         why: "H10:把共动的载体从价格换成成交额。若同样好或更好,这条因子其实是活跃度共动,更靠近已知的成交额家族"}
      - {id: t_tsrank, group: substitute,
         expr: "ts_rank(day_quantile(Close), 10)",
         why: "H2:纯粹的 10 日秩位置动量,没有「乘市场趋势方向」这个条件化。原式明显优于它=条件化有用;相当=这条因子就是个 10 日动量的写法"}

  - id: S2_window
    question: "窗口 d 这根轴上有东西吗?10 天只是任意选择,还是 5~50 里有一个明显更好的频段?"
    variants:
      - {id: a_last_10, group: anchor,
         expr: "ts_spearman(day_last(Close), 10)",
         why: "锚点:和 S1 的 l_last 是同一条表达式(面板走缓存,几乎不花时间),用来保证这一阶段的固定半衰期表和 rank 相关矩阵自成一体,同时当一次可复现性自检 —— 数字必须复现 S1 的 l_last"}
      - {id: w_last_5, group: window,
         expr: "ts_spearman(day_last(Close), 5)",
         why: "H12:更短的频段。若 5 天明显更好,效应是周内的条件共动,和慢速的 day_std(Amt) 家族无关"}
      - {id: w_last_20, group: window,
         expr: "ts_spearman(day_last(Close), 20)",
         why: "H12:d 翻一倍。和 a_last_10 一起给出 d 轴的斜率方向"}
      - {id: w_last_30, group: window,
         expr: "ts_spearman(day_last(Close), 30)",
         why: "H12:月度级频段。若这里开始变好并且和 known_* 的 rank 相关上升,说明它正在滑进已知家族"}
      - {id: w_last_50, group: window,
         expr: "ts_spearman(day_last(Close), 50)",
         why: "H12:窗口池的上界(ts_* 的池是 [1,5,10,20,30,40,50],没有 60)。季度级秩空间共动 = 一个 beta/质量类特征,是 d 轴的端点读数"}
      - {id: w_q_30, group: window,
         expr: "ts_spearman(day_quantile(Close), 30)",
         why: "交叉检验:把 d=30 放回原来的叶子。若它和 w_last_30 相当,说明 H7(日内折叠多余)在长窗口上照样成立,d 的结论不是叶子换来的"}
      - {id: pl_last_10, group: substitute,
         expr: "ts_pearson(day_last(Close), 10)",
         why: "把 H6(秩不是承重件)和 H7(日内折叠多余)两个已确立的简化叠在一起 = 最大程度提纯的那个写法,而且 ts_pearson 是 chunked matmul 实现、比带 Python 循环的 ts_spearman 快得多。这是提纯交付物的候选"}
      - {id: p_last_30, group: substitute,
         expr: "ts_pearson(day_last(Close), 30)",
         why: "d=10 上 Pearson 与 Spearman 等价(0.978),但长窗口里原始价格水平带趋势、逐股标准化压不住,预期两者开始分叉。若 30 天上 Pearson 也不塌,说明秩在任何频段都不承重(提纯更彻底);若塌了,说明长窗口必须用秩"}
