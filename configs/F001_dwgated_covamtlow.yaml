# Partura factor study F001
# Original expression (the AlphaCube-shaped candidate handed to Partura):
#   cross_max(mul(cross_max(day_cov(Amt, Low), 9), pow_3(day_durbin_watson(Open))), 5)
#
# Every stage answers ONE question, and every variant says why it exists.
# Decisions are made on `train`; `valid` confirms; `holdout` is read once, at
# the end, and the ledger records it.

factor_id: F001_dwgated_covamtlow
title: "13 日极值记忆 × 日内量价协方差 × 日内波动门控"
expression: "cross_max(mul(cross_max(day_cov(Amt, Low), 9), pow_3(day_durbin_watson(Open))), 5)"

label: {kind: open_vwap15, horizon: 1}
cost_per_side: 0.0015        # 15 bp 单边,AlphaCube 生产口径
turnover_cap: 0.30
top_frac: 0.10               # 十分位多空,gross 1
horizons: [1, 2, 3, 5, 10, 20]
warmup: 60

# ---- 控制变量(用于中性化;都是日频、因果、只用到 t 日及以前) -------------
controls:
  ctl_amt:    "log(add(day_sum(Amt), 1))"                                        # 流动性 / 规模
  ctl_price:  "log(day_last(Close))"                                             # 价格水平
  ctl_ivol:   "day_std(Ret)"                                                     # 日内已实现波动
  ctl_range:  "div(sub(day_max(High), day_min(Low)), day_last(Close))"           # 日内振幅
  ctl_rev1:   "sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1)"       # 短期反转
  ctl_mom20:  "sub(div(day_last(Close), ts_delay(day_last(Close), 20)), 1)"      # 20 日动量
  ctl_dvol20: "ts_stddev(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), 20)"   # 日频波动

gates:
  gate_dw:  "day_durbin_watson(Open)"
  gate_cov: "cross_max(day_cov(Amt, Low), 9)"

diagnostics:
  decay:        [v_base, v_B, v_D]
  by_year:      [v_base, v_B]
  extreme_days: [v_base, v_B]
  neutralise:   [v_base, v_B]
  conditional:
    - {factor: v_B, gate: gate_dw,  buckets: 5}     # 波动是不是在给量价协方差开关门?
    - {factor: v_D, gate: gate_cov, buckets: 5}     # 反过来呢?
    - {factor: v_base, gate: ctl_amt, buckets: 5}   # 规模桶内还剩多少?

stages:
  # ---------------------------------------------------------------- S1
  - id: S1_components
    question: "整棵树的预测力来自哪一支?两支是相乘(门控)还是相加(两个独立信号)?"
    variants:
      - {id: v_base, group: baseline, expr: "cross_max(mul(cross_max(day_cov(Amt, Low), 9), pow_3(day_durbin_watson(Open))), 5)", why: "原始表达式"}
      - {id: v_A,    group: component, expr: "day_cov(Amt, Low)", why: "只留日内量价协方差,去掉全部记忆与门控"}
      - {id: v_B,    group: component, expr: "cross_max(day_cov(Amt, Low), 9)", why: "协方差 + 9 日极值记忆,去掉门控"}
      - {id: v_C,    group: component, expr: "day_durbin_watson(Open)", why: "只留门控项本身"}
      - {id: v_D,    group: component, expr: "pow_3(day_durbin_watson(Open))", why: "门控项 + 三次放大"}
      - {id: v_E,    group: component, expr: "mul(cross_max(day_cov(Amt, Low), 9), pow_3(day_durbin_watson(Open)))", why: "去掉最外层 5 日记忆"}
      - {id: v_B13,  group: ablation,  expr: "cross_max(cross_max(day_cov(Amt, Low), 9), 5)", why: "把门控整支删掉、记忆保持 13 日:门控到底贡献了什么?"}
      - {id: v_addrank, group: ablation, expr: "add(cs_rank(cross_max(day_cov(Amt, Low), 9)), cs_rank(pow_3(day_durbin_watson(Open))))", why: "同样两支改成相加:相乘若只是'两个信号'则两者接近"}
      - {id: v_mulrank, group: ablation, expr: "mul(cs_rank(cross_max(day_cov(Amt, Low), 9)), cs_rank(pow_3(day_durbin_watson(Open))))", why: "相乘但先抹掉两支各自的尺度:乘法本身是否重要"}

  # ---------------------------------------------------------------- S2
  - id: S2_scale
    question: "day_cov 的齐次度是 2(Amt 一次、价格一次)。这条 alpha 是不是就是'规模 × 价格水平'?"
    variants:
      - {id: v_corr_base, group: scale, expr: "cross_max(mul(cross_max(day_corr(Amt, Low), 9), pow_3(day_durbin_watson(Open))), 5)", why: "cov -> corr:整树去尺度。活下来=尺度不重要"}
      - {id: v_corr_B,    group: scale, expr: "cross_max(day_corr(Amt, Low), 9)", why: "分支层面的 cov -> corr"}
      - {id: v_cov_amtnorm, group: scale, expr: "cross_max(day_cov(div(Amt, day_mean(Amt)), Low), 9)", why: "只归一化 Amt 的尺度,留下价格尺度"}
      - {id: v_cov_pricenorm, group: scale, expr: "cross_max(day_cov(Amt, div(Low, day_mean(Low))), 9)", why: "只归一化价格尺度,留下 Amt 尺度"}
      - {id: v_amt_level, group: scale, expr: "cross_max(day_sum(Amt), 9)", why: "纯成交额水平 + 同样的记忆:如果它就够了,这支不是协方差"}
      - {id: v_logamt,    group: scale, expr: "log(add(day_sum(Amt), 1))", why: "最朴素的规模代理"}

  # ---------------------------------------------------------------- S3
  - id: S3_gate
    question: "day_durbin_watson(Open) 实际算的是什么?三次方是必要的放大还是过拟合?"
    variants:
      - {id: v_gate_nopow,  group: gate, expr: "cross_max(mul(cross_max(day_cov(Amt, Low), 9), day_durbin_watson(Open)), 5)", why: "去掉三次方"}
      - {id: v_gate_rank,   group: gate, expr: "cross_max(mul(cross_max(day_cov(Amt, Low), 9), cs_rank(day_durbin_watson(Open))), 5)", why: "把门控换成截面排名:保留次序、抹掉极值"}
      - {id: v_gate_pow2,   group: gate, expr: "cross_max(mul(cross_max(day_cov(Amt, Low), 9), pow_2(day_durbin_watson(Open))), 5)", why: "相邻指数:真效应应有邻域"}
      - {id: v_gate_ivol,   group: gate, expr: "cross_max(mul(cross_max(day_cov(Amt, Low), 9), pow_3(day_var(Ret))), 5)", why: "把 DW(Open) 换成直接的日内已实现方差"}
      - {id: v_dw_proxy,    group: gate, expr: "day_var(Ret)", why: "DW(Open)=Σ(ΔOpen)²/ΣOpen² 的假设:它应与日内方差高度同序"}
      - {id: v_dw_close,    group: gate, expr: "day_durbin_watson(Close)", why: "换一条价格序列:DW 家族是否同一个东西"}
      - {id: v_dw_ret,      group: gate, expr: "day_durbin_watson(Ret)", why: "对收益序列做 DW = 分钟收益的自相关,语义完全不同"}

  # ---------------------------------------------------------------- S4
  - id: S4_memory
    question: "两层 cross_max 是'极值记忆'还是只是低通平滑?窗口有没有邻域?"
    variants:
      - {id: v_mem_3_3,   group: memory, expr: "cross_max(mul(cross_max(day_cov(Amt, Low), 3), pow_3(day_durbin_watson(Open))), 3)", why: "更短窗口"}
      - {id: v_mem_5_5,   group: memory, expr: "cross_max(mul(cross_max(day_cov(Amt, Low), 5), pow_3(day_durbin_watson(Open))), 5)", why: "邻域窗口"}
      - {id: v_mem_15_5,  group: memory, expr: "cross_max(mul(cross_max(day_cov(Amt, Low), 15), pow_3(day_durbin_watson(Open))), 5)", why: "更长窗口"}
      - {id: v_mem_20_10, group: memory, expr: "cross_max(mul(cross_max(day_cov(Amt, Low), 20), pow_3(day_durbin_watson(Open))), 10)", why: "更长的两层"}
      - {id: v_mem_single, group: memory, expr: "cross_max(mul(day_cov(Amt, Low), pow_3(day_durbin_watson(Open))), 13)", why: "单层 13 日:两层嵌套是否必要"}
      - {id: v_mem_mean,  group: memory, expr: "cross_mean(mul(cross_mean(day_cov(Amt, Low), 9), pow_3(day_durbin_watson(Open))), 5)", why: "极值 -> 均值:是极值记忆还是平滑"}
      - {id: v_mem_q75,   group: memory, expr: "cross_quantile_q75(mul(cross_quantile_q75(day_cov(Amt, Low), 9), pow_3(day_durbin_watson(Open))), 5)", why: "极值 -> 75 分位:极值有多极"}
      - {id: v_mem_none,  group: memory, expr: "mul(day_cov(Amt, Low), pow_3(day_durbin_watson(Open)))", why: "完全去掉日轴记忆"}

  # ---------------------------------------------------------------- S5
  - id: S5_fields
    question: "字段换掉以后还在不在?(区分'这个量价关系'与'任意流动性×价格')"
    variants:
      - {id: v_f_vol,    group: fields, expr: "cross_max(mul(cross_max(day_cov(Volume, Low), 9), pow_3(day_durbin_watson(Open))), 5)", why: "Amt -> Volume:成交额还是成交量"}
      - {id: v_f_close,  group: fields, expr: "cross_max(mul(cross_max(day_cov(Amt, Close), 9), pow_3(day_durbin_watson(Open))), 5)", why: "Low -> Close:'最低价'有没有特别之处"}
      - {id: v_f_vwap,   group: fields, expr: "cross_max(mul(cross_max(day_cov(Amt, Vwap), 9), pow_3(day_durbin_watson(Open))), 5)", why: "Low -> Vwap"}
      - {id: v_f_high,   group: fields, expr: "cross_max(mul(cross_max(day_cov(Amt, High), 9), pow_3(day_durbin_watson(Open))), 5)", why: "Low -> High"}
      - {id: v_f_covret, group: fields, expr: "cross_max(mul(cross_max(day_cov(Amt, Ret), 9), pow_3(day_durbin_watson(Open))), 5)", why: "价格水平 -> 分钟收益:去掉价格尺度后的量价关系"}

  # ---------------------------------------------------------------- S6
  - id: S6_distil
    question: "能不能用更小、更稳、换手更低的结构保住大部分 alpha?"
    variants:
      - {id: d_logamt_mem,   group: distil, expr: "cross_max(log(add(day_sum(Amt), 1)), 13)", why: "规模 + 13 日极值记忆(2 个算子)"}
      - {id: d_logamt_mean,  group: distil, expr: "cross_mean(log(add(day_sum(Amt), 1)), 13)", why: "规模 + 13 日均值(更低换手)"}
      - {id: d_rank_amt,     group: distil, expr: "cs_rank(cross_mean(log(add(day_sum(Amt), 1)), 13))", why: "再做截面排名,彻底去掉尺度与极值"}
      - {id: d_amt_x_ivol,   group: distil, expr: "mul(cs_rank(cross_mean(log(add(day_sum(Amt), 1)), 13)), cs_rank(cross_mean(day_var(Ret), 13)))", why: "规模 × 波动,两支都排名化"}
      - {id: d_amt_p_ivol,   group: distil, expr: "add(cs_rank(cross_mean(log(add(day_sum(Amt), 1)), 13)), cs_rank(cross_mean(day_var(Ret), 13)))", why: "规模 + 波动(相加)"}
      - {id: d_ivol_only,    group: distil, expr: "cs_rank(cross_mean(day_var(Ret), 13))", why: "只有波动"}
