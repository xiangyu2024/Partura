# Partura study F109_erm_mag_gap_5m_tsm20  (手写 / erm_mag_gap_5m_tsm20)
# 这份文件只有 S0_baseline 是生成的。后面的阶段、变体、额外控制变量、探针,都要按**这棵树**来写。
factor_id: F109_erm_mag_gap_5m_tsm20
title: "5 分钟收益的上尾 / 下尾超阈均值比之差的 20 日均值;分母上的 1e-6 把涨跌停封板日变成事件记忆"
expression: "ts_mean(sub(div(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06)))), 20)"
baseline_id: v_base

# 用户表里公布的这一行(pick_single_factors 的口径);S0 要先把它复现出来
published: {sign: -1, hl: 1, ls: [2.77, 2.28], long: [-0.001, 0.002], lib: "手写", name: "erm_mag_gap_5m_tsm20"}

label: {kind: open_vwap15, horizon: 1, buyable: true,
        verify_against: /root/autodl-tmp/AlphaCube/_bench/trainto/allfac_buyable/_target.npy}
cost_per_side: 0.0015
top_frac: 0.10
rank_by: long          # 半衰期按纯多头书选(用户实际能做的那本书);多空口径每个变体也都会算
horizons: [1, 2, 3, 5, 10, 20]
warmup: 60

# train + valid = 用户的训练段(utrain);holdout = 用户的测试段,只在最后读一次
splits:
  train:   ["20180102", "20211231"]
  valid:   ["20220101", "20230807"]
  utrain:  ["20180102", "20230807"]
  holdout: ["20230808", "20251231"]
  full:    ["20180102", "20251231"]
fit_split: train
user_split: utrain

# ---- 这一批共用的控制变量(都是日频、因果、只用到 t 日收盘)。按这棵树的嫌疑增删。
controls:
  ctl_amt:    "log(add(day_sum(Amt), 1))"                                  # 成交额水平
  ctl_price:  "log(day_last(Close))"                                       # 价格水平
  ctl_ivol:   "day_std(Ret)"                                               # 日内已实现波动
  ctl_range:  "div(sub(day_max(High), day_min(Low)), day_last(Close))"     # 日内振幅
  ctl_rev1:   "div(day_last(Close), ts_delay(day_last(Close), 1))"         # 当日收益(毛比值,秩等价)
  ctl_mom20:  "div(day_last(Close), ts_delay(day_last(Close), 20))"        # 20 日动量
  ctl_dvol20: "ts_stddev(div(day_last(Close), ts_delay(day_last(Close), 1)), 20)"   # 20 日日频波动
external_controls:
  ctl_cap:      /root/autodl-tmp/Partura/shared/log_float_cap.npy        # log 流通市值 —— 把"规模"和"成交活跃"分开
  ctl_turnrate: /root/autodl-tmp/Partura/shared/log_turnover_rate.npy    # log(成交额 / 流通市值)

# ---- 既往研究里确认过的家族,用来分辨"这是不是已知的东西换了个写法"
gates:
  known_amt_max9:    "cross_max(day_sum(Amt), 9)"          # F001:成交额水平 + 极值记忆
  known_stdamt_max9: "cross_max(day_std(Amt), 9)"          # F001 的蒸馏结果
  known_ivol_max9:   "cross_max(day_var(Ret), 9)"          # F001:日内波动 + 极值记忆
  known_stdamt_mean30: "cross_mean(day_std(Amt), 30)"      # B01 第一组里纯多头最好的两算子基准之一
corr_with: [ctl_amt, ctl_cap, ctl_turnrate, ctl_ivol, ctl_dvol20, ctl_price, ctl_rev1, ctl_mom20,
            known_amt_max9, known_stdamt_max9, known_ivol_max9, known_stdamt_mean30]

diagnostics:
  decay:      [v_base, a_sig, a_sum, b_lvl]
  by_year:    [v_base, a_sig, a_sum, b_lvl]
  neutralise: [v_base, a_eps3, a_sum, a_sig, b_lvl, b_lvlq]
  profile:    [v_base, a_eps3, a_sum, a_up, a_dn, a_1m, a_q5, a_evt, a_sig, b_skew1, b_skew5, b_max20, b_lvl, b_lvlq, b_sig60]
  conditional:
    - {factor: v_base, gate: ctl_cap, buckets: 5}
    - {factor: v_base, gate: ctl_amt, buckets: 5}
    - {factor: a_sig, gate: known_stdamt_mean30, buckets: 5}
    - {factor: a_sum, gate: known_stdamt_mean30, buckets: 5}
    - {factor: b_lvl, gate: ctl_price, buckets: 5}
corr_ids: [a_eps3, a_sum, a_up, a_dn, a_1m, a_q5, a_evt, a_sig, b_skew1, b_skew5, b_max20, b_lvl, b_lvlq, b_sig60]

stages:
  - id: S0_baseline
    question: "Partura 自己求值出来的原式,能不能复现用户表里公布的那一行?它的钱在多头腿还是空头腿?"
    variants:
      - {id: v_base, group: baseline, expr: "ts_mean(sub(div(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06)))), 20)", why: "原始表达式"}

  - id: S1_nodes
    question: "两本书各自由哪个节点决定:分母上的 ε(封板日的爆炸)、减法、上侧还是下侧、5 分钟对 1 分钟的尺度?"
    variants:
      - {id: a_eps3, group: substitute, expr: "cross_mean(sub(div(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 0.001))), div(div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 0.001)))), 20)", why: "两个分位数分母上的 ε 从 1e-6 换成 1e-3(一个 tick 的量级):封板日不再爆到 1e4。H1 预测排序大变、空头腿大降;x1 的 numpy 版说排序只变一点(相关 0.75)、rank IC 反而更高 —— 用引擎口径确认是哪一个"}
      - {id: a_sum, group: interaction, expr: "cross_mean(add(div(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06)))), 20)", why: "H11:只把 sub 换成 add。若「两种爆炸都是坏事、两侧方向相同」成立,事件票全去空头端,同一半衰期下多头腿应高于原式、Q10 不再为负;若多头腿不变,说明多头端的问题不在减法"}
      - {id: a_up, group: isolate, expr: "cross_mean(div(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20)", why: "只留上侧 up_ratio(原 ε)。如果预测力来自「上尾相对下尾」这个差,单侧应明显弱于原式;x1 的 numpy 版说上侧单独就不弱(rank IC 0.038)"}
      - {id: a_dn, group: isolate, expr: "cross_mean(div(div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06))), 20)", why: "只留下侧 dn_ratio(原 ε)。若下侧是原式里的噪声项(方向与上侧相同却被减掉),它单独应当方向为 − 且弱于上侧"}
      - {id: a_1m, group: field, expr: "cross_mean(sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Close, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Close, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06)))), 20)", why: "H7:分子从 5 分钟收益换成 1 分钟收益 Ret(阈值、分母不动,即同批的 erm_mag_gap_1m 的写法)。爆炸日的集合不变;若两本书与原式相近,5 分钟对 1 分钟的尺度错配不是要点"}
      - {id: a_q5, group: field, expr: "cross_mean(sub(div(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.95))), create_like(day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.95), 1e-06))), add(day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.95), create_like(day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.05))), create_like(day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.05), 1e-06))), add(abs_(day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.05)), create_like(day_quantile(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), 0.05), 1e-06)))), 20)", why: "H7 的另一半:阈值和分母都换成 5 分钟收益自己的分位数(同一尺度的 ES/VaR 比之差)。5 分钟收益为 0 的分钟更少,爆炸日应减少;若空头腿随之下降,空头腿靠的是事件记忆而不是尾部形状"}
      - {id: a_evt, group: isolate, expr: "cross_sum(add(is_lt(mul(day_quantile(Ret, 0.95), abs_(day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.95), 1e-12)), create_like(day_quantile(Ret, 0.95), 1e-06)), 20)", why: "只留事件记忆:过去 20 天里「q95 = 0 或 q05 = 0」的天数(封板日计数;+1e-6 只为把整型掩码变成浮点)。若原式的空头腿主要是它,这个计数的空头腿应不低于原式;它取值只有几档,预期过不了 dist 门槛,只作诊断"}
      - {id: a_sig, group: substitute, expr: "cross_mean(div(sub(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06)))), day_std(Ret)), 20)", why: "去掉两个分位数分母,改用同一个尺度 day_std(Ret) 归一:没有 ε、不会爆炸,只剩「上尾超阈均值 − 下尾超阈均值」。若原式的信息在尾部不对称里,它应保住 rank IC 与空头腿;若在事件记忆里,它应塌"}

  - id: S2_family
    question: "规则区间是不是「偏度 / 彩票 / 低价」的另一种写法?多头腿在两侧的水平里还是在两侧的差里?"
    variants:
      - {id: b_skew1, group: substitute, expr: "cross_mean(day_skew(Ret), 20)", why: "H12 的朴素等价物之一:1 分钟收益偏度的 20 日均值。若规则区间只是已实现偏度,它与 a_sig 的 rank 相关应 ≥ 0.5、两本书形状相同"}
      - {id: b_skew5, group: substitute, expr: "cross_mean(day_skew(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), 20)", why: "同上,但用 5 分钟收益的偏度(与原式分子同尺度)。若 5 分钟尺度本身带信息,它应好于 b_skew1"}
      - {id: b_max20, group: substitute, expr: "cross_max(div(day_last(Close), cross_delay(day_last(Close), 1)), 20)", why: "H12 的朴素等价物之二:过去 20 天的最大单日涨幅(彩票 / MAX 效应),完全不看分钟数据。若空头腿只是「最近大涨过」,它的空头腿与 rank IC 不应低于原式"}
      - {id: b_sig60, group: window, expr: "cross_mean(div(sub(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06)))), day_std(Ret)), 60)", why: "a_sig 的窗口 20 → 60。多头口径半衰期都顶在上界 20、rank IC 随预测期上升,说明信号越慢越好;若 60 日窗口的多头腿净超额更高,这个改进记在平滑名下"}

  - id: S2_level
    question: "「水平」(上下两侧超阈均值之和)的多头腿是不是就是低价股效应?"
    variants:
      - {id: b_lvl, group: interaction, expr: "cross_mean(div(add(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06)))), day_std(Ret)), 20)", why: "H13:σ 归一的「水平」= 上、下两侧超阈均值之和 / σ(a_sig 的 sub 换成 add)。x1 里水平的多头腿好于差;若它只是低价股效应,与 ctl_price 的 rank 相关应 ≥ 0.5 且对 ctl_price 取残差后多头腿归零"}
      - {id: b_lvlq, group: interaction, expr: "cross_mean(add(div(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_sum(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 0.001))), div(div(day_sum(select_where(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05)), abs_(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), create_like(Close, 0))), add(day_sum(is_lt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 0.001)))), 20)", why: "同一个水平,用原式自己的归一方式(除以分位数,ε 换成 1e-3 的地板)。它与 b_lvl 相近 = 水平的信息不依赖用什么归一;不相近 = 归一方式本身在起作用"}

  - id: S_final
    question: "留出段:5 条最终候选(排序与判据见 notes/F109_erm_mag_gap_5m_tsm20/10_distilled.md「读留出段之前」)"
