# Partura study F108_max_ntkurt_close  (挖掘 / #3264)
# 这份文件只有 S0_baseline 是生成的。后面的阶段、变体、额外控制变量、探针,都要按**这棵树**来写。
factor_id: F108_max_ntkurt_close
title: "(读完这棵树之后,用一句话写它是什么)"
expression: "day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30))))"
baseline_id: v_base
probes: [studies/F108_max_ntkurt_close/probes.py]

# 用户表里公布的这一行(pick_single_factors 的口径);S0 要先把它复现出来
published: {sign: -1, hl: 10, ls: [2.82, 2.04], long: [0.056, 0.028], lib: "挖掘", name: "#3264"}

label: {kind: open_vwap15, horizon: 1, buyable: true,
        verify_against: /root/autodl-tmp/AlphaCube/_bench/trainto/allfac_buyable/_target.npy}
cost_per_side: 0.0015
top_frac: 0.10
rank_by: long          # 半衰期按纯多头书选(用户实际能做的那本书);多空口径每个变体也都会算
horizons: [1, 2, 3, 5, 10, 20]
warmup: 60

# train + valid = 用户的训练段(utrain);holdout = 用户的测试段,只在最后读一次
splits:
  train:   ["20180102", "20211231"]
  valid:   ["20220101", "20230807"]
  utrain:  ["20180102", "20230807"]
  holdout: ["20230808", "20251231"]
  full:    ["20180102", "20251231"]
fit_split: train
user_split: utrain

# ---- 这一批共用的控制变量(都是日频、因果、只用到 t 日收盘)。按这棵树的嫌疑增删。
controls:
  ctl_amt:    "log(add(day_sum(Amt), 1))"                                  # 成交额水平
  ctl_price:  "log(day_last(Close))"                                       # 价格水平
  ctl_ivol:   "day_std(Ret)"                                               # 日内已实现波动
  ctl_range:  "div(sub(day_max(High), day_min(Low)), day_last(Close))"     # 日内振幅
  ctl_rev1:   "div(day_last(Close), ts_delay(day_last(Close), 1))"         # 当日收益(毛比值,秩等价)
  ctl_mom20:  "div(day_last(Close), ts_delay(day_last(Close), 20))"        # 20 日动量
  ctl_dvol20: "ts_stddev(div(day_last(Close), ts_delay(day_last(Close), 1)), 20)"   # 20 日日频波动
external_controls:
  ctl_cap:      /root/autodl-tmp/Partura/shared/log_float_cap.npy        # log 流通市值 —— 把"规模"和"成交活跃"分开
  ctl_turnrate: /root/autodl-tmp/Partura/shared/log_turnover_rate.npy    # log(成交额 / 流通市值)

# ---- 既往研究里确认过的家族,用来分辨"这是不是已知的东西换了个写法"
gates:
  known_amt_max9:    "cross_max(day_sum(Amt), 9)"          # F001:成交额水平 + 极值记忆
  known_stdamt_max9: "cross_max(day_std(Amt), 9)"          # F001 的蒸馏结果
  known_ivol_max9:   "cross_max(day_var(Ret), 9)"          # F001:日内波动 + 极值记忆
  known_stdamt_mean30: "cross_mean(day_std(Amt), 30)"      # B01 第一组里纯多头最好的两算子基准之一
corr_with: [ctl_amt, ctl_cap, ctl_turnrate, ctl_ivol, ctl_dvol20, ctl_price, ctl_rev1, ctl_mom20,
            known_amt_max9, known_stdamt_max9, known_ivol_max9, known_stdamt_mean30]
corr_ids: [v_base, m_mean30, k_mean30, k_max10]   # R2:把 S1 那几条拉进 rank 相关矩阵,不重跑它们

diagnostics:
  decay:      [v_base]
  by_year:    [v_base, g_w25, k_mean30]
  neutralise: [v_base, g_w25]
  profile:    [v_base, m_mean30, m_mean60, n_pow3, g_w25]
  conditional:
    - {factor: v_base, gate: ctl_cap, buckets: 5}
    - {factor: v_base, gate: ctl_amt, buckets: 5}

stages:
  - id: S0_baseline
    question: "Partura 自己求值出来的原式,能不能复现用户表里公布的那一行?它的钱在多头腿还是空头腿?"
    variants:
      - {id: v_base, group: baseline, expr: "day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30))))", why: "原始表达式"}

  - id: S1_nodes
    question: "哪些节点是多余的?把软极值记忆显式写进表达式,比口径里的 EMA 好吗?"
    variants:
      - {id: n_pow3, group: ablate, expr: "day_max(pow_3(nt_ts_kurt(Close, 30)))",
         why: "pow_2 是死重吗(H2 改写版)。x1 §6 的 numpy 替身 Kmax³ signed 与原式交易信号秩相关 1.000、各列逐位相同;这里在配置里真跑一遍坐实。若逐位相同 → 提纯成立,四节点变三节点"}
      - {id: n_nocube, group: ablate, expr: "day_max(nt_ts_kurt(Close, 30))",
         why: "立方是载重节点吗(H3)。替身说去掉立方秩相关掉到 0.880、train Lnet +0.3%→−1.8%、LTO 4.7%→6.6%。若配置里也这样,H3 坐实"}
      - {id: n_pow5, group: ablate, expr: "day_max(pow_2_5(pow_2(nt_ts_kurt(Close, 30))))",
         why: "x1 §1 说内容全在 r 的最高约 10%,更强的尾部权重会不会更好(|K|⁵ 对 |K|³)。若明显更好,放大指数是一个可调杠杆;若更差,立方已经到位"}
      - {id: n_mean, group: ablate, expr: "day_mean(pow_1_5(pow_2(nt_ts_kurt(Close, 30))))",
         why: "H4:信号在最极端的那一个窗口(事件),还是在全天平均(状态)?x1 完全没测过这个(§9a 做的是日轴均值,不是日内)。若均值版 ≥ 极值版,H4 死,day_max 不是必要的"}
      - {id: m_mean30, group: candidate, expr: "cross_mean(day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30)))), 30)",
         why: "当前第一候选(x1 §9a:Lshp +0.43/+0.42 对原式 +0.05/+0.46,Lnet +2.6%/+2.1%,换手更低)。把软极值记忆从口径搬进表达式"}
      - {id: m_mean60, group: candidate, expr: "cross_mean(day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30)))), 60)",
         why: "记忆长度是 30 还是 60 天(替身:+2.0%/+5.2%,hlL 3)。两档都不塌才算邻域稳定"}
      - {id: k_mean30, group: benchmark, expr: "cross_mean(day_std(Amt), 30)",
         why: "已知家族基准 1(手册要求的第二条基准)。同一条流水线、同一段上和候选比"}
      - {id: k_max10, group: benchmark, expr: "cross_max(day_std(Amt), 10)",
         why: "已知家族基准 2。注意:用户口里的是 cross_max(day_std(Amt), 9),但 9 不在 cross_max 的窗口池 [3,5,10,15,30,60,241] 里,所以用最近的 10 代替——在结果卡里写明这处替换"}

  - id: S2_overlay
    question: "R1 §A3 那点叠在已知家族(K1=cross_mean(day_std(Amt),30))上的多头增量(+2.5pp)是真的,还是三种廉价解释之一(H18 单点权重尖峰 / H17 任何弱相关第二信号 / 配置里复现不出来)?"
    variants:
      - {id: g_w25, group: combine,
         expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(cross_mean(day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30)))), 30)), 0.25))",
         why: "主候选。§A3 在脚本里读到 hlL0 Lnet +15.1%/+23.8%、Lshp +2.30/+3.87。判据:配置里复现到 ±0.5pp;复现不了 → §A3 不可信,H11 回到未决"}
      - {id: g_w15, group: combine,
         expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(cross_mean(day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30)))), 30)), 0.15))",
         why: "H18 下沿。掉到家族线 +12.6%/+22.3% 以下 → 尖峰"}
      - {id: g_w40, group: combine,
         expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(cross_mean(day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30)))), 30)), 0.40))",
         why: "H18 上沿。等权(w=1)已知是负的(+11.9%/+19.9%),0.40 还在不在家族线以上决定平台有多宽"}
      - {id: g_raw, group: combine,
         expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30))))), 0.25))",
         why: "疑点⑤:日轴记忆放不放在表达式里面。预期明显更差(整条式子只能有一个半衰期)。它是「m_mean30 这个升华为什么必须」的直接证据"}
      - {id: g_k2w25, group: combine,
         expr: "add(cs_rank(cross_max(day_std(Amt), 10)), mul(cs_rank(cross_mean(day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30)))), 30)), 0.25))",
         why: "换家族成员还成不成立(K2 单独 +13.7%/+22.2%)。两个成员都赢 → 增量不是挑家族挑出来的"}
      - {id: g_tail, group: combine,
         expr: "sub(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_quantile_q25(cross_mean(day_max(pow_1_5(pow_2(nt_ts_kurt(Close, 30)))), 30)), 0.25))",
         why: "疑点⑥ / H14 的形态:只罚 D30 最高一档,不用完整排名。不差于 g_w25 → 推荐能简化成「避开最差的 25%」。注意:工单原文写的是 cs_quantile_q75,但 study.sh src 查到 cs_quantile_q75(x) 的语义是『标记当天最高的 75%』(x ≥ 当日 25 分位),不是『x 高于 75 分位』;真正标记『最高 25%』(x ≥ 当日 75 分位)的是 cs_quantile_q25,已换成它,意图不变,结果卡里有完整说明"}
      - {id: p_k2, group: placebo,
         expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(cross_max(day_std(Amt), 10)), 0.25))",
         why: "安慰剂1:掺入家族第二成员。也抬到 +15% 一带 → g_w25 只是「家族内部分散」,H11 否定"}
      - {id: p_ivol, group: placebo,
         expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(cross_mean(day_std(Ret), 30)), 0.25))",
         why: "安慰剂2:掺入波动水平(D 与 ctl_ivol 秩相关 −0.31,是最像的已知暴露)。一样好 → 任何温和风险类信号都行,H11 否定"}
      - {id: p_cap, group: placebo,
         expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(neg(log(day_last(Close)))), 0.25))",
         why: "安慰剂3,同时是 H9 的判别实验:掺入规模代理(低价≈小市值,neg 之后与 D 的「高 D ↔ 小市值」同向)。它复现 g_w25 → 那份增量是规模倾斜,不是冻结盘口信息"}
