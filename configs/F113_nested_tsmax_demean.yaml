# Partura study F113_nested_tsmax_demean  (挖掘 / #1375)
# 这份文件只有 S0_baseline 是生成的。后面的阶段、变体、额外控制变量、探针,都要按**这棵树**来写。
factor_id: F113_nested_tsmax_demean
title: "两层嵌套的「日轴 MAX 记忆 → 截面去均值 → 平方折叠」(只用 Ret):最终排序的是「近 54 日极端收益幅度离当日截面均值的距离」,sign=-1 即做多「极端程度最接近截面典型值、且 30 日内没偏离过」的股票"
expression: "pow_1_5(ts_max(pow_2(cs_demean(mul(ts_max(pow_2(ts_max(cs_demean(sub(ts_max(day_mean(Ret), 5), -5)), 30)), 20), 5))), 30))"
baseline_id: v_base

# 用户表里公布的这一行(pick_single_factors 的口径);S0 要先把它复现出来
published: {sign: -1, hl: 1, ls: [2.54, 1.09], long: [0.037, 0.024], lib: "挖掘", name: "#1375"}

label: {kind: open_vwap15, horizon: 1, buyable: true,
        verify_against: /root/autodl-tmp/AlphaCube/_bench/trainto/allfac_buyable/_target.npy}
cost_per_side: 0.0015
top_frac: 0.10
rank_by: long          # 半衰期按纯多头书选(用户实际能做的那本书);多空口径每个变体也都会算
horizons: [1, 2, 3, 5, 10, 20]
warmup: 60

# train + valid = 用户的训练段(utrain);holdout = 用户的测试段,只在最后读一次
splits:
  train:   ["20180102", "20211231"]
  valid:   ["20220101", "20230807"]
  utrain:  ["20180102", "20230807"]
  holdout: ["20230808", "20251231"]
  full:    ["20180102", "20251231"]
fit_split: train
user_split: utrain

# ---- 这一批共用的控制变量(都是日频、因果、只用到 t 日收盘)。按这棵树的嫌疑增删。
controls:
  ctl_amt:    "log(add(day_sum(Amt), 1))"                                  # 成交额水平
  ctl_price:  "log(day_last(Close))"                                       # 价格水平
  ctl_ivol:   "day_std(Ret)"                                               # 日内已实现波动
  ctl_range:  "div(sub(day_max(High), day_min(Low)), day_last(Close))"     # 日内振幅
  ctl_rev1:   "div(day_last(Close), ts_delay(day_last(Close), 1))"         # 当日收益(毛比值,秩等价)
  ctl_mom20:  "div(day_last(Close), ts_delay(day_last(Close), 20))"        # 20 日动量
  ctl_dvol20: "ts_stddev(div(day_last(Close), ts_delay(day_last(Close), 1)), 20)"   # 20 日日频波动
external_controls:
  ctl_cap:      /root/autodl-tmp/Partura/shared/log_float_cap.npy        # log 流通市值 —— 把"规模"和"成交活跃"分开
  ctl_turnrate: /root/autodl-tmp/Partura/shared/log_turnover_rate.npy    # log(成交额 / 流通市值)

# ---- 既往研究里确认过的家族,用来分辨"这是不是已知的东西换了个写法"
gates:
  known_amt_max9:    "cross_max(day_sum(Amt), 9)"          # F001:成交额水平 + 极值记忆
  known_stdamt_max9: "cross_max(day_std(Amt), 9)"          # F001 的蒸馏结果
  known_ivol_max9:   "cross_max(day_var(Ret), 9)"          # F001:日内波动 + 极值记忆
  known_stdamt_mean30: "cross_mean(day_std(Amt), 30)"      # B01 第一组里纯多头最好的两算子基准之一
corr_with: [ctl_amt, ctl_cap, ctl_turnrate, ctl_ivol, ctl_dvol20, ctl_price, ctl_rev1, ctl_mom20,
            known_amt_max9, known_stdamt_max9, known_ivol_max9, known_stdamt_mean30]
corr_ids: [c1_b_max5, c2_e_rel34, c3_g_fold1, c4_nodemean_out, c5_nopow15, c6_nomul_nosub,
           c7_nofold_in, c8_nofold_out, c9_rankfold, c10_medfold,
           n2_max79_plain, n4_dvol50_plain, m1_rel79_max, m2_rel50_absmax, m3_rel50_absmean,
           w1_c4_62, w2_c4_102, kf_mean30, kf_max9, cb_c4_kf30,
           f_orig, f_c4, f_m1, f_kf30, f_cb]

diagnostics:
  decay:      [v_base]
  by_year:    [v_base, c3_g_fold1, c9_rankfold, c4_nodemean_out, kf_mean30, cb_c4_kf30,
               f_orig, f_c4, f_m1, f_kf30, f_cb]
  neutralise: [v_base, c3_g_fold1, c9_rankfold, c4_nodemean_out, kf_mean30]
  profile:    [v_base, c2_e_rel34, c3_g_fold1, c4_nodemean_out, c8_nofold_out, c9_rankfold,
               n2_max79_plain, m1_rel79_max, kf_mean30, cb_c4_kf30,
               f_orig, f_c4, f_m1, f_kf30, f_cb]
  conditional:
    - {factor: v_base, gate: ctl_cap, buckets: 5}
    - {factor: v_base, gate: ctl_amt, buckets: 5}

stages:
  - id: S0_baseline
    question: "Partura 自己求值出来的原式,能不能复现用户表里公布的那一行?它的钱在多头腿还是空头腿?"
    variants:
      - {id: v_base, group: baseline, expr: "pow_1_5(ts_max(pow_2(cs_demean(mul(ts_max(pow_2(ts_max(cs_demean(sub(ts_max(day_mean(Ret), 5), -5)), 30)), 20), 5))), 30))", why: "原始表达式"}

  - id: S1_chain
    question: "沿这条不分支的链逐节点消融 + 把外层折叠的中心挪到中位数/秩空间:多头腿是差还是没有意义?哪些节点是多余的?"
    variants:
      - {id: c1_b_max5, group: isolate, expr: "ts_max(day_mean(Ret), 5)", why: "H4:最内层,无去均值无折叠 —— 近 5 日最好的一天。经典 MAX/lottery 因子的直写。它的多头腿直接回答「做多低 MAX」能不能当纯多头"}
      - {id: c2_e_rel34, group: isolate, expr: "ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)", why: "H4:节点 E = 34 日相对 MAX。与 c1 比单独检验第一次 cs_demean(相对化)是否 load-bearing;若 c2 拿到 v_base 多空夏普(2.59)的大部分,整棵树的差价就是 MAX 效应"}
      - {id: c3_g_fold1, group: isolate, expr: "ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20)", why: "H4:节点 G = 加上第一次平方折叠 + 20 日 max。G 是整棵树最后一个单调的幅度量。与 c2 比:折叠(把「连最好的一天都远低于截面」的弱股折进极端端)是加信息还是毁信息"}
      - {id: c4_nodemean_out, group: ablate, expr: "ts_max(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20), 30)", why: "H5:这在代数上就是「把第二次 cs_demean 删掉的原式」—— 去掉它之后外层 mul/pow_2/ts_max30/pow_1_5 全作用在恒非负的 G 上、全是单调递增变换、且与 ts_max 可交换,整块塌成 ts_max(G,30) 的单调函数(秩完全相同,推导见 04_grammar.md §5)。所以这一条检验:外层四个算子除了通过第二次 cs_demean,对排序有没有贡献"}
      - {id: c5_nopow15, group: ablate, expr: "ts_max(pow_2(cs_demean(mul(ts_max(pow_2(ts_max(cs_demean(sub(ts_max(day_mean(Ret), 5), -5)), 30)), 20), 5))), 30)", why: "H8:只删最外层 pow_1_5,sub/mul 原样保留。pow_1_5 在恒非负输入上严格单调递增 → hl=0 时当天截面排序与 v_base 完全相同,只能通过「先 EMA 后排序」影响交易信号。固定半衰期表的 hl=0 行必须等于 v_base;hl=1 行的差就是「6 次齐次的极端尺度在 EMA 里造成的那部分」"}
      - {id: c6_nomul_nosub, group: ablate, expr: "pow_1_5(ts_max(pow_2(cs_demean(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20))), 30))", why: "H9 代数审计:删掉 sub(.,-5) 与 mul(.,5) 两个常量节点。预测与 v_base 逐项相同、rank 相关 = 1.000(sub 的常数被 cs_demean 精确抵消;mul 的正常数只留 125x 正尺度,EMA 线性、十分位排序对正尺度不变)。不相同就说明引擎对裸常量的处理与源码读出来的不一样。这一条同时是 c7~c10 的参照基准"}
      - {id: c7_nofold_in, group: ablate, expr: "pow_1_5(ts_max(pow_2(cs_demean(ts_max(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30), 20))), 30))", why: "在 c6 基础上只删内层 pow_2。两层 ts_max 因此相邻、代数上合并成 ts_max(D,49)(写成嵌套形式是因为 49 不在 ts_max 的窗口池 [1,5,10,20,30,40,50] 里)。只剩一次折叠,检验「两次折叠是不是都需要」"}
      - {id: c8_nofold_out, group: ablate, expr: "ts_max(cs_demean(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20)), 30)", why: "H2/H3:在 c6 基础上删外层 pow_2,并且**必须同时删 pow_1_5** —— cs_demean 的输出可正可负,而 pow_1_5 的内核对 e>1 走不保号分支,负数输入会静默变成 NaN(02_operators.md 的坑在这里会被触发)。这把外层单调化,因子变成「30 日内 G 相对截面均值的最大带符号偏离」。若多头腿在这里明显变好,说明外层折叠就是毁掉多头腿的那一步"}
      - {id: c9_rankfold, group: sublimate, expr: "pow_1_5(ts_max(pow_2(cs_demean(cs_rank(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20)))), 30))", why: "H2/H8 升华候选:在 c6 的外层 cs_demean 之前插入 cs_rank。原式折叠的中心是 mean_cs(G),而 G 右偏极重(平方后再取两次 max),均值被右尾拖到远高于中位数的位置,所以「离均值近」不是「在分布中间」而是「在一条偏高分位的窄带上」。秩空间折叠把中心移到中位数,同时把 6 次齐次的极端尺度压进 [0,1]。若 valid 分位剖面 Q3 峰值(+11.5%)代表的「中间最赚钱」是真的,这一条的多头腿应明显好于原式"}
      - {id: c10_medfold, group: sublimate, expr: "pow_1_5(ts_max(pow_2(sub(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20), cs_median(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20)))), 30))", why: "H2 的另一半:只把折叠中心从均值挪到中位数,不压尺度。cs_median 的内核返回「当天截面中位数广播成全形状」(expand_as),所以 sub(G, cs_median(G)) 就是去中位数。c9 与 c10 一起把「中心错位」和「尺度过大/EMA」两个嫌疑分开:两条都变好 → 是中心错位;只有 c9 变好 → 是尺度"}

  - id: S2_bench
    question: "c4 这一类候选是不是朴素长窗 MAX / 低波动的改写?最小结构能不能保住它的多头腿?它相对已知家族有没有增量?"
    variants:
      - {id: n2_max79_plain, group: naive, expr: "ts_max(ts_max(day_mean(Ret), 50), 30)", why: "Q1 核心:79 日朴素 MAX —— 把 c4 的两次 cs_demean 和两次 pow_2 全部拿掉,只留下「过去约 79 天最好的一天有多好」。与 c4(+6.9%/+13.3%)比:如果两段都在 ±2pp 内且 rank 相关 ≳0.8,c4 就是这条朴素 MAX 的改写,整个研究的候选应该换成这条更简单的"}
      - {id: n4_dvol50_plain, group: naive, expr: "ts_stddev(day_mean(Ret), 50)", why: "Q1 对照:50 日朴素波动。c4 的交易信号与 ctl_dvol20 的交易信号相关 +0.60,但朴素低波动的多头腿是负的(ctl_dvol20 −11.1%/−2.7%)。这条在同一张表、同一窗口量级上复现「相关高但表现相反」,是「c4 不是低波动」的直接替换证据"}
      - {id: m1_rel79_max, group: distil, expr: "ts_max(ts_max(cs_demean(day_mean(Ret)), 50), 30)", why: "提纯候选:79 日**相对**收益的 MAX。相对 c4 删掉了内层 5 日 max 和两次 pow_2,只剩 cs_demean + 长窗 max(4 个节点)。如果多头腿保住,这就是本研究能给出的最小结构"}
      - {id: m2_rel50_absmax, group: distil, expr: "ts_max(abs_(cs_demean(day_mean(Ret))), 50)", why: "提纯候选的折叠版:50 日内最大的**绝对**相对收益。与 m1(单侧)比:在最小结构下,「两侧都算」是加分还是减分(外层折叠在原式里是减分,内层折叠 c7 也是减分,这里问最后一次)"}
      - {id: m3_rel50_absmean, group: distil, expr: "ts_mean(abs_(cs_demean(day_mean(Ret))), 50)", why: "MAX 语义的生死检验:与 m2 同原子同窗口,只把 max 换成 mean(= 50 日平均绝对相对收益)。如果 m3 ≈ m2,这条因子的「极值记忆」是装饰,它其实是一个相对波动因子;如果 m3 明显差,极值记忆是 load-bearing 的"}
      - {id: w1_c4_62, group: neighbour, expr: "ts_max(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20), 10)", why: "邻域:c4 的外层 ts_max 窗口 30→10,累计回看 82→62 天。R1 的消融阶梯显示回看越长多头腿越好(5日 −5.8%/+5.4% → 34日 −1.1%/+8.5% → 54日 +6.8%/+9.6% → 82日 +6.9%/+13.3%),这条检验这个阶梯在 c4 的结构上是不是平滑的、而不是 82 这个点被挑出来的"}
      - {id: w2_c4_102, group: neighbour, expr: "ts_max(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20), 50)", why: "邻域的另一侧:外层 ts_max 30→50,累计回看 102 天。和 w1 一起给出 62/82/102 三点;若 82 是局部尖峰而两侧塌,写进风险"}
      - {id: kf_mean30, group: known, expr: "cross_mean(day_std(Amt), 30)", why: "已知家族基准之一,**必须进同一张表**:06_baseline.md §8 那张已知家族表的半衰期很可能是用旧的多空口径选的(S0 跑的时候 books.rank_by 还是 'ls',R0 异常③),所以那里的 Lnet 不一定是多头最优半衰期下的数。放进这个阶段用当前 rank_by: long 重算一次,才能和候选公平比较"}
      - {id: kf_max9, group: known, expr: "cross_max(day_std(Amt), 9)", why: "已知家族基准之二(同上)。§8 记的是 hl=0 / Lnet +9.3%/+18.5%,而 R1 区块 5 用多头口径重选得到 hl=5(结果卡异常 1)。这条变体把这个矛盾一次解决"}
      - {id: cb_c4_kf30, group: increment, expr: "add(cs_rank(ts_max(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20), 30)), cs_rank(cross_mean(day_std(Amt), 30)))", why: "Q2 核心(增量的「相加」检验,playbook §6.2 指定的两种检验之一):把 c4 和已知家族各自转成当天截面秩再等权相加。两者的交易方向都是 -1,所以相加在方向上是一致的、不会互相抵消。判据:这条的多头腿两段都要比 kf_mean30 和 kf_max9 各自好 ≳2pp 才算有增量"}

  - id: S_final
    question: "留出段(holdout, 20230808 起)读一次:原式多头腿不可用/最好子结构(c4,m1)被已知家族碾压/相对已知家族无增量,这三条 train+valid 事前结论是否仍成立(判据 P0~P5,10_distilled.md §3,事前写死)"
    variants:
      - {id: f_orig, group: baseline, final: true, expr: "pow_1_5(ts_max(pow_2(cs_demean(mul(ts_max(pow_2(ts_max(cs_demean(sub(ts_max(day_mean(Ret), 5), -5)), 30)), 20), 5))), 30))", why: '原式(playbook 要求必含)。判据 P1:它的留出段多头腿若 Lnet ≥ +3% 且 Lshp ≥ +0.3,"原式多头腿不可用"这个结论被否定。'}
      - {id: f_c4, group: candidate, final: true, expr: "ts_max(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20), 30)", why: "本研究最好的子结构,=「82 日内最大的(34 日相对 MAX)²」,与原式 rank 相关只有 +0.14(是换了一条因子,不是提纯)。选它当族代表的理由是顶档两段都不塌(07_S2_bench.md §7)。判据 P2/P3/P4。"}
      - {id: f_m1, group: candidate, final: true, expr: "ts_max(ts_max(cs_demean(day_mean(Ret)), 50), 30)", why: "提纯产物,4 节点。十几个算子里两段一致 load-bearing 的只有第一次 cs_demean(H13)。判据 P2/P3/P4。"}
      - {id: f_kf30, group: known, final: true, expr: "cross_mean(day_std(Amt), 30)", why: "已知家族基准(playbook 要求必含)= cross_mean(day_std(Amt), 30),事前排序里的第一推荐。判据 P0/P5(口径校准 + 基准自身是否稳)。"}
      - {id: f_cb, group: increment, final: true, expr: "add(cs_rank(ts_max(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20), 30)), cs_rank(cross_mean(day_std(Amt), 30)))", why: '增量检验,c4 与已知家族各自当天截面秩等权相加(两者方向都是 -1,相加不会互相抵消)。判据 P3:若它比 f_kf30 的 Lnet 高 ≥ 3pp 且 Lshp 高 ≥ 0.3,"没有增量"被否定。'}
