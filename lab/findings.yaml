findings:
- id: dw-on-price-level-is-realized-variance
  claim: day_durbin_watson 作用在**价格水平**序列上时不是自相关检验,而 ≈ 日内已实现方差(分母是 Σx² 不是方差)
  evidence: 与 day_var(Ret) 的日截面 rank 相关 0.979;把整树里的 DW(Open) 换成 day_var(Ret) 后与原式相关 0.992
  study: F001_dwgated_covamtlow
  date: '2026-09-30'
  operators:
  - day_durbin_watson
  operand_kind: price
  confidence: high
  recheck: 喂给它的是收益序列(如 Ret)时语义完全不同:DW(Ret) 是分钟收益一阶自相关,方向都反
- id: cross-max-on-signed-scaled-quantity-is-magnitude
  claim: cross_max 作用在一个正负混杂、带尺度的量上时等价于取幅度,因此把该量变成一个缓慢变化的水平型状态变量
  evidence: 裸 day_cov(Amt,Low) rank IC 0.0128;cross_max(·,9) 后 0.0434;换成 cross_mean 塌回 0.0128;外面套 abs_ 几乎不变(0.0442)但
    Pearson IC 从 0.0111 掉到 0.0006
  study: F001_dwgated_covamtlow
  date: '2026-09-30'
  operators:
  - cross_max
  confidence: high
  recheck: 操作数如果本身恒正或已经是水平型,取极值就只是低通,这条不成立
- id: extreme-memory-fixes-turnover
  claim: 给一个逐日抖动的日内统计量套上日轴极值记忆,换手能降到四分之一,且 rank IC 往往不降反升
  evidence: day_var(Ret) 裸用 rank IC 0.0416/换手 45.8%/扣费 −2.07;cross_max(·,9) 后 0.0480/11.2%/+0.79
  study: F001_dwgated_covamtlow
  date: '2026-09-30'
  operators:
  - cross_max
  - cross_min
  - cross_quantile_q75
  confidence: medium
  recheck: 只在换手是瓶颈的成本口径下成立(15bp 单边);成本更低时未必划算
- id: amt-level-family-evades-rank-ban
  claim: 成交额水平家族可以通过 day_cov(Amt, 价格) 这类未封结构绕过 AlphaCube 的结构封禁与 0.95 rank 相关封禁
  evidence: cross_max(day_cov(Amt,Low),9) 与 cross_max(day_sum(Amt),9) 的 rank 相关只有 0.809(低于闸),但对 log 成交额中性化后 rank
    IC 掉 56%(R² 0.579)
  study: F001_dwgated_covamtlow
  date: '2026-09-30'
  operators:
  - day_cov
  pattern: O:day_cov(F:Amt
  confidence: high
  recheck: 封禁列表变了要重查;建议改用对已封族中性化后的掉幅做判据
- id: rank-preserving-outer-map-is-a-noop
  claim: 保序的外层一元变换(pow_3、cs_rank、sigmoid…)单独作用时对 rank IC 与十分位多空书毫无影响,只能在乘法里改变权重
  evidence: v_C 与 v_D(= pow_3(v_C))每一个指标逐位相同;d_rank_amt 与 d_logamt_mean 同样逐位相同
  study: F001_dwgated_covamtlow
  date: '2026-09-30'
  operators:
  - pow_3
  - pow_2
  - pow_1_5
  - pow_2_5
  - cs_rank
  - sigmoid
  confidence: high
  recheck: 只在「不平滑、直接对当天面板排序」时成立。一旦先做 EMA 再排序(半衰期 > 0,这是现在的默认口径),保序变换会改变各天之间的权重,就不再是 no-op(F103 的 X3-H 实测);进入线性组合或数值回归时同样不是
    【B01 修正】这条只在两个条件同时成立时才对:(1) 操作数恒正 —— 偶数次幂作用在有正有负的量上是折叠,不是保序(f102-l1);(2) 下游没有 EMA(半衰期 0)—— 用户口径先对原始数值做 EMA 再排名,重尾正数直接
    EMA ≈ 带衰减的峰值记忆,先取 log / 排名再 EMA 是另一个因子(f103-l1)。
- id: trigger-ops-make-builtin-probes-vacuous
  claim: in_sustain_* 是「触发型」算子:第一个操作数是 0/1 掩码,只在 mask==1 的分钟写值。内置探针给它喂随机浮点数,永不触发,所有读数(有限值占比 0、齐次度 None、与分钟顺序无关)都是空读数;注册表给它的
    boolean_output/trivial_boolean 标志是错的。真实语义:窗口 = 触发分钟自己 + 之后 d−1 分钟(朝后看、含触发分钟),总体 std,跑出行尾就截短(最后一分钟触发得 0),整行无触发
    → NaN。
  evidence: studies/F101_day_shine_retstd/probes.py:minute_offsets_read=[0,1,2,3,4](自检 in_delay→[-1]);ramp_window_readout
    1.4142 / 1.118 / 0.8165 / 0.5 / 0.0(自检 in_stddev_full 在 5 宽斜坡上 1.4142);trigger_semantics 只有 1.0 触发;is_gt 遇 NaN
    与相等都给 0。
  study: F101_day_shine_retstd
  date: '2026-10-04'
  operators:
  - in_sustain_stddev
  - is_gt
  - in_mean_full
  - in_stddev_full
  - in_delay
  confidence: high
  recheck: 其他 in_sustain_* 内核(start_offset / num 参数不同)要重跑这组探针;内核改动后失效。
- id: volume-surge-mask-is-a-proxy-for-large-move-minutes
  claim: 「ΔVolume > 当天自己的均值 + 1σ」这种掩码不带成交额尺度(每票每天约 20 次触发,p1=5、p99=32),挂在它上面的统计量 ≈ 同一统计量向大波动分钟加权的版本(与无条件版 rank 相关
    0.85~0.90)。把掩码换成不含 Volume 的「|Ret| > 当天均值 + 1σ」,折叠后的书在同一批格子上逐年分不开;「有条件 ÷ 无条件」的比值是单调空头信号,但完全不用掩码的「全天 std ÷ 滚动
    std 均值」同样强,Volume 特有的部分(两种掩码的统计量之比)没有信号。遇到「量触发、价统计」的结构,先拿「价触发」和「无触发的集中度」当对照,再谈事件的含义;只把掩码换成「全部分钟 / 取反」不足以说明事件定义有内容。
  evidence: SR_rivals(正式口径):sr_fold_jret 多空 +3.87/+3.12、空头 +49.1%/+48.9% 对 sr_orig_nz +3.65/+3.04、+47.8%/+48.3%;sr_ratio_jret
    / sr_ratio_ivol / s2_burst_ratio rank IC +0.0272/+0.0282/+0.0285(train)、+0.0359/+0.0459/+0.0415(valid);sr_ratio_j_jret
    rank IC +0.005/+0.011、扣费多空 −0.62/+0.20。rev_look.py E(同格子、逐年):J 3.66/3.05 对 Jret 3.78/3.06。audit_1.py A:原式对 EMA10
    fold(Jret) R² 0.792/0.848,残差空头腿 −0.5%/−5.3%。
  study: F101_day_shine_retstd
  date: '2026-10-04'
  operators:
  - is_gt
  - in_mean_full
  - in_stddev_full
  - in_sustain_stddev
  - day_mean
  - div
  confidence: medium
  recheck: 阈值更高(如 3σ)时触发次数少,量事件与价事件可能分开;被统计的字段不是收益时要重测;不用 Volume 的版本和三个比值都没有读留出段。
- id: cs-fold-hides-exposure-from-linear-neutralisation
  claim: 外层是不保序的截面折叠 abs_(cs_demean(x)) 时,因子与任何单调控制在秩空间近似不相关,线性中性化的 R² 会严重低估已知暴露;必须对「同样折叠、同样平滑」的控制变量中性化。同理,「折叠面板与已知家族的
    rank 相关接近 0」不是无关的证据:要量交易信号对家族折叠版的 R²、比空头十分位的重叠。rank IC 也不能用来给折叠型变体排序(不折叠版 rank IC 更高但书是空的)。
  evidence: 原式:9 个线性控制 R² 0.154,对 EMA10(fold(day_std(Ret))) 一个变量 R² 0.749/0.764(look2.py A、audit_1.py A);对 known_ivol_max9:原始折叠面板
    rank 相关 −0.036,交易信号对其折叠版 R² 0.418/0.489(取对数 0.569/0.644),空头十分位重叠 70%/72%(audit_1.py D、rev_look.py D);背景版:0.090
    对 0.796(look3.py D);s1_nofold rank IC +0.0389/+0.0571 而多空 1.34/2.35、多头净 −9.0%。
  study: F101_day_shine_retstd
  date: '2026-10-04'
  operators:
  - abs_
  - cs_demean
  confidence: high
  recheck: 若被折叠的量收益剖面本来单调,折叠会毁掉信号,这条不适用;折叠中心不是截面均值/中位数时要重算折叠版控制。
- id: fold-then-smooth-is-part-of-the-factor
  claim: 最外层是非线性节点(abs)时,口径里的 EMA 不是中性的平滑:先折叠后平滑与先平滑后折叠是两个不同的因子,多头腿只在前者存在。换成 20/40 日均值、20 日最大值、均值+标准差(cross_fangzheng)、均方根在噪声内是同一个东西。EMA|K|
    = |EMA K| + 不稳定度 是恒等式,但「两项各自单调」只在背景波动(roll5)版上两段成立,在放量版 J 上 valid 没有梯度 —— 不要把一个统计量上做的双重排序套到另一个统计量头上。
  evidence: look.py F(J:多头净 +9.0%/−1.6% 对先平滑后折叠 −9.5%/−10.2%);look2.py F(roll5:+9.1%/+10.4% 对 −4.7%/−6.4%);look3.py
    H(roll5 双重排序两段一致);audit_1.py B(J、半衰期 10:valid 最近三分位里按不稳定度五分位 +6.2/+2.9/+2.2/+7.0/−0.4);look3.py C/F 各种聚合 train
    多头净 8.0%~9.2%。
  study: F101_day_shine_retstd
  date: '2026-10-04'
  operators:
  - abs_
  - cs_demean
  - cross_mean
  - cross_max
  - cross_fangzheng
  confidence: medium
  recheck: K 的符号长期不变(不稳定度≈0)的因子上两种顺序等价;时间聚合的比较只在 train/valid 上做过,没有读留出段。
- id: moderate-activity-fold-is-generic-benchmark-first
  claim: 把任何「活跃度 / 波动」类变量做截面均值折叠再平滑(日内波动、20 日波动、换手率、振幅、F001 的 9 日极值记忆),在 2018–2021 都得到多空夏普 3.0~3.8、多头净 +7.8%~+9.7%
    的书;规模、价格、成交额水平折叠后没有。遇到 abs_(cs_demean(X))、X 是活跃度类的因子,先比两个基准:4 个算子的 abs_(cs_demean(day_std(Ret))),以及「X 的水平在第
    10~80 百分位的全部股票等权」这个平台 —— 多头十分位比不过平台,它就只是一个避开极端的过滤器,不是选股信号。
  evidence: look3.py D;sr_fold_kivmax9 train 多空 +3.83、多头净 +7.8%(valid +2.13/−4.5%);S_final:f_ivol 测试段多空 3.42、多头净
    +6.6%、纯多头夏普 1.43,与 12 个中间量的原式(3.70 / +6.0% / 1.32)在噪声内不可区分;rev_look.py C:平台等权每年毛超额 +5.5%~+8.0%,原式多头十分位减平台 2018–2021
    年 +5.8~+14.1、2022–2023 年 −1.8/+0.7。
  study: F101_day_shine_retstd
  date: '2026-10-04'
  operators:
  - abs_
  - cs_demean
  - day_std
  confidence: medium
  recheck: 日频的那几个折叠在 2022–2023 多头腿归零;留出段只读过 day_std 版;平台对照在留出段没有量;组合里已有波动/换手率因子时空头腿基本重复。
- id: rank-fold-short-leg-is-half-low-side
  claim: (只是构成事实,不是孰优的结论)对右偏的波动类输入,均值折叠的中心落在第 59~66 百分位,空头十分位人头 84%~97% 在高侧;对称的排名折叠 abs_(cs_demean(cs_rank(x)))
    的空头十分位有 42%~57% 人头在低侧(水平在第 4~10 百分位)。低侧那一半的贡献不稳定:2018 年 +10~+11 个点,到 2023 年缩到 0~+1。两种折叠孰优没有结论:样本外多空夏普的差别只来自
    2024 一年(排名折叠空头腿 −5.3%/+3.7%,样本量 1 年,且那一年没有按侧拆分过),多头腿上两者在测试段不可区分。
  evidence: rev_look.py A(2018–2023 逐年低侧 / 高侧拆分,J 与 roll5 两个统计量);look.py D;S_final 逐年(final.json):f_j_rank 在 2020、2022、2023
    年多空高于原式,f_roll5_rank 在 2020、2021、2023、2025 年高于 f_roll5。
  study: F101_day_shine_retstd
  date: '2026-10-04'
  operators:
  - cs_rank
  - abs_
  - cs_demean
  confidence: low
  recheck: 2024 年的低侧 / 高侧拆分没有做(在留出段里);需要新的样本外年份才能判断低侧转负是不是会重复的尾部。不要据此在两种折叠之间做选择。
- id: head-count-is-not-return-contribution
  claim: 判断「某条腿是不是来自特殊的票」(一字板、次新、标签缺失)要按收益贡献,不能按人头。任何「日内收益类统计量 == 0」的格子都是一字板日;截面均值折叠后它的 |K| = 截面均值,被送进空头十分位,次日相对等权约
    −2%/天。这里人头 2.2% 的当天一字板票给了空头腿的 13%、多空夏普的 0.56;5 日内有过一字板的票(人头 6.9%)给了 26%,20 日内的 39%,上市 60 日内的次新股 18%(train)。同一类折叠因子之间的比较不受影响(各掉
    0.5~0.7 的多空夏普),受影响的是公布的多空夏普的绝对水平和多头腿毛超额(等权基准里含这些票)。表达式里可以用 replace_small_with_nan(x) 把零值格子置 NaN 来量。
  evidence: audit_1.py C;SR_rivals sr_orig_nz(多空 4.21→3.65、3.21→3.04,多头腿毛超额 16.9%→15.6%、5.1%→4.5%);rev_look.py B(当天
    J 最低 5% 的超额 train −41% → 剔除 J==0 后 −9%;fold(ivol)、fold(roll5) 去零值格子后多空 3.63→3.13、3.15→2.48)。
  study: F101_day_shine_retstd
  date: '2026-10-04'
  operators:
  - abs_
  - cs_demean
  - day_std
  - day_mean
  - in_sustain_stddev
  - replace_small_with_nan
  confidence: high
  recheck: 不折叠的单调因子里零值排在一端而不是被折叠送进空头,要重量;标签口径(可买入版)变了要重量;样本外的占比没有量。
- id: valid-only-long-leg-gain-and-halflife-confound
  claim: 方法上的教训三条:(1) 变体按各自拟合的半衰期比较会把成本差算到结构头上 —— 半衰期 10→20 光靠省换手就给多头腿净超额加 0.4~3 个点,要用 books.sweep 在同一半衰期下比;(2)
    在同一半衰期下 train 持平、只在 386 天的 valid 上领先的多头腿改进是在押一段行情,即使连续三个自然年都领先;(3) 读完留出段之后做的事后解释同样会过拟合:只靠样本外一个年份的差别(这里是 2024
    年排名折叠的空头腿)不能升格成结论,事前写下的噪声带(多头净 ±3 个点、多空 ±0.3)对事后解读同样有约束力。
  evidence: look3.py A/Y;S_final:f_roll5 相对原式 valid 多头净 +12 个点、2021–2023 每年领先,测试段只剩 +0.6 个点;f_roll5 相对 f_ivol 的
    valid 优势(+10.4% 对 +3.7%)在测试段为 0;审查指出原报告把 2024 一年的差别写成了「均值折叠样本外更好」,并把 1 个点的多头净差别当佐证。
  study: F101_day_shine_retstd
  date: '2026-10-04'
  operators: []
  confidence: medium
  recheck: 改进在 train 的固定半衰期比较里也成立时,第 (2) 条警告不适用。
- id: f102-l1
  claim: 偶数次幂(pow_2)作用在有正有负的操作数上是折叠,不是保序变换;实验室里"保序外层一元变换是 no-op"那条先验必须加上"操作数恒正"这个条件。折叠可以是因子成立的必要条件,而凸性(平方对绝对值)可以完全无关。
  evidence: F102:K=day_kurt(...) 84.7% 为负、尾部≫0。去掉 pow_2(l_nofold_lin)多头腿毛超额 +12.7%/+12.9% → −10.4%/−1.4%,与原式 rank
    相关 −0.46;换成 abs_(l_fold_lin)rank 相关 0.99。探针 rank_preserving=False、sign_sensitivity=even。
  study: F102_kurt_autocorr
  date: '2026-10-04'
  operators:
  - pow_2
  - abs_
  - pow_2_5
  - signedpower
  confidence: high
  recheck: 操作数恒正(成交额、方差、极差等)时平方确实是 no-op;先看 rank_preserving 探针和操作数的符号分布。操作数的两侧若含义相同(同一种"坏"),折叠就不是必需的。
- id: f102-l2
  claim: cross_sum 用 nansum:窗口里的缺失日(停牌、一字板导致日内统计量为 NaN、新上市)被当成 0 加进去,把这些票推向低值一端;cross_mean / cross_max / cross_med
    跳过缺失日。对非负的日频量求和时,这会把一批大幅跑输的票送进"低值"那条腿。
  evidence: F102:只把 cross_sum 换成 cross_mean(a_mean_sq15),rank 相关 1.00,多空夏普 +3.68/+3.88 → +3.84/+4.30,多头腿净超额 +4.9%/+4.5%
    → +6.3%/+5.2%;窗口内有效天数不足的票占 5.2%/1.9%,在多头档里年化 −44.7%/−57.8%(x2 §1)。探针 constant_input_value / nan_behaviour。
  study: F102_kurt_autocorr
  date: '2026-10-04'
  operators:
  - cross_sum
  - cross_mean
  - cross_max
  - cross_med
  confidence: high
  recheck: 操作数几乎没有缺失日时无差别;如果 0 本身就是"当天无事"的自然取值(比如事件计数),求和是对的。因子方向若是"值高 = 多头",受害的是空头腿而不是多头腿。
- id: f102-l3
  claim: 极小窗口的滚动 Pearson(nt_ts_autocorr_s1(x,3)、同类的 3 对 corr)不是相关/自相关的估计量:分母带 +EPS,窗口内任一侧不动时恰好返回 0 而不是 NaN;在贴着最小报价单位跳的分钟收益上它是局部形态分类器。对它取
    day_kurt,在价格大半天不动的日子上变成稀疏度计(K≈κ/Z−3≫0),于是整条链会"意外地"检测涨停封板日;全天一字板反而是 NaN、看不见。这个事件检测不只影响空头腿:F102 的多头腿有三分之一靠它把封过板的票挡在外面。
