h_g_fam_nonew: {expr: "cs_last_low20(cross_mean(day_std(Amt), 30), cross_valid_count(day_last(Close), 250))", why: "同上但剔次新:次新段等权 -28.7%、已知族在里面 +8.6%(低于它全市场的 +15.3%)。三条剔除器一起跑才知道哪一类票是真的拖累"}

# ---- H. 与原式相关很低的新结构(来自机制推断,允许低 rho_o)
h_h_persist20: {expr: "cross_mean(div(day_pos_ratio(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1))), add(day_pos_ratio(Ret), create_like(day_quantile(Ret, 0.95), 1e-06))), 20)", why: "大胆:把机制推断写成一个纯比率 —— 5 分钟为正的占比 ÷ 1 分钟为正的占比,就是 1 分钟收益的正持续性,有界、无尾部、不可能爆炸。与原式相关应很低,但如果机制推断对,它该是同一条信息的干净版"}
h_h_wmean_gap20: {expr: "cross_mean(sub(day_wmean(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), Amt), day_wmean(Ret, Amt)), 20)", why: "大胆:同一个「5 分钟 vs 1 分钟」错配,但用资金加权读、完全没有分位数和掩码。若错配真的是信息源而不是爆炸的入口,这条应该有方向一致的多头腿"}
h_h_tailmean_q75: {expr: "cross_tail_mean_q75(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 60)", why: "mem_max 一族是唯一为正的记忆(+3.0%),但 max 只读一个点、噪声大。近 60 日里 spine 日值上尾四分之一的均值 = 「最激烈的那几天有多激烈」,同一句话的稳健版"}
h_h_spine_bk_age: {expr: "cs_bucket_rank(cross_mean(div(day_sum(select_where(is_gt(sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), day_quantile(Ret, 0.95)), sub(div(Close, in_delay(Close, 5)), create_like(Close, 1)), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20), cross_valid_count(day_last(Close), 250))", why: "大胆的否定检验:上市时长桶内排名。若 spine 在桶内塌光,它就只是一个上市时长 / 停牌史分类器,整条线可以收掉"}
