# F109_erm_mag_gap_5m_tsm20 —— 第三批假设(主研,2026-10-05;只凭 train/valid,未读测试段)
# 记号:R5 = in_pct(Close,5)(已由 h_a_spine_inpct 与 h_a_spine20 逐位同分证明等价于 Close/Close[t-5]-1)
#       SPINE_D = Σ r5·1[r5>q95] / (q95+1e-6)(逐日);SPINE = cross_mean(SPINE_D,20)(= only_L_R 的最小形,utrain +5.1%)
#       TQ75 = cross_tail_mean_q75(SPINE_D,60)(= h_h_tailmean_q75,本轮最好的自有版本 utrain +7.7%/0.92/ρk 0.28)
#       POSGAP = cross_mean(day_pos_ratio(R5) - day_pos_ratio(Ret), 20)(= h_d_pos_gap20,utrain +6.6%/1.09/ρk 0.65)
#       KNOWN = cross_mean(day_std(Amt),30);LIQ = cross_mean(day_sum(Amt),20)

h3_es_hi_r1: {expr: "cross_mean(day_es_ratio_hi(Ret), 20)", why: "带保护的上尾比值,1 分钟自洽口径:h_c_r1_tail20(同一个量但分母上挂 1e-6)+3.3%/ρk -0.01 是全表相关最低的通过项。day_es_ratio_hi 把 q95≈0 的日子留成 NaN(不是放大成 1e4)。若它 >= r1_tail,1e-6 在 spine 里也只是噪声,整族都该换成这个读数"}
h3_es_hi_r5: {expr: "cross_mean(day_es_ratio_hi(in_pct(Close, 5)), 20)", why: "同上但 5 分钟自洽(被测量与阈值都是 5 分钟):leaf_Ret_ret5(5 分钟自洽 + 1e-6)-6.3%、h_c_r1_tail20(1 分钟自洽)+3.3%。这条把「自洽」与「阈值用哪个孔径」彻底分开 —— 若它也差,「阈值必须是 1 分钟分位数」就是结论而不是猜测"}
h3_es_gap: {expr: "cross_mean(sub(day_es_ratio_hi(Ret), day_es_ratio_lo(Ret)), 20)", why: "原式 gap 的带保护版。s1 判「整条下侧分支是损害」(abl_AA/only_AA_R/sub_AA_* 六条同为 +2.7%),但那是在被 1e-6 放大 1e4 倍的下侧上判的;两侧都 NaN 保护之后再问一次「上减下」有没有价值"}
h3_atmax20: {expr: "cross_mean(day_at_max_ratio(Close), 20)", why: "封在当日最高价的分钟占比。h_b_zero20(日内冻结比例)多头腿 -1.2%、h_b_zero_signed20 +2.7%(ρk 0.00)—— 提示符号有信息而无符号的版本没有;day_zero_ratio 分不开涨停与跌停,这条只读涨停侧"}
h3_atmax_gap: {expr: "cross_mean(sub(day_at_max_ratio(Close), day_at_min_ratio(Close)), 20)", why: "封顶占比减封底占比 = 原式 1e-6 爆炸的带符号干净写法(爆炸只在 q95 或 q05 恰为 0 的日子发生,而那正是钉在最高价或最低价的日子)。h_b_zero_signed20 用的是「冻结比例 × 当日方向」的粗代理,这条是它的本体"}
h3_spine_bdm_liq: {expr: "cs_bucket_demean(cross_mean(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20), cross_mean(day_sum(Amt), 20))", why: "h_e_spine_bk_liq(成交额十分位桶内秩)把 spine 从 +5.1% 砍到 +1.6% —— 但桶内秩会把桶内的尾部整平,而 spine 的全部收益都在尾部。cs_bucket_demean 保留量纲,分辨「与活跃度共线」和「秩变换本身的损失」"}
h3_tailq75_bdm_liq: {expr: "cs_bucket_demean(cross_tail_mean_q75(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 60), cross_mean(day_sum(Amt), 20))", why: "本轮最好的自有版本 h_h_tailmean_q75(+5.1%/+14.1%,utrain +7.7%、Lshp 0.92、ρk 0.28)从没被桶内检验过 —— E 组三条中性化全是对 spine 做的。这是它能不能当独立弱信号的关键一问"}
h3_tailq75_bz_liq: {expr: "cs_bucket_zscore(cross_tail_mean_q75(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 60), cross_mean(day_sum(Amt), 20))", why: "同上再除桶内标准差:各成交额桶里 spine 日值的离散度差几倍,只去均值后桶间距离仍不可比;两条同分则「中性化方式」不重要,只有「中性化本身」重要"}
h3_posgap_bdm_liq: {expr: "cs_bucket_demean(cross_mean(sub(day_pos_ratio(in_pct(Close, 5)), day_pos_ratio(Ret)), 20), cross_mean(day_sum(Amt), 20))", why: "h_d_pos_gap20 utrain +6.6%、Lshp 1.09、LTO 1.2%,但 ρk +0.65 —— 我的推断是它读的不是资金拉抬而是「价格发呆」(薄盘票 1 分钟收益大量为 0,5 分钟正占比却不受影响 → 差值高)。桶内去均值若全塌,这个推断就定了"}
h3_distinct20: {expr: "cross_mean(day_distinct_ratio(Close), 20)", why: "纯「当天走过多少个价位」= 价格格子粗细 / 发呆程度的单节点读数。若它复现 h_d_pos_gap20 的 +6.6% 与 ρk 0.65,那条「5 分钟正占比 − 1 分钟正占比」就只是陈旧价格的代理,D 组的拉抬机制推断被彻底否掉"}
h3_topw_mean20: {expr: "cross_mean(day_topw_mean(Ret, Amt), 20)", why: "放量最大的 10% 分钟上的平均收益 —— 一个节点的「资金拉抬」读数。D 组 day_signed_ratio(-5.1%)、day_wmean(+1.3%)都失败,但两者都被没成交的分钟稀释;这条不被稀释。若它也失败,拉抬机制整条线可以收掉"}
h3_spine_wstd: {expr: "cross_mean(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_wstd(Ret, Amt), create_like(day_wstd(Ret, Amt), 1e-06))), 20)", why: "分母从「当天 q95」换成「当天资金加权波动」。h_a_upsum20(去掉分母)+0.5%、h_a_upsum_vol20(换 20 日平均波动)+0.6% —— 两条都塌,说明必须是当天自己的尺度;这条同量纲、同为当天、几乎不可能为 0,直接判「需要的是当天尺度还是分位数这个顺序统计量」"}
h3_spine_izexp: {expr: "cross_mean(div(day_sum(select_where(is_gt(in_zscore_expand(Ret), create_like(Close, 2)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20)", why: "只换掩码的条件:day_quantile 是全日顺序统计量,开盘第一分钟就用到了收盘信息(日内不因果);in_zscore_expand 是到当前分钟为止的扩张 z 分数。若同分,这棵树可以写成实盘能逐分钟算的版本,这是方法上的升级而不只是业绩"}
h3_spine_madz: {expr: "cross_madz(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 60)", why: "稳健的日轴标准化壳。s1:有界 / 稳健外壳都小赚(ts_quantile_q25 +2.9%、mem_max60 +3.0%),而 mem_zscore 全族是全表最差(-10%~-13%、LTO 10%+)。cross_madz 分辨「标准化这个想法不对」和「均值/标准差估计量太脆」"}
h3_spine_flip_vol: {expr: "cs_flip_by_state(cross_mean(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20), day_std(Ret))", why: "解剖:结构变体低波时段 +9.4%、高波 +0.4%(已知族相反)。F 组三条 sigmoid 加权全在噪声内(+15.1~16.0% vs 家族 +15.4%),说明「加权」问不出来。flip 是判定性的:若高波日只是失效而非反向,这条应明显差于 spine 本身"}
h3_switch_calm: {expr: "select_where(is_lt(cs_state_rank(day_std(Ret), 60), create_like(day_std(Ret), 0.4)), neg(cross_mean(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20)), neg(cross_mean(day_std(Amt), 30)))", why: "状态「切换」而不是「加权」:安静日整个截面按 spine 排序,其余日子按已知族排序(cs_state_rank 是全市场同一个数,所以每天的截面只来自一个面板,干净)。nosc_AC_cs_state_rank 单用时 dist 0.0003 退化,它只能这么用"}
h3_age_bdm: {expr: "cs_bucket_demean(cross_mean(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20), cross_age(day_last(Close)))", why: "h_h_spine_bk_age(cross_valid_count(·,250) 桶内秩)+6.4% > spine +5.1% —— 上市时长中性化反而更好,「它只是个上市时长分类器」被否。但 cross_valid_count 在 250 封顶,92.9% 的票并列成一个桶;cross_age 不饱和,这是同一个检验的正确键"}
h3_age_first_low: {expr: "cs_first_low40(neg(cross_mean(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20)), cross_age(day_last(Close)))", why: "h_e_spine_nonew(剔掉次新)把 spine 从 +5.1% 砍到 +0.5%(-4.6pp)—— 次新段在贡献而不是在拖累,与原式的解剖相反。这条反过来只在上市天数最短的 40% 里按 spine 选,用不饱和的上市天数把这件事钉死"}
h3_flat_daily20: {expr: "cross_flat_ratio(day_last(Close), 20)", why: "日轴的「收盘价与前一日完全相同」占比 = 停牌 / 连续一字板。B 组量的全是日内冻结(day_zero_ratio / day_flat_run_max),多头腿一律不可用;日间不动与日内不动是两件事(一字板连续多日 vs 薄盘票分钟不成交),这条是缺的那一半"}
h3_semistd_spine: {expr: "cross_semistd_pos(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 60)", why: "spine 日值的上行半标准差。h_h_tailmean_q75(60 日上尾四分之一均值)是本轮最好的自有版本(+7.7%);半标准差是同一句话的二阶版,比较两者判「读的是激烈日的水平还是它的离散」。注意它要求正值序列,spine 日值偶有负值 → 看 cov"}
h3_tailq25: {expr: "cross_tail_mean_q25(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 60)", why: "把 h_h_tailmean_q75 的上尾换成下尾。若 +7.7% 真的来自「最激烈的那几天有多激烈」,这条应明显更差;若两条同分,那 +2.6pp(相对 spine 的 20 日均值)其实来自「窗口 60」而不是「取上尾」"}
h3_tailq75_20: {expr: "cross_tail_mean_q75(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 20)", why: "同一个上尾均值但窗口改回 20(与 spine 同窗)。与上一条合起来把「窗口长度」和「取上尾」两件事正交开 —— s1 的窗口扫描(5~40 全平 -3.7~-2.8%)是在爆炸还在的量上做的,去掉爆炸后窗口可能恢复出坡度"}
h3_fam_x_tailq75: {expr: "cs_last_high20(neg(cross_mean(day_std(Amt), 30)), cross_tail_mean_q75(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 60))", why: "筛子换成本轮最好的自有版本。scr_xhi_p 用的是原式(utrain +15.6%/2.37,打不过通用筛子 k_known_xfrozen 的 +18.5%/3.15);TQ75 的 ρk 只 0.28、Lshp 0.92 是 spine 的 1.6 倍,从没当过筛子。门槛:要赢 k_known_xfrozen 才算有用"}
h3_fam_x_posgap: {expr: "cs_last_low20(neg(cross_mean(day_std(Amt), 30)), cross_mean(sub(day_pos_ratio(in_pct(Close, 5)), day_pos_ratio(Ret)), 20))", why: "用 pos_gap 的低端当剔除键(它的多头端在高值,所以剔低端)。h_d_pos_gap20 与已知族 ρk +0.65、方向相同、LTO 仅 1.2% —— 它可能正是「家族里更该买的那一半」的标记;若 ρk 高只是共线而非细分,这条应与 k_known 同分"}
h3_blend_tailq75: {expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(cross_tail_mean_q75(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 60)), create_like(cs_rank(cross_tail_mean_q75(div(day_sum(select_where(is_gt(in_pct(Close, 5), day_quantile(Ret, 0.95)), in_pct(Close, 5), create_like(Close, 0))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), 60)), 0.25)))", why: "用 TQ75 重做 h_f_blend_fix025(那条叠的是 spine:+16.0%/2.31 vs 家族 +15.4%/2.22,在噪声内)。结构与权重一字不改,只换被叠的那一半 —— 若叠加真能加分,应该在 ρk 更低、夏普更高的这一条上出现"}
