# F108_max_ntkurt_close —— 第三批假设(主研,读完批量扫描 s2 对账之后)
# 对账与数字全在 notes/F108_max_ntkurt_close/synthesis.md 的「## 第二轮(s2)对账与结论」一节。
#
# s2 的五条硬结果决定这一批往哪儿打:
#  (甲) **best_own 是 h_bk_amt_slow**:`cs_bucket_rank(D30, A20)` ut **+6.1%** / Lshp +1.16、ρo +0.86(是提纯)、
#       ρk +0.08(正交)、LTO 4.6%、两段同正(+4.9 / +8.9%)。它**否定了我上一轮的预言**(我预言成交额分桶会变差,
#       因为桶间符号相反)。桶内比较是本树唯一真正起作用的提纯手段 → A 组把它周围的最小子结构换一圈。
#  (乙) **离散/有界读数当排序器全被 dist 判掉**:h_flat_min60 dist 0.04、h_flat_max10 0.06、z_flatrun_max15 0.06、
#       z_flatrun_mean15 0.17、h_posratio_kurt 0.10、h_argmax_kurt 0.07 —— 大面积平局 → 多头书退化。
#       但**同一个量当筛子就是全表最强**:z_known_excl_flatrun ut **+17.8% / Lshp +2.84**。
#       → 凡是有界离散量,这一批一律只写两种形态:套 cross_mean 多日平均(打破平局),或者直接当筛子的闸门。
#  (丙) **叠加的载体必须慢**:h_ov_mean30_p025(D30 载体)ut **+17.6% / +2.73**,而 ov_p025(未平滑载体)只 +14.1%。
#       R2 对、s1 的 overlay 行错。但它仍 ≤ 通用筛子 k_known_xfrozen(+18.5% / +3.15)。
#  (丁) **原式剔掉冻结段就什么都不剩**:seg_xfrozen_p ut −0.8%(全市场 +1.0%);而家族剔掉冻结段白赚 +3.1pp。
#       → 本批 F 组的唯一问题是:**在 k_known_xfrozen 之上,本因子还有没有增量**(h3_scr_dbl 是判决性的那一条)。
#  (戊) **稳健孤立度是一条新对象**:z_madz_close30 `day_max(abs_(in_madz(Close, 30)))` ut +5.2%、ρo 只 +0.23。
#       它不是提纯(ρo < 0.8),但比峰度版干净(无绝对 EPS 地板)→ B 组把它做成可交易形态。
#
# 速记(下面全部写开):D30 = cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30);A20 = cross_mean(day_sum(Amt), 30);
#                     KN = cross_mean(day_std(Amt), 30);FROZ = cross_max(day_zero_ratio(Ret), 15);
#                     MADZ = day_max(abs_(in_madz(Close, 30)))。

# ---- A. best_own 周围的最小子结构(甲:桶内比较是唯一起作用的提纯;上一轮只有 cs_bucket_rank 这一种几何)
h3_bdm_amt:       {expr: "cs_bucket_demean(cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30), cross_mean(day_sum(Amt), 30))", why: "甲:cs_bucket_rank 把量纲扔掉了(桶内均匀百分位);demean 保留量纲 → 「比同类票典型值高多少」。若 +6.1% 来自「桶内比较」,这条应持平;若来自「扔掉量纲」(本树重尾极强,(max|K|)² 上限 ~700),这条应明显更差 —— 两种解释的分辨"}
h3_bzs_amt:       {expr: "cs_bucket_zscore(cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30), cross_mean(day_sum(Amt), 30))", why: "甲的第三档:成交额五档的段内读数是 −2.9/−3.5/−2.5/+6.4/+11.4%,离散度本身差数倍,去均值后的距离不可比;zscore 补上这一步。rank / demean / zscore 三档构成一条「要不要保留量纲」的梯子"}
h3_bdm_known:     {expr: "cs_bucket_demean(cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30), cross_mean(day_std(Amt), 30))", why: "甲:分桶变量换成已知族本身。bk_known 用 rank 几何时 ut 只 +1.9%(两段反号),若 demean 几何下仍 ≈ 0,说明 h_bk_amt_slow 的 +6.1% 是「按成交额水平分桶」特有的,不是「按任何已知族量分桶」都行"}
h3_bdm_amt_madz:  {expr: "cs_bucket_demean(cross_mean(day_max(abs_(in_madz(Close, 30))), 30), cross_mean(day_sum(Amt), 30))", why: "甲×戊:s2 两条赢家交叉 —— 把起作用的桶内几何套到无 EPS 地板的稳健孤立度上。若两者是同一条信息,交叉不应有加法;若 madz 真的更干净,这条应超过 +6.1%"}
h3_bdm_age:       {expr: "cs_bucket_demean(cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30), cross_age(day_last(Close)))", why: "cross_age 是新算子(不饱和的上市天数;seg_new_* 用 cross_valid_count 做的两条 ut +1.1 / −0.6% 都失败了)。次新段 7.1% 原式 +5.0%、段等权 −28.7% → 只做这一段不可交易,但**按上市天数分桶**可以把那段能力留在全市场书里"}

# ---- B. 稳健孤立度做成可交易形态(戊:z_madz_close30 ut +5.2%、ρo +0.23,但未平滑、Lshp 只 +0.55)
h3_madz_slow:     {expr: "cross_mean(day_max(abs_(in_madz(Close, 30))), 30)", why: "戊:本树所有东西慢化都 +1.5pp 左右(28 条 memory 一族),而 madz 版还没慢化过。这是它的可交易形态;与 h3_bdm_amt_madz 一起把「慢化」与「桶内」两个杠杆分开"}
h3_madz_min60:    {expr: "cross_min(day_max(abs_(in_madz(Close, 30))), 60)", why: "乙(s1):cross_min 是本树唯一改变了对象的记忆形状(mem_min60 Lshp +0.95、LTO 2.1%)。把「连最干净的一天都有孤立价」读到无 EPS 的 madz 上;若慢性读数的 +2.1~+3.2% 平台是峰度读数的噪声造成的,这条应该突破那个平台"}
h3_distinct_slow: {expr: "cross_mean(day_distinct_ratio(Close), 30)", why: "新算子,直接读 s1 §3e 推断的那件事:当天走过多少个价位。低价票在一个 tick 的格子上很粗 → 这是「价格最低档段内 −6.7%」的无 EPS 替身。连续量(k/n),不会像 day_flat_ratio 那样平局饱和被 dist 判掉"}
h3_zexp_slow:     {expr: "cross_mean(day_max(abs_(in_zscore_expand(Close))), 30)", why: "新算子:日内扩张窗口 z 分数。原式的 30 分钟滚动窗口是硬伤(10 翻符号、15 最差、没有平台);扩张窗口没有窗口参数,天然因果。若「没有平台」是窗口长度这个自由度本身的问题,去掉它应该变稳"}

# ---- C. cross_zscore 全线崩盘:是「标准化这个想法不对」还是「估计量太脆」(s1 想要、当时写不出的对照)
h3_madz_cross30:  {expr: "cross_madz(day_max(pow_2(nt_ts_kurt(Close, 30))), 30)", why: "mem_zscore 5/10/30/60 = −21.4/−16.2/−8.6/−5.0%、LTO 到 29.7%,s1 据此判「状态量不是事件量」。但 (max|K|)² 极重尾,一个尖峰就能把均值/标准差拖走。cross_madz 是同一个想法的稳健估计量 —— 直接对照 mem_zscore30 的 −8.6%:仍崩 = 想法错(s1 的判断成立);不崩 = s1 判错了,载重的其实有事件成分"}

# ---- D. 封板的精确读数(上一轮明确要过:day_flat_ratio 分不开「封在涨停」和「封在跌停」)
h3_atmax_slow:    {expr: "cross_mean(day_at_max_ratio(Close), 30)", why: "新算子:当天钉在最高价的分钟占比(一字涨停 ≈ 1,正常日 ≈ 1/240)。机制说原式高值 = 价格被钉住 + 一次孤立跳动;涨停板的钉住方向是**上**。leaf High / Low 两条都变差(−2.4 / −0.6%)说明峰度本身分不开方向 —— 这是分得开的那个读数。按乙套 cross_mean 打破平局"}
h3_atmin_slow:    {expr: "cross_mean(day_at_min_ratio(Close), 30)", why: "同上的跌停侧。两条若业绩差别大,就坐实「原式把两种相反的事件混成一个数」这条机制结论;若差别小,说明载重的只是「钉住」本身、与方向无关"}
h3_atmax_m_atmin: {expr: "cross_mean(sub(day_at_max_ratio(Close), day_at_min_ratio(Close)), 30)", why: "不对称本身:>0 = 更多时间钉在高位(封涨停 / 买盘排队),<0 = 钉在低位(跌停 / 无人接)。这是 s1「High/Low 不对称是机制证据」的正确写法;h_flatdiff_m30(价冻 − 钱冻)那条两段反号(−1.4 / +8.9%),这条是同一思路换一个更干净的差"}

# ---- E. 修「死分钟稀释」(s1 §3b 推断:最低成交额档里每只票都有大把死分钟,max|K| 饱和 → 段内 −2.9%)
h3_wstd_slow:     {expr: "cross_mean(day_wstd(Close, Amt), 30)", why: "新算子:成交额加权的日内价格波动 = 资金经历的波动,死分钟权重为 0 不再稀释。它是 sub_A_nt_ts_std(ut +7.3%,但被判为低价书、超配最低价格档 +74.4pp)的「不被死分钟稀释」版;看加权能不能把那条低价倾斜去掉"}
h3_topw_kurt:     {expr: "cross_mean(day_topw_mean(pow_2(nt_ts_kurt(Close, 30)), Amt), 30)", why: "新算子一个节点完成「放量 10% 分钟上的平均孤立度」。C 组已证明折叠必须是极值(q75 −2.3%、mean −1.9%、中位 −19.3%、max +1.0%),但那些都是**无条件**的折叠;按成交额挑分钟是「有条件的极值」,是 day_max 之外唯一还没试过的折叠几何"}

# ---- F. 筛子:唯一还没被否掉的用法,问题已经收窄成「在 k_known_xfrozen(+18.5%/+3.15)之上还有没有增量」
h3_scr_dbl:       {expr: "cs_last_high20(cs_last_high20(neg(cross_mean(day_std(Amt), 30)), cross_max(day_zero_ratio(Ret), 15)), cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30))", why: "**本批判决性的一条**(上一轮写不出:要嵌套筛子)。先做通用冻结筛子(= k_known_xfrozen,+18.5%),再剔本因子最高 20%。若 ≈ +18.5%,本因子的全部内容都已被 day_zero_ratio 吃掉 → 可以收口写否定结论;若明显更高,它有 xfrozen 之外的独立增量"}
h3_scr_atmax:     {expr: "cs_last_high20(neg(cross_mean(day_std(Amt), 30)), cross_mean(day_at_max_ratio(Close), 30))", why: "丁:筛子的闸门换成最精确的封板读数。现在的排名是 FROZ(day_zero_ratio,+18.5%)> flat_run_max(+17.8%)> D30(+17.1%)> 原式(+13.2%):闸门越直接越好。at_max_ratio 比 zero_ratio(Ret) 更专指「钉在板上」而不是「没成交」—— 若它赢,说明伤害家族的是封板而不是停牌"}
h3_scr_40_flatrun: {expr: "cs_last_high40(neg(cross_mean(day_std(Amt), 30)), cross_max(day_flat_run_max(Close), 15))", why: "新档位(上一轮只有 20%)。病态段只占 6.5%,但 z_known_excl_flatrun 剔 20% 就拿到 +17.8% → 闸门的分辨率可能不够,剔 40% 看是继续涨(说明被剔的不止病态段、还有一圈半病态的票)还是回落(说明 20% 已经够、再剔就是伤健康票)。这是筛子的「剂量曲线」"}
h3_scr_age:       {expr: "cs_last_low20(neg(cross_mean(day_std(Amt), 30)), cross_age(day_last(Close)))", why: "丁:s1 找到的第二个段是次新(7.1%、段等权 −28.7%、原式段内 +5.0%)。seg_new_* 把它做成「只在次新里选」失败了(+1.1 / −0.6%),正确用法是**剔掉次新**。用新算子 cross_age(不饱和)。这条是纯通用筛子、不含本因子 —— 它是「本因子筛子」的对照组:若它也 ≈ +18%,说明家族的毛病是一类「病态票」的通病,与本因子无关"}
h3_scr_flatd:     {expr: "cs_last_high20(neg(cross_mean(day_std(Amt), 30)), cross_flat_ratio(day_last(Close), 30))", why: "新算子:把冻结读数搬到**日轴**(近 30 日收盘价与前一日完全相同的占比 = 停牌 / 全天一字)。现有的闸门全在分钟轴;若日轴版同样好,说明家族的毛病只需要日频数据就能修,整条分钟级因子在这个用法上没有必要 —— 这是对本因子价值最严的一刀"}
h3_scr_bdm:       {expr: "cs_last_high20(neg(cross_mean(day_std(Amt), 30)), cs_bucket_demean(cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30), cross_mean(day_sum(Amt), 30)))", why: "甲×丁:闸门换成提纯后的载体。D30 当闸门给 +17.1%,但 D30 在低成交额档饱和(每只票都有死分钟)→ 闸门在那一档等于随机剔票。桶内去均值后闸门在每一档都有分辨率,这是「提纯对筛子有没有用」的检验"}

# ---- G. 市场状态:G 组用手写的日频权重失败了(+13.4% < +15.4%),换成新算子的两种正确写法
h3_state_sel:     {expr: "select_where(is_gt(cs_state_rank(day_std(Ret), 241), create_like(Close, 0.5)), cs_rank(neg(cross_mean(day_std(Amt), 30))), add(cs_rank(neg(cross_mean(day_std(Amt), 30))), mul(cs_rank(neg(cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30))), 0.25)))", why: "h_gate_lowvol 失败的原因可能是**写法**而不是想法:它把本因子的权重连续缩放,而解剖说家族在高波动日更强(+18.5% vs +12.4%)、本因子只在低波动日有效(+8.4% vs −6.4%)→ 正确形状是**切日子**:高波动日用纯家族,低波动日才叠本因子。cs_state_rank 当 select_where 的条件,上一轮没有这个算子"}
h3_flip_state:    {expr: "cs_flip_by_state(cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30), day_std(Ret))", why: "新算子,最小的「按市场状态切日子」原语。它是上一条的**可证伪对照**:若本因子只是在高波动期**失效**(而不是反号),翻符号版会明显比不翻的 D30 差;若它明显更好,说明高波动期里 max|K| 真的变成了「波动大的票」的代理、方向该反过来 —— 这是 s1 §3f 推断的直接检验"}

# ---- H. 两条由 s2 结果直接指向的叠加(丙:载体必须慢;h_std_amt30 是家族的更好写法)
h3_ov_bdm:        {expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(cs_bucket_demean(cross_mean(day_max(pow_2(nt_ts_kurt(Close, 30))), 30), cross_mean(day_sum(Amt), 30))), 0.25))", why: "丙×甲:s2 最好的叠加(+17.6%)用的是**未提纯**的 D30(ρk +0.97 —— 叠上去的东西和家族高度重合)。换成 ρk +0.08 的提纯载体,正交的部分更多,增量应该更大。这是「提纯到底有没有价值」在 best_on_known 口径上的检验"}
h3_stdamt_xfroz:  {expr: "cs_last_high20(neg(day_max(pow_2(nt_ts_std(Amt, 30)))), cross_max(day_zero_ratio(Ret), 15))", why: "s2 的意外:h_std_amt30 ut +16.5% / Lshp +2.46、ρk +0.93 —— 它**就是**已知族,但写得比 k_known(+15.4%)好一点(日内 30 分钟成交额波动的日内极值,而不是日度成交额波动的 30 日均值)。配上通用冻结筛子看能不能超过 +18.5%。这是给用户的「更好的已知族基准」,与本因子的定性无关,但必须量出来才不会把它记到本因子头上"}
