e_wide_only:
  expr: "add(cs_rank(neg(cross_mean(day_std(Amt), 30))), mul(LimitWidth, 10))"
  why: "只在 20% 板里买已知族(2019-07 前等于已知族,到 2020-08 只有科创板,之后加上创业板):注册制的板块壳价值低、机构多。预期净超额明显低于已知族(+5~+10%);若与 e_main_only 的成对差为 0,已知族在两种板上一样有效。"
  lock: true
e_gem_only:
  expr: "add(cs_rank(neg(cross_mean(day_std(Amt), 30))), mul(is_gt(BoardCode, 1.5), 1.0))"
  why: "只在创业板里买已知族(BoardCode 不随日期变):创业板 2020-08-24 从 10% 改成 20%,是同一批票上的制度变化,逐年看改之前和之后。预期改之后净超额下降(封板溢价消失);若不变,涨跌幅宽度不影响这条因子。"
  lock: true
e_xstar:
  expr: "sub(cs_rank(neg(cross_mean(day_std(Amt), 30))), mul(is_lt(abs_(sub(BoardCode, 1)), 0.5), 1.0))"
  why: "已知族,不买科创板(50 万门槛,很多账户没有权限)。预期与已知族的成对差在 ±0.5 个点内;这条是给实盘口径用的对照。"
  lock: true
e_known_board:
  expr: "cs_regres(neg(log(cross_mean(day_std(Amt), 30))), LimitWidth)"
  why: "已知族的板块中性版:−log 成交额离散度减本板(10% / 20%)均值;预期 20% 板上的票新、换手高,在已知族的书里很少(占比未实测)。预期净超额比已知族低 1~3 个点;掉 5 个点以上则「少持 20% 板」是已知族的一个大成分(与 a_board 对账)。"
e_known_in_age:
  expr: "cs_bucket_rank(cross_mean(day_std(Amt), 30), ListAge)"
  why: "已知族在上市天数十档内排名。预期与孪生秩相关 > 0.98、读数相同;若 2018~2019 的成对差不为 0,以前的「次新」分档里混着 2018 年初停牌、之后复牌的老股票(那天有多少只停牌需要实测)。"
e_known_in_age_twin:
  expr: "cs_bucket_rank(cross_mean(day_std(Amt), 30), cross_age(day_last(Close)))"
  why: "孪生:分档键用 cross_age(day_last(Close))。"
e_xjunk3:
  expr: "sub(cs_rank(neg(cross_mean(day_std(Amt), 30))), greater(add(add(is_lt(sub(LogFloatCap, LogFloatShares), 0.6931), is_lt(LogFloatCap, 20.7233)), is_lt(ListAge, 243)), 0.5))"
  why: "明文的垃圾票规则(低于 2 元 或 流通市值低于 10 亿 或 上市不足一年)套在已知族上;冻结筛子只是这类票的统计代理。预期比已知族高 1~2 个点;若拿不到冻结筛子样本内增益(+3.1 个点)的三分之一,垃圾票不能用这三条说清楚。"
  lock: true
e_xjunk4:
  expr: "sub(cs_rank(neg(cross_mean(day_std(Amt), 30))), greater(add(add(add(is_lt(sub(LogFloatCap, LogFloatShares), 0.6931), is_lt(LogFloatCap, 20.7233)), is_lt(ListAge, 243)), is_lt(sub(cross_max(cross_med(sub(LogTotalCap, log(day_last(Close))), 3), 300), cross_med(sub(LogTotalCap, log(day_last(Close))), 3)), 0.001)), 0.5))"
  why: "上一条再加「近 300 日不分红」。预期比已知族高 2~4 个点、被剔的占四成上下;若与 e_xnonpay 相同,前三条规则是多余的。"
  lock: true
e_xjunk3_xfz:
  expr: "cs_last_high20(sub(cs_rank(neg(cross_mean(day_std(Amt), 30))), greater(add(add(is_lt(sub(LogFloatCap, LogFloatShares), 0.6931), is_lt(LogFloatCap, 20.7233)), is_lt(ListAge, 243)), 0.5)), cross_max(day_zero_ratio(Ret), 15))"
  why: "明文规则之后再做通用冻结筛子(方向锁定):两者可加还是重复。预期比 k_known_xfrozen 高 0~1 个点;若相等,明文规则认出的票是冻结筛子的子集。"
e_xmicro05_xfz:
  expr: "cs_last_high20(cs_last_low05(neg(cross_mean(day_std(Amt), 30)), LogFloatCap), cross_max(day_zero_ratio(Ret), 15))"
  why: "通用冻结筛子再剔最小 5%(方向锁定)。预期净超额比 k_known_xfrozen 低 0~2 个点、回撤更浅;若更高,冻结筛子漏掉的垃圾在最小的票里。"
