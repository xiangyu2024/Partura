# K002_daily_fields —— 假设(主研,2026-10-07;写在算任何一个带日频叶子的因子之前,一次写完)
# A 组 10 条是总领定的尺子(id 与表达式照抄 README)。B 拿掉市值之后还剩什么 / C 成交额换成换手率 / D 新信息 / E 已知族上的筛子。
# 约定:
#   · 方向由训练段的纯多头书机械地定;只有筛子(根是 cs_last_* / cs_first_*,方向锁 +1)、秩相加减、罚分里的取负是结构的一部分。
#   · id 以 _twin 结尾的是孪生(同一结构、不用日频字段的写法),只用来做成对差,不该参加各组「样本内前 3」的排名。
#     孪生恰好是基准或尺子时(v_base、k_known_xfrozen、a_known_in_size 等)不重复列出,在 why 里注明。
#   · D 组的「罚分」类假设以 a_known_in_size 为载体(载体 ± 一个稀疏的日频事件量),成对基准是 a_known_in_size。
#   · 门槛型筛子写成 sub(cs_rank(y), 0/1 标记):被标记的票排到所有其他票之下;根不是筛子算子,批量扫描自己的锁认不出它。
#   · lock: true = 方向锁定为表达式写的方向(README 20:13 的补记)。A 组六条照 README;另外我给「方向是结构的一部分、但根不是 cs_last_* / cs_first_*」的
#     假设也加了:门槛型筛子、只在某个板里买、载体上的罚分、方向固定的秩相加。总领若只想锁 A 组,删掉其余的键即可(预期训练段定出的方向相同)。
#   · 没有预热(库从 2018-01-02 起),所以长窗口的变化量都写成「相对窗口低点 / 高点」或逐日累加,不用长滞后的 ts_delta;
#     取窗口极值之前先做 3 日中位数(cross_med),单日的数据尖峰进不了极值;日轴长窗口一律用 cross_*(引擎按股票分块),不用 ts_*(整块面板)。
#   · 常数:ln(10 亿) = 20.7233,ln(20 亿) = 21.4164,ln 2 = 0.6931,ln 1.05 = 0.0488,ln 1.02 = 0.0198;243 / 486 / 729 个交易日 ≈ 上市 1 / 2 / 3 年。
a_size:
  expr: "neg(LogFloatCap)"
  why: "尺子(id 与表达式照抄 README):小流通市值。这一轮任何「发现」都要先和它做成对比较。"
  lock: true
a_tsize:
  expr: "neg(LogTotalCap)"
  why: "尺子:小总市值;与 a_size 的差别 = 流通比例(锁仓、次新)。"
  lock: true
a_turn20:
  expr: "cross_mean(div(day_sum(Amt), FloatCap), 20)"
  why: "尺子:20 日平均换手率,方向按训练段定;量已知族里「清淡」那一半单独值多少。"
a_amt20:
  expr: "cross_mean(day_sum(Amt), 20)"
  why: "尺子:20 日平均成交额(= 流通市值 × 换手率),方向按训练段定;已知族最朴素的写法。"
a_known_in_size:
  expr: "cs_bucket_rank(neg(cross_mean(day_std(Amt), 30)), LogFloatCap)"
  why: "尺子:已知族只在同流通市值十分位内比 —— 拿掉市值之后已知族还剩多少;D 组罚分类假设拿它当载体。"
  lock: true
a_size_in_known:
  expr: "cs_bucket_rank(neg(LogFloatCap), cross_mean(day_std(Amt), 30))"
  why: "尺子:小市值只在同已知族十分位内比 —— 拿掉已知族之后市值还剩多少。"
  lock: true
a_known_in_turn:
  expr: "cs_bucket_rank(neg(cross_mean(day_std(Amt), 30)), cross_mean(div(day_sum(Amt), FloatCap), 20))"
  why: "尺子:已知族只在同换手率十分位内比 —— 拿掉换手率之后剩下的主要是市值。"
  lock: true
a_size_plus_known:
  expr: "add(cs_rank(neg(LogFloatCap)), cs_rank(neg(cross_mean(day_std(Amt), 30))))"
  why: "尺子:小市值排名与已知族排名等权相加。"
  lock: true
a_young:
  expr: "ListAge"
  why: "尺子:上市天数,方向按训练段定。2018 年以前上市的票并列在哨兵值上,十分位书落进并列块时按代码顺序取,读数要对照 e_xyoung 系列。"
a_board:
  expr: "LimitWidth"
  why: "尺子:涨跌幅宽度,方向按训练段定。只有 0.10 / 0.20 两个取值,十分位书在并列块里按代码顺序取;板块对比以 e_main_only / e_wide_only 的成对差为准。"
b_known_in_tcap:
  expr: "cs_bucket_rank(cross_mean(day_std(Amt), 30), LogTotalCap)"
  why: "换键 流通市值 → 总市值:若档内残余是「可交易盘子」的流动性溢价(对手是为流动性付价的短线资金),按总市值分档会把锁仓多的票和全流通票混在一档,档内排名重新带上流通盘大小。预期买低、与 a_known_in_size 秩相关 > 0.9、净超额高 0~2 个点;若成对差为 0,流通比例在这里不起作用。"
b_known_in_shares:
  expr: "cs_bucket_rank(cross_mean(day_std(Amt), 30), LogFloatShares)"
  why: "换键 流通市值 → 流通股本(不含价格):同股本档内成交额离散度低 = 低价 × 低换手,保留了市值里「低价」那一半。预期买低,净超额介于 a_known_in_size 与已知族之间;若与 a_known_in_size 的成对差在噪声内,市值里起作用的是股本而不是价格(对照 d_px_in_size)。"
b_known_dm_size:
  expr: "cs_bucket_demean(log(cross_mean(day_std(Amt), 30)), LogFloatCap)"
  why: "桶内排名 → 桶内去均值(保留幅度):log 成交额离散度相对同市值档均值的偏离,各档的极端值会集中进书里,所以它不是严格中性的。预期买低,净超额比 a_known_in_size 高 1~3 个点;若更低,同档里极端清淡的那一撮是冻结盘口的垃圾票。"
b_known_rkdiff_size:
  expr: "sub(cs_rank(neg(cross_mean(day_std(Amt), 30))), cs_rank(neg(LogFloatCap)))"
  why: "桶内排名 → 秩相减(指引 U6):成交额离散度的名次减市值的名次,尾部不中性 —— 正方向买到「大而清淡」,负方向买到「小而热闹」。预期两个方向的多头腿都接近 0 或为负;若正方向有 +5% 以上,档内效应集中在大票,桶内排名把它稀释了。"
b_known_res_size:
  expr: "cs_regres(neg(log(cross_mean(day_std(Amt), 30))), LogFloatCap)"
  why: "线性残差(对数对对数):−log 成交额离散度对 log 流通市值回归的残差 ≈ 相对自己的市值有多清淡。预期买高,净超额贴近 a_known_in_size(README 实测水平值的残差与市值秩相关仍有 0.43,取对数应低得多);若高出 3 个点以上,多出来的是尾部没拿干净的市值。"
b_known_in_size_w10:
  expr: "cs_bucket_rank(cross_mean(day_std(Amt), 10), LogFloatCap)"
  why: "窗口本身是问题:拿掉市值之后,剩下的清淡是近期状态(刚被冷落)还是长期属性;10 日窗口换手高,毛超额高而净超额不高就是会被成本吃掉的短期反转。预期买低,净超额低于 30 日的尺子;若 10 日版净超额更高,档内效应是注意力的消退而不是流动性溢价。"
b_known_in_size_w60:
  expr: "cs_bucket_rank(cross_mean(day_std(Amt), 60), LogFloatCap)"
  why: "同上,60 日窗口:若清淡是慢变量(公司类型、股东结构),60 日版换手更低、净超额不降。预期买低,净超额与 30 日尺子相差 ±1 个点;若明显更差,档内的清淡只有一个月的记忆。"
b_known_in_size_med:
  expr: "cs_bucket_rank(cross_med(day_std(Amt), 30), LogFloatCap)"
  why: "均值 → 中位数记忆:典型一天有多清淡,不记放量日。若档内多头腿来自「平时没人看」,它不弱于均值版;预期买低、但弱于最大值版(b_known_in_size_max),若它最好则放量事件不是档内效应的来源。"
b_known_in_size_max:
  expr: "cs_bucket_rank(cross_max(day_std(Amt), 30), LogFloatCap)"
  why: "均值 → 最大值记忆(指引 U7):同市值里近 30 日最热闹的一天也不热闹的票,对手是追放量的短线资金,放量后的回落由他们承担。预期买低,净超额比均值版高 0~2 个点;若最差,该看的是水平而不是事件。"
b_known_xfz_in_size:
  expr: "cs_last_high20(cs_bucket_rank(neg(cross_mean(day_std(Amt), 30)), LogFloatCap), cross_max(day_zero_ratio(Ret), 15))"
  why: "市值档内的已知族,再把近 15 日冻结盘口最重的两成排到最后(方向锁定):校准说超额 = 躲垃圾票 + 流动性倾斜,这里拿掉市值、留下躲垃圾票。预期比 a_known_in_size 高 2~4 个点、增益集中在 2018~2020(全市场口径下实测如此);若增益为 0,冻结筛子原来剔的就是极小市值。"
b_frozen_in_size:
  expr: "cs_bucket_rank(cross_max(day_zero_ratio(Ret), 15), LogFloatCap)"
  why: "冻结度本身(近 15 日零收益分钟占比的最大值)放到同市值档内比,看「垃圾票」是不是独立于市值的状态。预期买低,净超额 +2~+5%、2021 年后衰减;若多头腿为负,同档里零收益分钟多只是清淡(与 a_known_in_size 是同一根轴的两头)。"
b_known_in_size_turn:
  expr: "cs_bucket_rank(cs_bucket_rank(neg(cross_mean(day_std(Amt), 30)), LogFloatCap), cs_bucket_rank(cross_mean(div(day_sum(Amt), FloatCap), 20), LogFloatCap))"
  why: "市值和换手率都近似拿掉:先在市值档内排名,再在「档内换手率」十档内排名;log 成交额离散度 = log 市值 + log 换手率 + log 日内形状,这里只剩形状。预期净超额在 ±2% 内(指引 D5:成交额的标准化形状没有多头腿);若仍有 +4% 以上,已知族里有市值和换手率之外的内容。"
b_cv_in_size:
  expr: "cs_bucket_rank(cross_mean(div(day_std(Amt), day_mean(Amt)), 30), LogFloatCap)"
  why: "上一条的直接写法:分钟成交额的变异系数(市值和换手率在比值里约掉)在市值档内排名。预期与 b_known_in_size_turn 秩相关 > 0.7、多头腿同样没有东西;若两条读数相反,顺序分桶没有把换手率拿干净。"
b_f101_in_size:
  expr: "cs_bucket_rank(add(cs_rank(abs_(cs_demean(day_std(in_slice(Ret, 2, 237))))), cs_rank(abs_(cs_demean(day_std(in_pct(in_slice(Amt, 2, 237), 1)))))), LogFloatCap)"
  why: "F101 独立升级版(价与量的粗糙度都接近市场典型值)放到市值档内;校准里它在成交额桶内 valid 是 −2.08,被判为流动性倾斜,按市值分档保留了换手率那一半。预期买低,净超额 +2~+5%;若为负,它的超额全在市值里。"
b_f102_in_size:
  expr: "cs_bucket_rank(cross_max(pow_2(day_kurt(nt_ts_autocorr_s1(Ret, 3))), 60), LogFloatCap)"
  why: "F102 的核心(3 分钟自相关峰度的 60 日最大,读的是封板 / 钉住的日子)在市值档内,升级版原来按上市天数分档。预期买低,净超额 +2~+4%、集中在 2018~2020;若为 0,它躲的垃圾票就是小票。"
b_f103_in_size:
  expr: "cs_bucket_rank(cross_max(mul(day_close(Amt), ts_min(pow_3(day_durbin_watson(cross_semistd_neg(Amt, 30))), 1)), 5), LogFloatCap)"
  why: "F103 独立升级版(收盘那一分钟的成交额 × 成交额下行波动的 DW)在市值档内;它与已知族相关 0.58,是成交额水平的另一种写法。预期买低,与 a_known_in_size 秩相关 > 0.7、净超额不高于它;若明显更高,收盘成交额里有档内信息。"
b_f105_in_size:
  expr: "cs_last_high20(cs_bucket_rank(neg(ts_stddev(cross_fangzheng(cross_max(day_cov(Amt, Amt), 3), 241), 5)), LogFloatCap), cross_max(day_zero_ratio(Ret), 15))"
  why: "F105 独立升级版的核心(成交额方差长期水平的 5 日波动,取负)先在市值档内排名,再照原样剔冻结两成(方向锁定)。预期净超额 +3~+6%,其中一半来自筛子(对照 b_known_xfz_in_size);若不高于后者,核心在档内没有自己的内容。"
b_f106_in_size:
  expr: "cs_bucket_rank(sub(cs_rank(neg(cross_mean(day_zero_ratio(Ret), 30))), cs_rank(cross_mean(day_sum(Amt), 30))), LogFloatCap)"
  why: "F106 独立升级版(零收益分钟少 减 成交额)在市值档内:第二项是流动性倾斜,分档后只剩档内换手率。预期买高,净超额 +2~+5%;若与 a_known_in_size 的成对差为 0,「不钉在一个价位上」在档内没有贡献。"
b_zero_in_size:
  expr: "cs_bucket_rank(cross_mean(day_zero_ratio(Ret), 30), LogFloatCap)"
  why: "F106 的第一项单独放到市值档内:30 日零收益分钟占比,它同时受最小报价单位(低价票一跳几十个基点)和冻结状态影响。预期买低,净超额 0~+3%;若多头腿为负,它读的是清淡而不是垃圾(对照 d_zero_in_px)。"
b_f107_in_size:
  expr: "cs_bucket_rank(add(cs_rank(cross_ema(abs_(cs_demean(day_std(Ret))), 30)), cs_rank(cross_ema(abs_(cs_demean(day_gini(Low))), 30))), LogFloatCap)"
  why: "F107 独立升级版(日内波动与最低价基尼离全市场均值的距离,30 日 EMA)在市值档内;校准说这类典型性折叠是在躲垃圾票。预期买低,样本内净超额保住原来 +13.6% 的一半上下(+5~+8%);若跌到 +3% 以下,以全市场均值为中心的折叠偷带了市值(对照 b_fold_zs_sum_size)。"
b_f110_in_size:
  expr: "cs_last_low20(cs_bucket_rank(neg(cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), abs_(sub(div(day_last(Close), day_first(Open)), 1))), 30)), LogFloatCap), cross_age(day_last(Close)))"
  why: "F110 独立升级版的核心(日内涨跌幅带符号平方的 30 日 EMA 取负:买近一个月日内大跌过的)在市值档内排名,再照原样把上市最短的两成排到最后(方向锁定);对手是日内追涨杀跌的散户。预期净超额 +5~+8%;若降到 +2% 以下,日内反转的收益集中在小票里。"
b_f111_in_size:
  expr: "cs_last_high20(cs_bucket_rank(ts_pearson(day_last(Close), 20), LogFloatCap), cross_max(day_zero_ratio(Ret), 15))"
  why: "F111 独立升级版的核心在市值档内排名,再剔冻结两成(方向锁定);按内核定义 ts_pearson(x, 20) 是这只股票 20 日收盘价路径与其余股票路径的平均相关(同步性),不是与时间的相关。预期净超额 +5~+8%(校准:成交额桶内夏普 +0.56 / +0.94);若 < +2%,走势随大流只是大票的属性。"
b_sync_in_size:
  expr: "cs_bucket_rank(ts_pearson(day_last(Close), 20), LogFloatCap)"
  why: "上一条去掉冻结筛子:同步性在市值档内的排序;没有个股事件的票走势随大流,对手是追个股题材的资金。预期买高,净超额比上一条低 1~3 个点;若两条一样,同步性低的票已经包含了冻结盘口的票。"
b_f112_in_size:
  expr: "cs_bucket_rank(ts_scale(signedpower(cs_rank(add(day_quantile(Close), day_kurt(High)))), 50), LogFloatCap)"
  why: "F112 独立升级版(后复权价格的截面位次相对自己 50 日的占比:近 50 日名次掉下来的)在市值档内;名次下降和「跌成了小票」是连着的。预期买低,净超额 +3~+6%;若为 0,原来买的是市值名次的下降。"
b_f113_in_size:
  expr: "cs_bucket_demean(cross_mean(day_gini(Ret), 30), LogFloatCap)"
  why: "F113 独立升级版换键:分钟收益基尼系数的 30 日均值,减同市值档(原来是同成交额档)的均值;收益集中在少数几分钟 = 薄盘口或消息驱动,它是校准里成交额桶内两段都为正的两条之一。预期买低,净超额 +5~+9%;若明显弱于原式(第四轮样本内 +11.2%),同市值档内的基尼被换手率混淆了(成交稀的票基尼机械地高,对照 c_f113_turnkey)。"
b_f113_nested:
  expr: "cs_bucket_rank(cs_bucket_demean(cross_mean(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30)), LogFloatCap)"
  why: "F113 升级版原样(减同成交额档均值)再放到市值档内排名:成交额和市值都近似拿掉,是 b_f113_in_size 的下界。预期买低,净超额 +3~+6%;若两条相差 3 个点以上,差的那部分是档内换手率。"
b_f114_in_size:
  expr: "cs_last_high20(cs_bucket_rank(neg(cross_ema(cross_quantile_q25(day_close(Ret), 60), 30)), LogFloatCap), cross_max(day_zero_ratio(Ret), 15))"
  why: "F114 独立升级版的核心(收盘那一分钟收益的 60 日下四分位,再 30 日 EMA,取负)在市值档内排名,再剔冻结两成(方向锁定);它与已知族相关只有 0.04。预期净超额 +4~+7%、拿掉市值几乎不变;若掉一半以上,尾盘被砸的票只是小票。"
b_f115_in_size:
  expr: "cs_bucket_rank(cross_mean(div(div(sub(day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), sub(day_argmin(in_slice_to_end(in_slice(Amt, 31, 211), day_argmax(in_slice(Amt, 31, 211)))), day_argmin(in_slice_from_start(in_slice(Amt, 31, 211), day_argmax(in_slice(Amt, 31, 211)))))), 20), LogFloatCap)"
  why: "F115 独立升级版(潮汐:放量峰前后两个成交谷底之间的价格变化速度)在市值档内;它本来就是最弱的一条(样本内 +6.9%)。预期买低,净超额 +2~+4%;若为 0,这条不再跟。"
b_fold_dm_rv_size:
  expr: "cross_ema(abs_(cs_bucket_demean(day_std(Ret), LogFloatCap)), 30)"
  why: "折叠的中心换成同市值档均值(F101 / F107 / F110 的主研都要过):日内波动离「同档典型值」的距离,30 日 EMA;全市场均值当中心会把小票整体判成不典型。预期买低,净超额 +5~+8%;若明显不如 b_f107_in_size(全市场中心、事后再分档),折叠需要的中心就是全市场均值,「同类」不是对的参照。"
b_fold_zs_rv_size:
  expr: "cross_ema(abs_(cs_bucket_zscore(day_std(Ret), LogFloatCap)), 30)"
  why: "去均值 → 桶内 z 分数:距离再除以同档自己的离散度(按成交额分档时实测各档离散度相差数倍,按市值分档预期相同),书在各市值档近似等权。预期买低,净超额 +4~+7%;若比去均值版低 3 个点以上,去均值版的收益来自少持小票档。"
b_fold_zs_gini_size:
  expr: "cross_ema(abs_(cs_bucket_zscore(day_gini(Low), LogFloatCap)), 30)"
  why: "F107 的第二项(最低价基尼,读价位粗细和钉住)用同市值档的 z 分数折叠,去掉「小票价位粗」这一层。预期买低,净超额 +3~+6%;若为 0,这一项原来只是价格 / 市值水平。"
b_fold_zs_sum_size:
  expr: "add(cs_rank(cross_ema(abs_(cs_bucket_zscore(day_std(Ret), LogFloatCap)), 30)), cs_rank(cross_ema(abs_(cs_bucket_zscore(day_gini(Low), LogFloatCap)), 30)))"
  why: "F107 升级版整条换成同市值档 z 分数折叠(两项排名相加):不死水也不乱跳,而且是相对同样大小的票 —— 拿掉市值之后的「典型性」主对象。预期买低,样本内净超额 +6~+9%、与 a_size 秩相关 |ρ| < 0.15;若 < +3%,典型性折叠的收益是市值。"
b_fold_zs_rough_size:
  expr: "cross_ema(abs_(cs_bucket_zscore(day_mean(in_stddev_rolling(in_slice(Ret, 2, 237), 5)), LogFloatCap)), 30)"
  why: "指引 U3 的粗糙度(5 分钟滚动波动的全天平均,F101 上 valid 最高的写法)用同市值档 z 分数折叠。预期买低,净超额 +5~+8%;若弱于 b_fold_zs_rv_size,5 分钟尺度没有比全天波动多出东西。"
b_fold_zs_amtchg_size:
  expr: "cross_ema(abs_(cs_bucket_zscore(day_std(in_pct(in_slice(Amt, 2, 237), 1)), LogFloatCap)), 30)"
  why: "F101 的量那一半:分钟成交额变化率的波动,同市值档 z 分数折叠;量的粗糙度极端 = 死盘或被少数大单主导。预期买低,净超额 +3~+6%;若为 0,这一半原来读的是成交额水平。"
b_fold_zs_rv_size_board:
  expr: "cross_ema(abs_(cs_bucket_zscore(cs_regres(day_std(Ret), LimitWidth), LogFloatCap)), 30)"
  why: "折叠中心再细一层:日内波动先减本板(10% / 20%)均值,再做同市值档 z 分数折叠 —— 20% 板的正常波动不该被判成不典型。预期买低,与 b_fold_zs_rv_size 的差别只出现在 2020-08 之后、净超额 ±1 个点;若明显更差,折叠原来的作用之一是少持 20% 板。"
b_sync_in_size_turn:
  expr: "cs_bucket_rank(cs_bucket_rank(ts_pearson(day_last(Close), 20), LogFloatCap), cs_bucket_rank(cross_mean(div(day_sum(Amt), FloatCap), 20), LogFloatCap))"
  why: "同步性在市值和档内换手率都近似拿掉之后还剩多少(对应校准的「桶内」口径,键换成市值 × 换手率)。预期买高,净超额 +3~+6%;若 < +1%,同步性的多头腿是低换手。"
b_f113_in_size_turn:
  expr: "cs_bucket_rank(cs_bucket_demean(cross_mean(day_gini(Ret), 30), LogFloatCap), cs_bucket_rank(cross_mean(div(day_sum(Amt), FloatCap), 20), LogFloatCap))"
  why: "同档基尼再在档内换手率十档内排名:成交稀的票收益天然集中在少数几分钟,换手率是基尼最直接的混淆。预期买低,净超额 +3~+6%;若 < +1%,基尼的多头腿是低换手。"
b_fold_in_size_turn:
  expr: "cs_bucket_rank(add(cs_rank(cross_ema(abs_(cs_bucket_zscore(day_std(Ret), LogFloatCap)), 30)), cs_rank(cross_ema(abs_(cs_bucket_zscore(day_gini(Low), LogFloatCap)), 30))), cs_bucket_rank(cross_mean(div(day_sum(Amt), FloatCap), 20), LogFloatCap))"
  why: "同档典型性折叠再在档内换手率十档内排名:换手率极高和极低的票都「不典型」,折叠可能只是在挑中等换手。预期买低,净超额 +4~+7%;若降到 +1% 以下,典型性 = 中等换手率。"
b_fuse3_in_size:
  expr: "cs_bucket_rank(add(add(cs_rank(neg(add(cs_rank(cross_ema(abs_(cs_bucket_zscore(day_std(Ret), LogFloatCap)), 30)), cs_rank(cross_ema(abs_(cs_bucket_zscore(day_gini(Low), LogFloatCap)), 30))))), cs_rank(neg(cs_bucket_demean(cross_mean(day_gini(Ret), 30), LogFloatCap)))), cs_rank(cs_bucket_rank(ts_pearson(day_last(Close), 20), LogFloatCap))), LogFloatCap)"
  why: "三条近似市值中性的成分(同档典型性买低、同档基尼买低、同档同步性买高,方向沿用前几轮样本内定下的)排名等权相加,再在市值档内排名;第四轮里独立成员的融合样本内 +20.5%,这里问拿掉市值之后还剩多少。预期买高,净超额 +8~+12%、夏普 > 2.5;若 < +4%,融合的收益主要是成员共有的市值暴露。"
  lock: true
b_fuse5_in_size:
  expr: "cs_bucket_rank(add(add(add(add(cs_rank(neg(add(cs_rank(cross_ema(abs_(cs_bucket_zscore(day_std(Ret), LogFloatCap)), 30)), cs_rank(cross_ema(abs_(cs_bucket_zscore(day_gini(Low), LogFloatCap)), 30))))), cs_rank(neg(cs_bucket_demean(cross_mean(day_gini(Ret), 30), LogFloatCap)))), cs_rank(cs_bucket_rank(ts_pearson(day_last(Close), 20), LogFloatCap))), cs_rank(cs_bucket_rank(neg(cross_ema(cross_quantile_q25(day_close(Ret), 60), 30)), LogFloatCap))), cs_rank(cs_bucket_rank(neg(cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), abs_(sub(div(day_last(Close), day_first(Open)), 1))), 30)), LogFloatCap))), LogFloatCap)"
  why: "同上,再加两条市值档内的成分(F114 的尾盘下四分位、F110 的日内反转)。预期比三条的版本夏普高 0.2~0.5;若不升,后两条在档内与前三条是同一个东西。"
  lock: true
c_dturn30:
  expr: "cross_mean(day_std(div(Amt, FloatCap)), 30)"
  why: "已知族整条换成换手率写法:分钟换手率(成交额 ÷ 流通市值)的日内离散度,30 日均值;孪生就是已知族本身(v_base),不另列。它把 log 市值那一项减掉,预期买低、样本内净超额只剩 +3~+7%(已知族 +15.4%)、与 a_size 的秩相关降到 0 附近;若仍在 +12% 以上,已知族的超额不是市值。"
c_dturn10:
  expr: "cross_mean(day_std(div(Amt, FloatCap)), 10)"
  why: "窗口本身是问题:按成交额写时市值这个慢变量主导、窗口无所谓,按换手率写只剩流动性状态、记忆长度才起作用。预期买低,净超额 10 日 < 30 日;若与孪生一样对窗口不敏感,档内流动性也是慢变量。"
c_dturn10_twin:
  expr: "cross_mean(day_std(Amt), 10)"
  why: "孪生:同一结构的成交额写法(已知族的 10 日版),成对差 = 流通市值在这个窗口上的贡献。"
c_dturn60:
  expr: "cross_mean(day_std(div(Amt, FloatCap)), 60)"
  why: "同上,60 日窗口。预期买低,净超额不低于 30 日版、换手更低;若更差,换手率状态只有一个月的记忆。"
c_dturn60_twin:
  expr: "cross_mean(day_std(Amt), 60)"
  why: "孪生:已知族的 60 日版,成对差 = 流通市值在这个窗口上的贡献。"
c_dturn30_med:
  expr: "cross_med(day_std(div(Amt, FloatCap)), 30)"
  why: "均值 → 中位数记忆(换手率写法):典型一天的分钟换手率离散度,不记放量日。预期买低、弱于最大值版;若最好,放量事件不带信息。"
c_dturn30_med_twin:
  expr: "cross_med(day_std(Amt), 30)"
  why: "孪生:成交额写法的中位数记忆。"
c_dturn30_max:
  expr: "cross_max(day_std(div(Amt, FloatCap)), 30)"
  why: "均值 → 最大值记忆(换手率写法):30 日里最热闹的一天也不热闹,且「热闹」按流通盘比例算、大小票可比。预期买低,净超额比均值版高 1~3 个点;若最大值记忆只在孪生(成交额写法)上有优势,上尾信息来自大票的放量日。"
c_dturn30_max_twin:
  expr: "cross_max(day_std(Amt), 30)"
  why: "孪生:成交额写法的最大值记忆。"
c_dturn30_tcap:
  expr: "cross_mean(day_std(div(Amt, TotalCap)), 30)"
  why: "换分母 流通市值 → 总市值:成交额 ÷ 总市值 = 换手率 × 流通比例,锁仓多的票被读成更清淡。预期买低、与 c_dturn30 秩相关 > 0.9;若它明显更好,多出来的是「流通比例低」本身,这与 D 组的悬置盘假设方向相反,要对账。"
c_dvolsh30:
  expr: "cross_mean(day_std(div(Volume, FloatShares)), 30)"
  why: "换分母 成交量 ÷ 流通股本(按股数的换手率):若 Volume 是未复权的实际股数,它与 c_dturn30 只差分钟均价与收盘价之比,秩相关应 > 0.98。预期买低;秩相关明显偏低说明 Volume 复权过或单位不一致(需要实测),那样这条作废。"
c_turn20_med:
  expr: "cross_med(div(day_sum(Amt), FloatCap), 20)"
  why: "a_turn20 的中位数版:典型一天的换手率;低换手的对手是需要流动性、愿意为它付溢价的短线资金。预期买低,但全市场口径下书偏大票(README:小市值与换手率秩相关 +0.40),净超额 +2~+6% 且 valid(小票行情)可能为负;若两段都 > +8%,低换手本身就是已知族的主体。"
c_turn20_med_twin:
  expr: "cross_med(day_sum(Amt), 20)"
  why: "孪生:成交额的 20 日中位数,带着市值;预期净超额高 8~12 个点、与 a_size 秩相关 > 0.6。"
c_turn20_max:
  expr: "cross_max(div(day_sum(Amt), FloatCap), 20)"
  why: "20 日里换手率最高的一天:按换手率定义的放量日在大小票之间可比,买一个月内没有被炒过的。预期买低,净超额比中位数版高 1~3 个点;若不比中位数版高,放量日在换手率口径下不带信息。"
c_turn20_max_twin:
  expr: "cross_max(day_sum(Amt), 20)"
  why: "孪生:成交额的 20 日最大值。"
c_logturn20:
  expr: "cross_mean(log(div(day_sum(Amt), FloatCap)), 20)"
  why: "对数均值:换手率右偏,算术平均被一两个放量日带走;log 换手率 = log 成交额 − log 市值,所以它与孪生的信号逐票只差一个 log 流通市值(20 日内近似不变)。预期买低,孪生的净超额高出的部分与 a_size 的读数同量级;若两者相差很远,排名的非线性或窗口内股本变动(解禁)的票在起作用。"
c_logturn20_twin:
  expr: "cross_mean(log(day_sum(Amt)), 20)"
  why: "孪生:log 成交额的 20 日均值。"
c_cv30:
  expr: "cross_mean(div(day_std(Amt), day_mean(Amt)), 30)"
  why: "分解的第三项(对照,不含日频字段):分钟成交额的变异系数 = 已知族除掉市值和换手率之后的形状,log 已知族 ≈ log 市值 + log 换手率 + log 变异系数。预期单独没有多头腿(±2%,指引 D5);若有 +5% 以上,已知族的内容在日内形状里,c_dturn30 会保住它。"
c_turn_in_size:
  expr: "cs_bucket_rank(cross_mean(div(day_sum(Amt), FloatCap), 20), LogFloatCap)"
  why: "README 的预期原样检验:同市值档内换手率与成交额几乎是同一个排序(档内市值近似常数)。预期买低,与孪生秩相关 > 0.9、成对差 |t| < 1、净超额都在 +5~+8%;若成对差显著,十档不够细,档内的市值差仍在起作用。"
c_turn_in_size_twin:
  expr: "cs_bucket_rank(cross_mean(day_sum(Amt), 20), LogFloatCap)"
  why: "孪生:同市值档内的 20 日成交额。"
c_dturn_in_size:
  expr: "cs_bucket_rank(cross_mean(day_std(div(Amt, FloatCap)), 30), LogFloatCap)"
  why: "换手率写法的已知族放到市值档内,孪生是尺子 a_known_in_size(不另列)。预期两者秩相关 > 0.95、读数相同 —— 这是本组的零假设对照;若这一对都有显著成对差,成对检验的噪声带估小了。"
c_abturn:
  expr: "div(cross_mean(div(day_sum(Amt), FloatCap), 20), cross_mean(div(day_sum(Amt), FloatCap), 241))"
  why: "异常换手率:近 20 日换手率 ÷ 近 241 日换手率(A 股文献里的情绪因子),相对自己历史放量 = 散户情绪升温,之后回落由他们承担。预期买低,净超额 0~+4%(指引 D4:除以自身历史会把多头腿所在的水平除掉);若 > +6%,情绪的多头腿在 A 股是有的。2018 年窗口不满,前几个月比值接近 1。"
c_abturn_twin:
  expr: "div(cross_mean(day_sum(Amt), 20), cross_mean(day_sum(Amt), 241))"
  why: "孪生:成交额写法;差在这一年的涨跌幅和股本变动 —— 它把一年跌下来的票读成缩量。成对差 |t| < 1 则换手率写法在这里没有意义。"
c_abturn_in_size:
  expr: "cs_bucket_rank(div(cross_mean(div(day_sum(Amt), FloatCap), 20), cross_mean(div(day_sum(Amt), FloatCap), 241)), LogFloatCap)"
  why: "异常换手率放到市值档内:小票的换手率波动大,全市场排序两端都被小票占满。预期买低,净超额 +1~+4%;若档内不比全市场口径好,两端的小票并没有互相抵消。"
c_abturn_in_size_twin:
  expr: "cs_bucket_rank(div(cross_mean(day_sum(Amt), 20), cross_mean(day_sum(Amt), 241)), LogFloatCap)"
  why: "孪生:成交额写法的异常成交额,同样放到市值档内。"
c_turnvol20:
  expr: "cross_stddev(div(day_sum(Amt), FloatCap), 20)"
  why: "日换手率的 20 日波动(换手率不稳定 = 资金来了又走)。预期买低,净超额 +2~+5%;与孪生的成对差若等于 c_dturn30 对已知族的差,日间波动和日内离散是同一个东西。"
c_turnvol20_twin:
  expr: "cross_stddev(day_sum(Amt), 20)"
  why: "孪生:日成交额的 20 日波动,带市值,预期与已知族秩相关 > 0.8。"
c_turncv20:
  expr: "div(cross_stddev(div(day_sum(Amt), FloatCap), 20), cross_mean(div(day_sum(Amt), FloatCap), 20))"
  why: "恒等对照:日换手率的 20 日变异系数,20 日内流通市值近似不变、分子分母里的市值约掉,所以它与孪生应当秩相关 > 0.98、成对差为 0。它量的是成对比较的噪声地板和窗口内股本变动(解禁 / 送转)的票占多大比重;若成对差不为 0,先查数据再读别的。预期买低。"
c_turncv20_twin:
  expr: "div(cross_stddev(day_sum(Amt), 20), cross_mean(day_sum(Amt), 20))"
  why: "孪生:日成交额的 20 日变异系数。"
c_amihud_turn:
  expr: "cross_med(div(abs_(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1)), div(day_sum(Amt), FloatCap)), 20)"
  why: "Amihud 非流动性的换手率写法:每换手 1% 流通盘价格动多少(20 日中位数,避开无量封板日的无穷大);除以换手率之后它 ≈ 波动 ÷ 换手率,书偏低换手。预期买高,净超额 +2~+5%、与 a_size 秩相关为负;若多头腿为负,Amihud 的溢价全是市值。"
c_amihud_turn_twin:
  expr: "cross_med(div(abs_(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1)), day_sum(Amt)), 20)"
  why: "孪生:成交额写法(传统 Amihud),基本是市值的倒数;预期与 a_size 秩相关 > 0.8、净超额高 8 个点以上。"
c_netflow_turn:
  expr: "cross_mean(mul(day_signed_ratio(Ret, Amt), div(day_sum(Amt), FloatCap)), 20)"
  why: "净流入占流通市值:上涨分钟成交额占比减下跌分钟占比(day_signed_ratio),乘当日换手率,20 日均值;按流通盘比例写才是「这只票被净买了多少」。预期买低(被净卖出的,对手是追涨的短线资金),净超额 +2~+5%;若为 0,分钟方向的净额不带信息。"
c_netflow_turn_twin:
  expr: "cross_mean(mul(day_signed_ratio(Ret, Amt), day_sum(Amt)), 20)"
  why: "孪生:净流入金额(乘成交额),只认得出大票的流入流出;若与换手率写法秩相关 > 0.9,符号项主导、分母无关紧要。"
c_f103_turn:
  expr: "cross_max(mul(day_close(div(Amt, FloatCap)), ts_min(pow_3(day_durbin_watson(cross_semistd_neg(Amt, 30))), 1)), 5)"
  why: "F103 独立升级版里的成交额水平(收盘那一分钟的成交额)换成换手率,后面的下行半标准差本来就是无量纲的。预期买低,净超额从 +12.4% 掉到 +3~+6%;若掉得不多,F103 的内容在 DW 那一项而不在水平里。"
c_f103_turn_twin:
  expr: "cross_max(mul(day_close(Amt), ts_min(pow_3(day_durbin_watson(cross_semistd_neg(Amt, 30))), 1)), 5)"
  why: "孪生:F103 独立升级版原式。"
c_f105v_turn:
  expr: "cross_tail_mean_q75(day_var(div(Amt, FloatCap)), 30)"
  why: "F105 在已知族里的升级版(成交额方差的 30 日上尾均值:最热闹的四分之一日子有多热闹)换成换手率写法。预期买低,净超额 +4~+8%、高于均值版 c_dturn30;若不高,上尾的优势来自大票的放量日。"
c_f105v_turn_twin:
  expr: "cross_tail_mean_q75(day_var(Amt), 30)"
  why: "孪生:成交额方差的 30 日上尾均值(不带冻结筛子)。"
c_f106_turn:
  expr: "sub(cs_rank(neg(cross_mean(day_zero_ratio(Ret), 30))), cs_rank(cross_mean(div(day_sum(Amt), FloatCap), 30)))"
  why: "F106 独立升级版的第二项(不拥挤)从成交额换成换手率:买不钉在一个价位上、换手率又低的 —— 成交额写法里「不拥挤」其实是小而清淡。预期买高,净超额从 +12.1% 降到 +2~+5%;若降到 0 以下,F106 没有自己的内容。"
c_f106_turn_twin:
