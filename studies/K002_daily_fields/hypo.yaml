d_vollim20_twin:
  expr: "cross_stddev(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), 20)"
  why: "孪生:不归一的 20 日波动率。"
d_vol_board:
  expr: "cs_regres(cross_stddev(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), 20), LimitWidth)"
  why: "另一种板块中性:波动率减本板(10% / 20%)的截面均值 —— 键只有两个取值时,回归残差恰好是组内去均值。预期买低,净超额介于 d_vollim20 与其孪生之间;若三条读数一样,板块在波动率因子里不重要。"
d_amplim20:
  expr: "cross_mean(div(sub(div(day_max(High), day_min(Low)), 1), LimitWidth), 20)"
  why: "日内振幅 ÷ 涨跌幅宽度的 20 日均值:振幅大 = 日内博弈激烈、散户参与多。预期买低,净超额 +3~+6%;若孪生(不归一)更好,20% 板的大振幅本身该躲(与 a_board 对账)。"
d_amplim20_twin:
  expr: "cross_mean(sub(div(day_max(High), day_min(Low)), 1), 20)"
  why: "孪生:不归一的日内振幅。"
d_turn_board:
  expr: "cs_regres(cross_mean(log(div(day_sum(Amt), FloatCap)), 20), LimitWidth)"
  why: "换手率的板块中性:log 换手率的 20 日均值减本板均值(孪生是 c_logturn20,不另列);若 20% 板的票换手率普遍更高(预期如此,未实测),全市场的低换手排序会把它们整体排除。预期买低,净超额与 c_logturn20 相差 ±2 个点;差 4 个点以上说明低换手的多头腿里有一块是少持 20% 板。"
d_smb_in_size:
  expr: "cs_bucket_rank(sub(cross_mean(mul(sub(cs_mean(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1)), div(cs_sum(mul(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), FloatCap)), cs_sum(add(mul(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), 0), FloatCap)))), sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1)), 60), mul(cross_mean(sub(cs_mean(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1)), div(cs_sum(mul(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), FloatCap)), cs_sum(add(mul(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), 0), FloatCap)))), 60), cross_mean(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), 60))), LogFloatCap)"
  why: "与「等权减流通市值加权」市场收益的 60 日协方差(分母是同一条市场序列的方差,截面上与 beta 同序),在市值档内排名:同样大小的票里走势更像小票的,暴露在同一批小微盘资金的流向里。预期买高,净超额 +1~+4%;若为 0,风格 beta 没有市值之外的信息。"
d_smb_in_size_twin:
  expr: "cs_bucket_rank(sub(cross_mean(mul(cs_mean(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1)), sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1)), 60), mul(cross_mean(cs_mean(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1)), 60), cross_mean(sub(div(day_last(Close), ts_delay(day_last(Close), 1)), 1), 60))), LogFloatCap)"
