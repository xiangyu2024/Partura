e_xmicro05:
  expr: "cs_last_low05(neg(cross_mean(day_std(Amt), 30)), LogFloatCap)"
  why: "已知族,把流通市值最小的 5% 排到最后(方向锁定):这一撮是壳和退市候选的集中地,容量也最小。样本内小票是大年,预期净超额比已知族低 0~2 个点、最大回撤更浅;若净超额不降反升,已知族的超额不在最小的票里。"
e_xmicro10:
  expr: "cs_last_low10(neg(cross_mean(day_std(Amt), 30)), LogFloatCap)"
  why: "同上,剔最小 10%:已知族与小市值秩相关 +0.60,多头书预期集中在最小几档(占比需要实测)。预期净超额比已知族低 1~3 个点、与 a_size 的秩相关下降;若比 e_xmicro05 的回撤没有更浅,该躲的只是最小的一撮。"
e_xmicro10_twin:
  expr: "cs_last_low10(neg(cross_mean(day_std(Amt), 30)), cross_mean(day_sum(Amt), 30))"
  why: "孪生:没有市值时只能剔 30 日成交额最低的 10% —— 那是已知族自己最想买的票(指引 E3)。预期净超额比已知族低 5 个点以上;与 e_xmicro10 的成对差 = 把「小」和「清淡」分开之后的差别。"
e_xmicro20:
  expr: "cs_last_low20(neg(cross_mean(day_std(Amt), 30)), LogFloatCap)"
  why: "同上,剔最小两成(K001 的经验:垃圾尾巴约占两成)。预期净超额比已知族低 3~6 个点;若不降,已知族「就是市值」的说法不成立。"
e_xmicro10_tcap:
  expr: "cs_last_low10(neg(cross_mean(day_std(Amt), 30)), LogTotalCap)"
  why: "换键 总市值最小的 10%(壳价值和市值退市看的是总市值)。预期与 e_xmicro10 的书重合九成、读数相同;若它更好,该躲的是「公司小」而不是「流通盘小」。"
e_xcap10y:
