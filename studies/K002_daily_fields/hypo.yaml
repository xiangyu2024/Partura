  why: "绝对门槛:流通市值低于 10 亿元(ln = 20.72)的排到最后;壳价值和退市线是绝对金额,分位数筛子在熊市底部和牛市顶部剔的是完全不同的票。预期熊市年份剔得多、牛市几乎不剔,净超额比已知族低 0~2 个点;若优于剔除量相近的 e_xmicro05,绝对金额才是对的尺度。"
  lock: true
