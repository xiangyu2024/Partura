# F110_ret_fair_log — 第二批假设(主研,批量扫描 s1 之后)
# 口径:多头腿扣 15bp 净超额 + 纯多头夏普;基准 k_known = cross_mean(day_std(Amt), 30)(train/valid +12.6%/+22.3%)
# D = sub(div(day_last(Close), day_first(Open)), 1) = 日内开盘->收盘收益(不含隔夜)

h_cvx_ema15: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), abs_(sub(div(day_last(Close), day_first(Open)), 1))), 15)", why: "A组承重:整棵成交量子树实测是惰性的(abl_E/G/J/K/N/O 全在 -0.3~+0.5%,base -0.2%),把权重换成反转自身的幅度;若此条 >= mem_ema30 的 +5.4%,机器被证明可删"}
h_cvx_ema30: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), abs_(sub(div(day_last(Close), day_first(Open)), 1))), 30)", why: "同上换半衰期:平滑是这条因子唯一真实的杠杆(mem_ema30 gross +7.9% 与 base +7.8% 一致,净额全靠换手 10.5%->3.3%)"}
h_dvol_ema15: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret)), 15)", why: "把 |U-Dn| 换成最朴素的当日分钟波动:检验「按当天波动尺度加权」这个机制读法,与机器无关"}
h_dvol_ema30: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret)), 30)", why: "同上更长平滑;若与 h_dvol_ema15 成平台,说明尺度项真实而非噪声"}
h_dvol_dec30: {expr: "cross_decay_linear(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret)), 30)", why: "盒式衰减 vs EMA:mem_decay_linear60 gross +8.3% 是记忆族里最高的,换核可能再省换手"}
h_d_ema30: {expr: "cross_ema(div(day_last(Close), day_first(Open)), 30)", why: "对照组:完全不乘尺度,只有平滑后的日内反转。A/B 组任何一条若赢不过它,说明尺度项(含原机器)全是装饰"}
h_cube_ema30: {expr: "cross_ema(pow_3(sub(div(day_last(Close), day_first(Open)), 1)), 30)", why: "凸化的极端版:LS 夏普 2.76、底腿 -43% 说明信息集中在尾部,pow_3 把权重再往尾部推,检验是否单调"}
h_px_vol_ema30: {expr: "cross_ema(mul(day_last(Close), day_std(Ret)), 30)", why: "abl_C(删掉 div)= 价格水平×S 跳到 +4.4%/Lshp+0.56,iso_A(低价)+6.0% 是全表最好的 isolate ⇒ div 扔掉的价格水平才是多头腿的来源;这里换成显式尺度"}
h_px_cvx_ema30: {expr: "cross_ema(mul(day_last(Close), abs_(sub(div(day_last(Close), day_first(Open)), 1))), 30)", why: "价格水平 × 当日波动幅度:把 abl_C/only_C_R/sub_C_mul 那一族(+4.3~4.9%)写干净并加平滑"}
h_dvolamt_ema30: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(in_pct(Amt, 1))), 30)", why: "Ret 与成交额变化率同类:leaf_Ret_amtchg 把机器里的 Ret 换成 in_pct(Amt,1) 后 gross 从 +7.8% 升到 +9.3%、rho_o 只 0.41 ⇒ 用量的波动当尺度可能更好"}
h_dgini_ema30: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_gini(Amt)), 30)", why: "有界无尺度的集中度做权重:rk(先排名)把换手从 10.5% 推到 17.3%、净额 -7.3% 证明 base 的低换手是重尾「峰值记忆」;day_gini 不可能重尾"}
h_dcent_ema30: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_centroid(Amt)), 30)", why: "成交发生在一天里的什么位置:原式所有统计量都与分钟顺序无关,day_centroid 是表里从未出现过的那一维信息(尾盘成交驱动的反转更强)"}
h_drelvol_ema30: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), div(day_std(Ret), cs_mean(day_std(Ret)))), 30)", why: "解剖:市场波动高于中位 +5.6% vs 低于中位 -5.9%。若机制是「相对波动」,把尺度除掉当天的市场波动应当把这条时段差抹平而不掉水平"}
h_evt_mean_up: {expr: "day_mean(in_sustain_mean(is_gt(in_logchg(Volume, 1), add(in_mean_full(in_logchg(Volume, 1)), in_stddev_full(in_logchg(Volume, 1)))), Ret, 5))", why: "iso_M/iso_Q(事件后 5 分钟波动)各自 -7.1%/-7.3%,是负因子;但「事件后 5 分钟的平均收益」(有向冲击)从未测过 —— 这是机器唯一还没被否定的读法"}
h_evt_mean_dif: {expr: "sub(day_mean(in_sustain_mean(is_gt(in_logchg(Volume, 1), add(in_mean_full(in_logchg(Volume, 1)), in_stddev_full(in_logchg(Volume, 1)))), Ret, 5)), day_mean(in_sustain_mean(is_lt(in_logchg(Volume, 1), sub(in_mean_full(in_logchg(Volume, 1)), in_stddev_full(in_logchg(Volume, 1)))), Ret, 5)))", why: "放量后的反应 减 缩量后的反应:与原式同构但把 stddev 换成 mean、去掉 abs_(abl_S 只差 2.6 点 ⇒ 符号本来就没被用上)"}
h_evt_mean_amt: {expr: "day_mean(in_sustain_mean(is_gt(in_logchg(Amt, 1), add(in_mean_full(in_logchg(Amt, 1)), in_stddev_full(in_logchg(Amt, 1)))), Ret, 5))", why: "触发器换成成交额的对数变化(同类互换):检验触发用 Volume 还是 Amt 有没有分别(fld_Volume_Amt rho_o 只 0.78,说明不是无差别)"}
h_evt_vol_ratio: {expr: "div(day_mean(in_sustain_stddev(is_gt(sub(log(Volume), in_forward_valid_part(log(Volume))), add(in_mean_full(sub(log(Volume), in_forward_valid_part(log(Volume)))), in_stddev_full(sub(log(Volume), in_forward_valid_part(log(Volume)))))), Ret, 5)), day_std(Ret))", why: "原机器除以当日整体波动 = 「波动是否集中在放量时刻」。所有 nosc_* 变体只换算子不改尺度,这个无尺度化从未测过"}
h_evt_win30: {expr: "mul(sub(div(day_last(Close), day_first(Open)), 1), abs_(sub(day_mean(in_sustain_stddev(is_gt(sub(log(Volume), in_forward_valid_part(log(Volume))), add(in_mean_full(sub(log(Volume), in_forward_valid_part(log(Volume)))), in_stddev_full(sub(log(Volume), in_forward_valid_part(log(Volume)))))), Ret, 30)), day_mean(in_sustain_stddev(is_lt(sub(log(Volume), in_forward_valid_part(log(Volume))), sub(in_mean_full(sub(log(Volume), in_forward_valid_part(log(Volume)))), in_stddev_full(sub(log(Volume), in_forward_valid_part(log(Volume)))))), Ret, 5)))))", why: "L 的窗口 5->30(表里只有 3/5/10/15,全在 ±2 点内无平台):半小时尺度上是否存在网格错过的平台"}
h_sign_amt: {expr: "day_signed_ratio(Ret, Amt)", why: "机器想估的其实是「放量时价格往哪走」;day_signed_ratio(Ret,Amt) 直接给出上涨分钟成交额占比减下跌占比,不需要触发器和阈值"}
h_money_clock: {expr: "sub(day_wmean(Ret, Amt), day_mean(Ret))", why: "资金实际经历的收益 减 按分钟等权的收益:为正说明钱买在了便宜的分钟。表里没有任何量能区分这两种加权"}
h_d_x_sign: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_signed_ratio(Ret, Amt)), 30)", why: "反转 × 净买压:若多头腿来自「跌了而且是被动砸出来的」,这一条应当明显强于 h_dvol_ema30"}
h_posratio_rev: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_pos_ratio(Ret)), 30)", why: "只看方向不看幅度的那一半(上涨分钟占比):与 h_d_x_sign 对照,分清净买压里起作用的是幅度还是分钟数"}
h_liq_w_mul: {expr: "mul(cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret)), 30), cs_rank(cross_mean(day_mean(Amt), 30)))", why: "解剖:段内净超额只有成交额最高 20% 为正(base +1.5%、mem_ema30 +5.0%、decay60 +6.4%),其余四档 -0.1~-2.9%。按流动性秩加权 = 把仓位推到唯一有效的那一段,且保留幅度"}
h_liq_gate_rev: {expr: "mul(cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret)), 30), cs_rank(day_mean(Amt)))", why: "同上但用当日成交额(不带 30 日记忆),刻意降低与已知族 cross_mean(day_std(Amt),30) 的共线性"}
h_liq_bkt: {expr: "cs_bucket_rank(cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret)), 30), cross_mean(day_mean(Amt), 30))", why: "反方向:分桶中性。bk_liq 对原式是 -7.0% 且 dist 0.20 不过门槛,但那是「先排名」的锅(rk 单独 -7.3%);换成新内核再测一次"}
h_liq_res_ema: {expr: "cross_ema(cs_regres(cs_rank(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret))), cs_rank(cross_mean(day_std(Amt), 30))), 30)", why: "未测过的修补:res_known 的多头腿毛超额仍有 +5.3%,是 17.2% 的换手把它做成 -7.7%。排名残差之后再平滑,看毛超额能不能留下来"}
h_base_res_ema: {expr: "cross_ema(cs_regres(cs_rank(mul(sub(div(day_last(Close), day_first(Open)), 1), abs_(sub(day_mean(in_sustain_stddev(is_gt(sub(log(Volume), in_forward_valid_part(log(Volume))), add(in_mean_full(sub(log(Volume), in_forward_valid_part(log(Volume)))), in_stddev_full(sub(log(Volume), in_forward_valid_part(log(Volume)))))), Ret, 5)), day_mean(in_sustain_stddev(is_lt(sub(log(Volume), in_forward_valid_part(log(Volume))), sub(in_mean_full(sub(log(Volume), in_forward_valid_part(log(Volume)))), in_stddev_full(sub(log(Volume), in_forward_valid_part(log(Volume)))))), Ret, 5)))))), cs_rank(cross_mean(day_std(Amt), 30))), 30)", why: "同一修补直接作用在原式上:这是「相对已知成交额族有没有增量」唯一还没被成本污染的测法"}
h_flat_alone: {expr: "cross_ema(day_flat_ratio(Close), 30)", why: "解剖:近 15 日有冻结盘口的 6.5% 股票里,段内净超额 base +19.2%、mem +19.7~24.2%,而已知族 -10.9%。先问:这 +19% 是不是「冻结盘口」本身就能拿到"}
h_flat_x_rev: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_flat_ratio(Close)), 30)", why: "反转 × 盘口冻结程度:若 +19% 来自「封板已经松动多少」,加权后全市场多头书应当开始超配这一段(现在只超配 +1.3%)"}
h_unfroz_x_rev: {expr: "cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), sub(1, day_flat_ratio(Close))), 30)", why: "反向权重对照:分清是「越冻结越有信息」还是「越有真实成交越有信息」"}
h_flat_bkt: {expr: "cs_bucket_rank(cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret)), 30), day_flat_ratio(Close))", why: "对冻结状态分桶中性:让多头书在各冻结档位持仓相同,从而把段内 +19% 变成全市场可拿的东西"}
h_flat_tilt: {expr: "add(cs_rank(cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret)), 30)), cs_rank(day_flat_ratio(Close)))", why: "显式往已知族失效的那一段倾斜:已知族在该段 -10.9%,这是 rho_k 0.35 之外最可能的增量来源"}
h_px_bkt: {expr: "cs_bucket_rank(cross_ema(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret)), 30), day_last(Close))", why: "解剖:科创板段内 -10.6%(mem -11.0%)而全市场多头书超配它 +11.4%。没有板块字段,价格水平是最接近的代理;按价格分桶中性应当把这个倒贴抹掉"}
h_masktop_ema: {expr: "cross_ema(cs_mask_top_replace_mean(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret))), 30)", why: "LS 夏普 2.76 / 底腿 -43.3% ⇒ 钱在空头腿的极端值里,纯多头拿不到。把截面顶部尾巴换成均值 = 只保留多头能用的那一半"}
h_base_masktop: {expr: "cross_ema(cs_mask_top_replace_mean(mul(sub(div(day_last(Close), day_first(Open)), 1), abs_(sub(day_mean(in_sustain_stddev(is_gt(sub(log(Volume), in_forward_valid_part(log(Volume))), add(in_mean_full(sub(log(Volume), in_forward_valid_part(log(Volume)))), in_stddev_full(sub(log(Volume), in_forward_valid_part(log(Volume)))))), Ret, 5)), day_mean(in_sustain_stddev(is_lt(sub(log(Volume), in_forward_valid_part(log(Volume))), sub(in_mean_full(sub(log(Volume), in_forward_valid_part(log(Volume)))), in_stddev_full(sub(log(Volume), in_forward_valid_part(log(Volume)))))), Ret, 5)))))), 30)", why: "同一手术直接做在原式上:若原式的多头腿为零只是因为尾部被空头占着,这一条应当从 -0.2% 跳到正数"}
h_winsor_ema: {expr: "cross_ema(cs_winsor(mul(sub(div(day_last(Close), day_first(Open)), 1), day_std(Ret))), 30)", why: "缩尾再平滑:win(原式先缩尾)只有 +1.7% 且换手仍 11.5%,但那是在旧内核上;重尾是不是新内核低换手的来源要单独确认"}
