# F113_nested_tsmax_demean —— 第三批假设(主研 Opus 5,2026-10-05,基于批量扫描 s2 的对账)
#
# s2 的四条定论,这一批就是它们的下一步:
#  (1) 原式自己判完了。+5 是 float32 精度 bug(h_s3~h_s6 去掉它,三段收益与 ρk 逐格不变而 dist 0.22→1.00);
#      abl_J 的 +12.4%/2.38 大头来自 pow_1_5(负数)=NaN 剔掉 57% 的票(全覆盖保号的 h_s1 只剩 +7.6%/1.07);
#      而「有信息」那段(h_s4 +8.0%/1.17、ρk +0.46)在成交额桶内中性后掉到 +1.8%/0.25 ⇒ 它 3/4 的力度
#      就是成交额分档本身。→ 不再扫原式的窗口/记忆/算子,只问最后一件没查的事:把 cs_demean 的**中心**
#      从「全市场均值」换成「同活跃度桶内的均值 / 稳健中心」,剩下的还有没有东西(组 B)。
#  (2) 全表唯一意外地好的是 h_g6_gini_bk_amt = cs_bucket_rank(cross_mean(day_gini(Ret),30),
#      cross_mean(day_sum(Amt),30)):+8.4/+7.1/+8.1%、Lshp 2.12/1.69/2.00、LTO 1.8%、ρo +0.08、**ρk +0.05**、
#      cov 1.00 dist 1.00。而它的分子单独(h_g4_gini_level)是 −3.3/+3.8/−1.3% / Lshp −0.19 ⇒ **起作用的是
#      「在同活跃度的同类里比日内集中度」这个动作,不是 gini 的水平**。→ 把它周围的最小子结构换一圈(组 A)。
#  (3) 它与已知族几乎正交(ρk 0.05)却从来没被叠到已知族上:s2 的 h_k2 叠的是**弱分子** h_g4(单独 −1.3%)
#      都拿到 +17.2%/2.66(k_known +15.4%/2.22)。把正交的强分子换上去是本研究唯一还可能产出真增量的动作,
#      而且必须对 k_known_xfrozen(+18.5%/**3.15**)而不是 k_known 交账(组 G)。
#  (4) 被 s2 否定、这一批不再碰:秩距离 h_r1~h_r3(≤+2.9%、valid 全负);手写择时 h_q4/h_q5(≈0 且 LTO 翻到
#      7.3–7.6%);有界叶子族 h_b1~h_b3/h_v4/h_v5(全负 ⇒「有界⇒双层折叠无害」这条推论是错的);
#      gini 的简化/记忆族 h_g3(−10.6%)/h_g2/h_g5/h_g7/h_m1~h_m3(全塌);本因子当筛子 scr_xhi_*
#      (+15.2%/2.24 = 与 k_known 逐格打平,远不及通用 xfrozen 筛);cs_flip_by_state(解剖已显示 h_g6
#      在上涨 +6.3%/下跌 +10.0%、放量 +8.5%/缩量 +7.7% 两种状态都为正,翻转版必然更差,不值一个名额)。
#
# 算子按**函数定义**用(本轮逐个读过 ops_ext.py 源码):
#   cs_bucket_rank(y,x) 在 x 的十分位内取 y 的分位(扔掉量纲,带 1e-4·全局秩破并列);
#   cs_bucket_demean(y,x) 保量纲地在桶内去均值;cs_bucket_zscore 再除桶内**总体**标准差;
#   cs_robust_z(x) = (x−median)/(1.4826·MAD+EPS);cross_madz(x,d) 是它的日轴版(MAD=0 时 NaN);
#   day_gini(x) 用 |x|,有界 [0,1] 无尺度;day_wstd(x,w)/day_topw_mean(y,w) 按 |w| 加权(后者取 |w| 最大的 10% 分钟);
#   day_es_ratio_hi(x) 在 95% 分位≈0 时返回 **NaN**(不是手写 erm_* 的 +1e-6);day_at_max_ratio(Close) 封涨停读≈1;
#   day_distinct_ratio(x) = 当日不同取值数 / 有限分钟数;in_zscore_expand 是日内**扩张窗口**(因果)z 分数;
#   cross_flat_ratio(x,d) 数「与前一日完全相同」的日子占比(日轴停牌度);cross_age 不饱和(数据起点就有值的从 10000 起);
#   cs_state_rank(x,d) 是逐日常数(当两条信号之间的权重用);cross_semistd_neg(x,d) 只留下行的日度对数变化半标准差。
#
# **方向约定(本轮从源码订正,很重要)**:cs_last_high20(y,x) 把 x 最高 20% 放在所有人**下面**,
#   cs_first_high40(y,x) 把 x 最高 40% 放在所有人**上面** —— 只有当「多头腿取最高值」(即 y 已经摆成
#   多头在高端)时它们才是「排除 / 只在这一段里选」。s2 里 seg_lowliq_m 与 seg_hiliq_p 的 ρo(+0.42)、
#   ρk(+0.72)、Lshp(2.09 / 1.98)几乎相同 —— 因为 sg 是在 train 上拟合的,段标签相反而交易是同一笔。
#   所以下面凡是 sg 应为 −1 的信号(h_g6、h_s3 一族)进筛子前都显式 neg(),让期望的 sg = +1。

# ---- A. h_g6 周围的最小子结构:换桶内算子 / 换桶变量 / 换分子 / 换窗口(12 条)
h3_g6_bdemean:    {expr: "cs_bucket_demean(cross_mean(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30))", why: "h_g6 用桶内**排名**(扔掉量纲);gini 本身有界 [0,1],量纲可能有用。这条与 h_g6 只差「是否扔掉量纲」,是分离「桶内比较」与「秩变换」的最小一步"}
h3_g6_bz:         {expr: "cs_bucket_zscore(cross_mean(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30))", why: "h_k1(桶变量换成 day_std(Amt))valid 从 +7.1 掉到 +2.8、Lshp 1.69→0.56,说明桶的离散度很敏感;除以桶内标准差后各桶的距离才可比。与 h3_g6_bdemean 的差就是「标度」这一步值多少"}
h3_g6_fold:       {expr: "abs_(cs_bucket_zscore(cross_mean(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30)))", why: "原式的核心想法是「离截面典型值多远」,它用错了中心(全市场均值被当日极端票拉动)和标度(平方一个不可比的距离)。这条把同一个折叠搬到正确的中心+标度上:若 ≥ h_g6,则原式想法对、实现错;若明显更差(预期),则折叠本身就是损害,而这是对原式 12 层结构的最终裁决"}
h3_g6_bk_age:     {expr: "cs_bucket_rank(cross_mean(day_gini(Ret), 30), cross_age(day_sum(Amt)))", why: "解剖:h_k2 在「上市不足 250 日」段内 +22.7%(全市场 +17.2%)、h_g6 +13.5%(全市场 +8.1%),而 nosc_A_day_gini 在那一段是 +17.9% —— gini 一族的钱明显偏在次新。cross_valid_count 会在窗口处饱和,cross_age 不饱和:直接检验「同期上市的同类里比集中度」是不是比「同活跃度的同类」更强的中性维度"}
h3_g6_hiliq:      {expr: "cs_first_high40(neg(cs_bucket_rank(cross_mean(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30))), cross_mean(day_sum(Amt), 30))", why: "h_g6 已经桶内中性,但段内读数在成交额五档上仍单调上升(+1.3/+0.3/+2.9/+10.5/+14.3%)而多头书在最高档只超配 +1.9pp。把书显式搬进高成交额的 40%(neg 让多头在高端,期望 sg=+1),看这段内优势是真的还是分档噪声"}
h3_g6_w5:         {expr: "cs_bucket_rank(cross_mean(day_gini(Ret), 5), cross_mean(day_sum(Amt), 30))", why: "h_g6 的半衰期落在 20 日、LTO 只有 1.8%,是条很慢的信号;原式的 mem_* 28 条全塌但那是在坏分子上。分子窗口 30→5 给出这条新信号的记忆长度梯度:若 5 日版同分,它用的是「当下的集中度」而不是「一个月的习惯」,换手与容量的结论都要改"}
h3_g6_distinct:   {expr: "cs_bucket_rank(cross_mean(day_distinct_ratio(Close), 30), cross_mean(day_sum(Amt), 30))", why: "gini 的推断机制是「日内行为稳定 / 报价稀疏」;day_distinct_ratio 是同一件事的另一口径(当天走过多少个价位,低价票在一个 tick 的格子上很粗)。两条同向 ⇒ 机制是报价粒度;只有 gini 行 ⇒ 机制是波动集中度。这是 h_g6 机制的判别实验"}
h3_g6_wstd:       {expr: "cs_bucket_rank(cross_mean(day_wstd(Ret, Amt), 30), cross_mean(day_sum(Amt), 30))", why: "day_mean(Ret) 等权含没成交的分钟(Ret=0 也算一票),这是原式叶子的已知缺陷;day_wstd(Ret,Amt) 是「资金经历的波动」,且直接对标 k_known 的 day_std(Amt) —— 在成交额桶内它应当把 k_known 的那部分剥掉只留波动。若它也到 Lshp ~2,h_g6 的功劳要归给「桶内比较」而不是 gini"}
h3_g6_topw:       {expr: "cs_bucket_rank(cross_mean(day_topw_mean(Ret, Amt), 30), cross_mean(day_sum(Amt), 30))", why: "一个节点完成「放量分钟的平均收益」(不用触发掩码)。若它在桶内也有 Lshp ~2,说明 h_g6 读到的不是集中度而是「大单那几分钟赚不赚」;若为零,排除这个解释。这是 s2 里完全没有对照的一维"}
h3_g6_eshi:       {expr: "cs_bucket_rank(cross_mean(day_es_ratio_hi(Ret), 30), cross_mean(day_sum(Amt), 30))", why: "gini 测集中度、es_ratio_hi 测右尾厚度,两者都说「脉冲」但口径不同;而且 day_es_ratio_hi 在分位≈0 时返回 NaN 而不是 1e-6,所以这是第一次能干净地读尾部形状而不是「有没有封板日」—— 正好对上 h_f3(冻结度桶内中性把 gini 从 +6.3%/1.44 打到 −1.3%/−0.17)留下的疑问"}
h3_g6_volchg:     {expr: "cs_bucket_rank(cross_mean(day_gini(in_pct(Volume, 1)), 30), cross_mean(day_sum(Amt), 30))", why: "h_v1_gini_volchg 是 +7.7/+18.5/+10.8% / Lshp 1.33 但 ρk **+0.75**(四分之三是已知族)。桶内中性正是把 h_g4 从 −1.3% 救成 +8.1% 的那个动作;这里检验它能不能同样把 h_v1 的已知族成分剥掉(目标:分数保住而 ρk 掉到 0.1 以内)"}
h3_g6_inz:        {expr: "cs_bucket_rank(cross_mean(day_gini(in_zscore_expand(Ret)), 30), cross_mean(day_sum(Amt), 30))", why: "day_gini 作用在原始收益上,混了「这只票本来波动多大」;in_zscore_expand 先按当天到目前为止做日内因果标准化,剩下的纯粹是「异常分钟有多集中」。若明显优于 h_g6,机制定为异常集中度而非波动水平"}

# ---- B. 把 cs_demean 的中心换成桶内中心 / 稳健中心:原式唯一还没查的那件事(3 条)
h3_tree_bdemean:  {expr: "pow_2(ts_max(cs_bucket_demean(ts_max(day_mean(Ret), 5), cross_mean(day_sum(Amt), 30)), 30))", why: "h_s4(原式去 +5、去第二层后的最小有信息形)+8.0%/1.17 但 ρk +0.46,而 h_q1 把它桶内排名后掉到 +1.8%/0.25 —— 到底是「信息=成交额分档」还是「全市场均值这个中心错了」?把内层 cs_demean 换成桶内去均值一次分开:分数保住而 ρk 掉 ⇒ 中心错(这棵树有自己的东西);分数掉光 ⇒ 信息就是分档,原式结案"}
h3_tree_bz:       {expr: "pow_2(ts_max(cs_bucket_zscore(ts_max(day_mean(Ret), 5), cross_mean(day_sum(Amt), 30)), 30))", why: "各活跃度桶的日内平均收益离散度差数倍,去均值后的「距离」仍不可比,而下一层 pow_2 直接平方这个不可比的距离(这是原式 12 层里最可疑的一步)。除以桶内标准差是折叠前必须补的一步;与 h3_tree_bdemean 的差单独度量「标度」值多少"}
h3_tree_robustz:  {expr: "pow_2(ts_max(cs_robust_z(ts_max(day_mean(Ret), 5)), 30))", why: "h_q3(div by cs_median)valid −11.1%、ut +0.2% 崩了,但那是**比值**写法(分母过零);cs_robust_z 是同一想法的标准化写法。这条分清「稳健中心不管用」和「比值写法本身会炸」—— 后者是可迁移的工程结论,不该被记成前者"}

# ---- C. 把 abl_J 的隐式 universe 筛显式写出来(1 条)
h3_jscreen:       {expr: "cs_last_low40(neg(ts_max(cs_demean(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20)), 30)), ts_max(cs_demean(ts_max(pow_2(ts_max(cs_demean(ts_max(day_mean(Ret), 5)), 30)), 20)), 30))", why: "s2 唯一还没定论的大数字:abl_J 的 +13.1/+10.5%、Lshp 2.38 爆 cov 0.43,被 NaN 掉的 57% 恰好是 K<0 的票(「53 日极端幅度一直低于截面典型值」),而全覆盖保号的 h_s1 只有 +7.6%/1.07。这条把那个筛显式写出来:y = neg(K)(多头取 K 最低,= abl_J 的方向,期望 sg=+1),x = K,cs_last_low40 把 K 最低 40% 推到书底、不产生 NaN 也不产生并列。若跳回 ~+12%/2.4,abl_J 的优势是**可实现的 universe 选择**而不是假象;若停在 ~+7.6%,cov 0.43 定为假象"}

# ---- D. 稳健标准化救 cross_zscore:一个可迁移的检验(3 条)
h3_gini_madz:     {expr: "cross_madz(day_gini(Ret), 30)", why: "h_g5_gini_z = cross_zscore(day_gini(Ret),30) 是 −23.6/−13.5/−20.7% / Lshp −3.80 / LTO 12.1%(全表倒数),h_b5_centroid_z 同样 −31.7% / LTO 16.1%,而同叶子的水平版 h_g4 / h_b3 只有 −1.3 / −2.7% —— 日度 z 分数被一个尖峰拖着走、换手爆掉。cross_madz 是中位数/MAD 版:若回到 ≈0 或正,错在估计量脆;若同样 −20%,「日度 z 分数」这个想法本身不可用。两种结论都可迁移"}
h3_gini_madz_bk:  {expr: "cs_bucket_rank(cross_madz(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30))", why: "若 h3_gini_madz 救回来了,再叠上 h_g6 那个动作(成交额桶内):「相对自己近 30 日是否异常集中」+「在同活跃度的同类里比」。这是 h_g6 的时序版,与 h_g6 的水平版应当低相关 —— 两条都成立才有组合价值"}
h3_gini_semistd:  {expr: "cs_bucket_rank(cross_semistd_neg(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30))", why: "h_g7_gini_stab = cross_stddev(day_gini(Ret),30) 是 −0.7/−13.5/−4.3% / −0.70:「集中度稳不稳」整体没用。但双边标准差把「突然变集中」和「突然变分散」混成一个数;下行半标准差只留后者。若半边有分而整体没分,是一条可迁移的结论(双边统计量会互相抵消)"}

# ---- E. 封板两侧分开 + 日轴停牌筛(3 条)
h3_atmax_tree:    {expr: "pow_2(ts_max(cs_demean(ts_max(day_at_max_ratio(Close), 5)), 30))", why: "s1 推断「原式是伪装的冻结分钟探测器」被 s2 否定了:整棵树换 day_flat_ratio 叶子的 h_f1 与原式 ρo 只有 **+0.04**(几乎正交),而 h_f1 自己 +5.7%/1.03 远好于原式 +0.7%/0.17。但 day_flat_ratio 把封涨停和封跌停混为一谈。这条用 h_s4 的骨架 + 单侧叶子(封在当日最高价的分钟占比):若 ρo 明显高于 0.04,原式走的是封涨停这一侧;若仍≈0,「探测器」假设彻底作废"}
h3_atmin_bk:      {expr: "cs_bucket_rank(cross_mean(day_at_min_ratio(Close), 30), cross_mean(day_sum(Amt), 30))", why: "与 h3_atmax_tree 配对的另一侧(封在当日最低价),放在已经验证过的 h_g6 骨架里。两侧符号相反 ⇒「封上」与「封下」确实是两种事件(算子就是为此加的);两侧同号 ⇒ 它读到的只是「今天几乎没动」,那 day_at_*_ratio 相对 day_flat_ratio 就没有增量"}
h3_xfrozen_flat:  {expr: "cs_last_high20(neg(cs_bucket_rank(cross_mean(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30))), cross_flat_ratio(day_close(Close), 15))", why: "h_g6 在「近 15 日有冻结盘口」段内是 −13.6%(全市场 +8.1%),那 6.5% 的票是它唯一亏钱的地方。通用筛 k_known_xfrozen 用 cross_max(day_zero_ratio(Ret),15)(分钟轴);cross_flat_ratio(day_close(Close),15) 是日轴版(与前一日收盘完全相同的日子占比),专抓停牌和一字板。neg 让多头在高端(期望 sg=+1)才真是排除 —— 哪个口径更干净是可迁移的"}

# ---- F. 市场状态写进表达式:替代 h_q4/h_q5 的手写择时(1 条)
h3_state_mix:     {expr: "add(mul(cs_state_rank(day_sum(Amt), 30), cs_rank(cross_mean(day_std(Amt), 30))), mul(sub(1, cs_state_rank(day_sum(Amt), 30)), cs_rank(cs_bucket_rank(cross_mean(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30)))))", why: "解剖:k_known 放量 +19.9% / 缩量 +11.8%(很敏感),h_g6 放量 +8.5% / 缩量 +7.7%(不敏感)⇒ 市场放量时该押已知族、缩量时该押 h_g6。h_q4/h_q5 用 mul(signal, 市场均值) 的手写法既无效(−0.4 / −0.1%)又把 LTO 从 3~4% 翻到 7.3–7.6%;cs_state_rank 是逐日常数,当两条信号之间的权重用不该抬换手 —— 这是对那次失败的正确写法,也是对该算子的首个基准读数"}

# ---- G. 唯一可能的真增量:把正交的强分子叠到已知族上(2 条)
h3_ov_g6_025:     {expr: "add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(cs_bucket_rank(cross_mean(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30))), 0.25))", why: "s2 最大的遗漏:h_k2 叠的是 h_g4(单独 −3.3/+3.8/−1.3%、Lshp −0.19),都拿到 +14.6/+23.9/+17.2% / 2.66,比 k_known(+15.4%/2.22)高 +1.8pp / +0.44 夏普 —— 但分子本身是负的,那更像秩相加的平滑。h_g6 是同一族里**单独为正且与已知族正交**的分子(+8.1%/2.00、ρk +0.05),权重照 ov_p025 / h_k2 的 0.25 不变,两条只差分子。若明显超过 h_k2,增量是真的;若打平,证实「叠加的收益来自平滑而不是分子的信息」—— 这是对整个 overlay 口径的可迁移结论"}
h3_ov_g6_xfrozen: {expr: "cs_last_high20(neg(add(cs_rank(cross_mean(day_std(Amt), 30)), mul(cs_rank(cs_bucket_rank(cross_mean(day_gini(Ret), 30), cross_mean(day_sum(Amt), 30))), 0.25))), cross_max(day_zero_ratio(Ret), 15))", why: "交账必须对**通用筛子基准** k_known_xfrozen(+16.4/+23.2/+18.5%、Lshp 2.81/3.98/**3.15**)而不是 k_known:s2 里 h_k2 的 +17.2%/2.66 看着赢了 k_known,其实输给 xfrozen 筛 1.3pp / 0.49 夏普。这条把同样的 gini 叠加放进 xfrozen 筛内(先叠加得到「低=好」,neg 后多头在高端,再把近 15 日冻结最重的 20% 排除,期望 sg=+1)。只有它超过 +18.5% / 3.15,本研究才算产出了真增量;否则定论为「本因子族对已知成交额族无增量」"}
