# F106_erm_mag_gap_1m 第三批假设(主研第 6 轮;只凭 train / valid 的 s2 对账,没有读测试段)
# 两类:(a) 上一轮想写而没有算子的,现在用第四批新算子写出来;(b) s2 结果直接指向的下一步最小子结构替换。
h3_atmax_c30: {expr: "cross_mean(day_at_max_ratio(Close), 30)", why: "s2 否定了 R2(h_flatdiff_m30 用 day_flat_ratio(Close) 减 day_flat_ratio(Amt),−1.4% / +8.9%、空头腿只有 +0.2%)。day_flat_ratio 分不开封顶与封底,day_at_max_ratio 只读「价钉在当日最高」= 涨停封板的直读;检验 v_base 的空头腿 +27.9% 到底是不是封顶事件"}
h3_atmin_c30: {expr: "cross_mean(day_at_min_ratio(Close), 30)", why: "封底(跌停 / 一字跌停)的同一口径对照。原式 sg=−1 的多头腿买的是下跌侧塌缩 = 刚封过涨停的票,所以两端必须分开量;day_zero_ratio 把两种相反的事件加在一起(h_zero_m30 −4.8% / +8.4%、空头腿 −1.4%,正是互相抵消的样子)"}
h3_lockdir_c30: {expr: "cross_mean(sub(day_at_max_ratio(Close), day_at_min_ratio(Close)), 30)", why: "带符号的封板强度,不用 sign()。h_pin_dir30(day_zero_ratio 乘 sign(day_sum(Ret)))是本轮唯一 ρk 0.00、两段同号为正(+1.8% / +7.6%、Lshp 0.32 / 1.40、换手 2.9%)的本因子式读数;它的方向是用全天收益符号近似的,这条用封顶占比减封底占比直接读,检验 +1.8% 能不能变实"}
h3_lock_withvol30: {expr: "cross_mean(mul(day_at_max_ratio(Close), sub(create_like(day_zero_ratio(Amt), 1.0), day_zero_ratio(Amt))), 30)", why: "R2 想做而没做成的机制分裂的正确写法:封在最高价、同时还有成交的分钟占比 = 封板排队(有人想买进不去);价封顶而成交额全零 = 停牌 / 无成交。解剖里 6.5% 冻结段段内 +18.2% 若只来自前者,这条应当保住它,而 h_flatdiff_m30 保不住"}
h3_esr_gap: {expr: "sub(day_es_ratio_hi(Ret), day_es_ratio_lo(Ret))", why: "原式去掉两个 eps、把塌缩日留作缺失的唯一写法。abl_G(把塌缩抹成 0)让 LS 从 +2.82 掉到 +0.06,h_es_vol / h_es_mad(换分母)多头腿仍是 −7.0% / −7.2% —— 两者都是给塌缩日填了一个替代值。留 NaN 后 cov 掉多少本身就是读数:它量出塌缩日在全市场占多大比例"}
h3_esr_hi30: {expr: "cross_mean(day_es_ratio_hi(Ret), 30)", why: "只留右尾形状、塌缩日缺失、再做 30 日均。s1 已证两条腿严格镜像(abl_N 与 sub_X_add 逐行相同),所以去掉 eps 之后单腿应当与差值同一条因子;若不是,说明镜像性本身是 eps 造出来的"}
h3_posmin60: {expr: "cross_mean(day_pos_ratio(Ret), 60)", why: "承重是塌缩日的频率而不是单日幅度:h_q90(门槛放到 0.90 / 0.10,塌缩条件从上涨分钟 ≤12 放到 ≤24)LS 升到全表最高 +3.37 / +2.61,h_q99 掉到 +1.28。上涨分钟占比就是那个条件的连续、有界、无 eps 的直读(塌缩等价于它 ≤ 0.0498),60 日均给它与 EMA20 可比的记忆"}
h3_distinct_c30: {expr: "cross_mean(day_distinct_ratio(Close), 30)", why: "把「价格网格太粗」和「封板」分开。s1 的探针说低价股在 tick 网格上也会塌缩(2 元股在日波动 0.6% 时 92% 的日子右侧塌缩),而 day_zero_ratio 把网格粗、封板、停牌三件事混成一个数;当天走过几个价位只读网格那一档"}
h3_bkz_X_liq: {expr: "cs_bucket_zscore(sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06)))), cross_mean(day_sum(Amt), 30))", why: "分桶中性有两种写法:丢量纲的桶内排名(h_bk_liq_sm5 −5.8% / −7.7%)和保量纲的桶内 z。X 是混合分布(常规 O(1) 加塌缩 O(1e3~1e5)),在它上面这两种不是同一件事:排名把塌缩日压成相邻,z 保留距离。两者都量一次,才能说分桶中性救不了它"}
h3_bkz_pin_liq: {expr: "cs_bucket_zscore(cross_mean(mul(day_zero_ratio(Ret), sign(day_sum(Ret))), 30), cross_mean(day_sum(Amt), 30))", why: "h_pin_dir30 两段为正、ρk 0.00,但 abl_M 的教训是 ρk 低不等于有增量(它 ρk 0.06 却在成交额五档段内全负、靠超配最低档 +26.2pp)。桶内 z 把流动性倾斜整个剥掉,是判定 h_pin_dir30 的 +1.8% / +7.6% 是段内 alpha 还是倾斜的唯一干净写法"}
h3_bkz_lockdir_liq: {expr: "cs_bucket_zscore(cross_mean(sub(day_at_max_ratio(Close), day_at_min_ratio(Close)), 30), cross_mean(day_sum(Amt), 30))", why: "同一把尺子量封顶减封底。若 h3_lockdir_c30 有读数而桶内版没有,这一族(钉住 / 封板)就全部归为流动性倾斜的改写,可以整族封板"}
h3_bkd_antifat_liq: {expr: "cs_bucket_demean(div(day_mean(abs_(Ret)), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06))), cross_mean(day_sum(Amt), 30))", why: "abl_M 的核心写干净:平均绝对分钟收益除以 5% 分位数的绝对值 = 反尾肥度(删掉下尾掩码后原式下腿就等于它)。abl_M 是 s1 / s2 两轮里唯一两段同号为正的非 overlay 变体(+3.1% / +4.3%、换手 2.4%),但解剖说它是倾斜;桶内去均值保留量纲,直接判它的死活"}
h3_madz_X60: {expr: "cross_madz(sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06)))), 60)", why: "cross_zscore 是全表最差的一族(mem_zscore5 / 10 / 30 / 60 为 −33% / −27% / −20% / −16%,换手 16~36%)。cross_madz 用中位数与 MAD,在混合分布上不会被一个尖峰拖走:若它明显好转,毁掉 z 的是估计量;若一样坏,标准化这个想法不对就成了可迁移结论"}
h3_madz_pin60: {expr: "cross_madz(cross_mean(mul(day_zero_ratio(Ret), sign(day_sum(Ret))), 30), 60)", why: "同一问题在有界量上的对照。s1 推断 cross_zscore 只是不该加在尖峰上、加在有界状态量上才正当,s2 的 h_zero_zs60 否定了它(−15.9% / −3.9%、换手 7.3%);换成稳健估计量能分清「有界也不行」和「只有 MAD 才行」"}
h3_rbz_lockdir30: {expr: "cs_robust_z(cross_mean(sub(day_at_max_ratio(Close), day_at_min_ratio(Close)), 30))", why: "封板占比的截面分布极度右偏(绝大多数票近 0、少数接近 1),cs_rank 把封了 1 分钟和封了 200 分钟压成相邻两档,而本因子的全部内容在极端那一端。cs_robust_z 保留距离又不被尖峰炸掉,是这一族正当的截面标准化"}
h3_xfr_atmax: {expr: "cs_last_high20(neg(cross_mean(day_std(Amt), 30)), cross_max(day_at_max_ratio(Close), 15))", why: "本轮最硬的事实:同一个量硬筛赢软叠加 —— k_known_xfrozen(剔掉近 15 日 day_zero_ratio 最高的 20%)+16.4% / +23.2%、Lshp 2.81 / 3.98,而把同一个量做成 −0.25 权重的 overlay(h_ov_zero_m025)只有 +9.3% / +21.2%。下一步是把筛子口径做对:day_zero_ratio 混了封板 / 停牌 / 低价网格,封在当日最高价只读封顶"}
h3_xfr_atmin: {expr: "cs_last_high20(neg(cross_mean(day_std(Amt), 30)), cross_max(day_at_min_ratio(Close), 15))", why: "机制判别:若只有封顶该剔,剔掉的是刚涨停过、次日买不进且反转的票;若两端都该剔,剔掉的是不可交易这件事本身。这一条与 h3_xfr_atmax 的差值直接回答 k_known_xfrozen 的 +3.8pp 是哪一种"}
h3_xfr_distinct: {expr: "cs_last_high20(neg(cross_mean(day_std(Amt), 30)), neg(cross_mean(day_distinct_ratio(Close), 15)))", why: "第三种筛子口径:剔掉价位走得最少的 20%(tick 网格最粗、最不动的票)。三条筛子(零收益占比 / 封顶 / 价位数)谁最好,就说明已知族的多头腿到底被哪一类票拖累 —— 解剖里它在 6.5% 冻结段段内 −10.9%,而那个段自身等权 −67.4%"}
h3_xfr_zero40: {expr: "cs_last_high40(neg(cross_mean(day_std(Amt), 30)), cross_max(day_zero_ratio(Ret), 15))", why: "筛子口径的档位阶梯(新算子 cs_last_high40):剔 20% 已经把基准从 +12.6% / +22.3% 抬到 +16.4% / +23.2%。剔 40% 继续改善 = 剔的是整条低流动性尾巴(那就只是 k_known 自己的强化);到 40% 变差 = 剔的是一小撮不可交易的票,筛子有真实内容"}
h3_flip_pin_mkt: {expr: "cs_flip_by_state(cross_mean(mul(day_zero_ratio(Ret), sign(day_sum(Ret))), 30), day_sum(Ret))", why: "解剖:v_base 在市场近 20 日上涨段 −7.2%、下跌段 −3.7%(上涨时更差),而 k_known 是 +23.0% / +6.0%。彩票需求应当在市场上涨时更强,所以钉住读数的方向有可能是市场状态的函数。cs_flip_by_state 是检验这件事的最小原语;若 flip 明显差于不 flip,就是只是单向失效而不是反号"}
h3_state_mix_known: {expr: "add(mul(cs_rank(cross_mean(day_std(Amt), 30)), cs_state_rank(day_sum(Amt), 60)), mul(cs_rank(cross_mean(day_at_max_ratio(Close), 30)), sub(create_like(day_sum(Amt), 1.0), cs_state_rank(day_sum(Amt), 60))))", why: "六条 ov_ 加三条新 overlay 全部严格差于基准单独,但它们用的都是固定权重。解剖:k_known 在放量段 +19.9% / 缩量段 +11.8%,在上涨段 +23.0% / 下跌段 +6.0% —— 该用哪条信号可能是全市场状态的函数。用 cs_state_rank(全市场成交额在近 60 日里的分位)当两条信号之间的权重,这是以前写不进表达式的东西"}
h3_topw_ret30: {expr: "cross_mean(day_topw_mean(Ret, Amt), 30)", why: "原式的尾部是按收益自己定义的(自己选自己),所以尾部形状和极端收益分不开。day_topw_mean(Ret, Amt) 按成交额定义尾部、读那些分钟的平均收益,是外生的事件选择,一个节点完成。对照 h_wmean_gap30(全天成交额加权减等权)只有 +0.4% / +2.6%"}
h3_topw_time30: {expr: "cross_mean(day_topw_mean(in_index(Ret), Amt), 30)", why: "钱在一天里什么时候来的。h_centroid_ret30 是本轮唯一 valid 很好而 train 平(−0.9% / +11.1%、换手 1.1%)的顺序类读数,值得换一个更干净的时点度量:成交额最大 10% 分钟的平均时点,封板日应当明显偏早。原式没有任何顺序信息"}
h3_wstd_gap30: {expr: "cross_mean(sub(day_wstd(Ret, Amt), day_std(Ret)), 30)", why: "已知族读的是 day_std(Amt) 的水平。day_wstd(Ret, Amt) 是钱实际经历的波动,减掉等权波动就把有多少分钟是死的这件事单独拿出来 —— 若已知族的内容就是它,这条应当与 k_known 高度相关(ρk 大);若 ρk 小而仍有读数,才是真的新东西"}
h3_age_bkd_pin: {expr: "cs_bucket_demean(cross_mean(mul(day_zero_ratio(Ret), sign(day_sum(Ret))), 30), cross_age(day_last(Close)))", why: "解剖:上市不足 250 日段 v_base −15.0%,而 h_zero_minus_liq 在那里 +28.0%(tilt +7.5%)—— 次新是本因子族里最容易混进来的东西。cross_valid_count 在窗口处饱和、分不开上市 1 年与 5 年,cross_age 不饱和;按上市天数分桶去均值,检验钉住读数是不是只是次新效应"}
