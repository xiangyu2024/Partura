h_tail_vol: {expr: "div(sub(day_quantile(Ret, 0.95), abs_(day_quantile(Ret, 0.05))), add(day_std(Ret), create_like(day_std(Ret), 1e-06)))", why: "§2乙:分位数不对称 ÷ 日内波动,完全没有 ES、也不会塌。若常规区间真的空,这条应在 0 附近"}
h_es_vol: {expr: "div(sub(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06)))), add(day_std(Ret), create_like(day_std(Ret), 1e-06)))", why: "§2乙:保留 ES 不对称,只把两处 VaR 分母换成不会为 0 的 day_std。这是「原式减去塌缩」的最干净写法,对照 abl_G(LS 2.82→0.06)"}
h_es_mad: {expr: "div(sub(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06)))), add(day_median(abs_(Ret)), create_like(day_quantile(Ret, 0.95), 1e-06)))", why: "§2乙的梯度:中位绝对分钟收益只有在 ≥50% 分钟不动时才塌(分位数口径是 ≥95% 单边),用它当尺度能把「真钉住」和「单边日」分开"}
h_eps3: {expr: "sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 0.001))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 0.001))))", why: "§1:两处分位数 eps 1e-6 → 1e-3(约一个 tick)。塌缩读数从 ×10^6 降到 ×10^3,若排序只看「谁塌了」它应与原式几乎同一本书,若靠极端值吃掉 EMA 则应明显不同"}
h_eps2: {expr: "sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 0.01))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 0.01))))", why: "同上的另一档 1e-2:塌缩读数降到 ×10^2,与 h_eps3 一起给出一条 eps 阶梯,量出「排序由塌缩日决定」的强度"}
h_regular_gate: {expr: "mul(sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06)))), mul(is_gt0(day_quantile(Ret, 0.95)), is_lt0(day_quantile(Ret, 0.05))))", why: "§2乙:只在非塌缩日保留 X、塌缩日置 0。这是「常规区间空不空」的直接判决;若它接近 0 收益,§2 的结论就钉死了"}
h_blown_gate: {expr: "mul(sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06)))), add(mul(less(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06)), create_like(day_quantile(Ret, 0.95), 1.0)), mul(less(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06)), create_like(day_quantile(Ret, 0.05), 1.0))))", why: "h_regular_gate 的互补:只保留塌缩日的读数。两条相加等于原式,所以它们把 −5.8% 分解到两个区间上"}
h_logcomp: {expr: "mul(sign(sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06))))), log(add(abs_(sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), add(day_quantile(Ret, 0.95), create_like(day_quantile(Ret, 0.95), 1e-06))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), add(abs_(day_quantile(Ret, 0.05)), create_like(day_quantile(Ret, 0.05), 1e-06))))), create_like(day_quantile(Ret, 0.95), 1.0))))", why: "§2丙:cs_rank / cs_winsor(rk −12.9%、win −9.6%)把幅度全抹掉反而更差,log(1+|X|) 是保序但只压缩尾部的中间档,检验「要多少幅度」"}
