h_posneg_eq30: {expr: "cross_mean(day_signed_ratio(Ret, create_like(Ret, 1.0)), 30)", why: "§2甲:day_signed_ratio 的权重取 1 就是「上涨分钟占比 − 下跌分钟占比」,是 X 的符号的有界连续版(塌缩 = 它贴到 ±1)"}
