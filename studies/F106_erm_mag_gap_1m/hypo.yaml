h_q99: {expr: "sub(div(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.99)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.99))), create_like(day_quantile(Ret, 0.99), 1e-06))), add(day_quantile(Ret, 0.99), create_like(day_quantile(Ret, 0.99), 1e-06))), div(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.01)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.01))), create_like(day_quantile(Ret, 0.01), 1e-06))), add(abs_(day_quantile(Ret, 0.01)), create_like(day_quantile(Ret, 0.01), 1e-06))))", why: "同一条阶梯的另一端(≤2 个分钟):塌缩更稀有但更极端。和 h_q90 一起给出「塌缩频率 × 幅度」的两维"}
h_es_ratio: {expr: "div(add(div(day_sum(select_where(is_gt(Ret, day_quantile(Ret, 0.95)), Ret, create_like(Ret, 0))), add(day_sum(is_gt(Ret, day_quantile(Ret, 0.95))), create_like(day_quantile(Ret, 0.95), 1e-06))), create_like(day_quantile(Ret, 0.95), 1e-06)), add(div(day_sum(select_where(is_lt(Ret, day_quantile(Ret, 0.05)), abs_(Ret), create_like(Ret, 0))), add(day_sum(is_lt(Ret, day_quantile(Ret, 0.05))), create_like(day_quantile(Ret, 0.05), 1e-06))), create_like(day_quantile(Ret, 0.05), 1e-06)))", why: "§2甲:sub → div 在已经塌缩的两条腿上试过(sub_X_div ut −14.5%),但在未塌缩的 ES 上没试过。比值是真正无尺度的「不对称」,差值不是"}
