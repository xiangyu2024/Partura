h3_bkz_semistd:
  expr: "cs_bucket_zscore(cross_mean(div(div(sub(day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), sub(day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), 20), cross_semistd_neg(day_last(Close), 30))"
  why: "F+新算子:辛组 —— 它只在高波动市场有效(+10.4% vs −2.2%),且在跌市与已知族互补(原式 涨 +3.1/跌 +5.4%,已知族 涨 +23.0/跌 +6.0%)。cross_semistd_neg 是日度对数变化的下行半标准差,按“个股自己的下行波动”分桶中性化:如果有效性其实来自“谁在跌”,桶内选股力应该明显掉下来"
