  why: "C+新算子:推断“事件越干净越准”(次新段内 +12.4%、冻结盘口段内 +18.2% 都是量峰最尖锐的段)。day_es_ratio_hi(日内量)= 95% 分位以上分钟的均值 ÷ 该分位 = 量峰相对尾部有多突出,且按定义把封板/死盘那种分位≈0 的日子留成 NaN(不像手写 erm_* 加 1e-6 变成 1e4)。剔掉最不尖锐的 20%:若段内 IC 真随事件干净度上升,这条应该比原式好"
h3_scr_grid:
  expr: "cs_last_high20(neg(cross_mean(div(div(sub(day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), sub(day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), 20)), neg(cross_mean(day_distinct_ratio(in_slice(Close, 31, 211)), 15)))"
  why: "C+新算子:原式整棵树只读两个分钟的 Close,价差被价位格子量化。day_distinct_ratio(日内 Close)= 当天走过的不同价位数 ÷ 分钟数,低价票在一个 tick 的格子上很粗。剔掉最粗的 20%,把“低价书漏出来”(iso_G +3.7/+11.4%、LTO 1.2%)和“价差被量化”这两件事分开"
