  why: "F+新算子:丁组的死结 —— 段内选股力在活跃票(成交额五档段内 −1.1/−4.6/−2.0/+2.7/+7.2%),段等权溢价在清淡票(+15.1/+8.9/+2.6/−6.0/−17.8%)。上一轮只能用 cs_bucket_rank(桶内均匀分布),h_bk_amt(= 表里的 bk_liq)+5.4/+0.7% ≈ 原式。cs_bucket_zscore 按桶内标准差归一,各桶离散度差数倍时距离才可比 —— 这条判定“桶内选股力 ≈ 原式”是真结论还是 cs_bucket_rank 把幅度扔掉造成的"
h3_bkz_age:
  expr: "cs_bucket_zscore(cross_mean(div(div(sub(day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), sub(day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), 20), cross_age(day_last(Close)))"
