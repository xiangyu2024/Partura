# F115_all_tide_mean_30 —— 第三批假设(主研,读完批量扫描 s2 的 169 个变体 + 市场解剖之后)
# 对账与结论全在 notes/F115_all_tide_mean_30/synthesis.md 的「第二轮(s2)对账与结论」一节,这里每条只写它在检验什么。
#
# s2 定下来的四件事决定这一批往哪儿打:
#  (1) 290 个变体里真正的改进只有一处,而且位置很具体:分母 M 里那两个 argmin 用未平滑的 Volume 定位
#      —— h_rawvol_divM_only +7.2/+5.3%、Lshp 2.01/1.16、LTO 4.6%、rho_k 0.21,是全表最好的自有版本
#      (原式 +5.6/+0.2%、Lshp 1.21/0.04)。整棵树都去平滑(h_rawvol_all +3.6/+3.6%)反而不行,
#      连带删掉 ÷M(h_pure_raw +4.5/+1.3%)更差 → 不是“少加工就好”,是分母这一处的污染。
#  (2) 对已知族零增量,九种混合全部否定:6 个固定权重 overlay(ut +14.2…−3.6%)、3 个桶内混合
#      (+14.2/+13.5/+12.7%)、3 个状态条件凸组合(+12.5/+12.6/+12.2%),k_known 单独 +15.4%;
#      当筛子也没用(scr_xhi_p +12.3/+22.5% = k_known 的 +12.6/+22.3% 在噪声内),
#      而通用筛子 k_known_xfrozen 是 +16.4/+23.2%、Lshp 2.81/3.98 —— 差距在 4pp / 1.0 夏普以上。
#  (3) 新的硬事实:符号随流动性翻转。活跃 40% 段内原符号 +8.8/+13.6%(seg_hiliq_p),
#      清淡 40% 段内反符号 +9.4/+16.1%(seg_lowliq_m),两段的另一半符号只有 −3.1/+4.7% 和 +1.7/+13.1%。
#  (4) 机制类假设整批否定:把锚点挪到有成交的分钟(B 组,最好 +4.7%)、换成直接的资金方向读数
#      (C 组,最好 h_wmean_ret +4.7%)、按上限/上市天数/冻结盘口中性化(F 组,全部 ≈ 原式)。
#      这些推断上一轮都只能“换个锚点”间接测;现在新算子可以把它们量出来当筛子,这是本批的主体。
#
# 所以这一批:A 围绕 (1) 那一处把最小子结构再换一圈(7 条);B 把 (3) 用 select_where 写成一条
# 全市场因子而不是分段(3 条);C 用 day_at_min_ratio / day_es_ratio_hi / day_distinct_ratio /
# day_at_max_ratio / cross_age 把 (4) 里那些“只能间接测”的机制直接量出来当剔除筛子(5 条);
# D 用 day_topw_mean 一个节点写完整棵树的机制(3 条);E 连续有界量替整数下标 + 去掉 in_local_mean
# 的前视 + 稳健时序标准化(3 条);F 用 cs_bucket_zscore 重做三条被 cs_bucket_rank 糊掉的中性化(3 条)。

