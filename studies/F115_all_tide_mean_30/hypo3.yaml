  why: "C+新算子:s1 推断板块顺序与日涨跌幅上限一致(沪 +3.8/深 +5.0/创业 +2.0/科创 −22.8%),但 h_bk_limit(按近 60 日最大单日涨幅分桶)+4.9/+0.4% ≈ 原式,等于否定了“上限宽度是可中性化的干扰”。day_at_max_ratio(Close)= 封在当日最高价的分钟占比,是真正的“一字板/封板”读数(day_flat_ratio 分不开封涨和封跌)。剔掉近 15 日封顶最重的 20%,换一个更准的代理再问一次"
h3_scr_young_frozen:
  expr: "cs_last_high20(cs_last_high20(neg(cross_mean(div(div(sub(day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), sub(day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), 20)), cross_max(day_zero_ratio(Ret), 15)), neg(cross_age(day_last(Close))))"
  why: "C+新算子:通用筛子基准 k_known_xfrozen(已知族剔掉冻结盘口最重的 20%)把 k_known 从 +12.6/+22.3、Lshp 1.78/3.46 抬到 +16.4/+23.2、2.81/3.98 —— 剔掉不可投的那一撮对纯多头是大钱。原式的两个“段内最强但段等权 −28.7%/−67.4%”的段正是次新和冻结盘口。这条把两撮一起剔:冻结用 day_zero_ratio,上市天数用 cross_age(h_bk_age 用的 cross_valid_count 在 241 日饱和,把次新和老票混在一个桶里,那条 +5.5/+0.6% 的否定结论因此不可信)"
h3_topw_ret:
  expr: "cross_mean(day_topw_mean(in_slice(Ret, 31, 211), in_slice(Volume, 31, 211)), 20)"
  why: "D+新算子:整棵树的机制可以一句话说完 —— “盘中资金事件之后价格往哪儿走”。day_topw_mean(Ret, Volume)= |w| 最大的 10% 分钟上收益的均值,一个节点就写完,不用 argmax/argmin 定位、不用触发掩码。对照 h_wmean_ret(全部分钟按 Amt 加权)+3.9/+6.4%、Lshp 0.82、LTO 2.9%:如果只取最重的十分之一明显更好,说明信息在“放量那几分钟”而不是“整天的资金加权”"
h3_topw_amt:
  expr: "cross_mean(day_topw_mean(in_slice(Ret, 31, 211), in_slice(Amt, 31, 211)), 20)"
  why: "D:同上,权重换成 Amt。与 h3_topw_ret 成对,判定“最重的分钟”该按股数还是按金额定义(s1 里 Volume→Amt 在下标上 rho_o = +0.99,这里是当权重用,未必一样)"
h3_topw_gap:
  expr: "cross_mean(sub(day_topw_mean(in_slice(Ret, 31, 211), in_slice(Amt, 31, 211)), day_wmean(in_slice(Ret, 31, 211), in_slice(Amt, 31, 211))), 20)"
  why: "D:放量分钟的平均收益 减 全天资金加权收益 = 资金有没有往当天趋势的反方向推。这是原式 K = G − J 那一步“把价格水平消掉”的同构写法(s1 证明不消掉就退化成低价书:iso_G/iso_J train≈+3.5、valid +11%、LTO 1.2%),但用的是有成交的分钟"
h3_topw_time:
  expr: "cross_mean(day_topw_mean(in_index(in_slice(Volume, 31, 211)), in_slice(Volume, 31, 211)), 20)"
  why: "E+新算子:整数下标过不了 dist 门槛(iso_D dist 0.05、iso_F 0.04、iso_I 0.04、iso_M 0.05 全 ✗),s1 的 E 组用 day_centroid/day_gini 替代也全否(h_centroid_vol −2.8%、h_gini_vol +2.0% 且 rho_k 0.77 基本就是成交额族)。in_index 给出分钟在一天里的位置 t/(T−1) ∈ [0,1],day_topw_mean(in_index(Volume), Volume)= 最重的 10% 分钟的平均时刻 —— 连续、有界、且是“量峰在什么时候”的稳健版(不是单个 argmax)"
h3_causal_z:
  expr: "cross_mean(div(div(sub(day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_to_end(in_zscore_expand(in_slice(Volume, 31, 211)), day_argmax(in_zscore_expand(in_slice(Volume, 31, 211)))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_zscore_expand(in_slice(Volume, 31, 211)), day_argmax(in_zscore_expand(in_slice(Volume, 31, 211))))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_zscore_expand(in_slice(Volume, 31, 211)), day_argmax(in_zscore_expand(in_slice(Volume, 31, 211))))))), sub(day_argmin(in_slice_to_end(in_zscore_expand(in_slice(Volume, 31, 211)), day_argmax(in_zscore_expand(in_slice(Volume, 31, 211))))), day_argmin(in_slice_from_start(in_zscore_expand(in_slice(Volume, 31, 211)), day_argmax(in_zscore_expand(in_slice(Volume, 31, 211))))))), 20)"
  why: "E+新算子:按算子定义,in_local_mean 的元数据是 lookahead=True(居中 9 分钟均值),这棵树的量峰下标是用“今天后面的量”挑出来的。in_zscore_expand 是日内扩张窗口 z 分数(只用到当前分钟为止),把平滑换成它 = 量峰/量谷改成“相对今天到目前为止最异常的一分钟”,日内因果。两件事一起测:(i) 去掉这层前视会不会把 +6.7% 吃光;(ii) “相对今天为止异常”是不是比“绝对量最大”更好的事件定位"
h3_madz:
  expr: "cross_madz(cross_mean(div(div(sub(day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), day_locate(in_slice(Close, 31, 211), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), sub(day_argmin(in_slice_to_end(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))), day_argmin(in_slice_from_start(in_local_mean(in_slice(Volume, 31, 211), 5), day_argmax(in_local_mean(in_slice(Volume, 31, 211), 5)))))), 20), 60)"
  why: "E+新算子:memory 组里所有 cross_zscore 都是灾难(mem_zscore5/10/30/60 → ut −10.1/−6.9/−2.6/−1.1%、LTO 最高 15.4%),但原式的输出是重尾的(1/M ~ 1e−2 压过 N ~ 1e−4)。cross_madz 是中位数/MAD 的稳健版,正好用来分清“时序标准化这个想法不对”和“均值方差这个估计量太脆”"
h3_bkz_amt:
